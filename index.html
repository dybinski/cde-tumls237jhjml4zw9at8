an (młot w górę, supinacja w dół): high A. Kontrolowany cheat curl: bottom A dla zaawansowanych; strict curl przy ścianie: A.\n\nChin-upy: B - rosną biceps, ale rzadko są limitującym czynnikiem względem izolacji."},{"t":"Werdykt końcowy","d":"**Najlepsze: face-away Bayesian cable curl; bardzo blisko 45° preacher. Najgorsze: waiter curl.** Według autora oba topowe ruchy warto mieć w planie. Zapowiada też badanie cheat vs strict form, którego jeszcze nie ma w literaturze."}],"conclusion":"Nippard stawia na ćwiczenia z wysokim napięciem w rozciągnięciu i prostą progresją, a odrzuca gimmicki bez overloadu. Ranking jest mieszanką badań i osobistych preferencji, z reklamą książki na końcu.","factchecks":[{"claim":"Preacher curl dał większy wzrost dystalnego bicepsa niż incline","verdict":"prawda","note":"Badanie porównujące preacher i incline wskazało większą hipertrofię dystalną przy preacherze.","p":2,"src":[["PubMed: preacher vs incline curl i regionalna hipertrofia","https://pubmed.ncbi.nlm.nih.gov/37490308/"],["Wikipedia (ang.): uginanie bicepsa - hasło \"Biceps curl\"","https://en.wikipedia.org/wiki/Biceps_curl"]]},{"claim":"Brachialis jest mniej więcej wielkości obu głów bicepsa razem","verdict":"półprawda","note":"Brachialis jest dużym zginaczem pod bicepsem, ale porównanie objętości zależy od metody pomiaru.","p":0,"src":[["Wikipedia (ang.): mięsień ramienny - hasło \"Brachialis muscle\"","https://en.wikipedia.org/wiki/Brachialis_muscle"]]},{"claim":"Brak badań porównujących cheat curl ze strict form pod kątem hipertrofii","verdict":"prawda","note":"W literaturze brakuje mocnych RCT cheat vs strict curl; autor zapowiada własne badanie.","p":4,"src":[["Wikipedia (ang.): trening oporowy - hasło \"Strength training\"","https://en.wikipedia.org/wiki/Strength_training"]]},{"claim":"Bayesian face-away curl jest obiektywnie najlepszym ćwiczeniem na biceps","verdict":"przesada","note":"To ranking autora; nie ma konsensusu \"jednego najlepszego\" uginania w nauce o hipertrofii.","p":5,"src":[["Wikipedia (ang.): hipertrofia mięśniowa - hasło \"Muscle hypertrophy\"","https://en.wikipedia.org/wiki/Muscle_hypertrophy"]]}],"bias":"Tier lista oparta o gust i wybrane badania; kończy się reklamą Muscle Ladder i darmowego ebooka przy preorderze."},{"id":"_H5t7k8IZqo","title_pl":"Jacek Dukaj: eksplozja biotech i inżynierii genetycznej","title":"Nadciąga eksplozja inżynierii genetycznej - Jacek Dukaj - didaskalia#93","channel":"didaskalia","url":"https://www.youtube.com/watch?v=_H5t7k8IZqo","date":"2024-09-22","duration":7098,"views":443262,"section":"Didaskalia","transcript":"youtube","added":"2026-11-05","tags":["Nauka","Technika","Historia"],"about":"Pisarz o demografii, AI przyspieszającym genetykę, starości bez śmierci i edukacji poza pracą.","intro":"Patrycjusz Wyżga rozmawia z Jackiem Dukajem o trendach, które mają inercję \"lodowca\": demografii, następnej eksplozji biotech napędzanej AI oraz o tym, jak społeczeństwa uniosą wiek emerytalny bez umierania.\n\nOd Polski mniej ludnej i innej piramidy wieku, przez digitalizację biologii i inwestycje w spółki genetyczne, po arystokrację merytokracji, smartfony dzieci i pytanie, czy demokracja proceduralna nie przeterminowała się wobec tempa technologii.","points":[{"t":"Demografia jak lodowiec","d":"**Trendów o ogromnej inercji nie zawrócisz polityką: Polska będzie mniej ludna i o innej strukturze wieku - dawna piramida staje się wieżą.** Do tego dochodzą zmienne technologiczne.\n\nDukaj stawia pieniądze na kolejną eksplozję: biotechnologię i inżynierię genetyczną mocno napędzaną AI - pierwsze masowe \"cudowne\" środki przedłużania życia, leczenia chorób i kosmetycznej edycji genów."},{"t":"Nawis emerytów, którzy nie umierają","d":"**Wyłączenie mechanizmów starzenia = w 10-15 lat gigantyczny nawis ludzi po \"emeryturze\" z kolejnymi 60-70 latami życia.** Ciężar gospodarczy (opieka, zdrowie) i kulturowy (samotność, sens życia).\n\nUniwersytet Trzeciego Wieku powstał aktywizować dziadków; Dukaj widzi przedpole cywilizacyjne: edukacja nie pod fabrykę/wojsko Bismarcka, lecz pod tworzenie sensu, gdy praca nie jest potrzebna."},{"t":"Wieczna młodość vs +10-15% życia","d":"**Ewangelia Silicon Valley: nie długość życia w łóżku, lecz wieczna sprawność / rozciągnięty średni wiek.** Świadczenia nabyte zostaną - kto wszedł do systemu emerytalnego, ma gwarancje mimo dłuższych lat.\n\nWedług Dukaja środki na lekkie wydłużenie (+10-15%) przyjdą wcześniej niż na \"wieczną młodość\", więc dziura opieki zostaje; model azjatyckich opiekunów na Zachodzie ma limity."},{"t":"Digitalizacja biologii + AI = brut force","d":"**Dekady digitalizacji genetyki: wiedza z labów w modelach komputerowych; dziś miliony wariantów in silico, w realu tylko obiecujące kandydaty.** Taniej i szybciej niż miliony wet testów.\n\nAI jako \"dopalacz\" każdej technologii (Rutkowski o raku; Nobla dla nietypowych dla biologii zespołów algorytmów). Dukaj chce inwestować w spółki praktycznej aplikacji genetyki."},{"t":"Praca opcjonalna nierówno","d":"**Utopia/dystopia \"bez pracy\" już jest, ale nierówno rozłożona (Gibson) - zależy od dochodu i otoczenia tech.** Politycy patrzą 4 lata; think tanki widzą horyzont.\n\nHistoryczny wzorzec warstwy bez pracy: arystokracja - najpierw wojsko, potem zdegenerowane formy statusu. Bez treningu charakteru: dekadencja (Monte Carlo). Elity tech kopiują twardy model wychowawczy."},{"t":"Elity: zero smartfonów, łacina, real","d":"**Najbogatsi: konserwatywna rodzina, zakaz tech do ~12 lat, żywy nauczyciel, tablica, natura, kaligrafia, klasyka, łacina/greka.** Biedni dostają tablet \"dla postępu\"; córka miliardera zostaje w realu, aż osobowość stwardnieje.\n\nJonathan Haidt i zakazy telefonów w szkołach to wąska reakcja w tym samym kierunku. Samotny rodzic nie wygra teorii gier wobec rówieśników z YouTube."},{"t":"Chiny egzekwują, Zachód inercja","d":"**Skuteczny limit gier dla dzieci (np. 2 h) działa w systemie twardym; na Zachodzie trudny do egzekucji bez oskarżeń o totalitaryzm.** Dukaj nie propaguje dyktatury - porównuje konsekwencje ustrojów.\n\nDemokracja proceduralna według niego inercyjna: krytyka = \"faszysta\"; w Chinach argument praktyczny \"próbowaliśmy, nie pasowało\". Fetysz pustego słowa \"demokracja\" gdy inne spoiwa kultury odpadły."},{"t":"Racja stanu i algorytm konstytucji","d":"**Patrzeć na czyny polityków, nie deklaracje 10-20 lat.** Dobre systemy (US, FR, historycznie UK) ustawiają reguły gry tak, że nawet egoiści budują siłę państwa. Konstytucja USA jako zaprojektowany algorytm - stąd kult i wojna o interpretację.\n\nKopiowanie modelu USA nie wszędzie działa (niekompatybilność kulturowa). Meta-decyzja: ruszać algorytm czy nie - obie strony mają silne argumenty; nie ruszać też jest decyzją."}],"conclusion":"Dukaj stawia na biotech+AI jako następną falę po demograficznym lodowcu i pyta, kim jesteśmy, gdy praca i śmierć się oddalają. Edukacja elit w realu kontrastuje z tabletem dla mas. Puenta: reguły gry o władzę ważniejsze niż anielscy politycy.","factchecks":[{"claim":"AI przyspiesza odkrywanie leków i modelowanie białek (AlphaFold i następcy)","verdict":"prawda","note":"AlphaFold i modele generative AI są standardem w structural biology.","p":3,"src":[["Nature: AlphaFold","https://www.nature.com/articles/s41586-021-03819-2"],["Wikipedia (ang.): AlphaFold","https://en.wikipedia.org/wiki/AlphaFold"]]},{"claim":"Jonathan Haidt ostrzega przed smartfonami u nastolatków","verdict":"prawda","note":"\"The Anxious Generation\" i kampanie phone-free schools.","p":5,"src":[["Jonathan Haidt: The Anxious Generation","https://www.anxiousgeneration.com/"],["Wikipedia (ang.): Jonathan Haidt","https://en.wikipedia.org/wiki/Jonathan_Haidt"]]},{"claim":"Chiny limitują czas gier online dla nieletnich","verdict":"prawda","note":"Regulacje NPPA: m.in. limit godzin gier dla minors.","p":6,"src":[["Wikipedia (ang.): Video gaming in China - regulations","https://en.wikipedia.org/wiki/Video_gaming_in_China"],["Reuters: China gaming limits","https://www.reuters.com/world/china/"]]},{"claim":"Prognozy GUS: Polska się wyludnia i starzeje","verdict":"prawda","note":"Projekcje ludności pokazują spadek liczby i wzrost odsetka 65+.","p":0,"src":[["GUS: Prognoza ludności","https://stat.gov.pl/obszary-tematyczne/ludnosc/"],["Eurostat: Population projections","https://ec.europa.eu/eurostat"]]}],"bias":"Dukaj spekuluje literacko i inwestycyjnie (chce kupować biotech). Ton elitarystyczny (arystokracja merytokracji). Brak reklam produktów w treści; Didaskalia mają sponsorów kanału."},{"id":"SgyUoY0IZ7A","title_pl":"Najlepsze i najgorsze ćwiczenia na barki (ranking)","title":"The Best And Worst Shoulder Exercises","channel":"Jeff Nippard","url":"https://www.youtube.com/watch?v=SgyUoY0IZ7A","date":"2024-09-10","duration":799,"views":8109153,"section":"Sport","transcript":"youtube","added":"2026-11-06","tags":["Ciało i zdrowie","Siłownia","Trening"],"about":"Jeff Nippard układa tier list ćwiczeń na przednie, boczne i tylne głowy barków i wybiera najlepsze oraz najgorsze.","intro":"Jeff Nippard, trener i kulturysta naturalny, rankinguje popularne ćwiczenia barków od S (super) do F (fail). Kryteria S: duże napięcie w rozciągnięciu, komfort bez bólu barku oraz prosta progresja ciężaru lub powtórzeń.\n\nBarki mają trzy głowy - przednią, boczną i tylną - traktowane niemal jak osobne mięśnie. Film idzie po ruchach, ujawnia po jednym numerze 1 na każdą głowę i na koniec wybiera absolutnego zwycięzcę oraz najsłabszą opcję.","points":[{"t":"Kryteria i faworyzowanie bocznych","d":"**Żeby wejść do S, ćwiczenie musi dawać napięcie w rozciągnięciu, dobrze leżeć i dać się dociążać.** Nippard lekko faworyzuje boczne głowy, bo budują \"X-frame\" (talię wciętą względem barków), a przednie i tak dostają dużo bodźca z wyciskań klatki.\n\nZapowiada też książkę The Muscle Ladder (programy, technika, żywienie) - to wstawka reklamowa w środku rankingu."},{"t":"Wznosy bokiem: hantle vs pochylenie","d":"**Klasyczne wznosy bokiem z hantlami daje B, bo na dole (w największym rozciągnięciu) napięcie jest prawie zerowe.** Szczyt napięcia wypada dopiero przy ramionach pod kątem 90 stopni, gdy mięsień jest już skrócony.\n\nJeśli oprzesz się o ławkę lub stojak i pochylisz tułów, krzywa oporu przesuwa się i boczny bark dostaje więcej napięcia w rozciągnięciu - wtedy Nippard podnosi wariant do A."},{"t":"Wyciskania i wznosy przodem","d":"**Pionowe wyciskanie (np. na maszynie) jest jego typowym wyborem na przednie barki - A+ i numer 1 na tę głowę.** Wznosy przodem w każdej wersji (hantel, wyciąg, maszyna) lądują w D: przy obecnym wyciskaniu w planie przednie barki i tak są już przeciążone względem bocznych i tylnych."},{"t":"S-tier na boczne: wyciąg i maszyna","d":"**Wznosy bokiem na wyciągu (uchwyt D lub mankiety) idą prosto do S i to jego ulubione ćwiczenie na boczne barki.** Maszynowe wznosy bokiem też S: gładki opór i łatwa progresja.\n\nWersja z gumami to C (trudniej dociążać). Wiosłowanie sztangą wzdłuż tułowia (upright row) uznaje za przesadnie znienawidzone - przy dobrej pozycji rąk w bok może zasłużyć na S."},{"t":"Tylne barki i werdykt końcowy","d":"**Reverse fly na maszynie to S i numer 1 na tylne barki; face pull z liną to solidne A.** Odchylone reverse fly z hantlami mają ten sam problem krzywej oporu co klasyczne laterale.\n\nNajgorsze z praktycznego powodu: wznosy przodem (redundantne). Najlepsze overall: wznosy bokiem na wyciągu - budują boczną głowę, której zwykle brakuje do szerokiej sylwetki."}],"conclusion":"Nippard stawia na napięcie w rozciągnięciu i prostą progresję, a nie na \"uczucie palenia\". Boczne i tylne barki trzeba celować osobno; przednie zwykle wystarczy wyciskanie.","factchecks":[{"claim":"Przednie barki dostają dużo bodźca z ćwiczeń klatki.","verdict":"prawda","note":"Wyciskania angażują przedni delt; wiele programów ogranicza osobne wznosy przodem.","p":2,"src":[["Wikipedia (ang.): mięsień naramienny - \"Deltoid muscle\"","https://en.wikipedia.org/wiki/Deltoid_muscle"]]},{"claim":"Boczna głowa barku unosi ramię w bok (abdukcja).","verdict":"prawda","note":"To podstawowa funkcja części środkowej mięśnia naramiennego.","p":0,"src":[["Wikipedia (ang.): mięsień naramienny - \"Deltoid muscle\"","https://en.wikipedia.org/wiki/Deltoid_muscle"],["Wikipedia (ang.): abdukcja (anatomia)","https://en.wikipedia.org/wiki/Abduction_(kinesiology)"]]},{"claim":"Face pull dobrze celuje w tylne barki przy niższej linie.","verdict":"prawda","note":"Przy linii na wysokości klatki/twarzy i torze \"w bok i do tyłu\" tylny delt jest mocno zaangażowany.","p":4,"src":[["Wikipedia (ang.): face pull","https://en.wikipedia.org/wiki/Face_pull"]]}],"bias":"Ranking oparty też na odczuciach autora; wstawka reklamuje książkę The Muscle Ladder. Brak własnych danych EMG w tym odcinku."},{"id":"y0ccZAG2-48","title_pl":"Lenistwo jest naturalne - Tomasz Rożek o ruchu dzieci","title":"\"Lenistwo jest naturalne\" Tomasz Rożek - didaskalia#82","channel":"didaskalia","url":"https://www.youtube.com/watch?v=y0ccZAG2-48","date":"2024-07-07","duration":4178,"views":116381,"section":"Didaskalia","transcript":"youtube","added":"2026-11-06","tags":["Ciało i zdrowie","Nauka","Psychologia"],"about":"Didaskalia: Rożek o tym, czemu ewolucja premiuje lenistwo i aktywność naraz, oraz o spadku sprawności polskich dzieci.","intro":"Patrycjusz Wyżga gości Tomasza Rożka (fizyk, Nauka. To Lubię) przy okazji książki o sporcie z Anną Lewandowską. Temat dnia: fizyczność dzieci i paradoks lenistwa.\n\nRożek łączy statystyki sprawności (rzut, chwyt, kozłowanie) z ewolucją: organizm oszczędza energię, ale historycznie aktywność była warunkiem przetrwania. Dziś ekrany i nadmiar kalorii odwracają wektor.","points":[{"t":"Sprawność polskich dzieci","d":"**Według Rożka ok. 90-94% dzieci w klasach 1-3 nie potrafi poprawnie rzucić i złapać piłki; ok. 74% starszych nie kozłuje w ruchu.** To nie moralitet, tylko pomiar motoryki.\n\nRównolegle: Polska wśród krajów UE z szybkim przyrostem nadwagi u dzieci - wiele przyczyn naraz, więc trudniej \"zacisnąć pasek\" na jednym wrogu."},{"t":"Ewolucyjny paradoks lenistwa","d":"**W nas siedzi mechanizm premiujący oszczędzanie ruchu (lenistwo) i mechanizm premiujący aktywność, gdy trzeba zdobyć jedzenie.** Przez większość historii jedzenia brakowało; dziś globalnie więcej ludzi umiera z przejedzenia niż z głodu - mówi Rożek.\n\nFirmy tech zatrudniają ekspertów, by trzymać dzieci i dorosłych przy ekranie jak najdłużej - środowisko selekcyjne się zmieniło."},{"t":"Co z tym robić","d":"**Książka i rozmowa idą w stronę zrozumienia \"jak działa sport\", nie w stronę zawstydzania.** Aktywność trzeba projektować świadomie, bo nie wynika już sama z walki o kalorie.\n\nPuenta: naturalne nie znaczy pożądane w świecie appów i dostawy jedzenia."}],"conclusion":"Rożek: lenistwo ma sens ewolucyjny, ale w 2020+ jest pułapką. Najpierw zmierz motorykę dzieci, potem buduj środowisko ruchu - bo geny nadal liczą kalorie jak w paleolicie.","factchecks":[{"claim":"Globalnie więcej zgonów wiąże się z otyłością/przejedzeniem niż z niedożywieniem.","verdict":"półprawda","note":"W wielu statystykach choroby związane z nadwagą dominują w zgonach, ale niedożywienie wciąż zabija regionalnie; uproszczenie \"globalnie\".","p":1,"src":[["Wikipedia (ang.): obesity","https://en.wikipedia.org/wiki/Obesity"],["WHO: obesity and overweight","https://www.who.int/news-room/fact-sheets/detail/obesity-and-overweight"]]},{"claim":"Sprawność motoryczna dzieci spada w krajach rozwiniętych przy siedzący trybie życia.","verdict":"prawda","note":"Raporty o fitness dziecięcym i screen time wskazują pogorszenie podstawowych umiejętności ruchowych.","p":0,"src":[["Wikipedia (ang.): physical fitness","https://en.wikipedia.org/wiki/Physical_fitness"],["Wikipedia (ang.): sedentary lifestyle","https://en.wikipedia.org/wiki/Sedentary_lifestyle"]]}],"bias":"Promocja książki Nauka To Lubię / sport; procenty sprawności podane z pamięci w rozmowie, bez tabeli na ekranie."},{"id":"kIXcoivzGf8","title_pl":"Najlepsze i najgorsze ćwiczenia na czworogłowe","title":"The Best & Worst QUAD Exercises (Ranked Using Science)","channel":"Jeff Nippard","url":"https://www.youtube.com/watch?v=kIXcoivzGf8","date":"2024-07-02","duration":741,"views":4018005,"section":"Sport","transcript":"youtube","added":"2026-11-06","tags":["Ciało i zdrowie","Siłownia","Trening"],"about":"Jeff Nippard rankinguje ok. 20 ćwiczeń na quady: przysiady, hack, wypychanie, wykroki, prostowania - z werdyktem S do F.","intro":"Jeff Nippard ocenia popularne ćwiczenia na czworogłowe uda pod kątem hipertrofii. Do S potrzeba: dużego napięcia w rozciągnięciu, braku bólu kolan i gładkiej progresji.\n\nPrzypomina cztery głowy quada (w tym rectus femoris, który zgina też biodro). Ranking idzie od najgorszych kombinacji, przez typy przysiadów, po izolacje; na końcu wybiera jednego zwycięzcę i absolutnego przegranego.","points":[{"t":"F-tier: combo i Bosu","d":"**Przysiad + wyciskanie albo wykrok + uginanie idą do F: quady są dużo silniejsze niż barki i ręce, więc góra ciała pada pierwsza.** Przysiady na Bosu też F - niestabilność zrzuca pracę na kostki i ogranicza napięcie w udach.\n\nDo budowy masy lepiej zwykły przysiad bez piłki."},{"t":"Przysiady: back, front, low-bar","d":"**Barbell back squat zostaje w S mimo że rectus femoris nie jest maksymalnie aktywowany: nadal buduje potężne quady (widać u powerlifterów).** Front squat ma podobne plusy; low-bar (sztanga niżej) to raczej A, bo nieco mniej nacisku na quady względem tyłu uda i pośladków.\n\nGłębokość i tor sztangi mają znaczenie dla komfortu kolan."},{"t":"Hack, wahadło, Smith, leg press","d":"**Hack squat i przysiad wahadłowy (pendulum) lądują w S - duże rozciągnięcie i stabilna maszyna.** Smith machine squat też S pod hipertrofię, bo quady dostają podobny bodziec jak w wolnej sztandze przy łatwiejszej kontroli.\n\nWypychanie 45 stopni jest dobre; poziomy leg press to raczej C dla średniozaawansowanych (mniejszy zakres / overload)."},{"t":"Wykroki, prostowania, bułgarskie","d":"**Wykroki to według niego lepszy builder pośladków niż quadów - jako ćwiczenie na quady B.** Prostowanie nóg (leg extension) A dzięki silnemu rozciągnięciu i dostępności; bułgarskie przysiady (Bulgarian split squat) S - ogromne rozciągnięcie i praca jednej nogi.\n\nMartwy ciąg na quady to C (aktywacja jest, ale dużo mniejsza niż w przysiadzie)."},{"t":"Werdykt: hack vs Bosu","d":"**Numer 1 overall: hack squat - jego osobisty go-to na quady.** Najgorsze: przysiad na Bosu - wystarczy zdjąć piłkę, by ruch od razu stał się sensowny.\n\nWniosek praktyczny: trzymaj się głębokich, stabilnych ruchów z progresją ciężaru zamiast \"wyzwań równowagi\"."}],"conclusion":"Na quady wygrywa duże rozciągnięcie pod obciążeniem: hack, głęboki przysiad, bułgarskie. Unikaj niestabilnych gadżetów i combo, które męczą słabsze mięśnie wcześniej niż uda.","factchecks":[{"claim":"Czworogłowy ma 4 głowy; rectus femoris zgina też biodro.","verdict":"prawda","note":"Rectus femoris to jedyna głowa dwustawowa: prostuje kolano i zgina biodro.","p":0,"src":[["Wikipedia (ang.): mięsień czworogłowy uda","https://en.wikipedia.org/wiki/Quadriceps_femoris_muscle"]]},{"claim":"W przysiadzie rectus femoris nie jest maksymalnie aktywowany.","verdict":"półprawda","note":"Przy zgięciu biodra rectus jest mniej faworyzowany niż w prostowaniu nóg, ale badania i tak pokazują jego wzrost przy przysiadach.","p":1,"src":[["Wikipedia (ang.): przysiad (ćwiczenie)","https://en.wikipedia.org/wiki/Squat_(exercise)"],["PubMed: przegląd EMG mięśni w przysiadzie","https://pubmed.ncbi.nlm.nih.gov/22395215/"]]},{"claim":"Hack squat mocno obciąża quady w rozciągnięciu.","verdict":"prawda","note":"Maszyna utrzymuje tułów i pozwala zejść głęboko z naciskiem na prostowanie kolana.","p":4,"src":[["Wikipedia (ang.): hack squat","https://en.wikipedia.org/wiki/Hack_squat"]]}],"bias":"Werdykt \"numer 1\" jest też osobistą preferencją (hack). Brak tabeli badań w odcinku - opiera się na anatomii i doświadczeniu coaches."},{"id":"aP8KsI2Ugc8","title_pl":"Prof. Piotr Rutkowski o profilaktyce raka, czerniaku i opalaniu","title":"Uwarunkowania genetyczne odpowiadają za 5 proc. zachorowań na nowotwory- prof. Piotr Rutkowski","channel":"didaskalia","url":"https://www.youtube.com/watch?v=aP8KsI2Ugc8","date":"2024-06-09","duration":4187,"views":119360,"section":"Didaskalia","transcript":"youtube","added":"2026-11-03","tags":["Zdrowie","Medycyna","Nauka"],"about":"Chirurg onkolog o tym, że większość nowotworów można wyleczyć, jak ich unikać, jak rozpoznać czerniaka i jak bezpiecznie korzystać ze słońca.","intro":"Patrycjusz Wyżga rozmawia z prof. Piotrem Rutkowskim, chirurgiem onkologiem z Narodowego Instytutu Onkologii i prezesem Polskiego Towarzystwa Onkologicznego (2024). Mowa o czynnikach ryzyka, badaniach przesiewowych, szczepieniu przeciw HPV, czerniaku, kremach z filtrem, solariach oraz nowych lekach i szczepionkach.","points":[{"t":"Rak to nie wyrok","d":"Większość nowotworów da się dziś wyleczyć. W Polsce szansa na wyleczenie przekracza 50%, w Norwegii zbliża się do 70%. Wcześnie wykryty nowotwór skóry to według gościa najprostsza choroba do wyleczenia."},{"t":"Geny to mały udział","d":"Nowotwory uwarunkowane dziedzicznie to ok. 5% przypadków. Większość wynika z czynników zewnętrznych, na które mamy wpływ."},{"t":"Tytoń i e-papierosy","d":"Gość wiąże z tytoniem 30 do 40% nowotworów, m.in. płuc, krtani, jamy ustnej, nerki i żołądka. Niepokoi go, że ok. 70% młodzieży ma kontakt z e-papierosami. Pomaga też ruch i rozsądna dieta."},{"t":"Szczepienie przeciw HPV","d":"Szczepionka przeciw wirusowi brodawczaka może zapobiec tysiącom nowotworów, m.in. raka szyjki macicy. Jest dobrze przebadana. W Finlandii zaszczepionych jest ok. 90% dzieci, w Polsce znacznie mniej."},{"t":"Badania, z których nie korzystamy","d":"Mamografia, cytologia (zastępowana testem HPV DNA) i kolonoskopia są dostępne, ale zgłasza się mało osób. Przegląd samochodu robimy obowiązkowo, a o własne zdrowie nie dbamy."},{"t":"Abecadło czerniaka","d":"A: asymetria, B: nierówne brzegi, C: różne kolory, D: średnica ponad ok. 5 mm, E: ewolucja, czyli zmiana. Najważniejsze jest E. Wystarczy co kilka miesięcy przez 5 minut obejrzeć swoją skórę."},{"t":"Dermatoskop","d":"Kontrola u dermatologa jest szybka i bezbolesna. Lekarz ogląda znamiona przez dermatoskop, czyli lupę ze spolaryzowanym światłem."},{"t":"Jak się przygotować do słońca","d":"Na słońcu można przebywać długo, jeśli się przygotujemy: kapelusz lub czapka z daszkiem ok. 7,5 cm, ubranie, cień i krem z filtrem co najmniej 30, nałożony ok. 15 minut przed wyjściem."},{"t":"Solarium jako fabryka czerniaka","d":"W Polsce osoby poniżej 18 lat nie mogą korzystać z solariów. Australia zakazała ich zupełnie, bo szacowano, że odpowiadały za połowę czerniaków u osób poniżej 40 lat."},{"t":"Opalenizna a witamina D","d":"Intensywne opalanie nie gwarantuje witaminy D: w badaniu surferów z Hawajów część miała jej niedobór. Opalenizna to obrona skóry przed uszkodzeniem."},{"t":"Rewolucja w leczeniu","d":"Immunoterapia i leczenie celowane (np. przy mutacji BRAF) sprawiły, że wśród chorych z przerzutami czerniaka 5 lat przeżywa ponad 50%, a kiedyś ok. 2%. Polscy pacjenci uczestniczą w badaniach szczepionek mRNA."}],"conclusion":"Rzeczowa, praktyczna rozmowa o profilaktyce. Najwięcej konkretów o skórze i słońcu.","factchecks":[{"claim":"Nowotwory uwarunkowane dziedzicznie to ok. 5% przypadków.","verdict":"prawda","note":"Szacunki mówią o ok. 5 do 10% nowotworów wynikających z dziedzicznych wad genetycznych.","p":1,"src":[["Wikipedia (ang.): Nowotwór - hasło \"Cancer\"","https://en.wikipedia.org/wiki/Cancer"]]},{"claim":"Z tytoniem związanych jest 30 do 40% wszystkich nowotworów.","verdict":"przesada","note":"Częściej podawane jest ok. 25 do 30% zgonów z powodu nowotworów. Górna granica gościa jest zawyżona.","p":2,"src":[["Wikipedia (ang.): Nowotwór - hasło \"Cancer\"","https://en.wikipedia.org/wiki/Cancer"]]},{"claim":"Australia całkowicie zakazała komercyjnych solariów.","verdict":"prawda","note":"Zakaz komercyjnych solariów obowiązuje w Australii od 2015 r.","p":8,"src":[["Wikipedia (ang.): Solarium - hasło \"Indoor tanning\"","https://en.wikipedia.org/wiki/Indoor_tanning"]]}],"bias":"Gość mówi z perspektywy lekarza i prezesa towarzystwa onkologicznego, więc mocno akcentuje sukcesy polskiej onkologii. Rady są zgodne z typowymi zaleceniami."},{"id":"GBX3rgsmQbw","title_pl":"Odtwarzam ostatni posiłek Ötziego, człowieka lodu","title":"Recreating the Last Meal of Ötzi the Iceman","channel":"Tasting History with Max Miller","url":"https://www.youtube.com/watch?v=GBX3rgsmQbw","date":"2024-06-04","duration":1321,"views":4185855,"section":"Historia","transcript":"youtube","added":"2026-11-03","tags":["Historia","Nauka"],"about":"Max Miller gotuje ostatni posiłek Ötziego (dziczyzna, koza, samopsza) i opowiada, co nauka wie o jego życiu i śmierci.","intro":"Max Miller z Tasting History odtwarza ostatni posiłek Ötziego, mężczyzny zabitego strzałą w Alpach ponad 5000 lat temu. Wędzi kozinę, piecze jelenia i placek z samopszy, a przy okazji opowiada o odkryciu mumii, jej ubraniu, narzędziach, chorobach i o tym, jak z treści jelit odtworzono ostatnie godziny jego życia.","points":[{"t":"Między rolnikami a łowcami","d":"Ötzi żył przed piramidami i Stonehenge, gdy rolnictwo dotarło już przez Turcję i Bałkany do całej Europy, ale gdzieniegdzie przetrwali łowcy-zbieracze. Jego ostatni posiłek łączył oba światy: dziczyznę i uprawne zboże."},{"t":"Co było w żołądku","d":"Kilka godzin przed śmiercią zjadł jelenia szlachetnego, koziorożca i samopszę, czyli według autora pierwsze uprawiane zboże. Były tam też pyłki, grzyby, mech i odrobina orlicy, paproci leczniczej, ale i trującej; autor użył jadalnych pędów paproci."},{"t":"Gotowanie po neolitycznemu","d":"Kozinę (zamiast koziorożca) wędził na plasterkach przy żarze w ok. 70-77°C przez 6-10 godzin, jelenia piekł na rożnie 5-6 minut. Grubo zmieloną samopszę zmieszał z tłuszczem, wodą i paprocią i upiekł placek na glinianej płycie po ok. 3 minuty z każdej strony."},{"t":"Tłuszcz jako paliwo","d":"Z ok. 300 g zawartości żołądka Ötziego połowę stanowił tłuszcz koziorożca. Ziarna nie były zmielone na mąkę, bo w żołądku znaleziono spore kawałki."},{"t":"Odkrycie w 1991 r.","d":"19 września 1991 r. dwoje niemieckich turystów znalazło ciało na granicy Austrii i Włoch; najpierw myślano o zaginionym turyście lub żołnierzu z I wojny światowej. Okazało się, że mężczyzna żył ok. 3359-3105 r. p.n.e., a lód naturalnie zmumifikował jego i jego rzeczy."},{"t":"Strój i ekwipunek","d":"Miał buty z podeszwą ze skóry niedźwiedzia i jelenia ocieplone trawą, nogawice z łatami futra w naprzemienne kolory, płaszcz z owczej i koziej skóry, pelerynę z trawy i czapkę z niedźwiedziej skóry. Nosił też nóż, zestaw do rozpalania ognia, kołczan 14 strzał i łuk z cisu."},{"t":"Miedziany topór","d":"Wszystkie narzędzia były kamienne, poza toporem z miedzi o czystości 99,7%. Ostrze miało mniej niż 10 cm, ale według autora było bardzo cenne."},{"t":"Zdrowie 45-latka","d":"W wieku 45-46 lat miał chorobę serca, starte zęby, chore dziąsła, zrośnięte żebra, kamień żółciowy, odmrożenia, włosogłówkę i bóle stawów. Jego 61 tatuaży mogło służyć leczeniu bólu, a w sakiewce nosił grzyby i mchy, pewnie jako lekarstwa."},{"t":"Morderstwo odkryte po 10 latach","d":"Miał ranę głowy i głęboko rozciętą dłoń, która zaczęła się goić. Dopiero w 2001 r. odkryto grot strzały w barku, wystrzelonej kilka minut przed śmiercią; motywy zabójstwa pozostają nieznane."},{"t":"Ostatnie godziny z pyłków","d":"Pyłki w jelitach pokazują, że 33 godziny przed śmiercią był w lesie na ok. 2500 m, 24 godziny przed nią niżej, na ok. 1200 m, gdzie zranił dłoń i być może opatrzył ją torfowcem. Potem szybko wspiął się na prawie 3000 m i zjadł ostatni posiłek."},{"t":"Śmierć na przełęczy","d":"1-3 godziny po jedzeniu strzała z grotem ludzi z południa przecięła mu tętnicę podobojczykową. Ktoś wyjął drzewce, grot został, a śnieg i lodowiec zakonserwowały go na 5000 lat."},{"t":"Jak to smakuje","d":"Jeleń był mocno dziki w smaku, wędzona kozina zaskakująco dobra, a placek przypominał autorowi niesłodzony batonik musli. Wniosek: dobrze żyć w czasach z wyborem jedzenia."}],"conclusion":"Z treści żołądka sprzed 5000 lat da się odtworzyć nie tylko posiłek, ale i ostatnie godziny życia człowieka.","factchecks":[{"claim":"Ciało Ötziego znaleźli niemieccy turyści 19 września 1991 r.","verdict":"prawda","note":"Znaleźli je Helmut i Erika Simon na lodowcu Similaun w Alpach Ötztalskich.","p":4,"src":[["Wikipedia (ang.): Ötzi - hasło \"Ötzi\"","https://en.wikipedia.org/wiki/%C3%96tzi"]]},{"claim":"Ötzi żył ok. 3359-3105 r. p.n.e.","verdict":"prawda","note":"Datowanie radiowęglowe daje 3350-3105 r. p.n.e.; różnica w pierwszej dacie to drobny błąd.","p":4,"src":[["Wikipedia (ang.): Ötzi - hasło \"Ötzi\"","https://en.wikipedia.org/wiki/%C3%96tzi"]]},{"claim":"Połowę zawartości żołądka stanowił tłuszcz koziorożca.","verdict":"prawda","note":"Analiza z 2018 r. wykazała 46% tłuszczu oraz mięso koziorożca, jelenia i samopszę.","p":[1,3],"src":[["Current Biology: ostatni posiłek Ötziego (Maixner i in., 2018)","https://doi.org/10.1016/j.cub.2018.05.067"]]},{"claim":"Samopsza to pierwsze uprawiane zboże, niezmienione od 12 tys. lat.","verdict":"półprawda","note":"To jedno z najwcześniej udomowionych zbóż (ok. 10-11 tys. lat temu), obok płaskurki i jęczmienia.","p":1,"src":[["Wikipedia (ang.): pszenica samopsza - hasło \"Einkorn wheat\"","https://en.wikipedia.org/wiki/Einkorn_wheat"]]},{"claim":"Topór Ötziego był z miedzi o czystości 99,7%, a ciało miało 61 tatuaży.","verdict":"prawda","note":"Oba fakty potwierdzają badania; tatuaże to linie i krzyżyki głównie przy stawach.","p":[6,7],"src":[["Wikipedia (ang.): Ötzi - hasło \"Ötzi\"","https://en.wikipedia.org/wiki/%C3%96tzi"],["Muzeum Archeologiczne Południowego Tyrolu: Ötzi","https://www.iceman.it/en/the-iceman/"]]},{"claim":"Grot strzały w barku odkryto dopiero w 2001 r.","verdict":"prawda","note":"Zdjęcia rentgenowskie z 2001 r. ujawniły grot, który uszkodził tętnicę podobojczykową.","p":[8,10],"src":[["Wikipedia (ang.): Ötzi - hasło \"Ötzi\"","https://en.wikipedia.org/wiki/%C3%96tzi"]]}],"bias":"Rzetelny i lekki w tonie; ostrożnie zaznacza, co jest hipotezą. Część czasu zajmuje reklama sponsora."},{"id":"OpRMRhr0Ycc","title_pl":"Najlepsze i najgorsze ćwiczenia na triceps","title":"The Best & Worst TRICEPS Exercises (Ranked Using Science)","channel":"Jeff Nippard","url":"https://www.youtube.com/watch?v=OpRMRhr0Ycc","date":"2024-05-24","duration":893,"views":9394413,"section":"Sport","transcript":"youtube","added":"2026-11-06","tags":["Ciało i zdrowie","Siłownia","Trening"],"about":"Jeff Nippard rankinguje ćwiczenia na trzy głowy tricepsa; wygrywa prostowanie nad głową na wyciągu.","intro":"Jeff Nippard robi tier list ok. 20 ruchów na triceps. Do S: napięcie w rozciągnięciu, komfort i prosta progresja. Triceps ma trzy głowy - boczną, przyśrodkową i długą (ta ostatnia buduje ramię \"od tyłu\").\n\nZaczyna od popularnych prostowań na wyciągu, porównuje linę, drążek i chwyt odwrócony, potem idzie w warianty nad głową, skull crushers, dipsy i kickbacki. Na końcu koronuje zwycięzcę.","points":[{"t":"Prostowania na wyciągu: lina vs drążek","d":"**Prostowanie liną to B: lepsze \"czucie\" skurczu, ale mniej obciążenia.** W teście przy tym samym ciężarze zrobił 12 powtórzeń liną i 16 drążkiem - lina jest mniej sztywna, część napięcia \"gubi się\" w stabilizacji przedramion.\n\nDrążek to A (blisko S): stabilniej, równe napięcie, łatwa progresja, ale u góry ruchu nie ma dużego rozciągnięcia. Chwyt odwrócony (reverse grip) to C - biomechanicznie mało zmienia, a ogranicza siłę."},{"t":"Overhead = S i faworyt długiej głowy","d":"**Prostowanie nad głową na wyciągu to pierwsze S: pozycja mocno rozciąga długą głowę.** Badania hipertrofii, które Nippard cytuje w serii, wskazują wyższość wariantu overhead nad prostowaniem w dół.\n\nWersja z liną zachowuje plusy długiej głowy. Jednoręczne prostowanie hantlem nad głową to A - dobre, gdy masz tylko hantle, ale więcej setupu."},{"t":"Skull crushers i złożone","d":"**Skull crushers (prostowanie leżąc) idą do S: wysokie napięcie przy rozciągniętym tricepsie.** Wariant z hantlami raczej A (trudniej kontrolować).\n\nClose-grip dip i close-grip bench na papierze A/S przez overload, ale Nippard zrzuca je do A: klatka i barki łatwo przejmują ruch, a dipsy nie zawsze dobrze \"leżą\" na łokciach."},{"t":"Kickback najsłabszy; brak F","d":"**Numer 1 overall: overhead cable tricep extension.** Najgorsze: kickback z hantlem - ma miejsce, ale są wyraźnie lepsze opcje.\n\nW tym odcinku nie dał nikomu F (w przeciwieństwie do rankingu pleców). Puenta: trenuj długą głowę w rozciągnięciu, a medial/lateral domykaj prostowaniami drążkiem."}],"conclusion":"Na triceps wygrywa rozciągnięcie długiej głowy (overhead) plus stabilne prostowania drążkiem. Kickbacki i chwyt odwrócony to raczej dodatek, nie fundament.","factchecks":[{"claim":"Triceps ma trzy głowy; długa głowa też prostuje bark (przechodzi przez staw).","verdict":"prawda","note":"Long head przyczepia się do łopatki, więc pozycja ramienia zmienia jej długość.","p":0,"src":[["Wikipedia (ang.): mięsień trójgłowy ramienia","https://en.wikipedia.org/wiki/Triceps"]]},{"claim":"Trening overhead daje większy przyrost tricepsa niż prostowanie w dół.","verdict":"prawda","note":"Maeo i wsp. 2023: większa hipertrofia całego tricepsa w pozycji nad głową.","p":1,"src":[["PubMed: Maeo i wsp. 2023 - overhead vs pushdown","https://pubmed.ncbi.nlm.nih.gov/35819335/"]]},{"claim":"Skull crushers mocno obciążają triceps w rozciągnięciu.","verdict":"prawda","note":"Przy zgięciu łokcia nad głową/za głową długa głowa jest wydłużona pod obciążeniem.","p":2,"src":[["Wikipedia (ang.): lying triceps extension","https://en.wikipedia.org/wiki/Lying_triceps_extension"]]}],"bias":"Porównanie liny vs drążek to jeden test na sobie; ranking łączy literaturę z osobistym czuciem. Zero F może wynikać z łagodniejszego tonu odcinka."},{"id":"5tSMLwgeli8","title_pl":"Dlaczego nie budujemy mieszkań jak w PRL - Marek Bryx","title":"Nie stać nas na budowanie mieszkań jak w PRL - prof. Marek Bryx - didaskalia#71","channel":"didaskalia","url":"https://www.youtube.com/watch?v=5tSMLwgeli8","date":"2024-05-12","duration":5742,"views":106025,"section":"Didaskalia","transcript":"youtube","added":"2026-11-06","tags":["Technika","Psychologia"],"about":"Didaskalia: prof. Marek Bryx o rynku mieszkań, mieszkaniach komunalnych, zieleni w mieście i cenach metra.","intro":"Patrycjusz Wyżga rozmawia z prof. Markiem Bryxem (ekonomia/nieruchomości) o tym, czemu dziś nie da się powtórzyć skali budownictwa z epoki silnych dopłat państwowych i co zamiast tego buduje dobre miasto.\n\nWątki: mieszkanie nie tylko jako towar, potrzeba segmentu komunalnego i socjalnego, zieleń, dojazdy, dlaczego duże miasta puchną, a małe się wyludniają, oraz relacja ceny m2 do pensji.","points":[{"t":"Mieszkanie nie tylko towar","d":"**Bryx: na rynku potrzeba różnorodności - najem, kupno, ale też komunalne i socjalne dla osób, którym trzeba pomóc.** Zarazem odrzuca roszczenie \"państwo ma mi dać mieszkanie\" jako jedyny model - praca i własne ułatwianie sobie życia zostają w grze.\n\nSocjalizm według niego rozwiązał dostępność ogromnym dofinansowaniem, na które dziś nas nie stać w tej skali."},{"t":"Dlaczego nie tanieje w centrach","d":"**Mieszkania w centrach dużych miast raczej nie będą systematycznie taniały: mało terenu, droższe materiały i robocizna, instytucje trzymają działki.** Relatywnie do średniej płacy metr od lat kosztuje podobny ułamek (ok. 0,7 m2 za średnią - rząd wielkości z rozmowy).\n\nDuże miasta są źródłem zarobków, więc młodzi głosują nogami - małe się wyludniają."},{"t":"Zieleń i miasto do życia","d":"**Twarde zasady planowania: zieleń, dojazd do pracy, szkoły, odpoczynek psychiczny - drzewa rosną wolno, więc sadzić wcześnie.** Bryx mówi studentom: chroniąc środowisko, chronimy siebie (tlen, hałas, zdrowie).\n\nPrzykłady warszawskie: otwarte ogrody i skróty vs zamknięte ogrodzenia utrudniające spacer z wózkiem."}],"conclusion":"Nie wrócimy do PRL-owskiego tempa na starych dopłatach. Sensowna polityka mieszkaniowa to mix rynku, segmentu komunalnego i miasta, w którym da się oddychać - dosłownie i w dojeździe.","factchecks":[{"claim":"Urbanizacja ściąga ludność do większych miast oferujących wyższe zarobki.","verdict":"prawda","note":"Klasyczny wzorzec migracji wewnętrznych w Polsce i UE.","p":1,"src":[["Wikipedia (ang.): urbanization","https://en.wikipedia.org/wiki/Urbanization"],["Wikipedia (ang.): rural flight","https://en.wikipedia.org/wiki/Rural_flight"]]},{"claim":"Zieleń miejska ma mierzalne korzyści zdrowotne i ekonomiczne.","verdict":"prawda","note":"Badania ecosystem services drzew w miastach są cytowane w urbanistyce.","p":2,"src":[["Wikipedia (ang.): urban forestry","https://en.wikipedia.org/wiki/Urban_forestry"],["Wikipedia (ang.): ecosystem service","https://en.wikipedia.org/wiki/Ecosystem_service"]]}],"bias":"Perspektywa ekonomisty rynku nieruchomości; liczby m2 za średnią orientacyjne z rozmowy. Krótka dygresja geopolitczna pominięta."},{"id":"7bOQ7fLCqgI","title_pl":"9 części ciała, które kiedyś znikną","title":"9 Body Parts That Will Disappear One Day","url":"https://www.youtube.com/watch?v=7bOQ7fLCqgI","date":"2024-04-27","duration":528,"views":1188491,"transcript":"youtube","added":"2026-11-03","tags":["Ciało i zdrowie","Ewolucja"],"about":"9 szczątkowych części ciała, które według autora mogą kiedyś zniknąć w wyniku ewolucji.","intro":"Ranking 9 części ciała, które według autora ewolucja powoli \"wygasza\", bo przestały być potrzebne. Są tu wyrostek robaczkowy, palce u stóp, narząd Jacobsona, mięśnie od gęsiej skórki, kość ogonowa, mięsień dłoniowy długi, zęby mądrości, mięśnie uszu i zatoki. Autor przy każdej tłumaczy, do czego służyła przodkom i dlaczego dziś ma znikać.","points":[{"t":"9. Wyrostek robaczkowy","d":"Mógł pomagać przodkom trawić twarde rośliny, a przy dzisiejszej diecie według autora nic nie robi. Gdy się zapali, lekarze go usuwają i da się normalnie żyć. Autor twierdzi, że w niektórych populacjach nawet 1 na 5 osób rodzi się bez wyrostka."},{"t":"8. Palce u stóp","d":"Przodkowie potrzebowali chwytnych palców do wspinaczki. Dziś większość pracy przy chodzeniu i bieganiu robi duży palec, a buty sprawiają, że małe palce \"leniwieją\". Naukowcy mają przewidywać, że w bardzo dalekiej przyszłości palce się skrócą, ale nie za naszego życia."},{"t":"7. Narząd Jacobsona","d":"Narząd w nosie do wykrywania feromonów, u ludzi według autora praktycznie nieczynny, jak gadżet z wyczerpaną baterią. Przodkom mógł sygnalizować płodność albo złość, ale zaczęliśmy polegać na wzroku i słuchu. Część ludzi rodzi się bez niego i nie ma z tym problemu."},{"t":"6. Mięśnie przywłosowe","d":"To one robią gęsią skórkę. U owłosionych przodków stroszyły futro, żeby wyglądać groźniej, np. przed tygrysem szablozębnym. Według autora słabną i stają się rzadsze, więc kiedyś gęsia skórka może być ciekawostką z podręcznika."},{"t":"5. Kość ogonowa","d":"Pozostałość ogona przodków, którzy używali go do równowagi i komunikacji. Nie jest całkiem bezużyteczna, bo przyczepiają się do niej mięśnie i więzadła. Bardzo rzadko dzieci rodzą się z małym ogonkiem bez kości (tylko tkanka i naczynia), który zwykle usuwa się po porodzie."},{"t":"4. Mięsień dłoniowy długi","d":"Pomaga zginać nadgarstek, ale tę pracę i tak wykonują inne mięśnie, a według autora nie ma go ok. 14% ludzi. Przodkom mógł się przydawać przy przeskakiwaniu z drzewa na drzewo. Chirurdzy pobierają jego ścięgno do przeszczepów bez szkody dla ręki."},{"t":"3. Zęby mądrości","d":"Wyrastają w wieku ok. 17-25 lat, gdy w szczęce nie ma już miejsca, więc przesuwają inne zęby. Przodkowie potrzebowali zapasowych zębów do surowego jedzenia i szybko tracili zęby. Gotujemy i kroimy jedzenie, szczęki się zmniejszyły, a coraz więcej ludzi rodzi się bez ósemek."},{"t":"2. Mięśnie uszu","d":"Dzięki nim niektórzy ruszają uszami, ale większość nie umie ich używać. Przodkom mogły pomagać namierzać dźwięki, potem zaczęliśmy polegać na wzroku. Autor wspomina rekord: mężczyzna z Indii poruszył uszami 99 razy w 30 sekund."},{"t":"1. Zatoki","d":"Nie wiadomo do końca, po co są: hipotezy to nawilżanie powietrza, odciążenie czaszki i śluz łapiący zarazki. Według autora część badaczy uważa, że powoli zanikają, a jedno badanie wiązało mniejsze zatoki z rzadszymi infekcjami. Ewentualne zniknięcie trwałoby tysiące lat."}],"conclusion":"Ciało nosi ślady ewolucji, a niektóre z tych części mogą zniknąć, ale zajmie to tysiące lat.","factchecks":[{"claim":"Wyrostek robaczkowy jest bezużyteczny.","verdict":"półprawda","note":"Nowsze badania wskazują na rolę odpornościową wyrostka, co przeczy prostej tezie o szczątkowości.","src":[["Wikipedia (ang.): wyrostek robaczkowy - hasło \"Appendix (anatomy)\"","https://en.wikipedia.org/wiki/Appendix_(anatomy)"],["Smith i in. 2023, Anat Rec: przegląd funkcji i ewolucji wyrostka (PubMed)","https://pubmed.ncbi.nlm.nih.gov/35363436/"],["Smith i in. 2009, J Evol Biol (PubMed)","https://pubmed.ncbi.nlm.nih.gov/19678866/"]],"p":0},{"claim":"Coraz więcej ludzi rodzi się bez wyrostka (nawet 1 na 5).","verdict":"fałsz","note":"Wrodzony brak wyrostka to skrajna rzadkość, szacowana na ok. 1 na 100 000 operacji brzucha.","src":[["Opis przypadku agenezji wyrostka (PMC)","https://pmc.ncbi.nlm.nih.gov/articles/PMC8043782/"]],"p":0},{"claim":"Część ludzi nie ma mięśnia dłoniowego długiego.","verdict":"prawda","note":"Brak występuje u ok. 10-15% ludzi, z dużymi różnicami między populacjami.","src":[["Wikipedia (ang.): mięsień dłoniowy długi - hasło \"Palmaris longus\"","https://en.wikipedia.org/wiki/Palmaris_longus_muscle"]],"p":5},{"claim":"U części ludzi zęby mądrości się nie rozwijają.","verdict":"prawda","note":"Metaanaliza Cartera i Worthingtona (2015) daje ok. 22% osób z brakiem co najmniej jednego zęba mądrości.","src":[["Carter i Worthington 2015, J Dent Res (DOI)","https://doi.org/10.1177/0022034515581644"],["Wikipedia (ang.): zęby mądrości - hasło \"Wisdom tooth\"","https://en.wikipedia.org/wiki/Wisdom_tooth"]],"p":6},{"claim":"Narząd Jacobsona, kość ogonowa, mięśnie przywłosowe i uszne to struktury szczątkowe.","verdict":"prawda","note":"Standardowe przykłady w biologii. Narząd lemieszowo-nosowy u dorosłych ludzi nie ma działających połączeń nerwowych.","src":[["Wikipedia (ang.): narządy szczątkowe u człowieka - hasło \"Human vestigiality\"","https://en.wikipedia.org/wiki/Human_vestigiality"],["Wikipedia (ang.): narząd lemieszowo-nosowy (Jacobsona) - hasło \"Vomeronasal organ\"","https://en.wikipedia.org/wiki/Vomeronasal_organ"]],"p":null},{"claim":"Te części ciała \"znikną kiedyś\".","verdict":"nie da się sprawdzić","note":"Ewolucja nie usuwa zbędnych części sama; potrzebna jest presja selekcyjna, więc to spekulacja.","src":[["Wikipedia (ang.): szczątkowość narządów - hasło \"Vestigiality\"","https://en.wikipedia.org/wiki/Vestigiality"]],"p":null}],"bias":"Uproszczona wizja ewolucji jako \"usuwania zbędnych części\". Jedna liczba (brak wyrostka) jest wyssana z palca, a wyrostek opisany według przestarzałej wiedzy.","channel":"Chill Dude Explains","section":"Chill Dude Explains"},{"id":"_u76SgdXeCk","title_pl":"Jak powinien leżeć garnitur - najważniejsze zasady dopasowania","title":"Jak powinien leżeć garnitur? Najważniejsze aspekty dopasowania garnituru","channel":"Kamil Brycki","url":"https://www.youtube.com/watch?v=_u76SgdXeCk","date":"2024-04-14","duration":722,"views":9663,"section":"Moda","transcript":"youtube","added":"2026-11-03","tags":["Garnitur","Dopasowanie","Krawiectwo"],"about":"Kamil Brycki, krawiec z 10-letnim stażem, pokazuje, na co patrzeć przy marynarce, spodniach i kamizelce i co da się poprawić u krawca.","intro":"Kamil Brycki szyje garnitury od 10 lat i od razu uprzedza: gotowy garnitur prawie nigdy nie leży idealnie, więc trzeba liczyć się z kosztem poprawek. Omawia, które wymiary muszą pasować od razu, a które poprawi krawiec. Podaje klasyczne proporcje i przypomina, że to wskazówki, a nie dogmaty.","points":[{"t":"Najpierw ramiona i klatka","d":"W marynarce kluczowe są ramiona i klatka, bo u krawca trudno je zmienić bez zniszczenia kroju. Talię, biodra, rękawy i długość da się skorygować. Łatwiej zwęzić niż poszerzyć, a marynarki o wiele rozmiarów za dużej nie warto ratować."},{"t":"Klasyczne proporcje","d":"Rękaw do nadgarstka, z widocznym 0,5-1 cm mankietu koszuli. Marynarka zakrywa pośladki, a z przodu sięga mniej więcej do połowy kciuka. Niższym może pasować nieco krótsza, a wyższym niż 190 cm dłuższa."},{"t":"Wysoka pacha daje swobodę","d":"Jeśli marynarka krępuje ruchy, pacha może być za nisko wszyta i robi się efekt nietoperza. Krawcy wszywają ją jak najwyżej, byle nie obcierała. We frakach dyrygentów pacha jest prawie tak wysoko jak w koszuli."},{"t":"Guzik i klapy","d":"Tych dwóch rzeczy nie zmienisz w gotowej marynarce. Guzik zapina się w najwęższym miejscu talii, a klapy sięgają mniej więcej połowy szerokości ramienia. Szersze klapy optycznie poszerzają ramiona."},{"t":"Spodnie: biodra, uda, krok","d":"Spodnie da się zwęzić i skrócić, ale poszerzyć najwyżej o 1-1,5 cm, a źle leżącego kroku raczej nie poprawisz. Złoty standard: możesz usiąść, a po wstaniu nogawka sama opada na miejsce. Nogawka ma jedno załamanie lub żadnego."},{"t":"Nie do połowy obcasa","d":"Stara zasada była sensowna przy szerokich nogawkach. Wąska nogawka tak długa zatrzymuje się na bucie i tworzy harmonijkę."},{"t":"Kamizelka","d":"Kamizelka ma modelować sylwetkę, więc leży blisko ciała. Musi zakrywać pasek spodni, żeby koszula nie wychodziła. Dawniej była wysoko zapinana, bo koszula była bielizną, a kołnierzyki i mankiety odpinano i prano osobno."}],"conclusion":"Trzymaj się podstaw dopasowania, a bawić się stylem zacznij dopiero potem. Za ciasne ubranie nie odmładza i nie wyszczupla.","factchecks":[{"claim":"Kołnierzyki odpinano, żeby prać je osobno od koszuli.","verdict":"prawda","note":"Wikipedia opisuje odpinane, mocno krochmalone kołnierzyki prane osobno lub zastępowane papierowymi i celuloidowymi.","p":6,"src":[["Wikipedia (ang.): kołnierzyk - hasło \"Detachable collar\"","https://en.wikipedia.org/wiki/Detachable_collar"]]},{"claim":"Koszula była kiedyś traktowana jak bielizna.","verdict":"prawda","note":"Wg Wikipedii odsłonięta koszula budziła kiedyś podobne skojarzenia jak dziś widoczna bielizna.","p":6,"src":[["Wikipedia (ang.): koszula - hasło \"Shirt\"","https://en.wikipedia.org/wiki/Shirt"]]}],"bias":"Autor jest krawcem w pracowni w Poznaniu, więc zachęca do poprawek krawieckich. Poza tym rzeczowo i bez reklam produktów."},{"id":"UTz2Xg4oMxs","title_pl":"9 najbardziej bolesnych rzeczy, jakich można doświadczyć","title":"9 MOST PAINFUL Things You Can EVER Experience!","url":"https://www.youtube.com/watch?v=UTz2Xg4oMxs","date":"2024-04-07","duration":548,"views":1114282,"transcript":"youtube","added":"2026-11-03","tags":["Ciało i zdrowie","Natura"],"about":"Ranking 9 najbardziej bolesnych doświadczeń, od kamieni nerkowych po użądlenie mrówki-pocisku.","intro":"Ranking 9 najboleśniejszych doświadczeń, jakie może przeżyć człowiek. Autor zaczyna od kamienia nerkowego i chorób (tężec, klasterowe bóle głowy, fibromialgia), a potem przechodzi do zwierząt i roślin: meduzy Irukandji, ryby kamień, rośliny gympie-gympie, osy \"kat\" i mrówki-pocisku. Opisy są obrazowe i żartobliwe, bez podanych źródeł.","points":[{"t":"9. Kamień nerkowy","d":"Zaczyna się od ostrego bólu w plecach, który przesuwa się, gdy kamień wędruje z nerki do pęcherza. Ból narasta jak dźganie nożem od środka, a jedyne wyjście to czekać, aż kamień przejdzie. Niektórzy porównują to do porodu."},{"t":"8. Meduza Irukandji","d":"Meduza mieści się na paznokciu. 20-30 minut po ukłuciu pojawia się ból pleców i brzucha, skurcze mięśni i poczucie nadchodzącej śmierci, przez które poparzeni według autora błagają lekarzy, żeby ich zabili. Autor twierdzi, że spotyka się je od Hawajów po Florydę."},{"t":"7. Tężec","d":"Bakteryjne zakażenie układu nerwowego zaczyna się od skaleczenia, np. zardzewiałym narzędziem albo gwoździem. Po kilku dniach mięśnie sztywnieją, najpierw szczęka (stąd \"szczękościsk\"), potem szyja, ręce i nogi, a skurcze są bardzo bolesne. Autor zaleca aktualne szczepienie."},{"t":"6. Klasterowe bóle głowy","d":"Ból opisywany jak rozgrzany pręt wbijany w oko albo piła w czaszce, według autora ok. 100 razy gorszy od zwykłego bólu głowy. Ataki przychodzą codziennie przez tygodnie lub miesiące, potem znikają i wracają. W trakcie ludzie chodzą w kółko, uderzają głową o ścianę albo krzyczą."},{"t":"5. Ryba kamień (skorpena)","d":"Ryba kamień ukrywa się wśród skał i koralowców tak dobrze, że można na nią patrzeć i jej nie zauważyć. Nadepnięcie wstrzykuje jad, a ból opisywany jest jak jednoczesne miażdżenie, palenie i porażenie prądem. Niektórzy według autora prosili lekarzy o amputację nogi."},{"t":"4. Fibromialgia","d":"Przewlekła choroba z bólem w całym ciele, zmęczeniem mimo snu, nadwrażliwością na dotyk i mgłą mózgową; chorzy opisują ją jak oparzenie słoneczne całego ciała. Jest niewidoczna, więc chorych bierze się za przewrażliwionych. Według autora nie ma lekarstwa."},{"t":"3. Gympie-gympie","d":"Australijska roślina pokryta pustymi włoskami z silną neurotoksyną; przy otarciu włoski się łamią i wstrzykują ją w skórę. Ból jak użądlenie przez rój os trwa dni, tygodnie albo miesiące, a niektórzy czuli go nawet do 2 lat."},{"t":"2. Osa \"Kat\" (executioner wasp)","d":"Osa z Ameryki Środkowej i Południowej, według autora wielkości małego ptaka, do ok. 5 cm. Jej jad z neurotoksyną daje natychmiastowy ból na godziny, porównywany do uderzenia pociągu, potem gorączkę, poty, nudności i wymioty. To parazytoid: paraliżuje owady i składa w nich jaja."},{"t":"1. Mrówka-pocisk","d":"Nazwa od tego, że użądlenie ma przypominać postrzał; jad bywa nazywany najboleśniejszym na świecie, jak wyrywanie kości przez skórę, a ból trwa do 24 h. W plemieniu w Brazylii młodzi mężczyźni noszą rękawice pełne mrówek przez 10 minut, 20 razy w ciągu kilku miesięcy."}],"conclusion":"Natura i własne ciało potrafią zadać ból wykraczający poza wyobrażenie, a najgorsze w rankingu są użądlenia owadów.","factchecks":[{"claim":"Osa Polistes carnifex ma jad z poneratoksyną, jest wielkości małego ptaka i składa jaja w innych owadach.","verdict":"fałsz","note":"Poneratoksyna to toksyna mrówki-pocisku; ta osa ma do ok. 3,3 cm i nie pasożytuje.","src":[["Wikipedia (ang.): osa Polistes carnifex - hasło \"Polistes carnifex\"","https://en.wikipedia.org/wiki/Polistes_carnifex"],["Wikipedia (ang.): poneratoksyna - hasło \"Poneratoxin\"","https://en.wikipedia.org/wiki/Poneratoxin"]],"p":7},{"claim":"Mrówka-pocisk: ból do 24 h; rytuał rękawic 10 minut, 20 razy.","verdict":"prawda","note":"Najwyższa ocena (4+) w skali bólu Schmidta, ból do 24 h. Rytuał ludu Sateré-Mawé jest dobrze opisany.","src":[["Wikipedia (ang.): mrówka-pocisk - hasło \"Paraponera clavata\"","https://en.wikipedia.org/wiki/Paraponera_clavata"],["Wikipedia (ang.): skala bólu użądleń Schmidta - hasło \"Schmidt sting pain index\"","https://en.wikipedia.org/wiki/Schmidt_sting_pain_index"]],"p":8},{"claim":"Meduza Irukandji występuje od Hawajów po Florydę.","verdict":"półprawda","note":"Carukia barnesi żyje w Australii; na Hawajach i Florydzie podobny syndrom dają inne gatunki.","src":[["Wikipedia (ang.): zespół Irukandji - hasło \"Irukandji syndrome\"","https://en.wikipedia.org/wiki/Irukandji_syndrome"],["Wikipedia (ang.): meduza Carukia barnesi - hasło \"Carukia barnesi\"","https://en.wikipedia.org/wiki/Carukia_barnesi"]],"p":1},{"claim":"Gympie-gympie: ból może trwać miesiące.","verdict":"prawda","note":"Opisy przypadków i badanie toksyn (gympietydy, Science Advances 2020) potwierdzają długotrwały ból, ale relacje o latach są anegdotyczne.","src":[["Wikipedia (ang.): gympie-gympie (Dendrocnide moroides) - hasło \"Dendrocnide moroides\"","https://en.wikipedia.org/wiki/Dendrocnide_moroides"],["Gilding i in. 2020, Science Advances (DOI)","https://doi.org/10.1126/sciadv.abb8828"]],"p":6},{"claim":"Ryba kamień to najbardziej jadowita ryba świata.","verdict":"prawda","note":"Tak się ją powszechnie określa; istnieje antytoksyna, a zgony są rzadkie.","src":[["Wikipedia (ang.): ryby kamienne (Synanceia) - hasło \"Stonefish\"","https://en.wikipedia.org/wiki/Stonefish"]],"p":4},{"claim":"Kamienie nerkowe, klasterowe bóle głowy, tężec, fibromialgia bez lekarstwa.","verdict":"prawda","note":"Opisy zgodne z wiedzą medyczną. Fibromialgii nie da się wyleczyć, ale objawy łagodzi leczenie i ruch.","src":[["Wikipedia (ang.): klasterowy ból głowy - hasło \"Cluster headache\"","https://en.wikipedia.org/wiki/Cluster_headache"],["Wikipedia (ang.): fibromialgia - hasło \"Fibromyalgia\"","https://en.wikipedia.org/wiki/Fibromyalgia"],["WHO: tężec","https://www.who.int/news-room/fact-sheets/detail/tetanus"]],"p":null}],"bias":"Ranking subiektywny (bólu nie da się obiektywnie porównać). Punkt o osie-katu jest w dużej mierze zmyślony; reszta zgodna z faktami.","channel":"Chill Dude Explains","section":"Chill Dude Explains"},{"id":"fGm-ef-4PVk","title_pl":"Najlepsze i najgorsze ćwiczenia na klatkę","title":"The Best And Worst Chest Exercises (Ranked By Science)","channel":"Jeff Nippard","url":"https://www.youtube.com/watch?v=fGm-ef-4PVk","date":"2024-03-11","duration":904,"views":9964201,"section":"Sport","transcript":"youtube","added":"2026-11-06","tags":["Ciało i zdrowie","Siłownia","Trening"],"about":"Jeff Nippard rankinguje ruchy na klatkę; wygrywa wyciskanie na maszynie, przegrywa plate press.","intro":"Jeff Nippard ocenia ok. 20 ćwiczeń klatki. Bez dużego rozciągnięcia pod napięciem od razu grozi F. Liczą się też komfort barków i możliwość dokładania ciężaru.\n\nZaczyna od najsłabszych (hex press, plate press), przechodzi przez sztangę, hantle, dipsy i pompki, potem izolacje (pec deck, flye). Na końcu wybiera best of the best i worst of the worst.","points":[{"t":"F: hex i plate press","d":"**Hex press (hantle złączone na klatce) idzie do F: ramiona nie odchodzą w bok, więc nie ma głębokiego rozciągnięcia, a triceps przejmuje pracę.** Plate press to jeszcze bardziej niezręczna wersja tego samego pomysłu - też F.\n\nPullover z hantlem: teoretycznie angażuje pecs, ale Nippard i klienci czują głównie najszerszy - D jako ćwiczenie na klatkę."},{"t":"Wyciskania sztangą i hantlami","d":"**Płaskie wyciskanie sztangą to A (blisko S): łatwy overload, ale sztanga ogranicza rozciągnięcie względem hantli i u części osób męczy barki.** Skos głową w górę też A - badanie według filmu pokazało podobny wzrost środka/dołu jak płaskie plus lepszy górny pec.\n\nHantle płaskie i skośne: A (głębsze rozciągnięcie, ale u zaawansowanych trudniejszy overload)."},{"t":"Maszyna S, dipsy i pompki","d":"**Wyciskanie na maszynie to pierwsze S: stabilnie, da się pchać blisko upadku, dobre rozciągnięcie.** Dipsy A (ogromne rozciągnięcie, ale barki/klatka łatwo \"kradną\" tor). Deficit push-up A; plyometryczne pompki raczej pod moc, nie pod masę.\n\nGuillotine press (sztanga do szyi) F - zbędne ryzyko."},{"t":"Izolacje i werdykt","d":"**Pec deck / butterfly to drugie S: siedząco, stabilnie, mocne rozciągnięcie w rozwarciu ramion.** Leżące rozpiętki z hantlami mają sens biomechaniczny; standing cross-body flye bywa F/D gdy traci napięcie.\n\nBest: machine chest press (kategoria). Worst: plate press - \"ćwiczenie influencerskie\", by być innym."}],"conclusion":"Na klatkę stawiaj na głębokie rozciągnięcie i bezpieczny failure: maszyna + pec deck, ewentualnie sztanga/hantle. Hex/plate press i guillotine to strata czasu albo ryzyko.","factchecks":[{"claim":"Skos głową w górę buduje też środek/dół klatki podobnie jak płaskie.","verdict":"półprawda","note":"Są badania pokazujące podobny wzrost wielu regionów przy skosie, ale kąt i technika mocno wpływają; to nie unieważnia płaskiego wyciskania.","p":1,"src":[["PubMed: porównanie kątów wyciskania i hipertrofii klatki","https://pubmed.ncbi.nlm.nih.gov/31230110/"],["Wikipedia (ang.): bench press","https://en.wikipedia.org/wiki/Bench_press"]]},{"claim":"Dipsy mocno rozciągają klatkę przy pochyleniu tułowia.","verdict":"prawda","note":"Przy pochyleniu do przodu i łokciach w bok dipsy mocniej ładują pecs niż wersja wyprostowana pod triceps.","p":2,"src":[["Wikipedia (ang.): dip (exercise)","https://en.wikipedia.org/wiki/Dip_(exercise)"]]},{"claim":"Pec deck izoluje przywodzenie ramienia w poziomie (klatka).","verdict":"prawda","note":"Ruch to horizontal adduction w stawie barkowym - funkcja mięśnia piersiowego większego.","p":3,"src":[["Wikipedia (ang.): pectoralis major","https://en.wikipedia.org/wiki/Pectoralis_major"]]}],"bias":"S dla maszyny odzwierciedla lubienie bezpiecznego failure; bez maszyn werdykt mniej praktyczny. Badanie skosu bez pełnej bibliografii w napisach."},{"id":"ziYuxvxAw3U","title_pl":"9 najstarszych technologii, których naukowcy wciąż nie potrafią wyjaśnić","title":"9 Oldest Technologies Scientists Still Can’t Explain","url":"https://www.youtube.com/watch?v=ziYuxvxAw3U","date":"2024-03-10","duration":561,"views":1051283,"transcript":"youtube","added":"2026-11-03","tags":["Historia","Technika"],"about":"9 starożytnych technologii, których według autora naukowcy wciąż nie potrafią wyjaśnić ani odtworzyć.","intro":"Ranking 9 dawnych wynalazków i budowli, których według autora wciąż nie umiemy wyjaśnić ani odtworzyć. Są wśród nich rzymski puchar zmieniający kolor, elastyczne szkło i ogień grecki, skrzypce Stradivariego, mechanizm z Antykithiry, stal damasceńska, kamienne kule z Kostaryki, mury Sacsayhuamán w Peru i piramidy w Gizie. Autor często przedstawia legendy i domysły jako pewną historię.","points":[{"t":"9. Puchar Likurga","d":"Rzymski puchar z IV w.: pod światło świeci na czerwono, oglądany z przodu jest zielony. Rzymianie dodali do szkła niewidoczne cząstki złota i srebra, które zmieniają kolor zależnie od kierunku światła. Naukowcy według autora sądzą, że wyszło to przypadkiem, a odtworzyć to umiemy dopiero od niedawna."},{"t":"8. Rzymskie elastyczne szkło","d":"Legenda: wynalazca pokazał cesarzowi Tyberiuszowi miskę ze szkła, która po upuszczeniu tylko się wgniotła, a wgniecenie wyklepał młotkiem. Cesarz bał się spadku wartości złota i srebra, więc kazał go zabić. Autor przyznaje, że nie wiadomo, czy to prawda, a sekret zaginął z wynalazcą."},{"t":"7. Ogień grecki","d":"Mieszanina, która paliła się nawet na wodzie, a polewanie wodą miało ją wzmagać. Według autora używali jej Rzymianie: rzucali granaty z ogniem i pryskali nim z rur na wrogie statki. Przepis był tajemnicą państwową; historycy zgadują żywicę sosnową, wapno palone i inne składniki."},{"t":"6. Skrzypce Stradivariego","d":"Rodzina Stradivarich we Włoszech robiła skrzypce w latach 1650-1750. Mimo badań nikt nie umie dokładnie wyjaśnić ich brzmienia ani go odtworzyć; rodzina używała specjalnego drewna i tajnego przepisu. Kosztują miliony dolarów, kupuje się je jako inwestycję, a część skradziono i zaginęła."},{"t":"5. Mechanizm z Antykithiry","d":"Ok. 100 lat temu nurkowie znaleźli przy greckiej wyspie Antykithira wrak z bryłą brązu i drewna, według autora pierwszym analogowym komputerem. Przewidywał zaćmienia, prowadził kalendarz i wskazywał termin igrzysk. Coś równie złożonego pojawia się dopiero ok. 1200 lat później."},{"t":"4. Stal damasceńska","d":"Krzyżowcy spotkali u wojowników islamskich miecze, które przecinały pływającą chustkę, wyginały się pod dużym kątem i wracały bez szkody, z wzorem jak płynąca woda. Według autora sekret zaginął; naukowcy podejrzewają dodatek roślin do żelaza. Stal sprzedawano w Damaszku, ale pochodziła z Indii i Iranu."},{"t":"3. Kamienne kule z Kostaryki","d":"Ponad 300 kamiennych kul, niektóre do 15 ton i ponad 2 m średnicy, zrobiła nieistniejąca już kultura Diquís, obijając je kamieniami i polerując piaskiem. Cel nieznany: drogowskazy do domu wodza albo astronomia. W latach 30. XX w. przy karczowaniu pod banany część rozbito, szukając złota."},{"t":"2. Sacsayhuamán (Peru)","d":"Inkaska twierdza chroniąca Cusco, z polerowanych bloków po 100-120 ton dopasowanych tak, że nie wejdzie między nie kartka papieru. Autor odrzuca teorie o ogromnej soczewce i topieniu kamienia ogniskiem. Twierdza przetrwała trzęsienia ziemi, ale Hiszpanie rozbierali ją na materiał do budowy Cusco."},{"t":"1. Piramidy w Gizie","d":"Wielka Piramida to ok. 2,3 mln bloków, od kilku ton do wagi małego domu, a Egipcjanie nie mieli dźwigów ani taczek. Teorie: proste albo zygzakowate rampy, spławianie kamieni Nilem, a nawet zaginione maszyny. Najczęściej wraca wersja z miedzianymi narzędziami, wodą i armią robotników pracujących latami."}],"conclusion":"Dawne cywilizacje miały zaskakującą wiedzę, a część ich technik pozostaje dla nas zagadką.","factchecks":[{"claim":"Puchar Likurga zmienia kolor dzięki nanocząstkom.","verdict":"prawda","note":"Złoto i srebro w nanocząstkach potwierdziło British Museum; efekt jest wyjaśniony.","src":[["British Museum: Puchar Likurga","https://www.britishmuseum.org/collection/object/H_1958-1202-1"],["Wikipedia (ang.): Puchar Likurga - hasło \"Lycurgus Cup\"","https://en.wikipedia.org/wiki/Lycurgus_Cup"]],"p":0},{"claim":"Elastyczne szkło rzymskie.","verdict":"nie da się sprawdzić","note":"Historia pochodzi tylko z anegdot Pliniusza Starszego i Petroniusza; nie ma żadnego artefaktu. Film zaznacza, że to legenda.","src":[["Wikipedia (ang.): szkło elastyczne (vitrum flexile) - hasło \"Flexible glass\"","https://en.wikipedia.org/wiki/Flexible_glass"]],"p":1},{"claim":"Ogień grecki wynaleźli Rzymianie, a jego przepis zaginął.","verdict":"półprawda","note":"Używało go Bizancjum od ok. 672 r.; skład faktycznie nie jest znany.","src":[["Wikipedia (ang.): ogień grecki - hasło \"Greek fire\"","https://en.wikipedia.org/wiki/Greek_fire"]],"p":2},{"claim":"Skrzypiec Stradivariego nie da się odtworzyć i brzmią wyjątkowo.","verdict":"przesada","note":"W ślepych testach (PNAS 2012, 2014) soliści nie odróżniali Stradivariusów od nowych skrzypiec.","src":[["Fritz i in. 2014, PNAS (DOI)","https://doi.org/10.1073/pnas.1323367111"],["Wikipedia (ang.): instrumenty Stradivariego - hasło \"Stradivarius\"","https://en.wikipedia.org/wiki/Stradivarius"]],"p":3},{"claim":"Mechanizm z Antykithiry: znaleziony ok. 100 lat temu, przewidywał zaćmienia, niezrównany przez wieki.","verdict":"prawda","note":"Działanie mechanizmu jest dziś dobrze zrekonstruowane.","src":[["Wikipedia (ang.): mechanizm z Antykithiry - hasło \"Antikythera mechanism\"","https://en.wikipedia.org/wiki/Antikythera_mechanism"],["Freeth i in. 2021, Scientific Reports","https://www.nature.com/articles/s41598-021-84310-w"]],"p":4},{"claim":"Stal damasceńska to zaginiony sekret.","verdict":"przesada","note":"Wzory stali wootz odtworzono w latach 90., a nanorurki znaleziono w jednym ostrzu.","src":[["Wikipedia (ang.): stal damasceńska - hasło \"Damascus steel\"","https://en.wikipedia.org/wiki/Damascus_steel"],["Reibold i in. 2006, Nature","https://www.nature.com/articles/444286a"]],"p":5},{"claim":"Kule z Kostaryki: ponad 300, do kilkunastu ton, cel nieznany.","verdict":"prawda","note":"Kule kultury Diquís obrabiano kamieniem i ścieraniem; cel jest niepewny, ale nie \"niewytłumaczalny\".","src":[["Wikipedia (ang.): kamienne kule z Kostaryki - hasło \"Stone spheres of Costa Rica\"","https://en.wikipedia.org/wiki/Stone_spheres_of_Costa_Rica"],["UNESCO: osady wodzów Diquís z kamiennymi kulami","https://whc.unesco.org/en/list/1453/"]],"p":6},{"claim":"Bloki Sacsayhuamán ważą po 100-120 ton.","verdict":"przesada","note":"Największy blok szacuje się na ok. 120-130 t, ale większość jest znacznie mniejsza. Precyzyjne dopasowanie jest prawdą.","src":[["Wikipedia (ang.): Sacsayhuamán","https://en.wikipedia.org/wiki/Sacsayhuam%C3%A1n"]],"p":7},{"claim":"Nie wiadomo, jak zbudowano piramidy.","verdict":"przesada","note":"Papirusy z Wadi al-Dżarf, ślady ramp i osady robotników wyjaśniają budowę; \"megamaszyny\" to spekulacja.","src":[["Wikipedia (ang.): Dziennik Merera - hasło \"Diary of Merer\"","https://en.wikipedia.org/wiki/Diary_of_Merer"],["Fall i in. 2014, PRL (DOI)","https://doi.org/10.1103/PhysRevLett.112.175502"]],"p":8}],"bias":"Tendencyjny tytuł: większość pozycji naukowcy dobrze rozumieją, a film sugeruje nawet zaginione maszyny.","channel":"Chill Dude Explains","section":"Chill Dude Explains"},{"id":"FAdmpAZTH_M","title_pl":"Matematyczny błąd, który wyjdzie na jaw za 1200 lat","title":"The 1,200 Year Maths Mistake","channel":"Stand-up Maths","url":"https://www.youtube.com/watch?v=FAdmpAZTH_M","date":"2024-02-22","duration":1150,"views":3404042,"section":"Ciekawostki","transcript":"youtube","added":"2026-11-03","tags":["Matematyka","Kultura"],"about":"Matt Parker jedzie do Wemding, gdzie od 1993 r. powstaje Piramida Czasu, i znajduje w planie klasyczny błąd o jeden.","intro":"W bawarskim Wemding co 10 lat dokłada się jeden betonowy blok do piramidy, która ma powstawać 1200 lat. Matt Parker (Stand-up Maths) z Ayliean MacDonald ogląda wstawianie czwartego bloku w 2023 r., tłumaczy błąd \"płotu i słupków\", który sprawi, że ostatni blok trafi na miejsce 10 lat za wcześnie, i wymyśla żartobliwe poprawki.","points":[{"t":"Piramida Czasu","d":"Zeitpyramide artysty Manfreda Labera uczciła 1200-lecie Wemding, pierwszy raz wzmiankowanego w 793 r. Skoro ludzkie życie jest za krótkie, by poczuć 1200 lat, dzieło ma powstawać właśnie tyle."},{"t":"120 bloków","d":"Piramida ma warstwy 8 x 8, 6 x 6, 4 x 4 i 2 x 2, czyli 64 + 36 + 16 + 4 = 120 bloków, ustawionych dokładnie jeden na drugim. Pierwszy wstawiono w 1993 r., kolejne w 2003, 2013 i 2023 r."},{"t":"Czas na ludzką skalę","d":"Parker miał 12 lat przy pierwszym bloku i 42 przy czwartym. Pojedyncze bloki mierzy się życiem człowieka, a całość pokazuje skalę, której nie da się ogarnąć."},{"t":"Błąd płotu i słupków","d":"Płot z 4 przęseł ma 5 słupków. W programowaniu to klasyczny błąd o jeden: od 8:00 do 12:00 są 4 godziny, ale od 8. do 12. piętra jest 5 pięter."},{"t":"10 lat za wcześnie","d":"Wstawiając 120 bloków co 10 lat od 1993 r., ostatni trafi na miejsce w 3183 r., a nie w 3193 r., na 2400-lecie miasta. Do tej daty trzeba by 121 bloków."},{"t":"Wstawianie bloku","d":"Dźwig opuścił 6,5 t betonu na zaprawę w drewnianym szablonie, przy klarnecie grającym utwory o czasie i przemowach lokalnych władz. Córka artysty i twórca aplikacji AR nie przejmowali się błędem: ostatnią dekadę można świętować."},{"t":"Poprawki na 121","d":"Parker proponuje drugą, mniejszą piramidę z kwadratów liczb nieparzystych lub odwróconą na szczycie. Ayliean wymyśla spiralę z liczb trójkątnych: 2 x 55 + 11 = 121, a 21 liczb to też liczba trójkątna."},{"t":"Błąd jako część dzieła","d":"Ostatecznie Parker uważa, że błędu nie należy poprawiać, bo to plan jednego człowieka wykonywany przez dziesiątki pokoleń. Gdy minie pierwszy rząd, za ok. 40 lat, nikt nie zechce przerwać tradycji."},{"t":"Długie projekty się udają","d":"Świątynię Zeusa w Atenach zaczęli Grecy, porzucili ją na wieki, a dokończył cesarz Hadrian. Rzymski beton przetrwał ponad 1200 lat, więc materiał wytrzyma; zmienić się może co najwyżej technika."}],"conclusion":"Piramida Czasu skończy się 10 lat przed planowaną rocznicą, ale to błąd, który zostanie świętowany przez dekadę.","factchecks":[{"claim":"Zeitpyramide w Wemding to dzieło Manfreda Labera, w którym co 10 lat dokłada się blok od 1993 r.","verdict":"prawda","note":"Piramida ma 120 bloków i ma być ukończona w 3183 r.","p":[0,1],"src":[["Wikipedia (ang.): Piramida Czasu - hasło \"Zeitpyramide\"","https://en.wikipedia.org/wiki/Zeitpyramide"]]},{"claim":"Wemding wzmiankowano po raz pierwszy w 793 r.","verdict":"prawda","note":"Miasto wzmiankowano za Karola Wielkiego i świętowało 1200-lecie w 1993 r.","p":0,"src":[["Wikipedia (ang.): Piramida Czasu - hasło \"Zeitpyramide\"","https://en.wikipedia.org/wiki/Zeitpyramide"]]},{"claim":"120 bloków co 10 lat od 1993 r. daje ostatni blok w 3183 r., a nie 3193 r.","verdict":"prawda","note":"1993 + 119 x 10 = 3183; to klasyczny błąd płotu i słupków.","p":[3,4],"src":[["Wikipedia (ang.): błąd o jeden - hasło \"Off-by-one error\"","https://en.wikipedia.org/wiki/Off-by-one_error"]]},{"claim":"Świątynię Zeusa Olimpijskiego w Atenach ukończył cesarz Hadrian.","verdict":"prawda","note":"Budowę zaczęto w VI w. p.n.e., a ukończono w II w. n.e., ok. 638 lat później.","p":8,"src":[["Wikipedia (ang.): Olimpiejon - hasło \"Temple of Olympian Zeus, Athens\"","https://en.wikipedia.org/wiki/Temple_of_Olympian_Zeus,_Athens"]]}],"bias":"Lekki i rzetelny; rachunek łatwo sprawdzić. Druga połowa to żartobliwe pomysły i rozmowy."},{"id":"rW-I3p6SRAc","title_pl":"10 kategorii zapachów do małej, zrównoważonej kolekcji","title":"The 10 'Categories' Every Fragrance Collector Needs To Own | Men's Cologne/Perfume Review 2024","channel":"School of Scent","url":"https://www.youtube.com/watch?v=rW-I3p6SRAc","date":"2024-02-07","duration":674,"views":42524,"section":"Moda","transcript":"youtube","added":"2026-11-04","tags":["Styl","Perfumy","Kolekcja"],"about":"School of Scent układa 10 flakonów w pięciu scenariuszach: uniwersalne, biuro, lato, romantyczny wieczór i głośne wyjścia.","intro":"Autor School of Scent przekonuje, by zbierać jakość zamiast ilości, i pokazuje przykładową dziesiątkę: po dwa zapachy uniwersalne, biurowe, wiosenno-letnie, na spokojny wieczór i na głośniejsze wyjścia. To nie \"10 na całe życie\", tylko szablon kategorii do własnego doboru.","points":[{"t":"Uniwersalne (2)","d":"1) bezpieczny daily: Dior Sauvage Parfum - spokojniejszy, bardziej naturalny niż EDT/Elixir, ok. 10 h, średnia projekcja. 2) seksowny daily: Bond No. 9 Lafayette Street (jabłko, przyprawy, amber) lub alternatywy jak Bleu de Chanel EDP."},{"t":"Spokojny wieczór (2)","d":"Bezpieczny: Maison Margiela Jazz Club (tytoń, amber, korzenny). Na specjalną okazję: Tom Ford Tobacco Vanille (ciepły kakao-tytoń-wanilia) lub Angel's Share / Naos."},{"t":"Biuro (2)","d":"Casual: Chanel Allure Homme Sport Eau Extreme (miętowo-kremowy). Poważniejszy dzień/rozmowa o pracę: Dior Homme Parfum, Terre d'Hermès Grey Vétiver lub Chanel Platinum Égoïste - klasyczny, \"barberski\" ton."},{"t":"Głośne wyjścia (2)","d":"Casual party: Azzaro The Most Wanted (toffee-amber-woody) zamiast nudnego Eros. Luksusowo głośny: Amouage Interlude Black Iris (fougère-amber, dym, iris; 14-16 h) lub Black Afgano / Red Tobacco."},{"t":"Wiosna/lato (2)","d":"Casual: klasyczny cytrusowo-musky aquatic na co dzień (ok. 6 h; w filmie jako summer daily) lub Light Blue Intense / Allure Homme Sport 2021. \"Wystrojony\": Xerjoff Naxos (cytrus, kawa, amber, rum) albo Burlington 1819 / Xerjoff 40 Knots."},{"t":"Opcjonalne rozszerzenie","d":"Do 12 flakonów można dodać oud i skórę albo gourmand, jeśli zabrakło ich w dziesiątce - żeby pokryć jeszcze inne style."}],"conclusion":"Traktuj to jako mapę okazji, nie checklistę flakonów; wybierz własne zapachy pasujące do tych pięciu scenariuszy.","factchecks":[{"claim":"Sauvage Parfum jest spokojniejszą, lepiej zblendowaną wersją linii Sauvage.","verdict":"nie da się sprawdzić","note":"To opinia recenzenta; oficjalne nuty i stężenia różnią się, ale \"lepsze\" to kwestia gustu.","p":0,"src":[["Fragrantica: Dior Sauvage Parfum","https://www.fragrantica.com/perfume/Dior/Sauvage-Parfum-51755.html"]]},{"claim":"Maison Margiela Jazz Club to tytoniowo-amberowy zapach z linii Replica.","verdict":"prawda","note":"Oficjalnie opisywany jako warm, spicy, with tobacco and rum accords w serii Replica.","p":1,"src":[["Fragrantica: Jazz Club Maison Martin Margiela","https://www.fragrantica.com/perfume/Maison-Martin-Margiela/Jazz-Club-28681.html"]]},{"claim":"Tom Ford Tobacco Vanille to warm spicy z wanilią i tytoniem.","verdict":"prawda","note":"Zgodne z powszechnymi piramidami nut: tytoń, wanilia, kakao, przyprawy.","p":1,"src":[["Fragrantica: Tom Ford Tobacco Vanille","https://www.fragrantica.com/perfume/Tom-Ford/Tobacco-Vanille-1825.html"]]}],"bias":"Subiektywna lista zakupowa z naciskiem na popularne designery i niszę; prośba o subskrypcję w środku filmu."},{"id":"hmHhsg7h4g0","title_pl":"10 powodów, dla których w średniowieczu uznano by cię za czarownicę","title":"10 Reasons You'd Be Called a Witch in The Middle Ages","url":"https://www.youtube.com/watch?v=hmHhsg7h4g0","date":"2024-01-02","duration":544,"views":2194394,"transcript":"youtube","added":"2026-11-03","tags":["Historia","Mity"],"about":"Humorystyczna lista 10 zachowań i cech, za które w \"średniowieczu\" można było zostać oskarżonym o czary.","intro":"Żartobliwa lista 10 zachowań i cech, za które według autora w \"średniowieczu\" można było zostać oskarżonym o czary. Są wśród nich znamiona, lunatykowanie, gwizdanie, leworęczność i ziewanie, a także koty, kichnięcie kota, warzenie piwa, zbyt dobry ser i jajka z dwoma żółtkami. Autor opisuje to scenkami z wymyślonymi sąsiadami, a przy piwie tłumaczy, skąd wziął się obraz czarownicy z kotłem i miotłą.","points":[{"t":"Znamiona","d":"W XV w. znamiona nazywano znakiem diabła i wierzono, że są znieczulone magią. Łowcy czarownic kłuli je igłami, a brak bólu oznaczał winę; niektórzy używali chowanych igieł. Reakcję na ból też uznawano za udawanie."},{"t":"Lunatykowanie","d":"Ktoś, kto chodzi nocą z zamkniętymi oczami i mamrocze, według autora wyglądał jak rozmawiający z diabłem. Szept przez sen mógł uchodzić za zaklęcie, a gdy następnego dnia coś się stało, np. koń kowala się przeziębił, winny był lunatyk."},{"t":"Gwizdanie","d":"Niektóre melodie miały przywoływać wiatr zdolny zerwać dach albo zważyć mleko. Liczyło się też miejsce: gwizdanie przy pewnych drzewach oznaczało spotkanie z czarownicami, przy cmentarzu budzenie zmarłych, a w kościele było zakazane. Wierzono też, że melodie pozwalają porozumiewać się ze zwierzętami."},{"t":"Leworęczność","d":"Ponieważ większość ludzi jest praworęczna, a diabła uważano za mańkuta, leworęcznych podejrzewano o czary. Według autora ich słowo nie miało wagi w sądzie, bo uznawano, że mówi przez nich diabeł."},{"t":"Ziewanie","d":"Wierzono, że przy ziewnięciu dusza może uciec, a w jej miejsce wejdą demony. Autor wiąże to z dżumą, której objawem miało być częste ziewanie. Przy ziewaniu robiono znak krzyża nad ustami, a za niemowlęta robili to dorośli; ziewanie bez znaku krzyża było podejrzane."},{"t":"Posiadanie kotów","d":"Zwłaszcza czarne koty, nocne i tajemnicze, uchodziły za pomocników diabła, więc ich właścicielkę mogła oskarżyć sąsiadka. Autor zwraca uwagę na ironię: koty ograniczały populację szczurów, a więc ryzyko szerzenia się dżumy."},{"t":"Kichnięcie kota obok ciebie","d":"Skoro kot był przyjacielem diabła, to kichnięcie kota obok ciebie oznaczało, że kot z tobą rozmawia. Według autora z tego wynikało, że i ty kumplujesz się z diabłem, czyli jesteś czarownicą."},{"t":"Warzenie piwa","d":"W średniowieczu piwo warzyły głównie kobiety. Za dobre piwo budziło zazdrość i plotki o zaklęciach nad kotłem. Wyposażenie piwowarki to duży kocioł, kij do mieszania i koty pilnujące ziarna przed myszami, czyli według autora gotowy zestaw stereotypowej czarownicy."},{"t":"Za dobry ser","d":"Gdy w wiosce jeden ser zawsze wychodził idealny, a u sąsiadów jak guma czy cegła, ludzie, nie znając roli bakterii i temperatury, podejrzewali czary. Wierzono, że czarownica umie \"ukraść\" jakość cudzego sera i dodać ją do swojego."},{"t":"Jajka z dwoma żółtkami","d":"Autor umieszcza to w XVI-wiecznej Francji: jajka z dwoma żółtkami uchodziły za nienaturalne. Właścicielkę kur podejrzewano, że rzuciła na nie urok albo używa takich jajek w rytuałach."}],"conclusion":"Przesądy i brak wiedzy sprawiały, że niemal każde odstępstwo od normy mogło skończyć się procesem o czary.","factchecks":[{"claim":"Polowania na czarownice to średniowiecze (XV wiek).","verdict":"półprawda","note":"Masowe procesy to głównie lata 1450-1750, czyli wczesna nowożytność, nie średniowiecze.","src":[["Wikipedia (ang.): procesy czarownic w epoce nowożytnej - hasło \"Witch trials in the early modern period\"","https://en.wikipedia.org/wiki/Witch_trials_in_the_early_modern_period"]],"p":null},{"claim":"\"Znak diabła\" i kłucie igłami, także chowanymi.","verdict":"prawda","note":"Kłucie (witch-pricking) jest dobrze udokumentowane, w tym oszustwa z chowanymi igłami.","src":[["Wikipedia (ang.): kłucie czarownic - hasło \"Witch pricking\"","https://en.wikipedia.org/wiki/Witch_pricking"],["Wikipedia (ang.): znak diabła - hasło \"Devil's mark\"","https://en.wikipedia.org/wiki/Devil%27s_mark"]],"p":0},{"claim":"Leworęczni byli oskarżani o czary, a ich zeznania nie miały wagi w sądzie.","verdict":"nie da się sprawdzić","note":"Lewa strona kojarzyła się ze złem, ale brak źródeł, że leworęczność była typowym zarzutem.","src":[["Wikipedia (ang.): uprzedzenia wobec leworęcznych - hasło \"Bias against left-handed people\"","https://en.wikipedia.org/wiki/Bias_against_left-handed_people"]],"p":3},{"claim":"Ziewanie było objawem dżumy, stąd znak krzyża przy ziewaniu.","verdict":"nie da się sprawdzić","note":"Zwyczaj żegnania ust istniał, ale związek z dżumą to anegdota bez źródeł.","src":[["Wikipedia (ang.): ziewanie (kultura) - hasło \"Yawn\"","https://en.wikipedia.org/wiki/Yawn"]],"p":4},{"claim":"Koty kojarzono z diabłem; ich tępienie nasiliło dżumę.","verdict":"półprawda","note":"Bulla z 1233 r. łączyła koty z diabłem, ale wpływ tępienia kotów na dżumę to mit.","src":[["Wikipedia (ang.): bulla Vox in Rama - hasło \"Vox in Rama\"","https://en.wikipedia.org/wiki/Vox_in_Rama"],["Wikipedia (ang.): czarny kot - hasło \"Black cat\"","https://en.wikipedia.org/wiki/Black_cat"]],"p":5},{"claim":"Kobiety piwowarki (alewives) dały początek stereotypowi czarownicy z kotłem, miotłą i kotem.","verdict":"półprawda","note":"Kobiety dominowały w piwowarstwie, ale historycy kwestionują związek ze stereotypem czarownicy.","src":[["Wikipedia (ang.): piwowarki (alewives) - hasło \"Alewife (trade)\"","https://en.wikipedia.org/wiki/Alewife_(trade)"]],"p":7},{"claim":"Lunatykowanie, gwizdanie, kichnięcie kota, ser, jajka z dwoma żółtkami jako powody oskarżeń.","verdict":"nie da się sprawdzić","note":"Przesądy o \"kradzieży\" mleka istniały, ale konkretne przykłady z filmu nie są udokumentowane.","src":[["Wikipedia (ang.): czary (przesądy ludowe) - hasło \"Witchcraft\"","https://en.wikipedia.org/wiki/Witchcraft"]],"p":null}],"bias":"Rozrywkowy, bez źródeł. Większość punktów to anegdoty z internetu podane jako fakty, a epoka jest pomylona (to głównie XVI-XVII wiek, nie średniowiecze).","channel":"Chill Dude Explains","section":"Chill Dude Explains"},{"id":"wCxRHueX6jQ","title_pl":"Pompa, która działa dzięki korkom powietrznym","title":"Wirtz pumps are really clever","channel":"Steve Mould","url":"https://www.youtube.com/watch?v=wCxRHueX6jQ","date":"2023-10-10","duration":725,"views":19166829,"section":"Ciekawostki","transcript":"youtube","added":"2026-11-03","tags":["Fizyka","Inżynieria"],"about":"Steve Mould buduje pompę spiralną Wirtza, wyjaśnia, jak sumują się korki powietrzne, i poprawia błąd z filmu o labiryntach.","intro":"Spirala wysokości 20 cm, obracana tak, by co obrót zaczerpnąć trochę wody, potrafi podnieść wodę znacznie wyżej niż sama ma. Steve Mould pokazuje, że działa to dzięki korkom powietrznym, zwykle zmorze inżynierów, odwiedza ogród Jonathana Deana z działającą pompą i buduje poprawioną wersję.","points":[{"t":"Poprawka błędu","d":"W filmie o wodzie rozwiązującej labirynty Mould tłumaczył zatrzymanie przepływu napięciem powierzchniowym. Widzowie, m.in. Corey Albers, wykazali na rysunkach, że winne są korki powietrzne."},{"t":"Korki się sumują","d":"W rurce z 3 odcinkami w kształcie U z wodą i 3 w kształcie odwróconego U z powietrzem każdy słup wody musi pchać kolejny. Żeby woda spłynęła, słup na wejściu musi być wyższy niż suma wszystkich przeszkód."},{"t":"Pompa Wirtza","d"
