órych oryginał według autora wciąż wygrywa z klonami.","intro":"Omar z School of Scent odpowiada na pytanie o klona Penhaligon's: według niego ten dom słabo się klonuje, więc lepiej wziąć małe 30 ml oryginału. Stąd lista marek, przy których klony istnieją, ale rzadko czynią oryginał zbędnym, w przeciwieństwie do LV Imagination czy Creed Aventus.\n\nFilm to dziesiątka domów z przykładami flakonów i subiektywną oceną składników oraz blendów. W środku jest też blok sponsorski Gissada jako własne podejście do DNA Sauvage Elixir, nie jako czysty klon.","points":[{"t":"Prada i Chanel","d":"**Prada według Omara jest kontrowersyjna: stare klasyki (Amber Pour Homme, L'Homme Intense, Luna Rossa) trudno dobrze sklonować, nowe w stylu Paradox już nie.** Jeśli klon byłby rewelacyjny, społeczność znałaby go jak Marwa przy Imagination.\n\nChanel (Bleu de Chanel): próbował Club de Nuit Iconic, Reyane Nocturno Elixir i Riffs Seasons Drift. Tanie i \"niezłe\", ale nie zastępują oryginału. Argument: własne naturals, in-house perfumiarze i skala."},{"t":"Guerlain i detour Gissada","d":"**Guerlain (L'Homme Ideal EDP) uważa za uczciwie wyceniony francuski elegancki blend; rzadko bywa klonowany, co samo coś mówi.** Diora świadomie pomija na liście, bo linia Sauvage ma dobre klony.\n\nSponsor: Gissada Ambassador Intense to według niego najlepszy rynkowy substytut Sauvage Elixir (owocowszy, lżejszy). Wymienia też Titanium i Wilmer oraz discovery set z linku w opisie."},{"t":"Tom Ford i Penhaligon's","d":"**Tom Ford: pomija łatwe Tobacco Vanille i Tuscan Leather, ale Noir Extreme, Grey Vetiver, Ombre Leather i Oud Wood według niego nie mają tanich, wybitnych klonów.** Jedyne sensowne \"oud wood\" to podobnie drogi Carved Oud.\n\nPenhaligon's (Sartorial): Halfeti ma klony, ale słabe wobec oryginału; najlepszy \"klon\" to własny Blazing Mr Sam. Plus: brytyjska elegancja; minus: bywa słaba trwałość."},{"t":"MFK i Marc-Antoine Barrois","d":"**Maison Francis Kurkdjian: Lattafa Eternal Oud nie dogania Grand Soir; Baroque Satin Oud jest OK cenowo, ale nie zastępuje Oud Satin Mood.** Baccarat Rouge według niego najlepiej łapie podobnie drogi Imperium Trajan. Siła MFK: proste kompozycje na drogich akordach.\n\nMarc-Antoine Barrois (Ganymede): Bois Imperial Bischa jest najczęstszym porównaniem, ale Ganymede i tak wygrywa. Bogate, abstrakcyjne; wystarczy 30 ml i 2-3 spryski."},{"t":"Xerjoff, Crivelli, Amouage","d":"**Xerjoff: Attique dobrze łapie Naxos i są klony Torino 21, ale przy ogromnym katalogu dom w większości \"trudny\".** Maison Crivelli (Oud Maracuja): French Avenue próbuje, lecz nie dogania gęstości.\n\nAmouage na szczycie: Jubilation XXV według niego nie do zastąpienia; Afnan Supremacy In Sense to dobry klon Interlude Man, przydatny bo oryginał jest drogi i trudny w noszeniu."},{"t":"Zasada wyboru","d":"**Rada praktyczna: klonuj domy, które klony robią dobrze, a oszczędzaj na oryginałach tam, gdzie klony zawodzą.** Lista jest subiektywna i zapowiada kontrowersje; Omar prosi o własne typowanie marek \"odpornych na klony\" w komentarzach."}],"conclusion":"School of Scent broni tezy, że przy części niszowych i designerskich domów cena oryginału nadal kupuje składniki i blend nieosiągalny w klonie. Jednocześnie wprost reklamuje Gissada i zostawia furtkę: społeczność może znać lepsze duplikaty.","factchecks":[{"claim":"Creed Aventus ma klony uważane za bliskie oryginałowi","verdict":"prawda","note":"W społeczności zapachowej Aventus należy do najczęściej i najskuteczniej klonowanych DNA.","p":null,"src":[["Wikipedia (ang.): Creed (perfumy) - hasło \"Creed (perfume)\"","https://en.wikipedia.org/wiki/Creed_(perfume)"],["Wikipedia (ang.): Aventus - hasło \"Aventus\"","https://en.wikipedia.org/wiki/Aventus"]]},{"claim":"Chanel używa wyłącznie własnych naturals i in-house twórców","verdict":"półprawda","note":"Chanel inwestuje w własne uprawy i perfumiarzy, ale uproszczenie \"wyłącznie własne pola\" jest marketingowe.","p":0,"src":[["Wikipedia (ang.): Chanel - hasło \"Chanel\"","https://en.wikipedia.org/wiki/Chanel"]]},{"claim":"Amouage jest obiektywnie najlepszym domem w branży","verdict":"przesada","note":"To gust autora; Amouage jest cenione, ale \"numer jeden w całej branży\" nie da się ustalić obiektywnie.","p":4,"src":[["Wikipedia (ang.): Amouage - hasło \"Amouage\"","https://en.wikipedia.org/wiki/Amouage"]]},{"claim":"Bois Imperial to najlepszy klon Ganymede według społeczności","verdict":"półprawda","note":"Często porównywane przez wspólnego perfumiarza, ale Bois Imperial to osobna kompozycja, nie literalny klon.","p":3,"src":[["Wikipedia (ang.): Quentin Bisch - hasło \"Quentin Bisch\"","https://en.wikipedia.org/wiki/Quentin_Bisch"]]}],"bias":"Subiektywny ranking z blokiem sponsorskim Gissada. Brak ślepych testów; \"brak znanego klona\" mylone bywa z \"brak dobrego klona\"."},{"id":"wkyBcnF9un4","title_pl":"Najdziwniejsze stany materii: od Rydberga do BEC","title":"The Most Unusual States of Matter Scientists Have Created","channel":"Some Guy Who Knows Stuff","url":"https://www.youtube.com/watch?v=wkyBcnF9un4","date":"2026-11-04","duration":1529,"views":2124,"section":"Technologie","transcript":"whisper","added":"2026-11-05","tags":["Nauka","Technika"],"about":"Some Guy Who Knows Stuff: ranking 10 niezwykłych stanów materii - superfluids, QGP, time crystals, BEC i inne.","intro":"Some Guy Who Knows Stuff to kanał z rankingami ciekawostek naukowych. Tu odlicza od 10 do 1 stany materii, które wykraczają poza szkolne ciało stałe, ciecz i gaz.\n\nKażdy punkt ma krótką definicję, warunek (temperatura, ciśnienie, akcelerator) i po co fizycy to badają. Od materii Rydberga i superjonowego lodu po kwarkowo-gluonową plazmę, kryształy czasu i kondensat Bosego-Einsteina.","points":[{"t":"10-8: Rydberg, superfluids, lód superjonowy","d":"**Wysoko wzbudzone atomy Rydberga tworzą luźne struktury o ogromnych orbitach; hel-4 poniżej ok. 2,17 K staje się superfluidem bez zwykłej lepkości; a w wnętrzach Uranu i Neptuna woda może być lodem superjonowym.** W tym lodzie tlen tworzy krystaliczną siatkę, a jony wodoru płyną przez nią i przewodzą prąd.\n\nDowody na lód superjonowy pochodzą m.in. z eksperymentów uderzeniowych z 2018. Superfluidy bada się też w ultrazimnych gazach atomowych."},{"t":"7-5: supersolid, QGP, kondensat fermionowy","d":"**Supersolid łączy porządek krystaliczny z cechami superfluidu; kwarkowo-gluonowa plazma (QGP) to stan, w którym kwarki i gluony nie są uwięzione w protonach i neutronach.** QGP odtwarza się w LHC zderzając jądra ołowiu: mikroskopijne fireballe o temperaturach bilionów stopni, zachowujące się jak ciecz o bardzo niskiej lepkości.\n\nKondensat fermionowy powstaje, gdy fermiony w parach zachowują się jak złożone bozony - pokrewne nadprzewodnictwu."},{"t":"4-2: kryształ czasu, liquid glass, supercritical","d":"**Kryształ czasu (Frank Wilczek, 2012) powtarza wzorzec w czasie; dyskretne time crystals reagują z okresem dłuższym niż impulsy napędzające.** To nie perpetuum mobile - wersje napędzane biorą energię z zewnątrz.\n\nLiquid glass (badanie koloidów 2021) to uwięzienie ruchu przy konkurujących lokalnych uporządkowaniach. Powyżej punktu krytycznego (woda: ok. 374°C i 22,1 MPa) zanika granica ciecz-gaz: supercritical CO2 używa się m.in. do dekofeinizacji kawy."},{"t":"1: kondensat Bosego-Einsteina","d":"**W BEC wiele atomów bozonowych zajmuje ten sam najniższy stan kwantowy; przewidziane w latach 20. XX w., uzyskane w 1995 w Boulder i MIT.** To nie zamrożony gaz: atomy zostają rozrzedzone, ale falowa funkcja staje się makroskopowa - widać interferencję i kolektywne wzbudzenia.\n\nRóżnica względem kondensatu fermionowego: bozony dzielą stan wprost, fermiony potrzebują parowania. BEC służy do badań superfluidości, symulacji kwantowych i precyzyjnych pomiarów."}],"conclusion":"Autor pokazuje, że stan materii to nie tylko trzy szkolne kategorie: przy ekstremach kwantowych i planetarnych materia zachowuje się kolektywnie i łączy cechy ciała stałego z cieczą. Ranking kończy się na BEC jako narzędziu do badania reguł kwantowych w skali widocznej.","factchecks":[{"claim":"Hel-4 staje się superfluidem poniżej ok. 2,17 K.","verdict":"prawda","note":"Punkt lambda helu-4 wynosi około 2,17 K; poniżej ciecz traci zwykłą lepkość.","p":0,"src":[["Wikipedia (ang.): superfluidność - hasło \"Superfluidity\"","https://en.wikipedia.org/wiki/Superfluidity"]]},{"claim":"BEC w rozrzedzonych gazach atomowych uzyskano w 1995.","verdict":"prawda","note":"Pierwsze BEC w gazach alkalicznych: Cornell/Wieman (Boulder) i Ketterle (MIT) w 1995.","p":3,"src":[["Wikipedia (ang.): kondensat BEC - hasło \"Bose-Einstein condensate\"","https://en.wikipedia.org/wiki/Bose-Einstein_condensate"]]},{"claim":"Punkt krytyczny wody: ok. 374°C i 22,1 MPa.","verdict":"prawda","note":"Standardowe wartości punktu krytycznego wody to ok. 374°C i 22,1 MPa.","p":2,"src":[["Wikipedia (ang.): fluid nadkrytyczny - hasło \"Supercritical fluid\"","https://en.wikipedia.org/wiki/Supercritical_fluid"]]},{"claim":"Ideę time crystal zaproponował Frank Wilczek w 2012.","verdict":"prawda","note":"Wilczek wprowadził pojęcie; realizacje to zwykle napędzane discrete time crystals.","p":2,"src":[["Wikipedia (ang.): kryształ czasu - hasło \"Time crystal\"","https://en.wikipedia.org/wiki/Time_crystal"]]}],"bias":"Format rankingu upraszcza subtelności (np. Rydberg matter vs Rydberg gas). Ton popularyzatorski; sponsorów w transkrypcie brak."},{"id":"zOJmrekJx30","title_pl":"Sztuczki flirtu tak skuteczne, że wydają się oszustwem","title":"Flirting Tricks So Effective They Feel Like Cheating","channel":"Chill Dude Explains","url":"https://www.youtube.com/watch?v=zOJmrekJx30","date":"2026-11-03","duration":616,"views":50715,"section":"Chill Dude Explains","transcript":"whisper","added":"2026-11-04","tags":["Psychologia"],"about":"Dziesięć trików flirtu: zniknięcie na szczycie rozmowy, kotwica pamięci, wspólny sekret, komplement z drugiej ręki, dotyk, double take i Zeigarnik.","intro":"Chill Dude Explains wylicza 10 technik, które mają sprawić, że ktoś myśli o tobie po rozmowie. Od \"zniknięcia\" na szczycie energii, przez kotwicę pamięci i wspólny sekret, po komplement usłyszany od osób trzecich, lekki dotyk, double take, odwrócony wywiad, otwartą pętlę i małą rysę w \"zbroi\".","points":[{"t":"10. Akt zniknięcia","d":"Największy błąd: zostać za długo, aż energia opadnie i pożegnanie będzie niezręczne. Autor: zakończ rozmowę na szczycie (głośny śmiech, silne połączenie), ciepło wytłumacz się i odejdź. Mózg oczekuje ciągłości, odtwarza najlepsze momenty i \"kręci\" niedokończoną historią. Zostajesz w głowie \"za darmo\"."},{"t":"9. Kotwica pamięci","d":"Najsilniejsze wrażenie ma zostać, gdy jesteś nieobecny. Autor: powiąż się z czymś codziennym (słowo, zapach, piosenka) jak w warunkowaniu klasycznym. Przykład: \"za każdym razem gdy czuję cynamon, myślę o absurdalnej podróży\" - potem bułka cynamonowa przywołuje ciebie. Albo: \"ta piosenka zostanie mi w głowie po dzisiejszym wieczorze\"."},{"t":"8. Wspólny sekret","d":"Szybka bliskość: prywatny świat we dwoje. To nie musi być prawdziwy sekret - drobna obserwacja jako info tylko dla was (np. \"playlista imprezy to katastrofa\"). Powstaje \"my\" vs \"oni\". Autor przywołuje shared reality effect. Klucz: nachyl się, obniż głos, kontakt wzrokowy; nieszkodliwe i obserwacyjne."},{"t":"7. Komplement usłyszany bokiem","d":"Bezpośredni komplement jest przewidywalny. Gdy wspólny znajomy przekazuje: \"Sarah mówiła, że jesteś naprawdę zabawny\", brzmi autentyczniej, bo Sarah nic nie zyskuje. Autor: bądź konkretny (nie \"fajny\", tylko \"jak ogarnął tę niezręczną pytanie\"). Sieć znajomych robi robotę za ciebie."},{"t":"6. Kult we dwoje","d":"Wewnętrzna grupa = prywatny język. Gdy coś dziwnego się wydarzy, nazwij to (wiewiórka kradnie chipsy: \"odważny mały gość\"); przy powtórce wystarczy uśmiech i ta sama fraza. Autor: dyadic uniqueness - pary z prywatnymi odniesieniami czują się bliżej. Wersja zaawansowana: powtarzalna uwaga o nich (\"classic brain glitch\")."},{"t":"5. Przypadkowe muśnięcie","d":"Lekki, krótki dotyk przedramienia ma zwiększać sympatię i zaufanie. Autor: włókna C-tactile i oksytocyna; \"efekt Midasa\" - kelnerki, które krótko dotykały klientów, dostawały wyższe napiwki. Ma być naturalne: przy przejściu muśnij grzbietem dłoni, nie patrz na kontakt, nie rób z tego wydarzenia."},{"t":"4. Double take","d":"Flirt zaczyna się od niewerbalnego sygnału: krótki kontakt wzrokowy, spojrzenie w bok, po chwili wzrok wraca, jakby coś przyciągnęło ponownie. Autor: odejście wzroku najpierw nie wygląda na desperację; drugi rzut budzi ciekawość. Słodki punkt: przerwa ok. 2-4 s. Długie wpatrywanie robi z kogoś \"ofiarę\"."},{"t":"3. Odwrócony wywiad","d":"Zamiast CV-pytania (\"co robisz?\") zapytaj: \"co ludzie zwykle źle o tobie myślą na początku?\". Każdy ma lukę między wizerunkiem a sobą. Po odpowiedzi nie graj od razu o sobie - kiwnij i powiedz, że to ma sens. Autor: ludzie ciągną do tych, którzy sprawiają, że czują się zrozumiani."},{"t":"2. Otwarta pętla","d":"Mózg nie lubi niedokończonych spraw (autor: \"zygarnic effect\" = efekt Zeigarnik). Zacznij ciekawą historię i na kulminacji miękko przerwij (\"muszę to ogarnąć, sekundę\"). Albo: \"mam sekret\" i odejdź, gdy coś naturalnie przerywa. Jedyna droga do domknięcia: znaleźć cię znowu."},{"t":"1. Pęknięcie zbroi","d":"Ludzie łączą się z realnym, nie z idealnym. Wcześnie przyznaj małą, nieszkodliwą wadę (\"boję się gołębi\", \"nie umiem parkować równolegle\"). Autor powołuje się na pratfall effect: kompetentna osoba po drobnym błędzie bywa bardziej lubiana. Klucz: małe i urocze, nie czerwona flaga."}],"conclusion":"Według autora przyciąganie buduje niedopowiedzenie, wspólny świat i człowieczeństwo, a nie perfekcyjna autoprezentacja.","factchecks":[{"claim":"Kotwica pamięci to warunkowanie klasyczne: bodziec neutralny + pozytywne uczucie.","verdict":"prawda","note":"Opis mechanizmu Pawłowa jest poprawny; skuteczność jako \"trik flirtu\" to już spekulacja autora.","p":1,"src":[["Wikipedia (ang.): warunkowanie klasyczne - hasło \"Classical conditioning\"","https://en.wikipedia.org/wiki/Classical_conditioning"]]},{"claim":"Lekki dotyk aktywuje włókna C-tactile i uwalnia oksytocynę (efekt Midasa).","verdict":"półprawda","note":"Włókna CT i oksytocyna są badane przy delikatnym dotyku; \"efekt Midasa\" dotyczy głównie napiwków, nie flirtu w ogóle.","p":5,"src":[["Wikipedia (ang.): aferenty C-tactile","https://en.wikipedia.org/wiki/C_tactile_afferent"],["Wikipedia (ang.): oksytocyna - hasło \"Oxytocin\"","https://en.wikipedia.org/wiki/Oxytocin"],["Wikipedia (ang.): Midas touch (psychologia)","https://en.wikipedia.org/wiki/Midas_touch"]]},{"claim":"Efekt Zeigarnik: mózg trzyma niedokończone sprawy mocniej.","verdict":"prawda","note":"Klasyczny efekt Zeigarnik dotyczy lepszej pamięci zadań niedokończonych; film błędnie pisze \"zygarnic\".","p":8,"src":[["Wikipedia (ang.): efekt Zeigarnik - hasło \"Zeigarnik effect\"","https://en.wikipedia.org/wiki/Zeigarnik_effect"],["Wikipedia (pl.): efekt Zeigarnik","https://pl.wikipedia.org/wiki/Efekt_Zeigarnik"]]},{"claim":"Pratfall effect: kompetentna osoba po małym błędzie jest bardziej lubiana.","verdict":"prawda","note":"Efekt pratfallu (Aronson) jest opisany w psychologii społecznej; działa głównie przy wysokiej kompetencji wyjściowej.","p":9,"src":[["Wikipedia (ang.): pratfall effect","https://en.wikipedia.org/wiki/Pratfall_effect"]]},{"claim":"Shared reality / dyadic uniqueness: wspólny sekret i inside joke szybko budują więź.","verdict":"półprawda","note":"Badania o wspólnej rzeczywistości i prywatnym języku par istnieją, ale \"w 5 sekund\" to marketingowe uproszczenie.","p":[2,5],"src":[["Wikipedia (ang.): classical conditioning (kontekst asocjacji)","https://en.wikipedia.org/wiki/Classical_conditioning"]]}],"bias":"Lista \"hacków\" jak pewne triki psychologii; efekty bywają realne, ale kontekst flirtu, zgoda i kultura są pominięte. Bez reklam produktowych, na końcu prośba o subskrypcję."},{"id":"JsRiC6vGb1E","title_pl":"Niewidzialna inżynieria okien: ciepło, ptaki, szkło","title":"Windows Are Absurd","channel":"Practical Engineering","url":"https://www.youtube.com/watch?v=JsRiC6vGb1E","date":"2026-11-03","duration":1469,"views":587702,"section":"Ciekawostki","transcript":"youtube","added":"2026-11-05","tags":["Inżynieria","Technika","Nauka"],"about":"Practical Engineering: okna jako technologia - izolacja, low-E, ptakoodporność, curtain wall, hartowanie i laminat.","intro":"Grady z Practical Engineering bierze coś, co zwykle ignorujemy - okno - i pokazuje, jaki to kosztowny kompromis: światło i widok za cenę konstrukcji, wentylacji, dźwięku, ogrzewania, chłodzenia i bezpieczeństwa. Zamiast wykładu z katalogu buduje w garażu skrzynki z pianki i mierzy różnice temperatur.\n\nFilm idzie od przewodzenia, konwekcji i promieniowania przez szyby zespolone i powłoki low-E, potem ptaki vs lustrzane fasady (McCormick Place), curtain wall i silikon konstrukcyjny, na końcu hartowanie i szkło laminowane.","points":[{"t":"Szyba vs ściana: R-value","d":"**Zwykła pojedyncza szyba ma R-value około 1, typowa ściana zewnętrzna w USA 10-25 - ciepło idzie przez okno nawet 10-25 razy szybciej.** Grady wkłada do ocieplanej skrzynki emiter 25 W; przy pokrywie z pianki R5 różnica temperatur ustala się około 24°C, blisko wyliczeń.\n\nPo zamianie pokrywy na pojedynczą szybę różnica spada do około 13°C przy tym samym 25 W - mniejszy \"opór\" oznacza, że ta sama moc ucieka przy mniejszej delcie T. Dlatego prawie nie stawia się już single pane: standard to 2, czasem 3 szyby z uszczelnioną szczeliną, czasem argonem lub kryptonem, a nawet panele próżniowe."},{"t":"Podwójna szyba i ciśnienie","d":"**W demie podwójna szyba daje różnicę około 17°C - mniej więcej w środku między pianką a single pane.** Nowoczesne double pane według autora potrafią podwoić lub poczwórnić izolacyjność względem jednej szyby.\n\nSzczelina gazowa ma haczyk wysokości: produkcja nisko, montaż wysoko to nadciśnienie między szybami, wyboczenie, nawet pęknięcie. Czasem fabryka ustawia ciśnienie pod docelową wysokość; inna opcja to długa, wąska rurka kapilarna wyrównująca ciśnienie przy ograniczeniu wilgoci (kondensat między szybami)."},{"t":"Low-E: lustro dla podczerwieni","d":"**Szkło jest prawie nieprzezroczyste dla dalekiej podczerwieni, ale mocno emisyjne - pochłania i ponownie wypromieniowuje ciepło \"z dodatkowymi krokami\".** Bliska IR od Słońca przechodzi jak światło widzialne (efekt cieplarniany w szklarni); daleka IR z ciepłych ciał nie.\n\nPowłoki low-E robią z szyby lustro dla IR. W klimacie chłodnym chcecie wpuszczać bliską IR (grzanie); w ciepłym - odbijać. Producenci stroją powłoki i wybierają powierzchnię: w ciepłym często \"surface 2\" (wewnętrzna strona zewnętrznej szyby), by IR nie ogrzewała gazu w szczelinie; w chłodnym \"surface 3\", by odbijać długofalowe IR z powrotem do domu."},{"t":"Ptaki i kropki na szkle","d":"**Okna zabijają ptaki, bo odbijają niebo i drzewa albo wyglądają na przejście na wylot.** McCormick Place w Chicago: średnio około 1000 martwych ptaków rocznie; w październiku 2023 niemal tysiąc zginął jednej nocy. Po naklejeniu wzoru kropek na fasadzie liczba zderzeń spadła według autora o 95%.\n\nWzory mają zepsuć iluzję lustra; część jest prawie niewidoczna dla ludzi, ale widoczna w UV dla wielu gatunków. Coraz więcej miast wpisuje bird-safe glass do przepisów, zwłaszcza przy korytarzach migracji i wielkich szklanych fasadach."},{"t":"Curtain wall i silikon","d":"**Curtain wall to \"płaszcz\" budynku: nośność idzie przez słupy wewnątrz, a fasada wisi lekko i cienko.** Duże moduły z fabryki montuje się szybko; cała elewacja może być oknem. Szkła nie przykręca się gwoździem - kruche, punktowy nacisk pęka.\n\nCaptured glazing to rama z miękkim uszczelnieniem; structural silicone glazing klei panele tak, że z zewnątrz widać tylko gładkie szkło. Zwykły silikon łazienkowy w demie Grady'ego utrzymał około 20 kg przez minutę i odpadł (do środka nie doschnął); silikon konstrukcyjny po tygodniu (ok. 50% wytrzymałości według producenta) trzymał to obciążenie i dodatkowe kowadełko. Często są też ukryte klipsy awaryjne."},{"t":"Hartowane i laminowane","d":"**Szkło float chłodzone powoli (annealed) pęka w wielkie, ostre odłamki; hartowanie daje małe \"żwirki\", laminat trzyma barierę po pęknięciu.** Hartowanie: szybkie chłodzenie powietrzem - powierzchnia w ściskaniu, pęknięcia trudniej rosną; po rozbiciu małe kawałki zamiast noży. Wady: nie da się już ciąć ani wiercić; słabsze zabezpieczenie przed włamaniem.\n\nLaminat: warstwa plastiku między szybami - nawet pęknięte szkło zostaje przyklejone i blokuje przejście. Stosowane nad głową, w witrynach parteru i w przednich szybach samochodów. Kody budowlane wymagają safety glass przy drzwiach, niskich oknach, łazienkach."}],"conclusion":"Autor chce, żebyście widzieli okno jako zestaw świadomych kompromisów inżynieryjnych, a nie \"dziurę w ścianie\". Od izolacji i powłok IR po ptaki, fasady drapaczy i to, jak szkło ma się rozpadać - wszystko jest ukryte w codziennym widoku za szybą.","factchecks":[{"claim":"Pojedyncza szyba izoluje rzędu R-1, ściana zewnętrzna często R-10 do R-25 (skala US).","verdict":"prawda","note":"R-value US to opór cieplny; szyby zespolone i low-E mocno poprawiają wynik.","p":0,"src":[["Wikipedia (ang.): R-value (izolacja) - hasło \"R-value (insulation)\"","https://en.wikipedia.org/wiki/R-value_(insulation)"],["Wikipedia (ang.): izolacyjne szkło zespolone - hasło \"Insulated glazing\"","https://en.wikipedia.org/wiki/Insulated_glazing"]]},{"claim":"Powłoki low-E odbijają podczerwień i poprawiają bilans cieplny okna.","verdict":"prawda","note":"Low-E to standard w nowoczesnej stolarki; parametry stroi się pod klimat.","p":2,"src":[["Wikipedia (ang.): low-E glass - hasło \"Low emissivity\"","https://en.wikipedia.org/wiki/Low_emissivity"]]},{"claim":"Kropki na oknach McCormick Place obcięły zderzenia ptaków o ok. 95%.","verdict":"prawda","note":"Po masowym padzie w X 2023 (ok. 1000 ptaków) film/kropki w 2024 dały spadek >95% vs wcześniejsze sezony.","p":3,"src":[["Cornell Lab: kropki na McCormick Place i spadek zderzeń","https://www.allaboutbirds.org/news/bird-collisions-window-safety-mccormick-place-chicago/"],["Audubon: ponad 1000 ptaków w jedną noc przy McCormick Place","https://www.audubon.org/magazine/more-1000-birds-collided-single-chicago-building-one-night"]]},{"claim":"Hartowane szkło pęka na małe kawałki; laminowane zostaje na folii.","verdict":"prawda","note":"To standard safety glass w budownictwie i motoryzacji (szyby boczne vs przednia).","p":5,"src":[["Wikipedia (ang.): szkło hartowane - hasło \"Tempered glass\"","https://en.wikipedia.org/wiki/Tempered_glass"],["Wikipedia (ang.): szkło laminowane - hasło \"Laminated glass\"","https://en.wikipedia.org/wiki/Laminated_glass"]]}],"bias":"Rzetelny ton Practical Engineering z demami w garażu. Sponsor: SendCutSend (cięcie blach/CNC do prototypów)."},{"id":"j7bpI4MHH9o","title_pl":"Dziwne rzeczy, które możesz wytrenować w oczach","title":"Weird Things You Can Train Your Eyes To See","channel":"Chill Dude Explains","url":"https://www.youtube.com/watch?v=j7bpI4MHH9o","date":"2026-11-03","duration":542,"views":53513,"section":"Chill Dude Explains","transcript":"youtube","added":"2026-11-05","tags":["Nauka","Ciało i zdrowie","Psychologia"],"about":"Od efektu Troxlera i drzewa Purkinjego po Ganzfeld i efekt wodospadu: 10 złudzeń wzrokowych, których możesz doświadczyć sam.","intro":"Chill Dude Explains to kanał ze spokojnymi listami o psychologii i ciekawostkach. Tu autor pokazuje, że wzrok nie jest kamerą, tylko ciągłą improwizacją mózgu, i że da się to zobaczyć na własne oczy.\n\nOdlicza od 10 do 1 efekty: od zniekształconej twarzy w lustrze, przez własne naczynia i białe krwinki, po rywalizację obuoczną, deprywację sensoryczną i iluzję ruchu. Każdy punkt ma prostą instrukcję i krótkie wyjaśnienie.","points":[{"t":"10. Potwór w lustrze","d":"**W słabo oświetlonym pokoju twarz w lustrze zaczyna się deformować albo staje się groteskowa.** Naukowcy nazywają to efektem Troxlera: gdy nie ruszasz oczami, mózg uznaje niezmienny obraz za nieważny i wycina go, jak hum lodówki.\n\nBrzegi widzenia bledną pierwsze. Mózg nie zostawia pustki, tylko \"łatą\" brakujące fragmenty zniekształconymi kształtami i archetypami. Według autora widzisz wtedy w czasie rzeczywistym, jak system zgaduje rzeczywistość."},{"t":"9. Drzewo Purkinjego","d":"**Latarką telefonu z boku otwartego oka (w ciemności, drugie zamknięte) widać ciemne, rozgałęzione linie: cień własnych naczyń krwionośnych na siatkówce.** Siatkówka rozwija się \"na opak\", więc tętnice i żyły leżą nad komórkami światłoczułymi.\n\nMózg normalnie je \"retuszuje\" przez adaptację nerwową. Gdy światło rusza z nietypowego kąta, cienie się przesuwają i na chwilę widać całą mapę. Nazwa od XIX-wiecznego naukowca Jana Purkyně."},{"t":"8. Efekt niebieskiego pola","d":"**Na jasnym niebie widać maleńkie białe kropki, które zygzakują i znikają: to własne białe krwinki w kapilarach siatkówki.** Niebieskie światło pochłaniają czerwone krwinki, a białe są dla niego przezroczyste, więc za nimi powstaje ruchome \"okienko\" światła.\n\nJednolite niebo to idealne tło. Według autora ruch może iść w rytm bicia serca. To nie męty (wolne grudki białka), tylko energetyczne kropki po ustalonych torach."},{"t":"7. Pędzel Haidingera","d":"**W centrum widzenia jest słaba żółta \"muszka\" (kokarda), którą mózg całe życie ignorował: pędzel Haidingera.** Widać ją w spolaryzowanym świetle, bo żółty pigment w środku siatkówki absorbuje polaryzację zależnie od kierunku.\n\nNajłatwiej: niebo 90 stopni od słońca, powolne przechylanie głowy, albo biały ekran LCD. Najpierw nic, potem jak Magic Eye pojawia się żółty pędzel, obracający się z głową. Według autora to możliwa pozostałość nawigacji zwierząt po słońcu."},{"t":"6. Chronostaza","d":"**Sekundnik zegara wydaje się zamrażać na zbyt długą chwilę, bo mózg kłamie o czasie.** Przy skoku oka (sakadzie) wzrok jest wygaszany (maskowanie sakadowe), a mózg nienawidzi luk: pierwsze zdjęcie po ruchu \"wkleja\" wstecz, przez co ten moment wydaje się rozciągnięty.\n\nDowód: w lustrze nie da się zobaczyć własnych oczu w ruchu, choć inni je widzą. Mózg zawsze wycina ruch i składa stabilną historię rzeczywistości."},{"t":"5. Efekt McCollough","d":"**Po kilku minutach naprzemiennego wpatrywania się w czerwono-czarne poziome i zielono-czarne pionowe kratki czarno-biała kratka dostaje kolor: poziome zielenieją, pionowe różowieją.** To nie zwykły afterimage (zmęczenie siatkówki), tylko głębsza asocjacja w korze: neurony łączące orientację z kolorem.\n\nEfekt może trwać godziny, dni, nawet tygodnie. Żeby go zmazać, trzeba powtórzyć procedurę z odwróconymi kolorami."},{"t":"4. Sztuczka z dziurką","d":"**Bez okularów, przez malutką dziurkę z palców, rozmazany obraz staje się ostry.** Przy wadzie refrakcji soczewka nie skupia światła idealnie na siatkówce. Dziurka odcina rozproszone promienie z brzegów i przepuszcza wąski, prosty snop, który prawie nie wymaga ostrości.\n\nOko się nie poprawiło, dostało łatwiejsze zadanie (jak camera obscura). Mrużenie to prymitywna dziurka. W okulistyce occluder z dziurką pomaga odróżnić zwykłą wadę od poważniejszego problemu."},{"t":"3. Rywalizacja obuoczna","d":"**Gdy lewe oko widzi dom, a prawe twarz, nie powstaje mieszanka: mózg wybiera jedno, potem po paru sekundach przełącza na drugie.** To binocular rivalry: świadoma percepcja to decyzja wykonawcza, nie bezpośredni odczyt rzeczywistości.\n\nBodziec fizyczny jest stały, a świadomość się zmienia, więc neurobiolodzy używają tego do badania świadomości. Większość ludzi tylko obserwuje; doświadczeni medytujący potrafią dłużej utrzymać jeden obraz."},{"t":"2. Efekt Ganzfeldu","d":"**Połówki piłeczki pingpongowej na oczach i miękkie, równomierne światło: po kilku minutach jednolite pole się rozpada i pojawiają się błyski, kolory, wzory, a u części osób sceny jak ze snu.** Ganzfeld (niem. \"całe pole\") to deprywacja sensoryczna: kora wzrokowa bez krawędzi i ruchu wzmacnia własny szum z pamięci i wyobraźni.\n\nKażdy widzi coś innego. Według autora to jakby podświadomość dostała pilota do systemu wzrokowego."},{"t":"1. Efekt wodospadu","d":"**Po minucie wpatrywania w środek wodospadu nieruchome skały obok wydają się dryfować w górę.** Detektory ruchu w dół się męczą; po spojrzeniu na coś nieruchomego \"odpoczęte\" detektory w górę wygrywają porównanie sygnałów, więc mózg wnioskuje ruch w górę.\n\nArystoteles już o tym pisał. Spirala kręcąca się do środka sprawia potem, że dłoń wydaje się puchnąć. To nie usterka, tylko przeregulowanie kalibracji ruchu."}],"conclusion":"Autor pokazuje, że \"widzenie\" to ciągła edycja: adaptacja, wypełnianie luk i kalibracja ruchu. Zachęca, by samemu sprawdzić te efekty, i zapowiada podobne filmy.","factchecks":[{"claim":"Efekt Troxlera sprawia, że nieruchomy obraz znika z uwagi","verdict":"prawda","note":"Klasyczna adaptacja wzrokowa; przy utrwaleniu spojrzenia peryferia bledną lub znikają.","p":0,"src":[["Wikipedia (ang.): efekt Troxlera - hasło \"Troxler's fading\"","https://en.wikipedia.org/wiki/Troxler's_fading"]]},{"claim":"Drzewo Purkinjego to cień naczyń na siatkówce","verdict":"prawda","note":"Nazwane od Jana Purkyně; widać przy oświetleniu z boku oka.","p":1,"src":[["Wikipedia (ang.): drzewo Purkinjego - hasło \"Purkinje tree\"","https://en.wikipedia.org/wiki/Purkinje_tree"]]},{"claim":"Białe kropki na niebie to białe krwinki w siatkówce","verdict":"prawda","note":"Blue field entoptic phenomenon (Scheerer): leukocyty w kapilarach siatkówki.","p":2,"src":[["Wikipedia (ang.): zjawisko niebieskiego pola - hasło \"Blue field entoptic phenomenon\"","https://en.wikipedia.org/wiki/Blue_field_entoptic_phenomenon"]]},{"claim":"Pędzel Haidingera to żółta figura w spolaryzowanym świetle","verdict":"prawda","note":"Entoptyczny efekt związany z pigmentem plamki i polaryzacją.","p":3,"src":[["Wikipedia (ang.): pędzel Haidingera - hasło \"Haidinger's brush\"","https://en.wikipedia.org/wiki/Haidinger%27s_brush"]]},{"claim":"Chronostaza to iluzja \"zatrzymanej\" sekundy po sakadzie","verdict":"prawda","note":"Opisywana jako wypełnianie luki po maskowaniu sakadowym.","p":4,"src":[["Wikipedia (ang.): chronostaza - hasło \"Chronostasis\"","https://en.wikipedia.org/wiki/Chronostasis"]]},{"claim":"Efekt McCollough może trwać dni lub tygodnie","verdict":"prawda","note":"Kontynentalny aftereffect orientacji i koloru; trwa dużo dłużej niż zwykły afterimage.","p":5,"src":[["Wikipedia (ang.): efekt McCollough - hasło \"McCollough effect\"","https://en.wikipedia.org/wiki/McCollough_effect"]]},{"claim":"Dziurka ostro wyostrza obraz przy wadzie refrakcji","verdict":"prawda","note":"Pinhole occluder ogranicza rozproszone promienie; używany w diagnostyce.","p":6,"src":[["Wikipedia (ang.): occluder z dziurką - hasło \"Pinhole occluder\"","https://en.wikipedia.org/wiki/Pinhole_occluder"]]},{"claim":"Przy sprzecznych obrazach oczy przełączają się naprzemiennie","verdict":"prawda","note":"Binocular rivalry: świadomość oscyluje między dwoma bodźcami.","p":7,"src":[["Wikipedia (ang.): rywalizacja obuoczna - hasło \"Binocular rivalry\"","https://en.wikipedia.org/wiki/Binocular_rivalry"]]},{"claim":"Ganzfeld wywołuje halucynacje przy jednolitym polu","verdict":"prawda","note":"Deprywacja wzrokowa wzmacnia wewnętrzny szum kory; efekt dobrze opisany.","p":8,"src":[["Wikipedia (ang.): efekt Ganzfeldu - hasło \"Ganzfeld effect\"","https://en.wikipedia.org/wiki/Ganzfeld_effect"]]},{"claim":"Po wodospadzie skały wydają się płynąć w górę","verdict":"prawda","note":"Klasyczny motion aftereffect (waterfall illusion); opisywany już przez Arystotelesa.","p":9,"src":[["Wikipedia (ang.): efekt wodospadu - hasło \"Motion aftereffect\"","https://en.wikipedia.org/wiki/Motion_aftereffect"]]}],"bias":"Ton \"mózg cię okłamuje\" i lista trików. Zero reklam w transkrypcie. Uproszczenia neurobiologii, ale mechanizmy zgadzają się z literaturą."},{"id":"8Rs1QlaYRi4","title_pl":"Jedz jak średniowieczny pustelnik: fasola i reguły","title":"Eat Like A Medieval Hermit","channel":"Tasting History with Max Miller","url":"https://www.youtube.com/watch?v=8Rs1QlaYRi4","date":"2026-11-03","duration":1553,"views":496114,"section":"Historia","transcript":"youtube","added":"2026-11-05","tags":["Historia","Ciało i zdrowie"],"about":"Tasting History: dieta pustelników i anachoretów, przepis Forme of Cury na fasolę oraz fałszywi hermici.","intro":"Max Miller (Tasting History) pyta, jak żył, ubierał się i jadł średniowieczny pustelnik w Europie. Krótka odpowiedź o diecie: chleb, pottage albo przepis z XIV-wiecznego Forme of Cury na smażoną fasolę z cebulą.\n\nDługa odpowiedź rozdziela pustelników pustyni, angielskich hermitów, anachoretki w komórkach przy kościołach, reguły (Ancrene Wisse) i oszustów z Piers Plowman. Na koniec gotuje bób z ziołami zamiast królewskiego powder douce.","points":[{"t":"Co to pustelnik i co jadł","d":"**Pustelnik to mnich lub święty, który odchodzi od społeczeństwa, by żyć w samotnej kontemplacji; słowo od greckiego eremos (pustynia/wilderness).** Anglosaski św. Guthlac (VIII w., Lincolnshire) jadł po zachodzie tylko okruch jęczmiennego chleba i kubek błotnistej wody - i umarł około 40. roku życia.\n\nXIII-wieczne Ancrene Wisse dla anachoretek: bez mięsa i tłuszczu (chyba że choroba), mało picia, ale też zakaz skrajnego głodu bez pozwolenia. Richard Rolle ostrzegał i przed obżarstwem, i przed zbyt ostrym postem jako pokusą diabła."},{"t":"Przepis: benes yfryed","d":"**Forme of Cury każe ugotować fasolę niemal do pęknięcia, odsączyć, dodać cebulę, sól i czosnek, usmażyć na oleju lub tłuszczu i doprawić powder douce.** To przepis dla królewskiego stołu, więc Miller dla \"pustelnika\" zamienia słodkie przyprawy na majeranek, koper i szałwię.\n\nSkładniki: 450 g suszonego bobu (fava - jedyna fasola starego świata w średniowiecznej Europie), cebula, czosnek, oliwa. Namaczanie, 1-2 h gotowania, opcjonalne obieranie skórek, smażenie ok. 10 minut. Ocena: prosto, cebula daje teksturę, bób nie jest jego faworytem."},{"t":"Od pustyni do anachoretki","d":"**Wzorem byli ojcowie pustyni: Paweł z Teb (rzekomo samotnie od 16. do 113. roku), Onufry (daktyle), Heron (dziki sałat), Hilarion (lata niesgotowanej soczewicy, potem chleb i zioła, oliwa dopiero po 35.).** Motyw: 40 dni Mojżesza i Jezusa oraz ucieczka od przyjemności jedzenia.\n\nW Anglii anachoretka (np. Julian of Norwich) żyła w celi przy kościele z trzema oknami: na Eucharystię (bez rozmów), \"domowe\" na jedzenie przez służące i maleńkie parlor window. Cot miały; plotki i wspólne posiłki z gośćmi reguły ganiły. Mieli też służących - Celestyni: nie wychodź sam, wyślij posłańca."},{"t":"Fałszywi i ozdobni pustelnicy","d":"**Piers Plowman rozróżnia pobożnych hermitów i pijaków żerujących przy drogach i tawernach.** Thomas de Byrford (1310) słuchał spowiedzi i sprzedawał odpusty; John Bennett trzymał burdel; William Blakey (1412) udawał pielgrzyma do Jerozolimy i skończył pod pręgierzem z osełką; \"Edward the Hermit\" (Robert Beckworth) okradał domy w przebraniu.\n\nPo kasacie klasztorów Henryka VIII pustelnicy zniknęli, a w XVIII w. wrócili jako ornamental hermits w ogrodach bogaczy. Oferta Pocklingtona (1797): 7 lat bez mycia i rozmów za pół korony dziennie - chętnych brak; potem przyszły krasnale ogrodowe."}],"conclusion":"Miller pokazuje, że \"jeść jak pustelnik\" to nie jedna dieta, lecz spektrum od błotnistej wody Guthlaca po fasolę z ziołami i anachoretki z pokojówkami. Puenta przy talerzu: posiłek ma być prosty, by nie budzić żądzy dokładki - i że cookies z Wildgrain do tej roli się nie nadają.","factchecks":[{"claim":"Forme of Cury zawiera przepis na smażoną fasolę (benes yfryed).","verdict":"prawda","note":"Forme of Cury to XIV-wieczny angielski zbiór przepisów przypisywany kuchni Ryszarda II.","p":1,"src":[["Wikipedia (ang.): Forme of Cury - hasło \"The Forme of Cury\"","https://en.wikipedia.org/wiki/The_Forme_of_Cury"]]},{"claim":"Ancrene Wisse to reguła dla anachoretek zakazująca mięsa poza chorobą.","verdict":"prawda","note":"XIII-wieczny przewodnik dla anachoretek reguluje post, jedzenie i życie w celi.","p":0,"src":[["Wikipedia (ang.): Ancrene Wisse - hasło \"Ancrene Wisse\"","https://en.wikipedia.org/wiki/Ancrene_Wisse"]]},{"claim":"Julian of Norwich była anachoretką wspieraną zapisami w testamentach.","verdict":"prawda","note":"Julian żyła jako anchoress przy kościele w Norwich; jest poświadczona w źródłach miejskich.","p":2,"src":[["Wikipedia (ang.): Julian of Norwich - hasło \"Julian of Norwich\"","https://en.wikipedia.org/wiki/Julian_of_Norwich"]]},{"claim":"W XVIII-wiecznej Anglii zatrudniano ornamental hermits w ogrodach.","verdict":"prawda","note":"Moda na ozdobnych pustelników w parkach angielskich jest dobrze opisana w historii ogrodów.","p":3,"src":[["Wikipedia (ang.): ornamental hermit - hasło \"Ornamental hermit\"","https://en.wikipedia.org/wiki/Ornamental_hermit"]]}],"bias":"Film sponsorowany (Wildgrain, książka). Ton humorystyczny; hagiografie ojców pustyni traktuje z dystansem, ale cytuje jako wzorce średniowiecza."},{"id":"difPlwouuPY","title_pl":"Gdy pęknie bańka AI: lekcja z cmentarzyska drewnianych statków","title":"When the AI bubble pops...","channel":"Phil Edwards","url":"https://www.youtube.com/watch?v=difPlwouuPY","date":"2026-11-02","duration":861,"views":97911,"transcript":"youtube","added":"2026-11-03","tags":["Historia","Technika"],"about":"Autor porównuje boom centrów danych AI do drewnianych statków z I wojny światowej, które dziś leżą w zatoce Mallows Bay.","intro":"Phil Edwards płynie kajakiem po Mallows Bay w Maryland, gdzie leży ponad 100 drewnianych statków z I wojny światowej. Porównuje ten pospieszny program budowy do dzisiejszego boomu centrów danych AI. Pokazuje, że bańka to nie tylko spekulacja finansowa, ale też fizyczne pozostałości po nadmiernej budowie. Film ma sponsora (Hostinger).","points":[{"t":"Centra danych zmieniają krajobraz","d":"Zdjęcia satelitarne przed i po pokazują, jak setki centrów danych za miliardy dolarów zastępują pola, np. centrum Amazona w Karolinie Północnej i Clarksville w Arkansas. Od Data Center Alley w Wirginii do Mallows Bay jest ok. 137 km."},{"t":"Pośpiech bez znanego terminu","d":"W 1917 r. USA założyły Emergency Fleet Corporation, by przy niedoborze stali szybko budować statki na wojnę. Wydano setki milionów dolarów, a nikt nie wiedział, kiedy wojna się skończy, tak jak dziś nie wiadomo, kiedy nastąpią przełomy w AI."},{"t":"Bańka pochłania zasoby","d":"Gazeta pisała o 68 planach budowy na 375 statków z sosny długoigielnej, której nie wolno było sprzedawać gdzie indziej, choć nie była dobrym materiałem. Autor porównuje to do drożejącej pamięci komputerowej wykupywanej przez boom AI."},{"t":"Nowa infrastruktura","d":"W ciągu 2 lat przybyło 120 stoczni i 657 pochylni. Według autora to dokładnie odpowiada dzisiejszej budowie elektrowni i sieci dla centrów danych."},{"t":"Polityka pompuje bańkę","d":"Hasło wyścigu z Chinami napędza inwestycje w AI, np. projekt Stargate w Teksasie Trumpa i OpenAI. Po I wojnie szef Shipping Board bronił niewykorzystanych statków, bo w czasie wojny nie ma nadwyżek. Bańka pękła, gdy wojna skończyła się wcześniej, niż sądzono."},{"t":"Gorszy materiał, gorsza budowa","d":"Drewniane statki były słabsze nie tylko przez trwałość: wymagały dużo więcej wzmocnień wewnątrz niż stalowe. Najpopularniejszy był projekt Design 1001; po wojnie statki były drogie w utrzymaniu, a w 1925 r. odholowano je do Mallows Bay."},{"t":"Niepewność centrów danych","d":"Wiele centrów danych powstaje bez stabilnego zasilania, a nie wiadomo, czy GPU w środku za 5 lat będą coś warte. Niejasne jest też, czy AI nie przeniesie się na lokalne urządzenia; Apple według autora na to stawia."},{"t":"Płonący basen i złom","d":"Statki malowano kamuflażem dazzle, który radar uczynił prawie bezużytecznym. W II wojnie rząd zaryzykował 200 000 dolarów, by odzyskać co najmniej 11 000 ton metalu: statki spalono w basenie i wyciągano złom elektromagnesem. Dziś to rezerwat przyrody morskiej."},{"t":"Lekcja światłowodów","d":"Boom światłowodowy z lat 2000. uznano wtedy za klapę, ale ta infrastruktura zbudowała współczesny internet. Autor sądzi, że AI nie pęknie nagle jak koniec wojny, ale boom zostawi i użyteczne rzeczy, i drewniane statki."}],"conclusion":"Nawet jeśli AI zostanie, boom budowy zostawi po sobie niepotrzebną infrastrukturę i przekształci krajobraz.","factchecks":[{"claim":"W Mallows Bay leży ponad 100 drewnianych statków z I wojny światowej.","verdict":"prawda","note":"Wraków statków z programu wojennego jest tam ok. 230; od 2019 r. to rezerwat morski NOAA.","p":null,"src":[["Wikipedia (ang.): zatoka Mallows Bay - hasło \"Mallows Bay\"","https://en.wikipedia.org/wiki/Mallows_Bay"],["NOAA: rezerwat Mallows Bay-Potomac River","https://sanctuaries.noaa.gov/mallows-potomac/"]]},{"claim":"Emergency Fleet Corporation powstała w 1917 r.","verdict":"prawda","note":"Utworzono ją 16 kwietnia 1917 r. przy U.S. Shipping Board.","p":1,"src":[["Wikipedia (ang.): Emergency Fleet Corporation - hasło \"Emergency Fleet Corporation\"","https://en.wikipedia.org/wiki/Emergency_Fleet_Corporation"]]},{"claim":"Design 1001 był najpopularniejszy, a w 1925 r. statki odholowano do Mallows Bay.","verdict":"prawda","note":"Design 1001 (typ Ferris) z sosny lub daglezji był standardowym projektem; holowanie w 1925 r. potwierdza Wikipedia.","p":5,"src":[["Wikipedia (ang.): statek typu Design 1001 - hasło \"Design 1001 ship\"","https://en.wikipedia.org/wiki/Design_1001_ship"],["Wikipedia (ang.): zatoka Mallows Bay - hasło \"Mallows Bay\"","https://en.wikipedia.org/wiki/Mallows_Bay"]]},{"claim":"Statki spalono w II wojnie, by odzyskać metal.","verdict":"półprawda","note":"Spalono je już ok. 1925 r. po bankructwie firmy złomowej; w II wojnie Bethlehem Steel zbudowało basen do odzysku metalu.","p":7,"src":[["Wikipedia (ang.): zatoka Mallows Bay - hasło \"Mallows Bay\"","https://en.wikipedia.org/wiki/Mallows_Bay"]]},{"claim":"Kamuflaż dazzle stał się prawie bezużyteczny przez radar.","verdict":"prawda","note":"Tracił sens wraz z dalmierzami i lotnictwem, a w II wojnie radar dodatkowo osłabił jego działanie.","p":7,"src":[["Wikipedia (ang.): kamuflaż dazzle - hasło \"Dazzle camouflage\"","https://en.wikipedia.org/wiki/Dazzle_camouflage"]]},{"claim":"Stargate w Teksasie uzasadniano wyścigiem z Chinami.","verdict":"prawda","note":"Stargate buduje centra danych w Abilene w Teksasie; ogłoszono go w Białym Domu w 2025 r.","p":4,"src":[["Wikipedia (ang.): projekt Stargate - hasło \"Stargate LLC\"","https://en.wikipedia.org/wiki/Stargate_LLC"]]},{"claim":"Apple stawia na AI uruchamianą lokalnie.","verdict":"półprawda","note":"Apple Intelligence działa głównie na urządzeniu, ale trudniejsze zadania wysyła do chmury Private Cloud Compute.","p":6,"src":[["Apple: zapowiedź Apple Intelligence (2024)","https://www.apple.com/newsroom/2024/06/introducing-apple-intelligence-for-iphone-ipad-and-mac/"]]},{"claim":"Nadmiar światłowodów z boomu stał się potem podstawą internetu.","verdict":"prawda","note":"Nadwyżkę po krachu dot-com nazwano ciemnym włóknem; później stworzyła nowy rynek usług.","p":8,"src":[["Wikipedia (ang.): ciemne włókno - hasło \"Dark fibre\"","https://en.wikipedia.org/wiki/Dark_fibre"],["Wikipedia (ang.): bańka internetowa - hasło \"Dot-com bubble\"","https://en.wikipedia.org/wiki/Dot-com_bubble"]]}],"bias":"Analogia luźna i wybiórcza: wojenny program rządu to nie prywatne inwestycje. Sponsor Hostinger chwalony jako platforma AI, co kłóci się z tematem filmu.","section":"Historia"},{"id":"LpeDuC2sQ-w","title_pl":"Małe zmiany, które 10 razy poprawiają życie","title":"Tiny Changes For A 10x Better Life","channel":"Chill Dude Explains","url":"https://www.youtube.com/watch?v=LpeDuC2sQ-w","date":"2026-11-02","duration":563,"views":49922,"section":"Chill Dude Explains","transcript":"youtube","added":"2026-11-04","tags":["Psychologia","Ciało i zdrowie"],"about":"Dziesięć małych nawyków: od tekstu o celach i światła rano po wodę przed kawą i odsubskrybowanie toksycznych kont.","intro":"Lista 10 drobnych zmian, które według autora dają niesymetrycznie duży efekt: tekst o odpowiedzialności za cel, nazwa budzika z powodem wstania, tarcia utrudniające złe nawyki, światło rano na twarz, postawa, zasada \"nigdy dwa razy z rzędu\", przygotowanie wieczorem, ścielenie łóżka, odsubskrybowanie kont, które robią źle, oraz szklanka wody zaraz po przebudzeniu.","points":[{"t":"Tekst o odpowiedzialności","d":"Według autora badanie Gail Matthews pokazało 76% realizacji celów u osób, które je zapisały i wysyłały postępy znajomemu, wobec 43% u tych, którzy tylko o nich myśleli. Lepiej powiedzieć komuś, kto zauważy brak postępu, niż najbardziej wspierającemu przyjacielowi."},{"t":"Budzik z prawdziwą nazwą","d":"Zamiast \"Alarm\" nazwij budzik powodem wstania, np. rozmowa o pracę za 90 minut. Półprzytomny mózg dostaje konsekwencje zamiast negocjacji o 5 minut. Autor mówi, że to zajmuje 4 sekundy."},{"t":"Tarcie przeciw złemu nawykowi","d":"Zwiększ trudność złego zachowania: wyloguj się z Instagrama, schowaj chipsy na najwyższą półkę. Dla dobrych nawyków zrób odwrotnie: buty przy łóżku, witaminy przy ekspresie. Mózg wybiera najłatwiejszą ścieżkę."},{"t":"Światło rano na twarz","d":"Wyjdź na 5 minut na zewnątrz bez okularów i okna. Światło na siatkówkę resetuje zegar biologiczny: więcej kortyzolu rano, melatonina we właściwym czasie wieczorem. Telefon w ciemnym pokoju tego nie daje."},{"t":"Postawa i tlen","d":"Głowa człowieka waży ok. 5,4 kg. Przy garbieniu klatka piersiowa zapada się i według autora płuca mają ok. 30% mniej miejsca. Cue: wyobraź sobie sznurek ciągnący czubek głowy w górę; łącz z nawykiem (telefon, kawa)."},{"t":"Nigdy dwa razy z rzędu","d":"Można opuścić jeden dzień. Drugi to już decyzja, trzeci to nowa norma (abstinence violation effect). Powrót może być 5-minutowy trening: chodzi o sygnał \"dalej jestem tą osobą\"."},{"t":"Zwolnij poranny mózg","d":"Wieczorem przygotuj ubranie, lunch i klucze (ok. 10 minut). Oszczędzasz poranną energię decyzyjną, zanim zacznie się właściwy dzień."},{"t":"Ścielenie łóżka","d":"Według autora to keystone habit: mały poranny sygnał kontroli. Astronauci na ISS też ścielą śpiwory. Badanie cytowane w filmie łączy ścielenie z większym poczuciem szczęścia i produktywności."},{"t":"Odsubskrybuj duchy","d":"Konta, po których czujesz się gorzej, logują w mózgu \"wszyscy radzą sobie lepiej\". Pasywne scrollowanie wiąże się z lękiem i depresją. Pytanie: czy to mnie poprawia czy pogarsza? Jeśli pogarsza - unfollow."},{"t":"Woda przed kawą","d":"Przez sen tracisz ok. 1 litr wody. Mózg to ok. 75% wody. Kawa jako diuretyk pogarsza odwodnienie. Szklanka wody na stoliku nocnym przed telefonem i kawą."}],"conclusion":"Małe tarcia, światło, woda i odpowiedzialność przed drugą osobą działają lepiej niż sama siła woli.","factchecks":[{"claim":"Badanie Gail Matthews: 76% vs 43% realizacji celów przy odpowiedzialności.","verdict":"półprawda","note":"Liczby z komunikatu Dominican University; 76% to grupa z zapisem, planem i cotygodniowymi raportami.","p":0,"src":[["Dominican University: podsumowanie badania Gail Matthews o celach","https://www.dominican.edu/sites/default/files/2020-02/gailmatthews-harvard-goals-researchsummary.pdf"],["Wikipedia (ang.): wyznaczanie celów - hasło \"Goal setting\"","https://en.wikipedia.org/wiki/Goal_setting"]]},{"claim":"Poranne światło resetuje zegar biologiczny (kortyzol, melatonina).","verdict":"prawda","note":"Światło na siatkówkę to główny synchronizator rytmu około-dobowego u człowieka.","p":3,"src":[["Wikipedia (ang.): rytm około-dobowy - hasło \"Circadian rhythm\"","https://en.wikipedia.org/wiki/Circadian_rhythm"]]},{"claim":"Zmęczenie decyzyjne: poranne wybory wyczerpują dzienny budżet decyzji.","verdict":"półprawda","note":"Pojęcie istnieje w psychologii, ale siła i zakres efektu są przedmiotem sporów badawczych.","p":6,"src":[["Wikipedia (ang.): zmęczenie decyzyjne - hasło \"Decision fatigue\"","https://en.wikipedia.org/wiki/Decision_fatigue"]]},{"claim":"Pasywne scrollowanie Instagrama zwiększa lęk i depresję.","verdict":"półprawda","note":"Są korelacje z porównaniami społecznymi, ale związek przyczynowy i wielkość efektu są mieszane.","p":8,"src":[["Wikipedia (ang.): teoria porównań społecznych - hasło \"Social comparison theory\"","https://en.wikipedia.org/wiki/Social_comparison_theory"]]}],"bias":"Rozrywkowy poradnik bez źródeł w filmie. Reklamy brak; upraszcza badania (Matthews) i biologię do catchy punktów."},{"id":"T8Oh_R9pR6I","title_pl":"Dr Krzysztof Radtke: polska misja w Mastabie Faraona i pole grobowców pod piaskiem","title":"Miało tam nic nie być. Polacy odkryli podziemne pole grobowców w Egipcie","channel":"didaskalia","url":"https://www.youtube.com/watch?v=T8Oh_R9pR6I","date":"2026-11-01","duration":4005,"views":163955,"section":"Didaskalia","transcript":"youtube","added":"2026-11-03","tags":["Historia","Archeologia","Egipt"],"about":"Archeolog z PAN o grobowcu faraona Szepseskafa w Sakkarze, polskiej szkole archeologii i o tym, jak naprawdę wygląda praca w Egipcie.","intro":"Patrycjusz Wyżga rozmawia z dr. Krzysztofem Radtke z Instytutu Kultur Śródziemnomorskich i Orientalnych PAN, członkiem polsko-egipskiej misji w Mastabie Faraona w Sakkarze (listopad 2026). Mowa o tym, czemu faraon zbudował mastabę zamiast piramidy, co pokazała geofizyka, jak powstała polska szkoła archeologii i jak zebrano pieniądze na wyjazd.","points":[{"t":"Mastaba zamiast piramidy","d":"Mastaba to grobowiec przypominający ściętą piramidę. Szepseskaf, władca z końca IV dynastii, zbudował ją, choć piramidy w Gizie już stały. Może to wiązać się z konfliktem z kapłanami z Gizy, ale odpowiedzi jeszcze nie ma."},{"t":"Miało tam nic nie być","d":"Badania geofizyczne pokazały wokół mastaby pole grobowców i konstrukcji pod piaskiem. Wcześniej zakładano, że teren jest pusty, więc nikt go nie badał. Szczegóły ogłosi wspólnie misja polsko-egipska."},{"t":"Na czym polega praca","d":"Najpierw dokładne pomiary całej budowli, potem oczyszczanie wnętrza i przesiewanie piasku. Znaleziska to fragmenty ceramiki i części sarkofagu, które trzeba zinwentaryzować i złożyć jak puzzle."},{"t":"Recykling kamienia","d":"Egipcjanie byli praktyczni. Z budowli, które się rozpadły, brali kamień, zamiast sprowadzać go np. z Asuanu. Dlatego wiele grobowców zachowało się tylko częściowo."},{"t":"Wejście do wnętrza","d":"Pierwsze zejście przez wąskie przejście w głąb mastaby było dla gościa stresujące jak w filmie przygodowym. Dotknięcie miejsca, którego nikt nie dotykał od tysięcy lat, nazywa solą archeologii."},{"t":"Początki polskiej szkoły","d":"Prof. Kazimierz Michałowski zaczął wykopaliska w Edfu przed wojną razem z Francuzami. Polskie misje słynęły z badań kompleksowych, z architektami i numizmatykami, oraz z publikowania wyników po każdym sezonie."},{"t":"Freski z Faras","d":"W latach 60. Polacy uczestniczyli w ratowaniu zabytków Nubii przed zalaniem. Freski z katedry w Faras trafiły częściowo do Muzeum Narodowego w Warszawie, w czasach gdy znaleziska dzielono między kraje."},{"t":"Odkryto może 20%","d":"Według szacunków archeologów spod piasku wydobyto dopiero ok. 20% tego, co kryje Egipt. Wiedzę buduje się mozolnie, małymi elementami, by luk nie wypełniały pseudonaukowe teorie."},{"t":"Indiana Jones a nauka","d":"Filmy to rozrywka bez nauki, ale przyciągają ludzi do archeologii. Zwykła praca to pędzelek i powolne odsłanianie drobnych elementów."},{"t":"Rzemieślnicy i kunszt","d":"Wiedzę w warsztatach przekazywano ustnie i przez praktykę. Doskonałe dekoracje grobowców, np. w grobowcu w Dolinie Zachodniej w Tebach, gość uważa za największe skarby tej kultury."},{"t":"Zbiórka i biznes","d":"Instytutowi brakowało ok. 250 tys. zł na sezon. Apel o wpłaty trafił przez pomyłkę na stronę ministerstwa, co nagłośniło sprawę. Dziś misję wspierają m.in. firmy."}],"conclusion":"Rzeczowa rozmowa o archeologii od kuchni. Mniej sensacji niż w tytule, sporo o finansowaniu i historii polskich badań.","factchecks":[{"claim":"Szepseskaf był synem Mykerinosa i ostatnim władcą IV dynastii.","verdict":"półprawda","note":"To najpewniej ostatni król IV dynastii, ale to, że był synem Mykerinosa, jest tylko prawdopodobne.","p":0,"src":[["Wikipedia (ang.): Szepseskaf - hasło \"Shepseskaf\"","https://en.wikipedia.org/wiki/Shepseskaf"]]},{"claim":"Michałowski zaczął badania w Edfu w 1937 r. razem z misją francuską.","verdict":"półprawda","note":"Współpraca z francuskim instytutem się zgadza, ale Wikipedia podaje, że prace ruszyły w 1936 r.","p":5,"src":[["Wikipedia (ang.): Kazimierz Michałowski - hasło \"Kazimierz Michałowski\"","https://en.wikipedia.org/wiki/Kazimierz_Michałowski"]]},{"claim":"Freski z Faras trafiły do Muzeum Narodowego w Warszawie.","verdict":"prawda","note":"66 malowideł przewieziono do Polski, reszta jest w Chartumie.","p":6,"src":[["Wikipedia (ang.): Faras - hasło \"Faras\"","https://en.wikipedia.org/wiki/Faras"]]}],"bias":"Gość mówi o własnej misji i instytucie, więc to perspektywa zaangażowana. Odcinek ma partnera reklamowego (salon optyczny)."},{"id":"5ZlMmTBMoy4","title_pl":"Na co narzekali Rzymianie - brzmi jak 2026","title":"Things Romans Complained About That Sound Exactly Like 2026","channel":"Chill Dude Explains","url":"https://www.youtube.com/watch?v=5ZlMmTBMoy4","date":"2026-11-01","duration":597,"views":33616,"section":"Chill Dude Explains","transcript":"youtube","added":"2026-11-05","tags":["Historia","Psychologia","Ciekawostki"],"about":"Od name-droppingu i fałszywych towarów po inflację, scamy i długi: 10 rzymskich bolączek, które brzmią jak współczesne.","intro":"Chill Dude Explains zestawia skargi starożytnych Rzymian z dzisiejszymi nerwami: forum jak LinkedIn, łaźnia jak feed, Saepta Julia jak Amazon.\n\nOdlicza od 10 do 1: od przechwałek koneksjami i wymuszonych wierszy, przez toksyczny patronat, oszustwa spadkowe i dewaluację monety, po nocne ulice i spiralę długu. Cel: pokazać, że struktura narzekań prawie się nie zmieniła.","points":[{"t":"10. Name-dropper","d":"**Horacy opisał w poemacie faceta, który godzinami wpinał się w rozmowę i rzucał nazwiskami senatorów i doradców Cezara.** W Rzymie opartej na patronacie koneksje otwierały drzwi, więc wszyscy je udowadniali na głos: LinkedIn, tylko na żywo.\n\nSatyrycy nazywali takich ardeliones: zawsze zajęci niczym. \"Znam senatora\" często znaczyło jedno spojrzenie w łaźni. Dziś \"znam osobiście\" bywa followem na Instagramie."},{"t":"9. Niechciana mixtape","d":"**Poeta Marcjalis pisał całe utwory z prośbą, by inni poeci przestali go łapać w łaźni i na uczcie i czytać mu złe wiersze.** Łaźnia była social mediami: nie dało się uciec od 400 wersów o liściach.\n\nNajgorsze według niego nie była jakość, tylko konieczność udawania zachwytu. Rzymianie mieli słowo recitator: ktoś, kto występuje przed każdym, kto nie zdążył uciec. Dziś: SoundCloud kolegi albo podcast kuzyna."},{"t":"8. Fałszywy zakup","d":"**Rzymianie skarżyli się na podróbki: Pliniusz Starszy o domieszce koziej sierści do wełny, blaknącej purpurze droższej od złota, brązie pokrytym złotem.** Rynek Saepta Julia był jak Amazon z połową śmieci.\n\nInspektorzy (edylowie) mieli łapać oszustów, ale brali łapówki. Jeden kupiec miał sprzedawać sandały rozpuszczające się w deszczu. Po dwóch tysiącach lat: meble z brakującymi śrubami z ogłoszenia."},{"t":"7. Toksyczne miejsce pracy","d":"**System klienteli wymagał od klientów stania o świcie u patrona godzinami za sportulę: koszyk jedzenia, często resztki.** Juwenalis opisywał, jak przy tym samym stole patron je homara, a klient tanie chleb i rozcieńczony ocet.\n\nZawodowi śmieszkowie żartów patrona to \"pasożyty\" (parasiti). Odejście oznaczało utratę dochodu i ochrony. Dziś: \"Sounds great\" na maila w piątek o 23:00."},{"t":"6. Scam romantyczny / spadkowy","d":"**Captatio (\"polowanie na testament\"): oszust obsypuje bezdzietnego bogacza prezentami i pochlebstwami, czekając na spadek.** Pliniusz Młodszy narzekał, że to powszechne i kończy się w sądzie.\n\nWedług autora dzisiejsze romance scamy kosztują ponad miliard dolarów rocznie, celując w samotnych. Metoda się zmieniła, psychologia nie: samotność nie jest naiwnością."},{"t":"5. Obsesja na celebrytach","d":"**Oficjalnie gladiatorzy (auctorati) byli pogardzani, niemal jak przestępcy, a senatorom zakazywano z nimi rozmawiać.** W domu Rzymianie wieszali ich portrety, zbierali figurki i ryli imiona w murach.\n\nGraffiti z Pompejów: \"Celadus Trak sprawia, że dziewczyny wzdychają\". To starożytna relacja parasocjalna: publiczna pogarda, prywatny fandom. Arena stała się ekranem telefonu."},{"t":"4. Kurcząca się torba zakupów","d":"**W III w. państwo psuło monetę: srebro spadało z ok. 85% do 5%, a cena pszenicy z pół denara (ok. 200 n.e.) do 200 denarów (ok. 300).** Handlarze podnosili ceny, wiedząc, że moneta jest bezwartościowa.\n\nW 301 r. Dioklecjan wydał Edykt o cenach maksymalnych na ponad 1000 towarów: kupcy przestali sprzedawać, półki opustoszały, rozkwitł czarny rynek. Dziś: shrinkflation i ciche podwyżki subskrypcji."},{"t":"3. Wellnessowy grifter","d":"**W forum ktoś z brodą i grubym płaszczem uczył, że pieniądze nic nie znaczą, a potem wracał do ładnego domu, wina i służby.** Lukian wyśmiewał takich, którzy biednym mówili o materializmie, a wściekali się o własne drogie rzeczy.\n\nKostium oświecenia, pusta treść. Dziś: cytaty o \"ego death\" w filmiku trzy godziny oświetlanym. Szorstki płaszcz stał się lnianym zestawem wellness, zwój podcastem."},{"t":"2. Niebezpieczna dzielnica","d":"**Juwenalis opisywał nocny Rzym jako pułapkę śmierci: ciemność, bandyci, i śmieci (nawet nocniki) wyrzucane z okien na przechodniów.** Prawo było, ale bez realnej policji egzekucja prawie żadna.\n\nBogaci najmowali ochroniarzy; reszta szła szybko i się modliła. Rozmowa \"nie wracaj sam w nocy\" ma według autora dwa tysiące lat."},{"t":"1. Miażdżący dług","d":"**Obywatele pożyczali, by jeść i płacić czynsz; jedno złe żniwo wpychało rolnika w spiralę.** Limit odsetek to 12% rocznie, ale wielu brało 48% i więcej. Wczesna Republika pozwalała nawet sprzedać dłużnika w niewolę.\n\nPolitycy proponowali ulgi, bogata klasa pożyczkodawców blokowała. Dług był pułapką społeczną, nie prywatną porażką. Rzymianin z 100 p.n.e. zrozumiałby dzisiejszy wyciąg z konta."}],"conclusion":"Autor dowodzi, że Rzymianie narzekali na te same struktury: status, podróbki, inflację, samotność i dług. Zmieniła się platforma, nie psychologia. Zapowiada podobne listy.","factchecks":[{"claim":"Horacy opisał natrętnego name-droppera w satyrze","verdict":"prawda","note":"Satyra 1.9 (\"bore\") to klasyczny opis natręta na Forum.","p":0,"src":[["Wikipedia (ang.): Satyry Horacego - hasło \"Satires (Horace)\"","https://en.wikipedia.org/wiki/Satires_(Horace)"]]},{"claim":"Marcjalis skarżył się na narzucone recytacje poezji","verdict":"prawda","note":"W epigramatach wielokrotnie wyśmiewa natrętnych poetów i recytatorów.","p":1,"src":[["Wikipedia (ang.): Marcjalis - hasło \"Martial\"","https://en.wikipedia.org/wiki/Martial"]]},{"claim":"Zawartość srebra w monetach spadła z ~85% do ~5%","verdict":"prawda","note":"Kryzys III w.: antoninianus i denar uległy silnej dewaluacji.","p":6,"src":[["Wikipedia (ang.): kryzys III wieku - hasło \"Crisis of the Third Century\"","https://en.wikipedia.org/wiki/Crisis_of_the_Third_Century"],["Wikipedia (ang.): dewaluacja rzymska - hasło \"Roman currency\"","https://en.wikipedia.org/wiki/Roman_currency"]]},{"claim":"Edykt Dioklecjana o cenach maksymalnych pogorszył sytuację","verdict":"prawda","note":"Edict on Maximum Prices (301) jest szeroko uznawany za nieskuteczny.","p":6,"src":[["Wikipedia (ang.): edykt o cenach maksymalnych - hasło \"Edict on Maximum Prices\"","https://en.wikipedia.org/wiki/Edict_on_Maximum_Prices"]]},{"claim":"Captatio to rzymskie polowanie na spadki","verdict":"prawda","note":"Dobrze poświadczone w literaturze (Pliniusz, satyrycy) i prawie.","p":4,"src":[["Wikipedia (ang.): captatio benevolentiae / spadki - hasło \"Legacy hunting\"","https://en.wikipedia.org/wiki/Legacy_hunting"]]},{"claim":"Romance scamy kosztują ponad 1 mld USD rocznie","verdict":"prawda","note":"Raporty FTC i podobne agencje USA podają straty rzędu miliardów.","p":4,"src":[["Wikipedia (ang.): oszustwa romantyczne - hasło \"Romance scam\"","https://en.wikipedia.org/wiki/Romance_scam"]]},{"claim":"Wczesna Republika pozwalała sprzedać dłużnika w niewolę","verdict":"prawda","note":"Nexum i egzekucja osobista; ograniczone ustawami w IV-III w. p.n.e.","p":9,"src":[["Wikipedia (ang.): nexum - hasło \"Nexum\"","https://en.wikipedia.org/wiki/Nexum"]]}],"bias":"Luźne analogie Rzym-2026 dla efektu. Anegdoty z satyryków uogólnione. Brak reklam w transkrypcie; ton \"nic się nie zmieniło\"."},{"id":"KALNxcjV0QI","title_pl":"Drogie rzeczy, które są potajemnie kiepskiej jakości","title":"Expensive Things That Are Secretly Poor Quality","channel":"Chill Dude Explains","url":"https://www.youtube.com/watch?v=KALNxcjV0QI","date":"2026-11-01","duration":671,"views":72406,"section":"Chill Dude Explains","transcript":"youtube","added":"2026-11-05","tags":["Mity","Technika","Ciało i zdrowie"],"about":"Od foteli gamingowych i thread count po Wagyu, atrament, trufle, Beats i koła Apple: 10 drogich produktów o słabej wartości.","intro":"Chill Dude Explains rozbija markowy blask: rzeczy, za które płacisz premium, a dostajesz wygląd albo marketing zamiast jakości.\n\nLista od 10 do 1 obejmuje meble, pościel, jedzenie, auta, drukarki, skórę, słuchawki, rasy zwierząt i akcesoria Apple. Każdy punkt to konkretny produkt, mechanizm oszustwa albo niedopowiedzenia i tańsza alternatywa.","points":[{"t":"10. Fotel \"jak z Ferrari\"","d":"**Fotele gamingowe wyglądają jak wyścigowe kubełki, ale według autora są złe do wielogodzinnego siedzenia.** Siedzenia wyścigowe trzymają kierowcę w zakrętach: wąskie i sztywne, nie podpierają kręgosłupa przez 8 godzin.\n\nLędźwiowa poduszka na gumkach robi \"dekoracyjne cierpienie\". Zwykły fotel biurowy (używany Herman Miller, Steelcase Leap) często kosztuje mniej niż nowy gamingowy i wytrzyma dekadę dłużej. Płacisz za estetykę \"poważnego gamera\", nie za zdrowie."},{"t":"9. Kłamstwo thread count","d":"**1500 nici na cal kwadratowy brzmi lepiej niż 400, ale to często sztuczka: cienkie, słabe nitki skręcone i liczone osobno.** Eksperci tekstyliów mówią, że sensowny sufit to ok. 400-600; wyżej prześcieradła są cięższe, mniej oddychające i grzeją jak śpiwór.\n\nHotele pięciogwiazdkowe zwykle biorą 300-400 z długowłóknistej bawełny (egipska, Pima). Materiał ważniejszy niż liczba. FTC ścigało firmy za mylące praktyki, a i tak widać je wszędzie."},{"t":"8. \"Wagyu\" za 28 dolarów","d":"**Słowo Wagyu w USA prawie nie ma ochrony prawnej, więc restauracja może je przykleić do menu.** Prawdziwa wołowina A5 z Japonii ma tak równe marmurkowanie, że plaster topnieje od ciepła dłoni; porcja to ok. 85-110 g, a stek potrafi kosztować ok. 200 dolarów.\n\nW sieciach często jest Wagyu cross: byk Wagyu x amerykańskie bydło, nawet tylko ok. 6% genetyki Wagyu. Reszta to zwykła wołowina z narzutem."},{"t":"7. Luksusowe auto, stary tablet","d":"**Za 80 tys. dolarów dostajesz masaż foteli, a ekran infotainment za 3-5 tys. laguje jak tablet z 2003.** BMW, Mercedes, Audi budują świetne silniki i oprogramowanie, które ledwo ogarnia mapy; nawigacja prowadzi drogami znikniętymi w 2011.\n\nUchwyt telefonu za 15 dolarów z Google Maps bywa lepszy. CarPlay i Android Auto to według autora przyznanie się do porażki. Cykl rozwoju auta to 5-7 lat, więc tech przy premierze jest już skamieliną."},{"t":"6. Atrament droższy od krwi","d":"**Atrament do drukarek to według autora ok. 9600 dolarów za galon (ok. 3,8 l): drożej niż szampan czy \"płynne złoto\".** Drukarka za 30 dolarów to przynęta; zarabia się na kartridżach (model żyletki).\n\nKartridż za 40 dolarów bywa napełniony w 30-40%. Chip kończy pracę, zanim atrament się skończy. Niektóre drukarki nie drukują czerni, gdy brakuje cyjanu, nawet przy tekście."},{"t":"5. Hot dog toreb","d":"**Bonded leather w wielu \"luksusowych\" torebkach to skrawki, pył i klej sprasowane w arkusz z wytłoczoną fakturą.** Bez logo ten sam materiał trafia do rzeczy za 20 dolarów.\n\nPo kilku latach łuszczy się i pęka. Pełnoziarnista skóra (full-grain) bez nazwiska marki według autora przeżyje to o dekady. Płacisz za stempel na odpadzie."},{"t":"4. Fałszywy grzyb","d":"**Prawdziwe trufle to 1000-3000 dolarów za funt (ok. 0,45 kg), rosną pod ziemią, szukają ich psy i tracą smak w kilka dni.** \"Truflowa\" pasta za 40 dolarów prawie na pewno nie dostała prawdziwej trufli.\n\nZamiast tego olej z syntetycznym 2,4-ditiapentanem, głównym związkiem zapachu. Większość olejów truflowych nie ma w ogóle trufli. Gordon Ramsay nazywał to jednym z najbardziej obrzydliwych składników, bo pachnie sztucznie."},{"t":"3. Ciężkie kłamstwo słuchawek","d":"**Beats (200-400 dolarów) są ciężkie, bo w środku przyklejono metalowe obciążniki, nie lepsze głośniki.** Według autora komponenty kosztują ok. 14-18 dolarów. Inżynierowie dźwięku wolą Sennheiser czy Audio-Technica za 80-150 dolarów.\n\nBas jest podbity pod efekt w sklepie, nie pod wierność. Apple kupiło Beats za 3 mld dolarów za markę dla nastolatków, nie za technologię audio."},{"t":"2. Zaprojektowane, by cierpieć","d":"**Francuski buldog za tysiące dolarów ma zbyt małą czaszkę, płaski nos i biodra zbyt wąskie na naturalny poród; prawie każdy rodzi się przez cesarkę.** Według autora właściciel wydaje ok. 5000 dolarów na weterynarza w pierwszych trzech latach.\n\nScottish fold ma złożone uszy przez mutację chrząstki w całym ciele: osteochondrodysplazja, bolesne zrastanie stawów od urodzenia. Im \"słodsze\" uszy, tym często cięższy stan. Rasy wynikają z selekcji pod wygląd."},{"t":"1. Wózek za 700 dolarów","d":"**Apple sprzedaje kółka do wieży Mac Pro za 700 dolarów: cztery kółka bez blokady.** Komputer za 6-50 tys. może odjechać od pchnięcia biurka albo od klimatyzacji.\n\nKrzesło IKEA za kilka dolarów ma blokadę kółek; te nie. Według autora ludzie i tak kupowali, bo przy 20 tys. za komputer kolejne 700 \"nie boli\"."}],"conclusion":"Autor pokazuje schemat: cena za logo, wygląd albo poczucie luksusu, nie za jakość. Każe czytać skład, materiał i niezależne testy zamiast etykiety. Zapowiada podobne listy.","factchecks":[{"claim":"Wysoki thread count bywa zawyżany przez liczenie skręconych nitek","verdict":"prawda","note":"FTC i eksperci tekstyliów ostrzegają przed mylącym \"multi-ply\" counting.","p":1,"src":[["Wikipedia (ang.): gęstość tkania - hasło \"Thread count\"","https://en.wikipedia.org/wiki/Thread_count"]]},{"claim":"\"Wagyu\" w USA nie jest ściśle chronione jak A5 z Japonii","verdict":"prawda","note":"Amerykańskie \"Wagyu\" to często krzyżówki; A5 to japońska skala BMS.","p":2,"src":[["Wikipedia (ang.): Wagyu - hasło \"Wagyu\"","https://en.wikipedia.org/wiki/Wagyu"]]},{"claim":"Atrament do drukarek jest ekstremalnie drogi w przeliczeniu na objętość","verdict":"prawda","note":"Porównania \"drożej niż krew/szampan\" krążą w mediach; model razor-and-blades jest realny.","p":4,"src":[["Wikipedia (ang.): atrament drukarkowy - hasło \"Ink cartridge\"","https://en.wikipedia.org/wiki/Ink_cartridge"]]},{"claim":"Większość \"truffle oil\" to syntetyczny 2,4-ditiapentan","verdict":"prawda","note":"Popularne oleje aromatyzowane chemicznie, bez prawdziwej trufli.","p":6,"src":[["Wikipedia (ang.): olej truflowy - hasło \"Truffle oil\"","https://en.wikipedia.org/wiki/Truffle_oil"]]},{"claim":"Beats mają obciążniki dla wrażenia premium","verdict":"półprawda","note":"Rozbiórki wskazywały metalowe wagi w starszych modelach; jakość audio jest dyskusyjna, nie \"pusta\".","p":7,"src":[["Wikipedia (ang.): Beats Electronics - hasło \"Beats Electronics\"","https://en.wikipedia.org/wiki/Beats_Electronics"]]},{"claim":"Scottish fold cierpi na osteochondrodysplazję","verdict":"prawda","note":"Mutacja chrząstki wiąże się z bolesną chorobą stawów; wiele krajów ogranicza hodowlę.","p":8,"src":[["Wikipedia (ang.): Scottish Fold - hasło \"Scottish Fold\"","https://en.wikipedia.org/wiki/Scottish_Fold"]]},{"claim":"Kółka do Mac Pro kosztowały setki dolarów","verdict":"prawda","note":"Apple Wheel Kit do Mac Pro był sprzedawany w okolicach 699-700 USD.","p":9,"src":[["Wikipedia (ang.): Mac Pro - hasło \"Mac Pro\"","https://en.wikipedia.org/wiki/Mac_Pro"]]}],"bias":"Lista \"drogie = oszustwo\"; pomija przypadki, gdy premium ma sens. Ton clickbaitowy, bez reklam w transkrypcie. Uproszczenia (Wagyu, Beats)."},{"id":"x1dNLmowCLE","title_pl":"Ile mężczyzna lat 30. naprawdę wydawał na ubrania","title":"What a 1930s Man Really Spent on His Clothes (It's Less Than You Think)","channel":"Gentleman's Gazette","url":"https://www.youtube.com/watch?v=x1dNLmowCLE","date":"2026-11-01","duration":493,"views":68507,"section":"Moda","transcript":"youtube","added":"2026-11-05","tags":["Historia mody","Garderoba","Jakość","Klasyczna moda męska"],"about":"Gentleman's Gazette porównuje wydatki na męską garderobę w latach 30. z dzisiejszymi cenami i jakością.","intro":"Gentleman's Gazette, kanał o klasycznej modzie męskiej, pyta, ile naprawdę kosztowała garderoba przeciętnego i zamożniejszego mężczyzny w latach 30. XX wieku. W erze athleisure lat 30. często uważa się za złoty wiek kroju i jakości, ale film zestawia ceny katalogowe z inflacją i dzisiejszymi budżetami.\n\nTo zestawienie pozycja po pozycji: garnitur, koszula, buty, kapelusz, płaszcz dla klasy średniej i wyższej, potem porównanie z wydatkami USA dziś. Wniosek dotyczy nie tylko kwot, lecz tego, co za nie kupowano: mniej rzeczy, ale naprawianych latami.","points":[{"t":"Garderoba klasy średniej","d":"**Urzędnik, sklepikarz czy nauczyciel kupował głównie z katalogów pocztowych i domów towarowych, a trzonem był garnitur.** Gotowy garnitur z Searsa: 7-16 dolarów; zwykle 2-3 sztuki (codzienny, odświętny, zużyty do brudnej pracy), najwyżej jeden nowy rocznie.\n\nKoszula bawełniana: ok. 1-1,50 USD, często z odpinanymi kołnierzykami. Buty skórzane 3-6,50 USD, resolowane zamiast wymieniane. Fedora 2-5 USD była obowiązkowa. Płaszcz 10-15 USD kupowany raz na kilka lat."},{"t":"Udział w dochodzie","d":"**Roczny budżet odzieżowy klasy średniej: ok. 30-50 USD przy dochodzie 1000-1200 USD, czyli mniej więcej 3-5% zarobków.** To kontrast z obrazem \"złotego wieku\", w którym jakość wynikała raczej z naprawy i rotacji niż z wielkiej szafy."},{"t":"Zamożniejszy mężczyzna","d":"**Bankier czy dyrektor brał garnitur made-to-order (np. Brooks Brothers) za ok. 40-65 USD, kilka razy drożej niż Sears.** Do tego koszule na miarę, jedwabne krawaty, angielskie buty 15-25 USD i jednorazowy większy wydatek na smoking lub white tie.\n\nPłaszcz wełniany, czasem z futrzanym kołnierzem, ponad 50 USD, czyli więcej niż cała roczna garderoba klasy średniej. Rocznie upper-middle: ok. 200-400 USD (dziś ok. 4600-9200 USD)."},{"t":"Porównanie z dziś","d":"**Przeciętne amerykańskie gospodarstwo wydaje ok. 406 USD rocznie na odzież męską i 147 USD na obuwie, łącznie ok. 553 USD.** Te same 30-50 USD z depresji to dziś ok. 700-1150 USD według ogólnej inflacji, więc współczesny mężczyzna w surowej sile nabywczej wydaje mniej niż dziadek.\n\nCeny odzieży wzrosły tylko ok. 6-krotnie od lat 30. i w 2024 były blisko poziomu z 1994. W cenach ubrań tamte 30-50 USD to dziś ok. 190-315 USD, a my wydajemy 2-3 razy więcej za większą, słabszą jakościowo szafę."},{"t":"Zmiana modelu konsumpcji","d":"**Udział odzieży w budżacie rodziny spadł z ok. 11% w latach 30. do ok. 3% w 2013.** Kiedyś kupowano mniej, noszono dłużej i naprawiano; dziś kupujemy więcej, nosimy krócej i wymieniamy szybciej.\n\nBespoke Savile Row zaczyna się powyżej ok. 6000 USD i idzie ponad 10 000; zamożny mężczyzna może wydać 10-20 tys. USD rocznie, w podobnym albo wyższym rzędzie co inflacyjnie przeliczony odpowiednik z lat 30., plus kategorie athleisure, których wtedy nie było."},{"t":"Puenta o jakości","d":"**Prawdziwa różnica to nie sama kwota, lecz to, co kupowano: mało rzeczy wysokiej jakości, budowanych do naprawy.** Dziś przeciętna szafa jest pełniejsza, ale bardziej syntetyczna i sezonowa. Przepaść klasowa przesunęła się z \"wełna na miarę vs katalog\" na rzemiosło i ekskluzywność w świecie, gdzie \"wystarczająco dobre\" jest tanie."}],"conclusion":"Autorzy twierdzą, że 200-dolarowe buty to podobny udział budżetu jak kiedyś u urzędnika, jeśli traktować je jak inwestycję na lata. Jakość i naprawa, nie sama niska cena za sztukę, budowały wizerunek lat 30.","factchecks":[{"claim":"Amerykańskie gospodarstwo wydaje ok. 553 USD rocznie na męską odzież i obuwie","verdict":"półprawda","note":"Rząd wielkości z BLS Consumer Expenditure bywa zbliżony, ale kwoty zmieniają się rok do roku i metodą badania.","p":3,"src":[["Wikipedia (ang.): badanie wydatków konsumentów - hasło \"Consumer Expenditure Survey\"","https://en.wikipedia.org/wiki/Consumer_Expenditure_Survey"],["Wikipedia (ang.): wskaźnik cen konsumpcyjnych USA - hasło \"United States Consumer Price Index\"","https://en.wikipedia.org/wiki/United_States_Consumer_Price_Index"]]},{"claim":"Udział odzieży w wydatkach rodzinnych spadł z ~11% do ~3%","verdict":"prawda","note":"Długoterminowe dane BLS pokazują wyraźny spadek udziału odzieży w budżecie gospodarstw USA.","p":4,"src":[["Wikipedia (ang.): Bureau of Labor Statistics - hasło \"Bureau of Labor Statistics\"","https://en.wikipedia.org/wiki/Bureau_of_Labor_Statistics"],["Wikipedia (ang.): historia odzieży - hasło \"History of clothing and textiles\"","https://en.wikipedia.org/wiki/History_of_clothing_and_textiles"]]},{"claim":"Ceny odzieży w 2024 były zasadniczo jak w 1994","verdict":"półprawda","note":"CPI dla apparel rosnął wolniej niż ogólny CPI, ale \"zasadniczo jak 1994\" upraszcza wahania kategorii.","p":3,"src":[["Wikipedia (ang.): CPI USA - hasło \"United States Consumer Price Index\"","https://en.wikipedia.org/wiki/United_States_Consumer_Price_Index"]]},{"claim":"Garnitur Searsa kosztował 7-16 USD w latach 30.","verdict":"prawda","note":"Historyczne katalogi Sears rzeczywiście oferowały gotowe garnitury w podobnych widełkach cenowych.","p":0,"src":[["Wikipedia (ang.): Sears - hasło \"Sears\"","https://en.wikipedia.org/wiki/Sears"]]}],"bias":"Nostalgiczny ton Gentleman's Gazette faworyzuje klasyczną jakość i naprawę. Kwoty uśrednione; mało o regionalnych i klasowych różnicach poza USA."},{"id":"nQGV8QdUYQs","title_pl":"Najbardziej szalone maszyny: od Baggera 293 do NIF","title":"The Most Insane Machines Ever Built","channel":"Some Guy Who Knows Stuff","url":"https://www.youtube.com/watch?v=nQGV8QdUYQs","date":"2026-11-01","duration":1258,"views":27592,"section":"Technologie","transcript":"youtube","added":"2026-11-05","tags":["Technika","Nauka"],"about":"Some Guy Who Knows Stuff: 10 gigantycznych maszyn - koparki, SPMT, dredgi, NR-1, Bertha, DART i lasery NIF.","intro":"Some Guy Who Knows Stuff rankinguje od 10 do 1 maszyny tak duże albo tak osobliwe, że \"pojazd\" przestaje brzmieć adekwatnie. Od kołowej koparki Bagger 293 przez transportery budynków i dredgi wysp po okręt Pioneering Spirit, sondę DART i National Ignition Facility.\n\nKażdy punkt to skala (metry, tony), sposób działania i po co powstała. Jednostki z filmu są przeliczone na metryczne.","points":[{"t":"10-8: Bagger, SPMT, Big Muskie","d":"**Bagger 293 ma ok. 94,5 m wysokości, 220 m długości i waży ok. 14 196 ton - Guinness podaje go jako najcięższy pojazd lądowy.** Koło z 18 łyżkami (ok. 6600 l każda, średnica koła ok. 21,6 m) przenosi do ok. 240 000 m³ urobku dziennie w kopalniach odkrywkowych.\n\nSPMT podnoszą i przesuwają budynki; latarnię Cape Hatteras w 1999 przesunięto o ok. 880 m. Big Muskie (1969, Ohio) to draglina \"chodząca\" na stopach, ok. 13 000 ton, łyżka ok. 168 m³, wycofana w 1991."},{"t":"7-5: dredgi, NR-1, floating dry dock","d":"**Cutter suction dredger tnie dno i pompami przenosi osad rurociągiem - tak powstają sztuczne wyspy (Holandia, Dubaj).** NR-1 (US Navy, 1969) to mała atomowa łódź badawcza: ok. 43 m, ok. 400 ton w zanurzeniu, praca przy dnie do ok. 900 m, wycofana w 2008.\n\nPływający suchy dok zalewa balast, wsuwa statek, pompami wypompowuje wodę i unosi kadłub ponad lustro - dźwigiem jest wyporność."},{"t":"4-2: Bertha, Pioneering Spirit, DART","d":"**Bertha (Seattle, od 2013) to TBM o średnicy ok. 17,5 m, długości ok. 99 m i masie ok. 7000 ton - wtedy największa tarcza na świecie.** Po awarii po ok. 300 m dokończyła tunel pod Alaskan Way Viaduct.\n\nPioneering Spirit (382 x 124 m) podnosi topsides platform do 60 000 ton. DART (NASA, IX 2022) uderzył w Dimorphosa (ok. 160 m) z ok. 22 500 km/h; okres orbity skrócił się o ok. 33 minuty."},{"t":"1: National Ignition Facility","d":"**NIF w Lawrence Livermore używa 192 laserów, by zaimplodować kapsułkę paliwa fuzyjnego wielkości gumki do ołówka.** 5 grudnia 2022: 2,05 MJ energii laserowej na tarczę dało 3,15 MJ energii fuzji - pierwsze laboratoryjne zapłonienie z gainem >1.\n\nW kwietniu 2025 autor podaje rekord 8,6 MJ z 2,08 MJ na tarczę. To nie elektrownia: NIF bada ekstremalne warunki i fuzję inercyjną, nie dostarcza prądu do sieci."}],"conclusion":"Ranking łączy przemysł ciężki z obroną planetarną i fuzją: wspólny mianownik to precyzja w skali, której oko nie ogarnia. Puenta autora: NIF to stadium laserów, optyki i sterowania skupione na milimetrowym celu.","factchecks":[{"claim":"Bagger 293 waży ok. 14 196 ton i jest najcięższym pojazdem lądowym Guinnessa.","verdict":"prawda","note":"Guinness i Wikipedia podają Bagger 293 / TAKRAF RB293 jako heaviest land vehicle.","p":0,"src":[["Wikipedia (ang.): Bagger 293 - hasło \"Bagger 293\"","https://en.wikipedia.org/wiki/Bagger_293"],["Guinness: heaviest land vehicle","https://www.guinnessworldrecords.com/world-records/384401-heaviest-land-vehicle"]]},{"claim":"DART skrócił okres orbity Dimorphosa o ok. 33 minuty.","verdict":"prawda","note":"NASA potwierdziła zmianę okresu o około 33 minuty po uderzeniu we wrześniu 2022.","p":2,"src":[["NASA: DART zmienił ruch planetoidy","https://www.nasa.gov/news-release/nasa-confirms-dart-mission-impact-changed-asteroids-motion-in-space/"]]},{"claim":"NIF 5.12.2022: 2,05 MJ lasera dało 3,15 MJ fuzji (gain >1).","verdict":"prawda","note":"LLNL/DOE ogłosiły pierwsze laboratoryjne ignition z target gain około 1,5.","p":3,"src":[["LLNL: osiągnięcie fusion ignition","https://www.llnl.gov/article/49301/lawrence-livermore-national-laboratory-achieves-fusion-ignition"],["DOE: historia ignition w NIF","https://www.energy.gov/articles/doe-national-laboratory-makes-history-achieving-fusion-ignition"]]},{"claim":"W kwietniu 2025 NIF dał 8,6 MJ fuzji z 2,08 MJ na tarczę.","verdict":"nie da się sprawdzić","note":"Autor podaje rekord z kwietnia 2025; wymaga osobnego komunikatu LLNL poza shotem 2022.","p":3,"src":[["Wikipedia (ang.): National Ignition Facility - hasło \"National Ignition Facility\"","https://en.wikipedia.org/wiki/National_Ignition_Facility"]]}],"bias":"Format top-10 upraszcza inżynierię i kontekst ekologii (odkrywki węgla). Ton podziwu dla skali; sponsoring w transkrypcie niewidoczny."},{"id":"V3JuO5eH8E8","title_pl":"Dziwne gadżety wellness, które naprawdę działają","title":"Weird Wellness Gadgets That Actually Do Something","channel":"Chill Dude Explains","url":"https://www.youtube.com/watch?v=V3JuO5eH8E8","date":"2026-11-01","duration":684,"views":50269,"section":"Chill Dude Explains","transcript":"youtube","added":"2026-11-06","tags":["Ciało i zdrowie","Psychologia","Technika"],"about":"Ranking gadżetów: mata z kolcami, korektor postawy, buty kompresyjne, neurofeedback, float tank, kombinezon EMS.","intro":"Chill Dude Explains przegląda dziwne gadżety wellness, które wyglądają jak rekwizyty z low-budget sci-fi, ale mają sens fizjologiczny. Format: od 10. do 1., p
