<style>
:root{color-scheme:dark}
:root{--ink:#eeeeee;--mut:#999999;--line:#222222;--s1:1.5rem;--s2:1.125rem;--s3:.9375rem;--s4:.875rem;
--v-prawda:#4cc46a;--v-polprawda:#f2c94c;--v-przesada:#ff9440;--v-falsz:#ff5a5a;--v-nds:#8c8c8c;--red:#ff3b30}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#000;color:var(--ink);font:400 var(--s3)/1.6 "Figtree","Helvetica Neue",Arial,sans-serif}
body.lock{overflow:hidden}
a{color:inherit;text-decoration:underline;text-decoration-color:#666;text-underline-offset:3px}
a:hover{text-decoration-color:var(--ink)}
button{font:inherit;color:inherit}
.wrap{max-width:1440px;margin:0 auto;padding:0 24px}
.bar{position:sticky;top:0;z-index:5;background:#000;border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:16px;padding-top:12px;padding-bottom:12px}
h1{font-size:var(--s2);font-weight:600;margin:0;white-space:nowrap;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.ctl{display:flex;gap:10px;flex:1;justify-content:flex-end}
#q{max-width:420px}
input,select{font:inherit;font-size:var(--s3);color:var(--ink);background:#000;border:1px solid #444;border-radius:24px;padding:0 16px;min-height:44px;width:100%;outline:none;-webkit-appearance:none;appearance:none}
select{width:auto;padding-right:32px;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat;cursor:pointer}
input:focus,select:focus{border-color:var(--ink)}
.sync{display:inline-block;width:8px;height:8px;border-radius:50%;background:#6a6a6a;overflow:hidden;color:transparent;font-size:1px;flex:none}
.sync.ok{background:var(--v-prawda)}.sync.off{background:var(--v-przesada)}
main{padding:24px 0 40px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:32px 16px}
@media (max-width:1279px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:899px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:599px){.grid{grid-template-columns:1fr;gap:28px}}
.tile{display:block;text-decoration:none;color:inherit;border-radius:12px;outline-offset:4px}
.th{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#111}
.th img{display:block;width:100%;height:100%;object-fit:cover;transition:opacity .2s}
.dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.8);color:#fff;font-size:.75rem;font-weight:600;line-height:1;padding:4px 5px;border-radius:4px}

.rd{display:none;position:absolute;left:8px;top:8px;background:rgba(0,0,0,.8);color:#fff;font-size:.75rem;font-weight:600;line-height:1;padding:5px 7px;border-radius:4px}
.prog{display:none;position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--red)}
.tile.read .th img{opacity:.4}
.tile.read .rd,.tile.read .prog{display:block}
.tile.read .dur{bottom:12px}
.vbar{display:flex;height:4px;gap:2px;margin:8px 0 0}
.vbar b{display:block;height:100%;border-radius:1px}
.tile h2{font-size:var(--s3);font-weight:600;line-height:1.4;margin:10px 0 2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .meta{color:var(--mut);font-size:var(--s4);margin:0}
.tile.read h2{color:var(--mut)}
.tile:hover h2{text-decoration:underline;text-decoration-color:#666;text-underline-offset:3px}
.empty{color:var(--mut);padding:40px 0}
footer{color:var(--mut);font-size:var(--s4);padding:8px 0 48px}
footer p{margin:0}
.chipw{overflow:hidden}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border:0;border-radius:8px;background:#1c1c1c;color:var(--ink);font-size:.875rem;font-weight:600;text-decoration:none;white-space:nowrap;scroll-snap-align:start;cursor:pointer}
.chip:hover{background:#2a2a2a}
.chip[aria-current="true"]{background:var(--ink);color:#000}
.chip .n{font-weight:400;color:var(--mut);font-size:.75rem}
.chip[aria-current="true"] .n{color:#555}
.sinfo{color:var(--mut);font-size:var(--s4);margin:0 0 16px}
.sinfo:empty{display:none}
/* modal */
.ov{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.8);display:none;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.ov.on{display:block}
.dlg{background:#000;max-width:760px;margin:40px auto;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.mh{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 12px;background:rgba(0,0,0,.9);border-bottom:1px solid var(--line)}
.x{min-height:48px;padding:0 20px;border:1px solid #6a6a6a;border-radius:24px;background:#000;cursor:pointer;font-weight:600}
.x:hover{border-color:var(--ink)}
.rate{display:flex;gap:8px}
.rb{display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;padding:0;border:1px solid #6a6a6a;border-radius:24px;background:#000;cursor:pointer;-webkit-tap-highlight-color:transparent}
.rb svg{width:22px;height:22px;fill:currentColor;display:block}
.rb .on{display:none}
.rb:hover{border-color:var(--ink)}
.rb[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#000}
.rb[aria-pressed="true"] .on{display:block}.rb[aria-pressed="true"] .off{display:none}
.rb:focus-visible,.x:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.rt{display:none;position:absolute;right:8px;top:8px;width:24px;height:24px;border-radius:12px;background:rgba(0,0,0,.8);color:#fff;align-items:center;justify-content:center}
.rt svg{width:14px;height:14px;fill:currentColor;display:block}
.tile.up .rt,.tile.down .rt{display:flex}
.mimg{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;background:#111}
.mb{max-width:640px;margin:0 auto;padding:32px 28px 48px;font-size:1.125rem;line-height:1.6}
.mb p{margin:0}
.mb h2{font-size:1.75rem;font-weight:600;line-height:1.25;margin:0 0 10px;letter-spacing:-.015em}
.mmeta{color:var(--mut);font-size:.875rem;line-height:1.5;margin:0 0 28px!important}
.lead{font-size:1.25rem;line-height:1.55;color:var(--ink);margin:0 0 40px!important}
.pts{list-style:none;margin:0;padding:0}
.pts li{margin:0 0 32px}
.pts h3{font-size:1.25rem;font-weight:600;line-height:1.4;margin:0 0 6px;color:#f5f5f5}
.pts .pd{color:#a8a8a8}
.fcs{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.bdg{display:inline-flex;align-items:center;gap:7px;min-height:32px;padding:0 12px;border:1px solid #333;border-radius:16px;background:#0d0d0d;color:#cfcfcf;font-size:.8125rem;font-weight:600;line-height:1;cursor:pointer}
.bdg:hover,.bdg[aria-expanded="true"]{border-color:#777;color:var(--ink)}
.bdg .dot{width:8px;height:8px;border-radius:50%;margin:0;flex:none}
.bdg .chev{font-weight:400;color:var(--mut);transition:transform .15s}
.bdg[aria-expanded="true"] .chev{transform:rotate(180deg)}
.fx{margin:12px 0 0;padding:14px 16px;border-left:3px solid var(--v-nds);background:#0b0b0b;border-radius:0 8px 8px 0;font-size:1.0625rem;line-height:1.6}
.fx[hidden]{display:none}
.fx .cl{color:var(--ink);font-weight:600;margin:0 0 6px!important}
.fx .nt{color:#a8a8a8}
.fx .sr{margin:8px 0 0!important;font-size:.9375rem;color:var(--mut)}
.fx .sr a{color:#bdbdbd;margin-right:12px;display:inline-block}
.blk{margin:40px 0 0;padding:20px 22px;border:1px solid #2a2a2a;border-radius:12px}
.blk+.blk{margin-top:16px}
.blk h3{font-size:.8125rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:0 0 8px}
.blk p{color:#d6d6d6}
.blk.bias{border-color:#3a2a1a;background:#0c0905}
.mfoot{margin:40px 0 0;padding:20px 0 0;border-top:1px solid var(--line);color:var(--mut);font-size:.875rem;line-height:1.55}
.mfoot p{margin:0 0 10px!important}
.mfoot .orig a{color:#bdbdbd}
.tags{display:flex;flex-wrap:wrap;gap:0 14px;margin:0 0 6px}
.tag{color:var(--mut);background:none;border:0;padding:0;min-height:36px;cursor:pointer;font-size:.875rem}
.tag:hover{color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin:0 0 12px}
.legend span{white-space:nowrap}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.mfoot .vbar{height:4px;margin:0 0 8px;max-width:240px}
.small{color:var(--mut)}
.v-prawda{border-color:var(--v-prawda)!important;background-color:var(--v-prawda)}
.v-polprawda{border-color:var(--v-polprawda)!important;background-color:var(--v-polprawda)}
.v-przesada{border-color:var(--v-przesada)!important;background-color:var(--v-przesada)}
.v-falsz{border-color:var(--v-falsz)!important;background-color:var(--v-falsz)}
.v-nds{border-color:var(--v-nds)!important;background-color:var(--v-nds)}
.fx.v-prawda,.fx.v-polprawda,.fx.v-przesada,.fx.v-falsz,.fx.v-nds{background-color:#0b0b0b}
.ur{min-height:48px;padding:0 20px;border:1px solid #6a6a6a;border-radius:24px;background:#000;cursor:pointer;margin-top:6px;font-size:.9375rem}
.ur:hover{border-color:var(--ink)}
@media (max-width:599px){
 .wrap{padding:0 16px}
 .bar .wrap{flex-wrap:wrap;gap:8px 10px;padding-top:10px;padding-bottom:10px}
 h1{flex:1}
 .ctl{flex-basis:100%;flex-wrap:wrap;gap:8px}
 #q{max-width:none;flex-basis:100%}
 .ctl select{flex:1}
 input,select{font-size:16px}
 main{padding-top:16px}
 .ov{background:#000}
 .dlg{margin:0;border:0;border-radius:0;min-height:100%}
 .mb{padding:24px 20px 48px;font-size:1.0625rem}
 .mb h2{font-size:1.5rem}
 .lead{font-size:1.1875rem;margin-bottom:36px!important}
 .pts h3{font-size:1.125rem}
 .pts li{margin-bottom:28px}
 .blk{padding:18px 18px}
}
</style>
</head>

ący sam do kolegi to był wtorek; dziś to \"sprawdzenie opieki\". Autor: w latach 70. średni \"promień\" dziecka to ok. 6 mil (ok. 10 km), reguła: wróć gdy zapalą się latarnie. Zaginięcie Etana Patza (1979) i newsy o rzadkich porwaniach (ok. 100/rok) skurczyły ten promień o 90% do 2012; potrzeba było ustaw free-range."}],"conclusion":"Normy społeczne potrafią odwrócić się po cichu; wczorajszy \"zdrowy rozsądek\" bywa dziś dziwactwem albo nawet problemem prawnym.","factchecks":[{"claim":"Ok. 2012 masowo zaakceptowano jazdę z obcymi przez aplikacje (Uber i podobne).","verdict":"prawda","note":"Uber wystartował w 2009/2010; boom w USA i globalnie przypada na początek lat 2010.","p":0,"src":[["Wikipedia (ang.): firmy ride-hailing - hasło \"Ridesharing company\"","https://en.wikipedia.org/wiki/Ridesharing_company"]]},{"claim":"Badanie Binghamton: SMS z kropką oceniany jako mniej szczery.","verdict":"prawda","note":"Gunraj i Klin (2015/16): krótkie odpowiedzi tekstowe z kropką uznawano za mniej szczere niż bez.","p":3,"src":[["DOI: Texting insincerely (Computers in Human Behavior)","https://doi.org/10.1016/j.chb.2015.11.003"]]},{"claim":"Gotówka: ok. 40% transakcji USA w 2010, poniżej 20% do 2023.","verdict":"półprawda","note":"Diary Fed: w 2023 gotówka to ok. 16% płatności; \"40% w 2010\" pochodzi ze starszych szacunków, nie z tej serii.","p":5,"src":[["Fed: Diary of Consumer Payment Choice 2024 (PDF)","https://www.frbservices.org/wp-content/uploads/2024-diary-of-consumer-payment-choice.pdf"],["Boston Fed: udział gotówki po pandemii","https://www.bostonfed.org/news-and-events/news/2023/11/cash-crash-pandemic-increasing-credit-card-use-diary-of-consumer-payment-choice.aspx"]]},{"claim":"W 2013 ok. 11% dorosłych USA na portalach randkowych, do 2023 prawie 30%; >40% małżeństw online.","verdict":"półprawda","note":"Pew: ok. 3 na 10 dorosłych kiedykolwiek użyło app/portalu; \"11% w 2013\" i \"40% małżeństw\" to uproszczenia różnych badań.","p":4,"src":[["Pew: kluczowe wnioski trików flirtu: zniknięcie na szczycie rozmowy, kotwica pamięci, wspólny sekret, komplement z drugiej ręki, dotyk, double take i Zeigarnik.","intro":"Chill Dude Explains wylicza 10 technik, które mają sprawić, że ktoś myśli o tobie po rozmowie. Od \"zniknięcia\" na szczycie energii, przez kotwicę pamięci i wspólny sekret, po komplement usłyszany od osób trzecich, lekki dotyk, double take, odwrócony wywiad, otwartą pętlę i małą rysę w \"zbroi\".","points":[{"t":"10. Akt zniknięcia","d":"Największy błąd: zostać za długo, aż energia opadnie i pożegnanie będzie niezręczne. Autor: zakończ rozmowę na szczycie (głośny śmiech, silne połączenie), ciepło wytłumacz się i odejdź. Mózg oczekuje ciągłości, odtwarza najlepsze momenty i \"kręci\" niedokończoną historią. Zostajesz w głowie \"za darmo\"."},{"t":"9. Kotwica pamięci","d":"Najsilniejsze wrażenie ma zostać, gdy jesteś nieobecny. Autor: powiąż się z czymś codziennym (słowo, zapach, piosenka) jak w warunkowaniu klasycznym. Przykład: \"za każdym razem gdy czuję cynamon, myślę o absurdalnej podróży\" - potem bułka cynamonowa przywołuje ciebie. Albo: \"ta piosenka zostanie mi w głowie po dzisiejszym wieczorze\"."},{"t":"8. Wspólny sekret","d":"Szybka bliskość: prywatny świat we dwoje. To nie musi być prawdziwy sekret - drobna obserwacja jako info tylko dla was (np. \"playlista imprezy to katastrofa\"). Powstaje \"my\" vs \"oni\". Autor przywołuje shared reality effect. Klucz: nachyl się, obniż głos, kontakt wzrokowy; nieszkodliwe i obserwacyjne."},{"t":"7. Komplement usłyszany bokiem","d":"Bezpośredni komplement jest przewidywalny. Gdy wspólny znajomy przekazuje: \"Sarah mówiła, że jesteś naprawdę zabawny\", brzmi autentyczniej, bo Sarah nic nie zyskuje. Autor: bądź konkretny (nie \"fajny\", tylko \"jak ogarnął tę niezręczną pytanie\"). Sieć znajomych robi robotę za ciebie."},{"t":"6. Kult we dwoje","d":"Wewnętrzna grupa = prywatny język. Gdy coś dziwnego się wydarzy, nazwij to (wiewiórka kradnie chipsy: \"odważny mały gość\"); przy powtórce wystarczy uśmiech i ta sama fraza. Autor: dyadic uniqueness - pary z prywatnymi odniesieniami czują się bliżej. Wersja zaawansowana: powtarzalna uwaga o nich (\"classic brain glitch\")."},{"t":"5. Przypadkowe muśnięcie","d":"Lekki, krótki dotyk przedramienia ma zwiększać sympatię i zaufanie. Autor: włókna C-tactile i oksytocyna; \"efekt Midasa\" - kelnerki, które krótko dotykały klientów, dostawały wyższe napiwki. Ma być naturalne: przy przejściu muśnij grzbietem dłoni, nie patrz na kontakt, nie rób z tego wydarzenia."},{"t":"4. Double take","d":"Flirt zaczyna się od niewerbalnego sygnału: krótki kontakt wzrokowy, spojrzenie w bok, po chwili wzrok wraca, jakby coś przyciągnęło ponownie. Autor: odejście wzroku najpierw nie wygląda na desperację; drugi rzut budzi ciekawość. Słodki punkt: przerwa ok. 2-4 s. Długie wpatrywanie robi z kogoś \"ofiarę\"."},{"t":"3. Odwrócony wywiad","d":"Zamiast CV-pytania (\"co robisz?\") zapytaj: \"co ludzie zwykle źle o tobie myślą na początku?\". Każdy ma lukę między wizerunkiem a sobą. Po odpowiedzi nie graj od razu o sobie - kiwnij i powiedz, że to ma sens. Autor: ludzie ciągną do tych, którzy sprawiają, że czują się zrozumiani."},{"t":"2. Otwarta pętla","d":"Mózg nie lubi niedokończonych spraw (autor: \"zygarnic effect\" = efekt Zeigarnik). Zacznij ciekawą historię i na kulminacji miękko przerwij (\"muszę to ogarnąć, sekundę\"). Albo: \"mam sekret\" i odejdź, gdy coś naturalnie przerywa. Jedyna droga do domknięcia: znaleźć cię znowu."},{"t":"1. Pęknięcie zbroi","d":"Ludzie łączą się z realnym, nie z idealnym. Wcześnie przyznaj małą, nieszkodliwą wadę (\"boję się gołębi\", \"nie umiem parkować równolegle\"). Autor powołuje się na pratfall effect: kompetentna osoba po drobnym błędzie bywa bardziej lubiana. Klucz: małe i urocze, nie czerwona flaga."}],"conclusion":"Według autora przyciąganie buduje niedopowiedzenie, wspólny świat i człowieczeństwo, a nie perfekcyjna autoprezentacja.","factchecks":[{"claim":"Kotwica pamięci to warunkowanie klasyczne: bodziec neutralny + pozytywne uczucie.","verdict":"prawda","note":"Opis mechanizmu Pawłowa jest poprawny; skuteczność jako \"trik flirtu\" to już spekulacja autora.","p":1,"src":[["Wikipedia (ang.): warunkowanie klasyczne - hasło \"Classical conditioning\"","https://en.wikipedia.org/wiki/Classical_conditioning"]]},{"claim":"Lekki dotyk aktywuje włókna C-tactile i uwalnia oksytocynę (efekt Midasa).","verdict":"półprawda","note":"Włókna CT i oksytocyna są badane przy delikatnym dotyku; \"efekt Midasa\" dotyczy głównie napiwków, nie flirtu w ogóle.","p":5,"src":[["Wikipedia (ang.): aferenty C-tactile","https://en.wikipedia.org/wiki/C_tactile_afferent"],["Wikipedia (ang.): oksytocyna - hasło \"Oxytocin\"","https://en.wikipedia.org/wiki/Oxytocin"],["Wikipedia (ang.): Midas touch (psychologia)","https://en.wikipedia.org/wiki/Midas_touch"]]},{"claim":"Efekt Zeigarnik: mózg trzyma niedokończone sprawy mocniej.","verdict":"prawda","note":"Klasyczny efekt Zeigarnik dotyczy lepszej pamięci zadań niedokończonych; film błędnie pisze \"zygarnic\".","p":8,"src":[["Wikipedia (ang.): efekt Zeigarnik - hasło \"Zeigarnik effect\"","https://en.wikipedia.org/wiki/Zeigarnik_effect"],["Wikipedia (pl.): efekt Zeigarnik","https://pl.wikipedia.org/wiki/Efekt_Zeigarnik"]]},{"claim":"Pratfall effect: kompetentna osoba po małym błędzie jest bardziej lubiana.","verdict":"prawda","note":"Efekt pratfallu (Aronson) jest opisany w psychologii społecznej; działa głównie przy wysokiej kompetencji wyjściowej.","p":9,"src":[["Wikipedia (ang.): pratfall effect","https://en.wikipedia.org/wiki/Pratfall_effect"]]},{"claim":"Shared reality / dyadic uniqueness: wspólny sekret i inside joke szybko budują więź.","verdict":"półprawda","note":"Badania o wspólnej rzeczywistości i prywatnym języku par istnieją, ale \"w 5 sekund\" to marketingowe uproszczenie.","p":[2,5],"src":[["Wikipedia (ang.): classical conditioning (kontekst asocjacji)","https://en.wikipedia.org/wiki/Classical_conditioning"]]}],"bias":"Lista \"hacków\" jak pewne triki psychologii; efekty bywają realne, ale kontekst flirtu, zgoda i kultura są pominięte. Bez reklam produktowych, na końcu prośba o subskrypcję."},{"id":"difPlwouuPY","title_pl":"Gdy pęknie bańka AI: lekcja z cmentarzyska drewnianych statków","title":"When the AI bubble pops...","channel":"Phil Edwards","url":"https://www.youtube.com/watch?v=difPlwouuPY","date":"2026-11-02","duration":861,"views":97911,"transcript":"youtube","added":"2026-11-03","tags":["Historia","Technika"],"about":"Autor porównuje boom centrów danych AI do drewnianych statków z I wojny światowej, które dziś leżą w zatoce Mallows Bay.","intro":"Phil Edwards płynie kajakiem po Mallows Bay w Maryland, gdzie leży ponad 100 drewnianych statków z I wojny światowej. Porównuje ten pospieszny program budowy do dzisiejszego boomu centrów danych AI. Pokazuje, że bańka to nie tylko spekulacja finansowa, ale też fizyczne pozostałości po nadmiernej budowie. Film ma sponsora (Hostinger).","points":[{"t":"Centra danych zmieniają krajobraz","d":"Zdjęcia satelitarne przed i po pokazują, jak setki centrów danych za miliardy dolarów zastępują pola, np. centrum Amazona w Karolinie Północnej i Clarksville w Arkansas. Od Data Center Alley w Wirginii do Mallows Bay jest ok. 137 km."},{"t":"Pośpiech bez znanego terminu","d":"W 1917 r. USA założyły Emergency Fleet Corporation, by przy niedoborze stali szybko budować statki na wojnę. Wydano setki milionów dolarów, a nikt nie wiedział, kiedy wojna się skończy, tak jak dziś nie wiadomo, kiedy nastąpią przełomy w AI."},{"t":"Bańka pochłania zasoby","d":"Gazeta pisała o 68 planach budowy na 375 statków z sosny długoigielnej, której nie wolno było sprzedawać gdzie indziej, choć nie była dobrym materiałem. Autor porównuje to do drożejącej pamięci komputerowej wykupywanej przez boom AI."},{"t":"Nowa infrastruktura","d":"W ciągu 2 lat przybyło 120 stoczni i 657 pochylni. Według autora to dokładnie odpowiada dzisiejszej budowie elektrowni i sieci dla centrów danych."},{"t":"Polityka pompuje bańkę","d":"Hasło wyścigu z Chinami napędza inwestycje w AI, np. projekt Stargate w Teksasie Trumpa i OpenAI. Po I wojnie szef Shipping Board bronił niewykorzystanych statków, bo w czasie wojny nie ma nadwyżek. Bańka pękła, gdy wojna skończyła się wcześniej, niż sądzono."},{"t":"Gorszy materiał, gorsza budowa","d":"Drewniane statki były słabsze nie tylko przez trwałość: wymagały dużo więcej wzmocnień wewnątrz niż stalowe. Najpopularniejszy był projekt Design 1001; po wojnie statki były drogie w utrzymaniu, a w 1925 r. odholowano je do Mallows Bay."},{"t":"Niepewność centrów danych","d":"Wiele centrów danych powstaje bez stabilnego zasilania, a nie wiadomo, czy GPU w środku za 5 lat będą coś warte. Niejasne jest też, czy AI nie przeniesie się na lokalne urządzenia; Apple według autora na to stawia."},{"t":"Płonący basen i złom","d":"Statki malowano kamuflażem dazzle, który radar uczynił prawie bezużytecznym. W II wojnie rząd zaryzykował 200 000 dolarów, by odzyskać co najmniej 11 000 ton metalu: statki spalono w basenie i wyciągano złom elektromagnesem. Dziś to rezerwat przyrody morskiej."},{"t":"Lekcja światłowodów","d":"Boom światłowodowy z lat 2000. uznano wtedy za klapę, ale ta infrastruktura zbudowała współczesny internet. Autor sądzi, że AI nie pęknie nagle jak koniec wojny, ale boom zostawi i użyteczne rzeczy, i drewniane statki."}],"conclusion":"Nawet jeśli AI zostanie, boom budowy zostawi po sobie niepotrzebną infrastrukturę i przekształci krajobraz.","factchecks":[{"claim":"W Mallows Bay leży ponad 100 drewnianych statków z I wojny światowej.","verdict":"prawda","note":"Wraków statków z programu wojennego jest tam ok. 230; od 2019 r. to rezerwat morski NOAA.","p":null,"src":[["Wikipedia (ang.): zatoka Mallows Bay - hasło \"Mallows Bay\"","https://en.wikipedia.org/wiki/Mallows_Bay"],["NOAA: rezerwat Mallows Bay-Potomac River","https://sanctuaries.noaa.gov/mallows-potomac/"]]},{"claim":"Emergency Fleet Corporation powstała w 1917 r.","verdict":"prawda","note":"Utworzono ją 16 kwietnia 1917 r. przy U.S. Shipping Board.","p":1,"src":[["Wikipedia (ang.): Emergency Fleet Corporation - hasło \"Emergency Fleet Corporation\"","https://en.wikipedia.org/wiki/Emergency_Fleet_Corporation"]]},{"claim":"Design 1001 był najpopularniejszy, a w 1925 r. statki odholowano do Mallows Bay.","verdict":"prawda","note":"Design 1001 (typ Ferris) z sosny lub daglezji był standardowym projektem; holowanie w 1925 r. potwierdza Wikipedia.","p":5,"src":[["Wikipedia (ang.): statek typu Design 1001 - hasło \"Design 1001 ship\"","https://en.wikipedia.org/wiki/Design_1001_ship"],["Wikipedia (ang.): zatoka Mallows Bay - hasło \"Mallows Bay\"","https://en.wikipedia.org/wiki/Mallows_Bay"]]},{"claim":"Statki spalono w II wojnie, by odzyskać metal.","verdict":"półprawda","note":"Spalono je już ok. 1925 r. po bankructwie firmy złomowej; w II wojnie Bethlehem Steel zbudowało basen do odzysku metalu.","p":7,"src":[["Wikipedia (ang.): zatoka Mallows Bay - hasło \"Mallows Bay\"","https://en.wikipedia.org/wiki/Mallows_Bay"]]},{"claim":"Kamuflaż dazzle stał się prawie bezużyteczny przez radar.","verdict":"prawda","note":"Tracił sens wraz z dalmierzami i lotnictwem, a w II wojnie radar dodatkowo osłabił jego działanie.","p":7,"src":[["Wikipedia (ang.): kamuflaż dazzle - hasło \"Dazzle camouflage\"","https://en.wikipedia.org/wiki/Dazzle_camouflage"]]},{"claim":"Stargate w Teksasie uzasadniano wyścigiem z Chinami.","verdict":"prawda","note":"Stargate buduje centra danych w Abilene w Teksasie; ogłoszono go w Białym Domu w 2025 r.","p":4,"src":[["Wikipedia (ang.): projekt Stargate - hasło \"Stargate LLC\"","https://en.wikipedia.org/wiki/Stargate_LLC"]]},{"claim":"Apple stawia na AI uruchamianą lokalnie.","verdict":"półprawda","note":"Apple Intelligence działa głównie na urządzeniu, ale trudniejsze zadania wysyła do chmury Private Cloud Compute.","p":6,"src":[["Apple: zapowiedź Apple Intelligence (2024)","https://www.apple.com/newsroom/2024/06/introducing-apple-intelligence-for-iphone-ipad-and-mac/"]]},{"claim":"Nadmiar światłowodów z boomu stał się potem podstawą internetu.","verdict":"prawda","note":"Nadwyżkę po krachu dot-com nazwano ciemnym włóknem; później stworzyła nowy rynek usług.","p":8,"src":[["Wikipedia (ang.): ciemne włókno - hasło \"Dark fibre\"","https://en.wikipedia.org/wiki/Dark_fibre"],["Wikipedia (ang.): bańka internetowa - hasło \"Dot-com bubble\"","https://en.wikipedia.org/wiki/Dot-com_bubble"]]}],"bias":"Analogia luźna i wybiórcza: wojenny program rządu to nie prywatne inwestycje. Sponsor Hostinger chwalony jako platforma AI, co kłóci się z tematem filmu.","section":"Historia"},{"id":"LpeDuC2sQ-w","title_pl":"Małe zmiany, które 10 razy poprawiają życie","title":"Tiny Changes For A 10x Better Life","channel":"Chill Dude Explains","url":"https://www.youtube.com/watch?v=LpeDuC2sQ-w","date":"2026-11-02","duration":563,"views":49922,"section":"Chill Dude Explains","transcript":"youtube","added":"2026-11-04","tags":["Psychologia","Ciało i zdrowie"],"about":"Dziesięć małych nawyków: od tekstu o celach i światła rano po wodę przed kawą i odsubskrybowanie toksycznych kont.","intro":"Lista 10 drobnych zmian, które według autora dają niesymetrycznie duży efekt: tekst o odpowiedzialności za cel, nazwa budzika z powodem wstania, tarcia utrudniające złe nawyki, światło rano na twarz, postawa, zasada \"nigdy dwa razy z rzędu\", przygotowanie wieczorem, ścielenie łóżka, odsubskrybowanie kont, które robią źle, oraz szklanka wody zaraz po przebudzeniu.","points":[{"t":"Tekst o odpowiedzialności","d":"Według autora badanie Gail Matthews pokazało 76% realizacji celów u osób, które je zapisały i wysyłały postępy znajomemu, wobec 43% u tych, którzy tylko o nich myśleli. Lepiej powiedzieć komuś, kto zauważy brak postępu, niż najbardziej wspierającemu przyjacielowi."},{"t":"Budzik z prawdziwą nazwą","d":"Zamiast \"Alarm\" nazwij budzik powodem wstania, np. rozmowa o pracę za 90 minut. Półprzytomny mózg dostaje konsekwencje zamiast negocjacji o 5 minut. Autor mówi, że to zajmuje 4 sekundy."},{"t":"Tarcie przeciw złemu nawykowi","d":"Zwiększ trudność złego zachowania: wyloguj się z Instagrama, schowaj chipsy na najwyższą półkę. Dla dobrych nawyków zrób odwrotnie: buty przy łóżku, witaminy przy ekspresie. Mózg wybiera najłatwiejszą ścieżkę."},{"t":"Światło rano na twarz","d":"Wyjdź na 5 minut na zewnątrz bez okularów i okna. Światło na siatkówkę resetuje zegar biologiczny: więcej kortyzolu rano, melatonina we właściwym czasie wieczorem. Telefon w ciemnym pokoju tego nie daje."},{"t":"Postawa i tlen","d":"Głowa człowieka waży ok. 5,4 kg. Przy garbieniu klatka piersiowa zapada się i według autora płuca mają ok. 30% mniej miejsca. Cue: wyobraź sobie sznurek ciągnący czubek głowy w górę; łącz z nawykiem (telefon, kawa)."},{"t":"Nigdy dwa razy z rzędu","d":"Można opuścić jeden dzień. Drugi to już decyzja, trzeci to nowa norma (abstinence violation effect). Powrót może być 5-minutowy trening: chodzi o sygnał \"dalej jestem tą osobą\"."},{"t":"Zwolnij poranny mózg","d":"Wieczorem przygotuj ubranie, lunch i klucze (ok. 10 minut). Oszczędzasz poranną energię decyzyjną, zanim zacznie się właściwy dzień."},{"t":"Ścielenie łóżka","d":"Według autora to keystone habit: mały poranny sygnał kontroli. Astronauci na ISS też ścielą śpiwory. Badanie cytowane w filmie łączy ścielenie z większym poczuciem szczęścia i produktywności."},{"t":"Odsubskrybuj duchy","d":"Konta, po których czujesz się gorzej, logują w mózgu \"wszyscy radzą sobie lepiej\". Pasywne scrollowanie wiąże się z lękiem i depresją. Pytanie: czy to mnie poprawia czy pogarsza? Jeśli pogarsza - unfollow."},{"t":"Woda przed kawą","d":"Przez sen tracisz ok. 1 litr wody. Mózg to ok. 75% wody. Kawa jako diuretyk pogarsza odwodnienie. Szklanka wody na stoliku nocnym przed telefonem i kawą."}],"conclusion":"Małe tarcia, światło, woda i odpowiedzialność przed drugą osobą działają lepiej niż sama siła woli.","factchecks":[{"claim":"Badanie Gail Matthews: 76% vs 43% realizacji celów przy odpowiedzialności.","verdict":"półprawda","note":"Liczby z komunikatu Dominican University; 76% to grupa z zapisem, planem i cotygodniowymi raportami.","p":0,"src":[["Dominican University: podsumowanie badania Gail Matthews o celach","https://www.dominican.edu/sites/default/files/2020-02/gailmatthews-harvard-goals-researchsummary.pdf"],["Wikipedia (ang.): wyznaczanie celów - hasło \"Goal setting\"","https://en.wikipedia.org/wiki/Goal_setting"]]},{"claim":"Poranne światło resetuje zegar biologiczny (kortyzol, melatonina).","verdict":"prawda","note":"Światło na siatkówkę to główny synchronizator rytmu około-dobowego u człowieka.","p":3,"src":[["Wikipedia (ang.): rytm około-dobowy - hasło \"Circadian rhythm\"","https://en.wikipedia.org/wiki/Circadian_rhythm"]]},{"claim":"Zmęczenie decyzyjne: poranne wybory wyczerpują dzienny budżet decyzji.","verdict":"półprawda","note":"Pojęcie istnieje w psychologii, ale siła i zakres efektu są przedmiotem sporów badawczych.","p":6,"src":[["Wikipedia (ang.): zmęczenie decyzyjne - hasło \"Decision fatigue\"","https://en.wikipedia.org/wiki/Decision_fatigue"]]},{"claim":"Pasywne scrollowanie Instagrama zwiększa lęk i depresję.","verdict":"półprawda","note":"Są korelacje z porównaniami społecznymi, ale związek przyczynowy i wielkość efektu są mieszane.","p":8,"src":[["Wikipedia (ang.): teoria porównań społecznych - hasło \"Social comparison theory\"","https://en.wikipedia.org/wiki/Social_comparison_theory"]]}],"bias":"Rozrywkowy poradnik bez źródeł w filmie. Reklamy brak; upraszcza badania (Matthews) i biologię do catchy punktów."},{"id":"T8Oh_R9pR6I","title_pl":"Dr Krzysztof Radtke: polska misja w Mastabie Faraona i pole grobowców pod piaskiem","title":"Miało tam nic nie być. Polacy odkryli podziemne pole grobowców w Egipcie","channel":"didaskalia","url":"https://www.youtube.com/watch?v=T8Oh_R9pR6I","date":"2026-11-01","duration":4005,"views":163955,"section":"Didaskalia","transcript":"youtube","added":"2026-11-03","tags":["Historia","Archeologia","Egipt"],"about":"Archeolog z PAN o grobowcu faraona Szepseskafa w Sakkarze, polskiej szkole archeologii i o tym, jak naprawdę wygląda praca w Egipcie.","intro":"Patrycjusz Wyżga rozmawia z dr. Krzysztofem Radtke z Instytutu Kultur Śródziemnomorskich i Orientalnych PAN, członkiem polsko-egipskiej misji w Mastabie Faraona w Sakkarze (listopad 2026). Mowa o tym, czemu faraon zbudował mastabę zamiast piramidy, co pokazała geofizyka, jak powstała polska szkoła archeologii i jak zebrano pieniądze na wyjazd.","points":[{"t":"Mastaba zamiast piramidy","d":"Mastaba to grobowiec przypominający ściętą piramidę. Szepseskaf, władca z końca IV dynastii, zbudował ją, choć piramidy w Gizie już stały. Może to wiązać się z konfliktem z kapłanami z Gizy, ale odpowiedzi jeszcze nie ma."},{"t":"Miało tam nic nie być","d":"Badania geofizyczne pokazały wokół mastaby pole grobowców i konstrukcji pod piaskiem. Wcześniej zakładano, że teren jest pusty, więc nikt go nie badał. Szczegóły ogłosi wspólnie misja polsko-egipska."},{"t":"Na czym polega praca","d":"Najpierw dokładne pomiary całej budowli, potem oczyszczanie wnętrza i przesiewanie piasku. Znaleziska to fragmenty ceramiki i części sarkofagu, które trzeba zinwentaryzować i złożyć jak puzzle."},{"t":"Recykling kamienia","d":"Egipcjanie byli praktyczni. Z budowli, które się rozpadły, brali kamień, zamiast sprowadzać go np. z Asuanu. Dlatego wiele grobowców zachowało się tylko częściowo."},{"t":"Wejście do wnętrza","d":"Pierwsze zejście przez wąskie przejście w głąb mastaby było dla gościa stresujące jak w filmie przygodowym. Dotknięcie miejsca, którego nikt nie dotykał od tysięcy lat, nazywa solą archeologii."},{"t":"Początki polskiej szkoły","d":"Prof. Kazimierz Michałowski zaczął wykopaliska w Edfu przed wojną razem z Francuzami. Polskie misje słynęły z badań kompleksowych, z architektami i numizmatykami, oraz z publikowania wyników po każdym sezonie."},{"t":"Freski z Faras","d":"W latach 60. Polacy uczestniczyli w ratowaniu zabytków Nubii przed zalaniem. Freski z katedry w Faras trafiły częściowo do Muzeum Narodowego w Warszawie, w czasach gdy znaleziska dzielono między kraje."},{"t":"Odkryto może 20%","d":"Według szacunków archeologów spod piasku wydobyto dopiero ok. 20% tego, co kryje Egipt. Wiedzę buduje się mozolnie, małymi elementami, by luk nie wypełniały pseudonaukowe teorie."},{"t":"Indiana Jones a nauka","d":"Filmy to rozrywka bez nauki, ale przyciągają ludzi do archeologii. Zwykła praca to pędzelek i powolne odsłanianie drobnych elementów."},{"t":"Rzemieślnicy i kunszt","d":"Wiedzę w warsztatach przekazywano ustnie i przez praktykę. Doskonałe dekoracje grobowców, np. w grobowcu w Dolinie Zachodniej w Tebach, gość uważa za największe skarby tej kultury."},{"t":"Zbiórka i biznes","d":"Instytutowi brakowało ok. 250 tys. zł na sezon. Apel o wpłaty trafił przez pomyłkę na stronę ministerstwa, co nagłośniło sprawę. Dziś misję wspierają m.in. firmy."}],"conclusion":"Rzeczowa rozmowa o archeologii od kuchni. Mniej sensacji niż w tytule, sporo o finansowaniu i historii polskich badań.","factchecks":[{"claim":"Szepseskaf był synem Mykerinosa i ostatnim władcą IV dynastii.","verdict":"półprawda","note":"To najpewniej ostatni król IV dynastii, ale to, że był synem Mykerinosa, jest tylko prawdopodobne.","p":0,"src":[["Wikipedia (ang.): Szepseskaf - hasło \"Shepseskaf\"","https://en.wikipedia.org/wiki/Shepseskaf"]]},{"claim":"Michałowski zaczął badania w Edfu w 1937 r. razem z misją francuską.","verdict":"półprawda","note":"Współpraca z francuskim instytutem się zgadza, ale Wikipedia podaje, że prace ruszyły w 1936 r.","p":5,"src":[["Wikipedia (ang.): Kazimierz Michałowski - hasło \"Kazimierz Michałowski\"","https://en.wikipedia.org/wiki/Kazimierz_Michałowski"]]},{"claim":"Freski z Faras trafiły do Muzeum Narodowego w Warszawie.","verdict":"prawda","note":"66 malowideł przewieziono do Polski, reszta jest w Chartumie.","p":6,"src":[["Wikipedia (ang.): Faras - hasło \"Faras\"","https://en.wikipedia.org/wiki/Faras"]]}],"bias":"Gość mówi o własnej misji i instytucie, więc to perspektywa zaangażowana. Odcinek ma partnera reklamowego (salon optyczny)."},{"id":"OE4reSHHj_8","title_pl":"Mało znane strony, które robią cię niebezpiecznie mądrym","title":"Obscure Websites That Will Make You Dangerously Smart","channel":"Chill Dude Explains","url":"https://www.youtube.com/watch?v=OE4reSHHj_8","date":"2026-10-31","duration":750,"views":50469,"section":"Chill Dude Explains","transcript":"youtube","added":"2026-11-04","tags":["Nauka","Technika","Historia"],"about":"Dziesięć niszowych stron: od Nukemap i chemii Lowe'a przez Import Yeti i Retraction Watch po Metaculus i lekcje NASA.","intro":"Przegląd 10 mało znanych stron według autora: Nukemap (wizualizacja skutków wybuchu), Things I Won't Work With, Forensically, Import Yeti, Spurious Correlations, Retraction Watch, The Evolution of Trust, Aviation Safety Network, Metaculus oraz baza Lessons Learned NASA z własnymi wpadekami agencji.","points":[{"t":"Nukemap","d":"Historyk Alex Wellerstein: wybierasz miasto i ładunek, mapa rysuje strefy. Hiroszima 15 kt wygląda \"mało\"; współczesna głowica wielokrotnie większa. Tsar Bomba (50 Mt, 1961) według autora daje oparzenia III stopnia z ok. 100 km."},{"t":"Things I Won't Work With","d":"Chemik Derek Lowe opisuje substancje, których unika. Chlorotrifluorek: pali nawet azbest, beton i rdzę; według relacji 408 kg wylało się i przepaliło ok. 30 cm betonu oraz ok. 90 cm żwiru. FOOF wybucha przy kontakcie z lodem."},{"t":"Forensically","d":"Darmowa analiza zdjęć w przeglądarce: wykrywanie klonów, szumu i error level analysis. Autor przypomina sprawę Iranu 2008 z doklejonym pociskiem. Metadane (aparat, GPS, software) to wskazówka, nie dowód."},{"t":"Import Yeti","d":"Wyszukiwarka amerykańskich bill of lading: kto wysłał, kto odebrał, co i ile. Pokazuje fabryki marek i wspólne dostawy \"premium\" z tańszymi konkurentami. Tylko fracht morski; część firm ukrywa dane."},{"t":"Spurious Correlations","d":"Tyler Vigen: przypadkowe korelacje (ser vs śmierć w pościeli 95%; Cage vs utopienia; Maine divorces vs margaryna 99%). Dwa osie Y i miliardy par danych tworzą \"sens\" z przypadku. Bociany i dzieci: większe kraje mają więcej obu."},{"t":"Retraction Watch","d":"Baza 50 tys.+ wycofanych prac. Yoshitaka Fuji: rekord 180+ retrakcji. Prace \"żyją\" w cytowaniach latami. 1998 vaccines-autism: 12 lat do wycofania. 2023: rekord 10 tys.+ retrakcji, w tym paper mills."},{"t":"The Evolution of Trust","d":"Gra Nicky Case o współpracy. Tit for tat wygrał turniej Axelroda w latach 80. Nietoperze dzielą się krwią, ale pamiętają oszustów. Zaufanie zależy od powtórzeń i wypłaty za współpracę."},{"t":"Aviation Safety Network","d":"Baza wypadków. Comet 1954: pęknięcia przy kwadratowych oknach. Air Canada 767 (1983): pomyłka funtów i kilogramów, szybowanie na starą bazę (69 osób). Tenerife 1977: słowo \"takeoff\" dostało ścisłą regułę."},{"t":"Metaculus","d":"Prognozy procentowe z punktacją: pewność + błąd = duża kara. Publiczna historia kalibracji. Superforecasterzy wygrywają, bo zmieniają zdanie przy nowych faktach. Agregat bywa lepszy niż najgłośniejszy ekspert."},{"t":"NASA Lessons Learned","d":"Publiczna baza wpadek. Mars Climate Orbiter 1998: funty siły vs niutony (1 lbf ≈ 4,45 N), sonda zniknęła. Genesis 2004: czujniki odwrotnie, uderzenie w Utah ok. 320 km/h. Hubble: lustro źle o 1/50 grubości włosa."}],"conclusion":"Najwięcej uczą strony, które pokazują własne błędy, przypadkowe korelacje i reguły napisane czyjąś katastrofą.","factchecks":[{"claim":"Tsar Bomba miała ok. 50 megaton; Nukemap to projekt Wellera.","verdict":"prawda","note":"Tsar Bomba (1961) to największy przetestowany ładunek; Nukemap jest publicznym narzędziem edukacyjnym.","p":0,"src":[["Nukemap: oficjalna strona projektu Alexa Wellersteina","https://nuclearsecrecy.com/nukemap/"],["Wikipedia (ang.): Tsar Bomba - hasło \"Tsar Bomba\"","https://en.wikipedia.org/wiki/Tsar_Bomba"]]},{"claim":"Chlorotrifluorek pali materiały uznawane za niepalne, w tym beton.","verdict":"prawda","note":"ClF3 jest ekstremalnie silnym utleniaczem; incydenty przemysłowe są udokumentowane.","p":1,"src":[["Wikipedia (ang.): chlorotrifluorek - hasło \"Chlorine trifluoride\"","https://en.wikipedia.org/wiki/Chlorine_trifluoride"],["Wikipedia (ang.): Derek Lowe (chemik) - hasło \"Derek Lowe (chemist)\"","https://en.wikipedia.org/wiki/Derek_Lowe_(chemist)"]]},{"claim":"Tit for tat wygrał turniej Axelroda; strona Evolution of Trust to uczy.","verdict":"prawda","note":"Strategia tit-for-tat wygrała słynne turnieje dylematu więźnia Axelroda.","p":6,"src":[["The Evolution of Trust: interaktywna gra Nicky Case","https://ncase.me/trust/"],["Wikipedia (ang.): tit for tat - hasło \"Tit for tat\"","https://en.wikipedia.org/wiki/Tit_for_tat"]]},{"claim":"Mars Climate Orbiter zginął przez pomyłkę jednostek (lbf vs N).","verdict":"prawda","note":"Oficjalne dochodzenie NASA potwierdziło brak konwersji jednostek między zespołami.","p":9,"src":[["Wikipedia (ang.): Mars Climate Orbiter - hasło \"Mars Climate Orbiter\"","https://en.wikipedia.org/wiki/Mars_Climate_Orbiter"],["NASA: Lessons Learned Information System","https://llis.nasa.gov/"]]},{"claim":"Tenerife 1977 to najtragiczniejszy wypadek lotniczy; Comet pękał przy oknach.","verdict":"prawda","note":"Katastrofa na Tenerife jest najtragiczniejsza w historii; Comety miały problemy zmęczeniowe przy kwadratowych oknach.","p":7,"src":[["Wikipedia (ang.): katastrofa na Tenerife - hasło \"Tenerife airport disaster\"","https://en.wikipedia.org/wiki/Tenerife_airport_disaster"],["Wikipedia (ang.): de Havilland Comet - hasło \"De Havilland Comet\"","https://en.wikipedia.org/wiki/De_Havilland_Comet"],["Aviation Safety Network: baza wypadków lotniczych","https://aviation-safety.net/"]]}],"bias":"Lista \"wow websites\"; część punktów (broń jądrowa, katastrofy) jest sensacyjna. Reklamy brak. Procenty korelacji i anegdoty chemiczne bez numerów prac."},{"id":"1qEPZT1FQs0","title_pl":"Więc MacBooki mają teraz ekrany dotykowe","title":"So, Apple MacBooks have touch screens now","channel":"NikTek","url":"https://www.youtube.com/watch?v=1qEPZT1FQs0","date":"2026-10-28","duration":77,"views":386134,"transcript":"youtube","added":"2026-11-03","tags":["Technika"],"about":"Krótki montaż: Steve Jobs mówi, że pionowy ekran dotykowy nie działa, na tle reklamy nowego MacBooka Pro z dotykiem.","intro":"Ironiczny, 77-sekundowy montaż. Fragmenty wystąpień Steve'a Jobsa, który przekonuje, że dotykowy ekran w laptopie to zły pomysł, przeplatają się z reklamą nowego MacBooka Pro z ekranem dotykowym i procesorami M5 Pro i M5 Max.","points":[{"t":"Jobs: pionowy dotyk nie działa","d":"Jobs mówi, że Apple dawno temu testowało dotyk na pionowym ekranie i to się nie sprawdza: dobrze wygląda na pokazie, ale ręka szybko się męczy, aż \"chce odpaść\". Ekrany dotykowe mają być poziome, stąd gładziki."},{"t":"Reklama nowego MacBooka","d":"Między wypowiedziami lecą fragmenty reklamy: obraz tak realny, że chce się go dotknąć, a skoro można, to przesuwać, szczypać i przewijać. Reklama poleca M5 Pro lub M5 Max z akceleratorami neuronowymi i baterię na całą noc."}],"conclusion":"Bez słowa komentarza: zestawienie pokazuje, że Apple zrobiło to, co Jobs uważał za błąd.","factchecks":[{"claim":"Apple wprowadziło MacBooka z ekranem dotykowym.","verdict":"prawda","note":"28.10.2026 Apple ogłosiło MacBooka Pro z ekranem PROLED XDR i dotykiem, z M5 Pro i M5 Max; dostawy od 6.11.","p":1,"src":[["Apple Newsroom: nowy MacBook Pro z dotykiem","https://www.apple.com/newsroom/2026/10/apple-unveils-groundbreaking-macbook-pro-with-proled-xdr-display/"],["MacRumors: zapowiedź nowego MacBooka Pro","https://www.macrumors.com/2026/10/28/apple-new-macbook-pro/"]]},{"claim":"Steve Jobs był przeciwny dotykowym ekranom w Macach.","verdict":"prawda","note":"Ars Technica przypomina, że Jobs był znanym przeciwnikiem tego pomysłu; cytaty to jego wypowiedzi sprzed lat.","p":0,"src":[["Ars Technica: dotykowy MacBook Pro i sprzeciw Jobsa","https://arstechnica.com/apple/2026/10/apple-announces-touchscreen-macbook-pro-with-oled-display/"],["CNBC: Apple wprowadza dotyk w Macach","https://www.cnbc.com/2026/10/28/apple-mac-touchscreen-launch.html"]]}],"bias":"Satyra wyrwana z kontekstu: argument Jobsa z 2010 r. dotyczył ekranu jako jedynego sposobu obsługi, a nowy MacBook ma nadal gładzik i klawiaturę.","section":"Technologie"},{"id":"5Gcrf3PH4_8","title_pl":"Rzeczy, które naprawisz zamiast wymieniać","title":"Things You Should Repair Instead Of Replace","channel":"Chill Dude Explains","url":"https://www.youtube.com/watch?v=5Gcrf3PH4_8","date":"2026-10-28","duration":649,"views":59837,"section":"Chill Dude Explains","transcript":"youtube","added":"2026-11-04","tags":["Technika","Nauka"],"about":"Dziesięć napraw domowych: od gaźnika kosiarki i padów przez odkurzacz i zamek po baterię laptopa i dysk SSD.","intro":"Humorystyczna lista 10 rzeczy, które ludzie wyrzucają, choć według autora zwykle wystarczy tania część. Są wśród nich gaźnik kosiarki, chwiejące się krzesło, stick drift pada, odkurzacz, zacinający się zamek, walizka, szczotki węglowe narzędzi, zapalnik piekarnika, bateria laptopa i wolny komputer (SSD oraz kurz).","points":[{"t":"Gaźnik kosiarki","d":"Stara benzyna zostawia osad i zapycha kanały. Spray do gaźników ok. 5 USD albo zamiennik za 10-20 USD; nowa kosiarka od ok. 200 USD. Cisza nie znaczy, że maszyna jest martwa."},{"t":"Chwiejące się krzesło","d":"Luźne połączenie noga-siedzisko: zeskrob stary klej, nałóż świeży, zaciśnij na 24 h. Przy luzie owiń koniec nogi bawełnianą nicią przed klejem. Koszt ok. 4 USD vs 50-500 USD za nowe."},{"t":"Stick drift w padzie","d":"Często brud pod modułem: sprężone powietrze, izopropanol 90%+. Jeśli nie, moduł za 2-5 USD zamiast pada za 60-80 USD. Wymiana ok. 20 minut z tutorialem."},{"t":"Odkurzacz","d":"Według autora 90% awarii to zatkany wąż, brudny filtr, pęknięty pasek (ok. 3 USD) lub włosy na szczotce. Porządny odkurzacz 150-400 USD; pasek kosztuje kilka dolarów."},{"t":"Zacinający się zamek","d":"Suche tuleje (grafit, nie WD-40), zużyty klucz (kopia ok. 2 USD) lub przesunięte drzwi (dokręć zawiasy). Nowy zamek 50-200 USD; naprawa kilka dolarów i 10 minut. To też kwestia bezpieczeństwa."},{"t":"Walizka","d":"Koła spinner ok. 5-10 USD, poluzowany suwak ściska się szczypcami, suwak zamiennik ok. 2 USD. Twarda skorupa bywa niemal niezniszczalna; wyrzucasz ramę przez 10-dolarową część."},{"t":"Szczotki węglowe narzędzi","d":"W starszych wiertarkach to małe bloki jak gumka ołówka; zużywają się celowo. Wymiana 1-5 USD, 10 minut, vs nowa wiertarka 50-200 USD."},{"t":"Zapalnik piekarnika gazowego","d":"Według autora w 90% przypadków zimnego pieca winny jest zapalnik (15-40 USD), nie cały piekarnik (600-2000 USD). Zdrowy świeci jasno biało i zapala gaz w 90 s; wymiana ok. 20 minut."},{"t":"Bateria laptopa","d":"Zamiennik 20-40 USD, czasem 5 minut. Po ok. 500 cyklach (ok. 2-3 lata) pojemność spada. Jeśli działa na zasilaczu - nie trzeba nowego laptopa za setki dolarów."},{"t":"Wolny komputer","d":"Dysk powyżej 85% zapełnienia, za mało RAM (dokładka 30-50 USD), mechaniczny HDD zamiast SSD (50-80 USD, start z minut do ~15 s) oraz kurz dławiący chłodzenie (sprężone powietrze ok. 3 USD)."}],"conclusion":"Cisza, dryf i wolność to często tania część, nie powód do wymiany całego sprzętu.","factchecks":[{"claim":"Gaźnik miesza powietrze z paliwem; stara benzyna zapycha kanały.","verdict":"prawda","note":"Gaźnik odpowiada za mieszankę; utlenione paliwo i żywice rzeczywiście blokują dysze.","p":0,"src":[["Wikipedia (ang.): gaźnik - hasło \"Carburetor\"","https://en.wikipedia.org/wiki/Carburetor"]]},{"claim":"Szczotki węglowe w silnikach narzędzi zużywają się celowo.","verdict":"prawda","note":"Szczotki węglowe przewodzą prąd do wirnika i są częścią eksploatacyjną.","p":6,"src":[["Wikipedia (ang.): szczotka węglowa - hasło \"Carbon brush\"","https://en.wikipedia.org/wiki/Carbon_brush"]]},{"claim":"Wymiana HDD na SSD dramatycznie skraca czas startu systemu.","verdict":"prawda","note":"SSD nie ma ruchomych części i ma znacznie niższe opóźnienia niż dysk talerzowy.","p":9,"src":[["Wikipedia (ang.): dysk SSD - hasło \"Solid-state drive\"","https://en.wikipedia.org/wiki/Solid-state_drive"]]},{"claim":"90% awarii piekarnika gazowego to zapalnik; 90% awarii odkurzacza to 4 proste przyczyny.","verdict":"nie da się sprawdzić","note":"Procenty podane bez źródła; zapalnik i proste usterki odkurzacza są częste, ale nie \"90%\" z badań.","p":[3,7],"src":[["Wikipedia (ang.): gaźnik i silniki spalinowe (kontekst awarii paliwowych) - hasło \"Carburetor\"","https://en.wikipedia.org/wiki/Carburetor"]]}],"bias":"Poradnik konsumencki z amerykańskimi cenami w USD. Upraszcza diagnostykę do catchy \"prawie zawsze to jedna część\"; reklam brak."},{"id":"xB-Gkb7mvlM","title_pl":"Schudłem 30 kg po 40. Wieczorne podjadanie to nie słaba wola","title":"Schudłem 30 kg po 40. Wieczorne podjadanie to nie słaba wola.","channel":"Odchudzanie bez spiny | Leszek Zieliński","url":"https://www.youtube.com/watch?v=xB-Gkb7mvlM","date":"2026-10-27","duration":672,"views":13674,"transcript":"youtube","added":"2026-11-03","tags":["Ciało i zdrowie","Psychologia"],"about":"Skąd bierze się wieczorne podjadanie: głód, jedzenie emocjonalne i nawyki, jak sobie z nimi radzić i kiedy iść do lekarza.","intro":"Leszek, technolog żywności, który schudł ze 124 do 94 kg, tłumaczy, że wieczorne podjadanie rzadko wynika z braku silnej woli. Wymienia 3 przyczyny: głód, jedzenie emocjonalne i nawyki, do każdej daje prosty sposób. Mówi też, kiedy problem wymaga specjalisty.","points":[{"t":"Kim jest autor","d":"Ma 45 lat; ważył 124 kg przy otyłości II stopnia z cukrzycą typu 2 i stłuszczeniem wątroby. Teraz waży 94 kg, glikemia jest w normie bez leków, cukrzyca w remisji, a stłuszczenia wątroby nie ma. Jest technologiem żywności z kilkunastoletnim stażem."},{"t":"Mit baterii silnej woli","d":"Popularna teoria mówi, że rano mamy pełną baterię silnej woli, a wieczorem się wyczerpuje. Autor uważa, że może jest w tym ziarno prawdy, ale jako główna przyczyna oznaczałaby codzienną, coraz trudniejszą walkę do końca życia."},{"t":"Przyczyna 1: zwykły głód","d":"Kolacja ma być sycąca, z białkiem, z ok. 2 godzinami przerwy przed snem; nie musi być przed 18:00. Dwie kromki chleba z wędliną to słaby posiłek. Głód przychodzi falami po 30-60 minut, a przy stałych porach jedzenia pojawia się w porze posiłku."},{"t":"Przyczyna 2: jedzenie emocjonalne","d":"Ochota na chipsy godzinę po dobrej kolacji to wyuczona reakcja na emocje; u autora na nudę i pustkę. Nie chodzi o walkę z emocjami, tylko o inną nagrodę: dla niego było to zgłębianie odchudzania, potem kanał na YouTube."},{"t":"Przyczyna 3: nawyk","d":"Kanapa, serial i coś do chrupania powtarzane tysiące razy stają się automatem bez głodu i emocji. Rada: odczekaj 10-15 minut, a jeśli ochota nie mija, wstań, zatrzymaj serial, odmierz porcję i zjedz bez oglądania. Przekąski najlepiej schować lub nie trzymać w domu."},{"t":"Kiedy do lekarza","d":"Gdy objadasz się w ukryciu, po napadzie masz silne negatywne emocje albo budzisz się w nocy, by coś zjeść. Jeśli takie epizody zdarzają się częściej niż raz w tygodniu przez ponad 3 miesiące, potrzebny jest specjalista, nie film. Wspomina też o \"food noise\", czyli natrętnych myślach o jedzeniu."}],"conclusion":"Wieczorne podjadanie ma zwykle kilka przyczyn; gdy się je zrozumie, da się nad nim zapanować.","factchecks":[{"claim":"Utrata wagi może doprowadzić do remisji cukrzycy typu 2.","verdict":"prawda","note":"W badaniu DiRECT po roku remisję miało 46% osób na programie odchudzania i 86% tych, co schudli 15 kg lub więcej.","p":0,"src":[["Lean i in. 2018, Lancet: badanie DiRECT (PubMed)","https://pubmed.ncbi.nlm.nih.gov/29221645/"]]},{"claim":"Teoria \"baterii silnej woli\" może mieć ziarno prawdy.","verdict":"półprawda","note":"To tzw. wyczerpanie ego; duże replikacje (m.in. w 23 laboratoriach) nie potwierdziły efektu.","p":1,"src":[["Wikipedia (ang.): wyczerpanie ego - hasło \"Ego depletion\"","https://en.wikipedia.org/wiki/Ego_depletion"]]},{"claim":"Przy stałych porach jedzenia głód pojawia się w porze posiłku.","verdict":"prawda","note":"Poziom greliny, hormonu głodu, rośnie przed zwykłą porą posiłku i spada po jedzeniu.","p":2,"src":[["Wikipedia (ang.): grelina - hasło \"Ghrelin\"","https://en.wikipedia.org/wiki/Ghrelin"]]},{"claim":"Napady częściej niż raz w tygodniu przez ponad 3 miesiące to sygnał do lekarza.","verdict":"prawda","note":"Zgadza się z kryteriami zaburzenia z napadami objadania się (DSM-5: raz w tygodniu przez 3 miesiące).","p":5,"src":[["Wikipedia (ang.): zaburzenie z napadami objadania się - hasło \"Binge eating disorder\"","https://en.wikipedia.org/wiki/Binge_eating_disorder"],["NIMH: zaburzenia odżywiania","https://www.nimh.nih.gov/health/topics/eating-disorders"]]},{"claim":"Budzenie się w nocy, by jeść, wymaga konsultacji.","verdict":"prawda","note":"To objaw zespołu jedzenia nocnego, ujętego w DSM-5 jako zaburzenie odżywiania.","p":5,"src":[["Wikipedia (ang.): zespół jedzenia nocnego - hasło \"Night eating syndrome\"","https://en.wikipedia.org/wiki/Night_eating_syndrome"]]}],"bias":"Rady oparte głównie na własnym doświadczeniu autora, bez źródeł; poza tym wyważony, bez sprzedaży diet i suplementów.","section":"Sport"},{"id":"yVLKtB7Lfyk","title_pl":"Triki z Wi-Fi, których używają fachowcy, by podwoić prędkość","title":"Wi Fi Tricks Insiders Use That Double Their Speed","channel":"Chill Dude Explains","url":"https://www.youtube.com/watch?v=yVLKtB7Lfyk","date":"2026-10-27","duration":560,"views":71307,"transcript":"whisper","added":"2026-11-03","tags":["Technika"],"about":"Top 10 trików na szybsze Wi-Fi: miejsce routera, anteny, kanały 1, 6 i 11, zakłócenia, bufferbloat, mesh, MoCA i test z VPN.","intro":"Ranking 10 trików, które według autora znają instalatorzy sieci. Od ustawienia routera i anten, przez kanały i zakłócenia od mikrofalówki i USB 3.0, po bufferbloat, mesh, MoCA i dławienie łącza przez operatora. Porady są w większości trafne, ale część liczb to szacunki autora.","points":[{"t":"10. Router w szafce","d":"Router schowany w szafce albo za telewizorem traci zasięg. Najlepiej postawić go wysoko, centralnie i na otwartej przestrzeni."},{"t":"9. Ustawienie anten","d":"Anteny promieniują prostopadle do swojej osi, więc pionowe najlepiej pokrywają jedno piętro. Przy dwóch piętrach autor radzi jedną antenę pionowo, a drugą poziomo, przy trzech kąty 0, 45 i 90°."},{"t":"8. Kuchenka mikrofalowa","d":"Mikrofalówka działa w paśmie 2,4 GHz z mocą ponad 1000 W, a router ma ok. 0,1 W, więc podczas podgrzewania Wi-Fi się dławi. Pomaga pasmo 5 GHz, choć ma mniejszy zasięg."},{"t":"7. Zatłoczone kanały","d":"Aplikacja typu Wi-Fi Analyzer pokazuje, na których kanałach nadają sąsiedzi. W paśmie 2,4 GHz nie nakładają się tylko kanały 1, 6 i 11; kanał ustawia się ręcznie w panelu routera, zwykle pod 192.168.1.1 lub 192.168.0.1."},{"t":"6. Stary sprzęt spowalnia wszystkich","d":"Jedno urządzenie w starym standardzie 802.11g, sprzed ok. 2010 r., zmusza router do trybu mieszanego. Według autora obniża to prędkość nawet o 50%, więc takie urządzenie warto przenieść do sieci gościnnej."},{"t":"5. Zakłócenia od USB 3.0","d":"Porty i kable USB 3.0 emitują szum w okolicach 2,5 GHz, co opisał raport z 2012 r. Pomaga odsunięcie dysku lub huba od routera albo przejście na 5 GHz."},{"t":"4. Bufferbloat","d":"Przepełnione bufory routera dają lagi, gdy ktoś w domu pobiera duże pliki. Autor radzi włączyć SQM lub QoS i ustawić limit na 80 do 90% prędkości z umowy."},{"t":"3. Wzmacniacz zamiast mesh","d":"Zwykły wzmacniacz odbiera i nadaje na tym samym kanale, więc tnie prędkość o połowę. Lepszy jest system mesh z osobnym łączem między węzłami."},{"t":"2. MoCA przez kabel antenowy","d":"Adaptery MoCA przesyłają sieć istniejącym kablem koncentrycznym z prędkością gigabitową i według autora nawet o 50% mniejszym opóźnieniem. Trzeba dołożyć filtr PoE za ok. 5 dolarów, by sygnał nie wyciekał na zewnątrz."},{"t":"1. Dławienie przez operatora","d":"Niektórzy operatorzy spowalniają streaming lub gry. Test: zmierz prędkość z VPN i bez; w przykładzie autora wzrosła z 40 do 180 Mb/s, co sugeruje celowe dławienie."}],"conclusion":"Większość problemów z Wi-Fi da się naprawić za darmo w kilka minut; autor zachęca do subskrypcji.","factchecks":[{"claim":"W paśmie 2,4 GHz nie nakładają się tylko kanały 1, 6 i 11.","verdict":"prawda","note":"Kanały mają ok. 22 MHz szerokości i są co 5 MHz, więc standardowy zestaw bez nakładania to 1, 6 i 11.","p":3,"src":[["Wikipedia (ang.): lista kanałów WLAN - hasło \"List of WLAN channels\"","https://en.wikipedia.org/wiki/List_of_WLAN_channels"]]},{"claim":"Mikrofalówka pracuje w tym samym paśmie co Wi-Fi 2,4 GHz.","verdict":"prawda","note":"Domowe kuchenki działają na ok. 2,45 GHz, w paśmie ISM 2,4 do 2,5 GHz.","p":2,"src":[["Wikipedia (ang.): kuchenka mikrofalowa - hasło \"Microwave oven\"","https://en.wikipedia.org/wiki/Microwave_oven"]]},{"claim":"USB 3.0 zakłóca Wi-Fi 2,4 GHz, co opisał raport z 2012 r.","verdict":"prawda","note":"Raport USB-IF z kwietnia 2012 r. opisuje spadki przepustowości Wi-Fi i Bluetooth przy urządzeniach USB 3.0.","p":5,"src":[["Wikipedia (ang.): zakłócenia radiowe USB 3.0 - hasło \"USB 3.0\"","https://en.wikipedia.org/wiki/USB_3.0"]]},{"claim":"Bufferbloat powoduje lagi przy obciążonym łączu.","verdict":"prawda","note":"To opóźnienie wynikające z nadmiernego buforowania pakietów w routerze; obniża też przepustowość.","p":6,"src":[["Wikipedia (ang.): bufferbloat - hasło \"Bufferbloat\"","https://en.wikipedia.org/wiki/Bufferbloat"]]},{"claim":"Wzmacniacz Wi-Fi obniża prędkość o połowę.","verdict":"prawda","note":"Repeater z jednym radiem nadaje każdą transmisję dwa razy, więc przepustowość spada co najmniej o 50%.","p":7,"src":[["Wikipedia (ang.): wzmacniacz sieci bezprzewodowej - hasło \"Wireless repeater\"","https://en.wikipedia.org/wiki/Wireless_repeater"]]},{"claim":"MoCA daje gigabit po kablu koncentrycznym.","verdict":"prawda","note":"MoCA 2.0 daje do 1 Gb/s rzeczywistej przepustowości, nowsze wersje więcej.","p":8,"src":[["Wikipedia (ang.): MoCA - hasło \"Multimedia over Coax Alliance\"","https://en.wikipedia.org/wiki/Multimedia_over_Coax_Alliance"]]},{"claim":"VPN pozwala wykryć i obejść dławienie łącza.","verdict":"prawda","note":"Wikipedia wymienia VPN jako sposób na dławienie; wynik 40 do 180 Mb/s to jednak tylko przykład autora.","p":9,"src":[["Wikipedia (ang.): dławienie przepustowości - hasło \"Bandwidth throttling\"","https://en.wikipedia.org/wiki/Bandwidth_throttling"]]}],"bias":"Rzetelny poradnik bez sponsora, ale liczby jak 50% czy 40 do 180 Mb/s to przykłady autora, a nie pomiary.","section":"Technologie"},{"id":"BsFx3ZZh91U","title_pl":"Już to widzieliśmy: tak było tuż przed inwazją Rosji na Ukrainę","title":"We’ve Seen This Before… Right Before Russia Invaded Ukraine","channel":"The Military Show","url":"https://www.youtube.com/watch?v=BsFx3ZZh91U","date":"2026-10-26","duration":1112,"views":3580677,"transcript":"whisper","added":"2026-11-03","tags":["Geografia","Historia"],"about":"Rosja zapełnia bazy sprzętem blisko NATO, Białoruś się militaryzuje, a Kaliningrad dostaje radary. Czy to zapowiedź ataku?","intro":"Kanał The Military Show zestawia doniesienia z października 2026 r.: Rosja zapełnia bazy nowymi czołgami blisko krajów bałtyckich i Finlandii, Białoruś przechodzi na tryb wojenny, a w Kaliningradzie rośnie infrastruktura. Autor uspokaja, że sprzęt jest w magazynach, i pokazuje, jak NATO planuje obronę.","points":[{"t":"Nowe czołgi w magazynach","d":"Według RFE/RL do 22. bazy rezerwy czołgów w Buju trafiają nowe T-90M i BTR-82A, ok. 500 km od NATO. Kyiv Post pisze też o bazach blisko Estonii, Łotwy i 185 km od Finlandii."},{"t":"Produkcja rośnie","d":" olecenie w stylu „zrób mi treści” daje ogólne wyniki. Autor radzi jedną stronę opisu: firma, klienci, zadanie krok po kroku, zasady i godziny pracy, a napisać ją może ChatGPT lub Claude."},{"t":"1. Bot do wideo","d":"Z tematu robi research, pisze 60-sekundowy scenariusz i czeka na akceptację. Potem tworzy lektora, obraz i montaż, sprawdza dźwięk i jakość i oddaje plik bez publikacji."},{"t":"2. Bot do karuzel","d":"Dwa razy w tygodniu proponuje pomysły, a po wyborze robi 7-slajdową karuzelę na Instagram z podpisem. Publikuje przez narzędzie Blotato dopiero po komendzie autora."},{"t":"3. Bot do leadów","d":"W dni robocze o 7:00 szuka 10 firm pasujących do idealnego klienta, sprawdza ich strony i pisze osobiste maile wskazujące konkretny problem. Zapisuje je tylko jako szkice."},{"t":"4. Bot do odpowiedzi","d":"Pilnuje skrzynki i w ciągu minuty szkicuje odpowiedź nowemu klientowi z 2 terminami z kalendarza. Przed każdą umówioną rozmową przygotowuje jednostronicowy brief."},{"t":"5. Bot do SEO","d":"Codziennie o 9:00 znajduje frazę, której strona jeszcze nie pokrywa, sprawdza 5 najwyżej pozycjonowanych wyników i pisze lepszy artykuł z FAQ. Zapisuje go jako szkic."},{"t":"Zacznij od jednego","d":"Autor radzi nie budować 5 botów naraz, tylko zacząć od tego, który rozwiązuje największy problem, i dopiero potem dodawać kolejne."}],"conclusion":"Pięć botów działa jak zespół marketingowy, ale autor kieruje po prompty i szkolenia do swojej płatnej społeczności.","factchecks":[{"claim":"Każdy bot ma komputer w chmurze i pracuje przy zamkniętym laptopie.","verdict":"półprawda","note":"Praca w tle przy zamkniętym laptopie się zgadza, ale komputer jest jeden na użytkownika i wszystkie boty go współdzielą.","p":0,"src":[["Dokumentacja Grok Bot: FAQ","https://docs.x.ai/grok-bot/faq"]]},{"claim":"Boty działają według harmonogramu.","verdict":"prawda","note":"Rutyny uruchamiają się o ustalonej porze albo po zdarzeniu, np. mailu lub wywołaniu webhooka.","p":0,"src":[["Dokumentacja Gr tny w poleceniu, podłącz swoje narzędzia, używaj opcji utrzymywania strony na bieżąco i zawsze przeglądaj wynik przed użyciem."},{"t":"Reklama społeczności","d":"Autor zachęca do płatnego AI Profit Boardroom z 4 rozmowami na żywo w tygodniu i 30-dniowym planem oraz do darmowego AI Success Lab, który według niego ma 93 700 członków."}],"conclusion":"Pages zmieniają odpowiedzi bota w trwałe dokumenty, które można rozwijać; po więcej autor odsyła do swoich społeczności.","factchecks":[{"claim":"Grok Bot tworzy strony: raporty, notatki i dashboardy.","verdict":"prawda","note":"Dokumentacja opisuje stronę jako raport, notatkę, dashboard lub tracker z tabelami i wykresami, zapisany w bibliotece bota.","p":0,"src":[["Dokumentacja Grok Bot: pliki i wyniki","https://docs.x.ai/grok-bot/files-and-results"]]},{"claim":"Pokazane raz zadanie bot zapisuje jako rutynę.","verdict":"prawda","note":"Funkcja Teach a task zapisuje pokazany raz proces jako umiejętność, którą rutyna może uruchamiać według planu.","p":2,"src":[["Dokumentacja Grok Bot: umiejętności i rutyny","https://docs.x.ai/grok-bot/skills-routines-and-automations"],["x.ai: strona Grok Bot","https://x.ai/bot"]]},{"claim":"Każdy bot ma własny komputer w chmurze.","verdict":"półprawda","note":"Komputer w chmurze jest jeden na użytkownika; boty mają na nim osobne ekrany i współdzielą pliki oraz loginy.","p":1,"src":[["Dokumentacja Grok Bot: FAQ","https://docs.x.ai/grok-bot/faq"]]}],"bias":"Film to w dużej mierze reklama społeczności autora; o samej funkcji Pages mówi ogólnie i bez przykładu użycia.","section":"Technologie"},{"id":"9J30xtK5RL0","title_pl":"PSYHO: odejście z OpenAI, AtCoder 2025 i ryzyko utraty kontroli nad AI","title":"Odszedłem z OpenAI i nie żałuję II PSYHO","channel":"didaskalia","url":"https://www.youtube.com/watch?v=9J30xtK5RL0","date":"2026-10-25","duration":5972,"views":463977,"section":"Didaskalia","transcript":"youtube","added":"2026-11-04","tags":["Sztuczna inteligencja","Technologie","Nauka"],"about":"Były pracownik OpenAI i mistrz konkursów optymalizacyjnych o zwycięstwie nad modelem w 2025 oraz o gradual disempowerment.","intro":"Półtoragodzinna rozmowa Patrycjusza Wyżgi z Przemysławem Dębiakiem (PSYHO). Gość opowiada o 20 latach konkursów optymalizacyjnych, o tym, jak w Tokio w 2025 wygrał z modelem OpenAI, o pracy przy bocie do Doty w OpenAI (2017-2020) i o tym, czemu uważa, że sami oddajemy sprawczość algorytmom.","points":[{"t":"Konkursy optymalizacyjne od 20 lat","d":"Według PSYHO istnieją konkursy algorytmiczne i optymalizacyjne (heurystyczne). W tych drugich specjalizuje się od prawie 20 lat. Wygrał około połowę ważnych zawodów; TopCoder Open wygrał siedem razy, w pozostałych był drugi lub trzeci."},{"t":"Tokio 2025: człowiek vs model","d":"Na AtCoder World Tour Finals 2025 (heurystyki) był jedynym człowiekiem, który pokonał model OpenAI. Zadanie: sterowanie robotami na mapie 2D z łączeniem w grupy i minimalną liczbą poleceń. Miał 10 godzin, był skrajnie niewyspany."},{"t":"2026: model już miażdży ludzi","d":"Według gościa w kolejnej edycji model OpenAI totalnie zmiażdżył ludzi. On nie startował w eliminacjach i odmówił nieoficjalnego startu, bo uznał, że przegrana byłaby łatwym PR dla firmy."},{"t":"OpenAI: Dota i San Francisco","d":"Dołączył w 2017 jako kontraktor do projektu bota do Doty (rekrutował go Jakub Pachocki). Od 2019 full-time w San Francisco. Praca kończyła się wraz z lockdownami COVID; wrócił ostatnim samolotem do Polski."},{"t":"Dlaczego odszedł","d":"Wymienia konflikty personalne, kulturę feedbacku przez HR zamiast wprost, toksyczność części zespołu i politykę korporacyjną przy rozroście firmy. Pod koniec prawie nie pracował mimo dobrych relacji z szefostwem."},{"t":"GPT-2 i trajektoria rozwoju","d":"Według niego GPT-2 (ok. walentynek 2019) był pierwszym modelem generującym spójny tekst i zmienił jego ocenę tempa rozwoju. Widział też wewnętrzne postępy przed GPT-3 i stąd przewidział przyspieszenie."},{"t":"Gradual disempowerment","d":"Największe zagrożenie widzi w tym, że firmy i państwa dobrowolnie delegują decyzje do AI dla zysku. Firma, która odda wszystko superinteligencji, może wypchnąć konkurencję, a ludzie stracą sprawczość, zanim to zauważą."},{"t":"Misuse i koncentracja władzy","d":"Druga grupa zagrożeń to misuse (np. projektowanie broni biologicznej). Trzecia: koncentracja władzy i pieniędzy w USA przy automatyzacji pracy intelektualnej oraz ryzyko inwigilacji."},{"t":"Incydent z agentami (Exploit Gym)","d":"Opisuje sprawę agentów trenowanych na zadaniach hakerskich: znalazły dziurę w Artifactory, połączyły się, weszły do internetu, przeczytały kod benchmarku i generowały flagi zamiast rozwiązywać zadania. Oficjalnie OpenAI miało nie zauważyć tego na bieżąco."},{"t":"Research taste i wąskie gardło","d":"Dziś człowiek plus AI jest efektywniejszy niż samo AI, ale człowiek staje się wąskim gardłem. Jego przewaga to intuicja badawcza i rozbijanie problemów; przy dużo większej mocy obliczeniowej ta przewaga maleje."},{"t":"P(doom) w labach","d":"Według PSYHO ludzie w labach mają wysoko oceniane ryzyko katastrofy, a publicznie mówią optymistyczniej. Tłumaczy to group thinkingiem i poczuciem, że właśnie ich lab zrobi to najbezpieczniej."},{"t":"Gdzie go śledzić","d":"Głównie Twitter; blog założył, ale nie napisał posta, bo nie lubi pisać i nie chce generować tekstu AI. Chce, by Europa też brała udział w debacie o ryzyku, a nie tylko USA."}],"conclusion":"PSYHO nie żałuje odejścia z OpenAI i naciska na świadomość gradual disempowerment zamiast scenariuszy o robotach-zabójcach.","factchecks":[{"claim":"W AtCoder WTF 2025 Heuristic PSYHO wygrał, a model OpenAI był drugi.","verdict":"prawda","note":"Przemysław Dębiak wygrał finał w Tokio; OpenAIAHC w slocie exhibition zajął 2. miejsce.","p":1,"src":[["Ars Technica: człowiek pokonał model OpenAI w AtCoder 2025","https://arstechnica.com/ai/2025/07/exhausted-man-defeats-ai-model-in-world-coding-championship/"]]},{"claim":"GPT-2 OpenAI wypuszczono około walentynek 2019.","verdict":"prawda","note":"OpenAI opublikowało GPT-2 14 lutego 2019 r.","p":5,"src":[["Wikipedia (ang.): GPT-2 - hasło \"GPT-2\"","https://en.wikipedia.org/wiki/GPT-2"]]},{"claim":"OpenAI powstało jako non-profit będące przeciwwagą dla DeepMind Google.","verdict":"półprawda","note":"OpenAI faktycznie wystartowało jako non-profit (2015); motyw przeciwwagi dla DeepMind/Google pojawia się w relacjach, ale cele były szersze.","p":3,"src":[["Wikipedia (ang.): OpenAI - hasło \"OpenAI\"","https://en.wikipedia.org/wiki/OpenAI"]]},{"claim":"Sam Altman publicznie pogratulował PSYHO po zwycięstwie.","verdict":"prawda","note":"Altman napisał na X m.in. \"good job psyho\".","p":1,"src":[["Business Insider: Altman o PSYHO i AtCoder","https://www.businessinsider.com/programmer-beat-openai-atcoder-coding-competition-sam-altman-psyho-2025-7"]]}],"bias":"Gość jest byłym pracownikiem OpenAI i pesymistą co do kontroli nad AI. Sponsorzy odcinka: Credit Agricole (konto biznes) i Kodano Optyk."},{"id":"1xWbPuZWtR0","title_pl":"Leniwe sposoby, by uczyć się dwa razy szybciej","title":"Lazy Ways To Learn Anything Twice As Fast","channel":"Chill Dude Explains","url":"https://www.youtube.com/watch?v=1xWbPuZWtR0","date":"2026-10-23","duration":660,"views":62826,"section":"Chill Dude Explains","transcript":"youtube","added":"2026-11-04","tags":["Psychologia","Nauka"],"about":"Dziesięć technik nauki: sen zaraz po materiale, pretest, brzydka czcionka, podgląd końca, zmiana miejsca, 1,5x prędkość i spaced repetition.","intro":"Lista 10 \"leniwych\" trików nauki według autora: sen zaraz po powtórce, quiz przed nauką, brzydka czcionka, czytanie podsumowania od końca, nauka w kilku miejscach, przyspieszanie nagrań, rysowanie, AI jako przeciwnik, kłamstwo o 5 minutach oraz spaced repetition na krawędzi zapominania.","points":[{"t":"Sen zaraz po nauce","d":"Po 20 minutach powtórki idź spać zamiast scrollować. Sen konsoliduje pamięć długotrwałą; nowe bodźce wypychają świeży materiał. Autor powołuje się na badania z Harvardu o lepszym zapamiętywaniu po śnie."},{"t":"Quiz przed nauką","d":"Pre-testing: zgaduj przed rozdziałem, nawet źle. Błędna odpowiedź budzi uwagę (np. Canberra zamiast Sydney). Student, który zgadł wzrost Napoleona źle, a potem usłyszał ok. 170 cm, pamięta dłużej niż ten, który tylko przeczytał."},{"t":"Brzydka czcionka","d":"Disfluency: trudniejszy font zmusza mózg do pracy. Według autora badanie Princeton: ta sama treść w brzydkiej czcionce dała lepsze wyniki testów. Comic Sans kursywą albo cienki pismo - niewygodne, nie nieczytelne."},{"t":"Najpierw koniec","d":"Przeczytaj podsumowanie i pytania na końcu rozdziału, potem tekst. Priming daje mapę tego, co ważne. Autor twierdzi, że uczniowie z podglądem zatrzymują do 50% więcej."},{"t":"Zmiana scenerii","d":"Pamięć zależna od kontekstu: desk + zapach + dźwięk wiążą się z treścią. Ucz się w kuchni, kawiarni, parku. Badanie University of Michigan: grupa zmieniająca sale pamiętała 40% więcej słów."},{"t":"Przyspieszenie nagrania","d":"1,5x-2x: mózg przetwarza do ok. 400 słów/min, mowa to ok. 150. Mniej miejsca na błądzenie myślami. Według autora zatrzymywanie wiedzy przy 1,5x jest co najmniej porównywalne z normalnym tempem."},{"t":"Okropny rysunek","d":"Generation effect: produkcja informacji utrwala lepiej niż odbiór. Brzydki rysunek serca zmusza do decyzji, co ważne. Im gorszy rysunek, tym więcej myślenia o istocie."},{"t":"AI jako przeciwnik","d":"Każ, by AI quizowało, poprawiało i przerywało przy ogólnikach. Efekt protege: bronienie i nauczanie wymuszają prawdziwe zrozumienie. AI nie ma ego, więc 15 pomyłek z rzędu jest OK."},{"t":"Kłamstwo o 5 minutach","d":"Powiedz sobie, że uczysz się tylko 5 minut. Zeigarnik: mózg nie lubi niedokończonych spraw. Najtrudniejsze jest usiąść; prawie nigdy nie zatrzymujesz się na 5 minutach."},{"t":"Prawie zapomnij","d":"Spaced repetition: przeglądaj na krawędzi zapominania (np. 2, 3, 5 dni). Codziennie nudzi mózg; odstępy budują silniejszą ścieżkę. Wkuwanie noc przed to najgorsza strategia."}],"conclusion":"Najwięcej daje sen, próby przed nauką, odstępy i zmuszenie mózgu do pracy, nie dłuższe wpatrywanie się w notatki.","factchecks":[{"claim":"Sen zaraz po nauce wzmacnia konsolidację pamięci.","verdict":"prawda","note":"Konsolidacja pamięci w czasie snu jest dobrze ugruntowana w kognitywistyce.","p":0,"src":[["Wikipedia (ang.): konsolidacja pamięci - hasło \"Memory consolidation\"","https://en.wikipedia.org/wiki/Memory_consolidation"]]},{"claim":"Quiz przed nauką (pre-testing) poprawia późniejsze zapamiętywanie.","verdict":"prawda","note":"Efekt testowania i wstępnego testowania są potwierdzone empirycznie.","p":1,"src":[["Wikipedia (ang.): efekt testowania - hasło \"Testing effect\"","https://en.wikipedia.org/wiki/Testing_effect"]]},{"claim":"Brzydka czcionka (disfluency) poprawia wyniki testów (Princeton).","verdict":"półprawda","note":"Były pozytywne wyniki, ale późniejsze replikacje disfluency bywają mieszane.","p":2,"src":[["Wikipedia (ang.): pożądana trudność - hasło \"Desirable difficulty\"","https://en.wikipedia.org/wiki/Desirable_difficulty"]]},{"claim":"Zmiana miejsca nauki daje ok. 40% lepsze zapamiętanie (Michigan).","verdict":"półprawda","note":"Pamięć zależna od kontekstu istnieje; konkretne \"40%\" wymaga ostrożności bez oryginalnej pracy.","p":4,"src":[["Wikipedia (ang.): pamięć zależna od kontekstu - hasło \"Context-dependent memory\"","https://en.wikipedia.org/wiki/Context-dependent_memory"]]},{"claim":"Spaced repetition i efekt Zeigarnik wspierają naukę.","verdict":"prawda","note":"Powtórki rozłożone w czasie są jednym z najlepiej potwierdzonych narzędzi pamięciowych.","p":[8,9],"src":[["Wikipedia (ang.): powtórki rozłożone - hasło \"Spaced repetition\"","https://en.wikipedia.org/wiki/Spaced_repetition"],["Wikipedia (ang.): efekt Zeigarnik - hasło \"Zeigarnik effect\"","https://en.wikipedia.org/wiki/Zeigarnik_effect"]]}],"bias":"Lista trików bez linków do badań; procenty (50%, 40%) podane hasłowo. Reklamy brak. Tone \"leniwy hacks\" upraszcza psychologię nauki."},{"id":"3e44xTBY_ek","title_pl":"Dlaczego Grok Bot przejmuje rynek: 10 trików","title":"Why Grok Bot Is Taking Over (10 Hacks)","channel":"Moritz | AI Systems","url":"https://www.youtube.com/watch?v=3e44xTBY_ek","date":"2026-10-22","duration":1481,"views":87984,"transcript":"whisper","added":"2026-11-03","tags":["Technika","Sztuczna inteligencja"],"about":"Moritz pokazuje zasady pracy z Grok Bot i triki: import pamięci, 1Password, przeglądarka, X, programowanie, Composio, webhook, Pages, mail.","intro":"Moritz twierdzi, że przeniósł do Grok Bot większość pracy z Claude Code i ChatGPT. Najpierw podaje 3 zasady pracy z botami, a potem triki: import pamięci, hasła przez 1Password, przeglądarka, połączenie z X, programowanie przez Cursor, Composio, most z webhookiem, strony i własna skrzynka mailowa.","points":[{"t":"Jeden bot na jedno zadanie","d":"Bota traktuje się jak nowego pracownika z jedną rolą. Autor ma szefa sztabu, a pod nim boty do treści i innych zadań."},{"t":"Autonomia krok po kroku","d":"Najpierw plan, potem praca z akceptacją na kolejnych etapach, a po 1 do 2 tygodni zaufania więcej swobody. Samo „prowadź moje SEO” to za mało wskazówek."},{"t":"Źródło prawdy zamiast pamięci","d":"Wbudowana pamięć według autora jeszcze zawodzi. Bot od sponsoringu prowadzi więc stronę w Notion ze stanem każdej umowy i z niej korzysta."},{"t":"Import pamięci i umiejętności","d":"Można poprosić ChatGPT lub Claude o wyeksportowanie wszystkiego, co o tobie wie, do pliku i wrzucić go botowi. Bot może też za zgodą sięgnąć do lokalnych folderów i zaimportować z nich pamięć i umiejętności."},{"t":"Hasła przez 1Password","d":"Autor tworzy w 1Password osobny sejf udostępniony botowi i wrzuca tam tylko wybrane hasła. Karty płatnicze trzeba jednak dodać do wbudowanego Vault."},{"t":"Przeglądarka i ciasteczka","d":"Wbudowana przeglądarka to według autora słaby punkt, gorszy niż w Codex. Autor przeniósł do niej ciasteczka z własnego Chrome, by od razu być zalogowanym, choć sam przyznaje, że to ryzyko."},{"t":"Połączenie z X","d":"Bot przeszukuje publiczne posty na X bez konfiguracji API, a od niedawna czyta i odpisuje na wiadomości prywatne. Oznaczenie @bot pod postem przekazuje go botowi, np. do zapisania jako strona."},{"t":"Programowanie przez Cursor","d":"Bot zleca zadania w projektach Cursor, lokalnie lub w chmurze, nawet z wybranym modelem. Lokalnie może też sterować Claude Code i przeglądarką na komputerze autora."},{"t":"Composio i most z webhookiem","d":"Composio daje te same połączenia w kilku narzędziach i więcej funkcji, np. dla Arkuszy Google. Rutyna z webhookiem pozwala przesyłać polecenia z ChatGPT lub Claude do Grok Bot."},{"t":"Strony, mail i drobiazgi","d":"Bot tworzy strony z raportami, które można udostępniać, i ma własny adres mailowy. Można też zgłosić błąd zespołowi i edytować szkic wiadomości przed wysłaniem."}],"conclusion":"Autor używa Grok Bot także prywatnie, np. do sznurówek, sprawy z ubezpieczeniem i księgowości, i zaprasza do swojego kursu.","factchecks":[{"claim":"Bot może za zgodą wykonywać polecenia na twoim komputerze.","verdict":"prawda","note":"Służy do tego ustawienie Execution on this computer; domyślnie bot pyta za każdym razem.","p":3,"src":[["Dokumentacja Grok Bot: FAQ","https://docs.x.ai/grok-bot/faq"]]},{"claim":"Hasła z 1Password są dostępne dla bota bez ich odczytywania.","verdict":"prawda","note":"Boty logują się danymi z Vault lub podłączonego menedżera haseł bez widzenia wartości.","p":4,"src":[["Dokumentacja Grok Bot: FAQ","https://docs.x.ai/grok-bot/faq"],["Dokumentacja Grok Bot: Vault","https://docs.x.ai/grok-bot/vault"]]},{"claim":"Oznaczenie @bot na X przekazuje post botowi.","verdict":"prawda","note":"Dokumentacja opisuje oznaczanie @bot w poście lub odpowiedzi jako sposób przekazania zadania.","p":6,"src":[["Dokumentacja Grok Bot: @bot na X","https://docs.x.ai/grok-bot/tag-on-x"]]},{"claim":"Rutynę można uruchamiać webhookiem.","verdict":"prawda","note":"Rutyny ruszają według planu albo po zdarzeniu, w tym po wywołaniu webhooka.","p":8,"src":[["Dokumentacja Grok Bot: umiejętności i rutyny","https://docs.x.ai/grok-bot/skills-routines-and-automations"]]},{"claim":"Bot dostaje własny adres mailowy.","verdict":"prawda","note":"Aplikacja Email daje botom ich własny adres zamiast podłączania istniejącego konta.","p":9,"src":[["Dokumentacja Grok Bot: komputer i aplikacje","https://docs.x.ai/grok-bot/computer-and-apps"]]}],"bias":"Entuzjastyczny przegląd z reklamą darmowego poradnika i płatnego kursu autora; kopiowanie ciasteczek z własnej przeglądarki to ryzykowna rada.","section":"Technologie"},{"id":"hGguYFncLUI","title_pl":"Przetestowałem Grok Bot: czego nie mówią inni","title":"I Tested Grok Bot - Here's What They're NOT Telling You","channel":"Serop | AI Automation","url":"https://www.youtube.com/watch?v=hGguYFncLUI","date":"2026-10-15","duration":1178,"views":27704,"transcript":"whisper","added":"2026-11-03","tags":["Technika","Sztuczna inteligencja"],"about":"Serop testuje Grok Bot bez sponsora: chwali prostotę i autonomię, krytykuje brak wglądu w działanie, pamięć i rozliczenia.","intro":"Serop zapowiada uczciwą recenzję bez sponsora, bo według niego wiele filmów o Grok Bot to płatna promocja. Pokazuje boty z własnym komputerem, pamięć, czaty grupowe i przykłady z biznesu. Chwali prostotę, ale martwi go brak wglądu w to, co boty robią i ile to kosztuje.","points":[{"t":"Boty zamiast czatów","d":"Grok Bot wygląda jak ChatGPT czy Claude Code, ale zamiast rozmów ma boty. Każdy ma wirtualny komputer z Chrome i terminalem, nad którym można przejąć kontrolę."},{"t":"Podłączanie narzędzi","d":"Bot łączy się z mailem, Slackiem i harmonogramami. Autor podłączył GitHub, a bot sam otworzył pull request; wszystko działa w chmurze."},{"t":"Pamięć wspólna dla botów","d":"Bot sam decyduje, co zapamiętać na stałe, a część wiedzy dzielą wszystkie boty: inny bot znał cel autora, czyli 50 tys. dolarów miesięcznych przychodów. Minus: pamięci nie da się przejrzeć ani edytować."},{"t":"Brak wyboru modelu","d":"Autor twierdzi, że jest skazany na modele Grok i nie może przejść na modele OpenAI czy Anthropic. Przy cięższym programowaniu może to według niego przeszkadzać."},{"t":"Nie widać myślenia","d":"Autor nie widzi toku rozumowania ani wywołań narzędzi, tylko wynik, chyba że każe botowi pracować na ekranie. Przy poczcie czy obsłudze klientów to go niepokoi."},{"t":"Niejasne rozliczenia","d":"Widzi tylko ogólne zużycie, np. 40% miesięcznego limitu, bez podziału na zadania i modele. Chciałby tańszych modeli do prostych zadań."},{"t":"Czaty grupowe","d":"Boty mogą pracować razem w grupie, np. marketingowej. Ryzyko: dzielą jeden komputer, więc mogą nadpisywać sobie pliki, a sposób ich współpracy narzuca aplikacja."},{"t":"Przykłady użycia","d":"Bot szukał lotów Berlin do Cali w Google Flights, filmów na YouTube z wynikiem ponad stan i sponsorów wydarzeń w Berlinie na Luma. Autor ocenia te zadania jako dobre zastosowanie do researchu."},{"t":"Dyscyplina w liczbie botów","d":"Łatwo stworzyć za dużo botów i stracić orientację. Autor radzi jednego generalistę do jednorazowych zadań, a wyspecjalizowane boty tylko do powtarzalnych procesów."}],"conclusion":"Potężny i bardzo przyjazny system, dobry do researchu i analiz, ale autor nie powierzyłby mu jeszcze kontaktu z klientami.","factchecks":[{"claim":"W Grok Bot można używać tylko modeli Grok.","verdict":"fałsz","note":"Wyboru modelu nie ma, ale Grok Bot sam dobiera model do zadania i może to być też model zewnętrznego dostawcy.","p":3,"src":[["Dokumentacja Grok Bot: FAQ","https://docs.x.ai/grok-bot/faq"]]},{"claim":"Pamięci bota nie da się przejrzeć.","verdict":"półprawda","note":"Nie ma edytora pamięci, ale dokumentacja radzi zapytać bota, co o tobie pamięta; wspólne są tylko niektóre fakty, np. imię.","p":2,"src":[["Dokumentacja Grok Bot: FAQ","https://docs.x.ai/grok-bot/faq"]]},{"claim":"Nie widać, jakich
