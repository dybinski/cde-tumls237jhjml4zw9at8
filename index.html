<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:,">
<title>Streszczenia YouTube</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600&display=swap&subset=latin-ext" rel="stylesheet">
<style>
:root{color-scheme:dark}
:root{--ink:#eeeeee;--mut:#999999;--line:#222222;--s1:1.5rem;--s2:1.125rem;--s3:.9375rem;--s4:.875rem;
--v-prawda:#4cc46a;--v-polprawda:#f2c94c;--v-przesada:#ff9440;--v-falsz:#ff5a5a;--v-nds:#8c8c8c;--red:#ff3b30}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#000;color:var(--ink);font:400 var(--s3)/1.6 "Figtree","Helvetica Neue",Arial,sans-serif}
body.lock{overflow:hidden}
a{color:inherit;text-decoration:underline;text-decoration-color:#666;text-underline-offset:3px}
a:hover{text-decoration-color:var(--ink)}
button{font:inherit;color:inherit}
.wrap{max-width:1440px;margin:0 auto;padding:0 24px}
.bar{position:sticky;top:0;z-index:5;background:#000;border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:16px;padding-top:12px;padding-bottom:12px}
h1{font-size:var(--s2);font-weight:600;margin:0;white-space:nowrap;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.ctl{display:flex;gap:10px;flex:1;justify-content:flex-end}
#q{max-width:420px}
input,select{font:inherit;font-size:var(--s3);color:var(--ink);background:#000;border:1px solid #444;border-radius:24px;padding:0 16px;min-height:44px;width:100%;outline:none;-webkit-appearance:none;appearance:none}
select{width:auto;padding-right:32px;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat;cursor:pointer}
input:focus,select:focus{border-color:var(--ink)}
.sync{display:inline-block;width:8px;height:8px;border-radius:50%;background:#6a6a6a;overflow:hidden;color:transparent;font-size:1px;flex:none}
.sync.ok{background:var(--v-prawda)}.sync.off{background:var(--v-przesada)}
main{padding:24px 0 40px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:32px 16px}
@media (max-width:1279px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:899px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:599px){.grid{grid-template-columns:1fr;gap:28px}}
.tile{display:block;text-decoration:none;color:inherit;border-radius:12px;outline-offset:4px}
.th{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#111}
.th img{display:block;width:100%;height:100%;object-fit:cover;transition:opacity .2s}
.dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.8);color:#fff;font-size:.75rem;font-weight:600;line-height:1;padding:4px 5px;border-radius:4px}

.rd{display:none;position:absolute;left:8px;top:8px;background:rgba(0,0,0,.8);color:#fff;font-size:.75rem;font-weight:600;line-height:1;padding:5px 7px;border-radius:4px}
.prog{display:none;position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--red)}
.tile.read .th img{opacity:.4}
.tile.read .rd,.tile.read .prog{display:block}
.tile.read .dur{bottom:12px}
.vbar{display:flex;height:4px;gap:2px;margin:8px 0 0}
.vbar b{display:block;height:100%;border-radius:1px}
.tile h2{font-size:var(--s3);font-weight:600;line-height:1.4;margin:10px 0 2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .meta{color:var(--mut);font-size:var(--s4);margin:0}
.tile.read h2{color:var(--mut)}
.tile:hover h2{text-decoration:underline;text-decoration-color:#666;text-underline-offset:3px}
.empty{color:var(--mut);padding:40px 0}
footer{color:var(--mut);font-size:var(--s4);padding:8px 0 48px}
footer p{margin:0}
/* modal */
.ov{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.75);display:none;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.ov.on{display:block}
.dlg{background:#000;max-width:760px;margin:40px auto;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.mh{position:sticky;top:0;z-index:2;display:flex;justify-content:flex-end;padding:10px 12px;background:rgba(0,0,0,.9);border-bottom:1px solid var(--line)}
.x{min-height:48px;padding:0 20px;border:1px solid #6a6a6a;border-radius:24px;background:#000;cursor:pointer;font-weight:600}
.x:hover{border-color:var(--ink)}
.mimg{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;background:#111}
.mb{padding:20px 28px 32px}
.mb h2{font-size:var(--s1);font-weight:600;line-height:1.3;margin:0 0 8px;letter-spacing:-.01em}
.mb .vbar{height:6px;margin:0 0 16px}
.mb p{margin:0 0 14px}
.orig,.small,.mmeta{color:var(--mut)}
.mmeta{font-size:var(--s4)}
.intro{font-size:var(--s3)}
.tags{display:flex;flex-wrap:wrap;gap:0 16px;margin:0 0 8px}
.tag{color:var(--mut);background:none;border:0;padding:0;min-height:40px;cursor:pointer}
.tag:hover{color:var(--ink)}
ul{list-style:none;margin:0 0 16px;padding:0}
.pts li{border-left:3px solid transparent;padding:2px 0 2px 14px;margin:0 0 16px}
.pts li.v-none{border-left-color:transparent}
.pts p{margin:0}
.pt b{font-weight:600}
.fn{color:var(--mut);font-size:var(--s4);line-height:1.5;margin-top:6px!important}
.fn a{color:var(--mut)}
.fn .cl{color:var(--ink)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--mut);font-size:var(--s4);margin:8px 0 16px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.v-prawda{border-color:var(--v-prawda)!important;background-color:var(--v-prawda)}
.v-polprawda{border-color:var(--v-polprawda)!important;background-color:var(--v-polprawda)}
.v-przesada{border-color:var(--v-przesada)!important;background-color:var(--v-przesada)}
.v-falsz{border-color:var(--v-falsz)!important;background-color:var(--v-falsz)}
.v-nds{border-color:var(--v-nds)!important;background-color:var(--v-nds)}
.pts li[class]{background:none}
.bias{padding-left:17px}
.ur{min-height:48px;padding:0 20px;border:1px solid #6a6a6a;border-radius:24px;background:#000;cursor:pointer;margin-top:8px}
.ur:hover{border-color:var(--ink)}
@media (max-width:599px){
 .wrap{padding:0 16px}
 .bar .wrap{flex-wrap:wrap;gap:8px 10px;padding-top:10px;padding-bottom:10px}
 h1{flex:1}
 .ctl{flex-basis:100%;flex-wrap:wrap;gap:8px}
 #q{max-width:none;flex-basis:100%}
 .ctl select{flex:1}
 input,select{font-size:16px}
 main{padding-top:16px}
 .ov{background:#000}
 .dlg{margin:0;border:0;border-radius:0;min-height:100%}
 .mb{padding:16px 18px 40px}
 .mb h2{font-size:1.375rem}
}
</style>
</head>
<body>
<div class="bar"><div class="wrap">
<h1>Streszczenia YouTube <span class="sync" id="sync" role="status">synchronizacja...</span></h1>
<div class="ctl">
<input id="q" type="search" placeholder="Szukaj" aria-label="Szukaj" autocomplete="off">
<select id="ch" aria-label="Kanał"><option value="all">Wszystkie kanały</option></select>
<select id="fr" aria-label="Filtr"><option value="all">Wszystkie</option><option value="unread">Nieprzeczytane</option><option value="read">Przeczytane</option></select>
<select id="so" aria-label="Kolejność"><option value="new">Najnowsze</option><option value="old">Najstarsze</option><option value="pop">Popularne</option></select>
</div>
</div></div>
<main class="wrap"><div class="grid" id="list"></div></main>
<footer class="wrap"><p>Streszczenia wyłącznie z transkryptów, bez analizy obrazu. Stan przeczytanych synchronizuje się między urządzeniami.</p></footer>

<script>
(function(){
var V=[{"id":"difPlwouuPY","title_pl":"Gdy pęknie bańka AI: lekcja z cmentarzyska drewnianych statków","title":"When the AI bubble pops...","channel":"Phil Edwards","url":"https://www.youtube.com/watch?v=difPlwouuPY","date":"2026-11-02","duration":861,"views":97911,"transcript":"youtube","added":"2026-11-03","tags":["Historia","Technika"],"about":"Autor porównuje boom centrów danych AI do drewnianych statków z I wojny światowej, które dziś leżą w zatoce Mallows Bay.","intro":"Phil Edwards płynie kajakiem po Mallows Bay w Maryland, gdzie leży ponad 100 drewnianych statków z I wojny światowej. Porównuje ten pospieszny program budowy do dzisiejszego boomu centrów danych AI. Pokazuje, że bańka to nie tylko spekulacja finansowa, ale też fizyczne pozostałości po nadmiernej budowie. Film ma sponsora (Hostinger).","points":[{"t":"Centra danych zmieniają krajobraz","d":"Zdjęcia satelitarne przed i po pokazują, jak setki centrów danych za miliardy dolarów zastępują pola, np. centrum Amazona w Karolinie Północnej i Clarksville w Arkansas. Od Data Center Alley w Wirginii do Mallows Bay jest ok. 137 km."},{"t":"Pośpiech bez znanego terminu","d":"W 1917 r. USA założyły Emergency Fleet Corporation, by przy niedoborze stali szybko budować statki na wojnę. Wydano setki milionów dolarów, a nikt nie wiedział, kiedy wojna się skończy, tak jak dziś nie wiadomo, kiedy nastąpią przełomy w AI."},{"t":"Bańka pochłania zasoby","d":"Gazeta pisała o 68 planach budowy na 375 statków z sosny długoigielnej, której nie wolno było sprzedawać gdzie indziej, choć nie była dobrym materiałem. Autor porównuje to do drożejącej pamięci komputerowej wykupywanej przez boom AI."},{"t":"Nowa infrastruktura","d":"W ciągu 2 lat przybyło 120 stoczni i 657 pochylni. Według autora to dokładnie odpowiada dzisiejszej budowie elektrowni i sieci dla centrów danych."},{"t":"Polityka pompuje bańkę","d":"Hasło wyścigu z Chinami napędza inwestycje w AI, np. projekt Stargate w Teksasie Trumpa i OpenAI. Po I wojnie szef Shipping Board bronił niewykorzystanych statków, bo w czasie wojny nie ma nadwyżek. Bańka pękła, gdy wojna skończyła się wcześniej, niż sądzono."},{"t":"Gorszy materiał, gorsza budowa","d":"Drewniane statki były słabsze nie tylko przez trwałość: wymagały dużo więcej wzmocnień wewnątrz niż stalowe. Najpopularniejszy był projekt Design 1001; po wojnie statki były drogie w utrzymaniu, a w 1925 r. odholowano je do Mallows Bay."},{"t":"Niepewność centrów danych","d":"Wiele centrów danych powstaje bez stabilnego zasilania, a nie wiadomo, czy GPU w środku za 5 lat będą coś warte. Niejasne jest też, czy AI nie przeniesie się na lokalne urządzenia; Apple według autora na to stawia."},{"t":"Płonący basen i złom","d":"Statki malowano kamuflażem dazzle, który radar uczynił prawie bezużytecznym. W II wojnie rząd zaryzykował 200 000 dolarów, by odzyskać co najmniej 11 000 ton metalu: statki spalono w basenie i wyciągano złom elektromagnesem. Dziś to rezerwat przyrody morskiej."},{"t":"Lekcja światłowodów","d":"Boom światłowodowy z lat 2000. uznano wtedy za klapę, ale ta infrastruktura zbudowała współczesny internet. Autor sądzi, że AI nie pęknie nagle jak koniec wojny, ale boom zostawi i użyteczne rzeczy, i drewniane statki."}],"conclusion":"Nawet jeśli AI zostanie, boom budowy zostawi po sobie niepotrzebną infrastrukturę i przekształci krajobraz.","factchecks":[{"claim":"W Mallows Bay leży ponad 100 drewnianych statków z I wojny światowej.","verdict":"prawda","note":"Wraków statków z programu wojennego jest tam ok. 230; od 2019 r. to rezerwat morski NOAA.","p":null,"src":[["Wikipedia (ang.): zatoka Mallows Bay - hasło \"Mallows Bay\"","https://en.wikipedia.org/wiki/Mallows_Bay"],["NOAA: rezerwat Mallows Bay-Potomac River","https://sanctuaries.noaa.gov/mallows-potomac/"]]},{"claim":"Emergency Fleet Corporation powstała w 1917 r.","verdict":"prawda","note":"Utworzono ją 16 kwietnia 1917 r. przy U.S. Shipping Board.","p":1,"src":[["Wikipedia (ang.): Emergency Fleet Corporation - hasło \"Emergency Fleet Corporation\"","https://en.wikipedia.org/wiki/Emergency_Fleet_Corporation"]]},{"claim":"Design 1001 był najpopularniejszy, a w 1925 r. statki odholowano do Mallows Bay.","verdict":"prawda","note":"Design 1001 (typ Ferris) z sosny lub daglezji był standardowym projektem; holowanie w 1925 r. potwierdza Wikipedia.","p":5,"src":[["Wikipedia (ang.): statek typu Design 1001 - hasło \"Design 1001 ship\"","https://en.wikipedia.org/wiki/Design_1001_ship"],["Wikipedia (ang.): zatoka Mallows Bay - hasło \"Mallows Bay\"","https://en.wikipedia.org/wiki/Mallows_Bay"]]},{"claim":"Statki spalono w II wojnie, by odzyskać metal.","verdict":"półprawda","note":"Spalono je już ok. 1925 r. po bankructwie firmy złomowej; w II wojnie Bethlehem Steel zbudowało basen do odzysku metalu.","p":7,"src":[["Wikipedia (ang.): zatoka Mallows Bay - hasło \"Mallows Bay\"","https://en.wikipedia.org/wiki/Mallows_Bay"]]},{"claim":"Kamuflaż dazzle stał się prawie bezużyteczny przez radar.","verdict":"prawda","note":"Tracił sens wraz z dalmierzami i lotnictwem, a w II wojnie radar dodatkowo osłabił jego działanie.","p":7,"src":[["Wikipedia (ang.): kamuflaż dazzle - hasło \"Dazzle camouflage\"","https://en.wikipedia.org/wiki/Dazzle_camouflage"]]},{"claim":"Stargate w Teksasie uzasadniano wyścigiem z Chinami.","verdict":"prawda","note":"Stargate buduje centra danych w Abilene w Teksasie; ogłoszono go w Białym Domu w 2025 r.","p":4,"src":[["Wikipedia (ang.): projekt Stargate - hasło \"Stargate LLC\"","https://en.wikipedia.org/wiki/Stargate_LLC"]]},{"claim":"Apple stawia na AI uruchamianą lokalnie.","verdict":"półprawda","note":"Apple Intelligence działa głównie na urządzeniu, ale trudniejsze zadania wysyła do chmury Private Cloud Compute.","p":6,"src":[["Apple: zapowiedź Apple Intelligence (2024)","https://www.apple.com/newsroom/2024/06/introducing-apple-intelligence-for-iphone-ipad-and-mac/"]]},{"claim":"Nadmiar światłowodów z boomu stał się potem podstawą internetu.","verdict":"prawda","note":"Nadwyżkę po krachu dot-com nazwano ciemnym włóknem; później stworzyła nowy rynek usług.","p":8,"src":[["Wikipedia (ang.): ciemne włókno - hasło \"Dark fibre\"","https://en.wikipedia.org/wiki/Dark_fibre"],["Wikipedia (ang.): bańka internetowa - hasło \"Dot-com bubble\"","https://en.wikipedia.org/wiki/Dot-com_bubble"]]}],"bias":"Analogia luźna i wybiórcza: wojenny program rządu to nie prywatne inwestycje. Sponsor Hostinger chwalony jako platforma AI, co kłóci się z tematem filmu."},{"id":"1qEPZT1FQs0","title_pl":"Więc MacBooki mają teraz ekrany dotykowe","title":"So, Apple MacBooks have touch screens now","channel":"NikTek","url":"https://www.youtube.com/watch?v=1qEPZT1FQs0","date":"2026-10-28","duration":77,"views":386134,"transcript":"youtube","added":"2026-11-03","tags":["Technika"],"about":"Krótki montaż: Steve Jobs mówi, że pionowy ekran dotykowy nie działa, na tle reklamy nowego MacBooka Pro z dotykiem.","intro":"Ironiczny, 77-sekundowy montaż. Fragmenty wystąpień Steve'a Jobsa, który przekonuje, że dotykowy ekran w laptopie to zły pomysł, przeplatają się z reklamą nowego MacBooka Pro z ekranem dotykowym i procesorami M5 Pro i M5 Max.","points":[{"t":"Jobs: pionowy dotyk nie działa","d":"Jobs mówi, że Apple dawno temu testowało dotyk na pionowym ekranie i to się nie sprawdza: dobrze wygląda na pokazie, ale ręka szybko się męczy, aż \"chce odpaść\". Ekrany dotykowe mają być poziome, stąd gładziki."},{"t":"Reklama nowego MacBooka","d":"Między wypowiedziami lecą fragmenty reklamy: obraz tak realny, że chce się go dotknąć, a skoro można, to przesuwać, szczypać i przewijać. Reklama poleca M5 Pro lub M5 Max z akceleratorami neuronowymi i baterię na całą noc."}],"conclusion":"Bez słowa komentarza: zestawienie pokazuje, że Apple zrobiło to, co Jobs uważał za błąd.","factchecks":[{"claim":"Apple wprowadziło MacBooka z ekranem dotykowym.","verdict":"prawda","note":"28.10.2026 Apple ogłosiło MacBooka Pro z ekranem PROLED XDR i dotykiem, z M5 Pro i M5 Max; dostawy od 6.11.","p":1,"src":[["Apple Newsroom: nowy MacBook Pro z dotykiem","https://www.apple.com/newsroom/2026/10/apple-unveils-groundbreaking-macbook-pro-with-proled-xdr-display/"],["MacRumors: zapowiedź nowego MacBooka Pro","https://www.macrumors.com/2026/10/28/apple-new-macbook-pro/"]]},{"claim":"Steve Jobs był przeciwny dotykowym ekranom w Macach.","verdict":"prawda","note":"Ars Technica przypomina, że Jobs był znanym przeciwnikiem tego pomysłu; cytaty to jego wypowiedzi sprzed lat.","p":0,"src":[["Ars Technica: dotykowy MacBook Pro i sprzeciw Jobsa","https://arstechnica.com/apple/2026/10/apple-announces-touchscreen-macbook-pro-with-oled-display/"],["CNBC: Apple wprowadza dotyk w Macach","https://www.cnbc.com/2026/10/28/apple-mac-touchscreen-launch.html"]]}],"bias":"Satyra wyrwana z kontekstu: argument Jobsa z 2010 r. dotyczył ekranu jako jedynego sposobu obsługi, a nowy MacBook ma nadal gładzik i klawiaturę."},{"id":"xB-Gkb7mvlM","title_pl":"Schudłem 30 kg po 40. Wieczorne podjadanie to nie słaba wola","title":"Schudłem 30 kg po 40. Wieczorne podjadanie to nie słaba wola.","channel":"Odchudzanie bez spiny | Leszek Zieliński","url":"https://www.youtube.com/watch?v=xB-Gkb7mvlM","date":"2026-10-27","duration":672,"views":13674,"transcript":"youtube","added":"2026-11-03","tags":["Ciało i zdrowie","Psychologia"],"about":"Skąd bierze się wieczorne podjadanie: głód, jedzenie emocjonalne i nawyki, jak sobie z nimi radzić i kiedy iść do lekarza.","intro":"Leszek, technolog żywności, który schudł ze 124 do 94 kg, tłumaczy, że wieczorne podjadanie rzadko wynika z braku silnej woli. Wymienia 3 przyczyny: głód, jedzenie emocjonalne i nawyki, do każdej daje prosty sposób. Mówi też, kiedy problem wymaga specjalisty.","points":[{"t":"Kim jest autor","d":"Ma 45 lat; ważył 124 kg przy otyłości II stopnia z cukrzycą typu 2 i stłuszczeniem wątroby. Teraz waży 94 kg, glikemia jest w normie bez leków, cukrzyca w remisji, a stłuszczenia wątroby nie ma. Jest technologiem żywności z kilkunastoletnim stażem."},{"t":"Mit baterii silnej woli","d":"Popularna teoria mówi, że rano mamy pełną baterię silnej woli, a wieczorem się wyczerpuje. Autor uważa, że może jest w tym ziarno prawdy, ale jako główna przyczyna oznaczałaby codzienną, coraz trudniejszą walkę do końca życia."},{"t":"Przyczyna 1: zwykły głód","d":"Kolacja ma być sycąca, z białkiem, z ok. 2 godzinami przerwy przed snem; nie musi być przed 18:00. Dwie kromki chleba z wędliną to słaby posiłek. Głód przychodzi falami po 30-60 minut, a przy stałych porach jedzenia pojawia się w porze posiłku."},{"t":"Przyczyna 2: jedzenie emocjonalne","d":"Ochota na chipsy godzinę po dobrej kolacji to wyuczona reakcja na emocje; u autora na nudę i pustkę. Nie chodzi o walkę z emocjami, tylko o inną nagrodę: dla niego było to zgłębianie odchudzania, potem kanał na YouTube."},{"t":"Przyczyna 3: nawyk","d":"Kanapa, serial i coś do chrupania powtarzane tysiące razy stają się automatem bez głodu i emocji. Rada: odczekaj 10-15 minut, a jeśli ochota nie mija, wstań, zatrzymaj serial, odmierz porcję i zjedz bez oglądania. Przekąski najlepiej schować lub nie trzymać w domu."},{"t":"Kiedy do lekarza","d":"Gdy objadasz się w ukryciu, po napadzie masz silne negatywne emocje albo budzisz się w nocy, by coś zjeść. Jeśli takie epizody zdarzają się częściej niż raz w tygodniu przez ponad 3 miesiące, potrzebny jest specjalista, nie film. Wspomina też o \"food noise\", czyli natrętnych myślach o jedzeniu."}],"conclusion":"Wieczorne podjadanie ma zwykle kilka przyczyn; gdy się je zrozumie, da się nad nim zapanować.","factchecks":[{"claim":"Utrata wagi może doprowadzić do remisji cukrzycy typu 2.","verdict":"prawda","note":"W badaniu DiRECT po roku remisję miało 46% osób na programie odchudzania i 86% tych, co schudli 15 kg lub więcej.","p":0,"src":[["Lean i in. 2018, Lancet: badanie DiRECT (PubMed)","https://pubmed.ncbi.nlm.nih.gov/29221645/"]]},{"claim":"Teoria \"baterii silnej woli\" może mieć ziarno prawdy.","verdict":"półprawda","note":"To tzw. wyczerpanie ego; duże replikacje (m.in. w 23 laboratoriach) nie potwierdziły efektu.","p":1,"src":[["Wikipedia (ang.): wyczerpanie ego - hasło \"Ego depletion\"","https://en.wikipedia.org/wiki/Ego_depletion"]]},{"claim":"Przy stałych porach jedzenia głód pojawia się w porze posiłku.","verdict":"prawda","note":"Poziom greliny, hormonu głodu, rośnie przed zwykłą porą posiłku i spada po jedzeniu.","p":2,"src":[["Wikipedia (ang.): grelina - hasło \"Ghrelin\"","https://en.wikipedia.org/wiki/Ghrelin"]]},{"claim":"Napady częściej niż raz w tygodniu przez ponad 3 miesiące to sygnał do lekarza.","verdict":"prawda","note":"Zgadza się z kryteriami zaburzenia z napadami objadania się (DSM-5: raz w tygodniu przez 3 miesiące).","p":5,"src":[["Wikipedia (ang.): zaburzenie z napadami objadania się - hasło \"Binge eating disorder\"","https://en.wikipedia.org/wiki/Binge_eating_disorder"],["NIMH: zaburzenia odżywiania","https://www.nimh.nih.gov/health/topics/eating-disorders"]]},{"claim":"Budzenie się w nocy, by jeść, wymaga konsultacji.","verdict":"prawda","note":"To objaw zespołu jedzenia nocnego, ujętego w DSM-5 jako zaburzenie odżywiania.","p":5,"src":[["Wikipedia (ang.): zespół jedzenia nocnego - hasło \"Night eating syndrome\"","https://en.wikipedia.org/wiki/Night_eating_syndrome"]]}],"bias":"Rady oparte głównie na własnym doświadczeniu autora, bez źródeł; poza tym wyważony, bez sprzedaży diet i suplementów."},{"id":"yTvakY_xVJk","title_pl":"Dlaczego Rzymianie nigdy nie przekroczyli równika","title":"Why the Romans Could Never Cross the Equator","channel":"KhAnubis","url":"https://www.youtube.com/watch?v=yTvakY_xVJk","date":"2026-07-26","duration":711,"views":1143919,"transcript":"youtube","added":"2026-11-03","tags":["Historia","Geografia"],"about":"Jak starożytni wyobrażali sobie nieznany świat: strefa gorąca, ludy z Pliniusza, Rzym i Chiny oraz bariery dawnych odkrywców.","intro":"Autor tłumaczy, dlaczego granica znanego świata dla Rzymian była bardziej psychologiczna niż techniczna. Omawia teorię stref klimatycznych, wymyślone kontynenty i ludy-potwory z Pliniusza, wzajemne wyobrażenia Rzymu i Chin oraz wyprawy Hannona, Himilkona, Pyteasza i Gila Eanesa. Na koniec porównuje to z dzisiejszym patrzeniem na kosmos.","points":[{"t":"Strefa gorąca","d":"W V w. p.n.e. Parmenides podzielił Ziemię na 5 stref: 2 mroźne, 2 umiarkowane i gorącą przy równiku, gdzie nic nie przeżyje. Grecy i Rzymianie nie wiedzieli, że Sahara bywa gorętsza niż równik, a najdalej na południe znali okolice Somalii."},{"t":"Kontynenty z rozumowania","d":"Skoro na północy jest dużo lądu, na południu też musi być, dla równowagi: Rzymianie nazwali go Terra Australis Incognita. W II w. p.n.e. Krates z Mallos dodał 2 lądy na półkuli zachodniej, według autora jakby przewidując Ameryki."},{"t":"Ludy-potwory Pliniusza","d":"W Historii naturalnej (lata 70. n.e.) Pliniusz opisał Blemmiów bez głów z twarzą na piersi, psiogłowych Kynokefalów w Indiach, jednonogich Skiapodów i Astomów bez ust żywiących się zapachem, jako fakty. Herodot wcześniej umieszczał bezgłowych w Libii."},{"t":"Zniekształcone relacje","d":"Według autora część opisów to prawdziwe obserwacje zniekształcone przez głuchy telefon. Jedna z interpretacji mówi, że bezgłowi Blemmiowie to wojownicy kulący głowy za tarczami, widziani z daleka."},{"t":"Daqin, czyli Rzym oczami Chin","d":"Chińczycy nazywali Rzym Daqin (Wielkie Qin) i wyobrażali go sobie jako cnotliwe państwo z królem ustępującym w razie klęski. Autorowi przypomina to republikę z konsulami na rok."},{"t":"Gan Ying i morze szaleństwa","d":"W 97 r. n.e. poseł Gan Ying przez Azję Środkową i Partię dotarł do Tiaozhi nad wielkim morzem. Usłyszał, że przeprawa trwa 2-3 lata. Według autora Partowie to zmyślili, bo jako pośrednicy na Jedwabnym Szlaku nie chcieli bezpośredniego kontaktu Rzymu z Chinami."},{"t":"Rzymianie w Chinach w 166 r.","d":"Rzymska delegacja przypłynęła morzem przez Wietnam. Rzymskich dokumentów brak, ale chińskie kroniki wspominają posłów od Anduna: imię brzmi jak Antoninus Pius, a data wskazuje raczej na Marka Aureliusza."},{"t":"Hannon i Himilkon","d":"W V w. p.n.e. Kartagińczyk Hannon płynął wzdłuż Afryki, według badaczy do Senegalu lub Gabonu; jego \"owłosione kobiety\" dały nazwę gorylom. Himilkon popłynął na północ do Bretanii lub Brytanii za cyną, aż zatrzymały go mgły i wodorosty."},{"t":"Pyteasz i Thule","d":"Ok. 100 lat później Pyteasz z Massalii (Marsylii) dotarł za Brytanię do Thule, gdzie latem słońce prawie nie zachodzi, a morze zmienia się w \"płuco morskie\", według autora prawdopodobnie lód krupowy. Mogło to wzmacniać mit Hyperborei."},{"t":"Bariery na krańcu świata","d":"Ok. 1000 lat po Gan Yingu mnich Rabban Bar Sauma dotarł do Konstantynopola. Przylądek Bojador z rafami i wiatrami uchodził za kres żeglugi do 1434 r., gdy Gil Eanes po prostu go opłynął. Według autora wyprawy blokowały też koszty i ostrożni inwestorzy."}],"conclusion":"Eksploracja zależy od tego, kto odważy się płynąć i kto za to zapłaci; dziś tak samo patrzymy na kosmos.","factchecks":[{"claim":"Parmenides wymyślił podział Ziemi na strefy klimatyczne.","verdict":"prawda","note":"Według Strabona pierwszy był Parmenides, a teorię rozwinął Arystoteles.","p":0,"src":[["Wikipedia (ang.): strefy geograficzne - hasło \"Geographical zone\"","https://en.wikipedia.org/wiki/Geographical_zone"]]},{"claim":"Pustynie jak Sahara bywają gorętsze niż okolice równika.","verdict":"prawda","note":"Rekordy temperatur notuje się na pustyniach zwrotnikowych (Lut, Sahara, Dolina Śmierci), nie na równiku.","p":0,"src":[["Wikipedia (ang.): najwyższe temperatury na Ziemi - hasło \"Highest temperature recorded on Earth\"","https://en.wikipedia.org/wiki/Highest_temperature_recorded_on_Earth"]]},{"claim":"Krates z Mallos przewidywał dodatkowe lądy na drugiej półkuli.","verdict":"prawda","note":"Krates zbudował najstarszy znany globus z 4 masami lądu oddzielonymi oceanami.","p":1,"src":[["Wikipedia (ang.): Krates z Mallos - hasło \"Crates of Mallus\"","https://en.wikipedia.org/wiki/Crates_of_Mallus"],["Wikipedia (ang.): Terra Australis - hasło \"Terra Australis\"","https://en.wikipedia.org/wiki/Terra_Australis"]]},{"claim":"Pliniusz opisał bezgłowych Blemmiów, Kynokefalów, Skiapodów i Astomów.","verdict":"prawda","note":"Wszystkie te ludy są w Historii naturalnej (77-79 n.e.); Blemmiowie byli też realnym ludem na południe od Egiptu.","p":2,"src":[["Wikipedia (ang.): Blemmiowie - hasło \"Blemmyes\"","https://en.wikipedia.org/wiki/Blemmyes"],["Wikipedia (ang.): Astomowie - hasło \"Astomi\"","https://en.wikipedia.org/wiki/Astomi"],["Wikipedia (ang.): Historia naturalna Pliniusza - hasło \"Natural History (Pliny)\"","https://en.wikipedia.org/wiki/Natural_History_(Pliny)"]]},{"claim":"Gan Ying dotarł do Zatoki Perskiej, a Partowie go zniechęcili.","verdict":"półprawda","note":"Nie wiadomo, czy \"zachodnie morze\" to Zatoka Perska, Morze Śródziemne czy Czarne; wersja o Partach to hipoteza.","p":5,"src":[["Wikipedia (ang.): Gan Ying - hasło \"Gan Ying\"","https://en.wikipedia.org/wiki/Gan_Ying"]]},{"claim":"W 166 r. do Chin dotarli posłowie od Anduna z Daqin.","verdict":"prawda","note":"Notuje to Księga Późniejszych Hanów; Andun to Antoninus Pius lub Marek Aureliusz, rzymskich źródeł brak.","p":6,"src":[["Wikipedia (ang.): stosunki rzymsko-chińskie - hasło \"Sino-Roman relations\"","https://en.wikipedia.org/wiki/Sino-Roman_relations"]]},{"claim":"Hannon dotarł do Senegalu lub Gabonu i dał nazwę gorylom.","verdict":"półprawda","note":"Nazwa goryla pochodzi z jego relacji, ale zasięg wyprawy jest sporny: od Gabonu po samo południe Maroka.","p":7,"src":[["Wikipedia (ang.): Hannon Żeglarz - hasło \"Hanno the Navigator\"","https://en.wikipedia.org/wiki/Hanno_the_Navigator"],["Wikipedia (ang.): goryl - hasło \"Gorilla\"","https://en.wikipedia.org/wiki/Gorilla"]]},{"claim":"\"Płuco morskie\" Pyteasza to prawdopodobnie lód krupowy.","verdict":"nie da się sprawdzić","note":"Opis zna się tylko ze Strabona; badacze łączą go też z meduzami zwanymi płucami morskimi lub dryfującym lodem.","p":8,"src":[["Wikipedia (ang.): Pyteasz - hasło \"Pytheas\"","https://en.wikipedia.org/wiki/Pytheas"]]},{"claim":"Rabban Bar Sauma dotarł do Konstantynopola, a Gil Eanes opłynął Bojador w 1434 r.","verdict":"prawda","note":"Bar Sauma był w Konstantynopolu w 1287 r.; Eanes minął Bojador w 1434 r. po nieudanej próbie w 1433 r.","p":9,"src":[["Wikipedia (ang.): Rabban Bar Sauma - hasło \"Rabban Bar Sawma\"","https://en.wikipedia.org/wiki/Rabban_Bar_Sawma"],["Wikipedia (ang.): Gil Eanes - hasło \"Gil Eanes\"","https://en.wikipedia.org/wiki/Gil_Eanes"],["Wikipedia (ang.): przylądek Bojador - hasło \"Cape Bojador\"","https://en.wikipedia.org/wiki/Cape_Bojador"]]}],"bias":"Rzetelny i ostrożny film; uproszczenia przy hipotezach (Partowie, tarcze Blemmiów) i dość skrajny kontrast \"lękliwy Rzym kontra ufne Chiny\"."},{"id":"LUzZdtHhSqQ","title_pl":"Strony, których używają mądrzy ludzie, a przeciętni nigdy o nich nie słyszeli","title":"Websites Smart People Use That Average People Never Heard Of","channel":"Chill Dude Explains","url":"https://www.youtube.com/watch?v=LUzZdtHhSqQ","date":"2026-07-13","duration":669,"views":541911,"transcript":"whisper","added":"2026-11-03","tags":["Technika"],"about":"Top 10 mało znanych darmowych stron: od archiwum FBI i Shodana po mapy Wi-Fi, rejestry firm i wyszukiwarkę kodu źródłowego.","intro":"Ranking 10 stron, które według autora zna mało kto. Są wśród nich archiwum akt FBI, wyszukiwarka urządzeń w sieci Shodan, rejestry przesyłek i firm, mapa sieci Wi-Fi WiGLE, katalog narzędzi AI, mapa powiązań prac naukowych, pogoda Windy, wirtualne karty płatnicze i wyszukiwarka kodu stron. Autor mocno upraszcza i dramatyzuje.","points":[{"t":"10. FBI Vault","d":"Darmowe archiwum akt FBI (vault.fbi.gov) udostępnianych na mocy ustawy o dostępie do informacji (FOIA). Są tam akta Elvisa Presleya i Alberta Einsteina, a także memo z 1950 r. o 3 latających spodkach odzyskanych w Nowym Meksyku, w każdym 3 ciała o wzroście ok. 0,9 m."},{"t":"9. Shodan","d":"Wyszukiwarka urządzeń podłączonych do internetu: kamer, nianiek elektronicznych, sygnalizacji świetlnej, sterowników przemysłowych. Wiele działa bez hasła lub na fabrycznych ustawieniach. Według autora hakerzy weszli do sieci kasyna przez termometr akwarium i wynieśli 10 GB danych."},{"t":"8. ImportYeti","d":"Wyszukiwarka publicznych dokumentów celnych USA (konosamentów). Po nazwie firmy widać, która fabryka w Chinach czy Wietnamie robi jej produkty, z adresem, liczbą i wagą przesyłek. Można tak znaleźć dostawcę konkurencji albo odkryć, że droga marka i tania podróbka płyną z tej samej fabryki."},{"t":"7. OpenCorporates","d":"Według autora największa otwarta baza firm na świecie, z ponad 200 mln zarejestrowanych spółek. Pokazuje dane rejestrowe, dyrektorów, adresy i sieć powiązań między spółkami o tych samych dyrektorach lub adresach, np. łańcuch spółek holdingowych za lokalną restauracją."},{"t":"6. WiGLE","d":"Tworzona społecznie od 2001 r. mapa sieci Wi-Fi: wolontariusze zbierają nazwy sieci i współrzędne GPS podczas jazdy czy spacerów. Według autora baza ma ponad 1 mld unikalnych sieci, a na wigle.net często znajdziesz własny router i sieci sąsiadów."},{"t":"5. Futurepedia","d":"Stale aktualizowany katalog tysięcy narzędzi AI podzielonych na kategorie: logo, lektor z tekstu, pisanie i poprawianie kodu, stylista ze zdjęć. Pokazuje, które są darmowe, mają okres próbny i które zyskują popularność."},{"t":"4. Connected Papers","d":"Z jednej pracy naukowej buduje wizualną mapę powiązanych prac. Według autora wielkość kółka to liczba cytowań, a odległość to pokrewieństwo tematyczne. Widać prace założycielskie, najnowsze badania i głównych badaczy."},{"t":"3. Windy.com","d":"Darmowa mapa atmosfery w czasie rzeczywistym zamiast ikonki słońca i ok. 22°C w aplikacji. Pokazuje wiatr, prądy strumieniowe, huragany, fale, jakość powietrza, dym z pożarów, wyładowania i CO2; korzystają z niej piloci i żeglarze."},{"t":"2. Privacy.com","d":"Wirtualne numery kart do zakupów w sieci, osobny dla każdego sklepu i powiązany z kontem bankowym. Można ustawić limit, więc zapomniany okres próbny za 99 dolarów zostanie odrzucony, albo zrobić kartę jednorazową."},{"t":"1. PublicWWW","d":"Przeszukuje kod źródłowy milionów stron. Wklejając unikalny fragment, np. identyfikator Google Analytics, znajdziesz inne strony tej samej osoby lub grupy, nawet pod fałszywymi nazwami. Marketerzy sprawdzają tak narzędzia konkurencji, inni śledzą sieci oszukańczych stron."}],"conclusion":"Autor zapowiada podobne filmy i zachęca do subskrypcji.","factchecks":[{"claim":"Według filmu FBI uważało Elvisa za zagrożenie dla bezpieczeństwa USA.","verdict":"fałsz","note":"Te słowa pochodzą z listu obywatela do FBI z 1956 r.; Biuro nie prowadziło śledztwa w sprawie Elvisa.","p":0,"src":[["Archiwa Narodowe USA: Elvis w FBI i jego akta","https://text-message.blogs.archives.gov/2021/08/12/dont-be-cruel-elvis-presleys-visit-to-fbi-headquarters/"],["Wikipedia (ang.): akta FBI o Elvisie - hasło \"FBI files on Elvis Presley\"","https://en.wikipedia.org/wiki/FBI_files_on_Elvis_Presley"]]},{"claim":"Memo z 1950 r. o 3 spodkach z 3 ciałami jest prawdziwe.","verdict":"półprawda","note":"Dokument istnieje, ale FBI nazywa go relacją z drugiej lub trzeciej ręki, której nigdy nie sprawdzało.","p":0,"src":[["FBI Vault: memo Guya Hottela","https://vault.fbi.gov/hottel_guy"],["Wikipedia (ang.): memo Hottela i mistyfikacja z Aztec - hasło \"Hottel memo\"","https://en.wikipedia.org/wiki/Hottel_memo"]]},{"claim":"Kasyno straciło 10 GB danych przez termometr w akwarium.","verdict":"prawda","note":"Opisała to firma Darktrace w 2017 r.; dane trafiły na serwer w Finlandii. Film łączy to z Shodanem bez podstaw.","p":1,"src":[["SecurityWeek: akwarium wysłało 10 GB danych","https://www.securityweek.com/hacked-smart-fish-tank-exfiltrated-data-rare-external-destination/"]]},{"claim":"Shodan znajduje urządzenia w sieci, w tym kamery i sygnalizację.","verdict":"prawda","note":"Działa od 2009 r. i indeksuje kamery, routery i serwery; znajdowano nim m.in. sterowniki sygnalizacji.","p":1,"src":[["Wikipedia (ang.): wyszukiwarka Shodan - hasło \"Shodan (website)\"","https://en.wikipedia.org/wiki/Shodan_(website)"]]},{"claim":"ImportYeti pokazuje dokumenty celne każdej przesyłki do USA.","verdict":"półprawda","note":"Baza obejmuje setki milionów rekordów celnych, ale tylko import morski do USA, nie każdy transport.","p":2,"src":[["ImportYeti: wyszukiwarka rekordów celnych","https://www.importyeti.com/"],["Wikipedia (ang.): konosament - hasło \"Bill of lading\"","https://en.wikipedia.org/wiki/Bill_of_lading"]]},{"claim":"OpenCorporates ma dane ponad 200 mln firm.","verdict":"prawda","note":"W 2026 r. firma podaje ok. 220 mln spółek z ponad 147 jurysdykcji.","p":3,"src":[["OpenCorporates: komunikat z września 2026","https://blog.opencorporates.com/2026/09/03/opencorporates-achieves-iso-iec-277012025-certification/"],["Wikipedia (ang.): OpenCorporates - hasło \"OpenCorporates\"","https://en.wikipedia.org/wiki/OpenCorporates"]]},{"claim":"WiGLE działa od 2001 r. i ma ponad 1 mld sieci.","verdict":"prawda","note":"Pierwszą sieć dodano we wrześniu 2001 r.; statystyki WiGLE pokazują ponad 2 mld sieci Wi-Fi.","p":4,"src":[["WiGLE: statystyki bazy","https://wigle.net/stats"],["Wikipedia (ang.): WiGLE - hasło \"WiGLE\"","https://en.wikipedia.org/wiki/WiGLE"]]},{"claim":"W Connected Papers wielkość kółka to cytowania, a bliskość to podobieństwo.","verdict":"półprawda","note":"Układ opiera się na podobieństwie (współcytowania), nie na bezpośrednich cytowaniach; twórcy piszą, że to nie drzewo cytowań.","p":6,"src":[["Connected Papers: jak to działa","https://www.connectedpapers.com/about"]]},{"claim":"Privacy.com daje wirtualne karty z limitami i karty jednorazowe.","verdict":"prawda","note":"Tak działa usługa, ale tylko dla mieszkańców USA z amerykańskim kontem bankowym.","p":8,"src":[["Privacy.com: wirtualne karty","https://www.privacy.com/"]]},{"claim":"PublicWWW przeszukuje kod źródłowy stron.","verdict":"prawda","note":"Serwis szuka fragmentów w HTML, JavaScript i CSS stron.","p":9,"src":[["PublicWWW: wyszukiwarka kodu źródłowego","https://publicwww.com/"]]}],"bias":"Clickbaitowy tytuł; sensacyjne podanie akt FBI (Elvis, UFO) bez kontekstu, a narzędzia jak ImportYeti i Privacy.com działają głównie w USA."},{"id":"NxQU8EmHxiw","title_pl":"Luki w historii, których wciąż nie rozumiemy","title":"Hidden Gaps In History We Still Don’t Understand","url":"https://www.youtube.com/watch?v=NxQU8EmHxiw","date":"2026-07-10","duration":811,"views":1066775,"transcript":"youtube","added":"2026-11-03","tags":["Historia"],"about":"10 luk w historii, których według autora wciąż nie rozumiemy, od roku 536 po Sumeryjską listę królów.","intro":"Ranking 10 historycznych zagadek, których według autora wciąż nie umiemy wyjaśnić. Od roku 536, gdy mgła zasłoniła słońce, przez jezioro pełne szkieletów w Himalajach, upadek epoki brązu, rzymskie dwunastościany i miedziany zwój ze skarbami, po zamknięte japońskie grobowce, wymarłą roślinę sylfion, zaginione miasto Akad, koniec Normanów na Grenlandii i niemożliwe liczby z sumeryjskiej listy królów.","points":[{"t":"10. Najgorszy rok w historii (536)","d":"W 536 r. gęsta mgła zasłoniła słońce na 18 miesięcy, a temperatura na półkuli północnej spadła o 2,5°C. Plony padły, w Chinach latem spadł śnieg. Prokopiusz pisał, że słońce świeciło jak księżyc. Rdzenie lodowe z Grenlandii i Antarktydy pokazują popiół wulkaniczny, ale nie wiadomo, który wulkan; w 541 r. przyszła dżuma Justyniana."},{"t":"9. Jezioro Szkieletów (Roopkund)","d":"Jezioro Roopkund na ok. 4900 m, latem z lodu wypływają kości. Odkrył je brytyjski strażnik w 1942 r. Szkielety ok. 500 osób mają takie same okrągłe pęknięcia czaszki od uderzenia z góry, więc teoria to grad wielkości piłek do krykieta. DNA pokazało dwie grupy: z Azji Południowej (ok. 800 r.) i śródziemnomorską (ok. 1800 r.)."},{"t":"8. Upadek epoki brązu","d":"Ok. 1200 r. p.n.e. w ciągu kilkudziesięciu lat upadli Mykeńczycy i Hetyci, a Egipt ledwo przetrwał. Proponowane przyczyny: trzęsienia ziemi, susza, Ludy Morza, choroby, ale żadna nie wystarcza sama. Najlepsza teoria według autora to zerwanie łańcuchów dostaw (miedź z Cypru, zboże z Egiptu, drewno z Libanu). Ludność Grecji spadła o ok. 75%."},{"t":"7. Rzymski dwunastościan","d":"W Europie znaleziono ponad 100 pustych brązowych obiektów o 12 pięciokątnych ściankach, każda z otworem innej wielkości, od piłki golfowej do grejpfruta. Żaden rzymski tekst, obraz ani rzeźba ich nie pokazuje. Teorie: świeczniki, przyrządy miernicze, kości do gry, narzędzia do dziergania rękawiczek. Często zakopywano je z monetami."},{"t":"6. Miedziany Zwój","d":"W 1952 r. w jaskiniach nad Morzem Martwym znaleziono zwój z miedzi z listą 64 miejsc, gdzie miało być zakopane ok. 65 ton złota i srebra, dziś ponad 1 mld dolarów. Wskazówki odnoszą się do nieistniejących punktów. Może to spis skarbów świątyni ukrytych przed zburzeniem Jerozolimy w 70 r., może symbol albo żart; nic nie znaleziono."},{"t":"5. Zamknięte grobowce Kofun","d":"Japonia ma ponad 160 tys. kurhanów kofun z lat 300-700. Największy, Daisen, ma większą powierzchnię niż Wielka Piramida i kształt dziurki od klucza otoczonej wodą. Agencja Dworu Cesarskiego nie pozwala na wykopaliska \"z szacunku dla zmarłych\". Część historyków podejrzewa, że wykopaliska pokazałyby powiązania z Koreą lub Chinami."},{"t":"4. Sylfion","d":"Roślina rosła tylko na wąskim pasie wybrzeża dzisiejszej Libii i nie dało się jej uprawiać gdzie indziej. Rzymianie płacili za nią srebrem na wagę i używali jako leku na wszystko i przyprawy. Juliusz Cezar trzymał ok. 680 kg w skarbcu. Ostatnią łodygę w I w. dostał Neron, a dokładny gatunek jest nieznany."},{"t":"3. Zaginione miasto Akad","d":"Ok. 2300 r. p.n.e. Sargon z Akadu stworzył pierwsze imperium, a jego stolica Akad jest dobrze opisana w tekstach: królowie, prawa, gospodarka. Mimo ponad 100 lat poszukiwań w Iraku i Syrii miasta nie znaleziono. Może leżeć pod Bagdadem albo zostało zmyte i zasypane mułem przez Tygrys; imperium upadło ok. 2150 r. p.n.e."},{"t":"2. Zniknięcie Normanów z Grenlandii","d":"Ok. 985 r. Eryk Rudy nazwał lodową wyspę Grenlandią, żeby przyciągnąć osadników; w szczycie żyło tam ok. 5000 Normanów. Ostatni zapis z 1408 r. to opis ślubu, a w XVI w. Europejczycy zastali ruiny. Teoria: mała epoka lodowa, odrzucenie sposobów Inuitów, upadek rynku kości morsa i stopniowy wyjazd młodych na Islandię."},{"t":"1. Sumeryjska lista królów","d":"Gliniane tabliczki sprzed ok. 4000 lat wymieniają królów Sumeru sprzed potopu z panowaniami po 43 200, 36 000 i 28 800 lat, łącznie ponad 240 tys. lat. Po potopie liczby spadają do 1200, 900, 300 i w końcu do normalnych. To był oficjalny dokument państwowy, a potop przypomina ten z Biblii i Eposu o Gilgameszu."}],"conclusion":"Nawet dobrze opisane cywilizacje mają luki, a niektóre zagadki mogą pozostać nierozwiązane na zawsze.","factchecks":[{"claim":"Rok 536: mgła zasłoniła słońce, zimno i głód.","verdict":"prawda","note":"Potwierdzają to rdzenie lodowe, słoje drzew i relacja Prokopiusza.","src":[["Wikipedia (ang.): zima wulkaniczna 536 r. - hasło \"Volcanic winter of 536\"","https://en.wikipedia.org/wiki/Volcanic_winter_of_536"],["Science: najgorszy rok w historii","https://www.science.org/content/article/why-536-was-worst-year-be-alive"]],"p":0},{"claim":"Roopkund: dwie grupy zginęły ok. 1000 lat od siebie, wszyscy od gradu.","verdict":"półprawda","note":"DNA (2019) pokazało grupy z VII-X w. i XVII-XX w., co podważa tezę o jednym gradobiciu.","src":[["Harney i in. 2019, Nature Communications","https://www.nature.com/articles/s41467-019-11357-9"],["Wikipedia (ang.): jezioro Roopkund - hasło \"Roopkund\"","https://en.wikipedia.org/wiki/Roopkund"]],"p":1},{"claim":"Upadek epoki brązu: upadły niemal wszystkie państwa naraz.","verdict":"półprawda","note":"Upadli Hetyci, Mykeny i Ugarit, ale Egipt i Asyria przetrwały osłabione.","src":[["Wikipedia (ang.): upadek epoki brązu - hasło \"Late Bronze Age collapse\"","https://en.wikipedia.org/wiki/Late_Bronze_Age_collapse"]],"p":2},{"claim":"Rzymskie dwunastościany: żaden tekst o nich nie wspomina.","verdict":"prawda","note":"Znaleziono ponad 100 egzemplarzy, głównie w północno-zachodniej części imperium; brak wzmianek w tekstach, a funkcja jest nieznana.","src":[["Wikipedia (ang.): rzymski dwunastościan - hasło \"Roman dodecahedron\"","https://en.wikipedia.org/wiki/Roman_dodecahedron"]],"p":3},{"claim":"Miedziany Zwój: 1952, 64 skrytki, niczego nie znaleziono.","verdict":"prawda","note":"Zgodne ze źródłami. Badacze spierają się, czy to realna lista skarbów Świątyni, czy folklor.","src":[["Wikipedia (ang.): Miedziany Zwój - hasło \"Copper Scroll\"","https://en.wikipedia.org/wiki/Copper_Scroll"]],"p":4},{"claim":"Kofun: ponad 160 tys. kurhanów, Daisen większy od Wielkiej Piramidy, zakaz badań.","verdict":"prawda","note":"Daisen jest większy od Wielkiej Piramidy, ale od 2018 r. dopuszczono ograniczone wykopaliska.","src":[["Wikipedia (ang.): kurhan Daisen - hasło \"Daisen Kofun\"","https://en.wikipedia.org/wiki/Daisen_Kofun"],["Wikipedia (ang.): kurhany kofun - hasło \"Kofun\"","https://en.wikipedia.org/wiki/Kofun"]],"p":5},{"claim":"Sylfion był wart srebra, a tożsamość rośliny zaginęła na zawsze.","verdict":"półprawda","note":"Anegdoty są od Pliniusza, ale w 2021 r. zaproponowano identyfikację rośliny (sporną), więc nie \"na zawsze\".","src":[["Wikipedia (ang.): sylfion - hasło \"Silphium\"","https://en.wikipedia.org/wiki/Silphium"],["Miski 2021, Plants (PMC)","https://pmc.ncbi.nlm.nih.gov/articles/PMC7825337/"]],"p":6},{"claim":"Lokalizacja Akadu jest nieznana.","verdict":"prawda","note":"Mimo wielu propozycji miasta nie zlokalizowano.","src":[["Wikipedia (ang.): miasto Akad - hasło \"Akkad (city)\"","https://en.wikipedia.org/wiki/Akkad_(city)"]],"p":7},{"claim":"Grenlandia: ostatni zapis 1408 r., 5000 osadników, odrzucili sposoby Inuitów.","verdict":"półprawda","note":"Ślub z 1408 r. się zgadza, ale osadników było ok. 2000-2500 i jedli dużo foki.","src":[["Wikipedia (ang.): osadnictwo nordyckie w Ameryce i na Grenlandii - hasło \"Norse colonization of the Americas / Greenland\"","https://en.wikipedia.org/wiki/Norse_colonization_of_North_America"],["Smithsonian: dlaczego zniknęli","https://www.smithsonianmag.com/history/why-greenland-vikings-vanished-180962119/"]],"p":8},{"claim":"Liczb panowań z Sumeryjskiej listy królów nikt nie wyjaśnił.","verdict":"półprawda","note":"Liczby to wielokrotności sar (3600) w systemie sześćdziesiątkowym; lista łączy mit z historią.","src":[["Wikipedia (ang.): Sumeryjska lista królów - hasło \"Sumerian King List\"","https://en.wikipedia.org/wiki/Sumerian_King_List"]],"p":9}],"bias":"Dobrze dobrane tematy, ale przesadza z \"nierozwiązanymi zagadkami\": dla kilku (Roopkund, sylfion, lista królów) jest postęp, który film pomija lub umniejsza.","channel":"Chill Dude Explains"},{"id":"XSl4ZTtjS7Q","title_pl":"Instynkty, z którymi walczysz codziennie, a których ewolucja zapomniała usunąć","title":"Instincts You Fight Daily That Evolution Forgot To Delete","url":"https://www.youtube.com/watch?v=XSl4ZTtjS7Q","date":"2025-05-25","duration":711,"views":1880940,"transcript":"youtube","added":"2026-11-03","tags":["Psychologia","Ewolucja"],"about":"8 odruchów i skłonności psychicznych, które według autora są pozostałością po życiu w plemionach łowców-zbieraczy i nie pasują do współczesności.","intro":"Ranking 8 odruchów, które według autora zostały nam po przodkach żyjących w plemionach i dziś często szkodzą. Są to: potrzeba drzemki, instynkt stadny, przymus odwzajemniania przysług, strach przed nieznanym, potrzeba kontroli, awersja do straty, obsesja statusu i reakcja na niesprawiedliwość. Każdy punkt ma ten sam schemat: jak pomagał przetrwać i jak przeszkadza w pracy, zakupach i internecie.","points":[{"t":"8. Potrzeba drzemki","d":"Senność o 14:00 po 8 godzinach snu albo pobudka o 3:00 to według autora dawny rytm. Przodkowie spali dwufazowo: kilka godzin, przerwa w nocy na sprawdzenie zagrożeń, jedzenie albo seks, potem znowu sen, a w upale (ok. 38°C) drzemali w dzień. Praca od 9:00, latarnie i telefony do tego nie pasują."},{"t":"7. Instynkt stadny","d":"Patrzysz w niebo, bo patrzą inni. Gdy plemię zaczynało uciekać, kto pytał dlaczego, zostawał zjedzony; grupa dawała jedzenie i ochronę. Mózg nagradza dopasowanie się dopaminą. Dziś przez to kupujemy akcje GameStop za radą Reddita, nosimy modne brzydkie buty i wierzymy w fałszywe newsy."},{"t":"6. Przymus odwzajemnienia","d":"Przytrzymane drzwi albo kawa od kolegi wywołują poczucie długu. U przodków dzielenie się mięsem i jagodami było warunkiem przeżycia zimy, a mózg robi nam dyskomfort, dopóki nie oddamy. Marketing to wykorzystuje: darmowa próbka w Costco kończy się słoikiem ogórków 4,5 kg, kawa u dilera skłania do zakupu auta."},{"t":"5. Strach przed nieznanym","d":"Ciemny pokój czy obce jedzenie przyspieszają tętno. Szelest w krzakach mógł być drapieżnikiem, a nowa jagoda trucizną; przeżyli ostrożni. Mózg zalewa nas hormonami stresu przy nowościach. Dziś zamawiamy to samo danie od 10 lat, nie próbujemy nowych aplikacji i zostajemy w pracy, której nie znosimy."},{"t":"4. Potrzeba kontroli","d":"Wciskanie wyimaginowanego hamulca, gdy prowadzi ktoś inny, i złość, gdy plan dnia się sypie. Przeżywali ci, którzy budowali lepsze schronienia, przechowywali jedzenie i planowali polowania; mózg nagradza kontrolę dopaminą. Dziś korki, przeciągnięte spotkania czy źle załadowana zmywarka wywołują reakcję jak na zagrożenie."},{"t":"3. Awersja do straty","d":"Znalezione 100 dolarów cieszy, ale zgubione 100 dolarów boli tygodniami. Dla przodka utrata jedynej włóczni czy zapasów oznaczała śmierć, a brak dodatkowego jedzenia tylko rozczarowanie. Według autora strata boli 2 razy mocniej niż równy zysk, więc trzymamy tracące akcje, niechciane ubrania i złą pracę."},{"t":"2. Obsesja statusu","d":"Ktoś ma lepsze auto albo ładniejsze życie na Instagramie i czujesz się gorzej. W plemieniu wysoki status oznaczał lepsze jedzenie, partnerów i posłuch, a niski resztki i brak potomstwa. Mózg nagradza awans i karze spadek stresem. Dziś kupujemy rzeczy ponad stan i publikujemy podkoloryzowane życie."},{"t":"1. Potrzeba sprawiedliwości","d":"Ktoś wpycha się w kolejkę albo kradnie pomysł i budzi się wściekłość. W plemieniu ok. 30 osób chomikowanie jedzenia czy jedzenie bez polowania zagrażało wszystkim, a wykrywanie i karanie oszustów pozwalało przetrwać. Dziś ta sama reakcja dotyczy drobiazgów: dwóch darmowych próbek, faworyzowania przez szefa, wpisów w sieci."}],"conclusion":"Nasz mózg jest wciąż ustawiony na życie w małym plemieniu, a zrozumienie tego pomaga nie dawać się tym odruchom sterować.","factchecks":[{"claim":"Przodkowie spali dwufazowo (\"pierwszy i drugi sen\") przez tysiące lat.","verdict":"półprawda","note":"Ekirch opisał sen dwufazowy w dawnej Europie, ale u współczesnych łowców-zbieraczy go nie wykazano.","src":[["Wikipedia (ang.): sen dwufazowy - hasło \"Segmented sleep\"","https://en.wikipedia.org/wiki/Segmented_sleep"],["Yetish i in. 2015, Current Biology (DOI)","https://doi.org/10.1016/j.cub.2015.09.046"]],"p":0},{"claim":"Mózg nagradza konformizm (układ nagrody).","verdict":"półprawda","note":"Jedno badanie fMRI (2009) pokazało sygnał błędu przy niezgodności z grupą; \"dopamina za konformizm\" to uproszczenie.","src":[["Klucharev i in. 2009 (PubMed)","https://pubmed.ncbi.nlm.nih.gov/19146819/"],["Wikipedia (ang.): instynkt stadny - hasło \"Herd mentality\"","https://en.wikipedia.org/wiki/Herd_mentality"]],"p":1},{"claim":"Reguła wzajemności działa, a sprzedawcy używają jej przez darmowe próbki.","verdict":"prawda","note":"Klasyczny eksperyment Regana (1971) i prace Cialdiniego dobrze to dokumentują.","src":[["Wikipedia (ang.): reguła wzajemności - hasło \"Reciprocity (social psychology)\"","https://en.wikipedia.org/wiki/Reciprocity_(social_psychology)"]],"p":2},{"claim":"Strata boli ok. dwa razy mocniej niż równy zysk.","verdict":"półprawda","note":"Kahneman i Tversky podali ok. 2, ale nowsze prace pokazują, że efekt bywa dużo mniejszy.","src":[["Wikipedia (ang.): awersja do straty - hasło \"Loss aversion\"","https://en.wikipedia.org/wiki/Loss_aversion"],["Gal i Rucker 2018, krytyka (DOI)","https://doi.org/10.1002/jcpy.1047"]],"p":5},{"claim":"Poczucie sprawiedliwości jest wrodzone i ewolucyjnie stare.","verdict":"półprawda","note":"Kapucynki i ludzie odrzucają niesprawiedliwe nagrody, ale ewolucyjne wyjaśnienia to hipotezy.","src":[["Brosnan i de Waal 2003, Nature","https://www.nature.com/articles/nature01963"],["Wikipedia (ang.): gra w ultimatum - hasło \"Ultimatum game\"","https://en.wikipedia.org/wiki/Ultimatum_game"]],"p":7},{"claim":"Strach przed nieznanym, potrzeba kontroli i status jako ewolucyjne pozostałości.","verdict":"nie da się sprawdzić","note":"Zjawiska są realne, ale ewolucyjne historie \"jak było w plemieniu\" są nietestowalne.","src":[["Wikipedia (ang.): iluzja kontroli - hasło \"Illusion of control\"","https://en.wikipedia.org/wiki/Illusion_of_control"],["Wikipedia (ang.): krytyka wyjaśnień typu \"just-so story\" - hasło \"Just-so story\"","https://en.wikipedia.org/wiki/Just-so_story"]],"p":null}],"bias":"Jednostronny: każde zachowanie wyjaśnia psychologią ewolucyjną w formie \"opowieści\", bez alternatyw (kultura, uczenie się). Brak źródeł; traktuj jako ciekawostkę, nie wiedzę.","channel":"Chill Dude Explains"},{"id":"kDfP5vAbOS0","title_pl":"Całkowicie błędne fakty, w które wszyscy wciąż wierzą","title":"Totally Wrong Facts Everyone Still Believes","url":"https://www.youtube.com/watch?v=kDfP5vAbOS0","date":"2025-04-30","duration":533,"views":2837925,"transcript":"youtube","added":"2026-11-03","tags":["Mity","Ciało i zdrowie","Nauka"],"about":"Ranking 10 popularnych \"faktów\", które według autora są mitami, od cukru i hiperaktywności po połkniętą gumę.","intro":"Ranking 10 popularnych \"faktów\", które według autora są mitami. Obala m.in. nadpobudliwość dzieci po cukrze, 10% mózgu, zabójczą monetę z Empire State Building, \"piorun nie uderza dwa razy\", hełmy wikingów z rogami, gęstsze włosy po goleniu, zakaz pływania po jedzeniu, utratę połowy ciepła przez głowę, 3-sekundową pamięć złotej rybki i gumę zalegającą 7 lat w żołądku.","points":[{"t":"10. Cukier nie robi z dzieci \"tornada\"","d":"W badaniu część dzieci dostała cukier, a część słodzik, i ani dzieci, ani rodzice nie wiedzieli, kto co dostał; różnicy nie było. Za to rodzice, którzy myśleli, że dziecko zjadło cukier, widzieli nadpobudliwość. Mit według autora zaczął się w latach 70. od lekarza obwiniającego dodatki do żywności."},{"t":"9. Nie używamy tylko 10% mózgu","d":"Skanery pokazują aktywność w całym mózgu, także we śnie, gdy steruje oddechem i sercem. Mózg to 2% masy ciała, a zużywa 20% energii; ewolucja nie trzymałaby 90% bezużytecznego organu, a nawet mały uraz daje poważne skutki. Mit ma pochodzić od badacza z Harvardu z XIX w. mówiącego o niewykorzystanym potencjale."},{"t":"8. Moneta z Empire State Building nie zabije","d":"Opór powietrza sprawia, że moneta koziołkuje i po ok. 15 m osiąga prędkość graniczną ok. 40 km/h, wolniej niż przeciętny rowerzysta. Uderzenie przypomina pstryczka. W próżni osiągnęłaby ponad 320 km/h. Autor dodaje, że groźniejszy byłby spadający długopis, który leci jak strzała."},{"t":"7. Piorun uderza w to samo miejsce","d":"Empire State Building dostaje ok. 25 uderzeń rocznie, a strażnik parku Roy Sullivan przeżył 7 uderzeń; po 4. koledzy unikali go w czasie burz. Pioruny trafiają w te same wysokie obiekty, np. samotne drzewo. Mogą też uderzyć kilometry od burzy, przy czystym niebie (\"grom z jasnego nieba\")."},{"t":"6. Wikingowie nie nosili hełmów z rogami","d":"Rogi wymyślili XIX-wieczni kostiumolodzy operowi, bo wyglądały dramatycznie. W walce byłyby uchwytem dla wroga i zaczepiałyby o gałęzie. Znalezione hełmy wikingów są proste, czasem z osłoną nosa. Rogate hełmy z Danii są o 3000 lat starsze i były ceremonialne, jak korona."},{"t":"5. Golenie nie zagęszcza włosów","d":"Golenie ścina włos na płasko, jak pień ścięty piłą, więc odrost wydaje się grubszy niż naturalnie zwężona końcówka. Badania od dekad nie wykazały wpływu golenia, a grubość, kolor i tempo wzrostu zależą od genów. Gdyby to działało, golenie leczyłoby łysienie, a Jeff Bezos wciąż jest łysy."},{"t":"4. Można pływać zaraz po jedzeniu","d":"Mama mówiła, żeby czekać 30 minut, a zasadę egzekwowali nawet ratownicy. Według autora nie ma ani jednego udokumentowanego utonięcia z tego powodu; ciało radzi sobie z trawieniem i pływaniem naraz. Po dużym posiłku może złapać lekki skurcz jak przy bieganiu. Pływacy jedzą podczas treningów, a Czerwony Krzyż to potwierdza."},{"t":"3. Głowa nie traci połowy ciepła","d":"Mit o 40-45% ciepła pochodzi z wojskowego podręcznika, w którego badaniu ludzie byli w pełnym stroju zimowym z odkrytą tylko głową. Głowa to ok. 10% powierzchni ciała, więc traci ok. 10% ciepła; strata zależy od odkrytej skóry. Wyjątkiem są niemowlęta i małe dzieci, bo mają proporcjonalnie większe głowy."},{"t":"2. Złota rybka ma dobrą pamięć","d":"Złote rybki rozwiązują labirynty i pamiętają rozwiązanie przez miesiące, rozpoznają twarze, uczą się sztuczek, np. przepływania przez obręcze czy \"gry w piłkę\", i rozróżniają utwory muzyczne, mając mózg mniejszy od ziarnka grochu. Badanie ich mózgu może pomóc zrozumieć ludzką pamięć."},{"t":"1. Połknięta guma nie zostaje na 7 lat","d":"Guma przechodzi przez przewód pokarmowy jak inne jedzenie, tylko się nie rozkłada, podobnie jak ziarna kukurydzy, i wychodzi w 1-2 dni. Żołądek ciągle się porusza, więc nic się nie przykleja. Problem może być tylko przy połykaniu dużych ilości. Grecy żuli żywicę, a Majowie chicle."}],"conclusion":"Większość \"oczywistych\" faktów z dzieciństwa to mity, które przetrwały, bo brzmią przekonująco albo powtarzali je rodzice.","factchecks":[{"claim":"Cukier nie powoduje nadpobudliwości u dzieci; rodzice widzą ją z powodu oczekiwań.","verdict":"prawda","note":"Metaanaliza 16 ślepych badań (JAMA 1995) nie wykazała wpływu cukru na zachowanie.","src":[["JAMA 1995, Wolraich i in. (PubMed)","https://pubmed.ncbi.nlm.nih.gov/7474248/"],["Hoover i Milich 1994, J Abnorm Child Psychol","https://link.springer.com/article/10.1007/BF02168088"]],"p":0},{"claim":"Mit 10% mózgu; mózg to 2% masy i 20% energii.","verdict":"prawda","note":"Obrazowanie pokazuje aktywność całego mózgu; dane o 2% masy i 20% energii są standardowe.","src":[["Wikipedia (ang.): mit 10% mózgu - hasło \"Ten percent of the brain myth\"","https://en.wikipedia.org/wiki/Ten_percent_of_the_brain_myth"],["Scientific American: mit 10%","https://www.scientificamerican.com/article/do-people-only-use-10-percent-of-their-brains/"]],"p":1},{"claim":"Moneta osiąga prędkość graniczną ok. 40 km/h i nie zabije.","verdict":"prawda","note":"Zmierzono ok. 40-80 km/h; moneta nie przebije czaszki.","src":[["Wikipedia (ang.): lista powszechnych mitów (moneta z wieżowca) - hasło \"List of common misconceptions\"","https://en.wikipedia.org/wiki/List_of_common_misconceptions_about_science,_technology,_and_mathematics"],["Wikipedia (ang.): prędkość graniczna - hasło \"Terminal velocity\"","https://en.wikipedia.org/wiki/Terminal_velocity"]],"p":2},{"claim":"Empire State Building: ok. 25 uderzeń pioruna rocznie; Roy Sullivan przeżył 7 uderzeń.","verdict":"prawda","note":"NOAA podaje ok. 20-25 uderzeń rocznie w Empire State Building. Sullivan jest w Księdze Guinnessa jako osoba trafiona 7 razy (1942-1977).","src":[["NOAA/NWS: mity o piorunach","https://www.weather.gov/safety/lightning-myths"],["Wikipedia (ang.): Roy Sullivan","https://en.wikipedia.org/wiki/Roy_Sullivan"]],"p":3},{"claim":"Rogate hełmy z Danii są o 3000 lat starsze od wikingów.","verdict":"fałsz","note":"Hełmy z Viksø są z ok. 900 p.n.e., czyli ok. 1700 lat przed wikingami, nie 3000.","src":[["Aarhus University: datowanie hełmów z Viksø","https://cas.au.dk/en/currently/news/show/artikel/new-study-about-the-viksoe-helmets"],["Smithsonian: hełmy mają prawie 3000 lat","https://www.smithsonianmag.com/smart-news/iconic-viking-horned-helmets-actually-3000-years-old-180979339/"]],"p":4},{"claim":"Golenie nie zmienia grubości ani tempa wzrostu włosów.","verdict":"prawda","note":"Badania od lat 20. XX w. nie wykazały wpływu golenia na włosy; Mayo Clinic potwierdza.","src":[["Mayo Clinic: golenie a odrost włosów","https://www.mayoclinic.org/healthy-lifestyle/adult-health/expert-answers/hair-removal/faq-20058427"]],"p":5},{"claim":"Pływanie zaraz po jedzeniu nie jest groźne; Czerwony Krzyż to potwierdza.","verdict":"prawda","note":"Czerwony Krzyż nie znalazł dowodów na utonięcia związane z jedzeniem przed pływaniem.","src":[["Wikipedia (ang.): lista powszechnych mitów (pływanie po jedzeniu) - hasło \"List of common misconceptions\"","https://en.wikipedia.org/wiki/List_of_common_misconceptions_about_science,_technology,_and_mathematics"]],"p":6},{"claim":"Mit 40-45% ciepła tracone przez głowę pochodzi z wojskowego podręcznika; głowa to ok. 10% powierzchni.","verdict":"prawda","note":"BMJ (2008): mit pochodzi z badań armii USA; głowa to ok. 7-10% powierzchni ciała.","src":[["BMJ 2008: świąteczne mity medyczne (DOI)","https://doi.org/10.1136/bmj.a2769"]],"p":7},{"claim":"Złote rybki pamiętają przez miesiące, uczą się sztuczek i rozróżniają muzykę.","verdict":"prawda","note":"Badania pokazują pamięć trwającą miesiące i rozróżnianie muzyki u złotych rybek.","src":[["Wikipedia (ang.): złota rybka (pamięć) - hasło \"Goldfish\"","https://en.wikipedia.org/wiki/Goldfish"],["Shinozuka i in. 2013, muzyka a złote rybki (PubMed)","https://pubmed.ncbi.nlm.nih.gov/23796771/"]],"p":8},{"claim":"Połknięta guma wychodzi w 1-2 dni, nie zostaje 7 lat.","verdict":"prawda","note":"Gastroenterolodzy potwierdzają; problemy (bezoar) zdarzają się tylko przy bardzo częstym połykaniu dużych ilości, zwłaszcza u dzieci.","src":[["Scientific American: połknięta guma","https://www.scientificamerican.com/article/fact-or-fiction-chewing-gum-takes-seven-years-to-digest/"],["Mayo Clinic: połknięta guma","https://www.mayoclinic.org/healthy-lifestyle/nutrition-and-healthy-eating/expert-answers/digestion/faq-20058446"]],"p":9}],"bias":"Rzetelny, w większości zgodny z nauką. Jedyny wyraźny błąd: wiek hełmów z Viksø. Ton prześmiewczy wobec rodziców, ale bez tendencyjności.","channel":"Chill Dude Explains"},{"id":"wztjGaAiqME","title_pl":"Niewinne nawyki, które po cichu niszczą twoje ciało","title":"Innocent Habits That Are Secretly Wrecking Your Body","url":"https://www.youtube.com/watch?v=wztjGaAiqME","date":"2025-04-21","duration":733,"views":1492461,"transcript":"youtube","added":"2026-11-03","tags":["Ciało i zdrowie"],"about":"9 codziennych nawyków, które według autora po cichu szkodzą zdrowiu, od obgryzania paznokci po wstrzymywanie moczu.","intro":"Ranking 9 codziennych nawyków, które według autora po cichu szkodzą zdrowiu. Są to obgryzanie paznokci, tłumienie kichnięć, czyszczenie uszu patyczkami, picie za dużo wody, głośne słuchawki, światło w nocy, siedzenie, spanie na brzuchu i wstrzymywanie moczu. Przy każdym autor opisuje mechanizm szkody i czasem daje prostą radę, co robić zamiast tego.","points":[{"t":"9. Obgryzanie paznokci","d":"Paznokcie zbierają zarazki z klamek, telefonów i klawiatur, a obgryzanie przenosi je do ust. Zęby przednie się wyszczerbiają i przesuwają, a dentysta rozpozna obgryzacza po zębach. Zerwane skórki otwierają drogę do zanokcicy. Według autora obgryzacze mają więcej infekcji żołądka i jelit, a nawyk wiąże się z lękiem."},{"t":"8. Tłumienie kichnięć","d":"Kichnięcie ma osiągać do ok. 160 km/h, a zatkanie nosa i ust kieruje ciśnienie z powrotem do głowy. Przez trąbki Eustachiusza może pęknąć błona bębenkowa, mogą pękać naczynka w oczach i nosie, rzadko dochodzi do uszkodzenia gardła. Ktoś złamał małą kość twarzy i miał powietrze pod skórą."},{"t":"7. Patyczki do uszu","d":"Patyczek nie czyści, tylko wpycha woskowinę głębiej, a uszy oczyszczają się same, przesuwając ją na zewnątrz. Zbita woskowina zmniejsza słyszenie i bywa usuwana na SOR. Błona bębenkowa jest cienka jak folia spożywcza, a ranki i uwięziona wilgoć sprzyjają infekcjom. Rada: myć tylko małżowinę myjką."},{"t":"6. Przewodnienie","d":"Hiponatremia: przy szybkim piciu dużej ilości wody nerki nie nadążają, sodu jest za mało i komórki puchną. Mózg nie ma gdzie się rozszerzyć, więc pojawia się ból głowy, dezorientacja, drgawki, a nawet śmierć. 9-letnia dziewczynka zmuszona do picia za karę ledwo przeżyła; umierali też maratończycy. Rada: pij, gdy chce ci się pić."},{"t":"5. Słuchawki","d":"Ślimak ucha ma tysiące komórek rzęsatych, które nie odrastają. Rozmowa to ok. 60 dB, słuchawki dają 105 dB i więcej, głośniej niż piła łańcuchowa. Powyżej 85 dB słuch się uszkadza, przy 100 dB w ok. 15 minut, bez bólu. Według autora wielu nastolatków ma słuch 50-latków, a aparat słuchowy go nie przywraca."},{"t":"4. Lampki nocne","d":"Po zmroku organizm wytwarza melatoninę, a nawet słabe światło (ładowarka, latarnia, budzik) może obciąć ją o połowę. Długotrwale rozregulowuje to metabolizm: tycie bez zmiany diety i gorsze działanie insuliny. Myszy przy słabym świetle nocą tyły i miały objawy depresji; zaburzony sen wiąże się z lękiem."},{"t":"3. Krzesło","d":"Przy wielogodzinnym siedzeniu krew zalega w nogach, co zwiększa ryzyko zakrzepów, spada spalanie kalorii i aktywność enzymów rozkładających tłuszcz. Mięśnie brzucha i pleców słabną, a sylwetka się garbi. Według autora pracownik biurowy siedzi ok. 15 godzin dziennie, a część naukowców mówi \"siedzenie to nowe palenie\"."},{"t":"2. Spanie na brzuchu","d":"Żeby oddychać, trzeba skręcić szyję na bok na wiele godzin, a ciężar ciała spłaszcza naturalne krzywizny kręgosłupa. Uciskane nerwy dają mrowienie i drętwienie rąk, a z czasem przewlekły ból szyi i pleców. Rada: bardzo płaska poduszka, mała poduszka pod miednicę, a najlepiej nauka spania na plecach lub boku."},{"t":"1. Wstrzymywanie moczu","d":"Pęcherz wysyła sygnał, gdy jest w połowie pełny, a ignorowanie go rozciąga go jak gumkę, która traci sprężystość. Osłabiony nie opróżnia się do końca, a zalegający mocz sprzyja zakażeniom dróg moczowych. Pęknięcie jest rzadkie, ale z latami może osłabnąć dno miednicy i pojawić się nietrzymanie."}],"conclusion":"Drobne nawyki powtarzane codziennie sumują się w realne szkody, więc warto je korygować, zanim pojawią się objawy.","factchecks":[{"claim":"Kichnięcie osiąga ok. 160 km/h.","verdict":"fałsz","note":"Pomiar szybką kamerą (2013) dał ok. 16 km/h; 160 km/h to dawne szacunki.","src":[["Tang i in. 2013, PLOS One","https://journals.plos.org/plosone/article?id=10.1371%2Fjournal.pone.0059970"]],"p":1},{"claim":"Tłumione kichnięcie może uszkodzić gardło i uszy.","verdict":"prawda","note":"Opisano m.in. pęknięcie gardła u mężczyzny, który zatkał nos i usta (BMJ Case Reports, 2018). To jednak bardzo rzadkie przypadki.","src":[["BMJ Case Reports 2018 (PubMed)","https://pubmed.ncbi.nlm.nih.gov/29335355/"]],"p":1},{"claim":"Patyczki wpychają woskowinę i mogą uszkodzić błonę bębenkową.","verdict":"prawda","note":"Zgodne z wytycznymi otolaryngologów (AAO-HNS) i analizami urazów u dzieci.","src":[["Wikipedia (ang.): patyczki higieniczne (ryzyka) - hasło \"Cotton swab\"","https://en.wikipedia.org/wiki/Cotton_swab"],["AAO-HNS: wytyczne o woskowinie","https://www.enthealth.org/conditions/earwax-cerumen/"]],"p":2},{"claim":"Zbyt dużo wody może zabić (hiponatremia).","verdict":"prawda","note":"Zatrucie wodą jest dobrze udokumentowane; przypadku 9-latki nie udało się zweryfikować.","src":[["Wikipedia (ang.): zatrucie wodne - hasło \"Water intoxication\"","https://en.wikipedia.org/wiki/Water_intoxication"]],"p":3},{"claim":"Powyżej 85 dB grozi uszkodzenie słuchu, przy 100 dB po ok. 15 minutach; nastolatki mają słuch 50-latków.","verdict":"półprawda","note":"Progi zgadzają się z normą NIOSH, ale \"słuch 50-latków\" nie ma źródła.","src":[["CDC/NIOSH: hałas w pracy a utrata słuchu","https://www.cdc.gov/niosh/noise/about/index.html"],["WHO: głuchota i utrata słuchu","https://www.who.int/news-room/fact-sheets/detail/deafness-and-hearing-loss"]],"p":4},{"claim":"Przyćmione światło nocą tuczy myszy.","verdict":"prawda","note":"Myszy przy słabym świetle nocą tyły (PNAS 2010); u ludzi są tylko korelacje.","src":[["Fonken i in. 2010, PNAS (DOI)","https://doi.org/10.1073/pnas.1008734107"]],"p":5},{"claim":"Przeciętny pracownik biurowy siedzi do 15 godzin dziennie; \"siedzenie to nowe palenie\".","verdict":"fałsz","note":"Dorośli siedzą ok. 9-10 h dziennie, a ryzyko palenia jest wielokrotnie wyższe.","src":[["Wikipedia (ang.): siedzący tryb życia - hasło \"Sedentary lifestyle\"","https://en.wikipedia.org/wiki/Sedentary_lifestyle"],["Ekelund i in. 2016, Lancet (DOI)","https://doi.org/10.1016/S0140-6736(16)30370-1"]],"p":6},{"claim":"Obgryzacze paznokci mają istotnie więcej infekcji przewodu pokarmowego.","verdict":"nie da się sprawdzić","note":"Obgryzanie przenosi bakterie, ale brak solidnych badań o częstszych infekcjach jelitowych.","src":[["Wikipedia (ang.): obgryzanie paznokci - hasło \"Nail biting\"","https://en.wikipedia.org/wiki/Nail_biting"]],"p":0},{"claim":"Częste wstrzymywanie moczu osłabia dno miednicy i prowadzi do nietrzymania.","verdict":"półprawda","note":"Okazjonalne wstrzymywanie jest bezpieczne; szkodzi tylko wieloletnie, skrajne.","src":[["Cleveland Clinic: skutki długiego wstrzymywania moczu","https://my.clevelandclinic.org/health/diseases/22208-shy-bladder-syndrome-paruresis"],["Kettering Health: jak długo można wstrzymywać mocz","https://ketteringhealth.org/how-long-should-i-hold-my-pee/"]],"p":8}],"bias":"Straszy (\"cichy zabójca\") i podaje kilka przesadzonych liczb (kichnięcie, 15 h siedzenia). Rady są w większości sensowne, ale ryzyka są wyolbrzymione.","channel":"Chill Dude Explains"},{"id":"19UC0V9Ul2M","title_pl":"Bardzo niepokojące rzeczy, które robi twoje ciało","title":"Very CREEPY Things Your Body Does","url":"https://www.youtube.com/watch?v=19UC0V9Ul2M","date":"2025-04-07","duration":597,"views":1909931,"transcript":"youtube","added":"2026-11-03","tags":["Ciało i zdrowie","Nauka"],"about":"Ranking 10 \"przerażających\" rzeczy, które robi ludzkie ciało i mózg, od drgnięć przy zasypianiu po roztocza w rzęsach.","intro":"Ranking 10 rzeczy, które ludzkie ciało i mózg robią \"za twoimi plecami\". Autor zaczyna od drgnięć przy zasypianiu i fantomowych wibracji telefonu, przechodzi przez pasożyta Toxoplasma, paraliż senny i \"drugi mózg\" w jelitach, a kończy na roztoczach żyjących w rzęsach. Ton jest celowo straszny, a każdy punkt to krótka ciekawostka bez podanych źródeł.","points":[{"t":"10. Drgnięcia przy zasypianiu","d":"Ma to ok. 70% ludzi. Gdy mięśnie się rozluźniają, mózg bierze to za spadanie i wysyła sygnał alarmowy, który budzi szarpnięciem. Część osób widzi przy tym upadek albo słyszy huk. Autor podaje hipotezę, że to pozostałość po spaniu na drzewach; zmęczenie i stres to nasilają."},{"t":"9. Syndrom fantomowych wibracji","d":"Według autora zgłasza je do 90% posiadaczy telefonów. Mózg przyzwyczajony do powiadomień bierze ruch ubrania czy drgnięcie mięśnia za wibrację. Im większy lęk przed przegapieniem wiadomości, tym częściej, a zmiana kieszeni nie pomaga, bo \"wibracje\" przenoszą się w nowe miejsce."},{"t":"8. Pasożyty sterujące","d":"Toxoplasma gondii ma być u ok. 30% ludzi. U myszy sprawia, że lubią zapach kociego moczu i idą prosto do kota. U ludzi według autora zwiększa skłonność do ryzyka i zmienia reakcje na strach; tworzy cysty w mózgu, a w rejonach z większym zarażeniem jest więcej wypadków. Źródłem są koty."},{"t":"7. Paraliż senny","d":"We śnie mózg wyłącza mięśnie, żeby nie odgrywać snów; czasem umysł budzi się wcześniej niż ciało. Człowiek jest przytomny, ale nie może się ruszyć ani krzyczeć. Częste są ciemne postacie w pokoju, ucisk na klatce piersiowej i uczucie dłoni na gardle; strach według autora przedłuża paraliż."},{"t":"6. Kichanie od światła","d":"U części ludzi jasne światło wywołuje kichanie, bo sygnał z oczu \"przeskakuje\" na nerwy nosa. Kichnięcia przychodzą seriami po 2-3, wywołuje je słońce, flesz, ekran albo odblask śniegu. Autor podaje przykład pilota i kierowcy oraz to, że cecha jest dziedziczna: 50% szans, jeśli ma ją jeden z rodziców."},{"t":"5. Drugi mózg w jelitach","d":"Wokół jelit jest sieć neuronów, według autora większa niż cały mózg kota, która steruje trawieniem bez udziału głowy. \"Motyle w brzuchu\" to rozmowa dwóch mózgów. Biliony bakterii jelitowych mają produkować substancje wpływające na nastrój, a w jelitach powstaje 90% serotoniny."},{"t":"4. Mózg zjada sam siebie","d":"Autofagia to rozkładanie i trawienie własnych, starych lub uszkodzonych części komórki. Gdy pomijasz posiłki, neurony głodu według autora \"zjadają się\" mocniej i wzmacniają sygnał głodu. Autor dodaje, że zatrzymanie autofagii szkodzi."},{"t":"3. Zespół Capgrasa","d":"Mózg rozpoznaje wygląd osoby i osobno uczucia wobec niej. Gdy te części przestają się komunikować, twarz mamy jest rozpoznana, ale ciepło znika i pojawia się pewność, że to oszust. Każda drobna zmiana, np. fryzura, staje się \"dowodem\". Wywołać to może uraz mózgu, udar lub niektóre leki."},{"t":"2. Jamais vu","d":"Znane rzeczy nagle wydają się obce: własna twarz w lustrze, sypialnia, przyjaciel. Autor radzi napisać jedno słowo ok. 30 razy, aż litery zamienią się w dziwne kształty. Zdarza się to muzykom w trakcie grania utworu, który znają od lat."},{"t":"1. Roztocza w rzęsach","d":"Prawie każdy dorosły ma w mieszkach rzęs roztocza, które jedzą martwy naskórek i łój. W dzień siedzą w mieszkach, w nocy wychodzą na twarz i się rozmnażają, a samice składają jaja w mieszkach. Odchody gromadzą do śmierci i uwalniają naraz. Około 60. roku życia mają je prawie wszystkie mieszki."}],"conclusion":"Ciało i mózg robią mnóstwo dziwnych rzeczy bez naszej wiedzy, a wiele z nich to ślady dawnej ewolucji.","factchecks":[{"claim":"Drgnięcia przy zasypianiu ma ok. 70% ludzi; to pozostałość po spaniu na drzewach.","verdict":"półprawda","note":"Częstość 60-70% jest podawana w literaturze, ale wyjaśnienie z drzewami to tylko hipoteza.","src":[["Wikipedia (ang.): drgawki hipnagogiczne - hasło \"Hypnic jerk\"","https://en.wikipedia.org/wiki/Hypnic_jerk"]],"p":0},{"claim":"Fantomowe wibracje zgłasza do 90% użytkowników.","verdict":"prawda","note":"W badaniu Drouin i in. (2012) 89% studentów zgłosiło fantomowe wibracje. Inne badania dają niższe wartości, więc \"do 90%\" to górna granica.","src":[["Drouin i in. 2012 (DOI)","https://doi.org/10.1016/j.chb.2012.03.013"],["Wikipedia (ang.): syndrom fantomowych wibracji - hasło \"Phantom vibration syndrome\"","https://en.wikipedia.org/wiki/Phantom_vibration_syndrome"]],"p":1},{"claim":"Toxoplasma jest u ok. 30% ludzi i zmienia osobowość oraz zwiększa ryzyko wypadków.","verdict":"przesada","note":"Zarażenie ok. 30% ludzi i efekt u myszy są potwierdzone; u ludzi są tylko korelacje, film podaje je jak pewnik.","src":[["Wikipedia (ang.): toksoplazmoza - hasło \"Toxoplasmosis\"","https://en.wikipedia.org/wiki/Toxoplasmosis"],["CDC: toksoplazmoza","https://www.cdc.gov/toxoplasmosis/about/index.html"]],"p":2},{"claim":"Paraliż senny: świadomość przy zablokowanych mięśniach REM, halucynacje postaci, ucisk w klatce.","verdict":"prawda","note":"Opis kliniczny się zgadza; doświadcza go ok. 8% ludzi przynajmniej raz, nie \"co noc\".","src":[["Wikipedia (ang.): paraliż senny - hasło \"Sleep paralysis\"","https://en.wikipedia.org/wiki/Sleep_paralysis"],["Sharpless i Barber 2011 (PubMed)","https://pubmed.ncbi.nlm.nih.gov/21571556/"]],"p":3},{"claim":"Kichanie od światła jest dziedziczne.","verdict":"prawda","note":"Dotyczy ok. 18-35% ludzi i jest dziedziczny; mechanizm nerwowy to wiodąca hipoteza.","src":[["Wikipedia (ang.): odruch kichania na światło - hasło \"Photic sneeze reflex\"","https://en.wikipedia.org/wiki/Photic_sneeze_reflex"]],"p":4},{"claim":"W jelitach jest ok. 500 mln neuronów, więcej niż w mózgu kota.","verdict":"półprawda","note":"Szacunki to 100-600 mln neuronów; cały mózg kota ma ich więcej, więc porównanie jest mylące.","src":[["Stanford: drugi mózg w jelitach","https://neuroscience.stanford.edu/news/your-gut-second-brain"],["Liczba neuronów w jelitowym układzie nerwowym (PubMed)","https://pubmed.ncbi.nlm.nih.gov/35929768/"]],"p":5},{"claim":"Jelita produkują 90% serotoniny, co steruje nastrojem.","verdict":"przesada","note":"Ok. 90% serotoniny powstaje w jelitach, ale nie trafia do mózgu; \"sterowanie nastrojem\" to uproszczenie.","src":[["Wikipedia (ang.): serotonina - hasło \"Serotonin\"","https://en.wikipedia.org/wiki/Serotonin"],["Caltech: bakterie a serotonina jelit","https://www.caltech.edu/about/news/microbes-help-produce-serotonin-gut-46495"]],"p":5},{"claim":"Autofagia w neuronach głodu wzmacnia uczucie głodu.","verdict":"prawda","note":"Autofagia w neuronach reguluje głód (badanie na myszach, 2011); \"mózg zjada sam siebie\" to dramatyzacja.","src":[["Kaushik i in. 2011 (PubMed)","https://pubmed.ncbi.nlm.nih.gov/21803288/"],["Wikipedia (ang.): autofagia - hasło \"Autophagy\"","https://en.wikipedia.org/wiki/Autophagy"]],"p":6},{"claim":"Zespół Capgrasa i jamais vu (wywoływane wielokrotnym pisaniem słowa).","verdict":"prawda","note":"Capgras to opisane urojenie, a jamais vu wywoływano przepisywaniem słowa (Moulin, Ig Nobel 2023).","src":[["Wikipedia (ang.): zespół Capgrasa - hasło \"Capgras delusion\"","https://en.wikipedia.org/wiki/Capgras_delusion"],["Wikipedia (ang.): jamais vu","https://en.wikipedia.org/wiki/Jamais_vu"]],"p":[7,8]},{"claim":"Nużeńce nie mają odbytu i uwalniają odchody po śmierci.","verdict":"fałsz","note":"Badanie genomu z 2022 r. wykazało, że nużeńce mają odbyt; reszta opisu się zgadza.","src":[["University of Reading: sekretne życie roztoczy","https://www.reading.ac.uk/news/2022/Research-News/Secret-lives-of-skin-mites-in-our-faces"],["Smith i in. 2022, Molecular Biology and Evolution","https://doi.org/10.1093/molbev/msac125"]],"p":9}],"bias":"Sensacyjny język (\"mózg zjada sam siebie\"); korelacje podane jak pewniki, a mit o nużeńcach jest już obalony.","channel":"Chill Dude Explains"},{"id":"2sWFexuc7MI","title_pl":"Miejsca na Ziemi, gdzie nie stanął żaden człowiek","title":"Places on Earth No Human Has Ever Visited","url":"https://www.youtube.com/watch?v=2sWFexuc7MI","date":"2024-12-26","duration":600,"views":1223643,"transcript":"whisper","added":"2026-11-03","tags":["Natura","Geografia"],"about":"Ranking 10 miejsc na Ziemi, których według autora nigdy nie odwiedził żaden człowiek lub które są prawie niezbadane.","intro":"Ranking 10 miejsc na Ziemi, do których według autora człowiek nigdy nie dotarł albo dotarł tylko na brzegi. Są wśród nich góry (Gangkhar Puensum, Góry Gwiezdne), jaskinie (Kryształów, cenoty Jukatanu), głębia oceanu, pustynie Namib i Takla Makan, lód północnej Grenlandii oraz wyspa, która okazała się nie istnieć. Przy każdym miejscu autor tłumaczy, co utrudnia dotarcie.","points":[{"t":"10. Gangkhar Puensum (Bhutan)","d":"Najwyższa niezdobyta góra świata w Bhutanie, ok. 7560 m (24 800 stóp). Od 1994 r. Bhutan zakazuje wspinaczki, bo góry uważa się za siedziby duchów. Wcześniej wyprawy z lat 80. według autora nie mogły nawet znaleźć góry przez złe mapy, a szczytu nie ma na wyraźnych zdjęciach."},{"t":"9. Jaskinia Kryształów (Meksyk)","d":"Jaskinia pod Meksykiem z kryształami wielkości autobusów szkolnych. W środku ok. 58°C i prawie 100% wilgotności, a powietrze zawiera siarkowodór. Naukowcy wchodzą na ok. 10 minut w kombinezonach chłodzących. Kryształy rosły setki tysięcy lat, a w środku znaleziono uśpione od tysięcy lat mikroby."},{"t":"8. Podwodne jaskinie Jukatanu","d":"Tysiące połączonych podwodnych jaskiń (cenotów) pod Meksykiem, w większości niezbadanych: są ciemne, ciasne, ciągną się kilometrami i leżą w odległej dżungli. Majowie uważali je za bramy do zaświatów; znaleziono w nich
