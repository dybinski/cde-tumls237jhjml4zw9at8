iczne Południowego Tyrolu: Ötzi","https://www.iceman.it/en/the-iceman/"]]},{"claim":"Grot strzały w barku odkryto dopiero w 2001 r.","verdict":"prawda","note":"Zdjęcia rentgenowskie z 2001 r. ujawniły grot, który uszkodził tętnicę podobojczykową.","p":[8,10],"src":[["Wikipedia (ang.): Ötzi - hasło \"Ötzi\"","https://en.wikipedia.org/wiki/%C3%96tzi"]]}],"bias":"Rzetelny i lekki w tonie; ostrożnie zaznacza, co jest hipotezą. Część czasu zajmuje reklama sponsora."},{"id":"7bOQ7fLCqgI","title_pl":"9 części ciała, które kiedyś znikną","title":"9 Body Parts That Will Disappear One Day","url":"https://www.youtube.com/watch?v=7bOQ7fLCqgI","date":"2024-04-27","duration":528,"views":1188491,"transcript":"youtube","added":"2026-11-03","tags":["Ciało i zdrowie","Ewolucja"],"about":"9 szczątkowych części ciała, które według autora mogą kiedyś zniknąć w wyniku ewolucji.","intro":"Ranking 9 części ciała, które według autora ewolucja powoli \"wygasza\", bo przestały być potrzebne. Są tu wyrostek robaczkowy, palce u stóp, narząd Jacobsona, mięśnie od gęsiej skórki, kość ogonowa, mięsień dłoniowy długi, zęby mądrości, mięśnie uszu i zatoki. Autor przy każdej tłumaczy, do czego służyła przodkom i dlaczego dziś ma znikać.","points":[{"t":"9. Wyrostek robaczkowy","d":"Mógł pomagać przodkom trawić twarde rośliny, a przy dzisiejszej diecie według autora nic nie robi. Gdy się zapali, lekarze go usuwają i da się normalnie żyć. Autor twierdzi, że w niektórych populacjach nawet 1 na 5 osób rodzi się bez wyrostka."},{"t":"8. Palce u stóp","d":"Przodkowie potrzebowali chwytnych palców do wspinaczki. Dziś większość pracy przy chodzeniu i bieganiu robi duży palec, a buty sprawiają, że małe palce \"leniwieją\". Naukowcy mają przewidywać, że w bardzo dalekiej przyszłości palce się skrócą, ale nie za naszego życia."},{"t":"7. Narząd Jacobsona","d":"Narząd w nosie do wykrywania feromonów, u ludzi według autora praktycznie nieczynny, jak gadżet z wyczerpaną baterią. Przodkom mógł sygnalizować płodność albo złość, ale zaczęliśmy polegać na wzroku i słuchu. Część ludzi rodzi się bez niego i nie ma z tym problemu."},{"t":"6. Mięśnie przywłosowe","d":"To one robią gęsią skórkę. U owłosionych przodków stroszyły futro, żeby wyglądać groźniej, np. przed tygrysem szablozębnym. Według autora słabną i stają się rzadsze, więc kiedyś gęsia skórka może być ciekawostką z podręcznika."},{"t":"5. Kość ogonowa","d":"Pozostałość ogona przodków, którzy używali go do równowagi i komunikacji. Nie jest całkiem bezużyteczna, bo przyczepiają się do niej mięśnie i więzadła. Bardzo rzadko dzieci rodzą się z małym ogonkiem bez kości (tylko tkanka i naczynia), który zwykle usuwa się po porodzie."},{"t":"4. Mięsień dłoniowy długi","d":"Pomaga zginać nadgarstek, ale tę pracę i tak wykonują inne mięśnie, a według autora nie ma go ok. 14% ludzi. Przodkom mógł się przydawać przy przeskakiwaniu z drzewa na drzewo. Chirurdzy pobierają jego ścięgno do przeszczepów bez szkody dla ręki."},{"t":"3. Zęby mądrości","d":"Wyrastają w wieku ok. 17-25 lat, gdy w szczęce nie ma już miejsca, więc przesuwają inne zęby. Przodkowie potrzebowali zapasowych zębów do surowego jedzenia i szybko tracili zęby. Gotujemy i kroimy jedzenie, szczęki się zmniejszyły, a coraz więcej ludzi rodzi się bez ósemek."},{"t":"2. Mięśnie uszu","d":"Dzięki nim niektórzy ruszają uszami, ale większość nie umie ich używać. Przodkom mogły pomagać namierzać dźwięki, potem zaczęliśmy polegać na wzroku. Autor wspomina rekord: mężczyzna z Indii poruszył uszami 99 razy w 30 sekund."},{"t":"1. Zatoki","d":"Nie wiadomo do końca, po co są: hipotezy to nawilżanie powietrza, odciążenie czaszki i śluz łapiący zarazki. Według autora część badaczy uważa, że powoli zanikają, a jedno badanie wiązało mniejsze zatoki z rzadszymi infekcjami. Ewentualne zniknięcie trwałoby tysiące lat."}],"conclusion":"Ciało nosi ślady ewolucji, a niektóre z tych części mogą zniknąć, ale zajmie to tysiące lat.","factchecks":[{"claim":"Wyrostek robaczkowy jest bezużyteczny.","verdict":"półprawda","note":"Nowsze badania wskazują na rolę odpornościową wyrostka, co przeczy prostej tezie o szczątkowości.","src":[["Wikipedia (ang.): wyrostek robaczkowy - hasło \"Appendix (anatomy)\"","https://en.wikipedia.org/wiki/Appendix_(anatomy)"],["Smith i in. 2023, Anat Rec: przegląd funkcji i ewolucji wyrostka (PubMed)","https://pubmed.ncbi.nlm.nih.gov/35363436/"],["Smith i in. 2009, J Evol Biol (PubMed)","https://pubmed.ncbi.nlm.nih.gov/19678866/"]],"p":0},{"claim":"Coraz więcej ludzi rodzi się bez wyrostka (nawet 1 na 5).","verdict":"fałsz","note":"Wrodzony brak wyrostka to skrajna rzadkość, szacowana na ok. 1 na 100 000 operacji brzucha.","src":[["Opis przypadku agenezji wyrostka (PMC)","https://pmc.ncbi.nlm.nih.gov/articles/PMC8043782/"]],"p":0},{"claim":"Część ludzi nie ma mięśnia dłoniowego długiego.","verdict":"prawda","note":"Brak występuje u ok. 10-15% ludzi, z dużymi różnicami między populacjami.","src":[["Wikipedia (ang.): mięsień dłoniowy długi - hasło \"Palmaris longus\"","https://en.wikipedia.org/wiki/Palmaris_longus_muscle"]],"p":5},{"claim":"U części ludzi zęby mądrości się nie rozwijają.","verdict":"prawda","note":"Metaanaliza Cartera i Worthingtona (2015) daje ok. 22% osób z brakiem co najmniej jednego zęba mądrości.","src":[["Carter i Worthington 2015, J Dent Res (DOI)","https://doi.org/10.1177/0022034515581644"],["Wikipedia (ang.): zęby mądrości - hasło \"Wisdom tooth\"","https://en.wikipedia.org/wiki/Wisdom_tooth"]],"p":6},{"claim":"Narząd Jacobsona, kość ogonowa, mięśnie przywłosowe i uszne to struktury szczątkowe.","verdict":"prawda","note":"Standardowe przykłady w biologii. Narząd lemieszowo-nosowy u dorosłych ludzi nie ma działających połączeń nerwowych.","src":[["Wikipedia (ang.): narządy szczątkowe u człowieka - hasło \"Human vestigiality\"","https://en.wikipedia.org/wiki/Human_vestigiality"],["Wikipedia (ang.): narząd lemieszowo-nosowy (Jacobsona) - hasło \"Vomeronasal organ\"","https://en.wikipedia.org/wiki/Vomeronasal_organ"]],"p":null},{"claim":"Te części ciała \"znikną kiedyś\".","verdict":"nie da się sprawdzić","note":"Ewolucja nie usuwa zbędnych części sama; potrzebna jest presja selekcyjna, więc to spekulacja.","src":[["Wikipedia (ang.): szczątkowość narządów - hasło \"Vestigiality\"","https://en.wikipedia.org/wiki/Vestigiality"]],"p":null}],"bias":"Uproszczona wizja ewolucji jako \"usuwania zbędnych części\". Jedna liczba (brak wyrostka) jest wyssana z palca, a wyrostek opisany według przestarzałej wiedzy.","channel":"Chill Dude Explains","section":"Chill Dude Explains"},{"id":"UTz2Xg4oMxs","title_pl":"9 najbardziej bolesnych rzeczy, jakich można doświadczyć","title":"9 MOST PAINFUL Things You Can EVER Experience!","url":"https://www.youtube.com/watch?v=UTz2Xg4oMxs","date":"2024-04-07","duration":548,"views":1114282,"transcript":"youtube","added":"2026-11-03","tags":["Ciało i zdrowie","Natura"],"about":"Ranking 9 najbardziej bolesnych doświadczeń, od kamieni nerkowych po użądlenie mrówki-pocisku.","intro":"Ranking 9 najboleśniejszych doświadczeń, jakie może przeżyć człowiek. Autor zaczyna od kamienia nerkowego i chorób (tężec, klasterowe bóle głowy, fibromialgia), a potem przechodzi do zwierząt i roślin: meduzy Irukandji, ryby kamień, rośliny gympie-gympie, osy \"kat\" i mrówki-pocisku. Opisy są obrazowe i żartobliwe, bez podanych źródeł.","points":[{"t":"9. Kamień nerkowy","d":"Zaczyna się od ostrego bólu w plecach, który przesuwa się, gdy kamień wędruje z nerki do pęcherza. Ból narasta jak dźganie nożem od środka, a jedyne wyjście to czekać, aż kamień przejdzie. Niektórzy porównują to do porodu."},{"t":"8. Meduza Irukandji","d":"Meduza mieści się na paznokciu. 20-30 minut po ukłuciu pojawia się ból pleców i brzucha, skurcze mięśni i poczucie nadchodzącej śmierci, przez które poparzeni według autora błagają lekarzy, żeby ich zabili. Autor twierdzi, że spotyka się je od Hawajów po Florydę."},{"t":"7. Tężec","d":"Bakteryjne zakażenie układu nerwowego zaczyna się od skaleczenia, np. zardzewiałym narzędziem albo gwoździem. Po kilku dniach mięśnie sztywnieją, najpierw szczęka (stąd \"szczękościsk\"), potem szyja, ręce i nogi, a skurcze są bardzo bolesne. Autor zaleca aktualne szczepienie."},{"t":"6. Klasterowe bóle głowy","d":"Ból opisywany jak rozgrzany pręt wbijany w oko albo piła w czaszce, według autora ok. 100 razy gorszy od zwykłego bólu głowy. Ataki przychodzą codziennie przez tygodnie lub miesiące, potem znikają i wracają. W trakcie ludzie chodzą w kółko, uderzają głową o ścianę albo krzyczą."},{"t":"5. Ryba kamień (skorpena)","d":"Ryba kamień ukrywa się wśród skał i koralowców tak dobrze, że można na nią patrzeć i jej nie zauważyć. Nadepnięcie wstrzykuje jad, a ból opisywany jest jak jednoczesne miażdżenie, palenie i porażenie prądem. Niektórzy według autora prosili lekarzy o amputację nogi."},{"t":"4. Fibromialgia","d":"Przewlekła choroba z bólem w całym ciele, zmęczeniem mimo snu, nadwrażliwością na dotyk i mgłą mózgową; chorzy opisują ją jak oparzenie słoneczne całego ciała. Jest niewidoczna, więc chorych bierze się za przewrażliwionych. Według autora nie ma lekarstwa."},{"t":"3. Gympie-gympie","d":"Australijska roślina pokryta pustymi włoskami z silną neurotoksyną; przy otarciu włoski się łamią i wstrzykują ją w skórę. Ból jak użądlenie przez rój os trwa dni, tygodnie albo miesiące, a niektórzy czuli go nawet do 2 lat."},{"t":"2. Osa \"Kat\" (executioner wasp)","d":"Osa z Ameryki Środkowej i Południowej, według autora wielkości małego ptaka, do ok. 5 cm. Jej jad z neurotoksyną daje natychmiastowy ból na godziny, porównywany do uderzenia pociągu, potem gorączkę, poty, nudności i wymioty. To parazytoid: paraliżuje owady i składa w nich jaja."},{"t":"1. Mrówka-pocisk","d":"Nazwa od tego, że użądlenie ma przypominać postrzał; jad bywa nazywany najboleśniejszym na świecie, jak wyrywanie kości przez skórę, a ból trwa do 24 h. W plemieniu w Brazylii młodzi mężczyźni noszą rękawice pełne mrówek przez 10 minut, 20 razy w ciągu kilku miesięcy."}],"conclusion":"Natura i własne ciało potrafią zadać ból wykraczający poza wyobrażenie, a najgorsze w rankingu są użądlenia owadów.","factchecks":[{"claim":"Osa Polistes carnifex ma jad z poneratoksyną, jest wielkości małego ptaka i składa jaja w innych owadach.","verdict":"fałsz","note":"Poneratoksyna to toksyna mrówki-pocisku; ta osa ma do ok. 3,3 cm i nie pasożytuje.","src":[["Wikipedia (ang.): osa Polistes carnifex - hasło \"Polistes carnifex\"","https://en.wikipedia.org/wiki/Polistes_carnifex"],["Wikipedia (ang.): poneratoksyna - hasło \"Poneratoxin\"","https://en.wikipedia.org/wiki/Poneratoxin"]],"p":7},{"claim":"Mrówka-pocisk: ból do 24 h; rytuał rękawic 10 minut, 20 razy.","verdict":"prawda","note":"Najwyższa ocena (4+) w skali bólu Schmidta, ból do 24 h. Rytuał ludu Sateré-Mawé jest dobrze opisany.","src":[["Wikipedia (ang.): mrówka-pocisk - hasło \"Paraponera clavata\"","https://en.wikipedia.org/wiki/Paraponera_clavata"],["Wikipedia (ang.): skala bólu użądleń Schmidta - hasło \"Schmidt sting pain index\"","https://en.wikipedia.org/wiki/Schmidt_sting_pain_index"]],"p":8},{"claim":"Meduza Irukandji występuje od Hawajów po Florydę.","verdict":"półprawda","note":"Carukia barnesi żyje w Australii; na Hawajach i Florydzie podobny syndrom dają inne gatunki.","src":[["Wikipedia (ang.): zespół Irukandji - hasło \"Irukandji syndrome\"","https://en.wikipedia.org/wiki/Irukandji_syndrome"],["Wikipedia (ang.): meduza Carukia barnesi - hasło \"Carukia barnesi\"","https://en.wikipedia.org/wiki/Carukia_barnesi"]],"p":1},{"claim":"Gympie-gympie: ból może trwać miesiące.","verdict":"prawda","note":"Opisy przypadków i badanie toksyn (gympietydy, Science Advances 2020) potwierdzają długotrwały ból, ale relacje o latach są anegdotyczne.","src":[["Wikipedia (ang.): gympie-gympie (Dendrocnide moroides) - hasło \"Dendrocnide moroides\"","https://en.wikipedia.org/wiki/Dendrocnide_moroides"],["Gilding i in. 2020, Science Advances (DOI)","https://doi.org/10.1126/sciadv.abb8828"]],"p":6},{"claim":"Ryba kamień to najbardziej jadowita ryba świata.","verdict":"prawda","note":"Tak się ją powszechnie określa; istnieje antytoksyna, a zgony są rzadkie.","src":[["Wikipedia (ang.): ryby kamienne (Synanceia) - hasło \"Stonefish\"","https://en.wikipedia.org/wiki/Stonefish"]],"p":4},{"claim":"Kamienie nerkowe, klasterowe bóle głowy, tężec, fibromialgia bez lekarstwa.","verdict":"prawda","note":"Opisy zgodne z wiedzą medyczną. Fibromialgii nie da się wyleczyć, ale objawy łagodzi leczenie i ruch.","src":[["Wikipedia (ang.): klasterowy ból głowy - hasło \"Cluster headache\"","https://en.wikipedia.org/wiki/Cluster_headache"],["Wikipedia (ang.): fibromialgia - hasło \"Fibromyalgia\"","https://en.wikipedia.org/wiki/Fibromyalgia"],["WHO: tężec","https://www.who.int/news-room/fact-sheets/detail/tetanus"]],"p":null}],"bias":"Ranking subiektywny (bólu nie da się obiektywnie porównać). Punkt o osie-katu jest w dużej mierze zmyślony; reszta zgodna z faktami.","channel":"Chill Dude Explains","section":"Chill Dude Explains"},{"id":"ziYuxvxAw3U","title_pl":"9 najstarszych technologii, których naukowcy wciąż nie potrafią wyjaśnić","title":"9 Oldest Technologies Scientists Still Can’t Explain","url":"https://www.youtube.com/watch?v=ziYuxvxAw3U","date":"2024-03-10","duration":561,"views":1051283,"transcript":"youtube","added":"2026-11-03","tags":["Historia","Technika"],"about":"9 starożytnych technologii, których według autora naukowcy wciąż nie potrafią wyjaśnić ani odtworzyć.","intro":"Ranking 9 dawnych wynalazków i budowli, których według autora wciąż nie umiemy wyjaśnić ani odtworzyć. Są wśród nich rzymski puchar zmieniający kolor, elastyczne szkło i ogień grecki, skrzypce Stradivariego, mechanizm z Antykithiry, stal damasceńska, kamienne kule z Kostaryki, mury Sacsayhuamán w Peru i piramidy w Gizie. Autor często przedstawia legendy i domysły jako pewną historię.","points":[{"t":"9. Puchar Likurga","d":"Rzymski puchar z IV w.: pod światło świeci na czerwono, oglądany z przodu jest zielony. Rzymianie dodali do szkła niewidoczne cząstki złota i srebra, które zmieniają kolor zależnie od kierunku światła. Naukowcy według autora sądzą, że wyszło to przypadkiem, a odtworzyć to umiemy dopiero od niedawna."},{"t":"8. Rzymskie elastyczne szkło","d":"Legenda: wynalazca pokazał cesarzowi Tyberiuszowi miskę ze szkła, która po upuszczeniu tylko się wgniotła, a wgniecenie wyklepał młotkiem. Cesarz bał się spadku wartości złota i srebra, więc kazał go zabić. Autor przyznaje, że nie wiadomo, czy to prawda, a sekret zaginął z wynalazcą."},{"t":"7. Ogień grecki","d":"Mieszanina, która paliła się nawet na wodzie, a polewanie wodą miało ją wzmagać. Według autora używali jej Rzymianie: rzucali granaty z ogniem i pryskali nim z rur na wrogie statki. Przepis był tajemnicą państwową; historycy zgadują żywicę sosnową, wapno palone i inne składniki."},{"t":"6. Skrzypce Stradivariego","d":"Rodzina Stradivarich we Włoszech robiła skrzypce w latach 1650-1750. Mimo badań nikt nie umie dokładnie wyjaśnić ich brzmienia ani go odtworzyć; rodzina używała specjalnego drewna i tajnego przepisu. Kosztują miliony dolarów, kupuje się je jako inwestycję, a część skradziono i zaginęła."},{"t":"5. Mechanizm z Antykithiry","d":"Ok. 100 lat temu nurkowie znaleźli przy greckiej wyspie Antykithira wrak z bryłą brązu i drewna, według autora pierwszym analogowym komputerem. Przewidywał zaćmienia, prowadził kalendarz i wskazywał termin igrzysk. Coś równie złożonego pojawia się dopiero ok. 1200 lat później."},{"t":"4. Stal damasceńska","d":"Krzyżowcy spotkali u wojowników islamskich miecze, które przecinały pływającą chustkę, wyginały się pod dużym kątem i wracały bez szkody, z wzorem jak płynąca woda. Według autora sekret zaginął; naukowcy podejrzewają dodatek roślin do żelaza. Stal sprzedawano w Damaszku, ale pochodziła z Indii i Iranu."},{"t":"3. Kamienne kule z Kostaryki","d":"Ponad 300 kamiennych kul, niektóre do 15 ton i ponad 2 m średnicy, zrobiła nieistniejąca już kultura Diquís, obijając je kamieniami i polerując piaskiem. Cel nieznany: drogowskazy do domu wodza albo astronomia. W latach 30. XX w. przy karczowaniu pod banany część rozbito, szukając złota."},{"t":"2. Sacsayhuamán (Peru)","d":"Inkaska twierdza chroniąca Cusco, z polerowanych bloków po 100-120 ton dopasowanych tak, że nie wejdzie między nie kartka papieru. Autor odrzuca teorie o ogromnej soczewce i topieniu kamienia ogniskiem. Twierdza przetrwała trzęsienia ziemi, ale Hiszpanie rozbierali ją na materiał do budowy Cusco."},{"t":"1. Piramidy w Gizie","d":"Wielka Piramida to ok. 2,3 mln bloków, od kilku ton do wagi małego domu, a Egipcjanie nie mieli dźwigów ani taczek. Teorie: proste albo zygzakowate rampy, spławianie kamieni Nilem, a nawet zaginione maszyny. Najczęściej wraca wersja z miedzianymi narzędziami, wodą i armią robotników pracujących latami."}],"conclusion":"Dawne cywilizacje miały zaskakującą wiedzę, a część ich technik pozostaje dla nas zagadką.","factchecks":[{"claim":"Puchar Likurga zmienia kolor dzięki nanocząstkom.","verdict":"prawda","note":"Złoto i srebro w nanocząstkach potwierdziło British Museum; efekt jest wyjaśniony.","src":[["British Museum: Puchar Likurga","https://www.britishmuseum.org/collection/object/H_1958-1202-1"],["Wikipedia (ang.): Puchar Likurga - hasło \"Lycurgus Cup\"","https://en.wikipedia.org/wiki/Lycurgus_Cup"]],"p":0},{"claim":"Elastyczne szkło rzymskie.","verdict":"nie da się sprawdzić","note":"Historia pochodzi tylko z anegdot Pliniusza Starszego i Petroniusza; nie ma żadnego artefaktu. Film zaznacza, że to legenda.","src":[["Wikipedia (ang.): szkło elastyczne (vitrum flexile) - hasło \"Flexible glass\"","https://en.wikipedia.org/wiki/Flexible_glass"]],"p":1},{"claim":"Ogień grecki wynaleźli Rzymianie, a jego przepis zaginął.","verdict":"półprawda","note":"Używało go Bizancjum od ok. 672 r.; skład faktycznie nie jest znany.","src":[["Wikipedia (ang.): ogień grecki - hasło \"Greek fire\"","https://en.wikipedia.org/wiki/Greek_fire"]],"p":2},{"claim":"Skrzypiec Stradivariego nie da się odtworzyć i brzmią wyjątkowo.","verdict":"przesada","note":"W ślepych testach (PNAS 2012, 2014) soliści nie odróżniali Stradivariusów od nowych skrzypiec.","src":[["Fritz i in. 2014, PNAS (DOI)","https://doi.org/10.1073/pnas.1323367111"],["Wikipedia (ang.): instrumenty Stradivariego - hasło \"Stradivarius\"","https://en.wikipedia.org/wiki/Stradivarius"]],"p":3},{"claim":"Mechanizm z Antykithiry: znaleziony ok. 100 lat temu, przewidywał zaćmienia, niezrównany przez wieki.","verdict":"prawda","note":"Działanie mechanizmu jest dziś dobrze zrekonstruowane.","src":[["Wikipedia (ang.): mechanizm z Antykithiry - hasło \"Antikythera mechanism\"","https://en.wikipedia.org/wiki/Antikythera_mechanism"],["Freeth i in. 2021, Scientific Reports","https://www.nature.com/articles/s41598-021-84310-w"]],"p":4},{"claim":"Stal damasceńska to zaginiony sekret.","verdict":"przesada","note":"Wzory stali wootz odtworzono w latach 90., a nanorurki znaleziono w jednym ostrzu.","src":[["Wikipedia (ang.): stal damasceńska - hasło \"Damascus steel\"","https://en.wikipedia.org/wiki/Damascus_steel"],["Reibold i in. 2006, Nature","https://www.nature.com/articles/444286a"]],"p":5},{"claim":"Kule z Kostaryki: ponad 300, do kilkunastu ton, cel nieznany.","verdict":"prawda","note":"Kule kultury Diquís obrabiano kamieniem i ścieraniem; cel jest niepewny, ale nie \"niewytłumaczalny\".","src":[["Wikipedia (ang.): kamienne kule z Kostaryki - hasło \"Stone spheres of Costa Rica\"","https://en.wikipedia.org/wiki/Stone_spheres_of_Costa_Rica"],["UNESCO: osady wodzów Diquís z kamiennymi kulami","https://whc.unesco.org/en/list/1453/"]],"p":6},{"claim":"Bloki Sacsayhuamán ważą po 100-120 ton.","verdict":"przesada","note":"Największy blok szacuje się na ok. 120-130 t, ale większość jest znacznie mniejsza. Precyzyjne dopasowanie jest prawdą.","src":[["Wikipedia (ang.): Sacsayhuamán","https://en.wikipedia.org/wiki/Sacsayhuam%C3%A1n"]],"p":7},{"claim":"Nie wiadomo, jak zbudowano piramidy.","verdict":"przesada","note":"Papirusy z Wadi al-Dżarf, ślady ramp i osady robotników wyjaśniają budowę; \"megamaszyny\" to spekulacja.","src":[["Wikipedia (ang.): Dziennik Merera - hasło \"Diary of Merer\"","https://en.wikipedia.org/wiki/Diary_of_Merer"],["Fall i in. 2014, PRL (DOI)","https://doi.org/10.1103/PhysRevLett.112.175502"]],"p":8}],"bias":"Tendencyjny tytuł: większość pozycji naukowcy dobrze rozumieją, a film sugeruje nawet zaginione maszyny.","channel":"Chill Dude Explains","section":"Chill Dude Explains"},{"id":"FAdmpAZTH_M","title_pl":"Matematyczny błąd, który wyjdzie na jaw za 1200 lat","title":"The 1,200 Year Maths Mistake","channel":"Stand-up Maths","url":"https://www.youtube.com/watch?v=FAdmpAZTH_M","date":"2024-02-22","duration":1150,"views":3404042,"section":"Ciekawostki","transcript":"youtube","added":"2026-11-03","tags":["Matematyka","Kultura"],"about":"Matt Parker jedzie do Wemding, gdzie od 1993 r. powstaje Piramida Czasu, i znajduje w planie klasyczny błąd o jeden.","intro":"W bawarskim Wemding co 10 lat dokłada się jeden betonowy blok do piramidy, która ma powstawać 1200 lat. Matt Parker (Stand-up Maths) z Ayliean MacDonald ogląda wstawianie czwartego bloku w 2023 r., tłumaczy błąd \"płotu i słupków\", który sprawi, że ostatni blok trafi na miejsce 10 lat za wcześnie, i wymyśla żartobliwe poprawki.","points":[{"t":"Piramida Czasu","d":"Zeitpyramide artysty Manfreda Labera uczciła 1200-lecie Wemding, pierwszy raz wzmiankowanego w 793 r. Skoro ludzkie życie jest za krótkie, by poczuć 1200 lat, dzieło ma powstawać właśnie tyle."},{"t":"120 bloków","d":"Piramida ma warstwy 8 x 8, 6 x 6, 4 x 4 i 2 x 2, czyli 64 + 36 + 16 + 4 = 120 bloków, ustawionych dokładnie jeden na drugim. Pierwszy wstawiono w 1993 r., kolejne w 2003, 2013 i 2023 r."},{"t":"Czas na ludzką skalę","d":"Parker miał 12 lat przy pierwszym bloku i 42 przy czwartym. Pojedyncze bloki mierzy się życiem człowieka, a całość pokazuje skalę, której nie da się ogarnąć."},{"t":"Błąd płotu i słupków","d":"Płot z 4 przęseł ma 5 słupków. W programowaniu to klasyczny błąd o jeden: od 8:00 do 12:00 są 4 godziny, ale od 8. do 12. piętra jest 5 pięter."},{"t":"10 lat za wcześnie","d":"Wstawiając 120 bloków co 10 lat od 1993 r., ostatni trafi na miejsce w 3183 r., a nie w 3193 r., na 2400-lecie miasta. Do tej daty trzeba by 121 bloków."},{"t":"Wstawianie bloku","d":"Dźwig opuścił 6,5 t betonu na zaprawę w drewnianym szablonie, przy klarnecie grającym utwory o czasie i przemowach lokalnych władz. Córka artysty i twórca aplikacji AR nie przejmowali się błędem: ostatnią dekadę można świętować."},{"t":"Poprawki na 121","d":"Parker proponuje drugą, mniejszą piramidę z kwadratów liczb nieparzystych lub odwróconą na szczycie. Ayliean wymyśla spiralę z liczb trójkątnych: 2 x 55 + 11 = 121, a 21 liczb to też liczba trójkątna."},{"t":"Błąd jako część dzieła","d":"Ostatecznie Parker uważa, że błędu nie należy poprawiać, bo to plan jednego człowieka wykonywany przez dziesiątki pokoleń. Gdy minie pierwszy rząd, za ok. 40 lat, nikt nie zechce przerwać tradycji."},{"t":"Długie projekty się udają","d":"Świątynię Zeusa w Atenach zaczęli Grecy, porzucili ją na wieki, a dokończył cesarz Hadrian. Rzymski beton przetrwał ponad 1200 lat, więc materiał wytrzyma; zmienić się może co najwyżej technika."}],"conclusion":"Piramida Czasu skończy się 10 lat przed planowaną rocznicą, ale to błąd, który zostanie świętowany przez dekadę.","factchecks":[{"claim":"Zeitpyramide w Wemding to dzieło Manfreda Labera, w którym co 10 lat dokłada się blok od 1993 r.","verdict":"prawda","note":"Piramida ma 120 bloków i ma być ukończona w 3183 r.","p":[0,1],"src":[["Wikipedia (ang.): Piramida Czasu - hasło \"Zeitpyramide\"","https://en.wikipedia.org/wiki/Zeitpyramide"]]},{"claim":"Wemding wzmiankowano po raz pierwszy w 793 r.","verdict":"prawda","note":"Miasto wzmiankowano za Karola Wielkiego i świętowało 1200-lecie w 1993 r.","p":0,"src":[["Wikipedia (ang.): Piramida Czasu - hasło \"Zeitpyramide\"","https://en.wikipedia.org/wiki/Zeitpyramide"]]},{"claim":"120 bloków co 10 lat od 1993 r. daje ostatni blok w 3183 r., a nie 3193 r.","verdict":"prawda","note":"1993 + 119 x 10 = 3183; to klasyczny błąd płotu i słupków.","p":[3,4],"src":[["Wikipedia (ang.): błąd o jeden - hasło \"Off-by-one error\"","https://en.wikipedia.org/wiki/Off-by-one_error"]]},{"claim":"Świątynię Zeusa Olimpijskiego w Atenach ukończył cesarz Hadrian.","verdict":"prawda","note":"Budowę zaczęto w VI w. p.n.e., a ukończono w II w. n.e., ok. 638 lat później.","p":8,"src":[["Wikipedia (ang.): Olimpiejon - hasło \"Temple of Olympian Zeus, Athens\"","https://en.wikipedia.org/wiki/Temple_of_Olympian_Zeus,_Athens"]]}],"bias":"Lekki i rzetelny; rachunek łatwo sprawdzić. Druga połowa to żartobliwe pomysły i rozmowy."},{"id":"hmHhsg7h4g0","title_pl":"10 powodów, dla których w średniowieczu uznano by cię za czarownicę","title":"10 Reasons You'd Be Called a Witch in The Middle Ages","url":"https://www.youtube.com/watch?v=hmHhsg7h4g0","date":"2024-01-02","duration":544,"views":2194394,"transcript":"youtube","added":"2026-11-03","tags":["Historia","Mity"],"about":"Humorystyczna lista 10 zachowań i cech, za które w \"średniowieczu\" można było zostać oskarżonym o czary.","intro":"Żartobliwa lista 10 zachowań i cech, za które według autora w \"średniowieczu\" można było zostać oskarżonym o czary. Są wśród nich znamiona, lunatykowanie, gwizdanie, leworęczność i ziewanie, a także koty, kichnięcie kota, warzenie piwa, zbyt dobry ser i jajka z dwoma żółtkami. Autor opisuje to scenkami z wymyślonymi sąsiadami, a przy piwie tłumaczy, skąd wziął się obraz czarownicy z kotłem i miotłą.","points":[{"t":"Znamiona","d":"W XV w. znamiona nazywano znakiem diabła i wierzono, że są znieczulone magią. Łowcy czarownic kłuli je igłami, a brak bólu oznaczał winę; niektórzy używali chowanych igieł. Reakcję na ból też uznawano za udawanie."},{"t":"Lunatykowanie","d":"Ktoś, kto chodzi nocą z zamkniętymi oczami i mamrocze, według autora wyglądał jak rozmawiający z diabłem. Szept przez sen mógł uchodzić za zaklęcie, a gdy następnego dnia coś się stało, np. koń kowala się przeziębił, winny był lunatyk."},{"t":"Gwizdanie","d":"Niektóre melodie miały przywoływać wiatr zdolny zerwać dach albo zważyć mleko. Liczyło się też miejsce: gwizdanie przy pewnych drzewach oznaczało spotkanie z czarownicami, przy cmentarzu budzenie zmarłych, a w kościele było zakazane. Wierzono też, że melodie pozwalają porozumiewać się ze zwierzętami."},{"t":"Leworęczność","d":"Ponieważ większość ludzi jest praworęczna, a diabła uważano za mańkuta, leworęcznych podejrzewano o czary. Według autora ich słowo nie miało wagi w sądzie, bo uznawano, że mówi przez nich diabeł."},{"t":"Ziewanie","d":"Wierzono, że przy ziewnięciu dusza może uciec, a w jej miejsce wejdą demony. Autor wiąże to z dżumą, której objawem miało być częste ziewanie. Przy ziewaniu robiono znak krzyża nad ustami, a za niemowlęta robili to dorośli; ziewanie bez znaku krzyża było podejrzane."},{"t":"Posiadanie kotów","d":"Zwłaszcza czarne koty, nocne i tajemnicze, uchodziły za pomocników diabła, więc ich właścicielkę mogła oskarżyć sąsiadka. Autor zwraca uwagę na ironię: koty ograniczały populację szczurów, a więc ryzyko szerzenia się dżumy."},{"t":"Kichnięcie kota obok ciebie","d":"Skoro kot był przyjacielem diabła, to kichnięcie kota obok ciebie oznaczało, że kot z tobą rozmawia. Według autora z tego wynikało, że i ty kumplujesz się z diabłem, czyli jesteś czarownicą."},{"t":"Warzenie piwa","d":"W średniowieczu piwo warzyły głównie kobiety. Za dobre piwo budziło zazdrość i plotki o zaklęciach nad kotłem. Wyposażenie piwowarki to duży kocioł, kij do mieszania i koty pilnujące ziarna przed myszami, czyli według autora gotowy zestaw stereotypowej czarownicy."},{"t":"Za dobry ser","d":"Gdy w wiosce jeden ser zawsze wychodził idealny, a u sąsiadów jak guma czy cegła, ludzie, nie znając roli bakterii i temperatury, podejrzewali czary. Wierzono, że czarownica umie \"ukraść\" jakość cudzego sera i dodać ją do swojego."},{"t":"Jajka z dwoma żółtkami","d":"Autor umieszcza to w XVI-wiecznej Francji: jajka z dwoma żółtkami uchodziły za nienaturalne. Właścicielkę kur podejrzewano, że rzuciła na nie urok albo używa takich jajek w rytuałach."}],"conclusion":"Przesądy i brak wiedzy sprawiały, że niemal każde odstępstwo od normy mogło skończyć się procesem o czary.","factchecks":[{"claim":"Polowania na czarownice to średniowiecze (XV wiek).","verdict":"półprawda","note":"Masowe procesy to głównie lata 1450-1750, czyli wczesna nowożytność, nie średniowiecze.","src":[["Wikipedia (ang.): procesy czarownic w epoce nowożytnej - hasło \"Witch trials in the early modern period\"","https://en.wikipedia.org/wiki/Witch_trials_in_the_early_modern_period"]],"p":null},{"claim":"\"Znak diabła\" i kłucie igłami, także chowanymi.","verdict":"prawda","note":"Kłucie (witch-pricking) jest dobrze udokumentowane, w tym oszustwa z chowanymi igłami.","src":[["Wikipedia (ang.): kłucie czarownic - hasło \"Witch pricking\"","https://en.wikipedia.org/wiki/Witch_pricking"],["Wikipedia (ang.): znak diabła - hasło \"Devil's mark\"","https://en.wikipedia.org/wiki/Devil%27s_mark"]],"p":0},{"claim":"Leworęczni byli oskarżani o czary, a ich zeznania nie miały wagi w sądzie.","verdict":"nie da się sprawdzić","note":"Lewa strona kojarzyła się ze złem, ale brak źródeł, że leworęczność była typowym zarzutem.","src":[["Wikipedia (ang.): uprzedzenia wobec leworęcznych - hasło \"Bias against left-handed people\"","https://en.wikipedia.org/wiki/Bias_against_left-handed_people"]],"p":3},{"claim":"Ziewanie było objawem dżumy, stąd znak krzyża przy ziewaniu.","verdict":"nie da się sprawdzić","note":"Zwyczaj żegnania ust istniał, ale związek z dżumą to anegdota bez źródeł.","src":[["Wikipedia (ang.): ziewanie (kultura) - hasło \"Yawn\"","https://en.wikipedia.org/wiki/Yawn"]],"p":4},{"claim":"Koty kojarzono z diabłem; ich tępienie nasiliło dżumę.","verdict":"półprawda","note":"Bulla z 1233 r. łączyła koty z diabłem, ale wpływ tępienia kotów na dżumę to mit.","src":[["Wikipedia (ang.): bulla Vox in Rama - hasło \"Vox in Rama\"","https://en.wikipedia.org/wiki/Vox_in_Rama"],["Wikipedia (ang.): czarny kot - hasło \"Black cat\"","https://en.wikipedia.org/wiki/Black_cat"]],"p":5},{"claim":"Kobiety piwowarki (alewives) dały początek stereotypowi czarownicy z kotłem, miotłą i kotem.","verdict":"półprawda","note":"Kobiety dominowały w piwowarstwie, ale historycy kwestionują związek ze stereotypem czarownicy.","src":[["Wikipedia (ang.): piwowarki (alewives) - hasło \"Alewife (trade)\"","https://en.wikipedia.org/wiki/Alewife_(trade)"]],"p":7},{"claim":"Lunatykowanie, gwizdanie, kichnięcie kota, ser, jajka z dwoma żółtkami jako powody oskarżeń.","verdict":"nie da się sprawdzić","note":"Przesądy o \"kradzieży\" mleka istniały, ale konkretne przykłady z filmu nie są udokumentowane.","src":[["Wikipedia (ang.): czary (przesądy ludowe) - hasło \"Witchcraft\"","https://en.wikipedia.org/wiki/Witchcraft"]],"p":null}],"bias":"Rozrywkowy, bez źródeł. Większość punktów to anegdoty z internetu podane jako fakty, a epoka jest pomylona (to głównie XVI-XVII wiek, nie średniowiecze).","channel":"Chill Dude Explains","section":"Chill Dude Explains"},{"id":"wCxRHueX6jQ","title_pl":"Pompa, która działa dzięki korkom powietrznym","title":"Wirtz pumps are really clever","channel":"Steve Mould","url":"https://www.youtube.com/watch?v=wCxRHueX6jQ","date":"2023-10-10","duration":725,"views":19166829,"section":"Ciekawostki","transcript":"youtube","added":"2026-11-03","tags":["Fizyka","Inżynieria"],"about":"Steve Mould buduje pompę spiralną Wirtza, wyjaśnia, jak sumują się korki powietrzne, i poprawia błąd z filmu o labiryntach.","intro":"Spirala wysokości 20 cm, obracana tak, by co obrót zaczerpnąć trochę wody, potrafi podnieść wodę znacznie wyżej niż sama ma. Steve Mould pokazuje, że działa to dzięki korkom powietrznym, zwykle zmorze inżynierów, odwiedza ogród Jonathana Deana z działającą pompą i buduje poprawioną wersję.","points":[{"t":"Poprawka błędu","d":"W filmie o wodzie rozwiązującej labirynty Mould tłumaczył zatrzymanie przepływu napięciem powierzchniowym. Widzowie, m.in. Corey Albers, wykazali na rysunkach, że winne są korki powietrzne."},{"t":"Korki się sumują","d":"W rurce z 3 odcinkami w kształcie U z wodą i 3 w kształcie odwróconego U z powietrzem każdy słup wody musi pchać kolejny. Żeby woda spłynęła, słup na wejściu musi być wyższy niż suma wszystkich przeszkód."},{"t":"Pompa Wirtza","d":"Ta sama zasada działa na korzyść w pompie spiralnej. Każdy łuk wody w spirali to korek oddzielający komory powietrza, a ich ciśnienia się dodają, więc wylot może być dużo wyżej niż sama pompa."},{"t":"Pierwsza wersja zawiodła","d":"Pompa Moulda podnosiła wodę słabo: powietrze przebijało się między komorami, a woda przelewała. Jedna praca naukowa podawała, że rura powinna mieć ok. 1,5 cm średnicy, ale nie tłumaczyła dlaczego."},{"t":"Pompa w ogrodzie","d":"Jonathan Dean ma pompę napędzaną kołem z łopatkami w rzece. Szeroki czerpak na końcu węża zapewnia pobór przy każdym poziomie wody, a obrotowe złącze wytrzymało ok. miliona obrotów w sezonie."},{"t":"Ani za wąsko, ani za szeroko","d":"W zbyt wąskiej rurze przeszkadza napięcie powierzchniowe, a w zbyt szerokiej powietrze przebija się przez korki zamiast tworzyć osobne porcje."},{"t":"Powietrze pomaga","d":"Między korkami wody wypychane jest też powietrze, a mieszanka wody i powietrza w rurze wylotowej jest lżejsza. Według Deana prawie podwaja to wysokość podnoszenia. Jego wylot jest 8 m nad rzeką i zasila ogród bagienny."},{"t":"Wpompowana rybka","d":"Dean znalazł kiedyś w zbiorniku rybkę, która trafiła tam jako narybek, przezimowała i urosła. Wypuścił ją z powrotem do rzeki."},{"t":"Druga wersja","d":"Nowa spirala ma szerszą rurę i nie sięga środka, więc wszystkie zwoje mają podobny obwód. W krótkich zwojach wewnętrznych porcja wody wypełnia cały obwód, co powoduje przelewanie."},{"t":"Działa","d":"Kręcona ręcznie pompa podnosi wodę i przelewa ją przez wspornik nad odpływem. Przy zbyt szybkim obracaniu słup wody się załamuje."},{"t":"Sponsor","d":"Ostatnie minuty to reklama Incogni, usługi wysyłającej brokerom danych żądania usunięcia danych osobowych."}],"conclusion":"Korki powietrzne, które blokują przepływ w labiryncie, sumują się w pompie Wirtza i pozwalają podnieść wodę wysoko bez prądu.","factchecks":[{"claim":"Pompa spiralna, zwana pompą Wirtza, podnosi wodę wyżej niż wynosi jej rozmiar.","verdict":"prawda","note":"Ze szczelnym złączem obrotowym podnosi wodę zwykle na 5-10 m; jej wadą jest mała wydajność.","p":[2,6],"src":[["Wikipedia (ang.): pompowanie wody - hasło \"Water pumping\"","https://en.wikipedia.org/wiki/Water_pumping"]]},{"claim":"Korek powietrzny może całkowicie zatrzymać przepływ cieczy w rurze.","verdict":"prawda","note":"Gaz uwięziony w wysokim punkcie rury ogranicza lub zatrzymuje przepływ.","p":[0,1],"src":[["Wikipedia (ang.): korek powietrzny - hasło \"Air lock\"","https://en.wikipedia.org/wiki/Air_lock"]]},{"claim":"Mieszanka powietrza i wody prawie podwaja wysokość podnoszenia.","verdict":"przesada","note":"Lżejszy słup mieszanki pozwala podnieść wodę wyżej, ale ile, zależy od proporcji; podwojenie to szacunek Deana.","p":6,"src":[["Wikipedia (ang.): pompowanie wody - hasło \"Water pumping\"","https://en.wikipedia.org/wiki/Water_pumping"]]}],"bias":"Rzetelny; Mould otwarcie poprawia własny błąd. Pod koniec długa reklama Incogni."},{"id":"jduDyF2Zwd8","title_pl":"Czy prąd naprawdę płynie do ziemi?","title":"Where Does Grounded Electricity Actually Go?","channel":"Practical Engineering","url":"https://www.youtube.com/watch?v=jduDyF2Zwd8","date":"2023-08-01","duration":1175,"views":7948111,"section":"Ciekawostki","transcript":"youtube","added":"2026-11-03","tags":["Nauka","Technika"],"about":"Practical Engineering tłumaczy uziemienie: prąd nie płynie do ziemi, tylko przez nią, z powrotem do źródła.","intro":"Generator na izolowanym stojaku i przewód fazowy wbity w ziemię: czy popłynie prąd? Grady Hillhouse z Practical Engineering wyjaśnia, po co uziemia się sieci, czemu ziemia to kiepski, ale ogromny przewód, czym są napięcie krokowe i dotykowe, jak działają linie z powrotem przez ziemię i czym różni się od tego piorun.","points":[{"t":"Masa to punkt odniesienia","d":"Napięcie to zawsze różnica potencjałów między dwoma punktami. W małych układach, np. zabawkach na baterie, \"masa\" to tylko umowne zero, bez związku z ziemią pod stopami."},{"t":"Sieć bez uziemienia","d":"Trójfazowa sieć bez połączenia z ziemią przy zwarciu jednej fazy z ziemią często działa dalej, bo silniki i transformatory są podłączone między fazami. Ale napięcie pozostałych faz względem ziemi rośnie prawie dwukrotnie, a to oznacza droższą izolację."},{"t":"Zabezpieczenia potrzebują prądu","d":"W sieci nieuziemionej przy zwarciu do ziemi płynie bardzo mały prąd, a niemal wszystkie zabezpieczenia, od bezpieczników po przekaźniki w sieci, wykrywają awarię po dużym prądzie zwarciowym."},{"t":"Przykład tostera","d":"Gdy faza dotknie metalowej obudowy tostera, przewód ochronny daje drogę o małej oporności. Płynie duży prąd i wyłącznik odcina obwód, zanim ktoś zostanie porażony."},{"t":"Przez ziemię, nie do ziemi","d":"W sieci uziemionej przy zwarciu fazy nie zmieniają potencjału, a prąd wraca przez ziemię do źródła. Odpowiedź na pytanie z tytułu: prąd prawie nigdy nie płynie do ziemi, tylko przez nią; ziemia to po prostu kolejny, choć słaby przewód."},{"t":"Pokaz z piaskiem","d":"Suchy piasek prawie nie przewodzi; zalany wodą z kranu przepuszcza ok. 0,1 A. Dopiero dodatek słonej wody zapala żarówkę, bo oporność gruntu zależy od wilgoci, temperatury i elektrolitów."},{"t":"Napięcie krokowe","d":"Wokół elektrody potencjał spada warstwami, najszybciej tuż przy niej. Stojąc tam, każda noga ma inny potencjał i prąd płynie przez ciało, dlatego monterom zaleca się odskakiwać od awarii na jednej nodze."},{"t":"Ochrona w stacjach","d":"Projektanci liczą dopuszczalne napięcia krokowe i dotykowe. Stacje mają siatki zakopanych przewodów zamiast jednej elektrody i nawierzchnię z tłucznia, który słabo przewodzi i nie zatrzymuje wody."},{"t":"Ziemia jako przewód powrotny","d":"Sieci SWER na terenach wiejskich używają jednego przewodu i ziemi jako powrotu. Linia prądu stałego Pacific DC Intertie ma w Oregonie ponad 1000 elektrod w pierścieniu o obwodzie 3,2 km, a w Kalifornii elektrody w Pacyfiku."},{"t":"Skutki uboczne","d":"Prąd stały w ziemi zakłóca kompasy i ryby wrażliwe na pole magnetyczne, jak łososie i węgorze, a w morzu elektroliza tworzy m.in. chloroform. Prądy błądzące, także z szyn kolejowych, przyspieszają korozję rurociągów."},{"t":"Piorun i prądy telluryczne","d":"Piorun to wyładowanie elektryczności statycznej, które naprawdę płynie do ziemi albo z niej; uziemienie daje mu bezpieczną drogę. Pod ziemią płyną też naturalne prądy telluryczne wywołane m.in. przez wiatr słoneczny."}],"conclusion":"Prąd nie znika w ziemi: zawsze wraca do źródła, a ziemia jest tylko jedną z dróg.","factchecks":[{"claim":"W sieci nieuziemionej zwarcie fazy z ziemią podnosi napięcie pozostałych faz prawie dwukrotnie.","verdict":"prawda","note":"Rośnie do pierwiastka z 3 (ok. 1,73) wartości normalnej, czyli do napięcia międzyfazowego.","p":1,"src":[["Wikipedia (ang.): uziemienie punktu neutralnego - hasło \"Earthing system\"","https://en.wikipedia.org/wiki/Earthing_system"]]},{"claim":"Przy awarii do ziemi powstają groźne napięcia krokowe i dotykowe.","verdict":"prawda","note":"Analiza zwarć pozwala ocenić te napięcia i dobrać środki ochrony, np. siatki uziemiające.","p":[6,7],"src":[["Wikipedia (ang.): potencjał ziemi - hasło \"Earth potential rise\"","https://en.wikipedia.org/wiki/Earth_potential_rise"]]},{"claim":"SWER to systemy z jednym przewodem i powrotem przez ziemię dla terenów wiejskich.","verdict":"prawda","note":"Są szeroko używane m.in. w Australii, Nowej Zelandii i krajach afrykańskich.","p":8,"src":[["Wikipedia (ang.): SWER - hasło \"Single-wire earth return\"","https://en.wikipedia.org/wiki/Single-wire_earth_return"]]},{"claim":"Pacific DC Intertie ma w Oregonie ponad 1000 elektrod w pierścieniu o obwodzie 3,2 km.","verdict":"prawda","note":"W Rice Flats leży 1067 anod żeliwnych w pierścieniu o obwodzie 3255 m; w Kalifornii elektrody są w oceanie.","p":8,"src":[["Wikipedia (ang.): Pacific DC Intertie - hasło \"Pacific DC Intertie\"","https://en.wikipedia.org/wiki/Pacific_DC_Intertie"]]}],"bias":"Rzetelny, z bezpiecznie pokazanymi doświadczeniami i ostrzeżeniem, by ich nie powtarzać; na końcu reklama sponsora."},{"id":"SHDnfz8EKSs","title_pl":"Trzy zapomniane rzymskie megaprojekty","title":"Three Forgotten Roman Megaprojects","channel":"toldinstone","url":"https://www.youtube.com/watch?v=SHDnfz8EKSs","date":"2023-03-31","duration":690,"views":1098897,"section":"Historia","transcript":"youtube","added":"2026-11-03","tags":["Historia","Technika"],"about":"Tunel Klaudiusza pod jeziorem Fucino, droga Trajana przez Żelazną Bramę na Dunaju i ukryty port Agryppy nad jeziorem Averno.","intro":"Garrett Ryan z toldinstone pokazuje 3 mniej znane dzieła rzymskiej inżynierii. Tunel, którym Klaudiusz chciał osuszyć jezioro Fucino, drogę i most Trajana przy Żelaznej Bramie na Dunaju oraz port wojenny, który Agryppa ukrył w kraterze wulkanu pod Neapolem. Każdy z nich ma swoją dramatyczną historię i smutny koniec.","points":[{"t":"Skala Rzymu","d":"Imperium obejmowało według autora czwartą część ludzkości, a Rzym był największym miastem świata aż do XIX w. Rzymianie przewozili 100-tonowe obeliski, a pył z ich kopalni srebra osiadł nawet w lodzie Grenlandii."},{"t":"Jezioro bez odpływu","d":"Jezioro Fucino ok. 80 km na wschód od Rzymu otaczały żyzne pola, ale bez naturalnego odpływu jego poziom to zalewał, to odsłaniał wsie. Dopiero Klaudiusz kazał przebić 300-metrową górę wapienną dzielącą je od rzeki Liri oddalonej o 8 km."},{"t":"Tunel Klaudiusza","d":"30 tys. ludzi przez 11 lat drążyło tunel o wysokości 3 m, szerokości 1,5 m i długości 5,6 km, z 40 pionowymi szybami do wentylacji i wyciągania urobku. Według autora był najdłuższym tunelem świata aż do końca XIX w."},{"t":"Dwa nieudane otwarcia","d":"Na otwarcie Klaudiusz urządził bitwę morską 19 tys. niewolników i skazańców. Dno tunelu okazało się za wysoko i woda nie odpływała; po pogłębieniu woda runęła tak gwałtownie, że rzeka zalała ucztę i cesarz ledwo uszedł z życiem."},{"t":"Osuszone dopiero w XIX w.","d":"Tunel działał kilka stuleci, ale w późnej starożytności się zatkał i jezioro wróciło. Mimo prób w średniowieczu i renesansie osuszono je dopiero w połowie XIX w., z pomocą koparek parowych i materiałów wybuchowych."},{"t":"Żelazna Brama Dunaju","d":"Na granicy dzisiejszej Serbii i Rumunii Dunaj przeciska się między klifami dwóch pasm górskich i do budowy zapór w XX w. tworzył groźne bystrza. Przed wyprawą na Dację Trajan kazał poprowadzić tam drogę wojskową."},{"t":"Droga w skale i nad wodą","d":"Połowę drogi wykuto w ścianie klifu, a resztę oparto na belkach wystających nad nurt. Inżynierowie upamiętnili to inskrypcją Tabula Traiana, a wzdłuż drogi wykopano kanały, by łodzie omijały bystrza."},{"t":"Most Trajana","d":"Poniżej wąwozu stanął największy most starożytności: 20 filarów wznoszących się 18 m nad wodą i drewniane kratownice z jezdnią dłuższą niż 1 km. Filary przetrwały do średniowiecza, fundamenty wysadzono na początku XX w., a resztę zalał zbiornik."},{"t":"Ukryty port Agryppy","d":"Wojując z Sekstusem Pompejuszem, Oktawian potrzebował osłoniętego portu. Agryppa połączył kanałami jezioro Lucrino z morzem i z jeziorem Averno w kraterze wulkanu, tworząc port niewidoczny dla wrogich patroli."},{"t":"Tunele i flota","d":"Inżynier Lucjusz Kokcejusz Auktus przebił tunele przez okoliczne wzgórza, z których Grotta di Cocceio miała prawie 1 km i mieściła 2 wozy obok siebie. Agryppa wyszkolił tam 20 tys. ludzi i w 36 r. p.n.e. pokonał Sekstusa pod Naulochos."},{"t":"Koniec pod nowym wzgórzem","d":"Flota szybko przeniosła się do Misenum. W 1538 r. erupcja w ciągu 2 dni usypała wzgórze Monte Nuovo, zasypując większość jeziora Lucrino; ruiny portu wciąż widać nad Averno."}],"conclusion":"Rzymianie budowali z rozmachem, ale nawet ich megaprojekty pokonały muł, rzeki, wojny i wulkany.","factchecks":[{"claim":"Rzymski ołów i srebro zostawiły ślady w lodzie Grenlandii.","verdict":"prawda","note":"Badanie rdzeni lodowych z 2018 r. pokazało wzrost zanieczyszczeń ołowiem z wydobycia srebra w czasach Rzymu.","p":0,"src":[["PNAS: zanieczyszczenie ołowiem w lodzie Grenlandii (McConnell i in., 2018)","https://doi.org/10.1073/pnas.1721818115"]]},{"claim":"Tunel Klaudiusza miał 5,6 km i był najdłuższy aż do końca XIX w.","verdict":"prawda","note":"Ma ok. 5,65 km; dłuższe tunele pojawiły się dopiero w XIX w., np. kolejowy Fréjus (1871).","p":2,"src":[["Wikipedia (ang.): jezioro Fucino - hasło \"Fucine Lake\"","https://en.wikipedia.org/wiki/Fucine_Lake"]]},{"claim":"Na otwarcie Klaudiusz urządził bitwę morską 19 tys. walczących, a powódź zalała ucztę.","verdict":"prawda","note":"Tak opisuje to Tacyt (Roczniki XII); liczba 19 tys. pochodzi z jego relacji.","p":3,"src":[["Wikipedia (ang.): naumachia - hasło \"Naumachia\"","https://en.wikipedia.org/wiki/Naumachia"]]},{"claim":"Most Trajana miał 20 filarów i ponad 1 km długości.","verdict":"prawda","note":"Miał ok. 1135 m i 20 filarów; przez ponad 1000 lat był najdłuższym mostem łukowym świata.","p":7,"src":[["Wikipedia (ang.): most Trajana - hasło \"Trajan's Bridge\"","https://en.wikipedia.org/wiki/Trajan%27s_Bridge"],["Wikipedia (ang.): Tabula Traiana - hasło \"Tabula Traiana\"","https://en.wikipedia.org/wiki/Tabula_Traiana"]]},{"claim":"Port Agryppy łączył jeziora Averno i Lucrino, a w 36 r. p.n.e. flota wygrała pod Naulochos.","verdict":"prawda","note":"Portus Iulius zbudowano w 37 r. p.n.e.; bitwa pod Naulochos odbyła się we wrześniu 36 r. p.n.e.","p":[8,9],"src":[["Wikipedia (ang.): Portus Julius - hasło \"Portus Julius\"","https://en.wikipedia.org/wiki/Portus_Julius"],["Wikipedia (ang.): bitwa pod Naulochos - hasło \"Battle of Naulochus\"","https://en.wikipedia.org/wiki/Battle_of_Naulochus"]]},{"claim":"Erupcja w 1538 r. usypała wzgórze Monte Nuovo wysokie na ok. 180 m.","verdict":"przesada","note":"Monte Nuovo ma ok. 132 m n.p.m.; powstało w ciągu kilku dni we wrześniu 1538 r.","p":10,"src":[["Wikipedia (ang.): Monte Nuovo - hasło \"Monte Nuovo\"","https://en.wikipedia.org/wiki/Monte_Nuovo"]]}],"bias":"Rzetelny i barwny; drobne zawyżenia (wysokość Monte Nuovo) i lekko kpiący ton wobec Klaudiusza."},{"id":"SnIS9Ozo7NM","title_pl":"Starożytne teorie spiskowe","title":"Ancient Conspiracy Theories","channel":"toldinstone","url":"https://www.youtube.com/watch?v=SnIS9Ozo7NM","date":"2022-10-21","duration":1005,"views":1540369,"section":"Historia","transcript":"youtube","added":"2026-11-03","tags":["Historia","Psychologia"],"about":"Trzy starożytne teorie spiskowe: okaleczenie hermów w Atenach, rzekome otrucie Aleksandra Wielkiego i rzymska nagonka na manichejczyków.","intro":"Garrett Ryan z toldinstone opowiada o trzech teoriach spiskowych ze starożytności. Najpierw afera hermów w Atenach w 415 r. p.n.e. i oskarżenia wobec Alkibiadesa, potem plotka, że Aleksandra Wielkiego otruto trucizną od Arystotelesa, na koniec edykt Dioklecjana, który uznał manicheizm za perski spisek.","points":[{"t":"Spiski i teorie spiskowe","d":"Starożytność zna wiele prawdziwych spisków, np. Katyliny, Pizona przeciw Neronowi czy \"spisek barbarzyński\" na Brytanię. Teorie o tajnej organizacji pociągającej za sznurki pojawiały się według autora głównie w czasach ostrych kryzysów."},{"t":"Alkibiades","d":"Najgłośniejszy polityk Aten: błyskotliwy, czarujący i bez skrupułów, z rodu Peryklesa. Zasłynął agresywną polityką wobec Sparty i wystawieniem aż 7 kosztownych rydwanów na igrzyskach w Olimpii, ale jego rozwiązłe życie budziło nieufność."},{"t":"Okaleczenie hermów","d":"Wiosną 415 r. p.n.e., tuż przed wyprawą na Sycylię, prawie wszystkim hermom w Atenach (kamiennym słupom z głową boga i fallusem) odbito nosy i fallusy. Uznano to za świętokradztwo i zły znak, a w mieście zrodziła się teoria o tajnej kliki chcącej obalić ustrój."},{"t":"Oskarżenie bez dowodów","d":"Śledztwo ujawniło też parodiowanie misteriów eleuzyjskich, w którym miał brać udział Alkibiades. Pod jego nieobecność plotka urosła do spisku arystokratów; gdy w pobliżu pojawił się mały oddział Spartan, uznano, że to wezwali spiskowcy, a Alkibiadesa wezwano na proces."},{"t":"Ofiara teorii spiskowej","d":"Według autora parodia misteriów jest możliwa, ale Alkibiades nie miał powodu obalać ustroju, który właśnie dał mu dowództwo. Zamachy oligarchów były realnym zagrożeniem, w kolejnych latach doszło do 2."},{"t":"Śmierć Aleksandra","d":"Aleksander zmarł w Babilonie 10 czerwca 323 r. p.n.e. w wieku 32 lat po 10 dniach gorączki, która zaczęła się po zakrapianej uczcie. Późniejsza wersja dodawała dramatyczny krzyk bólu przy piciu z pucharu."},{"t":"Trucizna od Arystotelesa","d":"Plotka głosiła, że Antypater wysłał syna Jollasa, by wlał królowi truciznę z wód Styksu, przygotowaną przez Arystotelesa i przewiezioną w kopycie muła. Arystoteles miał motyw: Aleksander stracił jego siostrzeńca Kallistenesa."},{"t":"Krwawe rozliczenia","d":"Olimpias straciła kilku rzekomych spiskowców i kazała rozrzucić kości Jollasa. Kassander zabił ją i zostawił ciało bez pochówku, a mówcy Hyperejdesowi, który chciał uhonorować Jollasa, wycięto język. Według autora śmierć Aleksandra to raczej malaria, alkohol i stare rany."},{"t":"Mani i manicheizm","d":"Ponad 500 lat później prorok Mani w Mezopotamii głosił walkę światła z ciemnością: wybrani wyrzekali się majątku, a słuchacze ich wspierali. Wspierany przez szacha, słał misjonarzy do Indii, Azji Środkowej i Cesarstwa Rzymskiego."},{"t":"Edykt Dioklecjana","d":"W 302 r. Dioklecjan uznał manicheizm za perski spisek przeciw Rzymowi: nawróconych czekała śmierć, urzędników kopalnie, a kaznodziejów stos z ich księgami. Kolejni cesarze, już chrześcijańscy, przez ponad 2 stulecia ścigali sektę jako herezję."},{"t":"Spisku nie było","d":"Mani tylko przez pewien czas cieszył się łaską dworu, zmarł w więzieniu, a jego religię w Persji prześladowali kapłani zaratusztriańscy. Według autora rzymska krucjata wyrosła z zabójczej prostoty teorii spiskowej."}],"conclusion":"Teorie spiskowe żyją niezależnie od faktów, a w kryzysie potrafią kosztować życie i trwać stulecia.","factchecks":[{"claim":"Alkibiades wystawił 7 rydwanów na igrzyskach olimpijskich.","verdict":"prawda","note":"W 416 r. p.n.e. wystawił 7 zaprzęgów i zajął 1., 2. i 4. miejsce, jak podaje Tukidydes.","p":1,"src":[["Wikipedia (ang.): Alkibiades - hasło \"Alcibiades\"","https://en.wikipedia.org/wiki/Alcibiades"]]},{"claim":"W 415 r. p.n.e. przed wyprawą sycylijską okaleczono hermy w Atenach.","verdict":"prawda","note":"Afera hermokopidów wybuchła tuż przed wypłynięciem floty; o udział oskarżono m.in. Alkibiadesa.","p":[2,3],"src":[["Wikipedia (ang.): herma - hasło \"Herma\"","https://en.wikipedia.org/wiki/Herma"],["Wikipedia (ang.): wyprawa sycylijska - hasło \"Sicilian Expedition\"","https://en.wikipedia.org/wiki/Sicilian_Expedition"]]},{"claim":"W ciągu dekady od wyprawy doszło do 2 zamachów oligarchów.","verdict":"prawda","note":"Rządy Czterystu w 411 r. p.n.e. i Trzydziestu Tyranów w 404 r. p.n.e., czyli 11 lat po wyprawie.","p":4,"src":[["Wikipedia (ang.): przewrót ateński - hasło \"Athenian coup of 411 BC\"","https://en.wikipedia.org/wiki/Athenian_coup_of_411_BC"],["Wikipedia (ang.): Trzydziestu Tyranów - hasło \"Thirty Tyrants\"","https://en.wikipedia.org/wiki/Thirty_Tyrants"]]},{"claim":"Aleksander zmarł w Babilonie 10 czerwca 323 r. p.n.e., mając 32 lata.","verdict":"prawda","note":"Źródła podają 10 lub 11 czerwca; miał niespełna 33 lata.","p":5,"src":[["Wikipedia (ang.): śmierć Aleksandra - hasło \"Death of Alexander the Great\"","https://en.wikipedia.org/wiki/Death_of_Alexander_the_Great"]]},{"claim":"Aleksander kazał stracić Kallistenesa, siostrzeńca Arystotelesa.","verdict":"prawda","note":"Kallistenes zginął w 327 r. p.n.e. po spisku paziów; relacje o sposobie śmierci się różnią.","p":6,"src":[["Wikipedia (ang.): Kallistenes - hasło \"Callisthenes\"","https://en.wikipedia.org/wiki/Callisthenes"]]},{"claim":"Hyperejdesa schwytał łowca nagród Kassandra.","verdict":"półprawda","note":"Hyperejdesa ścigał Archiasz na zlecenie Antypatra, ojca Kassandra, i stracono go w 322 r. p.n.e.","p":7,"src":[["Wikipedia (ang.): Hyperejdes - hasło \"Hypereides\"","https://en.wikipedia.org/wiki/Hypereides"]]},{"claim":"Najbardziej prawdopodobna przyczyna śmierci Aleksandra to malaria, a nie trucizna.","verdict":"nie da się sprawdzić","note":"Historycy wymieniają malarię, tyfus, zapalenie trzustki i inne; teza o otruciu nie ma mocnych dowodów.","p":7,"src":[["Wikipedia (ang.): śmierć Aleksandra - hasło \"Death of Alexander the Great\"","https://en.wikipedia.org/wiki/Death_of_Alexander_the_Great"]]},{"claim":"W 302 r. Dioklecjan wydał edykt przeciw manichejczykom, karząc kaznodziejów stosem.","verdict":"prawda","note":"Edykt zachował się w Collatio; datuje się go na 302 r. (część badaczy na 297 r.).","p":9,"src":[["Wikipedia (ang.): manicheizm - hasło \"Manichaeism\"","https://en.wikipedia.org/wiki/Manichaeism"]]},{"claim":"Mani zmarł w więzieniu, prześladowany przez kapłanów zaratusztriańskich.","verdict":"prawda","note":"Zmarł ok. 274-277 r. w więzieniu za Bahrama I, przy wpływie arcykapłana Kartira.","p":10,"src":[["Wikipedia (ang.): Mani - hasło \"Mani (prophet)\"","https://en.wikipedia.org/wiki/Mani_(prophet)"],["Wikipedia (ang.): Kartir - hasło \"Kartir\"","https://en.wikipedia.org/wiki/Kartir"]]}],"bias":"Rzetelny, spokojny wykład historyka ze źródłami; drobne uproszczenia (Hyperejdes) i reklama sponsora na początku."},{"id":"fT2KhJ8W-Kg","title_pl":"Jak pistolet na stacji paliw wie, że bak jest pełny","title":"How petrol pumps know when to turn themselves off","channel":"Steve Mould","url":"https://www.youtube.com/watch?v=fT2KhJ8W-Kg","date":"2022-09-16","duration":836,"views":15567702,"section":"Ciekawostki","transcript":"youtube","added":"2026-11-03","tags":["Fizyka","Inżynieria"],"about":"Steve Mould przecina pistolet dystrybutora na pół i na modelach pokazuje mechanizm bez elektroniki, który sam odcina paliwo.","intro":"Pistolet dystrybutora odcina paliwo z charakterystycznym kliknięciem, gdy bak jest pełny, choć nie ma w nim czujnika elektronicznego. Steve Mould przecina go na pół i buduje przezroczyste modele dwóch mechanizmów: czujnika opartego na efekcie Venturiego i układu dźwigni z kulkami łożyskowymi, który zamyka zawór.","points":[{"t":"Efekt Venturiego","d":"Rura, która zwęża się pośrodku, przyspiesza przepływ, a w przewężeniu spada ciśnienie. Gdy Mould dmucha przez taki model, woda w podłączonej rurce w kształcie U podnosi się zamiast opadać."},{"t":"Rurka do końca dyszy","d":"Otworki przy przewężeniu łączą się z cienką rurką biegnącą do końca dyszy. Podciśnienie zasysa przez nią powietrze, które miesza się z paliwem."},{"t":"Druga gałąź z membraną","d":"Z tego samego miejsca odchodzi kanał do komory zamkniętej membraną. Dopóki rurka w dyszy zasysa powietrze, łagodzi podciśnienie i membrana stoi w miejscu."},{"t":"Bak pełny","d":"Gdy paliwo zakryje otwór na końcu dyszy, rurka zasysa ciężkie paliwo zamiast powietrza i słabiej łagodzi podciśnienie. W modelu odpowiada to zatkaniu rurki palcem: podciśnienie w komorze rośnie i wciąga membranę."},{"t":"Dźwignia i kulki","d":"Zawór paliwa jest dociskany sprężyną i otwierany przez rękojeść. Punkt podparcia dźwigni tworzą 3 kulki łożyskowe zaklinowane w przewężeniu obudowy, a do membrany przymocowany jest trzpień z klinem."},{"t":"Kliknięcie","d":"Gdy membrana się podnosi, klin się cofa, kulki wpadają do środka, punkt podparcia znika i cały mechanizm się składa. Sprężyna zamyka zawór."},{"t":"Przepływ w środku","d":"Paliwo pod ciśnieniem opływa mechanizm i pcha sprężynowy element, tworząc cienką szczelinę. To w niej, dzięki efektowi Venturiego, powstaje podciśnienie dla czujnika."},{"t":"Po co to wszystko","d":"Samoczynne odcięcie chroni przed rozlaniem paliwa na stacji, co groziłoby pożarem. Mould przyznaje, że jego modele są uproszczone i nie wszystko udało mu się dostroić."},{"t":"Sponsor","d":"Końcówka to reklama 80,000 Hours, organizacji non-profit doradzającej w wyborze kariery."}],"conclusion":"Pistolet dystrybutora odcina paliwo czysto mechanicznie: efekt Venturiego, membrana i kulki łożyskowe zastępują elektronikę.","factchecks":[{"claim":"W przewężeniu rury płyn przyspiesza, a jego ciśnienie spada.","verdict":"prawda","note":"To efekt Venturiego, wynikający z zasady zachowania masy i równania Bernoulliego.","p":0,"src":[["Wikipedia (ang.): efekt Venturiego - hasło \"Venturi effect\"","https://en.wikipedia.org/wiki/Venturi_effect"]]},{"claim":"Automatyczne odcięcie w pistolecie działa dzięki rurce czujnika i pompie Venturiego w rękojeści.","verdict":"prawda","note":"Zawór mechaniczny w rękojeści wykrywa zmianę ciśnienia i zamyka się.","p":[1,2,3,5],"src":[["Wikipedia (ang.): dystrybutor paliwa - hasło \"Gasoline pump\"","https://en.wikipedia.org/wiki/Gasoline_pump"]]}],"bias":"Rzetelny i dobrze zilustrowany; transkrypcja miejscami nieczytelna, ale mechanizm jest jasny. Na końcu reklama sponsora."},{"id":"mkrhwBl3jms","title_pl":"Czy Rzymianie wiedzieli, ile lat mają piramidy?","title":"Did the Romans Know How Old the Pyramids Were?","channel":"toldinstone","url":"https://www.youtube.com/watch?v=mkrhwBl3jms","date":"2022-08-12","duration":530,"views":1279356,"section":"Historia","transcript":"youtube","added":"2026-11-03","tags":["Historia"],"about":"Jak Grecy i Rzymianie wyobrażali sobie przeszłość Egiptu i dlaczego mylili się co do wieku piramid w Gizie.","intro":"Garrett Ryan z toldinstone zaczyna od obelisku postawionego w Circus Maximus w 357 r., którego hieroglifów nikt w Rzymie nie umiał przeczytać. Pokazuje, jak Grecy i Rzymianie mierzyli przeszłość mitami, jak fascynował ich Egipt i dlaczego datowali piramidy o tysiące lat za późno, choć poprawna kronika istniała.","points":[{"t":"Obelisk w Circus Maximus","d":"W 357 r. Konstancjusz II sprowadził obelisk z największej świątyni Egiptu: przypłynął specjalną barką, przetoczono go na drewnianej kołysce i podniosły go tysiące ludzi przy kabestanach. Miał ok. 32 m i ok. 400 t, a jego hieroglifów nikt w Rzymie nie umiał odczytać."},{"t":"Czas mierzony mitem","d":"Rzymianie sądzili, że Rzym założono ok. 11 wieków wcześniej, a wojna trojańska była ponad 400 lat przed nim. O tym, co wcześniej, wiedzieli tylko z mitów: ruiny mykeńskie przypisywano bohaterom Iliady lub cyklopom."},{"t":"Znaleziska tłumaczone legendą","d":"Ateńczycy uznali kości wysokiego mężczyzny z brązową bronią za szczątki Tezeusza, a kamienną trumnę odsłoniętą przez powódź pod Rzymem za grób króla Numy. Spartański król Agesilaos, nie umiejąc odczytać tabliczki z grobu Alkmeny, wysłał ją do Egiptu."},{"t":"Egipt w świecie klasycznym","d":"Grecy docierali nad Nil od VII w. p.n.e., po Aleksandrze przez 3 wieki rządzili nim Ptolemeusze, a od Augusta Egipt był prowincją rzymską przez prawie 700 lat. Mimo to elity widziały go jako egzotyczną krainę cudów."},{"t":"Moda na Egipt","d":"W Rzymie stawiano obeliski, malowano sceny nilowe w willach, a elita budowała grobowce-piramidy, choć Pliniusz Starszy krytykował piramidy jako próżny pokaz bogactwa. Rzymscy turyści płacili wieśniakom za wspinanie się na Wielką Piramidę i ryli na niej graffiti."},{"t":"Faraonowie sprzed tysięcy lat","d":"Herodot uważał, że pierwsi faraonowie panowali ok. 15000 lat p.n.e., a Diodor przesunął to do ok. 23000 lat p.n.e. W rzeczywistości państwo egipskie powstało tuż przed 3000 r. p.n.e."},{"t":"Piramidy datowane za późno","d":"Piramidy w Gizie zbudowano w XXVI w. p.n.e., a Herodot umieścił budowniczego Wielkiej Piramidy ok. 1200 r. p.n.e., Diodor w X w. p.n.e. Piramidę Mykerinosa tradycja przypisywała nawet greckiej kurtyzanie Rodopis z VI w. p.n.e."},{"t":"Zanikająca wiedza kapłanów","d":"Hieroglify umiała czytać tylko kurcząca się grupa kapłanów, więc długo przed ostatnią inskrypcją pod koniec IV w. zapisy na pomnikach były niezrozumiałe nawet dla ich strażników."},{"t":"Zapomniany Manetho","d":"W III w. p.n.e. Egipcjanin Manetho napisał po grecku historię Egiptu, która poprawnie datowała piramidy na wczesny okres. Grecy i Rzymianie woleli jednak klasycznego, chronologicznie chaotycznego Herodota."}],"conclusion":"Grecy i Rzymianie widzieli Egipt przez pryzmat własnej kultury i klasyków, a czego te nie pokazywały, nie chcieli widzieć.","factchecks":[{"claim":"W 357 r. Konstancjusz II postawił w Circus Maximus obelisk z Egiptu.","verdict":"prawda","note":"To dzisiejszy Obelisk Laterański z Karnaku, ok. 32 m wysokości, przeniesiony na Lateran w 1588 r.","p":0,"src":[["Wikipedia (ang.): Obelisk Laterański - hasło \"Lateran Obelisk\"","https://en.wikipedia.org/wiki/Lateran_Obelisk"]]},{"claim":"Kimon przywiózł ze Skiros kości uznane za szczątki Tezeusza.","verdict":"prawda","note":"Plutarch opisuje znalezisko z ok. 475 r. p.n.e.: duży szkielet z włócznią i mieczem z brązu.","p":2,"src":[["Wikipedia (ang.): Tezeusz - hasło \"Theseus\"","https://en.wikipedia.org/wiki/Theseus"]]},{"claim":"Pliniusz Starszy nazwał piramidy próżnym pokazem bogactwa królów.","verdict":"prawda","note":"W Historii naturalnej (ks. 36) pisze o piramidach jako bezużytecznym i głupim popisie bogactwa.","p":4,"src":[["Wikipedia (ang.): Wielka Piramida - hasło \"Great Pyramid of Giza\"","https://en.wikipedia.org/wiki/Great_Pyramid_of_Giza"]]},{"claim":"Państwo egipskie powstało tuż przed 3000 r. p.n.e., a piramidy w Gizie w XXVI w. p.n.e.","verdict":"prawda","note":"Zjednoczenie ok. 3100 r. p.n.e.; Wielką Piramidę datuje się na ok. 2600-2560 r. p.n.e.","p":[5,6],"src":[["Wikipedia (ang.): wczesny okres dynastyczny - hasło \"Early Dynastic Period (Egypt)\"","https://en.wikipedia.org/wiki/Early_Dynastic_Period_(Egypt)"],["Wikipedia (ang.): Wielka Piramida - hasło \"Great Pyramid of Giza\"","https://en.wikipedia.org/wiki/Great_Pyramid_of_Giza"]]},{"claim":"Tradycja przypisywała piramidę Mykerinosa kurtyzanie Rodopis.","verdict":"prawda","note":"Herodot przytacza tę wersję i ją odrzuca; powtarzali ją później Strabon i Diodor.","p":6,"src":[["Wikipedia (ang.): Rodopis - hasło \"Rhodopis\"","https://en.wikipedia.org/wiki/Rhodopis"]]},{"claim":"Ostatnią inskrypcję hieroglificzną wyryto pod koniec IV w.","verdict":"prawda","note":"Graffito Esmet-Achoma na wyspie File pochodzi z 394 r.","p":7,"src":[["Wikipedia (ang.): graffito Esmet-Achoma - hasło \"Graffito of Esmet-Akhom\"","https://en.wikipedia.org/wiki/Graffito_of_Esmet-Akhom"]]},{"claim":"Manetho w III w. p.n.e. napisał po grecku historię Egiptu.","verdict":"prawda","note":"Jego Aegyptiaca zna się z odpisów; podział na dynastie stosuje się do dziś.","p":8,"src":[["Wikipedia (ang.): Manetho - hasło \"Manetho\"","https://en.wikipedia.org/wiki/Manetho"]]}],"bias":"Rzetelny i wyważony; masa obeliska podana z zaokrągleniem, poza tym brak przekłamań. Reklama sponsora w środku."},{"id":"bY1E2IkvQ3k","title_pl":"Jak wody gruntowe wpływają na tamy i budowy","title":"The Bizarre Paths of Groundwater Around Structures","channel":"Practical Engineering","url":"https://www.youtube.com/watch?v=bY1E2IkvQ3k","date":"2022-06-07","duration":841,"views":14269809,"section":"Ciekawostki","transcript":"youtube","added":"2026-11-03","tags":["Nauka","Technika"],"about":"Grady z Practical Engineering pokazuje na modelu z piasku, jak woda pod ziemią może podnieść tamę albo wciągnąć robotnika.","intro":"W 2015 r. w Kanadzie robotnika wciągnęło zapadlisko w dnie stalowego kesonu na budowie przepompowni. Grady Hillhouse z Practical Engineering na akrylowym modelu z piaskiem i barwnikiem pokazuje, jak płyną wody gruntowe, czym jest ciśnienie wyporu pod tamą i jak inżynierowie bronią się przed nim przesłonami, drenażem i pompami.","points":[{"t":"Wypadek w kesonie","d":"Na budowie w Kolumbii Brytyjskiej dno kesonu, czyli wodoszczelnej komory w gruncie, zostało przebite i pracownik wpadł do zapadliska. Przyczyną była woda gruntowa pod placem budowy; kolegom udało się go uratować."},{"t":"Tama jako granica ciśnień","d":"Woda gruntowa płynie z obszaru wysokiego do niskiego ciśnienia, a tama właśnie je rozdziela. Przesiąkająca pod nią woda może wymywać cząstki gruntu (sufozja), co nakręca się samo i grozi szybką awarią."},{"t":"Ciśnienie wyporu","d":"Zapory grawitacyjne trzymają się dzięki własnej masie, ale woda pod podstawą naciska od dołu i odejmuje część tego ciężaru. Do lat 20. XX w. inżynierowie to pomijali; zapora St. Francis w Kalifornii zawaliła się w 1928 r., zabijając ponad 400 osób."},{"t":"Sieć przepływu","d":"Inżynierowie rysowali krzywoliniową siatkę z liniami równego ciśnienia i liniami przepływu. To w praktyce graficzne rozwiązanie równania Laplace'a, tego samego co dla przepływu ciepła; dziś liczy się to programami."},{"t":"Przesłona przeciwfiltracyjna","d":"Pionowa ściana pod czołem tamy wydłuża drogę wody. Wg prawa Darcy'ego prędkość przepływu zależy od przepuszczalności i gradientu hydraulicznego, więc dłuższa droga to mniejszy przesiąk i niższe ciśnienie wyporu, nawet gdy woda przechodzi pod ścianą."},{"t":"Jak buduje się przesłony","d":"Można wykopać szeroki fundament (przy okazji sprawdzając uskoki), wypełnić głęboki rów betonem lub zawiesiną gliny, wbić ścianki szczelne albo wtłoczyć pod ciśnieniem zaczyn tworzący nieprzepuszczalną kurtynę."},{"t":"Drenaż pod tamą","d":"Dreny z filtrem z piasku i żwiru zatrzymują cząstki gruntu i odprowadzają wodę, obniżając wypór. Skracają drogę przepływu, więc przesiąk rośnie, ale dzięki filtrom to zwykle opłacalna wymiana."},{"t":"Studnie odciążające","d":"Niektóre zapory pompują wodę, by obniżyć jej poziom pod konstrukcją. Przesiąk rośnie, ale ciśnienie pod podstawą wyraźnie spada, a stabilność rośnie."},{"t":"Kurzawka w kesonie","d":"Odwadniany keson działa jak tama na bardzo krótkim odcinku, więc gradient i prędkość przesiąku są duże. Grunt traci spójność, upłynnia się i wpływa do środka; model pokazuje, jak piasek zaczyna wzbierać."},{"t":"Jak temu zapobiec","d":"Wokół kesonu stawia się igłofiltry, czyli rząd małych studni z pompami, albo wbija keson głębiej, najlepiej do warstwy nieprzepuszczalnej. Dzięki temu woda nie napiera od spodu."}],"conclusion":"Pod niemal każdą tamą, ścianą oporową czy wykopem kryją się przesłony i drenaże, które trzymają wody gruntowe w ryzach.","factchecks":[{"claim":"Zawalenie zapory St. Francis w 1928 r. zabiło ponad 400 osób.","verdict":"prawda","note":"Szacunki to co najmniej 431 ofiar; to jedna z najgorszych katastrof budowlanych w USA w XX w.","p":2,"src":[["Wikipedia (ang.): zapora St. Francis - hasło \"St. Francis Dam\"","https://en.wikipedia.org/wiki/St._Francis_Dam"]]},{"claim":"Sieć przepływu to graficzne rozwiązanie równania Laplace'a.","verdict":"prawda","note":"Ustalony przepływ w jednorodnym gruncie opisuje równanie Laplace'a; sieć to jego przybliżenie.","p":3,"src":[["Wikipedia (ang.): sieć przepływu - hasło \"Flow net\"","https://en.wikipedia.org/wiki/Flow_net"]]},{"claim":"Prawo Darcy'ego wiąże przepływ z przepuszczalnością i gradientem hydraulicznym.","verdict":"prawda","note":"Darcy sformułował je w 1856 r. na podstawie doświadczeń z filtrami piaskowymi.","p":4,"src":[["Wikipedia (ang.): prawo Darcy'ego - hasło \"Darcy's law\"","https://en.wikipedia.org/wiki/Darcy%27s_law"]]},{"claim":"Do lat 20. XX w. projektanci zapór pomijali ciśnienie wyporu.","verdict":"półprawda","note":"Zjawisko znano od końca XIX w., ale w latach 20. wciąż było słabo rozumiane i rzadko uwzględniane.","p":2,"src":[["Wikipedia (ang.): zapora St. Francis - hasło \"St. Francis Dam\"","https://en.wikipedia.org/wiki/St._Francis_Dam"]]}],"bias":"Rzetelny, z pokazem na modelu; na końcu długa, rodzinna reklama sponso  '<div class="th"><img src="'+thumb(v)+'" data-id="'+esc(v.id)+'" onerror="'+FB+'" loading="lazy" decoding="async" width="640" height="360" alt="">'+
 '<span class="dur">'+fdur(v.duration)+'</span><span class="rd">✓ Przeczytane</span><span class="prog"></span></div>'+
 vbar(v)+'<h2>'+esc(v.title_pl||v.title)+'</h2>'+
 '<p class="meta">'+fdate(v.date)+' · '+fviews(v.views)+'</p></a>'}
function body(v){
 var c=counts(v), pts=v.points||[], fc=v.factchecks||[], r=isRead(v.id);
 var by=pts.map(function(){return []}), rest=[];FXN=0;
 fc.forEach(function(f){var ix=pIdx(f).filter(function(i){return i>=0&&i<pts.length});if(!ix.length)rest.push(f);else ix.forEach(function(i){by[i].push(f)})});
 return '<div class="mh"><button class="x" id="x" type="button">Zamknij ✕</button></div>'+
 '<img class="mimg" src="'+thumb(v)+'" data-id="'+esc(v.id)+'" onerror="'+FB+'" width="640" height="360" alt="">'+
 '<div class="mb"><h2 id="mt">'+esc(v.title_pl||v.title)+'</h2>'+
 '<p class="mmeta">'+(v.channel?esc(v.channel)+' · ':'')+fdate(v.date)+' · '+fdur(v.duration)+' min</p>'+
 '<p class="lead">'+esc(v.intro||v.about)+'</p>'+
 '<ol class="pts">'+pts.map(function(p,i){return '<li><h3>'+esc(p.t)+'</h3><p class="pd">'+esc(p.d)+'</p>'+badges(by[i])+'</li>'}).join('')+'</ol>'+
 '<section class="blk concl"><h3>Wniosek autora</h3><p>'+esc(v.conclusion)+'</p>'+badges(rest)+'</section>'+
 (v.bias?'<section class="blk bias"><h3>Przekłamania i stronniczość</h3><p>'+esc(v.bias)+'</p></section>':'')+
 '<div class="mfoot">'+
 '<p class="orig">Oryginał: <a href="'+esc(v.url)+'" target="_blank" rel="noopener">'+esc(v.title)+'</a> · '+fviews(v.views)+'</p>'+
 '<div class="tags">'+(v.tags||[]).map(function(t){return '<button class="tag" type="button" data-tag="'+esc(t)+'">#'+esc(t.toLowerCase())+'</button>'}).join('')+'</div>'+
 (c.used.length?vbar(v)+'<div class="legend" aria-label="Legenda werdyktów">'+c.used.map(function(k){return '<span><i class="'+VK[k]+'"></i>'+esc(k)+': '+c.cnt[k]+'</span>'}).join('')+'</div><p class="small">Kliknij werdykt przy punkcie, by zobaczyć sprawdzenie i źródła.</p>':'')+
 (v.transcript==='whisper'?'<p class="small">Transkrypt z rozpoznawania mowy, możliwe błędy w nazwach.</p>':'')+
 '<button class="ur" id="ur" type="button" data-id="'+esc(v.id)+'">'+(r?'Oznacz jako nieprzeczytane':'Oznacz jako przeczytane')+'</button>'+
 '</div></div>'}
function render(){
 var q=norm($('q').value).trim().split(/\s+/).filter(Boolean), fr=$('fr').value, so=$('so').value;
 lsSet(LSU,{sec:sec,fr:fr,so:so});
 chips();
 var base=q.length?V:secList(sec);
 $('sinfo').textContent=q.length?'Wyniki ze wszystkich sekcji':(sec==='polecane'&&FEAT&&FEAT.date?'Wybór na '+fdate(FEAT.date):'');
 var list=base.filter(function(v){
  if(fr==='read'&&!isRead(v.id))return false; if(fr==='unread'&&isRead(v.id))return false;
  for(var i=0;i<q.length;i++)if(v._s.indexOf(q[i])<0)return false; return true});
 if(!(sec==='polecane'&&!q.length&&so==='new'))list.sort(function(a,b){return so==='pop'?(b.views||0)-(a.views||0):so==='old'?(a.date<b.date?-1:a.date>b.date?1:0):(a.date<b.date?1:a.date>b.date?-1:0)});
 $('list').innerHTML=list.length?list.map(tile).join(''):'<p class="empty">Brak filmów dla tych filtrów.</p>';
 var u=$('ur');if(u){var r=isRead(u.getAttribute('data-id'));u.textContent=r?'Oznacz jako nieprzeczytane':'Oznacz jako przeczytane'}
}
function setRead(id,r){state[id]={r:r,t:Date.now()};lsSet(LS,state);lsSet(LSD,true);render();schedulePush()}
// modal + historia: #v=ID
var cur=null, pushed=false, lastFocus=null;
function hashId(){var m=/^#v=([\w-]+)$/.exec(location.hash);return m&&BY[m[1]]?m[1]:null}
function openM(id){
 var v=BY[id];if(!v)return;
 if(cur!==id){$('dlg').innerHTML=body(v);$('ov').scrollTop=0}
 cur=id;$('ov').classList.add('on');$('ov').setAttribute('aria-hidden','false');document.body.classList.add('lock');
 document.title=(v.title_pl||v.title)+' - Streszczenia YouTube';
 if(!isRead(id))setRead(id,true);
 var x=$('x');if(x)x.focus({preventScroll:true});
}
function closeM(){
 if(!cur)return;var id=cur;cur=null;
 $('ov').classList.remove('on');$('ov').setAttribute('aria-hidden','true');document.body.classList.remove('lock');
 document.title='Streszczenia YouTube';
 var t=document.querySelector('.tile[data-id="'+id+'"]');if(t)t.focus({preventScroll:true});
}
function requestClose(){
 if(pushed){pushed=false;history.back()}
 else{history.replaceState(null,'',location.pathname+location.search+'#s='+sec);closeM()}
}
function hashSec(){var m=/^#s=([\w-]+)$/.exec(location.hash);return m&&SN[m[1]]?m[1]:null}
function route(){var id=hashId();if(id){openM(id);return}var k=hashSec();if(k&&k!==sec){sec=k;$('q').value='';render();window.scrollTo(0,0)}closeM()}
window.addEventListener('hashchange',route);
window.addEventListener('popstate',function(){if(!hashId())pushed=false;route()});
$('list').addEventListener('click',function(e){
 var t=e.target.closest('.tile');if(!t)return;
 if(e.metaKey||e.ctrlKey||e.shiftKey||e.button)return;
 e.preventDefault();var id=t.getAttribute('data-id');
 if(hashId()!==id){history.pushState(null,'','#v='+id);pushed=true}
 openM(id);
});
$('ov').addEventListener('click',function(e){
 if(e.target===$('ov')){requestClose();return}
 var g=e.target.closest('.bdg');if(g){var fx=$(g.getAttribute('data-fx'));var o=g.getAttribute('aria-expanded')!=='true';g.setAttribute('aria-expanded',o?'true':'false');if(fx)fx.hidden=!o;return}
 var b=e.target.closest('.x,.ur,.tag');if(!b)return;
 if(b.classList.contains('x'))requestClose();
 else if(b.classList.contains('ur')){var id=b.getAttribute('data-id');setRead(id,!isRead(id))}
 else if(b.classList.contains('tag')){$('q').value=b.getAttribute('data-tag');requestClose();render();window.scrollTo(0,0)}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&cur){e.preventDefault();requestClose()}});
var tm;$('q').addEventListener('input',function(){clearTimeout(tm);tm=setTimeout(render,150)});
['fr','so'].forEach(function(k){$(k).addEventListener('change',render)});
$('secs').addEventListener('click',function(e){var c=e.target.closest('.chip');if(!c)return;e.preventDefault();var k=c.getAttribute('data-s');
 if(location.hash!=='#s='+k)history.pushState(null,'','#s='+k);pushed=false;sec=k;$('q').value='';render();window.scrollTo(0,0)});
function setSync(ok,msg){var s=$('sync');s.className='sync '+(ok?'ok':'off');s.textContent=msg}
function hhmm(){var d=new Date();return (d.getHours()<10?'0':'')+d.getHours()+':'+(d.getMinutes()<10?'0':'')+d.getMinutes()}
function req(url,opt,ms){
 var ctl=window.AbortController?new AbortController():null; opt=opt||{}; if(ctl)opt.signal=ctl.signal;
 var to=setTimeout(function(){if(ctl)ctl.abort()},ms||8000);
 return fetch(url,opt).then(function(r){clearTimeout(to);if(!r.ok)throw new Error('HTTP '+r.status);return r.text()})}
function pull(){return req(API+encodeURIComponent(KEY)+'?_='+Date.now(),{cache:'no-store'}).then(function(t){t=(t||'').trim();if(!t)return {};var o=JSON.parse(t);if(typeof o!=='object'||!o)throw new Error('zły format');return o})}
function write(obj){return req(API+'update',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'key='+encodeURIComponent(KEY)+'&value='+encodeURIComponent(JSON.stringify(obj))}).then(function(t){var o=JSON.parse(t);if(o.status!==1)throw new Error('zapis odrzucony')})}
var busy=false, again=false, pt;
function schedulePush(){clearTimeout(pt);pt=setTimeout(sync,600)}
function sync(){
 if(busy){again=true;return}
 busy=true;
 pull().then(function(remote){
  if(merge(state,remote)){lsSet(LS,state);render()}
  if(!same(state,remote)||lsGet(LSD,false))return write(state).then(function(){lsSet(LSD,false)});
 }).then(function(){setSync(true,'zsynchronizowano '+hhmm())},function(){setSync(false,'offline - zapis lokalny')})
 .then(function(){busy=false;if(again){again=false;sync()}});
}
if(hashSec())sec=hashSec();render();route();
req('read.json?_='+Date.now(),{cache:'no-store'},5000).then(function(t){var o=JSON.parse(t||'{}');if(merge(state,o)){lsSet(LS,state);render()}}).catch(function(){}).then(sync);
document.addEventListener('visibilitychange',function(){if(!document.hidden)sync()});
window.addEventListener('online',sync);
setInterval(function(){if(!document.hidden)sync()},120000);
})();
</script>
</body>
</html>
