, np. pisanie opowiadań. Z DeepSeek przyszło lżejsze GRPO zamiast ciężkiego PPO (mniej modeli równoległych)."},{"t":"Mit \"polski jest magiczny\" do AI","d":"**Według Kinasa język polski nie jest lepszy do trenowania AI niż angielski; sensacyjne paper'y trzeba czytać podejrzliwie.** W dużych modelach tokeny PL to ułamek (rzędu 0,1%). Przy RL model wolał rozwiązywać matematykę po angielsku (krótsze łańcuchy myśli); dopiero dodatkowa nagroda zmusiła go do polskiego, przy czym zużywał więcej tokenów.\n\nTest Ruler (długi kontekst) z Cornell/Microsoft uznał za źle zaprojektowany: różne teksty źródłowe per język, wniosek z jednego testu."},{"t":"GPU: mnożenie macierzy, nie \"gry\"","d":"**LLM to według Kinasa w ok. 80% mnożenie macierzy; GPU historycznie pod to podkręcano (gry = tensory pikseli).** Wąskim gardłem bywa pamięć (HBM) i transfer wewnątrz GPU (memory-bound), nie same teraflopsy.\n\nPolska: Helios, Atena, planowane Piast/Gaja - tysiące, nie setki tysięcy GPU jak w big labach. Z NVIDIA: pruning Minitron 11B->7B i destylacja oraz pipeline deduplikacji korpusu (exact, fuzzy LSH, semantyczna)."},{"t":"Czarna skrzynka i wyjaśnialność","d":"**Matematycznie znamy funkcję; nie wiemy, \"dlaczego model tak myśli\" ani czy nie ma ukrytych intencji.** Badania Anthropic o ukrywaniu celów; Kinas chwali polskie prace nad explainable AI (m.in. Przemysław Biecek, kontekst Naskręckiego na PW).\n\nBez wyjaśnialności + samouczenie + interakcja ze światem = ryzyko utraty kontroli. Świadomości w modelu \"nie widzi\"; patrzy matematycznie, ostrzega przed antropomorfizacją."},{"t":"AI w biotech i Ingenic AI","d":"**Firma celuje w drug development: multimodalność na wielu skalach biologii (molekuła-komórka-organizm), by przyspieszyć odkrywanie i łączenie leków.** Biologia to \"modelowanie szumu\"; trzy miesiące nad ekspresją genów po perturbacji pokazały, jak trudno złapać wzorzec.\n\nNagrody Nobla 2024 (AlphaFold / Hinton) jako sygnał, że AI w life science zostaje. Kinas: AI na konferencjach klinicznych często brzmij jak 2021-22 - duże zainteresowanie, opóźnienie wdrożeń."},{"t":"Życzenie na 2026: wyrównanie kompetencji","d":"**Chce, by laby wyrównały jakość: model rozwiązuje FrontierMath, a wywala się na policzeniu \"r\" w strawberry.** Kodowanie z AI: na początku 2025 frustrujące, pod koniec roku narzędzia skoczyły tak, że ~50% kodu idzie z AI.\n\nTest: najlepsze modele pro nie przebiły bioinformatyczki w podbiciu metryk perturbacji. Zapowiada nowe, większe Bieliki i chińskie releasy wokół Nowego Roku."}],"conclusion":"Kinas broni lokalnego polskiego LLM jako infrastruktury, nie konkurenta GPT w chacie, i łączy to z AI w lekach. Puenta: bez explainability i wyrównania kompetencji skalowanie AGI jest ryzykowne. Czeka na lepsze Bieliki i narzędzia 2026.","factchecks":[{"claim":"Helios w Cyfronecie to jeden z największych superkomputerów w PL (Grace Hopper)","verdict":"prawda","note":"ACK Cyfronet AGH eksploatuje Heliosa na GPU NVIDIA Grace Hopper.","p":1,"src":[["Wikipedia (ang.): Cyfronet - hasło \"Academic Computer Centre CYFRONET AGH\"","https://en.wikipedia.org/wiki/Academic_Computer_Centre_CYFRONET_AGH"],["Cyfronet: Helios","https://www.cyfronet.pl/"]]},{"claim":"Bielik to otwarty polski LLM rozwijany oddolnie","verdict":"prawda","note":"Projekt SpeakLeash/Bielik publikuje modele open weights pod język polski.","p":0,"src":[["Hugging Face: Bielik","https://huggingface.co/speakleash"],["SpeakLeash / Spichlerz","https://speakleash.org/"]]},{"claim":"Nobla 2024 z chemii za AlphaFold i prace Hintona/Hassabisa","verdict":"prawda","note":"Nagroda Nobla z chemii 2024: Baker, Hassabis, Jumper (AlphaFold).","p":6,"src":[["Nobel Prize: Chemistry 2024","https://www.nobelprize.org/prizes/chemistry/2024/summary/"],["Wikipedia (ang.): AlphaFold - hasło \"AlphaFold\"","https://en.wikipedia.org/wiki/AlphaFold"]]},{"claim":"DeepSeek spopularyzował GRPO jako lżejszą alternatywę PPO","verdict":"prawda","note":"GRPO opisane w pracach DeepSeek jako group relative policy optimization.","p":2,"src":[["arXiv: DeepSeekMath / GRPO","https://arxiv.org/abs/2402.03300"]]}],"bias":"Gość współtworzy Bielika i pracuje w Ingenic AI - ton pro-PL open source. Reklamy/sponsorzy kanału w odcinku (IKE/BOŚ bywa w Didaskaliach); tu silny wątek patriotyczny."},{"id":"S6rqpxVGKZ4","title_pl":"Gdybym mógł robić tylko 25 ćwiczeń - ranking Jeffa Nipparda","title":"The Only 25 Exercises You Ever Need","channel":"Jeff Nippard","url":"https://www.youtube.com/watch?v=S6rqpxVGKZ4","date":"2026-01-13","duration":1395,"views":5602872,"section":"Sport","transcript":"youtube","added":"2026-11-03","tags":["Ciało i zdrowie","Siłownia","Trening"],"about":"Jeff Nippard układa ranking 25 ćwiczeń do zbudowania pełnej sylwetki i przy każdym próbuje pobić rekord.","intro":"Jeff Nippard, trener i kulturysta naturalny, wybiera 25 ćwiczeń, które jego zdaniem wystarczą do zbudowania całej sylwetki. Przy każdym tłumaczy, dlaczego jest na liście, cytuje badania i próbuje pobić własny rekord. Pierwsza dziesiątka to zestaw na wypadek, gdyby ktoś miał czas tylko na 10 ćwiczeń.","points":[{"t":"Zaniedbane mięśnie: łydki, przedramiona, szyja","d":"Wspięcia na palce na stojąco działają według badań lepiej niż na siedząco. Uginania nadgarstków robi w superserii, a szyję radzi trenować bezpośrednio 2 razy w tygodniu po 10-15 powtórzeń, bo martwy ciąg jej nie rozbuduje."},{"t":"Izolacja z kontrolą","d":"Spięcia brzucha na wyciągu łatwo stopniowo dociążać, a butterfly odcina przednie barki z linii ciągu. Rekord liczy się tylko przy tej samej technice i kontrolowanej fazie opuszczania."},{"t":"Pompki na poręczach i hip thrust","d":"Dipy budują klatkę, barki i triceps, ale przy szczypaniu w barku warto pochylić się bardziej i schodzić płycej. Hip thrust lub maszyna daje mocny bodziec pośladkom bez męczenia czworogłowych."},{"t":"Martwy ciąg, OHP i wyciskanie","d":"Nie są najlepsze pod sam przyrost mięśni, ale każdy powinien raz w życiu nauczyć się ich i zrobić się w nich silny. Kluczem jest zapisywanie wyników i dokładanie ciężaru lub powtórzenia co tydzień."},{"t":"Wykroki chodzone","d":"Badań jest mało, ale z jego doświadczenia nic tak nie męczy pośladków. Długi krok to więcej pośladków, krótszy krok z kolanem do przodu to więcej czworogłowych."},{"t":"Top 10: nogi","d":"Uginanie nóg na siedząco dało w badaniu ok. 50% więcej przyrostu dwugłowych niż na leżąco. Prostowanie nóg z odchylonym oparciem najlepiej trafia w mięsień prosty uda i jest bezpieczne dla kolan."},{"t":"Top 10: ręce i barki","d":"Prostowanie ramion nad głową dało ok. 40% więcej przyrostu tricepsa niż prostowanie na wyciągu w dół. Uginanie na modlitewniku trudno oszukać, a unoszenia bokiem najlepiej robić na wyciągu."},{"t":"Top 5: wiosłowanie, RDL, skos","d":"Wiosłowanie z podparciem klatki chroni lędźwie przed byciem ograniczeniem. Rumuński martwy ciąg mniej męczy niż klasyczny, a wyciskanie na ławce skośnej 20-45 stopni łączy pracę barków i klatki."},{"t":"Podciąganie i przysiad","d":"Podciąganie trudno oszukać, a na start nie ma wstydu w asyście. Numer 1 to przysiad, bo większość masy mięśniowej jest w nogach; w dowolnej wersji, uzupełniony o uginanie i prostowanie nóg."}],"conclusion":"Prawie każde ćwiczenie działa, jeśli robisz je ciężko, z dobrą techniką i stopniowo dokładasz ciężar.","factchecks":[{"claim":"Wspięcia na palce na stojąco są skuteczniejsze dla łydek niż na siedząco.","verdict":"prawda","note":"Badanie z 2023: przyrost łydki 5,6% na stojąco vs 2,1% na siedząco, płaszczkowaty podobnie.","p":0,"src":[["PubMed: Kinoshita i wsp. 2023 - \"Triceps surae muscle hypertrophy is greater after standing versus seated calf-raise training\"","https://pubmed.ncbi.nlm.nih.gov/38156065/"]]},{"claim":"Prostowanie nad głową dało ok. 40% więcej przyrostu tricepsa niż prostowanie w dół.","verdict":"prawda","note":"Maeo i wsp. 2023: cały triceps +19,9% vs +13,9%, czyli ok. 1,4 raza więcej.","p":6,"src":[["PubMed: Maeo i wsp. 2023 - \"Triceps brachii hypertrophy is substantially greater after elbow extension training performed in the overhead arm position\"","https://pubmed.ncbi.nlm.nih.gov/35819335/"]]},{"claim":"Głównym problemem w bezdechu sennym jest tłuszcz w języku, a nie trening szyi.","verdict":"półprawda","note":"Tłuszcz w języku jest ważnym czynnikiem bezdechu, a jego spadek łączy się z poprawą, ale nie jest jedyną przyczyną.","p":0,"src":[["PubMed: Kim i wsp. 2014 - \"Tongue fat and its relationship to obstructive sleep apnea\"","https://pubmed.ncbi.nlm.nih.gov/25197815/"],["PubMed: Wang i wsp. 2020 - \"Effect of Weight Loss on Upper Airway Anatomy and the Apnea-Hypopnea Index\"","https://pubmed.ncbi.nlm.nih.gov/31918559/"]]},{"claim":"Mężczyźni mają w nogach ponad połowę masy mięśniowej (MRI).","verdict":"prawda","note":"Badanie MRI 468 osób (Janssen 2000) potwierdza, że większość mięśni szkieletowych jest w dolnej części ciała.","p":8,"src":[["PubMed: Janssen i wsp. 2000 - \"Skeletal muscle mass and distribution in 468 men and women aged 18-88 yr\"","https://pubmed.ncbi.nlm.nih.gov/10904038/"]]}],"bias":"Ranking opiera się częściowo na osobistych preferencjach, co autor sam przyznaje. Dwa długie wtrącenia reklamują jego aplikację MacroFactor."},{"id":"O2wc0Ea6YGU","title_pl":"Bartosz Naskręcki: AI brzmi mądrze, ale nie rozumie","title":"AI brzmi mądrze. Ale wciąż nie rozumie, co mówi || Bartosz Naskręcki - didaskalia#167","channel":"didaskalia","url":"https://www.youtube.com/watch?v=O2wc0Ea6YGU","date":"2025-12-28","duration":5207,"views":77216,"section":"Didaskalia","transcript":"whisper","added":"2026-11-05","tags":["Technika","Nauka","Psychologia"],"about":"Matematyk UAM i Centrum XAI PW o black boxie, dowodach z AI, FrontierMath i ryzyku outsourcingu myślenia.","intro":"Patrycjusz Wyżga rozmawia z dr. Bartoszem Naskręckim (UAM Poznań, Centrum Wyjaśnialnej AI Politechniki Warszawskiej) o tym, czym jest explainable AI i dlaczego dzisiejsze LLM-y porównuje do potwora Frankensteina.\n\nOd praktyki matematyka z chatem i formalizatorem dowodów, przez zmianę zawodu, FrontierMath i ARC, po ostrzeżenie: AI wchodzi podskórnie gorzej niż bomba, bo przyzwyczajamy się i przestajemy myśleć.","points":[{"t":"Wyjaśnialna AI vs black box","d":"**XAI: nie wystarczy, że algorytm klasyfikuje - trzeba umieć podać przyczynę decyzji na głębokim poziomie.** Centrum buduje własne modele do rozkładania; zamknięte GPT nie da się w pełni zbadać, bo wagi nie są otwarte.\n\nSieci neuronowe to uproszczona metafora mózgu sprzed dekad; mózg działa inaczej, a chatboty \"chodzą\", choć nie wiemy, czy w każdej sytuacji."},{"t":"Potwór Frankensteina i kult cargo","d":"**Skalowanie \"dodaj kończyny, będzie lepiej\" to myślenie życzeniowe bliskie kultowi cargo.** Na jednej stronie tekstu działa; na 800 stronach brak gwarancji, że znajdzie wszystko. Firmy-agenci i prawo bez explainability go martwią.\n\nMartwi też delegowanie cywilizacji do systemów, które zawodzą w marginesie przypadków (samochody, loty, państwo)."},{"t":"Jak matematyk używa AI","d":"**Przepuszcza prace przez model szukając luk w definicjach; to nie silnik dedukcji, tylko skojarzenia \"na czuja\".** Porównuje do fizyka z intuicją bez formalnego dowodu. Raz znalazł literaturę nieosiągalną klasyczną wyszukiwarką formuł.\n\nCzęściej frustruje: część OK, dużo do poprawy. Modele \"rozumujące\" od ok. marca - początkowy szok, potem oswojenie."},{"t":"Chat + formalizator = nowe twierdzenie","d":"**Dał zagadkę z teorii grup (inspiracja grą); GPT zhalucynował szkic, drugi model (\"Arystoteles\") sformalizował dowód, który się skompilował (~15 h).** Udział: pomysł i prompt, nie klasyczne autorstwo. Praca na GitHubie; nieskończenie wiele przypadków, nie brute-force.\n\nMartwi, że model czasem znajduje pomysł, nie tylko układa cegły. Matematyka może przejść od budowania cegła-po-cegle do \"hodowli teorii\"."},{"t":"Czy studia i zawód mają sens","d":"**Za 10 lat kreatywność nadal ważna; studia uczą szybkiego, twórczego myślenia także poza zawodem.** Komentarz w Nature Physics z Kenono: kto mądrze użyje AI, wyprzedzi resztę. Obawa: przyjemność zostanie, pensja nie; compute to złoto.\n\nOutsourcing myślenia może nas ogłupić. Lepiej myśleć \"na wszelki wypadek\", bo nie wiemy, jak działa myślenie."},{"t":"Dlaczego matematyka, nie humanistyka","d":"**Mylił się sądząc, że LLM zabije humanistykę: matematyka ma twardą weryfikację (jak kod), więc modele da się uczyć gry formalnej.** Filozofowie: po dłuższej rozmowie model się upodabnia, mało oryginalności.\n\nDalej: systemy neurosymboliczne, benchmark ARC (wzorce wizualne łatwe dla ludzi, trudne dla LLM). World models (LeCun) jako kierunek 2026 zamiast samego tekstu."},{"t":"Tempo: od GPT do olimpiady","d":"**2022-23: teksty i wolne programowanie; 2024 AlphaGeometry (DeepMind) bez ludzkiej wiedzy na geometrii; 2025 olimpiada i formalizacja dowodów przewracają kolejne \"to się nie uda\".** Czeka na modele świata.\n\nAnalogia Dune / Wall-E: świadoma decyzja, by nie oddać myślenia maszynom; regulacje jak przy klonowaniu; AI slop jako koszt uboczny."},{"t":"Gorzej niż bomba; higiena użycia","d":"**Bomba zawsze wygląda na groźną; AI wchodzi niewinnie, przyzwyczajamy się (lotnisko = setki algorytmów) i zapominamy.** Ryzyko: modele trenowane pod propagandę firm/państw; ewolucja nie dała obrony przed takimi pokusami.\n\nRady: wyłączyć głęboką historię dopasowania do usera; nie pytać o psychologię/emocje; traktować jako algorytm, nie osobę; świadomie schodzić z kolein promptów. Autor zadania w FrontierMath (50 hard problems)."}],"conclusion":"Naskręcki: korzystaj z AI jako wspomagacza matematyki, ale trzymaj explainability i własną praktykę myślenia. Oddanie zarządzania cywilizacją dzisiejszym modelom to droga do katastrofy. Puenta: lepiej myśleć, nawet gdy narzędzie kusi skrótem.","factchecks":[{"claim":"FrontierMath to zestaw trudnych zadań do testowania AI","verdict":"prawda","note":"Benchmark Epoch AI; Naskręcki jest współautorem zadań.","p":7,"src":[["Epoch AI: FrontierMath","https://epoch.ai/frontiermath"],["Wikipedia (ang.): nie zawsze; strona projektu","https://epoch.ai/blog/frontiermath"]]},{"claim":"AlphaGeometry (DeepMind) rozwiązuje geometrię olimpijską","verdict":"prawda","note":"System neurosymboliczny DeepMind do dowodów geometrii euklidesowej.","p":6,"src":[["Nature: AlphaGeometry","https://www.nature.com/articles/s41586-023-06747-5"],["Wikipedia (ang.): AlphaGeometry - hasło \"AlphaGeometry\"","https://en.wikipedia.org/wiki/AlphaGeometry"]]},{"claim":"ARC to benchmark wzorców trudny dla LLM, łatwiejszy dla ludzi","verdict":"prawda","note":"Abstraction and Reasoning Corpus (Chollet) mierzy generalizację, nie skale tekstu.","p":5,"src":[["Wikipedia (ang.): Abstraction and Reasoning Corpus","https://en.wikipedia.org/wiki/Abstraction_and_Reasoning_Corpus"]]},{"claim":"Centrum wyjaśnialnej AI działa przy PW","verdict":"prawda","note":"IDEAS NCBR / struktury PW rozwijają explainable AI; Biecek i współpracownicy.","p":0,"src":[["Politechnika Warszawska / MI2","https://mi2.ai/"],["Wikipedia (ang.): Explainable AI - hasło \"Explainable artificial intelligence\"","https://en.wikipedia.org/wiki/Explainable_artificial_intelligence"]]}],"bias":"Gość buduje XAI i układa FrontierMath - pesymista co do black boxa. Sponsor na wejściu: BOŚ (IKE/IKZE). Ton ostrzegawczy, mało hype'u korporacyjnego."},{"id":"MgswDy8PMAA","title_pl":"Czym jest rachatłukum? Prawdziwy osmański przepis","title":"What is Turkish Delight? How to make real Ottoman Turkish Delight.","channel":"Tasting History with Max Miller","url":"https://www.youtube.com/watch?v=MgswDy8PMAA","date":"2025-12-09","duration":1379,"views":4036962,"section":"Historia","transcript":"youtube","added":"2026-11-03","tags":["Historia"],"about":"Max Miller robi rachatłukum według osmańskiego przepisu z 1844 r. i opowiada historię słodyczy od pałacu sułtana po Narnię.","intro":"Max Miller z Tasting History zaczyna od Edmunda z Opowieści z Narnii, który zdradza rodzeństwo za rachatłukum. Gotuje słodycz według przepisu Mehmeda Kâmila z 1844 r., z wodą różaną i piżmem, a w trakcie opowiada o teoriach pochodzenia, cukierniku Hacı Bekirze, sporze z Grekami, relacjach podróżników i podróbkach z Anglii.","points":[{"t":"Edmund i Narnia","d":"Akcja Lwa, czarownicy i starej szafy toczy się w czasie wojny, gdy cukier w Wielkiej Brytanii był racjonowany. Nic dziwnego, że Edmund chciał kawałka cukru obsypanego cukrem pudrem."},{"t":"Przepis z 1844 r.","d":"Po osmańsku słodycz nazywała się rahat ul-hulkum, \"ukojenie gardła\". Długo tajne pałacowe przepisy ujawnił w 1844 r. Mehmed Kâmil: syrop z 1 kg cukru i 3 kg wody, skrobia, woda różana z ziarnkiem piżma, tacka natłuszczona olejem migdałowym i obtoczenie w skrobi z cukrem pudrem."},{"t":"Wersja domowa","d":"Autor zmniejsza przepis do 700 g cukru, 350 ml wody, 3,5 g kwasku cytrynowego (zapobiega krystalizacji), 140 g skrobi w 1 l wody, łyżki wody różanej i 1/8 łyżeczki płynnego piżma spożywczego, które pachnie mu jak czyste pranie."},{"t":"Godziny mieszania","d":"Syrop podgrzewa się powoli do ok. 121°C (stadium twardej kuli), dodaje rozmieszaną skrobię i gotuje na małym ogniu 1,5-2 godziny, aż masa zrobi się bursztynowa. Dawniej 2 osoby mieszały na zmianę 2-3 godziny; potem masę studzi się w formie 28 x 18 cm co najmniej 5 godzin."},{"t":"Lekarstwo czy pudding","d":"W XV w. na Bliskim Wschodzie lokum oznaczało leki mieszane z cukrem i wodą różaną, a z czasem lek usunięto. Inna teoria wywodzi słodycz od budyniu helva, a legenda przypisuje ją XVII-wiecznemu poecie Nevizâde Atâyî; autor zaznacza, że dokumentów na to brak."},{"t":"Hacı Bekir","d":"Firma cukiernika Hacı Bekira, działająca do dziś, twierdzi, że współczesną wersję wymyślił w 1777 r. w Stambule. Sułtan Mahmud II tak lubił jego różaną, pomarańczową i pistacjową wersję, że mianował go nadwornym cukiernikiem."},{"t":"Spór z Grekami","d":"Grecy twierdzą, że słodycz wymyślono na Cykladach. Według autora raczej przywieźli ją uchodźcy z Chios na Syros w latach 20. XIX w.; w 1832 r. było tam już kilku producentów loukoumi z mastyksem."},{"t":"Relacje podróżników","d":"Lekarz marynarki USA James De Kay w latach 30. XIX w. zachwycał się masą, która rozpływa się w ustach, a markiza Londonderry nie odważyła się spróbować \"lumps of delight\". Ta angielska nazwa przyjęła się, a u Dickensa w Tajemnicy Edwina Drooda Rosa kupuje je w sklepie."},{"t":"Podróbki z żelatyną","d":"Import był drogi, więc w Anglii robiono podróbki, np. przepis z 1897 r. z żelatyną, przez co słodycz była gumowata. W 1888 r. w procesie o podrabiane rachatłukum sędzia był \"boleśnie zaskoczony\", że nie pochodzi ono z Turcji."},{"t":"Ocena","d":"Prawdziwe rachatłukum trzeba ugryźć raz czy dwa i zaczyna się rozpuszczać. Piżmo według autora równoważy mydlany posmak wody różanej; poleca też wersje z pistacjami, wanilią czy wodą z kwiatu pomarańczy."}],"conclusion":"Prawdziwe rachatłukum nie ma żelatyny i rozpływa się w ustach; najlepiej kupić je w Turcji lub Grecji albo zrobić samemu.","factchecks":[{"claim":"W czasie II wojny światowej cukier w Wielkiej Brytanii był racjonowany.","verdict":"prawda","note":"Cukier objęto kartkami od stycznia 1940 r. do 1953 r.","p":0,"src":[["Wikipedia (ang.): racjonowanie w Wielkiej Brytanii - hasło \"Rationing in the United Kingdom\"","https://en.wikipedia.org/wiki/Rationing_in_the_United_Kingdom"]]},{"claim":"Mehmed Kâmil wydał w 1844 r. jedną z pierwszych osmańskich książek kucharskich.","verdict":"prawda","note":"Melceü't-Tabbâhîn z 1844 r. uchodzi za pierwszą drukowaną turecką książkę kucharską.","p":1,"src":[["Wikipedia (ang.): kuchnia osmańska - hasło \"Ottoman cuisine\"","https://en.wikipedia.org/wiki/Ottoman_cuisine"]]},{"claim":"Firma Hacı Bekira istnieje od 1777 r. i twierdzi, że stworzyła współczesne rachatłukum.","verdict":"prawda","note":"Firma działa do dziś; jej rola jako wynalazcy to tradycja rodzinna, bez pewnych dokumentów.","p":5,"src":[["Wikipedia (ang.): rachatłukum - hasło \"Turkish delight\"","https://en.wikipedia.org/wiki/Turkish_delight"]]},{"claim":"\"Lumps of delight\" pojawiają się w Tajemnicy Edwina Drooda Dickensa.","verdict":"prawda","note":"Scena z Rosą Bud jest w 3. rozdziale ostatniej, niedokończonej powieści Dickensa (1870).","p":7,"src":[["Projekt Gutenberg: Tajemnica Edwina Drooda (tekst ang.)","https://www.gutenberg.org/ebooks/564"]]},{"claim":"Rupert Holmes napisał musical Edwin Drood i piosenkę Escape.","verdict":"prawda","note":"Musical z 1985 r. ma kilka zakończeń wybieranych przez widzów; Escape to przebój z 1979 r.","p":null,"src":[["Wikipedia (ang.): Rupert Holmes - hasło \"Rupert Holmes\"","https://en.wikipedia.org/wiki/Rupert_Holmes"]]}],"bias":"Rzetelny i ostrożny przy legendach o pochodzeniu; dygresje (musical) i dłuższa reklama garnka."},{"id":"MT9ZeE5JJsI","title_pl":"7 rzeczy, które pomogły barkom Jeffa Nipparda rosnąć","title":"7 Things That Helped My Shoulders Grow","channel":"Jeff Nippard","url":"https://www.youtube.com/watch?v=MT9ZeE5JJsI","date":"2025-12-01","duration":846,"views":3850023,"section":"Sport","transcript":"youtube","added":"2026-11-04","tags":["Ciało i zdrowie","Siłownia","Trening"],"about":"Jeff Nippard: cue od trapów, częstotliwość, ciężki press, niższa waga, różne długości mięśnia, progresja i 7 segmentów delty.","intro":"Siedem tipów na \"3D delts\" od Jeffa Nipparda: wyłączanie trapów cue o łopacie, częstszy trening barków, brutalnie silny shoulder press, obniżenie talii (niska tkanka tłuszczowa), praca w skróceniu i wydłużeniu, dopasowana progresja obciążenia oraz celowanie we wszystkie segmenty delty z anatomii kadawerów.","points":[{"t":"Wyłącz trapy cue o łopacie","d":"Wyobraź sobie długą łopatę i zgarnianie piasku na bok: barki w dół, zamach na bok zamiast szrugu. W improwizowanym teście na siłowni każdy czuł więcej side delt przy tym cue niż przy \"po prostu podnieś\"."},{"t":"Trenuj barki częściej","d":"Ankieta widzów: większość 2x/tydzień, tylko 11% 3x, 4% więcej. Efektywna objętość na sesję kapuje ok. 6-8 serii (meta nawet do 11, ale z malejącymi zwrotami). Lepiej rozłożyć na 3-4 dni; izolacje wracają w 24-48 h."},{"t":"Brutalnie silny shoulder press","d":"Maszyna, hantle lub sztanga: 5-6 powtórzeń, dokładaj co tydzień przez rok. Napięcie mechaniczne napędza hipertrofię. EMG autora: na jego maszynie więcej side niż front delt; press uzupełnia laterale, które trudno dociążać w nieskończoność."},{"t":"Obniż talię","d":"Porównanie 20% vs 9% BF: przy niższej wadze barki wyglądają szersze i bardziej 3D przez mniejszy obwód talii i mniej tłuszczu na delcie. Według autora to największy efekt wizualny z całej listy."},{"t":"Różne długości mięśnia","d":"Badania na quadach, bicepsie i łydkach: 130-190% więcej wzrostu przy dłuższej długości. Na deltach 8-tyg. kabel vs hantel bez różnicy. Fix: głębiej w pressie, kabel cross-body, Y raise, tylne delty z przekroczeniem środka."},{"t":"Progresja pod ćwiczenie","d":"Press: liniowo +2-5 kg przy stałych 5-6 powtórzeniach, deload co 4-8 tygodni. Laterale: double progression 10-12, potem ciężar. Gdy forma pada - zmień narzędzie (hantel→kabel→maszyna) i zacznij progresję od nowa."},{"t":"Siedem segmentów delty","d":"Badanie 60 kadawerów: zamiast 3 głów - 7 segmentów z osobnymi ścięgnami (przód 3, środek 1, tył 3). Dodaj płaszczyzny pośrednie: incline DB Y raise (A2/A3), 45° cable rear pull jak wyciąganie strzały (P1/P2)."}],"conclusion":"Częściej, ciężki press, mniej tłuszczu na talii i świadoma praca we wszystkich płaszczyznach barku dają więcej niż same laterale.","factchecks":[{"claim":"Deltoid ma więcej niż trzy klasyczne głowy: badanie kadawerów wskazuje segmenty.","verdict":"prawda","note":"Anatomia opisuje przednią, boczną i tylną głowę; prace kadawerowe wyróżniają dodatkowe segmenty funkcjonalne.","p":6,"src":[["Wikipedia (ang.): mięsień naramienny - hasło \"Deltoid muscle\"","https://en.wikipedia.org/wiki/Deltoid_muscle"]]},{"claim":"Napięcie mechaniczne to główny bodziec hipertrofii; progresywne przeciążenie jest kluczowe.","verdict":"prawda","note":"Progresywne przeciążenie i napięcie mechaniczne są centralne w modelach hipertrofii.","p":[2,5],"src":[["Wikipedia (ang.): hipertrofia - hasło \"Hypertrophy\"","https://en.wikipedia.org/wiki/Hypertrophy"],["Wikipedia (ang.): progresywne przeciążenie - hasło \"Progressive overload\"","https://en.wikipedia.org/wiki/Progressive_overload"]]},{"claim":"Dłuższa długość mięśnia daje 130-190% więcej wzrostu (quady, biceps, łydki).","verdict":"półprawda","note":"Kierunek efektu lengthened training jest wspierany, ale konkretne procenty zależą od badań i nie uogólniają się 1:1 na delty.","p":4,"src":[["Wikipedia (ang.): hipertrofia mięśniowa - hasło \"Hypertrophy\"","https://en.wikipedia.org/wiki/Hypertrophy"]]},{"claim":"Po 6-8 seriach na mięsień w jednej sesji zwroty mocno maleją.","verdict":"półprawda","note":"Są meta-analizy o malejących zwrotach objętości, ale próg \"6-8\" to heurystyka, nie uniwersalne prawo.","p":1,"src":[["PubMed: Pelland i wsp. - meta-regresja objętości i hipertrofii","https://pubmed.ncbi.nlm.nih.gov/41343037/"]]}],"bias":"Dwa długie bloki reklamują MacroFactor i zapowiedź MacroFactor Workouts (styczeń 2026). Tip o \"talii\" to głównie redukcja, nie trening barków."},{"id":"4-eqMGKNS4E","title_pl":"Latarnia Aleksandrii: najwyższa starożytna wieża","title":"The Lighthouse of Alexandria | The Tallest Ancient Tower","channel":"toldinstone","url":"https://www.youtube.com/watch?v=4-eqMGKNS4E","date":"2025-11-07","duration":540,"views":60700,"section":"Historia","transcript":"youtube","added":"2026-11-06","tags":["Historia","Technika"],"about":"toldinstone o Faros: budowa, funkcja nawigacyjna, trzęsienia ziemi i zniknięcie jednego z Siedmiu Cudów.","intro":"Garrett Ryan opisuje Latarnię na Faros w Aleksandrii - według starożytnych jedną z najwyższych wież świata antycznego i jeden z Siedmiu Cudów.\n\nOdcinek idzie od kontekstu portu Ptolemeuszy, przez konstrukcję i światło, po serie trzęsień, które zamieniły cud w ruinę i później w kamień wtórnie użyty.","points":[{"t":"Po co Faros","d":"**Aleksandria potrzebowała widocznego znaku dla statków na płaskim egipskim wybrzeżu bez naturalnych landmarków.** Latarnia na wyspie Faros prowadziła do portów i reklamowała potęgę Ptolemeuszy.\n\nWysokość w źródłach bywa wyolbrzymiana, ale rząd wielkości setek stóp czynił ją dominantą horyzontu."},{"t":"Budowa i światło","d":"**Wieża miała stopnie/tarasy, na szczycie ogień i prawdopodobnie lustra wzmacniające sygnał.** Wejście i rampy obsługiwały dowóz paliwa.\n\nAutor ostrożnie oddziela to, co wiemy z opisów i monet, od późniejszych legend o \"palącym okręty\" zwierciadle."},{"t":"Upadek","d":"**Seria trzęsień ziemi (zwłaszcza XIV w.) obaliła resztki; Kamienie poszły m.in. do fortu Qaitbay.** Dziś nurkowie i archeolodzy znajdą bloki w porcie.\n\nPuenta: cud zniknął nie przez jedną bitwę, tylko przez geologię i recycling budowlany."}],"conclusion":"Faros był infrastrukturą i propagandą naraz. Gdy ziemia się zatrzęsła, Aleksandria straciła zarówno cud, jak i latarnię w dosłownym sensie.","factchecks":[{"claim":"Latarnia Aleksandrii na Faros należała do antycznych Siedmiu Cudów.","verdict":"prawda","note":"Standardowa lista cudów obejmuje Pharos of Alexandria.","p":0,"src":[["Wikipedia (ang.): Lighthouse of Alexandria","https://en.wikipedia.org/wiki/Lighthouse_of_Alexandria"],["Wikipedia (ang.): Seven Wonders of the Ancient World","https://en.wikipedia.org/wiki/Seven_Wonders_of_the_Ancient_World"]]},{"claim":"Trzęsienia ziemi doprowadziły do ruin Farosu; kamień użyto później m.in. w forcie.","verdict":"prawda","note":"Źródła łączą upadek z trzęsieniami XIV w.; fort Qaitbay powstał na miejscu z wtórnym użyciem kamienia.","p":2,"src":[["Wikipedia (ang.): Lighthouse of Alexandria","https://en.wikipedia.org/wiki/Lighthouse_of_Alexandria"]]}],"bias":"Rekonstrukcje wysokości i luster są niepewne; film musi upraszczać spory filologiczne."},{"id":"DzjWEn2BS_k","title_pl":"Obciąłem liczbę serii o połowę - co wyszło po 100 dniach","title":"I Cut The Number Of Sets I Do In Half","channel":"Jeff Nippard","url":"https://www.youtube.com/watch?v=DzjWEn2BS_k","date":"2025-10-13","duration":1210,"views":3652369,"section":"Sport","transcript":"youtube","added":"2026-11-04","tags":["Ciało i zdrowie","Siłownia","Trening"],"about":"Jeff Nippard przez 100 dni na redukcji robił 1-2 serie na ćwiczenie. Siła i DEXA vs klasyczne 10-20 serii/mięsień/tydzień.","intro":"Eksperyment N=1: zamiast 3-4 serii na ruch autor robił 1-2 serie do upadku przez 100 dni na deficycie. Średnio ok. 6,5 serii na mięsień tygodniowo (split upper/lower/rest/upper/lower/arms). Porównuje to z wytycznymi 10-20 serii, meta-analizami objętości i własnymi wynikami DEXA oraz PR.","points":[{"t":"Co zmienił","d":"Z 3-4 serii na ćwiczenie do 1-2; klatka przykładowo 6 serii/tydzień zamiast 10-20. Średnio ~6,5 serii/mięsień/tydzień (barki 10, plecy 9, pośladki 9, quady 8). Split: upper, lower, rest, upper, lower, arms, rest przez 14 tygodni."},{"t":"Volume is king?","d":"Krieger 2010: 2-3 serie ~40% skuteczniejsze niż 1. 2016: dawka tygodniowa. Pelland: 35 badań, dawka od 4 do 43 serii z malejącymi zwrotami. Krytyka: edema, zwykle 1-2 mięśnie naraz, utrzymanie kalorii, krótkie interwencje 6-12 tygodni."},{"t":"Utrzymanie vs budowa","d":"Bickel: po 16 tyg. wysokiej objętości nóg redukcja do 1 serii/ćwiczenie 1x/tydzień (z 27 do 3) utrzymała rozmiar i siłę przez 32 tygodnie u młodych. Nowe badanie Herman: 2x full body, 1 seria, ~30 min; obie grupy rosły, failure lepiej."},{"t":"Intensywność przy niskiej objętości","d":"Przy małej liczbie serii prawie każda do upadku. Meta Robinson: bliżej failure = więcej hipertrofii. Przy wysokiej objętości ciągły failure podnosi zmęczenie i ryzyko. Autor nazywa to focus effect: wiesz, że masz 1-2 serie."},{"t":"Wyniki 100 dni","d":"Na redukcji: -ok. 2,5 kg tłuszczu i -ok. 0,8 kg masy chudej (DEXA; lean to też woda). Od dnia 30 do 100: +ok. 0,2 kg lean i -ok. 1 kg tłuszczu. Waga ~3 kg niższa, a wygląd \"pełniejszy\". PR na pendulum squat i chest press; leg extension +ok. 7 kg, bench Smith bez zmian."},{"t":"Nowa rekomendacja autora","d":"Na redukcji: niska objętość, wysoka intensywność. Na masie: nisko na większości mięśni, a jeden \"blast\" 10-20 (nawet 30) serii i rotacja co kilka miesięcy. Promuje program Minmax i MacroFactor."}],"conclusion":"Na deficycie 1-2 ciężkie serie mogą utrzymać mięśnie i siłę; objętość nie jest jedynym królem, jeśli trenujesz blisko upadku.","factchecks":[{"claim":"Meta Pelland (35 badań): więcej serii tygodniowo = więcej hipertrofii, z malejącymi zwrotami.","verdict":"prawda","note":"Meta-regresja 2024/25 potwierdza dodatnią zależność objętości i hipertrofii z diminishing returns.","p":1,"src":[["PubMed: Pelland i wsp. - Resistance Training Dose Response","https://pubmed.ncbi.nlm.nih.gov/41343037/"],["SportRXiv: preprint meta-regresji objętości Pelland","https://doi.org/10.51224/srxiv.460"]]},{"claim":"Bickel: redukcja z 27 do 3 serii/tydzień utrzymała mięśnie i siłę 32 tygodnie.","verdict":"półprawda","note":"U młodych 1/9 objętości utrzymało hipertrofię; u starszych sama siła trzymała się lepiej niż rozmiar.","p":2,"src":[["PubMed: Bickel i wsp. 2011 - Exercise dosing to retain RT adaptations","https://pubmed.ncbi.nlm.nih.gov/21131862/"]]},{"claim":"Im bliżej failure, tym więcej hipertrofii (meta Robinson).","verdict":"półprawda","note":"Bliskość do upadku pomaga, zwłaszcza przy niskiej objętości, ale nie zastępuje sensownej dawki i regeneracji.","p":3,"src":[["Wikipedia (ang.): hipertrofia - hasło \"Hypertrophy\"","https://en.wikipedia.org/wiki/Hypertrophy"]]},{"claim":"Autor stracił 5,5 lb tłuszczu i 1,8 lb lean przy niskiej objętości na redukcji.","verdict":"nie da się sprawdzić","note":"To N=1 z własnych skanów DEXA; wiarygodne jako anegdota, nie jako dowód populacyjny.","p":4,"src":[["Wikipedia (ang.): hipertrofia - hasło \"Hypertrophy\"","https://en.wikipedia.org/wiki/Hypertrophy"]]}],"bias":"Reklama Minmax (25% off) i MacroFactor. Narracja N=1 na redukcji; wyniki DEXA i PR nie zastępują RCT. Autor wcześniej chwalił wysoką objętość."},{"id":"NtZaP8VMv0c","title_pl":"Astronauta NASA sprawdził na ISS moją teorię o łańcuszku","title":"NASA tested my chain theory in space","channel":"Steve Mould","url":"https://www.youtube.com/watch?v=NtZaP8VMv0c","date":"2025-10-10","duration":903,"views":15440952,"section":"Ciekawostki","transcript":"whisper","added":"2026-11-03","tags":["Fizyka","Kosmos"],"about":"Steve Mould łączy się z Donem Pettitem na ISS, by w nieważkości sprawdzić brakujący element wyjaśnienia fontanny łańcuszkowej.","intro":"Ok. 10 lat temu Steve Mould odkrył fontannę łańcuszkową, zwaną też efektem Moulda. Jeden element jego wyjaśnienia da się sprawdzić tylko w nieważkości: czy łańcuszek poruszający się ze stałą prędkością płynie przez własny kształt. W 25-minutowej rozmowie wideo astronauta Don Pettit testuje to na Międzynarodowej Stacji Kosmicznej.","points":[{"t":"Fontanna łańcuszkowa","d":"Łańcuszek z koralików wyciągany z naczynia wznosi się łukiem nad jego krawędź. Po serii 6 filmów z ElectroBoomem wyjaśnienie Moulda uznaje się za poprawne: z naczynia działa dodatkowa siła skierowana w górę."},{"t":"Brakujący element","d":"Ta siła musi tylko równoważyć ciężar łuku. Z matematyki wynika, że szarpanie łańcuszka na drugim końcu nie zmienia kształtu łuku: bez grawitacji łańcuszek o stałej prędkości płynie przez własny kształt."},{"t":"Nieudane pomysły","d":"Łańcuszka nie da się zatrzymać nieruchomo w powietrzu, a z kłębka nie da się go wyciągać ze stałą prędkością, bo koraliki się plączą i rozpływają. Pettit porównał chaotyczny ruch łańcuszka do ruchu cząsteczek."},{"t":"Zamknięta pętla","d":"Trzeci pomysł: pętla w niekołowym kształcie, wprawiona w ruch wokół obwodu. Intuicja podpowiada, że zrobi się z niej okrąg, a teoria, że zachowa kształt."},{"t":"Wynik","d":"Pętla w dużej mierze zachowała kształt, także wygięcie w stronę Pettita, ale powoli się zaokrąglała. Symulacja Martina Beyera pokazała, że to skutek tarcia w przegubach, którego model matematyczny nie uwzględnia."},{"t":"Łańcuszek a sznurek","d":"Nitka i lina mają własną sztywność i prostują się, a łańcuszek z przegubami o małym tarciu zachowuje się zupełnie inaczej. Reaguje na prądy powietrza, a bez nich ustawia się wzdłuż gradientu grawitacji."},{"t":"Inne eksperymenty","d":"Pettit robi sztuczki jak z jojo, przytrzymuje koniec łańcuszka ładunkiem elektrostatycznym i pokazuje, że łańcuch ze spinaczy o ogniwach 50 mm zachowuje się jak ten z koralików o średnicy 3 mm."},{"t":"Droga na ISS","d":"Mould zapytał w filmie, jak dotrzeć do kogoś na ISS. Odezwał się Stefan z ESA, Samantha Cristoforetti zabrała w kosmos 4 m łańcuszka, a potem skontaktowała go z Pettitem."},{"t":"Rozmowa","d":"Rozmowę przez Microsoft Teams zorganizował John Stevens z NASA. Okno łączności trwało 25 minut. Pettit uznał wyjaśnienie, w tym zaokrąglanie pętli przez tarcie, za trafne."}],"conclusion":"Łańcuszek w nieważkości zachował kształt, a powolne zaokrąglanie tłumaczy tarcie w przegubach, więc teoria Moulda się broni.","factchecks":[{"claim":"Steve Mould spopularyzował fontannę łańcuszkową filmem na YouTube w 2013 r.","verdict":"prawda","note":"Zjawisko pokazywano wcześniej, np. Steve Spangler w 2009 r.; nazwa efekt Moulda pochodzi od jego filmu.","p":0,"src":[["Wikipedia (ang.): fontanna łańcuszkowa - hasło \"Chain fountain\"","https://en.wikipedia.org/wiki/Chain_fountain"]]},{"claim":"Wyjaśnienie zakłada dodatkową siłę z naczynia działającą w górę.","verdict":"prawda","note":"Biggins i Warner z Cambridge opisali ją w Proceedings of the Royal Society A w 2014 r.","p":[0,1],"src":[["Wikipedia (ang.): fontanna łańcuszkowa - hasło \"Chain fountain\"","https://en.wikipedia.org/wiki/Chain_fountain"],["Biggins, Warner: Understanding the chain fountain (Proc. R. Soc. A, 2014)","https://doi.org/10.1098/rspa.2013.0689"]]},{"claim":"Samantha Cristoforetti dowodziła misją na ISS.","verdict":"prawda","note":"Objęła dowództwo Ekspedycji 68 28 września 2022 r.","p":7,"src":[["Wikipedia (ang.): Samantha Cristoforetti - hasło \"Samantha Cristoforetti\"","https://en.wikipedia.org/wiki/Samantha_Cristoforetti"]]},{"claim":"Don Pettit przebywał wtedy na ISS.","verdict":"prawda","note":"Był w składzie Ekspedycji 71 i 72; wylądował 20 kwietnia 2025 r., w dniu 70. urodzin.","p":8,"src":[["Wikipedia (ang.): Don Pettit - hasło \"Donald Pettit\"","https://en.wikipedia.org/wiki/Donald_Pettit"]]}],"bias":"Rzetelny; Mould sam przyznaje, że pętla się zaokrąglała, i opiera wniosek o tarciu na symulacji. Krótka wzmianka o Patreonie."},{"id":"U7NHNT3M-tw","title_pl":"Paradoks hydrostatyczny: dlaczego woda \"waży\" inaczej","title":"The Hydrostatic Paradox","channel":"Steve Mould","url":"https://www.youtube.com/watch?v=U7NHNT3M-tw","date":"2025-09-30","duration":812,"views":1086797,"section":"Ciekawostki","transcript":"youtube","added":"2026-11-04","tags":["Nauka","Technika"],"about":"Steve Mould pokazuje, że siła na tłoku zależy od wysokości słupa wody, a nie od całej objętości w naczyniu.","intro":"Na wadze dwa naczynia z tłokami: 150 ml w prostym zbiorniku \"waży\" mniej niż 60 ml w lejku, a równowaga przychodzi przy tej samej wysokości wody (ok. 550 ml vs 60 ml). Autor tłumaczy prawo Stevina, ciśnienie jako siłę na pole i to, że ścianki przejmują ciężar wody poza słupem nad tłokiem - także gdy naczynie ma \"sufit\".","points":[{"t":"Dziwna waga","d":"150 ml w prostym naczyniu obniża szalę jak oczekiwano. Do lejka wchodzi tylko 60 ml, a mimo to wydaje się cięższe. Przy równowadze jest ok. 550 ml vs 60 ml - różne objętości, podobna siła na tłokach."},{"t":"Prawo Stevina","d":"Siła na tłoku to tylko ciężar słupa wody bezpośrednio nad tłokiem; wodę wokół można zignorować. W naczyniu o prostych ściankach każdy fragment dna bierze swój słup i cały ciężar się zgadza. Przy skośnych ściankach wynik zaskakuje, ale doświadczenie to potwierdza."},{"t":"Ciśnienie vs siła","d":"Autor rozróżnia potoczne mylenie \"nacisku\" z siłą: ciśnienie to siła dzielona przez pole, zdefiniowane w punkcie powierzchni. Paradoks hydrostatyczny mówi, że ciśnienie w punkcie zależy tylko od wysokości wody nad tym punktem."},{"t":"Ścianki trzymają resztę","d":"Słup nad tłokiem ma to samo ciśnienie co woda obok na tej głębokości, więc okolica nie wciska się do środka. Trójkątny pakiet przy skośnej szybie: składowa pionowa reakcji ścianki równoważy ciężar wody nad skosem. Stąd statyw z lejkiem robi się cięższy po nalaniu; przy prostym naczyniu - nie."},{"t":"Naczynie z \"sufitem\"","d":"W pojemniku zwężającym się ku górze (z otworem) siła na tłoku nie jest ciężarem samej wody w środku. 35 g wody ważyło na wadze więcej niż 35 g: ciśnienie pod szklanym \"sufitem\" odpowiada pełnej wysokości do swobodnej powierzchni, także krętą drogą."},{"t":"Uściślenie prawa","d":"Ciśnienie w punkcie zależy tylko od różnicy wysokości do swobodnej powierzchni cieczy, nie od kształtu drogi. Przy naczyniu z sufitem statyw oddaje część ciężaru na wagę (robi się lżejszy), odwrotnie niż przy lejku."},{"t":"Strumień w górę","d":"W modelach 2D z otworami woda pryska w dół z \"kieliszka\", a po odwróceniu - w górę spod sufitu, bo ciśnienie pod stropem równa się ciśnieniu u dołu wysokiego słupa. Równowaga, gdy poziomy wody po obu stronach się wyrównają."}],"conclusion":"Kształt naczynia przenosi ciężar na ścianki lub ze statywu na tłok; liczy się wysokość do powierzchni swobodnej, nie objętość.","factchecks":[{"claim":"Ciśnienie hydrostatyczne zależy tylko od głębokości (wysokości słupa), nie od kształtu naczynia.","verdict":"prawda","note":"Klasyczny paradoks hydrostatyczny / prawo Stevina: p = ρgh względem powierzchni swobodnej.","p":1,"src":[["Wikipedia (ang.): hydrostatyka - hasło \"Hydrostatics\"","https://en.wikipedia.org/wiki/Hydrostatics"],["Wikipedia (ang.): Simon Stevin - hasło \"Simon Stevin\"","https://en.wikipedia.org/wiki/Simon_Stevin"]]},{"claim":"Ciśnienie w cieczy spoczynkowej jest izotropowe (prawo Pascala).","verdict":"prawda","note":"Prawo Pascala: ciśnienie w płynie nierozciągliwym przenosi się jednakowo we wszystkich kierunkach.","p":3,"src":[["Wikipedia (ang.): prawo Pascala - hasło \"Pascal's law\"","https://en.wikipedia.org/wiki/Pascal%27s_law"]]},{"claim":"W naczyniu z sufitem 35 ml wody może \"ważyć\" więcej niż 35 g na tłoku.","verdict":"prawda","note":"Siła na dnie bywa większa lub mniejsza od ciężaru cieczy; różnicę bierze naczynie (paradoks hydrostatyczny).","p":4,"src":[["Wikipedia (ang.): paradoks hydrostatyczny - hasło \"Hydrostatic paradox\"","https://en.wikipedia.org/wiki/Hydrostatic_paradox"]]}],"bias":"Dobry eksperyment i intuicja; sponsorowana wkładka o goleniu. Autor upraszcza tarcie tłoków, ale wynik jakościowo się zgadza."},{"id":"qpRGnTTcLpo","title_pl":"7 świetnych ćwiczeń, których prawie nikt nie robi","title":"7 Amazing Exercises No One Does (ALL S TIER)","channel":"Jeff Nippard","url":"https://www.youtube.com/watch?v=qpRGnTTcLpo","date":"2025-09-27","duration":966,"views":6378697,"section":"Sport","transcript":"youtube","added":"2026-11-04","tags":["Ciało i zdrowie","Siłownia","Trening"],"about":"Jeff Nippard: dead hang, Zapman hammer curl, incline Y raise, sideways rear delt, dragon flag, Kelso shrug i seated cable deadlift.","intro":"Siedem niedocenianych ćwiczeń, które Nippard robi co tydzień: dead hang, zmodyfikowany Zapman hammer curl, incline dumbbell Y raise, one-arm rear delt na pec deck bokiem, dragon flag, Kelso shrug oraz seated cable deadlift. Autor podkreśla, że ciężka i regularna praca liczy się bardziej niż sam wybór ruchu.","points":[{"t":"Dead hang","d":"Otwiera bark, może odciążyć kręgosłup po przysiadach/martwych. Autor: max 2 min 45 s; przyjaciel z 6 s do 60 s w 30 dni (wyzwanie MrBeast). Kreda, luźniejszy chwyt na start, stopy razem. Asysta: guma lub maszyna."},{"t":"Zapman hammer curl","d":"Ekscentryka jest o ok. 40-50% silniejsza. Curl młotkiem w górę, opuszczanie w supinacji: brachialis pomaga w koncentryce, biceps bierze ekscentrykę. 8-10 powtórzeń; klasyczny curl też działa przy wolnym opuszczaniu."},{"t":"Incline dumbbell Y raise","d":"Ławka 20-30°, Y w płaszczyźnie łopatki (~30° do przodu). Hantle laterale dają peak na górze i zero na dole; Y lepiej czuje side i włókna między front a side. Nie opuszczaj do zwisu pionowego."},{"t":"Rear delt bokiem na pec deck","d":"Klasyczny reverse pec deck to półruchy w skróceniu. Siądź bokiem i przeciągnij przez środek ciała (cue Dr. Mike: \"zamiataj pieniądze\"). Alternatywy: kabel cross-body lub hantel leżąc."},{"t":"Dragon flag","d":"Klasyka Bruce'a Lee: całe ciało z ławki, biodra proste, 60-80°, 4-8 powtórzeń. Progresja: leg raises → bent-knee dragon → pełne. Stabilniejszy tors niż hanging leg raise; dieta i tak decyduje o widoczności (mężczyźni ok. 10-12% BF)."},{"t":"Kelso shrug","d":"Na T-bar z podparciem klatki: łokcie zablokowane, tylko ściągnięcie łopatek (4-5 cm ruchu), pauza 1 s. Izoluje mid traps/romboidy, gdy biceps limitował wiosłowanie. Bez maszyny: hantle na skośnej ławce."},{"t":"Seated cable deadlift","d":"Pośladki na ławce, lockout bioder, sztanga blisko ciała do kostek bez zaokrąglania lędźwi. Mniej zmęczenia niż ciężki RDL, lepszy kontakt z pośladkami/dwugłowymi. Warianty: prostsze kolana, single-leg."}],"conclusion":"Nietypowe warianty mają sens, gdy dają pełniejszy zakres, lepszą izolację lub mniejszy koszt regeneracji przy tym samym bodźcu.","factchecks":[{"claim":"Jesteś o ok. 40-50% silniejszy w ekscentryce niż w koncentryce.","verdict":"prawda","note":"Siła ekscentryczna jest systematycznie wyższa; trening ekscentryczny jest osobną kategorią adaptacji.","p":1,"src":[["Wikipedia (ang.): trening ekscentryczny - hasło \"Eccentric training\"","https://en.wikipedia.org/wiki/Eccentric_training"]]},{"claim":"Dead hang pomaga barkom i odciąża kręgosłup.","verdict":"półprawda","note":"Wiszenie poprawia tolerancję chwytu i mobilność; dowody na \"dekompresję\" i ból są głównie anegdotyczne.","p":0,"src":[["Wikipedia (ang.): podciąganie (kontekst wiszenia) - hasło \"Pull-up (exercise)\"","https://en.wikipedia.org/wiki/Pull-up_(exercise)"],["Wikipedia (ang.): stożek rotatorów - hasło \"Rotator cuff\"","https://en.wikipedia.org/wiki/Rotator_cuff"]]},{"claim":"Wiosłowanie buduje biceps słabiej niż uginania; biceps może limitować midback.","verdict":"półprawda","note":"Izolacja zwykle lepiej hipertrofiuje biceps niż compound; \"dwa razy lepiej\" to uproszczenie z filmu.","p":5,"src":[["Wikipedia (ang.): hipertrofia - hasło \"Hypertrophy\"","https://en.wikipedia.org/wiki/Hypertrophy"]]}],"bias":"Długie bloki reklamują MacroFactor (kod Jeff, free trial, AI photo macros, 350 tys. użytkowników). Ranking \"S tier\" to preferencje autora."},{"id":"bLcGL6rKBBg","title_pl":"Krawiec pokazuje najczęstsze błędy w dopasowaniu garnituru","title":"Master Tailor Reveals The Most Common Suit Mistakes - And How To Fix Them","channel":"GQ","url":"https://www.youtube.com/watch?v=bLcGL6rKBBg","date":"2025-09-23","duration":872,"views":369337,"section":"Moda","transcript":"youtube","added":"2026-11-03","tags":["Styl","Krawiectwo","Garnitur"],"about":"Ian Myers, właściciel dużej brytyjskiej pracowni szycia na miarę, omawia dla GQ typowe problemy z garniturem i ich przyczyny.","intro":"Ian Myers prowadzi największą pracownię szycia na miarę w Wielkiej Brytanii. Na modelach pokazuje, po jakich zagnieceniach poznać źle dopasowany garnitur i koszulę. Tłumaczy, skąd biorą się problemy i które da się naprawić.","points":[{"t":"Opadające ramię","d":"Ukośne fałdy na plecach oznaczają, że marynarka nie pasuje do kształtu ramion. Według niego ponad połowa ludzi ma niższe prawe ramię; krawiec obniża wtedy linię ramienia i pachę, a czasem przesuwa materiał przy szyi."},{"t":"Kwadratowe ramiona i klatka","d":"Wysokie ramiona dają fałdę pod kołnierzem. Klapy odstające od piersi to za ciasna klatka, której nie da się poszerzyć, bo nie ma zapasu; kupuj marynarkę pod klatkę, a talię zwęź."},{"t":"Odstający kołnierz i balans","d":"Głowa wysunięta do przodu lub zaokrąglone plecy rozchylają poły jak nożyczki, a wyprostowana postawa je zamyka. Naprawia się to od góry, zmieniając długość pleców i przodów."},{"t":"Rękawy i pacha","d":"Rękaw powinien sięgać nadgarstka i odsłaniać 0,6-1,3 cm mankietu koszuli; mankiet ok. 6 cm luźniejszy od nadgarstka. Nisko wycięta pacha w konfekcji ogranicza ruch i zabiera talię; wystarcza nieco ponad 2,5 cm luzu."},{"t":"Ułożenie ręki i talia","d":"Gdy ręka wisi bardziej z tyłu, rękaw marszczy się z tyłu i trzeba go obrócić. Poziome fałdy na przodzie to za ciasna talia, za luźna daje pudełkowaty kształt."},{"t":"Długość marynarki","d":"Za krótka odsłania pośladki i krocze, za długa skraca nogi. Proste reguły długości są przybliżone, lepiej po prostu ocenić sylwetkę."},{"t":"Spodnie: stan, kieszenie, długość","d":"Niski stan skraca nogi; pas na wysokości kości biodrowej pasuje większości, a stanu nie da się podnieść. Odstające kieszenie to za ciasne spodnie. Klasyka to jedno lekkie załamanie, np. z tyłu nieco dłuższą nogawką."},{"t":"Koszula","d":"Rozmiar kołnierzyka nie gwarantuje dobrego korpusu. Z krawatem kupuj pod kołnierzyk i rękaw, a korpus zwęź; za szerokich ramion koszuli nie opłaca się poprawiać."}],"conclusion":"Garnitur to rzecz osobista; gdy wiesz, na co patrzeć, dobre dopasowanie jest w zasięgu.","factchecks":[{"claim":"Ponad 50% ludzi ma niższe prawe ramię, bo większość jest praworęczna.","verdict":"nie da się sprawdzić","note":"Ok. 90% ludzi to praworęczni, ale nie znalazłem badań potwierdzających liczbę 50% i taką przyczynę.","p":0,"src":[["Wikipedia (ang.): ręczność - hasło \"Handedness\"","https://en.wikipedia.org/wiki/Handedness"]]},{"claim":"Gradacja to wyliczanie większych i mniejszych rozmiarów z jednego bazowego wzoru.","verdict":"prawda","note":"Tak opisuje się gradację wykrojów w konfekcji; razem z kołnierzykiem rosną korpus, pacha i rękaw.","p":7,"src":[["Wikipedia (ang.): gradacja wykrojów - hasło \"Pattern grading\"","https://en.wikipedia.org/wiki/Pattern_grading"]]},{"claim":"Długość nogawki decyduje o załamaniu materiału nad butem.","verdict":"prawda","note":"Wikipedia opisuje \"break\" jako fałdę nad butem przy nieco dłuższej nogawce.","p":6,"src":[["Wikipedia (ang.): garnitur - hasło \"Suit\"","https://en.wikipedia.org/wiki/Suit"]]}],"bias":"Praktyczny materiał od krawca z własną pracownią, więc kilka razy sugeruje, że szycie na miarę jest lepsze od konfekcji. Liczba 50% bez źródła."},{"id":"Aed-Jy_BjmE","title_pl":"Dr Joanna Orzeł: mit sarmacki, Lech, Długosz i szlachta Rzeczypospolitej","title":"Jaka jest prawda o Polsce i Polakach przed Mieszkiem? -  didaskalia#143","channel":"didaskalia","url":"https://www.youtube.com/watch?v=Aed-Jy_BjmE","date":"2025-07-27","duration":4782,"views":229579,"section":"Didaskalia","transcript":"youtube","added":"2026-11-04","tags":["Historia","Polska","Społeczeństwo"],"about":"Historyczka z UŁ o mitach założycielskich Polski, sarmacji według Długosza i Kromera oraz o tym, jak szlachta budowała tożsamość.","intro":"Rozmowa Patrycjusza Wyżgi z dr Joanną Orzeł (Uniwersytet Łódzki), autorką książki \"My sarmaci\". Gościni tłumaczy, jak kronikarze połączyli legendy o Lechu i Piaście z mitem sarmackim, po co szlachcie było wspólne pochodzenie i jak serial 1670 trafia w realia epoki.","points":[{"t":"Piast i Lech to legendy","d":"Według Orzeł Piast jako założyciel dynastii to postać mityczna. Później pojawia się Lech jako założyciel państwa, a osobno mit, że na tych ziemiach była Sarmacja, więc jesteśmy Sarmatami."},{"t":"Długosz łączy dwa mity","d":"Jan Długosz połączył legendy o Lechu i Piaście z mitem sarmackim. Z jednej strony wymyśleni władcy, z drugiej bezimienni Sarmaci w wyobrażonej przestrzeni. To podwaliny pod nowożytne kronikarstwo."},{"t":"Sarmacja to najpierw mapa","d":"Mit zaczyna się od przestrzeni: za Dunajem i Renem, do Bałtyku (Morze Sarmackie) i Karpat. Ptolemeusz kończył Sarmację europejską na Wiśle; Długosz według gościni przesunął granicę na Łabę, by Wielkopolska była \"w Sarmacji\"."},{"t":"Powrót w 550 r. i Troja","d":"W przekazie kronikarskim Sarmaci mieli wrócić na ziemie polskie ok. 550 r., w czasie gdy według legendy przybywa Lech. Szukano też powiązań z wojną trojańską, jak inne narody europejskie."},{"t":"Szlachta, nie całe społeczeństwo","d":"Mit szybko stał się tożsamością szlachty. Chłopów i mieszczan z niego wykluczano. Kronikarze sięgali po genealogię od synów Noego: od Chama \"Hamowie\" (chłopi), szlachta od Jafeta lub Sema."},{"t":"Klej Unii Lubelskiej","d":"Przy unii Korony i Litwy potrzebna była idea łącząca różne narody i wyznania. Mit wspólnego sarmackiego pochodzenia, popularyzowany najpierw przez kronikarzy-sekretarzy, szlachta chętnie przyjęła."},{"t":"Kromer: Sarmacja = Rzeczpospolita","d":"Marcin Kromer utożsamił Sarmację z ziemiami pod władzą Jagiellonów: Korona, Litwa, Ruś, Prusy, Inflanty. Według Orzeł to najważniejszy autorytet historyczny aż do Naruszewicza."},{"t":"Zachód atrakcyjny, Wschód obcy","d":"Na Zachód jeżdżono chętnie, ale podkreślano, że u nas najlepiej. Wschód (Moskwa, \"Scytia\") malowano jako barbarzyński i obcy cywilizacji łacińskiej; do tego dokładano motyw przedmurza."},{"t":"Zgoda, liberum veto, magnateria","d":"Szlachta ceniła zgodę; liberum veto uzasadniano tym, że sprzeciw jednego oznacza zły pomysł. Magnateria przez sejmiki i klientelę tworzyła fakcje; gołota bez ziemi zbliżała się bytem do chłopów."},{"t":"1670 i książka My sarmaci","d":"Okładka książki kojarzy się z serialem 1670. Orzeł chwali serial za upowszechnianie nauki i za pokazanie, że stany żyły przenikając się, a nie w osobnych bańkach. Na jesień czeka kolejny sezon."}],"conclusion":"Mit sarmacki to według Orzeł narzędzie tożsamości i władzy szlachty, a nie opis realnego pochodzenia Polaków sprzed Mieszka.","factchecks":[{"claim":"Jan Długosz połączył legendy o Piaście i Lechu z mitem sarmackim.","verdict":"prawda","note":"W Annales Długosz lokalizuje Polaków w Sarmacji i spina tradycję piastowską z antyczną geografią.","p":1,"src":[["Wikipedia (ang.): Jan Długosz","https://en.wikipedia.org/wiki/Jan_D%C5%82ugosz"],["Wikipedia (ang.): Sarmatism","https://en.wikipedia.org/wiki/Sarmatism"]]},{"claim":"Według Ptolemeusza zachodnią granicą Sarmacji europejskiej była Wisła.","verdict":"prawda","note":"W Geographii Ptolemeusza Wisła (Vistula) oddziela Germanię od Sarmacji europejskiej.","p":2,"src":[["Wikipedia (ang.): Geography (Ptolemy)","https://en.wikipedia.org/wiki/Geography_(Ptolemy)"]]},{"claim":"Piast Kołodziej nie istniał jako historyczny założyciel dynastii.","verdict":"prawda","note":"Piast jest postacią legendarną z kronik; historycznie dynastia zaczyna się od Mieszka I.","p":0,"src":[["Wikipedia (ang.): Piast the Wheelwright","https://en.wikipedia.org/wiki/Piast_the_Wheelwright"]]},{"claim":"Marcin Kromer utożsamił Sarmację z ziemiami Rzeczypospolitej Jagiellonów.","verdict":"prawda","note":"Kromer w dziełach XVI w. opisuje Sarmację jako obszar monarchii jagiellońskiej.","p":6,"src":[["Wikipedia (ang.): Marcin Kromer","https://en.wikipedia.org/wiki/Marcin_Kromer"]]}],"bias":"Perspektywa nowożytniczki z naciskiem na kulturę szlachecką i serial 1670. Fragmenty o synach Noego to analiza mitu klasowego, nie katecheza. Książka gościni jest promowana wprost."},{"id":"qqFCHxacUww","title_pl":"Dlaczego w średniowieczu porzucano rzymskie miasta","title":"Why Roman Cities were Abandoned in the Middle Ages","channel":"toldinstone","url":"https://www.youtube.com/watch?v=qqFCHxacUww","date":"2025-07-25","duration":569,"views":867499,"section":"Historia","transcript":"youtube","added":"2026-11-03","tags":["Historia"],"about":"Toldinstone tłumaczy, czemu jedne rzymskie miasta przetrwały do dziś, a setki innych opustoszały.","intro":"Stojąc w ruinach antycznego miasta w południowej Turcji, Garrett Ryan z kanału toldinstone pyta, dlaczego Londyn czy Paryż przetrwały, a setki rzymskich miast zniknęły. Odpowiedź to splot czynników: słabnące elity, najazdy, klimat, malaria, zamulone porty i przede wszystkim rozpad sieci handlu, z której miasta żyły.","points":[{"t":"Imperium miast","d":"Rzym był konfederacją miast; sieć ok. 2000 z nich ciągnęła się od Brytanii po Syrię. Lokalne elity zbierały podatki dla Rzymu i w zamian inwestowały w fora, akwedukty, łaźnie i amfiteatry, czyli wszystko, co dziś kojarzymy z rzymskim miastem."},{"t":"Kryzys III wieku","d":"Najazdy i kryzysy gospodarcze III w. zniszczyły setki miast przy granicach. Nawet te oszczędzone często chowały się za murami zbudowanymi z rozebranych pomników."},{"t":"Elity odchodzą","d":"W późnym cesarstwie najbogatsi wyjeżdżali na posady w administracji, a ci, którzy zostali, biednieli i nie chcieli rządzić miastem. Kwitły ośrodki władzy, jak Arles i Trewir, ale Londinium wyludniało się od końca II w. i opustoszało po odejściu Rzymian z Brytanii."},{"t":"Bliżej Morza Śródziemnego","d":"Miasta nad Morzem Śródziemnym miały większe szanse: były bliżej szlaków handlowych i łatwiej je było przejąć bez walki. Później grozili im piraci; w IX w. łupieżcy splądrowali nawet Bazylikę św. Piotra, a mieszkańcy wybrzeży przenosili się na wzgórza."},{"t":"Wschód do VII wieku","d":"Miasta wschodniego cesarstwa trzymały się dobrze do VII w. Część Syrii i Palestyny rozkwitała pod Umajjadami, ale Anatolię pustoszyły najazdy, a w XI w. plemię Banu Hilal zrujnowało miasta Maghrebu."},{"t":"Klimat i krajobraz","d":"Wczesne cesarstwo przypadło na wyjątkowo ciepły okres; gdy się ochłodziło, podupadły miasta wysoko w górach Taurus, jak Sagalassos. Pola Fajumu w Egipcie zasoliły się, porty Efezu i Miletu zamuliły, a część Aleksandrii i Bajów zapadła się w morze."},{"t":"Malaria","d":"Najgroźniejsza malaria tropikalna rozprzestrzeniała się na zachód, a wylesianie tworzyło bagniste delty. To ona zamieniła żyzną Kampanię Rzymską w pustkowie, którym była aż do XIX w."},{"t":"Zerwane sieci handlu","d":"Miasta przy granicach żyły z wydatków wojska. Wiejskie osady na wapiennym płaskowyżu północnej Syrii dostarczały oliwę do Antiochii; gdy po podboju arabskim zmieniły się szlaki, opustoszały na zawsze i zwą się dziś martwymi miastami."},{"t":"Kruchość miast","d":"Miasta zależą od handlu, infrastruktury i masy krytycznej ludzi. Według autora większość rzymskich miast zgubiły nie katastrofy, ale powolne zmiany, które odebrały im sens istnienia."}],"conclusion":"Rzymskie miasta umierały zwykle powoli: gdy znikały powody ich istnienia, ludzie po prostu odchodzili.","factchecks":[{"claim":"Arabscy łupieżcy splądrowali Bazylikę św. Piotra w IX w.","verdict":"prawda","note":"Najazd na Rzym w 846 r. ograbił bazyliki św. Piotra i św. Pawła za murami.","p":3,"src":[["Wikipedia (ang.): najazd na Rzym w 846 r. - hasło \"Arab raid against Rome\"","https://en.wikipedia.org/wiki/Arab_raid_against_Rome"]]},{"claim":"Martwe miasta północnej Syrii opustoszały po zmianie szlaków handlowych.","verdict":"prawda","note":"To ok. 700 osad z I-VII w.; porzucono je w VIII-X w. po przesunięciu się szlaków. Wpisane na listę UNESCO.","p":7,"src":[["Wikipedia (ang.): martwe miasta - hasło \"Dead Cities\"","https://en.wikipedia.org/wiki/Dead_Cities"]]},{"claim":"Port Efezu zamulił się, odcinając miasto od morza.","verdict":"prawda","note":"Rzeka Kaystros nanosiła osady; dziś ruiny leżą kilka kilometrów od brzegu.","p":5,"src":[["Wikipedia (ang.): Efez - hasło \"Ephesus\"","https://en.wikipedia.org/wiki/Ephesus"]]},{"claim":"Część Bajów zapadła się w morze przez ruchy ziemi.","verdict":"prawda","note":"Bradyzejsmy Pól Flegrejskich zatopiły część Bajów; ruiny tworzą dziś podwodny park.","p":5,"src":[["Wikipedia (ang.): Baje - hasło \"Baiae\"","https://en.wikipedia.org/wiki/Baiae"]]},{"claim":"Malaria zamieniła Kampanię Rzymską w pustkowie aż do XIX w.","verdict":"półprawda","note":"Porzucono ją w średniowieczu przez malarię i brak wody; osuszanie i rekultywacja trwały do XX w.","p":6,"src":[["Wikipedia (ang.): Kampania Rzymska - hasło \"Roman Campagna\"","https://en.wikipedia.org/wiki/Roman_Campagna"]]}],"bias":"Rzetelny, zwięzły przegląd z ostrożnymi wnioskami. Reklama sponsora zawiera polityczne cytaty niezwiązane z tematem."},{"id":"hRZ5MM6gmlE","title_pl":"Trening nóg, który robiłem przez rok transformacji","title":"The Leg Workout I Followed For My 1 Year Transformation","channel":"Jeff Nippard","url":"https://www.youtube.com/watch?v=hRZ5MM6gmlE","date":"2025-06-09","duration":729,"views":3014048,"section":"Sport","transcript":"youtube","added":"2026-11-05","tags":["Siłownia","Hipertrofia","Trening","Ciało i zdrowie"],"about":"Jeff Nippard pokazuje trening nóg z rocznej transformacji: uginania, przysiad wahadłowy, RDL, prostowania, abdukcja i łydki.","intro":"Jeff Nippard, kanadyjski trener i popularyzator treningu opartego o badania, przez 365 dni robił ten sam trening nóg bez przerw. Problem, który stawia, jest prosty: które ćwiczenia i wskazówki techniczne realnie zmieniły wygląd nóg w rocznej transformacji naturalnego zawodnika. Tłumaczy też, dlaczego wybrał konkretne warianty maszyn zamiast popularnych zamienników.\n\nFilm jest poradnikiem ćwiczenie po ćwiczeniu: od uginania leżąc przez przysiad wahadłowy i rumuński martwy ciąg po izolacje czworogłowych, pośladków i łydek. Przy każdym ruchu podaje typowe błędy, cue'e i krótkie tło z badań. Na koniec reklamuje pełny plan i aplikację żywieniową.","points":[{"t":"Uginanie leżąc na start","d":"**Nippard zaczyna trening od uginania nóg leżąc, żeby priorytetowo potraktować dwugłowe i rozgrzać kolana przed przysiadami.** Według niego lekko aktywowany tylny łańcuch poprawia czucie pośladków, prowadzenie kolan i siłę w przysiadzie.\n\nNa drugim dniu nóg robi uginanie siedzące, bo badanie wykazało ok. 1,6 raza większy wzrost dwugłowych przy wersji siedzącej. Leżąca lepiej rozciąga krawiecki (sartorius), który według autora \"wyskakuje\" na pozach czworogłowych."},{"t":"Partiale na końcu serii","d":"**Na ostatniej serii uginania robi lengthened partials: gdy nie da się już podnieść poduszki do końca, dokłada niepełne powtórzenia w dolnej połowie.** Krzywa siły dwugłowych sprawia, że przy zmęczeniu dół ruchu nadal jest silny.\n\nNajczęstszy błąd: unoszenie bioder i ściąganie ciężaru pośladkami oraz dolnymi plecami. Cue: wcisnąć biodra w poduszkę i mocniej chwycić uchwyty, żeby cała napięcie szło w dwugłowe."},{"t":"Przysiad wahadłowy 3x6-8","d":"**Trzy serie po 6-8 powtórzeń na pendulum squat to według niego numer jeden na czworogłowe w całym roku.** Maszyna daje też obciążenie pośladków i przywodzicieli. Jeśli nie ma pendulum, zamiennik to sztanga, Smith albo hack squat z ustawieniem pod większy udział czworogłowych.\n\nPierwsze serie zostawia 1-2 powtórzenia w zapasie, ostatnią dobija do upadku. Co kilka miesięcy robi deload. Błąd: za płytki zakres, bo największy moment na czworogłowych jest blisko dołu."},{"t":"Rumuński martwy ciąg","d":"**RDL według Nipparda dał największą różnicę we wzroście dwugłowych w tym roku, bo dało się tydzień w tydzień dokładać obciążenie.** Uginanie trenuje zgięcie kolana, RDL prostowanie biodra, a to dwie funkcje dwugłowych.\n\nCue: pchać pośladki prosto do tyłu, lekki zgięcie kolan bez wyjeżdżania do przodu, sztanga w linii nad środkiem stopy. Nie gonić zakresu przez zaokrąglenie pleców; on zwykle schodzi tuż poniżej kolan przy neutralnym kręgosłupie."},{"t":"Prostowanie nóg i fotel","d":"**Leg extension to według niego najlepsza izolacja czworogłowych, bo mocniej trafia prosty uda (rectus femoris) niż przysiad.** Badanie z 2021: po 5 tygodniach przysiad na Smithie nie rozwinął prostego uda, a prostowania tak.\n\nW 2024 badanie: fotel odsunięty maksymalnie do tyłu dał ok. 170% większy wzrost czworogłowych niż standardowa pozycja. Zapina się pasem, ciągnie uchwyty, czasem 3-sekundowy ekscentryk po kontuzji kolana. Błąd: odrywanie pośladków od siedziska."},{"t":"Abdukcja bioder i łydki","d":"**Na abdukcji bioder przeszedł z pochylenia do przodu na wyprostowane biodra (mostek), bo Brett Contreras wskazał, że włókna pośladkowego średniego lepiej pasują do tej pozycji.** Po ciężkim przysiadzie i RDL celuje w górne włókna średniego. Błąd: za lekko i daleko od upadku.\n\nŁydki robi na końcu 8-10 powtórzeń z głębokim rozciągnięciem; na ostatniej serii 30 s w dole. Według niego to właśnie pomijanie łydek na końcu treningu jest główną przyczyną braku wzrostu."}],"conclusion":"Nippard przekonuje, że roczny progres nóg to konsekwentny overload na kilku dobrze dobranych ćwiczeniach plus technika i partials w rozciągnięciu. Na koniec reklamuje pełny plan upper/lower PPL i aplikację MacroFactor.","factchecks":[{"claim":"Uginanie siedzące daje ok. 1,6x większy wzrost dwugłowych niż leżące","verdict":"prawda","note":"Badanie Maeo i wsp. (2021) wykazało większą hipertrofię dwugłowych przy uginaniu siedzącym.","p":0,"src":[["PubMed: Maeo i wsp. o uginaniu nóg siedzącym vs leżącym","https://pubmed.ncbi.nlm.nih.gov/33009197/"],["Wikipedia (ang.): mięsień dwugłowy uda - hasło \"Hamstring\"","https://en.wikipedia.org/wiki/Hamstring"]]},{"claim":"Prostowania rosną prosty uda lepiej niż przysiad na Smithie","verdict":"prawda","note":"Prace o regionalnej hipertrofii wskazują, że leg extension mocniej rozwija rectus femoris.","p":4,"src":[["Wikipedia (ang.): mięsień prosty uda - hasło \"Rectus femoris muscle\"","https://en.wikipedia.org/wiki/Rectus_femoris_muscle"],["PubMed: przegląd regionalnej hipertrofii czworogłowych","https://pubmed.ncbi.nlm.nih.gov/31268946/"]]},{"claim":"Fotel maksymalnie do tyłu dał ok. 170% większy wzrost czworogłowych","verdict":"nie da się sprawdzić","note":"Autor powołuje się na badanie z 2024; bez pełnego tekstu trudno potwierdzić dokładnie 170%.","p":4,"src":[["Wikipedia (ang.): prostowanie nóg - hasło \"Leg extension\"","https://en.wikipedia.org/wiki/Leg_extension"]]},{"claim":"Głębokie rozciągnięcie jest kluczowe dla hipertrofii łydek","verdict":"prawda","note":"Badania łydek wskazują przewagę treningu w długim zakresie mięśnia nad samym skróceniem.","p":5,"src":[["PubMed: trening łydek w rozciągnięciu vs skróceniu","https://pubmed.ncbi.nlm.nih.gov/37015016/"],["Wikipedia (ang.): mięsień brzuchaty łydki - hasło \"Gastrocnemius muscle\"","https://en.wikipedia.org/wiki/Gastrocnemius_muscle"]]}],"bias":"Poradnik sprzedażowy: reklamuje Bodybuilding Transformation System (-25%) i MacroFactor. Jedna anegdota roczna, nie RCT całego planu."},{"id":"928aRhhPP8I","title_pl":"Trening góry, który robiłem przez rok transformacji","title":"The Upper Body Workout I Followed For My 1 Year Transformation","channel":"Jeff Nippard","url":"https://www.youtube.com/watch?v=928aRhhPP8I","date":"2025-05-27","duration":783,"views":7282670,"section":"Sport","transcript":"youtube","added":"2026-11-05","tags":["Siłownia","Hipertrofia","Trening","Ciało i zdrowie"],"about":"Jeff Nippard rozbiera roczny trening góry: incline bench, flye, podciąganie, laterale, Penlay row, triceps i biceps.","intro":"Jeff Nippard pokazuje trening górnej części ciała, którego trzymał się przez 365 dni swojej naturalnej transformacji. Po 15 latach treningu według DEXA zyskał 1,2 kg masy beztłuszczowej (2,7 lb), a ultrasonografem zmierzył też przyrost szczytu bicepsa. Cel filmu: wskazać ćwiczenia i cue'e, które według niego zrobiły największą różnicę w klatce, barkach i plecach.\n\nTo poradnik ruch po ruchu, od wyciskania skośnego i flye na wyciągu przez podciąganie z obciążeniem i wiosłowanie Penlay po laterale, wyprosty tricepsa i uginania. Przy każdym ćwiczeniu podkreśla progressive overload i ostatnią serię do upadku.","points":[{"t":"Wyciskanie skośne sztangą","d":"**Incline barbell bench to według niego najskuteczniejsze ćwiczenie na klatkę w tym roku.** Celuje w klatkę i przedni bark, z bonusem tricepsa i bocznego barku stabilizującego sztangę. Wybrał sztangę zamiast hantli przez łatwiejszy overload w skali roku; free weight zamiast Smitha dla stabilizatorów.\n\nBadanie Chaveza: wyciskanie pod 45° rośnie górę klatki mocniej, a środek i dół tak samo jak flat. Cue: nieco węższy chwyt, kontrolowane zejście, lekka pauza, bez odbijania. Ostatnia seria do upadku na asekurację."},{"t":"Flye siedząc na wyciągu","d":"**Seated cable fly izoluje klatkę i daje większe rozciągnięcie niż ciężkie wyciskanie.** Ławkę stawia daleko przed sobą, wchodzi z uchwytami przy klatce i zaczyna od kontrolowanego negatywu. Ściąga łokcie, nie tylko dłonie, jakby obejmując duże drzewo; łokcie trzyma wysoko.\n\nWoli to od pec decku przez głębszy zakres i siedzącą stabilność zamiast stania, żeby napięcie nie \"uciekało\" w kostki i dolne plecy."},{"t":"Podciąganie z obciążeniem","d":"**Weighted pull-upy awansował z A do S tier po tym eksperymencie i przypisuje im większość wzrostu pleców.** Łaty robią wyprost barku, średnie trapezy i romboidy retrakcję, biceps zgięcie łokcia, core stabilizację.\n\nWybrał je zamiast ściągania, bo trudniej huśtać z obciążeniem i pauzą w dole. Cue: klatka do drążka, łokcie w dół i do środka; kreda i paski. Z 13,6 kg na 6 powtórzeń doszedł do 27,2 kg (30 do 60 lb). Alternatywy: assisted i ekscentryki."},{"t":"Laterale na wysokim wyciągu","d":"**Większość poprawy bocznych barków przypisuje high cable lateral raise, 2-3 serie po 8-10 ciężkich powtórzeń.** Kabel daje stałe napięcie; wysoko ustawiony bloczek czyni ruch najtrudniejszym w rozciągnięciu.\n\nBadanie z grudnia (porównanie kabel vs hantel, 8 tygodni, obie ręce do upadku): podobny wzrost bocznych. On i tak woli kabel przez zamach przez ciało. Błąd: wzruszenie barków; cue: zamiatać na zewnątrz, nie w górę."},{"t":"Deficit Penlay row","d":"**Deficit Pendlay row według niego aktywuje całe plecy od szyi po biodra i daje głębsze rozciągnięcie łaty dzięki staniu na talerzu.** Eksplozywny pozytyw, wolniejszy negatyw; na ostatniej serii lengthened partials w rozciągnięciu.\n\nBłąd: zbyt pionowy tułów. Przy tułowiu równoległym do podłoża grawitacja mocniej obciąża retraktory. Paski/kreda obowiązkowe."},{"t":"Triceps i biceps","d":"**Na triceps wybiera cable overhead extension: badanie vs pushdown wykazało ok. 50% więcej wzrostu głowy długiej i ok. 40% więcej całego tricepsa.** Setup: wyżej kabel, przysiad pod spód, krok do przodu.\n\nNa biceps na dniu góry robi Bayesian cable curl; nowe porównanie z preacher nie dało istotnej różnicy (15 osób, 10 tygodni), ale on nadal podejrzewa lekką przewagę długości mięśnia. Na pull day dokłada preacher i hammer."}],"conclusion":"Nippard argumentuje, że po latach treningu nadal da się rosnąć przez ciężkie wolne ciężary, izolacje z dobrym rozciągnięciem i konsekwentny failure na ostatnich seriach. Reklamuje pełny plan upper/lower PPL ze zniżką na YouTube.","factchecks":[{"claim":"Wyciskanie pod 45° rośnie górę klatki mocniej, a środek/dół jak flat","verdict":"półprawda","note":"Badania EMG i hipertrofii często faworyzują skos dla górnych włókien; efekt na dół bywa zbliżony, nie zawsze identyczny.","p":0,"src":[["Wikipedia (ang.): wyciskanie na ławce - hasło \"Bench press\"","https://en.wikipedia.org/wiki/Bench_press"],["PubMed: wpływ kąta ławki na aktywację klatki","https://pubmed.ncbi.nlm.nih.gov/31268995/"]]},{"claim":"Overhead triceps extension dało ~50% więcej wzrostu głowy długiej niż pushdown","verdict":"prawda","note":"Badanie Maeo i wsp. wykazało wyraźnie większą hipertrofię przy wyproście znad głowy.","p":5,"src":[["PubMed: Maeo i wsp. overhead vs pushdown triceps","https://pubmed.ncbi.nlm.nih.gov/35819335/"],["Wikipedia (ang.): triceps - hasło \"Triceps\"","https://en.wikipedia.org/wiki/Triceps"]]},{"claim":"Kabel i hantel dają podobny wzrost bocznych barków","verdict":"prawda","note":"Nowsze porównania lateral raise często nie pokazują dużej przewagi kabla nad hantlem przy podobnym wysiłku.","p":3,"src":[["Wikipedia (ang.): mięsień naramienny - hasło \"Deltoid muscle\"","https://en.wikipedia.org/wiki/Deltoid_muscle"]]},{"claim":"Po roku DEXA: +1,2 kg masy beztłuszczowej u doświadczonego naturala","verdict":"nie da się sprawdzić","note":"To pomiar autora z eksperymentu; bez surowych danych DEXA nie da się niezależnie potwierdzić.","p":null,"src":[["Wikipedia (ang.): absorpcjometria DXA - hasło \"Dual-energy X-ray absorptiometry\"","https://en.wikipedia.org/wiki/Dual-energy_X-ray_absorptiometry"]]}],"bias":"Silna promocja własnego programu i zniżki YouTube. Wnioski z jednej case study rocznej, nie z RCT całego planu."},{"id":"XSl4ZTtjS7Q","title_pl":"Instynkty, z którymi walczysz codziennie, a których ewolucja zapomniała usunąć","title":"Instincts You Fight Daily That Evolution Forgot To Delete","url":"https://www.youtube.com/watch?v=XSl4ZTtjS7Q","date":"2025-05-25","duration":711,"views":1880940,"transcript":"youtube","added":"2026-11-03","tags":["Psychologia","Ewolucja"],"about":"8 odruchów i skłonności psychicznych, które według autora są pozostałością po życiu w plemionach łowców-zbieraczy i nie pasują do współczesności.","intro":"Ranking 8 odruchów, które według autora zostały nam po przodkach żyjących w plemionach i dziś często szkodzą. Są to: potrzeba drzemki, instynkt stadny, przymus odwzajemniania przysług, strach przed nieznanym, potrzeba kontroli, awersja do straty, obsesja statusu i reakcja na niesprawiedliwość. Każdy punkt ma ten sam schemat: jak pomagał przetrwać i jak przeszkadza w pracy, zakupach i internecie.","points":[{"t":"8. Potrzeba drzemki","d":"Senność o 14:00 po 8 godzinach snu albo pobudka o 3:00 to według autora dawny rytm. Przodkowie spali dwufazowo: kilka godzin, przerwa w nocy na sprawdzenie zagrożeń, jedzenie albo seks, potem znowu sen, a w upale (ok. 38°C) drzemali w dzień. Praca od 9:00, latarnie i telefony do tego nie pasują."},{"t":"7. Instynkt stadny","d":"Gdy plemię zaczynało uciekać, kto pytał dlaczego, zostawał zjedzony, a grupa dawała jedzenie i ochronę. Dlatego mózg nagradza dopasowanie się dopaminą. Dziś przez to kupujemy akcje GameStop za radą Reddita, nosimy modne brzydkie buty i wierzymy w fałszywe newsy."},{"t":"6. Przymus odwzajemnienia","d":"Przytrzymane drzwi albo kawa od kolegi wywołują poczucie długu. U przodków dzielenie się mięsem i jagodami było warunkiem przeżycia zimy, a mózg robi nam dyskomfort, dopóki nie oddamy. Marketing to wykorzystuje: darmowa próbka w Costco kończy się słoikiem ogórków 4,5 kg, kawa u dilera skłania do zakupu auta."},{"t":"5. Strach przed nieznanym","d":"Szelest w krzakach mógł być drapieżnikiem, a nowa jagoda trucizną, więc przeżyli ostrożni. Dlatego mózg zalewa nas hormonami stresu przy nowościach. Dziś zamawiamy to samo danie od 10 lat i zostajemy w pracy, której nie znosimy."},{"t":"4. Potrzeba kontroli","d":"Wciskanie wyimaginowanego hamulca, gdy prowadzi ktoś inny, i złość, gdy plan dnia się sypie. Przeżywali ci, którzy budowali lepsze schronienia, przechowywali jedzenie i planowali polowania; mózg nagradza kontrolę dopaminą. Dziś korki, przeciągnięte spotkania czy źle załadowana zmywarka wywołują reakcję jak na zagrożenie."},{"t":"3. Awersja do straty","d":"Znalezione 100 dolarów cieszy, ale zgubione 100 dolarów boli tygodniami. Dla przodka utrata jedynej włóczni czy zapasów oznaczała śmierć, a brak dodatkowego jedzenia tylko rozczarowanie. Według autora strata boli 2 razy mocniej niż równy zysk, więc trzymamy tracące akcje, niechciane ubrania i złą pracę."},{"t":"2. Obsesja statusu","d":"W plemieniu wysoki status oznaczał lepsze jedzenie, partnerów i posłuch, a niski resztki i brak potomstwa. Dlatego mózg nagradza awans i karze spadek stresem, gdy ktoś ma lepsze auto czy ładniejszy Instagram. Dziś kupujemy rzeczy ponad stan i publikujemy podkoloryzowane życie."},{"t":"1. Potrzeba sprawiedliwości","d":"Ktoś wpycha się w kolejkę albo kradnie pomysł i budzi się wściekłość. W plemieniu ok. 30 osób chomikowanie jedzenia czy jedzenie bez polowania zagrażało wszystkim, a wykrywanie i karanie oszustów pozwalało przetrwać. Dziś ta sama reakcja dotyczy drobiazgów: dwóch darmowych próbek, faworyzowania przez szefa, wpisów w sieci."}],"conclusion":"Nasz mózg jest wciąż ustawiony na życie w małym plemieniu, a zrozumienie tego pomaga nie dawać się tym odruchom sterować.","factchecks":[{"claim":"Przodkowie spali dwufazowo (\"pierwszy i drugi sen\") przez tysiące lat.","verdict":"półprawda","note":"Ekirch opisał sen dwufazowy w dawnej Europie, ale u współczesnych łowców-zbieraczy go nie wykazano.","src":[["Wikipedia (ang.): sen dwufazowy - hasło \"Segmented sleep\"","https://en.wikipedia.org/wiki/Segmented_sleep"],["Yetish i in. 2015, Current Biology (DOI)","https://doi.org/10.1016/j.cub.2015.09.046"]],"p":0},{"claim":"Mózg nagradza konformizm (układ nagrody).","verdict":"półprawda","note":"Jedno badanie fMRI (2009) pokazało sygnał błędu przy niezgodności z grupą; \"dopamina za konformizm\" to uproszczenie.","src":[["Klucharev i in. 2009 (PubMed)","https://pubmed.ncbi.nlm.nih.gov/19146819/"],["Wikipedia (ang.): instynkt stadny - hasło \"Herd mentality\"","https://en.wikipedia.org/wiki/Herd_mentality"]],"p":1},{"claim":"Reguła wzajemności działa, a sprzedawcy używają jej przez darmowe próbki.","verdict":"prawda","note":"Klasyczny eksperyment Regana (1971) i prace Cialdiniego dobrze to dokumentują.","src":[["Wikipedia (ang.): reguła wzajemności - hasło \"Reciprocity (social psychology)\"","https://en.wikipedia.org/wiki/Reciprocity_(social_psychology)"]],"p":2},{"claim":"Strata boli ok. dwa razy mocniej niż równy zysk.","verdict":"półprawda","note":"Kahneman i Tversky podali ok. 2, ale nowsze prace pokazują, że efekt bywa dużo mniejszy.","src":[["Wikipedia (ang.): awersja do straty - hasło \"Loss aversion\"","https://en.wikipedia.org/wiki/Loss_aversion"],["Gal i Rucker 2018, krytyka (DOI)","https://doi.org/10.1002/jcpy.1047"]],"p":5},{"claim":"Poczucie sprawiedliwości jest wrodzone i ewolucyjnie stare.","verdict":"półprawda","note":"Kapucynki i ludzie odrzucają niesprawiedliwe nagrody, ale ewolucyjne wyjaśnienia to hipotezy.","src":[["Brosnan i de Waal 2003, Nature","https://www.nature.com/articles/nature01963"],["Wikipedia (ang.): gra w ultimatum - hasło \"Ultimatum game\"","https://en.wikipedia.org/wiki/Ultimatum_game"]],"p":7},{"claim":"Strach przed nieznanym, potrzeba kontroli i status jako ewolucyjne pozostałości.","verdict":"nie da się sprawdzić","note":"Zjawiska są realne, ale ewolucyjne historie \"jak było w plemieniu\" są nietestowalne.","src":[["Wikipedia (ang.): iluzja kontroli - hasło \"Illusion of control\"","https://en.wikipedia.org/wiki/Illusion_of_control"],["Wikipedia (ang.): krytyka wyjaśnień typu \"just-so story\" - hasło \"Just-so story\"","https://en.wikipedia.org/wiki/Just-so_story"]],"p":null}],"bias":"Jednostronny: każde zachowanie wyjaśnia psychologią ewolucyjną w formie \"opowieści\", bez alternatyw (kultura, uczenie się). Brak źródeł; traktuj jako ciekawostkę, nie wiedzę.","channel":"Chill Dude Explains","section":"Chill Dude Explains"},{"id":"Mcg9GcilBfU","title_pl":"Zapalniczka sprzed 200 lat, która zapala się bez iskry","title":"This 200-Year-Old Lighter Ignites Without a Spark","channel":"Steve Mould","url":"https://www.youtube.com/watch?v=Mcg9GcilBfU","date":"2025-05-17","duration":830,"views":1363330,"section":"Ciekawostki","transcript":"youtube","added":"2026-11-03","tags":["Chemia","Historia nauki"],"about":"Steve Mould pokazuje działającą replikę lampy Döbereinera z 1823 r. i tłumaczy katalizę na platynie, od zapalniczki po ogniwo paliwowe.","intro":"Słoik z kwasem siarkowym, który sam wytwarza wybuchowy gaz i sam go zapala, brzmi jak zły pomysł, a jednak w 1823 r. kupowano go do domów. Steve Mould dostaje od Marcusa z kanału Marv's Lab działającą replikę lampy Döbereinera, pierwszej zapalniczki, i wyjaśnia, dlaczego wodór zapala się na platynie bez iskry.","points":[{"t":"Wodór z cynku","d":"Jony wodoru z kwasu odbierają cynkowi 2 słabo trzymane elektrony. Powstają atomy wodoru, które łączą się w cząsteczki H2 i wydobywają się jako pęcherzyki."},{"t":"Samoregulujący zbiornik","d":"Odwrócony szklany stożek napełnia się wodorem i wypycha kwas. Gdy kwas przestaje dotykać cynku, reakcja staje. Po otwarciu zaworu wodór ucieka, kwas wraca do cynku i produkcja rusza od nowa."},{"t":"Gąbka platynowa","d":"W oryginale strumień wodoru trafiał na gąbkę platynową. Dziś łatwiej kupić wełnę ceramiczną pokrytą platyną. Wodór zaczyna na niej płonąć bez ognia i iskry, a ciepło reakcji rozgrzewa platynę do żaru."},{"t":"Dlaczego wodór sam nie płonie","d":"Cząsteczki H2 i O2 trzeba najpierw rozerwać, zwykle ciepłem. Mieszanina w balonie wybucha dopiero po silnym podgrzaniu jednego miejsca."},{"t":"Orbital antywiążący","d":"Cząsteczki przyciągają się do platyny słabymi siłami van der Waalsa. Elektrony z metalu przechodzą na orbital antywiążący wodoru, w którym elektrony przebywają na zewnątrz atomów, więc cząsteczka się rozpada. Podobnie dzieje się z tlenem."},{"t":"Powstaje woda","d":"Wolne atomy wodoru i tlenu na powierzchni łączą się w wodę. Woda słabo wiąże się z platyną, a energia zderzenia wprawia ją w drgania, czyli ciepło, które pomaga jej się oderwać i rozgrzewa metal."},{"t":"Dlaczego to był hit","d":"W 1823 r. ogień rozpalano krzesiwem, tłokiem ogniowym albo pocieraniem patyków. Według Moulda lampę szybko wyparła zapałka Johna Walkera z 1827 r. (w filmie omyłkowo mowa o XVII w.)."},{"t":"Platyna dziś","d":"Katalityczny ogrzewacz do rąk Zippo grzeje do 6 godzin dzięki parującej benzynie i wełnie z platyną. Katalityczny dyfuzor zapachów spala alkohol bez płomienia. Liczy się duża powierzchnia, bo reakcja zachodzi na powierzchni metalu."},{"t":"Ogniwo paliwowe","d":"Wodór i tlen przepływają nad 2 powierzchniami platyny rozdzielonymi membraną, która przepuszcza tylko jony. Elektrony płyną obwodem i zasilają wentylator. Odwrócone ogniwo rozkłada wodę na wodór i tlen."},{"t":"Sponsor","d":"Końcówka to reklama programu WISE firmy Jane Street dla osób zaczynających studia."}],"conclusion":"Lampa Döbereinera była niebezpieczna i skomplikowana, ale zapoczątkowała katalizę na platynie, z której korzystają dziś m.in. ogniwa paliwowe.","factchecks":[{"claim":"Lampę wynalazł w 1823 r. niemiecki chemik J. W. Döbereiner; cynk z kwasem siarkowym daje w
