o zdarzeniu, w tym po wywołaniu webhooka.","p":8,"src":[["Dokumentacja Grok Bot: umiejętności i rutyny","https://docs.x.ai/grok-bot/skills-routines-and-automations"]]},{"claim":"Bot dostaje własny adres mailowy.","verdict":"prawda","note":"Aplikacja Email daje botom ich własny adres zamiast podłączania istniejącego konta.","p":9,"src":[["Dokumentacja Grok Bot: komputer i aplikacje","https://docs.x.ai/grok-bot/computer-and-apps"]]}],"bias":"Entuzjastyczny przegląd z reklamą darmowego poradnika i płatnego kursu autora; kopiowanie ciasteczek z własnej przeglądarki to ryzykowna rada.","section":"Technologie"},{"id":"3w9VmQMQEJs","title_pl":"Najlepsze klasy w WoW Forever dla zapracowanych graczy z godziną dziennie","title":"Najlepsze KLASY dla DADGAMER w WoW Forever! Masz MAŁO CZASU na Grę? Ten Poradnik jest dla CIEBIE!","channel":"Nadin Wins","url":"https://www.youtube.com/watch?v=3w9VmQMQEJs","date":"2026-10-22","duration":1567,"views":49741,"section":"Pozostałe","transcript":"youtube","added":"2026-11-05","tags":["Gry","WoW"],"about":"Poradnik Nadin Wins: która klasa w WoW Forever daje najwięcej postępu, gdy na grę masz 40 do 60 minut dziennie.","intro":"Nadin Wins, polski streamer i autor poradników do World of Warcraft (gra ponad 20 lat, ma ponad 700 dni rozgrywki), odpowiada na pytanie, które widzowie zadają mu od dwóch tygodni. Chodzi o \"dad gamerów\": dorosłych z dziećmi, pracą i obowiązkami, którzy mają na grę 40 do 60 minut dziennie. WoW Forever to nowa wersja gry w stylu klasycznego WoW z poziomami 1 do 60, nowymi strefami i około 1000 nowych zadań, tuż przed premierą.\n\nAutor ocenia każdą klasę pod kątem tego, co zjada czas: przerwy na jedzenie i regenerację many między walkami, możliwość nagłego odejścia od komputera bez śmierci postaci, łatwość wejścia i tempo zdobywania poziomów. Na końcu dzieli klasy na trzy grupy.","points":[{"t":"Wojownik: ciężka droga, ale tank ma łatwiej","d":"**Wojownik nie jest najszybszy w samotnym zdobywaniu poziomów i często musi siadać do jedzenia, ale jako tank (postać przyjmująca ciosy w grupie) dobrze pasuje do braku czasu.** W WoW Forever każda specjalizacja wojownika jest według autora mocna, także obronna.\n\nTank od razu dostaje zaproszenia przez wyszukiwarkę lochów i sam ustala tempo. Zadania z lochów (dungeonów) dają dużo doświadczenia, więc można przeskakiwać z jednego lochu do następnego i z poziomu 10 dojść do 25 prawie niezauważenie. Kto chce grać tylko sam, musi pogodzić się z przestojami."},{"t":"Łowca: mistrz samotnego levelowania","d":"**Łowca (hunter) to według autora jedna z trzech najlepszych klas do samotnej gry i dobry wybór dla wracających graczy.** Najtrudniejsze jest pierwsze 10 poziomów, około 3 do 4 godzin, bo bez zwierzaka i z martwą strefą około 7 m (8 jardów), w której nie można strzelać, łatwo dać się dopaść.\n\nOd poziomu 10 zwierzak przejmuje wrogów, przestojów jest mało, a łowca solo pokonuje nawet elitarne potwory, przy których inne klasy potrzebują pomocy. Autor poleca specjalizację Beast Mastery i swój poradnik do niej."},{"t":"Mag: dużo siedzenia","d":"**Mag ma ciągłe braki many (energii do czarów), więc w pierwszych kilkudziesięciu poziomach dużo czasu traci na siedzenie i picie.** Świetnie zabija wiele potworów naraz czarami obszarowymi, ale autor zakłada, że ktoś z godziną dziennie nie będzie tak grał, bo to monotonne i bez zadań.\n\nTrudno mu też samemu robić zadania grupowe, chyba że gracz bardzo dobrze opanował kiting (ostrzeliwanie wroga w ucieczce). Dlatego mag jest u autora jednym z mniej polecanych wyborów dla zapracowanych, choć ma wysoki pułap umiejętności i jest mocny w PvP."},{"t":"Łotrzyk: prawie jak pauza w MMO","d":"**Łotrzyk (rogue) ma Vanish, czyli zniknięcie z walki jednym przyciskiem, i stealth (ukrycie), więc można w każdej chwili odejść od komputera.** Gdy zadzwoni telefon albo przyjdzie dziecko, wystarczy się ukryć i postać jest bezpieczna nawet na serwerze PvP.\n\nŁotrzyk używa energii zamiast many, więc nie ma przerw na picie, a według autora Blizzard zapowiedział go jako najlepszą klasę zadającą obrażenia jednemu celowi w rajdach. Autor żartuje, że łotrzyk to \"styl życia\" i pozwala niemal zapauzować grę MMO."},{"t":"Kapłan: uzdrowiciel od razu w grupie","d":"**Kapłan (priest) grający jako uzdrowiciel dostaje miejsce w grupie niemal natychmiast.** Autor opisuje to tak: logujesz się o 19:30, o 19:33 masz drużynę, a o 19:40 jesteś w lochu. Przy takim tempie godzina wystarcza na jeden loch ze wszystkimi zadaniami.\n\nSamotnie, w specjalizacji Shadow, kapłan rozwija się wolniej niż łowca czy czarnoksiężnik, ale leczy się sam i ma tarczę, więc rzadziej ginie. A śmierć to strata czasu, bo bieg do ciała trwa czasem 3 do 4 minut."},{"t":"Czarnoksiężnik: wybór autora","d":"**Czarnoksiężnik (warlock) to dla autora \"ostateczny wybór\" dla dad gamerów i jego własna postać na start.** Jego demon (sukkub lub inkub) zadaje 25% obrażeń postaci, ma zawsze ten sam poziom co gracz i nie trzeba go szukać ani szkolić jak zwierzaka łowcy.\n\nLife Tap zamienia zdrowie na manę, a wysysanie życia oddaje zdrowie, więc przerw prawie nie ma. Czarnoksiężnik umie też przywoływać innych graczy do lochu, a według autora w WoW Forever nie ma kamieni przywołania, więc grupa nie czeka na spóźnialskich. Autor poleca specjalizację Affliction."},{"t":"Paladyn: \"podłącz i graj\"","d":"**Paladyn to według autora najlepsza klasa dla nowych i wracających graczy, zupełnie inna niż w pierwszym WoW Classic.** Już na 6 poziomie ma 4 aktywne umiejętności i rotację dwóch pieczęci, zamiast nudnego auto ataku.\n\nLeczy się sam, ma bańkę ochronną do ucieczki, daje grupie błogosławieństwa i może być tankiem, uzdrowicielem albo zadawać obrażenia. Dlatego jest chętnie brany do lochów. Autor dodaje, że w WoW Forever paladynem może być też nieumarły."},{"t":"Druid: elastyczny, ale nie najszybszy","d":"**Druid może być tankiem jako niedźwiedź, walczyć wręcz jako kot, rzucać czary z dystansu jako moonkin albo leczyć.** To dobry wybór dla kogoś, kto nie wie jeszcze, jaką rolę lubi.\n\nTempo zdobywania poziomów jest wyższe niż w Classic, ale niższe niż u łowcy, czarnoksiężnika i paladyna. Przerwy skraca leczenie w czasie, za to samotne pokonywanie trudnych i elitarnych przeciwników jest trudne."},{"t":"Szaman: wybuchowe obrażenia","d":"**Szaman zadaje kilka ciosów naraz i potwór po prostu \"wyparowuje\", co autor nazywa grą bardzo dającą dopaminę.** Poleca specjalizację Enhancement, która według niego jest \"rakietą\" i od poziomów 20 do 30 może jednocześnie tankować lochy i mocno bić.\n\nNowością jest szaman krasnolud, niedostępny wcześniej w Classic. Szaman ma też totemy wspierające grupę i może grać jako uzdrowiciel lub mag żywiołów."},{"t":"Podsumowanie: trzy grupy klas","d":"**Najlepsze dla zapracowanych są według autora łowca, czarnoksiężnik, paladyn i szaman Enhancement.** Kapłan, wojownik w obronie i druid są wolniejsze solo, ale świetne do lochów, bo łatwo znaleźć grupę.\n\nŁotrzyk i mag mają najwyższy pułap umiejętności, więc im lepszy gracz, tym więcej z nich wyciśnie. Dla łotrzyka największym atutem dla dad gamera jest wyjście z walki w dowolnej chwili."}],"conclusion":"Autor uważa, że brak czasu nie jest powodem, by rezygnować z WoW, wystarczy dobrać klasę, która daje poczucie postępu w 40 do 60 minut. Prosi widzów, by w komentarzach napisali, czy są dad gamerami, bo od tego zależy, czy nagra więcej takich poradników.","factchecks":[{"claim":"WoW Forever to gra w stylu Classic z poziomami 1-60 i nowymi strefami oraz lochami","verdict":"prawda","note":"Blizzard opisuje limit 60 poziomu, nowe strefy i 9 nowych lochów.","p":null,"src":[["Blizzard: co nowego w WoW Forever","https://news.blizzard.com/article/24315821/wow-foreverwhats-new-and-what-feels-familiar"]]},{"claim":"Lodowa włócznia (Ice Lance) pojawiła się dopiero w dodatku TBC","verdict":"prawda","note":"Czar Ice Lance dodano w The Burning Crusade, nie było go w pierwotnym WoW.","p":2,"src":[["Wowhead: Ice Lance w TBC","https://www.wowhead.com/tbc/spell=30455/ice-lance"]]},{"claim":"Blizzard obiecał, że łotrzyk będzie najlepszy na jeden cel w rajdach","verdict":"nie da się sprawdzić","note":"Nie znaleźliśmy takiej zapowiedzi Blizzarda w oficjalnych materiałach.","p":3,"src":[["Blizzard: co nowego w WoW Forever","https://news.blizzard.com/article/24315821/wow-foreverwhats-new-and-what-feels-familiar"]]}],"bias":"Subiektywny poradnik doświadczonego gracza, oceny klas to jego opinie. Autor reklamuje swoje poradniki, Twitch i sklepy z kodem rabatowym."},{"id":"QGp2gwppQLI","title_pl":"Najstarszy syntezator gitarowy Rolanda: GR-500 z 1977","title":"Roland's Oldest Guitar Synth","channel":"Alex Ball","url":"https://www.youtube.com/watch?v=QGp2gwppQLI","date":"2026-10-22","duration":960,"views":113623,"section":"Technologie","transcript":"youtube","added":"2026-11-05","tags":["Technika","Muzyka","Historia"],"about":"Alex Ball o systemie Roland GR/GS-500 z 1977: pięć sekcji, porównanie z ARP Avatar i latencja trackingu.","intro":"Alex Ball (kanał o analogowych syntezatorach i sprzęcie studyjnym) bierze na warsztat Roland GR-500 z dedykowaną gitarą GS-500 z 1977. To jeden z pierwszych komercyjnych syntezatorów gitarowych, który przez lata omijał w jego filmach.\n\nPokazuje pięć sekcji modułu, porównuje go z ARP Avatar (też 1977) i tłumaczy, czemu analogowy tracking Rolanda był używalny, a cyfrowe wykrywanie wysokości Avatara nie. Na koniec: kto grał na GR-500 i gdzie to słychać.","points":[{"t":"Dlaczego syntezatory \"dostały\" klawiaturę","d":"**Pierwsze syntezatory dostały klawiatury fortepianowe niemal przypadkiem, więc stały się instrumentami klawiszowców.** Były dostępne, działały jak szereg przełączników (napięcia, trigger, gate) i były znajome dla ludzi, którzy reszty syntezy jeszcze nie znali.\n\nWedług autora to arbitralnie wykluczyło gitarzystów. Dlatego ARP i Roland w 1977, w odstępie miesiąca, wypuścili Avatar i GR-500."},{"t":"Pięć sekcji GR-500","d":"**GR-500 to pięć niezależnych torów: Guitar, Poly Ensemble, Bass, Solo Melody i External Synth.** Guitar to humbucker z EQ; Poly Ensemble bierze pastylkę heksafoniczną, zamienia sygnały w fale prostokątne i filtruje je w warianty tonalne (fundamental, low, medium, high) - i jest polifoniczny, z nieskończonym sustainem.\n\nBass i Solo Melody to monofoniczne sekcje synthowe (Solo z PWM, rezonansowym LPF, LFO i dual portamento w wersji poprawionej). External Synth wysyła CV/gate na zewnętrzny syntezator z transpozycją o tercję lub kwintę."},{"t":"GR-500 vs ARP Avatar","d":"**Avatar brzmi bogatszy (to przerobiony Odyssey z sync, ring modem, S&H i szumem), ale jego cyfrowe wykrywanie wysokości było bezużyteczne.** Autor mierzy lag Avatara na około 70 ms, a analogową konwersję Rolanda (jak w System 700) na około 4 ms.\n\nRoland zrobił też własną gitarę z Fujigen, a Avatar wymagał doklejenia pastylki heksafonicznej do istniejącej gitary. Dla ARP to była katastrofa; dla Rolanda początek całej linii gitarowych syntezatorów, którą Boss kontynuuje do dziś."},{"t":"Kto na tym grał","d":"**Przy rozwoju uczestniczył Ryo Kawasaki; instrument słychać też u Steve'a Hacketta, Mike'a Rutherforda i w riffie Hot Chocolate \"Everyone's a Winner\".** Kawasaki grał na nim live w 1980 i na albumie Concierto de Aranjuez (1982). Hackett używał go na Please Don't Touch (1978), Rutherford z expandera System 100-102 i Avatara na And Then There Were Three; w teledysku Follow You Follow Me trzyma GS-500."}],"conclusion":"Autor pokazuje GR-500 jako praktyczniejszy, choć uboższy brzmieniowo, syntezator gitarowy od Avatara: niska latencja i dedykowana gitara wygrały z bogatszym Odyssey w obudowie. Poleca też archiwum Wayne'a Scotta Jonesa o gitarowych syntezatorach Rolanda.","factchecks":[{"claim":"Roland GR-500 i ARP Avatar wyszły w 1977 w odstępie miesiąca.","verdict":"prawda","note":"GR-500 (z gitarą GS-500, Fujigen) to jeden z pierwszych komercyjnych syntezatorów gitarowych z 1977.","p":0,"src":[["Wikipedia (ang.): syntezator gitarowy Roland GR-500 - hasło \"Roland GR-500\"","https://en.wikipedia.org/wiki/Roland_GR-500"],["Wikipedia (ang.): ARP Avatar - hasło \"ARP Avatar\"","https://en.wikipedia.org/wiki/ARP_Avatar"]]},{"claim":"GR-500 ma pięć sekcji: Guitar, Polyensemble, Bass, Solo, External.","verdict":"prawda","note":"Moduł łączy tor gitarowy, polifoniczny Polyensemble oraz monofoniczne Bass i Solo Melody plus CV zewnętrzne.","p":1,"src":[["Wikipedia (ang.): budowa GR-500 - hasło \"Roland GR-500\"","https://en.wikipedia.org/wiki/Roland_GR-500"]]},{"claim":"Cyfrowy pitch tracking Avatara miał lag rzędu 70 ms, Roland ok. 4 ms.","verdict":"nie da się sprawdzić","note":"Avatar miał problemy z pitch-to-voltage; dokładne 70 vs 4 ms to pomiar autora z filmu.","p":2,"src":[["Wikipedia (ang.): problemy ARP Avatar - hasło \"ARP Avatar\"","https://en.wikipedia.org/wiki/ARP_Avatar"]]}],"bias":"Sponsoring Patreona i sample autora; porównanie Avatara oparte na jego egzemplarzu i subiektywnej ocenie brzmienia. Ton entuzjastyczno-historyczny."},{"id":"sh9MAPj4XZY","title_pl":"Zawody tak nowe, że jeszcze nie mają nazwy","title":"Jobs So New They Don't Have a Name Yet","channel":"Chill Dude Explains","url":"https://www.youtube.com/watch?v=sh9MAPj4XZY","date":"2026-10-22","duration":690,"views":31627,"section":"Chill Dude Explains","transcript":"youtube","added":"2026-11-06","tags":["Technika","Nauka","Psychologia"],"about":"Od sprzątacza śmieci orbitalnych i technika sztucznej macicy po bioprinter chef i menedżera cyfrowych duchów.","intro":"Chill Dude Explains listuje zawody na styku sci-fi i już powstających technologii: sprzątanie orbity, sztuczne macice, edycja pamięci, druk jedzenia, ochrona interfejsów mózg-komputer i post mortem social media.\n\nTon jest pół żartem, pół ostrzeżeniem: te role brzmią absurdalnie, ale odpowiadają na realne problemy (Kessler, wcześniaki, Neuralink, cmentarze na Facebooku).","points":[{"t":"Śmieci orbitalne i sztuczne macice","d":"**Janitor orbity ma łapać ponad 27 000 dużych odłamków pędzących z prędkością orbitalną.** Energia kinetyczna małego bolca jak granat. Misja ESA ClearSpace-1 ma złapać jeden obiekt i spalić go w atmosferze. Syndrom Kesslera (1978): łańcuch zderzeń może zamknąć orbitę.\n\nTechnik sztucznej macicy: bio-bag z 2017 utrzymywał wcześniacze jagnięta; człowiek pilnuje płynów, tlenu i sterylności."},{"t":"Pamięć, druk jedzenia, BCI","d":"**Edycja pamięci: u myszy optogenetyka kasuje konkretny strach bez reszty wspomnień.** Autor ekstrapoluje przyszły zawód memory editor.\n\nBioprinter chef układa warstwy białek i tłuszczów jak drukarka 3D - problem to smak niczego; NASA myśli o kartridżach na Marsa. Specjalista anty-hijackingu BCI: skoro chip czyta mózg, ktoś musi bronić przed kradzieżą sygnału."},{"t":"1: digital ghost manager","d":"**Ok. 8000 użytkowników Facebooka umiera dziennie; według szacunku z filmu do 2070 martwi mogą przewyższyć żywych.** Rodziny płacą za utrzymanie profilu: urodziny, throwbacki, głos zmarłego.\n\nZawód wymaga idealnego naśladowania stylu - błąd wychodzi od razu. Autor: śmierć nie usprawiedliwia spadku engagement."}],"conclusion":"Film nie rekrutuje do tych prac - pokazuje, że technologia tworzy role opiekunów systemów na granicy życia, śmierci i orbity. Najmocniejsza puenta: internet staje się cmentarzem, a ktoś już wystawia faktury za duchy.","factchecks":[{"claim":"Syndrom Kesslera: łańcuch zderzeń śmieci może uczynić orbitę niebezpieczną.","verdict":"prawda","note":"Model Donalda Kesslera z 1978 jest standardem w dyskusji o debris.","p":0,"src":[["Wikipedia (ang.): Kessler syndrome","https://en.wikipedia.org/wiki/Kessler_syndrome"],["Wikipedia (ang.): space debris","https://en.wikipedia.org/wiki/Space_debris"]]},{"claim":"W 2017 pokazano biobag utrzymujący wcześniacze jagnięta.","verdict":"prawda","note":"Zespół z CHOP opisał system sztucznej macicy u jagniąt.","p":0,"src":[["Wikipedia (ang.): artificial womb","https://en.wikipedia.org/wiki/Artificial_womb"]]},{"claim":"Optogenetyka pozwala manipulować konkretnymi engramami pamięci u myszy.","verdict":"prawda","note":"Prace m.in. z MIT pokazują aktywację lub wygaszanie określonych wspomnień światłem.","p":1,"src":[["Wikipedia (ang.): optogenetics","https://en.wikipedia.org/wiki/Optogenetics"]]}],"bias":"Spekulacja zawodów wyprzedza rynek; liczby Facebooka bez źródła w napisach. Ton clickbaitowy przy realnych technologiach."},{"id":"awV7FP9sAHE","title_pl":"Co się stało z metalowymi pożarowymi schodami pożarowymi","title":"Whatever Happened to Fire Escapes?","channel":"Practical Engineering","url":"https://www.youtube.com/watch?v=awV7FP9sAHE","date":"2026-10-20","duration":1087,"views":1031264,"section":"Technologie","transcript":"youtube","added":"2026-11-06","tags":["Technika","Historia"],"about":"Practical Engineering: skąd wzięły się fire escapes w USA, katastrofy które je wymusiły i dlaczego dziś znikają z nowych budynków.","intro":"Grady Hillhouse (Practical Engineering) opowiada historię amerykańskich zewnętrznych schodów pożarowych - od kamienic XIX w. po dzisiejsze przepisy. Pytanie: dlaczego kiedyś były wszędzie, a nowe budynki ich prawie nie mają?\n\nFilm łączy chronologię katastrof (m.in. Triangle Shirtwaist 1911), ekonomię tanich zewnętrznych drabinek zamiast przebudowy klatek oraz ewolucję nowoczesnych, wewnętrznych dróg ewakuacji.","points":[{"t":"XIX w.: pożary kamienic bez wyjścia","d":"**W połowie XIX w. gęste tenementy w USA paliły się jak pułapki: drabiny straży sięgały tylko kilku pięter.** Po pożarze piekarni w 1860 (sześciopiętrowy budynek, 10 ofiar) prasa i prawo w Nowym Jorku zaczęły wymagać ognioodpornej klatki albo zewnętrznej drogi ucieczki - także w istniejących budynkach.\n\nPrzebudowa wewnętrznych schodów była droga, więc właściciele wybierali tanie zewnętrzne konstrukcje. Egzekucja bywała słaba, ale tam gdzie modernizowano - prawie zawsze na zewnątrz."},{"t":"Triangle Shirtwaist 1911","d":"**Pożar fabryki Triangle Shirtwaist zabił ponad 140 osób, głównie młode robotnice.** Drzwi były zablokowane, zewnętrzne wyjścia niewystarczające. Tragedia przyspieszyła reformy budowlane i bezpieczeństwa pracy w USA.\n\nFire escape stał się ikoną miejskiego krajobrazu, ale też symbolem kompromisu: lepiej coś niż nic, choć konstrukcje bywały wąskie, zardzewiałe i zastawione."},{"t":"Dlaczego znikają","d":"**Współczesne kodeksy wolą chronione, wewnętrzne drogi ewakuacji, tryskacze i kompartmentację niż rustykalne metalowe drabiny.** Zewnętrzne schody korodują, zamarzają, bywają nielegalnie zabudowane balkonami.\n\nAutor pokazuje też dziwne XIX-wieczne pomysły (rury, zjeżdżalnie, kosze). Puenta inżynierska: lepszy system to taki, którego mieszkańcy używają codziennie (klatka), a nie tylko w panice."}],"conclusion":"Fire escape to artefakt epoki, w której prawo wymusiło tanią zewnętrzną ucieczkę zamiast przebudowy wnętrz. Dziś inżynieria poszła w sprinklery i chronione klatki - mniej romantycznie, bezpieczniej.","factchecks":[{"claim":"Pożar Triangle Shirtwaist (1911) zabił ponad 140 osób.","verdict":"prawda","note":"Oficjalnie 146 ofiar; kluczowa katastrofa dla prawa pracy i przepisów budowlanych w USA.","p":1,"src":[["Wikipedia (ang.): Triangle Shirtwaist Factory fire","https://en.wikipedia.org/wiki/Triangle_Shirtwaist_Factory_fire"]]},{"claim":"Po połowie XIX w. Nowy Jork wymagał zewnętrznej lub ognioodpornej drogi ucieczki w tenementach.","verdict":"prawda","note":"Kolejne nowojorskie tenement acts narzucały poprawę wyjść ewakuacyjnych.","p":0,"src":[["Wikipedia (ang.): fire escape","https://en.wikipedia.org/wiki/Fire_escape"],["Wikipedia (ang.): Tenement House Act","https://en.wikipedia.org/wiki/New_York_State_Tenement_House_Act"]]}],"bias":"Perspektywa USA i Practical Engineering; sponsorowane wzmianki o tourach/książce na końcu nie dotyczą meritum."},{"id":"hGguYFncLUI","title_pl":"Przetestowałem Grok Bot: czego nie mówią inni","title":"I Tested Grok Bot - Here's What They're NOT Telling You","channel":"Serop | AI Automation","url":"https://www.youtube.com/watch?v=hGguYFncLUI","date":"2026-10-15","duration":1178,"views":27704,"transcript":"whisper","added":"2026-11-03","tags":["Technika","Sztuczna inteligencja"],"about":"Serop testuje Grok Bot bez sponsora: chwali prostotę i autonomię, krytykuje brak wglądu w działanie, pamięć i rozliczenia.","intro":"Serop zapowiada uczciwą recenzję bez sponsora, bo według niego wiele filmów o Grok Bot to płatna promocja. Pokazuje boty z własnym komputerem, pamięć, czaty grupowe i przykłady z biznesu. Chwali prostotę, ale martwi go brak wglądu w to, co boty robią i ile to kosztuje.","points":[{"t":"Boty zamiast czatów","d":"Grok Bot wygląda jak ChatGPT czy Claude Code, ale zamiast rozmów ma boty. Każdy ma wirtualny komputer z Chrome i terminalem, nad którym można przejąć kontrolę."},{"t":"Podłączanie narzędzi","d":"Bot łączy się z mailem, Slackiem i harmonogramami. Autor podłączył GitHub, a bot sam otworzył pull request; wszystko działa w chmurze."},{"t":"Pamięć wspólna dla botów","d":"Bot sam decyduje, co zapamiętać na stałe, a część wiedzy dzielą wszystkie boty: inny bot znał cel autora, czyli 50 tys. dolarów miesięcznych przychodów. Minus: pamięci nie da się przejrzeć ani edytować."},{"t":"Brak wyboru modelu","d":"Autor twierdzi, że jest skazany na modele Grok i nie może przejść na modele OpenAI czy Anthropic. Przy cięższym programowaniu może to według niego przeszkadzać."},{"t":"Nie widać myślenia","d":"Autor nie widzi toku rozumowania ani wywołań narzędzi, tylko wynik, chyba że każe botowi pracować na ekranie. Przy poczcie czy obsłudze klientów to go niepokoi."},{"t":"Niejasne rozliczenia","d":"Widzi tylko ogólne zużycie, np. 40% miesięcznego limitu, bez podziału na zadania i modele. Chciałby tańszych modeli do prostych zadań."},{"t":"Czaty grupowe","d":"Boty mogą pracować razem w grupie, np. marketingowej. Ryzyko: dzielą jeden komputer, więc mogą nadpisywać sobie pliki, a sposób ich współpracy narzuca aplikacja."},{"t":"Przykłady użycia","d":"Bot szukał lotów Berlin do Cali w Google Flights, filmów na YouTube z wynikiem ponad stan i sponsorów wydarzeń w Berlinie na Luma. Autor ocenia te zadania jako dobre zastosowanie do researchu."},{"t":"Dyscyplina w liczbie botów","d":"Łatwo stworzyć za dużo botów i stracić orientację. Autor radzi jednego generalistę do jednorazowych zadań, a wyspecjalizowane boty tylko do powtarzalnych procesów."}],"conclusion":"Potężny i bardzo przyjazny system, dobry do researchu i analiz, ale autor nie powierzyłby mu jeszcze kontaktu z klientami.","factchecks":[{"claim":"W Grok Bot można używać tylko modeli Grok.","verdict":"fałsz","note":"Wyboru modelu nie ma, ale Grok Bot sam dobiera model do zadania i może to być też model zewnętrznego dostawcy.","p":3,"src":[["Dokumentacja Grok Bot: FAQ","https://docs.x.ai/grok-bot/faq"]]},{"claim":"Pamięci bota nie da się przejrzeć.","verdict":"półprawda","note":"Nie ma edytora pamięci, ale dokumentacja radzi zapytać bota, co o tobie pamięta; wspólne są tylko niektóre fakty, np. imię.","p":2,"src":[["Dokumentacja Grok Bot: FAQ","https://docs.x.ai/grok-bot/faq"]]},{"claim":"Nie widać, jakich narzędzi używa bot.","verdict":"półprawda","note":"Według dokumentacji w rozmowie widać aktywność narzędzi, pracę na komputerze i prośby o akceptację, choć nie tok rozumowania.","p":4,"src":[["Dokumentacja Grok Bot: czat i współpraca","https://docs.x.ai/grok-bot/chat-and-collaboration"]]},{"claim":"Nie ma sposobu na ustawienie zabezpieczeń przed groźnymi akcjami.","verdict":"fałsz","note":"Są reguły Ask first, np. dla wysyłania, usuwania czy kupowania, oraz Auto Review dla wrażliwych akcji.","p":null,"src":[["Dokumentacja Grok Bot: akceptacje i bezpieczeństwo","https://docs.x.ai/grok-bot/approvals-security-and-privacy"]]},{"claim":"Wszystkie boty dzielą jeden komputer.","verdict":"prawda","note":"Komputer jest jeden na użytkownika, każdy bot ma na nim osobny ekran.","p":6,"src":[["Dokumentacja Grok Bot: FAQ","https://docs.x.ai/grok-bot/faq"]]}],"bias":"Najbardziej krytyczna recenzja z tej grupy, ale autor reklamuje własną płatną usługę AI makeover, a kilka zarzutów jest nieścisłych.","section":"Technologie"},{"id":"Jxu7Lrxu7nE","title_pl":"Historia baklawy - króla słodyczy","title":"The History of Baklava - The King of Sweets","channel":"Tasting History with Max Miller","url":"https://www.youtube.com/watch?v=Jxu7Lrxu7nE","date":"2026-10-13","duration":1676,"views":1257264,"section":"Historia","transcript":"youtube","added":"2026-11-06","tags":["Historia","Natura"],"about":"Tasting History: skąd wzięła się baklava, spory o pochodzenie i przepis historyczny odtworzony przez Maxa Millera.","intro":"Max Miller (Tasting History) bierze baklavę: warstwy ciasta, orzechy, syrop. Pytanie odcinka: kto \"wynalazł\" króla słodyczy - Grecy, Turcy, Persowie, Asyryjczycy?\n\nFormat klasyczny kanału: kontekst historyczny z cytatami, potem gotowanie przybliżonej wersji z źródeł i degustacja.","points":[{"t":"Spór o rodowód","d":"**Wiele kultur Bliskiego Wschodu i Bałkanów rości sobie baklavę.** Miller zbiera tropy: cienkie ciasta w tradycjach osmańskich pałaców, orzechowe nadzienia, syropy miodowe/cukrowe.\n\nRaczej ewolucja niż jeden wynalazca - słodycz podróżowała z imperiami."},{"t":"Technika warstw","d":"**Klucz to bardzo cienkie ciasto (filo) i naprzemienne warstwy tłuszczu oraz orzechów, na koniec syrop.** Historyczne przepisy różnią się tłuszczem (masło vs oliwa) i rodzajem orzechów.\n\nMiller pokazuje praktyczne pułapki: suszenie ciasta, równe krojenie przed pieczeniem, moment polania syropem."},{"t":"Degustacja i wniosek","d":"**Efekt: chrupiące warstwy i słodki, ciężki środek - deser odświętny, nie codzienny snack.** Autor podkreśla, że \"autentyczność\" zależy od rodziny i regionu bardziej niż od jednej kanonicznej wersji.\n\nPuenta Tasting History: gotując, jesz spór historiograficzny w syropie."}],"conclusion":"Baklava nie ma jednego ojca - ma długi łańcuch kuchni pałacowych i domowych. Miller zamiast wyłaniać zwycięzcę narodowego, każe upiec warstwy i zrozumieć technikę.","factchecks":[{"claim":"Baklava to deser warstwowy z ciasta filo, orzechów i syropu znany w kuchniach osmańskich i sąsiednich.","verdict":"prawda","note":"Etymologia i rozprzestrzenienie wiążą się z regionem osmańskim/bliskowschodnim; szczegóły pochodzenia sporne.","p":0,"src":[["Wikipedia (ang.): baklava","https://en.wikipedia.org/wiki/Baklava"]]},{"claim":"Ciasto filo jest ultracienkie i wymaga szybkiej pracy, by nie wyschło.","verdict":"prawda","note":"Filo/yufka to papierowo cienkie płaty; w kuchni trzyma się je pod wilgotną ściereczką.","p":1,"src":[["Wikipedia (ang.): filo","https://en.wikipedia.org/wiki/Filo"]]}],"bias":"Rozrywkowy format gotowania; narodowe spory o \"pierwszą baklavę\" są streszczone pod kątem anegdoty."},{"id":"38bJK7W7SZ8","title_pl":"Czy sama siłownia wystarczy, czy naprawdę potrzebujesz cardio?","title":"Is Lifting Enough, or Do You Actually Need Cardio?","channel":"Renaissance Periodization","url":"https://www.youtube.com/watch?v=38bJK7W7SZ8","date":"2026-10-12","duration":722,"views":428967,"section":"Sport","transcript":"whisper","added":"2026-11-03","tags":["Cardio","Trening siłowy","Zdrowie"],"about":"Renaissance Periodization sprawdza, co się dzieje z redukcją, zdrowiem, mięśniami i kondycją, gdy ktoś trenuje siłowo, ale rzuca cardio.","intro":"Kanał Renaissance Periodization zadaje proste pytanie: co, jeśli ktoś dobrze śpi, je, robi 8-12 tysięcy kroków dziennie i dźwiga ciężary, ale w ogóle rezygnuje z cardio? Odpowiedź dotyczy redukcji, zdrowia, przyrostów mięśni i codziennego życia, a na koniec pada propozycja minimalnej dawki.","points":[{"t":"Co tu znaczy cardio","d":"To wysiłek tlenowy, który podnosi tętno powyżej około 130 uderzeń na minutę i jest robiony celowo, by poprawić kondycję."},{"t":"Redukcja bez cardio","d":"O utracie tłuszczu decyduje deficyt kaloryczny. Jeśli rezygnujesz z cardio, możesz zwiększyć codzienną aktywność albo trochę zmniejszyć jedzenie. Wielu najszczuplejszych zawodników schodzi z wagi bez biegania."},{"t":"Zdrowie na dłuższą metę","d":"Na początku nic się nie dzieje. Z czasem bez regularnego, intensywnego cardio może rosnąć ciśnienie i pogarszać się kontrola glukozy. To mały efekt, ale po latach zaczyna mieć znaczenie dla zdrowia i długości życia."},{"t":"Czy ciężary zastąpią cardio","d":"Klasyczne serie po 5-15 powtórzeń nie. Serie po 15-30 powtórzeń w ćwiczeniach wielostawowych z bardzo krótkimi przerwami to już przyzwoity bodziec tlenowy. Do najlepszej kondycji potrzebne jest jednak osobne cardio."},{"t":"Mięśnie bez cardio","d":"Przy treningu siłowym i 8-12 tysiącach kroków brak cardio prawie na pewno nie zaszkodzi przyrostom mięśni."},{"t":"Codzienne życie","d":"Schody czy zwykłe czynności nie będą problemem. Poczujesz brak kondycji dopiero wtedy, gdy życie wymaga więcej, np. przy dłuższym noszeniu ciężkich rzeczy, które trzeba robić z przerwami."},{"t":"Minimalna dawka","d":"Według prowadzącego solidne minimum to 3 sesje tygodniowo po 20 minut w tempie, przy którym nie da się rozmawiać. Szczególnie warto przy wyższej tkance tłuszczowej: od 15% u mężczyzn i od 22% u kobiet."}],"conclusion":"Brak cardio nie zaszkodzi mięśniom, ale na dłuższą metę odbije się na zdrowiu i kondycji. Około 60 minut intensywnego wysiłku tygodniowo to sensowne minimum.","factchecks":[{"claim":"Cardio prawie na pewno nie wpływa na przyrosty mięśni.","verdict":"prawda","note":"Metaanaliza 43 badań: łączenie treningu tlenowego i siłowego nie ogranicza przerostu mięśni ani siły maksymalnej.","p":4,"src":[["PubMed: Schumann i wsp. 2022 - \"Compatibility of Concurrent Aerobic and Strength Training for Skeletal Muscle Size and Function\"","https://pubmed.ncbi.nlm.nih.gov/34757594/"]]},{"claim":"Bez regularnego cardio z czasem może rosnąć ciśnienie krwi.","verdict":"półprawda","note":"Trening wytrzymałościowy obniża ciśnienie, ale trening siłowy i izometryczny też, więc same ciężary częściowo to rekompensują.","p":2,"src":[["PubMed: Cornelissen, Smart 2013 - \"Exercise training for blood pressure: a systematic review and meta-analysis\"","https://pubmed.ncbi.nlm.nih.gov/23525435/"]]},{"claim":"3 sesje po 20 minut intensywnego cardio tygodniowo to solidne minimum.","verdict":"przesada","note":"WHO zaleca dorosłym co najmniej 75 minut intensywnej aktywności tlenowej tygodniowo. 60 minut to trochę mniej.","p":6,"src":[["WHO: aktywność fizyczna - fakty","https://www.who.int/news-room/fact-sheets/detail/physical-activity"],["Wikipedia (ang.): zalecenia WHO - hasło \"Physical activity\"","https://en.wikipedia.org/wiki/Physical_activity"]]}],"bias":"Kanał firmy Renaissance Periodization, która sprzedaje aplikację i plany treningowe. Wnioski są ostrożne, ale minimalna dawka to opinia prowadzącego."},{"id":"3RWj52iaheU","title_pl":"8 zasad męskiego ubioru, których warto przestrzegać","title":"8 Menswear Rules You Should Follow","channel":"He Spoke Style","url":"https://www.youtube.com/watch?v=3RWj52iaheU","date":"2026-10-12","duration":627,"views":109768,"section":"Moda","transcript":"youtube","added":"2026-11-05","tags":["Zasady stylu","Garnitur","Dopasowanie","Podstawy"],"about":"He Spoke Style wymienia 8 zasad menswear z praktycznym uzasadnieniem: marynarka, mankiet, krawat, szelki, black tie i kamizelka.","intro":"Antonio z He Spoke Style wybiera osiem zasad męskiego ubioru, których sam przestrzega nie z tradycji dla tradycji, lecz dlatego, że mają sens w proporcji, kroju albo logice ubrania. Część dotyczy dopasowania marynarki, część detali black tie, a część rzeczy, które po prostu wyglądają absurdalnie.\n\nFilm idzie reguła po regule z przykładami i świadomymi wyjątkami (np. zapięta marynarka na kamerze). Na końcu odsyła do osobnego odcinka o zasadach, które wolno łamać.","points":[{"t":"Rozpinaj single-breasted na siedząco","d":"**Jednorzędową marynarkę rozpinaj, gdy siadasz: zapięta pcha się w górę, marszczy materiał i obciąża guzik.** Antonio przyznaje, że na kamerze często łamie regułę celowo: zapięta marynarka trzyma symetrię w ciasnym kadrze, jak u prezenterów.\n\nWyjątek dotyczy single-breasted. Tradycyjnie dwurzędowa zostaje zapięta także na siedząco."},{"t":"Nigdy dolnego guzika marynarki","d":"**Dolnego guzika marynarki ani sport coat nigdy nie zapinaj: krój zakłada, że zostaje otwarty.** Zapięcie ściąga przód, psuje układ poł i sylwetkę. To dla niego natychmiastowy sygnał, że ktoś nie rozumie tailored clothing.\n\nSkrót sometimes / always / never na trzy guziki: górny czasem, środkowy zawsze, dolny nigdy. To samo przy three-roll-two."},{"t":"Mankiet koszuli i długość","d":"**Spod marynarki powinno wystawać ok. 0,6-1,3 cm mankietu koszuli (1/4 do 1/2 cala); Antonio woli bliżej 1,3 cm.** Brak mankietu zwykle znaczy za długi rękaw marynarki, za krótki koszuli albo brak uwagi. Powyżej ok. 2,5 cm wygląda niechlujnie.\n\nDługość marynarki w klasyce ma zakrywać pośladki; test: pięść przy bokach, palce lekko muskają dół. Krótsze kroje slim-fit (Tom Browne) to świadoma moda, nie klasyka."},{"t":"Krawat ciemniejszy od koszuli","d":"**Krawat powinien być generalnie ciemniejszy od koszuli: koszula to tło, ciemniejszy krawat robi kontrast i prowadzi wzrok do twarzy.** Odwrócenie (ciemna koszula, jasny krawat) wpada w klimat \"mafioso\".\n\nWyjątek, który lubi: pełny tonal, koszula i krawat w tym samym kolorze, jak Robert De Niro w Casino. To działa, bo widać świadomy wybór."},{"t":"Szelki albo pasek, nigdy razem","d":"**Szelki i pasek robią to samo, więc noszenie obu naraz jest zbędne i wygląda absurdalnie.** Do garnituru i formalwear Antonio bierze szelki (najlepiej na guziki, nie klipsy); od business casual w dół pasek. Szelki zachowują czystą linię tali bez przecięcia paskiem."},{"t":"Black tie i kamizelka","d":"**W black tie muszą grać ze sobą cztery elementy: facing klapy, muszka, cummerbund i lampas spodni, ten sam materiał (satyna z satyną albo grosgrain z grosgrain).** Najczęściej psują to dobrane \"na chybił trafił\" muszka i cummerbund.\n\nPrzy kamizelce / waistcoat zawsze zostaw dolny guzik rozpięty. Legenda o Edwardzie VII jest sporna, ale konwencja i komfort przy siadaniu zostały; zapięty dolny guzik od razu widać."}],"conclusion":"Antonio broni reguł, które chronią krój, proporcje i spójność formalnego stroju, a nie pustego etykietnika. Świadomy wyjątek (kamera) jest OK, gdy rozumiesz po co jest zasada. Dalej odsyła do odcinka o regułach do łamania.","factchecks":[{"claim":"Dolny guzik marynarki zostawia się rozpięty w klasycznym kroju","verdict":"prawda","note":"We współczesnym tailored clothing dolny guzik jest projektowany jako ozdobny i pozostaje otwarty.","p":1,"src":[["Wikipedia (ang.): marynarka / suit - hasło \"Suit (clothing)\"","https://en.wikipedia.org/wiki/Suit_(clothing)"]]},{"claim":"Edward VII spopularyzował rozpinanie dolnego guzika kamizelki","verdict":"półprawda","note":"To popularna anegdota menswear; historycy spierają się, ile w niej faktu, a ile folkloru.","p":5,"src":[["Wikipedia (ang.): Edward VII - hasło \"Edward VII\"","https://en.wikipedia.org/wiki/Edward_VII"],["Wikipedia (ang.): kamizelka - hasło \"Waistcoat\"","https://en.wikipedia.org/wiki/Waistcoat"]]},{"claim":"W black tie facing, muszka, cummerbund i lampas muszą być z tego samego materiału","verdict":"prawda","note":"Klasyczny dress code black tie zakłada spójność satyny albo grosgrainu w tych elementach.","p":5,"src":[["Wikipedia (ang.): black tie - hasło \"Black tie\"","https://en.wikipedia.org/wiki/Black_tie"]]},{"claim":"Dwurzędowa marynarka zawsze zostaje zapięta na siedząco","verdict":"półprawda","note":"To tradycyjna wskazówka; część współczesnych krojów i sytuacji dopuszcza rozpięcie dla komfortu.","p":0,"src":[["Wikipedia (ang.): double-breasted - hasło \"Double-breasted\"","https://en.wikipedia.org/wiki/Double-breasted"]]}],"bias":"Klasyczny western menswear He Spoke Style; reguły prezentowane jako uniwersalne, choć to konwencja tailored clothing, nie prawo."},{"id":"fdqxF75gWeE","title_pl":"Luksusowe marki i fabryki starożytnego Rzymu","title":"Luxury Brands of Ancient Rome","channel":"toldinstone","url":"https://www.youtube.com/watch?v=fdqxF75gWeE","date":"2026-10-10","duration":614,"views":236182,"section":"Historia","transcript":"youtube","added":"2026-11-04","tags":["Historia"],"about":"Od miliona gwoździ z Inchtuthil po terra sigillata, Enniona i Fortis: masowa produkcja, znaki towarowe i konkurencja w Rzymie.","intro":"Gwóźdź z fortu Inchtuthil (prawie milion sztuk w jamie) otwiera opowieść o rzymskiej produkcji na dużą skalę. Autor przechodzi przez cesarskie fabryki broni i kamieniołomy, biznes arystokracji (cegły, garum, oliwa), marki rzemieślników (Arezzo, La Graufesenque, szkło Enniona) oraz znaki towarowe, reklamę i podróbki lamp Fortis.","points":[{"t":"Gwóźdź z Inchtuthil","d":"Gwóźdź z końca I w. z fortu legionowego Inchtuthil w Szkocji znaleziono w 1960 r. w jamie z prawie milionem innych. Według autora to świadectwo skali produkcji; technologia była przedprzemysłowa, ale fabryki, znaki i konkurencja marek istniały."},{"t":"Cesarskie fabryki i kamieniołomy","d":"W późnej starożytności broń i zbroje robiono w 35 państwowych zakładach (tarcze, napierśniki, strzały, zbroje końskie, balisty). Cesarze mieli sieć kamieniołomów; kolumny z marmuru i granitu w standardowych długościach szły setkami do miast, a rzeźby często w stanie surowym."},{"t":"Pieczywo i młyny","d":"Od Septymiusza Sewera annona dla ok. 200 tys. ludzi szła jako chleb z państwowych piekarni. Ziarno mielono w młynach napędzanych akweduktami i przelewem z łaźni."},{"t":"Biznes arystokracji","d":"Krassus organizował brygady niewolnych strażaków, budowniczych i rzemieślników. Rodziny spod Rzymu tłoczyły cegły w standardowych rozmiarach ze stemplem daty i miejsca; niektóre glinianki miały setki pracowników. Nad Morzem Śródziemnym: solarnie i garum (Troia w Portugalii: 19 zbiorników, ponad 600 m³)."},{"t":"Oliwa i Monte Testaccio","d":"Plantacje oliwne w Afryce Północnej i południowej Hiszpanii miały baterie pras i magazyny. Monte Testaccio w Rzymie to według autora ponad 50 mln amfor oliwnych z Hiszpanii."},{"t":"Terra sigillata","d":"Za Augusta czerwona ceramika z Arezzo szła od Brytanii po Indie; stemple wskazują dziesiątki warsztatów, największy co najmniej 60 rzemieślników. W I w. centrum przeszło do Galii; w La Graufesenque piece brały do 35 tys. naczyń naraz - poziom nieosiągnięty według autora aż do XIX w."},{"t":"Szkło Enniona","d":"Dmuchanie szkła powstało w I w. p.n.e. na wschodzie imperium. Ennion (prawdopodobnie Sydon) sygnował formowane naczynia; zachowało się ok. 50, od Hiszpanii po Izrael. Naśladowcy kopiowali jego formy."},{"t":"Znaki i konkurencja","d":"Szklarze z Kolonii zostawiali \"Cologne squiggle\". Fibule Aucissa szły od Galii po Morze Czarne; w Vindolandzie znaleziono luksusowy pantofel Lucjusza Aibutiusa Thalesa. Scaurus z Pompejów reklamował garum; amfory \"Vesuvinum\" mieszały Wezuwiusz i wino. Lampy Fortis z Mutiny wyparły lokalne podróbki ze skopiowanym znakiem."}],"conclusion":"Rzym nie był blisko rewolucji przemysłowej, ale masowo produkował tanie towary i budował marki rozpoznawalne na trzech kontynentach.","factchecks":[{"claim":"W Inchtuthil zakopano prawie milion gwoździ.","verdict":"prawda","note":"Przy ewakuacji fortu zakopano ogromny zapas gwoździ; szacunki sięgają ok. 10 ton / setek tysięcy-miliona sztuk.","p":0,"src":[["Wikipedia (ang.): Inchtuthil - hasło \"Inchtuthil\"","https://en.wikipedia.org/wiki/Inchtuthil"]]},{"claim":"Monte Testaccio to góra z ponad 50 mln amfor oliwnych.","verdict":"prawda","note":"Sztuczne wzgórze z ostraków amfor, głównie baetyckiej oliwy; szacunki idą w dziesiątki milionów.","p":4,"src":[["Wikipedia (ang.): Monte Testaccio - hasło \"Monte Testaccio\"","https://en.wikipedia.org/wiki/Monte_Testaccio"]]},{"claim":"La Graufesenque wypalało do 35 tys. naczyń naraz.","verdict":"prawda","note":"Piece galijskiej terra sigillata osiągały produkcję rzędu dziesiątek tysięcy naczyń na wypał.","p":5,"src":[["Wikipedia (ang.): La Graufesenque - hasło \"La Graufesenque\"","https://en.wikipedia.org/wiki/La_Graufesenque"]]},{"claim":"Ennion sygnował szkło; zachowało się ok. 50 naczyń.","verdict":"prawda","note":"Ennion to najlepiej poświadczony rzymski szklarz z podpisem; zachowane egzemplarze liczy się w dziesiątkach.","p":6,"src":[["Wikipedia (ang.): Ennion - hasło \"Ennion\"","https://en.wikipedia.org/wiki/Ennion"]]},{"claim":"35 państwowych fabryk broni w późnym imperium.","verdict":"prawda","note":"Notitia Dignitatum wymienia sieć fabricae produkujących broń i zbroje dla armii.","p":1,"src":[["Wikipedia (ang.): fabricae późnego Rzymu - hasło \"Roman military personal equipment\"","https://en.wikipedia.org/wiki/Roman_military_personal_equipment"],["Wikipedia (ang.): Notitia Dignitatum - hasło \"Notitia Dignitatum\"","https://en.wikipedia.org/wiki/Notitia_Dignitatum"]]}],"bias":"Przejrzysta synteza gospodarcza; liczby (35 fabryk, 50 mln amfor) zaokrąglone. Sponsor History Adventures w środku."},{"id":"8lNK7gjUCEs","title_pl":"Tajna wojna Vsauce z AI","title":"Vsauce's Secret War on AI","channel":"TDT","url":"https://www.youtube.com/watch?v=8lNK7gjUCEs","date":"2026-10-08","duration":758,"views":850724,"transcript":"whisper","added":"2026-11-03","tags":["Media","Sztuczna inteligencja"],"about":"Dlaczego Vsauce prawie przestał wrzucać filmy, jak ludzcy twórcy wygrywają z algorytmem i czemu farmy treści AI tego nie powtórzą.","intro":"Autor kanału TDT zadaje pytanie, jak wybić się na YouTube, gdy filmów jest więcej niż kiedykolwiek, a Vsauce od ponad roku nie wrzucił pełnego filmu. Opisuje 3 strategie wyróżnienia się, historię Vsauce i jego naśladowców oraz zalew treści AI. Wniosek: przetrwa pasja, a nie produkcja masowa.","points":[{"t":"Rekordy YouTube","d":"Rekordzista NameLook ma 4,8 mln filmów, ale tylko ok. 5,9 mln wyświetleń i 65 tys. subskrypcji. MrBeast ma 520 mln subskrypcji, a T-Series 358 mld wyświetleń, przy ok. 8,3 mld ludzi na świecie."},{"t":"Strategia 1: bomba","d":"Jeden film o wiele lepszy od reszty, który przyciąga widzów do całego kanału."},{"t":"Strategia 2: osobowość","d":"Ludzie wracają dla twórcy, a nie dla tematu, jak u Markipliera czy Jacksepticeye."},{"t":"Strategia 3: fioletowa krowa","d":"Według Setha Godina trzeba być wyjątkowym, by się wyróżnić. Vsauce zrobił to pytaniami jak „Czy można dotknąć Marsa?” albo „Jaka jest prędkość ciemności?”."},{"t":"Wyżej zawieszona poprzeczka","d":"Michael Stevens mówi, że pytań mu nie brakuje; chciał przeskoczyć poprzeczkę, którą sam sobie ustawił. Dziś każdy film to miesiące pracy, a robienie treści pod algorytm według niego prowadzi do wypalenia."},{"t":"Algorytm dopasowuje się do niego","d":"Stevens wciąż robi shorty, podcast i Curiosity Box. Zamiast uczyć się algorytmu, uczy algorytm siebie, więc każdy jego film i tak odnosi sukces."},{"t":"Zalew treści AI","d":"Farmy treści AI masowo przerabiają to, co już działa. Autor uważa, że YouTube uratuje pasja twórców, bo ludzie przychodzą oglądać ludzi."}],"conclusion":"Twórcy wygrywają tym, czego nie da się skopiować: wyjątkowością i pasją, a nie liczbą filmów.","factchecks":[{"claim":"MrBeast ma 520 mln subskrypcji.","verdict":"prawda","note":"Według Wikipedii w listopadzie 2026 r. miał 525 mln, więc w czasie filmu 520 mln było zgodne.","p":0,"src":[["Wikipedia (ang.): najczęściej subskrybowane kanały - hasło \"List of most-subscribed YouTube channels\"","https://en.wikipedia.org/wiki/List_of_most-subscribed_YouTube_channels"]]},{"claim":"T-Series ma 358 mld wyświetleń.","verdict":"półprawda","note":"T-Series jest liderem wyświetleń, ale Wikipedia podaje ponad 343 mld, nieco mniej niż w filmie.","p":0,"src":[["Wikipedia (ang.): najczęściej oglądane kanały - hasło \"List of most-viewed YouTube channels\"","https://en.wikipedia.org/wiki/List_of_most-viewed_YouTube_channels"]]},{"claim":"Purple Cow to idea Setha Godina.","verdict":"prawda","note":"Książkę Purple Cow: Transform Your Business by Being Remarkable wydał w 2003 r.","p":3,"src":[["Wikipedia (ang.): Seth Godin - hasło \"Seth Godin\"","https://en.wikipedia.org/wiki/Seth_Godin"]]},{"claim":"Vsauce stworzył Michael Stevens.","verdict":"prawda","note":"Marka działa od 2010 r.; kanał główny ma ok. 25 mln subskrypcji.","p":4,"src":[["Wikipedia (ang.): Vsauce - hasło \"Vsauce\"","https://en.wikipedia.org/wiki/Vsauce"]]}],"bias":"Ciekawy esej o twórczości, ale autor na koniec reklamuje koszulki przeciw grafice AI, a liczby podaje bez źródeł.","section":"Technologie"},{"id":"GVWSVTE8Tdk","title_pl":"Taśmowe echo w latach 2020: EchoFix EF-X3","title":"Tape Echo in the 2020s?","channel":"Alex Ball","url":"https://www.youtube.com/watch?v=GVWSVTE8Tdk","date":"2026-10-08","duration":785,"views":44674,"section":"Technologie","transcript":"youtube","added":"2026-11-05","tags":["Technika","Muzyka"],"about":"Alex Ball o nowoczesnym analogowym tape echo EchoFix EF-X3: głowy, chorus, spring, CV i zastosowania studyjne.","intro":"Alex Ball testuje EchoFix EF-X3, współczesny w pełni analogowy tape echo z Australii, wzorowany funkcjonalnie na Rolandzie RE-501 (układowo hybryda RE-201 i 501). Film jest sponsorowany przez EchoFix.\n\nPo przeglądzie główek, trybów, chorusa, spring reverb i wyjść CV/osobnych head outs pokazuje triki: flanger taśmowy, sound on sound, sekwencjonowane wyciszanie echo/reverb i processing modularny. Na koniec waży cenę względem używanego Space Echo.","points":[{"t":"Co jest w pudełku","d":"**EF-X3 ma 4 głowy odtwarzające, 7 trybów echo (w tym sound on sound), analogowy chorus, spring reverb oraz CV na prędkość taśmy i feedback.** Można wyłączyć sygnał dry (do sendów) i wyłączyć silnik, by używać samego preampu, chorusa i reverb bez taśmy.\n\nZ tyłu: XLR in/out, osobne zbalansowane wyjścia każdej głowy, wet chorus/reverb i dry. Auto tape stop wyłącza silnik bez sygnału, by chronić taśmę."},{"t":"Triki: flanger, SOS, gating","d":"**Autor moduluje prędkość taśmy wbudowanym LFO (także sample & hold) i dostaje prawdziwy tape flanging; z erase off i record on buduje pętle sound on sound.** Potem spowalnia taśmę i dostaje atmosferę inną niż cyfrowy pitch shift.\n\nGate'ami na remote cancel wycina echo i spring sekwencyjnie (głowy gasną jedna po drugiej). Dwa szybkie head outs bez feedbacku używa też jako \"echo-reverb\" za perkusją - inny smak niż spring."},{"t":"Modular i stereo","d":"**Cztery osobne head outs pozwalają przetwarzać każde odbicie inaczej.** W przykładzie: band-pass, low-pass, phaser i ring mod na kolejnych głowach, plus spring i sekwencjonowane bramki - z dwunutowej sekwencji robi kakofonię.\n\nWedług autora to właśnie szerokość zastosowań (preamp gitarowy, chorus, wokale/DAW, pętle, stereo, modular) uzasadnia maszynę jako \"ultimate echo\", a nie sam bread-and-butter delay."},{"t":"Cena vs RE-201","d":"**W chwili filmu rack/Tolex kosztuje około 3000 funtów, desktop około 2500; używane RE-501 około 2000, a RE-201 jest tańsze i powszechne.** Autor przyznaje, że do zwykłego tape echo i spring lepiej wziąć Space Echo (produkowane 17 lat, łatwe w naprawie, także przez EchoFix).\n\nEF-X3 ma sens w studiach z różnymi artystami i stylami, gdzie liczy się zakres: od preampu po eksperymenty z poszczególnymi głowami."}],"conclusion":"Według autora EF-X3 jest drogi jak na tape echo, ale wyróżnia się zakresem: prawdziwa taśma plus chorus, spring, CV i osobne head outs. Do samego echa woli klasyczne RE-201; tu chodzi o uniwersalny procesor studyjny.","factchecks":[{"claim":"EchoFix EF-X3 to w pełni analogowe tape echo z chorusem BBD i spring.","verdict":"prawda","note":"Producent i recenzje potwierdzają 100% analogową ścieżkę, 4 głowy, 7 trybów i osobne head outs.","p":0,"src":[["EchoFix: strona produktu EF-X3 Desktop","https://echofix.com/products/ef-x3-table-top-chorus-echo-with-bbd-analog-chorus-spring-reverb"]]},{"claim":"Funkcjonalnie bazuje na Rolandzie RE-501 / Space Echo.","verdict":"prawda","note":"Linia Space Echo (RE-201 itd.) to klasyczne wielogłowicowe taśmowe echa Rolanda z lat 70.","p":3,"src":[["Wikipedia (ang.): Roland Space Echo - hasło \"Roland RE-201\"","https://en.wikipedia.org/wiki/Roland_RE-201"]]},{"claim":"Ceny: desktop ok. 2500 GBP, Tolex/rack ok. 3000 GBP.","verdict":"nie da się sprawdzić","note":"To ceny z momentu publikacji filmu; cennik EchoFix zmienia się i zależy od wersji oraz podatków.","p":3,"src":[["EchoFix: strona produktu EF-X3 Desktop","https://echofix.com/products/ef-x3-table-top-chorus-echo-with-bbd-analog-chorus-spring-reverb"]]}],"bias":"Film sponsorowany przez EchoFix; autor otwarcie waży cenę, ale ton jest promocyjny wobec szerokiego scope maszyny."},{"id":"8xXhE25vJZY","title_pl":"Grok Bot 101: oficjalne warsztaty dla początkujących","title":"Grok Bot 101","channel":"Grok","url":"https://www.youtube.com/watch?v=8xXhE25vJZY","date":"2026-10-06","duration":3401,"views":108717,"transcript":"whisper","added":"2026-11-03","tags":["Technika","Sztuczna inteligencja"],"about":"Oficjalne warsztaty SpaceX AI: idea AI-współpracownika, boty z komputerem, uczenie zadań, umiejętności i zespół botów od naklejek.","intro":"Nagranie warsztatów prowadzonych przez Martina, inżyniera z SpaceX AI, i Cliffa. Pokazują, skąd wziął się Grok Bot, a potem na żywo budują zespół 3 botów, który projektuje naklejki, zbiera głosy widzów w Formularzach Google i szuka drukarni. To materiał producenta, więc bez krytyki.","points":[{"t":"Od chatbota do współpracownika","d":"Najpierw były chatboty, potem agenci, a Grok Bot ma być pierwszym AI-współpracownikiem. Rozmawia się jak w iMessage: boty po lewej, jedna ciągła rozmowa zamiast nowego czatu do każdego zadania."},{"t":"Pamięć i własny komputer","d":"Dwie podstawy to trwała pamięć i komputer, na którym bot używa stron jak człowiek. Może np. zarezerwować lot na stronie linii lotniczej, która nie ma API."},{"t":"Przykłady prowadzących","d":"Martin ma boty do pracy, np. do przygotowania rozmów z klientami. Prywatny bot Bobo śledzi premiery butów, kontuzje w jego ligach fantasy i występy ulubionej tenisistki rodziców."},{"t":"Nauka przez pokazanie","d":"Martin raz pokazuje botowi Maya, jak zrobić formularz Google, a bot zapisuje to jako umiejętność. Według prowadzących skraca to kolejne podejścia i oszczędza zużycie."},{"t":"Boty rozmawiają ze sobą","d":"Maya zbiera głosy w formularzu, a Dex dostaje polecenie zaprojektowania 8 naklejek według wytycznych z Figmy. Łącznik Figma MCP jest w marketplace."},{"t":"Jeden komputer, osobne ekrany","d":"Prowadzący odpowiadają na pytania widzów: boty użytkownika działają na jednej maszynie w chmurze, a pamięcią i kontekstem zarządza aplikacja."},{"t":"Szef sztabu","d":"Na koniec Martin tworzy czat grupowy i awansuje Bobo na szefa sztabu dla Dex, Mayi i bota zakupowego Penny. Pozostałe boty streszczają mu w czacie, co zrobiły w sprawie naklejek."},{"t":"Reguły akceptacji","d":"W ustawieniach można dodać reguły, kiedy bot ma pytać o zgodę, np. przed utworzeniem formularza Google."}],"conclusion":"Według prowadzących boty używają każdego narzędzia nawet bez łącznika, pamiętają, jak pracujesz, i pytają o zgodę tam, gdzie tego chcesz.","factchecks":[{"claim":"Wszystkie boty działają na jednym komputerze, każdy na własnym ekranie.","verdict":"prawda","note":"Komputer w chmurze jest jeden na użytkownika; jeden bot prowadzi naraz jedno zadanie na swoim ekranie.","p":5,"src":[["Dokumentacja Grok Bot: FAQ","https://docs.x.ai/grok-bot/faq"]]},{"claim":"Bot zapisuje pokazane zadanie jako umiejętność.","verdict":"prawda","note":"Teach a task nagrywa proces w przeglądarce i zapisuje go jako umiejętność do powtórzenia.","p":3,"src":[["Dokumentacja Grok Bot: umiejętności i rutyny","https://docs.x.ai/grok-bot/skills-routines-and-automations"]]},{"claim":"Można ustawić, przed czym bot ma pytać o zgodę.","verdict":"prawda","note":"Reguły Ask first zawsze wywołują kartę akceptacji, np. przed wysyłaniem czy publikowaniem.","p":7,"src":[["Dokumentacja Grok Bot: akceptacje i bezpieczeństwo","https://docs.x.ai/grok-bot/approvals-security-and-privacy"]]}],"bias":"Oficjalne warsztaty producenta: pokazują wyłącznie zalety, bez kosztów i ograniczeń. Transkrypt ma luki, więc część szczegółów pominięto.","section":"Technologie"},{"id":"5_B1Mq02wcI","title_pl":"Ukryta inżynieria reduktorów ciśnienia","title":"The Hidden Engineering of Pressure Regulators","channel":"Practical Engineering","url":"https://www.youtube.com/watch?v=5_B1Mq02wcI","date":"2026-10-06","duration":994,"views":1953136,"section":"Technologie","transcript":"youtube","added":"2026-11-06","tags":["Technika"],"about":"Practical Engineering tłumaczy, jak działają regulatory ciśnienia w gazie i wodzie oraz czemu błąd przy nich kończy się wybuchem.","intro":"Grady Hillhouse rozkłada na czynniki pierwsze urządzenie, które od połowy XIX w. prawie się nie zmieniło: reduktor ciśnienia. Bez niego gaz i woda w domu byłyby albo za słabe, albo zabójczo mocne.\n\nFilm idzie od katastrofy Merrimack Valley (2018), przez prostą płytkę z otworem, po sprężynowy zawór, który utrzymuje stałe ciśnienie wyjściowe mimo zmian przepływu.","points":[{"t":"Stawka: Merrimack Valley 2018","d":"**Błąd przy wymianie rur w Massachusetts sprawił, że regulatory nie ścisnęły ciśnienia gazu - ponad 100 budynków uszkodzonych, 22 ranne, 1 ofiara.** System redukował ciśnienie na poziomie dzielnicy, nie przy każdym liczniku.\n\nAutor: stawki przy regulacji ciśnienia gazu są ekstremalnie wysokie, mimo że sama fizyka wydaje się prosta."},{"t":"Dlaczego sama kryza nie wystarcza","d":"**Każda przeszkoda w rurze obniża ciśnienie przy przepływie, ale przy zerowym przepływie ciśnienie za otworem wyrównuje się z wlotowym.** Krzywa ciśnienie-przepływ nie jest płaska - dom potrzebuje stabilnego PSI niezależnie od tego, ile kuchenek właśnie działa.\n\nStąd potrzeba aktywnego zaworu, nie tylko stałej kryzy."},{"t":"Jak działa klasyczny regulator","d":"**Sprężyna i membrana ustawiają żądane ciśnienie wyjściowe; gdy rośnie zbyt wysoko, zawór przymyka dopływ.** Konstrukcja z połowy XIX w. wciąż siedzi przy licznikach gazu i wodociągach.\n\nAutor pokazuje też, czemu utrzymanie ustawienia i wentylacja membrany są krytyczne - mały błąd instalacji = duże ciśnienie w kuchenkach."}],"conclusion":"Reduktor ciśnienia to nudny bohater infrastruktury: wygląda jak żeliwna puszka, a chroni całe dzielnice. Katastrofy przypominają, że \"proste\" urządzenia wymagają poprawnego montażu i konserwacji.","factchecks":[{"claim":"Eksplozje gazu w Merrimack Valley (2018) wynikły z błędów przy pracach na sieci i regulatorach.","verdict":"prawda","note":"NTSB i relacje mediów wskazują na nadmierne ciśnienie gazu po pracach Columbia Gas.","p":0,"src":[["Wikipedia (ang.): 2018 Merrimack Valley gas explosions","https://en.wikipedia.org/wiki/2018_Merrimack_Valley_gas_explosions"]]},{"claim":"Regulatory ciśnienia gazu używają membrany i sprężyny do utrzymania stałego ciśnienia wylotowego.","verdict":"prawda","note":"To standardowa zasada działania gas pressure regulator.","p":2,"src":[["Wikipedia (ang.): pressure regulator","https://en.wikipedia.org/wiki/Pressure_regulator"]]}],"bias":"Nacisk na USA i jeden głośny wypadek; reklama wcześniejszego odcinka PE o tej katastrofie."},{"id":"q1IwR88mhaA","title_pl":"Jedyny poradnik Grok Bot, jakiego potrzebujesz: jak zacząć","title":"The ONLY Grok Bot Tutorial You Need 2026 - How To Use Grok Bot For Beginners","channel":"Charlie Chang","url":"https://www.youtube.com/watch?v=q1IwR88mhaA","date":"2026-09-30","duration":841,"views":433930,"transcript":"whisper","added":"2026-11-03","tags":["Technika","Sztuczna inteligencja"],"about":"Charlie Chang krok po kroku: instalacja, pierwszy bot asystent, łączenie Gmaila, uczenie zadań, rutyny, czaty grupowe i marketplace.","intro":"Charlie Chang pokazuje Grok Bot od zera: pobranie aplikacji, plan, pierwszy bot jako asystent, łączenie Gmaila i innych aplikacji, uczenie przez pokazanie, rutyny, kilka botów naraz i marketplace z gotowymi botami. To praktyczny przegląd, ale z linkami afiliacyjnymi i reklamą jego społeczności.","points":[{"t":"Instalacja i plan","d":"Aplikację pobiera się z x.ai/bot, a korzystanie wymaga płatnego planu; autor mówi, że ma Grok Plus za 100 dolarów miesięcznie. Według niego dostęp dają też niektóre plany Cursor, SuperGrok i Teams."},{"t":"Pierwszy bot: asystent","d":"Autor tworzy bota asystenta i pokazuje ustawienia: zużycie, rozliczenia i możliwość aktualizacji lub resetu komputera bota."},{"t":"Łączenie aplikacji","d":"Gmaila podłącza się w czacie albo przez Composio lub Zapier MCP. W marketplace są też Slack, Notion i menedżer haseł, przez który bot loguje się bez widzenia haseł."},{"t":"Własny ekran i nauka","d":"Każdy bot ma ekran z Chrome, a przycisk uczenia pozwala raz pokazać zadanie. Autor kazał mu szukać na Amazonie soundbarów do 500 dolarów i dostał 3 propozycje z linkami."},{"t":"Wiele botów i rutyny","d":"Obok asystenta autor ma m.in. szefa sztabu, boty do badań, finansów, newslettera i LinkedIn; boty piszą do siebie. Rutyny działają według planu, np. o 9:00 podsumowanie Slacka i maili."},{"t":"Czaty grupowe i wspólny komputer","d":"W czacie grupowym autor pyta asystenta, bota finansowego i COO o zaległe faktury. Bot finansowy może mieć dostęp do QuickBooks, a wszystkie boty dzielą jeden komputer z Linuksem."},{"t":"Marketplace","d":"Gotowe boty innych osób można zaimportować do swojego konta. Bot potrafi też za autora rozmawiać z czatami obsługi klienta."}],"conclusion":"Autor uważa Grok Bot za pracownika, który działa wolniej od człowieka, ale doprowadza zadania do końca.","factchecks":[{"claim":"Grok Bot wymaga płatnego planu.","verdict":"prawda","note":"Na The X Subscription jest w planach Premium (30 dolarów), Super (100) i Ultra (200); Free i Plus go nie mają.","p":0,"src":[["x.ai: cennik planów","https://x.ai/pricing"],["Dokumentacja Grok Bot: FAQ","https://docs.x.ai/grok-bot/faq"]]},{"claim":"Autor ma Grok Plus za 100 dolarów miesięcznie.","verdict":"fałsz","note":"Plus kosztuje 8 dolarów i nie ma Grok Bot; 100 dolarów to plan Super.","p":0,"src":[["x.ai: cennik planów","https://x.ai/pricing"]]},{"claim":"Dostęp dają też plany Cursor i SuperGrok.","verdict":"prawda","note":"Dotyczy starszych płatnych planów Cursor i Teams; można też podpiąć indywidualny SuperGrok lub X Premium+.","p":0,"src":[["Dokumentacja Grok Bot: FAQ","https://docs.x.ai/grok-bot/faq"]]},{"claim":"Wszystkie boty dzielą jeden komputer, pliki i logowania.","verdict":"prawda","note":"Komputer jest przypisany do użytkownika, a nie do bota; dokumentacja ostrzega, by nie traktować botów jako granicy bezpieczeństwa.","p":5,"src":[["Dokumentacja Grok Bot: FAQ","https://docs.x.ai/grok-bot/faq"]]},{"claim":"Bot loguje się przez menedżer haseł bez widzenia haseł.","verdict":"prawda","note":"Boty logują się danymi z Vault, menedżera haseł lub bezpiecznego formularza bez widzenia wartości.","p":2,"src":[["Dokumentacja Grok Bot: FAQ","https://docs.x.ai/grok-bot/faq"],["Dokumentacja Grok Bot: Vault","https://docs.x.ai/grok-bot/vault"]]}],"bias":"Rzetelny poradnik krok po kroku, ale autor promuje swoją darmową społeczność i linki afiliacyjne, a o kosztach i ograniczeniach mówi mało.","section":"Technologie"},{"id":"6gsZY_-kT3U","title_pl":"Wibrująca płytka zamienia prawie wszystko w przyssawkę","title":"This Device Turns Anything into a Suction Cup","channel":"Steve Mould","url":"https://www.youtube.com/watch?v=6gsZY_-kT3U","date":"2026-09-30","duration":829,"views":1696736,"section":"Ciekawostki","transcript":"youtube","added":"2026-11-05","tags":["Fizyka","Nauka","Technika"],"about":"Steve Mould: jak wibrująca elastyczna płytka tworzy podciśnienie bez styku z sufitem i czy uniesie człowieka.","intro":"Steve Mould przykleja do wizytówki maleńki wibrator i pokazuje, że karta \"przyssaje się\" do sufitu - choć między kartą a sufitem zostaje szczelina. Potem próbuje dociągnąć to do skali cegły i człowieka: pytanie brzmi, skąd bierze się ssanie i czy da się unieść osobę.\n\nFilm porównuje pomysł z chwytakami Bernoulliego (dmuchanie tworzy podciśnienie), potem przez zwolnione nagrania i symulacje dochodzi do fal biegnących w elastycznej płytce, które wypychają powietrze. Na końcu z inżynierem Jamiem budują stanowisko z \"butt kickerem\" i próbują przebić wynik lekarza Davida Collisante.","points":[{"t":"Nie Bernoulli gripper","d":"**Pierwszy pomysł - że wizytówka działa jak chwytak Bernoulliego - odpada, bo szczelina jest za cienka.** Chwytaki przemysłowe unoszą delikatne wafery krzemowe, dmuchając powietrzem w środek: w wąskiej szczelinie powietrze przyspiesza, energia ruchu chaotycznego spada, ciśnienie przy ściance spada.\n\nGdy szczelina jest zbyt mała, tarcie zabija ssanie, więc obiekt zostaje w bezpiecznej odległości. Tu wizytówka jest w reżimie cienkiej warstwy, gdzie liczy się lepkość powietrza - inna fizyka niż klasyczny Bernoulli gripper."},{"t":"Sztywne odpycha, giętkie przyciąga","d":"**Sztywna płytka z wibratorem odpycha się od powierzchni przez film powietrza; elastyczna przyciąga.** Pierwsza próba uniesienia cegły na cienkim akrylu nie działała: cała płyta chodziła góra-dół jak sztywny korpus.\n\nPo zamianie na bardziej giętki plastik w zwolnionym tempie widać fale w płycie - jak na płycie Chladniego, gdzie piasek zbiera się w węzłach. Według autora to właśnie giętkość i fale odróżniają przyciąganie od wcześniejszego \"bezpowietrznego air hockey\", gdzie wibrująca sztywna powierzchnia dawała odpychanie."},{"t":"Fala biegnąca jak pompa","d":"**Przy suficie nie ma fali stojącej, tylko biegnąca: każda \"kieszeń\" powietrza jest wyciskana na zewnątrz.** Lepkość powietrza tłumi ruch płyty, więc nie wpada w rezonans stojący; zamiast tego powstaje fala wędrująca.\n\nW symulacji Moulda fala działa jak pompa perystaltyczna (takie używa się w szpitalach): powietrze jest wypychane ze szczeliny szybciej, niż wraca przez małe przerwy między kieszeniami. Płyta według literatury nigdy nie styka się z sufitem - zostaje szczelina, więc urządzenie może się ślizgać; to zaleta względem zwykłej przyssawki."},{"t":"Lekarz unosi siebie, oni 20 kg","d":"**David Collisante (\"Orthosonic Lift\") uniósł całe swoje ciało; ekipa Moulda z Jamiem doszła do około 20 kg.** Ich \"wizytówka\" to koło z aluminium grubości 0,5 mm i mocny wibrator typu butt kicker (~400 W, masa ~15 kg) podwieszony na linkach bezpieczeństwa.\n\nWażna rada Collisante: sufit musi być sztywny - jeśli wibruje razem z płytką, tracicie energię. Zbudowali więc atrapę sufitu z drewnem, gwoździami i kowadłem dla masy. Po dostrajaniu częstotliwości i obciążenia wynik to około 20 kg - daleko od wagi człowieka; próby z laptopem i talerzami pokazały ~1 kg, potem ~10 kg."}],"conclusion":"Według autora ssanie bierze się z biegnącej fali w elastycznej płytce, która wypompowuje powietrze ze szczeliny szybciej, niż wraca. Uniesienie człowieka jest możliwe w rękach hobbystów, ale w ich garażowym setupie skończyło się na dziesiątkach kilogramów, nie na pełnej masie ciała.","factchecks":[{"claim":"Chwytak Bernoulliego unosi obiekt, dmuchając powietrzem w szczelinę.","verdict":"prawda","note":"Stosowany m.in. do waferów; zasada Bernoulli + geometria dyszy i szczeliny.","p":0,"src":[["Wikipedia (ang.): zasada Bernoulliego - hasło \"Bernoulli's principle\"","https://en.wikipedia.org/wiki/Bernoulli%27s_principle"],["Wikipedia (ang.): chwytak próżniowy (kontekst) - hasło \"Vacuum gripper\"","https://en.wikipedia.org/wiki/Vacuum_gripper"]]},{"claim":"Fale stojące na wibrującej płycie zbierają piasek w węzłach (Chladni).","verdict":"prawda","note":"Klasyczne figury Chladniego; węzły prawie nie ruchają się, antyszęści maksymalnie.","p":1,"src":[["Wikipedia (ang.): figury Chladniego - hasło \"Chladni figures\"","https://en.wikipedia.org/wiki/Chladni_figures"]]},{"claim":"Pompy perystaltyczne wyciskają płyn falą ściśnięcia węża.","verdict":"prawda","note":"Analogia autora do wypychania kieszeni powietrza przez falę biegnącą.","p":2,"src":[["Wikipedia (ang.): pompa perystaltyczna - hasło \"Peristaltic pump\"","https://en.wikipedia.org/wiki/Peristaltic_pump"]]}],"bias":"Eksperyment i uproszczenia mechanizmu; autor przyznaje spory w literaturze. Sponsor: Bluedot (kursy AI safety). Sklep z pluszakiem na końcu."},{"id":"crevoo9ktOo","title_pl":"8 zasad męskiego stylu, które warto łamać","title":"8 Menswear Rules You Should Break","channel":"He Spoke Style","url":"https://www.youtube.com/watch?v=crevoo9ktOo","date":"2026-09-28","duration":708,"views":77647,"section":"Moda","transcript":"youtube","added":"2026-11-06","tags":["Psychologia"],"about":"He Spoke Style: skąd wzięły się reguły (białe po Labor Day, pasek=buty, skarpety, zegarek do smokingu) i kiedy je łamać.","intro":"He Spoke Style tłumaczy, że można znać wszystkie zasady menswear i nadal nie mieć stylu - bo styl to nie checklista. Film bierze 8 klasycznych reguł: skąd są, po co istnieją i kiedy je łamać.\n\nPrzykłady: zakaz bieli po Labor Day, idealne dopasowanie paska do butów, skarpety, zegarek do black tie. Wniosek: najpierw zrozum funkcję reguły, potem zdecyduj.","points":[{"t":"Biel po Labor Day","d":"**Zakaz bieli po Labor Day rósł z podziału strój kurortowy vs miejski i z sygnałów klasowych kto zna konwenanse.** Autor nie wyrzuca koloru z szafy przez datę w kalendarzu.\n\nKremowy flanel zimą na tle navy i charcoal wygląda elegancko; białe lniane spodnie w styczniu - nie. Liczy się tkanina i kontekst, nie data."},{"t":"Pasek ma równać buty?","d":"**Dokładne dopasowanie brązów jest prawie niemożliwe (odcień, wykończenie, starzenie skóry) i często wygląda gorzej niż bliskie tony.** Analogia: krawat i poszetka z identycznej tkaniny bywają zestawem z katalogu, nie stylowymi.\n\nCzarny nadal najłatwiej spinać; w brązach dąż do harmonii, nie do xeroxa."},{"t":"Skarpety, zegarek, marynarka","d":"**Kolorowe skarpety mają sens w looku preppy; na holiday black tie autor latami nosi jaskrawoczerwone - świadomie źle.** Zegarek do smokingu: estetyka minimalizmu plus etykieta nie spoglądaj na czas; on i tak czasem zakłada.\n\nNa kamerze zostawia zapiętą marynarkę siedząc (broadcast practice), choć klasycznie przy siadaniu się rozpina. Puenta: przestań panikować o checklistę i noś ubrania."}],"conclusion":"Reguły są mapą, nie kajdankami. Łamanie ma sens dopiero gdy wiesz, co reguła robi dla outfitu - inaczej to tylko chaos z butów i paska w różnych brązach.","factchecks":[{"claim":"No white after Labor Day to amerykańska konwencja sezonowa, nie prawo fizyki.","verdict":"prawda","note":"Historycznie wiązana z przejściem z letniego stroju kurortowego do miejskiego.","p":0,"src":[["Wikipedia (ang.): Labor Day","https://en.wikipedia.org/wiki/Labor_Day"]]},{"claim":"W black tie tradycyjnie unika się rzucających się akcesoriów.","verdict":"prawda","note":"Dress code black tie celuje w jednolity, formalny wygląd.","p":2,"src":[["Wikipedia (ang.): black tie","https://en.wikipedia.org/wiki/Black_tie"]]}],"bias":"Perspektywa autora (czerwone skarpety do black tie) jest świadomie subiektywna; film promuje też inne playlisty kanału."},{"id":"naujBF9lMLw","title_pl":"15 drobiazgów, które robią prawdziwego dżentelmena","title":"15 Little Things Only True Gentlemen Do (That Have a Big Impact)","channel":"Gentleman's Gazette","url":"https://www.youtube.com/watch?v=naujBF9lMLw","date":"2026-09-27","duration":795,"views":107993,"section":"Moda","transcript":"youtube","added":"2026-11-06","tags":["Psychologia"],"about":"Gentleman's Gazette: parasol dla towarzysza, pytanie zanim dasz radę, umiar w imionach, tempo kroku, kartki z podziękowaniem.","intro":"Gentleman's Gazette argumentuje, że dżentelmena poznaje się nie po wielkim geście, tylko po małych nawykach powtarzanych bez oczekiwania oklasków. Film wymienia 15 takich detali.\n\nZakres: od praktycznej troski (parasol), przez etykietę rozmowy i chodzenia, po pisanie podziękowań i ubiór dopasowany do okazji - bez celebryckiego flexu.","points":[{"t":"Troska i rozmowa","d":"**Parasol bierzesz na wszelki wypadek - głównie by chronić towarzysza, nawet kosztem własnego zmoknięcia.** To foresight, nie gadżet.\n\nZanim dasz radę, pytasz: czy chcesz opinii, czy tylko ucha? Imiona w rozmowie używasz rzadko, na początku i w ważnym momencie; co drugie zdanie brzmi jak manipulacja z podręcznika sprzedaży."},{"t":"Obecność fizyczna i wdzięczność","d":"**Wstajesz przy pierwszym spotkaniu; idąc, dopasowujesz tempo do drugiej osoby (obcasy, starszy wiek, spacer).** Wyprzedzanie o kilka metrów czyta się jako \"wolę być gdzie indziej\".\n\nOdręczne podziękowanie waży więcej niż szybki SMS - czas i papier sygnalizują, że gest był ważny."},{"t":"Strój do kontekstu","d":"**Znać różnicę między lunchem outdoor a kolacją o 20:00: ani overdress, ani niedbałość, przy zachowaniu własnego stylu.** Według autorów mistrzostwo to równowaga autentyczności i okazji.\n\nPuenta: żaden pojedynczy nawyk nie buduje reputacji - buduje je suma drobiazgów powtarzanych tak często, że stają się odruchem."}],"conclusion":"GG sprzedaje etykietę jako codzienną uważność na innych, nie jako kostium. Jeśli masz poprawić jedną rzecz: pytaj zanim doradzisz i nie zostawiaj ludzi w tyle na chodniku.","factchecks":[{"claim":"Używanie imienia zwiększa poczucie uwagi w rozmowie (z umiarem).","verdict":"prawda","note":"Efekt personalizacji jest znany w komunikacji; nadużycie brzmi sztucznie.","p":0,"src":[["Wikipedia (ang.): etiquette","https://en.wikipedia.org/wiki/Etiquette"]]},{"claim":"Odręczne podziękowania są odbierane jako bardziej osobiste niż wiadomość cyfrowa.","verdict":"prawda","note":"Wyższy koszt sygnału (czas, papier) zwiększa wiarygodność wdzięczności.","p":1,"src":[["Wikipedia (ang.): thank-you note","https://en.wikipedia.org/wiki/Thank-you_note"]]}],"bias":"Perspektywa klasycznej etykiety GG; część rad łatwiej stosować w miejskim, zamożniejszym kontekście. Film promuje własne poradniki."},{"id":"v-ZAKS02Gm4","title_pl":"10 szalonych rozwiązań inżynieryjnych - od Millau po Valencia","title":"The Craziest Solutions Engineers Ever Came Up With","channel":"Some Guy Who Knows Stuff","url":"https://www.youtube.com/watch?v=v-ZAKS02Gm4","date":"2026-09-24","duration":1183,"views":449427,"section":"Technologie","transcript":"youtube","added":"2026-11-04","tags":["Technika","Inżynieria","Budownictwo"],"about":"Some Guy Who Knows Stuff opisuje 10 projektów, w których inżynierowie ominęli \"niemożliwe\" warunki terenu i konstrukcji.","intro":"Kanał Some Guy Who Knows Stuff wymienia dziesięć nietypowych rozwiązań: wypychany pomost wiaduktu Millau, Gotthard Base Tunnel, Falkirk Wheel, Tarzę Trzech Przełomów, lotnisko Kansai na sztucznej wyspie, drogę Guoliang, tłumik masowy w Taipei 101, kolej przez Takla Makan, Eurotunel i nietypowy montaż Palau de les Arts w Valencii.","points":[{"t":"Wiadukt Millau","d":"Ponad 2,4 km nad doliną Tarn; najwyższy punkt ok. 343 m. Stalowy pomost montowano za przyczółkiem i hydraulicznym \"launching\" przesuwano z filaru na filar, zamiast schodzić autostradą w dolinę."},{"t":"Gotthard Base Tunnel","d":"Ok. 57 km przez Alpy. TBM i miejscami dynamit; wysoka temperatura wymaga chłodzenia. Urobek częściowo przetwarzano na budowę; ekipy z różnych kierunków zeszły się pod ziemią."},{"t":"Falkirk Wheel","d":"Koło ok. 35 m łączy kanały różniące się o ponad 24 m. Dwie gondole z wodą i łodzią; zrównoważone obciążenie pozwala kręcić stosunkowo małym silnikiem (ukończone 2002)."},{"t":"Tama Three Gorges i Kansai","d":"Tama >2 km na Jangcy: dywersja rzeki, głębokie fundamenty, beton w sekcjach z chłodzeniem. Kansai: sztuczna wyspa na miękkim dnie Zatoki Osaka, ściany morskie i podnoszenie terminalu siłownikami przy osiadaniu."},{"t":"Guoliang i Taipei 101","d":"Tunel drogowy wykuty w ścianie Taihang głównie ręcznie i materiałami wybuchowymi. Taipei 101 (>500 m): tuned mass damper - stalowa kula setek ton tłumi huśtanie od wiatru i wstrząsów."},{"t":"Takla Makan i Eurotunel","d":"Kolej przez pustynię: roślinność i bariery przeciw wydmom, stały monitoring piasku. Channel Tunnel ~50 km (ok. 38 km pod dnem); TBM z obu stron, dwa tunele kolejowe + serwisowy."},{"t":"Palau de les Arts","d":"W Valencii ogromny zakrzywiony dach i elementy stalowo-betonowe montowano etapami z tymczasowymi podporami; części prefabrykowane na ziemi, potem podnoszone - wrażenie \"budowy od góry\"."}],"conclusion":"Wspólny wątek: nie walczyć z terenem na siłę, tylko zaprojektować proces budowy i utrzymania pod konkretne ograniczenia.","factchecks":[{"claim":"Wiadukt Millau ma ponad 2,4 km i maszt wyższy niż Wieża Eiffla (ok. 343 m).","verdict":"prawda","note":"Oficjalnie długość 2460 m; najwyższy pylon 343 m, pomost do 270 m nad ziemią.","p":0,"src":[["Wikipedia (ang.): Millau Viaduct","https://en.wikipedia.org/wiki/Millau_Viaduct"]]},{"claim":"Gotthard Base Tunnel ma ok. 57 km i jest jednym z najdłuższych tuneli kolejowych.","verdict":"prawda","note":"Długość 57,1 km; otwarty w 2016 jako najdłuższy kolejowy tunel świata.","p":1,"src":[["Wikipedia (ang.): Gotthard Base Tunnel","https://en.wikipedia.org/wiki/Gotthard_Base_Tunnel"]]},{"claim":"Falkirk Wheel pokonuje różnicę poziomów kanałów ok. 24 m kołem z 2002 r.","verdict":"prawda","note":"Koło łączy Forth and Clyde z Union Canal, różnica ok. 24 m; otwarte w 2002.","p":2,"src":[["Wikipedia (ang.): Falkirk Wheel","https://en.wikipedia.org/wiki/Falkirk_Wheel"]]},{"claim":"Eurotunel ma ok. 50 km, z czego większość pod dnem kanału.","verdict":"prawda","note":"Całkowita długość 50,45 km, w tym 37,9 km pod morzem.","p":5,"src":[["Wikipedia (ang.): Channel Tunnel","https://en.wikipedia.org/wiki/Channel_Tunnel"]]}],"bias":"Format top-10 z uproszczeniami i dramatycznym narratorem; numer 1 (Valencia) jest mniej precyzyjny niż pozostałe przykłady."},{"id":"wA4kLcKq8Nk","title_pl":"Prof. Krzysztof Turzyński o inflacji, ciemnej materii i śladach dawnego wszechświata","title":"Fizyk o śladach wcześniejszego wszechświata. II prof. Krzysztof Turzyński","channel":"didaskalia","url":"https://www.youtube.com/watch?v=wA4kLcKq8Nk","date":"2026-09-20","duration":5900,"views":581341,"section":"Didaskalia","transcript":"youtube","added":"2026-11-03","tags":["Nauka","Fizyka","Kosmologia"],"about":"Fizyk teoretyk z UW tłumaczy, co wiemy o pierwszych chwilach wszechświata, czego szukać w promieniowaniu tła i czy potrzebny jest większy zderzacz.","intro":"Półtoragodzinna rozmowa Patrycjusza Wyżgi z prof. Krzysztofem Turzyńskim z Wydziału Fizyki UW (wrzesień 2026). Gość spokojnie oddziela to, co w kosmologii dobrze zbadane, od spekulacji: mówi o inflacji, przewadze materii nad antymaterią, cyklicznym wszechświecie Penrose'a, odkryciu promieniowania tła, ciemnej materii, granicach modelu standardowego i o tym, czy AI zastąpi fizyków.","points":[{"t":"Do kiedy sięga wiedza","d":"Wczesny wszechświat był gęsty i gorący jak metro w godzinach szczytu. Oddziaływania jądrowe znamy na tyle, by opisać powstawanie pierwszych jąder. Wcześniejsze chwile i wyższe energie to już pole do płodnych, ale niepewnych spekulacji."},{"t":"Inflacja","d":"Ulubiona opowieść gościa: okres bardzo szybkiego i przyspieszonego rozszerzania, na który mamy silne przesłanki. Rozrzedziła ewentualne relikty wcześniejszych epok, a pustą przestrzeń zapełniły cząstki w procesie, który wciąż nie jest dobrze zrozumiany."},{"t":"Materia kontra antymateria","d":"Nie widzimy obszarów antymaterii, bo na granicy z materią świeciłyby w promieniowaniu gamma. Skąd wzięła się nadwyżka materii, nie wiadomo. Turzyński w doktoracie pokazał ograniczenia dla zbyt optymistycznych modeli."},{"t":"Czym jest dobra teoria","d":"Za Popperem: teoria ma przewidywać coś jeszcze nieodkrytego. Spełnione przewidywanie nie dowodzi jednak teorii, jest raczej miłą niespodzianką jak prezent na urodziny. Liczy się możliwość obalenia."},{"t":"Cykliczny wszechświat Penrose'a","d":"Kurczący się wszechświat to dopuszczalne rozwiązanie równań Einsteina. Penrose proponuje szukać w promieniowaniu tła blizn po przejściu z kurczenia do rozszerzania. Gość tym się nie zajmuje, ale chętnie zobaczyłby taki przełom."},{"t":"Jak powstało promieniowanie tła","d":"Gdy wszechświat ostygł, fotony przestały rozbijać atomy wodoru i poleciały swobodnie, a rozszerzanie przesunęło je w zakres mikrofal. Zespół z Princeton z młodym Jamesem Peeblesem był gotowy do pomiaru, ale ubiegli go inni."},{"t":"Czy budować większy zderzacz","d":"LHC odkrył bozon Higgsa i wykluczył wiele egzotycznych pomysłów. Dotąd każdy skok energii o rzędy wielkości przynosił przełom, ale nikt nie da gwarancji, a to decyzja dla finansujących naukę."},{"t":"Skala Plancka bez strachu","d":"Łącząc prędkość światła, stałą Plancka i stałą grawitacji, dostajemy energię i masę Plancka. Masa wychodzi rzędu stutysięcznej części grama, tylko skupionej w punkcie, gdzie powinna działać kwantowa grawitacja."},{"t":"Fale grawitacyjne","d":"Mogą zdradzić przejścia fazowe we wczesnym wszechświecie, np. związane z polem Higgsa. Kosmiczny interferometr LISA ma to badać, a przy projekcie i przy odkryciach Virgo pracują fizycy z Polski."},{"t":"Ciemna materia","d":"Zwicky zauważył brakującą masę w gromadach galaktyk, Vera Rubin w ruchu gwiazd w galaktykach, a promieniowanie tła dało trzecią nogę. Detektory w kopalniach na razie mówią, gdzie jej nie ma, jak u Puchatka zaglądającego do garnka z miodem."},{"t":"Fizyka praktyczna i AI","d":"Docenia fizykę ciała stałego, spintronikę i nowe rodzaje promieniotwórczości. AI imponuje w matematyce, ale w fizyce dane muszą pochodzić z eksperymentów, a zupełnie nowe pomysły wciąż wymagają ludzkiej kreatywności."}],"conclusion":"Wzorowa lekcja pokory w kosmologii: dużo wiemy, ale gość starannie zaznacza, gdzie kończą się dane, a zaczynają opowieści.","factchecks":[{"claim":"Masa Plancka to wielkość rzędu stutysięcznej części grama.","verdict":"prawda","note":"Wynosi ok. 2,18 × 10^-8 kg, czyli ok. 22 mikrogramy.","p":7,"src":[["Wikipedia (ang.): jednostki Plancka - hasło \"Planck units\"","https://en.wikipedia.org/wiki/Planck_units"]]},{"claim":"Zwicky jako pierwszy wskazał na niewidoczną masę w gromadach galaktyk.","verdict":"prawda","note":"W 1933 r. zaproponował ciemną materię, by wyjaśnić ruchy galaktyk w Gromadzie w Warkoczu Bereniki.","p":9,"src":[["Wikipedia (ang.): Fritz Zwicky - hasło \"Fritz Zwicky\"","https://en.wikipedia.org/wiki/Fritz_Zwicky"]]},{"claim":"Kosmiczny interferometr LISA jest w budowie.","verdict":"prawda","note":"ESA zatwierdziła misję w styczniu 2024 r., a budowa ruszyła w 2025 r.","p":8,"src":[["Wikipedia (ang.): LISA - hasło \"Laser Interferometer Space Antenna\"","https://en.wikipedia.org/wiki/Laser_Interferometer_Space_Antenna"]]},{"claim":"Model Penrose'a przewiduje ślady poprzedniego wszechświata w promieniowaniu tła.","verdict":"prawda","note":"Tzw. punkty Hawkinga. Zgłoszone ich wykrycie jest sporne i część twierdzeń wycofano.","p":4,"src":[["Wikipedia (ang.): konforemna kosmologia cykliczna - hasło \"Conformal cyclic cosmology\"","https://en.wikipedia.org/wiki/Conformal_cyclic_cosmology"]]}],"bias":"Brak wyraźnej stronniczości. Gość sam oddziela fakty od hipotez. Rozmowa miejscami gubi się w dygresjach, a w odcinku są reklamy banku i optyka."},{"id":"qJIDOq0ezTs","title_pl":"Trzy niedokończone rzymskie megaprojekty","title":"Three Unfinished Roman Megaprojects","channel":"toldinstone","url":"https://www.youtube.com/watch?v=qJIDOq0ezTs","date":"2026-09-12","duration":740,"views":918842,"section":"Historia","transcript":"whisper","added":"2026-11-05","tags":["Historia","Technika"],"about":"toldinstone: przerzut Tybru Cezara, kanał Koryncki Nerona i niedokończone miasto Waldgirmes w Germanii.","intro":"Garrett Ryan (toldinstone) pokazuje, że Rzymianie słyną z Pantheonu i Pont du Gard, ale czasem nie kończyli najambitniejszych przedsięwzięć. Ranking trzech niedokończonych megaprojektów: od przerzutu Tybru przez kanał przez Przesmyk Koryncki po miasto w Germanii.\n\nTo inny film niż ten o \"zapomnianych\" megaprojektach - tu wątek to właśnie niedokończenie: zabójstwo Cezara, śmierć Nerona i klęska w Teutoburgu urwały prace.","points":[{"t":"3. Prze
