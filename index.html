ceramikę, biżuterię i ludzkie kości. Żyją tam ryby bez oczu."},{"t":"7. Góry Gwiezdne (Papua-Nowa Gwinea)","d":"Według autora żaden człowiek nie postawił tam stopy. To ściany wapiennych klifów w gęstym lesie deszczowym, daleko od dróg, z ciągłym deszczem i pijawkami. Jest tam ogromny klif Hindenburg Wall, na który nikt się nie wspiął; nawet okoliczne plemiona nie zbadały części terenu."},{"t":"6. Rów Nowych Hebrydów","d":"Rów na południowym Pacyfiku między Vanuatu a Nową Kaledonią, ok. 7200 m głębokości, \"Everest by się w nim zmieścił\". Ciśnienie zgniotłoby człowieka jak puszkę, więc schodziły tam tylko roboty z kamerami i sfilmowały dziwne ryby. Warunki mają przypominać te na księżycach Jowisza."},{"t":"5. Tsingy de Bemaraha (Madagaskar)","d":"Park Tsingy de Bemaraha to las ostrych wapiennych iglic; nazwa ma znaczyć \"gdzie nie można chodzić boso\". Iglice przecinają buty, bywają wysokie jak 5-piętrowy budynek i stoją tak ciasno, że nie da się między nimi przejść. Zbadano tylko brzegi, na linach; żyją tam gatunki niespotykane gdzie indziej."},{"t":"4. Serce pustyni Namib","d":"Morze wydm Namib, część wyższa od Empire State Building, obszar wielkości stanu Maryland. Wydmy ciągle się przesuwają, więc mapy szybko się dezaktualizują. W dzień piasek może stopić buty, w nocy jest mróz, nie ma wody ani dróg. To obiekt UNESCO, więc wnętrze jest chronione."},{"t":"3. Sandy Island","d":"Wyspa między Australią a Nową Kaledonią była na mapach przez setki lat, także w Google Maps; James Cook miał ją opisać w XVIII w. W 2012 r. australijscy naukowcy popłynęli w to miejsce i znaleźli otwarte morze. Możliwe wyjaśnienia: zatonęła, błąd kopiowany na mapach albo dryfujący pumeks."},{"t":"2. Północna Grenlandia","d":"Ludzie od tysięcy lat żyją na wybrzeżach, ale środek północnej Grenlandii jest nietknięty. Lądolód pokrywa ok. 80% wyspy i miejscami ma ponad 1,6 km grubości; do tego silny wiatr i miesiące ciemności. Pod lodem mogą być góry, doliny i jeziora z mikroorganizmami, a topnienie odsłania nowe wyspy."},{"t":"1. Pustynia Takla Makan (Chiny)","d":"\"Pustynia śmierci\", większa od Wielkiej Brytanii, z środkiem, w którym według autora nie był żaden człowiek. Nie ma tam wody, a dookoła są wysokie góry. Nazwa ma znaczyć \"miejsce, z którego się nie wraca\". Jedwabny Szlak szedł tylko brzegami, a pod piaskiem mogą być zaginione miasta."}],"conclusion":"Mimo satelitów i GPS wciąż są miejsca, do których człowiek nie dotarł, głównie przez zakazy, ekstremalne warunki albo zwykłe trudności w dojściu.","factchecks":[{"claim":"Gangkhar Puensum to najwyższa niezdobyta góra; wspinaczka zakazana, a wyprawy nie mogły jej znaleźć.","verdict":"prawda","note":"Szczyt ma 7570 m, a wspinaczka jest zakazana od 2003 r.; wyprawy z lat 80. się nie powiodły.","src":[["Wikipedia (ang.): Gangkhar Puensum","https://en.wikipedia.org/wiki/Gangkhar_Puensum"]],"p":0},{"claim":"Jaskinia Kryształów: 58°C, prawie 100% wilgotności, toksyczne powietrze, wizyty ok. 10 minut.","verdict":"półprawda","note":"Upał, wilgotność i mikroby się zgadzają; głównym zagrożeniem jest upał, nie toksyczne gazy.","src":[["Wikipedia (ang.): Jaskinia Kryształów (Naica) - hasło \"Cave of the Crystals\"","https://en.wikipedia.org/wiki/Cave_of_the_Crystals"],["National Geographic: mikroby z Naica","https://www.nationalgeographic.com/science/article/crystal-caves-mine-microbes-mexico-boston-aaas-aliens-science"]],"p":1},{"claim":"Cenoty Jukatanu: tysiące połączonych jaskiń, ślepe ryby, ofiary Majów.","verdict":"prawda","note":"Sac Actun ma ponad 370 km korytarzy, ale to popularne miejsce nurkowe, a nie \"nieodwiedzone\".","src":[["Wikipedia (ang.): system jaskiń Sac Actun - hasło \"Sistema Sac Actun\"","https://en.wikipedia.org/wiki/Sistema_Sac_Actun"],["Wikipedia (ang.): cenoty - hasło \"Cenote\"","https://en.wikipedia.org/wiki/Cenote"]],"p":2},{"claim":"W Góry Gwiezdne nigdy nie wszedł żaden człowiek.","verdict":"fałsz","note":"Mieszkają tam ludy Min, działa kopalnia Ok Tedi i miasto Tabubil.","src":[["Wikipedia (ang.): Góry Gwiezdne - hasło \"Star Mountains\"","https://en.wikipedia.org/wiki/Star_Mountains"],["Wikipedia (ang.): kopalnia Ok Tedi - hasło \"Ok Tedi Mine\"","https://en.wikipedia.org/wiki/Ok_Tedi_Mine"]],"p":3},{"claim":"Rów Nowych Hebrydów: Everest by się w nim zmieścił; nikt tam nie był, były tylko roboty.","verdict":"fałsz","note":"Rów ma ok. 7,8 km, a Everest 8,85 km, więc szczyt by wystawał; na dno zszedł Victor Vescovo w 2021 r.","src":[["Wikipedia (ang.): Rów Nowych Hebrydów - hasło \"New Hebrides Trench\"","https://en.wikipedia.org/wiki/New_Hebrides_Trench"],["Guinness: najwięcej odwiedzonych rowów","https://www.guinnessworldrecords.com/world-records/752796-most-deep-sea-trenches-visited-by-an-individual"]],"p":4},{"claim":"Tsingy: nazwa znaczy \"gdzie nie można chodzić boso\"; wnętrze nietknięte.","verdict":"półprawda","note":"Tłumaczenie nazwy się zgadza, ale park ma szlaki dla turystów i jest badany.","src":[["Wikipedia (ang.): Tsingy de Bemaraha","https://en.wikipedia.org/wiki/Tsingy_de_Bemaraha_Strict_Nature_Reserve"],["UNESCO: suche lasy Andrefana (dawniej Tsingy de Bemaraha)","https://whc.unesco.org/en/list/494/"]],"p":5},{"claim":"Namib: wydmy wyższe od Empire State Building, obszar wielkości Maryland, wnętrza nigdy nie odwiedzono.","verdict":"przesada","note":"Wielkość i wydmy (do ok. 380 m) się zgadzają, ale okolice Sossusvlei to masowa turystyka.","src":[["UNESCO: Morze Piasku Namib","https://whc.unesco.org/en/list/1430/"],["Wikipedia (ang.): pustynia Namib - hasło \"Namib\"","https://en.wikipedia.org/wiki/Namib"]],"p":6},{"claim":"Sandy Island: \"odkrytą\" przez Jamesa Cooka wyspę obalili Australijczycy w 2012.","verdict":"półprawda","note":"W 2012 r. potwierdzono, że wyspy nie ma, ale pierwszy zapis jest z 1876 r., nie od Cooka.","src":[["Wikipedia (ang.): Sandy Island (Nowa Kaledonia) - hasło \"Sandy Island (New Caledonia)\"","https://en.wikipedia.org/wiki/Sandy_Island,_New_Caledonia"]],"p":7},{"claim":"Lądolód pokrywa ok. 80% Grenlandii, a wnętrze północnej Grenlandii jest nietknięte przez człowieka.","verdict":"półprawda","note":"Lądolód pokrywa ok. 80% wyspy, ale w głębi działały stacje wiertnicze i wiele razy go przekraczano.","src":[["Wikipedia (ang.): lądolód grenlandzki - hasło \"Greenland ice sheet\"","https://en.wikipedia.org/wiki/Greenland_ice_sheet"],["Wikipedia (ang.): odwiert lodowy NorthGRIP - hasło \"NorthGRIP\"","https://en.wikipedia.org/wiki/North_Greenland_Ice_Core_Project"]],"p":8},{"claim":"Takla Makan: większa od Wielkiej Brytanii, w środku nie było człowieka, nazwa znaczy \"miejsce bez powrotu\".","verdict":"fałsz","note":"Jest większa od Wielkiej Brytanii, ale biegnie przez nią autostrada, a pogrzebane miasta odkopano 100 lat temu.","src":[["Wikipedia (ang.): pustynia Takla Makan - hasło \"Taklamakan Desert\"","https://en.wikipedia.org/wiki/Taklamakan_Desert"],["Wikipedia (ang.): autostrada przez pustynię Tarym - hasło \"Tarim Desert Highway\"","https://en.wikipedia.org/wiki/Tarim_Desert_Highway"]],"p":9}],"bias":"Tytuł wprowadza w błąd: większość miejsc była odwiedzana; uczciwiej byłoby \"miejsca słabo zbadane\". Transkrypt z Whisper.","channel":"Chill Dude Explains"},{"id":"7bOQ7fLCqgI","title_pl":"9 części ciała, które kiedyś znikną","title":"9 Body Parts That Will Disappear One Day","url":"https://www.youtube.com/watch?v=7bOQ7fLCqgI","date":"2024-04-27","duration":528,"views":1188491,"transcript":"youtube","added":"2026-11-03","tags":["Ciało i zdrowie","Ewolucja"],"about":"9 szczątkowych części ciała, które według autora mogą kiedyś zniknąć w wyniku ewolucji.","intro":"Ranking 9 części ciała, które według autora ewolucja powoli \"wygasza\", bo przestały być potrzebne. Są tu wyrostek robaczkowy, palce u stóp, narząd Jacobsona, mięśnie od gęsiej skórki, kość ogonowa, mięsień dłoniowy długi, zęby mądrości, mięśnie uszu i zatoki. Autor przy każdej tłumaczy, do czego służyła przodkom i dlaczego dziś ma znikać.","points":[{"t":"9. Wyrostek robaczkowy","d":"Mógł pomagać przodkom trawić twarde rośliny, a przy dzisiejszej diecie według autora nic nie robi. Gdy się zapali, lekarze go usuwają i da się normalnie żyć. Autor twierdzi, że w niektórych populacjach nawet 1 na 5 osób rodzi się bez wyrostka."},{"t":"8. Palce u stóp","d":"Przodkowie potrzebowali chwytnych palców do wspinaczki. Dziś większość pracy przy chodzeniu i bieganiu robi duży palec, a buty sprawiają, że małe palce \"leniwieją\". Naukowcy mają przewidywać, że w bardzo dalekiej przyszłości palce się skrócą, ale nie za naszego życia."},{"t":"7. Narząd Jacobsona","d":"Narząd w nosie do wykrywania feromonów, u ludzi według autora praktycznie nieczynny, jak gadżet z wyczerpaną baterią. Przodkom mógł sygnalizować płodność albo złość, ale zaczęliśmy polegać na wzroku i słuchu. Część ludzi rodzi się bez niego i nie ma z tym problemu."},{"t":"6. Mięśnie przywłosowe","d":"To one robią gęsią skórkę. U owłosionych przodków stroszyły futro, żeby wyglądać groźniej, np. przed tygrysem szablozębnym. Według autora słabną i stają się rzadsze, więc kiedyś gęsia skórka może być ciekawostką z podręcznika."},{"t":"5. Kość ogonowa","d":"Pozostałość ogona przodków, którzy używali go do równowagi i komunikacji. Nie jest całkiem bezużyteczna, bo przyczepiają się do niej mięśnie i więzadła. Bardzo rzadko dzieci rodzą się z małym ogonkiem bez kości (tylko tkanka i naczynia), który zwykle usuwa się po porodzie."},{"t":"4. Mięsień dłoniowy długi","d":"Pomaga zginać nadgarstek, ale tę pracę i tak wykonują inne mięśnie. Według autora nie ma go ok. 14% ludzi. Przodkom mógł się przydawać przy przeskakiwaniu z drzewa na drzewo. Chirurdzy pobierają jego ścięgno do przeszczepów bez szkody dla ręki."},{"t":"3. Zęby mądrości","d":"Wyrastają w wieku ok. 17-25 lat, gdy w szczęce nie ma już miejsca, więc przesuwają inne zęby. Przodkowie potrzebowali zapasowych zębów do surowego jedzenia i szybko tracili zęby. Gotujemy i kroimy jedzenie, szczęki się zmniejszyły, a coraz więcej ludzi rodzi się bez ósemek."},{"t":"2. Mięśnie uszu","d":"Dzięki nim niektórzy ruszają uszami, ale większość nie umie ich używać. Przodkom mogły pomagać namierzać dźwięki, potem zaczęliśmy polegać na wzroku. Autor wspomina rekord: mężczyzna z Indii poruszył uszami 99 razy w 30 sekund."},{"t":"1. Zatoki","d":"Nie wiadomo do końca, po co są: hipotezy to nawilżanie powietrza, odciążenie czaszki i śluz łapiący zarazki. Według autora część badaczy uważa, że powoli zanikają, a jedno badanie wiązało mniejsze zatoki z rzadszymi infekcjami. Ewentualne zniknięcie trwałoby tysiące lat."}],"conclusion":"Ciało nosi ślady ewolucji, a niektóre z tych części mogą zniknąć, ale zajmie to tysiące lat.","factchecks":[{"claim":"Wyrostek robaczkowy jest bezużyteczny.","verdict":"półprawda","note":"Nowsze badania wskazują na rolę odpornościową wyrostka, co przeczy prostej tezie o szczątkowości.","src":[["Wikipedia (ang.): wyrostek robaczkowy - hasło \"Appendix (anatomy)\"","https://en.wikipedia.org/wiki/Appendix_(anatomy)"],["Smith i in. 2023, Anat Rec: przegląd funkcji i ewolucji wyrostka (PubMed)","https://pubmed.ncbi.nlm.nih.gov/35363436/"],["Smith i in. 2009, J Evol Biol (PubMed)","https://pubmed.ncbi.nlm.nih.gov/19678866/"]],"p":0},{"claim":"Coraz więcej ludzi rodzi się bez wyrostka (nawet 1 na 5).","verdict":"fałsz","note":"Wrodzony brak wyrostka to skrajna rzadkość, szacowana na ok. 1 na 100 000 operacji brzucha.","src":[["Opis przypadku agenezji wyrostka (PMC)","https://pmc.ncbi.nlm.nih.gov/articles/PMC8043782/"]],"p":0},{"claim":"Część ludzi nie ma mięśnia dłoniowego długiego.","verdict":"prawda","note":"Brak występuje u ok. 10-15% ludzi, z dużymi różnicami między populacjami.","src":[["Wikipedia (ang.): mięsień dłoniowy długi - hasło \"Palmaris longus\"","https://en.wikipedia.org/wiki/Palmaris_longus_muscle"]],"p":5},{"claim":"U części ludzi zęby mądrości się nie rozwijają.","verdict":"prawda","note":"Metaanaliza Cartera i Worthingtona (2015) daje ok. 22% osób z brakiem co najmniej jednego zęba mądrości.","src":[["Carter i Worthington 2015, J Dent Res (DOI)","https://doi.org/10.1177/0022034515581644"],["Wikipedia (ang.): zęby mądrości - hasło \"Wisdom tooth\"","https://en.wikipedia.org/wiki/Wisdom_tooth"]],"p":6},{"claim":"Narząd Jacobsona, kość ogonowa, mięśnie przywłosowe i uszne to struktury szczątkowe.","verdict":"prawda","note":"Standardowe przykłady w biologii. Narząd lemieszowo-nosowy u dorosłych ludzi nie ma działających połączeń nerwowych.","src":[["Wikipedia (ang.): narządy szczątkowe u człowieka - hasło \"Human vestigiality\"","https://en.wikipedia.org/wiki/Human_vestigiality"],["Wikipedia (ang.): narząd lemieszowo-nosowy (Jacobsona) - hasło \"Vomeronasal organ\"","https://en.wikipedia.org/wiki/Vomeronasal_organ"]],"p":null},{"claim":"Te części ciała \"znikną kiedyś\".","verdict":"nie da się sprawdzić","note":"Ewolucja nie usuwa zbędnych części sama; potrzebna jest presja selekcyjna, więc to spekulacja.","src":[["Wikipedia (ang.): szczątkowość narządów - hasło \"Vestigiality\"","https://en.wikipedia.org/wiki/Vestigiality"]],"p":null}],"bias":"Uproszczona wizja ewolucji jako \"usuwania zbędnych części\". Jedna liczba (brak wyrostka) jest wyssana z palca, a wyrostek opisany według przestarzałej wiedzy.","channel":"Chill Dude Explains"},{"id":"UTz2Xg4oMxs","title_pl":"9 najbardziej bolesnych rzeczy, jakich można doświadczyć","title":"9 MOST PAINFUL Things You Can EVER Experience!","url":"https://www.youtube.com/watch?v=UTz2Xg4oMxs","date":"2024-04-07","duration":548,"views":1114282,"transcript":"youtube","added":"2026-11-03","tags":["Ciało i zdrowie","Natura"],"about":"Ranking 9 najbardziej bolesnych doświadczeń, od kamieni nerkowych po użądlenie mrówki-pocisku.","intro":"Ranking 9 najboleśniejszych doświadczeń, jakie może przeżyć człowiek. Autor zaczyna od kamienia nerkowego i chorób (tężec, klasterowe bóle głowy, fibromialgia), a potem przechodzi do zwierząt i roślin: meduzy Irukandji, ryby kamień, rośliny gympie-gympie, osy \"kat\" i mrówki-pocisku. Opisy są obrazowe i żartobliwe, bez podanych źródeł.","points":[{"t":"9. Kamień nerkowy","d":"Zaczyna się od ostrego bólu w plecach, który przesuwa się, gdy kamień wędruje z nerki do pęcherza. Ból narasta jak dźganie nożem od środka, a jedyne wyjście to czekać, aż kamień przejdzie. Niektórzy porównują to do porodu."},{"t":"8. Meduza Irukandji","d":"Meduza mieści się na paznokciu. 20-30 minut po ukłuciu pojawia się ból pleców i brzucha, skurcze mięśni i poczucie nadchodzącej śmierci, przez które poparzeni według autora błagają lekarzy, żeby ich zabili. Autor twierdzi, że spotyka się je od Hawajów po Florydę."},{"t":"7. Tężec","d":"Bakteryjne zakażenie układu nerwowego zaczyna się od skaleczenia, np. zardzewiałym narzędziem albo gwoździem. Po kilku dniach mięśnie sztywnieją, najpierw szczęka (stąd \"szczękościsk\"), potem szyja, ręce i nogi, a skurcze są bardzo bolesne. Autor zaleca aktualne szczepienie."},{"t":"6. Klasterowe bóle głowy","d":"Ból opisywany jak rozgrzany pręt wbijany w oko albo piła w czaszce, według autora ok. 100 razy gorszy od zwykłego bólu głowy. Ataki przychodzą codziennie przez tygodnie lub miesiące, potem znikają i wracają. W trakcie ludzie chodzą w kółko, uderzają głową o ścianę albo krzyczą."},{"t":"5. Ryba kamień (skorpena)","d":"Ryba kamień ukrywa się wśród skał i koralowców tak dobrze, że można na nią patrzeć i jej nie zauważyć. Nadepnięcie wstrzykuje jad, a ból opisywany jest jak jednoczesne miażdżenie, palenie i porażenie prądem. Niektórzy według autora prosili lekarzy o amputację nogi."},{"t":"4. Fibromialgia","d":"Przewlekła choroba z bólem w całym ciele, zmęczeniem mimo snu i nadwrażliwością na dotyk. Jest niewidoczna, więc chorych bierze się za przewrażliwionych. Opisują ją jak oparzenie słoneczne całego ciała, do tego mgła mózgowa i wahania nastroju. Według autora nie ma lekarstwa."},{"t":"3. Gympie-gympie","d":"Australijska roślina pokryta pustymi włoskami z silną neurotoksyną; przy otarciu włoski się łamią i wstrzykują ją w skórę. Ból jak użądlenie przez rój os trwa dni, tygodnie albo miesiące, a niektórzy czuli go nawet do 2 lat."},{"t":"2. Osa \"Kat\" (executioner wasp)","d":"Osa z Ameryki Środkowej i Południowej, według autora wielkości małego ptaka, do ok. 5 cm. Jej jad z neurotoksyną daje natychmiastowy ból na godziny, porównywany do uderzenia pociągu, potem gorączkę, poty, nudności i wymioty. To parazytoid: paraliżuje owady i składa w nich jaja."},{"t":"1. Mrówka-pocisk","d":"Nazwa od tego, że użądlenie ma przypominać postrzał; jad bywa nazywany najboleśniejszym na świecie, jak wyrywanie kości przez skórę, a ból trwa do 24 h. W plemieniu w Brazylii młodzi mężczyźni noszą rękawice pełne mrówek przez 10 minut, 20 razy w ciągu kilku miesięcy."}],"conclusion":"Natura i własne ciało potrafią zadać ból wykraczający poza wyobrażenie, a najgorsze w rankingu są użądlenia owadów.","factchecks":[{"claim":"Osa Polistes carnifex ma jad z poneratoksyną, jest wielkości małego ptaka i składa jaja w innych owadach.","verdict":"fałsz","note":"Poneratoksyna to toksyna mrówki-pocisku; ta osa ma do ok. 3,3 cm i nie pasożytuje.","src":[["Wikipedia (ang.): osa Polistes carnifex - hasło \"Polistes carnifex\"","https://en.wikipedia.org/wiki/Polistes_carnifex"],["Wikipedia (ang.): poneratoksyna - hasło \"Poneratoxin\"","https://en.wikipedia.org/wiki/Poneratoxin"]],"p":7},{"claim":"Mrówka-pocisk: ból do 24 h; rytuał rękawic 10 minut, 20 razy.","verdict":"prawda","note":"Najwyższa ocena (4+) w skali bólu Schmidta, ból do 24 h. Rytuał ludu Sateré-Mawé jest dobrze opisany.","src":[["Wikipedia (ang.): mrówka-pocisk - hasło \"Paraponera clavata\"","https://en.wikipedia.org/wiki/Paraponera_clavata"],["Wikipedia (ang.): skala bólu użądleń Schmidta - hasło \"Schmidt sting pain index\"","https://en.wikipedia.org/wiki/Schmidt_sting_pain_index"]],"p":8},{"claim":"Meduza Irukandji występuje od Hawajów po Florydę.","verdict":"półprawda","note":"Carukia barnesi żyje w Australii; na Hawajach i Florydzie podobny syndrom dają inne gatunki.","src":[["Wikipedia (ang.): zespół Irukandji - hasło \"Irukandji syndrome\"","https://en.wikipedia.org/wiki/Irukandji_syndrome"],["Wikipedia (ang.): meduza Carukia barnesi - hasło \"Carukia barnesi\"","https://en.wikipedia.org/wiki/Carukia_barnesi"]],"p":1},{"claim":"Gympie-gympie: ból może trwać miesiące.","verdict":"prawda","note":"Opisy przypadków i badanie toksyn (gympietydy, Science Advances 2020) potwierdzają długotrwały ból, ale relacje o latach są anegdotyczne.","src":[["Wikipedia (ang.): gympie-gympie (Dendrocnide moroides) - hasło \"Dendrocnide moroides\"","https://en.wikipedia.org/wiki/Dendrocnide_moroides"],["Gilding i in. 2020, Science Advances (DOI)","https://doi.org/10.1126/sciadv.abb8828"]],"p":6},{"claim":"Ryba kamień to najbardziej jadowita ryba świata.","verdict":"prawda","note":"Tak się ją powszechnie określa; istnieje antytoksyna, a zgony są rzadkie.","src":[["Wikipedia (ang.): ryby kamienne (Synanceia) - hasło \"Stonefish\"","https://en.wikipedia.org/wiki/Stonefish"]],"p":4},{"claim":"Kamienie nerkowe, klasterowe bóle głowy, tężec, fibromialgia bez lekarstwa.","verdict":"prawda","note":"Opisy zgodne z wiedzą medyczną. Fibromialgii nie da się wyleczyć, ale objawy łagodzi leczenie i ruch.","src":[["Wikipedia (ang.): klasterowy ból głowy - hasło \"Cluster headache\"","https://en.wikipedia.org/wiki/Cluster_headache"],["Wikipedia (ang.): fibromialgia - hasło \"Fibromyalgia\"","https://en.wikipedia.org/wiki/Fibromyalgia"],["WHO: tężec","https://www.who.int/news-room/fact-sheets/detail/tetanus"]],"p":null}],"bias":"Ranking subiektywny (bólu nie da się obiektywnie porównać). Punkt o osie-katu jest w dużej mierze zmyślony; reszta zgodna z faktami.","channel":"Chill Dude Explains"},{"id":"ziYuxvxAw3U","title_pl":"9 najstarszych technologii, których naukowcy wciąż nie potrafią wyjaśnić","title":"9 Oldest Technologies Scientists Still Can’t Explain","url":"https://www.youtube.com/watch?v=ziYuxvxAw3U","date":"2024-03-10","duration":561,"views":1051283,"transcript":"youtube","added":"2026-11-03","tags":["Historia","Technika"],"about":"9 starożytnych technologii, których według autora naukowcy wciąż nie potrafią wyjaśnić ani odtworzyć.","intro":"Ranking 9 dawnych wynalazków i budowli, których według autora wciąż nie umiemy wyjaśnić ani odtworzyć. Są wśród nich rzymski puchar zmieniający kolor, elastyczne szkło i ogień grecki, skrzypce Stradivariego, mechanizm z Antykithiry, stal damasceńska, kamienne kule z Kostaryki, mury Sacsayhuamán w Peru i piramidy w Gizie. Autor często przedstawia legendy i domysły jako pewną historię.","points":[{"t":"9. Puchar Likurga","d":"Rzymski puchar z IV w.: pod światło świeci na czerwono, oglądany z przodu jest zielony. Rzymianie dodali do szkła niewidoczne cząstki złota i srebra, które zmieniają kolor zależnie od kierunku światła. Naukowcy według autora sądzą, że wyszło to przypadkiem, a odtworzyć to umiemy dopiero od niedawna."},{"t":"8. Rzymskie elastyczne szkło","d":"Legenda: wynalazca pokazał cesarzowi Tyberiuszowi miskę ze szkła, która po upuszczeniu tylko się wgniotła, a wgniecenie wyklepał młotkiem. Cesarz bał się spadku wartości złota i srebra, więc kazał go zabić. Autor przyznaje, że nie wiadomo, czy to prawda, a sekret zaginął z wynalazcą."},{"t":"7. Ogień grecki","d":"Mieszanina, która paliła się nawet na wodzie, a polewanie wodą miało ją wzmagać. Według autora używali jej Rzymianie: rzucali granaty z ogniem i pryskali nim z rur na wrogie statki. Przepis był tajemnicą państwową; historycy zgadują żywicę sosnową, wapno palone i inne składniki."},{"t":"6. Skrzypce Stradivariego","d":"Rodzina Stradivarich we Włoszech robiła skrzypce w latach 1650-1750. Mimo badań nikt nie umie dokładnie wyjaśnić ich brzmienia ani go odtworzyć; rodzina używała specjalnego drewna i tajnego przepisu. Kosztują miliony dolarów, kupuje się je jako inwestycję, a część skradziono i zaginęła."},{"t":"5. Mechanizm z Antykithiry","d":"Ok. 100 lat temu nurkowie znaleźli przy greckiej wyspie Antykithira wrak, a w nim bryłę brązu i drewna, według autora pierwszy analogowy komputer. Przewidywał zaćmienia, prowadził kalendarz i wskazywał termin igrzysk. Coś równie złożonego pojawia się dopiero ok. 1200 lat później; nie wiadomo, kto go zrobił."},{"t":"4. Stal damasceńska","d":"Krzyżowcy spotkali u wojowników islamskich miecze, które przecinały pływającą chustkę, wyginały się pod dużym kątem i wracały bez szkody, z wzorem jak płynąca woda. Według autora sekret zaginął; naukowcy podejrzewają dodatek roślin do żelaza. Stal sprzedawano w Damaszku, ale pochodziła z Indii i Iranu."},{"t":"3. Kamienne kule z Kostaryki","d":"Ponad 300 okrągłych kamiennych kul, niektóre do 15 ton i ponad 2 m średnicy, zrobiła nieistniejąca już kultura Diquís. Cel nieznany: drogowskazy do domu wodza albo astronomia. Kamień przywożono z daleka, a kule obijano kamieniami i polerowano piaskiem. W latach 30. XX w. przy karczowaniu pod banany część rozbito, szukając złota."},{"t":"2. Sacsayhuamán (Peru)","d":"Inkaska twierdza chroniąca Cusco, z polerowanych bloków po 100-120 ton dopasowanych tak, że nie wejdzie między nie kartka papieru. Autor odrzuca teorie o ogromnej soczewce i topieniu kamienia ogniskiem. Twierdza przetrwała trzęsienia ziemi, ale Hiszpanie rozbierali ją na materiał do budowy Cusco."},{"t":"1. Piramidy w Gizie","d":"Wielka Piramida to ok. 2,3 mln bloków, od kilku ton do wagi małego domu, a Egipcjanie nie mieli dźwigów ani taczek. Teorie: proste albo zygzakowate rampy, spławianie kamieni Nilem, a nawet zaginione maszyny. Najczęściej wraca wersja z miedzianymi narzędziami, wodą i armią robotników pracujących latami."}],"conclusion":"Dawne cywilizacje miały zaskakującą wiedzę, a część ich technik pozostaje dla nas zagadką.","factchecks":[{"claim":"Puchar Likurga zmienia kolor dzięki nanocząstkom.","verdict":"prawda","note":"Złoto i srebro w nanocząstkach potwierdziło British Museum; efekt jest wyjaśniony.","src":[["British Museum: Puchar Likurga","https://www.britishmuseum.org/collection/object/H_1958-1202-1"],["Wikipedia (ang.): Puchar Likurga - hasło \"Lycurgus Cup\"","https://en.wikipedia.org/wiki/Lycurgus_Cup"]],"p":0},{"claim":"Elastyczne szkło rzymskie.","verdict":"nie da się sprawdzić","note":"Historia pochodzi tylko z anegdot Pliniusza Starszego i Petroniusza; nie ma żadnego artefaktu. Film zaznacza, że to legenda.","src":[["Wikipedia (ang.): szkło elastyczne (vitrum flexile) - hasło \"Flexible glass\"","https://en.wikipedia.org/wiki/Flexible_glass"]],"p":1},{"claim":"Ogień grecki wynaleźli Rzymianie, a jego przepis zaginął.","verdict":"półprawda","note":"Używało go Bizancjum od ok. 672 r.; skład faktycznie nie jest znany.","src":[["Wikipedia (ang.): ogień grecki - hasło \"Greek fire\"","https://en.wikipedia.org/wiki/Greek_fire"]],"p":2},{"claim":"Skrzypiec Stradivariego nie da się odtworzyć i brzmią wyjątkowo.","verdict":"przesada","note":"W ślepych testach (PNAS 2012, 2014) soliści nie odróżniali Stradivariusów od nowych skrzypiec.","src":[["Fritz i in. 2014, PNAS (DOI)","https://doi.org/10.1073/pnas.1323367111"],["Wikipedia (ang.): instrumenty Stradivariego - hasło \"Stradivarius\"","https://en.wikipedia.org/wiki/Stradivarius"]],"p":3},{"claim":"Mechanizm z Antykithiry: znaleziony ok. 100 lat temu, przewidywał zaćmienia, niezrównany przez wieki.","verdict":"prawda","note":"Działanie mechanizmu jest dziś dobrze zrekonstruowane.","src":[["Wikipedia (ang.): mechanizm z Antykithiry - hasło \"Antikythera mechanism\"","https://en.wikipedia.org/wiki/Antikythera_mechanism"],["Freeth i in. 2021, Scientific Reports","https://www.nature.com/articles/s41598-021-84310-w"]],"p":4},{"claim":"Stal damasceńska to zaginiony sekret.","verdict":"przesada","note":"Wzory stali wootz odtworzono w latach 90., a nanorurki znaleziono w jednym ostrzu.","src":[["Wikipedia (ang.): stal damasceńska - hasło \"Damascus steel\"","https://en.wikipedia.org/wiki/Damascus_steel"],["Reibold i in. 2006, Nature","https://www.nature.com/articles/444286a"]],"p":5},{"claim":"Kule z Kostaryki: ponad 300, do kilkunastu ton, cel nieznany.","verdict":"prawda","note":"Kule kultury Diquís obrabiano kamieniem i ścieraniem; cel jest niepewny, ale nie \"niewytłumaczalny\".","src":[["Wikipedia (ang.): kamienne kule z Kostaryki - hasło \"Stone spheres of Costa Rica\"","https://en.wikipedia.org/wiki/Stone_spheres_of_Costa_Rica"],["UNESCO: osady wodzów Diquís z kamiennymi kulami","https://whc.unesco.org/en/list/1453/"]],"p":6},{"claim":"Bloki Sacsayhuamán ważą po 100-120 ton.","verdict":"przesada","note":"Największy blok szacuje się na ok. 120-130 t, ale większość jest znacznie mniejsza. Precyzyjne dopasowanie jest prawdą.","src":[["Wikipedia (ang.): Sacsayhuamán","https://en.wikipedia.org/wiki/Sacsayhuam%C3%A1n"]],"p":7},{"claim":"Nie wiadomo, jak zbudowano piramidy.","verdict":"przesada","note":"Papirusy z Wadi al-Dżarf, ślady ramp i osady robotników wyjaśniają budowę; \"megamaszyny\" to spekulacja.","src":[["Wikipedia (ang.): Dziennik Merera - hasło \"Diary of Merer\"","https://en.wikipedia.org/wiki/Diary_of_Merer"],["Fall i in. 2014, PRL (DOI)","https://doi.org/10.1103/PhysRevLett.112.175502"]],"p":8}],"bias":"Tendencyjny tytuł: większość pozycji naukowcy dobrze rozumieją, a film sugeruje nawet zaginione maszyny.","channel":"Chill Dude Explains"},{"id":"hmHhsg7h4g0","title_pl":"10 powodów, dla których w średniowieczu uznano by cię za czarownicę","title":"10 Reasons You'd Be Called a Witch in The Middle Ages","url":"https://www.youtube.com/watch?v=hmHhsg7h4g0","date":"2024-01-02","duration":544,"views":2194394,"transcript":"youtube","added":"2026-11-03","tags":["Historia","Mity"],"about":"Humorystyczna lista 10 zachowań i cech, za które w \"średniowieczu\" można było zostać oskarżonym o czary.","intro":"Żartobliwa lista 10 zachowań i cech, za które według autora w \"średniowieczu\" można było zostać oskarżonym o czary. Są wśród nich znamiona, lunatykowanie, gwizdanie, leworęczność i ziewanie, a także koty, kichnięcie kota, warzenie piwa, zbyt dobry ser i jajka z dwoma żółtkami. Autor opisuje to scenkami z wymyślonymi sąsiadami, a przy piwie tłumaczy, skąd wziął się obraz czarownicy z kotłem i miotłą.","points":[{"t":"Znamiona","d":"Akcja w XV w.: sąsiad widzi znamię i krzyczy \"czarownica\". Znamiona nazywano znakiem diabła i wierzono, że są znieczulone magią, więc łowcy czarownic kłuli je igłami. Brak bólu oznaczał winę, a niektórzy używali chowanych igieł. Reakcję na ból też uznawano za udawanie."},{"t":"Lunatykowanie","d":"Ktoś, kto chodzi nocą z zamkniętymi oczami i mamrocze, według autora wyglądał jak rozmawiający z diabłem. Szept przez sen mógł uchodzić za zaklęcie, a gdy następnego dnia coś się stało, np. koń kowala się przeziębił, winny był lunatyk."},{"t":"Gwizdanie","d":"Niektóre melodie miały przywoływać wiatr zdolny zerwać dach albo zważyć mleko. Liczyło się też miejsce: gwizdanie przy pewnych drzewach oznaczało spotkanie z czarownicami, przy cmentarzu budzenie zmarłych, a w kościele było zakazane. Wierzono też, że melodie pozwalają porozumiewać się ze zwierzętami."},{"t":"Leworęczność","d":"Ponieważ większość ludzi jest praworęczna, a diabła uważano za mańkuta, leworęcznych podejrzewano o czary. Według autora ich słowo nie miało wagi w sądzie, bo uznawano, że mówi przez nich diabeł."},{"t":"Ziewanie","d":"Wierzono, że przy ziewnięciu dusza może uciec, a w jej miejsce wejdą demony. Autor wiąże to z dżumą, której objawem miało być częste ziewanie. Przy ziewaniu robiono znak krzyża nad ustami, a za niemowlęta robili to dorośli; ziewanie bez znaku krzyża było podejrzane."},{"t":"Posiadanie kotów","d":"Zwłaszcza czarne koty, nocne i tajemnicze, uchodziły za pomocników diabła, więc ich właścicielkę mogła oskarżyć sąsiadka. Autor zwraca uwagę na ironię: koty ograniczały populację szczurów, a więc ryzyko szerzenia się dżumy."},{"t":"Kichnięcie kota obok ciebie","d":"Skoro kot był przyjacielem diabła, to kichnięcie kota obok ciebie oznaczało, że kot z tobą rozmawia. Według autora z tego wynikało, że i ty kum
