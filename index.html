 narzędzi używa bot.","verdict":"półprawda","note":"Według dokumentacji w rozmowie widać aktywność narzędzi, pracę na komputerze i prośby o akceptację, choć nie tok rozumowania.","p":4,"src":[["Dokumentacja Grok Bot: czat i współpraca","https://docs.x.ai/grok-bot/chat-and-collaboration"]]},{"claim":"Nie ma sposobu na ustawienie zabezpieczeń przed groźnymi akcjami.","verdict":"fałsz","note":"Są reguły Ask first, np. dla wysyłania, usuwania czy kupowania, oraz Auto Review dla wrażliwych akcji.","p":null,"src":[["Dokumentacja Grok Bot: akceptacje i bezpieczeństwo","https://docs.x.ai/grok-bot/approvals-security-and-privacy"]]},{"claim":"Wszystkie boty dzielą jeden komputer.","verdict":"prawda","note":"Komputer jest jeden na użytkownika, każdy bot ma na nim osobny ekran.","p":6,"src":[["Dokumentacja Grok Bot: FAQ","https://docs.x.ai/grok-bot/faq"]]}],"bias":"Najbardziej krytyczna recenzja z tej grupy, ale autor reklamuje własną płatną usługę AI makeover, a kilka zarzutów jest nieścisłych.","section":"Technologie"},{"id":"38bJK7W7SZ8","title_pl":"Czy sama siłownia wystarczy, czy naprawdę potrzebujesz cardio?","title":"Is Lifting Enough, or Do You Actually Need Cardio?","channel":"Renaissance Periodization","url":"https://www.youtube.com/watch?v=38bJK7W7SZ8","date":"2026-10-12","duration":722,"views":428967,"section":"Sport","transcript":"whisper","added":"2026-11-03","tags":["Cardio","Trening siłowy","Zdrowie"],"about":"Renaissance Periodization sprawdza, co się dzieje z redukcją, zdrowiem, mięśniami i kondycją, gdy ktoś trenuje siłowo, ale rzuca cardio.","intro":"Kanał Renaissance Periodization zadaje proste pytanie: co, jeśli ktoś dobrze śpi, je, robi 8-12 tysięcy kroków dziennie i dźwiga ciężary, ale w ogóle rezygnuje z cardio? Odpowiedź dotyczy redukcji, zdrowia, przyrostów mięśni i codziennego życia, a na koniec pada propozycja minimalnej dawki.","points":[{"t":"Co tu znaczy cardio","d":"To wysiłek tlenowy, który podnosi tętno powyżej około 130 uderzeń na minutę i jest robiony celowo, by poprawić kondycję."},{"t":"Redukcja bez cardio","d":"O utracie tłuszczu decyduje deficyt kaloryczny. Jeśli rezygnujesz z cardio, możesz zwiększyć codzienną aktywność albo trochę zmniejszyć jedzenie. Wielu najszczuplejszych zawodników schodzi z wagi bez biegania."},{"t":"Zdrowie na dłuższą metę","d":"Na początku nic się nie dzieje. Z czasem bez regularnego, intensywnego cardio może rosnąć ciśnienie i pogarszać się kontrola glukozy. To mały efekt, ale po latach zaczyna mieć znaczenie dla zdrowia i długości życia."},{"t":"Czy ciężary zastąpią cardio","d":"Klasyczne serie po 5-15 powtórzeń nie. Serie po 15-30 powtórzeń w ćwiczeniach wielostawowych z bardzo krótkimi przerwami to już przyzwoity bodziec tlenowy. Do najlepszej kondycji potrzebne jest jednak osobne cardio."},{"t":"Mięśnie bez cardio","d":"Przy treningu siłowym i 8-12 tysiącach kroków brak cardio prawie na pewno nie zaszkodzi przyrostom mięśni."},{"t":"Codzienne życie","d":"Schody czy zwykłe czynności nie będą problemem. Poczujesz brak kondycji dopiero wtedy, gdy życie wymaga więcej, np. przy dłuższym noszeniu ciężkich rzeczy, które trzeba robić z przerwami."},{"t":"Minimalna dawka","d":"Według prowadzącego solidne minimum to 3 sesje tygodniowo po 20 minut w tempie, przy którym nie da się rozmawiać. Szczególnie warto przy wyższej tkance tłuszczowej: od 15% u mężczyzn i od 22% u kobiet."}],"conclusion":"Brak cardio nie zaszkodzi mięśniom, ale na dłuższą metę odbije się na zdrowiu i kondycji. Około 60 minut intensywnego wysiłku tygodniowo to sensowne minimum.","factchecks":[{"claim":"Cardio prawie na pewno nie wpływa na przyrosty mięśni.","verdict":"prawda","note":"Metaanaliza 43 badań: łączenie treningu tlenowego i siłowego nie ogranicza przerostu mięśni ani siły maksymalnej.","p":4,"src":[["PubMed: Schumann i wsp. 2022 - \"Compatibility of Concurrent Aerobic and Strength Training for Skeletal Muscle Size and Function\"","https://pubmed.ncbi.nlm.nih.gov/34757594/"]]},{"claim":"Bez regularnego cardio z czasem może rosnąć ciśnienie krwi.","verdict":"półprawda","note":"Trening wytrzymałościowy obniża ciśnienie, ale trening siłowy i izometryczny też, więc same ciężary częściowo to rekompensują.","p":2,"src":[["PubMed: Cornelissen, Smart 2013 - \"Exercise training for blood pressure: a systematic review and meta-analysis\"","https://pubmed.ncbi.nlm.nih.gov/23525435/"]]},{"claim":"3 sesje po 20 minut intensywnego cardio tygodniowo to solidne minimum.","verdict":"przesada","note":"WHO zaleca dorosłym co najmniej 75 minut intensywnej aktywności tlenowej tygodniowo. 60 minut to trochę mniej.","p":6,"src":[["WHO: aktywność fizyczna - fakty","https://www.who.int/news-room/fact-sheets/detail/physical-activity"],["Wikipedia (ang.): zalecenia WHO - hasło \"Physical activity\"","https://en.wikipedia.org/wiki/Physical_activity"]]}],"bias":"Kanał firmy Renaissance Periodization, która sprzedaje aplikację i plany treningowe. Wnioski są ostrożne, ale minimalna dawka to opinia prowadzącego."},{"id":"fdqxF75gWeE","title_pl":"Luksusowe marki i fabryki starożytnego Rzymu","title":"Luxury Brands of Ancient Rome","channel":"toldinstone","url":"https://www.youtube.com/watch?v=fdqxF75gWeE","date":"2026-10-10","duration":614,"views":236182,"section":"Historia","transcript":"youtube","added":"2026-11-04","tags":["Historia"],"about":"Od miliona gwoździ z Inchtuthil po terra sigillata, Enniona i Fortis: masowa produkcja, znaki towarowe i konkurencja w Rzymie.","intro":"Gwóźdź z fortu Inchtuthil (prawie milion sztuk w jamie) otwiera opowieść o rzymskiej produkcji na dużą skalę. Autor przechodzi przez cesarskie fabryki broni i kamieniołomy, biznes arystokracji (cegły, garum, oliwa), marki rzemieślników (Arezzo, La Graufesenque, szkło Enniona) oraz znaki towarowe, reklamę i podróbki lamp Fortis.","points":[{"t":"Gwóźdź z Inchtuthil","d":"Gwóźdź z końca I w. z fortu legionowego Inchtuthil w Szkocji znaleziono w 1960 r. w jamie z prawie milionem innych. Według autora to świadectwo skali produkcji; technologia była przedprzemysłowa, ale fabryki, znaki i konkurencja marek istniały."},{"t":"Cesarskie fabryki i kamieniołomy","d":"W późnej starożytności broń i zbroje robiono w 35 państwowych zakładach (tarcze, napierśniki, strzały, zbroje końskie, balisty). Cesarze mieli sieć kamieniołomów; kolumny z marmuru i granitu w standardowych długościach szły setkami do miast, a rzeźby często w stanie surowym."},{"t":"Pieczywo i młyny","d":"Od Septymiusza Sewera annona dla ok. 200 tys. ludzi szła jako chleb z państwowych piekarni. Ziarno mielono w młynach napędzanych akweduktami i przelewem z łaźni."},{"t":"Biznes arystokracji","d":"Krassus organizował brygady niewolnych strażaków, budowniczych i rzemieślników. Rodziny spod Rzymu tłoczyły cegły w standardowych rozmiarach ze stemplem daty i miejsca; niektóre glinianki miały setki pracowników. Nad Morzem Śródziemnym: solarnie i garum (Troia w Portugalii: 19 zbiorników, ponad 600 m³)."},{"t":"Oliwa i Monte Testaccio","d":"Plantacje oliwne w Afryce Północnej i południowej Hiszpanii miały baterie pras i magazyny. Monte Testaccio w Rzymie to według autora ponad 50 mln amfor oliwnych z Hiszpanii."},{"t":"Terra sigillata","d":"Za Augusta czerwona ceramika z Arezzo szła od Brytanii po Indie; stemple wskazują dziesiątki warsztatów, największy co najmniej 60 rzemieślników. W I w. centrum przeszło do Galii; w La Graufesenque piece brały do 35 tys. naczyń naraz - poziom nieosiągnięty według autora aż do XIX w."},{"t":"Szkło Enniona","d":"Dmuchanie szkła powstało w I w. p.n.e. na wschodzie imperium. Ennion (prawdopodobnie Sydon) sygnował formowane naczynia; zachowało się ok. 50, od Hiszpanii po Izrael. Naśladowcy kopiowali jego formy."},{"t":"Znaki i konkurencja","d":"Szklarze z Kolonii zostawiali \"Cologne squiggle\". Fibule Aucissa szły od Galii po Morze Czarne; w Vindolandzie znaleziono luksusowy pantofel Lucjusza Aibutiusa Thalesa. Scaurus z Pompejów reklamował garum; amfory \"Vesuvinum\" mieszały Wezuwiusz i wino. Lampy Fortis z Mutiny wyparły lokalne podróbki ze skopiowanym znakiem."}],"conclusion":"Rzym nie był blisko rewolucji przemysłowej, ale masowo produkował tanie towary i budował marki rozpoznawalne na trzech kontynentach.","factchecks":[{"claim":"W Inchtuthil zakopano prawie milion gwoździ.","verdict":"prawda","note":"Przy ewakuacji fortu zakopano ogromny zapas gwoździ; szacunki sięgają ok. 10 ton / setek tysięcy-miliona sztuk.","p":0,"src":[["Wikipedia (ang.): Inchtuthil - hasło \"Inchtuthil\"","https://en.wikipedia.org/wiki/Inchtuthil"]]},{"claim":"Monte Testaccio to góra z ponad 50 mln amfor oliwnych.","verdict":"prawda","note":"Sztuczne wzgórze z ostraków amfor, głównie baetyckiej oliwy; szacunki idą w dziesiątki milionów.","p":4,"src":[["Wikipedia (ang.): Monte Testaccio - hasło \"Monte Testaccio\"","https://en.wikipedia.org/wiki/Monte_Testaccio"]]},{"claim":"La Graufesenque wypalało do 35 tys. naczyń naraz.","verdict":"prawda","note":"Piece galijskiej terra sigillata osiągały produkcję rzędu dziesiątek tysięcy naczyń na wypał.","p":5,"src":[["Wikipedia (ang.): La Graufesenque - hasło \"La Graufesenque\"","https://en.wikipedia.org/wiki/La_Graufesenque"]]},{"claim":"Ennion sygnował szkło; zachowało się ok. 50 naczyń.","verdict":"prawda","note":"Ennion to najlepiej poświadczony rzymski szklarz z podpisem; zachowane egzemplarze liczy się w dziesiątkach.","p":6,"src":[["Wikipedia (ang.): Ennion - hasło \"Ennion\"","https://en.wikipedia.org/wiki/Ennion"]]},{"claim":"35 państwowych fabryk broni w późnym imperium.","verdict":"prawda","note":"Notitia Dignitatum wymienia sieć fabricae produkujących broń i zbroje dla armii.","p":1,"src":[["Wikipedia (ang.): fabricae późnego Rzymu - hasło \"Roman military personal equipment\"","https://en.wikipedia.org/wiki/Roman_military_personal_equipment"],["Wikipedia (ang.): Notitia Dignitatum - hasło \"Notitia Dignitatum\"","https://en.wikipedia.org/wiki/Notitia_Dignitatum"]]}],"bias":"Przejrzysta synteza gospodarcza; liczby (35 fabryk, 50 mln amfor) zaokrąglone. Sponsor History Adventures w środku."},{"id":"8lNK7gjUCEs","title_pl":"Tajna wojna Vsauce z AI","title":"Vsauce's Secret War on AI","channel":"TDT","url":"https://www.youtube.com/watch?v=8lNK7gjUCEs","date":"2026-10-08","duration":758,"views":850724,"transcript":"whisper","added":"2026-11-03","tags":["Media","Sztuczna inteligencja"],"about":"Dlaczego Vsauce prawie przestał wrzucać filmy, jak ludzcy twórcy wygrywają z algorytmem i czemu farmy treści AI tego nie powtórzą.","intro":"Autor kanału TDT zadaje pytanie, jak wybić się na YouTube, gdy filmów jest więcej niż kiedykolwiek, a Vsauce od ponad roku nie wrzucił pełnego filmu. Opisuje 3 strategie wyróżnienia się, historię Vsauce i jego naśladowców oraz zalew treści AI. Wniosek: przetrwa pasja, a nie produkcja masowa.","points":[{"t":"Rekordy YouTube","d":"Rekordzista NameLook ma 4,8 mln filmów, ale tylko ok. 5,9 mln wyświetleń i 65 tys. subskrypcji. MrBeast ma 520 mln subskrypcji, a T-Series 358 mld wyświetleń, przy ok. 8,3 mld ludzi na świecie."},{"t":"Strategia 1: bomba","d":"Jeden film o wiele lepszy od reszty, który przyciąga widzów do całego kanału."},{"t":"Strategia 2: osobowość","d":"Ludzie wracają dla twórcy, a nie dla tematu, jak u Markipliera czy Jacksepticeye."},{"t":"Strategia 3: fioletowa krowa","d":"Według Setha Godina trzeba być wyjątkowym, by się wyróżnić. Vsauce zrobił to pytaniami jak „Czy można dotknąć Marsa?” albo „Jaka jest prędkość ciemności?”."},{"t":"Wyżej zawieszona poprzeczka","d":"Michael Stevens mówi, że pytań mu nie brakuje; chciał przeskoczyć poprzeczkę, którą sam sobie ustawił. Dziś każdy film to miesiące pracy, a robienie treści pod algorytm według niego prowadzi do wypalenia."},{"t":"Algorytm dopasowuje się do niego","d":"Stevens wciąż robi shorty, podcast i Curiosity Box. Zamiast uczyć się algorytmu, uczy algorytm siebie, więc każdy jego film i tak odnosi sukces."},{"t":"Zalew treści AI","d":"Farmy treści AI masowo przerabiają to, co już działa. Autor uważa, że YouTube uratuje pasja twórców, bo ludzie przychodzą oglądać ludzi."}],"conclusion":"Twórcy wygrywają tym, czego nie da się skopiować: wyjątkowością i pasją, a nie liczbą filmów.","factchecks":[{"claim":"MrBeast ma 520 mln subskrypcji.","verdict":"prawda","note":"Według Wikipedii w listopadzie 2026 r. miał 525 mln, więc w czasie filmu 520 mln było zgodne.","p":0,"src":[["Wikipedia (ang.): najczęściej subskrybowane kanały - hasło \"List of most-subscribed YouTube channels\"","https://en.wikipedia.org/wiki/List_of_most-subscribed_YouTube_channels"]]},{"claim":"T-Series ma 358 mld wyświetleń.","verdict":"półprawda","note":"T-Series jest liderem wyświetleń, ale Wikipedia podaje ponad 343 mld, nieco mniej niż w filmie.","p":0,"src":[["Wikipedia (ang.): najczęściej oglądane kanały - hasło \"List of most-viewed YouTube channels\"","https://en.wikipedia.org/wiki/List_of_most-viewed_YouTube_channels"]]},{"claim":"Purple Cow to idea Setha Godina.","verdict":"prawda","note":"Książkę Purple Cow: Transform Your Business by Being Remarkable wydał w 2003 r.","p":3,"src":[["Wikipedia (ang.): Seth Godin - hasło \"Seth Godin\"","https://en.wikipedia.org/wiki/Seth_Godin"]]},{"claim":"Vsauce stworzył Michael Stevens.","verdict":"prawda","note":"Marka działa od 2010 r.; kanał główny ma ok. 25 mln subskrypcji.","p":4,"src":[["Wikipedia (ang.): Vsauce - hasło \"Vsauce\"","https://en.wikipedia.org/wiki/Vsauce"]]}],"bias":"Ciekawy esej o twórczości, ale autor na koniec reklamuje koszulki przeciw grafice AI, a liczby podaje bez źródeł.","section":"Technologie"},{"id":"8xXhE25vJZY","title_pl":"Grok Bot 101: oficjalne warsztaty dla początkujących","title":"Grok Bot 101","channel":"Grok","url":"https://www.youtube.com/watch?v=8xXhE25vJZY","date":"2026-10-06","duration":3401,"views":108717,"transcript":"whisper","added":"2026-11-03","tags":["Technika","Sztuczna inteligencja"],"about":"Oficjalne warsztaty SpaceX AI: idea AI-współpracownika, boty z komputerem, uczenie zadań, umiejętności i zespół botów od naklejek.","intro":"Nagranie warsztatów prowadzonych przez Martina, inżyniera z SpaceX AI, i Cliffa. Pokazują, skąd wziął się Grok Bot, a potem na żywo budują zespół 3 botów, który projektuje naklejki, zbiera głosy widzów w Formularzach Google i szuka drukarni. To materiał producenta, więc bez krytyki.","points":[{"t":"Od chatbota do współpracownika","d":"Najpierw były chatboty, potem agenci, a Grok Bot ma być pierwszym AI-współpracownikiem. Rozmawia się jak w iMessage: boty po lewej, jedna ciągła rozmowa zamiast nowego czatu do każdego zadania."},{"t":"Pamięć i własny komputer","d":"Dwie podstawy to trwała pamięć i komputer, na którym bot używa stron jak człowiek. Może np. zarezerwować lot na stronie linii lotniczej, która nie ma API."},{"t":"Przykłady prowadzących","d":"Martin ma boty do pracy, np. do przygotowania rozmów z klientami. Prywatny bot Bobo śledzi premiery butów, kontuzje w jego ligach fantasy i występy ulubionej tenisistki rodziców."},{"t":"Nauka przez pokazanie","d":"Martin raz pokazuje botowi Maya, jak zrobić formularz Google, a bot zapisuje to jako umiejętność. Według prowadzących skraca to kolejne podejścia i oszczędza zużycie."},{"t":"Boty rozmawiają ze sobą","d":"Maya zbiera głosy w formularzu, a Dex dostaje polecenie zaprojektowania 8 naklejek według wytycznych z Figmy. Łącznik Figma MCP jest w marketplace."},{"t":"Jeden komputer, osobne ekrany","d":"Prowadzący odpowiadają na pytania widzów: boty użytkownika działają na jednej maszynie w chmurze, a pamięcią i kontekstem zarządza aplikacja."},{"t":"Szef sztabu","d":"Na koniec Martin tworzy czat grupowy i awansuje Bobo na szefa sztabu dla Dex, Mayi i bota zakupowego Penny. Pozostałe boty streszczają mu w czacie, co zrobiły w sprawie naklejek."},{"t":"Reguły akceptacji","d":"W ustawieniach można dodać reguły, kiedy bot ma pytać o zgodę, np. przed utworzeniem formularza Google."}],"conclusion":"Według prowadzących boty używają każdego narzędzia nawet bez łącznika, pamiętają, jak pracujesz, i pytają o zgodę tam, gdzie tego chcesz.","factchecks":[{"claim":"Wszystkie boty działają na jednym komputerze, każdy na własnym ekranie.","verdict":"prawda","note":"Komputer w chmurze jest jeden na użytkownika; jeden bot prowadzi naraz jedno zadanie na swoim ekranie.","p":5,"src":[["Dokumentacja Grok Bot: FAQ","https://docs.x.ai/grok-bot/faq"]]},{"claim":"Bot zapisuje pokazane zadanie jako umiejętność.","verdict":"prawda","note":"Teach a task nagrywa proces w przeglądarce i zapisuje go jako umiejętność do powtórzenia.","p":3,"src":[["Dokumentacja Grok Bot: umiejętności i rutyny","https://docs.x.ai/grok-bot/skills-routines-and-automations"]]},{"claim":"Można ustawić, przed czym bot ma pytać o zgodę.","verdict":"prawda","note":"Reguły Ask first zawsze wywołują kartę akceptacji, np. przed wysyłaniem czy publikowaniem.","p":7,"src":[["Dokumentacja Grok Bot: akceptacje i bezpieczeństwo","https://docs.x.ai/grok-bot/approvals-security-and-privacy"]]}],"bias":"Oficjalne warsztaty producenta: pokazują wyłącznie zalety, bez kosztów i ograniczeń. Transkrypt ma luki, więc część szczegółów pominięto.","section":"Technologie"},{"id":"q1IwR88mhaA","title_pl":"Jedyny poradnik Grok Bot, jakiego potrzebujesz: jak zacząć","title":"The ONLY Grok Bot Tutorial You Need 2026 - How To Use Grok Bot For Beginners","channel":"Charlie Chang","url":"https://www.youtube.com/watch?v=q1IwR88mhaA","date":"2026-09-30","duration":841,"views":433930,"transcript":"whisper","added":"2026-11-03","tags":["Technika","Sztuczna inteligencja"],"about":"Charlie Chang krok po kroku: instalacja, pierwszy bot asystent, łączenie Gmaila, uczenie zadań, rutyny, czaty grupowe i marketplace.","intro":"Charlie Chang pokazuje Grok Bot od zera: pobranie aplikacji, plan, pierwszy bot jako asystent, łączenie Gmaila i innych aplikacji, uczenie przez pokazanie, rutyny, kilka botów naraz i marketplace z gotowymi botami. To praktyczny przegląd, ale z linkami afiliacyjnymi i reklamą jego społeczności.","points":[{"t":"Instalacja i plan","d":"Aplikację pobiera się z x.ai/bot, a korzystanie wymaga płatnego planu; autor mówi, że ma Grok Plus za 100 dolarów miesięcznie. Według niego dostęp dają też niektóre plany Cursor, SuperGrok i Teams."},{"t":"Pierwszy bot: asystent","d":"Autor tworzy bota asystenta i pokazuje ustawienia: zużycie, rozliczenia i możliwość aktualizacji lub resetu komputera bota."},{"t":"Łączenie aplikacji","d":"Gmaila podłącza się w czacie albo przez Composio lub Zapier MCP. W marketplace są też Slack, Notion i menedżer haseł, przez który bot loguje się bez widzenia haseł."},{"t":"Własny ekran i nauka","d":"Każdy bot ma ekran z Chrome, a przycisk uczenia pozwala raz pokazać zadanie. Autor kazał mu szukać na Amazonie soundbarów do 500 dolarów i dostał 3 propozycje z linkami."},{"t":"Wiele botów i rutyny","d":"Obok asystenta autor ma m.in. szefa sztabu, boty do badań, finansów, newslettera i LinkedIn; boty piszą do siebie. Rutyny działają według planu, np. o 9:00 podsumowanie Slacka i maili."},{"t":"Czaty grupowe i wspólny komputer","d":"W czacie grupowym autor pyta asystenta, bota finansowego i COO o zaległe faktury. Bot finansowy może mieć dostęp do QuickBooks, a wszystkie boty dzielą jeden komputer z Linuksem."},{"t":"Marketplace","d":"Gotowe boty innych osób można zaimportować do swojego konta. Bot potrafi też za autora rozmawiać z czatami obsługi klienta."}],"conclusion":"Autor uważa Grok Bot za pracownika, który działa wolniej od człowieka, ale doprowadza zadania do końca.","factchecks":[{"claim":"Grok Bot wymaga płatnego planu.","verdict":"prawda","note":"Na The X Subscription jest w planach Premium (30 dolarów), Super (100) i Ultra (200); Free i Plus go nie mają.","p":0,"src":[["x.ai: cennik planów","https://x.ai/pricing"],["Dokumentacja Grok Bot: FAQ","https://docs.x.ai/grok-bot/faq"]]},{"claim":"Autor ma Grok Plus za 100 dolarów miesięcznie.","verdict":"fałsz","note":"Plus kosztuje 8 dolarów i nie ma Grok Bot; 100 dolarów to plan Super.","p":0,"src":[["x.ai: cennik planów","https://x.ai/pricing"]]},{"claim":"Dostęp dają też plany Cursor i SuperGrok.","verdict":"prawda","note":"Dotyczy starszych płatnych planów Cursor i Teams; można też podpiąć indywidualny SuperGrok lub X Premium+.","p":0,"src":[["Dokumentacja Grok Bot: FAQ","https://docs.x.ai/grok-bot/faq"]]},{"claim":"Wszystkie boty dzielą jeden komputer, pliki i logowania.","verdict":"prawda","note":"Komputer jest przypisany do użytkownika, a nie do bota; dokumentacja ostrzega, by nie traktować botów jako granicy bezpieczeństwa.","p":5,"src":[["Dokumentacja Grok Bot: FAQ","https://docs.x.ai/grok-bot/faq"]]},{"claim":"Bot loguje się przez menedżer haseł bez widzenia haseł.","verdict":"prawda","note":"Boty logują się danymi z Vault, menedżera haseł lub bezpiecznego formularza bez widzenia wartości.","p":2,"src":[["Dokumentacja Grok Bot: FAQ","https://docs.x.ai/grok-bot/faq"],["Dokumentacja Grok Bot: Vault","https://docs.x.ai/grok-bot/vault"]]}],"bias":"Rzetelny poradnik krok po kroku, ale autor promuje swoją darmową społeczność i linki afiliacyjne, a o kosztach i ograniczeniach mówi mało.","section":"Technologie"},{"id":"v-ZAKS02Gm4","title_pl":"10 szalonych rozwiązań inżynieryjnych - od Millau po Valencia","title":"The Craziest Solutions Engineers Ever Came Up With","channel":"Some Guy Who Knows Stuff","url":"https://www.youtube.com/watch?v=v-ZAKS02Gm4","date":"2026-09-24","duration":1183,"views":449427,"section":"Technologie","transcript":"youtube","added":"2026-11-04","tags":["Technika","Inżynieria","Budownictwo"],"about":"Some Guy Who Knows Stuff opisuje 10 projektów, w których inżynierowie ominęli \"niemożliwe\" warunki terenu i konstrukcji.","intro":"Kanał Some Guy Who Knows Stuff wymienia dziesięć nietypowych rozwiązań: wypychany pomost wiaduktu Millau, Gotthard Base Tunnel, Falkirk Wheel, Tarzę Trzech Przełomów, lotnisko Kansai na sztucznej wyspie, drogę Guoliang, tłumik masowy w Taipei 101, kolej przez Takla Makan, Eurotunel i nietypowy montaż Palau de les Arts w Valencii.","points":[{"t":"Wiadukt Millau","d":"Ponad 2,4 km nad doliną Tarn; najwyższy punkt ok. 343 m. Stalowy pomost montowano za przyczółkiem i hydraulicznym \"launching\" przesuwano z filaru na filar, zamiast schodzić autostradą w dolinę."},{"t":"Gotthard Base Tunnel","d":"Ok. 57 km przez Alpy. TBM i miejscami dynamit; wysoka temperatura wymaga chłodzenia. Urobek częściowo przetwarzano na budowę; ekipy z różnych kierunków zeszły się pod ziemią."},{"t":"Falkirk Wheel","d":"Koło ok. 35 m łączy kanały różniące się o ponad 24 m. Dwie gondole z wodą i łodzią; zrównoważone obciążenie pozwala kręcić stosunkowo małym silnikiem (ukończone 2002)."},{"t":"Tama Three Gorges i Kansai","d":"Tama >2 km na Jangcy: dywersja rzeki, głębokie fundamenty, beton w sekcjach z chłodzeniem. Kansai: sztuczna wyspa na miękkim dnie Zatoki Osaka, ściany morskie i podnoszenie terminalu siłownikami przy osiadaniu."},{"t":"Guoliang i Taipei 101","d":"Tunel drogowy wykuty w ścianie Taihang głównie ręcznie i materiałami wybuchowymi. Taipei 101 (>500 m): tuned mass damper - stalowa kula setek ton tłumi huśtanie od wiatru i wstrząsów."},{"t":"Takla Makan i Eurotunel","d":"Kolej przez pustynię: roślinność i bariery przeciw wydmom, stały monitoring piasku. Channel Tunnel ~50 km (ok. 38 km pod dnem); TBM z obu stron, dwa tunele kolejowe + serwisowy."},{"t":"Palau de les Arts","d":"W Valencii ogromny zakrzywiony dach i elementy stalowo-betonowe montowano etapami z tymczasowymi podporami; części prefabrykowane na ziemi, potem podnoszone - wrażenie \"budowy od góry\"."}],"conclusion":"Wspólny wątek: nie walczyć z terenem na siłę, tylko zaprojektować proces budowy i utrzymania pod konkretne ograniczenia.","factchecks":[{"claim":"Wiadukt Millau ma ponad 2,4 km i maszt wyższy niż Wieża Eiffla (ok. 343 m).","verdict":"prawda","note":"Oficjalnie długość 2460 m; najwyższy pylon 343 m, pomost do 270 m nad ziemią.","p":0,"src":[["Wikipedia (ang.): Millau Viaduct","https://en.wikipedia.org/wiki/Millau_Viaduct"]]},{"claim":"Gotthard Base Tunnel ma ok. 57 km i jest jednym z najdłuższych tuneli kolejowych.","verdict":"prawda","note":"Długość 57,1 km; otwarty w 2016 jako najdłuższy kolejowy tunel świata.","p":1,"src":[["Wikipedia (ang.): Gotthard Base Tunnel","https://en.wikipedia.org/wiki/Gotthard_Base_Tunnel"]]},{"claim":"Falkirk Wheel pokonuje różnicę poziomów kanałów ok. 24 m kołem z 2002 r.","verdict":"prawda","note":"Koło łączy Forth and Clyde z Union Canal, różnica ok. 24 m; otwarte w 2002.","p":2,"src":[["Wikipedia (ang.): Falkirk Wheel","https://en.wikipedia.org/wiki/Falkirk_Wheel"]]},{"claim":"Eurotunel ma ok. 50 km, z czego większość pod dnem kanału.","verdict":"prawda","note":"Całkowita długość 50,45 km, w tym 37,9 km pod morzem.","p":5,"src":[["Wikipedia (ang.): Channel Tunnel","https://en.wikipedia.org/wiki/Channel_Tunnel"]]}],"bias":"Format top-10 z uproszczeniami i dramatycznym narratorem; numer 1 (Valencia) jest mniej precyzyjny niż pozostałe przykłady."},{"id":"wA4kLcKq8Nk","title_pl":"Prof. Krzysztof Turzyński o inflacji, ciemnej materii i śladach dawnego wszechświata","title":"Fizyk o śladach wcześniejszego wszechświata. II prof. Krzysztof Turzyński","channel":"didaskalia","url":"https://www.youtube.com/watch?v=wA4kLcKq8Nk","date":"2026-09-20","duration":5900,"views":581341,"section":"Didaskalia","transcript":"youtube","added":"2026-11-03","tags":["Nauka","Fizyka","Kosmologia"],"about":"Fizyk teoretyk z UW tłumaczy, co wiemy o pierwszych chwilach wszechświata, czego szukać w promieniowaniu tła i czy potrzebny jest większy zderzacz.","intro":"Półtoragodzinna rozmowa Patrycjusza Wyżgi z prof. Krzysztofem Turzyńskim z Wydziału Fizyki UW (wrzesień 2026). Gość spokojnie oddziela to, co w kosmologii dobrze zbadane, od spekulacji: mówi o inflacji, przewadze materii nad antymaterią, cyklicznym wszechświecie Penrose'a, odkryciu promieniowania tła, ciemnej materii, granicach modelu standardowego i o tym, czy AI zastąpi fizyków.","points":[{"t":"Do kiedy sięga wiedza","d":"Wczesny wszechświat był gęsty i gorący jak metro w godzinach szczytu. Oddziaływania jądrowe znamy na tyle, by opisać powstawanie pierwszych jąder. Wcześniejsze chwile i wyższe energie to już pole do płodnych, ale niepewnych spekulacji."},{"t":"Inflacja","d":"Ulubiona opowieść gościa: okres bardzo szybkiego i przyspieszonego rozszerzania, na który mamy silne przesłanki. Rozrzedziła ewentualne relikty wcześniejszych epok, a pustą przestrzeń zapełniły cząstki w procesie, który wciąż nie jest dobrze zrozumiany."},{"t":"Materia kontra antymateria","d":"Nie widzimy obszarów antymaterii, bo na granicy z materią świeciłyby w promieniowaniu gamma. Skąd wzięła się nadwyżka materii, nie wiadomo. Turzyński w doktoracie pokazał ograniczenia dla zbyt optymistycznych modeli."},{"t":"Czym jest dobra teoria","d":"Za Popperem: teoria ma przewidywać coś jeszcze nieodkrytego. Spełnione przewidywanie nie dowodzi jednak teorii, jest raczej miłą niespodzianką jak prezent na urodziny. Liczy się możliwość obalenia."},{"t":"Cykliczny wszechświat Penrose'a","d":"Kurczący się wszechświat to dopuszczalne rozwiązanie równań Einsteina. Penrose proponuje szukać w promieniowaniu tła blizn po przejściu z kurczenia do rozszerzania. Gość tym się nie zajmuje, ale chętnie zobaczyłby taki przełom."},{"t":"Jak powstało promieniowanie tła","d":"Gdy wszechświat ostygł, fotony przestały rozbijać atomy wodoru i poleciały swobodnie, a rozszerzanie przesunęło je w zakres mikrofal. Zespół z Princeton z młodym Jamesem Peeblesem był gotowy do pomiaru, ale ubiegli go inni."},{"t":"Czy budować większy zderzacz","d":"LHC odkrył bozon Higgsa i wykluczył wiele egzotycznych pomysłów. Dotąd każdy skok energii o rzędy wielkości przynosił przełom, ale nikt nie da gwarancji, a to decyzja dla finansujących naukę."},{"t":"Skala Plancka bez strachu","d":"Łącząc prędkość światła, stałą Plancka i stałą grawitacji, dostajemy energię i masę Plancka. Masa wychodzi rzędu stutysięcznej części grama, tylko skupionej w punkcie, gdzie powinna działać kwantowa grawitacja."},{"t":"Fale grawitacyjne","d":"Mogą zdradzić przejścia fazowe we wczesnym wszechświecie, np. związane z polem Higgsa. Kosmiczny interferometr LISA ma to badać, a przy projekcie i przy odkryciach Virgo pracują fizycy z Polski."},{"t":"Ciemna materia","d":"Zwicky zauważył brakującą masę w gromadach galaktyk, Vera Rubin w ruchu gwiazd w galaktykach, a promieniowanie tła dało trzecią nogę. Detektory w kopalniach na razie mówią, gdzie jej nie ma, jak u Puchatka zaglądającego do garnka z miodem."},{"t":"Fizyka praktyczna i AI","d":"Docenia fizykę ciała stałego, spintronikę i nowe rodzaje promieniotwórczości. AI imponuje w matematyce, ale w fizyce dane muszą pochodzić z eksperymentów, a zupełnie nowe pomysły wciąż wymagają ludzkiej kreatywności."}],"conclusion":"Wzorowa lekcja pokory w kosmologii: dużo wiemy, ale gość starannie zaznacza, gdzie kończą się dane, a zaczynają opowieści.","factchecks":[{"claim":"Masa Plancka to wielkość rzędu stutysięcznej części grama.","verdict":"prawda","note":"Wynosi ok. 2,18 × 10^-8 kg, czyli ok. 22 mikrogramy.","p":7,"src":[["Wikipedia (ang.): jednostki Plancka - hasło \"Planck units\"","https://en.wikipedia.org/wiki/Planck_units"]]},{"claim":"Zwicky jako pierwszy wskazał na niewidoczną masę w gromadach galaktyk.","verdict":"prawda","note":"W 1933 r. zaproponował ciemną materię, by wyjaśnić ruchy galaktyk w Gromadzie w Warkoczu Bereniki.","p":9,"src":[["Wikipedia (ang.): Fritz Zwicky - hasło \"Fritz Zwicky\"","https://en.wikipedia.org/wiki/Fritz_Zwicky"]]},{"claim":"Kosmiczny interferometr LISA jest w budowie.","verdict":"prawda","note":"ESA zatwierdziła misję w styczniu 2024 r., a budowa ruszyła w 2025 r.","p":8,"src":[["Wikipedia (ang.): LISA - hasło \"Laser Interferometer Space Antenna\"","https://en.wikipedia.org/wiki/Laser_Interferometer_Space_Antenna"]]},{"claim":"Model Penrose'a przewiduje ślady poprzedniego wszechświata w promieniowaniu tła.","verdict":"prawda","note":"Tzw. punkty Hawkinga. Zgłoszone ich wykrycie jest sporne i część twierdzeń wycofano.","p":4,"src":[["Wikipedia (ang.): konforemna kosmologia cykliczna - hasło \"Conformal cyclic cosmology\"","https://en.wikipedia.org/wiki/Conformal_cyclic_cosmology"]]}],"bias":"Brak wyraźnej stronniczości. Gość sam oddziela fakty od hipotez. Rozmowa miejscami gubi się w dygresjach, a w odcinku są reklamy banku i optyka."},{"id":"I1uDiTVSEnM","title_pl":"Przeklęta stacja Camden Town","title":"The Cursed Station at Camden Town","channel":"Jago Hazzard","url":"https://www.youtube.com/watch?v=I1uDiTVSEnM","date":"2026-09-11","duration":980,"views":204724,"section":"Historia","transcript":"youtube","added":"2026-11-03","tags":["Historia","Technika"],"about":"Historia stacji metra Camden Town w Londynie: od legendy o czarownicy po najbardziej diabelski węzeł Northern Line.","intro":"Jago Hazzard opowiada, dlaczego Camden Town jest ukochaną stacją Londyńczyków i koszmarem Transport for London. Od planów z 1893 r., które jej nie przewidywały, przez budowę, węzeł 4 kierunków z 1924 r. i schron z czasów wojny, po tłumy z czasów kontrkultury i odkładaną przebudowę.","points":[{"t":"Dom czarownicy","d":"Według legendy stacja stoi przy chacie Mother Damnable, czyli Mother Redcap, po którą w chwili śmierci przyszedł sam diabeł. Autor żartuje, że to tłumaczy, czemu Camden Town to taki kłopot."},{"t":"Stacji miało nie być","d":"Linia Charing Cross, Euston and Hampstead Railway zatwierdzona w 1893 r. omijała Camden. Po zmianie trasy w 1899 r. dodano odgałęzienie do Kentish Town, a pod Camden powstał węzeł i stacja, otwarta 22 czerwca 1907 r."},{"t":"Nazwa i pieniądze","d":"Rozważano nazwy Camden Road, Hampstead Road i Camden Mother Redcap, od pubu naprzeciwko. Zapał inwestorów do metra ostygł, gdy okazało się, ile kosztuje, więc w 1900 r. linię przejęło konsorcjum późniejszego UERL i budowa ruszyła w 1902 r."},{"t":"Pierwsze rozgałęzienie","d":"Nikt wcześniej nie zbudował rozgałęzienia głębokiego metra dla pasażerów, więc Board of Trade obawiał się kolizji. UERL po prostu przestawił sygnalizację, by pociągi stawały dalej od węzła."},{"t":"Styl Leslie Greena","d":"Stacja ma typową fasadę z bordowych płytek i stalowy szkielet, ale z 2 fasadami rozdzielonymi cudzym budynkiem. Perony mają własny, niebiesko-kremowy wzór, a te w kierunku północnym leżą nad południowymi, by zaoszczędzić miejsce."},{"t":"Węzeł z 4 kierunków","d":"W latach 1922-1924 przedłużono City and South London Railway z Euston do Camden. Powstało 6 tuneli na południe od węzła i 17 nowych połączeń, a nastawnia miała 37 dźwigni; dziennie przejeżdżało 1504 pociągów."},{"t":"Ruchome schody i nazwa","d":"W 1929 r. 3 windy zastąpiono schodami ruchomymi; dawne korytarze do wind służą dziś przesiadkom. Po utworzeniu London Transport w 1933 r. połączone linie dostały tymczasową nazwę Northern Line, która została."},{"t":"Bomba i schron","d":"14 października 1940 r. bomba zniszczyła 1/3 fasady przy Camden High Street. Rząd zgodził się na budowę ekspresowej linii pod warunkiem wykopania schronów; ten w Camden ukończono w 1942 r., linii nigdy nie zbudowano."},{"t":"Stolica kontrkultury","d":"W latach 70. opuszczone budynki kolejowe i magazyny nad Regent's Canal zamieniono w kluby i targi. Stacja tak się zatłoczyła, że w niedziele była tylko wyjściem, aż w 2019 r. wprowadzono ruch jednokierunkowy."},{"t":"Linia nieszczęścia","d":"Przez węzeł problem na jednej odnodze rozlewa się na całą linię. Rozdzielenie Northern Line oznacza więcej przesiadek w zatłoczonym Camden, a nowsze plany zostawiają węzeł, co według autora mija się z celem."},{"t":"Odkładana przebudowa","d":"TfL odkupił schron, ale pierwsze plany wymagały wyburzenia kościoła, szkoły i klubu Electric Ballroom. Nowe wejście od Buck Street z windami ruszy raczej w latach 30., a podział linii nie przed latami 40."}],"conclusion":"Camden Town to od początku kompromis, który dziś ogranicza całą Northern Line, a naprawa wciąż czeka na pieniądze.","factchecks":[{"claim":"Stację Camden Town otwarto 22 czerwca 1907 r.","verdict":"prawda","note":"Otwarto ją razem z całą linią Charing Cross, Euston and Hampstead Railway.","p":1,"src":[["Wikipedia (ang.): stacja Camden Town - hasło \"Camden Town tube station\"","https://en.wikipedia.org/wiki/Camden_Town_tube_station"]]},{"claim":"Zaprojektował ją Leslie Green w typowym dla UERL stylu z bordowych płytek.","verdict":"prawda","note":"Green zaprojektował ok. 50 stacji UERL z charakterystyczną bordową terakotą.","p":4,"src":[["Wikipedia (ang.): Leslie Green - hasło \"Leslie Green\"","https://en.wikipedia.org/wiki/Leslie_Green"]]},{"claim":"Głęboki schron w Camden Town zbudowano w czasie wojny pod przyszłą linię ekspresową.","verdict":"prawda","note":"To jeden z 8 głębokich schronów pod Northern Line; ekspresowej linii nie zbudowano.","p":7,"src":[["Wikipedia (ang.): głębokie schrony w Londynie - hasło \"London deep-level shelters\"","https://en.wikipedia.org/wiki/London_deep-level_shelters"]]},{"claim":"Fasada przy Camden High Street ucierpiała w bombardowaniu 14 października 1940 r.","verdict":"prawda","note":"Stację uszkodziła bomba w październiku 1940 r.; odbudowano ją bez zniszczonej części.","p":7,"src":[["Wikipedia (ang.): stacja Camden Town - hasło \"Camden Town tube station\"","https://en.wikipedia.org/wiki/Camden_Town_tube_station"]]},{"claim":"Przebudowa z nowym wejściem od Buck Street jest planowana, ale bez daty.","verdict":"prawda","note":"TfL ma zgodę na nowe wejście, ale budowę odłożono z braku funduszy.","p":10,"src":[["Wikipedia (ang.): stacja Camden Town - hasło \"Camden Town tube station\"","https://en.wikipedia.org/wiki/Camden_Town_tube_station"]]}],"bias":"Rzetelny i z humorem, z podanymi źródłami książkowymi; opinia o podziale linii to zdanie autora."},{"id":"2GTROfhZIxY","title_pl":"Garderoba kapsułowa sprzed 60 lat, która wciąż działa","title":"We Found The Perfect Capsule Wardrobe (It's 60 Years Old!)","channel":"Gentleman's Gazette","url":"https://www.youtube.com/watch?v=2GTROfhZIxY","date":"2026-08-16","duration":786,"views":62143,"section":"Moda","transcript":"youtube","added":"2026-11-03","tags":["Styl","Garderoba","Klasyka"],"about":"Gentleman's Gazette przerabia listę ubrań z Esquire z 1962 roku na współczesną, ponadczasową garderobę klasycznego mężczyzny.","intro":"Prowadzący znalazł we wrześniowym Esquire z 1962 roku artykuł \"The Basic College Wardrobe\", czyli listę rzeczy na studia. Przechodzi przez nią kategoria po kategorii i pokazuje, co zostawić, co zmienić i czego jest za dużo. Wychodzi spójna garderoba, w której prawie wszystko pasuje do siebie.","points":[{"t":"Trzy garnitury jako baza","d":"Granatowy (u niego dwurzędowy), średnioszary flanelowy z kamizelką i wzorem pepitki, którego części da się nosić osobno, oraz rudawy tweed w jodełkę."},{"t":"Marynarki i spodnie","d":"Granatowy blezer z hopsacku z mosiężnymi guzikami, pół podszyty na różne klimaty, i marynarka w kratę glen. Spodnie: grafitowa flanela, oliwkowy sztruks, jedne chinosy zamiast czterech, kasztanowy sztruks."},{"t":"Okrycia wierzchnie","d":"Klasyczny trencz, granatowy jednorzędowy płaszcz wełniany do formalnych okazji i zamiast przestarzałego kożucha lekka pikowana kurtka na podróże."},{"t":"Koszule z umiarem","d":"Lista każe mieć 6 białych i 3 niebieskie koszule oxford z kołnierzykiem na guziki, ale można zmniejszyć liczbę. Do tego żółta lniana, trzy w paski, jedna z kołnierzykiem na patkę i polo z dzianiny z długim rękawem."},{"t":"Krawaty z wieloma kolorami","d":"Jedwabne w paski, foulardy, wełniane challis, czarna grenadyna i dzianinowe. Wybiera wzory z wieloma kolorami, by pasowały do wszystkiego w szafie."},{"t":"Dzianina i buty","d":"Zielony sweter w serek w stylu krykietowym i szalowy kardigan w kratę black watch jako zamiennik marynarki. Buty: loafersy, burgundowe derby, czarne brogsy, lakierki na wieczór i mokasyny żeglarskie zamiast tenisówek."},{"t":"Strój wieczorowy i kapelusze","d":"Czarny smoking jednorzędowy z klapą w szpic, pas i mucha typu batwing. Trzy kapelusze: szary filcowy, kaszkiet z tweedu i oliwkowe trilby."},{"t":"Dodatki","d":"Dwustronne paski skórzane, pas z taśmy, szelki, skarpety z akcentem, spinki, szare rękawiczki z pekari i białe lniane poszetki zamiast tuzina chusteczek."}],"conclusion":"Stara lista z Esquire, dopasowana do własnego gustu i życia, daje solidną, spójną garderobę na lata.","factchecks":[{"claim":"Trencz Burberry to klasyczny płaszcz przeciwdeszczowy, który przetrwał dekady.","verdict":"prawda","note":"Trencz powstał na początku XX wieku, a Burberry jest jednym z jego głównych twórców i producentów.","p":2,"src":[["Wikipedia (ang.): trencz - hasło \"Trench coat\"","https://en.wikipedia.org/wiki/Trench_coat"]]},{"claim":"Koszula oxford z kołnierzykiem na guziki to klasyka stylu college.","verdict":"prawda","note":"Button-down z tkaniny oxford od lat 50. i 60. jest symbolem amerykańskiego stylu Ivy League.","p":3,"src":[["Wikipedia (ang.): styl uczelni Ivy League - hasło \"Ivy League (clothing)\"","https://en.wikipedia.org/wiki/Ivy_League_(clothing)"]]},{"claim":"Kordowan kojarzy się z głębokim burgundowym kolorem skóry.","verdict":"prawda","note":"Shell cordovan to skóra końska, a jej klasyczny odcień to ciemne bordo nazywane \"Color 8\".","p":5,"src":[["Wikipedia (ang.): skóra kordowan - hasło \"Shell cordovan\"","https://en.wikipedia.org/wiki/Shell_cordovan"]]}],"bias":"Klasyczny, brytyjsko-amerykański punkt widzenia i drogie marki. To raczej inspiracja niż lista zakupów, choć sporo rzeczy pokazanych jest jak w katalogu."},{"id":"qoS5NDf3Xfk","title_pl":"Dr Maciej Mulak o prędkości światła: od latarni Galileusza po napęd warp","title":"Największe tajemnice czasu i przestrzeni || dr inż. Maciej Mulak","channel":"didaskalia","url":"https://www.youtube.com/watch?v=qoS5NDf3Xfk","date":"2026-08-09","duration":7216,"views":499020,"section":"Didaskalia","transcript":"youtube","added":"2026-11-03","tags":["Nauka","Fizyka","Historia nauki"],"about":"Fizyk z Politechniki Wrocławskiej opowiada, jak zmierzono prędkość światła, czemu jej nie przekroczymy i co z tego wynika dla podróży kosmicznych.","intro":"Dwugodzinna rozmowa Patrycjusza Wyżgi z dr. inż. Maciejem Mulakiem z Politechniki Wrocławskiej, współtwórcą projektu \"Fizyka bez zamulania\" (sierpień 2026). Pełna anegdot historia pomiarów prędkości światła, od Galileusza i Rømera po Michelsona, a dalej czasoprzestrzeń, eter, dualizm falowo-korpuskularny, napęd warp, tunele, AI i pytanie, czy jesteśmy sami.","points":[{"t":"Co znaczy, że nic nie jest szybsze","d":"Granica dotyczy przenoszenia informacji, energii i przyczyny. Fala meksykańska na stadionie może biec szybciej, a odległe galaktyki oddalają się szybciej od światła, bo puchnie sama przestrzeń jak ciasto z rodzynkami."},{"t":"Podróż przez czasoprzestrzeń","d":"Wszystko porusza się w czasoprzestrzeni z prędkością światła. Siedząc, podróżujemy tylko w czasie. Ruch w przestrzeni zużywa ten budżet, więc czas płynie wolniej, a we wzorach Einsteina przy c pojawia się dzielenie przez zero."},{"t":"Jak to jest szybko","d":"Ok. 300 000 km/s to ponad siedem okrążeń równika na sekundę. Światło biegnie od Słońca 8 min 20 s, a od galaktyki Andromedy 2,5 mln lat, więc patrzenie w niebo jest podróżą w przeszłość."},{"t":"Galileusz i latarnie","d":"Grecy uważali, że światło rozchodzi się natychmiast. Galileusz, członek Akademii Rysiów, zaproponował pomiar z dwiema latarniami na wzgórzach. Był odważny, ale metoda nie miała szans przy takiej prędkości."},{"t":"Rømer i księżyc Io","d":"W latach 70. XVII w. Rømer, zachęcony przez Cassiniego, zauważył opóźnienia zaćmień Io zależne od położenia Ziemi na orbicie. Uznał, że światło potrzebuje czasu na pokonanie średnicy orbity, ok. 300 mln km."},{"t":"Bradley i Michelson","d":"Bradley z aberracji gwiazd w XVIII w. uzyskał wynik bliski prawdziwemu. Kolejne pomiary, aż po Michelsona, dały dokładność bliską dzisiejszej. Dziś metr definiuje się przez prędkość światła: 299 792 458 m/s."},{"t":"Próżnia i eter","d":"Grecy bali się pustki. Torricelli pokazał, że słup rtęci 760 mm podtrzymuje ciśnienie powietrza, a nie niewidzialne sznurki. Skoro światło biegnie w próżni, wymyślono eter. Fizyka go odrzuciła, choć wciąż ma wyznawców."},{"t":"Falocząstka","d":"Newton: cząstki, Young i Fresnel: fale, Einstein i efekt fotoelektryczny: znów cząstki. Światło jest hybrydą, jak walec, który z jednej strony rzuca cień koła, a z drugiej prostokąta. Nasze szufladki do tego nie pasują."},{"t":"Czas to pieniądz","d":"Precyzyjny czas i światłowody liczą się np. na giełdzie: w handlu wysokich częstotliwości fizyczna odległość biura od serwerów giełdy, liczona w metrach światłowodu, decyduje o tym, kto zarobi."},{"t":"Warp i tunele","d":"Walka z prędkością światła to walka z geometrią czasoprzestrzeni. Napęd warp i tunele czasoprzestrzenne matematyka dopuszcza, ale potrzebują ujemnej energii, czyli materii egzotycznej, której nie znamy. Lokalny limit musi zostać."},{"t":"AI i wielka cisza","d":"Gość obawia się utraty ciągłości pojęciowej, gdy AI zacznie dawać rozwiązania, których nie zrozumiemy. O życiu w kosmosie mówi ostrożnie: biologiczne wąskie gardła mogą sprawiać, że inteligentne życie jest rzadkie."}],"conclusion":"Gawędziarska, pełna dygresji lekcja fizyki i historii nauki. Najlepsza dla tych, którzy lubią anegdoty bardziej niż wzory.","factchecks":[{"claim":"Einstein dostał Nobla za efekt fotoelektryczny, chyba w 1926 r.","verdict":"półprawda","note":"Powód się zgadza, ale była to nagroda za 1921 r., wręczona w 1922 r.","p":7,"src":[["Wikipedia (ang.): Albert Einstein - hasło \"Albert Einstein\"","https://en.wikipedia.org/wiki/Albert_Einstein"]]},{"claim":"Liniowa prędkość równika to ok. 1400 km/h.","verdict":"fałsz","note":"Na równiku to ok. 1675 km/h (obwód 40 075 km na dobę). Ok. 1400 km/h jest dopiero na ok. 33 stopniach szerokości.","p":null,"src":[["Wikipedia (ang.): obrót Ziemi - hasło \"Earth's rotation\"","https://en.wikipedia.org/wiki/Earth's_rotation"]]},{"claim":"Rømer zaniżył prędkość światła, uzyskując ok. 200 000 km/s.","verdict":"prawda","note":"Z jego ok. 11 minut na drogę od Słońca wychodzi ok. 220 000 km/s.","p":4,"src":[["Wikipedia (ang.): Ole Rømer - hasło \"Ole Rømer\"","https://en.wikipedia.org/wiki/Ole_Rømer"]]},{"claim":"Prędkość światła w próżni to 299 792 458 m/s.","verdict":"prawda","note":"Wartość dokładna, bo od 1983 r. definiuje ona metr.","p":5,"src":[["Wikipedia (ang.): prędkość światła - hasło \"Speed of light\"","https://en.wikipedia.org/wiki/Speed_of_light"]]}],"bias":"Brak stronniczości. Rozmowa bardzo gawędziarska, z licznymi dygresjami i drobnymi pomyłkami w datach i liczbach. Wątki o AI i obcych to opinie gościa."},{"id":"B3lGOPPBRFg","title_pl":"14 ćwiczeń na zdrowe i silne barki - przegląd fizjoterapeuty","title":"The Only 14 Shoulder Exercises You Ever Need!","channel":"Squat University","url":"https://www.youtube.com/watch?v=B3lGOPPBRFg","date":"2026-07-28","duration":884,"views":168165,"section":"Sport","transcript":"youtube","added":"2026-11-03","tags":["Barki","Prehab","Stożek rotatorów"],"about":"Dr Aaron Horschig ze Squat University omawia ćwiczenia na stożek rotatorów i łopatki, mówiąc, kiedy i po co je zaleca.","intro":"Fizjoterapeuta Aaron Horschig ze Squat University pokazuje ćwiczenia, które stosuje u sportowców z bólem barku, żeby wrócili do ciężkiego treningu. Zaczyna od krótkiej anatomii, potem omawia rotację zewnętrzną, mięsień nadgrzebieniowy i mięśnie łopatki. Przy każdym ćwiczeniu zwraca uwagę na typowe błędy.","points":[{"t":"Bark to zespół mięśni","d":"Przy unoszeniu ręki mięsień naramienny ciągnie kość ramienną w górę, a stożek rotatorów w dół i do środka. Gdy któryś nie działa albo łopatka porusza się nieskoordynowanie, rośnie ryzyko bólu. Samo wzmocnienie słabego mięśnia nie zawsze wystarczy."},{"t":"Rotacja zewnętrzna w leżeniu bokiem","d":"Łokieć zgięty pod kątem 90 stopni, przyciśnięty do żeber, najlepiej z ręcznikiem pod ramieniem. Tempo: 3 s w górę, pauza, 3 s w dół, zatrzymanie na poziomie równoległym. Główny błąd to odsuwanie łokcia od tułowia."},{"t":"Wersje z gumą","d":"Na stojąco potrzebny jest wyciąg lub guma, bo hantel przy tułowiu nie obciąża dobrze podgrzebieniowego. Nie ściągaj łopatek. Wersja W z małą gumą angażuje obie ręce naraz, z przytrzymaniem 5-10 s."},{"t":"Rotacja z ręką uniesioną","d":"Ćwiczenia przy tułowiu słabo przenoszą się na pozycję z ręką odwiedzioną. Dlatego potem rotacja z gumą z łokciem opartym na kolanie i przytrzymaniem 3-5 s, a dalej wersje w pozycji nad głową."},{"t":"Popularna rotacja z social mediów","d":"Dwa błędy: za duży ciężar i odrywanie łopatki przy opuszczaniu. Trzymaj łopatkę stabilnie i zatrzymaj ruch, gdy przód barku zaczyna się wysuwać. Brak rotacji wewnętrznej przeszkadza też w wyciskaniu na ławce."},{"t":"Full can zamiast empty can","d":"Na mięsień nadgrzebieniowy: unoszenie hantli kciukami w górę, około 30 stopni przed linią boczną. Autor odradza wersję kciukami w dół. Progresje to większy zakres, guma na nadgarstkach i \"lustrzane\" unoszenia: 8-10 ruchów jedną ręką, gdy druga trzyma pozycję."},{"t":"Mięśnie łopatki","d":"Pompka plus kończy się maksymalnym rozsunięciem łopatek, co mocno angażuje zębaty przedni. Wypychanie wyciągu lub sztangi z obrotem tułowia przenosi pracę z piersiowego na zębaty. Na dolny czworoboczny: unoszenie Y pod kątem 45 stopni, też w leżeniu."}],"conclusion":"Dobierz ćwiczenia do etapu: najpierw rotacja przy tułowiu, potem stabilność z ręką uniesioną, nadgrzebieniowy i mięśnie łopatki.","factchecks":[{"claim":"Rotacja zewnętrzna w leżeniu bokiem najmocniej aktywuje podgrzebieniowy i obły mniejszy.","verdict":"prawda","note":"W badaniu EMG Reinolda dała największą aktywność podgrzebieniowego (62% MVIC) i obłego mniejszego (67%).","p":1,"src":[["PubMed: Reinold i wsp. 2004 - \"Electromyographic analysis of the rotator cuff and deltoid musculature...\"","https://pubmed.ncbi.nlm.nih.gov/15296366/"]]},{"claim":"Pompka plus to jedno z ćwiczeń najmocniej aktywujących zębaty przedni.","verdict":"prawda","note":"Standardowa pompka plus dała najwyższą aktywację zębatego i najmniej czworobocznego górnego.","p":6,"src":[["PubMed: Ludewig i wsp. 2004 - \"Relative balance of serratus anterior and upper trapezius muscle activity...\"","https://pubmed.ncbi.nlm.nih.gov/14977678/"]]},{"claim":"Lepiej robić full can niż empty can.","verdict":"prawda","note":"Wg pracy z 2016 roku empty can wywołuje więcej bólu i ma gorszą biomechanikę niż full can.","p":5,"src":[["PubMed: Timmons i wsp. 2016 - \"Empty can exercise provokes more pain and has undesirable biomechanics...\"","https://pubmed.ncbi.nlm.nih.gov/26577128/"]]}],"bias":"Rzetelny przegląd oparty na badaniach EMG, bez sponsora. Autor zachęca do swoich innych filmów i programów rozgrzewki."},{"id":"yTvakY_xVJk","title_pl":"Dlaczego Rzymianie nigdy nie przekroczyli równika","title":"Why the Romans Could Never Cross the Equator","channel":"KhAnubis","url":"https://www.youtube.com/watch?v=yTvakY_xVJk","date":"2026-07-26","duration":711,"views":1143919,"transcript":"youtube","added":"2026-11-03","tags":["Historia","Geografia"],"about":"Jak starożytni wyobrażali sobie nieznany świat: strefa gorąca, ludy z Pliniusza, Rzym i Chiny oraz bariery dawnych odkrywców.","intro":"Autor tłumaczy, dlaczego granica znanego świata dla Rzymian była bardziej psychologiczna niż techniczna. Omawia teorię stref klimatycznych, wymyślone kontynenty i ludy-potwory z Pliniusza, wzajemne wyobrażenia Rzymu i Chin oraz wyprawy Hannona, Himilkona, Pyteasza i Gila Eanesa. Na koniec porównuje to z dzisiejszym patrzeniem na kosmos.","points":[{"t":"Strefa gorąca","d":"W V w. p.n.e. Parmenides podzielił Ziemię na 5 stref: 2 mroźne, 2 umiarkowane i gorącą przy równiku, gdzie nic nie przeżyje. Grecy i Rzymianie nie wiedzieli, że Sahara bywa gorętsza niż równik, a najdalej na południe znali okolice Somalii."},{"t":"Kontynenty z rozumowania","d":"Skoro na północy jest dużo lądu, na południu też musi być, dla równowagi: Rzymianie nazwali go Terra Australis Incognita. W II w. p.n.e. Krates z Mallos dodał 2 lądy na półkuli zachodniej, według autora jakby przewidując Ameryki."},{"t":"Ludy-potwory Pliniusza","d":"W Historii naturalnej (lata 70. n.e.) Pliniusz opisał Blemmiów bez głów z twarzą na piersi, psiogłowych Kynokefalów w Indiach, jednonogich Skiapodów i Astomów bez ust żywiących się zapachem, jako fakty. Herodot wcześniej umieszczał bezgłowych w Libii."},{"t":"Zniekształcone relacje","d":"Według autora część opisów to prawdziwe obserwacje zniekształcone przez głuchy telefon. Jedna z interpretacji mówi, że bezgłowi Blemmiowie to wojownicy kulący głowy za tarczami, widziani z daleka."},{"t":"Daqin, czyli Rzym oczami Chin","d":"Chińczycy nazywali Rzym Daqin (Wielkie Qin) i wyobrażali go sobie jako cnotliwe państwo z królem ustępującym w razie klęski. Autorowi przypomina to republikę z konsulami na rok."},{"t":"Gan Ying i morze szaleństwa","d":"W 97 r. n.e. poseł Gan Ying przez Azję Środkową i Partię dotarł do Tiaozhi nad wielkim morzem. Usłyszał, że przeprawa trwa 2-3 lata. Według autora Partowie to zmyślili, bo jako pośrednicy na Jedwabnym Szlaku nie chcieli bezpośredniego kontaktu Rzymu z Chinami."},{"t":"Rzymianie w Chinach w 166 r.","d":"Rzymska delegacja przypłynęła morzem przez Wietnam. Rzymskich dokumentów brak, ale chińskie kroniki wspominają posłów od Anduna: imię brzmi jak Antoninus Pius, a data wskazuje raczej na Marka Aureliusza."},{"t":"Hannon i Himilkon","d":"W V w. p.n.e. Kartagińczyk Hannon płynął wzdłuż Afryki, według badaczy do Senegalu lub Gabonu; jego \"owłosione kobiety\" dały nazwę gorylom. Himilkon popłynął na północ do Bretanii lub Brytanii za cyną, aż zatrzymały go mgły i wodorosty."},{"t":"Pyteasz i Thule","d":"Ok. 100 lat później Pyteasz z Massalii (Marsylii) dotarł za Brytanię do Thule, gdzie latem słońce prawie nie zachodzi, a morze zmienia się w \"płuco morskie\", według autora prawdopodobnie lód krupowy. Mogło to wzmacniać mit Hyperborei."},{"t":"Bariery na krańcu świata","d":"Ok. 1000 lat po Gan Yingu mnich Rabban Bar Sauma dotarł do Konstantynopola. Przylądek Bojador z rafami i wiatrami uchodził za kres żeglugi do 1434 r., gdy Gil Eanes po prostu go opłynął. Według autora wyprawy blokowały też koszty i ostrożni inwestorzy."}],"conclusion":"Eksploracja zależy od tego, kto odważy się płynąć i kto za to zapłaci; dziś tak samo patrzymy na kosmos.","factchecks":[{"claim":"Parmenides wymyślił podział Ziemi na strefy klimatyczne.","verdict":"prawda","note":"Według Strabona pierwszy był Parmenides, a teorię rozwinął Arystoteles.","p":0,"src":[["Wikipedia (ang.): strefy geograficzne - hasło \"Geographical zone\"","https://en.wikipedia.org/wiki/Geographical_zone"]]},{"claim":"Pustynie jak Sahara bywają gorętsze niż okolice równika.","verdict":"prawda","note":"Rekordy temperatur notuje się na pustyniach zwrotnikowych (Lut, Sahara, Dolina Śmierci), nie na równiku.","p":0,"src":[["Wikipedia (ang.): najwyższe temperatury na Ziemi - hasło \"Highest temperature recorded on Earth\"","https://en.wikipedia.org/wiki/Highest_temperature_recorded_on_Earth"]]},{"claim":"Krates z Mallos przewidywał dodatkowe lądy na drugiej półkuli.","verdict":"prawda","note":"Krates zbudował najstarszy znany globus z 4 masami lądu oddzielonymi oceanami.","p":1,"src":[["Wikipedia (ang.): Krates z Mallos - hasło \"Crates of Mallus\"","https://en.wikipedia.org/wiki/Crates_of_Mallus"],["Wikipedia (ang.): Terra Australis - hasło \"Terra Australis\"","https://en.wikipedia.org/wiki/Terra_Australis"]]},{"claim":"Pliniusz opisał bezgłowych Blemmiów, Kynokefalów, Skiapodów i Astomów.","verdict":"prawda","note":"Wszystkie te ludy są w Historii naturalnej (77-79 n.e.); Blemmiowie byli też realnym ludem na południe od Egiptu.","p":2,"src":[["Wikipedia (ang.): Blemmiowie - hasło \"Blemmyes\"","https://en.wikipedia.org/wiki/Blemmyes"],["Wikipedia (ang.): Astomowie - hasło \"Astomi\"","https://en.wikipedia.org/wiki/Astomi"],["Wikipedia (ang.): Historia naturalna Pliniusza - hasło \"Natural History (Pliny)\"","https://en.wikipedia.org/wiki/Natural_History_(Pliny)"]]},{"claim":"Gan Ying dotarł do Zatoki Perskiej, a Partowie go zniechęcili.","verdict":"półprawda","note":"Nie wiadomo, czy \"zachodnie morze\" to Zatoka Perska, Morze Śródziemne czy Czarne; wersja o Partach to hipoteza.","p":5,"src":[["Wikipedia (ang.): Gan Ying - hasło \"Gan Ying\"","https://en.wikipedia.org/wiki/Gan_Ying"]]},{"claim":"W 166 r. do Chin dotarli posłowie od Anduna z Daqin.","verdict":"prawda","note":"Notuje to Księga Późniejszych Hanów; Andun to Antoninus Pius lub Marek Aureliusz, rzymskich źródeł brak.","p":6,"src":[["Wikipedia (ang.): stosunki rzymsko-chińskie - hasło \"Sino-Roman relations\"","https://en.wikipedia.org/wiki/Sino-Roman_relations"]]},{"claim":"Hannon dotarł do Senegalu lub Gabonu i dał nazwę gorylom.","verdict":"półprawda","note":"Nazwa goryla pochodzi z jego relacji, ale zasięg wyprawy jest sporny: od Gabonu po samo południe Maroka.","p":7,"src":[["Wikipedia (ang.): Hannon Żeglarz - hasło \"Hanno the Navigator\"","https://en.wikipedia.org/wiki/Hanno_the_Navigator"],["Wikipedia (ang.): goryl - hasło \"Gorilla\"","https://en.wikipedia.org/wiki/Gorilla"]]},{"claim":"\"Płuco morskie\" Pyteasza to prawdopodobnie lód krupowy.","verdict":"nie da się sprawdzić","note":"Opis zna się tylko ze Strabona; badacze łączą go też z meduzami zwanymi płucami morskimi lub dryfującym lodem.","p":8,"src":[["Wikipedia (ang.): Pyteasz - hasło \"Pytheas\"","https://en.wikipedia.org/wiki/Pytheas"]]},{"claim":"Rabban Bar Sauma dotarł do Konstantynopola, a Gil Eanes opłynął Bojador w 1434 r.","verdict":"prawda","note":"Bar Sauma był w Konstantynopolu w 1287 r.; Eanes minął Bojador w 1434 r. po nieudanej próbie w 1433 r.","p":9,"src":[["Wikipedia (ang.): Rabban Bar Sauma - hasło \"Rabban Bar Sawma\"","https://en.wikipedia.org/wiki/Rabban_Bar_Sawma"],["Wikipedia (ang.): Gil Eanes - hasło \"Gil Eanes\"","https://en.wikipedia.org/wiki/Gil_Eanes"],["Wikipedia (ang.): przylądek Bojador - hasło \"Cape Bojador\"","https://en.wikipedia.org/wiki/Cape_Bojador"]]}],"bias":"Rzetelny i ostrożny film; uproszczenia przy hipotezach (Partowie, tarcze Blemmiów) i dość skrajny kontrast \"lękliwy Rzym kontra ufne Chiny\".","section":"Historia"},{"id":"T1-5Ic9iiPs","title_pl":"30 lat studiuję żywienie. Oto co naprawdę ma znaczenie","title":"I Studied Nutrition for 30 Years. Here’s What Actually Matters.","channel":"Nutrition Made Simple!","url":"https://www.youtube.com/watch?v=T1-5Ic9iiPs","date":"2026-07-25","duration":1249,"views":768847,"section":"Sport","transcript":"whisper","added":"2026-11-03","tags":["Ciało i zdrowie","Odżywianie","Mity"],"about":"Lekarz z kanału Nutrition Made Simple podaje 5 zasad, które pozwalają odsiać straszenie jedzeniem i zbudować zdrową dietę.","intro":"Dr Gil Carvalho z Nutrition Made Simple mówi, że sprzeczne porady w sieci uczą zadawać złe pytania. Sprowadza żywienie do 5 prostych zasad i pokazuje je na fasoli, owsie, tłuszczach, olejach i białku. Opowiada też, co sam je z rodziną.","points":[{"t":"1. Patrz na całego słonia","d":"Żywność to pakiet wielu składników, a jej efekt to suma ich działań. Lektyny w fasoli niszczy gotowanie, a badania na ludziach pokazują przy fasoli i owsie niższy cholesterol, lepszy cukier i mniej chorób serca."},{"t":"Makroskładnik sam nie jest dobry ani zły","d":"Węglowodany z owoców i strączków działają dobrze, a z napojów słodzonych i muffinów źle. Łosoś, kefir i oliwa mają tłuszcze nasycone, a dają dobre efekty; masło i olej kokosowy w dużych ilościach już nie."},{"t":"Oleje roślinne i białko","d":"Według autora badania na ludziach pokazują przy oleju rzepakowym lepsze wyniki krwi i mniejszą śmiertelność. Większość ludzi na Zachodzie je dość białka bez liczenia gramów, a spór roślinne kontra zwierzęce mija się z celem."},{"t":"2. Personalizacja dla chorych","d":"Celiakia, kamienie szczawianowe czy IBS wymagają osobnych zasad, ale nie dotyczą 99% ludzi. Jajka podnoszą u większości cholesterol o ok. 7 mg/dl, choć u niektórych dużo bardziej."},{"t":"Jedz pod swoje wyniki","d":"Ludzie różnie reagują na sól czy cholesterol z diety, więc warto dopasować dietę do badań krwi i ciśnienia. Skoki glukozy są ważne przy cukrzycy, nie u zdrowych."},{"t":"3. Zmiany chwilowe to nie choroba","d":"Po posiłku rośnie cukier i trójglicerydy, przy wysiłku ciśnienie. Problemem jest wartość stale wysoka, np. na czczo, a nie chwilowy wzrost."},{"t":"4. W porównaniu z czym?","d":"Każdy produkt wygląda dobrze lub źle zależnie od porównania. Masło kontra białe pieczywo nie zmienia ryzyka chorób serca, ale masło kontra oliwa czy owies już tak."},{"t":"5. Liczy się to, co jesz stale","d":"Zdrowie zależy od codziennego wzorca, nie od chipsów na pikniku. Najlepiej zbadana jest tradycyjna dieta śródziemnomorska: warzywa, owoce, strączki, pełne ziarna, oliwa, ryby, trochę nabiału."},{"t":"Uzupełnij braki","d":"Na diecie wegańskiej potrzebna jest witamina B12, a bez ryb, nabiału i soli jodowanej warto zadbać o jod."}],"conclusion":"Nie bój się pojedynczych składników; licz się z całym produktem, porównaniem i stałym wzorcem diety, dopasowanym do własnych wyników.","factchecks":[{"claim":"Cholesterol z diety (np. jajka) podnosi cholesterol we krwi u większości o ok. 7 mg/dl.","verdict":"prawda","note":"Metaanaliza Bergera i wsp. (2015) wykazała wzrost cholesterolu całkowitego o ok. 0,19 mmol/l, czyli ok. 7 mg/dl.","p":3,"src":[["PubMed: Berger i wsp. 2015 - \"Dietary cholesterol and cardiovascular disease\"","https://pubmed.ncbi.nlm.nih.gov/26109578/"]]},{"claim":"Olej rzepakowy poprawia wyniki krwi, np. cholesterol.","verdict":"prawda","note":"Metaanaliza z 2020 roku wykazała spadek cholesterolu całkowitego i LDL przy oleju rzepakowym.","p":2,"src":[["PubMed: metaanaliza 2020, olej rzepakowy - \"The effects of Canola oil on cardiovascular risk factors\"","https://pubmed.ncbi.nlm.nih.gov/33127255/"]]},{"claim":"Gotowanie niszczy szkodliwe lektyny w fasoli.","verdict":"prawda","note":"Fitohemaglutyninę w fasoli dezaktywuje gotowanie we wrzątku, ale nie wolne podgrzewanie w niskiej temperaturze.","p":0,"src":[["Wikipedia (ang.): lektyna fasoli - hasło \"Phytohaemagglutinin\"","https://en.wikipedia.org/wiki/Phytohaemagglutinin"]]},{"claim":"Dieta śródziemnomorska ma najwięcej dowodów, np. mniej chorób serca.","verdict":"prawda","note":"Badanie PREDIMED (NEJM 2018) wykazało ok. 30% mniej incydentów sercowo-naczyniowych.","p":7,"src":[["PubMed: PREDIMED, NEJM 2018 - \"Primary Prevention of Cardiovascular Disease with a Mediterranean Diet\"","https://pubmed.ncbi.nlm.nih.gov/29897866/"],["Wikipedia (ang.): dieta śródziemnomorska - hasło \"Mediterranean diet\"","https://en.wikipedia.org/wiki/Mediterranean_diet"]]},{"claim":"Weganie potrzebują źródła witaminy B12.","verdict":"prawda","note":"B12 występuje praktycznie tylko w produktach zwierzęcych, więc weganom zaleca się suplementację lub żywność wzbogacaną.","p":8,"src":[["Wikipedia (ang.): witamina B12 - hasło \"Vitamin B12\"","https://en.wikipedia.org/wiki/Vitamin_B12"]]}],"bias":"Spokojny, oparty na badaniach materiał. Autor mocno broni oleju rzepakowego, gdzie dowody są w dużej części obserwacyjne. Na końcu zachęta do zapisu na newsletter."},{"id":"4S1T6M7OhqU","title_pl":"Największe problemy inżynieryjne, jakie kiedykolwiek rozwiązano","title":"The Biggest Engineering Problems Ever Solved","channel":"Some Guy Who Knows Stuff","url":"https://www.youtube.com/watch?v=4S1T6M7OhqU","date":"2026-07-19","duration":1063,"views":789618,"section":"Technologie","transcript":"youtube","added":"2026-11-03","tags":["Technika","Historia"],"about":"Ranking 10 wielkich budów: od Kanału Panamskiego i Mostu Brooklińskiego po Wielki Zderzacz Hadronów i Międzynarodową Stację Kosmiczną.","intro":"Odliczanie od 10. do 1. miejsca największych wyzwań inżynierii. Przy każdym projekcie autor pokazuje, jaki problem trzeba było rozwiązać, jak to zrobiono i co z tego wyszło: kanał, mosty, tunel, tama, lot na Księżyc, wieżowiec, kolej, akcelerator cząstek i stacja kosmiczna.","points":[{"t":"10. Kanał Panamski","d":"Francuzi pod wodzą Ferdinanda de Lessepsa zaczęli kopać w latach 80. XIX w., ale deszcze, osuwiska, malaria i żółta febra zabiły ponad 20 000 ludzi. USA od 1904 r. zbudowały śluzy podnoszące statki ponad 25 m do sztucznego jeziora, a William Gorgas walczył z komarami. Otwarcie w 1914 r."},{"t":"9. Most Brookliński","d":"Wiszący most nad East River zaprojektował John Augustus Roebling, który zginął po wypadku. Syn Washington zapadł na chorobę dekompresyjną w kesonach i kierował budową z mieszkania przez teleskop, a jego żona Emily była łącznikiem z inżynierami. Otwarty w 1883 r."},{"t":"8. Tunel pod kanałem La Manche","d":"Budowa ruszyła w 1988 r. z obu brzegów naraz, maszyny drążyły warstwę kredy i od razu kładły betonową obudowę. Przebicie w 1990 r. po ponad 50 km wykopów, otwarcie w 1994 r. Dziś pociągi łączą Wielką Brytanię z kontynentem w około 35 minut."},{"t":"7. Zapora Hoovera","d":"Od 1931 r. najpierw przekierowano rzekę Kolorado czterema tunelami w ścianach kanionu. Beton lano w osobnych blokach z rurami chłodzącymi, bo jedna wylewka stygłaby ponad sto lat i pękła. Tama ma ponad 220 m, utworzyła Jezioro Mead i do dziś daje prąd i wodę."},{"t":"6. Lądowanie na Księżycu","d":"Kennedy w 1961 r. postawił cel lądowania przed końcem dekady, choć nikt nie wyleciał poza orbitę Ziemi. Powstała rakieta Saturn V (ponad 110 m) i komputer Apollo słabszy od smartfona. Apollo 11 wylądował 20 lipca 1969 r. po podróży na odległość prawie 400 000 km."},{"t":"5. Burdż Chalifa","d":"Budowa od 2004 r.: przekrój w kształcie litery Y rozkłada ciężar i osłabia wiatr, testowany w tunelu aerodynamicznym. Słaby grunt wymagał prawie 200 betonowych pali pod ponad pół miliona ton. Ukończony w 2010 r., ma 828 m."},{"t":"4. Kolej transkontynentalna w USA","d":"Od 1863 r. Central Pacific budowała na wschód przez Sierra Nevada, a Union Pacific na zachód przez Wielkie Równiny. Tunele wysadzano prochem i nitrogliceryną, kluczową rolę odegrały tysiące chińskich robotników. Linie spotkały się w Promontory Summit w 1869 r., podróż skróciła się z miesięcy do tygodnia."},{"t":"3. Most Golden Gate","d":"Joseph Strauss zaproponował most wiszący nad cieśniną z silnymi prądami, mgłą i wiatrem. Budowa od 1933 r., siatka pod mostem uratowała 19 robotników (\"Klub Pół drogi do Piekła\"). Most celowo ugina się przy wietrze i trzęsieniach ziemi. Otwarty w 1937 r."},{"t":"2. Wielki Zderzacz Hadronów","d":"Pierścień o długości 27 km pod granicą Francji i Szwajcarii, z tysiącami magnesów nadprzewodzących chłodzonych do około -271°C i próżnią rzadszą niż w kosmosie. Działa od 2008 r., w 2012 r. pomógł potwierdzić bozon Higgsa."},{"t":"1. Międzynarodowa Stacja Kosmiczna","d":"Od 1998 r. składana na orbicie z dziesiątek modułów z wielu krajów, przy prędkości prawie 28 000 km/h, przez spacery kosmiczne i roboty. Stacja odzyskuje powietrze i wodę, ma panele słoneczne i musi być regularnie podnoszona, bo atmosfera ją hamuje."}],"conclusion":"Według autora każde z tych osiągnięć wymagało nowych rozwiązań, a doświadczenia z nich, np. z ISS, pomagają dziś planować misje na Księżyc i Marsa.","factchecks":[{"claim":"Podczas francuskiej próby budowy Kanału Panamskiego zmarło ponad 20 000 robotników.","verdict":"prawda","note":"Szacunki mówią o około 22 000 zgonów w latach 1881-1889, głównie z powodu chorób.","p":0,"src":[["Wikipedia (ang.): Kanał Panamski - hasło \"Panama Canal\"","https://en.wikipedia.org/wiki/Panama_Canal"]]},{"claim":"Budowa Mostu Brooklińskiego ruszyła w 1870 r., a Roebling zginął w wypadku budowlanym.","verdict":"półprawda","note":"Roebling zmarł na tężec w lipcu 1869 r., po wypadku przy pomiarach, czyli jeszcze przed startem budowy.","p":1,"src":[["Wikipedia (ang.): John A. Roebling - hasło \"John A. Roebling\"","https://en.wikipedia.org/wiki/John_A._Roebling"],["Wikipedia (ang.): Most Brookliński - hasło \"Brooklyn Bridge\"","https://en.wikipedia.org/wiki/Brooklyn_Bridge"]]},{"claim":"Tunel pod La Manche był w 1994 r. najdłuższym podmorskim tunelem świata.","verdict":"prawda","note":"Całością ustępuje tunelom Seikan i Gotthard, ale ma najdłuższy odcinek pod dnem morza.","p":2,"src":[["Wikipedia (ang.): tunel pod La Manche - hasło \"Channel Tunnel\"","https://en.wikipedia.org/wiki/Channel_Tunnel"]]},{"claim":"Beton Zapory Hoovera wylany naraz stygłby ponad sto lat.","verdict":"prawda","note":"Inżynierowie wyliczyli około 125 lat i pękanie, dlatego lano bloki chłodzone rurami z wodą.","p":3,"src":[["Wikipedia (ang.): Zapora Hoovera - hasło \"Hoover Dam\"","https://en.wikipedia.org/wiki/Hoover_Dam"]]},{"claim":"Komputer Apollo miał znacznie mniejszą moc obliczeniową niż współczesny smartfon.","verdict":"prawda","note":"AGC miał około 2 KB pamięci RAM i zegar około 1 MHz, czyli o rzędy wielkości mniej niż telefon.","p":4,"src":[["Wikipedia (ang.): komputer pokładowy Apollo - hasło \"Apollo Guidance Computer\"","https://en.wikipedia.org/wiki/Apollo_Guidance_Computer"]]},{"claim":"Burdż Chalifa ma 828 m i stoi na prawie 200 betonowych palach.","verdict":"prawda","note":"Fundament ma 192 pale o średnicy 1,5 m i długości 43 m.","p":5,"src":[["Wikipedia (ang.): Burdż Chalifa - hasło \"Burj Khalifa\"","https://en.wikipedia.org/wiki/Burj_Khalifa"]]},{"claim":"Siatka pod Golden Gate uratowała 19 robotników.","verdict":"prawda","note":"Uratowani utworzyli \"Half Way to Hell Club\".","p":7,"src":[["Wikipedia (ang.): most Golden Gate - hasło \"Golden Gate Bridge\"","https://en.wikipedia.org/wiki/Golden_Gate_Bridge"]]},{"claim":"Magnesy LHC chłodzi się do około -271°C, a w 2012 r. potwierdzono bozon Higgsa.","verdict":"prawda","note":"CERN podaje 1,9 K (-271,3°C); odkrycie ogłoszono 4 lipca 2012 r.","p":8,"src":[["CERN: Wielki Zderzacz Hadronów","https://home.cern/science/accelerators/large-hadron-collider"],["Wikipedia (ang.): Wielki Zderzacz Hadronów - hasło \"Large Hadron Collider\"","https://en.wikipedia.org/wiki/Large_Hadron_Collider"]]},{"claim":"ISS krąży z prędkością prawie 28 000 km/h, a budowę zaczęto w 1998 r.","verdict":"prawda","note":"Pierwszy moduł Zaria wystartował w listopadzie 1998 r.; prędkość orbitalna to około 28 000 km/h.","p":9,"src":[["Wikipedia (ang.): Międzynarodowa Stacja Kosmiczna - hasło \"International Space Station\"","https://en.wikipedia.org/wiki/International_Space_Station"]]}],"bias":"Rzetelny, ale powierzchowny przegląd: kolejność rankingu nie jest uzasadniona, a koszty ludzkie i spory (np. warunki pracy na kolei) ledwie wspomniane."},{"id":"LUzZdtHhSqQ","title_pl":"Strony, których używają mądrzy ludzie, a przeciętni nigdy o nich nie słyszeli","title":"Websites Smart People Use That Average People Never Heard Of","channel":"Chill Dude Explains","url":"https://www.youtube.com/watch?v=LUzZdtHhSqQ","date":"2026-07-13","duration":669,"views":541911,"transcript":"whisper","added":"2026-11-03","tags":["Technika"],"about":"Top 10 mało znanych darmowych stron: od archiwum FBI i Shodana po mapy Wi-Fi, rejestry firm i wyszukiwarkę kodu źródłowego.","intro":"Ranking 10 stron, które według autora zna mało kto. Są wśród nich archiwum akt FBI, wyszukiwarka urządzeń w sieci Shodan, rejestry przesyłek i firm, mapa sieci Wi-Fi WiGLE, katalog narzędzi AI, mapa powiązań prac naukowych, pogoda Windy, wirtualne karty płatnicze i wyszukiwarka kodu stron. Autor mocno upraszcza i dramatyzuje.","points":[{"t":"10. FBI Vault","d":"Darmowe archiwum akt FBI (vault.fbi.gov) udostępnianych na mocy ustawy o dostępie do informacji (FOIA). Są tam akta Elvisa Presleya i Alberta Einsteina, a także memo z 1950 r. o 3 latających spodkach odzyskanych w Nowym Meksyku, w każdym 3 ciała o wzroście ok. 0,9 m."},{"t":"9. Shodan","d":"Wyszukiwarka urządzeń podłączonych do internetu: kamer, nianiek elektronicznych, sygnalizacji świetlnej, sterowników przemysłowych. Wiele działa bez hasła lub na fabrycznych ustawieniach. Według autora hakerzy weszli do sieci kasyna przez termometr akwarium i wynieśli 10 GB danych."},{"t":"8. ImportYeti","d":"Wyszukiwarka publicznych dokumentów celnych USA (konosamentów). Po nazwie firmy widać, która fabryka w Chinach czy Wietnamie robi jej produkty, z adresem, liczbą i wagą przesyłek. Można tak znaleźć dostawcę konkurencji albo odkryć, że droga marka i tania podróbka płyną z tej samej fabryki."},{"t":"7. OpenCorporates","d":"Według autora największa otwarta baza firm na świecie, z ponad 200 mln zarejestrowanych spółek. Pokazuje dane rejestrowe, dyrektorów, adresy i sieć powiązań między spółkami o tych samych dyrektorach lub adresach, np. łańcuch spółek holdingowych za lokalną restauracją."},{"t":"6. WiGLE","d":"Tworzona społecznie od 2001 r. mapa sieci Wi-Fi: wolontariusze zbierają nazwy sieci i współrzędne GPS podczas jazdy czy spacerów. Według autora baza ma ponad 1 mld unikalnych sieci, a na wigle.net często znajdziesz własny router i sieci sąsiadów."},{"t":"5. Futurepedia","d":"Stale aktualizowany katalog tysięcy narzędzi AI podzielonych na kategorie: logo, lektor z tekstu, pisanie i poprawianie kodu, stylista ze zdjęć. Pokazuje, które są darmowe, mają okres próbny i które zyskują popularność."},{"t":"4. Connected Papers","d":"Z jednej pracy naukowej buduje wizualną mapę powiązanych prac. Według autora wielkość kółka to liczba cytowań, a odległość to pokrewieństwo tematyczne. Widać prace założycielskie, najnowsze badania i głównych badaczy."},{"t":"3. Windy.com","d":"Darmowa mapa atmosfery w czasie rzeczywistym zamiast ikonki słońca i ok. 22°C w aplikacji. Pokazuje wiatr, prądy strumieniowe, huragany, fale, jakość powietrza, dym z pożarów, wyładowania i CO2; korzystają z niej piloci i żeglarze."},{"t":"2. Privacy.com","d":"Wirtualne numery kart do zakupów w sieci, osobny dla każdego sklepu i powiązany z kontem bankowym. Można ustawić limit, więc zapomniany okres próbny za 99 dolarów zostanie odrzucony, albo zrobić kartę jednorazową."},{"t":"1. PublicWWW","d":"Przeszukuje kod źródłowy milionów stron. Wklejając unikalny fragment, np. identyfikator Google Analytics, znajdziesz inne strony tej samej osoby lub grupy, nawet pod fałszywymi nazwami. Marketerzy sprawdzają tak narzędzia konkurencji, inni śledzą sieci oszukańczych stron."}],"conclusion":"Autor zapowiada podobne filmy i zachęca do subskrypcji.","factchecks":[{"claim":"Według filmu FBI uważało Elvisa za zagrożenie dla bezpieczeństwa USA.","verdict":"fałsz","note":"Te słowa pochodzą z listu obywatela do FBI z 1956 r.; Biuro nie prowadziło śledztwa w sprawie Elvisa.","p":0,"src":[["Archiwa Narodowe USA: Elvis w FBI i jego akta","https://text-message.blogs.archives.gov/2021/08/12/dont-be-cruel-elvis-presleys-visit-to-fbi-headquarters/"],["Wikipedia (ang.): akta FBI o Elvisie - hasło \"FBI files on Elvis Presley\"","https://en.wikipedia.org/wiki/FBI_files_on_Elvis_Presley"]]},{"claim":"Memo z 1950 r. o 3 spodkach z 3 ciałami jest prawdziwe.","verdict":"półprawda","note":"Dokument istnieje, ale FBI nazywa go relacją z drugiej lub trzeciej ręki, której nigdy nie sprawdzało.","p":0,"src":[["FBI Vault: memo Guya Hottela","https://vault.fbi.gov/hottel_guy"],["Wikipedia (ang.): memo Hottela i mistyfikacja z Aztec - hasło \"Hottel memo\"","https://en.wikipedia.org/wiki/Hottel_memo"]]},{"claim":"Kasyno straciło 10 GB danych przez termometr w akwarium.","verdict":"prawda","note":"Opisała to firma Darktrace w 2017 r.; dane trafiły na serwer w Finlandii. Film łączy to z Shodanem bez podstaw.","p":1,"src":[["SecurityWeek: akwarium wysłało 10 GB danych","https://www.securityweek.com/hacked-smart-fish-tank-exfiltrated-data-rare-external-destination/"]]},{"claim":"Shodan znajduje urządzenia w sieci, w tym kamery i sygnalizację.","verdict":"prawda","note":"Działa od 2009 r. i indeksuje kamery, routery i serwery; znajdowano nim m.in. sterowniki sygnalizacji.","p":1,"src":[["Wikipedia (ang.): wyszukiwarka Shodan - hasło \"Shodan (website)\"","https://en.wikipedia.org/wiki/Shodan_(website)"]]},{"claim":"ImportYeti pokazuje dokumenty celne każdej przesyłki do USA.","verdict":"półprawda","note":"Baza obejmuje setki milionów rekordów celnych, ale tylko import morski do USA, nie każdy transport.","p":2,"src":[["ImportYeti: wyszukiwarka rekordów celnych","https://www.importyeti.com/"],["Wikipedia (ang.): konosament - hasło \"Bill of lading\"","https://en.wikipedia.org/wiki/Bill_of_lading"]]},{"claim":"OpenCorporates ma dane ponad 200 mln firm.","verdict":"prawda","note":"W 2026 r. firma podaje ok. 220 mln spółek z ponad 147 jurysdykcji.","p":3,"src":[["OpenCorporates: komunikat z września 2026","https://blog.opencorporates.com/2026/09/03/opencorporates-achieves-iso-iec-277012025-certification/"],["Wikipedia (ang.): OpenCorporates - hasło \"OpenCorporates\"","https://en.wikipedia.org/wiki/OpenCorporates"]]},{"claim":"WiGLE działa od 2001 r. i ma ponad 1 mld sieci.","verdict":"prawda","note":"Pierwszą sieć dodano we wrześniu 2001 r.; statystyki WiGLE pokazują ponad 2 mld sieci Wi-Fi.","p":4,"src":[["WiGLE: statystyki bazy","https://wigle.net/stats"],["Wikipedia (ang.): WiGLE - hasło \"WiGLE\"","https://en.wikipedia.org/wiki/WiGLE"]]},{"claim":"W Connected Papers wielkość kółka to cytowania, a bliskość to podobieństwo.","verdict":"półprawda","note":"Układ opiera się na podobieństwie (współcytowania), nie na bezpośrednich cytowaniach; twórcy piszą, że to nie drzewo cytowań.","p":6,"src":[["Connected Papers: jak to działa","https://www.connectedpapers.com/about"]]},{"claim":"Privacy.com daje wirtualne karty z limitami i karty jednorazowe.","verdict":"prawda","note":"Tak działa usługa, ale tylko dla mieszkańców USA z amerykańskim kontem bankowym.","p":8,"src":[["Privacy.com: wirtualne karty","https://www.privacy.com/"]]},{"claim":"PublicWWW przeszukuje kod źródłowy stron.","verdict":"prawda","note":"Serwis szuka fragmentów w HTML, JavaScript i CSS stron.","p":9,"src":[["PublicWWW: wyszukiwarka kodu źródłowego","https://publicwww.com/"]]}],"bias":"Clickbaitowy tytuł; sensacyjne podanie akt FBI (Elvis, UFO) bez kontekstu, a narzędzia jak ImportYeti i Privacy.com działają głównie w USA.","section":"Chill Dude Explains"},{"id":"C7UoNZlUE2g","title_pl":"Najważniejsze wynalazki, o których mało myślisz","title":"The Most Important Inventions You Never Think About","channel":"Some Guy Who Knows Stuff","url":"https://www.youtube.com/watch?v=C7UoNZlUE2g","date":"2026-07-13","duration":984,"views":6932,"section":"Technologie","transcript":"youtube","added":"2026-11-04","tags":["Technika","Historia","Infrastruktura"],"about":"Some Guy Who Knows Stuff przypomina codziennym wynalazkom od spłukiwanej toalety po podmorskie kable internetu.","intro":"Film idzie od dziewiątego do pierwszego miejsca: spłukiwana toaleta i kanalizacja, lodówka, żarówka, winda, drut kolczasty, kontenerowiec, klimatyzacja, GPS i światłowody na dnie oceanów. Teza: rzeczy \"oczywiste\" cicho zmieniły zdrowie, miasta i handel.","points":[{"t":"Toaleta i kanalizacja","d":"Od rzymskich latryn po uszczelnienia wodne XVI-XIX w. i sieci kanalizacyjne. Odprowadzenie ścieków ograniczyło cholerę i dur w gęstych miastach."},{"t":"Lodówka","d":"Zamiast solenia i piwnic: XIX-wieczne systemy przemysłowe, potem domowe z bezpieczniejszymi czynnikami chłodniczymi. Zmieniła dietę, handel żywnością i przechowywanie szczepionek."},{"t":"Żarówka i winda","d":"Elektryczne światło wydłużyło dzień pracy i życie miast. Bezpieczna winda (hamulce przy zerwaniu liny) pozwoliła rosnąć budynkom w górę zamiast tylko wszerz."},{"t":"Drut kolczasty","d":"Tanie ogrodzenie wielkich areałów: kontrola bydła i granic własności na otwartych terenach; później też zastosowania wojskowe i graniczne."},{"t":"Kontener","d":"Standardowa skrzynia przenoszona statek-pociąg-ciężarówka bez rozładowywania towaru. Skróciła czas w portach i umożliwiła globalne łańcuchy dostaw."},{"t":"Klimatyzacja i GPS","d":"AC z fabryk i kin trafiło do domów i pozwoliło gęsto zasiedlać gorące regiony. GPS z satelitów daje pozycję i precyzyjny czas dla logistyki, lotnictwa i sieci."},{"t":"Podmorskie kable","d":"Światłowody na dnie oceanów przenoszą większość międzykontynentalnego internetu jako impulsy światła; kładzione specjalistycznymi statkami, w płytkich wodach często zakopywane."}],"conclusion":"Codzienna infrastruktura - od rur po kable na dnie morza - zwykle działa dopiero wtedy, gdy przestajemy o niej myśleć.","factchecks":[{"claim":"Kanalizacja i toalety ograniczyły epidemię cholery w miastach.","verdict":"prawda","note":"Reformy sanitarne XIX w. (np. Londyn po epidemiiach) wyraźnie obniżyły śmiertelność z chorób wodopochodnych.","p":0,"src":[["Wikipedia (ang.): cholera","https://en.wikipedia.org/wiki/Cholera"],["Wikipedia (ang.): historia kanalizacji - hasło \"History of water supply and sanitation\"","https://en.wikipedia.org/wiki/History_of_water_supply_and_sanitation"]]},{"claim":"Bezpieczeństwo wind Otisa otworzyło drogę wieżowcom.","verdict":"prawda","note":"Pokaz hamulca bezpieczeństwa Otisa (1853) zwiększył zaufanie do wind pasażerskich w wysokich budynkach.","p":2,"src":[["Wikipedia (ang.): winda - hasło \"Elevator\"","https://en.wikipedia.org/wiki/Elevator"],["Wikipedia (ang.): Elisha Otis","https://en.wikipedia.org/wiki/Elisha_Otis"]]},{"claim":"Konteneryzacja dramatycznie obniżyła koszty i czas przeładunku.","verdict":"prawda","note":"Od lat 50.-60. standardowe kontenery zredukowały pracę ręczną w portach i koszty frachtu.","p":4,"src":[["Wikipedia (ang.): kontenerowiec / konteneryzacja - hasło \"Containerization\"","https://en.wikipedia.org/wiki/Containerization"]]},{"claim":"Większość międzykontynentalnego internetu idzie podmorskimi światłowodami, nie satelitami.","verdict":"prawda","note":"Szacuje się, że ponad 95% ruchu międzykontynentalnego przechodzi kablami podmorskimi.","p":6,"src":[["Wikipedia (ang.): podmorskie kable komunikacyjne - hasło \"Submarine communications cable\"","https://en.wikipedia.org/wiki/Submarine_communications_cable"]]}],"bias":"Popularnonaukowy top-lista bez dat i nazwisk przy części punktó
