(1,2a + 0,75b) do stosunku 75 myli się najwyżej o ok. 5%.","verdict":"prawda","note":"Własne obliczenie numeryczne: -2,5% dla okręgu, +2,1% przy 2, -3,3% przy 20, -5,0% przy 75.","p":7,"src":[["Wikipedia (ang.): elipsa - hasło \"Ellipse\"","https://en.wikipedia.org/wiki/Ellipse"]]},{"claim":"Liczby pi nie da się zapisać skończonym wyrażeniem, stąd szeregi.","verdict":"prawda","note":"Pi jest niewymierne i przestępne; liczy się je m.in. szeregami nieskończonymi.","p":9,"src":[["Wikipedia (ang.): pi - hasło \"Pi\"","https://en.wikipedia.org/wiki/Pi"]]}],"bias":"Rzetelny i zabawny; wzory Parkera to jego własne propozycje, a nie uznane wyniki. Na końcu reklama sponsora."},{"id":"mRKAxyqwesY","title_pl":"Co krawiec może, a czego nie może poprawić w garniturze","title":"Suit Alterations: What a Tailor Can (& Can't) Do","channel":"Gentleman's Gazette","url":"https://www.youtube.com/watch?v=mRKAxyqwesY","date":"2020-06-19","duration":1239,"views":454508,"section":"Moda","transcript":"whisper","added":"2026-11-03","tags":["Styl","Krawiectwo","Garnitur"],"about":"Gentleman's Gazette przechodzi przez garnitur od ramion po nogawki i mówi, które przeróbki mają sens, a które nie.","intro":"Znajdujesz w lumpeksie piękny garnitur, ale ramiona są za szerokie. Kupić czy odłożyć? Gentleman's Gazette dzieli przeróbki na tak, może i nie, część po części, żeby łatwiej ocenić, czy ubranie da się dopasować.","points":[{"t":"Zmniejszać łatwiej niż powiększać","d":"Drogie i szyte na miarę ubrania mają zapas materiału w szwach, tanie konfekcyjne prawie wcale. Bezpiecznie jest kupić rzecz o rozmiar inną, maksymalnie o dwa."},{"t":"Ramiona: prawie zawsze nie","d":"Zmiana szerokości ramion to wielka operacja. Można najwyżej zdjąć lub dodać watolinę, ale efekt nie będzie taki jak w marynarce od początku tak skrojonej."},{"t":"Rękawy: tak, z zastrzeżeniami","d":"Zwężanie i zmiana długości o ok. 1,3 cm to rutyna. Przy działających dziurkach na mankiecie problem, bo dziurki to nacięcia, których nie da się zaszyć; wtedy zostaje skracanie od ramienia, drożej."},{"t":"Przyszycie guzików na rękawie","d":"Wydaje się proste, ale wielu krawców nie ma sprzętu. Jeden z autorów płaci lokalnie ok. 150 dolarów, a w Nowym Jorku 10 dolarów za guzik."},{"t":"Kołnierz i wgłębienia przy ramieniu: może","d":"Odstający kołnierz można przeciąć na nowo, ale lepiej kupić marynarkę bez tego problemu. Wgłębienia przy wszyciu rękawa krawiec poprawi za ok. 90 dolarów na rękaw, bez gwarancji."},{"t":"Guziki, klapy i poły: nie","d":"Z trzech guzików nie zrobisz dwóch, bo dziurki nie da się czysto zamknąć. Klapę w szpic czasem da się przerobić na wykładaną, odwrotnie nigdy, a zaokrąglanie pół psuje układ guzików."},{"t":"Długość i rozcięcia","d":"Marynarkę można skrócić tylko trochę, wydłużyć nie. Rozcięć z tyłu nie da się dodać, ale istniejące można zaszyć."},{"t":"Spodnie: zwykle tak","d":"Nogawki skrócisz zawsze, wydłużysz o tyle, ile jest zapasu, a z zapasu zrobisz mankiety. Zwężanie to jedna z najłatwiejszych przeróbek; w pasie zwykle jest 5-7,5 cm zapasu. Stanu nie podniesiesz."}],"conclusion":"Poznaj budowę ubrania, sprawdź zapasy w szwach i zważ, jak bardzo kochasz daną rzecz, zanim zapłacisz za przeróbkę.","factchecks":[{"claim":"Przy działających guzikach na rękawie długość rękawa trzeba ustalić z góry.","verdict":"prawda","note":"Wikipedia przy \"surgeon's cuffs\" też zaznacza, że długość rękawa musi być pewna przed wycięciem dziurek.","p":2,"src":[["Wikipedia (ang.): garnitur - hasło \"Suit\"","https://en.wikipedia.org/wiki/Suit"]]},{"claim":"Marynarki mają jedno, dwa albo zero rozcięć z tyłu.","verdict":"prawda","note":"Wikipedia opisuje trzy style: jedno rozcięcie, dwa (brytyjskie) i brak rozcięcia (włoskie).","p":6,"src":[["Wikipedia (ang.): garnitur - hasło \"Suit\"","https://en.wikipedia.org/wiki/Suit"]]},{"claim":"Klapa w szpic jest szersza i bardziej formalna niż wykładana.","verdict":"prawda","note":"Wikipedia opisuje klapę w szpic jako bardziej formalną, typową dla marynarek dwurzędowych.","p":5,"src":[["Wikipedia (ang.): klapa marynarki - hasło \"Lapel\"","https://en.wikipedia.org/wiki/Lapel"]]}],"bias":"Rzeczowy poradnik. Ceny przeróbek są z USA i podane anegdotycznie. Na końcu prowadzący reklamuje dodatki z własnego sklepu Fort Belvedere."},{"id":"TrZyuCh9df0","title_pl":"Jak szybka woda i powietrze \"przeczą\" grawitacji","title":"How fast moving water “defies” gravity","channel":"Steve Mould","url":"https://www.youtube.com/watch?v=TrZyuCh9df0","date":"2019-07-25","duration":592,"views":944304,"section":"Ciekawostki","transcript":"youtube","added":"2026-11-04","tags":["Nauka","Technika"],"about":"Tacka przyklejona do strumienia węża i styropian pod suszarką: spadek ciśnienia w rozchodzącym się płynie unosi przedmiot.","intro":"Steve Mould pokazuje tackę z pudełka hummusu, która przykleja się do silnego strumienia węża skierowanego w dół, oraz styropian zasysany pod suszarką. Tłumaczy to spadkiem gęstości i ciśnienia przy rozchodzeniu się strugi, różnicą względem atmosfery pod spodem i ostrożnie odnosi się do \"Bernoulli\" oraz do efektu blendera ręcznego.","points":[{"t":"Tacka na strumieniu","d":"Przy trybie power jet woda wychodzi małym otworem w płaskiej głowicy. Tacka z dna pudełka hummusu odbija się w górę od strumienia, ale gdy wąż skierować w dół, przykleja się do dyszy zamiast spaść szybciej."},{"t":"Suszarka i styropian","d":"Z suszarką (grzanie wyłączone) i dwiema warstwami styropianu: strumień najpierw odpycha dłoń, a przy odpowiedniej szczelinie górna płyta jest unoszona. Według autora to ten sam mechanizm co przy wodzie."},{"t":"Stałe ciśnienie vs prędkość","d":"Animacja cząstek: jeśli założyć stałe ciśnienie (stałą gęstość) przy rozchodzeniu się powietrza na zewnątrz, trzeba je spowalniać. Bez siły hamującej prędkość zostaje, a gęstość spada ku brzegom - mniej cząstek na jednostkę objętości."},{"t":"Bilans sił","d":"Pod styropianem pełne ciśnienie atmosferyczne pcha w górę; w szczelinie ciśnienie jest niższe; ciężar ciągnie w dół. Gdy różnica ciśnienia zrównoważy ciężar, płyta nie spada. Do efektu potrzeba małego jetu w płaskiej płycie, nie samego końca węża."},{"t":"Bernoulli z dystansem","d":"Autor przyznaje, że ludzie krzyczą \"Bernoulli\", ale woli wyjść od cząstek i gęstości. Zasada Bernoulliego to według niego wynik wyprowadzony z dynamiki płynów: przydatny rachunkowo, mniej intuicyjny jako pierwsze wyjaśnienie."},{"t":"Blender w wiaderderku","d":"Ręczny blender w pojemniku nieco większym niż głowica daje silne ssanie - na wadze podróżnej rząd prawie 1 kg. Łopatki działają jak śmigło i ciągną ciecz w górę; według autora to może być inny efekt, z udziałem napięcia powierzchniowego."}],"conclusion":"Struga rozchodząca się pod płytą obniża ciśnienie na tyle, by zrównoważyć ciężar - bez łamania grawitacji.","factchecks":[{"claim":"Szybki przepływ wiąże się z niższym ciśnieniem (Bernoulli).","verdict":"prawda","note":"Wzdłuż linii prądu wzrost prędkości idzie z spadkiem ciśnienia przy założeniach zasady Bernoulliego.","p":4,"src":[["Wikipedia (ang.): zasada Bernoulliego - hasło \"Bernoulli's principle\"","https://en.wikipedia.org/wiki/Bernoulli%27s_principle"]]},{"claim":"Efekt \"przyklejenia\" do dyszy to wyłącznie Bernoulli.","verdict":"półprawda","note":"Często miesza się Bernoulli, efekt Coandy i lepkość; sam slogan \"Bernoulli\" bywa nadużywany w demonstracjach.","p":3,"src":[["Wikipedia (ang.): efekt Coandy - hasło \"Coandă effect\"","https://en.wikipedia.org/wiki/Coand%C4%83_effect"],["Wikipedia (ang.): zasada Bernoulliego - hasło \"Bernoulli's principle\"","https://en.wikipedia.org/wiki/Bernoulli%27s_principle"]]},{"claim":"Do demonstracji z wężem potrzeba jetu w płaskiej tarczy.","verdict":"prawda","note":"Klasyczne zabawki i dysze \"ball levitators\" używają dyszy w szerszej powierzchni, by powstała strefa niskiego ciśnienia.","p":3,"src":[["Wikipedia (ang.): lewitacja aerodynamiczna - hasło \"Aerodynamic levitation\"","https://en.wikipedia.org/wiki/Aerodynamic_levitation"]]}],"bias":"Autor sam zaznacza niepewność wyjaśnienia. Dobra intuicja cząstkowa; sponsor Skillshare. Blender to osobna hipoteza."},{"id":"yZwfcMSDBHs","title_pl":"Jak działają wieże ciśnień w wodociągach","title":"How Water Towers Work","channel":"Practical Engineering","url":"https://www.youtube.com/watch?v=yZwfcMSDBHs","date":"2018-12-10","duration":659,"views":7417420,"section":"Ciekawostki","transcript":"youtube","added":"2026-11-04","tags":["Technika","Nauka"],"about":"Grady z Practical Engineering: wieża wodna jako magazyn wody i energii, wygładzanie szczytów zużycia i strefy ciśnienia.","intro":"Po źródle i uzdatnieniu woda musi dotrzeć do miasta równo w dzień i w nocy. Autor porównuje noszenie, kanały otwarte i rury z pompami, potem pokazuje, czemu sama pompa dopasowana do średniego zużycia nie wystarcza przy porannym szczycie nawet 5x średniej - i jak podwyższony zbiornik wygładza popyt, trzyma ciśnienie i pomaga przy pożarach oraz blackoucie.","points":[{"t":"Od źródła do kranu","d":"System wodociągowy musi działać non-stop: picie, higiena, gaszenie pożarów. Po znalezieniu i oczyszczeniu wody zostaje rozprowadzenie. Noszenie jest nieefektywne; kanały otwarte idą grawitacją, ale zanieczyszczają się, dzielą teren i nie płyną pod górę."},{"t":"Rury i pompy","d":"Zamknięte rury pozwalają pchać wodę ciśnieniem: płyn idzie od wyższego do niższego ciśnienia, jak prąd od napięcia. Pompą podnosi się ciśnienie (energię) płynu. Duże pompy miejskie są drogie."},{"t":"Szczyt vs średnia","d":"O północy popyt jest niski; rano zraszacze, prysznice i śniadanie windują zużycie. Szczyt godzinowy w dużym mieście bywa nawet 5x średniej dobowej. Same pompy musiałyby być ogromne i ciągle załączane, co je zużywa."},{"t":"Wieża jako bufor","d":"W nocy pompa pracuje pełną parą i napełnia zbiornik. Rano, gdy popyt przewyższa pompę, zabrana woda z wieży pokrywa różnicę. Po południu nadmiar znów ładuje tank; wieczorny szczyt go opróżnia. Magazyn wygładza też ujęcie i stację uzdatniania."},{"t":"Pożary i awarie","d":"Duże, nieprzewidywalne zapotrzebowanie to pożary; normy wymagają rezerwy dla straży. Podwyższony zbiornik trzyma ciśnienie także przy braku prądu, bo \"grawitacja nie spada z burzą\"."},{"t":"Magazyn energii","d":"Wieża to nie tylko litry, lecz też energia potencjalna nadana przez pompy. Przy tańszym prądzie nocnym można pompować w nocy i w dzień zasilać miasto głównie z wieży. Za niskie ciśnienie grozi zanieczyszczeniem przez nieszczelności; za wysokie psuje instalacje."},{"t":"Strefy ciśnienia","d":"Wirtualny \"ocean\" w rurach: nisko w terenie ciśnienie za duże, wysoko - za małe. Miasta dzielą sieć na strefy z własnymi wieżami. Wieżowce często mają własne pompy i zbiorniki (w Nowym Jorku bywa to wymagane). Nie każde miasto używa wież: bywa wystarczające ujęcie powyżej miasta albo same pompy."}],"conclusion":"Podwyższony zbiornik tanią grawitacją wygładza popyt, trzyma ciśnienie i zwiększa niezawodność wodociągów.","factchecks":[{"claim":"Wieże ciśnień magazynują wodę i utrzymują ciśnienie w sieci.","verdict":"prawda","note":"Podwyższony zbiornik zapewnia ciśnienie hydrostatyczne i rezerwę na szczyty oraz awarie pomp.","p":3,"src":[["Wikipedia (ang.): wieża ciśnień - hasło \"Water tower\"","https://en.wikipedia.org/wiki/Water_tower"]]},{"claim":"Szczyt godzinowy bywa nawet 5x średniego dobowego zużycia.","verdict":"prawda","note":"W inżynierii wodociągowej współczynniki szczytu godzinowego często mieszczą się w zakresie kilku krotności średniej.","p":2,"src":[["Wikipedia (ang.): zapotrzebowanie na wodę - hasło \"Water supply network\"","https://en.wikipedia.org/wiki/Water_supply_network"]]},{"claim":"Ciśnienie w sieci rośnie z \"głębokością\" pod powierzchnią hydrauliczna.","verdict":"prawda","note":"W przybliżeniu 10 m słupa wody to ok. 1 bar; wysokość zwierciadła w zbiorniku zadaje ciśnienie w strefie.","p":6,"src":[["Wikipedia (ang.): ciśnienie hydrostatyczne - hasło \"Hydrostatics\"","https://en.wikipedia.org/wiki/Hydrostatics"],["Wikipedia (ang.): wieża ciśnień - hasło \"Water tower\"","https://en.wikipedia.org/wiki/Water_tower"]]}],"bias":"Jasny, dydaktyczny Practical Engineering; bez głębokich liczb projektowych. Sponsor Bombas na końcu."},{"id":"Ruh0B5QKBMs","title_pl":"Historia syntezatorów Prophet - od Sequential Circuits do dziś","title":"The History of the Prophet Synthesizer","channel":"Alex Ball","url":"https://www.youtube.com/watch?v=Ruh0B5QKBMs","date":"2018-10-14","duration":1403,"views":961151,"section":"Technologie","transcript":"youtube","added":"2026-11-04","tags":["Syntezatory","Vintage","Sequential"],"about":"Alex Ball przechodzi linię Prophet: od Prophet-5 i MIDI przez bankructwo Sequential po powrót marki Dave'a Smitha.","intro":"Alex Ball opowiada historię syntezatorów Prophet. Dave Smith z Sequential Circuits połączył analogowe głosy z mikroprocesorem Z80 i pamięcią patchy, tworząc Prophet-5. Film prowadzi przez Prophet-10, 600 (pierwszy z fabrycznym MIDI), T8, VS, bankructwo, erę DSI i powrót nazwy Sequential.","points":[{"t":"Początki Dave'a Smitha","d":"We wczesnych latach 70. Smith kupił Minimooga Model D, zbudował sekwencer Model 600, potem cyfrowy Model 800 (1975) i programator brzmień Model 700 (1976) - wczesną pamięć patchy dla analogów."},{"t":"Prophet-5: przełom 1978","d":"Model 1000, nazwany Prophet-5 za radą Ricka Wakemana, łączył chipy SSM, Z80 i skanowanie klawiatury (licencja E-mu). Patchy zostawały po wyłączeniu - wcześniej niespotykane. Prototyp na NAMM 1978 zebrał setki zamówień."},{"t":"Rewizje i Prophet-10","d":"Rev 1 (~180 szt.), Rev 2 (>1000), Rev 3-3.3 (~5000, chipy Curtis zamiast SSM). Prophet-10 (1980) to dwa Prophet-5 Rev 3: 10 głosów i tryby normal/single/double/alternate/unison. Brad Fiedel użył go m.in. do rytmów w Terminatorze."},{"t":"MIDI i Prophet-600","d":"W 1981-83 Sequential z Rolandem buduje MIDI (Grammy techniczne dla Smitha i Kakehashiego). Prophet-600 (koniec 1982) to pierwszy syntezator z fabrycznym MIDI; hybryda Z80 + analog, dziś często z modem Gligli."},{"t":"T8, 2000, VS","d":"T8 (1983): 8 głosów, ważona klawiatura z aftertouch (<1000 szt.), pechowo obok DX7. Prophet 2000: 12-bitowy sampler. VS (1986): synteza wektorowa, joystick, 4 oscylatory cyfrowe + filtr analogowy."},{"t":"Upadek i powrót","d":"Prophet 3000 prawie nie wyszedł przed bankructwem (Yamaha kupuje Sequential). Smith wraca w 2002 jako DSI (Evolver, Prophet '08, 12, Rev2). Yamaha oddaje nazwę Sequential; Prophet-6, X; w 2018 DSI oficjalnie znów Sequential."}],"conclusion":"Prophet połączył analog i cyfrowe sterowanie, pomógł stworzyć MIDI i wrócił pod starą marką - linia wciąż kształtuje polifoniczne syntezatory.","factchecks":[{"claim":"Prophet-5 był pierwszym polifonicznym analogiem z pamięcią patchy zachowaną po wyłączeniu.","verdict":"prawda","note":"Prophet-5 (1978) wprowadził non-volatile patch memory w polifonicznym analogu i stał się wzorcem.","p":1,"src":[["Wikipedia (ang.): Prophet-5","https://en.wikipedia.org/wiki/Prophet-5"],["Wikipedia (ang.): Sequential (firma)","https://en.wikipedia.org/wiki/Sequential_(company)"]]},{"claim":"Dave Smith i Ikutaro Kakehashi dostali Technical Grammy za MIDI.","verdict":"prawda","note":"Obaj otrzymali Technical Grammy Award w 2013 za rozwój MIDI.","p":3,"src":[["Wikipedia (ang.): MIDI","https://en.wikipedia.org/wiki/MIDI"],["Wikipedia (ang.): Dave Smith (inżynier)","https://en.wikipedia.org/wiki/Dave_Smith_(engineer)"]]},{"claim":"Prophet-600 był pierwszym syntezatorom z fabrycznie zainstalowanym MIDI.","verdict":"prawda","note":"Prophet-600 (1982) jest powszechnie uznawany za pierwszy komercyjny synth z MIDI z fabryki.","p":3,"src":[["Wikipedia (ang.): Sequential (firma) - Prophet-600","https://en.wikipedia.org/wiki/Sequential_(company)"],["Wikipedia (ang.): MIDI","https://en.wikipedia.org/wiki/MIDI"]]},{"claim":"Brad Fiedel użył Prophet-10 przy ścieżce do Terminatora.","verdict":"prawda","note":"Fiedel nagrywał rytmy Terminatora m.in. na Prophet-10; wspomina problemy z mikrokasettą sekwencera.","p":2,"src":[["Wikipedia (ang.): The Terminator (soundtrack)","https://en.wikipedia.org/wiki/The_Terminator_(soundtrack)"]]}],"bias":"Pasjonacka chronologia z naciskiem na Sequential; na końcu promocja książki \"The Prophet from Silicon Valley\"."},{"id":"88X5kL7Gn5A","title_pl":"Jak rozpoznać jakościowy garnitur - 15 cech drogiego kroju","title":"How To Spot A Quality Suit - Hallmarks of Expensive Bespoke Suits For Men - Gentleman's Gazette","channel":"Gentleman's Gazette","url":"https://www.youtube.com/watch?v=88X5kL7Gn5A","date":"2017-11-17","duration":910,"views":467884,"section":"Moda","transcript":"youtube","added":"2026-11-04","tags":["Garnitur","Jakość","Krawiectwo"],"about":"Gentleman's Gazette wymienia 15 cech, po których odróżnisz drogi lub bespoke garnitur od taniego gotowca.","intro":"Sven Raphael Schneider z Gentleman's Gazette pokazuje 15 szczegółów jakości garnituru: od etykiety i zaokrąglonych rogów, przez pick stitching i ręczną pracę, po dopasowanie wzoru, dziurki, zapas tkaniny, guziki i konstrukcję barku. Osobno ma film o tanich garniturach; tu skupia się na hallmarks drogiego kroju.","points":[{"t":"Etykieta i adres","d":"Linie marki (np. Ralph Lauren Purple vs Chaps) zdradzają poziom. \"Custom/bespoke\", Savile Row czy Via Monte Napoleone sugerują droższy poziom. Brak etykiet składu w kieszeniach często oznacza prawdziwy bespoke."},{"t":"Zaokrąglone rogi i pick stitching","d":"Ręczne zaokrąglenie rogów u dołu i rękawów ogranicza strzępienie. Pick stitching kiedyś był tylko ręczny; maszyny AMF go imitują - z tyłu widać różnicę. Włoskie garnitury mają go często bardziej widocznego."},{"t":"Ręczna praca i kanwa","d":"Podszewka i wszycie rękawa ręcznie, nieregularny ścieg, elastyczniejszy ruch. Pod klapą szukaj ściegu od kanwy - daje \"roll\" klapy zamiast płaskiego prasowania. Idealnie pełna kanwa lub brak, bez kleju."},{"t":"Kołnierz i dopasowanie wzoru","d":"Jakościowy kołnierz jest wszyty ręcznie. Przy kratce, paskach czy windowpane wzór powinien się zgadzać na kieszeniach, bokach spodni i plecach; na gładkim suknie tego nie widać."},{"t":"Dziurki i zapas tkaniny","d":"Ręczne dziurki (w tym milanese z podniesioną nicią) vs fraying machine. W spodniach szukaj zapasu 2-3 cm lub więcej na szwach - tanie kroje oszczędzają materiał."},{"t":"Gürze, bark i materiały","d":"Włoskie \"grinze\" (lekkie falowanie) to efekt ręcznego dodania tkaniny. Rogowe, corozo lub masa perłowa z nierównymi otworami biją plastik. Spalla a camicia i hollywood waistband to kolejne znaki wysokiej półki."},{"t":"Monogramy i przykłady","d":"Monogramy i ukryte kieszenie sugerują custom. Autor ma na sobie vintage bespoke z lat 30.: szerokie klapy, trzy kieszenie naszywane, bez rozcięcia, herringbone."}],"conclusion":"Jeden detal nie wystarczy - szukaj zestawu: ręczna praca, kanwa, dopasowany wzór, dobre guziki i zapas tkaniny.","factchecks":[{"claim":"Pełna kanwa bez kleju to cecha lepszego garnituru.","verdict":"prawda","note":"Kanwa zszywana (full canvas) daje lepszy drape niż klejona fuzja; half-canvas to kompromis.","p":2,"src":[["Wikipedia (ang.): kanwa w krawiectwie - hasło \"Interfacing\"","https://en.wikipedia.org/wiki/Interfacing"],["Wikipedia (ang.): garnitur - hasło \"Suit (clothing)\"","https://en.wikipedia.org/wiki/Suit_(clothing)"]]},{"claim":"Savile Row i Via Monte Napoleone to adresy drogiego krawiectwa.","verdict":"prawda","note":"Savile Row w Londynie i Via Monte Napoleone w Mediolanie są znane z luksusowej odzieży męskiej.","p":0,"src":[["Wikipedia (ang.): Savile Row","https://en.wikipedia.org/wiki/Savile_Row"],["Wikipedia (ang.): Via Monte Napoleone","https://en.wikipedia.org/wiki/Via_Monte_Napoleone"]]},{"claim":"Spalla a camicia to bark zszyty jak w koszuli, typowy dla włoskiego bespoke.","verdict":"prawda","note":"Spalla camicia to technika włoska z charakterystycznym, miękkim szwem barku.","p":5,"src":[["Wikipedia (ang.): marynarka - hasło \"Jacket\"","https://en.wikipedia.org/  var u=$('ur');if(u){var r=isRead(u.getAttribute('data-id'));u.textContent=r?'Oznacz jako nieprzeczytane':'Oznacz jako przeczytane'}
 ['rup','rdn'].forEach(function(k){var b=$(k);if(b){var g=rating(b.getAttribute('data-id'));b.setAttribute('aria-pressed',String(k==='rup'?g>0:g<0))}});
}
function setRead(id,r){state[id]={r:r,t:Date.now()};lsSet(LS,state);lsSet(LSD,true);render();schedulePush()}
function setRate(id,val){var nv=rating(id)===val?0:val;rates[id]={v:nv,t:Date.now()};lsSet(RLS,rates);lsSet(RLSD,true);render();schedulePush(2000)}
// modal + historia: #v=ID
var cur=null, pushed=false, lastFocus=null;
function hashId(){var m=/^#v=([\w-]+)$/.exec(location.hash);return m&&BY[m[1]]?m[1]:null}
function openM(id){
 var v=BY[id];if(!v)return;
 if(cur!==id){$('dlg').innerHTML=body(v);$('ov').scrollTop=0}
 cur=id;$('ov').classList.add('on');$('ov').setAttribute('aria-hidden','false');document.body.classList.add('lock');
 document.title=(v.title_pl||v.title)+' - Streszczenia YouTube';
 if(!isRead(id))setRead(id,true);
 var x=$('x');if(x)x.focus({preventScroll:true});
}
function closeM(){
 if(!cur)return;var id=cur;cur=null;
 $('ov').classList.remove('on');$('ov').setAttribute('aria-hidden','true');document.body.classList.remove('lock');
 document.title='Streszczenia YouTube';
 var t=document.querySelector('.tile[data-id="'+id+'"]');if(t)t.focus({preventScroll:true});
}
function requestClose(){
 if(pushed){pushed=false;history.back()}
 else{history.replaceState(null,'',location.pathname+location.search+'#s='+sec);closeM()}
}
function hashSec(){var m=/^#s=([\w-]+)$/.exec(location.hash);return m&&SN[m[1]]?m[1]:null}
function route(){var id=hashId();if(id){openM(id);return}var k=hashSec();if(k&&k!==sec){sec=k;$('q').value='';render();window.scrollTo(0,0)}closeM()}
window.addEventListener('hashchange',route);
window.addEventListener('popstate',function(){if(!hashId())pushed=false;route()});
$('list').addEventListener('click',function(e){
 var t=e.target.closest('.tile');if(!t)return;
 if(e.metaKey||e.ctrlKey||e.shiftKey||e.button)return;
 e.preventDefault();var id=t.getAttribute('data-id');
 if(hashId()!==id){history.pushState(null,'','#v='+id);pushed=true}
 openM(id);
});
$('ov').addEventListener('click',function(e){
 if(e.target===$('ov')){requestClose();return}
 var g=e.target.closest('.bdg');if(g){var fx=$(g.getAttribute('data-fx'));var o=g.getAttribute('aria-expanded')!=='true';g.setAttribute('aria-expanded',o?'true':'false');if(fx)fx.hidden=!o;return}
 var rb=e.target.closest('.rb');if(rb){setRate(rb.getAttribute('data-id'),+rb.getAttribute('data-v'));return}
 var b=e.target.closest('.x,.ur,.tag');if(!b)return;
 if(b.classList.contains('x'))requestClose();
 else if(b.classList.contains('ur')){var id=b.getAttribute('data-id');setRead(id,!isRead(id))}
 else if(b.classList.contains('tag')){$('q').value=b.getAttribute('data-tag');requestClose();render();window.scrollTo(0,0)}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&cur){e.preventDefault();requestClose()}});
var tm;$('q').addEventListener('input',function(){clearTimeout(tm);tm=setTimeout(render,150)});
['fr','so'].forEach(function(k){$(k).addEventListener('change',render)});
$('secs').addEventListener('click',function(e){var c=e.target.closest('.chip');if(!c)return;e.preventDefault();var k=c.getAttribute('data-s');
 if(location.hash!=='#s='+k)history.pushState(null,'','#s='+k);pushed=false;sec=k;$('q').value='';render();window.scrollTo(0,0)});
function setSync(ok,msg){var s=$('sync');s.className='sync '+(ok?'ok':'off');s.textContent=msg}
function hhmm(){var d=new Date();return (d.getHours()<10?'0':'')+d.getHours()+':'+(d.getMinutes()<10?'0':'')+d.getMinutes()}
function req(url,opt,ms){
 var ctl=window.AbortController?new AbortController():null; opt=opt||{}; if(ctl)opt.signal=ctl.signal;
 var to=setTimeout(function(){if(ctl)ctl.abort()},ms||8000);
 return fetch(url,opt).then(function(r){clearTimeout(to);if(!r.ok)throw new Error('HTTP '+r.status);return r.text()})}
function pull(K){return req(API+encodeURIComponent(K||KEY)+'?_='+Date.now(),{cache:'no-store'}).then(function(t){t=(t||'').trim();if(!t)return {};var o=JSON.parse(t);if(typeof o!=='object'||!o)throw new Error('zły format');return o})}
function write(obj,K){return req(API+'update',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'key='+encodeURIComponent(K||KEY)+'&value='+encodeURIComponent(JSON.stringify(obj))}).then(function(t){var o=JSON.parse(t);if(o.status!==1)throw new Error('zapis odrzucony')})}
var busy=false, again=false, pt;
function schedulePush(ms){clearTimeout(pt);pt=setTimeout(sync,ms||600)}
function sync(){
 if(busy){again=true;return}
 busy=true;clearTimeout(pt);
 function one(K,obj,ls,lsd){return pull(K).then(function(remote){
  if(merge(obj,remote)){lsSet(ls,obj);render()}
  if(!same(obj,remote)||lsGet(lsd,false))return write(obj,K).then(function(){lsSet(lsd,false)});
 })}
 Promise.all([one(KEY,state,LS,LSD),one(RKEY,rates,RLS,RLSD)]).then(function(){setSync(true,'zsynchronizowano '+hhmm())},function(){setSync(false,'offline - zapis lokalny')})
 .then(function(){busy=false;if(again){again=false;sync()}});
}
if(hashSec())sec=hashSec();render();route();
function seed(f,obj,ls){return req(f+'?_='+Date.now(),{cache:'no-store'},5000).then(function(t){var o=JSON.parse(t||'{}');if(merge(obj,o)){lsSet(ls,obj);render()}}).catch(function(){})}
Promise.all([seed('read.json',state,LS),seed('ratings.json',rates,RLS)]).then(sync);
document.addEventListener('visibilitychange',function(){if(!document.hidden||lsGet(RLSD,false)||lsGet(LSD,false))sync()});
window.addEventListener('online',sync);
setInterval(function(){if(!document.hidden)sync()},120000);
})();
</script>
</body>
