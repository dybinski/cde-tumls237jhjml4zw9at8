ucyjną w formie \"opowieści\", bez alternatyw (kultura, uczenie się). Brak źródeł; traktuj jako ciekawostkę, nie wiedzę."},{"id":"kDfP5vAbOS0","title_pl":"Całkowicie błędne fakty, w które wszyscy wciąż wierzą","title":"Totally Wrong Facts Everyone Still Believes","url":"https://www.youtube.com/watch?v=kDfP5vAbOS0","date":"2025-04-30","duration":533,"views":2837925,"transcript":"youtube","added":"2026-11-03","tags":["Mity","Ciało i zdrowie","Nauka"],"about":"Ranking 10 popularnych \"faktów\", które według autora są mitami, od cukru i hiperaktywności po połkniętą gumę.","points":[{"t":"10. Cukier nie robi z dzieci \"tornada\"","d":"Badania ślepe nie wykazały wpływu cukru; nadpobudliwość widzą rodzice, którzy jej oczekują."},{"t":"9. Nie używamy tylko 10% mózgu","d":"Skany pokazują aktywność całego mózgu; to 2% masy ciała i ok. 20% energii."},{"t":"8. Moneta z Empire State Building nie zabije","d":"Opór powietrza ogranicza monetę do ok. 40 km/h, więc da najwyżej pstryczek."},{"t":"7. Piorun uderza w to samo miejsce","d":"Empire State Building dostaje ok. 25 uderzeń rocznie; Roy Sullivan przeżył 7."},{"t":"6. Wikingowie nie nosili hełmów z rogami","d":"Rogi wymyślili XIX-wieczni kostiumolodzy operowi; prawdziwe hełmy były proste."},{"t":"5. Golenie nie zagęszcza włosów","d":"Ścięty włos ma tępy koniec, więc wydaje się grubszy; grubość zależy od genów."},{"t":"4. Można pływać zaraz po jedzeniu","d":"Brak udokumentowanych utonięć z tego powodu; najwyżej lekki skurcz."},{"t":"3. Głowa nie traci połowy ciepła","d":"Mit z badań wojskowych, w których odsłonięta była tylko głowa; to ok. 10% powierzchni ciała."},{"t":"2. Złota rybka ma dobrą pamięć","d":"Rybki pamiętają rozwiązania labiryntów przez miesiące, uczą się sztuczek i rozróżniają muzykę."},{"t":"1. Połknięta guma nie zostaje na 7 lat","d":"Nie jest trawiona, ale przechodzi przez przewód pokarmowy w 1-2 dni, jak ziarna kukurydzy."}],"conclusion":"Większość \"oczywistych\" faktów z dzieciństwa to mity, które przetrwały, bo brzmią przekonująco albo powtarzali je rodzice.","factchecks":[{"claim":"Cukier nie powoduje nadpobudliwości u dzieci; rodzice widzą ją z powodu oczekiwań.","verdict":"prawda","note":"Metaanaliza 16 ślepych badań (JAMA 1995) nie wykazała wpływu cukru na zachowanie.","src":[["JAMA 1995, Wolraich i in. (PubMed)","https://pubmed.ncbi.nlm.nih.gov/7474248/"],["Hoover i Milich 1994, J Abnorm Child Psychol","https://link.springer.com/article/10.1007/BF02168088"]]},{"claim":"Mit 10% mózgu; mózg to 2% masy i 20% energii.","verdict":"prawda","note":"Obrazowanie pokazuje aktywność całego mózgu; dane o 2% masy i 20% energii są standardowe.","src":[["Wikipedia (ang.): mit 10% mózgu - hasło \"Ten percent of the brain myth\"","https://en.wikipedia.org/wiki/Ten_percent_of_the_brain_myth"],["Scientific American: mit 10%","https://www.scientificamerican.com/article/do-people-only-use-10-percent-of-their-brains/"]]},{"claim":"Moneta osiąga prędkość graniczną ok. 40 km/h i nie zabije.","verdict":"prawda","note":"Zmierzono ok. 40-80 km/h; moneta nie przebije czaszki.","src":[["Wikipedia (ang.): lista powszechnych mitów (moneta z wieżowca) - hasło \"List of common misconceptions\"","https://en.wikipedia.org/wiki/List_of_common_misconceptions_about_science,_technology,_and_mathematics"],["Wikipedia (ang.): prędkość graniczna - hasło \"Terminal velocity\"","https://en.wikipedia.org/wiki/Terminal_velocity"]]},{"claim":"Empire State Building: ok. 25 uderzeń pioruna rocznie; Roy Sullivan przeżył 7 uderzeń.","verdict":"prawda","note":"NOAA podaje ok. 20-25 uderzeń rocznie w Empire State Building. Sullivan jest w Księdze Guinnessa jako osoba trafiona 7 razy (1942-1977).","src":[["NOAA/NWS: mity o piorunach","https://www.weather.gov/safety/lightning-myths"],["Wikipedia (ang.): Roy Sullivan","https://en.wikipedia.org/wiki/Roy_Sullivan"]]},{"claim":"Rogate hełmy z Danii są o 3000 lat starsze od wikingów.","verdict":"fałsz","note":"Hełmy z Viksø są z ok. 900 p.n.e., czyli ok. 1700 lat przed wikingami, nie 3000.","src":[["Aarhus University: datowanie hełmów z Viksø","https://cas.au.dk/en/currently/news/show/artikel/new-study-about-the-viksoe-helmets"],["Smithsonian: hełmy mają prawie 3000 lat","https://www.smithsonianmag.com/smart-news/iconic-viking-horned-helmets-actually-3000-years-old-180979339/"]]},{"claim":"Golenie nie zmienia grubości ani tempa wzrostu włosów.","verdict":"prawda","note":"Badania od lat 20. XX w. nie wykazały wpływu golenia na włosy; Mayo Clinic potwierdza.","src":[["Mayo Clinic: golenie a odrost włosów","https://www.mayoclinic.org/healthy-lifestyle/adult-health/expert-answers/hair-removal/faq-20058427"]]},{"claim":"Pływanie zaraz po jedzeniu nie jest groźne; Czerwony Krzyż to potwierdza.","verdict":"prawda","note":"Czerwony Krzyż nie znalazł dowodów na utonięcia związane z jedzeniem przed pływaniem.","src":[["Wikipedia (ang.): lista powszechnych mitów (pływanie po jedzeniu) - hasło \"List of common misconceptions\"","https://en.wikipedia.org/wiki/List_of_common_misconceptions_about_science,_technology,_and_mathematics"]]},{"claim":"Mit 40-45% ciepła tracone przez głowę pochodzi z wojskowego podręcznika; głowa to ok. 10% powierzchni.","verdict":"prawda","note":"BMJ (2008): mit pochodzi z badań armii USA; głowa to ok. 7-10% powierzchni ciała.","src":[["BMJ 2008: świąteczne mity medyczne (DOI)","https://doi.org/10.1136/bmj.a2769"]]},{"claim":"Złote rybki pamiętają przez miesiące, uczą się sztuczek i rozróżniają muzykę.","verdict":"prawda","note":"Badania pokazują pamięć trwającą miesiące i rozróżnianie muzyki u złotych rybek.","src":[["Wikipedia (ang.): złota rybka (pamięć) - hasło \"Goldfish\"","https://en.wikipedia.org/wiki/Goldfish"],["Shinozuka i in. 2013, muzyka a złote rybki (PubMed)","https://pubmed.ncbi.nlm.nih.gov/23796771/"]]},{"claim":"Połknięta guma wychodzi w 1-2 dni, nie zostaje 7 lat.","verdict":"prawda","note":"Gastroenterolodzy potwierdzają; problemy (bezoar) zdarzają się tylko przy bardzo częstym połykaniu dużych ilości, zwłaszcza u dzieci.","src":[["Scientific American: połknięta guma","https://www.scientificamerican.com/article/fact-or-fiction-chewing-gum-takes-seven-years-to-digest/"],["Mayo Clinic: połknięta guma","https://www.mayoclinic.org/healthy-lifestyle/nutrition-and-healthy-eating/expert-answers/digestion/faq-20058446"]]}],"bias":"Rzetelny, w większości zgodny z nauką. Jedyny wyraźny błąd: wiek hełmów z Viksø. Ton prześmiewczy wobec rodziców, ale bez tendencyjności."},{"id":"wztjGaAiqME","title_pl":"Niewinne nawyki, które po cichu niszczą twoje ciało","title":"Innocent Habits That Are Secretly Wrecking Your Body","url":"https://www.youtube.com/watch?v=wztjGaAiqME","date":"2025-04-21","duration":733,"views":1492461,"transcript":"youtube","added":"2026-11-03","tags":["Ciało i zdrowie"],"about":"9 codziennych nawyków, które według autora po cichu szkodzą zdrowiu, od obgryzania paznokci po wstrzymywanie moczu.","points":[{"t":"9. Obgryzanie paznokci","d":"Bakterie spod paznokci trafiają do ust, a skórki ulegają zakażeniu (zanokcica)."},{"t":"8. Tłumienie kichnięć","d":"Kichnięcie ma pędzić ok. 160 km/h; tłumienie go może uszkodzić uszy i gardło."},{"t":"7. Patyczki do uszu","d":"Wpychają woskowinę głębiej i mogą przebić błonę bębenkową; uszy czyszczą się same."},{"t":"6. Przewodnienie","d":"Za dużo wody naraz rozrzedza sód we krwi (hiponatremia) i może zabić."},{"t":"5. Słuchawki","d":"Ponad 85 dB uszkadza słuch, a przy 100 dB wystarczy 15 minut."},{"t":"4. Lampki nocne","d":"Światło w nocy hamuje melatoninę; myszy przy przyćmionym świetle nocą tyły i miały objawy depresji."},{"t":"3. Krzesło","d":"Długie siedzenie spowalnia metabolizm; biurowiec ma siedzieć do 15 h dziennie."},{"t":"2. Spanie na brzuchu","d":"Wymusza skręt szyi i spłaszcza naturalną krzywiznę kręgosłupa, co daje ból pleców i karku."},{"t":"1. Wstrzymywanie moczu","d":"Rozciąga pęcherz, sprzyja infekcjom, a na dłuższą metę osłabia mięśnie dna miednicy."}],"conclusion":"Drobne nawyki powtarzane codziennie sumują się w realne szkody, więc warto je korygować, zanim pojawią się objawy.","factchecks":[{"claim":"Kichnięcie osiąga ok. 160 km/h.","verdict":"fałsz","note":"Pomiar szybką kamerą (2013) dał ok. 16 km/h; 160 km/h to dawne szacunki.","src":[["Tang i in. 2013, PLOS One","https://journals.plos.org/plosone/article?id=10.1371%2Fjournal.pone.0059970"]]},{"claim":"Tłumione kichnięcie może uszkodzić gardło i uszy.","verdict":"prawda","note":"Opisano m.in. pęknięcie gardła u mężczyzny, który zatkał nos i usta (BMJ Case Reports, 2018). To jednak bardzo rzadkie przypadki.","src":[["BMJ Case Reports 2018 (PubMed)","https://pubmed.ncbi.nlm.nih.gov/29335355/"]]},{"claim":"Patyczki wpychają woskowinę i mogą uszkodzić błonę bębenkową.","verdict":"prawda","note":"Zgodne z wytycznymi otolaryngologów (AAO-HNS) i analizami urazów u dzieci.","src":[["Wikipedia (ang.): patyczki higieniczne (ryzyka) - hasło \"Cotton swab\"","https://en.wikipedia.org/wiki/Cotton_swab"],["AAO-HNS: wytyczne o woskowinie","https://www.enthealth.org/conditions/earwax-cerumen/"]]},{"claim":"Zbyt dużo wody może zabić (hiponatremia).","verdict":"prawda","note":"Zatrucie wodą jest dobrze udokumentowane; przypadku 9-latki nie udało się zweryfikować.","src":[["Wikipedia (ang.): zatrucie wodne - hasło \"Water intoxication\"","https://en.wikipedia.org/wiki/Water_intoxication"]]},{"claim":"Powyżej 85 dB grozi uszkodzenie słuchu, przy 100 dB po ok. 15 minutach; nastolatki mają słuch 50-latków.","verdict":"półprawda","note":"Progi zgadzają się z normą NIOSH, ale \"słuch 50-latków\" nie ma źródła.","src":[["CDC/NIOSH: hałas w pracy a utrata słuchu","https://www.cdc.gov/niosh/noise/about/index.html"],["WHO: głuchota i utrata słuchu","https://www.who.int/news-room/fact-sheets/detail/deafness-and-hearing-loss"]]},{"claim":"Przyćmione światło nocą tuczy myszy.","verdict":"prawda","note":"Myszy przy słabym świetle nocą tyły (PNAS 2010); u ludzi są tylko korelacje.","src":[["Fonken i in. 2010, PNAS (DOI)","https://doi.org/10.1073/pnas.1008734107"]]},{"claim":"Przeciętny pracownik biurowy siedzi do 15 godzin dziennie; \"siedzenie to nowe palenie\".","verdict":"fałsz","note":"Dorośli siedzą ok. 9-10 h dziennie, a ryzyko palenia jest wielokrotnie wyższe.","src":[["Wikipedia (ang.): siedzący tryb życia - hasło \"Sedentary lifestyle\"","https://en.wikipedia.org/wiki/Sedentary_lifestyle"],["Ekelund i in. 2016, Lancet (DOI)","https://doi.org/10.1016/S0140-6736(16)30370-1"]]},{"claim":"Obgryzacze paznokci mają istotnie więcej infekcji przewodu pokarmowego.","verdict":"nie da się sprawdzić","note":"Obgryzanie przenosi bakterie, ale brak solidnych badań o częstszych infekcjach jelitowych.","src":[["Wikipedia (ang.): obgryzanie paznokci - hasło \"Nail biting\"","https://en.wikipedia.org/wiki/Nail_biting"]]},{"claim":"Częste wstrzymywanie moczu osłabia dno miednicy i prowadzi do nietrzymania.","verdict":"półprawda","note":"Okazjonalne wstrzymywanie jest bezpieczne; szkodzi tylko wieloletnie, skrajne.","src":[["Cleveland Clinic: skutki długiego wstrzymywania moczu","https://my.clevelandclinic.org/health/diseases/22208-shy-bladder-syndrome-paruresis"],["Kettering Health: jak długo można wstrzymywać mocz","https://ketteringhealth.org/how-long-should-i-hold-my-pee/"]]}],"bias":"Straszy (\"cichy zabójca\") i podaje kilka przesadzonych liczb (kichnięcie, 15 h siedzenia). Rady są w większości sensowne, ale ryzyka są wyolbrzymione."},{"id":"19UC0V9Ul2M","title_pl":"Bardzo niepokojące rzeczy, które robi twoje ciało","title":"Very CREEPY Things Your Body Does","url":"https://www.youtube.com/watch?v=19UC0V9Ul2M","date":"2025-04-07","duration":597,"views":1909931,"transcript":"youtube","added":"2026-11-03","tags":["Ciało i zdrowie","Nauka"],"about":"Ranking 10 \"przerażających\" rzeczy, które robi ludzkie ciało i mózg, od drgnięć przy zasypianiu po roztocza w rzęsach.","points":[{"t":"10. Drgnięcia przy zasypianiu","d":"Ok. 70% ludzi ma szarpnięcie przy zasypianiu; mózg bierze rozluźnienie za spadanie."},{"t":"9. Syndrom fantomowych wibracji","d":"Nawet 90% użytkowników telefonów czuje nieistniejące wibracje; mózg \"dopowiada\" sygnał."},{"t":"8. Pasożyty sterujące","d":"Toxoplasma jest w mózgu ok. 30% ludzi; u myszy znosi strach przed kotami, u ludzi ma zmieniać zachowanie."},{"t":"7. Paraliż senny","d":"Umysł budzi się, gdy ciało jest jeszcze sparaliżowane fazą REM; pojawiają się halucynacje i ucisk."},{"t":"6. Kichanie od światła","d":"U części ludzi jasne światło wywołuje kichanie przez \"skrzyżowanie\" sygnałów nerwów; cecha dziedziczna."},{"t":"5. Drugi mózg w jelitach","d":"Ok. 500 mln neuronów w jelitach i 90% serotoniny; jelita mają wpływać na nastrój."},{"t":"4. Mózg zjada sam siebie","d":"Autofagia: komórki rozkładają własne części; w neuronach głodu wzmacnia to uczucie głodu."},{"t":"3. Zespół Capgrasa","d":"Urojenie, że bliską osobę zastąpił sobowtór; twarz jest rozpoznana, ale bez emocji."},{"t":"2. Jamais vu","d":"Odwrotność déjà vu: znane rzeczy nagle wydają się obce; można to wywołać, pisząc to samo słowo wiele razy."},{"t":"1. Roztocza w rzęsach","d":"Nużeńce żyją w mieszkach włosowych twarzy, w nocy się rozmnażają; z wiekiem ma je prawie każdy."}],"conclusion":"Ciało i mózg robią mnóstwo dziwnych rzeczy bez naszej wiedzy, a wiele z nich to ślady dawnej ewolucji.","factchecks":[{"claim":"Drgnięcia przy zasypianiu ma ok. 70% ludzi; to pozostałość po spaniu na drzewach.","verdict":"półprawda","note":"Częstość 60-70% jest podawana w literaturze, ale wyjaśnienie z drzewami to tylko hipoteza.","src":[["Wikipedia (ang.): drgawki hipnagogiczne - hasło \"Hypnic jerk\"","https://en.wikipedia.org/wiki/Hypnic_jerk"]]},{"claim":"Fantomowe wibracje zgłasza do 90% użytkowników.","verdict":"prawda","note":"W badaniu Drouin i in. (2012) 89% studentów zgłosiło fantomowe wibracje. Inne badania dają niższe wartości, więc \"do 90%\" to górna granica.","src":[["Drouin i in. 2012 (DOI)","https://doi.org/10.1016/j.chb.2012.03.013"],["Wikipedia (ang.): syndrom fantomowych wibracji - hasło \"Phantom vibration syndrome\"","https://en.wikipedia.org/wiki/Phantom_vibration_syndrome"]]},{"claim":"Toxoplasma jest u ok. 30% ludzi i zmienia osobowość oraz zwiększa ryzyko wypadków.","verdict":"przesada","note":"Zarażenie ok. 30% ludzi i efekt u myszy są potwierdzone; u ludzi są tylko korelacje, film podaje je jak pewnik.","src":[["Wikipedia (ang.): toksoplazmoza - hasło \"Toxoplasmosis\"","https://en.wikipedia.org/wiki/Toxoplasmosis"],["CDC: toksoplazmoza","https://www.cdc.gov/toxoplasmosis/about/index.html"]]},{"claim":"Paraliż senny: świadomość przy zablokowanych mięśniach REM, halucynacje postaci, ucisk w klatce.","verdict":"prawda","note":"Opis kliniczny się zgadza; doświadcza go ok. 8% ludzi przynajmniej raz, nie \"co noc\".","src":[["Wikipedia (ang.): paraliż senny - hasło \"Sleep paralysis\"","https://en.wikipedia.org/wiki/Sleep_paralysis"],["Sharpless i Barber 2011 (PubMed)","https://pubmed.ncbi.nlm.nih.gov/21571556/"]]},{"claim":"Kichanie od światła jest dziedziczne.","verdict":"prawda","note":"Dotyczy ok. 18-35% ludzi i jest dziedziczny; mechanizm nerwowy to wiodąca hipoteza.","src":[["Wikipedia (ang.): odruch kichania na światło - hasło \"Photic sneeze reflex\"","https://en.wikipedia.org/wiki/Photic_sneeze_reflex"]]},{"claim":"W jelitach jest ok. 500 mln neuronów, więcej niż w mózgu kota.","verdict":"półprawda","note":"Szacunki to 100-600 mln neuronów; cały mózg kota ma ich więcej, więc porównanie jest mylące.","src":[["Stanford: drugi mózg w jelitach","https://neuroscience.stanford.edu/news/your-gut-second-brain"],["Liczba neuronów w jelitowym układzie nerwowym (PubMed)","https://pubmed.ncbi.nlm.nih.gov/35929768/"]]},{"claim":"Jelita produkują 90% serotoniny, co steruje nastrojem.","verdict":"przesada","note":"Ok. 90% serotoniny powstaje w jelitach, ale nie trafia do mózgu; \"sterowanie nastrojem\" to uproszczenie.","src":[["Wikipedia (ang.): serotonina - hasło \"Serotonin\"","https://en.wikipedia.org/wiki/Serotonin"],["Caltech: bakterie a serotonina jelit","https://www.caltech.edu/about/news/microbes-help-produce-serotonin-gut-46495"]]},{"claim":"Autofagia w neuronach głodu wzmacnia uczucie głodu.","verdict":"prawda","note":"Autofagia w neuronach reguluje głód (badanie na myszach, 2011); \"mózg zjada sam siebie\" to dramatyzacja.","src":[["Kaushik i in. 2011 (PubMed)","https://pubmed.ncbi.nlm.nih.gov/21803288/"],["Wikipedia (ang.): autofagia - hasło \"Autophagy\"","https://en.wikipedia.org/wiki/Autophagy"]]},{"claim":"Zespół Capgrasa i jamais vu (wywoływane wielokrotnym pisaniem słowa).","verdict":"prawda","note":"Capgras to opisane urojenie, a jamais vu wywoływano przepisywaniem słowa (Moulin, Ig Nobel 2023).","src":[["Wikipedia (ang.): zespół Capgrasa - hasło \"Capgras delusion\"","https://en.wikipedia.org/wiki/Capgras_delusion"],["Wikipedia (ang.): jamais vu","https://en.wikipedia.org/wiki/Jamais_vu"]]},{"claim":"Nużeńce nie mają odbytu i uwalniają odchody po śmierci.","verdict":"fałsz","note":"Badanie genomu z 2022 r. wykazało, że nużeńce mają odbyt; reszta opisu się zgadza.","src":[["University of Reading: sekretne życie roztoczy","https://www.reading.ac.uk/news/2022/Research-News/Secret-lives-of-skin-mites-in-our-faces"],["Smith i in. 2022, Molecular Biology and Evolution","https://doi.org/10.1093/molbev/msac125"]]}],"bias":"Sensacyjny język (\"mózg zjada sam siebie\"); korelacje podane jak pewniki, a mit o nużeńcach jest już obalony."},{"id":"2sWFexuc7MI","title_pl":"Miejsca na Ziemi, gdzie nie stanął żaden człowiek","title":"Places on Earth No Human Has Ever Visited","url":"https://www.youtube.com/watch?v=2sWFexuc7MI","date":"2024-12-26","duration":600,"views":1223643,"transcript":"whisper","added":"2026-11-03","tags":["Natura","Geografia"],"about":"Ranking 10 miejsc na Ziemi, których według autora nigdy nie odwiedził żaden człowiek lub które są prawie niezbadane.","points":[{"t":"10. Gangkhar Puensum (Bhutan)","d":"Najwyższa niezdobyta góra (ok. 7570 m); Bhutan zakazał wspinaczki z szacunku dla duchów gór."},{"t":"9. Jaskinia Kryształów (Meksyk)","d":"Kryształy wielkości autobusów, 58°C i prawie 100% wilgotności; wejścia na ok. 10 minut."},{"t":"8. Podwodne jaskinie Jukatanu","d":"Tysiące połączonych cenotów, w większości niezbadanych; dla Majów wrota do podziemi."},{"t":"7. Góry Gwiezdne (Papua-Nowa Gwinea)","d":"Wapienne urwiska w dżungli, deszcz i pijawki; Ściana Hindenburga ma być niezdobyta."},{"t":"6. Rów Nowych Hebrydów","d":"Rów między Vanuatu a Nową Kaledonią, ok. 7200 m głębokości; badały go tylko roboty."},{"t":"5. Tsingy de Bemaraha (Madagaskar)","d":"\"Kamienny las\" ostrych wapiennych iglic wysokości 5 pięter; wnętrze ma być nietknięte."},{"t":"4. Serce pustyni Namib","d":"Morze wydm wyższych od Empire State Building, wielkości Maryland; wnętrza nikt nie odwiedził."},{"t":"3. Sandy Island","d":"Wyspa z map między Australią a Nową Kaledonią, której nie znaleźli naukowcy w 2012 r."},{"t":"2. Północna Grenlandia","d":"Lądolód pokrywa ok. 80% wyspy i ma ponad 1,6 km grubości; pod lodem mogą być nieznane jeziora i życie."},{"t":"1. Pustynia Takla Makan (Chiny)","d":"\"Pustynia śmierci\" większa od Wielkiej Brytanii; pod piaskiem mają być zaginione miasta."}],"conclusion":"Mimo satelitów i GPS wciąż są miejsca, do których człowiek nie dotarł, głównie przez zakazy, ekstremalne warunki albo zwykłe trudności w dojściu.","factchecks":[{"claim":"Gangkhar Puensum to najwyższa niezdobyta góra; wspinaczka zakazana, a wyprawy nie mogły jej znaleźć.","verdict":"prawda","note":"Szczyt ma 7570 m, a wspinaczka jest zakazana od 2003 r.; wyprawy z lat 80. się nie powiodły.","src":[["Wikipedia (ang.): Gangkhar Puensum","https://en.wikipedia.org/wiki/Gangkhar_Puensum"]]},{"claim":"Jaskinia Kryształów: 58°C, prawie 100% wilgotności, toksyczne powietrze, wizyty ok. 10 minut.","verdict":"półprawda","note":"Upał, wilgotność i mikroby się zgadzają; głównym zagrożeniem jest upał, nie toksyczne gazy.","src":[["Wikipedia (ang.): Jaskinia Kryształów (Naica) - hasło \"Cave of the Crystals\"","https://en.wikipedia.org/wiki/Cave_of_the_Crystals"],["National Geographic: mikroby z Naica","https://www.nationalgeographic.com/science/article/crystal-caves-mine-microbes-mexico-boston-aaas-aliens-science"]]},{"claim":"Cenoty Jukatanu: tysiące połączonych jaskiń, ślepe ryby, ofiary Majów.","verdict":"prawda","note":"Sac Actun ma ponad 370 km korytarzy, ale to popularne miejsce nurkowe, a nie \"nieodwiedzone\".","src":[["Wikipedia (ang.): system jaskiń Sac Actun - hasło \"Sistema Sac Actun\"","https://en.wikipedia.org/wiki/Sistema_Sac_Actun"],["Wikipedia (ang.): cenoty - hasło \"Cenote\"","https://en.wikipedia.org/wiki/Cenote"]]},{"claim":"W Góry Gwiezdne nigdy nie wszedł żaden człowiek.","verdict":"fałsz","note":"Mieszkają tam ludy Min, działa kopalnia Ok Tedi i miasto Tabubil.","src":[["Wikipedia (ang.): Góry Gwiezdne - hasło \"Star Mountains\"","https://en.wikipedia.org/wiki/Star_Mountains"],["Wikipedia (ang.): kopalnia Ok Tedi - hasło \"Ok Tedi Mine\"","https://en.wikipedia.org/wiki/Ok_Tedi_Mine"]]},{"claim":"Rów Nowych Hebrydów: Everest by się w nim zmieścił; nikt tam nie był, były tylko roboty.","verdict":"fałsz","note":"Rów ma ok. 7,8 km, a Everest 8,85 km, więc szczyt by wystawał; na dno zszedł Victor Vescovo w 2021 r.","src":[["Wikipedia (ang.): Rów Nowych Hebrydów - hasło \"New Hebrides Trench\"","https://en.wikipedia.org/wiki/New_Hebrides_Trench"],["Guinness: najwięcej odwiedzonych rowów","https://www.guinnessworldrecords.com/world-records/752796-most-deep-sea-trenches-visited-by-an-individual"]]},{"claim":"Tsingy: nazwa znaczy \"gdzie nie można chodzić boso\"; wnętrze nietknięte.","verdict":"półprawda","note":"Tłumaczenie nazwy się zgadza, ale park ma szlaki dla turystów i jest badany.","src":[["Wikipedia (ang.): Tsingy de Bemaraha","https://en.wikipedia.org/wiki/Tsingy_de_Bemaraha_Strict_Nature_Reserve"],["UNESCO: suche lasy Andrefana (dawniej Tsingy de Bemaraha)","https://whc.unesco.org/en/list/494/"]]},{"claim":"Namib: wydmy wyższe od Empire State Building, obszar wielkości Maryland, wnętrza nigdy nie odwiedzono.","verdict":"przesada","note":"Wielkość i wydmy (do ok. 380 m) się zgadzają, ale okolice Sossusvlei to masowa turystyka.","src":[["UNESCO: Morze Piasku Namib","https://whc.unesco.org/en/list/1430/"],["Wikipedia (ang.): pustynia Namib - hasło \"Namib\"","https://en.wikipedia.org/wiki/Namib"]]},{"claim":"Sandy Island: \"odkrytą\" przez Jamesa Cooka wyspę obalili Australijczycy w 2012.","verdict":"półprawda","note":"W 2012 r. potwierdzono, że wyspy nie ma, ale pierwszy zapis jest z 1876 r., nie od Cooka.","src":[["Wikipedia (ang.): Sandy Island (Nowa Kaledonia) - hasło \"Sandy Island (New Caledonia)\"","https://en.wikipedia.org/wiki/Sandy_Island,_New_Caledonia"]]},{"claim":"Lądolód pokrywa ok. 80% Grenlandii, a wnętrze północnej Grenlandii jest nietknięte przez człowieka.","verdict":"półprawda","note":"Lądolód pokrywa ok. 80% wyspy, ale w głębi działały stacje wiertnicze i wiele razy go przekraczano.","src":[["Wikipedia (ang.): lądolód grenlandzki - hasło \"Greenland ice sheet\"","https://en.wikipedia.org/wiki/Greenland_ice_sheet"],["Wikipedia (ang.): odwiert lodowy NorthGRIP - hasło \"NorthGRIP\"","https://en.wikipedia.org/wiki/North_Greenland_Ice_Core_Project"]]},{"claim":"Takla Makan: większa od Wielkiej Brytanii, w środku nie było człowieka, nazwa znaczy \"miejsce bez powrotu\".","verdict":"fałsz","note":"Jest większa od Wielkiej Brytanii, ale biegnie przez nią autostrada, a pogrzebane miasta odkopano 100 lat temu.","src":[["Wikipedia (ang.): pustynia Takla Makan - hasło \"Taklamakan Desert\"","https://en.wikipedia.org/wiki/Taklamakan_Desert"],["Wikipedia (ang.): autostrada przez pustynię Tarym - hasło \"Tarim Desert Highway\"","https://en.wikipedia.org/wiki/Tarim_Desert_Highway"]]}],"bias":"Tytuł wprowadza w błąd: większość miejsc była odwiedzana; uczciwiej byłoby \"miejsca słabo zbadane\". Transkrypt z Whisper."},{"id":"7bOQ7fLCqgI","title_pl":"9 części ciała, które kiedyś znikną","title":"9 Body Parts That Will Disappear One Day","url":"https://www.youtube.com/watch?v=7bOQ7fLCqgI","date":"2024-04-27","duration":528,"views":1188491,"transcript":"youtube","added":"2026-11-03","tags":["Ciało i zdrowie","Ewolucja"],"about":"9 szczątkowych części ciała, które według autora mogą kiedyś zniknąć w wyniku ewolucji.","points":[{"t":"9. Wyrostek robaczkowy","d":"Pozostałość po trawieniu roślin, która może się zapalić; ma się coraz częściej nie wykształcać."},{"t":"8. Palce u stóp","d":"Przodkowie chwytali nimi gałęzie; dziś służą głównie do równowagi, a mały palec jest coraz mniej potrzebny."},{"t":"7. Narząd Jacobsona","d":"Narząd lemieszowo-nosowy do wyczuwania feromonów, u ludzi prawdopodobnie nieczynny."},{"t":"6. Mięśnie przywłosowe","d":"Dają gęsią skórkę; u zwierząt z futrem stroszą sierść, u nas prawie nic nie dają."},{"t":"5. Kość ogonowa","d":"Pozostałość ogona; w zarodku człowieka jest zawiązek ogona."},{"t":"4. Mięsień dłoniowy długi","d":"Nie ma go część ludzi i nie wpływa to na siłę chwytu; chirurdzy używają go do przeszczepów."},{"t":"3. Zęby mądrości","d":"Szczęka zmalała, gdy zaczęliśmy gotować, więc zęby nie mają miejsca; u części ludzi w ogóle się nie rozwijają."},{"t":"2. Mięśnie uszu","d":"Zwierzęta ruszają uszami, u ludzi te mięśnie to pozostałość; nieliczni umieją poruszać uszami."},{"t":"1. Zatoki","d":"Nie wiadomo, po co są; mogą odciążać czaszkę lub ogrzewać powietrze. Mają powoli zanikać."}],"conclusion":"Ciało nosi ślady ewolucji, a niektóre z tych części mogą zniknąć, ale zajmie to tysiące lat.","factchecks":[{"claim":"Wyrostek robaczkowy jest bezużyteczny.","verdict":"półprawda","note":"Nowsze badania wskazują na rolę odpornościową wyrostka, co przeczy prostej tezie o szczątkowości.","src":[["Wikipedia (ang.): wyrostek robaczkowy - hasło \"Appendix (anatomy)\"","https://en.wikipedia.org/wiki/Appendix_(anatomy)"],["Smith i in. 2023, Anat Rec: przegląd funkcji i ewolucji wyrostka (PubMed)","https://pubmed.ncbi.nlm.nih.gov/35363436/"],["Smith i in. 2009, J Evol Biol (PubMed)","https://pubmed.ncbi.nlm.nih.gov/19678866/"]]},{"claim":"Coraz więcej ludzi rodzi się bez wyrostka (nawet 1 na 5).","verdict":"fałsz","note":"Wrodzony brak wyrostka to skrajna rzadkość, szacowana na ok. 1 na 100 000 operacji brzucha.","src":[["Opis przypadku agenezji wyrostka (PMC)","https://pmc.ncbi.nlm.nih.gov/articles/PMC8043782/"]]},{"claim":"Część ludzi nie ma mięśnia dłoniowego długiego.","verdict":"prawda","note":"Brak występuje u ok. 10-15% ludzi, z dużymi różnicami między populacjami.","src":[["Wikipedia (ang.): mięsień dłoniowy długi - hasło \"Palmaris longus\"","https://en.wikipedia.org/wiki/Palmaris_longus_muscle"]]},{"claim":"U części ludzi zęby mądrości się nie rozwijają.","verdict":"prawda","note":"Metaanaliza Cartera i Worthingtona (2015) daje ok. 22% osób z brakiem co najmniej jednego zęba mądrości.","src":[["Carter i Worthington 2015, J Dent Res (DOI)","https://doi.org/10.1177/0022034515581644"],["Wikipedia (ang.): zęby mądrości - hasło \"Wisdom tooth\"","https://en.wikipedia.org/wiki/Wisdom_tooth"]]},{"claim":"Narząd Jacobsona, kość ogonowa, mięśnie przywłosowe i uszne to struktury szczątkowe.","verdict":"prawda","note":"Standardowe przykłady w biologii. Narząd lemieszowo-nosowy u dorosłych ludzi nie ma działających połączeń nerwowych.","src":[["Wikipedia (ang.): narządy szczątkowe u człowieka - hasło \"Human vestigiality\"","https://en.wikipedia.org/wiki/Human_vestigiality"],["Wikipedia (ang.): narząd lemieszowo-nosowy (Jacobsona) - hasło \"Vomeronasal organ\"","https://en.wikipedia.org/wiki/Vomeronasal_organ"]]},{"claim":"Te części ciała \"znikną kiedyś\".","verdict":"nie da się sprawdzić","note":"Ewolucja nie usuwa zbędnych części sama; potrzebna jest presja selekcyjna, więc to spekulacja.","src":[["Wikipedia (ang.): szczątkowość narządów - hasło \"Vestigiality\"","https://en.wikipedia.org/wiki/Vestigiality"]]}],"bias":"Uproszczona wizja ewolucji jako \"usuwania zbędnych części\". Jedna liczba (brak wyrostka) jest wyssana z palca, a wyrostek opisany według przestarzałej wiedzy."},{"id":"UTz2Xg4oMxs","title_pl":"9 najbardziej bolesnych rzeczy, jakich można doświadczyć","title":"9 MOST PAINFUL Things You Can EVER Experience!","url":"https://www.youtube.com/watch?v=UTz2Xg4oMxs","date":"2024-04-07","duration":548,"views":1114282,"transcript":"youtube","added":"2026-11-03","tags":["Ciało i zdrowie","Natura"],"about":"Ranking 9 najbardziej bolesnych doświadczeń, od kamieni nerkowych po użądlenie mrówki-pocisku.","points":[{"t":"9. Kamień nerkowy","d":"Kryształ przeciskający się przez wąski moczowód; ból porównywany do porodu."},{"t":"8. Meduza Irukandji","d":"Malutka meduza z Australii; użądlenie daje silny ból, wymioty i skoki ciśnienia."},{"t":"7. Tężec","d":"Toksyna bakterii z ziemi daje bolesne skurcze mięśni i szczękościsk; stąd szczepienia."},{"t":"6. Klasterowe bóle głowy","d":"Ból wokół oka, nazywany \"samobójczym\", w seriach trwających tygodnie."},{"t":"5. Ryba kamień (skorpena)","d":"Najbardziej jadowita ryba świata, wtapia się w dno; nadepnięcie wbija kolce z jadem, ból trwa godzinami."},{"t":"4. Fibromialgia","d":"Przewlekły ból całego ciała i zmęczenie bez znanej przyczyny i lekarstwa."},{"t":"3. Gympie-gympie","d":"Australijska roślina, której włoski wstrzykują toksynę; ból może wracać miesiącami."},{"t":"2. Osa \"Kat\" (executioner wasp)","d":"Duża osa z Ameryki Środkowej; autor mówi o rozmiarze małego ptaka i silnym jadzie."},{"t":"1. Mrówka-pocisk","d":"Ból jak od postrzału, nawet do 24 h. Plemię w Brazylii wkłada młodym rękawice z mrówkami na 10 minut, 20 razy."}],"conclusion":"Natura i własne ciało potrafią zadać ból wykraczający poza wyobrażenie, a najgorsze w rankingu są użądlenia owadów.","factchecks":[{"claim":"Osa Polistes carnifex ma jad z poneratoksyną, jest wielkości małego ptaka i składa jaja w innych owadach.","verdict":"fałsz","note":"Poneratoksyna to toksyna mrówki-pocisku; ta osa ma do ok. 3,3 cm i nie pasożytuje.","s function hhmm(){var d=new Date();return (d.getHours()<10?'0':'')+d.getHours()+':'+(d.getMinutes()<10?'0':'')+d.getMinutes()}
function req(url,opt,ms){
 var ctl=window.AbortController?new AbortController():null; opt=opt||{}; if(ctl)opt.signal=ctl.signal;
 var to=setTimeout(function(){if(ctl)ctl.abort()},ms||8000);
 return fetch(url,opt).then(function(r){clearTimeout(to);if(!r.ok)throw new Error('HTTP '+r.status);return r.text()})}
function pull(){return req(API+encodeURIComponent(KEY)+'?_='+Date.now(),{cache:'no-store'}).then(function(t){t=(t||'').trim();if(!t)return {};var o=JSON.parse(t);if(typeof o!=='object'||!o)throw new Error('zły format');return o})}
function write(obj){return req(API+'update',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'key='+encodeURIComponent(KEY)+'&value='+encodeURIComponent(JSON.stringify(obj))}).then(function(t){var o=JSON.parse(t);if(o.status!==1)throw new Error('zapis odrzucony')})}
var busy=false, again=false, pt;
function schedulePush(){clearTimeout(pt);pt=setTimeout(sync,600)}
function sync(){
 if(busy){again=true;return}
 busy=true;
 pull().then(function(remote){
  if(merge(state,remote)){lsSet(LS,state);render()}
  if(!same(state,remote)||lsGet(LSD,false))return write(state).then(function(){lsSet(LSD,false)});
 }).then(function(){setSync(true,'zsynchronizowano '+hhmm())},function(){setSync(false,'offline - zapis lokalny')})
 .then(function(){busy=false;if(again){again=false;sync()}});
}
render();
req('read.json?_='+Date.now(),{cache:'no-store'},5000).then(function(t){var o=JSON.parse(t||'{}');if(merge(state,o)){lsSet(LS,state);render()}}).catch(function(){}).then(sync);
document.addEventListener('visibilitychange',function(){if(!document.hidden)sync()});
window.addEventListener('online',sync);
setInterval(function(){if(!document.hidden)sync()},120000);
})();
</script>
</body>
