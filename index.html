w; uproszczenia historyczne pod narrację \"niewidzialnych wynalazków\"."},{"id":"cDIJDFlNkfY","title_pl":"Prof. Rafał Szabla: jak powstało życie na Ziemi i czy jest gdzie indziej","title":"Kosmos tętni życiem. Jak powstało życie na Ziemi? II prof. Rafał Szabla","channel":"didaskalia","url":"https://www.youtube.com/watch?v=cDIJDFlNkfY","date":"2026-07-12","duration":5764,"views":467840,"section":"Didaskalia","transcript":"youtube","added":"2026-11-03","tags":["Nauka","Kosmos","Chemia"],"about":"Chemik teoretyk o tym, z jakich cegiełek i w jakich warunkach mogło powstać życie, i gdzie w kosmosie warto go szukać.","intro":"Patrycjusz Wyżga rozmawia z prof. Rafałem Szablą, chemikiem teoretykiem badającym chemię początków życia. Od dysku protoplanetarnego i roli wody, przez organikę z komet, ostatniego wspólnego przodka i świat RNA, po fosfinę na Wenus, życie w kwasie siarkowym, fotosyntezę, tlen i paradoks Fermiego.","points":[{"t":"Przepis zapisany w dysku","d":"Skład planet przesądza pierwsze ok. 10 mln lat, gdy wokół młodej gwiazdy krąży dysk protoplanetarny. To, jak rozłożą się w nim związki chemiczne, decyduje, co potem znajdzie się na planetach. Ziemia trafiła w dobry punkt."},{"t":"Dlaczego woda","d":"Cząsteczka wody jest polarna, z lekko ujemnym i lekko dodatnim końcem. Dzięki temu jest świetnym rozpuszczalnikiem i pozwala na wielką różnorodność reakcji w protokomórkach."},{"t":"Cegiełki z kosmosu","d":"W kometach i meteorytach znaleziono m.in. aminokwasy i proste cukry. Organika mogła trafić na Ziemię w okresie bombardowania, po uformowaniu się skalistej planety."},{"t":"Wiele kałuż, nie jedna","d":"Ok. 3,8 mld lat temu warunki mogły sprzyjać powstaniu życia na dużej części planety. Samo przejście od chemii do protokomórki trwało zapewne krótko w skali wieku Ziemi, może ok. miliona lat."},{"t":"LUCA i świat RNA","d":"Ostatni wspólny przodek (LUCA) był już złożony. Bez enzymów skutecznie kopiuje się tylko RNA, co pokazują m.in. badania laboratorium Jacka Szostaka. Dlatego RNA uważa się za kandydata na pierwszą cząsteczkę życia."},{"t":"Mars: nie wiemy","d":"Mars leży na granicy strefy zamieszkiwalnej i ma wodę. Życia tam nie znaleziono, ale nie da się wykluczyć, że istnieje. Nigdy jeszcze nie przywieziono na Ziemię próbek pobranych na Marsie."},{"t":"Fosfina na Wenus","d":"W 2020 r. ogłoszono wykrycie w chmurach Wenus fosfiny (PH3), na Ziemi gazu pochodzenia biologicznego. Gość jest sceptyczny co do życia w chmurach kwasu siarkowego, choć nie da się go dziś wykluczyć."},{"t":"Cyjanowodór i UV","d":"W wielu dyskach protoplanetarnych jest dużo HCN, trującego dla nas, ale cennego w prebiotycznej chemii. Promieniowanie UV mogło selekcjonować najtrwalsze cegiełki życia. Gość współtworzył o tym pracę w Nature z zespołem Johna Sutherlanda."},{"t":"Tlen zmienił wszystko","d":"Fotosynteza tlenowa była szokiem dla wcześniejszych organizmów beztlenowych. Oddychanie tlenem daje dużo więcej energii, więc atmosfera tlenowa jest prawdopodobnie potrzebna do złożonych organizmów i łańcuchów pokarmowych."},{"t":"Gdzie szukać i paradoks Fermiego","d":"Dobre kandydatki to skaliste planety od rozmiaru Ziemi po superziemie oraz skaliste księżyce gazowych olbrzymów. Teleskop Webba szuka biosygnatur w atmosferach. Brak kontaktu może wynikać z tego, że cywilizacje trwają krótko."}],"conclusion":"Rzetelna, ostrożna rozmowa o granicach wiedzy. Gość jasno oddziela ustalenia od własnych przypuszczeń.","factchecks":[{"claim":"W chmurach Wenus wykryto fosfinę.","verdict":"półprawda","note":"Ogłoszono to w 2020 r., ale wynik zakwestionowano i do dziś jest sporny. W filmie pada też zastrzeżenie, że to niepewne.","p":6,"src":[["Wikipedia (ang.): Życie na Wenus - hasło \"Life on Venus\"","https://en.wikipedia.org/wiki/Life_on_Venus"]]},{"claim":"Nigdy nie badaliśmy na Ziemi próbek z Marsa.","verdict":"półprawda","note":"Nie przywieziono próbek pobranych na Marsie, ale badamy ponad 270 meteorytów marsjańskich.","p":5,"src":[["Wikipedia (ang.): Meteoryt marsjański - hasło \"Martian meteorite\"","https://en.wikipedia.org/wiki/Martian_meteorite"]]},{"claim":"Badaliśmy próbki z komet.","verdict":"prawda","note":"Sonda Stardust dostarczyła na Ziemię w 2006 r. pył z komety Wild 2.","p":2,"src":[["Wikipedia (ang.): Stardust - hasło \"Stardust (spacecraft)\"","https://en.wikipedia.org/wiki/Stardust_(spacecraft)"]]}],"bias":"Ostrożny przekaz naukowy. Teza o krótkim trwaniu cywilizacji i liczbach planet podobnych do Ziemi to spekulacje rozmówców."},{"id":"NxQU8EmHxiw","title_pl":"Luki w historii, których wciąż nie rozumiemy","title":"Hidden Gaps In History We Still Don’t Understand","url":"https://www.youtube.com/watch?v=NxQU8EmHxiw","date":"2026-07-10","duration":811,"views":1066775,"transcript":"youtube","added":"2026-11-03","tags":["Historia"],"about":"10 luk w historii, których według autora wciąż nie rozumiemy, od roku 536 po Sumeryjską listę królów.","intro":"Ranking 10 historycznych zagadek, których według autora wciąż nie umiemy wyjaśnić. Od roku 536, gdy mgła zasłoniła słońce, przez jezioro pełne szkieletów w Himalajach, upadek epoki brązu, rzymskie dwunastościany i miedziany zwój ze skarbami, po zamknięte japońskie grobowce, wymarłą roślinę sylfion, zaginione miasto Akad, koniec Normanów na Grenlandii i niemożliwe liczby z sumeryjskiej listy królów.","points":[{"t":"10. Najgorszy rok w historii (536)","d":"W 536 r. gęsta mgła zasłoniła słońce na 18 miesięcy, a temperatura na półkuli północnej spadła o 2,5°C; plony padły, w Chinach latem spadł śnieg. Rdzenie lodowe z Grenlandii i Antarktydy pokazują popiół wulkaniczny, ale nie wiadomo, który wulkan. W 541 r. przyszła dżuma Justyniana."},{"t":"9. Jezioro Szkieletów (Roopkund)","d":"Jezioro Roopkund na ok. 4900 m, latem z lodu wypływają kości. Odkrył je brytyjski strażnik w 1942 r. Szkielety ok. 500 osób mają takie same okrągłe pęknięcia czaszki od uderzenia z góry, więc teoria to grad wielkości piłek do krykieta. DNA pokazało dwie grupy: z Azji Południowej (ok. 800 r.) i śródziemnomorską (ok. 1800 r.)."},{"t":"8. Upadek epoki brązu","d":"Ok. 1200 r. p.n.e. w ciągu kilkudziesięciu lat upadli Mykeńczycy i Hetyci, a Egipt ledwo przetrwał; ludność Grecji spadła o ok. 75%. Trzęsienia ziemi, susza, Ludy Morza i choroby osobno nie wystarczają. Najlepsza teoria według autora to zerwanie łańcuchów dostaw (miedź z Cypru, zboże z Egiptu, drewno z Libanu)."},{"t":"7. Rzymski dwunastościan","d":"W Europie znaleziono ponad 100 pustych brązowych obiektów o 12 pięciokątnych ściankach z otworami od piłki golfowej do grejpfruta, często zakopanych z monetami. Żaden rzymski tekst, obraz ani rzeźba ich nie pokazuje. Teorie: świeczniki, przyrządy miernicze, kości do gry, narzędzia do dziergania rękawiczek."},{"t":"6. Miedziany Zwój","d":"W 1952 r. w jaskiniach nad Morzem Martwym znaleziono zwój z miedzi z listą 64 miejsc, gdzie miało być zakopane ok. 65 ton złota i srebra, dziś ponad 1 mld dolarów. Wskazówki odnoszą się do nieistniejących punktów. Może to spis skarbów świątyni ukrytych przed zburzeniem Jerozolimy w 70 r., może symbol albo żart; nic nie znaleziono."},{"t":"5. Zamknięte grobowce Kofun","d":"Japonia ma ponad 160 tys. kurhanów kofun z lat 300-700, a największy, Daisen, ma większą powierzchnię niż Wielka Piramida. Agencja Dworu Cesarskiego nie pozwala na wykopaliska \"z szacunku dla zmarłych\". Część historyków podejrzewa, że pokazałyby powiązania z Koreą lub Chinami."},{"t":"4. Sylfion","d":"Roślina rosła tylko na wąskim pasie wybrzeża dzisiejszej Libii i nie dało się jej uprawiać gdzie indziej. Rzymianie płacili za nią srebrem na wagę, a Juliusz Cezar trzymał ok. 680 kg w skarbcu. Ostatnią łodygę w I w. dostał Neron, a dokładny gatunek jest nieznany."},{"t":"3. Zaginione miasto Akad","d":"Ok. 2300 r. p.n.e. Sargon z Akadu stworzył pierwsze imperium, a jego stolica Akad jest dobrze opisana w tekstach: królowie, prawa, gospodarka. Mimo ponad 100 lat poszukiwań w Iraku i Syrii miasta nie znaleziono. Może leżeć pod Bagdadem albo zostało zmyte i zasypane mułem przez Tygrys; imperium upadło ok. 2150 r. p.n.e."},{"t":"2. Zniknięcie Normanów z Grenlandii","d":"Ok. 985 r. Eryk Rudy nazwał lodową wyspę Grenlandią, żeby przyciągnąć osadników, a w szczycie żyło tam ok. 5000 Normanów. Ostatni zapis z 1408 r. to opis ślubu, a w XVI w. Europejczycy zastali ruiny. Teoria: mała epoka lodowa, odrzucenie sposobów Inuitów, upadek rynku kości morsa i wyjazd młodych na Islandię."},{"t":"1. Sumeryjska lista królów","d":"Gliniane tabliczki sprzed ok. 4000 lat wymieniają królów Sumeru sprzed potopu z panowaniami po 43 200, 36 000 i 28 800 lat, łącznie ponad 240 tys. lat. Po potopie liczby spadają do 1200, 900, 300 i w końcu do normalnych. To był oficjalny dokument państwowy, a potop przypomina ten z Biblii i Eposu o Gilgameszu."}],"conclusion":"Nawet dobrze opisane cywilizacje mają luki, a niektóre zagadki mogą pozostać nierozwiązane na zawsze.","factchecks":[{"claim":"Rok 536: mgła zasłoniła słońce, zimno i głód.","verdict":"prawda","note":"Potwierdzają to rdzenie lodowe, słoje drzew i relacja Prokopiusza.","src":[["Wikipedia (ang.): zima wulkaniczna 536 r. - hasło \"Volcanic winter of 536\"","https://en.wikipedia.org/wiki/Volcanic_winter_of_536"],["Science: najgorszy rok w historii","https://www.science.org/content/article/why-536-was-worst-year-be-alive"]],"p":0},{"claim":"Roopkund: dwie grupy zginęły ok. 1000 lat od siebie, wszyscy od gradu.","verdict":"półprawda","note":"DNA (2019) pokazało grupy z VII-X w. i XVII-XX w., co podważa tezę o jednym gradobiciu.","src":[["Harney i in. 2019, Nature Communications","https://www.nature.com/articles/s41467-019-11357-9"],["Wikipedia (ang.): jezioro Roopkund - hasło \"Roopkund\"","https://en.wikipedia.org/wiki/Roopkund"]],"p":1},{"claim":"Upadek epoki brązu: upadły niemal wszystkie państwa naraz.","verdict":"półprawda","note":"Upadli Hetyci, Mykeny i Ugarit, ale Egipt i Asyria przetrwały osłabione.","src":[["Wikipedia (ang.): upadek epoki brązu - hasło \"Late Bronze Age collapse\"","https://en.wikipedia.org/wiki/Late_Bronze_Age_collapse"]],"p":2},{"claim":"Rzymskie dwunastościany: żaden tekst o nich nie wspomina.","verdict":"prawda","note":"Znaleziono ponad 100 egzemplarzy, głównie w północno-zachodniej części imperium; brak wzmianek w tekstach, a funkcja jest nieznana.","src":[["Wikipedia (ang.): rzymski dwunastościan - hasło \"Roman dodecahedron\"","https://en.wikipedia.org/wiki/Roman_dodecahedron"]],"p":3},{"claim":"Miedziany Zwój: 1952, 64 skrytki, niczego nie znaleziono.","verdict":"prawda","note":"Zgodne ze źródłami. Badacze spierają się, czy to realna lista skarbów Świątyni, czy folklor.","src":[["Wikipedia (ang.): Miedziany Zwój - hasło \"Copper Scroll\"","https://en.wikipedia.org/wiki/Copper_Scroll"]],"p":4},{"claim":"Kofun: ponad 160 tys. kurhanów, Daisen większy od Wielkiej Piramidy, zakaz badań.","verdict":"prawda","note":"Daisen jest większy od Wielkiej Piramidy, ale od 2018 r. dopuszczono ograniczone wykopaliska.","src":[["Wikipedia (ang.): kurhan Daisen - hasło \"Daisen Kofun\"","https://en.wikipedia.org/wiki/Daisen_Kofun"],["Wikipedia (ang.): kurhany kofun - hasło \"Kofun\"","https://en.wikipedia.org/wiki/Kofun"]],"p":5},{"claim":"Sylfion był wart srebra, a tożsamość rośliny zaginęła na zawsze.","verdict":"półprawda","note":"Anegdoty są od Pliniusza, ale w 2021 r. zaproponowano identyfikację rośliny (sporną), więc nie \"na zawsze\".","src":[["Wikipedia (ang.): sylfion - hasło \"Silphium\"","https://en.wikipedia.org/wiki/Silphium"],["Miski 2021, Plants (PMC)","https://pmc.ncbi.nlm.nih.gov/articles/PMC7825337/"]],"p":6},{"claim":"Lokalizacja Akadu jest nieznana.","verdict":"prawda","note":"Mimo wielu propozycji miasta nie zlokalizowano.","src":[["Wikipedia (ang.): miasto Akad - hasło \"Akkad (city)\"","https://en.wikipedia.org/wiki/Akkad_(city)"]],"p":7},{"claim":"Grenlandia: ostatni zapis 1408 r., 5000 osadników, odrzucili sposoby Inuitów.","verdict":"półprawda","note":"Ślub z 1408 r. się zgadza, ale osadników było ok. 2000-2500 i jedli dużo foki.","src":[["Wikipedia (ang.): osadnictwo nordyckie w Ameryce i na Grenlandii - hasło \"Norse colonization of the Americas / Greenland\"","https://en.wikipedia.org/wiki/Norse_colonization_of_North_America"],["Smithsonian: dlaczego zniknęli","https://www.smithsonianmag.com/history/why-greenland-vikings-vanished-180962119/"]],"p":8},{"claim":"Liczb panowań z Sumeryjskiej listy królów nikt nie wyjaśnił.","verdict":"półprawda","note":"Liczby to wielokrotności sar (3600) w systemie sześćdziesiątkowym; lista łączy mit z historią.","src":[["Wikipedia (ang.): Sumeryjska lista królów - hasło \"Sumerian King List\"","https://en.wikipedia.org/wiki/Sumerian_King_List"]],"p":9}],"bias":"Dobrze dobrane tematy, ale przesadza z \"nierozwiązanymi zagadkami\": dla kilku (Roopkund, sylfion, lista królów) jest postęp, który film pomija lub umniejsza.","channel":"Chill Dude Explains","section":"Chill Dude Explains"},{"id":"PNq74gruSLc","title_pl":"Pustynnienie Polski: hydrolog Piotr Bednarek o rzekach, rowach i retencji","title":"Czy da się zatrzymać pustynnienie Polski? Jeśli tak, to jak? II Piotr Bednarek","channel":"didaskalia","url":"https://www.youtube.com/watch?v=PNq74gruSLc","date":"2026-07-05","duration":5703,"views":174852,"section":"Didaskalia","transcript":"youtube","added":"2026-11-04","tags":["Natura","Geografia","Nauka"],"about":"Hydrolog z UJ i fundacji Wolne Rzeki o zasobach wody w Polsce, erozji Wisły, rowach melioracyjnych i renaturyzacji.","intro":"Rozmowa Patrycjusza Wyżgi z Piotrem Bednarkiem (doktorant hydrologii UJ, prezes fundacji Wolne Rzeki). Gość tłumaczy, czemu Polska jest uboga w wodę, jak regulacja rzek i rowy przyspieszają odpływ oraz co realnie pomaga: renaturyzacja, bobry i zatrzymywanie wody w krajobrazie, a nie same zbiorniki zaporowe.","points":[{"t":"Mało wody na mieszkańca","d":"Według przytoczonego raportu GUS Polska jest ok. 24. w UE pod względem zasobów wodnych; na Polaka przypada ok. 1600 m3 wody rocznie, ok. 3 razy mniej niż średnia unijna. Średni opad to ok. 600 mm/rok."},{"t":"Parowanie i ujemny bilans","d":"Rosnąca temperatura zwiększa parowanie z gleby, wody i roślin. Bednarek liczył bilans małej rzeki Dębowiec w Lasach Janowskich: od 2011 każdego roku ujemny. Na wielu wodowskazach IMGW są rekordowo niskie stany."},{"t":"Nawalne opady zamiast mżawki","d":"Według projekcji klimatycznych dłuższe okresy bez deszczu przeplatają się z nawalnymi opadami. Przykład: powódź Odry 2024, gdy w zlewni górnej w tydzień spadło ponad 500 mm, czyli mniej więcej roczna suma."},{"t":"Porównanie z Egiptem","d":"Hasło o bilansie jak w Egipcie dotyczy tej samej liczby ok. 1600 m3/osobę. Bednarek podkreśla różnicę: Egipt zależy od Nilu z zagranicy, a Polska prawie całą wodę z opadów ma u siebie i może nią zarządzać."},{"t":"Rowy zamiast bagien","d":"Przez 100-200 lat przyspieszano odpływ, by osuszać bagna pod uprawy. Według niepełnych danych sieć rowów ma ok. 330 000 km (baza może pomijać nawet 2/3), a w lasach ok. 80-100 000 km. Rowów jest 2-3 razy więcej niż długości rzek."},{"t":"Retencja 6-8% to mit zbiorników","d":"Wskaźnik retencji Polski ok. 6-8% vs ok. 20% w UE dotyczy głównie pojemności zbiorników zaporowych. Bednarek: woda we Włocławku nie ratuje Kujaw; Goczałkowice mają sens komunalny, ale wiele zbiorników tylko suszy dolinę poniżej."},{"t":"Erozja wgłębna Wisły","d":"Wyprostowane, pogłębione koryto i pobór piasku powodują erozję dna. W Warszawie Wisła miała wtedy ok. 140 m3/s; Bednarek musiał przeciągać kajak przez mielizny. Obniżanie dna obniża wody gruntowe w dolinie."},{"t":"Bobry lepsze niż jaz","d":"Opisuje rzekę Kurzynkę: Wody Polskie rozebrały tamę bobrową, by remontować jaz, który i tak nie piętrzył wody. Bobrowa tama piętrzyła więcej i zostawiała oboczny przepływ dla ryb."},{"t":"Renaturyzacja vs nowe zapory","d":"Renaturyzacja to m.in. rozbiórka barier i przywracanie meandrów. Według gościa na renaturyzację planowano 76 mln zł, a na jeden zbiornik w Wielowsi Klasztornej ok. miliard. Przez zaporę we Włocławku wymarły m.in. łosoś i węgorz w Wiśle."},{"t":"Co może zrobić zwykły człowiek","d":"Nie podlewać trawników wodą z wodociągu w suszy, zbierać deszczówkę, nie sczerpywać wód bez sensu. W skali kraju: kontrola poborów rolniczych, odejście od przekopywania rzek i oddawanie im przestrzeni."},{"t":"Stop suszy, start retencji","d":"Bednarek krytykuje, że ta sama instytucja prowadzi kampanię retencji i jednocześnie prace utrzymaniowe: odmulanie, pogłębianie i koszenie tysięcy kilometrów małych rzek, co znów przyspiesza odpływ."}],"conclusion":"Według Bednarka Polska nie potrzebuje kolejnych zapór, tylko zatrzymania wody w glebie, mokradłach i meandrujących rzekach.","factchecks":[{"claim":"Polska ma ok. 1600 m3 odnawialnych zasobów wody na mieszkańca rocznie.","verdict":"prawda","note":"GUS i MKiŚ podają ok. 1600 m3/osobę/rok; Polska jest wśród najuboższych w wodę krajów UE.","p":0,"src":[["Nauka w Polsce / GUS: Polska 24. w UE pod względem zasobów wody","https://scienceinpoland.pl/aktualnosci/news%2C89441%2Cgus-polska-na-24-miejscu-w-ue-pod-wzgledem-zasobow-wody.html"],["Gov.pl: sytuacja wodna Polski","https://www.gov.pl/web/klimat/odpornosc-sytuacja-wodna-polski-kraj-ubogi-w-wode"]]},{"claim":"Przez zaporę we Włocławku wymarł w Polsce łosoś i węgorz.","verdict":"półprawda","note":"Zapora mocno blokuje migrację ryb dwuśrodowiskowych; zanik łososia i spadek węgorza mają też inne przyczyny.","p":8,"src":[["Wikipedia (ang.): Włocławek Dam - hasło \"Włocławek Dam\"","https://en.wikipedia.org/wiki/W%C5%82oc%C5%82awek_Dam"]]},{"claim":"W powodzi Odry 2024 w zlewni górnej w tydzień spadło ponad 500 mm deszczu.","verdict":"prawda","note":"We wrześniu 2024 lokalnie notowano sumy rzędu 400-500+ mm w kilka dni, porównywalne z roczną normą.","p":2,"src":[["Wikipedia (ang.): 2024 Central European floods","https://en.wikipedia.org/wiki/2024_Central_European_floods"]]}],"bias":"Gość jest aktywistą fundacji Wolne Rzeki i krytykiem Wód Polskich. Reklama w odcinku: Audioteka Club. Silny nacisk na renaturyzację kosztem hydrotechniki."},{"id":"KpRZYgDIEaE","title_pl":"Minimoog Model D - historia i brzmienie najsłynniejszego syntezatora","title":"The Original 1970s Minimoog","channel":"Alex Ball","url":"https://www.youtube.com/watch?v=KpRZYgDIEaE","date":"2026-07-02","duration":1071,"views":85295,"section":"Technologie","transcript":"whisper","added":"2026-11-03","tags":["Syntezatory","Vintage","Moog"],"about":"Alex Ball opowiada historię Minimooga Model D, objaśnia, skąd bierze się jego brzmienie, i zestawia go z Oberheimem i Rolandem.","intro":"Alex Ball, znany z filmów o syntezatorach vintage, pożyczył dwa egzemplarze Minimooga Model D z 1975 roku. Opisuje, jak z eksperymentów w przerwach na lunch powstał najsłynniejszy syntezator świata. Tłumaczy też, skąd bierze się jego brzmienie, i porównuje go z dwoma najlepiej brzmiącymi syntezatorami w swoim studiu.","points":[{"t":"Narodziny w przerwie na lunch","d":"Pod koniec 1969 roku inżynier Bill Hemsath przez trzy tygodnie przerw na lunch składał z odrzuconych części mały syntezator z najczęstszym zestawem: oscylatory, filtr, wzmacniacz, obwiednie i klawiatura. Nazwał go Min, później Model A."},{"t":"Od Modelu B do C","d":"Na sugestię menedżera Johna Husy Min zmienił nazwę na Mini, a pierwsza wzmianka pojawiła się w Billboardzie w styczniu 1970 roku. Sun Ra nagrywał i koncertował z Modelem B, a około tuzina Modeli C powstało na konwencję AES we wrześniu 1970 roku."},{"t":"Mały bunt w fabryce","d":"Gdy Bob Moog szukał inwestorów, inżynierowie bez jego zgody dokończyli Model D. Produkowano go od listopada 1970 do wczesnych lat 80."},{"t":"Mało elementów, ale świetnych","d":"Mocne oscylatory, czterobiegunowy filtr dolnoprzepustowy typu ladder i tor sygnału, który przypadkiem był przesterowany, ale zostawiono go, bo brzmiał dobrze. Szybkie, sprężyste obwiednie dają atak jak przy szarpnięciu struny."},{"t":"Ograniczenia zachęcają do odkrywania","d":"Minimoog nie ma synchronizacji oscylatorów ani modulacji szerokości impulsu. Sprytne ustawienia i znajomość znoszenia się faz między oscylatorami pozwalają jednak uzyskać podobne efekty."},{"t":"Wiele wersji Minimooga","d":"Wczesne egzemplarze R.A. Moog mają najlepiej brzmiącą płytkę oscylatorów, ale słabo trzymają strój. Trzecia wersja płytki stroi najlepiej, ale brzmi najgorzej. Złotym środkiem są egzemplarze z połowy produkcji, np. z 1975 roku."},{"t":"Pojedynek w studiu","d":"Autor gra Minimoogiem razem z Oberheimem Two Voice i Rolandem System 100, które są dwugłosowe i stereo. Mono Minimoog wciąż wyróżnia się wagą i uderzeniem basu."},{"t":"Lektura","d":"Szczegóły wersji poleca w książce \"The Minimoog Book\" Joe Silvy (wyd. Bjooks), kupionej za własne pieniądze, oraz w filmie Garetha z Synth Pro."}],"conclusion":"Minimoog jest prosty, ale dzięki jakości elementów i ich połączeniu brzmi wyjątkowo i dalej wygrywa z syntezatorami o wiele większych możliwościach.","factchecks":[{"claim":"Inżynierowie dokończyli Model D bez zgody Boba Mooga, gdy ten był nieobecny.","verdict":"prawda","note":"Wikipedia potwierdza: zrobili to pod jego nieobecność, a Moog ich zganił, ale potem zatwierdził produkcję.","p":2,"src":[["Wikipedia (ang.): syntezator - hasło \"Minimoog\"","https://en.wikipedia.org/wiki/Minimoog"]]},{"claim":"Sun Ra nagrywał Minimoogiem jeszcze przed jego oficjalną premierą.","verdict":"prawda","note":"Wikipedia wskazuje Sun Ra jako prawdopodobnie pierwszego muzyka, który nagrał i grał na tym instrumencie (1970).","p":1,"src":[["Wikipedia (ang.): syntezator - hasło \"Minimoog\"","https://en.wikipedia.org/wiki/Minimoog"]]},{"claim":"Produkcja trwała od 1970 do wczesnych lat 80.","verdict":"prawda","note":"Produkcja trwała 13 lat i zakończyła się w lipcu 1981 roku. Powstało ponad 12 000 egzemplarzy.","p":2,"src":[["Wikipedia (ang.): syntezator - hasło \"Minimoog\"","https://en.wikipedia.org/wiki/Minimoog"]]},{"claim":"Filtr ladder to znak rozpoznawczy brzmienia Mooga.","verdict":"prawda","note":"Filtr ladder był jedynym opatentowanym przez Mooga elementem (1969) i dawał charakterystyczne, \"tłuste\" brzmienie.","p":3,"src":[["Wikipedia (ang.): syntezator Moog - hasło \"Moog synthesizer\"","https://en.wikipedia.org/wiki/Moog_synthesizer"]]}],"bias":"Rzeczowy materiał pasjonata, bez sponsora książki. Na końcu reklama paczki sampli na Patreonie autora."},{"id":"uUDSnfKR2S8","title_pl":"Artur Chmielewski z NASA: elektrownia na Księżycu, Hel-3 i wyścig z Chinami","title":"Polak z NASA o największej tajemnicy Księżyca || Artur B. Chmielewski","channel":"didaskalia","url":"https://www.youtube.com/watch?v=uUDSnfKR2S8","date":"2026-06-28","duration":4273,"views":423327,"section":"Didaskalia","transcript":"youtube","added":"2026-11-04","tags":["Kosmos","Technologie","Nauka"],"about":"Szef misji w JPL o bazie na biegunie księżycowym, elektrowni jądrowej, Helu-3, Artemis i skasowanym Mars Sample Return.","intro":"Kolejna rozmowa Patrycjusza Wyżgi z Arturem B. Chmielewskim z NASA JPL. Gość opowiada o pracy nad elektrownią jądrową na Księżycu, o wodzie w wiecznie zacienionych kraterach, o Helu-3, o tym, czemu Mars Sample Return odłożono na rzecz Artemis, oraz o nowej księdze Tytusa, Romka i Atomka.","points":[{"t":"Elektrownia jądrowa na Księżycu","d":"Główne zadanie Chmielewskiego to budowa elektrowni atomowej na Księżycu. Baza potrzebuje prądu do ogrzewania, chłodzenia, tlenu i życia; według niego to jak wprowadzenie się do stanu surowego bez instalacji."},{"t":"Biegun, krater i woda","d":"Cel lądowania to okolice wielkiego krateru (biegun), gdzie w wiecznym cieniu jest ok. -180 C i zamarznięta woda. Woda lokalna ma służyć do picia, higieny i jedzenia zamiast wożenia jej z Ziemi."},{"t":"Hel-3 jako paliwo przyszłości","d":"Według gościa Hel-3 przy fuzji daje czystą energię bez neutronów. Na Księżycu są setki milionów jednostek, na Ziemi gramy. Twierdzi, że 1 tona wystarczyłaby USA na rok energii, Polsce na kilkanaście kilogramów."},{"t":"Mars Sample Return skasowany","d":"Perseverance zebrał próbki w tytanowych tubach w kraterze po dawnym jeziorze. Misja powrotu miała: lądownik, rakietę na orbitę Marsa i europejski statek. Została skasowana; pieniądze poszły na programy księżycowe."},{"t":"Chiny w wyścigu","d":"Chmielewski mówi prywatnie, że Chiny radzą sobie dobrze lub lepiej, mają większy budżet i mogą być pierwsze z bazą lub próbkami. Współpracę USA-Chiny uważa za trudną przez kopiowanie technologii."},{"t":"Budżet: Apollo vs dziś","d":"Apollo to według niego ok. 4% budżetu USA, dziś NASA ma ok. 0,4%, czyli ok. 10 razy mniej. Stąd misje są tańsze, wieloetapowe, z tankowaniem na orbicie zamiast jednorazowych gigantycznych rakiet."},{"t":"Artemis i Starship","d":"Artemis 1 i 2 opisuje jako sukcesy; o terminie załogowego lądowania mówi ostrożnie (oficjalnie ok. 2028, prywatnie raczej później, ok. 2030). Do tankowania Starshipa potrzeba wielu lotów tankowców."},{"t":"Humanoid w skafandrze","d":"Chce z Witoldem ubrać humanoida w skafander i wysłać go np. cargo Blue Origin przed astronautami, by przetestować schodzenie i poruszanie. Żartuje o spacerze do starego łazika Apollo."},{"t":"Uran i Tytan odłożone","d":"Po Mars Sample Return kolejnym priorytetem naukowym miał być Uran; teraz schodzi dalej. Wcześniej pracował nad konkurencyjnym planem Oceanus badania oceanów na Tytanie."},{"t":"Tytus astronauta i Polska","d":"Przyjechał na Targi Książki z nową księgą Tytusa, Romka i Atomka (Tytus w kosmosie). Chce oddać Polsce coś z doświadczenia NASA; wspomina też o technologii poszukiwania wody pod Saharą."}],"conclusion":"Chmielewski stawia na księżycową infrastrukturę energetyczną i wodną; wyścig z Chinami traktuje jako motywację, a nie cel sam w sobie.","factchecks":[{"claim":"1 tona Helu-3 z Księżyca wystarczyłaby USA na rok energii.","verdict":"przesada","note":"Szacunki fuzji He-3 mówią raczej o ok. 25-50 tonach na roczne zapotrzebowanie USA, nie o 1 tonie.","p":2,"src":[["The Hill: mining Moon helium-3","https://thehill.com/opinion/technology/540856-solving-the-climate-and-energy-crises-mine-the-moons-helium-3/"],["Space.com / UW FTI: Moon helium-3 energy","https://fti.neep.wisc.edu/fti.neep.wisc.edu/gallery/pdf/space_com063000.pdf"]]},{"claim":"South Pole-Aitken to największy znany krater w Układzie Słonecznym.","verdict":"prawda","note":"Basen South Pole-Aitken ma ok. 2500 km średnicy i jest największym znanym kraterem uderzeniowym.","p":1,"src":[["NASA Science: What is the South Pole-Aitken Basin?","https://science.nasa.gov/moon/lunar-craters/what-is-the-south-pole-aitken-basin/"]]},{"claim":"W wiecznie zacienionych kraterach bieguna jest ok. -180 C i lód wodny.","verdict":"prawda","note":"Dno Shackletona ma ok. 90 K (ok. -183 C); w PSR wykryto wodór/lód. Lokalnie bywa jeszcze zimniej.","p":1,"src":[["Wikipedia (ang.): Shackleton (crater)","https://en.wikipedia.org/wiki/Shackleton_(crater)"],["NASA: Moon's South Pole","https://www.nasa.gov/humans-in-space/moons-south-pole-is-full-of-mystery-science-intrigue/"]]},{"claim":"Budżet NASA to dziś ok. 0,4% budżetu federalnego USA, Apollo miało ok. 4%.","verdict":"prawda","note":"Szczyt Apollo sięgał ok. 4% budżetu federalnego; NASA od lat to zwykle poniżej 0,5%.","p":5,"src":[["Wikipedia (ang.): Budget of NASA","https://en.wikipedia.org/wiki/Budget_of_NASA"]]}],"bias":"Gość jest pracownikiem NASA JPL i patriotą USA/Polski; Chiny ocenia ostro (kopiowanie). Reklama: Audioteka Club. Opinie o terminach Artemis i Chinach to jego prywatne oceny."},{"id":"8eyrXIjdj3A","title_pl":"Dlaczego niektórzy mają obsesję na punkcie bawełny Sea Island","title":"Dlaczego niektórzy mają obsesję na punkcie tej bawełny?","channel":"Tomasz o ciuchach - Tomasz Krajewski","url":"https://www.youtube.com/watch?v=8eyrXIjdj3A","date":"2026-06-01","duration":729,"views":17378,"section":"Moda","transcript":"whisper","added":"2026-11-03","tags":["Materiały","Bawełna","Jakość ubrań"],"about":"Tomasz Krajewski porównuje sweter z Uniqlo za 100 zł i John Smedley z bawełny Sea Island za 1100 zł i wyjaśnia, co decyduje o jakości bawełny.","intro":"Tomasz Krajewski zestawia dwa prawie identyczne bawełniane swetry: z Uniqlo za około 100 zł i z John Smedley z bawełny Sea Island za 1100 zł. W półślepym teście znajomi wybrali tańszy, bo był grubszy. Autor tłumaczy, od czego naprawdę zależy jakość bawełny i czy luksus jest wart dopłaty.","points":[{"t":"Przędza i luźne końcówki","d":"Przędza to skręcone włókna, a każda wystająca końcówka to słaby punkt. Luźne włókna pod wpływem tarcia tworzą meszek i kulki, łapią brud i są bardziej szorstkie. Najbardziej niszczą je pranie i suszenie."},{"t":"Długość włókna","d":"Włókna z wacika mają do 1 cm, a Sea Island około 5 cm. Krótsze włókna to więcej końcówek i łączeń w przędzy. Za najwyższą ligę uznaje się włókna od 35 mm, z markowymi nazwami, np. Pima i Supima."},{"t":"\"100% cotton\" nic nie mówi","d":"Około 90% światowej bawełny to zwykła odmiana. To samo oznaczenie ma koszulka za grosze i rzecz od Gucci. Różnica między dzianiną open-end z krótkich włókien a ring-spun z lepszych to jak płyta wiórowa wobec litego drewna."},{"t":"Oznaczenia warte uwagi","d":"Ring-spun to mocniej skręcona, gładsza przędza. Combed cotton oznacza czesanie, które usuwa najkrótsze włókna. Merceryzacja chemicznie wygładza przędzę, poprawia barwienie i daje połysk. Przy denimie czy cotton duck ważniejsze jest tkanie."},{"t":"Gramatura to nie jakość","d":"Gruba koszulka wydaje się solidna na wieszaku, ale jest sztywniejsza i gorzej oddycha. Wysoka gramatura ma sens w bluzach. T-shirty, swetry i koszule dobieraj gramaturą do temperatury."},{"t":"Jak sprawdzać marki","d":"Dobry znak to przejrzyste informacje o produkcji i materiałach. Najlepiej sprawdzać opinie na Reddicie, YouTube i blogach, patrząc na daty, bo popularne marki bywają z czasem gorsze."},{"t":"Czy Sea Island się opłaca","d":"Sea Island to około 4 milionowe światowej produkcji bawełny. Jest najtrwalsza, ale dopłacasz głównie za rzadkość i certyfikat. Autor poleca Pima i Supima oraz szukanie markowych rzeczy w lumpeksach i na Vinted; jego sweter kosztował około 6 zł."}],"conclusion":"Do ubrań noszonych przy skórze wybieraj bawełnę o dłuższych włóknach, ale nie przepłacaj za luksus, bo różnice są niewielkie.","factchecks":[{"claim":"Bawełna z najwyższej ligi zaczyna się od włókien długości 35 mm.","verdict":"prawda","note":"ICAC definiuje bawełnę extra-long-staple od 1 3/8 cala, czyli około 35 mm.","p":1,"src":[["Wikipedia (ang.): bawełna - hasło \"Gossypium barbadense\"","https://en.wikipedia.org/wiki/Gossypium_barbadense"]]},{"claim":"Merceryzacja poprawia barwienie i nadaje bawełnie połysk.","verdict":"prawda","note":"Wikipedia: poprawia wchłanianie barwnika i wytrzymałość, zmniejsza kurczenie i daje jedwabisty połysk.","p":3,"src":[["Wikipedia (ang.): obróbka tkanin - hasło \"Mercerisation\"","https://en.wikipedia.org/wiki/Mercerisation"]]},{"claim":"Czesanie usuwa najkrótsze włókna.","verdict":"prawda","note":"Czesanie oddziela krótkie włókna za pomocą stalowych igieł.","p":3,"src":[["Wikipedia (ang.): przędzalnictwo - hasło \"Combing\"","https://en.wikipedia.org/wiki/Combing"]]},{"claim":"Sea Island to około 4 milionowe światowej produkcji bawełny.","verdict":"nie da się sprawdzić","note":"Wikipedia potwierdza, że Sea Island to odmiana G. barbadense, ale nie podaje udziału w światowej produkcji.","p":6,"src":[["Wikipedia (ang.): bawełna - hasło \"Gossypium barbadense\"","https://en.wikipedia.org/wiki/Gossypium_barbadense"]]}],"bias":"Rzetelny i uczciwy materiał. Autor przyznaje, że sam nie odróżnia bawełny dotykiem, a drogi sweter kupił w lumpeksie. Bez sponsora."},{"id":"Woz8RYQnbhU","title_pl":"McGill Big 3 robione poprawnie - szczegóły, które zmieniają efekt","title":"Your McGill Big 3 Is Wrong (Here's Why Your Back Still Hurts)!","channel":"Squat University","url":"https://www.youtube.com/watch?v=Woz8RYQnbhU","date":"2026-05-24","duration":1072,"views":436154,"section":"Sport","transcript":"youtube","added":"2026-11-03","tags":["Kręgosłup","Core","Rehabilitacja"],"about":"Fizjoterapeuta dr Aaron Horschig ze Squat University przeprowadza pacjenta przez McGill Big 3 i poprawia błędy w technice.","intro":"McGill Big 3 to trzy ćwiczenia stabilizujące tułów, polecane przy bólu dolnej części pleców. Dr Aaron Horschig ze Squat University twierdzi, że ćwiczenia działają, a zawodzi zwykle wykonanie. Na prawdziwej sesji z pacjentem pokazuje wskazówki do brzuszka zmodyfikowanego, bocznej deski i bird doga.","points":[{"t":"Brzuszek zmodyfikowany","d":"Jedna noga zgięta, druga prosta, dłonie pod lędźwiami. Ułatwia to utrzymanie neutralnego kręgosłupa. Lędźwie nie mogą naciskać na dłonie, a ruch wychodzi tylko z odcinka piersiowego."},{"t":"Wstępne napięcie bocznie","d":"Wciśnij palce w boczne mięśnie brzucha i napnij je w bok. To nie wciąganie pępka ani wypychanie brzucha, tylko usztywnienie tułowia dookoła, które angażuje też mięśnie pleców."},{"t":"Ściemniacz, nie włącznik","d":"Na co dzień nie trzeba napięcia na 100%, ale za słabe pozwala na mikroruchy kręgosłupa, które mogą wywołać ból. Cel to oddychać spokojnie, np. jak przez słomkę, bez \"migotania\" napięcia brzucha."},{"t":"Wytrzymałość, nie siła","d":"Autor zauważa, że sportowcy przysiadający setki kilogramów też mają ból pleców. Wiąże ból częściej z wytrzymałością i kontrolą ruchu niż z siłą. Dlatego stosuje 10-sekundowe przytrzymania w seriach, np. 4 powtórzenia."},{"t":"Boczna deska","d":"Najprostsza wersja jest na stopach w rozkroku, a łatwiejsza na kolanach. Przy schodzeniu trzymaj napięcie aż do zetknięcia bioder z podłogą, bez bocznego zginania. Trudniejsza wersja to przetaczanie przez deskę przodem na drugi bok, z miednicą i klatką poruszającymi się razem."},{"t":"Bird dog z napięciem całego ciała","d":"Odepchnij podłogę dłonią i unieś klatkę. Unieś rękę i nogę najpierw tylko o 2-3 cm, nie zadzieraj pięty, żeby nie wyginać lędźwi. Wracaj powoli bez rozluźniania. Dobrze zrobiony powinien zmęczyć."},{"t":"To nie wszystko","d":"Na koniec autor podkreśla, że Big 3 samo nie naprawia większości bólu pleców. To część pełnej rehabilitacji, którą zaczyna badanie innych braków ciała."}],"conclusion":"Big 3 działa, gdy kręgosłup pozostaje nieruchomy, oddech nie przerywa napięcia, a ćwiczenia są częścią szerszej rehabilitacji.","factchecks":[{"claim":"Ból pleców wiąże się bardziej z wytrzymałością mięśni tułowia niż z ich siłą.","verdict":"półprawda","note":"Słaba wytrzymałość prostowników przewidywała ból pleców w badaniu z 1984 roku, ale nie dowodzi to, że to główna przyczyna.","p":3,"src":[["PubMed: Biering-Sørensen 1984 - \"Physical measurements as risk indicators for low-back trouble over a one-year period\"","https://pubmed.ncbi.nlm.nih.gov/6233709/"]]},{"claim":"Ćwiczenia stabilizujące działają, jeśli tylko robi się je poprawnie.","verdict":"przesada","note":"Wg Cochrane ćwiczenia kontroli motorycznej pomagają, ale prawdopodobnie nie bardziej niż inne formy ćwiczeń.","p":null,"src":[["PubMed: Saragiotto i wsp. 2016 - \"Motor control exercise for chronic non-specific low-back pain\"","https://pubmed.ncbi.nlm.nih.gov/26742533/"]]},{"claim":"Przytrzymania stabilizujące tułów można trenować i mierzyć czasem.","verdict":"prawda","note":"McGill i wsp. opisali normy czasu wytrzymania w ćwiczeniach stabilizacji lędźwi jako cele kliniczne.","p":3,"src":[["PubMed: McGill i wsp. 1999 - \"Endurance times for low back stabilization exercises\"","https://pubmed.ncbi.nlm.nih.gov/10453772/"]]}],"bias":"Autor jest fizjoterapeutą i propaguje metodę McGilla. Prowadzi własną klinikę i program rehabilitacyjny, więc podkreśla rolę badania przez specjalistę."},{"id":"ohRX0oauJ3Q","title_pl":"10 mężczyzn, którzy ukształtowali współczesną męską garderobę","title":"Everything in Your Closet Can Be Traced Back To These 10 Men","channel":"Gentleman's Gazette","url":"https://www.youtube.com/watch?v=ohRX0oauJ3Q","date":"2026-05-17","duration":887,"views":23004,"section":"Moda","transcript":"youtube","added":"2026-11-03","tags":["Styl","Historia mody","Klasyka"],"about":"Gentleman's Gazette przedstawia 10 ikon stylu, od Beau Brummella po Toma Forda, i to, czego każda z nich może nauczyć dziś.","intro":"Gentleman's Gazette twierdzi, że krój, dodatki i niepisane zasady w naszej szafie pochodzą od kilku mężczyzn, którzy ubierali się inaczej niż reszta. Kanał przedstawia 10 postaci od końca XVIII wieku do dziś. Każda zostawia jedną praktyczną lekcję.","points":[{"t":"Beau Brummell: mniej znaczy więcej","d":"W epoce peruk, makijażu i haftowanych fraków postawił na prostotę, dopasowanie i czystość, z nieskazitelnym płótnem i codzienną kąpielą. Prosty, idealnie skrojony granatowy surdut znaczył więcej niż złote nici."},{"t":"Edward VII: elegancja i wygoda","d":"Spopularyzował kapelusz homburg jako miękką alternatywę dla cylindra. Przypisuje mu się zwyczaj niezapinania dolnego guzika kamizelki, choć autorzy przyznają, że może to być legenda."},{"t":"Książę Windsoru: \"dressing soft\"","d":"Wprowadził marynarki z naturalnymi ramionami i luźniejszym krojem oraz rozsławił kratę Prince of Wales. Do smokingu założył miękki wykładany kołnierzyk zamiast sztywnego kołnierzyka typu wing."},{"t":"Fred Astaire: test tańca","d":"Po przymiarce tańczył u krawca, żeby ubranie poruszało się razem z nim. Krawaty i apaszki służyły mu jako pasek, a zamszowe buty nosił do miejskich garniturów. Jeśli nie możesz się swobodnie ruszać, ubranie nie pasuje."},{"t":"Cary Grant i Gianni Agnelli","d":"Grant stawiał na podstawy: szerokość klap, stan spodni i linię ramion. Agnelli nosił zegarek na mankiecie i buty trekkingowe do garnituru, ale ta nonszalancja opierała się na perfekcyjnym krawiectwie. Zasady można łamać dopiero, gdy się je zna."},{"t":"Paul Newman i Steve McQueen","d":"Newman to styl Ivy: koszula oxford z kołnierzykiem na guziki, chinosy, dziany krawat i loafersy. McQueen łączył odzież roboczą i wojskową, np. kurtkę Harrington Baracuta G9 i okulary Persol. Może być surowo, ale nigdy niechlujnie."},{"t":"Ralph Lauren i Tom Ford","d":"Lauren zaczął w 1967 roku od krawatów szerokich na około 10 cm, gdy modne były wąskie, i sprzedaje cały styl życia. Ford w latach 90. przywrócił garnitur z mocnymi ramionami i szpiczastymi klapami, a potem ubierał Jamesa Bonda."}],"conclusion":"Codziennie wybierasz, co wziąć od tych ikon: dopasowanie Brummella, prostotę Granta, swobodę Agnellego czy opowieść Laurena.","factchecks":[{"claim":"Brummell wprowadził modę na czystość i codzienną kąpiel.","verdict":"prawda","note":"Wikipedia opisuje jego dbałość o zęby, golenie i codzienną kąpiel, które naśladowała wyższa sfera.","p":0,"src":[["Wikipedia (ang.): dandys - hasło \"Beau Brummell\"","https://en.wikipedia.org/wiki/Beau_Brummell"]]},{"claim":"Edward VII spopularyzował homburga, a może i zwyczaj z dolnym guzikiem.","verdict":"półprawda","note":"Homburg zgadza się, ale Wikipedia nazywa wersję o guziku i tuszy Edwarda fałszywą. Autorzy sami podają ją w wątpliwość.","p":1,"src":[["Wikipedia (ang.): kapelusz - hasło \"Homburg hat\"","https://en.wikipedia.org/wiki/Homburg_hat"],["Wikipedia (ang.): kamizelka - hasło \"Waistcoat\"","https://en.wikipedia.org/wiki/Waistcoat"]]},{"claim":"Lauren zaczął od krawatów w 1967 roku.","verdict":"prawda","note":"Firmę Ralph Lauren założył w 1967 roku, startując z męskimi krawatami.","p":6,"src":[["Wikipedia (ang.): projektant - hasło \"Ralph Lauren\"","https://en.wikipedia.org/wiki/Ralph_Lauren"]]},{"claim":"Tom Ford ubierał Jamesa Bonda.","verdict":"prawda","note":"Ford projektował garnitury Daniela Craiga w czterech filmach o Bondzie, od \"Quantum of Solace\" (2008).","p":6,"src":[["Wikipedia (ang.): projektant - hasło \"Tom Ford\"","https://en.wikipedia.org/wiki/Tom_Ford"]]}],"bias":"Uczciwa lekcja historii z jasnymi lekcjami na dziś. Autorzy wspominają o kontrowersjach wokół księcia Windsoru i zaznaczają legendy. Nie ma reklam."},{"id":"qRAxMcjEYd4","title_pl":"10 ćwiczeń na core, które większość ludzi pomija","title":"10 Core Exercises Most People Skip (BUILD A CORE OF IRON)","channel":"Squat University","url":"https://www.youtube.com/watch?v=qRAxMcjEYd4","date":"2026-04-26","duration":1146,"views":592116,"section":"Sport","transcript":"youtube","added":"2026-11-03","tags":["Ciało i zdrowie","Trening","Nauka"],"about":"Fizjoterapeuta Squat University pokazuje 10 ćwiczeń stabilizacji tułowia: od noszenia odważników po pliometrię brzucha.","intro":"Aaron Horschig ze Squat University tłumaczy, że stabilność tułowia to nie tylko mięśnie brzucha, ale też układ nerwowy. Zaczyna od testu noszenia ciężaru, a potem pokazuje 10 ćwiczeń od bardziej znanych do mało popularnych. Podaje przy nich serie, ciężary i sposoby progresji.","points":[{"t":"Trzy podsystemy stabilizacji","d":"Według dr. Panjabiego kręgosłup stabilizują elementy bierne (kości, dyski, więzadła), aktywne (duże mięśnie tułowia) i nerwowe. Gdy jeden zawodzi, jakość ruchu spada i rośnie ryzyko urazu."},{"t":"Test noszenia 75% masy ciała","d":"Dwa odważniki o łącznej masie 75% masy ciała, marsz z idealną postawą. Zaliczenie to 1,5 minuty bez poprawiania chwytu; gość odcinka (ok. 84 kg) nosił 2 kettle po ok. 32 kg."},{"t":"1. Noszenie w 6 pozycjach","d":"Ćwiczenie Graya Cooka: kettlebell nad głową, potem w pozycji rack, potem przy boku, zmiana ręki przed zmęczeniem. Ciężar taki, który wyciskasz 12-15 razy; cel to 12-15 minut ciągłej pracy."},{"t":"2. Deska bokiem z uniesioną nogą","d":"Angażuje skośne, prostowniki, czworoboczny lędźwi i mocno pośladek średni nogi na dole. Start od 4 powtórzeń po 10 sekund na stronę, progresja liczbą powtórzeń."},{"t":"3. Marsz z ciężarem na końcu drążka","d":"Lekki drążek na plecach z ciężarkiem ok. 5 kg na jednym końcu i 5-10 kroków do przodu i do tyłu. Bujający się ciężar pobudza drobne głębokie mięśnie, np. wielodzielny, pełne wrzecion mięśniowych."},{"t":"4-5. Kettlebell dookoła i renegade row","d":"Obroty kettla wokół ciała po 5 razy w każdą stronę, stojąc na dwóch nogach, na jednej i na kolanach. W renegade row cel to brak rotacji: kilka serii po 3-5 powtórzeń na rękę."},{"t":"6. Roll-out z kółkiem","d":"Najpierw wyprost bioder do linii prostej, dopiero potem ruch rąk. Łatwiejsze wersje: roll-out na piłce albo wychodzenie rękami z pozycji pompki."},{"t":"7. Mieszanie w garnku","d":"Deska z łokciami na piłce i małe kółka przy nieruchomym tułowiu. Trójbojarz Brian Carroll używał tego ćwiczenia przed rekordowym przysiadem z 2020 roku (ok. 592 kg)."},{"t":"8. Chop i lift na wyciągu","d":"W półklęku, hasło: przyciągnij do środka i odepchnij. Zamiast 10 powtórzeń ciągiem lepiej robić 10 serii po jednym, z pauzą i oddechem, bo trenuje się odruchową stabilizację."},{"t":"9-10. Wyciskanie Milko i rzuty piłką","d":"Leżąc lędźwiami na ławce, rotacja górnej części pleców z wypychaniem hantla w górę, 5 razy na stronę. Na koniec szybkie rzuty piłką lekarską o ścianę z rotacji bioder jako pliometria brzucha."}],"conclusion":"Core trzeba trenować z różnorodnością i progresją, ćwicząc stabilizację odruchową, a nie tylko siłę mięśni brzucha.","factchecks":[{"claim":"Panjabi opisał stabilizację kręgosłupa jako 3 podsystemy: bierny, aktywny i nerwowy.","verdict":"prawda","note":"Model Panjabiego z 1992 roku zawiera dokładnie te 3 podsystemy.","p":0,"src":[["PubMed: Panjabi 1992, układ stabilizujący kręgosłup - \"The stabilizing system of the spine. Part I\"","https://pubmed.ncbi.nlm.nih.gov/1490034/"]]},{"claim":"Zaliczenie testu to 1,5 minuty noszenia 75% masy ciała.","verdict":"nie da się sprawdzić","note":"Nie znalazłem publicznie opisanego progu w materiałach Graya Cooka; to wartość podana przez autora.","p":1,"src":[["Wikipedia (ang.): spacer farmera - hasło \"Farmer's walk\"","https://en.wikipedia.org/wiki/Farmer%27s_walk"]]},{"claim":"Mięsień wielodzielny ma dużo wrzecion mięśniowych i pełni rolę czuciową.","verdict":"prawda","note":"Badania pokazują dużą gęstość wrzecion w głębokich mięśniach przykręgosłupowych, ale ich rola nie jest tylko czuciowa.","p":4,"src":[["Wikipedia (ang.): mięsień wielodzielny - hasło \"Multifidus muscle\"","https://en.wikipedia.org/wiki/Multifidus_muscle"]]},{"claim":"Deska bokiem mocno aktywuje pośladek średni.","verdict":"prawda","note":"W badaniu EMG Borena i wsp. (2011) deska bokiem z odwiedzeniem nogi dała najwyższą aktywność pośladka średniego.","p":3,"src":[["PubMed: Boren i wsp. 2011, EMG pośladków w ćwiczeniach - \"Electromyographic analysis of gluteus medius and gluteus maximus\"","https://pubmed.ncbi.nlm.nih.gov/22034614/"]]},{"claim":"Carlos Yulo jest mistrzem olimpijskim i mistrzem świata.","verdict":"prawda","note":"Yulo zdobył 2 złote medale w Paryżu 2024 i tytuły mistrza świata w gimnastyce.","p":9,"src":[["Wikipedia (ang.): gimnastyk - hasło \"Carlos Yulo\"","https://en.wikipedia.org/wiki/Carlos_Yulo"]]}],"bias":"Rzetelny, praktyczny materiał, ale część twierdzeń (np. o 95% ćwiczących) to retoryka. Na końcu reklama książki autora."},{"id":"V1xqjgRnpc0","title_pl":"Prof. Andrzej Buko o początkach Polski: Kraków, Gniezno, Piastowie i handel niewolnikami","title":"Co najnowsze odkrycia mówią o Polsce Piastów? Kim był Mieszko? Zagadka Słowian II prof. Andrzej Buko","channel":"didaskalia","url":"https://www.youtube.com/watch?v=V1xqjgRnpc0","date":"2026-04-05","duration":5605,"views":454031,"section":"Didaskalia","transcript":"youtube","added":"2026-11-03","tags":["Historia","Archeologia","Średniowiecze"],"about":"Archeolog tłumaczy, co wykopaliska, datowanie C14 i genetyka mówią o narodzinach państwa Piastów i czemu Kraków mógł być pierwszy.","intro":"Rozmowa Patrycjusza Wyżgi z prof. Andrzejem Buko, archeologiem badającym wczesne średniowiecze (kwiecień 2026). Gość pokazuje, jak nowe metody zmieniają obraz początków Polski: od wielkiej roli Krakowa i Wiślan, przez krótkie życie grodów typu Tornow-Klenica i późne powstanie Gniezna, po handel niewolnikami, datę 966, religię Słowian i genetyczne korzenie Mazowszan.","points":[{"t":"Rewolucja metod","d":"Co roku trwają dziesiątki wykopalisk, a genetyka, badania izotopowe i datowanie radiowęglowe C14 ciągle korygują, a czasem całkiem zmieniają poglądy na początki państwa. Źródeł pisanych z tej epoki jest bardzo mało."},{"t":"Kraków przed Gnieznem","d":"Zdaniem Buko pierwsza próba stworzenia państwa nastąpiła w Małopolsce. Kraków był w X wieku metropolią, a na samym Wawelu najstarszych świątyń jest więcej niż w całej Wielkopolsce. To teza dyskutowana, nie powszechnie przyjęta."},{"t":"Wiślanie i wpływy Moraw","d":"Geograf Bawarski wymienia Wiślan i Lędzian. Wielkie grody nad górną Wisłą i unikatowa biała ceramika krakowska wskazują na związki z Wielkimi Morawami, a może i na napływ ludności z południa."},{"t":"Mieszko nie był Skandynawem","d":"Popularna kiedyś koncepcja nie ma oparcia ani w źródłach, ani w archeologii. Skandynawska broń niczego nie dowodzi, bo mogła być kupiona lub zdobyta, choć część drużyny Mieszka rzeczywiście przybyła z zewnątrz."},{"t":"Zagadka grodów Tornow-Klenica","d":"Na pograniczu Wielkopolski, Śląska i Łużyc w krótkim czasie powstały dziesiątki małych, silnie umocnionych grodów o średnicy ok. 40 m. Po kilkudziesięciu latach, na początku X wieku, prawie wszystkie zniszczono."},{"t":"Gniezno jest późne","d":"Według nowych datowań gród w Gnieźnie powstał ok. lat 30-40. X wieku, a nie w IX wieku, jak sądzono. Wcześniejszy był Giecz, a Poznań mógł być handlową faktorią między nimi. Gdzie wcześniej siedzieli Piastowie, nie wiadomo."},{"t":"Niewolnicy jako towar","d":"Ludność z podbitych grodów prawdopodobnie sprzedawano na południe. Handel niewolnikami był podstawą bogactwa Franków, Bizancjum czy Hiszpanii. Według gościa niewolnik kosztował u nas ok. 34 g srebra, a na południu dziesięć razy więcej."},{"t":"Czy na pewno 966","d":"To data przyjęta umownie: chrzest mógł nastąpić rok czy dwa później, skoro Dobrawa przybyła w 965 roku. Na Ostrowie Lednickim gród i rotundę wznoszono już kilka lat wcześniej, jak pod wielką inwestycję."},{"t":"Chrobry i upadek","d":"Chrobry chciał zbudować mocarstwo i walczył z Niemcami, Czechami i Rusią. Po jego śmierci przyszła reakcja pogańska i upadek pierwszej monarchii, a ośrodek państwa przeniósł się później do Krakowa."},{"t":"Religia Słowian","d":"Słowianie palili zmarłych, więc pierwsze cmentarze szkieletowe sygnalizują chrześcijaństwo. Połabianie mieli świątynie w Arkonie i Radogoszczy, a o autentyczności Światowida ze Zbrucza w Krakowie wciąż się dyskutuje."},{"t":"Geny i dieta Mazowsza","d":"Badania mieszkańców wczesnośredniowiecznego Mazowsza wykazały domieszkę Słowian, Bałtów i ludów azjatyckich, najpewniej Awarów. Proso w diecie wskazuje na przybyszów ze wschodu. Gość marzy o takiej mapie dla każdego regionu."},{"t":"Kim byli Słowianie","d":"Ich kultura materialna to kultura ludzi w drodze, jak u amerykańskich pionierów: proste garnki i półziemianki. Tam, gdzie trafiali na bogatszą cywilizację, jak w Grecji, korzystali z miejscowych dóbr i stawali się mniej widoczni."}],"conclusion":"Fascynujący przegląd tego, jak archeologia przepisuje podręcznikową historię Polski. Warto pamiętać, które tezy są autorskie.","factchecks":[{"claim":"Dobrawa przybyła do Mieszka w 965 roku.","verdict":"prawda","note":"Małżeństwo zawarto w 965 r. i przypieczętowało ono sojusz polsko-czeski przed chrztem w 966 r.","p":7,"src":[["Wikipedia (ang.): Dobrawa - hasło \"Doubravka of Bohemia\"","https://en.wikipedia.org/wiki/Doubravka_of_Bohemia"]]},{"claim":"Geograf Bawarski wymienia Wiślan i Lędzian.","verdict":"prawda","note":"W spisie ludów pojawiają się Uuislane oraz Lendizi.","p":2,"src":[["Wikipedia (ang.): Geograf Bawarski - hasło \"Bavarian Geographer\"","https://en.wikipedia.org/wiki/Bavarian_Geographer"]]},{"claim":"Awarów pokonał Karol Wielki, kończąc ich niemal 300-letnią historię.","verdict":"przesada","note":"Frankowie pokonali Awarów ok. 799-803 r. Kaganat istniał od 567 r., czyli ok. 230-250 lat.","p":10,"src":[["Wikipedia (ang.): Awarowie panońscy - hasło \"Pannonian Avars\"","https://en.wikipedia.org/wiki/Pannonian_Avars"]]},{"claim":"Światowid ze Zbrucza jest przechowywany w Krakowie.","verdict":"prawda","note":"Znaleziony w 1848 r., eksponowany w Muzeum Archeologicznym w Krakowie.","p":9,"src":[["Wikipedia (ang.): Światowid ze Zbrucza - hasło \"Zbruch Idol\"","https://en.wikipedia.org/wiki/Zbruch_Idol"]]}],"bias":"Gość jasno mówi, które tezy są jego, np. pierwszeństwo Krakowa i sprzedaż jeńców z grodów, ale to interpretacje dyskutowane przez badaczy."},{"id":"NDrQaNmJP2g","title_pl":"Prof. Marek Demiański o ciemnej materii, czarnych dziurach i końcu wszechświata","title":"Zderzenia galaktyk, ciemna materia, czy fizyka rozumie wszechświat? II prof. Marek Demiański","channel":"didaskalia","url":"https://www.youtube.com/watch?v=NDrQaNmJP2g","date":"2026-03-29","duration":4264,"views":361793,"section":"Didaskalia","transcript":"youtube","added":"2026-11-03","tags":["Kosmos","Fizyka","Nauka"],"about":"Astrofizyk z UW o tym, jak mało wiemy o wszechświecie, czarnych dziurach w centrach galaktyk, zderzeniach galaktyk i dalekiej przyszłości kosmosu.","intro":"Patrycjusz Wyżga rozmawia z prof. Markiem Demiańskim, astrofizykiem związanym z Uniwersytetem Warszawskim (marzec 2026). Mowa o ciemnej materii i energii, kwantowej grawitacji i teorii strun, czarnej dziurze w centrum Drogi Mlecznej, gwiazdach neutronowych i pochodzeniu złota, przyszłym zderzeniu z Andromedą, pomyśle Penrose'a i o prof. Andrzeju Trautmanie.","points":[{"t":"Znamy tylko 5%","d":"Zwykła materia, z której zbudowane są gwiazdy i my, to ok. 5% zawartości wszechświata. Resztę stanowią ciemna materia i ciemna energia. Gość codziennie rano sprawdza nowe prace, licząc na przełom."},{"t":"Teoria strun ucichła","d":"Połączenia fizyki kwantowej z ogólną teorią względności szuka wiele grup. Teoria strun straciła rozgłos, bo nie dała przewidywania, które dałoby się sprawdzić obserwacją, tak jak zaćmienie Słońca potwierdziło teorię Einsteina."},{"t":"Czarna dziura w naszym centrum","d":"Gwiazdy w centrum Drogi Mlecznej krążą po elipsach wokół czegoś bardzo masywnego, co nie świeci. To czarna dziura o masie ok. 4 mln Słońc. W innych galaktykach są kolosy rzędu miliardów mas Słońca."},{"t":"Gęstsze niż jądro atomu","d":"Jądra atomowe mają gęstość ok. 10^14 g/cm³. Gwiazda neutronowa ma średnicę ok. 20 km, a w jej centrum gęstość jest jeszcze większa."},{"t":"Skąd złoto","d":"Pierwiastki cięższe od żelaza powstają w wybuchach gwiazd, ale obserwacje fal grawitacyjnych pokazały, że bardzo wydajnie tworzą się też przy zlewaniu gwiazd neutronowych. Tak powstaje m.in. złoto, platyna i uran."},{"t":"Andromeda i rozszerzanie","d":"Wszechświat się rozszerza, ale grawitacja trzyma galaktyki, a nawet nas, w całości. Dlatego Droga Mleczna może zbliżać się do Andromedy i kiedyś się z nią zderzyć. To odległa perspektywa."},{"t":"Przeciętna gwiazda, przeciętna galaktyka","d":"Słońce to raczej mniejsza gwiazda, a nasza galaktyka jest dość typowa i leżymy z dala od jej centrum. Galaktyk są setki miliardów, każda ma setki miliardów gwiazd, a planet jest dużo."},{"t":"Zimny koniec i pomysł Penrose'a","d":"W dalekiej przyszłości czarne dziury pochłoną materię, a potem wyparują przez promieniowanie. Zostanie zimna pustka, nie śmierć cieplna. Roger Penrose sądzi, że z niej może narodzić się nowy wszechświat."},{"t":"Od pięciu cząstek do zoo","d":"Gdy gość kończył studia, znano pięć cząstek: elektron, proton, neutron, foton i neutrino. Zderzacze odkryły ich wiele więcej. Natura pozwala na dualizm korpuskularno-falowy, choć to nieintuicyjne."},{"t":"Mars i mgławice","d":"Ulubione obiekty gościa to Mars, gdzie łazikiem steruje jego była studentka, oraz mgławice z końcowych etapów życia gwiazd. Słońce kiedyś spuchnie, ale to sprawa miliardów lat."},{"t":"Trautman i fale grawitacyjne","d":"Rozmowa oddaje hołd prof. Andrzejowi Trautmanowi, który jako młody naukowiec przekonywał, że fale grawitacyjne istnieją, wbrew wątpliwościom samego Einsteina. Doczekał się ich wykrycia."}],"conclusion":"Spokojna, przystępna rozmowa doświadczonego astrofizyka. Dużo podstaw kosmologii, mało sensacji.","factchecks":[{"claim":"Czarna dziura w centrum Drogi Mlecznej ma ok. 4 mln mas Słońca.","verdict":"prawda","note":"Pomiary orbit gwiazd dają ok. 4,1 do 4,3 mln mas Słońca (Sagittarius A*).","p":2,"src":[["Wikipedia (ang.): Sagittarius A* - hasło \"Sagittarius A*\"","https://en.wikipedia.org/wiki/Sagittarius_A*"]]},{"claim":"Słońce pochłonie Ziemię za ok. 4 mld lat.","verdict":"przesada","note":"Życie zniknie wcześniej, ale ewentualne pochłonięcie Ziemi przez czerwonego olbrzyma przewiduje się za ok. 7,6 mld lat, i to niepewnie.","p":9,"src":[["Wikipedia (ang.): Przyszłość Ziemi - hasło \"Future of Earth\"","https://en.wikipedia.org/wiki/Future_of_Earth"]]},{"claim":"Złoto i platyna powstają m.in. przy zlewaniu się gwiazd neutronowych.","verdict":"prawda","note":"Potwierdziły to obserwacje fal grawitacyjnych i kilonowej z 2017 r. (proces r).","p":4,"src":[["Wikipedia (ang.): Zlewanie gwiazd neutronowych - hasło \"Neutron star merger\"","https://en.wikipedia.org/wiki/Neutron_star_merger"]]}],"bias":"Gość wprost oddziela wiedzę od własnych przypuszczeń. Odcinek ma partnera reklamowego (Audioteka)."},{"id":"nVTnC6ZDQZg","title_pl":"Dr Tomasz Miller o czasie, podróżach w czasie, entropii i nieskończonościach","title":"Największe tajemnice wszechświata - Dr Tomasz Miller, didaskalia#178","channel":"didaskalia","url":"https://www.youtube.com/watch?v=nVTnC6ZDQZg","date":"2026-02-22","duration":6085,"views":980325,"section":"Didaskalia","transcript":"youtube","added":"2026-11-03","tags":["Nauka","Fizyka","Matematyka"],"about":"Fizyk matematyczny tłumaczy, czemu czas płynie różnie, czy można podróżować w czasie i ile jest rodzajów nieskończoności.","intro":"Półtoragodzinna rozmowa Patrycjusza Wyżgi z dr. Tomaszem Millerem, fizykiem matematycznym (luty 2026). Czas we względności i fizyce kwantowej, Interstellar i GPS, soczewkowanie grawitacyjne, paradoks bliźniąt, podróże w przeszłość i wszechświat Gödla, strzałka czasu i entropia, początek czasu, a na koniec matematyka: nieskończoności Cantora, liczby p-adyczne i dzielenie przez zero.","points":[{"t":"Czym jest czas","d":"Fizyka definiuje czas operacyjnie, tak jak energię czy siłę. Wielu fizyków uważa, że jego upływ jest iluzją albo zjawiskiem emergentnym. Nie ma jednej rzeki czasu: każdy ma własny strumyk, płynący w tempie zależnym od ruchu."},{"t":"Czas w fizyce kwantowej","d":"Mechanika kwantowa działa na płaskim tle szczególnej teorii względności, więc natury czasu nie wyjaśnia. Są koncepcje czasu termicznego, np. Rovellego i Connesa, ale niepotwierdzone. Kwantowa grawitacja jest wciąż zbyt trudna matematycznie."},{"t":"Interstellar i GPS","d":"Im głębiej w studni grawitacyjnej, tym wolniej płynie czas, jak na planecie Millera w filmie, liczonym zgodnie z OTW przez Kipa Thorne'a. Satelity GPS muszą uwzględniać tę dylatację oraz efekt prędkości, inaczej pozycja byłaby błędna."},{"t":"Soczewki grawitacyjne","d":"Masa zakrzywia drogę światła, więc galaktyki działają jak soczewki. Mikrosoczewkowanie pozwala wykryć nawet samotne planety. Supernowa widoczna potrójnie dotarła w różnym czasie, a astronomowie przewidzieli kolejny obraz."},{"t":"Paradoks bliźniąt","d":"Szczególna teoria względności działa w układach inercjalnych. Brat w rakiecie musi hamować i zawracać, więc symetrii nie ma: prędkości są względne, przyspieszenia nie. To on po powrocie będzie młodszy."},{"t":"Podróż w przyszłość jest możliwa","d":"Wystarczy szybko lecieć albo przebywać blisko masywnego obiektu. Na rowerze zyskujemy pikosekundy, a efekt staje się wielki dopiero przy prędkościach bliskich światłu albo przy czarnej dziurze."},{"t":"Przeszłość i wszechświat Gödla","d":"Do cofania się dylatacja nie wystarczy, potrzebne są zamknięte krzywe czasopodobne. Gödel, przyjaciel Einsteina, znalazł takie rozwiązanie równań OTW. Paradoksy logiczne i entropia sugerują, że w naszym świecie ich nie ma."},{"t":"Entropia i życie","d":"Druga zasada termodynamiki dotyczy układów izolowanych, a Ziemia dostaje energię od Słońca, więc ewolucja jej nie łamie. Organizmy to pompy entropii. Zagadką pozostaje, czemu wczesny wszechświat miał tak niską entropię."},{"t":"Początek czasu","d":"W OTW początek czasu jest jak biegun północny: nie ma nic bardziej na północ. Niektóre teorie kwantowej grawitacji przewidują odbicie zamiast osobliwości, a nawet wszechświaty potomne we wnętrzach czarnych dziur."},{"t":"Wiele nieskończoności","d":"Cantor, precyzując, co znaczy równoliczność zbiorów, odkrył, że są nieskończoności różnej wielkości. Istnieją różne systemy liczb pozaskończonych, więc odpowiedź dla sześciolatka zależy od wybranego systemu."},{"t":"Drabinka liczb i zero","d":"Od naturalnych przez wymierne i rzeczywiste do zespolonych, a obok liczby p-adyczne. Zero pojawiło się późno i budziło nieufność. Dzielenia przez zero lepiej nie definiować, bo wymaga to rezygnacji z innych praw arytmetyki."}],"conclusion":"Jasny, cierpliwy przewodnik po czasie i nieskończoności. Gość uczciwie mówi, czego nie rozumie, a co jest jeszcze spekulacją.","factchecks":[{"claim":"Po 25 latach na stacji kosmicznej przenieślibyśmy się w przyszłość o ok. 2 s.","verdict":"przesada","note":"Na ISS zegar spóźnia się ok. 0,01 s na rok, czyli ok. 0,25 s w 25 lat. Gość zastrzegł, że nie pamięta liczb.","p":5,"src":[["Wikipedia (ang.): dylatacja czasu - hasło \"Time dilation\"","https://en.wikipedia.org/wiki/Time_dilation"]]},{"claim":"Kip Thorne napisał książkę o nauce w filmie Interstellar.","verdict":"prawda","note":"To \"The Science of Interstellar\" (2014), po polsku \"Interstellar i nauka\".","p":2,"src":[["Wikipedia (ang.): Kip Thorne - hasło \"Kip Thorne\"","https://en.wikipedia.org/wiki/Kip_Thorne"]]},{"claim":"Gödel znalazł rozwiązanie równań OTW z zamkniętymi krzywymi czasopodobnymi.","verdict":"prawda","note":"Opublikował je w 1949 r. W jego wszechświecie takie pętle przechodzą przez każde zdarzenie.","p":6,"src":[["Wikipedia (ang.): metryka Gödla - hasło \"Gödel metric\"","https://en.wikipedia.org/wiki/Gödel_metric"]]},{"claim":"Cantor wykazał, że istnieją nieskończoności różnej wielkości.","verdict":"prawda","note":"Udowodnił m.in., że liczb algebraicznych jest przeliczalnie wiele, a przestępnych nieprzeliczalnie.","p":9,"src":[["Wikipedia (ang.): Georg Cantor - hasło \"Georg Cantor\"","https://en.wikipedia.org/wiki/Georg_Cantor"]]}],"bias":"Brak stronniczości. Gość wyraźnie oznacza spekulacje, np. odbicie zamiast Wielkiego Wybuchu czy wszechświaty w czarnych dziurach, i przyznaje się do niewiedzy."},{"id":"S6rqpxVGKZ4","title_pl":"Gdybym mógł robić tylko 25 ćwiczeń - ranking Jeffa Nipparda","title":"The Only 25 Exercises You Ever Need","channel":"Jeff Nippard","url":"https://www.youtube.com/watch?v=S6rqpxVGKZ4","date":"2026-01-13","duration":1395,"views":5602872,"section":"Sport","transcript":"youtube","added":"2026-11-03","tags":["Ciało i zdrowie","Siłownia","Trening"],"about":"Jeff Nippard układa ranking 25 ćwiczeń do zbudowania pełnej sylwetki i przy każdym próbuje pobić rekord.","intro":"Jeff Nippard, trener i kulturysta naturalny, wybiera 25 ćwiczeń, które jego zdaniem wystarczą do zbudowania całej sylwetki. Przy każdym tłumaczy, dlaczego jest na liście, cytuje badania i próbuje pobić własny rekord. Pierwsza dziesiątka to zestaw na wypadek, gdyby ktoś miał czas tylko na 10 ćwiczeń.","points":[{"t":"Zaniedbane mięśnie: łydki, przedramiona, szyja","d":"Wspięcia na palce na stojąco działają według badań lepiej niż na siedząco. Uginania nadgarstków robi w superserii, a szyję radzi trenować bezpośrednio 2 razy w tygodniu po 10-15 powtórzeń, bo martwy ciąg jej nie rozbuduje."},{"t":"Izolacja z kontrolą","d":"Spięcia brzucha na wyciągu łatwo stopniowo dociążać, a butterfly odcina przednie barki z linii ciągu. Rekord liczy się tylko przy tej samej technice i kontrolowanej fazie opuszczania."},{"t":"Pompki na poręczach i hip thrust","d":"Dipy budują klatkę, barki i triceps, ale przy szczypaniu w barku warto pochylić się bardziej i schodzić płycej. Hip thrust lub maszyna daje mocny bodziec pośladkom bez męczenia czworogłowych."},{"t":"Martwy ciąg, OHP i wyciskanie","d":"Nie są najlepsze pod sam przyrost mięśni, ale każdy powinien raz w życiu nauczyć się ich i zrobić się w nich silny. Kluczem jest zapisywanie wyników i dokładanie ciężaru lub powtórzenia co tydzień."},{"t":"Wykroki chodzone","d":"Badań jest mało, ale z jego doświadczenia nic tak nie męczy pośladków. Długi krok to więcej pośladków, krótszy krok z kolanem do przodu to więcej czworogłowych."},{"t":"Top 10: nogi","d":"Uginanie nóg na siedząco dało w badaniu ok. 50% więcej przyrostu dwugłowych niż na leżąco. Prostowanie nóg z odchylonym oparciem najlepiej trafia w mięsień prosty uda i jest bezpieczne dla kolan."},{"t":"Top 10: ręce i barki","d":"Prostowanie ramion nad głową dało ok. 40% więcej przyrostu tricepsa niż prostowanie na wyciągu w dół. Uginanie na modlitewniku trudno oszukać, a unoszenia bokiem najlepiej robić na wyciągu."},{"t":"Top 5: wiosłowanie, RDL, skos","d":"Wiosłowanie z podparciem klatki chroni lędźwie przed byciem ograniczeniem. Rumuński martwy ciąg mniej męczy niż klasyczny, a wyciskanie na ławce skośnej 20-45 stopni łączy pracę barków i klatki."},{"t":"Podciąganie i przysiad","d":"Podciąganie trudno oszukać, a na start nie ma wstydu w asyście. Numer 1 to przysiad, bo większość masy mięśniowej jest w nogach; w dowolnej wersji, uzupełniony o uginanie i prostowanie nóg."}],"conclusion":"Prawie każde ćwiczenie działa, jeśli robisz je ciężko, z dobrą techniką i stopniowo dokładasz ciężar.","factchecks":[{"claim":"Wspięcia na palce na stojąco są skuteczniejsze dla łydek niż na siedząco.","verdict":"prawda","note":"Badanie z 2023: przyrost łydki 5,6% na stojąco vs 2,1% na siedząco, płaszczkowaty podobnie.","p":0,"src":[["PubMed: Kinoshita i wsp. 2023 - \"Triceps surae muscle hypertrophy is greater after standing versus seated calf-raise training\"","https://pubmed.ncbi.nlm.nih.gov/38156065/"]]},{"claim":"Prostowanie nad głową dało ok. 40% więcej przyrostu tricepsa niż prostowanie w dół.","verdict":"prawda","note":"Maeo i wsp. 2023: cały triceps +19,9% vs +13,9%, czyli ok. 1,4 raza więcej.","p":6,"src":[["PubMed: Maeo i wsp. 2023 - \"Triceps brachii hypertrophy is substantially greater after elbow extension training performed in the overhead arm position\"","https://pubmed.ncbi.nlm.nih.gov/35819335/"]]},{"claim":"Głównym problemem w bezdechu sennym jest tłuszcz w języku, a nie trening szyi.","verdict":"półprawda","note":"Tłuszcz w języku jest ważnym czynnikiem bezdechu, a jego spadek łączy się z poprawą, ale nie jest jedyną przyczyną.","p":0,"src":[["PubMed: Kim i wsp. 2014 - \"Tongue fat and its relationship to obstructive sleep apnea\"","https://pubmed.ncbi.nlm.nih.gov/25197815/"],["PubMed: Wang i wsp. 2020 - \"Effect of Weight Loss on Upper Airway Anatomy and the Apnea-Hypopnea Index\"","https://pubmed.ncbi.nlm.nih.gov/31918559/"]]},{"claim":"Mężczyźni mają w nogach ponad połowę masy mięśniowej (MRI).","verdict":"prawda","note":"Badanie MRI 468 osób (Janssen 2000) potwierdza, że większość mięśni szkieletowych jest w dolnej części ciała.","p":8,"src":[["PubMed: Janssen i wsp. 2000 - \"Skeletal muscle mass and distribution in 468 men and women aged 18-88 yr\"","https://pubmed.ncbi.nlm.nih.gov/10904038/"]]}],"bias":"Ranking opiera się częściowo na osobistych preferencjach, co autor sam przyznaje. Dwa długie wtrącenia reklamują jego aplikację MacroFactor."},{"id":"MgswDy8PMAA","title_pl":"Czym jest rachatłukum? Prawdziwy osmański przepis","title":"What is Turkish Delight? How to make real Ottoman Turkish Delight.","channel":"Tasting History with Max Miller","url":"https://www.youtube.com/watch?v=MgswDy8PMAA","date":"2025-12-09","duration":1379,"views":4036962,"section":"Historia","transcript":"youtube","added":"2026-11-03","tags":["Historia"],"about":"Max Miller robi rachatłukum według osmańskiego przepisu z 1844 r. i opowiada historię słodyczy od pałacu sułtana po Narnię.","intro":"Max Miller z Tasting History zaczyna od Edmunda z Opowieści z Narnii, który zdradza rodzeństwo za rachatłukum. Gotuje słodycz według przepisu Mehmeda Kâmila z 1844 r., z wodą różaną i piżmem, a w trakcie opowiada o teoriach pochodzenia, cukierniku Hacı Bekirze, sporze z Grekami, relacjach podróżników i podróbkach z Anglii.","points":[{"t":"Edmund i Narnia","d":"Akcja Lwa, czarownicy i starej szafy toczy się w czasie wojny, gdy cukier w Wielkiej Brytanii był racjonowany. Nic dziwnego, że Edmund chciał kawałka cukru obsypanego cukrem pudrem."},{"t":"Przepis z 1844 r.","d":"Po osmańsku słodycz nazywała się rahat ul-hulkum, \"ukojenie gardła\". Długo tajne pałacowe przepisy ujawnił w 1844 r. Mehmed Kâmil: syrop z 1 kg cukru i 3 kg wody, skrobia, woda różana z ziarnkiem piżma, tacka natłuszczona olejem migdałowym i obtoczenie w skrobi z cukrem pudrem."},{"t":"Wersja domowa","d":"Autor zmniejsza przepis do 700 g cukru, 350 ml wody, 3,5 g kwasku cytrynowego (zapobiega krystalizacji), 140 g skrobi w 1 l wody, łyżki wody różanej i 1/8 łyżeczki płynnego piżma spożywczego, które pachnie mu jak czyste pranie."},{"t":"Godziny mieszania","d":"Syrop podgrzewa się powoli do ok. 121°C (stadium twardej kuli), dodaje rozmieszaną skrobię i gotuje na małym ogniu 1,5-2 godziny, aż masa zrobi się bursztynowa. Dawniej 2 osoby mieszały na zmianę 2-3 godziny; potem masę studzi się w formie 28 x 18 cm co najmniej 5 godzin."},{"t":"Lekarstwo czy pudding","d":"W XV w. na Bliskim Wschodzie lokum oznaczało leki mieszane z cukrem i wodą różaną, a z czasem lek usunięto. Inna teoria wywodzi słodycz od budyniu helva, a legenda przypisuje ją XVII-wiecznemu poecie Nevizâde Atâyî; autor zaznacza, że dokumentów na to brak."},{"t":"Hacı Bekir","d":"Firma cukiernika Hacı Bekira, działająca do dziś, twierdzi, że współczesną wersję wymyślił w 1777 r. w Stambule. Sułtan Mahmud II tak lubił jego różaną, pomarańczową i pistacjową wersję, że mianował go nadwornym cukiernikiem."},{"t":"Spór z Grekami","d":"Grecy twierdzą, że słodycz wymyślono na Cykladach. Według autora raczej przywieźli ją uchodźcy z Chios na Syros w latach 20. XIX w.; w 1832 r. było tam już kilku producentów loukoumi z mastyksem."},{"t":"Relacje podróżników","d":"Lekarz marynarki USA James De Kay w latach 30. XIX w. zachwycał się masą, która rozpływa się w ustach, a markiza Londonderry nie odważyła się spróbować \"lumps of delight\". Ta angielska nazwa przyjęła się, a u Dickensa w Tajemnicy Edwina Drooda Rosa kupuje je w sklepie."},{"t":"Podróbki z żelatyną","d":"Import był drogi, więc w Anglii robiono podróbki, np. przepis z 1897 r. z żelatyną, przez co słodycz była gumowata. W 1888 r. w procesie o podrabiane rachatłukum sędzia był \"boleśnie zaskoczony\", że nie pochodzi ono z Turcji."},{"t":"Ocena","d":"Prawdziwe rachatłukum trzeba ugryźć raz czy dwa i zaczyna się rozpuszczać. Piżmo według autora równoważy mydlany posmak wody różanej; poleca też wersje z pistacjami, wanilią czy wodą z kwiatu pomarańczy."}],"conclusion":"Prawdziwe rachatłukum nie ma żelatyny i rozpływa się w ustach; najlepiej kupić je w Turcji lub Grecji albo zrobić samemu.","factchecks":[{"claim":"W czasie II wojny światowej cukier w Wielkiej Brytanii był racjonowany.","verdict":"prawda","note":"Cukier objęto kartkami od stycznia 1940 r. do 1953 r.","p":0,"src":[["Wikipedia (ang.): racjonowanie w Wielkiej Brytanii - hasło \"Rationing in the United Kingdom\"","https://en.wikipedia.org/wiki/Rationing_in_the_United_Kingdom"]]},{"claim":"Mehmed Kâmil wydał w 1844 r. jedną z pierwszych osmańskich książek kucharskich.","verdict":"prawda","note":"Melceü't-Tabbâhîn z 1844 r. uchodzi za pierwszą drukowaną turecką książkę kucharską.","p":1,"src":[["Wikipedia (ang.): kuchnia osmańska - hasło \"Ottoman cuisine\"","https://en.wikipedia.org/wiki/Ottoman_cuisine"]]},{"claim":"Firma Hacı Bekira istnieje od 1777 r. i twierdzi, że stworzyła współczesne rachatłukum.","verdict":"prawda","note":"Firma działa do dziś; jej rola jako wynalazcy to tradycja rodzinna, bez pewnych dokumentów.","p":5,"src":[["Wikipedia (ang.): rachatłukum - hasło \"Turkish delight\"","https://en.wikipedia.org/wiki/Turkish_delight"]]},{"claim":"\"Lumps of delight\" pojawiają się w Tajemnicy Edwina Drooda Dickensa.","verdict":"prawda","note":"Scena z Rosą Bud jest w 3. rozdziale ostatniej, niedokończonej powieści Dickensa (1870).","p":7,"src":[["Projekt Gutenberg: Tajemnica Edwina Drooda (tekst ang.)","https://www.gutenberg.org/ebooks/564"]]},{"claim":"Rupert Holmes napisał musical Edwin Drood i piosenkę Escape.","verdict":"prawda","note":"Musical z 1985 r. ma kilka zakończeń wybieranych przez widzów; Escape to przebój z 1979 r.","p":null,"src":[["Wikipedia (ang.): Rupert Holmes - hasło \"Rupert Holmes\"","https://en.wikipedia.org/wiki/Rupert_Holmes"]]}],"bias":"Rzetelny i ostrożny przy legendach o pochodzeniu; dygresje (musical) i dłuższa reklama garnka."},{"id":"MT9ZeE5JJsI","title_pl":"7 rzeczy, które pomogły barkom Jeffa Nipparda rosnąć","title":"7 Things That Helped My Shoulders Grow","channel":"Jeff Nippard","url":"https://www.youtube.com/watch?v=MT9ZeE5JJsI","date":"2025-12-01","duration":846,"views":3850023,"section":"Sport","transcript":"youtube","added":"2026-11-04","tags":["Ciało i zdrowie","Siłownia","Trening"],"about":"Jeff Nippard: cue od trapów, częstotliwość, ciężki press, niższa waga, różne długości mięśnia, progresja i 7 segmentów delty.","intro":"Siedem tipów na \"3D delts\" od Jeffa Nipparda: wyłączanie trapów cue o łopacie, częstszy trening barków, brutalnie silny shoulder press, obniżenie talii (niska tkanka tłuszczowa), praca w skróceniu i wydłużeniu, dopasowana progresja obciążenia oraz celowanie we wszystkie segmenty delty z anatomii kadawerów.","points":[{"t":"Wyłącz trapy cue o łopacie","d":"Wyobraź sobie długą łopatę i zgarnianie piasku na bok: barki w dół, zamach na bok zamiast szrugu. W improwizowanym teście na siłowni każdy czuł więcej side delt przy tym cue niż przy \"po prostu podnieś\"."},{"t":"Trenuj barki częściej","d":"Ankieta widzów: większość 2x/tydzień, tylko 11% 3x, 4% więcej. Efektywna objętość na sesję kapuje ok. 6-8 serii (meta nawet do 11, ale z malejącymi zwrotami). Lepiej rozłożyć na 3-4 dni; izolacje wracają w 24-48 h."},{"t":"Brutalnie silny shoulder press","d":"Maszyna, hantle lub sztanga: 5-6 powtórzeń, dokładaj co tydzień przez rok. Napięcie mechaniczne napędza hipertrofię. EMG autora: na jego maszynie więcej side niż front delt; press uzupełnia laterale, które trudno dociążać w nieskończoność."},{"t":"Obniż talię","d":"Porównanie 20% vs 9% BF: przy niższej wadze barki wyglądają szersze i bardziej 3D przez mniejszy obwód talii i mniej tłuszczu na delcie. Według autora to największy efekt wizualny z całej listy."},{"t":"Różne długości mięśnia","d":"Badania na quadach, bicepsie i łydkach: 130-190% więcej wzrostu przy dłuższej długości. Na deltach 8-tyg. kabel vs hantel bez różnicy. Fix: głębiej w pressie, kabel cross-body, Y raise, tylne delty z przekroczeniem środka."},{"t":"Progresja pod ćwiczenie","d":"Press: liniowo +2-5 kg przy stałych 5-6 powtórzeniach, deload co 4-8 tygodni. Laterale: double progression 10-12, potem ciężar. Gdy forma pada - zmień narzędzie (hantel→kabel→maszyna) i zacznij progresję od nowa."},{"t":"Siedem segmentów delty","d":"Badanie 60 kadawerów: zamiast 3 głów - 7 segmentów z osobnymi ścięgnami (przód 3, środek 1, tył 3). Dodaj płaszczyzny pośrednie: incline DB Y raise (A2/A3), 45° cable rear pull jak wyciąganie strzały (P1/P2)."}],"conclusion":"Częściej, ciężki press, mniej tłuszczu na talii i świadoma praca we wszystkich płaszczyznach barku dają więcej niż same laterale.","factchecks":[{"claim":"Deltoid ma więcej niż trzy klasyczne głowy: badanie kadawerów wskazuje segmenty.","verdict":"prawda","note":"Anatomia opisuje przednią, boczną i tylną głowę; prace kadawerowe wyróżniają dodatkowe segmenty funkcjonalne.","p":6,"src":[["Wikipedia (ang.): mięsień naramienny - hasło \"Deltoid muscle\"","https://en.wikipedia.org/wiki/Deltoid_muscle"]]},{"claim":"Napięcie mechaniczne to główny bodziec hipertrofii; progresywne przeciążenie jest kluczowe.","verdict":"prawda","note":"Progresywne przeciążenie i napięcie mechaniczne są centralne w modelach hipertrofii.","p":[2,5],"src":[["Wikipedia (ang.): hipertrofia - hasło \"Hypertrophy\"","https://en.wikipedia.org/wiki/Hypertrophy"],["Wikipedia (ang.): progresywne przeciążenie - hasło \"Progressive overload\"","https://en.wikipedia.org/wiki/Progressive_overload"]]},{"claim":"Dłuższa długość mięśnia daje 130-190% więcej wzrostu (quady, biceps, łydki).","verdict":"półprawda","note":"Kierunek efektu lengthened training jest wspierany, ale konkretne procenty zależą od badań i nie uogólniają się 1:1 na delty.","p":4,"src":[["Wikipedia (ang.): hipertrofia mięśniowa - hasło \"Hypertrophy\"","https://en.wikipedia.org/wiki/Hypertrophy"]]},{"claim":"Po 6-8 seriach na mięsień w jednej sesji zwroty mocno maleją.","verdict":"półprawda","note":"Są meta-analizy o malejących zwrotach objętości, ale próg \"6-8\" to heurystyka, nie uniwersalne prawo.","p":1,"src":[["PubMed: Pelland i wsp. - meta-regresja objętości i hipertrofii","https://pubmed.ncbi.nlm.nih.gov/41343037/"]]}],"bias":"Dwa długie bloki reklamują MacroFactor i zapowiedź MacroFactor Workouts (styczeń 2026). Tip o \"talii\" to głównie redukcja, nie trening barków."},{"id":"DzjWEn2BS_k","title_pl":"Obciąłem liczbę serii o połowę - co wyszło po 100 dniach","title":"I Cut The Number Of Sets I Do In Half","channel":"Jeff Nippard","url":"https://www.youtube.com/watch?v=DzjWEn2BS_k","date":"2025-10-13","duration":1210,"views":3652369,"section":"Sport","transcript":"youtube","added":"2026-11-04","tags":["Ciało i zdrowie","Siłownia","Trening"],"about":"Jeff Nippard przez 100 dni na redukcji robił 1-2 serie na ćwiczenie. Siła i DEXA vs klasyczne 10-20 serii/mięsień/tydzień.","intro":"Eksperyment N=1: zamiast 3-4 serii na ruch autor robił 1-2 serie do upadku przez 100 dni na deficycie. Średnio ok. 6,5 serii na mięsień tygodniowo (split upper/lower/rest/upper/lower/arms). Porównuje to z wytycznymi 10-20 serii, meta-analizami objętości i własnymi wynikami DEXA oraz PR.","points":[{"t":"Co zmienił","d":"Z 3-4 serii na ćwiczenie do 1-2; klatka przykładowo 6 serii/tydzień zamiast 10-20. Średnio ~6,5 serii/mięsień/tydzień (barki 10, plecy 9, pośladki 9, quady 8). Split: upper, lower, rest, upper, lower, arms, rest przez 14 tygodni."},{"t":"Volume is king?","d":"Krieger 2010: 2-3 serie ~40% skuteczniejsze niż 1. 2016: dawka tygodniowa. Pelland: 35 badań, dawka od 4 do 43 serii z malejącymi zwrotami. Krytyka: edema, zwykle 1-2 mięśnie naraz, utrzymanie kalorii, krótkie interwencje 6-12 tygodni."},{"t":"Utrzymanie vs budowa","d":"Bickel: po 16 tyg. wysokiej objętości nóg redukcja do 1 serii/ćwiczenie 1x/tydzień (z 27 do 3) utrzymała rozmiar i siłę przez 32 tygodnie u młodych. Nowe badanie Herman: 2x full body, 1 seria, ~30 min; obie grupy rosły, failure lepiej."},{"t":"Intensywność przy niskiej objętości","d":"Przy małej liczbie serii prawie każda do upadku. Meta Robinson: bliżej failure = więcej hipertrofii. Przy wysokiej objętości ciągły failure podnosi zmęczenie i ryzyko. Autor nazywa to focus effect: wiesz, że masz 1-2 serie."},{"t":"Wyniki 100 dni","d":"Na redukcji: -ok. 2,5 kg tłuszczu i -ok. 0,8 kg masy chudej (DEXA; lean to też woda). Od dnia 30 do 100: +ok. 0,2 kg lean i -ok. 1 kg tłuszczu. Waga ~3 kg niższa, a wygląd \"pełniejszy\". PR na pendulum squat i chest press; leg extension +ok. 7 kg, bench Smith bez zmian."},{"t":"Nowa rekomendacja autora","d":"Na redukcji: niska objętość, wysoka intensywność. Na masie: nisko na większości mięśni, a jeden \"blast\" 10-20 (nawet 30) serii i rotacja co kilka miesięcy. Promuje program Minmax i MacroFactor."}],"conclusion":"Na deficycie 1-2 ciężkie serie mogą utrzymać mięśnie i siłę; objętość nie jest jedynym królem, jeśli trenujesz blisko upadku.","factchecks":[{"claim":"Meta Pelland (35 badań): więcej serii tygodniowo = więcej hipertrofii, z malejącymi zwrotami.","verdict":"prawda","note":"Meta-regresja 2024/25 potwierdza dodatnią zależność objętości i hipertrofii z diminishing returns.","p":1,"src":[["PubMed: Pelland i wsp. - Resistance Training Dose Response","https://pubmed.ncbi.nlm.nih.gov/41343037/"],["SportRXiv: preprint meta-regresji objętości Pelland","https://doi.org/10.51224/srxiv.460"]]},{"claim":"Bickel: redukcja z 27 do 3 serii/tydzień utrzymała mięśnie i siłę 32 tygodnie.","verdict":"półprawda","note":"U młodych 1/9 objętości utrzymało hipertrofię; u starszych sama siła trzymała się lepiej niż rozmiar.","p":2,"src":[["PubMed: Bickel i wsp. 2011 - Exercise dosing to retain RT adaptations","https://pubmed.ncbi.nlm.nih.gov/21131862/"]]},{"claim":"Im bliżej failure, tym więcej hipertrofii (meta Robinson).","verdict":"półprawda","note":"Bliskość do upadku pomaga, zwłaszcza przy niskiej objętości, ale nie zastępuje sensownej dawki i regeneracji.","p":3,"src":[["Wikipedia (ang.): hipertrofia - hasło \"Hypertrophy\"","https://en.wikipedia.org/wiki/Hypertrophy"]]},{"claim":"Autor stracił 5,5 lb tłuszczu i 1,8 lb lean przy niskiej objętości na redukcji.","verdict":"nie da się sprawdzić","note":"To N=1 z własnych skanów DEXA; wiarygodne jako anegdota, nie jako dowód populacyjny.","p":4,"src":[["Wikipedia (ang.): hipertrofia - hasło \"Hypertrophy\"","https://en.wikipedia.org/wiki/Hypertrophy"]]}],"bias":"Reklama Minmax (25% off) i MacroFactor. Narracja N=1 na redukcji; wyniki DEXA i PR nie zastępują RCT. Autor wcześniej chwalił wysoką objętość."},{"id":"NtZaP8VMv0c","title_pl":"Astronauta NASA sprawdził na ISS moją teorię o łańcuszku","title":"NASA tested my chain theory in space","channel":"Steve Mould","url":"https://www.youtube.com/watch?v=NtZaP8VMv0c","date":"2025-10-10","duration":903,"views":15440952,"section":"Ciekawostki","transcript":"whisper","added":"2026-11-03","tags":["Fizyka","Kosmos"],"about":"Steve Mould łączy się z Donem Pettitem na ISS, by w nieważkości sprawdzić brakujący element
