ine_communications_cable"]]}],"bias":"Popularnonaukowy top-lista bez dat i nazwisk przy części punktów; uproszczenia historyczne pod narrację \"niewidzialnych wynalazków\"."},{"id":"cDIJDFlNkfY","title_pl":"Prof. Rafał Szabla: jak powstało życie na Ziemi i czy jest gdzie indziej","title":"Kosmos tętni życiem. Jak powstało życie na Ziemi? II prof. Rafał Szabla","channel":"didaskalia","url":"https://www.youtube.com/watch?v=cDIJDFlNkfY","date":"2026-07-12","duration":5764,"views":467840,"section":"Didaskalia","transcript":"youtube","added":"2026-11-03","tags":["Nauka","Kosmos","Chemia"],"about":"Chemik teoretyk o tym, z jakich cegiełek i w jakich warunkach mogło powstać życie, i gdzie w kosmosie warto go szukać.","intro":"Patrycjusz Wyżga rozmawia z prof. Rafałem Szablą, chemikiem teoretykiem badającym chemię początków życia. Od dysku protoplanetarnego i roli wody, przez organikę z komet, ostatniego wspólnego przodka i świat RNA, po fosfinę na Wenus, życie w kwasie siarkowym, fotosyntezę, tlen i paradoks Fermiego.","points":[{"t":"Przepis zapisany w dysku","d":"Skład planet przesądza pierwsze ok. 10 mln lat, gdy wokół młodej gwiazdy krąży dysk protoplanetarny. To, jak rozłożą się w nim związki chemiczne, decyduje, co potem znajdzie się na planetach. Ziemia trafiła w dobry punkt."},{"t":"Dlaczego woda","d":"Cząsteczka wody jest polarna, z lekko ujemnym i lekko dodatnim końcem. Dzięki temu jest świetnym rozpuszczalnikiem i pozwala na wielką różnorodność reakcji w protokomórkach."},{"t":"Cegiełki z kosmosu","d":"W kometach i meteorytach znaleziono m.in. aminokwasy i proste cukry. Organika mogła trafić na Ziemię w okresie bombardowania, po uformowaniu się skalistej planety."},{"t":"Wiele kałuż, nie jedna","d":"Ok. 3,8 mld lat temu warunki mogły sprzyjać powstaniu życia na dużej części planety. Samo przejście od chemii do protokomórki trwało zapewne krótko w skali wieku Ziemi, może ok. miliona lat."},{"t":"LUCA i świat RNA","d":"Ostatni wspólny przodek (LUCA) był już złożony. Bez enzymów skutecznie kopiuje się tylko RNA, co pokazują m.in. badania laboratorium Jacka Szostaka. Dlatego RNA uważa się za kandydata na pierwszą cząsteczkę życia."},{"t":"Mars: nie wiemy","d":"Mars leży na granicy strefy zamieszkiwalnej i ma wodę. Życia tam nie znaleziono, ale nie da się wykluczyć, że istnieje. Nigdy jeszcze nie przywieziono na Ziemię próbek pobranych na Marsie."},{"t":"Fosfina na Wenus","d":"W 2020 r. ogłoszono wykrycie w chmurach Wenus fosfiny (PH3), na Ziemi gazu pochodzenia biologicznego. Gość jest sceptyczny co do życia w chmurach kwasu siarkowego, choć nie da się go dziś wykluczyć."},{"t":"Cyjanowodór i UV","d":"W wielu dyskach protoplanetarnych jest dużo HCN, trującego dla nas, ale cennego w prebiotycznej chemii. Promieniowanie UV mogło selekcjonować najtrwalsze cegiełki życia. Gość współtworzył o tym pracę w Nature z zespołem Johna Sutherlanda."},{"t":"Tlen zmienił wszystko","d":"Fotosynteza tlenowa była szokiem dla wcześniejszych organizmów beztlenowych. Oddychanie tlenem daje dużo więcej energii, więc atmosfera tlenowa jest prawdopodobnie potrzebna do złożonych organizmów i łańcuchów pokarmowych."},{"t":"Gdzie szukać i paradoks Fermiego","d":"Dobre kandydatki to skaliste planety od rozmiaru Ziemi po superziemie oraz skaliste księżyce gazowych olbrzymów. Teleskop Webba szuka biosygnatur w atmosferach. Brak kontaktu może wynikać z tego, że cywilizacje trwają krótko."}],"conclusion":"Rzetelna, ostrożna rozmowa o granicach wiedzy. Gość jasno oddziela ustalenia od własnych przypuszczeń.","factchecks":[{"claim":"W chmurach Wenus wykryto fosfinę.","verdict":"półprawda","note":"Ogłoszono to w 2020 r., ale wynik zakwestionowano i do dziś jest sporny. W filmie pada też zastrzeżenie, że to niepewne.","p":6,"src":[["Wikipedia (ang.): Życie na Wenus - hasło \"Life on Venus\"","https://en.wikipedia.org/wiki/Life_on_Venus"]]},{"claim":"Nigdy nie badaliśmy na Ziemi próbek z Marsa.","verdict":"półprawda","note":"Nie przywieziono próbek pobranych na Marsie, ale badamy ponad 270 meteorytów marsjańskich.","p":5,"src":[["Wikipedia (ang.): Meteoryt marsjański - hasło \"Martian meteorite\"","https://en.wikipedia.org/wiki/Martian_meteorite"]]},{"claim":"Badaliśmy próbki z komet.","verdict":"prawda","note":"Sonda Stardust dostarczyła na Ziemię w 2006 r. pył z komety Wild 2.","p":2,"src":[["Wikipedia (ang.): Stardust - hasło \"Stardust (spacecraft)\"","https://en.wikipedia.org/wiki/Stardust_(spacecraft)"]]}],"bias":"Ostrożny przekaz naukowy. Teza o krótkim trwaniu cywilizacji i liczbach planet podobnych do Ziemi to spekulacje rozmówców."},{"id":"NxQU8EmHxiw","title_pl":"Luki w historii, których wciąż nie rozumiemy","title":"Hidden Gaps In History We Still Don’t Understand","url":"https://www.youtube.com/watch?v=NxQU8EmHxiw","date":"2026-07-10","duration":811,"views":1066775,"transcript":"youtube","added":"2026-11-03","tags":["Historia"],"about":"10 luk w historii, których według autora wciąż nie rozumiemy, od roku 536 po Sumeryjską listę królów.","intro":"Ranking 10 historycznych zagadek, których według autora wciąż nie umiemy wyjaśnić. Od roku 536, gdy mgła zasłoniła słońce, przez jezioro pełne szkieletów w Himalajach, upadek epoki brązu, rzymskie dwunastościany i miedziany zwój ze skarbami, po zamknięte japońskie grobowce, wymarłą roślinę sylfion, zaginione miasto Akad, koniec Normanów na Grenlandii i niemożliwe liczby z sumeryjskiej listy królów.","points":[{"t":"10. Najgorszy rok w historii (536)","d":"W 536 r. gęsta mgła zasłoniła słońce na 18 miesięcy, a temperatura na półkuli północnej spadła o 2,5°C; plony padły, w Chinach latem spadł śnieg. Rdzenie lodowe z Grenlandii i Antarktydy pokazują popiół wulkaniczny, ale nie wiadomo, który wulkan. W 541 r. przyszła dżuma Justyniana."},{"t":"9. Jezioro Szkieletów (Roopkund)","d":"Jezioro Roopkund na ok. 4900 m, latem z lodu wypływają kości. Odkrył je brytyjski strażnik w 1942 r. Szkielety ok. 500 osób mają takie same okrągłe pęknięcia czaszki od uderzenia z góry, więc teoria to grad wielkości piłek do krykieta. DNA pokazało dwie grupy: z Azji Południowej (ok. 800 r.) i śródziemnomorską (ok. 1800 r.)."},{"t":"8. Upadek epoki brązu","d":"Ok. 1200 r. p.n.e. w ciągu kilkudziesięciu lat upadli Mykeńczycy i Hetyci, a Egipt ledwo przetrwał; ludność Grecji spadła o ok. 75%. Trzęsienia ziemi, susza, Ludy Morza i choroby osobno nie wystarczają. Najlepsza teoria według autora to zerwanie łańcuchów dostaw (miedź z Cypru, zboże z Egiptu, drewno z Libanu)."},{"t":"7. Rzymski dwunastościan","d":"W Europie znaleziono ponad 100 pustych brązowych obiektów o 12 pięciokątnych ściankach z otworami od piłki golfowej do grejpfruta, często zakopanych z monetami. Żaden rzymski tekst, obraz ani rzeźba ich nie pokazuje. Teorie: świeczniki, przyrządy miernicze, kości do gry, narzędzia do dziergania rękawiczek."},{"t":"6. Miedziany Zwój","d":"W 1952 r. w jaskiniach nad Morzem Martwym znaleziono zwój z miedzi z listą 64 miejsc, gdzie miało być zakopane ok. 65 ton złota i srebra, dziś ponad 1 mld dolarów. Wskazówki odnoszą się do nieistniejących punktów. Może to spis skarbów świątyni ukrytych przed zburzeniem Jerozolimy w 70 r., może symbol albo żart; nic nie znaleziono."},{"t":"5. Zamknięte grobowce Kofun","d":"Japonia ma ponad 160 tys. kurhanów kofun z lat 300-700, a największy, Daisen, ma większą powierzchnię niż Wielka Piramida. Agencja Dworu Cesarskiego nie pozwala na wykopaliska \"z szacunku dla zmarłych\". Część historyków podejrzewa, że pokazałyby powiązania z Koreą lub Chinami."},{"t":"4. Sylfion","d":"Roślina rosła tylko na wąskim pasie wybrzeża dzisiejszej Libii i nie dało się jej uprawiać gdzie indziej. Rzymianie płacili za nią srebrem na wagę, a Juliusz Cezar trzymał ok. 680 kg w skarbcu. Ostatnią łodygę w I w. dostał Neron, a dokładny gatunek jest nieznany."},{"t":"3. Zaginione miasto Akad","d":"Ok. 2300 r. p.n.e. Sargon z Akadu stworzył pierwsze imperium, a jego stolica Akad jest dobrze opisana w tekstach: królowie, prawa, gospodarka. Mimo ponad 100 lat poszukiwań w Iraku i Syrii miasta nie znaleziono. Może leżeć pod Bagdadem albo zostało zmyte i zasypane mułem przez Tygrys; imperium upadło ok. 2150 r. p.n.e."},{"t":"2. Zniknięcie Normanów z Grenlandii","d":"Ok. 985 r. Eryk Rudy nazwał lodową wyspę Grenlandią, żeby przyciągnąć osadników, a w szczycie żyło tam ok. 5000 Normanów. Ostatni zapis z 1408 r. to opis ślubu, a w XVI w. Europejczycy zastali ruiny. Teoria: mała epoka lodowa, odrzucenie sposobów Inuitów, upadek rynku kości morsa i wyjazd młodych na Islandię."},{"t":"1. Sumeryjska lista królów","d":"Gliniane tabliczki sprzed ok. 4000 lat wymieniają królów Sumeru sprzed potopu z panowaniami po 43 200, 36 000 i 28 800 lat, łącznie ponad 240 tys. lat. Po potopie liczby spadają do 1200, 900, 300 i w końcu do normalnych. To był oficjalny dokument państwowy, a potop przypomina ten z Biblii i Eposu o Gilgameszu."}],"conclusion":"Nawet dobrze opisane cywilizacje mają luki, a niektóre zagadki mogą pozostać nierozwiązane na zawsze.","factchecks":[{"claim":"Rok 536: mgła zasłoniła słońce, zimno i głód.","verdict":"prawda","note":"Potwierdzają to rdzenie lodowe, słoje drzew i relacja Prokopiusza.","src":[["Wikipedia (ang.): zima wulkaniczna 536 r. - hasło \"Volcanic winter of 536\"","https://en.wikipedia.org/wiki/Volcanic_winter_of_536"],["Science: najgorszy rok w historii","https://www.science.org/content/article/why-536-was-worst-year-be-alive"]],"p":0},{"claim":"Roopkund: dwie grupy zginęły ok. 1000 lat od siebie, wszyscy od gradu.","verdict":"półprawda","note":"DNA (2019) pokazało grupy z VII-X w. i XVII-XX w., co podważa tezę o jednym gradobiciu.","src":[["Harney i in. 2019, Nature Communications","https://www.nature.com/articles/s41467-019-11357-9"],["Wikipedia (ang.): jezioro Roopkund - hasło \"Roopkund\"","https://en.wikipedia.org/wiki/Roopkund"]],"p":1},{"claim":"Upadek epoki brązu: upadły niemal wszystkie państwa naraz.","verdict":"półprawda","note":"Upadli Hetyci, Mykeny i Ugarit, ale Egipt i Asyria przetrwały osłabione.","src":[["Wikipedia (ang.): upadek epoki brązu - hasło \"Late Bronze Age collapse\"","https://en.wikipedia.org/wiki/Late_Bronze_Age_collapse"]],"p":2},{"claim":"Rzymskie dwunastościany: żaden tekst o nich nie wspomina.","verdict":"prawda","note":"Znaleziono ponad 100 egzemplarzy, głównie w północno-zachodniej części imperium; brak wzmianek w tekstach, a funkcja jest nieznana.","src":[["Wikipedia (ang.): rzymski dwunastościan - hasło \"Roman dodecahedron\"","https://en.wikipedia.org/wiki/Roman_dodecahedron"]],"p":3},{"claim":"Miedziany Zwój: 1952, 64 skrytki, niczego nie znaleziono.","verdict":"prawda","note":"Zgodne ze źródłami. Badacze spierają się, czy to realna lista skarbów Świątyni, czy folklor.","src":[["Wikipedia (ang.): Miedziany Zwój - hasło \"Copper Scroll\"","https://en.wikipedia.org/wiki/Copper_Scroll"]],"p":4},{"claim":"Kofun: ponad 160 tys. kurhanów, Daisen większy od Wielkiej Piramidy, zakaz badań.","verdict":"prawda","note":"Daisen jest większy od Wielkiej Piramidy, ale od 2018 r. dopuszczono ograniczone wykopaliska.","src":[["Wikipedia (ang.): kurhan Daisen - hasło \"Daisen Kofun\"","https://en.wikipedia.org/wiki/Daisen_Kofun"],["Wikipedia (ang.): kurhany kofun - hasło \"Kofun\"","https://en.wikipedia.org/wiki/Kofun"]],"p":5},{"claim":"Sylfion był wart srebra, a tożsamość rośliny zaginęła na zawsze.","verdict":"półprawda","note":"Anegdoty są od Pliniusza, ale w 2021 r. zaproponowano identyfikację rośliny (sporną), więc nie \"na zawsze\".","src":[["Wikipedia (ang.): sylfion - hasło \"Silphium\"","https://en.wikipedia.org/wiki/Silphium"],["Miski 2021, Plants (PMC)","https://pmc.ncbi.nlm.nih.gov/articles/PMC7825337/"]],"p":6},{"claim":"Lokalizacja Akadu jest nieznana.","verdict":"prawda","note":"Mimo wielu propozycji miasta nie zlokalizowano.","src":[["Wikipedia (ang.): miasto Akad - hasło \"Akkad (city)\"","https://en.wikipedia.org/wiki/Akkad_(city)"]],"p":7},{"claim":"Grenlandia: ostatni zapis 1408 r., 5000 osadników, odrzucili sposoby Inuitów.","verdict":"półprawda","note":"Ślub z 1408 r. się zgadza, ale osadników było ok. 2000-2500 i jedli dużo foki.","src":[["Wikipedia (ang.): osadnictwo nordyckie w Ameryce i na Grenlandii - hasło \"Norse colonization of the Americas / Greenland\"","https://en.wikipedia.org/wiki/Norse_colonization_of_North_America"],["Smithsonian: dlaczego zniknęli","https://www.smithsonianmag.com/history/why-greenland-vikings-vanished-180962119/"]],"p":8},{"claim":"Liczb panowań z Sumeryjskiej listy królów nikt nie wyjaśnił.","verdict":"półprawda","note":"Liczby to wielokrotności sar (3600) w systemie sześćdziesiątkowym; lista łączy mit z historią.","src":[["Wikipedia (ang.): Sumeryjska lista królów - hasło \"Sumerian King List\"","https://en.wikipedia.org/wiki/Sumerian_King_List"]],"p":9}],"bias":"Dobrze dobrane tematy, ale przesadza z \"nierozwiązanymi zagadkami\": dla kilku (Roopkund, sylfion, lista królów) jest postęp, który film pomija lub umniejsza.","channel":"Chill Dude Explains","section":"Chill Dude Explains"},{"id":"DosxcZTjFwE","title_pl":"Rzymska kopalnia złota, która zjadła góry","title":"The Roman Gold Mine that Ate Mountains","channel":"toldinstone","url":"https://www.youtube.com/watch?v=DosxcZTjFwE","date":"2026-07-10","duration":549,"views":147066,"section":"Historia","transcript":"youtube","added":"2026-11-06","tags":["Historia","Geografia","Technika"],"about":"toldinstone o Las Médulas w Hiszpanii: hydrauliczne płukanie gór aqueduktami dla złota Imperium.","intro":"Garrett Ryan stoi w Las Médulas w północno-zachodniej Hiszpanii, gdzie \"brakuje góry\" - Rzymianie 2000 lat temu spłukali ją wodą z sześciu aqueduktów, by wydobyć złoto.\n\nFilm tłumaczy, po co Imperium potrzebowało złota (żołd, trybuty, splendor) i jak działała technika ruina montium: kanały, zbiorniki, nagłe spuszczenie wody kruszące skałę.","points":[{"t":"Złoto jako paliwo Imperium","d":"**Od Augusta po Bizancjum Rzym płacił żołnierzy i urzędników złotem; Attyla brał trybut w złocie; cesarzowe błyszczały złotogłowiem.** Źródła: łupy (Cezar w Galii), skarby (Dacja), i kopalnie.\n\nLas Médulas to spektakularny przykład przemysłowej skali wydobycia w prowincji Hispania."},{"t":"Ruina montium","d":"**Górnicy prowadzili tunele i nagle wpuszczali zgromadzoną wodę - hydrauliczny wstrząs rozsadzał zbocze.** Namuł płukano, złoto oddzielano. Krajobraz dziś: czerwone iglice i kaniony - blizna po rzymskim \"praniu\" góry.\n\nSześć aqueduktów dostarczało wodę z daleka; bez logistyki wodnej nie byłoby skali."},{"t":"Dziedzictwo krajobrazu","d":"**UNESCO chroni Las Médulas jako krajobraz kulturowy - piękny właśnie dlatego, że jest raną przemysłową.** Ryan pokazuje, że \"naturalny\" widok jest w istocie antycznym open-pit.\n\nWniosek: potęga Rzymu miała adres geograficzny i koszt ekologiczny mierzony w znikających górach."}],"conclusion":"Las Médulas to wizytówka rzymskiej inżynierii hydrologicznej i jednocześnie pomnik wyczerpania zasobów. Złote monety Imperium dosłownie wypłukano z hiszpańskich zboczy.","factchecks":[{"claim":"Las Médulas to rzymska kopalnia złota w NW Hiszpanii używająca hydraulicznego wydobycia.","verdict":"prawda","note":"Stanowisko UNESCO; klasyczny przykład ruina montium.","p":1,"src":[["Wikipedia (ang.): Las Médulas","https://en.wikipedia.org/wiki/Las_M%C3%A9dulas"],["UNESCO: Las Médulas","https://whc.unesco.org/en/list/803/"]]},{"claim":"Rzymskie państwo opierało monetę i żołd m.in. na złocie.","verdict":"prawda","note":"Aureus/solidus i płatności imperialne w złocie są dobrze poświadczone.","p":0,"src":[["Wikipedia (ang.): aureus","https://en.wikipedia.org/wiki/Aureus"]]}],"bias":"Narracja \"Rzym zjadł górę\" jest mocna retorycznie; mniej miejsca na lokalną siłę roboczą i późniejsze losy złoża."},{"id":"PNq74gruSLc","title_pl":"Pustynnienie Polski: hydrolog Piotr Bednarek o rzekach, rowach i retencji","title":"Czy da się zatrzymać pustynnienie Polski? Jeśli tak, to jak? II Piotr Bednarek","channel":"didaskalia","url":"https://www.youtube.com/watch?v=PNq74gruSLc","date":"2026-07-05","duration":5703,"views":174852,"section":"Didaskalia","transcript":"youtube","added":"2026-11-04","tags":["Natura","Geografia","Nauka"],"about":"Hydrolog z UJ i fundacji Wolne Rzeki o zasobach wody w Polsce, erozji Wisły, rowach melioracyjnych i renaturyzacji.","intro":"Rozmowa Patrycjusza Wyżgi z Piotrem Bednarkiem (doktorant hydrologii UJ, prezes fundacji Wolne Rzeki). Gość tłumaczy, czemu Polska jest uboga w wodę, jak regulacja rzek i rowy przyspieszają odpływ oraz co realnie pomaga: renaturyzacja, bobry i zatrzymywanie wody w krajobrazie, a nie same zbiorniki zaporowe.","points":[{"t":"Mało wody na mieszkańca","d":"Według przytoczonego raportu GUS Polska jest ok. 24. w UE pod względem zasobów wodnych; na Polaka przypada ok. 1600 m3 wody rocznie, ok. 3 razy mniej niż średnia unijna. Średni opad to ok. 600 mm/rok."},{"t":"Parowanie i ujemny bilans","d":"Rosnąca temperatura zwiększa parowanie z gleby, wody i roślin. Bednarek liczył bilans małej rzeki Dębowiec w Lasach Janowskich: od 2011 każdego roku ujemny. Na wielu wodowskazach IMGW są rekordowo niskie stany."},{"t":"Nawalne opady zamiast mżawki","d":"Według projekcji klimatycznych dłuższe okresy bez deszczu przeplatają się z nawalnymi opadami. Przykład: powódź Odry 2024, gdy w zlewni górnej w tydzień spadło ponad 500 mm, czyli mniej więcej roczna suma."},{"t":"Porównanie z Egiptem","d":"Hasło o bilansie jak w Egipcie dotyczy tej samej liczby ok. 1600 m3/osobę. Bednarek podkreśla różnicę: Egipt zależy od Nilu z zagranicy, a Polska prawie całą wodę z opadów ma u siebie i może nią zarządzać."},{"t":"Rowy zamiast bagien","d":"Przez 100-200 lat przyspieszano odpływ, by osuszać bagna pod uprawy. Według niepełnych danych sieć rowów ma ok. 330 000 km (baza może pomijać nawet 2/3), a w lasach ok. 80-100 000 km. Rowów jest 2-3 razy więcej niż długości rzek."},{"t":"Retencja 6-8% to mit zbiorników","d":"Wskaźnik retencji Polski ok. 6-8% vs ok. 20% w UE dotyczy głównie pojemności zbiorników zaporowych. Bednarek: woda we Włocławku nie ratuje Kujaw; Goczałkowice mają sens komunalny, ale wiele zbiorników tylko suszy dolinę poniżej."},{"t":"Erozja wgłębna Wisły","d":"Wyprostowane, pogłębione koryto i pobór piasku powodują erozję dna. W Warszawie Wisła miała wtedy ok. 140 m3/s; Bednarek musiał przeciągać kajak przez mielizny. Obniżanie dna obniża wody gruntowe w dolinie."},{"t":"Bobry lepsze niż jaz","d":"Opisuje rzekę Kurzynkę: Wody Polskie rozebrały tamę bobrową, by remontować jaz, który i tak nie piętrzył wody. Bobrowa tama piętrzyła więcej i zostawiała oboczny przepływ dla ryb."},{"t":"Renaturyzacja vs nowe zapory","d":"Renaturyzacja to m.in. rozbiórka barier i przywracanie meandrów. Według gościa na renaturyzację planowano 76 mln zł, a na jeden zbiornik w Wielowsi Klasztornej ok. miliard. Przez zaporę we Włocławku wymarły m.in. łosoś i węgorz w Wiśle."},{"t":"Co może zrobić zwykły człowiek","d":"Nie podlewać trawników wodą z wodociągu w suszy, zbierać deszczówkę, nie sczerpywać wód bez sensu. W skali kraju: kontrola poborów rolniczych, odejście od przekopywania rzek i oddawanie im przestrzeni."},{"t":"Stop suszy, start retencji","d":"Bednarek krytykuje, że ta sama instytucja prowadzi kampanię retencji i jednocześnie prace utrzymaniowe: odmulanie, pogłębianie i koszenie tysięcy kilometrów małych rzek, co znów przyspiesza odpływ."}],"conclusion":"Według Bednarka Polska nie potrzebuje kolejnych zapór, tylko zatrzymania wody w glebie, mokradłach i meandrujących rzekach.","factchecks":[{"claim":"Polska ma ok. 1600 m3 odnawialnych zasobów wody na mieszkańca rocznie.","verdict":"prawda","note":"GUS i MKiŚ podają ok. 1600 m3/osobę/rok; Polska jest wśród najuboższych w wodę krajów UE.","p":0,"src":[["Nauka w Polsce / GUS: Polska 24. w UE pod względem zasobów wody","https://scienceinpoland.pl/aktualnosci/news%2C89441%2Cgus-polska-na-24-miejscu-w-ue-pod-wzgledem-zasobow-wody.html"],["Gov.pl: sytuacja wodna Polski","https://www.gov.pl/web/klimat/odpornosc-sytuacja-wodna-polski-kraj-ubogi-w-wode"]]},{"claim":"Przez zaporę we Włocławku wymarł w Polsce łosoś i węgorz.","verdict":"półprawda","note":"Zapora mocno blokuje migrację ryb dwuśrodowiskowych; zanik łososia i spadek węgorza mają też inne przyczyny.","p":8,"src":[["Wikipedia (ang.): Włocławek Dam - hasło \"Włocławek Dam\"","https://en.wikipedia.org/wiki/W%C5%82oc%C5%82awek_Dam"]]},{"claim":"W powodzi Odry 2024 w zlewni górnej w tydzień spadło ponad 500 mm deszczu.","verdict":"prawda","note":"We wrześniu 2024 lokalnie notowano sumy rzędu 400-500+ mm w kilka dni, porównywalne z roczną normą.","p":2,"src":[["Wikipedia (ang.): 2024 Central European floods","https://en.wikipedia.org/wiki/2024_Central_European_floods"]]}],"bias":"Gość jest aktywistą fundacji Wolne Rzeki i krytykiem Wód Polskich. Reklama w odcinku: Audioteka Club. Silny nacisk na renaturyzację kosztem hydrotechniki."},{"id":"KpRZYgDIEaE","title_pl":"Minimoog Model D - historia i brzmienie najsłynniejszego syntezatora","title":"The Original 1970s Minimoog","channel":"Alex Ball","url":"https://www.youtube.com/watch?v=KpRZYgDIEaE","date":"2026-07-02","duration":1071,"views":85295,"section":"Technologie","transcript":"whisper","added":"2026-11-03","tags":["Syntezatory","Vintage","Moog"],"about":"Alex Ball opowiada historię Minimooga Model D, objaśnia, skąd bierze się jego brzmienie, i zestawia go z Oberheimem i Rolandem.","intro":"Alex Ball, znany z filmów o syntezatorach vintage, pożyczył dwa egzemplarze Minimooga Model D z 1975 roku. Opisuje, jak z eksperymentów w przerwach na lunch powstał najsłynniejszy syntezator świata. Tłumaczy też, skąd bierze się jego brzmienie, i porównuje go z dwoma najlepiej brzmiącymi syntezatorami w swoim studiu.","points":[{"t":"Narodziny w przerwie na lunch","d":"Pod koniec 1969 roku inżynier Bill Hemsath przez trzy tygodnie przerw na lunch składał z odrzuconych części mały syntezator z najczęstszym zestawem: oscylatory, filtr, wzmacniacz, obwiednie i klawiatura. Nazwał go Min, później Model A."},{"t":"Od Modelu B do C","d":"Na sugestię menedżera Johna Husy Min zmienił nazwę na Mini, a pierwsza wzmianka pojawiła się w Billboardzie w styczniu 1970 roku. Sun Ra nagrywał i koncertował z Modelem B, a około tuzina Modeli C powstało na konwencję AES we wrześniu 1970 roku."},{"t":"Mały bunt w fabryce","d":"Gdy Bob Moog szukał inwestorów, inżynierowie bez jego zgody dokończyli Model D. Produkowano go od listopada 1970 do wczesnych lat 80."},{"t":"Mało elementów, ale świetnych","d":"Mocne oscylatory, czterobiegunowy filtr dolnoprzepustowy typu ladder i tor sygnału, który przypadkiem był przesterowany, ale zostawiono go, bo brzmiał dobrze. Szybkie, sprężyste obwiednie dają atak jak przy szarpnięciu struny."},{"t":"Ograniczenia zachęcają do odkrywania","d":"Minimoog nie ma synchronizacji oscylatorów ani modulacji szerokości impulsu. Sprytne ustawienia i znajomość znoszenia się faz między oscylatorami pozwalają jednak uzyskać podobne efekty."},{"t":"Wiele wersji Minimooga","d":"Wczesne egzemplarze R.A. Moog mają najlepiej brzmiącą płytkę oscylatorów, ale słabo trzymają strój. Trzecia wersja płytki stroi najlepiej, ale brzmi najgorzej. Złotym środkiem są egzemplarze z połowy produkcji, np. z 1975 roku."},{"t":"Pojedynek w studiu","d":"Autor gra Minimoogiem razem z Oberheimem Two Voice i Rolandem System 100, które są dwugłosowe i stereo. Mono Minimoog wciąż wyróżnia się wagą i uderzeniem basu."},{"t":"Lektura","d":"Szczegóły wersji poleca w książce \"The Minimoog Book\" Joe Silvy (wyd. Bjooks), kupionej za własne pieniądze, oraz w filmie Garetha z Synth Pro."}],"conclusion":"Minimoog jest prosty, ale dzięki jakości elementów i ich połączeniu brzmi wyjątkowo i dalej wygrywa z syntezatorami o wiele większych możliwościach.","factchecks":[{"claim":"Inżynierowie dokończyli Model D bez zgody Boba Mooga, gdy ten był nieobecny.","verdict":"prawda","note":"Wikipedia potwierdza: zrobili to pod jego nieobecność, a Moog ich zganił, ale potem zatwierdził produkcję.","p":2,"src":[["Wikipedia (ang.): syntezator - hasło \"Minimoog\"","https://en.wikipedia.org/wiki/Minimoog"]]},{"claim":"Sun Ra nagrywał Minimoogiem jeszcze przed jego oficjalną premierą.","verdict":"prawda","note":"Wikipedia wskazuje Sun Ra jako prawdopodobnie pierwszego muzyka, który nagrał i grał na tym instrumencie (1970).","p":1,"src":[["Wikipedia (ang.): syntezator - hasło \"Minimoog\"","https://en.wikipedia.org/wiki/Minimoog"]]},{"claim":"Produkcja trwała od 1970 do wczesnych lat 80.","verdict":"prawda","note":"Produkcja trwała 13 lat i zakończyła się w lipcu 1981 roku. Powstało ponad 12 000 egzemplarzy.","p":2,"src":[["Wikipedia (ang.): syntezator - hasło \"Minimoog\"","https://en.wikipedia.org/wiki/Minimoog"]]},{"claim":"Filtr ladder to znak rozpoznawczy brzmienia Mooga.","verdict":"prawda","note":"Filtr ladder był jedynym opatentowanym przez Mooga elementem (1969) i dawał charakterystyczne, \"tłuste\" brzmienie.","p":3,"src":[["Wikipedia (ang.): syntezator Moog - hasło \"Moog synthesizer\"","https://en.wikipedia.org/wiki/Moog_synthesizer"]]}],"bias":"Rzeczowy materiał pasjonata, bez sponsora książki. Na końcu reklama paczki sampli na Patreonie autora."},{"id":"uUDSnfKR2S8","title_pl":"Artur Chmielewski z NASA: elektrownia na Księżycu, Hel-3 i wyścig z Chinami","title":"Polak z NASA o największej tajemnicy Księżyca || Artur B. Chmielewski","channel":"didaskalia","url":"https://www.youtube.com/watch?v=uUDSnfKR2S8","date":"2026-06-28","duration":4273,"views":423327,"section":"Didaskalia","transcript":"youtube","added":"2026-11-04","tags":["Kosmos","Technologie","Nauka"],"about":"Szef misji w JPL o bazie na biegunie księżycowym, elektrowni jądrowej, Helu-3, Artemis i skasowanym Mars Sample Return.","intro":"Kolejna rozmowa Patrycjusza Wyżgi z Arturem B. Chmielewskim z NASA JPL. Gość opowiada o pracy nad elektrownią jądrową na Księżycu, o wodzie w wiecznie zacienionych kraterach, o Helu-3, o tym, czemu Mars Sample Return odłożono na rzecz Artemis, oraz o nowej księdze Tytusa, Romka i Atomka.","points":[{"t":"Elektrownia jądrowa na Księżycu","d":"Główne zadanie Chmielewskiego to budowa elektrowni atomowej na Księżycu. Baza potrzebuje prądu do ogrzewania, chłodzenia, tlenu i życia; według niego to jak wprowadzenie się do stanu surowego bez instalacji."},{"t":"Biegun, krater i woda","d":"Cel lądowania to okolice wielkiego krateru (biegun), gdzie w wiecznym cieniu jest ok. -180 C i zamarznięta woda. Woda lokalna ma służyć do picia, higieny i jedzenia zamiast wożenia jej z Ziemi."},{"t":"Hel-3 jako paliwo przyszłości","d":"Według gościa Hel-3 przy fuzji daje czystą energię bez neutronów. Na Księżycu są setki milionów jednostek, na Ziemi gramy. Twierdzi, że 1 tona wystarczyłaby USA na rok energii, Polsce na kilkanaście kilogramów."},{"t":"Mars Sample Return skasowany","d":"Perseverance zebrał próbki w tytanowych tubach w kraterze po dawnym jeziorze. Misja powrotu miała: lądownik, rakietę na orbitę Marsa i europejski statek. Została skasowana; pieniądze poszły na programy księżycowe."},{"t":"Chiny w wyścigu","d":"Chmielewski mówi prywatnie, że Chiny radzą sobie dobrze lub lepiej, mają większy budżet i mogą być pierwsze z bazą lub próbkami. Współpracę USA-Chiny uważa za trudną przez kopiowanie technologii."},{"t":"Budżet: Apollo vs dziś","d":"Apollo to według niego ok. 4% budżetu USA, dziś NASA ma ok. 0,4%, czyli ok. 10 razy mniej. Stąd misje są tańsze, wieloetapowe, z tankowaniem na orbicie zamiast jednorazowych gigantycznych rakiet."},{"t":"Artemis i Starship","d":"Artemis 1 i 2 opisuje jako sukcesy; o terminie załogowego lądowania mówi ostrożnie (oficjalnie ok. 2028, prywatnie raczej później, ok. 2030). Do tankowania Starshipa potrzeba wielu lotów tankowców."},{"t":"Humanoid w skafandrze","d":"Chce z Witoldem ubrać humanoida w skafander i wysłać go np. cargo Blue Origin przed astronautami, by przetestować schodzenie i poruszanie. Żartuje o spacerze do starego łazika Apollo."},{"t":"Uran i Tytan odłożone","d":"Po Mars Sample Return kolejnym priorytetem naukowym miał być Uran; teraz schodzi dalej. Wcześniej pracował nad konkurencyjnym planem Oceanus badania oceanów na Tytanie."},{"t":"Tytus astronauta i Polska","d":"Przyjechał na Targi Książki z nową księgą Tytusa, Romka i Atomka (Tytus w kosmosie). Chce oddać Polsce coś z doświadczenia NASA; wspomina też o technologii poszukiwania wody pod Saharą."}],"conclusion":"Chmielewski stawia na księżycową infrastrukturę energetyczną i wodną; wyścig z Chinami traktuje jako motywację, a nie cel sam w sobie.","factchecks":[{"claim":"1 tona Helu-3 z Księżyca wystarczyłaby USA na rok energii.","verdict":"przesada","note":"Szacunki fuzji He-3 mówią raczej o ok. 25-50 tonach na roczne zapotrzebowanie USA, nie o 1 tonie.","p":2,"src":[["The Hill: mining Moon helium-3","https://thehill.com/opinion/technology/540856-solving-the-climate-and-energy-crises-mine-the-moons-helium-3/"],["Space.com / UW FTI: Moon helium-3 energy","https://fti.neep.wisc.edu/fti.neep.wisc.edu/gallery/pdf/space_com063000.pdf"]]},{"claim":"South Pole-Aitken to największy znany krater w Układzie Słonecznym.","verdict":"prawda","note":"Basen South Pole-Aitken ma ok. 2500 km średnicy i jest największym znanym kraterem uderzeniowym.","p":1,"src":[["NASA Science: What is the South Pole-Aitken Basin?","https://science.nasa.gov/moon/lunar-craters/what-is-the-south-pole-aitken-basin/"]]},{"claim":"W wiecznie zacienionych kraterach bieguna jest ok. -180 C i lód wodny.","verdict":"prawda","note":"Dno Shackletona ma ok. 90 K (ok. -183 C); w PSR wykryto wodór/lód. Lokalnie bywa jeszcze zimniej.","p":1,"src":[["Wikipedia (ang.): Shackleton (crater)","https://en.wikipedia.org/wiki/Shackleton_(crater)"],["NASA: Moon's South Pole","https://www.nasa.gov/humans-in-space/moons-south-pole-is-full-of-mystery-science-intrigue/"]]},{"claim":"Budżet NASA to dziś ok. 0,4% budżetu federalnego USA, Apollo miało ok. 4%.","verdict":"prawda","note":"Szczyt Apollo sięgał ok. 4% budżetu federalnego; NASA od lat to zwykle poniżej 0,5%.","p":5,"src":[["Wikipedia (ang.): Budget of NASA","https://en.wikipedia.org/wiki/Budget_of_NASA"]]}],"bias":"Gość jest pracownikiem NASA JPL i patriotą USA/Polski; Chiny ocenia ostro (kopiowanie). Reklama: Audioteka Club. Opinie o terminach Artemis i Chinach to jego prywatne oceny."},{"id":"8eyrXIjdj3A","title_pl":"Dlaczego niektórzy mają obsesję na punkcie bawełny Sea Island","title":"Dlaczego niektórzy mają obsesję na punkcie tej bawełny?","channel":"Tomasz o ciuchach - Tomasz Krajewski","url":"https://www.youtube.com/watch?v=8eyrXIjdj3A","date":"2026-06-01","duration":729,"views":17378,"section":"Moda","transcript":"whisper","added":"2026-11-03","tags":["Materiały","Bawełna","Jakość ubrań"],"about":"Tomasz Krajewski porównuje sweter z Uniqlo za 100 zł i John Smedley z bawełny Sea Island za 1100 zł i wyjaśnia, co decyduje o jakości bawełny.","intro":"Tomasz Krajewski zestawia dwa prawie identyczne bawełniane swetry: z Uniqlo za około 100 zł i z John Smedley z bawełny Sea Island za 1100 zł. W półślepym teście znajomi wybrali tańszy, bo był grubszy. Autor tłumaczy, od czego naprawdę zależy jakość bawełny i czy luksus jest wart dopłaty.","points":[{"t":"Przędza i luźne końcówki","d":"Przędza to skręcone włókna, a każda wystająca końcówka to słaby punkt. Luźne włókna pod wpływem tarcia tworzą meszek i kulki, łapią brud i są bardziej szorstkie. Najbardziej niszczą je pranie i suszenie."},{"t":"Długość włókna","d":"Włókna z wacika mają do 1 cm, a Sea Island około 5 cm. Krótsze włókna to więcej końcówek i łączeń w przędzy. Za najwyższą ligę uznaje się włókna od 35 mm, z markowymi nazwami, np. Pima i Supima."},{"t":"\"100% cotton\" nic nie mówi","d":"Około 90% światowej bawełny to zwykła odmiana. To samo oznaczenie ma koszulka za grosze i rzecz od Gucci. Różnica między dzianiną open-end z krótkich włókien a ring-spun z lepszych to jak płyta wiórowa wobec litego drewna."},{"t":"Oznaczenia warte uwagi","d":"Ring-spun to mocniej skręcona, gładsza przędza. Combed cotton oznacza czesanie, które usuwa najkrótsze włókna. Merceryzacja chemicznie wygładza przędzę, poprawia barwienie i daje połysk. Przy denimie czy cotton duck ważniejsze jest tkanie."},{"t":"Gramatura to nie jakość","d":"Gruba koszulka wydaje się solidna na wieszaku, ale jest sztywniejsza i gorzej oddycha. Wysoka gramatura ma sens w bluzach. T-shirty, swetry i koszule dobieraj gramaturą do temperatury."},{"t":"Jak sprawdzać marki","d":"Dobry znak to przejrzyste informacje o produkcji i materiałach. Najlepiej sprawdzać opinie na Reddicie, YouTube i blogach, patrząc na daty, bo popularne marki bywają z czasem gorsze."},{"t":"Czy Sea Island się opłaca","d":"Sea Island to około 4 milionowe światowej produkcji bawełny. Jest najtrwalsza, ale dopłacasz głównie za rzadkość i certyfikat. Autor poleca Pima i Supima oraz szukanie markowych rzeczy w lumpeksach i na Vinted; jego sweter kosztował około 6 zł."}],"conclusion":"Do ubrań noszonych przy skórze wybieraj bawełnę o dłuższych włóknach, ale nie przepłacaj za luksus, bo różnice są niewielkie.","factchecks":[{"claim":"Bawełna z najwyższej ligi zaczyna się od włókien długości 35 mm.","verdict":"prawda","note":"ICAC definiuje bawełnę extra-long-staple od 1 3/8 cala, czyli około 35 mm.","p":1,"src":[["Wikipedia (ang.): bawełna - hasło \"Gossypium barbadense\"","https://en.wikipedia.org/wiki/Gossypium_barbadense"]]},{"claim":"Merceryzacja poprawia barwienie i nadaje bawełnie połysk.","verdict":"prawda","note":"Wikipedia: poprawia wchłanianie barwnika i wytrzymałość, zmniejsza kurczenie i daje jedwabisty połysk.","p":3,"src":[["Wikipedia (ang.): obróbka tkanin - hasło \"Mercerisation\"","https://en.wikipedia.org/wiki/Mercerisation"]]},{"claim":"Czesanie usuwa najkrótsze włókna.","verdict":"prawda","note":"Czesanie oddziela krótkie włókna za pomocą stalowych igieł.","p":3,"src":[["Wikipedia (ang.): przędzalnictwo - hasło \"Combing\"","https://en.wikipedia.org/wiki/Combing"]]},{"claim":"Sea Island to około 4 milionowe światowej produkcji bawełny.","verdict":"nie da się sprawdzić","note":"Wikipedia potwierdza, że Sea Island to odmiana G. barbadense, ale nie podaje udziału w światowej produkcji.","p":6,"src":[["Wikipedia (ang.): bawełna - hasło \"Gossypium barbadense\"","https://en.wikipedia.org/wiki/Gossypium_barbadense"]]}],"bias":"Rzetelny i uczciwy materiał. Autor przyznaje, że sam nie odróżnia bawełny dotykiem, a drogi sweter kupił w lumpeksie. Bez sponsora."},{"id":"IFqI11SIGXo","title_pl":"Jak metan trafia do solidnej stali","title":"Steel Absorbs Gas Like a Sponge","channel":"Steve Mould","url":"https://www.youtube.com/watch?v=IFqI11SIGXo","date":"2026-05-31","duration":1087,"views":1461337,"section":"Ciekawostki","transcript":"youtube","added":"2026-11-06","tags":["Nauka","Technika"],"about":"Steve Mould: high temperature hydrogen attack - wodór wnikający w stal tworzy metan, bąble i pęknięcia; kontekst Haber-Bosch.","intro":"Steve Mould startuje od bloku stali pełnego bąbli metanu i pytania: skąd gaz w \"solidzie\"? Wątkiem przewodnim jest przemysł nawozowy (Haber-Bosch), który karmi połowę ludzkości i pracuje na wodorze pod ciśnieniem.\n\nFilm tłumaczy dyfuzję wodoru w sieci żelaza, reakcję z węglem (cementyt) do CH4 i dlaczego metan już nie ucieka - high temperature hydrogen attack (HTHA).","points":[{"t":"Po co w ogóle wodór pod ciśnieniem","d":"**Rośliny potrzebują azotu \"utrwalonego\"; powietrze ma N2 z silnym wiązaniem potrójnym.** Bakterie i pioruny nie wystarczają dla 8 mld ludzi - stąd Haber-Bosch: wodór + azot -> amoniak do nawozów.\n\nInstalacje te pchają wodór w stalowe rury i reaktory w wysokiej temperaturze."},{"t":"Od H do CH4 w metalu","d":"**Atomowy wodór dyfunduje między jonami żelaza; węgiel siedzi głównie na granicach ziaren jako cementyt.** Gdy H \"zabiera\" C, powstaje metan - cząsteczka za duża, by wrócić tą samą drogą.\n\nMetan zbiera się w bąble, łączy w szczeliny wzdłuż granic ziaren - stal traci wytrzymałość, czasem katastrofalnie."},{"t":"Detekcja i stawkę","d":"**Istnieją urządzenia wykrywające taki problem, bo w kilku branżach to ryzyko śmiertelne.** Mould łączy chemię materiałową z geo-ekonomią jedzenia.\n\nPuenta: niewidoczny gaz w metalu to uboczny efekt tego samego procesu, który napełnia magazyny nawozów."}],"conclusion":"HTHA pokazuje cenę przemysłowej chemii: wodór, który żywi pola, potrafi od środka zjadać stal. Bąbel metanu w bloku to nie ciekawostka - to mechanizm awarii.","factchecks":[{"claim":"Proces Habera-Boscha produkuje amoniak do nawozów i wspiera wyżywienie ogromnej części ludzkości.","verdict":"prawda","note":"Szacunki często mówią o rzędzie połowy populacji zależnej od syntetycznych nawozów.","p":0,"src":[["Wikipedia (ang.): Haber process","https://en.wikipedia.org/wiki/Haber_process"]]},{"claim":"High temperature hydrogen attack tworzy metan w stali i osłabia ją bąblami/pęknięciami.","verdict":"prawda","note":"HTHA to znane zjawisko materiałowe w przemyśle wodorowym/rafineryjnym.","p":1,"src":[["Wikipedia (ang.): hydrogen embrittlement","https://en.wikipedia.org/wiki/Hydrogen_embrittlement"],["Wikipedia (ang.): cementite","https://en.wikipedia.org/wiki/Cementite"]]}],"bias":"Sponsoring Incogni na końcu; uproszczenie metalurgii ziaren dla narracji wideo."},{"id":"Woz8RYQnbhU","title_pl":"McGill Big 3 robione poprawnie - szczegóły, które zmieniają efekt","title":"Your McGill Big 3 Is Wrong (Here's Why Your Back Still Hurts)!","channel":"Squat University","url":"https://www.youtube.com/watch?v=Woz8RYQnbhU","date":"2026-05-24","duration":1072,"views":436154,"section":"Sport","transcript":"youtube","added":"2026-11-03","tags":["Kręgosłup","Core","Rehabilitacja"],"about":"Fizjoterapeuta dr Aaron Horschig ze Squat University przeprowadza pacjenta przez McGill Big 3 i poprawia błędy w technice.","intro":"McGill Big 3 to trzy ćwiczenia stabilizujące tułów, polecane przy bólu dolnej części pleców. Dr Aaron Horschig ze Squat University twierdzi, że ćwiczenia działają, a zawodzi zwykle wykonanie. Na prawdziwej sesji z pacjentem pokazuje wskazówki do brzuszka zmodyfikowanego, bocznej deski i bird doga.","points":[{"t":"Brzuszek zmodyfikowany","d":"Jedna noga zgięta, druga prosta, dłonie pod lędźwiami. Ułatwia to utrzymanie neutralnego kręgosłupa. Lędźwie nie mogą naciskać na dłonie, a ruch wychodzi tylko z odcinka piersiowego."},{"t":"Wstępne napięcie bocznie","d":"Wciśnij palce w boczne mięśnie brzucha i napnij je w bok. To nie wciąganie pępka ani wypychanie brzucha, tylko usztywnienie tułowia dookoła, które angażuje też mięśnie pleców."},{"t":"Ściemniacz, nie włącznik","d":"Na co dzień nie trzeba napięcia na 100%, ale za słabe pozwala na mikroruchy kręgosłupa, które mogą wywołać ból. Cel to oddychać spokojnie, np. jak przez słomkę, bez \"migotania\" napięcia brzucha."},{"t":"Wytrzymałość, nie siła","d":"Autor zauważa, że sportowcy przysiadający setki kilogramów też mają ból pleców. Wiąże ból częściej z wytrzymałością i kontrolą ruchu niż z siłą. Dlatego stosuje 10-sekundowe przytrzymania w seriach, np. 4 powtórzenia."},{"t":"Boczna deska","d":"Najprostsza wersja jest na stopach w rozkroku, a łatwiejsza na kolanach. Przy schodzeniu trzymaj napięcie aż do zetknięcia bioder z podłogą, bez bocznego zginania. Trudniejsza wersja to przetaczanie przez deskę przodem na drugi bok, z miednicą i klatką poruszającymi się razem."},{"t":"Bird dog z napięciem całego ciała","d":"Odepchnij podłogę dłonią i unieś klatkę. Unieś rękę i nogę najpierw tylko o 2-3 cm, nie zadzieraj pięty, żeby nie wyginać lędźwi. Wracaj powoli bez rozluźniania. Dobrze zrobiony powinien zmęczyć."},{"t":"To nie wszystko","d":"Na koniec autor podkreśla, że Big 3 samo nie naprawia większości bólu pleców. To część pełnej rehabilitacji, którą zaczyna badanie innych braków ciała."}],"conclusion":"Big 3 działa, gdy kręgosłup pozostaje nieruchomy, oddech nie przerywa napięcia, a ćwiczenia są częścią szerszej rehabilitacji.","factchecks":[{"claim":"Ból pleców wiąże się bardziej z wytrzymałością mięśni tułowia niż z ich siłą.","verdict":"półprawda","note":"Słaba wytrzymałość prostowników przewidywała ból pleców w badaniu z 1984 roku, ale nie dowodzi to, że to główna przyczyna.","p":3,"src":[["PubMed: Biering-Sørensen 1984 - \"Physical measurements as risk indicators for low-back trouble over a one-year period\"","https://pubmed.ncbi.nlm.nih.gov/6233709/"]]},{"claim":"Ćwiczenia stabilizujące działają, jeśli tylko robi się je poprawnie.","verdict":"przesada","note":"Wg Cochrane ćwiczenia kontroli motorycznej pomagają, ale prawdopodobnie nie bardziej niż inne formy ćwiczeń.","p":null,"src":[["PubMed: Saragiotto i wsp. 2016 - \"Motor control exercise for chronic non-specific low-back pain\"","https://pubmed.ncbi.nlm.nih.gov/26742533/"]]},{"claim":"Przytrzymania stabilizujące tułów można trenować i mierzyć czasem.","verdict":"prawda","note":"McGill i wsp. opisali normy czasu wytrzymania w ćwiczeniach stabilizacji lędźwi jako cele kliniczne.","p":3,"src":[["PubMed: McGill i wsp. 1999 - \"Endurance times for low back stabilization exercises\"","https://pubmed.ncbi.nlm.nih.gov/10453772/"]]}],"bias":"Autor jest fizjoterapeutą i propaguje metodę McGilla. Prowadzi własną klinikę i program rehabilitacyjny, więc podkreśla rolę badania przez specjalistę."},{"id":"ohRX0oauJ3Q","title_pl":"10 mężczyzn, którzy ukształtowali współczesną męską garderobę","title":"Everything in Your Closet Can Be Traced Back To These 10 Men","channel":"Gentleman's Gazette","url":"https://www.youtube.com/watch?v=ohRX0oauJ3Q","date":"2026-05-17","duration":887,"views":23004,"section":"Moda","transcript":"youtube","added":"2026-11-03","tags":["Styl","Historia mody","Klasyka"],"about":"Gentleman's Gazette przedstawia 10 ikon stylu, od Beau Brummella po Toma Forda, i to, czego każda z nich może nauczyć dziś.","intro":"Gentleman's Gazette twierdzi, że krój, dodatki i niepisane zasady w naszej szafie pochodzą od kilku mężczyzn, którzy ubierali się inaczej niż reszta. Kanał przedstawia 10 postaci od końca XVIII wieku do dziś. Każda zostawia jedną praktyczną lekcję.","points":[{"t":"Beau Brummell: mniej znaczy więcej","d":"W epoce peruk, makijażu i haftowanych fraków postawił na prostotę, dopasowanie i czystość, z nieskazitelnym płótnem i codzienną kąpielą. Prosty, idealnie skrojony granatowy surdut znaczył więcej niż złote nici."},{"t":"Edward VII: elegancja i wygoda","d":"Spopularyzował kapelusz homburg jako miękką alternatywę dla cylindra. Przypisuje mu się zwyczaj niezapinania dolnego guzika kamizelki, choć autorzy przyznają, że może to być legenda."},{"t":"Książę Windsoru: \"dressing soft\"","d":"Wprowadził marynarki z naturalnymi ramionami i luźniejszym krojem oraz rozsławił kratę Prince of Wales. Do smokingu założył miękki wykładany kołnierzyk zamiast sztywnego kołnierzyka typu wing."},{"t":"Fred Astaire: test tańca","d":"Po przymiarce tańczył u krawca, żeby ubranie poruszało się razem z nim. Krawaty i apaszki służyły mu jako pasek, a zamszowe buty nosił do miejskich garniturów. Jeśli nie możesz się swobodnie ruszać, ubranie nie pasuje."},{"t":"Cary Grant i Gianni Agnelli","d":"Grant stawiał na podstawy: szerokość klap, stan spodni i linię ramion. Agnelli nosił zegarek na mankiecie i buty trekkingowe do garnituru, ale ta nonszalancja opierała się na perfekcyjnym krawiectwie. Zasady można łamać dopiero, gdy się je zna."},{"t":"Paul Newman i Steve McQueen","d":"Newman to styl Ivy: koszula oxford z kołnierzykiem na guziki, chinosy, dziany krawat i loafersy. McQueen łączył odzież roboczą i wojskową, np. kurtkę Harrington Baracuta G9 i okulary Persol. Może być surowo, ale nigdy niechlujnie."},{"t":"Ralph Lauren i Tom Ford","d":"Lauren zaczął w 1967 roku od krawatów szerokich na około 10 cm, gdy modne były wąskie, i sprzedaje cały styl życia. Ford w latach 90. przywrócił garnitur z mocnymi ramionami i szpiczastymi klapami, a potem ubierał Jamesa Bonda."}],"conclusion":"Codziennie wybierasz, co wziąć od tych ikon: dopasowanie Brummella, prostotę Granta, swobodę Agnellego czy opowieść Laurena.","factchecks":[{"claim":"Brummell wprowadził modę na czystość i codzienną kąpiel.","verdict":"prawda","note":"Wikipedia opisuje jego dbałość o zęby, golenie i codzienną kąpiel, które naśladowała wyższa sfera.","p":0,"src":[["Wikipedia (ang.): dandys - hasło \"Beau Brummell\"","https://en.wikipedia.org/wiki/Beau_Brummell"]]},{"claim":"Edward VII spopularyzował homburga, a może i zwyczaj z dolnym guzikiem.","verdict":"półprawda","note":"Homburg zgadza się, ale Wikipedia nazywa wersję o guziku i tuszy Edwarda fałszywą. Autorzy sami podają ją w wątpliwość.","p":1,"src":[["Wikipedia (ang.): kapelusz - hasło \"Homburg hat\"","https://en.wikipedia.org/wiki/Homburg_hat"],["Wikipedia (ang.): kamizelka - hasło \"Waistcoat\"","https://en.wikipedia.org/wiki/Waistcoat"]]},{"claim":"Lauren zaczął od krawatów w 1967 roku.","verdict":"prawda","note":"Firmę Ralph Lauren założył w 1967 roku, startując z męskimi krawatami.","p":6,"src":[["Wikipedia (ang.): projektant - hasło \"Ralph Lauren\"","https://en.wikipedia.org/wiki/Ralph_Lauren"]]},{"claim":"Tom Ford ubierał Jamesa Bonda.","verdict":"prawda","note":"Ford projektował garnitury Daniela Craiga w czterech filmach o Bondzie, od \"Quantum of Solace\" (2008).","p":6,"src":[["Wikipedia (ang.): projektant - hasło \"Tom Ford\"","https://en.wikipedia.org/wiki/Tom_Ford"]]}],"bias":"Uczciwa lekcja historii z jasnymi lekcjami na dziś. Autorzy wspominają o kontrowersjach wokół księcia Windsoru i zaznaczają legendy. Nie ma reklam."},{"id":"GX87fbBd78A","title_pl":"Jak robić idealne pompki: technika, regresje i progresje","title":"How To Perform PERFECT Push Ups (Everything You Need To Know)","channel":"E3 Rehab","url":"https://www.youtube.com/watch?v=GX87fbBd78A","date":"2026-05-17","duration":877,"views":35037,"section":"Sport","transcript":"youtube","added":"2026-11-05","tags":["Trening","Ciało i zdrowie","Prehab","Siłownia"],"about":"E3 Rehab uczy pompki krok po kroku: setup, zejście, dół, wyjście, regresje, progresje, ból i mit perfekcji.","intro":"E3 Rehab to kanał fizjoterapeutów o treningu i rehabilitacji. Tu uczą \"idealnej\" pompki: od ustawienia ciała przez zejście i wyjście po regresje, progresje i modyfikacje przy bólu.\n\nFilm jest poradnikiem pięcioetapowym plus listami ułatwień i utrudnień. Puenta: największy błąd to obsesja na punkcie techniki kosztem przygotowania i rozsądnej objętości. Autorzy podkreślają, że pompka trenuje klatkę, barki, triceps, brzuch i więcej, ale trzeba dojść do niej stopniowo.","points":[{"t":"Setup i linia ciała","d":"**Zaczynają od kolan, ręce nieco szerzej niż barki, potem wspięcie na stopy i prosta linia od ucha przez biodra po kostki.** Lekki chin nod, rozluźnione górne trapezy, dociśnięcie podłogi (bez zapadania łopatek), delikatne spięcie pośladków i czworogłowych.\n\nCue nie wymagają maksymalnego wysiłku. Jeśli sam plank jest za trudny, najpierw budować wytrzymałość w wysokiej desce."},{"t":"Zejście, dół i wyjście","d":"**Zejście ma utrzymać sztywny tułów (szklanka wody na dolnych plecach) i iść lekko w dół oraz do przodu, nie tylko pionowo.** Typowe błędy: zapadanie bioder albo zadarty tyłek bez ruchu w barkach i łokciach. Łokcie mniej więcej pod 45°, nie przyklejone ani całkowicie rozwarte.\n\nNa dole klatka \"dotyka jajka, nie tłucze\". Przedramiona prawie pionowe. Wyjście to odwrócenie ruchu; na górze można dociągnąć push-up plus (protrakcja łopatek, serratus)."},{"t":"Regresje i pierwsze pompki","d":"**Cztery ułatwienia: pompki na kolanach, skrócony zakres (np. klocek), taśma asystująca i ręce uniesione (ławka, blat, ściana).** Przy kolanach biodra mają być wyprostowane i ciężar lekko do przodu. Przykłady progresji: dojść do 20 na kolanach, stopniowo obniżać podłogę, łączyć skrócony zakres z kolanami. Nie nazywać wersji na kolanach \"damskimi\"."},{"t":"Progresje i warianty","d":"**Utrudnienia: obciążenie (kamizelka lepsza niż talerze), deficyt, stopy wyżej (decline), pompka na jednej ręce, taśma oporowa.** Na single-arm radzą najpierw 20-30 zwykłych bez przerwy, plank jednoręczny/shoulder taps i regresję z ręką wyżej.\n\nWarianty: ekscentryki, izometrie, tempo, diament (więcej tricepsa), push-up plus. Decline przy zbyt wysokim uniesieniu stóp często psuje linię bioder."},{"t":"Modyfikacje przy bólu","d":"**Nadgarstek: neutralny chwyt na hantlach lub poręczach. Łokieć: mniejszy zakres zgięcia i mniejszy udział tricepsa. Bark: węższa pompka bywa mniej wymagająca niż szeroka.** Plecy: trzymać linię tułowia. Szyja: lekki chin tuck, wzrok w dół. Modyfikacje mają być tymczasowe, z celem powrotu do rąk płasko na podłodze."},{"t":"Największy błąd","d":"**Numer jeden to obsesja na technice kosztem przygotowania i rozsądnego obciążenia.** Wyzwanie 100 pompek dziennie u nowicjusza kończy się brzydką formą i ryzykiem kontuzji. U osoby z latami treningu \"niedoskonała\" forma bywa po prostu wariantem budującym odporność. Technika pomaga, ale zmienia się z siłą i nie jest jedyną rzeczą, która się liczy."}],"conclusion":"E3 Rehab chce, żebyś zaczął od użytecznych cue'ów, dobrał regresję lub progresję do celu i nie sparaliżował się perfekcją. Idealna pompka to przede wszystkim przygotowanie, a dopiero potem detale techniki.","factchecks":[{"claim":"Pompka trenuje klatkę, barki, triceps i mięśnie tułowia","verdict":"prawda","note":"Pompka to złożone ćwiczenie push angażujące piersiowy większy, naramienne, triceps i stabilizatory tułowia.","p":null,"src":[["Wikipedia (ang.): pompka - hasło \"Push-up\"","https://en.wikipedia.org/wiki/Push-up"]]},{"claim":"Łokcie pod ok. 45° to uniwersalnie najlepsza pozycja","verdict":"półprawda","note":"45° to popularna wskazówka startowa; szerokość i kąt zależą od celu, anatomii i komfortu barku.","p":1,"src":[["Wikipedia (ang.): staw ramienny - hasło \"Shoulder joint\"","https://en.wikipedia.org/wiki/Shoulder_joint"]]},{"claim":"Push-up plus mocniej angażuje serratus anterior","verdict":"prawda","note":"Dodatkowa protrakcja łopatek na górze ruchu jest klasycznym ćwiczeniem na zębaty przedni.","p":1,"src":[["Wikipedia (ang.): mięsień zębaty przedni - hasło \"Serratus anterior muscle\"","https://en.wikipedia.org/wiki/Serratus_anterior_muscle"]]},{"claim":"Największym błędem jest sama zła technika, nie objętość","verdict":"przesada","note":"Autor celowo przewartościowuje narrację; zarówno technika, jak i nagły skok objętości mogą szkodzić.","p":5,"src":[["Wikipedia (ang.): przeciążenie treningowe - hasło \"Overtraining\"","https://en.wikipedia.org/wiki/Overtraining"]]}],"bias":"Ton edukacyjny E3 Rehab z delikatną reklamą e3rehab.com. Długa lista cue'ów może przytłaczać początkujących mimo puenty o prostocie."},{"id":"qRAxMcjEYd4","title_pl":"10 ćwiczeń na core, które większość ludzi pomija","title":"10 Core Exercises Most People Skip (BUILD A CORE OF IRON)","channel":"Squat University","url":"https://www.youtube.com/watch?v=qRAxMcjEYd4","date":"2026-04-26","duration":1146,"views":592116,"section":"Sport","transcript":"youtube","added":"2026-11-03","tags":["Ciało i zdrowie","Trening","Nauka"],"about":"Fizjoterapeuta Squat University pokazuje 10 ćwiczeń stabilizacji tułowia: od noszenia odważników po pliometrię brzucha.","intro":"Aaron Horschig ze Squat University tłumaczy, że stabilność tułowia to nie tylko mięśnie brzucha, ale też układ nerwowy. Zaczyna od testu noszenia ciężaru, a potem pokazuje 10 ćwiczeń od bardziej znanych do mało popularnych. Podaje przy nich serie, ciężary i sposoby progresji.","points":[{"t":"Trzy podsystemy stabilizacji","d":"Według dr. Panjabiego kręgosłup stabilizują elementy bierne (kości, dyski, więzadła), aktywne (duże mięśnie tułowia) i nerwowe. Gdy jeden zawodzi, jakość ruchu spada i rośnie ryzyko urazu."},{"t":"Test noszenia 75% masy ciała","d":"Dwa odważniki o łącznej masie 75% masy ciała, marsz z idealną postawą. Zaliczenie to 1,5 minuty bez poprawiania chwytu; gość odcinka (ok. 84 kg) nosił 2 kettle po ok. 32 kg."},{"t":"1. Noszenie w 6 pozycjach","d":"Ćwiczenie Graya Cooka: kettlebell nad głową, potem w pozycji rack, potem przy boku, zmiana ręki przed zmęczeniem. Ciężar taki, który wyciskasz 12-15 razy; cel to 12-15 minut ciągłej pracy."},{"t":"2. Deska bokiem z uniesioną nogą","d":"Angażuje skośne, prostowniki, czworoboczny lędźwi i mocno pośladek średni nogi na dole. Start od 4 powtórzeń po 10 sekund na stronę, progresja liczbą powtórzeń."},{"t":"3. Marsz z ciężarem na końcu drążka","d":"Lekki drążek na plecach z ciężarkiem ok. 5 kg na jednym końcu i 5-10 kroków do przodu i do tyłu. Bujający się ciężar pobudza drobne głębokie mięśnie, np. wielodzielny, pełne wrzecion mięśniowych."},{"t":"4-5. Kettlebell dookoła i renegade row","d":"Obroty kettla wokół ciała po 5 razy w każdą stronę, stojąc na dwóch nogach, na jednej i na kolanach. W renegade row cel to brak rotacji: kilka serii po 3-5 powtórzeń na rękę."},{"t":"6. Roll-out z kółkiem","d":"Najpierw wyprost bioder do linii prostej, dopiero potem ruch rąk. Łatwiejsze wersje: roll-out na piłce albo wychodzenie rękami z pozycji pompki."},{"t":"7. Mieszanie w garnku","d":"Deska z łokciami na piłce i małe kółka przy nieruchomym tułowiu. Trójbojarz Brian Carroll używał tego ćwiczenia przed rekordowym przysiadem z 2020 roku (ok. 592 kg)."},{"t":"8. Chop i lift na wyciągu","d":"W półklęku, hasło: przyciągnij do środka i odepchnij. Zamiast 10 powtórzeń ciągiem lepiej robić 10 serii po jednym, z pauzą i oddechem, bo trenuje się odruchową stabilizację."},{"t":"9-10. Wyciskanie Milko i rzuty piłką","d":"Leżąc lędźwiami na ławce, rotacja górnej części pleców z wypychaniem hantla w górę, 5 razy na stronę. Na koniec szybkie rzuty piłką lekarską o ścianę z rotacji bioder jako pliometria brzucha."}],"conclusion":"Core trzeba trenować z różnorodnością i progresją, ćwicząc stabilizację odruchową, a nie tylko siłę mięśni brzucha.","factchecks":[{"claim":"Panjabi opisał stabilizację kręgosłupa jako 3 podsystemy: bierny, aktywny i nerwowy.","verdict":"prawda","note":"Model Panjabiego z 1992 roku zawiera dokładnie te 3 podsystemy.","p":0,"src":[["PubMed: Panjabi 1992, układ stabilizujący kręgosłup - \"The stabilizing system of the spine. Part I\"","https://pubmed.ncbi.nlm.nih.gov/1490034/"]]},{"claim":"Zaliczenie testu to 1,5 minuty noszenia 75% masy ciała.","verdict":"nie da się sprawdzić","note":"Nie znalazłem publicznie opisanego progu w materiałach Graya Cooka; to wartość podana przez autora.","p":1,"src":[["Wikipedia (ang.): spacer farmera - hasło \"Farmer's walk\"","https://en.wikipedia.org/wiki/Farmer%27s_walk"]]},{"claim":"Mięsień wielodzielny ma dużo wrzecion mięśniowych i pełni rolę czuciową.","verdict":"prawda","note":"Badania pokazują dużą gęstość wrzecion w głębokich mięśniach przykręgosłupowych, ale ich rola nie jest tylko czuciowa.","p":4,"src":[["Wikipedia (ang.): mięsień wielodzielny - hasło \"Multifidus muscle\"","https://en.wikipedia.org/wiki/Multifidus_muscle"]]},{"claim":"Deska bokiem mocno aktywuje pośladek średni.","verdict":"prawda","note":"W badaniu EMG Borena i wsp. (2011) deska bokiem z odwiedzeniem nogi dała najwyższą aktywność pośladka średniego.","p":3,"src":[["PubMed: Boren i wsp. 2011, EMG pośladków w ćwiczeniach - \"Electromyographic analysis of gluteus medius and gluteus maximus\"","https://pubmed.ncbi.nlm.nih.gov/22034614/"]]},{"claim":"Carlos Yulo jest mistrzem olimpijskim i mistrzem świata.","verdict":"prawda","note":"Yulo zdobył 2 złote medale w Paryżu 2024 i tytuły mistrza świata w gimnastyce.","p":9,"src":[["Wikipedia (ang.): gimnastyk - hasło \"Carlos Yulo\"","https://en.wikipedia.org/wiki/Carlos_Yulo"]]}],"bias":"Rzetelny, praktyczny materiał, ale część twierdzeń (np. o 95% ćwiczących) to retoryka. Na końcu reklama książki autora."},{"id":"CnLvRMlpBbA","title_pl":"Ranking książek o Harrym Potterze według dziur fabularnych","title":"Ranking every Harry Potter book by its PLOT HOLES","channel":"Vault","url":"https://www.youtube.com/watch?v=CnLvRMlpBbA","date":"2026-04-16","duration":4455,"views":858315,"section":"Pozostałe","transcript":"youtube","added":"2026-11-05","tags":["Książki","Popkultura"],"about":"Vault układa 7 tomów Harry'ego Pottera na macierzy częstotliwości i wagi dziur fabularnych: od Kamienia Filozoficznego po Insygnia Śmierci.","intro":"Vault to kanał, który regularnie rozbiera na części logikę świata Harry'ego Pottera. Tym razem autor nie ocenia, która książka jest najlepsza, tylko która jest \"najbardziej zepsuta\": ile ma dziur fabularnych i nielogiczności oraz jak poważne są dla całej historii. Robi to żartobliwie \"w stylu McKinseya\" (firmy doradczej), na macierzy 2 na 2: oś pozioma to częstość problemów, oś pionowa ich waga.\n\nPowstają 4 ćwiartki: \"w sumie w porządku\", \"chaos o niskiej stawce\", \"katastrofa fundamentów\" i \"niewybaczalne\". Autor zastrzega, że lubi wszystkie tomy i że nie każdy zarzut to prawdziwa dziura fabularna. Idzie po kolei od tomu 1 do 7.","points":[{"t":"Kamień Filozoficzny: w sumie w porządku","d":"**Pierwszy tom jest według autora najszczelniejszy, bo jego świat jest za mały, żeby sobie przeczyć.** Ma pytania: czy wypuszczenie trolla przez Quirrella nie zdradzało, że jego zagadka strzegąca kamienia uciekła, i czy zabezpieczenia miały zatrzymać Voldemorta, czy wpuścić 11-latków.\n\nAutor zauważa też, że magia zmienia się w serii: w tomie 1 jest kapryśna i baśniowa, a w tomie 7 ma ścisłe reguły, jak to, że rozbrojenie Draco w bójce przenosi władzę nad Czarną Różdżką. Mimo to tom ląduje w ćwiartce \"w sumie w porządku\"."},{"t":"Komnata Tajemnic: chaos o niskiej stawce","d":"**Drugi tom ma dużo drobnych problemów, ale żaden nie burzy historii.** Lockhart nie pełni według autora żadnej funkcji poza komiczną, a zabicie kogutów przez Ginny wygląda na zdanie dopisane, by zamknąć furtkę: bazyliszka zabija pianie koguta, ale przecież można było zdobyć nowego.\n\nAutor pyta też, czemu Dumbledore wysłał feniksa z tiarą zamiast pójść sam, i podejrzewa, że zasady horkruksów nie były jeszcze wtedy ustalone. Wynik: \"chaos o niskiej stawce\"."},{"t":"Więzień Azkabanu: katastrofa fundamentów","d":"**Trzeci tom jest dobry i spójny, ale ma kilka problemów, które ciągną się przez całą serię.** Lupin \"zapomina\" eliksiru tojadowego, który trzeba brać przez tydzień przed pełnią, a Pettigrewa, który zmienia się w szczura, krępuje się kajdankami zamiast ogłuszyć, choć chwilę wcześniej ogłuszyli Snape'a.\n\nNajwiększy kłopot to zmieniacz czasu. Autor uważa limit 5 godzin za późniejszą łatkę i pyta, jak 13-letnia Hermiona przez cały rok podróżuje w czasie bez paradoksów. Dlatego mało błędów, ale poważne: \"katastrofa fundamentów\"."},{"t":"Czara Ognia: niewybaczalne","d":"**Plan Barty'ego Croucha juniora to według autora \"40-etapowa maszyna Rube'a Goldberga\", czyli absurdalnie skomplikowany ciąg zdarzeń.** Żeby przenieść Harry'ego na cmentarz, musiał on przeżyć smoka, zadanie pod wodą i labirynt, czyli rzeczy, których Crouch nie kontrolował. Gdyby Cedric nie zgodził się na remis, cały plan by się rozsypał.\n\nAutor wątpi też, by ktoś przez rok udawał Moody'ego przed ludźmi, którzy go znali, i zauważa, że Avada Kedavra, \"nie do zablokowania\", akurat się blokuje. Książka jest fajna, ale turniej wymyślono pod fabułę, więc ląduje w \"niewybaczalnych\"."},{"t":"Zakon Feniksa: dużo wątków, średnia waga","d":"**Piąty tom ma najwięcej równoległych wątków i według autora wiele z nich łączy się dopiero dzięki zbiegom okoliczności.** Umbridge rozbiera Hogwart, choć Dumbledore zwykle robi, co chce, wyprawa Hagrida do olbrzymów służy tylko temu, by Graup mógł potem uratować sytuację, a przepowiednia jest MacGuffinem (pretekstem fabularnym), który niczego nie zmienia.\n\nHarry zapomina o lusterku od Syriusza, a Dumbledore ignoruje go cały rok. Autor docenia oddanie emocji samotnego 15-latka, ale to jego najmniej lubiany tom."},{"t":"Książę Półkrwi: prawie bez zarzutu","d":"**Szósty tom autor uważa za zwarty i ma do niego niewiele zastrzeżeń.** Scena w jaskini z czerpaniem wody wygląda na wymuszoną, a Dumbledore ma pod ręką wszystkie trzy Insygnia Śmierci i w ogóle tego nie zauważa.\n\nGłówny zarzut to Felix Felicis, płynne szczęście: \"magiczny przycisk\", który rozwiązuje sceny i każe pytać, czemu nie użyto go wcześniej. Mimo to tom ląduje w ćwiartce \"w porządku\", nieco wyżej niż tom 1."},{"t":"Insygnia Śmierci: najbardziej zepsuty","d":"**Ostatni tom ma według autora najwięcej i najpoważniejszych problemów, bo musi domknąć wszystkie wątki.** Eliksir wielosokowy, w tomie 2 trudny i ryzykowny, staje się \"wodą z kranu\", a skoro Bill może być strażnikiem tajemnicy własnego domu, to czemu nie mogli nimi być Potterowie?\n\nNajcięższy zarzut: Harry nie powinien być horkruksem, bo Voldemort nie przygotował rytuału, a ofiara Harry'ego nie była wyborem tak jak ofiara Lily. Autor chwali jednak bitwę o Hogwart i scenę w Zakazanym Lesie jako najlepsze w serii."}],"conclusion":"Seria idzie od lewego dolnego rogu do prawego górnego: im dalej, tym mniej logiczna, ale tym bardziej kochana. Autor uważa, że więcej dziur nie oznacza gorszej lektury, ale podważa spójność historii, a krótkie zdania zamykające furtki wyglądają na celowe.","factchecks":[{"claim":"Limit zmieniacza czasu do 5 godzin to późniejsze uzupełnienie","verdict":"prawda","note":"Prawo Croakera i limit 5 godzin pojawiają się dopiero w \"Przeklętym dziecku\".","p":2,"src":[["Wikipedia (ang.): magiczne przedmioty - hasło \"Magical objects in Harry Potter\"","https://en.wikipedia.org/wiki/Magical_objects_in_Harry_Potter"]]},{"claim":"W \"Zakonie Feniksa\" niszczy się wszystkie zmieniacze czasu","verdict":"prawda","note":"Zapas zmieniaczy czasu w Ministerstwie zostaje rozbity w bitwie w Departamencie Tajemnic.","p":4,"src":[["Wikipedia (ang.): magiczne przedmioty - hasło \"Magical objects in Harry Potter\"","https://en.wikipedia.org/wiki/Magical_objects_in_Harry_Potter"]]}],"bias":"Celowo przekorny ranking, autor sam zaznacza, że część zarzutów to nie dziury, tylko pytania. Na końcu długa reklama kanału, Patreona i Discorda."},{"id":"V1xqjgRnpc0","title_pl":"Prof. Andrzej Buko o początkach Polski: Kraków, Gniezno, Piastowie i handel niewolnikami","title":"Co najnowsze odkrycia mówią o Polsce Piastów? Kim był Mieszko? Zagadka Słowian II prof. Andrzej Buko","channel":"didaskalia","url":"https://www.youtube.com/watch?v=V1xqjgRnpc0","date":"2026-04-05","duration":5605,"views":454031,"section":"Didaskalia","transcript":"youtube","added":"2026-11-03","tags":["Historia","Archeologia","Średniowiecze"],"about":"Archeolog tłumaczy, co wykopaliska, datowanie C14 i genetyka mówią o narodzinach państwa Piastów i czemu Kraków mógł być pierwszy.","intro":"Rozmowa Patrycjusza Wyżgi z prof. Andrzejem Buko, archeologiem badającym wczesne średniowiecze (kwiecień 2026). Gość pokazuje, jak nowe metody zmieniają obraz początków Polski: od wielkiej roli Krakowa i Wiślan, przez krótkie życie grodów typu Tornow-Klenica i późne powstanie Gniezna, po handel niewolnikami, datę 966, religię Słowian i genetyczne korzenie Mazowszan.","points":[{"t":"Rewolucja metod","d":"Co roku trwają dziesiątki wykopalisk, a genetyka, badania izotopowe i datowanie radiowęglowe C14 ciągle korygują, a czasem całkiem zmieniają poglądy na początki państwa. Źródeł pisanych z tej epoki jest bardzo mało."},{"t":"Kraków przed Gnieznem","d":"Zdaniem Buko pierwsza próba stworzenia państwa nastąpiła w Małopolsce. Kraków był w X wieku metropolią, a na samym Wawelu najstarszych świątyń jest więcej niż w całej Wielkopolsce. To teza dyskutowana, nie powszechnie przyjęta."},{"t":"Wiślanie i wpływy Moraw","d":"Geograf Bawarski wymienia Wiślan i Lędzian. Wielkie grody nad górną Wisłą i unikatowa biała ceramika krakowska wskazują na związki z Wielkimi Morawami, a może i na napływ ludności z południa."},{"t":"Mieszko nie był Skandynawem","d":"Popularna kiedyś koncepcja nie ma oparcia ani w źródłach, ani w archeologii. Skandynawska broń niczego nie dowodzi, bo mogła być kupiona lub zdobyta, choć część drużyny Mieszka rzeczywiście przybyła z zewnątrz."},{"t":"Zagadka grodów Tornow-Klenica","d":"Na pograniczu Wielkopolski, Śląska i Łużyc w krótkim czasie powstały dziesiątki małych, silnie umocnionych grodów o średnicy ok. 40 m. Po kilkudziesięciu latach, na początku X wieku, prawie wszystkie zniszczono."},{"t":"Gniezno jest późne","d":"Według nowych datowań gród w Gnieźnie powstał ok. lat 30-40. X wieku, a nie w IX wieku, jak sądzono. Wcześniejszy był Giecz, a Poznań mógł być handlową faktorią między nimi. Gdzie wcześniej siedzieli Piastowie, nie wiadomo."},{"t":"Niewolnicy jako towar","d":"Ludność z podbitych grodów prawdopodobnie sprzedawano na południe. Handel niewolnikami był podstawą bogactwa Franków, Bizancjum czy Hiszpanii. Według gościa niewolnik kosztował u nas ok. 34 g srebra, a na południu dziesięć razy więcej."},{"t":"Czy na pewno 966","d":"To data przyjęta umownie: chrzest mógł nastąpić rok czy dwa później, skoro Dobrawa przybyła w 965 roku. Na Ostrowie Lednickim gród i rotundę wznoszono już kilka lat wcześniej, jak pod wielką inwestycję."},{"t":"Chrobry i upadek","d":"Chrobry chciał zbudować mocarstwo i walczył z Niemcami, Czechami i Rusią. Po jego śmierci przyszła reakcja pogańska i upadek pierwszej monarchii, a ośrodek państwa przeniósł się później do Krakowa."},{"t":"Religia Słowian","d":"Słowianie palili zmarłych, więc pierwsze cmentarze szkieletowe sygnalizują chrześcijaństwo. Połabianie mieli świątynie w Arkonie i Radogoszczy, a o autentyczności Światowida ze Zbrucza w Krakowie wciąż się dyskutuje."},{"t":"Geny i dieta Mazowsza","d":"Badania mieszkańców wczesnośredniowiecznego Mazowsza wykazały domieszkę Słowian, Bałtów i ludów azjatyckich, najpewniej Awarów. Proso w diecie wskazuje na przybyszów ze wschodu. Gość marzy o takiej mapie dla każdego regionu."},{"t":"Kim byli Słowianie","d":"Ich kultura materialna to kultura ludzi w drodze, jak u amerykańskich pionierów: proste garnki i półziemianki. Tam, gdzie trafiali na bogatszą cywilizację, jak w Grecji, korzystali z miejscowych dóbr i stawali się mniej widoczni."}],"conclusion":"Fascynujący przegląd tego, jak archeologia przepisuje podręcznikową historię Polski. Warto pamiętać, które tezy są autorskie.","factchecks":[{"claim":"Dobrawa przybyła do Mieszka w 965 roku.","verdict":"prawda","note":"Małżeństwo zawarto w 965 r. i przypieczętowało ono sojusz polsko-czeski przed chrztem w 966 r.","p":7,"src":[["Wikipedia (ang.): Dobrawa - hasło \"Doubravka of Bohemia\"","https://en.wikipedia.org/wiki/Doubravka_of_Bohemia"]]},{"claim":"Geograf Bawarski wymienia Wiślan i Lędzian.","verdict":"prawda","note":"W spisie ludów pojawiają się Uuislane oraz Lendizi.","p":2,"src":[["Wikipedia (ang.): Geograf Bawarski - hasło \"Bavarian Geographer\"","https://en.wikipedia.org/wiki/Bavarian_Geographer"]]},{"claim":"Awarów pokonał Karol Wielki, kończąc ich niemal 300-letnią historię.","verdict":"przesada","note":"Frankowie pokonali Awarów ok. 799-803 r. Kaganat istniał od 567 r., czyli ok. 230-250 lat.","p":10,"src":[["Wikipedia (ang.): Awarowie panońscy - hasło \"Pannonian Avars\"","https://en.wikipedia.org/wiki/Pannonian_Avars"]]},{"claim":"Światowid ze Zbrucza jest przechowywany w Krakowie.","verdict":"prawda","note":"Znaleziony w 1848 r., eksponowany w Muzeum Archeologicznym w Krakowie.","p":9,"src":[["Wikipedia (ang.): Światowid ze Zbrucza - hasło \"Zbruch Idol\"","https://en.wikipedia.org/wiki/Zbruch_Idol"]]}],"bias":"Gość jasno mówi, które tezy są jego, np. pierwszeństwo Krakowa i sprzedaż jeńców z grodów, ale to interpretacje dyskutowane przez badaczy."},{"id":"NDrQaNmJP2g","title_pl":"Prof. Marek Demiański o ciemnej materii, czarnych dziurach i końcu wszechświata","title":"Zderzenia galaktyk, ciemna materia, czy fizyka rozumie wszechświat? II prof. Marek Demiański","channel":"didaskalia","url":"https://www.youtube.com/watch?v=NDrQaNmJP2g","date":"2026-03-29","duration":4264,"views":361793,"section":"Didaskalia","transcript":"youtube","added":"2026-11-03","tags":["Kosmos","Fizyka","Nauka"],"about":"Astrofizyk z UW o tym, jak mało wiemy o wszechświecie, czarnych dziurach w centrach galaktyk, zderzeniach galaktyk i dalekiej przyszłości kosmosu.","intro":"Patrycjusz Wyżga rozmawia z prof. Markiem Demiańskim, astrofizykiem związanym z Uniwersytetem Warszawskim (marzec 2026). Mowa o ciemnej materii i energii, kwantowej grawitacji i teorii strun, czarnej dziurze w centrum Drogi Mlecznej, gwiazdach neutronowych i pochodzeniu złota, przyszłym zderzeniu z Andromedą, pomyśle Penrose'a i o prof. Andrzeju Trautmanie.","points":[{"t":"Znamy tylko 5%","d":"Zwykła materia, z której zbudowane są gwiazdy i my, to ok. 5% zawartości wszechświata. Resztę stanowią ciemna materia i ciemna energia. Gość codziennie rano sprawdza nowe prace, licząc na przełom."},{"t":"Teoria strun ucichła","d":"Połączenia fizyki kwantowej z ogólną teorią względności szuka wiele grup. Teoria strun straciła rozgłos, bo nie dała przewidywania, które dałoby się sprawdzić obserwacją, tak jak zaćmienie Słońca potwierdziło teorię Einsteina."},{"t":"Czarna dziura w naszym centrum","d":"Gwiazdy w centrum Drogi Mlecznej krążą po elipsach wokół czegoś bardzo masywnego, co nie świeci. To czarna dziura o masie ok. 4 mln Słońc. W innych galaktykach są kolosy rzędu miliardów mas Słońca."},{"t":"Gęstsze niż jądro atomu","d":"Jądra atomowe mają gęstość ok. 10^14 g/cm³. Gwiazda neutronowa ma średnicę ok. 20 km, a w jej centrum gęstość jest jeszcze większa."},{"t":"Skąd złoto","d":"Pierwiastki cięższe od żelaza powstają w wybuchach gwiazd, ale obserwacje fal grawitacyjnych pokazały, że bardzo wydajnie tworzą się też przy zlewaniu gwiazd neutronowych. Tak powstaje m.in. złoto, platyna i uran."},{"t":"Andromeda i rozszerzanie","d":"Wszechświat się rozszerza, ale grawitacja trzyma galaktyki, a nawet nas, w całości. Dlatego Droga Mleczna może zbliżać się do Andromedy i kiedyś się z nią zderzyć. To odległa perspektywa."},{"t":"Przeciętna gwiazda, przeciętna galaktyka","d":"Słońce to raczej mniejsza gwiazda, a nasza galaktyka jest dość typowa i leżymy z dala od jej centrum. Galaktyk są setki miliardów, każda ma setki miliardów gwiazd, a planet jest dużo."},{"t":"Zimny koniec i pomysł Penrose'a","d":"W dalekiej przyszłości czarne dziury pochłoną materię, a potem wyparują przez promieniowanie. Zostanie zimna pustka, nie śmierć cieplna. Roger Penrose sądzi, że z niej może narodzić się nowy wszechświat."},{"t":"Od pięciu cząstek do zoo","d":"Gdy gość kończył studia, znano pięć cząstek: elektron, proton, neutron, foton i neutrino. Zderzacze odkryły ich wiele więcej. Natura pozwala na dualizm korpuskularno-falowy, choć to nieintuicyjne."},{"t":"Mars i mgławice","d":"Ulubione obiekty gościa to Mars, gdzie łazikiem steruje jego była studentka, oraz mgławice z końcowych etapów życia gwiazd. Słońce kiedyś spuchnie, ale to sprawa miliardów lat."},{"t":"Trautman i fale grawitacyjne","d":"Rozmowa oddaje hołd prof. Andrzejowi Trautmanowi, który jako młody naukowiec przekonywał, że fale grawitacyjne istnieją, wbrew wątpliwościom samego Einsteina. Doczekał się ich wykrycia."}],"conclusion":"Spokojna, przystępna rozmowa doświadczonego astrofizyka. Dużo podstaw kosmologii, mało sensacji.","factchecks":[{"claim":"Czarna dziura w centrum Drogi Mlecznej ma ok. 4 mln mas Słońca.","verdict":"prawda","note":"Pomiary orbit gwiazd dają ok. 4,1 do 4,3 mln mas Słońca (Sagittarius A*).","p":2,"src":[["Wikipedia (ang.): Sagittarius A* - hasło \"Sagittarius A*\"","https://en.wikipedia.org/wiki/Sagittarius_A*"]]},{"claim":"Słońce pochłonie Ziemię za ok. 4 mld lat.","verdict":"przesada","note":"Życie zniknie wcześniej, ale ewentualne pochłonięcie Ziemi przez czerwonego olbrzyma przewiduje się za ok. 7,6 mld lat, i to niepewnie.","p":9,"src":[["Wikipedia (ang.): Przyszłość Ziemi - hasło \"Future of Earth\"","https://en.wikipedia.org/wiki/Future_of_Earth"]]},{"claim":"Złoto i platyna powstają m.in. przy zlewaniu się gwiazd neutronowych.","verdict":"prawda","note":"Potwierdziły to obserwacje fal grawitacyjnych i kilonowej z 2017 r. (proces r).","p":4,"src":[["Wikipedia (ang.): Zlewanie gwiazd neutronowych - hasło \"Neutron star merger\"","https://en.wikipedia.org/wiki/Neutron_star_merger"]]}],"bias":"Gość wprost oddziela wiedzę od własnych przypuszczeń. Odcinek ma partnera reklamowego (Audioteka)."},{"id":"nVTnC6ZDQZg","title_pl":"Dr Tomasz Miller o czasie, podróżach w czasie, entropii i nieskończonościach","title":"Największe tajemnice wszechświata - Dr Tomasz Miller, didaskalia#178","channel":"didaskalia","url":"https://www.youtube.com/watch?v=nVTnC6ZDQZg","date":"2026-02-22","duration":6085,"views":980325,"section":"Didaskalia","transcript":"youtube","added":"2026-11-03","tags":["Nauka","Fizyka","Matematyka"],"about":"Fizyk matematyczny tłumaczy, czemu czas płynie różnie, czy można podróżować w czasie i ile jest rodzajów nieskończoności.","intro":"Półtoragodzinna rozmowa Patrycjusza Wyżgi z dr. Tomaszem Millerem, fizykiem matematycznym (luty 2026). Czas we względności i fizyce kwantowej, Interstellar i GPS, soczewkowanie grawitacyjne, paradoks bliźniąt, podróże w przeszłość i wszechświat Gödla, strzałka czasu i entropia, początek czasu, a na koniec matematyka: nieskończoności Cantora, liczby p-adyczne i dzielenie przez zero.","points":[{"t":"Czym jest czas","d":"Fizyka definiuje czas operacyjnie, tak jak energię czy siłę. Wielu fizyków uważa, że jego upływ jest iluzją albo zjawiskiem emergentnym. Nie ma jednej rzeki czasu: każdy ma własny strumyk, płynący w tempie zależnym od ruchu."},{"t":"Czas w fizyce kwantowej","d":"Mechanika kwantowa działa na płaskim tle szczególnej teorii względności, więc natury czasu nie wyjaśnia. Są koncepcje czasu termicznego, np. Rovellego i Connesa, ale niepotwierdzone. Kwantowa grawitacja jest wciąż zbyt trudna matematycznie."},{"t":"Interstellar i GPS","d":"Im głębiej w studni grawitacyjnej, tym wolniej płynie czas, jak na planecie Millera w filmie, liczonym zgodnie z OTW przez Kipa Thorne'a. Satelity GPS muszą uwzględniać tę dylatację oraz efekt prędkości, inaczej pozycja byłaby błędna."},{"t":"Soczewki grawitacyjne","d":"Masa zakrzywia drogę światła, więc galaktyki działają jak soczewki. Mikrosoczewkowanie pozwala wykryć nawet samotne planety. Supernowa widoczna potrójnie dotarła w różnym czasie, a astronomowie przewidzieli kolejny obraz."},{"t":"Paradoks bliźniąt","d":"Szczególna teoria względności działa w układach inercjalnych. Brat w rakiecie musi hamować i zawracać, więc symetrii nie ma: prędkości są względne, przyspieszenia nie. To on po powrocie będzie młodszy."},{"t":"Podróż w przyszłość jest możliwa","d":"Wystarczy szybko lecieć albo przebywać blisko masywnego obiektu. Na rowerze zyskujemy pikosekundy, a efekt staje się wielki dopiero przy prędkościach bliskich światłu albo przy czarnej dziurze."},{"t":"Przeszłość i wszechświat Gödla","d":"Do cofania się dylatacja nie wystarczy, potrzebne są zamknięte krzywe czasopodobne. Gödel, przyjaciel Einsteina, znalazł takie rozwiązanie równań OTW. Paradoksy logiczne i entropia sugerują, że w naszym świecie ich nie ma."},{"t":"Entropia i życie","d":"Druga zasada termodynamiki dotyczy układów izolowanych, a Ziemia dostaje energię od Słońca, więc ewolucja jej nie łamie. Organizmy to pompy entropii. Zagadką pozostaje, czemu wczesny wszechświat miał tak niską entropię."},{"t":"Początek czasu","d":"W OTW początek czasu jest jak biegun północny: nie ma nic bardziej na północ. Niektóre teorie kwantowej grawitacji przewidują odbicie zamiast osobliwości, a nawet wszechświaty potomne we wnętrzach czarnych dziur."},{"t":"Wiele nieskończoności","d":"Cantor, precyzując, co znaczy równoliczność zbiorów, odkrył, że są nieskończoności różnej wielkości. Istnieją różne systemy liczb pozaskończonych, więc odpowiedź dla sześciolatka zależy od wybranego systemu."},{"t":"Drabinka liczb i zero","d":"Od naturalnych przez wymierne i rzeczywiste do zespolonych, a obok liczby p-adyczne. Zero pojawiło się późno i budziło nieufność. Dzielenia przez zero lepiej nie definiować, bo wymaga to rezygnacji z innych praw arytmetyki."}],"conclusion":"Jasny, cierpliwy przewodnik po czasie i nieskończoności. Gość uczciwie mówi, czego nie rozumie, a co jest jeszcze spekulacją.","factchecks":[{"claim":"Po 25 latach na stacji kosmicznej przenieślibyśmy się w przyszłość o ok. 2 s.","verdict":"przesada","note":"Na ISS zegar spóźnia się ok. 0,01 s na rok, czyli ok. 0,25 s w 25 lat. Gość zastrzegł, że nie pamięta liczb.","p":5,"src":[["Wikipedia (ang.): dylatacja czasu - hasło \"Time dilation\"","https://en.wikipedia.org/wiki/Time_dilation"]]},{"claim":"Kip Thorne napisał książkę o nauce w filmie Interstellar.","verdict":"prawda","note":"To \"The Science of Interstellar\" (2014), po polsku \"Interstellar i nauka\".","p":2,"src":[["Wikipedia (ang.): Kip Thorne - hasło \"Kip Thorne\"","https://en.wikipedia.org/wiki/Kip_Thorne"]]},{"claim":"Gödel znalazł rozwiązanie równań OTW z zamkniętymi krzywymi czasopodobnymi.","verdict":"prawda","note":"Opublikował je w 1949 r. W jego wszechświecie takie pętle przechodzą przez każde zdarzenie.","p":6,"src":[["Wikipedia (ang.): metryka Gödla - hasło \"Gödel metric\"","https://en.wikipedia.org/wiki/Gödel_metric"]]},{"claim":"Cantor wykazał, że istnieją nieskończoności różnej wielkości.","verdict":"prawda","note":"Udowodnił m.in., że liczb algebraicznych jest przeliczalnie wiele, a przestępnych nieprzeliczalnie.","p":9,"src":[["Wikipedia (ang.): Georg Cantor - hasło \"Georg Cantor\"","https://en.wikipedia.org/wiki/Georg_Cantor"]]}],"bias":"Brak stronniczości. Gość wyraźnie oznacza spekulacje, np. odbicie zamiast Wielkiego Wybuchu czy wszechświaty w czarnych dziurach, i przyznaje się do niewiedzy."},{"id":"gDJclWCw1qY","title_pl":"Remigiusz Kinas: polski Bielik kontra ChatGPT i AI w biotech","title":"Polski Bielik obnaża ograniczenia ChatGPT || Remigiusz Kinas - didaskalia#171","channel":"didaskalia","url":"https://www.youtube.com/watch?v=gDJclWCw1qY","date":"2026-01-18","duration":8214,"views":217463,"section":"Didaskalia","transcript":"youtube","added":"2026-11-05","tags":["Technika","Nauka"],"about":"Współtwórca Bielika o lokalnym LLM, Heliosie, pipeline treningu, GPU i AI w odkrywaniu leków w Ingenic AI.","intro":"Patrycjusz Wyżga rozmawia z Remigiuszem Kinasem, informatykiem z Politechniki Poznańskiej, współtwórcą polskiego LLM Bielik i researcherem AI w biotechowej firmie Ingenic AI.\n\nRozmowa idzie od pytania \"po co Bielik przy ChatGPT\", przez historię Spichlerza i trening na Heliosie w Cyfronecie, etapy pretreningu, SFT, alignmentu i RL, po GPU, krytykę sensacji o \"magicznym polskim\" oraz AI w drug discovery.","points":[{"t":"Po co Bielik przy GPT i Gemini","d":"**Kinas: lokalny, darmowy model pod polski korpus, banki i dane wrażliwe, których nie wolno wrzucać do chmury.** Argumenty: bezpieczeństwo, szybkość inferencji bez latencji sieci, fine-tuning, brak limitów tokenów, niezależność infrastruktury.\n\nChatGPT da się zamknąć w chmurze Microsoftu, ale open-source'owy Bielik stoi na własnych serwerach. Inicjatywa Spichlerz powstała ok. 2023 jako oddolny, niekomercyjny korpus języka polskiego."},{"t":"Helios, Grace Hopper i pierwszy trening","d":"**Pierwszy Bielik (7B, v0.1) poszedł na Heliosie AGH/Cyfronet (ok. 360 z 440 akceleratorów Grace Hopper NVIDIA) jako test obciążenia nowej maszyny.** Chłodzenie wodne, architektura ARM, ogromny koszt błędnego skryptu.\n\nFeedback: \"polski ChatGPT jest głupi\" (m.in. Kuba Klawiter). Zespół wziął krytykę jako sygnał; ważne było samo hasło \"polski ChatGPT\" na uczelnianej mocy. Kolejne wersje poprawiały pipeline i datasety."},{"t":"Pipeline: dane, pretrening, SFT, alignment, RL","d":"**Etapy: zbieranie i czyszczenie korpusu, pretrening (przewidywanie kolejnego tokena), SFT (uczenie odpowiedzi na pytania), alignment (\"wychowanie\" stylu i odmowy) oraz reinforcement learning.** Polska często robi continued pretraining: bierze model już trenowany po angielsku i dotrenowuje mieszanką PL+EN, bo od zera brakuje mocy i danych.\n\nKinas prowadzi RL: model na matematyce poprawia też inne benchmarki
