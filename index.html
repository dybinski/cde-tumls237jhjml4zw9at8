<style>
:root{color-scheme:dark}
:root{--ink:#eeeeee;--mut:#999999;--line:#222222;--s1:1.5rem;--s2:1.125rem;--s3:.9375rem;--s4:.875rem;
--v-prawda:#4cc46a;--v-polprawda:#f2c94c;--v-przesada:#ff9440;--v-falsz:#ff5a5a;--v-nds:#8c8c8c;--red:#ff3b30}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#000;color:var(--ink);font:400 var(--s3)/1.6 "Figtree","Helvetica Neue",Arial,sans-serif}
body.lock{overflow:hidden}
a{color:inherit;text-decoration:underline;text-decoration-color:#666;text-underline-offset:3px}
a:hover{text-decoration-color:var(--ink)}
button{font:inherit;color:inherit}
.wrap{max-width:1440px;margin:0 auto;padding:0 24px}
.bar{position:sticky;top:0;z-index:5;background:#000;border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:16px;padding-top:12px;padding-bottom:12px}
h1{font-size:var(--s2);font-weight:600;margin:0;white-space:nowrap;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.ctl{display:flex;gap:10px;flex:1;justify-content:flex-end}
#q{max-width:420px}
input,select{font:inherit;font-size:var(--s3);color:var(--ink);background:#000;border:1px solid #444;border-radius:24px;padding:0 16px;min-height:44px;width:100%;outline:none;-webkit-appearance:none;appearance:none}
select{width:auto;padding-right:32px;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat;cursor:pointer}
input:focus,select:focus{border-color:var(--ink)}
.sync{display:inline-block;width:8px;height:8px;border-radius:50%;background:#6a6a6a;overflow:hidden;color:transparent;font-size:1px;flex:none}
.sync.ok{background:var(--v-prawda)}.sync.off{background:var(--v-przesada)}
main{padding:24px 0 40px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:32px 16px}
@media (max-width:1279px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:899px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:599px){.grid{grid-template-columns:1fr;gap:28px}}
.tile{display:block;text-decoration:none;color:inherit;border-radius:12px;outline-offset:4px}
.th{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#111}
.th img{display:block;width:100%;height:100%;object-fit:cover;transition:opacity .2s}
.dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.8);color:#fff;font-size:.75rem;font-weight:600;line-height:1;padding:4px 5px;border-radius:4px}

.rd{display:none;position:absolute;left:8px;top:8px;background:rgba(0,0,0,.8);color:#fff;font-size:.75rem;font-weight:600;line-height:1;padding:5px 7px;border-radius:4px}
.prog{display:none;position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--red)}
.tile.read .th img{opacity:.4}
.tile.read .rd,.tile.read .prog{display:block}
.tile.read .dur{bottom:12px}
.vbar{display:flex;height:4px;gap:2px;margin:8px 0 0}
.vbar b{display:block;height:100%;border-radius:1px}
.tile h2{font-size:var(--s3);font-weight:600;line-height:1.4;margin:10px 0 2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .meta{color:var(--mut);font-size:var(--s4);margin:0}
.tile.read h2{color:var(--mut)}
.tile:hover h2{text-decoration:underline;text-decoration-color:#666;text-underline-offset:3px}
.empty{color:var(--mut);padding:40px 0}
footer{color:var(--mut);font-size:var(--s4);padding:8px 0 48px}
footer p{margin:0}
.chipw{overflow:hidden}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border:0;border-radius:8px;background:#1c1c1c;color:var(--ink);font-size:.875rem;font-weight:600;text-decoration:none;white-space:nowrap;scroll-snap-align:start;cursor:pointer}
.chip:hover{background:#2a2a2a}
.chip[aria-current="true"]{background:var(--ink);color:#000}
.chip .n{font-weight:400;color:var(--mut);font-size:.75rem}
.chip[aria-current="true"] .n{color:#555}
.sinfo{color:var(--mut);font-size:var(--s4);margin:0 0 16px}
.sinfo:empty{display:none}
/* modal */
.ov{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.8);display:none;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.ov.on{display:block}
.dlg{background:#000;max-width:760px;margin:40px auto;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.mh{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 12px;background:rgba(0,0,0,.9);border-bottom:1px solid var(--line)}
.x{min-height:48px;padding:0 20px;border:1px solid #6a6a6a;border-radius:24px;background:#000;cursor:pointer;font-weight:600}
.x:hover{border-color:var(--ink)}
.rate{display:flex;gap:8px}
.rb{display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;padding:0;border:1px solid #6a6a6a;border-radius:24px;background:#000;cursor:pointer;-webkit-tap-highlight-color:transparent}
.rb svg{width:22px;height:22px;fill:currentColor;display:block}
.rb .on{display:none}
.rb:hover{border-color:var(--ink)}
.rb[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#000}
.rb[aria-pressed="true"] .on{display:block}.rb[aria-pressed="true"] .off{display:none}
.rb:focus-visible,.x:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.rt{display:none;position:absolute;right:8px;top:8px;width:24px;height:24px;border-radius:12px;background:rgba(0,0,0,.8);color:#fff;align-items:center;justify-content:center}
.rt svg{width:14px;height:14px;fill:currentColor;display:block}
.tile.up .rt,.tile.down .rt{display:flex}
.mimg{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;background:#111}
.mb{max-width:640px;margin:0 auto;padding:32px 28px 48px;font-size:1.125rem;line-height:1.6}
.mb p{margin:0}
.mb h2{font-size:1.75rem;font-weight:600;line-height:1.25;margin:0 0 10px;letter-spacing:-.015em}
.mmeta{color:var(--mut);font-size:.875rem;line-height:1.5;margin:0 0 28px!important}
.lead{font-size:1.1875rem;line-height:1.6;color:var(--ink);margin:0 0 40px}
.lead p+p{margin-top:14px!important}
.pd p+p,.blk p+p{margin-top:10px!important}
.pd strong{color:#ececec;font-weight:600}
.pts{list-style:none;margin:0;padding:0}
.pts li{margin:0 0 32px}
.pts h3{font-size:1.25rem;font-weight:600;line-height:1.4;margin:0 0 6px;color:#f5f5f5}
.pts .pd{color:#a8a8a8}
.fcs{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.bdg{display:inline-flex;align-items:center;gap:7px;min-height:32px;padding:0 12px;border:1px solid #333;border-radius:16px;background:#0d0d0d;color:#cfcfcf;font-size:.8125rem;font-weight:600;line-height:1;cursor:pointer}
.bdg:hover,.bdg[aria-expanded="true"]{border-color:#777;color:var(--ink)}
.bdg .dot{width:8px;height:8px;border-radius:50%;margin:0;flex:none}
.bdg .chev{font-weight:400;color:var(--mut);transition:transform .15s}
.bdg[aria-expanded="true"] .chev{transform:rotate(180deg)}
.fx{margin:12px 0 0;padding:14px 16px;border-left:3px solid var(--v-nds);background:#0b0b0b;border-radius:0 8px 8px 0;font-size:1.0625rem;line-height:1.6}
.fx[hidden]{display:none}
.fx .cl{color:var(--ink);font-weight:600;margin:0 0 6px!important}
.fx .nt{color:#a8a8a8}
.fx .sr{margin:8px 0 0!important;font-size:.9375rem;color:var(--mut)}
.fx .sr a{color:#bdbdbd;margin-right:12px;display:inline-block}
.blk{margin:40px 0 0;padding:20px 22px;border:1px solid #2a2a2a;border-radius:12px}
.blk+.blk{margin-top:16px}
.blk h3{font-size:.8125rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:0 0 8px}
.blk p{color:#d6d6d6}
.blk.bias{border-color:#3a2a1a;background:#0c0905}
.mfoot{margin:40px 0 0;padding:20px 0 0;border-top:1px solid var(--line);color:var(--mut);font-size:.875rem;line-height:1.55}
.mfoot p{margin:0 0 10px!important}
.mfoot .orig a{color:#bdbdbd}
.tags{display:flex;flex-wrap:wrap;gap:0 14px;margin:0 0 6px}
.tag{color:var(--mut);background:none;border:0;padding:0;min-height:36px;cursor:pointer;font-size:.875rem}
.tag:hover{color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin:0 0 12px}
.legend span{white-space:nowrap}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.mfoot .vbar{height:4px;margin:0 0 8px;max-width:240px}
.small{color:var(--mut)}
.v-prawda{border-color:var(--v-prawda)!important;background-color:var(--v-prawda)}
.v-polprawda{border-color:var(--v-polprawda)!important;background-color:var(--v-polprawda)}
.v-przesada{border-color:var(--v-przesada)!important;background-color:var(--v-przesada)}
.v-falsz{border-color:var(--v-falsz)!important;background-color:var(--v-falsz)}
.v-nds{border-color:var(--v-nds)!important;background-color:var(--v-nds)}
.fx.v-prawda,.fx.v-polprawda,.fx.v-przesada,.fx.v-falsz,.fx.v-nds{background-color:#0b0b0b}
.ur{min-height:48px;padding:0 20px;border:1px solid #6a6a6a;border-radius:24px;background:#000;cursor:pointer;margin-top:6px;font-size:.9375rem}
.ur:hover{border-color:var(--ink)}
@media (max-width:599px){
 .wrap{padding:0 16px}
 .bar .wrap{flex-wrap:wrap;gap:8px 10px;padding-top:10px;padding-bottom:10px}
 h1{flex:1}
 .ctl{flex-basis:100%;flex-wrap:wrap;gap:8px}
 #q{max-width:none;flex-basis:100%}
 .ctl select{flex:1}
 input,select{font-size:16px}
 main{padding-top:16px}
 .ov{background:#000}
 .dlg{margin:0;border:0;border-radius:0;min-height:100%}
 .mb{padding:24px 20px 48px;font-size:1.0625rem}
 .mb h2{font-size:1.5rem}
 .lead{font-size:1.125rem;margin-bottom:36px}
 .pts h3{font-size:1.125rem}
 .pts li{margin-bottom:28px}
 .blk{padding:18px 18px}
}
</style>
</head>

(function(){

adrans materiału studyjnego.\n\nGłos trafia potem na czarny rynek pod scamy finansowe. Czerwone flagi: brak wideo, pełna automatyzacja, zero kontaktu z żywym rekruterem. Szukasz pracy, więc jesteś w trybie \"zrobić wrażenie\", nie \"podejrzyj\"."},{"t":"6-5: vishing i hasło głosowe banku","d":"**Vishing (voice phishing): SMS \"od banku\" z numerem do oddzwonienia; automat prosi, byś powiedział imię i frazę w stylu \"autoryzuję transakcję\".** Nagrywają Cię i odtwarzają to prawdziwemu bankowi. Prawdziwy bank według autora nie wyśle SMS-em numeru do oddzwonienia - dzwonisz na numer z karty.\n\nCzęść banków używa biometrii głosowej jako hasła (\"My voice is my password\"). Autor powołuje się na test Vice z 2023: sklonowany głos dziennikarza przeszedł system za pierwszym razem. Rada: zapytaj bank, czy masz voice ID, wypisz się i wymuś PIN albo drugie hasło."},{"t":"4 i 3: fałszywy dowód i słowo bezpieczeństwa","d":"**Klon może \"przyznać się\" do przestępstwa albo grozić - nagranie idzie na policję, do sieci albo do pracodawcy.** Autor podkreśla, że prawo wciąż ufa audio, a większość komisariatów nie ma narzędzi forensycznych; ciężar dowodu spada na Ciebie (timestampy, lokalizacja, prawnik).\n\nObrona rodzinna bez techu: wspólne tajne słowo, którego nie ma w internecie (nie imię psa). Prawdziwy bliski je poda; scam będzie naciskał na pośpiech. Potem oddzwaniasz na numer, który już masz, nie na ten z połączenia."},{"t":"2-1: odcisk emocji i hijack firmowy","d":"**Nowoczesne AI według autora nie kopiuje tylko słów, lecz \"odcisk emocji\": strach, pęknięty głos, krótki oddech.** Cel to kilka sekund amygdala hijack, gdy reakcja wyprzedza myślenie - matka słyszy nie treść, tylko emocję znaną od lat.\n\nNumer 1: cichy uczestnik Zoomu nagrywa szefów, potem dzwoni do finansów sklonowanym głosem CEO z pilnym przelewem \"tylko między nami\". Autor podaje Hongkong: menedżer przelał ok. 35 mln USD po klonie dyrektora z publicznych wywiadów. Rada firmowa: żaden przelew tylko telefonicznie; waiting room i weryfikacja uczestników."}],"conclusion":"Autor chce, byś przestał ufać uszom w panice: głos da się sklonować z publicznych sekund, a pośpiech jest częścią ataku. Słowo bezpieczeństwa w rodzinie, oddzwanianie na znany numer i drugi kanał przy przelewach to według niego najtańsza tarcza.","factchecks":[{"claim":"Jennifer DeStefano (Arizona, 2023) dostała telefon z \"porwaną\" córką - głos sklonowany AI.","verdict":"półprawda","note":"Incydent i zeznanie w Senacie USA są potwierdzone; użycie AI jest jej przekonaniem, nie wyrokiem sądu.","p":0,"src":[["NBC News: sprawa Jennifer DeStefano","https://www.nbcnews.com/tech/security/ai-voice-cloning-scam-kidnapping-jennifer-destefano-rcna78947"],["The Guardian: zeznanie o scamie AI","https://www.theguardian.com/us-news/2023/jun/14/ai-kidnapping-scam-senate-hearing-jennifer-destefano"],["CNN: virtual kidnapping i AI","https://www.cnn.com/2023/04/29/us/ai-scam-calls-kidnapping-cec"]]},{"claim":"Do sklonowania głosu wystarczą ok. 3 sekundy nagrania.","verdict":"półprawda","note":"Krótkie próbki reklamują narzędzia consumer; skuteczny bypass banku w teście Vice wymagał minut mowy.","p":0,"src":[["Wikipedia (ang.): audio deepfake","https://en.wikipedia.org/wiki/Audio_deepfake"],["azfamily: ekspert ASU o 3 sekundach","https://www.azfamily.com/2023/04/10/ive-got-your-daughter-scottsdale-mom-warns-close-encounter-with-ai-voice-cloning-scam/"]]},{"claim":"Dziennikarz Vice w 2023 wszedł do konta bankowego sklonowanym głosem.","verdict":"prawda","note":"Joseph Cox (Motherboard) przeszedł Voice ID Lloyds własnym klonem z ElevenLabs.","p":2,"src":[["Vice: How I Broke Into a Bank Account With an AI-Generated Voice","https://www.vice.com/en/article/how-i-broke-into-a-bank-account-with-an-ai-generated-voice/"],["Biometric Update: opis testu","https://www.biometricupdate.com/202302/journalist-uses-ai-voice-to-break-into-own-bank-account"]]},{"claim":"Vishing to phishing głosowy: nagrane zgody odtwarza się bankowi.","verdict":"prawda","note":"Voice phishing to uznana technika: spoofing numeru i wyłudzenie haseł albo autoryzacji.","p":2,"src":[["Wikipedia (ang.): voice phishing","https://en.wikipedia.org/wiki/Voice_phishing"]]},{"claim":"W Hongkongu menedżer przelał ok. 35 mln USD po sklonowanym głosie dyrektora.","verdict":"prawda","note":"Sprawa ok. 2020: deepfake głos dyrektora + maile; osobno jest późniejszy scam wideo na ok. 25 mln USD.","p":4,"src":[["MIT AI Risk: incydent Hongkong 35 mln USD","https://airisk.mit.edu/ai-incidents/147-reported-ai-cloned-voice-used-to-deceive-hong-kong-bank"],["Wikipedia (ang.): deepfake","https://en.wikipedia.org/wiki/Deepfake"]]},{"claim":"Scam na dziadków z klonem głosu wnuka to realny wariant classic grandparent scam.","verdict":"prawda","note":"Grandparent scam istnieje od lat; AI voice cloning jest udokumentowanym upgrade'em tej metody.","p":0,"src":[["Wikipedia (ang.): grandparent scam","https://en.wikipedia.org/wiki/Grandparent_scam"],["Futurism: klon głosu vs bank","https://futurism.com/the-byte/journalist-clones-voice-break-into-bank"]]}],"bias":"Katalog scare-content: anegdoty i rady bez metodologii; \"3 sekundy\" i czarny rynek uproszczone. Brak danych o skali vs klasyczne scamy."},{"id":"yY4Z-E1ieII","title_pl":"Co wolno władzy, a zwykłym ludziom nie","title":"Things That Are Legal For Them But Not For Us","channel":"Chill Dude Explains","url":"https://www.youtube.com/watch?v=yY4Z-E1ieII","date":"2026-11-05","duration":658,"views":1472,"section":"Chill Dude Explains","transcript":"youtube","added":"2026-11-05","tags":["Historia","Psychologia","Technika"],"about":"Ranking 10 przywilejów władzy w USA: druk pieniądza, audyty Pentagonu, deklasyfikacja, wywłaszczenie, worki dyplomatyczne, FISA i kłamstwa policji.","intro":"Chill Dude Explains to kanał z humorystycznymi rankingami o prawie i codziennym życiu, tu głównie w USA. Film stawia pytanie: które działania są u władzy legalne i nagradzane, a u zwykłego człowieka kończą się więzieniem?\n\nAutor odlicza od 10. do 1. miejsca. Przy każdym punkcie pokazuje podwójny standard, podaje konkretną sprawę albo liczbę i kończy żartem. Zmierza do tego, że system ma wbudowane wyjątki dla siebie samego.","points":[{"t":"10. Drukowanie pieniędzy","d":"**Rząd USA może \"drukować\" pieniądze z niczego, a Ty za to samo dostajesz klatkę.** Według autora to, co u Fed nazywa się luzowaniem ilościowym (quantitative easing, skup aktywów i zwiększanie podaży pieniądza), u prywatnej osoby to fałszerstwo.\n\nPo 2020 r. według filmu stworzono tyle dolarów, że 40% wszystkich istniejących dolarów USA powstało w zaledwie 2 lata. Skutek: droższe zakupy, wyższy czynsz, ta sama pensja kupuje mniej. Arthur Budovsky, który prowadził prywatny system pieniężny Liberty Reserve, dostał 20 lat. Rząd prowadzi swój system i ma budynek w Waszyngtonie."},{"t":"9. Nieudane audyty Pentagonu","d":"**Pentagon (resort obrony USA) nigdy nie zdał audytu finansowego, choć od 1990 r. ma taki obowiązek.** W 2023 r. według autora oblał po raz szósty z rzędu od chwili, gdy w ogóle zaczął próbować; wcześniej nawet nie próbował.\n\nBudżet na 2023 r. to według filmu 858 mld dolarów, a znaczącej części wydatków z lat nie da się rozliczyć. Firma, która sześć razy z rzędu oblałaby audyt, przestałaby istnieć jako podmiot. Pentagon wydaje komunikat o \"postępach\", a Kongres (parlament USA), który zatwierdza ten budżet, głównie wzrusza ramionami."},{"t":"8. Prezydent deklasyfikuje myślą","d":"**Urzędnik, który ujawni tajemnicę państwową, idzie do więzienia. Prezydent może odtajnić prawie wszystko samym aktem wypowiedzenia.** Według autora jest na szczycie całego systemu klasyfikacji, więc w chwili, gdy postanawia coś powiedzieć, to już nie jest tajemnica.\n\nNie trzeba formularza ani zgody komisji. Zwykły pracownik, który zostawi tajny dokument w aucie, ryzykuje zarzuty federalne. Prezydent może przekazać tajne informacje obcemu przywódcy i jest to legalne, bo sam akt powiedzenia jest deklasyfikacją."},{"t":"7. Wywłaszczenie (eminent domain)","d":"**Państwo może zabrać Twój dom \"dla dobra publicznego\" i oddać go prywatnemu deweloperowi.** W zamian płaci to, co samo uzna za wartość, nie to, co Ty uważasz.\n\nW 2005 r. Suzette Kelo miała różowy domek w New London w Connecticut. Miasto chciało oddać teren prywatnej firmie farmaceutycznej Pfizer pod kompleks biurowo-handlowy. Sprawa doszła do Sądu Najwyższego USA i Kelo przegrała: przekazanie prywatnej ziemi prywatnej firmie uznano za \"użytek publiczny\", bo firma miałaby tworzyć miejsca pracy. Pfizer nic nie zbudował, a działka latami stała pusta."},{"t":"6. Worki dyplomatyczne","d":"**Zapieczętowane \"worki dyplomatyczne\" przechodzą przez lotniska bez kontroli TSA, Interpolu ani celnych.** Opiera się to na Konwencji wiedeńskiej z 1961 r.: mają zawierać tylko dokumenty i rzeczy służbowe, ale nikt nie sprawdza, czy tak jest.\n\nW 1984 r. na lotnisku w Londynie w dyplomatycznej skrzyni znaleziono Umaru Dikko, byłego nigeryjskiego urzędnika, porwanego, odurzonego i przemycanego do Nigerii. Brytyjscy celnicy otworzyli skrzynię wbrew prawu międzynarodowemu i uratowali mu życie. Według autora worki łączono z przemytem gotówki, broni i narkotyków, a konwencja nie limituje rozmiaru: może to być kontener."},{"t":"5. Banki i pieniądze karteli","d":"**HSBC złapano na praniu niemal 1 mld dolarów z meksykańskich karteli narkotykowych.** Według autora kasjerzy używali specjalnych skrzynek dopasowanych do paczek gotówki kartelu. Bank zapłacił karę 1,9 mld dolarów, czyli według filmu około 5 tygodni przychodu, i nikt z kierownictwa nie trafił do aresztu.\n\nDepartament Sprawiedliwości USA uznał, że ściganie banku może zachwiać systemem finansowym: bank był \"za duży, by go aresztować\". Ty za wpłatę 500 dolarów gotówką bez papierów możesz dostać zgłoszenie. Kara dla HSBC to według autora nie kara, tylko opłata transakcyjna."},{"t":"4. Tajny sąd FISA","d":"**FISA Court (Foreign Intelligence Surveillance Court) to prawdziwy sąd o inwigilacji, w którym występuje tylko rząd.** Nie ma drugiej strony, adwokata obrony ani możliwości sprzeciwu, bo cel często nawet nie wie, że jest śledzony.\n\nW latach 1979-2013 rząd według autora złożył 33 942 wnioski o inwigilację, a sąd odmówił 11 razy (0,03%). Sprawa stała się powszechnie znana dzięki Edwardowi Snowdenowi. Autor porównuje to do meczu koszykówki, na który przychodzi tylko jedna drużyna, a sędzia i tak \"zatwierdza\" wynik."},{"t":"3. Konfiskata bez wyroku","d":"**Civil asset forfeiture pozwala zabrać auto, gotówkę lub dom bez zarzutu, aresztu i wyroku.** Policjant uznaje dużą sumę za \"podejrzaną\" i zabiera ją na miejscu. Żeby odzyskać majątek, musisz udowodnić, że jest \"niewinny\". Sprawa bywa stylu \"Stany Zjednoczone kontra 40 000 dolarów\".\n\nKoszty adwokata często przekraczają wartość zabranej rzeczy, więc ludzie odpuszczają. Według autora w 2014 r. federalne konfiskaty przewyższyły łączną wartość łupów wszystkich włamywaczy w USA. Część stanów reformuje przepisy, ale w wielu reguły są te same."},{"t":"2. Areszt za \"nieposłuszeństwo\"","d":"**Civil contempt (cywilna obraza sądu) pozwala sędziemu wsadzić kogoś do aresztu bez ławy przysięgłych, zarzutów karnych i terminu końca.** Przesłanie brzmi: \"klucz do celi masz Ty\" - siedzisz, aż się podporządkujesz.\n\nH. Beatty Chadwick z Pensylwanii spędził 14 lat w areszcie bez skazania, bo sędzia nie uwierzył, że w sprawie rozwodowej zniknęło 2,5 mln dolarów. Wyszedł w 2009 r. nie dlatego, że sąd go uniewinnił, tylko dlatego, że pierwotny sędzia uznał, że trwa to wystarczająco długo. Bankowiec z wyrokiem ma proces i termin; tu nie ma żadnego z tych zabezpieczeń."},{"t":"1. Policja może kłamać","d":"**W USA policja może w przesłuchaniu kłamać w oczy: że ma odciski, DNA, nagranie albo że wspólnik już wszystkiego się wyrzekł.** Sąd Najwyższy w 1969 r. w sprawie Frazier v. Cupp uznał takie kłamstwa za dopuszczalne.\n\nTy kłamiesz federalnemu funkcjonariuszowi - to przestępstwo z 18 U.S.C. § 1001 i grozi więzienie. Badania według autora wiążą fałszywe przyznania z taktyką \"fałszywych dowodów\": niewinni ludzie przyznawali się, bo detektyw mówił, że ich DNA jest na miejscu zbrodni. Jeśli słyszysz \"mamy już wszystko, opowiedz swoją wersję\", mogą nie mieć nic."}],"conclusion":"Autor nie wzywa do łamania prawa, tylko pokazuje asymetrię: te same czyny u władzy mają ładne nazwy i immunitet, a u obywatela kończą się klatką. Puenta: system, który sam siebie audytuje, rzadko się zawiesza.","factchecks":[{"claim":"Po 2020 ok. 40% dolarów USA powstało w 2 lata przez \"druk\" Fed.","verdict":"półprawda","note":"M2 mocno skoczyło 2020-21, ale \"40% wszystkich dolarów\" i zrównanie z fałszerstwem to uproszczenie.","p":0,"src":[["Fed: FAQ o luzowaniu ilościowym","https://www.federalreserve.gov/faqs/money_12845.htm"],["Wikipedia (ang.): luzowanie ilościowe - \"Quantitative easing\"","https://en.wikipedia.org/wiki/Quantitative_easing"],["FRED: seria podaży M2","https://fred.stlouisfed.org/series/M2SL"]]},{"claim":"Arthur Budovsky (Liberty Reserve) dostał 20 lat za prywatny pieniądz.","verdict":"prawda","note":"Budovsky, twórca Liberty Reserve, został skazany na 20 lat więzienia.","p":0,"src":[["Wikipedia (ang.): Arthur Budovsky","https://en.wikipedia.org/wiki/Arthur_Budovsky"],["Wikipedia (ang.): Liberty Reserve","https://en.wikipedia.org/wiki/Liberty_Reserve"]]},{"claim":"Pentagon w 2023 oblał audyt po raz 6. z rzędu; budżet ok. 858 mld USD.","verdict":"prawda","note":"DoD od lat nie otrzymuje czystej opinii audytora; budżet obronny FY2023 był rzędu 850+ mld.","p":1,"src":[["Wikipedia (ang.): Departament Obrony USA","https://en.wikipedia.org/wiki/United_States_Department_of_Defense"],["Wikipedia (ang.): Chief Financial Officers Act","https://en.wikipedia.org/wiki/Chief_Financial_Officers_Act"]]},{"claim":"Prezydent USA może deklasyfikować informacje samym oświadczeniem.","verdict":"półprawda","note":"Ma szeroką władzę odtajniania, ale praktyka i procedury są bardziej złożone niż \"myśl = tajemnica znika\".","p":2,"src":[["Wikipedia (ang.): informacje niejawne w USA","https://en.wikipedia.org/wiki/Classified_information_in_the_United_States"],["Wikipedia (ang.): Executive Order 13526","https://en.wikipedia.org/wiki/Executive_Order_13526"]]},{"claim":"Kelo v. New London (2005): dom oddano pod projekt z udziałem Pfizera.","verdict":"prawda","note":"Sąd Najwyższy uznał rozwój gospodarczy za public use; teren później długo stał pusty.","p":3,"src":[["Wikipedia (ang.): Kelo v. City of New London","https://en.wikipedia.org/wiki/Kelo_v._City_of_New_London"]]},{"claim":"W 1984 Dikko znaleziono w skrzyni dyplomatycznej na lotnisku w Londynie.","verdict":"prawda","note":"Afera Dikko: porwanie i próba przemytu w kontenerze oznaczonym jako dyplomatyczny.","p":4,"src":[["Wikipedia (ang.): afera Dikko","https://en.wikipedia.org/wiki/Dikko_affair"],["Wikipedia (ang.): worek dyplomatyczny","https://en.wikipedia.org/wiki/Diplomatic_bag"]]},{"claim":"HSBC prało ok. 1 mld USD karteli; kara 1,9 mld, bez aresztowań kadry.","verdict":"prawda","note":"W 2012 HSBC przyznał się i zapłacił 1,9 mld USD; postępowanie odroczone, bez kar więzienia dla prezesów.","p":5,"src":[["DoJ: komunikat o ugodzie HSBC (AML/sankcje)","https://www.justice.gov/opa/pr/hsbc-holdings-plc-and-hsbc-bank-usa-na-admit-anti-money-laundering-and-sanctions-violations"],["Wikipedia (ang.): HSBC Holdings","https://en.wikipedia.org/wiki/HSBC_Holdings"]]},{"claim":"FISA 1979-2013: 33 942 wnioski, 11 odmów (~0,03%).","verdict":"prawda","note":"Publiczne statystyki FISA pokazują bardzo niską liczbę pełnych odmów w tym okresie.","p":6,"src":[["FAS: statystyki i dokumenty FISA","https://fas.org/irp/agency/doj/fisa/"],["Wikipedia (ang.): FISA Court","https://en.wikipedia.org/wiki/United_States_Foreign_Intelligence_Surveillance_Court"],["Brennan Center: problemy sądu FISA","https://www.brennancenter.org/our-work/research-reports/what-went-wrong-fisa-court"]]},{"claim":"W 2014 federalne konfiskaty > łączne łupy włamywaczy w USA.","verdict":"półprawda","note":"Porównanie z Institute for Justice/Washington Post bywa cytowane, ale metodologie różnią się.","p":7,"src":[["Wikipedia (ang.): civil forfeiture w USA","https://en.wikipedia.org/wiki/Civil_forfeiture_in_the_United_States"],["Wikipedia (ang.): asset forfeiture","https://en.wikipedia.org/wiki/Asset_forfeiture"]]},{"claim":"H. Beatty Chadwick spędził 14 lat w areszcie za civil contempt.","verdict":"prawda","note":"Rekordowo długi areszt cywilny w sprawie rozwodowej; zwolniony w 2009 r.","p":8,"src":[["Wikipedia (ang.): H. Beatty Chadwick","https://en.wikipedia.org/wiki/H._Beatty_Chadwick"],["Wikipedia (ang.): civil contempt","https://en.wikipedia.org/wiki/Civil_contempt"]]},{"claim":"Frazier v. Cupp (1969): policja może kłamać na przesłuchaniu.","verdict":"prawda","note":"Precedens dopuszcza podstęp; kłamstwo obywatela wobec federalnego agenta to osobne przestępstwo.","p":9,"src":[["Wikipedia (ang.): Frazier v. Cupp","https://en.wikipedia.org/wiki/Frazier_v._Cupp"],["Wikipedia (ang.): false confession","https://en.wikipedia.org/wiki/False_confession"]]}],"bias":"Jednostronny katalog nadużyć władzy w USA bez kontrargumentów o kontroli i reformach; liczby i anegdoty czasem uproszczone pod efekt."},{"id":"vWafgMfVWWw","title_pl":"Tanie hobby, które robią Cię ciekawszym","title":"Inexpensive Hobbies That Make You More Interesting","channel":"Chill Dude Explains","url":"https://www.youtube.com/watch?v=vWafgMfVWWw","date":"2026-11-05","duration":632,"views":18484,"section":"Chill Dude Explains","transcript":"youtube","added":"2026-11-06","tags":["Psychologia","Historia","Nauka"],"about":"Ranking 10 niedrogich hobby: od krzemienia i cyfrowej archeologii po kryptografię, ptaki i magnet fishing.","intro":"Chill Dude Explains robi ranking tanich hobby, które dają historię do opowiedzenia zamiast kolejnego scrollowania. Każdy punkt to hobby z niskim progiem wejścia (często poniżej kilkudziesięciu dolarów) i konkretnym \"dlaczego warto\".\n\nLista idzie od 10. do 1.: od ręcznego łupania krzemienia, przez Wayback Machine, szyfry i birdwatching, aż po magnet fishing. Cel: pokazać, że ciekawość nie wymaga drogiego sprzętu.","points":[{"t":"10-9: flintknapping i cyfrowa archeologia","d":"**Flintknapping to łupanie krzemienia lub obsydianu w ostrza ostrzejsze według autora od skalpeli.** Fizyka fali uderzeniowej pozwala kontrolować odłupki; materiały kosztują ok. 15-20 USD, ale początkujący dużo się tną. Badania według filmu łączą to z obszarami mózgu od języka i planowania.\n\nCyfrowa archeologia: po kasacji GeoCities (2009) Archive Team uratował ok. 650 GB stron. Narzędzie to Wayback Machine (setki miliardów zrzutów od 1996) - czytasz martwe fora jak skamieliny."},{"t":"Środek listy: szyfry i ptaki","d":"**Kryptografia zaczyna się od ołówka i papieru, a kończy na rozumieniu haseł i szyfrowania.** Autor wspomina nierozwiązane zagadki jako motywację do myślenia wzorcami.\n\nBirdwatching: gołębie jako żywe dinozaury; sójki, przedrzeźniacze i kruki z pamięcią twarzy. Anegdota: kobieta w Seattle po przypadkowym uderzeniu kruka była atakowana przez stado przez 2 lata."},{"t":"1: magnet fishing","d":"**Magnet fishing: neodymowy magnes na linie wrzucasz do rzeki i wyciągasz metalowe sekrety.** Start ok. 30-50 USD (magnes, lina, rękawice). Zwykle śruby i wózki, czasem sejfy, broń, a w Holandii ktoś według autora wyciągnął bombę z II wojny.\n\nPuenta: rzeki to stare śmietniki cywilizacji; hobby łączy historię z czasem na świeżym powietrzu."}],"conclusion":"Autor sprzedaje prostą tezę: tanie hobby z rzemiosłem, historią albo zagadką robi Cię ciekawszym rozmówcą niż kolejna subskrypcja. Nie trzeba bogatego ekwipunku - wystarczy ciekawość i trochę ryzyka.","factchecks":[{"claim":"Obsydianowe ostrza bywają ostrzejsze od stalowych skalpeli.","verdict":"prawda","note":"Krawędź obsydianu może mieć grubość rzędu kilku nanometrów; bywa w mikrochirurgii eksperymentalnej.","p":0,"src":[["Wikipedia (ang.): obsydian","https://en.wikipedia.org/wiki/Obsidian"],["Wikipedia (ang.): flintknapping","https://en.wikipedia.org/wiki/Flintknapping"]]},{"claim":"Wayback Machine archiwizuje sieć od 1996; GeoCities skasowano w 2009.","verdict":"prawda","note":"Internet Archive uruchomił Wayback z danymi od 1996; Yahoo zamknął GeoCities USA w 2009.","p":0,"src":[["Wikipedia (ang.): Wayback Machine","https://en.wikipedia.org/wiki/Wayback_Machine"],["Wikipedia (ang.): GeoCities","https://en.wikipedia.org/wiki/GeoCities"]]},{"claim":"Kruki rozpoznają twarze ludzi i potrafią trzymać uraz.","verdict":"prawda","note":"Badania na wronach i krukach pokazują pamięć twarzy i przekazywanie informacji w stadzie.","p":1,"src":[["Wikipedia (ang.): crow","https://en.wikipedia.org/wiki/Crow"],["PubMed: rozpoznawanie twarzy u wron","https://pubmed.ncbi.nlm.nih.gov/21613592/"]]}],"bias":"Ranking rozrywkowy: liczby i anegdoty (bomba, Seattle) bez źródeł w filmie. Magnet fishing bagatelizuje ryzyko niewybuchów."},{"id":"78OCnXhh2tY","title_pl":"10 zasad społecznych, które odwróciły się bez ogłoszenia","title":"Social Rules That Flipped Without Anyone Announcing It","channel":"Chill Dude Explains","url":"https://www.youtube.com/watch?v=78OCnXhh2tY","date":"2026-11-04","duration":608,"views":5426,"section":"Chill Dude Explains","transcript":"youtube","added":"2026-11-04","tags":["Psychologia","Historia"],"about":"Ranking 10 norm, które odwróciły się po cichu: Uber, telefony, napiwki, kropka w SMS, gotówka, randki, torby, psy, pensje i dzieci na dworze.","intro":"Chill Dude Explains to kanał z humorystycznymi rankingami o codziennym życiu, tu w realiach USA. Pytanie filmu: które zasady, wpajane nam jako oczywistość, w ciągu kilkunastu lat odwróciły się o 180 stopni, choć nikt tego oficjalnie nie ogłosił?\n\nAutor odlicza od 10. do 1. miejsca. Przy każdej zasadzie pokazuje, jak było kiedyś, jak jest dziś, często podaje liczbę albo przyczynę zmiany i dorzuca żart. Zmierza do tego, że normy zmieniają się po cichu, a dawny zdrowy rozsądek potrafi dziś wyglądać dziwnie, a nawet ściągnąć policję.","points":[{"t":"10. Auto z nieznajomym","d":"**Najważniejszy zakaz z dzieciństwa, \"nie wsiadaj do auta obcego\", złamaliśmy masowo około 2012 r.** Był na plakatach, apelach szkolnych i w horrorach z lat 80. Dziś stoisz na rogu, przywołujesz aplikacją obcego człowieka i jedziesz z nim przez miasto o 23:00.\n\nAutor żartuje, że cały system bezpieczeństwa to 4,8 gwiazdki od innych obcych, którzy przeżyli kurs. Ocena działa w obie strony, więc starasz się być miły dla kierowcy, przed którym ostrzegano cię całe dzieciństwo. \"Złoczyńca z horroru został drobnym przedsiębiorcą.\""},{"t":"9. Niezapowiedziany telefon","d":"**Telefon bez wcześniejszego SMS-a zmienił się ze zwykłego gestu w sygnał alarmowy.** 30 lat temu po prostu się dzwoniło i odbierało, bo do tego był telefon. Dziś niespodziewany telefon budzi myśl o najgorszym: ktoś umarł, wypadek, kłopoty z urzędem skarbowym.\n\nAutor porównuje to z pukaniem do drzwi: dawniej otwierałeś, dziś chowasz się za kanapą. \"Pukanie się nie zmieniło, zmienił się twój mózg.\" Według niego przemiana nastąpiła między 2008 a 2015 r."},{"t":"8. Ekran napiwku","d":"**Prośba o napiwek przeniosła się z restauracji do każdej kasy, nawet samoobsługowej.** Ekran obraca się do ciebie w barze z koktajlami i proponuje 18, 20 albo 25% za 45 sekund miksowania. Kasy samoobsługowe też pytają o napiwek, choć sam zeskanowałeś zakupy.\n\nWedług autora to model biznesowy, a nie hojność: firmy od oprogramowania płatności wbudowały te podpowiedzi i ustawiły wysokie domyślne kwoty, bo biorą prowizję od każdej transakcji. Przycisk nie brzmi \"pomiń\", tylko \"bez napiwku\", a kasjer stoi obok, więc odmowa czuje się jak odmowa prosto w twarz."},{"t":"7. Agresywna kropka","d":"**Kropka na końcu SMS-a przestała znaczyć \"koniec zdania\", a zaczęła znaczyć chłód.** \"Ok\" brzmi normalnie, \"ok.\" jak zapowiedź kłopotów. Według autora językoznawcy z Binghamton University (uczelni w stanie Nowy Jork) wykazali, że te same wiadomości z kropką oceniano jako mniej szczere.\n\nWyjaśnienie autora: SMS to pierwsza forma pisma, która udaje mowę. W mowie głos łagodnieje na końcu, a kropka \"ląduje jak zamykane drzwi\", więc ludzie zaczęli ją pomijać. Zmiana nastąpiła na początku lat 2010."},{"t":"6. Płacenie gotówką","d":"**Gotówka z oznaki zaradności stała się dziwactwem, które zatrzymuje kolejkę.** Kasjer patrzy na banknot 20 dolarów jak na list z woskową pieczęcią i szuka, gdzie jest szuflada. Według autora w 2010 r. gotówką płacono za około 40% transakcji w USA, a w 2023 r. za mniej niż 20%.\n\nAutor podkreśla paradoks: na każdym banknocie jest napisane, że to prawny środek płatniczy, a mimo to niektóre kawiarnie odmawiają przyjęcia gotówki."},{"t":"5. Historia \"jak się poznaliście\"","d":"**Poznanie się w aplikacji przestało być wstydliwe, a dziwne jest raczej poznanie się bez niej.** Na początku lat 2000. pary miały gotową przykrywkę \"poznaliśmy się przez znajomych\". Według autora każdy nowy sposób poznawania ludzi, od potańcówek przy kościele po bary, był najpierw skandalem, tylko randki online przeszły ten cykl w 15 lat, a nie w 100.\n\nLiczby autora: w 2013 r. z portali randkowych korzystało około 11% dorosłych Amerykanów, w 2023 r. prawie 30%, a wśród niedawno poślubionych par ponad 40% poznało się w sieci."},{"t":"4. Wstyd za brak torby","d":"**Własna torba na zakupy z dziwactwa stała się obowiązkiem, a jej zapomnienie powodem do wstydu.** Kiedyś kasjerka patrzyła na ciebie jak na \"jednego z tych ludzi\", dziś wzdycha, gdy prosisz o reklamówkę, a ta kosztuje jeszcze 10 centów. Zmiana zajęła około 15 lat.\n\nIronia według autora: w latach 70. plastikowe torby reklamowano jako nowoczesną, ekologiczną alternatywę dla papieru. Potem okazało się, że rozkładają się 500 lat, miasta zaczęły za nie pobierać opłaty, a dziś każdy ma 14 płóciennych toreb i zapomina wszystkich."},{"t":"3. Zwierzęta jak rodzina","d":"**Zwierzęta awansowały z domowników na członków rodziny, a nawet podopiecznych.** \"Właściciel psa\" brzmi dziś niemal jak obelga, jesteś \"rodzicem\" pupila. 50 lat temu pies jadł resztki i spał na dworze, dziś je organiczne posiłki bez zbóż, droższe od twojego obiadu.\n\nAutor wylicza: kostiumy na Halloween dla zwierząt to branża warta miliard dolarów, istnieją wózki dla zdrowych psów, a 20 lat temu weterynarza proponującego operację kota za 15 000 dolarów by wyśmiano. Dziś ludzie zbierają na nią w internecie i zbiórki się udają."},{"t":"2. Tajemnica pensji","d":"**Rozmowa o zarobkach z nietaktu stała się sposobem obrony przed zaniżoną pensją.** Według autora tabu podtrzymywali pracodawcy, bo dzięki niemu nikt nie wiedział, że kolega zarabia 20 000 dolarów więcej za tę samą pracę. Niektórzy wpisywali do umów zakazy rozmów o płacach, często nielegalne.\n\nMłodsi pracownicy zaczęli pytać się wprost, serwisy jak Glassdoor upubliczniły dane o pensjach, a niektóre stany nakazały podawać widełki w ogłoszeniach. Firmy odpowiedziały widełkami w stylu 50-250 tys. dolarów, ale zmiana już się dokonała: \"milczenie o pieniądzach to sposób, by zarabiać za mało\"."},{"t":"1. Dzieci same na dworze","d":"**Dziecko chodzące samo po okolicy z normy stało się powodem do wezwania policji.** Według autora w latach 70. przeciętne amerykańskie dziecko miało swobodę poruszania się w promieniu około 10 km (6 mil), a zasada brzmiała \"wróć, gdy zapalą się latarnie\".\n\nPrzełomem było zaginięcie Etana Patza w 1979 r. w drodze na przystanek, którego twarz drukowano na kartonach mleka, a potem telewizje informacyjne relacjonowały każde porwanie. Porwań przez obcych jest około 100 rocznie w kraju 330 mln ludzi, a mimo to do 2012 r. ten promień skurczył się według autora o 90%. W 2014 r. aresztowano matkę za to, że 9-letnia córka bawiła się sama w parku, a niektóre stany uchwaliły ustawy chroniące takich rodziców."}],"conclusion":"Żadnej z tych zmian nikt nie ogłosił, po prostu się wydarzyły, często w ciągu 10-15 lat. Według autora to, co dla naszych dziadków było zdrowym rozsądkiem (pozwolić dziecku iść samemu do szkoły), dziś bywa dziwactwem, a czasem trzeba aż ustawy, żeby znów było legalne.","factchecks":[{"claim":"Ok. 2012 masowo zaakceptowano jazdę z obcymi przez aplikacje (Uber i podobne).","verdict":"prawda","note":"Uber wystartował w 2009/2010; boom w USA i globalnie przypada na początek lat 2010.","p":0,"src":[["Wikipedia (ang.): firmy ride-hailing - hasło \"Ridesharing company\"","https://en.wikipedia.org/wiki/Ridesharing_company"]]},{"claim":"Badanie Binghamton: SMS z kropką oceniany jako mniej szczery.","verdict":"prawda","note":"Gunraj i Klin (2015/16): krótkie odpowiedzi tekstowe z kropką uznawano za mniej szczere niż bez.","p":3,"src":[["DOI: Texting insincerely (Computers in Human Behavior)","https://doi.org/10.1016/j.chb.2015.11.003"]]},{"claim":"Gotówka: ok. 40% transakcji USA w 2010, poniżej 20% do 2023.","verdict":"półprawda","note":"Diary Fed: w 2023 gotówka to ok. 16% płatności; \"40% w 2010\" pochodzi ze starszych szacunków, nie z tej serii.","p":5,"src":[["Fed: Diary of Consumer Payment Choice 2024 (PDF)","https://www.frbservices.org/wp-content/uploads/2024-diary-of-consumer-payment-choice.pdf"],["Boston Fed: udział gotówki po pandemii","https://www.bostonfed.org/news-and-events/news/2023/11/cash-crash-pandemic-increasing-credit-card-use-diary-of-consumer-payment-choice.aspx"]]},{"claim":"W 2013 ok. 11% dorosłych USA na portalach randkowych, do 2023 prawie 30%; >40% małżeństw online.","verdict":"półprawda","note":"Pew: ok. 3 na 10 dorosłych kiedykolwiek użyło app/portalu; \"11% w 2013\" i \"40% małżeństw\" to uproszczenia różnych badań.","p":4,"src":[["Pew: kluczowe wnioski o online dating (2023)","https://www.pewresearch.org/short-reads/2023/02/02/key-findings-about-online-dating-in-the-u-s/"],["Wikipedia (ang.): randki online - hasło \"Online dating\"","https://en.wikipedia.org/wiki/Online_dating"]]},{"claim":"Torby plastikowe rozkładają się ok. 500 lat.","verdict":"półprawda","note":"Plastik może trwać setki lat i rozpadać się na mikroplastik; \"500 lat\" to popularne uproszczenie, nie jedna stała.","p":6,"src":[["Wikipedia (ang.): torba plastikowa - hasło \"Plastic bag\"","https://en.wikipedia.org/wiki/Plastic_bag"]]},{"claim":"Etan Patz zaginął w 1979 idąc na przystanek; to zmieniło strach rodziców w USA.","verdict":"prawda","note":"Zaginięcie 6-letniego Etana Patza w NYC w 1979 stało się symbolem i impulsem do kampanii o zaginionych dzieciach.","p":9,"src":[["Wikipedia (ang.): Etan Patz","https://en.wikipedia.org/wiki/Etan_Patz"],["Wikipedia (ang.): free-range parenting","https://en.wikipedia.org/wiki/Free-range_parenting"]]},{"claim":"Porywania dzieci przez obcych: ok. 100 rocznie; promień swobody skurczył się o 90%.","verdict":"przesada","note":"Stereotypowe porwania przez obcych są rzadkie, ale \"-90% do 2012\" to sensacyjna liczba bez jasnego źródła w filmie.","p":9,"src":[["Wikipedia (ang.): child abduction","https://en.wikipedia.org/wiki/Child_abduction"],["Wikipedia (ang.): free-range parenting","https://en.wikipedia.org/wiki/Free-range_parenting"]]}],"bias":"Komediowy ranking USA-centryczny; trendy podaje jak twarde daty i procenty, a część liczb (gotówka 2010, -90% swobody dzieci) jest uproszczona lub niesprawdzalna z filmu."},{"id":"VqGMHpquXG8","title_pl":"Jak sprawdzić, kto ujawnia sekrety?","title":"Jak sprawdzić, KTO ujawnia SEKRETY?","channel":"Kacper Szurek","url":"https://www.youtube.com/watch?v=VqGMHpquXG8","date":"2026-11-04","duration":1039,"views":10292,"section":"Technologie","transcript":"youtube","added":"2026-11-05","tags":["Technika","Historia","Psychologia"],"about":"Pułapki na kreta: znakowane maile, niewidzialne znaki, żółte kropki drukarek, fikcyjne miasta, adresy pułapki, honeypoty i proszek UV.","intro":"Kacper Szurek, autor kanału o bezpieczeństwie IT i prowadzący szkolenia dla firm, zaczyna od zagadki: tajne informacje Tesli wyciekały do prasy i trzeba było znaleźć osobę, która je wynosi. Taką osobę nazywa się kretem, a sposób jej wykrycia to pułapka: każdy podejrzany dostaje nieco inną wersję tej samej informacji.\n\nAutor porównuje to do kontrastu w medycynie, który robi niewidoczne procesy widocznymi. Film to przegląd kilkunastu takich pułapek, od spacji w mailach i kropek drukarek, przez szpiegostwo z II wojny światowej i tabloidy, po spam i hakerów. Zmierza do prostego wniosku: wystarczy jedna unikalna różnica w każdej kopii, żeby wyciek wskazał źródło.","points":[{"t":"Znakowane maile w Tesli","d":"**Tesla rozesłała pracownikom pozornie identyczne maile, z których każdy był odrobinę inny.** Według autora Elon Musk sam przyznał, że osoby odpowiedzialne za przecieki \"poproszono o kontynuowanie kariery w innej firmie\".\n\nRóżnica polegała na podwójnej spacji w innym miejscu u każdej osoby. Jeśli ktoś skopiował tekst albo zrobił mu zdjęcie, układ spacji od razu wskazywał, czyja to była kopia. Autor przyznaje, że to dość widoczna metoda, i dlatego pokazuje kolejne, subtelniejsze."},{"t":"Niewidzialne znaki i odcień koloru","d":"**Tekst może nieść identyfikator odbiorcy, którego nie widać gołym okiem.** Pierwszy sposób to niewidzialne znaki: większość edytorów ich nie wyświetla, ale kopiują się do schowka razem z tekstem i da się je odczytać specjalnym narzędziem.\n\nDrugi sposób autor pokazał w zagadce z maila: słowo \"go\" nie było idealnie czarne, tylko w minimalnie innym odcieniu. Dla oka to ten sam kolor, dla komputera zupełnie inny, więc każdy odbiorca dokumentu może mieć inaczej zabarwione jedno słowo."},{"t":"Fałszywa definicja antywirusa","d":"**Firma antywirusowa udowodniła konkurentowi, że kopiuje jej bazę wirusów.** Na forum konkurenta zauważyła, że jego program wykrywa pliki pod nazwą, która po przetłumaczeniu znaczyła \"Nie kradnij naszego programu\". Tą nazwą firma oznaczała keygeny, czyli nielegalne generatory kluczy do własnego oprogramowania, więc konkurent nie miał powodu jej używać.\n\nŻeby sprawdzić, czy to nie przypadek, firma dopisała do bazy definicję aplikacji, która nie istniała, i przygotowała pasujące do niej pliki. Po kilku tygodniach konkurent zaczął je wykrywać pod tą samą wymyśloną nazwą, choć żaden inny antywirus ich nie zgłaszał."},{"t":"Żółte kropki drukarek","d":"**Drukarka może zdradzić, kto i kiedy wydrukował dokument.** Dziennikarze The Intercept (amerykańskiego portalu śledczego) dostali tajny dokument od informatora i, chcąc sprawdzić jego autentyczność, wysłali go do agencji rządowej.\n\nNie wiedzieli, że niektóre drukarki zostawiają na papierze ledwie widoczne żółte kropki. Wyglądają jak mikroskopijne błędy druku, ale zapisują godzinę wydruku i numer seryjny urządzenia. Śledczy sprawdzili, kto korzystał z drukarki o tej porze, w komputerze znaleźli kontakt z redakcją i aresztowali kobietę pod zarzutem szpiegostwa."},{"t":"Czerwone paliwo","d":"**Paliwo z niższym podatkiem barwi się, żeby nikt nie tankował go do auta.** W wielu krajach paliwo rolnicze i opałowe ma dużo niższy podatek niż paliwo do samochodów, a z wyglądu niczym się nie różni, więc kusi, żeby go używać.\n\nDlatego dodaje się do niego barwnik i znacznik. Testy wykrywają nawet niewielkie stężenie, więc mieszanie tańszego paliwa z droższym nic nie daje. Za użycie go w pojazdach na drogach publicznych grożą wysokie kary, o czym informują napisy na części stacji."},{"t":"Rzęsa w kopercie","d":"**W czasie II wojny światowej alianci podrzucili Niemcom fałszywe plany, a rzęsa w kopercie dowiodła, że wróg je przeczytał.** Chcieli przekonać Niemców, że inwazja nastąpi na Sardynię, a nie na Sycylię. Stworzyli fikcyjnego oficera wysokiej rangi, bo nikt nie powierzyłby tajnych papierów szeregowcowi, i ubrali w mundur zwłoki mężczyzny zmarłego od trutki na szczury, ze zdjęciem rzekomej narzeczonej w portfelu.\n\nCiało wyrzucone przez morze w Hiszpanii znalazł rybak. Admiralicja dyskretnie żądała zwrotu dokumentów, żeby wyglądały na ważne. Koperta wróciła starannie zaklejona, ale bez rzęsy, którą wcześniej do niej włożono, więc wiadomo było, że ktoś ją otworzył i skopiował."},{"t":"Kardashian i żona piłkarza","d":"**Tę samą sztuczkę stosują celebryci, żeby znaleźć wśród znajomych osobę, która sprzedaje ich prywatność.** Kim Kardashian wysłała przyjaciołom różne fałszywe zdjęcia noworodków i czekała, które trafi do tabloidu. Plan nie wypalił, bo portal TMZ dostał dwa różne zdjęcia.\n\nŻona legendy futbolu miała więcej szczęścia. Na prywatnym Instagramie, który widzą tylko zaakceptowani obserwujący, publikowała zmyślone historie, np. o zabiegu wyboru płci dziecka, a one trafiały do brytyjskiego The Sun. Potem zablokowała wszystkich poza jedną osobą i robiła zrzuty ekranu pokazujące, że tylko ona oglądała te wpisy."},{"t":"Fikcyjne miasta i słowa","d":"**Mapy i słowniki zawierały celowo zmyślone hasła, żeby przyłapać kopiujących.** Tworzenie map było kiedyś bardzo drogie i czasochłonne, więc niektóre firmy kusiło, by kupić cudzą mapę i ją lekko przerobić.\n\nDlatego wstawiano \"papierowe miasta\", które nie istnieją, jak Argleton. Słowniki robiły to samo z wymyślonymi słowami. Jeśli takie miasto albo słowo pojawiało się u konkurencji, było dowodem kradzieży, w czasach gdy słowniki były drukowanymi książkami i nie dało się tego po prostu sprawdzić w internecie."},{"t":"Adresy pułapki na spam","d":"**Spamerów łapie się na adresy email, których nikt nigdy nie podał.** Duże firmy pocztowe blokują serwery znane z wysyłania spamu, ale muszą najpierw wiedzieć, które to. Legalna wysyłka reklam wymaga zgody właściciela skrzynki.\n\nPowstały więc organizacje, które kupują domenę, generują unikalne adresy i rozsiewają je po forach, stronach i blogach. Nikt nie zapisał tych adresów do newslettera, bo nie należą do żadnego człowieka, więc kto wyśle na nie reklamę, ląduje na liście spamu. Według autora dlatego nie ma sensu kupować nielegalnych baz adresów."},{"t":"Honeypoty","d":"**Honeypot (\"garnek miodu\") to przynęta udająca podatny system, żeby zwabić hakera.** Przykład autora: coś, co wygląda jak WordPress, najpopularniejszy system blogów i częsty cel ataków, ale nim nie jest. Atak się nie udaje, a właściciel zbiera adresy IP atakujących i dokładną treść ich zapytań, więc może załatać błąd albo chronić innych klientów.\n\nPułapka może też marnować czas atakującego. Przy SQL injection, czyli błędzie pozwalającym wysłać dowolne zapytanie do bazy danych strony, fałszywa aplikacja udaje ogromną bazę i podaje bez końca losowe, bezwartościowe rekordy."},{"t":"Proszek UV w szatni","d":"**Złodzieja w szatni można złapać bez kamer, proszkiem widocznym tylko w ultrafiolecie.** Kamer nie można tam zamontować ze względu na prywatność, więc pędzelkiem nanosi się odrobinę proszku na banknoty albo portfel.\n\nW zwykłym świetle proszek jest niewidoczny, ale w świetle UV świeci intensywnie na zielono i przenosi się na skórę i ubranie. Gdy pieniądze znów znikną, wystarczy poświecić na ręce pracowników."}],"conclusion":"Jedna niewidoczna, unikalna różnica w każdej kopii (spacja, kolor, kropka, rzęsa, adres) wystarczy, żeby wyciek sam wskazał swoje źródło. Nie każda pułapka działa, co pokazuje przypadek Kardashian. Na koniec autor żartuje, że może ten film też jest pułapką i sprawdza, kto zostawi komentarz.","factchecks":[{"claim":"Tesla wykryła kreta mailami różniącymi się spacjami","verdict":"prawda","note":"Musk opisał tę metodę, a Wikipedia podaje przypadek z Tesli z 2008 r.","p":0,"src":[["Wikipedia (ang.): pułapka kanarkowa - hasło \"Canary trap\"","https://en.wikipedia.org/wiki/Canary_trap"]]},{"claim":"Żółte kropki drukarki pomogły namierzyć informatorkę The Intercept","verdict":"prawda","note":"Sprawa Reality Winner z 2017 r.; kropki kodują datę, godzinę i numer seryjny.","p":3,"src":[["Wikipedia (ang.): Reality Winner","https://en.wikipedia.org/wiki/Reality_Winner"],["Wikipedia (ang.): kod identyfikacji drukarki - hasło \"Machine Identification Code\"","https://en.wikipedia.org/wiki/Machine_Identification_Code"]]},{"claim":"Tańsze paliwo jest barwione, by wykryć nadużycia podatkowe","verdict":"prawda","note":"Barwniki i markery w paliwie o niższej akcyzie stosuje wiele państw.","p":4,"src":[["Wikipedia (ang.): barwniki paliwowe - hasło \"Fuel dye\"","https://en.wikipedia.org/wiki/Fuel_dye"]]},{"claim":"W kopercie operacji Mincemeat umieszczono rzęsę","verdict":"prawda","note":"Rzęsy brakowało po zwrocie; zwłoki należały do mężczyzny otrutego trutką na szczury.","p":5,"src":[["Wikipedia (ang.): operacja Mincemeat - hasło \"Operation Mincemeat\"","https://en.wikipedia.org/wiki/Operation_Mincemeat"]]},{"claim":"Żona piłkarza wykryła kreta, blokując wszystkich poza jedną osobą","verdict":"prawda","note":"To Coleen Rooney i sprawa \"Wagatha Christie\" z 2019 r.","p":6,"src":[["Wikipedia (ang.): Coleen Rooney","https://en.wikipedia.org/wiki/Coleen_Rooney"]]},{"claim":"Kim Kardashian rozesłała fałszywe zdjęcia noworodka","verdict":"nie da się sprawdzić","note":"Brak pewnego źródła potwierdzającego tę historię.","p":6,"src":[["Wikipedia (ang.): pułapka kanarkowa - hasło \"Canary trap\"","https://en.wikipedia.org/wiki/Canary_trap"]]},{"claim":"Mapy zawierały fikcyjne miasta, np. Argleton","verdict":"półprawda","note":"Argleton istniał w Google Maps, ale nie wiadomo, czy był celową pułapką.","p":7,"src":[["Wikipedia (ang.): Argleton","https://en.wikipedia.org/wiki/Argleton"],["Wikipedia (ang.): fikcyjne hasła - hasło \"Fictitious entry\"","https://en.wikipedia.org/wiki/Fictitious_entry"]]},{"claim":"Adresy pułapki służą do wykrywania spamerów","verdict":"prawda","note":"Spamtrapy to standardowe narzędzie list blokujących.","p":8,"src":[["Wikipedia (ang.): Spamtrap","https://en.wikipedia.org/wiki/Spamtrap"]]},{"claim":"Honeypoty zbierają dane o atakach i marnują czas atakujących","verdict":"prawda","note":"To opisane zastosowania honeypotów badawczych i produkcyjnych.","p":9,"src":[["Wikipedia (ang.): honeypot - hasło \"Honeypot (computing)\"","https://en.wikipedia.org/wiki/Honeypot_(computing)"]]}],"bias":"Rzetelny i lekki przegląd. Historia o antywirusach bez nazw i źródeł, w środku reklama szkolenia autora."},{"id":"KfODG5REyss","title_pl":"Najbliższe obcej materii, co mamy: nadciekły hel","title":"The Closest Thing We Have to Alien Matter","channel":"Veritasium","url":"https://www.youtube.com/watch?v=KfODG5REyss","date":"2026-11-04","duration":3955,"views":1135333,"section":"Ciekawostki","transcript":"youtube","added":"2026-11-05","tags":["Nauka","Historia","Technika"],"about":"Historia wyścigu do zera absolutnego i nadciekłego helu: od Faradaya i Onnesa po Kapicę, Landaua i eksperymenty w Nottingham.","intro":"Derek Muller z kanału Veritasium (popularnonaukowy kanał o fizyce) razem z laboratorium grawitacji Uniwersytetu w Nottingham odtwarza historyczne eksperymenty z ciekłym helem. Punkt wyjścia jest prosty: co się dzieje, gdy coś chłodzimy coraz bardziej, aż do zera absolutnego, czyli około -273 °C, gdzie cząsteczki praktycznie przestają się ruszać. Poniżej 2,17 kelwina (około -271 °C) hel zamienia się w nadciecz: płyn bez tarcia wewnętrznego, który przecieka przez nanometrowe szczeliny, wspina się po ściankach i tworzy fontannę napędzaną samym światłem.\n\nFilm idzie chronologicznie: od skraplania gazów w XIX wieku, przez pierwszy ciekły hel w 1908 r., po wyjaśnienie zjawiska przez fizykę kwantową w latach 30. i 40. Wątek przewodni to pytanie, dlaczego odkrywca ciekłego helu przez 18 lat patrzył na nadciecz i jej nie zauważył.","points":[{"t":"Skąd pomysł zera absolutnego","d":"**Lord Kelvin zauważył, że rozprężający się gaz stygnie, i wywnioskował, że musi istnieć najniższa możliwa temperatura.** Cząsteczki gazu uderzające w tłok oddają mu część energii, więc zwalniają. Gdyby rozprężać gaz w nieskończoność, w końcu stanęłyby całkiem i nie miałyby już czego oddać.\n\nKelvin obliczył, że to około -273 °C. Przewidywał też, że metale, normalnie świetne przewodniki, w pobliżu tej granicy w ogóle przestaną przewodzić prąd. Sprawdzić to można było tylko w jeden sposób: dojść tam."},{"t":"Faraday i wyścig skraplania gazów","d":"**W 1823 r. Michael Faraday przypadkiem zamienił chlor w ciecz, ściskając go w zatopionej rurce do około 4 atmosfer.** W ciągu 5 tygodni skroplił 6 kolejnych gazów, ale niektóre, jak etylen, nie dawały się skroplić żadnym ciśnieniem. Przyczyna: cząsteczki przyciągają się zbyt słabo, a są zbyt gorące i szybkie, żeby się skleić.\n\nRozwiązaniem było chłodzenie. Z suchym lodem (około -79 °C) Faraday zszedł do -110 °C, ale tlen, azot i wodór dalej się opierały. Skraplanie stało się sprawą narodowej dumy: w 1883 r. dwaj polscy naukowcy skroplili tlen i azot (77 K), a James Dewar wodór w 20 K. Na placu boju został tylko hel."},{"t":"Dlaczego hel był najtrudniejszy","d":"**Hel jest gazem szlachetnym z pełną powłoką elektronową, więc prawie z niczym się nie wiąże i nie było pewne, czy jego atomy w ogóle się przyciągają.** Okazało się, że tak, ale ledwo: działają siły van der Waalsa, czyli chwilowe nierównomierności chmury elektronów, które indukują je u sąsiada. U helu są najsłabsze ze wszystkich pierwiastków.\n\nDrugi problem to brak surowca. We Wszechświecie hel jest drugim najczęstszym pierwiastkiem, ale na Ziemi jest go w powietrzu tylko około 5 części na milion, bo jest tak lekki, że ucieka w kosmos. Cały światowy zapas czystego helu to wtedy mniej niż 50 balonów. Heike Kamerlingh Onnes z Lejdy wydobył go z piasku monacytowego: zawarty w nim tor rozpada się radioaktywnie i wyrzuca jądra helu, więc według autora hel na Ziemi to w zasadzie \"radioaktywna skamielina\"."},{"t":"10 lipca 1908: pierwszy ciekły hel","d":"**Onnes zbudował w Lejdzie przemysłowe laboratorium i po latach przygotowań jednego dnia doszedł do 4 stopni nad zerem absolutnym.** Klucz to naczynia Dewara (podwójne szklane kolby z próżnią pomiędzy, jak dzisiejszy termos), włożone jedno w drugie: hel w środku, wokół kąpiel ciekłego wodoru, a wokół niej ciekłe powietrze. Każda warstwa osłaniała następną przed ciepłem.\n\nHel sprężony do 100 atmosfer był gwałtownie rozprężany i przy każdym obiegu chłodził kolejną porcję. Poniżej 5 K termometr nagle przestał spadać. Dopiero gdy ktoś poświecił latarką z boku, zobaczyli ostrą jak ostrze noża powierzchnię cieczy, prawie niewidoczną, bo współczynnik załamania ciekłego helu jest bliski powietrzu."},{"t":"Wskazówki, które zignorowano","d":"**Onnes pompował hel do 1,7 K i widział, że wrzenie nagle ustaje, ale uznał to za nic ważnego.** Hel nie zamarzł, a kolejne próby aż do 1 K też zawiodły. Onnes słusznie podejrzewał, że hel może nigdy nie zamarznąć przez samo chłodzenie.\n\nW 1911 r. odkrył nadprzewodnictwo: opór rtęci w 4,2 K spadł praktycznie do zera, odwrotnie niż przewidywał Kelvin. Tego samego dnia zanotował, że wrzenie helu ustało, i poszedł dalej. Jego zespół odrzucił też dziwny skok ciepła właściwego (ilości energii potrzebnej do ogrzania 1 g o 1 K) przy 2,17 K jako błąd pomiaru i opublikował tylko dane, które pasowały do wzoru."},{"t":"Odkrycie nadciekłości w 1938 r.","d":"**W 1937 r. Jack Allen i jego doktorant Don Misener w Cambridge przepuścili hel o temperaturze 1 K przez dwie kapilary i stwierdzili, że lepkość jest praktycznie zerowa.** Przepływ był prawie taki sam w rurce szerokiej i w tej o tysiąc razy mniejszym przekroju, a ciśnienie prawie nic nie zmieniało.\n\nW ostatniej chwili okazało się, że to samo zrobił Piotr Kapica, radziecki fizyk, któremu Stalin w 1934 r. odebrał paszport i który odtąd pracował w Moskwie. 8 stycznia 1938 r. obie prace ukazały się obok siebie w \"Nature\", a Kapica nazwał zjawisko nadciekłością. To wyjaśniło kubek, który sam się opróżnia: atomy helu silniej przyciągają się do ścianek niż do siebie, tworzą film grubości około 30 nm, a nadciecz płynie nim bez tarcia jak syfonem."},{"t":"Kondensat Bosego-Einsteina to za mało","d":"**Fritz London zaproponował, że nadciekły hel to kondensat Bosego-Einsteina, stan przewidziany przez Einsteina 13 lat wcześniej.** Każda cząstka jest albo fermionem (jak elektron, dwa takie nie mogą zająć tego samego stanu kwantowego, to zakaz Pauliego), albo bozonem, który może dzielić stan z innymi. Po schłodzeniu bozony masowo spadają do najniższego stanu energii i zachowują się jak jedna całość.\n\nAtom helu składa się z 6 cząstek o spinie połówkowym, więc w sumie ma spin całkowity i zachowuje się jak bozon. Poniżej 2,17 K biliony bilionów atomów działają jak jeden duży atom wielkości naczynia. Autor przyznaje jednak, że jego dawne wyjaśnienie było błędne: w zwykłym kondensacie najmniejsze pchnięcie wybija atomy ze stanu podstawowego, więc przepływ i tak traciłby energię."},{"t":"Landau: tarcie jest zakazane","d":"**Brakujące wyjaśnienie dał Lew Landau, ale najpierw Kapica musiał go wyciągnąć z więzienia NKWD.** Landau został aresztowany 28 kwietnia 1938 r. i po dwóch miesiącach przesłuchań podpisał zeznanie. Kapica pisał do Stalina i do jego otoczenia, aż w końcu dał pisemną gwarancję za Landaua i ten wrócił do instytutu.\n\nLandau pokazał, że atomy helu oddziałują ze sobą, więc energię można stracić tylko przez ruch zbiorowy: fonony (kwanty dźwięku) albo rotony (chwilowe mikrouporządkowania atomów). Ich powstanie wymaga przepływu z prędkością około 60 m/s, więc poniżej tej granicy tarcie jest dosłownie zerowe. W 1964 r. na Yale hel krążący w pierścieniach płynął tak samo mocno po 5 minutach i po 12 godzinach."},{"t":"Dwa płyny, fontanna i drugi dźwięk","d":"**Według modelu dwóch płynów (Tisza i Landau) hel poniżej 2,17 K to mieszanina nadcieczy bez tarcia i zwykłej cieczy, która niesie całe ciepło.** Przy 2,15 K nadciekłe jest tylko około 13% helu, a przy 1,5 K już około 89%, dlatego w zimniejszym helu kubek z dnem z aerożelu nie kapie, tylko leje. To też wyjaśnia, czemu Misener w wcześniejszym pomiarze obracającym się walcem zmierzył lepkość: walec czuł zwykłą ciecz.\n\nŚwiatło podgrzewające proszek w szklanej rurce zamienia część nadcieczy w zwykłą ciecz, nadciecz napływa od dołu i jedyna droga ujścia to fontanna w górę. Ciepło rozchodzi się w takim helu falami temperatury (\"drugi dźwięk\"), około tysiąc razy lepiej niż w miedzi. Dlatego wrzenie ustaje: nie ma gorących punktów, w których tworzyłyby się bąble, a CERN chłodzi nim około 9000 magnesów LHC."},{"t":"Dlaczego hel nigdy nie zamarza","d":"**Każda inna substancja w końcu zamarza, a hel nie, bo przeszkadza mu energia punktu zerowego.** Z zasady nieoznaczoności Heisenberga wynika, że atom zamknięty w małej przestrzeni między sąsiadami musi drgać, a im lżejszy atom, tym ta energia większa. W ciekłym helu to ponad 98% całej energii.\n\nTej energii nie da się odebrać chłodzeniem, więc atomy nigdy nie układają się w kryształ. Hel zamarza dopiero, gdy schłodzi się go do około 1 K i ściśnie do 25 atmosfer."},{"t":"Lekcja: trzeba uwierzyć, żeby zobaczyć","d":"**Onnes przez 18 lat wytwarzał nadciekły hel i nie zorientował się, na co patrzy.** Autor nie uważa go za głupca: był genialnym eksperymentatorem, ciężko pracował i odkrył nadprzewodnictwo, za co w 1913 r. dostał Nobla.\n\nWedług autora pokazuje to ludzką cechę opisaną przez Thomasa Kuhna (filozofa nauki): punkty odbiegające od wzoru łatwo uznać za błąd. Często wszystkie znaki przełomu już są, tylko nie jesteśmy gotowi ich zobaczyć."}],"conclusion":"Autor kończy pytaniem, jakich znaków nie widzimy dziś, skoro Onnes miał wiedzę, pracowitość i szczęście, a i tak przegapił nadciekłość. Czasem do przełomu wystarczy porzucić to, w co wierzymy o świecie, i spojrzeć na niego takim, jaki jest. Zapowiada ewentualną drugą część o obracających się nadcieczach.","factchecks":[{"claim":"Hel przechodzi w stan nadciekły w 2,17 K","verdict":"prawda","note":"Punkt lambda helu-4 to około 2,17 K pod ciśnieniem atmosferycznym.","p":0,"src":[["Wikipedia (ang.): nadciekły hel-4 - hasło \"Superfluid helium-4\"","https://en.wikipedia.org/wiki/Superfluid_helium-4"]]},{"claim":"W 1883 r. dwaj polscy naukowcy skroplili tlen i azot","verdict":"prawda","note":"Zygmunt Wróblewski i Karol Olszewski w Krakowie, w 1883 r.","p":1,"src":[["Wikipedia (ang.): Zygmunt Wróblewski - hasło \"Zygmunt Florenty Wróblewski\"","https://en.wikipedia.org/wiki/Zygmunt_Florenty_Wr%C3%B3blewski"]]},{"claim":"Onnes pierwszy skroplił hel 10 lipca 1908 r.","verdict":"prawda","note":"Tę datę podają biografie Onnesa.","p":3,"src":[["Wikipedia (ang.): Heike Kamerlingh Onnes - hasło \"Heike Kamerlingh Onnes\"","https://en.wikipedia.org/wiki/Heike_Kamerlingh_Onnes"]]},{"claim":"W 1911 r. Onnes odkrył nadprzewodnictwo rtęci w około 4,2 K","verdict":"prawda","note":"Opór rtęci zanikł 8 kwietnia 1911 r. w temperaturze około 4,2 K.","p":4,"src":[["Wikipedia (ang.): nadprzewodnictwo - hasło \"Superconductivity\"","https://en.wikipedia.org/wiki/Superconductivity"]]},{"claim":"Kapica oraz Allen i Misener opublikowali odkrycie nadciekłości w \"Nature\" w 1938 r.","verdict":"prawda","note":"Obie prace ukazały się w \"Nature\" w styczniu 1938 r.","p":5,"src":[["Wikipedia (ang.): nadciekłość - hasło \"Superfluidity\"","https://en.wikipedia.org/wiki/Superfluidity"]]},{"claim":"Landau aresztowany w 1938 r. wyszedł dzięki poręczeniu Kapicy","verdict":"prawda","note":"Landau przesiedział rok, zwolniono go w 1939 r. po interwencji Kapicy.","p":7,"src":[["Wikipedia (ang.): Lew Landau - hasło \"Lev Landau\"","https://en.wikipedia.org/wiki/Lev_Landau"]]},{"claim":"Hel nie zamarza bez ciśnienia około 25 atmosfer","verdict":"prawda","note":"Hel krzepnie dopiero pod ciśnieniem około 25 barów przy niskiej temperaturze.","p":9,"src":[["Wikipedia (ang.): stały hel - hasło \"Solid helium\"","https://en.wikipedia.org/wiki/Solid_helium"]]},{"claim":"CERN chłodzi magnesy LHC nadciekłym helem","verdict":"prawda","note":"Magnesy LHC pracują w 1,9 K chłodzone nadciekłym helem, łącznie około 120 t helu.","p":8,"src":[["CERN: kriogenika LHC","https://home.cern/science/engineering/cryogenics-low-temperatures-high-performance"]]},{"claim":"Onnes dostał Nagrodę Nobla w 1913 r.","verdict":"prawda","note":"Nobel z fizyki 1913 za badania niskich temperatur i skroplenie helu.","p":10,"src":[["Nagroda Nobla: Onnes, fizyka 1913","https://www.nobelprize.org/prizes/physics/1913/onnes/facts/"]]}],"bias":"Rzetelny film popularnonaukowy, nieco upraszcza fizykę i dramatyzuje historię. W środku reklama sponsora (Ground News)."},{"id":"VbGMWtr0AJI","title_pl":"Nudne rzeczy, które zrobią z ciebie niebezpiecznie inteligentnego","title":"Boring Things That Will Make You Scary Intelligent","channel":"Chill Dude Explains","url":"https://www.youtube.com/watch?v=VbGMWtr0AJI","date":"2026-11-04","duration":645,"views":7422,"section":"Chill Dude Explains","transcript":"youtube","added":"2026-11-05","tags":["Psychologia","Nauka","Historia"],"about":"10 nudnych nawyków na lepsze myślenie: od kopiowania map i obserwacji ludzi po premortem, ciszę, pisanie ręczne i nieudane wynalazki.","intro":"Chill Dude Explains to kanał z krótkimi, spokojnymi wykładami o psychologii i historii. Tym razem autor odlicza od 10 do 1 nawyki, które wydają się nudne, ale według niego uczą myśleć ostrzej niż przeciętny człowiek.\n\nKażdy nawyk ma krótkie uzasadnienie, przykład historyczny albo badanie i praktyczne zalecenie. Część z tych przykładów to popularne anegdoty, dlatego warto spojrzeć na weryfikację przy punktach.","points":[{"t":"10. Kopiowanie map","d":"**Odrysowanie mapy świata ręką buduje w głowie model geografii, zamiast tylko szybkiego \"zdjęcia\".** Według autora Napoleon obsesyjnie kopiował mapy i pamiętał kształt każdego europejskiego wybrzeża.\n\nPrzykład skali: w Afryce zmieściłyby się USA, Chiny, Indie i większość Europy, choć na zwykłych mapach wygląda na mniejszą. Kto ma w głowie dobrą mapę, słysząc o konflikcie, od razu widzi geografię, jak szachownicę."},{"t":"9. Obserwowanie ludzi","d":"**Obserwowanie ludzi to według autora darmowy doktorat z ludzkiego zachowania.** Po żarcie ludzie odruchowo patrzą na osobę, której aprobata liczy się najbardziej, a to nie zawsze najgłośniejszy.\n\nNajlepszy test charakteru to sposób traktowania obsługi, bo widać, jak ktoś zachowuje się wobec osoby, która nie może się odwinąć. Prawdziwie słuchający rozmówca dłużej utrzymuje kontakt wzrokowy, robi pauzę przed odpowiedzią i dopytuje."},{"t":"8. Pytania drugiego rzędu","d":"**Pytaj nie tylko, co się stanie, ale \"i co potem?\", najlepiej trzy razy.** Lek przeciwbólowy usuwa ból (pierwszy rząd), ale może uzależnić (drugi rząd), i według autora tak zaczął się kryzys opioidowy.\n\nDrugi przykład: Australia w XIX wieku miała plagę królików, sprowadziła lisy, a te według autora zamiast królików jadły rodzime ptaki. Myślenie o krok dalej to nie geniusz, tylko nawyk."},{"t":"7. Rozpoznawanie błędów logicznych","d":"**Większość argumentów opiera się na sztuczkach, które powtarzają się w kółko.** Ad hominem atakuje osobę zamiast argumentu, chochoł przekręca czyjąś tezę na słabszą (\"jedzmy mniej czerwonego mięsa\" staje się \"chcesz, żeby wszyscy byli weganami\").\n\nFałszywy dylemat udaje, że są tylko dwie opcje, a równia pochyła straszy łańcuchem katastrof po jednym kroku. Gdy umiesz nazwać sztuczkę, przestaje na ciebie działać."},{"t":"6. Notatnik cytatów","d":"**Commonplace book to zeszyt, do którego wpisuje się cudze najlepsze myśli i własne zdanie, dlaczego są ważne.** Według autora po tygodniu zapominamy około 90% przeczytanego, a ręczne zapisanie sygnalizuje mózgowi, że coś się liczy.\n\nTakie zeszyty prowadzili Leonardo da Vinci, Thomas Jefferson i Karol Darwin. Z czasem widać, jak idee z różnych miejsc się łączą, a z tego bierze się oryginalne myślenie."},{"t":"5. Najpierw końcówki","d":"**Początkujący szachiści uczą się otwarć na pamięć, a prawdziwe myślenie to końcówki, gdy na planszy zostaje kilka figur.** Magnus Carlsen słynie z wygrywania pozycji, które wyglądają na remis.\n\nAutor uogólnia: każda umiejętność ma swoją \"końcówkę\". W pisaniu to jasne zdania, nie wymyślne słowa, a w inwestowaniu procent składany i ryzyko, nie gorące akcje."},{"t":"4. Premortem","d":"**Przed projektem wyobraź sobie, że minęły 2 lata i wszystko się zawaliło, a potem zapytaj, co poszło nie tak.** To premortem, odwrotność sekcji zwłok (post mortem). Według autora tak robi NASA.\n\nMózg słabo przewiduje przyszłe problemy, ale świetnie tłumaczy porażki, które \"już się stały\". Według autora zespoły z premortem wskazują do 30% więcej ryzyk."},{"t":"3. Siedzenie w ciszy","d":"**Większość ludzi nie wytrzyma 2 minut w ciszy, a według autora cisza pomaga mózgowi tworzyć nowe komórki w hipokampie, odpowiedzialnym za pamięć.** W ciszy włącza się sieć stanu spoczynkowego (default mode network), która łączy myśli.\n\nWedług autora Einstein godzinami myślał w ciszy. Zaleca 10 minut bez telefonu i muzyki: pierwsze 3 minuty są nieznośne, po 5 myśli zaczynają się układać."},{"t":"2. Pisanie ręczne","d":"**Pisząc na klawiaturze, mózg przepisuje słowo w słowo jak stenograf, a pisząc ręcznie musi wybierać, co ważne.** Według autora badania mózgu pokazują dużo większą aktywność przy pisaniu ręcznym.\n\nW badaniu z dwiema grupami studentów piszący na laptopach zanotowali więcej słów, ale piszący ręcznie lepiej zrozumieli materiał i odpowiadali na trudniejsze pytania."},{"t":"1. Nieudane wynalazki","d":"**Porażki uczą więcej niż historie sukcesu, bo pokazują, gdzie zawodzi ludzkie myślenie.** Colgate wypuścił mrożone dania i nikt nie chciał jeść jedzenia firmy od pasty do zębów (skojarzenie z marką). Ford stracił równowartość około 3 mld dolarów na Edselu, mimo badań rynku.\n\nBetamax Sony był według autora lepszy od VHS, ale przegrał, bo VHS nagrywał dłużej i był tańszy. Powtarzają się te same błędy: zbytnia pewność siebie, ignorowanie klienta i rozwiązywanie nieistniejących problemów."}],"conclusion":"Autor przekonuje, że inteligencja to w dużej mierze nawyki, a nie talent: zwolnienie, zapisywanie, myślenie o krok dalej i uczenie się na cudzych błędach. Zapowiada kolejne filmy w tym stylu.","factchecks":[{"claim":"W Afryce zmieszczą się USA, Chiny, Indie i większość Europy","verdict":"prawda","note":"Afryka ma około 30 mln km², USA, Chiny i Indie razem około 23 mln km².","p":0,"src":[["Wikipedia (ang.): Afryka - hasło \"Africa\"","https://en.wikipedia.org/wiki/Africa"]]},{"claim":"Lisy sprowadzono do Australii, by walczyły z królikami","verdict":"półprawda","note":"Lisy sprowadzono głównie dla polowań; część rodzimych gatunków wyginęła przez nie.","p":2,"src":[["Wikipedia (ang.): lisy w Australii - hasło \"Red foxes in Australia\"","https://en.wikipedia.org/wiki/Red_foxes_in_Australia"]]},{"claim":"Kryzys opioidowy wynikł z decyzji lekarzy","verdict":"półprawda","note":"Ważną rolę odegrał też agresywny marketing producentów, m.in. Purdue Pharma.","p":2,"src":[["Wikipedia (ang.): epidemia opioidowa w USA - hasło \"Opioid epidemic in the United States\"","https://en.wikipedia.org/wiki/Opioid_epidemic_in_the_United_States"]]},{"claim":"Po tygodniu zapominamy około 90% przeczytanego","verdict":"przesada","note":"Krzywa zapominania Ebbinghausa dotyczy bezsensownych sylab, nie czytania ze zrozumieniem.","p":4,"src":[["Wikipedia (ang.): krzywa zapominania - hasło \"Forgetting curve\"","https://en.wikipedia.org/wiki/Forgetting_curve"]]},{"claim":"Premortem pozwala wskazać do 30% więcej ryzyk","verdict":"prawda","note":"Gary Klein w HBR przytacza badanie z około 30% lepszym wskazywaniem przyczyn porażki.","p":6,"src":[["Harvard Business Review: Gary Klein o premortem","https://hbr.org/2007/09/performing-a-project-premortem"],["Wikipedia (ang.): premortem - hasło \"Pre-mortem\"","https://en.wikipedia.org/wiki/Pre-mortem"]]},{"claim":"Cisza pomaga tworzyć nowe komórki w hipokampie","verdict":"półprawda","note":"Badanie z 2013 r. dotyczyło myszy, nie ludzi.","p":7,"src":[["Brain Structure and Function: Kirste i in. 2013, myszy","https://link.springer.com/article/10.1007/s00429-013-0679-3"]]},{"claim":"Piszący ręcznie rozumieją materiał lepiej niż piszący na laptopie","verdict":"półprawda","note":"Badanie Mueller i Oppenheimer 2014 tak wskazało, ale późniejsze replikacje dały słabsze wyniki.","p":8,"src":[["PubMed: Mueller i Oppenheimer 2014","https://pubmed.ncbi.nlm.nih.gov/24760141/"],["Frontiers in Psychology: aktywność mózgu przy pisaniu ręcznym","https://www.frontiersin.org/articles/10.3389/fpsyg.2023.1219945/full"]]},{"claim":"Colgate wypuścił lasagne w 1982 r.","verdict":"półprawda","note":"Muzeum Porażek podaje lata 60., a firma nie potwierdza istnienia produktu.","p":9,"src":[["Wikipedia (ang.): Muzeum Porażek - hasło \"Museum of Failure\"","https://en.wikipedia.org/wiki/Museum_of_Failure"]]},{"claim":"Ford stracił na Edselu równowartość około 3 mld dolarów","verdict":"prawda","note":"Strata ponad 250 mln dolarów to około 2,7 mld w dolarach z 2025 r.","p":9,"src":[["Wikipedia (ang.): Edsel - hasło \"Edsel\"","https://en.wikipedia.org/wiki/Edsel"]]},{"claim":"Betamax miał lepszy obraz niż VHS, ale przegrał przez czas nagrania","verdict":"półprawda","note":"Przewaga obrazu była niewielka (250 wobec 240 linii), krótki czas nagrania faktycznie szkodził.","p":9,"src":[["Wikipedia (ang.): Betamax - hasło \"Betamax\"","https://en.wikipedia.org/wiki/Betamax"]]}],"bias":"Motywacyjny ton i hasła typu \"laptop robi cię głupszym\". Część anegdot (Napoleon, Einstein, NASA) podana bez źródeł, badania uproszczone."},{"id":"rTl-KxWh-WQ","title_pl":"Obejrzyj, zanim zalogujesz się do WoW Forever: co zmieniło się w becie","title":"Watch This Before You Log Into Forever","channel":"Bellular Warcraft","url":"https://www.youtube.com/watch?v=rTl-KxWh-WQ","date":"2026-11-04","duration":799,"views":83243,"section":"Pozostałe","transcript":"youtube","added":"2026-11-05","tags":["Gry","WoW"],"about":"Bellular podsumowuje zmiany w WoW Forever od BlizzConu: pogoda, modele postaci, XP z lochów, warstwy świata, walka z botami i zmiany ras.","intro":"Bellular Warcraft to anglojęzyczny kanał z wiadomościami o World of Warcraft. WoW Forever to nowa wersja gry w stylu klasycznego WoW (poziomy 1 do 60), zapowiedziana na BlizzConie i przez ostatnie 2 miesiące testowana w becie. Twórcy wypuścili w tym czasie około 6 godzin podcastów i mnóstwo zmian, więc autor streszcza, co trzeba wiedzieć przed premierą.\n\nWiększość filmu to przykłady, jak Blizzard szybko reaguje na opinie graczy. Na końcu autor opisuje jedyną zmianę, którą uważa za krok w złą stronę: przebudowę bonusów rasowych.","points":[{"t":"Powrót pogody","d":"**Sześć dni po starcie bety Blizzard dodał dynamiczną pogodę, której według autora brakowało od czasów dodatku Cataclysm.** Nie chodzi tylko o deszcz, ale o pełny cykl burzy, od narastania po pioruny, a kilka tygodni później pojawił się śnieg w Dun Morogh.\n\nAutor wnioskuje, że te systemy były gotowe wcześniej, a nie zrobione w odpowiedzi na opinie, więc gra na premierę będzie bardziej klimatyczna niż to, co widać było dotąd. Spodziewa się też burz piaskowych na pustyniach."},{"t":"Modele postaci i wygląd druidów","d":"**Nowa rasa Skyborne miała tylko modele w wysokiej rozdzielczości, które gryzły się ze starym stylem gry, więc Blizzard obiecał wersje w starej, niskiej rozdzielczości.** Będą gotowe na początku przyszłego roku.\n\nJeszcze szybciej poprawiono formy zwierzęce druidów: gracze uznali je za zbyt jaskrawe i zostały przyciemnione do brudniejszego, \"ręcznie malowanego\" wyglądu z dawnego WoW."},{"t":"Doświadczenie z lochów","d":"**Blizzard nie chciał, by gracze zdobywali poziomy wyłącznie w lochach, bo głównym bohaterem ma być otwarty świat Azeroth.** Najpierw gracze narzekali, że lochy dają za mało doświadczenia, więc twórcy podnieśli nagrody za jednorazowe zadania z lochów, ale przesadzili i ludzie przeskakiwali z lochu do lochu, omijając świat.\n\nNagrody obniżono, potem lekko podniesiono doświadczenie za potwory w lochach i naprawiono błąd w skalowaniu doświadczenia w grupie. Dla autora to wzór szybkiego reagowania."},{"t":"Warstwy świata i godziny dla Oceanii","d":"**Największą skargą były wymuszone odświeżenia świata i \"warstwy\" (layering), czyli dzielenie graczy na kopie tej samej strefy.** Ludzie znikali sprzed oczu przy wejściu do Orgrimmaru, a po podróży statkiem obok stali zupełnie inni gracze.\n\nOstatnia wersja bety według twórców rozwiązała 99% problemów: odświeżeń jest mniej, a strefy zgrupowano inaczej. Blizzard rozważa też poprawkę dla Australii: tamtejsze serwery liczą czas jak Ameryka Północna, więc za dnia w Australii w grze jest ciemno."},{"t":"Powrót zestawu reguł RP PvP","d":"**Gra miała mieć trzy zestawy reguł: zwykły, PvP i odgrywanie ról, bez łączonego RP PvP.** Blizzard chciał trzymać graczy razem, a RP PvP zawsze był najmniej popularny.\n\nPo licznych prośbach graczy wrócił, więc WoW Forever wystartuje z zestawem, który pierwotnie usunięto. Zamiast listy serwerów gracz wybiera zestaw reguł."},{"t":"Walka z botami i handlem złotem","d":"**Boty i sprzedawcy złota za prawdziwe pieniądze psuli gospodarkę każdej wersji Classic, więc Blizzard zakazał GDKP i zapowiedział karanie także kupujących.** GDKP to rajdy, w których łupy licytuje się za złoto, często kupione nielegalnie.\n\nWedług autora deweloper Aggrend podał, że w becie zablokowano ponad 2100 kont za kupowanie złota i 1600 za sprzedaż i boty, w tym znanych streamerów. Gracze zaczęli wręcz sprawdzać cudze złoto dodatkami, bo kupowane złoto stało się realnym ryzykiem dla konta."},{"t":"Pospieszne zmiany klas","d":"**Zaraz po końcu bety Blizzard wypuścił długą listę zmian klas, które autor nazywa miejscami \"ostatnią chwilą i trochę szaleństwem\".** Przykłady: paladyni obronni z nowym talentem blokują czary w 100%, druidzi feral stracili Berserk, a mag mrozu dostał 12% obrażeń więcej i czas odnowienia na Ice Lance.\n\nProblem polega na tym, że dopracowano głównie pierwsze 30 poziomów, a tak duże zmiany wchodzą bez testów."},{"t":"Bonusy rasowe: zmiana na gorsze","d":"**Blizzard usunął bonusy ras do konkretnych broni i zastąpił je szansą lub siłą trafienia krytycznego.** Plus jest taki, że nikt nie musi już grać człowiekiem, by dobrze używać danej broni. Minus według autora: znika smak RPG, bo ork z toporem czy krasnolud z karabinem to już tylko wygląd.\n\nPo kilku dniach Blizzard znów przetasował bonusy, osłabił Skyborne, dał ludziom 10% ducha i przywrócił orkom 5% obrażeń zwierzaka. W efekcie wróciło to, co miało zniknąć: pewne rasy znów są obowiązkowe dla optymalizujących graczy."}],"conclusion":"Autor uważa, że twórcy niemal wszędzie poprawili grę jeszcze przed premierą, a jedyny krok wstecz to rasy, bo maksymalizujących graczy i tak nie da się powstrzymać. Ma nadzieję, że po premierze Blizzard będzie dalej robił zmiany, które nie spychają gry w stronę nowoczesnego WoW.","factchecks":[{"claim":"WoW Forever ma zestawy reguł zamiast serwerów, w tym przywrócony RP PvP","verdict":"prawda","note":"Blizzard wymienia Normal, PvP, RP i RP-PvP, a Hardcore po premierze.","p":4,"src":[["Blizzard: wybór zestawu reguł w WoW Forever","https://news.blizzard.com/en-us/article/24302070/updated-10-22-choose-your-ruleset-in-world-of-warcraft-forever"],["Wowhead: koniec serwerów w WoW Forever","https://www.wowhead.com/forever/news/no-more-realms-in-wow-forever-382866"]]},{"claim":"W becie zablokowano ponad 2100 kont za kupowanie i 1600 za sprzedaż złota","verdict":"nie da się sprawdzić","note":"Liczby padły według autora w podcaście twórców, nie znaleźliśmy ich na piśmie.","p":5,"src":[["Wikipedia (ang.): farmienie złota - hasło \"Gold farming\"","https://en.wikipedia.org/wiki/Gold_farming"]]}],"bias":"Kanał fanowski, ogólnie entuzjastyczny wobec Blizzarda. Ocena zmian ras to opinia autora. Na końcu zapowiedź własnego filmu o dodatkach."},{"id":"yEkHjoaZS20","title_pl":"Marki perfum, których klony nie zastąpią","title":"Fragrance Brands Clones Can’t Replace | Men’s Cologne/Perfume Review 2026","channel":"School of Scent","url":"https://www.youtube.com/watch?v=yEkHjoaZS20","date":"2026-11-04","duration":820,"views":5774,"section":"Moda","transcript":"youtube","added":"2026-11-05","tags":["Perfumy","Jakość","Kolekcja","Styl"],"about":"School of Scent wymienia 10 domów zapachowych, przy kt
