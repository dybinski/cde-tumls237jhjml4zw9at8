<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:,">
<title>Streszczenia YouTube</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600&display=swap&subset=latin-ext" rel="stylesheet">
<style>
:root{color-scheme:dark}
:root{--ink:#eeeeee;--mut:#999999;--line:#222222;--s1:1.5rem;--s2:1.125rem;--s3:.9375rem;--s4:.875rem;
--v-prawda:#4cc46a;--v-polprawda:#f2c94c;--v-przesada:#ff9440;--v-falsz:#ff5a5a;--v-nds:#8c8c8c;--red:#ff3b30}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#000;color:var(--ink);font:400 var(--s3)/1.6 "Figtree","Helvetica Neue",Arial,sans-serif}
body.lock{overflow:hidden}
a{color:inherit;text-decoration:underline;text-decoration-color:#666;text-underline-offset:3px}
a:hover{text-decoration-color:var(--ink)}
button{font:inherit;color:inherit}
.wrap{max-width:1440px;margin:0 auto;padding:0 24px}
.bar{position:sticky;top:0;z-index:5;background:#000;border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:16px;padding-top:12px;padding-bottom:12px}
h1{font-size:var(--s2);font-weight:600;margin:0;white-space:nowrap;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.ctl{display:flex;gap:10px;flex:1;justify-content:flex-end}
#q{max-width:420px}
input,select{font:inherit;font-size:var(--s3);color:var(--ink);background:#000;border:1px solid #444;border-radius:24px;padding:0 16px;min-height:44px;width:100%;outline:none;-webkit-appearance:none;appearance:none}
select{width:auto;padding-right:32px;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat;cursor:pointer}
input:focus,select:focus{border-color:var(--ink)}
.sync{display:inline-block;width:8px;height:8px;border-radius:50%;background:#6a6a6a;overflow:hidden;color:transparent;font-size:1px;flex:none}
.sync.ok{background:var(--v-prawda)}.sync.off{background:var(--v-przesada)}
main{padding:24px 0 40px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:32px 16px}
@media (max-width:1279px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:899px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:599px){.grid{grid-template-columns:1fr;gap:28px}}
.tile{display:block;text-decoration:none;color:inherit;border-radius:12px;outline-offset:4px}
.th{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#111}
.th img{display:block;width:100%;height:100%;object-fit:cover;transition:opacity .2s}
.dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.8);color:#fff;font-size:.75rem;font-weight:600;line-height:1;padding:4px 5px;border-radius:4px}

.rd{display:none;position:absolute;left:8px;top:8px;background:rgba(0,0,0,.8);color:#fff;font-size:.75rem;font-weight:600;line-height:1;padding:5px 7px;border-radius:4px}
.prog{display:none;position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--red)}
.tile.read .th img{opacity:.4}
.tile.read .rd,.tile.read .prog{display:block}
.tile.read .dur{bottom:12px}
.vbar{display:flex;height:4px;gap:2px;margin:8px 0 0}
.vbar b{display:block;height:100%;border-radius:1px}
.tile h2{font-size:var(--s3);font-weight:600;line-height:1.4;margin:10px 0 2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .meta{color:var(--mut);font-size:var(--s4);margin:0}
.tile.read h2{color:var(--mut)}
.tile:hover h2{text-decoration:underline;text-decoration-color:#666;text-underline-offset:3px}
.empty{color:var(--mut);padding:40px 0}
footer{color:var(--mut);font-size:var(--s4);padding:8px 0 48px}
footer p{margin:0}
/* modal */
.ov{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.8);display:none;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.ov.on{display:block}
.dlg{background:#000;max-width:760px;margin:40px auto;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.mh{position:sticky;top:0;z-index:2;display:flex;justify-content:flex-end;padding:10px 12px;background:rgba(0,0,0,.9);border-bottom:1px solid var(--line)}
.x{min-height:48px;padding:0 20px;border:1px solid #6a6a6a;border-radius:24px;background:#000;cursor:pointer;font-weight:600}
.x:hover{border-color:var(--ink)}
.mimg{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;background:#111}
.mb{max-width:640px;margin:0 auto;padding:32px 28px 48px;font-size:1.125rem;line-height:1.6}
.mb p{margin:0}
.mb h2{font-size:1.75rem;font-weight:600;line-height:1.25;margin:0 0 10px;letter-spacing:-.015em}
.mmeta{color:var(--mut);font-size:.875rem;line-height:1.5;margin:0 0 28px!important}
.lead{font-size:1.25rem;line-height:1.55;color:var(--ink);margin:0 0 40px!important}
.pts{list-style:none;margin:0;padding:0}
.pts li{margin:0 0 32px}
.pts h3{font-size:1.125rem;font-weight:600;line-height:1.4;margin:0 0 6px;color:#f5f5f5}
.pts .pd{color:#a8a8a8}
.fcs{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.bdg{display:inline-flex;align-items:center;gap:7px;min-height:32px;padding:0 12px;border:1px solid #333;border-radius:16px;background:#0d0d0d;color:#cfcfcf;font-size:.8125rem;font-weight:600;line-height:1;cursor:pointer}
.bdg:hover,.bdg[aria-expanded="true"]{border-color:#777;color:var(--ink)}
.bdg .dot{width:8px;height:8px;border-radius:50%;margin:0;flex:none}
.bdg .chev{font-weight:400;color:var(--mut);transition:transform .15s}
.bdg[aria-expanded="true"] .chev{transform:rotate(180deg)}
.fx{margin:12px 0 0;padding:14px 16px;border-left:3px solid var(--v-nds);background:#0b0b0b;border-radius:0 8px 8px 0;font-size:1.0625rem;line-height:1.6}
.fx[hidden]{display:none}
.fx .cl{color:var(--ink);font-weight:600;margin:0 0 6px!important}
.fx .nt{color:#a8a8a8}
.fx .sr{margin:8px 0 0!important;font-size:.9375rem;color:var(--mut)}
.fx .sr a{color:#bdbdbd;margin-right:12px;display:inline-block}
.blk{margin:40px 0 0;padding:20px 22px;border:1px solid #2a2a2a;border-radius:12px}
.blk+.blk{margin-top:16px}
.blk h3{font-size:.8125rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:0 0 8px}
.blk p{color:#d6d6d6}
.blk.bias{border-color:#3a2a1a;background:#0c0905}
.mfoot{margin:40px 0 0;padding:20px 0 0;border-top:1px solid var(--line);color:var(--mut);font-size:.875rem;line-height:1.55}
.mfoot p{margin:0 0 10px!important}
.mfoot .orig a{color:#bdbdbd}
.tags{display:flex;flex-wrap:wrap;gap:0 14px;margin:0 0 6px}
.tag{color:var(--mut);background:none;border:0;padding:0;min-height:36px;cursor:pointer;font-size:.875rem}
.tag:hover{color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin:0 0 12px}
.legend span{white-space:nowrap}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.mfoot .vbar{height:4px;margin:0 0 8px;max-width:240px}
.small{color:var(--mut)}
.v-prawda{border-color:var(--v-prawda)!important;background-color:var(--v-prawda)}
.v-polprawda{border-color:var(--v-polprawda)!important;background-color:var(--v-polprawda)}
.v-przesada{border-color:var(--v-przesada)!important;background-color:var(--v-przesada)}
.v-falsz{border-color:var(--v-falsz)!important;background-color:var(--v-falsz)}
.v-nds{border-color:var(--v-nds)!important;background-color:var(--v-nds)}
.fx.v-prawda,.fx.v-polprawda,.fx.v-przesada,.fx.v-falsz,.fx.v-nds{background-color:#0b0b0b}
.ur{min-height:48px;padding:0 20px;border:1px solid #6a6a6a;border-radius:24px;background:#000;cursor:pointer;margin-top:6px;font-size:.9375rem}
.ur:hover{border-color:var(--ink)}
@media (max-width:599px){
 .wrap{padding:0 16px}
 .bar .wrap{flex-wrap:wrap;gap:8px 10px;padding-top:10px;padding-bottom:10px}
 h1{flex:1}
 .ctl{flex-basis:100%;flex-wrap:wrap;gap:8px}
 #q{max-width:none;flex-basis:100%}
 .ctl select{flex:1}
 input,select{font-size:16px}
 main{padding-top:16px}
 .ov{background:#000}
 .dlg{margin:0;border:0;border-radius:0;min-height:100%}
 .mb{padding:24px 20px 48px;font-size:1.0625rem}
 .mb h2{font-size:1.5rem}
 .lead{font-size:1.1875rem;margin-bottom:36px!important}
 .pts h3{font-size:1.0625rem}
 .pts li{margin-bottom:28px}
 .blk{padding:18px 18px}
}
</style>
</head>
<body>
<div class="bar"><div class="wrap">
<h1>Streszczenia YouTube <span class="sync" id="sync" role="status">synchronizacja...</span></h1>
<div class="ctl">
<input id="q" type="search" placeholder="Szukaj" aria-label="Szukaj" autocomplete="off">
<select id="ch" aria-label="Kanał"><option value="all">Wszystkie kanały</option></select>
<select id="fr" aria-label="Filtr"><option value="all">Wszystkie</option><option value="unread">Nieprzeczytane</option><option value="read">Przeczytane</option></select>
<select id="so" aria-label="Kolejność"><option value="new">Najnowsze</option><option value="old">Najstarsze</option><option value="pop">Popularne</option></select>
</div>
</div></div>
<main class="wrap"><div class="grid" id="list"></div></main>
<footer class="wrap"><p>Streszczenia wyłącznie z transkryptów, bez analizy obrazu. Stan przeczytanych synchronizuje się między urządzeniami.</p></footer>

<script>
(function(){
var V=[{"id":"difPlwouuPY","title_pl":"Gdy pęknie bańka AI: lekcja z cmentarzyska drewnianych statków","title":"When the AI bubble pops...","channel":"Phil Edwards","url":"https://www.youtube.com/watch?v=difPlwouuPY","date":"2026-11-02","duration":861,"views":97911,"transcript":"youtube","added":"2026-11-03","tags":["Historia","Technika"],"about":"Autor porównuje boom centrów danych AI do drewnianych statków z I wojny światowej, które dziś leżą w zatoce Mallows Bay.","intro":"Phil Edwards płynie kajakiem po Mallows Bay w Maryland, gdzie leży ponad 100 drewnianych statków z I wojny światowej. Porównuje ten pospieszny program budowy do dzisiejszego boomu centrów danych AI. Pokazuje, że bańka to nie tylko spekulacja finansowa, ale też fizyczne pozostałości po nadmiernej budowie. Film ma sponsora (Hostinger).","points":[{"t":"Centra danych zmieniają krajobraz","d":"Zdjęcia satelitarne przed i po pokazują, jak setki centrów danych za miliardy dolarów zastępują pola, np. centrum Amazona w Karolinie Północnej i Clarksville w Arkansas. Od Data Center Alley w Wirginii do Mallows Bay jest ok. 137 km."},{"t":"Pośpiech bez znanego terminu","d":"W 1917 r. USA założyły Emergency Fleet Corporation, by przy niedoborze stali szybko budować statki na wojnę. Wydano setki milionów dolarów, a nikt nie wiedział, kiedy wojna się skończy, tak jak dziś nie wiadomo, kiedy nastąpią przełomy w AI."},{"t":"Bańka pochłania zasoby","d":"Gazeta pisała o 68 planach budowy na 375 statków z sosny długoigielnej, której nie wolno było sprzedawać gdzie indziej, choć nie była dobrym materiałem. Autor porównuje to do drożejącej pamięci komputerowej wykupywanej przez boom AI."},{"t":"Nowa infrastruktura","d":"W ciągu 2 lat przybyło 120 stoczni i 657 pochylni. Według autora to dokładnie odpowiada dzisiejszej budowie elektrowni i sieci dla centrów danych."},{"t":"Polityka pompuje bańkę","d":"Hasło wyścigu z Chinami napędza inwestycje w AI, np. projekt Stargate w Teksasie Trumpa i OpenAI. Po I wojnie szef Shipping Board bronił niewykorzystanych statków, bo w czasie wojny nie ma nadwyżek. Bańka pękła, gdy wojna skończyła się wcześniej, niż sądzono."},{"t":"Gorszy materiał, gorsza budowa","d":"Drewniane statki były słabsze nie tylko przez trwałość: wymagały dużo więcej wzmocnień wewnątrz niż stalowe. Najpopularniejszy był projekt Design 1001; po wojnie statki były drogie w utrzymaniu, a w 1925 r. odholowano je do Mallows Bay."},{"t":"Niepewność centrów danych","d":"Wiele centrów danych powstaje bez stabilnego zasilania, a nie wiadomo, czy GPU w środku za 5 lat będą coś warte. Niejasne jest też, czy AI nie przeniesie się na lokalne urządzenia; Apple według autora na to stawia."},{"t":"Płonący basen i złom","d":"Statki malowano kamuflażem dazzle, który radar uczynił prawie bezużytecznym. W II wojnie rząd zaryzykował 200 000 dolarów, by odzyskać co najmniej 11 000 ton metalu: statki spalono w basenie i wyciągano złom elektromagnesem. Dziś to rezerwat przyrody morskiej."},{"t":"Lekcja światłowodów","d":"Boom światłowodowy z lat 2000. uznano wtedy za klapę, ale ta infrastruktura zbudowała współczesny internet. Autor sądzi, że AI nie pęknie nagle jak koniec wojny, ale boom zostawi i użyteczne rzeczy, i drewniane statki."}],"conclusion":"Nawet jeśli AI zostanie, boom budowy zostawi po sobie niepotrzebną infrastrukturę i przekształci krajobraz.","factchecks":[{"claim":"W Mallows Bay leży ponad 100 drewnianych statków z I wojny światowej.","verdict":"prawda","note":"Wraków statków z programu wojennego jest tam ok. 230; od 2019 r. to rezerwat morski NOAA.","p":null,"src":[["Wikipedia (ang.): zatoka Mallows Bay - hasło \"Mallows Bay\"","https://en.wikipedia.org/wiki/Mallows_Bay"],["NOAA: rezerwat Mallows Bay-Potomac River","https://sanctuaries.noaa.gov/mallows-potomac/"]]},{"claim":"Emergency Fleet Corporation powstała w 1917 r.","verdict":"prawda","note":"Utworzono ją 16 kwietnia 1917 r. przy U.S. Shipping Board.","p":1,"src":[["Wikipedia (ang.): Emergency Fleet Corporation - hasło \"Emergency Fleet Corporation\"","https://en.wikipedia.org/wiki/Emergency_Fleet_Corporation"]]},{"claim":"Design 1001 był najpopularniejszy, a w 1925 r. statki odholowano do Mallows Bay.","verdict":"prawda","note":"Design 1001 (typ Ferris) z sosny lub daglezji był standardowym projektem; holowanie w 1925 r. potwierdza Wikipedia.","p":5,"src":[["Wikipedia (ang.): statek typu Design 1001 - hasło \"Design 1001 ship\"","https://en.wikipedia.org/wiki/Design_1001_ship"],["Wikipedia (ang.): zatoka Mallows Bay - hasło \"Mallows Bay\"","https://en.wikipedia.org/wiki/Mallows_Bay"]]},{"claim":"Statki spalono w II wojnie, by odzyskać metal.","verdict":"półprawda","note":"Spalono je już ok. 1925 r. po bankructwie firmy złomowej; w II wojnie Bethlehem Steel zbudowało basen do odzysku metalu.","p":7,"src":[["Wikipedia (ang.): zatoka Mallows Bay - hasło \"Mallows Bay\"","https://en.wikipedia.org/wiki/Mallows_Bay"]]},{"claim":"Kamuflaż dazzle stał się prawie bezużyteczny przez radar.","verdict":"prawda","note":"Tracił sens wraz z dalmierzami i lotnictwem, a w II wojnie radar dodatkowo osłabił jego działanie.","p":7,"src":[["Wikipedia (ang.): kamuflaż dazzle - hasło \"Dazzle camouflage\"","https://en.wikipedia.org/wiki/Dazzle_camouflage"]]},{"claim":"Stargate w Teksasie uzasadniano wyścigiem z Chinami.","verdict":"prawda","note":"Stargate buduje centra danych w Abilene w Teksasie; ogłoszono go w Białym Domu w 2025 r.","p":4,"src":[["Wikipedia (ang.): projekt Stargate - hasło \"Stargate LLC\"","https://en.wikipedia.org/wiki/Stargate_LLC"]]},{"claim":"Apple stawia na AI uruchamianą lokalnie.","verdict":"półprawda","note":"Apple Intelligence działa głównie na urządzeniu, ale trudniejsze zadania wysyła do chmury Private Cloud Compute.","p":6,"src":[["Apple: zapowiedź Apple Intelligence (2024)","https://www.apple.com/newsroom/2024/06/introducing-apple-intelligence-for-iphone-ipad-and-mac/"]]},{"claim":"Nadmiar światłowodów z boomu stał się potem podstawą internetu.","verdict":"prawda","note":"Nadwyżkę po krachu dot-com nazwano ciemnym włóknem; później stworzyła nowy rynek usług.","p":8,"src":[["Wikipedia (ang.): ciemne włókno - hasło \"Dark fibre\"","https://en.wikipedia.org/wiki/Dark_fibre"],["Wikipedia (ang.): bańka internetowa - hasło \"Dot-com bubble\"","https://en.wikipedia.org/wiki/Dot-com_bubble"]]}],"bias":"Analogia luźna i wybiórcza: wojenny program rządu to nie prywatne inwestycje. Sponsor Hostinger chwalony jako platforma AI, co kłóci się z tematem filmu."},{"id":"1qEPZT1FQs0","title_pl":"Więc MacBooki mają teraz ekrany dotykowe","title":"So, Apple MacBooks have touch screens now","channel":"NikTek","url":"https://www.youtube.com/watch?v=1qEPZT1FQs0","date":"2026-10-28","duration":77,"views":386134,"transcript":"youtube","added":"2026-11-03","tags":["Technika"],"about":"Krótki montaż: Steve Jobs mówi, że pionowy ekran dotykowy nie działa, na tle reklamy nowego MacBooka Pro z dotykiem.","intro":"Ironiczny, 77-sekundowy montaż. Fragmenty wystąpień Steve'a Jobsa, który przekonuje, że dotykowy ekran w laptopie to zły pomysł, przeplatają się z reklamą nowego MacBooka Pro z ekranem dotykowym i procesorami M5 Pro i M5 Max.","points":[{"t":"Jobs: pionowy dotyk nie działa","d":"Jobs mówi, że Apple dawno temu testowało dotyk na pionowym ekranie i to się nie sprawdza: dobrze wygląda na pokazie, ale ręka szybko się męczy, aż \"chce odpaść\". Ekrany dotykowe mają być poziome, stąd gładziki."},{"t":"Reklama nowego MacBooka","d":"Między wypowiedziami lecą fragmenty reklamy: obraz tak realny, że chce się go dotknąć, a skoro można, to przesuwać, szczypać i przewijać. Reklama poleca M5 Pro lub M5 Max z akceleratorami neuronowymi i baterię na całą noc."}],"conclusion":"Bez słowa komentarza: zestawienie pokazuje, że Apple zrobiło to, co Jobs uważał za błąd.","factchecks":[{"claim":"Apple wprowadziło MacBooka z ekranem dotykowym.","verdict":"prawda","note":"28.10.2026 Apple ogłosiło MacBooka Pro z ekranem PROLED XDR i dotykiem, z M5 Pro i M5 Max; dostawy od 6.11.","p":1,"src":[["Apple Newsroom: nowy MacBook Pro z dotykiem","https://www.apple.com/newsroom/2026/10/apple-unveils-groundbreaking-macbook-pro-with-proled-xdr-display/"],["MacRumors: zapowiedź nowego MacBooka Pro","https://www.macrumors.com/2026/10/28/apple-new-macbook-pro/"]]},{"claim":"Steve Jobs był przeciwny dotykowym ekranom w Macach.","verdict":"prawda","note":"Ars Technica przypomina, że Jobs był znanym przeciwnikiem tego pomysłu; cytaty to jego wypowiedzi sprzed lat.","p":0,"src":[["Ars Technica: dotykowy MacBook Pro i sprzeciw Jobsa","https://arstechnica.com/apple/2026/10/apple-announces-touchscreen-macbook-pro-with-oled-display/"],["CNBC: Apple wprowadza dotyk w Macach","https://www.cnbc.com/2026/10/28/apple-mac-touchscreen-launch.html"]]}],"bias":"Satyra wyrwana z kontekstu: argument Jobsa z 2010 r. dotyczył ekranu jako jedynego sposobu obsługi, a nowy MacBook ma nadal gładzik i klawiaturę."},{"id":"xB-Gkb7mvlM","title_pl":"Schudłem 30 kg po 40. Wieczorne podjadanie to nie słaba wola","title":"Schudłem 30 kg po 40. Wieczorne podjadanie to nie słaba wola.","channel":"Odchudzanie bez spiny | Leszek Zieliński","url":"https://www.youtube.com/watch?v=xB-Gkb7mvlM","date":"2026-10-27","duration":672,"views":13674,"transcript":"youtube","added":"2026-11-03","tags":["Ciało i zdrowie","Psychologia"],"about":"Skąd bierze się wieczorne podjadanie: głód, jedzenie emocjonalne i nawyki, jak sobie z nimi radzić i kiedy iść do lekarza.","intro":"Leszek, technolog żywności, który schudł ze 124 do 94 kg, tłumaczy, że wieczorne podjadanie rzadko wynika z braku silnej woli. Wymienia 3 przyczyny: głód, jedzenie emocjonalne i nawyki, do każdej daje prosty sposób. Mówi też, kiedy problem wymaga specjalisty.","points":[{"t":"Kim jest autor","d":"Ma 45 lat; ważył 124 kg przy otyłości II stopnia z cukrzycą typu 2 i stłuszczeniem wątroby. Teraz waży 94 kg, glikemia jest w normie bez leków, cukrzyca w remisji, a stłuszczenia wątroby nie ma. Jest technologiem żywności z kilkunastoletnim stażem."},{"t":"Mit baterii silnej woli","d":"Popularna teoria mówi, że rano mamy pełną baterię silnej woli, a wieczorem się wyczerpuje. Autor uważa, że może jest w tym ziarno prawdy, ale jako główna przyczyna oznaczałaby codzienną, coraz trudniejszą walkę do końca życia."},{"t":"Przyczyna 1: zwykły głód","d":"Kolacja ma być sycąca, z białkiem, z ok. 2 godzinami przerwy przed snem; nie musi być przed 18:00. Dwie kromki chleba z wędliną to słaby posiłek. Głód przychodzi falami po 30-60 minut, a przy stałych porach jedzenia pojawia się w porze posiłku."},{"t":"Przyczyna 2: jedzenie emocjonalne","d":"Ochota na chipsy godzinę po dobrej kolacji to wyuczona reakcja na emocje; u autora na nudę i pustkę. Nie chodzi o walkę z emocjami, tylko o inną nagrodę: dla niego było to zgłębianie odchudzania, potem kanał na YouTube."},{"t":"Przyczyna 3: nawyk","d":"Kanapa, serial i coś do chrupania powtarzane tysiące razy stają się automatem bez głodu i emocji. Rada: odczekaj 10-15 minut, a jeśli ochota nie mija, wstań, zatrzymaj serial, odmierz porcję i zjedz bez oglądania. Przekąski najlepiej schować lub nie trzymać w domu."},{"t":"Kiedy do lekarza","d":"Gdy objadasz się w ukryciu, po napadzie masz silne negatywne emocje albo budzisz się w nocy, by coś zjeść. Jeśli takie epizody zdarzają się częściej niż raz w tygodniu przez ponad 3 miesiące, potrzebny jest specjalista, nie film. Wspomina też o \"food noise\", czyli natrętnych myślach o jedzeniu."}],"conclusion":"Wieczorne podjadanie ma zwykle kilka przyczyn; gdy się je zrozumie, da się nad nim zapanować.","factchecks":[{"claim":"Utrata wagi może doprowadzić do remisji cukrzycy typu 2.","verdict":"prawda","note":"W badaniu DiRECT po roku remisję miało 46% osób na programie odchudzania i 86% tych, co schudli 15 kg lub więcej.","p":0,"src":[["Lean i in. 2018, Lancet: badanie DiRECT (PubMed)","https://pubmed.ncbi.nlm.nih.gov/29221645/"]]},{"claim":"Teoria \"baterii silnej woli\" może mieć ziarno prawdy.","verdict":"półprawda","note":"To tzw. wyczerpanie ego; duże replikacje (m.in. w 23 laboratoriach) nie potwierdziły efektu.","p":1,"src":[["Wikipedia (ang.): wyczerpanie ego - hasło \"Ego depletion\"","https://en.wikipedia.org/wiki/Ego_depletion"]]},{"claim":"Przy stałych porach jedzenia głód pojawia się w porze posiłku.","verdict":"prawda","note":"Poziom greliny, hormonu głodu, rośnie przed zwykłą porą posiłku i spada po jedzeniu.","p":2,"src":[["Wikipedia (ang.): grelina - hasło \"Ghrelin\"","https://en.wikipedia.org/wiki/Ghrelin"]]},{"claim":"Napady częściej niż raz w tygodniu przez ponad 3 miesiące to sygnał do lekarza.","verdict":"prawda","note":"Zgadza się z kryteriami zaburzenia z napadami objadania się (DSM-5: raz w tygodniu przez 3 miesiące).","p":5,"src":[["Wikipedia (ang.): zaburzenie z napadami objadania się - hasło \"Binge eating disorder\"","https://en.wikipedia.org/wiki/Binge_eating_disorder"],["NIMH: zaburzenia odżywiania","https://www.nimh.nih.gov/health/topics/eating-disorders"]]},{"claim":"Budzenie się w nocy, by jeść, wymaga konsultacji.","verdict":"prawda","note":"To objaw zespołu jedzenia nocnego, ujętego w DSM-5 jako zaburzenie odżywiania.","p":5,"src":[["Wikipedia (ang.): zespół jedzenia nocnego - hasło \"Night eating syndrome\"","https://en.wikipedia.org/wiki/Night_eating_syndrome"]]}],"bias":"Rady oparte głównie na własnym doświadczeniu autora, bez źródeł; poza tym wyważony, bez sprzedaży diet i suplementów."},{"id":"yVLKtB7Lfyk","title_pl":"Triki z Wi-Fi, których używają fachowcy, by podwoić prędkość","title":"Wi Fi Tricks Insiders Use That Double Their Speed","channel":"Chill Dude Explains","url":"https://www.youtube.com/watch?v=yVLKtB7Lfyk","date":"2026-10-27","duration":560,"views":71307,"transcript":"whisper","added":"2026-11-03","tags":["Technika"],"about":"Top 10 trików na szybsze Wi-Fi: miejsce routera, anteny, kanały 1, 6 i 11, zakłócenia, bufferbloat, mesh, MoCA i test z VPN.","intro":"Ranking 10 trików, które według autora znają instalatorzy sieci. Od ustawienia routera i anten, przez kanały i zakłócenia od mikrofalówki i USB 3.0, po bufferbloat, mesh, MoCA i dławienie łącza przez operatora. Porady są w większości trafne, ale część liczb to szacunki autora.","points":[{"t":"10. Router w szafce","d":"Router schowany w szafce albo za telewizorem traci zasięg. Najlepiej postawić go wysoko, centralnie i na otwartej przestrzeni."},{"t":"9. Ustawienie anten","d":"Anteny promieniują prostopadle do swojej osi, więc pionowe najlepiej pokrywają jedno piętro. Przy dwóch piętrach autor radzi jedną antenę pionowo, a drugą poziomo, przy trzech kąty 0, 45 i 90°."},{"t":"8. Kuchenka mikrofalowa","d":"Mikrofalówka działa w paśmie 2,4 GHz z mocą ponad 1000 W, a router ma ok. 0,1 W, więc podczas podgrzewania Wi-Fi się dławi. Pomaga pasmo 5 GHz, choć ma mniejszy zasięg."},{"t":"7. Zatłoczone kanały","d":"Aplikacja typu Wi-Fi Analyzer pokazuje, na których kanałach nadają sąsiedzi. W paśmie 2,4 GHz nie nakładają się tylko kanały 1, 6 i 11; kanał ustawia się ręcznie w panelu routera, zwykle pod 192.168.1.1 lub 192.168.0.1."},{"t":"6. Stary sprzęt spowalnia wszystkich","d":"Jedno urządzenie w starym standardzie 802.11g, sprzed ok. 2010 r., zmusza router do trybu mieszanego. Według autora obniża to prędkość nawet o 50%, więc takie urządzenie warto przenieść do sieci gościnnej."},{"t":"5. Zakłócenia od USB 3.0","d":"Porty i kable USB 3.0 emitują szum w okolicach 2,5 GHz, co opisał raport z 2012 r. Pomaga odsunięcie dysku lub huba od routera albo przejście na 5 GHz."},{"t":"4. Bufferbloat","d":"Przepełnione bufory routera dają lagi, gdy ktoś w domu pobiera duże pliki. Autor radzi włączyć SQM lub QoS i ustawić limit na 80 do 90% prędkości z umowy."},{"t":"3. Wzmacniacz zamiast mesh","d":"Zwykły wzmacniacz odbiera i nadaje na tym samym kanale, więc tnie prędkość o połowę. Lepszy jest system mesh z osobnym łączem między węzłami."},{"t":"2. MoCA przez kabel antenowy","d":"Adaptery MoCA przesyłają sieć istniejącym kablem koncentrycznym z prędkością gigabitową i według autora nawet o 50% mniejszym opóźnieniem. Trzeba dołożyć filtr PoE za ok. 5 dolarów, by sygnał nie wyciekał na zewnątrz."},{"t":"1. Dławienie przez operatora","d":"Niektórzy operatorzy spowalniają streaming lub gry. Test: zmierz prędkość z VPN i bez; w przykładzie autora wzrosła z 40 do 180 Mb/s, co sugeruje celowe dławienie."}],"conclusion":"Większość problemów z Wi-Fi da się naprawić za darmo w kilka minut; autor zachęca do subskrypcji.","factchecks":[{"claim":"W paśmie 2,4 GHz nie nakładają się tylko kanały 1, 6 i 11.","verdict":"prawda","note":"Kanały mają ok. 22 MHz szerokości i są co 5 MHz, więc standardowy zestaw bez nakładania to 1, 6 i 11.","p":3,"src":[["Wikipedia (ang.): lista kanałów WLAN - hasło \"List of WLAN channels\"","https://en.wikipedia.org/wiki/List_of_WLAN_channels"]]},{"claim":"Mikrofalówka pracuje w tym samym paśmie co Wi-Fi 2,4 GHz.","verdict":"prawda","note":"Domowe kuchenki działają na ok. 2,45 GHz, w paśmie ISM 2,4 do 2,5 GHz.","p":2,"src":[["Wikipedia (ang.): kuchenka mikrofalowa - hasło \"Microwave oven\"","https://en.wikipedia.org/wiki/Microwave_oven"]]},{"claim":"USB 3.0 zakłóca Wi-Fi 2,4 GHz, co opisał raport z 2012 r.","verdict":"prawda","note":"Raport USB-IF z kwietnia 2012 r. opisuje spadki przepustowości Wi-Fi i Bluetooth przy urządzeniach USB 3.0.","p":5,"src":[["Wikipedia (ang.): zakłócenia radiowe USB 3.0 - hasło \"USB 3.0\"","https://en.wikipedia.org/wiki/USB_3.0"]]},{"claim":"Bufferbloat powoduje lagi przy obciążonym łączu.","verdict":"prawda","note":"To opóźnienie wynikające z nadmiernego buforowania pakietów w routerze; obniża też przepustowość.","p":6,"src":[["Wikipedia (ang.): bufferbloat - hasło \"Bufferbloat\"","https://en.wikipedia.org/wiki/Bufferbloat"]]},{"claim":"Wzmacniacz Wi-Fi obniża prędkość o połowę.","verdict":"prawda","note":"Repeater z jednym radiem nadaje każdą transmisję dwa razy, więc przepustowość spada co najmniej o 50%.","p":7,"src":[["Wikipedia (ang.): wzmacniacz sieci bezprzewodowej - hasło \"Wireless repeater\"","https://en.wikipedia.org/wiki/Wireless_repeater"]]},{"claim":"MoCA daje gigabit po kablu koncentrycznym.","verdict":"prawda","note":"MoCA 2.0 daje do 1 Gb/s rzeczywistej przepustowości, nowsze wersje więcej.","p":8,"src":[["Wikipedia (ang.): MoCA - hasło \"Multimedia over Coax Alliance\"","https://en.wikipedia.org/wiki/Multimedia_over_Coax_Alliance"]]},{"claim":"VPN pozwala wykryć i obejść dławienie łącza.","verdict":"prawda","note":"Wikipedia wymienia VPN jako sposób na dławienie; wynik 40 do 180 Mb/s to jednak tylko przykład autora.","p":9,"src":[["Wikipedia (ang.): dławienie przepustowości - hasło \"Bandwidth throttling\"","https://en.wikipedia.org/wiki/Bandwidth_throttling"]]}],"bias":"Rzetelny poradnik bez sponsora, ale liczby jak 50% czy 40 do 180 Mb/s to przykłady autora, a nie pomiary."},{"id":"BsFx3ZZh91U","title_pl":"Już to widzieliśmy: tak było tuż przed inwazją Rosji na Ukrainę","title":"We’ve Seen This Before… Right Before Russia Invaded Ukraine","channel":"The Military Show","url":"https://www.youtube.com/watch?v=BsFx3ZZh91U","date":"2026-10-26","duration":1112,"views":3580677,"transcript":"whisper","added":"2026-11-03","tags":["Geografia","Historia"],"about":"Rosja zapełnia bazy sprzętem blisko NATO, Białoruś się militaryzuje, a Kaliningrad dostaje radary. Czy to zapowiedź ataku?","intro":"Kanał The Military Show zestawia doniesienia z października 2026 r.: Rosja zapełnia bazy nowymi czołgami blisko krajów bałtyckich i Finlandii, Białoruś przechodzi na tryb wojenny, a w Kaliningradzie rośnie infrastruktura. Autor uspokaja, że sprzęt jest w magazynach, i pokazuje, jak NATO planuje obronę.","points":[{"t":"Nowe czołgi w magazynach","d":"Według RFE/RL do 22. bazy rezerwy czołgów w Buju trafiają nowe T-90M i BTR-82A, ok. 500 km od NATO. Kyiv Post pisze też o bazach blisko Estonii, Łotwy i 185 km od Finlandii."},{"t":"Produkcja rośnie","d":"Na początku inwazji Rosja robiła 66 do 85 T-90M rocznie, a według Military Watch Magazine z lipca 2025 r. już do 300. Straty czołgów do 20 października to według autora 12 425."},{"t":"Inne bazy","d":"Baza 349 w Topczysze ma od czerwca 2026 r. 78 T-72B3 i ponad 100 BMP-2, a w Karelii stoją Malwy i Giacynty-K. Według United24 większość to sprzęt nowy lub odnowiony."},{"t":"Bez ataku od razu","d":"Sprzęt stoi w magazynach, a drony ograniczyły ataki pancerne, więc autor nie widzi groźby natychmiastowej inwazji. Bazy budowane są dla ok. 115 000 żołnierzy."},{"t":"Białoruś","d":"48-stronicowy raport twierdzi, że Białoruś może wesprzeć operację do wiosny 2027 r. Łukaszenka mówi o przygotowaniach do wojny, a w każdej radzie wiejskiej powstają milicje."},{"t":"Kaliningrad","d":"Według UA.News pod Gwardiejskiem powstaje radar o zasięgu do 3000 km, jedna z 20 podobnych instalacji. Dane z radarów mają trafiać do systemów S-400."},{"t":"Słabości Rosji","d":"Według The Guardian Rosji brakuje ok. 6000 rekrutów miesięcznie, a według United24 w 2026 r. straciła 350 000 żołnierzy. NATO ma ok. 3 razy więcej ludzi i 5 razy więcej samolotów."},{"t":"Plan NATO","d":"Gen. Grynkewich przedstawił plan: zablokować, osłabić i rozbić atak. Adm. Vandier ostrzega, że NATO brakuje głębi przemysłowej, a spóźnienie to jego koszmar."}],"conclusion":"Sygnały są niepokojące, ale nie oznaczają bliskiego ataku; NATO musi szybciej zbroić się i produkować.","factchecks":[{"claim":"Do bazy w Buju trafiają nowe T-90M, ok. 500 km od NATO.","verdict":"prawda","note":"Radio Swoboda porównało zdjęcia z 18.10.2025 i 3.10.2026; baza leży ok. 500 km od Estonii i Łotwy.","p":0,"src":[["Radio Swoboda (ros.): nowe czołgi w bazach","https://www.svoboda.org/a/zapasy-dlya-novoy-voyny-rossiya-napolnyaet-novymi-tankami-bazy-hraneniya/33877890.html"],["Kyiv Post: arsenały przy granicach NATO","https://www.kyivpost.com/post/87513"]]},{"claim":"Sprzęt jest w magazynach, a nie w jednostkach.","verdict":"prawda","note":"iStories i Kyiv Post podkreślają, że sprzęt nie trafił do jednostek i nie jest gotowy do natychmiastowego użycia.","p":3,"src":[["Kyiv Post: arsenały przy granicach NATO","https://www.kyivpost.com/post/87513"]]},{"claim":"Na początku inwazji Rosja miała 66 do 85 T-90M.","verdict":"półprawda","note":"CIT podaje 66 do 85 T-90M dostarczonych do jednostek do 2022 r., czyli łącznie, a nie rocznie.","p":1,"src":[["Radio Swoboda (ros.): nowe czołgi w bazach","https://www.svoboda.org/a/zapasy-dlya-novoy-voyny-rossiya-napolnyaet-novymi-tankami-bazy-hraneniya/33877890.html"]]},{"claim":"Grynkewich: zablokować, osłabić, rozbić.","verdict":"prawda","note":"Przedstawił tę teorię zwycięstwa 12.10.2026 na Warsaw Security Forum.","p":7,"src":[["Stars and Stripes: plan Grynkewicza","https://www.stripes.com/theaters/europe/2026-10-12/nato-grynkewich-russia-forces-23131099.html"],["American Rhetoric: przemówienie Grynkewicza","https://www.americanrhetoric.com/speeches/alexusgrynkewichtheoryofvictoryNATO.htm"]]},{"claim":"Vandier: spóźnienie to mój koszmar, brakuje głębi przemysłowej.","verdict":"prawda","note":"Powiedział to w wywiadzie dla CBC z 19.10.2026.","p":7,"src":[["CBC: wyścig NATO z czasem","https://www.cbc.ca/news/politics/nato-russia-technology-deterrence-ukraine-war-9.7384617"]]}],"bias":"Alarmistyczny tytuł, ale treść jest wyważona; autor miesza jednak źródła różnej jakości, np. Military Watch Magazine i United24."},{"id":"R5j-e5KOqu0","title_pl":"Przetestowałem 28 konsolek retro: oto prawda","title":"I Tested 28 RETRO HANDHELDS... This is the Truth 💀","channel":"Dan Does Nostalgia ","url":"https://www.youtube.com/watch?v=R5j-e5KOqu0","date":"2026-10-25","duration":2081,"views":18729,"transcript":"whisper","added":"2026-11-03","tags":["Technika","Gry"],"about":"Dan po teście 28 konsolek retro: najlepsze budżetowe, najlepszy stosunek ceny do jakości, do Switcha i jego ulubiona.","intro":"Dan przetestował 28 przenośnych konsol do emulacji i mówi, które warto kupić: od tanich Anbernic po Retroid Pocket 5, Mangmi Pocket Max, RG477V i swoją ulubioną AYN Odin 2 Portal. Mówi chaotycznie i bez scenariusza, a w opisie daje linki do sklepów.","points":[{"t":"Budżetowo: Anbernic","d":"RG35XX SP (ok. 75 dolarów) i RG34XX (ok. 60) mają Bluetooth i wyjście HDMI i radzą sobie do N64 i PS1. Do telewizora wystarczy kabel micro HDMI za ok. 10 dolarów."},{"t":"Unikaj najtańszych","d":"R36S za 30 dolarów to według autora zabawka. Jego pierwszą konsolką była RG35XX Plus."},{"t":"Najlepszy stosunek ceny do jakości","d":"Retroid Pocket 5 kosztuje ok. 200 dolarów, często w promocji, i ma ekran OLED 60 Hz. Działa do PS2, a Switch bywa różnie i wymaga zabawy ze sterownikami."},{"t":"Większy ekran","d":"Mangmi Pocket Max ma ten sam procesor, ale ekran OLED 7 cali (ok. 18 cm) i 144 Hz, za ok. 100 dolarów więcej. Autor poleca go raczej do gier PC."},{"t":"Do Switcha","d":"Pionowy RG477V to konsolka, której autor używa najczęściej; jest też pozioma wersja RG477M. Autor woli układ pionowy, bo w poziomych ręce są daleko od siebie."},{"t":"Ulubiona: Odin 2 Portal","d":"AYN Odin 2 Portal kupisz tylko na stronie AYN: dostawa trwała 3 miesiące, kosztowała 40 dolarów i wiązała się ze spamem mailowym. Do tego AYN wypuszcza już Odin 3 Portal."},{"t":"Inne","d":"RG DS Plus nadaje się praktycznie tylko do Nintendo DS. Do gier PC wystarczy ROG Ally z Ryzen Z2 A, a autor nie poleca nawet Steam Decka."},{"t":"Konsole stacjonarne i konkurs","d":"Według autora dobrych konsol stacjonarnych do emulacji już nie ma, ostatnią była Kinhank X5. Swój Odin 2 Portal odda jednemu widzowi bez warunków subskrypcji."}],"conclusion":"Dla większości wystarczy tani Anbernic albo Retroid Pocket 5, a Odin 2 Portal to wybór dla wymagających.","factchecks":[{"claim":"Retroid Pocket 5 ma ekran OLED 5,5 cala (ok. 14 cm) 60 Hz.","verdict":"prawda","note":"Producent podaje 5,5 cala AMOLED 1080p 60 Hz i Snapdragon 865; cena startowa 219 dolarów.","p":2,"src":[["GoRetroid: Retroid Pocket 5","https://www.goretroid.com/products/retroid-pocket-5-handheld"],["Liliputing: premiera Retroid ogramowanie, Composio, webhook, Pages, mail.","intro":"Moritz twierdzi, że przeniósł do Grok Bot większość pracy z Claude Code i ChatGPT. Najpierw podaje 3 zasady pracy z botami, a potem triki: import pamięci, hasła przez 1Password, przeglądarka, połączenie z X, programowanie przez Cursor, Composio, most z webhookiem, strony i własna skrzynka mailowa.","points":[{"t":"Jeden bot na jedno zadanie","d":"Bota traktuje się jak nowego pracownika z jedną rolą. Autor ma szefa sztabu, a pod nim boty do treści i innych zadań."},{"t":"Autonomia krok po kroku","d":"Najpierw plan, potem praca z akceptacją na kolejnych etapach, a po 1 do 2 tygodni zaufania więcej swobody. Samo „prowadź moje SEO” to za mało wskazówek."},{"t":"Źródło prawdy zamiast pamięci","d":"Wbudowana pamięć według autora jeszcze zawodzi. Bot od sponsoringu prowadzi więc stronę w Notion ze stanem każdej umowy i z niej korzysta."},{"t":"Import pamięci i umiejętności","d":"Można poprosić ChatGPT lub Claude o wyeksportowanie wszystkiego, co o tobie wie, do pliku i wrzucić go botowi. Bot może też za zgodą sięgnąć do lokalnych folderów i zaimportować z nich pamięć i umiejętności."},{"t":"Hasła przez 1Password","d":"Autor tworzy w 1Password osobny sejf udostępniony botowi i wrzuca tam tylko wybrane hasła. Karty płatnicze trzeba jednak dodać do wbudowanego Vault."},{"t":"Przeglądarka i ciasteczka","d":"Wbudowana przeglądarka to według autora słaby punkt, gorszy niż w Codex. Autor przeniósł do niej ciasteczka z własnego Chrome, by od razu być zalogowanym, choć sam przyznaje, że to ryzyko."},{"t":"Połączenie z X","d":"Bot przeszukuje publiczne posty na X bez konfiguracji API, a od niedawna czyta i odpisuje na wiadomości prywatne. Oznaczenie @bot pod postem przekazuje go botowi, np. do zapisania jako strona."},{"t":"Programowanie przez Cursor","d":"Bot zleca zadania w projektach Cursor, lokalnie lub w chmurze, nawet z wybranym modelem. Lokalnie może też sterować Claude Code i przeglądarką na komputerze autora."},{"t":"Composio i most z webhookiem","d":"Composio daje te same połączenia w kilku narzędziach i więcej funkcji, np. dla Arkuszy Google. Rutyna z webhookiem pozwala przesyłać polecenia z ChatGPT lub Claude do Grok Bot."},{"t":"Strony, mail i drobiazgi","d":"Bot tworzy strony z raportami, które można udostępniać, i ma własny adres mailowy. Można też zgłosić błąd zespołowi i edytować szkic wiadomości przed wysłaniem."}],"conclusion":"Autor używa Grok Bot także prywatnie, np. do sznurówek, sprawy z ubezpieczeniem i księgowości, i zaprasza do swojego kursu.","factchecks":[{"claim":"Bot może za zgodą wykonywać polecenia na twoim komputerze.","verdict":"prawda","note":"Służy do tego ustawienie Execution on this computer; domyślnie bot pyta za każdym razem.","p":3,"src":[["Dokumentacja Grok Bot: FAQ","https://docs.x.ai/grok-bot/faq"]]},{"claim":"Hasła z 1Password są dostępne dla bota bez ich odczytywania.","verdict":"prawda","note":"Boty logują się danymi z Vault lub podłączonego menedżera haseł bez widzenia wartości.","p":4,"src":[["Dokumentacja Grok Bot: FAQ","https://docs.x.ai/grok-bot/faq"],["Dokumentacja Grok Bot: Vault","https://docs.x.ai/grok-bot/vault"]]},{"claim":"Oznaczenie @bot na X przekazuje post botowi.","verdict":"prawda","note":"Dokumentacja opisuje oznaczanie @bot w poście lub odpowiedzi jako sposób przekazania zadania.","p":6,"src":[["Dokumentacja Grok Bot: @bot na X","https://docs.x.ai/grok-bot/tag-on-x"]]},{"claim":"Rutynę można uruchamiać webhookiem.","verdict":"prawda","note":"Rutyny ruszają według planu albo po zdarzeniu, w tym po wywołaniu webhooka.","p":8,"src":[["Dokumentacja Grok Bot: umiejętności i rutyny","https://docs.x.ai/grok-bot/skills-routines-and-automations"]]},{"claim":"Bot dostaje własny adres mailowy.","verdict":"prawda","note":"Aplikacja Email daje botom ich własny adres zamiast podłączania istniejącego konta.","p":9,"src":[["Dokumentacja Grok Bot: komputer i aplikacje","https://docs.x.ai/grok-bot/computer-and-apps"]]}],"bias":"Entuzjastyczny przegląd z reklamą darmowego poradnika i płatnego kursu autora; kopiowanie ciasteczek z własnej przeglądarki to ryzykowna rada."},{"id":"hGguYFncLUI","title_pl":"Przetestowałem Grok Bot: czego nie mówią inni","title":"I Tested Grok Bot - Here's What They're NOT Telling You","channel":"Serop | AI Automation","url":"https://www.youtube.com/watch?v=hGguYFncLUI","date":"2026-10-15","duration":1178,"views":27704,"transcript":"whisper","added":"2026-11-03","tags":["Technika","Sztuczna inteligencja"],"about":"Serop testuje Grok Bot bez sponsora: chwali prostotę i autonomię, krytykuje brak wglądu w działanie, pamięć i rozliczenia.","intro":"Serop zapowiada uczciwą recenzję bez sponsora, bo według niego wiele filmów o Grok Bot to płatna promocja. Pokazuje boty z własnym komputerem, pamięć, czaty grupowe i przykłady z biznesu. Chwali prostotę, ale martwi go brak wglądu w to, co boty robią i ile to kosztuje.","points":[{"t":"Boty zamiast czatów","d":"Grok Bot wygląda jak ChatGPT czy Claude Code, ale zamiast rozmów ma boty. Każdy ma wirtualny komputer z Chrome i terminalem, nad którym można przejąć kontrolę."},{"t":"Podłączanie narzędzi","d":"Bot łączy się z mailem, Slackiem i harmonogramami. Autor podłączył GitHub, a bot sam otworzył pull request; wszystko działa w chmurze."},{"t":"Pamięć wspólna dla botów","d":"Bot sam decyduje, co zapamiętać na stałe, a część wiedzy dzielą wszystkie boty: inny bot znał cel autora, czyli 50 tys. dolarów miesięcznych przychodów. Minus: pamięci nie da się przejrzeć ani edytować."},{"t":"Brak wyboru modelu","d":"Autor twierdzi, że jest skazany na modele Grok i nie może przejść na modele OpenAI czy Anthropic. Przy cięższym programowaniu może to według niego przeszkadzać."},{"t":"Nie widać myślenia","d":"Autor nie widzi toku rozumowania ani wywołań narzędzi, tylko wynik, chyba że każe botowi pracować na ekranie. Przy poczcie czy obsłudze klientów to go niepokoi."},{"t":"Niejasne rozliczenia","d":"Widzi tylko ogólne zużycie, np. 40% miesięcznego limitu, bez podziału na zadania i modele. Chciałby tańszych modeli do prostych zadań."},{"t":"Czaty grupowe","d":"Boty mogą pracować razem w grupie, np. marketingowej. Ryzyko: dzielą jeden komputer, więc mogą nadpisywać sobie pliki, a sposób ich współpracy narzuca aplikacja."},{"t":"Przykłady użycia","d":"Bot szukał lotów Berlin do Cali w Google Flights, filmów na YouTube z wynikiem ponad stan i sponsorów wydarzeń w Berlinie na Luma. Autor ocenia te zadania jako dobre zastosowanie do researchu."},{"t":"Dyscyplina w liczbie botów","d":"Łatwo stworzyć za dużo botów i stracić orientację. Autor radzi jednego generalistę do jednorazowych zadań, a wyspecjalizowane boty tylko do powtarzalnych procesów."}],"conclusion":"Potężny i bardzo przyjazny system, dobry do researchu i analiz, ale autor nie powierzyłby mu jeszcze kontaktu z klientami.","factchecks":[{"claim":"W Grok Bot można używać tylko modeli Grok.","verdict":"fałsz","note":"Wyboru modelu nie ma, ale Grok Bot sam dobiera model do zadania i może to być też model zewnętrznego dostawcy.","p":3,"src":[["Dokumentacja Grok Bot: FAQ","https://docs.x.ai/grok-bot/faq"]]},{"claim":"Pamięci bota nie da się przejrzeć.","verdict":"półprawda","note":"Nie ma edytora pamięci, ale dokumentacja radzi zapytać bota, co o tobie pamięta; wspólne są tylko niektóre fakty, np. imię.","p":2,"src":[["Dokumentacja Grok Bot: FAQ","https://docs.x.ai/grok-bot/faq"]]},{"claim":"Nie widać, jakich narzędzi używa bot.","verdict":"półprawda","note":"Według dokumentacji w rozmowie widać aktywność narzędzi, pracę na komputerze i prośby o akceptację, choć nie tok rozumowania.","p":4,"src":[["Dokumentacja Grok Bot: czat i współpraca","https://docs.x.ai/grok-bot/chat-and-collaboration"]]},{"claim":"Nie ma sposobu na ustawienie zabezpieczeń przed groźnymi akcjami.","verdict":"fałsz","note":"Są reguły Ask first, np. dla wysyłania, usuwania czy kupowania, oraz Auto Review dla wrażliwych akcji.","p":null,"src":[["Dokumentacja Grok Bot: akceptacje i bezpieczeństwo","https://docs.x.ai/grok-bot/approvals-security-and-privacy"]]},{"claim":"Wszystkie boty dzielą jeden komputer.","verdict":"prawda","note":"Komputer jest jeden na użytkownika, każdy bot ma na nim osobny ekran.","p":6,"src":[["Dokumentacja Grok Bot: FAQ","https://docs.x.ai/grok-bot/faq"]]}],"bias":"Najbardziej krytyczna recenzja z tej grupy, ale autor reklamuje własną płatną usługę AI makeover, a kilka zarzutów jest nieścisłych."},{"id":"8lNK7gjUCEs","title_pl":"Tajna wojna Vsauce z AI","title":"Vsauce's Secret War on AI","channel":"TDT","url":"https://www.youtube.com/watch?v=8lNK7gjUCEs","date":"2026-10-08","duration":758,"views":850724,"transcript":"whisper","added":"2026-11-03","tags":["Media","Sztuczna inteligencja"],"about":"Dlaczego Vsauce prawie przestał wrzucać filmy, jak ludzcy twórcy wygrywają z algorytmem i czemu farmy treści AI tego nie powtórzą.","intro":"Autor kanału TDT zadaje pytanie, jak wybić się na YouTube, gdy filmów jest więcej niż kiedykolwiek, a Vsauce od ponad roku nie wrzucił pełnego filmu. Opisuje 3 strategie wyróżnienia się, historię Vsauce i jego naśladowców oraz zalew treści AI. Wniosek: przetrwa pasja, a nie produkcja masowa.","points":[{"t":"Rekordy YouTube","d":"Rekordzista NameLook ma 4,8 mln filmów, ale tylko ok. 5,9 mln wyświetleń i 65 tys. subskrypcji. MrBeast ma 520 mln subskrypcji, a T-Series 358 mld wyświetleń, przy ok. 8,3 mld ludzi na świecie."},{"t":"Strategia 1: bomba","d":"Jeden film o wiele lepszy od reszty, który przyciąga widzów do całego kanału."},{"t":"Strategia 2: osobowość","d":"Ludzie wracają dla twórcy, a nie dla tematu, jak u Markipliera czy Jacksepticeye."},{"t":"Strategia 3: fioletowa krowa","d":"Według Setha Godina trzeba być wyjątkowym, by się wyróżnić. Vsauce zrobił to pytaniami jak „Czy można dotknąć Marsa?” albo „Jaka jest prędkość ciemności?”."},{"t":"Wyżej zawieszona poprzeczka","d":"Michael Stevens mówi, że pytań mu nie brakuje; chciał przeskoczyć poprzeczkę, którą sam sobie ustawił. Dziś każdy film to miesiące pracy, a robienie treści pod algorytm według niego prowadzi do wypalenia."},{"t":"Algorytm dopasowuje się do niego","d":"Stevens wciąż robi shorty, podcast i Curiosity Box. Zamiast uczyć się algorytmu, uczy algorytm siebie, więc każdy jego film i tak odnosi sukces."},{"t":"Zalew treści AI","d":"Farmy treści AI masowo przerabiają to, co już działa. Autor uważa, że YouTube uratuje pasja twórców, bo ludzie przychodzą oglądać ludzi."}],"conclusion":"Twórcy wygrywają tym, czego nie da się skopiować: wyjątkowością i pasją, a nie liczbą filmów.","factchecks":[{"claim":"MrBeast ma 520 mln subskrypcji.","verdict":"prawda","note":"Według Wikipedii w listopadzie 2026 r. miał 525 mln, więc w czasie filmu 520 mln było zgodne.","p":0,"src":[["Wikipedia (ang.): najczęściej subskrybowane kanały - hasło \"List of most-subscribed YouTube channels\"","https://en.wikipedia.org/wiki/List_of_most-subscribed_YouTube_channels"]]},{"claim":"T-Series ma 358 mld wyświetleń.","verdict":"półprawda","note":"T-Series jest liderem wyświetleń, ale Wikipedia podaje ponad 343 mld, nieco mniej niż w filmie.","p":0,"src":[["Wikipedia (ang.): najczęściej oglądane kanały - hasło \"List of most-viewed YouTube channels\"","https://en.wikipedia.org/wiki/List_of_most-viewed_YouTube_channels"]]},{"claim":"Purple Cow to idea Setha Godina.","verdict":"prawda","note":"Książkę Purple Cow: Transform Your Business by Being Remarkable wydał w 2003 r.","p":3,"src":[["Wikipedia (ang.): Seth Godin - hasło \"Seth Godin\"","https://en.wikipedia.org/wiki/Seth_Godin"]]},{"claim":"Vsauce stworzył Michael Stevens.","verdict":"prawda","note":"Marka działa od 2010 r.; kanał główny ma ok. 25 mln subskrypcji.","p":4,"src":[["Wikipedia (ang.): Vsauce - hasło \"Vsauce\"","https://en.wikipedia.org/wiki/Vsauce"]]}],"bias":"Ciekawy esej o twórczości, ale autor na koniec reklamuje koszulki przeciw grafice AI, a liczby podaje bez źródeł."},{"id":"8xXhE25vJZY","title_pl":"Grok Bot 101: oficjalne warsztaty dla początkujących","title":"Grok Bot 101","channel":"Grok","url":"https://www.youtube.com/watch?v=8xXhE25vJZY","date":"2026-10-06","duration":3401,"views":108717,"transcript":"whisper","added":"2026-11-03","tags":["Technika","Sztuczna inteligencja"],"about":"Oficjalne warsztaty SpaceX AI: idea AI-współpracownika, boty z komputerem, uczenie zadań, umiejętności i zespół botów od naklejek.","intro":"Nagranie warsztatów prowadzonych przez Martina, inżyniera z SpaceX AI, i Cliffa. Pokazują, skąd wziął się Grok Bot, a potem na żywo budują zespół 3 botów, który projektuje naklejki, zbiera głosy widzów w Formularzach Google i szuka drukarni. To materiał producenta, więc bez krytyki.","points":[{"t":"Od chatbota do współpracownika","d":"Najpierw były chatboty, potem agenci, a Grok Bot ma być pierwszym AI-współpracownikiem. Rozmawia się jak w iMessage: boty po lewej, jedna ciągła rozmowa zamiast nowego czatu do każdego zadania."},{"t":"Pamięć i własny komputer","d":"Dwie podstawy to trwała pamięć i komputer, na którym bot używa stron jak człowiek. Może np. zarezerwować lot na stronie linii lotniczej, która nie ma API."},{"t":"Przykłady prowadzących","d":"Martin ma boty do pracy, np. do przygotowania rozmów z klientami. Prywatny bot Bobo śledzi premiery butów, kontuzje w jego ligach fantasy i występy ulubionej tenisistki rodziców."},{"t":"Nauka przez pokazanie","d":"Martin raz pokazuje botowi Maya, jak zrobić formularz Google, a bot zapisuje to jako umiejętność. Według prowadzących skraca to kolejne podejścia i oszczędza zużycie."},{"t":"Boty rozmawiają ze sobą","d":"Maya zbiera głosy w formularzu, a Dex dostaje polecenie zaprojektowania 8 naklejek według wytycznych z Figmy. Łącznik Figma MCP jest w marketplace."},{"t":"Jeden komputer, osobne ekrany","d":"Prowadzący odpowiadają na pytania widzów: boty użytkownika działają na jednej maszynie w chmurze, a pamięcią i kontekstem zarządza aplikacja."},{"t":"Szef sztabu","d":"Na koniec Martin tworzy czat grupowy i awansuje Bobo na szefa sztabu dla Dex, Mayi i bota zakupowego Penny. Pozostałe boty streszczają mu w czacie, co zrobiły w sprawie naklejek."},{"t":"Reguły akceptacji","d":"W ustawieniach można dodać reguły, kiedy bot ma pytać o zgodę, np. przed utworzeniem formularza Google."}],"conclusion":"Według prowadzących boty używają każdego narzędzia nawet bez łącznika, pamiętają, jak pracujesz, i pytają o zgodę tam, gdzie tego chcesz.","factchecks":[{"claim":"Wszystkie boty działają na jednym komputerze, każdy na własnym ekranie.","verdict":"prawda","note":"Komputer w chmurze jest jeden na użytkownika; jeden bot prowadzi naraz jedno zadanie na swoim ekranie.","p":5,"src":[["Dokumentacja Grok Bot: FAQ","https://docs.x.ai/grok-bot/faq"]]},{"claim":"Bot zapisuje pokazane zadanie jako umiejętność.","verdict":"prawda","note":"Teach a task nagrywa proces w przeglądarce i zapisuje go jako umiejętność do powtórzenia.","p":3,"src":[["Dokumentacja Grok Bot: umiejętności i rutyny","https://docs.x.ai/grok-bot/skills-routines-and-automations"]]},{"claim":"Można ustawić, przed czym bot ma pytać o zgodę.","verdict":"prawda","note":"Reguły Ask first zawsze wywołują kartę akceptacji, np. przed wysyłaniem czy publikowaniem.","p":7,"src":[["Dokumentacja Grok Bot: akceptacje i bezpieczeństwo","https://docs.x.ai/grok-bot/approvals-security-and-privacy"]]}],"bias":"Oficjalne warsztaty producenta: pokazują wyłącznie zalety, bez kosztów i ograniczeń. Transkrypt ma luki, więc część szczegółów pominięto."},{"id":"q1IwR88mhaA","title_pl":"Jedyny poradnik Grok Bot, jakiego potrzebujesz: jak zacząć","title":"The ONLY Grok Bot Tutorial You Need 2026 - How To Use Grok Bot For Beginners","channel":"Charlie Chang","url":"https://www.youtube.com/watch?v=q1IwR88mhaA","date":"2026-09-30","duration":841,"views":433930,"transcript":"whisper","added":"2026-11-03","tags":["Technika","Sztuczna inteligencja"],"about":"Charlie Chang krok po kroku: instalacja, pierwszy bot asystent, łączenie Gmaila, uczenie zadań, rutyny, czaty grupowe i marketplace.","intro":"Charlie Chang pokazuje Grok Bot od zera: pobranie aplikacji, plan, pierwszy bot jako asystent, łączenie Gmaila i innych aplikacji, uczenie przez pokazanie, rutyny, kilka botów naraz i marketplace z gotowymi botami. To praktyczny przegląd, ale z linkami afiliacyjnymi i reklamą jego społeczności.","points":[{"t":"Instalacja i plan","d":"Aplikację pobiera się z x.ai/bot, a korzystanie wymaga płatnego planu; autor mówi, że ma Grok Plus za 100 dolarów miesięcznie. Według niego dostęp dają też niektóre plany Cursor, SuperGrok i Teams."},{"t":"Pierwszy bot: asystent","d":"Autor tworzy bota asystenta i pokazuje ustawienia: zużycie, rozliczenia i możliwość aktualizacji lub resetu komputera bota."},{"t":"Łączenie aplikacji","d":"Gmaila podłącza się w czacie albo przez Composio lub Zapier MCP. W marketplace są też Slack, Notion i menedżer haseł, przez który bot loguje się bez widzenia haseł."},{"t":"Własny ekran i nauka","d":"Każdy bot ma ekran z Chrome, a przycisk uczenia pozwala raz pokazać zadanie. Autor kazał mu szukać na Amazonie soundbarów do 500 dolarów i dostał 3 propozycje z linkami."},{"t":"Wiele botów i rutyny","d":"Obok asystenta autor ma m.in. szefa sztabu, boty do badań, finansów, newslettera i LinkedIn; boty piszą do siebie. Rutyny działają według planu, np. o 9:00 podsumowanie Slacka i maili."},{"t":"Czaty grupowe i wspólny komputer","d":"W czacie grupowym autor pyta asystenta, bota finansowego i COO o zaległe faktury. Bot finansowy może mieć dostęp do QuickBooks, a wszystkie boty dzielą jeden komputer z Linuksem."},{"t":"Marketplace","d":"Gotowe boty innych osób można zaimportować do swojego konta. Bot potrafi też za autora rozmawiać z czatami obsługi klienta."}],"conclusion":"Autor uważa Grok Bot za pracownika, który działa wolniej od człowieka, ale doprowadza zadania do końca.","factchecks":[{"claim":"Grok Bot wymaga płatnego planu.","verdict":"prawda","note":"Na The X Subscription jest w planach Premium (30 dolarów), Super (100) i Ultra (200); Free i Plus go nie mają.","p":0,"src":[["x.ai: cennik planów","https://x.ai/pricing"],["Dokumentacja Grok Bot: FAQ","https://docs.x.ai/grok-bot/faq"]]},{"claim":"Autor ma Grok Plus za 100 dolarów miesięcznie.","verdict":"fałsz","note":"Plus kosztuje 8 dolarów i nie ma Grok Bot; 100 dolarów to plan Super.","p":0,"src":[["x.ai: cennik planów","https://x.ai/pricing"]]},{"claim":"Dostęp dają też plany Cursor i SuperGrok.","verdict":"prawda","note":"Dotyczy starszych płatnych planów Cursor i Teams; można też podpiąć indywidualny SuperGrok lub X Premium+.","p":0,"src":[["Dokumentacja Grok Bot: FAQ","https://docs.x.ai/grok-bot/faq"]]},{"claim":"Wszystkie boty dzielą jeden komputer, pliki i logowania.","verdict":"prawda","note":"Komputer jest przypisany do użytkownika, a nie do bota; dokumentacja ostrzega, by nie traktować botów jako granicy bezpieczeństwa.","p":5,"src":[["Dokumentacja Grok Bot: FAQ","https://docs.x.ai/grok-bot/faq"]]},{"claim":"Bot loguje się przez menedżer haseł bez widzenia haseł.","verdict":"prawda","note":"Boty logują się danymi z Vault, menedżera haseł lub bezpiecznego formularza bez widzenia wartości.","p":2,"src":[["Dokumentacja Grok Bot: FAQ","https://docs.x.ai/grok-bot/faq"],["Dokumentacja Grok Bot: Vault","https://docs.x.ai/grok-bot/vault"]]}],"bias":"Rzetelny poradnik krok po kroku, ale autor promuje swoją darmową społeczność i linki afiliacyjne, a o kosztach i ograniczeniach mówi mało."},{"id":"yTvakY_xVJk","title_pl":"Dlaczego Rzymianie nigdy nie przekroczyli równika","title":"Why the Romans Could Never Cross the Equator","channel":"KhAnubis","url":"https://www.youtube.com/watch?v=yTvakY_xVJk","date":"2026-07-26","duration":711,"views":1143919,"transcript":"youtube","added":"2026-11-03","tags":["Historia","Geografia"],"about":"Jak starożytni wyobrażali sobie nieznany świat: strefa gorąca, ludy z Pliniusza, Rzym i Chiny oraz bariery dawnych odkrywców.","intro":"Autor tłumaczy, dlaczego granica znanego świata dla Rzymian była bardziej psychologiczna niż techniczna. Omawia teorię stref klimatycznych, wymyślone kontynenty i ludy-potwory z Pliniusza, wzajemne wyobrażenia Rzymu i Chin oraz wyprawy Hannona, Himilkona, Pyteasza i Gila Eanesa. Na koniec porównuje to z dzisiejszym patrzeniem na kosmos.","points":[{"t":"Strefa gorąca","d":"W V w. p.n.e. Parmenides podzielił Ziemię na 5 stref: 2 mroźne, 2 umiarkowane i gorącą przy równiku, gdzie nic nie przeżyje. Grecy i Rzymianie nie wiedzieli, że Sahara bywa gorętsza niż równik, a najdalej na południe znali okolice Somalii."},{"t":"Kontynenty z rozumowania","d":"Skoro na północy jest dużo lądu, na południu też musi być, dla równowagi: Rzymianie nazwali go Terra Australis Incognita. W II w. p.n.e. Krates z Mallos dodał 2 lądy na półkuli zachodniej, według autora jakby przewidując Ameryki."},{"t":"Ludy-potwory Pliniusza","d":"W Historii naturalnej (lata 70. n.e.) Pliniusz opisał Blemmiów bez głów z twarzą na piersi, psiogłowych Kynokefalów w Indiach, jednonogich Skiapodów i Astomów bez ust żywiących się zapachem, jako fakty. Herodot wcześniej umieszczał bezgłowych w Libii."},{"t":"Zniekształcone relacje","d":"Według autora część opisów to prawdziwe obserwacje zniekształcone przez głuchy telefon. Jedna z interpretacji mówi, że bezgłowi Blemmiowie to wojownicy kulący głowy za tarczami, widziani z daleka."},{"t":"Daqin, czyli Rzym oczami Chin","d":"Chińczycy nazywali Rzym Daqin (Wielkie Qin) i wyobrażali go sobie jako cnotliwe państwo z królem ustępującym w razie klęski. Autorowi przypomina to republikę z konsulami na rok."},{"t":"Gan Ying i morze szaleństwa","d":"W 97 r. n.e. poseł Gan Ying przez Azję Środkową i Partię dotarł do Tiaozhi nad wielkim morzem. Usłyszał, że przeprawa trwa 2-3 lata. Według autora Partowie to zmyślili, bo jako pośrednicy na Jedwabnym Szlaku nie chcieli bezpośredniego kontaktu Rzymu z Chinami."},{"t":"Rzymianie w Chinach w 166 r.","d":"Rzymska delegacja przypłynęła morzem przez Wietnam. Rzymskich dokumentów brak, ale chińskie kroniki wspominają posłów od Anduna: imię brzmi jak Antoninus Pius, a data wskazuje raczej na Marka Aureliusza."},{"t":"Hannon i Himilkon","d":"W V w. p.n.e. Kartagińczyk Hannon płynął wzdłuż Afryki, według badaczy do Senegalu lub Gabonu; jego \"owłosione kobiety\" dały nazwę gorylom. Himilkon popłynął na północ do Bretanii lub Brytanii za cyną, aż zatrzymały go mgły i wodorosty."},{"t":"Pyteasz i Thule","d":"Ok. 100 lat później Pyteasz z Massalii (Marsylii) dotarł za Brytanię do Thule, gdzie latem słońce prawie nie zachodzi, a morze zmienia się w \"płuco morskie\", według autora prawdopodobnie lód krupowy. Mogło to wzmacniać mit Hyperborei."},{"t":"Bariery na krańcu świata","d":"Ok. 1000 lat po Gan Yingu mnich Rabban Bar Sauma dotarł do Konstantynopola. Przylądek Bojador z rafami i wiatrami uchodził za kres żeglugi do 1434 r., gdy Gil Eanes po prostu go opłynął. Według autora wyprawy blokowały też koszty i ostrożni inwestorzy."}],"conclusion":"Eksploracja zależy od tego, kto odważy się płynąć i kto za to zapłaci; dziś tak samo patrzymy na kosmos.","factchecks":[{"claim":"Parmenides wymyślił podział Ziemi na strefy klimatyczne.","verdict":"prawda","note":"Według Strabona pierwszy był Parmenides, a teorię rozwinął Arystoteles.","p":0,"src":[["Wikipedia (ang.): strefy geograficzne - hasło \"Geographical zone\"","https://en.wikipedia.org/wiki/Geographical_zone"]]},{"claim":"Pustynie jak Sahara bywają gorętsze niż okolice równika.","verdict":"prawda","note":"Rekordy temperatur notuje się na pustyniach zwrotnikowych (Lut, Sahara, Dolina Śmierci), nie na równiku.","p":0,"src":[["Wikipedia (ang.): najwyższe temperatury na Ziemi - hasło \"Highest temperature recorded on Earth\"","https://en.wikipedia.org/wiki/Highest_temperature_recorded_on_Earth"]]},{"claim":"Krates z Mallos przewidywał dodatkowe lądy na drugiej półkuli.","verdict":"prawda","note":"Krates zbudował najstarszy znany globus z 4 masami lądu oddzielonymi oceanami.","p":1,"src":[["Wikipedia (ang.): Krates z Mallos - hasło \"Crates of Mallus\"","https://en.wikipedia.org/wiki/Crates_of_Mallus"],["Wikipedia (ang.): Terra Australis - hasło \"Terra Australis\"","https://en.wikipedia.org/wiki/Terra_Australis"]]},{"claim":"Pliniusz opisał bezgłowych Blemmiów, Kynokefalów, Skiapodów i Astomów.","verdict":"prawda","note":"Wszystkie te ludy są w Historii naturalnej (77-79 n.e.); Blemmiowie byli też realnym ludem na południe od Egiptu.","p":2,"src":[["Wikipedia (ang.): Blemmiowie - hasło \"Blemmyes\"","https://en.wikipedia.org/wiki/Blemmyes"],["Wikipedia (ang.): Astomowie - hasło \"Astomi\"","https://en.wikipedia.org/wiki/Astomi"],["Wikipedia (ang.): Historia naturalna Pliniusza - hasło \"Natural History (Pliny)\"","https://en.wikipedia.org/wiki/Natural_History_(Pliny)"]]},{"claim":"Gan Ying dotarł do Zatoki Perskiej, a Partowie go zniechęcili.","verdict":"półprawda","note":"Nie wiadomo, czy \"zachodnie morze\" to Zatoka Perska, Morze Śródziemne czy Czarne; wersja o Partach to hipoteza.","p":5,"src":[["Wikipedia (ang.): Gan Ying - hasło \"Gan Ying\"","https://en.wikipedia.org/wiki/Gan_Ying"]]},{"claim":"W 166 r. do Chin dotarli posłowie od Anduna z Daqin.","verdict":"prawda","note":"Notuje to Księga Późniejszych Hanów; Andun to Antoninus Pius lub Marek Aureliusz, rzymskich źródeł brak.","p":6,"src":[["Wikipedia (ang.): stosunki rzymsko-chińskie - hasło \"Sino-Roman relations\"","https://en.wikipedia.org/wiki/Sino-Roman_relations"]]},{"claim":"Hannon dotarł do Senegalu lub Gabonu i dał nazwę gorylom.","verdict":"półprawda","note":"Nazwa goryla pochodzi z jego relacji, ale zasięg wyprawy jest sporny: od Gabonu po samo południe Maroka.","p":7,"src":[["Wikipedia (ang.): Hannon Żeglarz - hasło \"Hanno the Navigator\"","https://en.wikipedia.org/wiki/Hanno_the_Navigator"],["Wikipedia (ang.): goryl - hasło \"Gorilla\"","https://en.wikipedia.org/wiki/Gorilla"]]},{"claim":"\"Płuco morskie\" Pyteasza to prawdopodobnie lód krupowy.","verdict":"nie da się sprawdzić","note":"Opis zna się tylko ze Strabona; badacze łączą go też z meduzami zwanymi płucami morskimi lub dryfującym lodem.","p":8,"src":[["Wikipedia (ang.): Pyteasz - hasło \"Pytheas\"","https://en.wikipedia.org/wiki/Pytheas"]]},{"claim":"Rabban Bar Sauma dotarł do Konstantynopola, a Gil Eanes opłynął Bojador w 1434 r.","verdict":"prawda","note":"Bar Sauma był w Konstantynopolu w 1287 r.; Eanes minął Bojador w 1434 r. po nieudanej próbie w 1433 r.","p":9,"src":[["Wikipedia (ang.): Rabban Bar Sauma - hasło \"Rabban Bar Sawma\"","https://en.wikipedia.org/wiki/Rabban_Bar_Sawma"],["Wikipedia (ang.): Gil Eanes - hasło \"Gil Eanes\"","https://en.wikipedia.org/wiki/Gil_Eanes"],["Wikipedia (ang.): przylądek Bojador - hasło \"Cape Bojador\"","https://en.wikipedia.org/wiki/Cape_Bojador"]]}],"bias":"Rzetelny i ostrożny film; uproszczenia przy hipotezach (Partowie, tarcze Blemmiów) i dość skrajny kontrast \"lękliwy Rzym kontra ufne Chiny\"."},{"id":"LUzZdtHhSqQ","title_pl":"Strony, których używają mądrzy ludzie, a przeciętni nigdy o nich nie słyszeli","title":"Websites Smart People Use That Average People Never Heard Of","channel":"Chill Dude Explains","url":"https://www.youtube.com/watch?v=LUzZdtHhSqQ","date":"2026-07-13","duration":669,"views":541911,"transcript":"whisper","added":"2026-11-03","tags":["Technika"],"about":"Top 10 mało znanych darmowych stron: od archiwum FBI i Shodana po mapy Wi-Fi, rejestry firm i wyszukiwarkę kodu źródłowego.","intro":"Ranking 10 stron, które według autora zna mało kto. Są wśród nich archiwum akt FBI, wyszukiwarka urządzeń w sieci Shodan, rejestry przesyłek i firm, mapa sieci Wi-Fi WiGLE, katalog narzędzi AI, mapa powiązań prac naukowych, pogoda Windy, wirtualne karty płatnicze i wyszukiwarka kodu stron. Autor mocno upraszcza i dramatyzuje.","points":[{"t":"10. FBI Vault","d":"Darmowe archiwum akt FBI (vault.fbi.gov) udostępnianych na mocy ustawy o dostępie do informacji (FOIA). Są tam akta Elvisa Presleya i Alberta Einsteina, a także memo z 1950 r. o 3 latających spodkach odzyskanych w Nowym Meksyku, w każdym 3 ciała o wzroście ok. 0,9 m."},{"t":"9. Shodan","d":"Wyszukiwarka urządzeń podłączonych do internetu: kamer, nianiek elektronicznych, sygnalizacji świetlnej, sterowników przemysłowych. Wiele działa bez hasła lub na fabrycznych ustawieniach. Według autora hakerzy weszli do sieci kasyna przez termometr akwarium i wynieśli 10 GB danych."},{"t":"8. ImportYeti","d":"Wyszukiwarka publicznych dokumentów celnych USA (konosamentów). Po nazwie firmy widać, która fabryka w Chinach czy Wietnamie robi jej produkty, z adresem, liczbą i wagą przesyłek. Można tak znaleźć dostawcę konkurencji albo odkryć, że droga marka i tania podróbka płyną z tej samej fabryki."},{"t":"7. OpenCorporates","d":"Według autora największa otwarta baza firm na świecie, z ponad 200 mln zarejestrowanych spółek. Pokazuje dane rejestrowe, dyrektorów, adresy i sieć powiązań między spółkami o tych samych dyrektorach lub adresach, np. łańcuch spółek holdingowych za lokalną restauracją."},{"t":"6. WiGLE","d":"Tworzona społecznie od 2001 r. mapa sieci Wi-Fi: wolontariusze zbierają nazwy sieci i współrzędne GPS podczas jazdy czy spacerów. Według autora baza ma ponad 1 mld unikalnych sieci, a na wigle.net często znajdziesz własny router i sieci sąsiadów."},{"t":"5. Futurepedia","d":"Stale aktualizowany katalog tysięcy narzędzi AI podzielonych na kategorie: logo, lektor z tekstu, pisanie i poprawianie kodu, stylista ze zdjęć. Pokazuje, które są darmowe, mają okres próbny i które zyskują popularność."},{"t":"4. Connected Papers","d":"Z jednej pracy naukowej buduje wizualną mapę powiązanych prac. Według autora wielkość kółka to liczba cytowań, a odległość to pokrewieństwo tematyczne. Widać prace założycielskie, najnowsze badania i głównych badaczy."},{"t":"3. Windy.com","d":"Darmowa mapa atmosfery w czasie rzeczywistym zamiast ikonki słońca i ok. 22°C w aplikacji. Pokazuje wiatr, prądy strumieniowe, huragany, fale, jakość powietrza, dym z pożarów, wyładowania i CO2; korzystają z niej piloci i żeglarze."},{"t":"2. Privacy.com","d":"Wirtualne numery kart do zakupów w sieci, osobny dla każdego sklepu i powiązany z kontem bankowym. Można ustawić limit, więc zapomniany okres próbny za 99 dolarów zostanie odrzucony, albo zrobić kartę jednorazową."},{"t":"1. PublicWWW","d":"Przeszukuje kod źródłowy milionów stron. Wklejając unikalny fragment, np. identyfikator Google Analytics, znajdziesz inne strony tej samej osoby lub grupy, nawet pod fałszywymi nazwami. Marketerzy sprawdzają tak narzędzia konkurencji, inni śledzą sieci oszukańczych stron."}],"conclusion":"Autor zapowiada podobne filmy i zachęca do subskrypcji.","factchecks":[{"claim":"Według filmu FBI uważało Elvisa za zagrożenie dla bezpieczeństwa USA.","verdict":"fałsz","note":"Te słowa pochodzą z listu obywatela do FBI z 1956 r.; Biuro nie prowadziło śledztwa w sprawie Elvisa.","p":0,"src":[["Archiwa Narodowe USA: Elvis w FBI i jego akta","https://text-message.blogs.archives.gov/2021/08/12/dont-be-cruel-elvis-presleys-visit-to-fbi-headquarters/"],["Wikipedia (ang.): akta FBI o Elvisie - hasło \"FBI files on Elvis Presley\"","https://en.wikipedia.org/wiki/FBI_files_on_Elvis_Presley"]]},{"claim":"Memo z 1950 r. o 3 spodkach z 3 ciałami jest prawdziwe.","verdict":"półprawda","note":"Dokument istnieje, ale FBI nazywa go relacją z drugiej lub trzeciej ręki, której nigdy nie sprawdzało.","p":0,"src":[["FBI Vault: memo Guya Hottela","https://vault.fbi.gov/hottel_guy"],["Wikipedia (ang.): memo Hottela i mistyfikacja z Aztec - hasło \"Hottel memo\"","https://en.wikipedia.org/wiki/Hottel_memo"]]},{"claim":"Kasyno straciło 10 GB danych przez termometr w akwarium.","verdict":"prawda","note":"Opisała to firma Darktrace w 2017 r.; dane trafiły na serwer w Finlandii. Film łączy to z Shodanem bez podstaw.","p":1,"src":[["SecurityWeek: akwarium wysłało 10 GB danych","https://www.securityweek.com/hacked-smart-fish-tank-exfiltrated-data-rare-external-destination/"]]},{"claim":"Shodan znajduje urządzenia w sieci, w tym kamery i sygnalizację.","verdict":"prawda","note":"Działa od 2009 r. i indeksuje kamery, routery i serwery; znajdowano nim m.in. sterowniki sygnalizacji.","p":1,"src":[["Wikipedia (ang.): wyszukiwarka Shodan - hasło \"Shodan (website)\"","https://en.wikipedia.org/wiki/Shodan_(website)"]]},{"claim":"ImportYeti pokazuje dokumenty celne każdej przesyłki do USA.","verdict":"półprawda","note":"Baza obejmuje setki milionów rekordów celnych, ale tylko import morski do USA, nie każdy transport.","p":2,"src":[["ImportYeti: wyszukiwarka rekordów celnych","https://www.importyeti.com/"],["Wikipedia (ang.): konosament - hasło \"Bill of lading\"","https://en.wikipedia.org/wiki/Bill_of_lading"]]},{"claim":"OpenCorporates ma dane ponad 200 mln firm.","verdict":"prawda","note":"W 2026 r. firma podaje ok. 220 mln spółek z ponad 147 jurysdykcji.","p":3,"src":[["OpenCorporates: komunikat z września 2026","https://blog.opencorporates.com/2026/09/03/opencorporates-achieves-iso-iec-277012025-certification/"],["Wikipedia (ang.): OpenCorporates - hasło \"OpenCorporates\"","https://en.wikipedia.org/wiki/OpenCorporates"]]},{"claim":"WiGLE działa od 2001 r. i ma ponad 1 mld sieci.","verdict":"prawda","note":"Pierwszą sieć dodano we wrześniu 2001 r.; statystyki WiGLE pokazują ponad 2 mld sieci Wi-Fi.","p":4,"src":[["WiGLE: statystyki bazy","https://wigle.net/stats"],["Wikipedia (ang.): WiGLE - hasło \"WiGLE\"","https://en.wikipedia.org/wiki/WiGLE"]]},{"claim":"W Connected Papers wielkość kółka to cytowania, a bliskość to podobieństwo.","verdict":"półprawda","note":"Układ opiera się na podobieństwie (współcytowania), nie na bezpośrednich cytowaniach; twórcy piszą, że to nie drzewo cytowań.","p":6,"src":[["Connected Papers: jak to działa","https://www.connectedpapers.com/about"]]},{"claim":"Privacy.com daje wirtualne karty z limitami i karty jednorazowe.","verdict":"prawda","note":"Tak działa usługa, ale tylko dla mieszkańców USA z amerykańskim kontem bankowym.","p":8,"src":[["Privacy.com: wirtualne karty","https://www.privacy.com/"]]},{"claim":"PublicWWW przeszukuje kod źródłowy stron.","verdict":"prawda","note":"Serwis szuka fragmentów w HTML, JavaScript i CSS stron.","p":9,"src":[["PublicWWW: wyszukiwarka kodu źródłowego","https://publicwww.com/"]]}],"bias":"Clickbaitowy tytuł; sensacyjne podanie akt FBI (Elvis, UFO) bez kontekstu, a narzędzia jak ImportYeti i Privacy.com działają głównie w USA."},{"id":"NxQU8EmHxiw","title_pl":"Luki w historii, których wciąż nie rozumiemy","title":"Hidden Gaps In History We Still Don’t Understand","url":"https://www.youtube.com/watch?v=NxQU8EmHxiw","date":"2026-07-10","duration":811,"views":1066775,"transcript":"youtube","added":"2026-11-03","tags":["Historia"],"about":"10 luk w historii, których według autora wciąż nie rozumiemy, od roku 536 po Sumeryjską listę królów.","intro":"Ranking 10 historycznych zagadek, których według autora wciąż nie umiemy wyjaśnić. Od roku 536, gdy mgła zasłoniła słońce, przez jezioro pełne szkieletów w Himalajach, upadek epoki brązu, rzymskie dwunastościany i miedziany zwój ze skarbami, po zamknięte japońskie grobowce, wymarłą roślinę sylfion, zaginione miasto Akad, koniec Normanów na Grenlandii i niemożliwe liczby z sumeryjskiej listy królów.","points":[{"t":"10. Najgorszy rok w historii (536)","d":"W 536 r. gęsta mgła zasłoniła słońce na 18 miesięcy, a temperatura na półkuli północnej spadła o 2,5°C; plony padły, w Chinach latem spadł śnieg. Rdzenie lodowe z Grenlandii i Antarktydy pokazują popiół wulkaniczny, ale nie wiadomo, który wulkan. W 541 r. przyszła dżuma Justyniana."},{"t":"9. Jezioro Szkieletów (Roopkund)","d":"Jezioro Roopkund na ok. 4900 m, latem z lodu wypływają kości. Odkrył je brytyjski strażnik w 1942 r. Szkielety ok. 500 osób mają takie same okrągłe pęknięcia czaszki od uderzenia z góry, więc teoria to grad wielkości piłek do krykieta. DNA pokazało dwie grupy: z Azji Południowej (ok. 800 r.) i śródziemnomorską (ok. 1800 r.)."},{"t":"8. Upadek epoki brązu","d":"Ok. 1200 r. p.n.e. w ciągu kilkudziesięciu lat upadli Mykeńczycy i Hetyci, a Egipt ledwo przetrwał; ludność Grecji spadła o ok. 75%. Trzęsienia ziemi, susza, Ludy Morza i choroby osobno nie wystarczają. Najlepsza teoria według autora to zerwanie łańcuchów dostaw (miedź z Cypru, zboże z Egiptu, drewno z Libanu)."},{"t":"7. Rzymski dwunastościan","d":"W Europie znaleziono ponad 100 pustych brązowych obiektów o 12 pięciokątnych ściankach z otworami od piłki golfowej do grejpfruta, często zakopanych z monetami. Żaden rzymski tekst, obraz ani rzeźba ich nie pokazuje. Teorie: świeczniki, przyrządy miernicze, kości do gry, narzędzia do dziergania rękawiczek."},{"t":"6. Miedziany Zwój","d":"W 1952 r. w jaskiniach nad Morzem Martwym znaleziono zwój z miedzi z listą 64 miejsc, gdzie miało być zakopane ok. 65 ton złota i srebra, dziś ponad 1 mld dolarów. Wskazówki odnoszą się do nieistniejących punktów. Może to spis skarbów świątyni ukrytych przed zburzeniem Jerozolimy w 70 r., może symbol albo żart; nic nie znaleziono."},{"t":"5. Zamknięte grobowce Kofun","d":"Japonia ma ponad 160 tys. kurhanów kofun z lat 300-700, a największy, Daisen, ma większą powierzchnię niż Wielka Piramida. Agencja Dworu Cesarskiego nie pozwala na wykopaliska \"z szacunku dla zmarłych\". Część historyków podejrzewa, że pokazałyby powiązania z Koreą lub Chinami."},{"t":"4. Sylfion","d":"Roślina rosła tylko na wąskim pasie wybrzeża dzisiejszej Libii i nie dało się jej uprawiać gdzie indziej. Rzymianie płacili za nią srebrem na wagę, a Juliusz Cezar trzymał ok. 680 kg w skarbcu. Ostatnią łodygę w I w. dostał Neron, a dokładny gatunek jest nieznany."},{"t":"3. Zaginione miasto Akad","d":"Ok. 2300 r. p.n.e. Sargon z Akadu stworzył pierwsze imperium, a jego stolica Akad jest dobrze opisana w tekstach: królowie, prawa, gospodarka. Mimo ponad 100 lat poszukiwań w Iraku i Syrii miasta nie znaleziono. Może leżeć pod Bagdadem albo zostało zmyte i zasypane mułem przez Tygrys; imperium upadło ok. 2150 r. p.n.e."},{"t":"2. Zniknięcie Normanów z Grenlandii","d":"Ok. 985 r. Eryk Rudy nazwał lodową wyspę Grenlandią, żeby przyciągnąć osadników, a w szczycie żyło tam ok. 5000 Normanów. Ostatni zapis z 1408 r. to opis ślubu, a w XVI w. Europejczycy zastali ruiny. Teoria: mała epoka lodowa, odrzucenie sposobów Inuitów, upadek rynku kości morsa i wyjazd młodych na Islandię."},{"t":"1. Sumeryjska lista królów","d":"Gliniane tabliczki sprzed ok. 4000 lat wymieniają królów Sumeru sprzed potopu z panowaniami po 43 200, 36 000 i 28 800 lat, łącznie ponad 240 tys. lat. Po potopie liczby spadają do 1200, 900, 300 i w końcu do normalnych. To był oficjalny dokument państwowy, a potop przypomina ten z Biblii i Eposu o Gilgameszu."}],"conclusion":"Nawet dobrze opisane cywilizacje mają luki, a niektóre zagadki mogą pozostać nierozwiązane na zawsze.","factchecks":[{"claim":"Rok 536: mgła zasłoniła słońce, zimno i głód.","verdict":"prawda","note":"Potwierdzają to rdzenie lodowe, słoje drzew i relacja Prokopiusza.","src":[["Wikipedia (ang.): zima wulkaniczna 536 r. - hasło \"Volcanic winter of 536\"","https://en.wikipedia.org/wiki/Volcanic_winter_of_536"],["Science: najgorszy rok w historii","https://www.science.org/content/article/why-536-was-worst-year-be-alive"]],"p":0},{"claim":"Roopkund: dwie grupy zginęły ok. 1000 lat od siebie, wszyscy od gradu.","verdict":"półprawda","note":"DNA (2019) pokazało grupy z VII-X w. i XVII-XX w., co podważa tezę o jednym gradobiciu.","src":[["Harney i in. 2019, Nature Communications","https://www.nature.com/articles/s41467-019-11357-9"],["Wikipedia (ang.): jezioro Roopkund - hasło \"Roopkund\"","https://en.wikipedia.org/wiki/Roopkund"]],"p":1},{"claim":"Upadek epoki brązu: upadły niemal wszystkie państwa naraz.","verdict":"półprawda","note":"Upadli Hetyci, Mykeny i Ugarit, ale Egipt i Asyria przetrwały osłabione.","src":[["Wikipedia (ang.): upadek epoki brązu - hasło \"Late Bronze Age collapse\"","https://en.wikipedia.org/wiki/Late_Bronze_Age_collapse"]],"p":2},{"claim":"Rzymskie dwunastościany: żaden tekst o nich nie wspomina.","verdict":"prawda","note":"Znaleziono ponad 100 egzemplarzy, głównie w północno-zachodniej części imperium; brak wzmianek w tekstach, a funkcja jest nieznana.","src":[["Wikipedia (ang.): rzymski dwunastościan - hasło \"Roman dodecahedron\"","https://en.wikipedia.org/wiki/Roman_dodecahedron"]],"p":3},{"claim":"Miedziany Zwój: 1952, 64 skrytki, niczego nie znaleziono.","verdict":"prawda","note":"Zgodne ze źródłami. Badacze spierają się, czy to realna lista skarbów Świątyni, czy folklor.","src":[["Wikipedia (ang.): Miedziany Zwój - hasło \"Copper Scroll\"","https://en.wikipedia.org/wiki/Copper_Scroll"]],"p":4},{"claim":"Kofun: ponad 160 tys. kurhanów, Daisen większy od Wielkiej Piramidy, zakaz badań.","verdict":"prawda","note":"Daisen jest większy od Wielkiej Piramidy, ale od 2018 r. dopuszczono ograniczone wykopaliska.","src":[["Wikipedia (ang.): kurhan Daisen - hasło \"Daisen Kofun\"","https://en.wikipedia.org/wiki/Daisen_Kofun"],["Wikipedia (ang.): kurhany kofun - hasło \"Kofun\"","https://en.wikipedia.org/wiki/Kofun"]],"p":5},{"claim":"Sylfion był wart srebra, a tożsamość rośliny zaginęła na zawsze.","verdict":"półprawda","note":"Anegdoty są od Pliniusza, ale w 2021 r. zaproponowano identyfikację rośliny (sporną), więc nie \"na zawsze\".","src":[["Wikipedia (ang.): sylfion - hasło \"Silphium\"","https://en.wikipedia.org/wiki/Silphium"],["Miski 2021, Plants (PMC)","https://pmc.ncbi.nlm.nih.gov/articles/PMC7825337/"]],"p":6},{"claim":"Lokalizacja Akadu jest nieznana.","verdict":"prawda","note":"Mimo wielu propozycji miasta nie zlokalizowano.","src":[["Wikipedia (ang.): miasto Akad - hasło \"Akkad (city)\"","https://en.wikipedia.org/wiki/Akkad_(city)"]],"p":7},{"claim":"Grenlandia: ostatni zapis 1408 r., 5000 osadników, odrzucili sposoby Inuitów.","verdict":"półprawda","note":"Ślub z 1408 r. się zgadza, ale osadników było ok. 2000-2500 i jedli dużo foki.","src":[["Wikipedia (ang.): osadnictwo nordyckie w Ameryce i na Grenlandii - hasło \"Norse colonization of the Americas / Greenland\"","https://en.wikipedia.org/wiki/Norse_colonization_of_North_America"],["Smithsonian: dlaczego zniknęli","https://www.smithsonianmag.com/history/why-greenland-vikings-vanished-180962119/"]],"p":8},{"claim":"Liczb panowań z Sumeryjskiej listy królów nikt nie wyjaśnił.","verdict":"półprawda","note":"Liczby to wielokrotności sar (3600) w systemie sześćdziesiątkowym; lista łączy mit z historią.","src":[["Wikipedia (ang.): Sumeryjska lista królów - hasło \"Sumerian King List\"","https://en.wikipedia.org/wiki/Sumerian_King_List"]],"p":9}],"bias":"Dobrze dobrane tematy, ale przesadza z \"nierozwiązanymi zagadkami\": dla kilku (Roopkund, sylfion, lista królów) jest postęp, który film pomija lub umniejsza.","channel":"Chill Dude Explains"},{"id":"XSl4ZTtjS7Q","title_pl":"Instynkty, z którymi walczysz codziennie, a których ewolucja zapomniała usunąć","title":"Instincts You Fight Daily That Evolution Forgot To Delete","url":"https://www.youtube.com/watch?v=XSl4ZTtjS7Q","date":"2025-05-25","duration":711,"views":1880940,"transcript":"youtube","added":"2026-11-03","tags":["Psychologia","Ewolucja"],"about":"8 odruchów i skłonności psychicznych, które według autora są pozostałością po życiu w plemionach łowców-zbieraczy i nie pasują do współczesności.","intro":"Ranking 8 odruchów, które według autora zostały nam po przodkach żyjących w plemionach i dziś często szkodzą. Są to: potrzeba drzemki, instynkt stadny, przymus odwzajemniania przysług, strach przed nieznanym, potrzeba kontroli, awersja do straty, obsesja statusu i reakcja na niesprawiedliwość. Każdy punkt ma ten sam schemat: jak pomagał przetrwać i jak przeszkadza w pracy, zakupach i internecie.","points":[{"t":"8. Potrzeba drzemki","d":"Senność o 14:00 po 8 godzinach snu albo pobudka o 3:00 to według autora dawny rytm. Przodkowie spali dwufazowo: kilka godzin, przerwa w nocy na sprawdzenie zagrożeń, jedzenie albo seks, potem znowu sen, a w upale (ok. 38°C) d
