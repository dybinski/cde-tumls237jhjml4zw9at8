rzemali w dzień. Praca od 9:00, latarnie i telefony do tego nie pasują."},{"t":"7. Instynkt stadny","d":"Gdy plemię zaczynało uciekać, kto pytał dlaczego, zostawał zjedzony, a grupa dawała jedzenie i ochronę. Dlatego mózg nagradza dopasowanie się dopaminą. Dziś przez to kupujemy akcje GameStop za radą Reddita, nosimy modne brzydkie buty i wierzymy w fałszywe newsy."},{"t":"6. Przymus odwzajemnienia","d":"Przytrzymane drzwi albo kawa od kolegi wywołują poczucie długu. U przodków dzielenie się mięsem i jagodami było warunkiem przeżycia zimy, a mózg robi nam dyskomfort, dopóki nie oddamy. Marketing to wykorzystuje: darmowa próbka w Costco kończy się słoikiem ogórków 4,5 kg, kawa u dilera skłania do zakupu auta."},{"t":"5. Strach przed nieznanym","d":"Szelest w krzakach mógł być drapieżnikiem, a nowa jagoda trucizną, więc przeżyli ostrożni. Dlatego mózg zalewa nas hormonami stresu przy nowościach. Dziś zamawiamy to samo danie od 10 lat i zostajemy w pracy, której nie znosimy."},{"t":"4. Potrzeba kontroli","d":"Wciskanie wyimaginowanego hamulca, gdy prowadzi ktoś inny, i złość, gdy plan dnia się sypie. Przeżywali ci, którzy budowali lepsze schronienia, przechowywali jedzenie i planowali polowania; mózg nagradza kontrolę dopaminą. Dziś korki, przeciągnięte spotkania czy źle załadowana zmywarka wywołują reakcję jak na zagrożenie."},{"t":"3. Awersja do straty","d":"Znalezione 100 dolarów cieszy, ale zgubione 100 dolarów boli tygodniami. Dla przodka utrata jedynej włóczni czy zapasów oznaczała śmierć, a brak dodatkowego jedzenia tylko rozczarowanie. Według autora strata boli 2 razy mocniej niż równy zysk, więc trzymamy tracące akcje, niechciane ubrania i złą pracę."},{"t":"2. Obsesja statusu","d":"W plemieniu wysoki status oznaczał lepsze jedzenie, partnerów i posłuch, a niski resztki i brak potomstwa. Dlatego mózg nagradza awans i karze spadek stresem, gdy ktoś ma lepsze auto czy ładniejszy Instagram. Dziś kupujemy rzeczy ponad stan i publikujemy podkoloryzowane życie."},{"t":"1. Potrzeba sprawiedliwości","d":"Ktoś wpycha się w kolejkę albo kradnie pomysł i budzi się wściekłość. W plemieniu ok. 30 osób chomikowanie jedzenia czy jedzenie bez polowania zagrażało wszystkim, a wykrywanie i karanie oszustów pozwalało przetrwać. Dziś ta sama reakcja dotyczy drobiazgów: dwóch darmowych próbek, faworyzowania przez szefa, wpisów w sieci."}],"conclusion":"Nasz mózg jest wciąż ustawiony na życie w małym plemieniu, a zrozumienie tego pomaga nie dawać się tym odruchom sterować.","factchecks":[{"claim":"Przodkowie spali dwufazowo (\"pierwszy i drugi sen\") przez tysiące lat.","verdict":"półprawda","note":"Ekirch opisał sen dwufazowy w dawnej Europie, ale u współczesnych łowców-zbieraczy go nie wykazano.","src":[["Wikipedia (ang.): sen dwufazowy - hasło \"Segmented sleep\"","https://en.wikipedia.org/wiki/Segmented_sleep"],["Yetish i in. 2015, Current Biology (DOI)","https://doi.org/10.1016/j.cub.2015.09.046"]],"p":0},{"claim":"Mózg nagradza konformizm (układ nagrody).","verdict":"półprawda","note":"Jedno badanie fMRI (2009) pokazało sygnał błędu przy niezgodności z grupą; \"dopamina za konformizm\" to uproszczenie.","src":[["Klucharev i in. 2009 (PubMed)","https://pubmed.ncbi.nlm.nih.gov/19146819/"],["Wikipedia (ang.): instynkt stadny - hasło \"Herd mentality\"","https://en.wikipedia.org/wiki/Herd_mentality"]],"p":1},{"claim":"Reguła wzajemności działa, a sprzedawcy używają jej przez darmowe próbki.","verdict":"prawda","note":"Klasyczny eksperyment Regana (1971) i prace Cialdiniego dobrze to dokumentują.","src":[["Wikipedia (ang.): reguła wzajemności - hasło \"Reciprocity (social psychology)\"","https://en.wikipedia.org/wiki/Reciprocity_(social_psychology)"]],"p":2},{"claim":"Strata boli ok. dwa razy mocniej niż równy zysk.","verdict":"półprawda","note":"Kahneman i Tversky podali ok. 2, ale nowsze prace pokazują, że efekt bywa dużo mniejszy.","src":[["Wikipedia (ang.): awersja do straty - hasło \"Loss aversion\"","https://en.wikipedia.org/wiki/Loss_aversion"],["Gal i Rucker 2018, krytyka (DOI)","https://doi.org/10.1002/jcpy.1047"]],"p":5},{"claim":"Poczucie sprawiedliwości jest wrodzone i ewolucyjnie stare.","verdict":"półprawda","note":"Kapucynki i ludzie odrzucają niesprawiedliwe nagrody, ale ewolucyjne wyjaśnienia to hipotezy.","src":[["Brosnan i de Waal 2003, Nature","https://www.nature.com/articles/nature01963"],["Wikipedia (ang.): gra w ultimatum - hasło \"Ultimatum game\"","https://en.wikipedia.org/wiki/Ultimatum_game"]],"p":7},{"claim":"Strach przed nieznanym, potrzeba kontroli i status jako ewolucyjne pozostałości.","verdict":"nie da się sprawdzić","note":"Zjawiska są realne, ale ewolucyjne historie \"jak było w plemieniu\" są nietestowalne.","src":[["Wikipedia (ang.): iluzja kontroli - hasło \"Illusion of control\"","https://en.wikipedia.org/wiki/Illusion_of_control"],["Wikipedia (ang.): krytyka wyjaśnień typu \"just-so story\" - hasło \"Just-so story\"","https://en.wikipedia.org/wiki/Just-so_story"]],"p":null}],"bias":"Jednostronny: każde zachowanie wyjaśnia psychologią ewolucyjną w formie \"opowieści\", bez alternatyw (kultura, uczenie się). Brak źródeł; traktuj jako ciekawostkę, nie wiedzę.","channel":"Chill Dude Explains"},{"id":"kDfP5vAbOS0","title_pl":"Całkowicie błędne fakty, w które wszyscy wciąż wierzą","title":"Totally Wrong Facts Everyone Still Believes","url":"https://www.youtube.com/watch?v=kDfP5vAbOS0","date":"2025-04-30","duration":533,"views":2837925,"transcript":"youtube","added":"2026-11-03","tags":["Mity","Ciało i zdrowie","Nauka"],"about":"Ranking 10 popularnych \"faktów\", które według autora są mitami, od cukru i hiperaktywności po połkniętą gumę.","intro":"Ranking 10 popularnych \"faktów\", które według autora są mitami. Obala m.in. nadpobudliwość dzieci po cukrze, 10% mózgu, zabójczą monetę z Empire State Building, \"piorun nie uderza dwa razy\", hełmy wikingów z rogami, gęstsze włosy po goleniu, zakaz pływania po jedzeniu, utratę połowy ciepła przez głowę, 3-sekundową pamięć złotej rybki i gumę zalegającą 7 lat w żołądku.","points":[{"t":"10. Cukier nie robi z dzieci \"tornada\"","d":"W badaniu część dzieci dostała cukier, a część słodzik, i ani dzieci, ani rodzice nie wiedzieli, kto co dostał; różnicy nie było. Za to rodzice, którzy myśleli, że dziecko zjadło cukier, widzieli nadpobudliwość. Mit według autora zaczął się w latach 70. od lekarza obwiniającego dodatki do żywności."},{"t":"9. Nie używamy tylko 10% mózgu","d":"Skanery pokazują aktywność w całym mózgu, także we śnie, gdy steruje oddechem i sercem. Mózg to 2% masy ciała, a zużywa 20% energii; ewolucja nie trzymałaby 90% bezużytecznego organu, a nawet mały uraz daje poważne skutki. Mit ma pochodzić od badacza z Harvardu z XIX w. mówiącego o niewykorzystanym potencjale."},{"t":"8. Moneta z Empire State Building nie zabije","d":"Opór powietrza sprawia, że moneta koziołkuje i po ok. 15 m osiąga prędkość graniczną ok. 40 km/h, wolniej niż przeciętny rowerzysta, więc uderzenie przypomina pstryczka. W próżni osiągnęłaby ponad 320 km/h. Autor dodaje, że groźniejszy byłby spadający długopis."},{"t":"7. Piorun uderza w to samo miejsce","d":"Empire State Building dostaje ok. 25 uderzeń rocznie, a strażnik parku Roy Sullivan przeżył 7 uderzeń. Pioruny trafiają w te same wysokie obiekty, np. samotne drzewo. Mogą też uderzyć kilometry od burzy, przy czystym niebie."},{"t":"6. Wikingowie nie nosili hełmów z rogami","d":"Rogi wymyślili XIX-wieczni kostiumolodzy operowi, bo wyglądały dramatycznie, a w walce byłyby uchwytem dla wroga. Znalezione hełmy wikingów są proste, czasem z osłoną nosa. Rogate hełmy z Danii są o 3000 lat starsze i były ceremonialne."},{"t":"5. Golenie nie zagęszcza włosów","d":"Golenie ścina włos na płasko, jak pień ścięty piłą, więc odrost wydaje się grubszy niż naturalnie zwężona końcówka. Badania od dekad nie wykazały wpływu golenia, a grubość, kolor i tempo wzrostu zależą od genów. Gdyby to działało, golenie leczyłoby łysienie, a Jeff Bezos wciąż jest łysy."},{"t":"4. Można pływać zaraz po jedzeniu","d":"Według autora nie ma ani jednego udokumentowanego utonięcia z powodu pływania po jedzeniu, choć zasady 30 minut pilnowali nawet ratownicy. Po dużym posiłku można najwyżej złapać lekki skurcz jak przy bieganiu. Pływacy jedzą podczas treningów, a Czerwony Krzyż to potwierdza."},{"t":"3. Głowa nie traci połowy ciepła","d":"Mit o 40-45% ciepła pochodzi z wojskowego podręcznika, w którego badaniu ludzie byli w pełnym stroju zimowym z odkrytą tylko głową. Głowa to ok. 10% powierzchni ciała, więc traci ok. 10% ciepła; strata zależy od odkrytej skóry. Wyjątkiem są niemowlęta i małe dzieci, bo mają proporcjonalnie większe głowy."},{"t":"2. Złota rybka ma dobrą pamięć","d":"Złote rybki rozwiązują labirynty i pamiętają rozwiązanie przez miesiące, rozpoznają twarze, uczą się sztuczek, np. przepływania przez obręcze czy \"gry w piłkę\", i rozróżniają utwory muzyczne, mając mózg mniejszy od ziarnka grochu. Badanie ich mózgu może pomóc zrozumieć ludzką pamięć."},{"t":"1. Połknięta guma nie zostaje na 7 lat","d":"Guma przechodzi przez przewód pokarmowy jak inne jedzenie, tylko się nie rozkłada, podobnie jak ziarna kukurydzy, i wychodzi w 1-2 dni. Żołądek ciągle się porusza, więc nic się nie przykleja. Problem może być tylko przy połykaniu dużych ilości."}],"conclusion":"Większość \"oczywistych\" faktów z dzieciństwa to mity, które przetrwały, bo brzmią przekonująco albo powtarzali je rodzice.","factchecks":[{"claim":"Cukier nie powoduje nadpobudliwości u dzieci; rodzice widzą ją z powodu oczekiwań.","verdict":"prawda","note":"Metaanaliza 16 ślepych badań (JAMA 1995) nie wykazała wpływu cukru na zachowanie.","src":[["JAMA 1995, Wolraich i in. (PubMed)","https://pubmed.ncbi.nlm.nih.gov/7474248/"],["Hoover i Milich 1994, J Abnorm Child Psychol","https://link.springer.com/article/10.1007/BF02168088"]],"p":0},{"claim":"Mit 10% mózgu; mózg to 2% masy i 20% energii.","verdict":"prawda","note":"Obrazowanie pokazuje aktywność całego mózgu; dane o 2% masy i 20% energii są standardowe.","src":[["Wikipedia (ang.): mit 10% mózgu - hasło \"Ten percent of the brain myth\"","https://en.wikipedia.org/wiki/Ten_percent_of_the_brain_myth"],["Scientific American: mit 10%","https://www.scientificamerican.com/article/do-people-only-use-10-percent-of-their-brains/"]],"p":1},{"claim":"Moneta osiąga prędkość graniczną ok. 40 km/h i nie zabije.","verdict":"prawda","note":"Zmierzono ok. 40-80 km/h; moneta nie przebije czaszki.","src":[["Wikipedia (ang.): lista powszechnych mitów (moneta z wieżowca) - hasło \"List of common misconceptions\"","https://en.wikipedia.org/wiki/List_of_common_misconceptions_about_science,_technology,_and_mathematics"],["Wikipedia (ang.): prędkość graniczna - hasło \"Terminal velocity\"","https://en.wikipedia.org/wiki/Terminal_velocity"]],"p":2},{"claim":"Empire State Building: ok. 25 uderzeń pioruna rocznie; Roy Sullivan przeżył 7 uderzeń.","verdict":"prawda","note":"NOAA podaje ok. 20-25 uderzeń rocznie w Empire State Building. Sullivan jest w Księdze Guinnessa jako osoba trafiona 7 razy (1942-1977).","src":[["NOAA/NWS: mity o piorunach","https://www.weather.gov/safety/lightning-myths"],["Wikipedia (ang.): Roy Sullivan","https://en.wikipedia.org/wiki/Roy_Sullivan"]],"p":3},{"claim":"Rogate hełmy z Danii są o 3000 lat starsze od wikingów.","verdict":"fałsz","note":"Hełmy z Viksø są z ok. 900 p.n.e., czyli ok. 1700 lat przed wikingami, nie 3000.","src":[["Aarhus University: datowanie hełmów z Viksø","https://cas.au.dk/en/currently/news/show/artikel/new-study-about-the-viksoe-helmets"],["Smithsonian: hełmy mają prawie 3000 lat","https://www.smithsonianmag.com/smart-news/iconic-viking-horned-helmets-actually-3000-years-old-180979339/"]],"p":4},{"claim":"Golenie nie zmienia grubości ani tempa wzrostu włosów.","verdict":"prawda","note":"Badania od lat 20. XX w. nie wykazały wpływu golenia na włosy; Mayo Clinic potwierdza.","src":[["Mayo Clinic: golenie a odrost włosów","https://www.mayoclinic.org/healthy-lifestyle/adult-health/expert-answers/hair-removal/faq-20058427"]],"p":5},{"claim":"Pływanie zaraz po jedzeniu nie jest groźne; Czerwony Krzyż to potwierdza.","verdict":"prawda","note":"Czerwony Krzyż nie znalazł dowodów na utonięcia związane z jedzeniem przed pływaniem.","src":[["Wikipedia (ang.): lista powszechnych mitów (pływanie po jedzeniu) - hasło \"List of common misconceptions\"","https://en.wikipedia.org/wiki/List_of_common_misconceptions_about_science,_technology,_and_mathematics"]],"p":6},{"claim":"Mit 40-45% ciepła tracone przez głowę pochodzi z wojskowego podręcznika; głowa to ok. 10% powierzchni.","verdict":"prawda","note":"BMJ (2008): mit pochodzi z badań armii USA; głowa to ok. 7-10% powierzchni ciała.","src":[["BMJ 2008: świąteczne mity medyczne (DOI)","https://doi.org/10.1136/bmj.a2769"]],"p":7},{"claim":"Złote rybki pamiętają przez miesiące, uczą się sztuczek i rozróżniają muzykę.","verdict":"prawda","note":"Badania pokazują pamięć trwającą miesiące i rozróżnianie muzyki u złotych rybek.","src":[["Wikipedia (ang.): złota rybka (pamięć) - hasło \"Goldfish\"","https://en.wikipedia.org/wiki/Goldfish"],["Shinozuka i in. 2013, muzyka a złote rybki (PubMed)","https://pubmed.ncbi.nlm.nih.gov/23796771/"]],"p":8},{"claim":"Połknięta guma wychodzi w 1-2 dni, nie zostaje 7 lat.","verdict":"prawda","note":"Gastroenterolodzy potwierdzają; problemy (bezoar) zdarzają się tylko przy bardzo częstym połykaniu dużych ilości, zwłaszcza u dzieci.","src":[["Scientific American: połknięta guma","https://www.scientificamerican.com/article/fact-or-fiction-chewing-gum-takes-seven-years-to-digest/"],["Mayo Clinic: połknięta guma","https://www.mayoclinic.org/healthy-lifestyle/nutrition-and-healthy-eating/expert-answers/digestion/faq-20058446"]],"p":9}],"bias":"Rzetelny, w większości zgodny z nauką. Jedyny wyraźny błąd: wiek hełmów z Viksø. Ton prześmiewczy wobec rodziców, ale bez tendencyjności.","channel":"Chill Dude Explains"},{"id":"wztjGaAiqME","title_pl":"Niewinne nawyki, które po cichu niszczą twoje ciało","title":"Innocent Habits That Are Secretly Wrecking Your Body","url":"https://www.youtube.com/watch?v=wztjGaAiqME","date":"2025-04-21","duration":733,"views":1492461,"transcript":"youtube","added":"2026-11-03","tags":["Ciało i zdrowie"],"about":"9 codziennych nawyków, które według autora po cichu szkodzą zdrowiu, od obgryzania paznokci po wstrzymywanie moczu.","intro":"Ranking 9 codziennych nawyków, które według autora po cichu szkodzą zdrowiu. Są to obgryzanie paznokci, tłumienie kichnięć, czyszczenie uszu patyczkami, picie za dużo wody, głośne słuchawki, światło w nocy, siedzenie, spanie na brzuchu i wstrzymywanie moczu. Przy każdym autor opisuje mechanizm szkody i czasem daje prostą radę, co robić zamiast tego.","points":[{"t":"9. Obgryzanie paznokci","d":"Paznokcie zbierają zarazki z klamek, telefonów i klawiatur, a obgryzanie przenosi je do ust i wyszczerbia przednie zęby. Zerwane skórki otwierają drogę do zanokcicy. Według autora obgryzacze mają więcej infekcji żołądka i jelit, a nawyk wiąże się z lękiem."},{"t":"8. Tłumienie kichnięć","d":"Kichnięcie ma osiągać do ok. 160 km/h, a zatkanie nosa i ust kieruje ciśnienie z powrotem do głowy. Przez trąbki Eustachiusza może pęknąć błona bębenkowa, mogą pękać naczynka w oczach i nosie, rzadko dochodzi do uszkodzenia gardła. Ktoś złamał małą kość twarzy i miał powietrze pod skórą."},{"t":"7. Patyczki do uszu","d":"Patyczek nie czyści, tylko wpycha woskowinę głębiej, a uszy oczyszczają się same; zbita woskowina zmniejsza słyszenie i bywa usuwana na SOR. Błona bębenkowa jest cienka jak folia spożywcza, a ranki i wilgoć sprzyjają infekcjom. Rada: myć tylko małżowinę myjką."},{"t":"6. Przewodnienie","d":"Hiponatremia: przy szybkim piciu dużej ilości wody nerki nie nadążają, sodu jest za mało i komórki, także mózgu, puchną. Skutki to ból głowy, dezorientacja, drgawki, a nawet śmierć; 9-letnia dziewczynka zmuszona do picia za karę ledwo przeżyła. Rada: pij, gdy chce ci się pić."},{"t":"5. Słuchawki","d":"Komórki rzęsate w ślimaku ucha nie odrastają. Rozmowa to ok. 60 dB, słuchawki dają 105 dB i więcej, a powyżej 85 dB słuch się uszkadza, przy 100 dB w ok. 15 minut, bez bólu. Według autora wielu nastolatków ma słuch 50-latków, a aparat słuchowy go nie przywraca."},{"t":"4. Lampki nocne","d":"Po zmroku organizm wytwarza melatoninę, a nawet słabe światło (ładowarka, latarnia, budzik) może obciąć ją o połowę. Długotrwale rozregulowuje to metabolizm: tycie bez zmiany diety i gorsze działanie insuliny. Myszy przy słabym świetle nocą tyły i miały objawy depresji; zaburzony sen wiąże się z lękiem."},{"t":"3. Krzesło","d":"Przy wielogodzinnym siedzeniu krew zalega w nogach, co zwiększa ryzyko zakrzepów, spada spalanie kalorii i aktywność enzymów rozkładających tłuszcz. Mięśnie brzucha i pleców słabną, a sylwetka się garbi. Według autora pracownik biurowy siedzi ok. 15 godzin dziennie, a część naukowców mówi \"siedzenie to nowe palenie\"."},{"t":"2. Spanie na brzuchu","d":"Żeby oddychać, trzeba skręcić szyję na bok na wiele godzin, a ciężar ciała spłaszcza naturalne krzywizny kręgosłupa. Uciskane nerwy dają mrowienie i drętwienie rąk, a z czasem przewlekły ból szyi i pleców. Rada: bardzo płaska poduszka, mała poduszka pod miednicę, a najlepiej nauka spania na plecach lub boku."},{"t":"1. Wstrzymywanie moczu","d":"Pęcherz wysyła sygnał, gdy jest w połowie pełny, a ignorowanie go rozciąga go jak gumkę, która traci sprężystość. Osłabiony nie opróżnia się do końca, a zalegający mocz sprzyja zakażeniom dróg moczowych. Pęknięcie jest rzadkie, ale z latami może osłabnąć dno miednicy i pojawić się nietrzymanie."}],"conclusion":"Drobne nawyki powtarzane codziennie sumują się w realne szkody, więc warto je korygować, zanim pojawią się objawy.","factchecks":[{"claim":"Kichnięcie osiąga ok. 160 km/h.","verdict":"fałsz","note":"Pomiar szybką kamerą (2013) dał ok. 16 km/h; 160 km/h to dawne szacunki.","src":[["Tang i in. 2013, PLOS One","https://journals.plos.org/plosone/article?id=10.1371%2Fjournal.pone.0059970"]],"p":1},{"claim":"Tłumione kichnięcie może uszkodzić gardło i uszy.","verdict":"prawda","note":"Opisano m.in. pęknięcie gardła u mężczyzny, który zatkał nos i usta (BMJ Case Reports, 2018). To jednak bardzo rzadkie przypadki.","src":[["BMJ Case Reports 2018 (PubMed)","https://pubmed.ncbi.nlm.nih.gov/29335355/"]],"p":1},{"claim":"Patyczki wpychają woskowinę i mogą uszkodzić błonę bębenkową.","verdict":"prawda","note":"Zgodne z wytycznymi otolaryngologów (AAO-HNS) i analizami urazów u dzieci.","src":[["Wikipedia (ang.): patyczki higieniczne (ryzyka) - hasło \"Cotton swab\"","https://en.wikipedia.org/wiki/Cotton_swab"],["AAO-HNS: wytyczne o woskowinie","https://www.enthealth.org/conditions/earwax-cerumen/"]],"p":2},{"claim":"Zbyt dużo wody może zabić (hiponatremia).","verdict":"prawda","note":"Zatrucie wodą jest dobrze udokumentowane; przypadku 9-latki nie udało się zweryfikować.","src":[["Wikipedia (ang.): zatrucie wodne - hasło \"Water intoxication\"","https://en.wikipedia.org/wiki/Water_intoxication"]],"p":3},{"claim":"Powyżej 85 dB grozi uszkodzenie słuchu, przy 100 dB po ok. 15 minutach; nastolatki mają słuch 50-latków.","verdict":"półprawda","note":"Progi zgadzają się z normą NIOSH, ale \"słuch 50-latków\" nie ma źródła.","src":[["CDC/NIOSH: hałas w pracy a utrata słuchu","https://www.cdc.gov/niosh/noise/about/index.html"],["WHO: głuchota i utrata słuchu","https://www.who.int/news-room/fact-sheets/detail/deafness-and-hearing-loss"]],"p":4},{"claim":"Przyćmione światło nocą tuczy myszy.","verdict":"prawda","note":"Myszy przy słabym świetle nocą tyły (PNAS 2010); u ludzi są tylko korelacje.","src":[["Fonken i in. 2010, PNAS (DOI)","https://doi.org/10.1073/pnas.1008734107"]],"p":5},{"claim":"Przeciętny pracownik biurowy siedzi do 15 godzin dziennie; \"siedzenie to nowe palenie\".","verdict":"fałsz","note":"Dorośli siedzą ok. 9-10 h dziennie, a ryzyko palenia jest wielokrotnie wyższe.","src":[["Wikipedia (ang.): siedzący tryb życia - hasło \"Sedentary lifestyle\"","https://en.wikipedia.org/wiki/Sedentary_lifestyle"],["Ekelund i in. 2016, Lancet (DOI)","https://doi.org/10.1016/S0140-6736(16)30370-1"]],"p":6},{"claim":"Obgryzacze paznokci mają istotnie więcej infekcji przewodu pokarmowego.","verdict":"nie da się sprawdzić","note":"Obgryzanie przenosi bakterie, ale brak solidnych badań o częstszych infekcjach jelitowych.","src":[["Wikipedia (ang.): obgryzanie paznokci - hasło \"Nail biting\"","https://en.wikipedia.org/wiki/Nail_biting"]],"p":0},{"claim":"Częste wstrzymywanie moczu osłabia dno miednicy i prowadzi do nietrzymania.","verdict":"półprawda","note":"Okazjonalne wstrzymywanie jest bezpieczne; szkodzi tylko wieloletnie, skrajne.","src":[["Cleveland Clinic: skutki długiego wstrzymywania moczu","https://my.clevelandclinic.org/health/diseases/22208-shy-bladder-syndrome-paruresis"],["Kettering Health: jak długo można wstrzymywać mocz","https://ketteringhealth.org/how-long-should-i-hold-my-pee/"]],"p":8}],"bias":"Straszy (\"cichy zabójca\") i podaje kilka przesadzonych liczb (kichnięcie, 15 h siedzenia). Rady są w większości sensowne, ale ryzyka są wyolbrzymione.","channel":"Chill Dude Explains"},{"id":"19UC0V9Ul2M","title_pl":"Bardzo niepokojące rzeczy, które robi twoje ciało","title":"Very CREEPY Things Your Body Does","url":"https://www.youtube.com/watch?v=19UC0V9Ul2M","date":"2025-04-07","duration":597,"views":1909931,"transcript":"youtube","added":"2026-11-03","tags":["Ciało i zdrowie","Nauka"],"about":"Ranking 10 \"przerażających\" rzeczy, które robi ludzkie ciało i mózg, od drgnięć przy zasypianiu po roztocza w rzęsach.","intro":"Ranking 10 rzeczy, które ludzkie ciało i mózg robią \"za twoimi plecami\". Autor zaczyna od drgnięć przy zasypianiu i fantomowych wibracji telefonu, przechodzi przez pasożyta Toxoplasma, paraliż senny i \"drugi mózg\" w jelitach, a kończy na roztoczach żyjących w rzęsach. Ton jest celowo straszny, a każdy punkt to krótka ciekawostka bez podanych źródeł.","points":[{"t":"10. Drgnięcia przy zasypianiu","d":"Ma to ok. 70% ludzi: gdy mięśnie się rozluźniają, mózg bierze to za spadanie i budzi nas szarpnięciem, czasem z obrazem upadku lub hukiem. Autor podaje hipotezę, że to pozostałość po spaniu na drzewach. Zmęczenie i stres to nasilają."},{"t":"9. Syndrom fantomowych wibracji","d":"Według autora zgłasza je do 90% posiadaczy telefonów. Mózg przyzwyczajony do powiadomień bierze ruch ubrania czy drgnięcie mięśnia za wibrację. Im większy lęk przed przegapieniem wiadomości, tym częściej, a zmiana kieszeni nie pomaga, bo \"wibracje\" przenoszą się w nowe miejsce."},{"t":"8. Pasożyty sterujące","d":"Toxoplasma gondii ma być u ok. 30% ludzi, a źródłem są koty. U myszy sprawia, że lubią zapach kociego moczu i idą prosto do kota. U ludzi według autora tworzy cysty w mózgu, zwiększa skłonność do ryzyka, a w rejonach z większym zarażeniem jest więcej wypadków."},{"t":"7. Paraliż senny","d":"We śnie mózg wyłącza mięśnie, żeby nie odgrywać snów; czasem umysł budzi się wcześniej niż ciało. Człowiek jest przytomny, ale nie może się ruszyć ani krzyczeć. Częste są ciemne postacie w pokoju, ucisk na klatce piersiowej i uczucie dłoni na gardle; strach według autora przedłuża paraliż."},{"t":"6. Kichanie od światła","d":"U części ludzi jasne światło wywołuje kichanie, bo sygnał z oczu \"przeskakuje\" na nerwy nosa. Kichnięcia przychodzą seriami po 2-3, wywołuje je słońce, flesz, ekran albo odblask śniegu. Autor podaje przykład pilota i kierowcy oraz to, że cecha jest dziedziczna: 50% szans, jeśli ma ją jeden z rodziców."},{"t":"5. Drugi mózg w jelitach","d":"Wokół jelit jest sieć neuronów, według autora większa niż cały mózg kota, która steruje trawieniem bez udziału głowy. \"Motyle w brzuchu\" to rozmowa dwóch mózgów. Biliony bakterii jelitowych mają produkować substancje wpływające na nastrój, a w jelitach powstaje 90% serotoniny."},{"t":"4. Mózg zjada sam siebie","d":"Autofagia to rozkładanie i trawienie własnych, starych lub uszkodzonych części komórki. Gdy pomijasz posiłki, neurony głodu według autora \"zjadają się\" mocniej i wzmacniają sygnał głodu. Autor dodaje, że zatrzymanie autofagii szkodzi."},{"t":"3. Zespół Capgrasa","d":"Mózg rozpoznaje wygląd osoby i osobno uczucia wobec niej. Gdy te części przestają się komunikować, twarz mamy jest rozpoznana, ale ciepło znika i pojawia się pewność, że to oszust, a drobna zmiana, np. fryzura, staje się \"dowodem\". Wywołać to może uraz mózgu, udar lub niektóre leki."},{"t":"2. Jamais vu","d":"Znane rzeczy nagle wydają się obce: własna twarz w lustrze, sypialnia, przyjaciel. Autor radzi napisać jedno słowo ok. 30 razy, aż litery zamienią się w dziwne kształty. Zdarza się to muzykom w trakcie grania utworu, który znają od lat."},{"t":"1. Roztocza w rzęsach","d":"Prawie każdy dorosły ma w mieszkach rzęs roztocza, które jedzą martwy naskórek i łój. W nocy wychodzą na twarz i się rozmnażają, a odchody gromadzą do śmierci i uwalniają naraz. Około 60. roku życia mają je prawie wszystkie mieszki."}],"conclusion":"Ciało i mózg robią mnóstwo dziwnych rzeczy bez naszej wiedzy, a wiele z nich to ślady dawnej ewolucji.","factchecks":[{"claim":"Drgnięcia przy zasypianiu ma ok. 70% ludzi; to pozostałość po spaniu na drzewach.","verdict":"półprawda","note":"Częstość 60-70% jest podawana w literaturze, ale wyjaśnienie z drzewami to tylko hipoteza.","src":[["Wikipedia (ang.): drgawki hipnagogiczne - hasło \"Hypnic jerk\"","https://en.wikipedia.org/wiki/Hypnic_jerk"]],"p":0},{"claim":"Fantomowe wibracje zgłasza do 90% użytkowników.","verdict":"prawda","note":"W badaniu Drouin i in. (2012) 89% studentów zgłosiło fantomowe wibracje. Inne badania dają niższe wartości, więc \"do 90%\" to górna granica.","src":[["Drouin i in. 2012 (DOI)","https://doi.org/10.1016/j.chb.2012.03.013"],["Wikipedia (ang.): syndrom fantomowych wibracji - hasło \"Phantom vibration syndrome\"","https://en.wikipedia.org/wiki/Phantom_vibration_syndrome"]],"p":1},{"claim":"Toxoplasma jest u ok. 30% ludzi i zmienia osobowość oraz zwiększa ryzyko wypadków.","verdict":"przesada","note":"Zarażenie ok. 30% ludzi i efekt u myszy są potwierdzone; u ludzi są tylko korelacje, film podaje je jak pewnik.","src":[["Wikipedia (ang.): toksoplazmoza - hasło \"Toxoplasmosis\"","https://en.wikipedia.org/wiki/Toxoplasmosis"],["CDC: toksoplazmoza","https://www.cdc.gov/toxoplasmosis/about/index.html"]],"p":2},{"claim":"Paraliż senny: świadomość przy zablokowanych mięśniach REM, halucynacje postaci, ucisk w klatce.","verdict":"prawda","note":"Opis kliniczny się zgadza; doświadcza go ok. 8% ludzi przynajmniej raz, nie \"co noc\".","src":[["Wikipedia (ang.): paraliż senny - hasło \"Sleep paralysis\"","https://en.wikipedia.org/wiki/Sleep_paralysis"],["Sharpless i Barber 2011 (PubMed)","https://pubmed.ncbi.nlm.nih.gov/21571556/"]],"p":3},{"claim":"Kichanie od światła jest dziedziczne.","verdict":"prawda","note":"Dotyczy ok. 18-35% ludzi i jest dziedziczny; mechanizm nerwowy to wiodąca hipoteza.","src":[["Wikipedia (ang.): odruch kichania na światło - hasło \"Photic sneeze reflex\"","https://en.wikipedia.org/wiki/Photic_sneeze_reflex"]],"p":4},{"claim":"W jelitach jest ok. 500 mln neuronów, więcej niż w mózgu kota.","verdict":"półprawda","note":"Szacunki to 100-600 mln neuronów; cały mózg kota ma ich więcej, więc porównanie jest mylące.","src":[["Stanford: drugi mózg w jelitach","https://neuroscience.stanford.edu/news/your-gut-second-brain"],["Liczba neuronów w jelitowym układzie nerwowym (PubMed)","https://pubmed.ncbi.nlm.nih.gov/35929768/"]],"p":5},{"claim":"Jelita produkują 90% serotoniny, co steruje nastrojem.","verdict":"przesada","note":"Ok. 90% serotoniny powstaje w jelitach, ale nie trafia do mózgu; \"sterowanie nastrojem\" to uproszczenie.","src":[["Wikipedia (ang.): serotonina - hasło \"Serotonin\"","https://en.wikipedia.org/wiki/Serotonin"],["Caltech: bakterie a serotonina jelit","https://www.caltech.edu/about/news/microbes-help-produce-serotonin-gut-46495"]],"p":5},{"claim":"Autofagia w neuronach głodu wzmacnia uczucie głodu.","verdict":"prawda","note":"Autofagia w neuronach reguluje głód (badanie na myszach, 2011); \"mózg zjada sam siebie\" to dramatyzacja.","src":[["Kaushik i in. 2011 (PubMed)","https://pubmed.ncbi.nlm.nih.gov/21803288/"],["Wikipedia (ang.): autofagia - hasło \"Autophagy\"","https://en.wikipedia.org/wiki/Autophagy"]],"p":6},{"claim":"Zespół Capgrasa i jamais vu (wywoływane wielokrotnym pisaniem słowa).","verdict":"prawda","note":"Capgras to opisane urojenie, a jamais vu wywoływano przepisywaniem słowa (Moulin, Ig Nobel 2023).","src":[["Wikipedia (ang.): zespół Capgrasa - hasło \"Capgras delusion\"","https://en.wikipedia.org/wiki/Capgras_delusion"],["Wikipedia (ang.): jamais vu","https://en.wikipedia.org/wiki/Jamais_vu"]],"p":[7,8]},{"claim":"Nużeńce nie mają odbytu i uwalniają odchody po śmierci.","verdict":"fałsz","note":"Badanie genomu z 2022 r. wykazało, że nużeńce mają odbyt; reszta opisu się zgadza.","src":[["University of Reading: sekretne życie roztoczy","https://www.reading.ac.uk/news/2022/Research-News/Secret-lives-of-skin-mites-in-our-faces"],["Smith i in. 2022, Molecular Biology and Evolution","https://doi.org/10.1093/molbev/msac125"]],"p":9}],"bias":"Sensacyjny język (\"mózg zjada sam siebie\"); korelacje podane jak pewniki, a mit o nużeńcach jest już obalony.","channel":"Chill Dude Explains"},{"id":"2sWFexuc7MI","title_pl":"Miejsca na Ziemi, gdzie nie stanął żaden człowiek","title":"Places on Earth No Human Has Ever Visited","url":"https://www.youtube.com/watch?v=2sWFexuc7MI","date":"2024-12-26","duration":600,"views":1223643,"transcript":"whisper","added":"2026-11-03","tags":["Natura","Geografia"],"about":"Ranking 10 miejsc na Ziemi, których według autora nigdy nie odwiedził żaden człowiek lub które są prawie niezbadane.","intro":"Ranking 10 miejsc na Ziemi, do których według autora człowiek nigdy nie dotarł albo dotarł tylko na brzegi. Są wśród nich góry (Gangkhar Puensum, Góry Gwiezdne), jaskinie (Kryształów, cenoty Jukatanu), głębia oceanu, pustynie Namib i Takla Makan, lód północnej Grenlandii oraz wyspa, która okazała się nie istnieć. Przy każdym miejscu autor tłumaczy, co utrudnia dotarcie.","points":[{"t":"10. Gangkhar Puensum (Bhutan)","d":"Najwyższa niezdobyta góra świata, ok. 7560 m. Od 1994 r. Bhutan zakazuje wspinaczki, bo góry uważa się za siedziby duchów. Według autora wyprawy z lat 80. nie mogły nawet znaleźć góry przez złe mapy."},{"t":"9. Jaskinia Kryształów (Meksyk)","d":"Jaskinia pod Meksykiem z kryształami wielkości autobusów szkolnych, w środku ok. 58°C, prawie 100% wilgotności i siarkowodór. Naukowcy wchodzą na ok. 10 minut w kombinezonach chłodzących. Kryształy rosły setki tysięcy lat, a znaleziono w nich uśpione mikroby."},{"t":"8. Podwodne jaskinie Jukatanu","d":"Tysiące połączonych podwodnych jaskiń (cenotów) pod Meksykiem, w większości niezbadanych: są ciemne, ciasne, ciągną się kilometrami i leżą w odległej dżungli. Majowie uważali je za bramy do zaświatów; znaleziono w nich ceramikę, biżuterię i ludzkie kości. Żyją tam ryby bez oczu."},{"t":"7. Góry Gwiezdne (Papua-Nowa Gwinea)","d":"Według autora żaden człowiek nie postawił tam stopy. To ściany wapiennych klifów w gęstym lesie deszczowym, daleko od dróg, z ciągłym deszczem i pijawkami. Jest tam ogromny klif Hindenburg Wall, na który nikt się nie wspiął; nawet okoliczne plemiona nie zbadały części terenu."},{"t":"6. Rów Nowych Hebrydów","d":"Rów na południowym Pacyfiku między Vanuatu a Nową Kaledonią, ok. 7200 m głębokości, \"Everest by się w nim zmieścił\". Ciśnienie zgniotłoby człowieka jak puszkę, więc schodziły tam tylko roboty z kamerami i sfilmowały dziwne ryby. Warunki mają przypominać te na księżycach Jowisza."},{"t":"5. Tsingy de Bemaraha (Madagaskar)","d":"Park Tsingy de Bemaraha to las ostrych wapiennych iglic; nazwa ma znaczyć \"gdzie nie można chodzić boso\". Iglice przecinają buty, bywają wysokie jak 5-piętrowy budynek i stoją tak ciasno, że nie da się między nimi przejść. Zbadano tylko brzegi, na linach; żyją tam gatunki niespotykane gdzie indziej."},{"t":"4. Serce pustyni Namib","d":"Morze wydm Namib zajmuje obszar wielkości stanu Maryland, a część wydm jest wyższa od Empire State Building. Wydmy ciągle się przesuwają, więc mapy szybko się dezaktualizują. W dzień piasek może stopić buty, w nocy jest mróz, nie ma wody ani dróg, a wnętrze chroni UNESCO."},{"t":"3. Sandy Island","d":"Wyspa między Australią a Nową Kaledonią była na mapach przez setki lat, także w Google Maps; James Cook miał ją opisać w XVIII w. W 2012 r. australijscy naukowcy popłynęli w to miejsce i znaleźli otwarte morze. Możliwe wyjaśnienia: zatonęła, błąd kopiowany na mapach albo dryfujący pumeks."},{"t":"2. Północna Grenlandia","d":"Ludzie od tysięcy lat żyją na wybrzeżach, ale środek północnej Grenlandii jest nietknięty. Lądolód pokrywa ok. 80% wyspy i miejscami ma ponad 1,6 km grubości; do tego silny wiatr i miesiące ciemności. Pod lodem mogą być góry, doliny i jeziora z mikroorganizmami, a topnienie odsłania nowe wyspy."},{"t":"1. Pustynia Takla Makan (Chiny)","d":"\"Pustynia śmierci\", większa od Wielkiej Brytanii, bez wody i otoczona wysokimi górami; według autora w jej środku nie był żaden człowiek. Nazwa ma znaczyć \"miejsce, z którego się nie wraca\". Jedwabny Szlak szedł tylko brzegami, a pod piaskiem mogą być zaginione miasta."}],"conclusion":"Mimo satelitów i GPS wciąż są miejsca, do których człowiek nie dotarł, głównie przez zakazy, ekstremalne warunki albo zwykłe trudności w dojściu.","factchecks":[{"claim":"Gangkhar Puensum to najwyższa niezdobyta góra; wspinaczka zakazana, a wyprawy nie mogły jej znaleźć.","verdict":"prawda","note":"Szczyt ma 7570 m, a wspinaczka jest zakazana od 2003 r.; wyprawy z lat 80. się nie powiodły.","src":[["Wikipedia (ang.): Gangkhar Puensum","https://en.wikipedia.org/wiki/Gangkhar_Puensum"]],"p":0},{"claim":"Jaskinia Kryształów: 58°C, prawie 100% wilgotności, toksyczne powietrze, wizyty ok. 10 minut.","verdict":"półprawda","note":"Upał, wilgotność i mikroby się zgadzają; głównym zagrożeniem jest upał, nie toksyczne gazy.","src":[["Wikipedia (ang.): Jaskinia Kryształów (Naica) - hasło \"Cave of the Crystals\"","https://en.wikipedia.org/wiki/Cave_of_the_Crystals"],["National Geographic: mikroby z Naica","https://www.nationalgeographic.com/science/article/crystal-caves-mine-microbes-mexico-boston-aaas-aliens-science"]],"p":1},{"claim":"Cenoty Jukatanu: tysiące połączonych jaskiń, ślepe ryby, ofiary Majów.","verdict":"prawda","note":"Sac Actun ma ponad 370 km korytarzy, ale to popularne miejsce nurkowe, a nie \"nieodwiedzone\".","src":[["Wikipedia (ang.): system jaskiń Sac Actun - hasło \"Sistema Sac Actun\"","https://en.wikipedia.org/wiki/Sistema_Sac_Actun"],["Wikipedia (ang.): cenoty - hasło \"Cenote\"","https://en.wikipedia.org/wiki/Cenote"]],"p":2},{"claim":"W Góry Gwiezdne nigdy nie wszedł żaden człowiek.","verdict":"fałsz","note":"Mieszkają tam ludy Min, działa kopalnia Ok Tedi i miasto Tabubil.","src":[["Wikipedia (ang.): Góry Gwiezdne - hasło \"Star Mountains\"","https://en.wikipedia.org/wiki/Star_Mountains"],["Wikipedia (ang.): kopalnia Ok Tedi - hasło \"Ok Tedi Mine\"","https://en.wikipedia.org/wiki/Ok_Tedi_Mine"]],"p":3},{"claim":"Rów Nowych Hebrydów: Everest by się w nim zmieścił; nikt tam nie był, były tylko roboty.","verdict":"fałsz","note":"Rów ma ok. 7,8 km, a Everest 8,85 km, więc szczyt by wystawał; na dno zszedł Victor Vescovo w 2021 r.","src":[["Wikipedia (ang.): Rów Nowych Hebrydów - hasło \"New Hebrides Trench\"","https://en.wikipedia.org/wiki/New_Hebrides_Trench"],["Guinness: najwięcej odwiedzonych rowów","https://www.guinnessworldrecords.com/world-records/752796-most-deep-sea-trenches-visited-by-an-individual"]],"p":4},{"claim":"Tsingy: nazwa znaczy \"gdzie nie można chodzić boso\"; wnętrze nietknięte.","verdict":"półprawda","note":"Tłumaczenie nazwy się zgadza, ale park ma szlaki dla turystów i jest badany.","src":[["Wikipedia (ang.): Tsingy de Bemaraha","https://en.wikipedia.org/wiki/Tsingy_de_Bemaraha_Strict_Nature_Reserve"],["UNESCO: suche lasy Andrefana (dawniej Tsingy de Bemaraha)","https://whc.unesco.org/en/list/494/"]],"p":5},{"claim":"Namib: wydmy wyższe od Empire State Building, obszar wielkości Maryland, wnętrza nigdy nie odwiedzono.","verdict":"przesada","note":"Wielkość i wydmy (do ok. 380 m) się zgadzają, ale okolice Sossusvlei to masowa turystyka.","src":[["UNESCO: Morze Piasku Namib","https://whc.unesco.org/en/list/1430/"],["Wikipedia (ang.): pustynia Namib - hasło \"Namib\"","https://en.wikipedia.org/wiki/Namib"]],"p":6},{"claim":"Sandy Island: \"odkrytą\" przez Jamesa Cooka wyspę obalili Australijczycy w 2012.","verdict":"półprawda","note":"W 2012 r. potwierdzono, że wyspy nie ma, ale pierwszy zapis jest z 1876 r., nie od Cooka.","src":[["Wikipedia (ang.): Sandy Island (Nowa Kaledonia) - hasło \"Sandy Island (New Caledonia)\"","https://en.wikipedia.org/wiki/Sandy_Island,_New_Caledonia"]],"p":7},{"claim":"Lądolód pokrywa ok. 80% Grenlandii, a wnętrze północnej Grenlandii jest nietknięte przez człowieka.","verdict":"półprawda","note":"Lądolód pokrywa ok. 80% wyspy, ale w głębi działały stacje wiertnicze i wiele razy go przekraczano.","src":[["Wikipedia (ang.): lądolód grenlandzki - hasło \"Greenland ice sheet\"","https://en.wikipedia.org/wiki/Greenland_ice_sheet"],["Wikipedia (ang.): odwiert lodowy NorthGRIP - hasło \"NorthGRIP\"","https://en.wikipedia.org/wiki/North_Greenland_Ice_Core_Project"]],"p":8},{"claim":"Takla Makan: większa od Wielkiej Brytanii, w środku nie było człowieka, nazwa znaczy \"miejsce bez powrotu\".","verdict":"fałsz","note":"Jest większa od Wielkiej Brytanii, ale biegnie przez nią autostrada, a pogrzebane miasta odkopano 100 lat temu.","src":[["Wikipedia (ang.): pustynia Takla Makan - hasło \"Taklamakan Desert\"","https://en.wikipedia.org/wiki/Taklamakan_Desert"],["Wikipedia (ang.): autostrada przez pustynię Tarym - hasło \"Tarim Desert Highway\"","https://en.wikipedia.org/wiki/Tarim_Desert_Highway"]],"p":9}],"bias":"Tytuł wprowadza w błąd: większość miejsc była odwiedzana; uczciwiej byłoby \"miejsca słabo zbadane\". Transkrypt z Whisper.","channel":"Chill Dude Explains"},{"id":"7bOQ7fLCqgI","title_pl":"9 części ciała, które kiedyś znikną","title":"9 Body Parts That Will Disappear One Day","url":"https://www.youtube.com/watch?v=7bOQ7fLCqgI","date":"2024-04-27","duration":528,"views":1188491,"transcript":"youtube","added":"2026-11-03","tags":["Ciało i zdrowie","Ewolucja"],"about":"9 szczątkowych części ciała, które według autora mogą kiedyś zniknąć w wyniku ewolucji.","intro":"Ranking 9 części ciała, które według autora ewolucja powoli \"wygasza\", bo przestały być potrzebne. Są tu wyrostek robaczkowy, palce u stóp, narząd Jacobsona, mięśnie od gęsiej skórki, kość ogonowa, mięsień dłoniowy długi, zęby mądrości, mięśnie uszu i zatoki. Autor przy każdej tłumaczy, do czego służyła przodkom i dlaczego dziś ma znikać.","points":[{"t":"9. Wyrostek robaczkowy","d":"Mógł pomagać przodkom trawić twarde rośliny, a przy dzisiejszej diecie według autora nic nie robi. Gdy się zapali, lekarze go usuwają i da się normalnie żyć. Autor twierdzi, że w niektórych populacjach nawet 1 na 5 osób rodzi się bez wyrostka."},{"t":"8. Palce u stóp","d":"Przodkowie potrzebowali chwytnych palców do wspinaczki. Dziś większość pracy przy chodzeniu i bieganiu robi duży palec, a buty sprawiają, że małe palce \"leniwieją\". Naukowcy mają przewidywać, że w bardzo dalekiej przyszłości palce się skrócą, ale nie za naszego życia."},{"t":"7. Narząd Jacobsona","d":"Narząd w nosie do wykrywania feromonów, u ludzi według autora praktycznie nieczynny, jak gadżet z wyczerpaną baterią. Przodkom mógł sygnalizować płodność albo złość, ale zaczęliśmy polegać na wzroku i słuchu. Część ludzi rodzi się bez niego i nie ma z tym problemu."},{"t":"6. Mięśnie przywłosowe","d":"To one robią gęsią skórkę. U owłosionych przodków stroszyły futro, żeby wyglądać groźniej, np. przed tygrysem szablozębnym. Według autora słabną i stają się rzadsze, więc kiedyś gęsia skórka może być ciekawostką z podręcznika."},{"t":"5. Kość ogonowa","d":"Pozostałość ogona przodków, którzy używali go do równowagi i komunikacji. Nie jest całkiem bezużyteczna, bo przyczepiają się do niej mięśnie i więzadła. Bardzo rzadko dzieci rodzą się z małym ogonkiem bez kości (tylko tkanka i naczynia), który zwykle usuwa się po porodzie."},{"t":"4. Mięsień dłoniowy długi","d":"Pomaga zginać nadgarstek, ale tę pracę i tak wykonują inne mięśnie, a według autora nie ma go ok. 14% ludzi. Przodkom mógł się przydawać przy przeskakiwaniu z drzewa na drzewo. Chirurdzy pobierają jego ścięgno do przeszczepów bez szkody dla ręki."},{"t":"3. Zęby mądrości","d":"Wyrastają w wieku ok. 17-25 lat, gdy w szczęce nie ma już miejsca, więc przesuwają inne zęby. Przodkowie potrzebowali zapasowych zębów do surowego jedzenia i szybko tracili zęby. Gotujemy i kroimy jedzenie, szczęki się zmniejszyły, a coraz więcej ludzi rodzi się bez ósemek."},{"t":"2. Mięśnie uszu","d":"Dzięki nim niektórzy ruszają uszami, ale większość nie umie ich używać. Przodkom mogły pomagać namierzać dźwięki, potem zaczęliśmy polegać na wzroku. Autor wspomina rekord: mężczyzna z Indii poruszył uszami 99 razy w 30 sekund."},{"t":"1. Zatoki","d":"Nie wiadomo do końca, po co są: hipotezy to nawilżanie powietrza, odciążenie czaszki i śluz łapiący zarazki. Według autora część badaczy uważa, że powoli zanikają, a jedno badanie wiązało mniejsze zatoki z rzadszymi infekcjami. Ewentualne zniknięcie trwałoby tysiące lat."}],"conclusion":"Ciało nosi ślady ewolucji, a niektóre z tych części mogą zniknąć, ale zajmie to tysiące lat.","factchecks":[{"claim":"Wyrostek robaczkowy jest bezużyteczny.","verdict":"półprawda","note":"Nowsze badania wskazują na rolę odpornościową wyrostka, co przeczy prostej tezie o szczątkowości.","src":[["Wikipedia (ang.): wyrostek robaczkowy - hasło \"Appendix (anatomy)\"","https://en.wikipedia.org/wiki/Appendix_(anatomy)"],["Smith i in. 2023, Anat Rec: przegląd funkcji i ewolucji wyrostka (PubMed)","https://pubmed.ncbi.nlm.nih.gov/35363436/"],["Smith i in. 2009, J Evol Biol (PubMed)","https://pubmed.ncbi.nlm.nih.gov/19678866/"]],"p":0},{"claim":"Coraz więcej ludzi rodzi się bez wyrostka (nawet 1 na 5).","verdict":"fałsz","note":"Wrodzony brak wyrostka to skrajna rzadkość, szacowana na ok. 1 na 100 000 operacji brzucha.","src":[["Opis przypadku agenezji wyrostka (PMC)","https://pmc.ncbi.nlm.nih.gov/articles/PMC8043782/"]],"p":0},{"claim":"Część ludzi nie ma mięśnia dłoniowego długiego.","verdict":"prawda","note":"Brak występuje u ok. 10-15% ludzi, z dużymi różnicami między populacjami.","src":[["Wikipedia (ang.): mięsień dłoniowy długi - hasło \"Palmaris longus\"","https://en.wikipedia.org/wiki/Palmaris_longus_muscle"]],"p":5},{"claim":"U części ludzi zęby mądrości się nie rozwijają.","verdict":"prawda","note":"Metaanaliza Cartera i Worthingtona (2015) daje ok. 22% osób z brakiem co najmniej jednego zęba mądrości.","src":[["Carter i Worthington 2015, J Dent Res (DOI)","https://doi.org/10.1177/0022034515581644"],["Wikipedia (ang.): zęby mądrości - hasło \"Wisdom tooth\"","https://en.wikipedia.org/wiki/Wisdom_tooth"]],"p":6},{"claim":"Narząd Jacobsona, kość ogonowa, mięśnie przywłosowe i uszne to struktury szczątkowe.","verdict":"prawda","note":"Standardowe przykłady w biologii. Narząd lemieszowo-nosowy u dorosłych ludzi nie ma działających połączeń nerwowych.","src":[["Wikipedia (ang.): narządy szczątkowe u człowieka - hasło \"Human vestigiality\"","https://en.wikipedia.org/wiki/Human_vestigiality"],["Wikipedia (ang.): narząd lemieszowo-nosowy (Jacobsona) - hasło \"Vomeronasal organ\"","https://en.wikipedia.org/wiki/Vomeronasal_organ"]],"p":null},{"claim":"Te części ciała \"znikną kiedyś\".","verdict":"nie da się sprawdzić","note":"Ewolucja nie usuwa zbędnych części sama; potrzebna jest presja selekcyjna, więc to spekulacja.","src":[["Wikipedia (ang.): szczątkowość narządów - hasło \"Vestigiality\"","https://en.wikipedia.org/wiki/Vestigiality"]],"p":null}],"bias":"Uproszczona wizja ewolucji jako \"usuwania zbędnych części\". Jedna liczba (brak wyrostka) jest wyssana z palca, a wyrostek opisany według przestarzałej wiedzy.","channel":"Chill Dude Explains"},{"id":"UTz2Xg4oMxs","title_pl":"9 najbardziej bolesnych rzeczy, jakich można doświadczyć","title":"9 MOST PAINFUL Things You Can EVER Experience!","url":"https://www.youtube.com/watch?v=UTz2Xg4oMxs","date":"2024-04-07","duration":548,"views":1114282,"transcript":"youtube","added":"2026-11-03","tags":["Ciało i zdrowie","Natura"],"about":"Ranking 9 najbardziej bolesnych doświadczeń, od kamieni nerkowych po użądlenie mrówki-pocisku.","intro":"Ranking 9 najboleśniejszych doświadczeń, jakie może przeżyć człowiek. Autor zaczyna od kamienia nerkowego i chorób (tężec, klasterowe bóle głowy, fibromialgia), a potem przechodzi do zwierząt i roślin: meduzy Irukandji, ryby kamień, rośliny gympie-gympie, osy \"kat\" i mrówki-pocisku. Opisy są obrazowe i żartobliwe, bez podanych źródeł.","points":[{"t":"9. Kamień nerkowy","d":"Zaczyna się od ostrego bólu w plecach, który przesuwa się, gdy kamień wędruje z nerki do pęcherza. Ból narasta jak dźganie nożem od środka, a jedyne wyjście to czekać, aż kamień przejdzie. Niektórzy porównują to do porodu."},{"t":"8. Meduza Irukandji","d":"Meduza mieści się na paznokciu. 20-30 minut po ukłuciu pojawia się ból pleców i brzucha, skurcze mięśni i poczucie nadchodzącej śmierci, przez które poparzeni według autora błagają lekarzy, żeby ich zabili. Autor twierdzi, że spotyka się je od Hawajów po Florydę."},{"t":"7. Tężec","d":"Bakteryjne zakażenie układu nerwowego zaczyna się od skaleczenia, np. zardzewiałym narzędziem albo gwoździem. Po kilku dniach mięśnie sztywnieją, najpierw szczęka (stąd \"szczękościsk\"), potem szyja, ręce i nogi, a skurcze są bardzo bolesne. Autor zaleca aktualne szczepienie."},{"t":"6. Klasterowe bóle głowy","d":"Ból opisywany jak rozgrzany pręt wbijany w oko albo piła w czaszce, według autora ok. 100 razy gorszy od zwykłego bólu głowy. Ataki przychodzą codziennie przez tygodnie lub miesiące, potem znikają i wracają. W trakcie ludzie chodzą w kółko, uderzają głową o ścianę albo krzyczą."},{"t":"5. Ryba kamień (skorpena)","d":"Ryba kamień ukrywa się wśród skał i koralowców tak dobrze, że można na nią patrzeć i jej nie zauważyć. Nadepnięcie wstrzykuje jad, a ból opisywany jest jak jednoczesne miażdżenie, palenie i porażenie prądem. Niektórzy według autora prosili lekarzy o amputację nogi."},{"t":"4. Fibromialgia","d":"Przewlekła choroba z bólem w całym ciele, zmęczeniem mimo snu, nadwrażliwością na dotyk i mgłą mózgową; chorzy opisują ją jak oparzenie słoneczne całego ciała. Jest niewidoczna, więc chorych bierze się za przewrażliwionych. Według autora nie ma lekarstwa."},{"t":"3. Gympie-gympie","d":"Australijska roślina pokryta pustymi włoskami z silną neurotoksyną; przy otarciu włoski się łamią i wstrzykują ją w skórę. Ból jak użądlenie przez rój os trwa dni, tygodnie albo miesiące, a niektórzy czuli go nawet do 2 lat."},{"t":"2. Osa \"Kat\" (executioner wasp)","d":"Osa z Ameryki Środkowej i Południowej, według autora wielkości małego ptaka, do ok. 5 cm. Jej jad z neurotoksyną daje natychmiastowy ból na godziny, porównywany do uderzenia pociągu, potem gorączkę, poty, nudności i wymioty. To parazytoid: paraliżuje owady i składa w nich jaja."},{"t":"1. Mrówka-pocisk","d":"Nazwa od tego, że użądlenie ma przypominać postrzał; jad bywa nazywany najboleśniejszym na świecie, jak wyrywanie kości przez skórę, a ból trwa do 24 h. W plemieniu w Brazylii młodzi mężczyźni noszą rękawice pełne mrówek przez 10 minut, 20 razy w ciągu kilku miesięcy."}],"conclusion":"Natura i własne ciało potrafią zadać ból wykraczający poza wyobrażenie, a najgorsze w rankingu są użądlenia owadów.","factchecks":[{"claim":"Osa Polistes carnifex ma jad z poneratoksyną, jest wielkości małego ptaka i składa jaja w innych owadach.","verdict":"fałsz","note":"Poneratoksyna to toksyna mrówki-pocisku; ta osa ma do ok. 3,3 cm i nie pasożytuje.","src":[["Wikipedia (ang.): osa Polistes carnifex - hasło \"Polistes carnifex\"","https://en.wikipedia.org/wiki/Polistes_carnifex"],["Wikipedia (ang.): poneratoksyna - hasło \"Poneratoxin\"","https://en.wikipedia.org/wiki/Poneratoxin"]],"p":7},{"claim":"Mrówka-pocisk: ból do 24 h; rytuał rękawic 10 minut, 20 razy.","verdict":"prawda","note":"Najwyższa ocena (4+) w skali bólu Schmidta, ból do 24 h. Rytuał ludu Sateré-Mawé jest dobrze opisany.","src":[["Wikipedia (ang.): mrówka-pocisk - hasło \"Paraponera clavata\"","https://en.wikipedia.org/wiki/Paraponera_clavata"],["Wikipedia (ang.): skala bólu użądleń Schmidta - hasło \"Schmidt sting pain index\"","https://en.wikipedia.org/wiki/Schmidt_sting_pain_index"]],"p":8},{"claim":"Meduza Irukandji występuje od Hawajów po Florydę.","verdict":"półprawda","note":"Carukia barnesi żyje w Australii; na Hawajach i Florydzie podobny syndrom dają inne gatunki.","src":[["Wikipedia (ang.): zespół Irukandji - hasło \"Irukandji syndrome\"","https://en.wikipedia.org/wiki/Irukandji_syndrome"],["Wikipedia (ang.): meduza Carukia barnesi - hasło \"Carukia barnesi\"","https://en.wikipedia.org/wiki/Carukia_barnesi"]],"p":1},{"claim":"Gympie-gympie: ból może trwać miesiące.","verdict":"prawda","note":"Opisy przypadków i badanie toksyn (gympietydy, Science Advances 2020) potwierdzają długotrwały ból, ale relacje o latach są anegdotyczne.","src":[["Wikipedia (ang.): gympie-gympie (Dendrocnide moroides) - hasło \"Dendrocnide moroides\"","https://en.wikipedia.org/wiki/Dendrocnide_moroides"],["Gilding i in. 2020, Science Advances (DOI)","https://doi.org/10.1126/sciadv.abb8828"]],"p":6},{"claim":"Ryba kamień to najbardziej jadowita ryba świata.","verdict":"prawda","note":"Tak się ją powszechnie określa; istnieje antytoksyna, a zgony są rzadkie.","src":[["Wikipedia (ang.): ryby kamienne (Synanceia) - hasło \"Stonefish\"","https://en.wikipedia.org/wiki/Stonefish"]],"p":4},{"claim":"Kamienie nerkowe, klasterowe bóle głowy, tężec, fibromialgia bez lekarstwa.","verdict":"prawda","note":"Opisy zgodne z wiedzą medyczną. Fibromialgii nie da się wyleczyć, ale objawy łagodzi leczenie i ruch.","src":[["Wikipedia (ang.): klasterowy ból głowy - hasło \"Cluster headache\"","https://en.wikipedia.org/wiki/Cluster_headache"],["Wikipedia (ang.): fibromialgia - hasło \"Fibromyalgia\"","https://en.wikipedia.org/wiki/Fibromyalgia"],["WHO: tężec","https://www.who.int/news-room/fact-sheets/detail/tetanus"]],"p":null}],"bias":"Ranking subiektywny (bólu nie da się obiektywnie porównać). Punkt o osie-katu jest w dużej mierze zmyślony; reszta zgodna z faktami.","channel":"Chill Dude Explains"},{"id":"ziYuxvxAw3U","title_pl":"9 najstarszych technologii, których naukowcy wciąż nie potrafią wyjaśnić","title":"9 Oldest Technologies Scientists Still Can’t Explain","url":"https://www.youtube.com/watch?v=ziYuxvxAw3U","date":"2024-03-10","duration":561,"views":1051283,"transcript":"youtube","added":"2026-11-03","tags":["Historia","Technika"],"about":"9 starożytnych technologii, których według autora naukowcy wciąż nie potrafią wyjaśnić ani odtworzyć.","intro":"Ranking 9 dawnych wynalazków i budowli, których według autora wciąż nie umiemy wyjaśnić ani odtworzyć. Są wśród nich rzymski puchar zmieniający kolor, elastyczne szkło i ogień grecki, skrzypce Stradivariego, mechanizm z Antykithiry, stal damasceńska, kamienne kule z Kostaryki, mury Sacsayhuamán w Peru i piramidy w Gizie. Autor często przedstawia legendy i domysły jako pewną historię.","points":[{"t":"9. Puchar Likurga","d":"Rzymski puchar z IV w.: pod światło świeci na czerwono, oglądany z przodu jest zielony. Rzymianie dodali do szkła niewidoczne cząstki złota i srebra, które zmieniają kolor zależnie od kierunku światła. Naukowcy według autora sądzą, że wyszło to przypadkiem, a odtworzyć to umiemy dopiero od niedawna."},{"t":"8. Rzymskie elastyczne szkło","d":"Legenda: wynalazca pokazał cesarzowi Tyberiuszowi miskę ze szkła, która po upuszczeniu tylko się wgniotła, a wgniecenie wyklepał młotkiem. Cesarz bał się spadku wartości złota i srebra, więc kazał go zabić. Autor przyznaje, że nie wiadomo, czy to prawda, a sekret zaginął z wynalazcą."},{"t":"7. Ogień grecki","d":"Mieszanina, która paliła się nawet na wodzie, a polewanie wodą miało ją wzmagać. Według autora używali jej Rzymianie: rzucali granaty z ogniem i pryskali nim z rur na wrogie statki. Przepis był tajemnicą państwową; historycy zgadują żywicę sosnową, wapno palone i inne składniki."},{"t":"6. Skrzypce Stradivariego","d":"Rodzina Stradivarich we Włoszech robiła skrzypce w latach 1650-1750. Mimo badań nikt nie umie dokładnie wyjaśnić ich brzmienia ani go odtworzyć; rodzina używała specjalnego drewna i tajnego przepisu. Kosztują miliony dolarów, kupuje się je jako inwestycję, a część skradziono i zaginęła."},{"t":"5. Mechanizm z Antykithiry","d":"Ok. 100 lat temu nurkowie znaleźli przy greckiej wyspie Antykithira wrak z bryłą brązu i drewna, według autora pierwszym analogowym komputerem. Przewidywał zaćmienia, prowadził kalendarz i wskazywał termin igrzysk. Coś równie złożonego pojawia się dopiero ok. 1200 lat później."},{"t":"4. Stal damasceńska","d":"Krzyżowcy spotkali u wojowników islamskich miecze, które przecinały pływającą chustkę, wyginały się pod dużym kątem i wracały bez szkody, z wzorem jak płynąca woda. Według autora sekret zaginął; naukowcy podejrzewają dodatek roślin do żelaza. Stal sprzedawano w Damaszku, ale pochodziła z Indii i Iranu."},{"t":"3. Kamienne kule z Kostaryki","d":"Ponad 300 kamiennych kul, niektóre do 15 ton i ponad 2 m średnicy, zrobiła nieistniejąca już kultura Diquís, obijając je kamieniami i polerując piaskiem. Cel nieznany: drogowskazy do domu wodza albo astronomia. W latach 30. XX w. przy karczowaniu pod banany część rozbito, szukając złota."},{"t":"2. Sacsayhuamán (Peru)","d":"Inkaska twierdza chroniąca Cusco, z polerowanych bloków po 100-120 ton dopasowanych tak, że nie wejdzie między nie kartka papieru. Autor odrzuca teorie o ogromnej soczewce i topieniu kamienia ogniskiem. Twierdza przetrwała trzęsienia ziemi, ale Hiszpanie rozbierali ją na materiał do budowy Cusco."},{"t":"1. Piramidy w Gizie","d":"Wielka Piramida to ok. 2,3 mln bloków, od kilku ton do wagi małego domu, a Egipcjanie nie mieli dźwigów ani taczek. Teorie: proste albo zygzakowate rampy, spławianie kamieni Nilem, a nawet zaginione maszyny. Najczęściej wraca wersja z miedzianymi narzędziami, wodą i armią robotników pracujących latami."}],"conclusion":"Dawne cywilizacje miały zaskakującą wiedzę, a część ich technik pozostaje dla nas zagadką.","factchecks":[{"claim":"Puchar Likurga zmienia kolor dzięki nanocząstkom.","verdict":"prawda","note":"Złoto i srebro w nanocząstkach potwierdziło British Museum; efekt jest wyjaśniony.","src":[["British Museum: Puchar Likurga","https://www.britishmuseum.org/collection/object/H_1958-1202-1"],["Wikipedia (ang.): Puchar Likurga - hasło \"Lycurgus Cup\"","https://en.wikipedia.org/wiki/Lycurgus_Cup"]],"p":0},{"claim":"Elastyczne szkło rzymskie.","verdict":"nie da się sprawdzić","note":"Historia pochodzi tylko z anegdot Pliniusza Starszego i Petroniusza; nie ma żadnego artefaktu. Film zaznacza, że to legenda.","src":[["Wikipedia (ang.): szkło elastyczne (vitrum flexile) - hasło \"Flexible glass\"","https://en.wikipedia.org/wiki/Flexible_glass"]],"p":1},{"claim":"Ogień grecki wynaleźli Rzymianie, a jego przepis zaginął.","verdict":"półprawda","note":"Używało go Bizancjum od ok. 672 r.; skład faktycznie nie jest znany.","src":[["Wikipedia (ang.): ogień grecki - hasło \"Greek fire\"","https://en.wikipedia.org/wiki/Greek_fire"]],"p":2},{"claim":"Skrzypiec Stradivariego nie da się odtworzyć i brzmią wyjątkowo.","verdict":"przesada","note":"W ślepych testach (PNAS 2012, 2014) soliści nie odróżniali Stradivariusów od nowych skrzypiec.","src":[["Fritz i in. 2014, PNAS (DOI)","https://doi.org/10.1073/pnas.1323367111"],["Wikipedia (ang.): instrumenty Stradivariego - hasło \"Stradivarius\"","https://en.wikipedia.org/wiki/Stradivarius"]],"p":3},{"claim":"Mechanizm z Antykithiry: znaleziony ok. 100 lat temu, przewidywał zaćmienia, niezrównany przez wieki.","verdict":"prawda","note":"Działanie mechanizmu jest dziś dobrze zrekonstruowane.","src":[["Wikipedia (ang.): mechanizm z Antykithiry - hasło \"Antikythera mechanism\"","https://en.wikipedia.org/wiki/Antikythera_mechanism"],["Freeth i in. 2021, Scientific Reports","https://www.nature.com/articles/s41598-021-84310-w"]],"p":4},{"claim":"Stal damasceńska to zaginiony sekret.","verdict":"przesada","note":"Wzory stali wootz odtworzono w latach 90., a nanorurki znaleziono w jednym ostrzu.","src":[["Wikipedia (ang.): stal damasceńska - hasło \"Damascus steel\"","https://en.wikipedia.org/wiki/Damascus_steel"],["Reibold i in. 2006, Nature","https://www.nature.com/articles/444286a"]],"p":5},{"claim":"Kule z Kostaryki: ponad 300, do kilkunastu ton, cel nieznany.","verdict":"prawda","note":"Kule kultury Diquís obrabiano kamieniem i ścieraniem; cel jest niepewny, ale nie \"niewytłumaczalny\".","src":[["Wikipedia (ang.): kamienne kule z Kostaryki - hasło \"Stone spheres of Costa Rica\"","https://en.wikipedia.org/wiki/Stone_spheres_of_Costa_Rica"],["UNESCO: osady wodzów Diquís z kamiennymi kulami","https://whc.unesco.org/en/list/1453/"]],"p":6},{"claim":"Bloki Sacsayhuamán ważą po 100-120 ton.","verdict":"przesada","note":"Największy blok szacuje się na ok. 120-130 t, ale większość jest znacznie mniejsza. Precyzyjne dopasowanie jest prawdą.","src":[["Wikipedia (ang.): Sacsayhuamán","https://en.wikipedia.org/wiki/Sacsayhuam%C3%A1n"]],"p":7},{"claim":"Nie wiadomo, jak zbudowano piramidy.","verdict":"przesada","note":"Papirusy z Wadi al-Dżarf, ślady ramp i osady robotników wyjaśniają budowę; \"megamaszyny\" to spekulacja.","src":[["Wikipedia (ang.): Dziennik Merera - hasło \"Diary of Merer\"","https://en.wikipedia.org/wiki/Diary_of_Merer"],["Fall i in. 2014, PRL (DOI)","https://doi.org/10.1103/PhysRevLett.112.175502"]],"p":8}],"bias":"Tendencyjny tytuł: większość pozycji naukowcy dobrze rozumieją, a film sugeruje nawet zaginione maszyny.","channel":"Chill Dude Explains"},{"id":"hmHhsg7h4g0","title_pl":"10 powodów, dla których w średniowieczu uznano by cię za czarownicę","title":"10 Reasons You'd Be Called a Witch in The Middle Ages","url":"https://www.youtube.com/watch?v=hmHhsg7h4g0","date":"2024-01-02","duration":544,"views":2194394,"transcript":"youtube","added":"2026-11-03","tags":["Historia","Mity"],"about":"Humorystyczna lista 10 zachowań i cech, za które w \"średniowieczu\" można było zostać oskarżonym o czary.","intro":"Żartobliwa lista 10 zachowań i cech, za które według autora w \"średniowieczu\" można było zostać oskarżonym o czary. Są wśród nich znamiona, lunatykowanie, gwizdanie, leworęczność i ziewanie, a także koty, kichnięcie kota, warzenie piwa, zbyt dobry ser i jajka z dwoma żółtkami. Autor opisuje to scenkami z wymyślonymi sąsiadami, a przy piwie tłumaczy, skąd wziął się obraz czarownicy z kotłem i miotłą.","points":[{"t":"Znamiona","d":"W XV w. znamiona nazywano znakiem diabła i wierzono, że są znieczulone magią. Łowcy czarownic kłuli je igłami, a brak bólu oznaczał winę; niektórzy używali chowanych igieł. Reakcję na ból też uznawano za udawanie."},{"t":"Lunatykowanie","d":"Ktoś, kto chodzi nocą z zamkniętymi oczami i mamrocze, według autora wyglądał jak rozmawiający z diabłem. Szept przez sen mógł uchodzić za zaklęcie, a gdy następnego dnia coś się stało, np. koń kowala się przeziębił, winny był lunatyk."},{"t":"Gwizdanie","d":"Niektóre melodie miały przywoływać wiatr zdolny zerwać dach albo zważyć mleko. Liczyło się też miejsce: gwizdanie przy pewnych drzewach oznaczało spotkanie z czarownicami, przy cmentarzu budzenie zmarłych, a w kościele było zakazane. Wierzono też, że melodie pozwalają porozumiewać się ze zwierzętami."},{"t":"Leworęczność","d":"Ponieważ większość ludzi jest praworęczna, a diabła uważano za mańkuta, leworęcznych podejrzewano o czary. Według autora ich słowo nie miało wagi w sądzie, bo uznawano, że mówi przez nich diabeł."},{"t":"Ziewanie","d":"Wierzono, że przy ziewnięciu dusza może uciec, a w jej miejsce wejdą demony. Autor wiąże to z dżumą, której objawem miało być częste ziewanie. Przy ziewaniu robiono znak krzyża nad ustami, a za niemowlęta robili to dorośli; ziewanie bez znaku krzyża było podejrzane."},{"t":"Posiadanie kotów","d":"Zwłaszcza czarne koty, nocne i tajemnicze, uchodziły za pomocników diabła, więc ich właścicielkę mogła oskarżyć sąsiadka. Autor zwraca uwagę na ironię: koty ograniczały populację szczurów, a więc ryzyko szerzenia się dżumy."},{"t":"Kichnięcie kota obok ciebie","d":"Skoro kot był przyjacielem diabła, to kichnięcie kota obok ciebie oznaczało, że kot z tobą rozmawia. Według autora z tego wynikało, że i ty kumplujesz się z diabłem, czyli jesteś czarownicą."},{"t":"Warzenie piwa","d":"W średniowieczu piwo warzyły głównie kobiety. Za dobre piwo budziło zazdrość i plotki o zaklęciach nad kotłem. Wyposażenie piwowarki to duży kocioł, kij do mieszania i koty pilnujące ziarna przed myszami, czyli według autora gotowy zestaw stereotypowej czarownicy."},{"t":"Za dobry ser","d":"Gdy w wiosce jeden ser zawsze wychodził idealny, a u sąsiadów jak guma czy cegła, ludzie, nie znając roli bakterii i temperatury, podejrzewali czary. Wierzono, że czarownica umie \"ukraść\" jakość cudzego sera i dodać ją do swojego."},{"t":"Jajka z dwoma żółtkami","d":"Autor umieszcza to w XVI-wiecznej Francji: jajka z dwoma żółtkami uchodziły za nienaturalne. Właścicielkę kur podejrzewano, że rzuciła na nie urok albo używa takich jajek w rytuałach."}],"conclusion":"Przesądy i brak wiedzy sprawiały, że niemal każde odstępstwo od normy mogło skończyć się procesem o czary.","factchecks":[{"claim":"Polowania na czarownice to średniowiecze (XV wiek).","verdict":"półprawda","note":"Masowe procesy to głównie lata 1450-1750, czyli wczesna nowożytność, nie średniowiecze.","sr document.addEventListener('keydown',function(e){if(e.key==='Escape'&&cur){e.preventDefault();requestClose()}});
var tm;$('q').addEventListener('input',function(){clearTimeout(tm);tm=setTimeout(render,150)});
['ch','fr','so'].forEach(function(k){$(k).addEventListener('change',render)});
function setSync(ok,msg){var s=$('sync');s.className='sync '+(ok?'ok':'off');s.textContent=msg}
function hhmm(){var d=new Date();return (d.getHours()<10?'0':'')+d.getHours()+':'+(d.getMinutes()<10?'0':'')+d.getMinutes()}
function req(url,opt,ms){
 var ctl=window.AbortController?new AbortController():null; opt=opt||{}; if(ctl)opt.signal=ctl.signal;
 var to=setTimeout(function(){if(ctl)ctl.abort()},ms||8000);
 return fetch(url,opt).then(function(r){clearTimeout(to);if(!r.ok)throw new Error('HTTP '+r.status);return r.text()})}
function pull(){return req(API+encodeURIComponent(KEY)+'?_='+Date.now(),{cache:'no-store'}).then(function(t){t=(t||'').trim();if(!t)return {};var o=JSON.parse(t);if(typeof o!=='object'||!o)throw new Error('zły format');return o})}
function write(obj){return req(API+'update',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'key='+encodeURIComponent(KEY)+'&value='+encodeURIComponent(JSON.stringify(obj))}).then(function(t){var o=JSON.parse(t);if(o.status!==1)throw new Error('zapis odrzucony')})}
var busy=false, again=false, pt;
function schedulePush(){clearTimeout(pt);pt=setTimeout(sync,600)}
function sync(){
 if(busy){again=true;return}
 busy=true;
 pull().then(function(remote){
  if(merge(state,remote)){lsSet(LS,state);render()}
  if(!same(state,remote)||lsGet(LSD,false))return write(state).then(function(){lsSet(LSD,false)});
 }).then(function(){setSync(true,'zsynchronizowano '+hhmm())},function(){setSync(false,'offline - zapis lokalny')})
 .then(function(){busy=false;if(again){again=false;sync()}});
}
render();route();
req('read.json?_='+Date.now(),{cache:'no-store'},5000).then(function(t){var o=JSON.parse(t||'{}');if(merge(state,o)){lsSet(LS,state);render()}}).catch(function(){}).then(sync);
document.addEventListener('visibilitychange',function(){if(!document.hidden)sync()});
window.addEventListener('online',sync);
setInterval(function(){if(!document.hidden)sync()},120000);
})();
