rzut Tybru","d":"**Rzym żył dzięki Tybrowi, ale niemal co roku rzeka wylewała; około trzech tuzinów powodzi zanotowali historycy.** Kasjusz Dion opisuje powódź 54 p.n.e.: gliniane ściany nasiąkały i waliły się, ludzie tonęli w pokojach; potem głód po zniszczeniu spichlerzy i malaria z kałuż.\n\nCezar planował kanał przez bagna Pontyńskie do Terraciny (>60 km) albo obejście Rzymu wokół Wzgórz Watykańskich. Zginął przed startem. August ograniczył się do pogłębiania koryta; plan Tyberiusza o odwróceniu dopływów odrzucił Senat po protestach miast. Wały powstały dopiero w XIX wieku."},{"t":"2. Kanał Koryncki Nerona","d":"**Opływanie Peloponezu było długie i niebezpieczne (m.in. Antikythera); Diolkos pozwalał przeciągać ładunki i floty przez przesmyk szeroki na 6 km i wysoki prawie na 100 m.** Starożytni bali się, że morze po zachodniej stronie jest wyżej i zaleje Morze Egejskie.\n\nNeron osobiście rozpoczął roboty złotą łopatą; kopało 6000 żydowskich jeńców. 32 szyby do 40 m, wykop od wschodu 1300 m (do 30 m głębokości), od zachodu 2 km. Śmierć Nerona i wojna domowa przerwały prace; współczesny kanał (XIX w., 12 lat) poszedł tą samą trasą i zatarł ślady."},{"t":"1. Stolica Germanii: Waldgirmes","d":"**Około 100 km na wschód od Renu, koło dzisiejszego Waldgirmes, Rzymianie założyli cywilne miasto (ok. 4 p.n.e.) z siatką ulic, akweduktem, ołowianymi rurami i forum.** Na forum stał pozłacany posąg konny Augusta (głowa znaleziona w studni w 1990) i inne brązy dynastii.\n\nPo klęsce w Lesie Teutoburskim (9 n.e.) mieszkańcy wycofali się z legionami za Ren; budynki spalono. To świadectwo imperialnego overreach: stolica prowincji, której nigdy nie utrzymano."}],"conclusion":"Trzy projekty łączy ambicja większa niż życie lub władza inicjatora: Cezar, Neron i Augustyńska Germania. Autor pokazuje, że nawet Rzymianie potrafili zostawić po sobie tylko szyby, zgliszcza i legendę pychy.","factchecks":[{"claim":"Neron zaczął kopać kanał przez Przesmyk Koryncki; dokończono go w XIX w.","verdict":"prawda","note":"Prace Nerona są poświadczone; współczesny Corinth Canal otwarto w 1893 na zbliżonej trasie.","p":1,"src":[["Wikipedia (ang.): Kanał Koryncki - hasło \"Corinth Canal\"","https://en.wikipedia.org/wiki/Corinth_Canal"]]},{"claim":"Przy Waldgirmes odkryto rzymskie miasto z posągiem Augusta, porzucone po Teutoburgu.","verdict":"prawda","note":"Stanowisko Waldgirmes to wczesne rzymskie osadnictwo cywilne w Germanii, opuszczone po 9 n.e.","p":2,"src":[["Wikipedia (ang.): Waldgirmes - hasło \"Waldgirmes Forum\"","https://en.wikipedia.org/wiki/Waldgirmes_Forum"]]},{"claim":"Cezar planował przekierowanie Tybru; prace nie wystartowały przed zabójstwem.","verdict":"prawda","note":"Plany regulacji Tybru przypisywane Cezarowi są znane z tradycji literackiej; nie zrealizowano ich.","p":0,"src":[["Wikipedia (ang.): Tyber - hasło \"Tiber\"","https://en.wikipedia.org/wiki/Tiber"]]}],"bias":"Narracja \"hubris\" Nerona jest retoryczna; film ma sponsora (Plaud Note Pro). Dobrze oddziela spekulację planów Cezara od wykopalisk."},{"id":"I1uDiTVSEnM","title_pl":"Przeklęta stacja Camden Town","title":"The Cursed Station at Camden Town","channel":"Jago Hazzard","url":"https://www.youtube.com/watch?v=I1uDiTVSEnM","date":"2026-09-11","duration":980,"views":204724,"section":"Historia","transcript":"youtube","added":"2026-11-03","tags":["Historia","Technika"],"about":"Historia stacji metra Camden Town w Londynie: od legendy o czarownicy po najbardziej diabelski węzeł Northern Line.","intro":"Jago Hazzard opowiada, dlaczego Camden Town jest ukochaną stacją Londyńczyków i koszmarem Transport for London. Od planów z 1893 r., które jej nie przewidywały, przez budowę, węzeł 4 kierunków z 1924 r. i schron z czasów wojny, po tłumy z czasów kontrkultury i odkładaną przebudowę.","points":[{"t":"Dom czarownicy","d":"Według legendy stacja stoi przy chacie Mother Damnable, czyli Mother Redcap, po którą w chwili śmierci przyszedł sam diabeł. Autor żartuje, że to tłumaczy, czemu Camden Town to taki kłopot."},{"t":"Stacji miało nie być","d":"Linia Charing Cross, Euston and Hampstead Railway zatwierdzona w 1893 r. omijała Camden. Po zmianie trasy w 1899 r. dodano odgałęzienie do Kentish Town, a pod Camden powstał węzeł i stacja, otwarta 22 czerwca 1907 r."},{"t":"Nazwa i pieniądze","d":"Rozważano nazwy Camden Road, Hampstead Road i Camden Mother Redcap, od pubu naprzeciwko. Zapał inwestorów do metra ostygł, gdy okazało się, ile kosztuje, więc w 1900 r. linię przejęło konsorcjum późniejszego UERL i budowa ruszyła w 1902 r."},{"t":"Pierwsze rozgałęzienie","d":"Nikt wcześniej nie zbudował rozgałęzienia głębokiego metra dla pasażerów, więc Board of Trade obawiał się kolizji. UERL po prostu przestawił sygnalizację, by pociągi stawały dalej od węzła."},{"t":"Styl Leslie Greena","d":"Stacja ma typową fasadę z bordowych płytek i stalowy szkielet, ale z 2 fasadami rozdzielonymi cudzym budynkiem. Perony mają własny, niebiesko-kremowy wzór, a te w kierunku północnym leżą nad południowymi, by zaoszczędzić miejsce."},{"t":"Węzeł z 4 kierunków","d":"W latach 1922-1924 przedłużono City and South London Railway z Euston do Camden. Powstało 6 tuneli na południe od węzła i 17 nowych połączeń, a nastawnia miała 37 dźwigni; dziennie przejeżdżało 1504 pociągów."},{"t":"Ruchome schody i nazwa","d":"W 1929 r. 3 windy zastąpiono schodami ruchomymi; dawne korytarze do wind służą dziś przesiadkom. Po utworzeniu London Transport w 1933 r. połączone linie dostały tymczasową nazwę Northern Line, która została."},{"t":"Bomba i schron","d":"14 października 1940 r. bomba zniszczyła 1/3 fasady przy Camden High Street. Rząd zgodził się na budowę ekspresowej linii pod warunkiem wykopania schronów; ten w Camden ukończono w 1942 r., linii nigdy nie zbudowano."},{"t":"Stolica kontrkultury","d":"W latach 70. opuszczone budynki kolejowe i magazyny nad Regent's Canal zamieniono w kluby i targi. Stacja tak się zatłoczyła, że w niedziele była tylko wyjściem, aż w 2019 r. wprowadzono ruch jednokierunkowy."},{"t":"Linia nieszczęścia","d":"Przez węzeł problem na jednej odnodze rozlewa się na całą linię. Rozdzielenie Northern Line oznacza więcej przesiadek w zatłoczonym Camden, a nowsze plany zostawiają węzeł, co według autora mija się z celem."},{"t":"Odkładana przebudowa","d":"TfL odkupił schron, ale pierwsze plany wymagały wyburzenia kościoła, szkoły i klubu Electric Ballroom. Nowe wejście od Buck Street z windami ruszy raczej w latach 30., a podział linii nie przed latami 40."}],"conclusion":"Camden Town to od początku kompromis, który dziś ogranicza całą Northern Line, a naprawa wciąż czeka na pieniądze.","factchecks":[{"claim":"Stację Camden Town otwarto 22 czerwca 1907 r.","verdict":"prawda","note":"Otwarto ją razem z całą linią Charing Cross, Euston and Hampstead Railway.","p":1,"src":[["Wikipedia (ang.): stacja Camden Town - hasło \"Camden Town tube station\"","https://en.wikipedia.org/wiki/Camden_Town_tube_station"]]},{"claim":"Zaprojektował ją Leslie Green w typowym dla UERL stylu z bordowych płytek.","verdict":"prawda","note":"Green zaprojektował ok. 50 stacji UERL z charakterystyczną bordową terakotą.","p":4,"src":[["Wikipedia (ang.): Leslie Green - hasło \"Leslie Green\"","https://en.wikipedia.org/wiki/Leslie_Green"]]},{"claim":"Głęboki schron w Camden Town zbudowano w czasie wojny pod przyszłą linię ekspresową.","verdict":"prawda","note":"To jeden z 8 głębokich schronów pod Northern Line; ekspresowej linii nie zbudowano.","p":7,"src":[["Wikipedia (ang.): głębokie schrony w Londynie - hasło \"London deep-level shelters\"","https://en.wikipedia.org/wiki/London_deep-level_shelters"]]},{"claim":"Fasada przy Camden High Street ucierpiała w bombardowaniu 14 października 1940 r.","verdict":"prawda","note":"Stację uszkodziła bomba w październiku 1940 r.; odbudowano ją bez zniszczonej części.","p":7,"src":[["Wikipedia (ang.): stacja Camden Town - hasło \"Camden Town tube station\"","https://en.wikipedia.org/wiki/Camden_Town_tube_station"]]},{"claim":"Przebudowa z nowym wejściem od Buck Street jest planowana, ale bez daty.","verdict":"prawda","note":"TfL ma zgodę na nowe wejście, ale budowę odłożono z braku funduszy.","p":10,"src":[["Wikipedia (ang.): stacja Camden Town - hasło \"Camden Town tube station\"","https://en.wikipedia.org/wiki/Camden_Town_tube_station"]]}],"bias":"Rzetelny i z humorem, z podanymi źródłami książkowymi; opinia o podziale linii to zdanie autora."},{"id":"k3Q9UWWiPsQ","title_pl":"Pompa \"perpetuum mobile\", która naprawdę działa","title":"The \"Perpetual Motion\" Pump That Actually Works","channel":"Steve Mould","url":"https://www.youtube.com/watch?v=k3Q9UWWiPsQ","date":"2026-08-31","duration":990,"views":4315682,"section":"Ciekawostki","transcript":"youtube","added":"2026-11-06","tags":["Nauka","Technika"],"about":"Steve Mould o pompie hydraulicznej ram: wykorzystuje uderzenie wodne, nie łamie praw termodynamiki.","intro":"Steve Mould tłumaczy hydraulic ram pump - urządzenie, które wygląda jak perpetuum mobile, bo podnosi wodę wyżej bez prądu. Działa od XIX/XVIII-wiecznych pomysłów po dzisiejsze instalacje off-grid.\n\nKlucz: nie tworzy energii z niczego. Korzysta z pędu i ściśliwości wody (uderzenie wodne / water hammer), by część przepływu wypchnąć wyżej.","points":[{"t":"Dlaczego wygląda na oszustwo","d":"**Pompa nie ma silnika, a mimo to podnosi wodę powyżej źródła.** Intuicja krzyczy: łamie energię. Mould rozbraja to: większość wody spływa niżej; tylko ułamek idzie do góry, ale z zyskiem wysokości.\n\nBilans energetyczny się zgadza - to transformacja, nie darmowy lunch."},{"t":"Water hammer jako napęd","d":"**Gdy zawór nagle zamyka przepływ, fala ciśnienia (hydraulic transient) daje krótki \"kopniak\".** Ta energia otwiera zawór tłoczący do zbiornika wyżej.\n\nWoda jest prawie nieściśliwa, więc fala idzie szybko (jak dźwięk w cieczy, z korektą na elastyczność rur)."},{"t":"Zastosowania","d":"**Tam gdzie jest stały spadek strumienia, ram pump może zasilać farmę bez prądu.** Mould buduje/analizuje model i tłumaczy, czemu \"kilka osób naprawdę to rozumie\" - bo to dynamika fal, nie zwykła hydrostatyka.\n\nNa końcu typowa wstawka sponsorska KiwiCo."}],"conclusion":"Ram pump uczy pokory wobec intuicji: wygląda magicznie, jest klasyczną inżynierią XIX w. Perpetuum mobile nie - sprytny trade-off przepływu za wysokość tak.","factchecks":[{"claim":"Hydraulic ram używa uderzenia wodnego do podnoszenia części wody wyżej bez zewnętrznego napędu.","verdict":"prawda","note":"Ram pump to uznana technologia od XVIII/XIX w.","p":1,"src":[["Wikipedia (ang.): hydraulic ram","https://en.wikipedia.org/wiki/Hydraulic_ram"],["Wikipedia (ang.): water hammer","https://en.wikipedia.org/wiki/Water_hammer"]]},{"claim":"Urządzenie nie łamie zasady zachowania energii: większość wody spływa niżej.","verdict":"prawda","note":"Sprawność to stosunek energii potencjalnej podniesionej frakcji do energii strumienia zasilającego.","p":0,"src":[["Wikipedia (ang.): hydraulic ram","https://en.wikipedia.org/wiki/Hydraulic_ram"]]}],"bias":"Sponsoring KiwiCo na końcu; model stołowy upraszcza straty rzeczywistej instalacji."},{"id":"O5jyzM9oG6E","title_pl":"Antyczna osoba, o której wiemy najwięcej: Augustyn","title":"The Ancient Person We Know Most About","channel":"toldinstone","url":"https://www.youtube.com/watch?v=O5jyzM9oG6E","date":"2026-08-28","duration":607,"views":230426,"section":"Historia","transcript":"youtube","added":"2026-11-05","tags":["Historia"],"about":"toldinstone: od papirusów i Cycerona po Augustyna - kto z antyku zostawił najpełniejszy portret życia i umysłu.","intro":"Garrett Ryan (toldinstone) pyta, o kim ze świata klasycznego wiemy najwięcej. Dziś biografie da się składać z minut; w antyku piśmienność była niska, a większość nie-elit nie zostawiła śladu - nawet Piłat ma jedną fragmentaryczną inskrypcję.\n\nFilm idzie od szczęśliwych znalezisk (papirusy, Vindolanda) przez Cycerona i Marka Aureliusza po wniosek: najwięcej słów i najgłębszy autoportret zostawił św. Augustyn.","points":[{"t":"Szczęśliwe wyjątki poza literaturą","d":"**Papirusy i listy pokazują ludzi, których nie ma w kanonie literackim.** W Oksyrynchos widać losy tkacza Tryfona (była żona okradła dom i pobiła go na ulicy); przy Morzu Martwym - spory majątkowe wdowy Babathy; z Vindolandy - Flavius Cerialis i Sulpicia Lepidina (nawet jej skórzane pantofle i mszysty kapelusz).\n\nNa mauzoleach Opramoasa i Licinii Flavilli (Oenoanda) wyryto genealogie i listy darowizn. To jednak wycinki; pełniejsze życia dają autorzy i wodzowie."},{"t":"Cyceron i cesarze-pisarze","d":"**Najlepiej udokumentowany okres to upadek Republiki, a Cyceron zostawił ok. 900 listów (z tysięcy), 58 mów i traktaty - łącznie około miliona słów.** Listy są nieformalne: slang, prywatne żarty, wahania nastroju - portret jak dziennik Samuela Pepysa.\n\nPo nim emocjonalnie bliski jest Marek Aureliusz (Medytacje jako prywatne zapiski). Jeszcze pełniejszy Cesarz Julian (listy, hymny, \"Misopogon\", Against the Galileans). Współczesny Libaniusz: 64 mowy i 1544 listy."},{"t":"Augustyn: skala tekstu","d":"**Pod koniec życia Augustyn spisał listę własnych dzieł: 252 księgi, z których ok. 95% przetrwało; plus ok. 400 kazań i 300 listów - łącznie niemal 5,5 mln słów.** Dla porównania autor: cała klasyczna łacina to około 9 mln słów.\n\nWiększość to teologia i polemiki dla wiernych, ale Confessiones to najbardziej przenikliwa psychologicznie autobiografia przednowoczesna: historia nie tylko życia, lecz umysłu (albo, jak mówił Augustyn, duszy)."}],"conclusion":"Według autora to Augustyn - nie Cezar ani Cyceron - jest antyczną osobą, o której wiemy najwięcej: rekord objętości plus Confessions jako mapa wnętrza. Reszta świata klasycznego zostaje w urywkach i szczęśliwych znaleziskach.","factchecks":[{"claim":"Zachowane dzieła Augustyna liczą rząd kilku milionów słów (autor: ~5,5 mln).","verdict":"półprawda","note":"Korpus Augustyna jest ogromny i w większości zachowany; dokładne 5,5 mln zależy od metody zliczania.","p":2,"src":[["Wikipedia (ang.): Augustyn z Hippony - hasło \"Augustine of Hippo\"","https://en.wikipedia.org/wiki/Augustine_of_Hippo"],["Wikipedia (ang.): Wyznania Augustyna - hasło \"Confessions (Augustine)\"","https://en.wikipedia.org/wiki/Confessions_(Augustine)"]]},{"claim":"Zachowało się około 900 listów Cycerona.","verdict":"prawda","note":"Korpus Epistulae Cycerona obejmuje setki listów; często podaje się rząd ~900.","p":1,"src":[["Wikipedia (ang.): listy Cycerona - hasło \"Cicero's letters\"","https://en.wikipedia.org/wiki/Cicero%27s_letters"]]},{"claim":"Z Vindolandy znamy m.in. Sulpicię Lepidinę i zachowane pantofle.","verdict":"prawda","note":"Tabliczki i znaleziska z Vindolandy obejmują korespondencję Lepidiny; skórzane obuwie też odkryto.","p":0,"src":[["Wikipedia (ang.): tabliczki z Vindolandy - hasło \"Vindolanda tablets\"","https://en.wikipedia.org/wiki/Vindolanda_tablets"]]}],"bias":"Kryterium \"najwięcej wiemy\" waży objętość tekstu chrześcijańskiego (lepsza transmisja). Sponsor: Incogni. Ton akademicko-popularyzatorski."},{"id":"NvkZaWLe0Sk","title_pl":"Wymiennik, który idzie \"poza\" równowagę temperatur","title":"This Device Goes Past Equilibrium","channel":"Steve Mould","url":"https://www.youtube.com/watch?v=NvkZaWLe0Sk","date":"2026-08-22","duration":802,"views":2122595,"section":"Ciekawostki","transcript":"youtube","added":"2026-11-06","tags":["Nauka","Technika"],"about":"Steve Mould o przeciwprądowym wymienniku ciepła: jak gorące wychodzi zimniejsze niż zimne wlotowe bez łamania II zasady.","intro":"Steve Mould zaczyna od absurdu: herbata z słomki wychodzi zimna, napój zimny - gorący, bo słomki się \"przeplatają\". Potem pokazuje counterflow heat exchanger - bez pomp ciepła - i kacze nogi jako biologię tej samej idei.\n\nCel: zrozumieć, czemu temperatury mogą \"minąć się\" wzdłuż urządzenia, nie łamiąc drugiej zasady termodynamiki.","points":[{"t":"Paradoks równości","d":"**W wymienniku współprądowym płyny dążą do wspólnej temperatury i na tym koniec.** W przeciwprądzie gorący i zimny płyną w przeciwne strony: lokalnie zawsze ciepło idzie z cieplejszego do zimniejszego.\n\nGlobalnie wylot \"gorącego\" może być zimniejszy niż wylot \"zimnego\" - bo porównywane są różne końce."},{"t":"Wykres wzdłuż rury","d":"**Mould pokazuje wykres: czerwona i niebieska linia temperatur wzdłuż kanałów oraz ścianka między nimi.** Im wolniejszy przepływ, tym bliżej idealnego wymiennika.\n\nNigdzie nie pchamy ciepła pod górę gradientu lokalnego - stąd zgodność z II zasadą."},{"t":"Kacze nogi i przemysł","d":"**Nogi ptaków wodnych używają przeciwprądu, by nie tracić ciepła ciała w zimnej wodzie.** Te same zasady siedzą w industrii (odzysk ciepła, LNG, chemia).\n\nPuenta: intuicja \"nie wolno wyjść poza równowagę\" dotyczy izolowanej pary w jednym miejscu, nie całego przeciwprądu."}],"conclusion":"Counterflow to sprytna geometria, nie magiczna lodówka. Gdy zrozumiesz lokalny gradient, \"niemożliwe\" temperatury wylotowe stają się oczywiste.","factchecks":[{"claim":"Przeciwprądowy wymiennik ciepła może schłodzić gorący strumień poniżej temperatury wylotu zimnego.","verdict":"prawda","note":"To standardowa zaleta countercurrent vs concurrent exchange.","p":0,"src":[["Wikipedia (ang.): countercurrent exchange","https://en.wikipedia.org/wiki/Countercurrent_exchange"],["Wikipedia (ang.): heat exchanger","https://en.wikipedia.org/wiki/Heat_exchanger"]]},{"claim":"Ptaki wodne stosują przeciwprąd w nogach do oszczędzania ciepła.","verdict":"prawda","note":"Klasyczny przykład biologicznego countercurrent heat exchange.","p":2,"src":[["Wikipedia (ang.): countercurrent exchange","https://en.wikipedia.org/wiki/Countercurrent_exchange"]]}],"bias":"Sponsoring Jane Street na końcu; demo z barwnikami upraszcza straty rzeczywiste."},{"id":"2GTROfhZIxY","title_pl":"Garderoba kapsułowa sprzed 60 lat, która wciąż działa","title":"We Found The Perfect Capsule Wardrobe (It's 60 Years Old!)","channel":"Gentleman's Gazette","url":"https://www.youtube.com/watch?v=2GTROfhZIxY","date":"2026-08-16","duration":786,"views":62143,"section":"Moda","transcript":"youtube","added":"2026-11-03","tags":["Styl","Garderoba","Klasyka"],"about":"Gentleman's Gazette przerabia listę ubrań z Esquire z 1962 roku na współczesną, ponadczasową garderobę klasycznego mężczyzny.","intro":"Prowadzący znalazł we wrześniowym Esquire z 1962 roku artykuł \"The Basic College Wardrobe\", czyli listę rzeczy na studia. Przechodzi przez nią kategoria po kategorii i pokazuje, co zostawić, co zmienić i czego jest za dużo. Wychodzi spójna garderoba, w której prawie wszystko pasuje do siebie.","points":[{"t":"Trzy garnitury jako baza","d":"Granatowy (u niego dwurzędowy), średnioszary flanelowy z kamizelką i wzorem pepitki, którego części da się nosić osobno, oraz rudawy tweed w jodełkę."},{"t":"Marynarki i spodnie","d":"Granatowy blezer z hopsacku z mosiężnymi guzikami, pół podszyty na różne klimaty, i marynarka w kratę glen. Spodnie: grafitowa flanela, oliwkowy sztruks, jedne chinosy zamiast czterech, kasztanowy sztruks."},{"t":"Okrycia wierzchnie","d":"Klasyczny trencz, granatowy jednorzędowy płaszcz wełniany do formalnych okazji i zamiast przestarzałego kożucha lekka pikowana kurtka na podróże."},{"t":"Koszule z umiarem","d":"Lista każe mieć 6 białych i 3 niebieskie koszule oxford z kołnierzykiem na guziki, ale można zmniejszyć liczbę. Do tego żółta lniana, trzy w paski, jedna z kołnierzykiem na patkę i polo z dzianiny z długim rękawem."},{"t":"Krawaty z wieloma kolorami","d":"Jedwabne w paski, foulardy, wełniane challis, czarna grenadyna i dzianinowe. Wybiera wzory z wieloma kolorami, by pasowały do wszystkiego w szafie."},{"t":"Dzianina i buty","d":"Zielony sweter w serek w stylu krykietowym i szalowy kardigan w kratę black watch jako zamiennik marynarki. Buty: loafersy, burgundowe derby, czarne brogsy, lakierki na wieczór i mokasyny żeglarskie zamiast tenisówek."},{"t":"Strój wieczorowy i kapelusze","d":"Czarny smoking jednorzędowy z klapą w szpic, pas i mucha typu batwing. Trzy kapelusze: szary filcowy, kaszkiet z tweedu i oliwkowe trilby."},{"t":"Dodatki","d":"Dwustronne paski skórzane, pas z taśmy, szelki, skarpety z akcentem, spinki, szare rękawiczki z pekari i białe lniane poszetki zamiast tuzina chusteczek."}],"conclusion":"Stara lista z Esquire, dopasowana do własnego gustu i życia, daje solidną, spójną garderobę na lata.","factchecks":[{"claim":"Trencz Burberry to klasyczny płaszcz przeciwdeszczowy, który przetrwał dekady.","verdict":"prawda","note":"Trencz powstał na początku XX wieku, a Burberry jest jednym z jego głównych twórców i producentów.","p":2,"src":[["Wikipedia (ang.): trencz - hasło \"Trench coat\"","https://en.wikipedia.org/wiki/Trench_coat"]]},{"claim":"Koszula oxford z kołnierzykiem na guziki to klasyka stylu college.","verdict":"prawda","note":"Button-down z tkaniny oxford od lat 50. i 60. jest symbolem amerykańskiego stylu Ivy League.","p":3,"src":[["Wikipedia (ang.): styl uczelni Ivy League - hasło \"Ivy League (clothing)\"","https://en.wikipedia.org/wiki/Ivy_League_(clothing)"]]},{"claim":"Kordowan kojarzy się z głębokim burgundowym kolorem skóry.","verdict":"prawda","note":"Shell cordovan to skóra końska, a jej klasyczny odcień to ciemne bordo nazywane \"Color 8\".","p":5,"src":[["Wikipedia (ang.): skóra kordowan - hasło \"Shell cordovan\"","https://en.wikipedia.org/wiki/Shell_cordovan"]]}],"bias":"Klasyczny, brytyjsko-amerykański punkt widzenia i drogie marki. To raczej inspiracja niż lista zakupów, choć sporo rzeczy pokazanych jest jak w katalogu."},{"id":"hp3rkKHWwEc","title_pl":"Ukryte bizantyjskie ruiny Stambułu","title":"Istanbul's Hidden Byzantine Ruins","channel":"toldinstone","url":"https://www.youtube.com/watch?v=hp3rkKHWwEc","date":"2026-08-15","duration":575,"views":120631,"section":"Historia","transcript":"youtube","added":"2026-11-06","tags":["Historia","Geografia"],"about":"toldinstone: poza Hagia Sophiją - Great Palace, cisterny, sfendone hipodromu i warstwy \"House of Four Eras\".","intro":"Garrett Ryan (toldinstone) oprowadza po Stambule poza checklistą turysty: Hagia Sophia, Cysterna Bazyliki, Hipodrom. Pyta, gdzie jeszcze widać Konstantynopol Konstantyna i Justyniana.\n\nFilm pokazuje warstwy miasta (rzymskie, bizantyjskie, osmańskie, republikańskie) na jednym budynku, resztki Wielkiego Pałacu pod Sultanahmet oraz fundamenty zakrętu hipodromu z cysterną.","points":[{"t":"House of Four Eras","d":"**Na tylnej fasadzie \"Domu Czterech Epok\" widać granitowe kolumny późnorzymskiej cysterny, łuki bizantyjskie, fragment osmańskiej łaźni i dom z czasów republiki tureckiej.** Autor: najbardziej niezwykłe jest to, jak zwyczajny jest ten budynek w tkance miasta.\n\nStambuł stoi na grecko-rzymsko-bizantyjskim palimpseście - najczytelniejszym w dzielnicy Sultanahmet."},{"t":"Wielki Pałac pod dzielnicą","d":"**Przez tysiąc lat teren dzisiejszego Sultanahmet zajmował Wielki Pałac cesarzy - pawilony, ogrody, kaplice.** Po zdobyciu osmańskim ruiny tonęły pod nową zabudową; pożar 1912 odsłonił fragmenty, większość znów zabudowano.\n\nFragmenty mozaik i murów wciąż wychodzą przy remontach - miasto dosłownie mieszka na pałacu."},{"t":"Sfendone hipodromu","d":"**Słynny Hipodrom rozebrano na budulec we wczesnym okresie osmańskim; zostały zabytki na spinie.** Mało kto wie, że potężne fundamenty sfendone (zakrzywiony koniec) wciąż stoją i dźwigają późniejszą szkołę.\n\nPod spodem: duża, zachowana cysterna (ok. V w.), wciąż z wodą - sklepienia zamurowano po trzęsieniu."}],"conclusion":"Konstantynopol nie zniknął - został wmurowany w codzienne ściany Stambułu. Ryan zachęca: zejdź z głównego placu i czytaj warstwy cegły.","factchecks":[{"claim":"Wielki Pałac Konstantynopola leżał na obszarze dzisiejszego Sultanahmet.","verdict":"prawda","note":"Great Palace of Constantinople zajmował teren SE od Hagia Sophii / hipodromu.","p":1,"src":[["Wikipedia (ang.): Great Palace of Constantinople","https://en.wikipedia.org/wiki/Great_Palace_of_Constantinople"]]},{"claim":"Fundamenty sfendone hipodromu są nadal widoczne w Stambule.","verdict":"prawda","note":"Substruktury zakrętu hipodromu przetrwały i są znane w literaturze archeologicznej/turystycznej.","p":2,"src":[["Wikipedia (ang.): Hippodrome of Constantinople","https://en.wikipedia.org/wiki/Hippodrome_of_Constantinople"]]}],"bias":"Lekka promocja tourów i książki autora na końcu; fokus na \"ukryte\" kosztem pełnej chronologii dzielnicy."},{"id":"qoS5NDf3Xfk","title_pl":"Dr Maciej Mulak o prędkości światła: od latarni Galileusza po napęd warp","title":"Największe tajemnice czasu i przestrzeni || dr inż. Maciej Mulak","channel":"didaskalia","url":"https://www.youtube.com/watch?v=qoS5NDf3Xfk","date":"2026-08-09","duration":7216,"views":499020,"section":"Didaskalia","transcript":"youtube","added":"2026-11-03","tags":["Nauka","Fizyka","Historia nauki"],"about":"Fizyk z Politechniki Wrocławskiej opowiada, jak zmierzono prędkość światła, czemu jej nie przekroczymy i co z tego wynika dla podróży kosmicznych.","intro":"Dwugodzinna rozmowa Patrycjusza Wyżgi z dr. inż. Maciejem Mulakiem z Politechniki Wrocławskiej, współtwórcą projektu \"Fizyka bez zamulania\" (sierpień 2026). Pełna anegdot historia pomiarów prędkości światła, od Galileusza i Rømera po Michelsona, a dalej czasoprzestrzeń, eter, dualizm falowo-korpuskularny, napęd warp, tunele, AI i pytanie, czy jesteśmy sami.","points":[{"t":"Co znaczy, że nic nie jest szybsze","d":"Granica dotyczy przenoszenia informacji, energii i przyczyny. Fala meksykańska na stadionie może biec szybciej, a odległe galaktyki oddalają się szybciej od światła, bo puchnie sama przestrzeń jak ciasto z rodzynkami."},{"t":"Podróż przez czasoprzestrzeń","d":"Wszystko porusza się w czasoprzestrzeni z prędkością światła. Siedząc, podróżujemy tylko w czasie. Ruch w przestrzeni zużywa ten budżet, więc czas płynie wolniej, a we wzorach Einsteina przy c pojawia się dzielenie przez zero."},{"t":"Jak to jest szybko","d":"Ok. 300 000 km/s to ponad siedem okrążeń równika na sekundę. Światło biegnie od Słońca 8 min 20 s, a od galaktyki Andromedy 2,5 mln lat, więc patrzenie w niebo jest podróżą w przeszłość."},{"t":"Galileusz i latarnie","d":"Grecy uważali, że światło rozchodzi się natychmiast. Galileusz, członek Akademii Rysiów, zaproponował pomiar z dwiema latarniami na wzgórzach. Był odważny, ale metoda nie miała szans przy takiej prędkości."},{"t":"Rømer i księżyc Io","d":"W latach 70. XVII w. Rømer, zachęcony przez Cassiniego, zauważył opóźnienia zaćmień Io zależne od położenia Ziemi na orbicie. Uznał, że światło potrzebuje czasu na pokonanie średnicy orbity, ok. 300 mln km."},{"t":"Bradley i Michelson","d":"Bradley z aberracji gwiazd w XVIII w. uzyskał wynik bliski prawdziwemu. Kolejne pomiary, aż po Michelsona, dały dokładność bliską dzisiejszej. Dziś metr definiuje się przez prędkość światła: 299 792 458 m/s."},{"t":"Próżnia i eter","d":"Grecy bali się pustki. Torricelli pokazał, że słup rtęci 760 mm podtrzymuje ciśnienie powietrza, a nie niewidzialne sznurki. Skoro światło biegnie w próżni, wymyślono eter. Fizyka go odrzuciła, choć wciąż ma wyznawców."},{"t":"Falocząstka","d":"Newton: cząstki, Young i Fresnel: fale, Einstein i efekt fotoelektryczny: znów cząstki. Światło jest hybrydą, jak walec, który z jednej strony rzuca cień koła, a z drugiej prostokąta. Nasze szufladki do tego nie pasują."},{"t":"Czas to pieniądz","d":"Precyzyjny czas i światłowody liczą się np. na giełdzie: w handlu wysokich częstotliwości fizyczna odległość biura od serwerów giełdy, liczona w metrach światłowodu, decyduje o tym, kto zarobi."},{"t":"Warp i tunele","d":"Walka z prędkością światła to walka z geometrią czasoprzestrzeni. Napęd warp i tunele czasoprzestrzenne matematyka dopuszcza, ale potrzebują ujemnej energii, czyli materii egzotycznej, której nie znamy. Lokalny limit musi zostać."},{"t":"AI i wielka cisza","d":"Gość obawia się utraty ciągłości pojęciowej, gdy AI zacznie dawać rozwiązania, których nie zrozumiemy. O życiu w kosmosie mówi ostrożnie: biologiczne wąskie gardła mogą sprawiać, że inteligentne życie jest rzadkie."}],"conclusion":"Gawędziarska, pełna dygresji lekcja fizyki i historii nauki. Najlepsza dla tych, którzy lubią anegdoty bardziej niż wzory.","factchecks":[{"claim":"Einstein dostał Nobla za efekt fotoelektryczny, chyba w 1926 r.","verdict":"półprawda","note":"Powód się zgadza, ale była to nagroda za 1921 r., wręczona w 1922 r.","p":7,"src":[["Wikipedia (ang.): Albert Einstein - hasło \"Albert Einstein\"","https://en.wikipedia.org/wiki/Albert_Einstein"]]},{"claim":"Liniowa prędkość równika to ok. 1400 km/h.","verdict":"fałsz","note":"Na równiku to ok. 1675 km/h (obwód 40 075 km na dobę). Ok. 1400 km/h jest dopiero na ok. 33 stopniach szerokości.","p":null,"src":[["Wikipedia (ang.): obrót Ziemi - hasło \"Earth's rotation\"","https://en.wikipedia.org/wiki/Earth's_rotation"]]},{"claim":"Rømer zaniżył prędkość światła, uzyskując ok. 200 000 km/s.","verdict":"prawda","note":"Z jego ok. 11 minut na drogę od Słońca wychodzi ok. 220 000 km/s.","p":4,"src":[["Wikipedia (ang.): Ole Rømer - hasło \"Ole Rømer\"","https://en.wikipedia.org/wiki/Ole_Rømer"]]},{"claim":"Prędkość światła w próżni to 299 792 458 m/s.","verdict":"prawda","note":"Wartość dokładna, bo od 1983 r. definiuje ona metr.","p":5,"src":[["Wikipedia (ang.): prędkość światła - hasło \"Speed of light\"","https://en.wikipedia.org/wiki/Speed_of_light"]]}],"bias":"Brak stronniczości. Rozmowa bardzo gawędziarska, z licznymi dygresjami i drobnymi pomyłkami w datach i liczbach. Wątki o AI i obcych to opinie gościa."},{"id":"YTZ_nUQC6DA","title_pl":"Penny loafers: od norweskiego rybaka do Ivy League","title":"How a Norwegian Fisherman Created an American Classic (Penny Loafers)","channel":"Gentleman's Gazette","url":"https://www.youtube.com/watch?v=YTZ_nUQC6DA","date":"2026-08-09","duration":694,"views":15539,"section":"Moda","transcript":"youtube","added":"2026-11-06","tags":["Historia"],"about":"Gentleman's Gazette: historia mokasynów Weejun i penny loafer od Aurland i Tverangera po campusy lat 50.","intro":"Gentleman's Gazette tłumaczy, skąd wzięły się penny loafers - najbardziej amerykański but studentów Ivy League. Spoiler: DNA jest norweskie i robocze.\n\nOpowieść łączy fiord Aurland ok. 1910 (rybacy, mokre doki, problem zamarzających sznurówek) z kampusem 1955 (chino, marynarki, monety w pasku). Cel: pokazać, że ponadczasowy design wychodzi z funkcji, nie z trendu.","points":[{"t":"Tess z Aurland i Nils Tveranger","d":"**Norwescy rybacy nosili wsuwane tess: elastyczna skóra, łatwe zdejmowanie, przyczepność na mokrym drewnie.** Sznurówki na mrozie były katastrofą.\n\nNils Tveranger (ur. 1874) uczył się szewstwa w USA, wrócił ok. 1894 do Aurland i połączył lokalne wsuwki z cechami mokasynów rdzennych Amerykanów - najpierw jeszcze ze sznurówkami, potem coraz bliżej pure slip-on."},{"t":"Weejun i mit pensówki","d":"**Amerykański G.H. Bass spopularyzował model Weejun (od Norwegian); pasek ze szczeliną był dekoracją.** Legenda, że studenci wkładali pensy na telefon, jest według filmu fałszywa: rozmowa kosztowała więcej niż 2 centy, a automaty Bella nie brały pensów.\n\nBardziej wiarygodny motyw: miedziany błysk na oxbloodowej skórze. Nazwa penny loafer wygrała jako kategoria stylu East Coast casual."},{"t":"Dlaczego przetrwały","d":"**Konstrukcja mokasynowa daje elastyczność, której brakuje sztywnym eleganckim butom z termoplastikiem.** Dlatego te same buty działają w porcie, na kampusie i w biurze.\n\nPuenta GG: funkcjonalny design przeżywa modny, bo użyteczność nie czyta kalendarza trendów."}],"conclusion":"Penny loafer to but rybaka w garniturze smart casual. Szczelina na monetę zaczęła jako ozdoba; przetrwała konstrukcja, nie legenda o telefonie.","factchecks":[{"claim":"G.H. Bass Weejun spopularyzował norweski loafer w USA.","verdict":"prawda","note":"Weejuns są klasycznym amerykańskim penny loaferem inspirowanym norweskimi wsuwkami.","p":1,"src":[["Wikipedia (ang.): loafer (shoe)","https://en.wikipedia.org/wiki/Loafer_(shoe)"],["Wikipedia (ang.): G.H. Bass & Co.","https://en.wikipedia.org/wiki/G.H._Bass_%26_Co."]]},{"claim":"Aurland w Norwegii ma tradycję lokalnych loaferów.","verdict":"prawda","note":"Region Aurland jest znany z tradycyjnych norweskich slip-onów wiązanych z historią Weejun.","p":0,"src":[["Wikipedia (ang.): Aurland","https://en.wikipedia.org/wiki/Aurland"]]}],"bias":"Narracja romantyzuje rybaka i Ivy League; dyskusja o rdzennych mokasynach jest skrócona. Film kończy się lekką autopromocją stylizacji GG."},{"id":"ti2qiU_JTUQ","title_pl":"Dysk Eulera ma zły kształt (i co z tego)","title":"The Euler Disc Is The Wrong Shape","channel":"Steve Mould","url":"https://www.youtube.com/watch?v=ti2qiU_JTUQ","date":"2026-08-01","duration":1200,"views":1301653,"section":"Ciekawostki","transcript":"youtube","added":"2026-11-06","tags":["Nauka","Technika"],"about":"Steve Mould o tym, czemu gruby dysk kręci się długo, jak kształt i krawędź wpływają na spin i produkt Singularity Disc.","intro":"Steve Mould porównuje monetę, klasyczny \"Euler disc\" i tajemniczy dysk pośredni. Otwiera minutami nieciętego spinningu - świadomy protest przeciwko TikTokizacji uwagi.\n\nPotem wchodzi w fizykę: rozkład masy, zaokrąglenie krawędzi, straty energii i dlaczego stożek z wolframu byłby drogi. Na końcu własny Singularity Disc (preorder).","points":[{"t":"Dlaczego gruby dysk kręci się dłużej","d":"**Duży moment bezwładności i sposób kontaktu z podłożem opóźniają upadek w precesję.** Moneta pada szybko; gruby dysk \"śpiewa\" i zwalnia dramatycznie pod koniec (efekt Eulera).\n\nMould testuje intuicję, że rozmiar liniowo wydłuża czas - i pokazuje, że geometria krawędzi bywa ważniejsza."},{"t":"Kształt i krawędź","d":"**Zaokrąglenie krawędzi mocno zmienia zachowanie; przy większym dysku jedna strona jest bardziej round niż druga.** Rozkład masy (bliżej obwodu) pomaga, ale obróbka stożka z wolframu jest droga (materiał + skrawanie).\n\nStąd iteracje prototypów zamiast \"najcięższego możliwego\" metalu."},{"t":"Singularity i produkt","d":"**Autor żartuje o matematycznej osobliwości w geometrii zabawki i sprzedaje własny dysk w batchach po 300.** Transparentny preorder z datami dostaw.\n\nEdukacyjny trzon: małe zmiany kształtu = duże zmiany dynamiki tarcia i precesji."}],"conclusion":"Euler disc uczy, że \"oczywisty\" kształt nie jest optymalny. Mould łączy cierpliwość widza, fizykę kontaktu i - tak - własny produkt.","factchecks":[{"claim":"Efekt dysku Eulera to długie, przyspieszająco-zwalniające wirowanie dysku z charakterystycznym dźwiękiem.","verdict":"prawda","note":"Zjawisko opisane i popularnie demonstrowane jako Euler's disc.","p":0,"src":[["Wikipedia (ang.): Euler's disc","https://en.wikipedia.org/wiki/Euler%27s_disc"]]},{"claim":"Geometria krawędzi i rozkład masy wpływają na czas wirowania.","verdict":"prawda","note":"Straty energii zależą od kontaktu i momentu bezwładności - zgodnie z analizami dysku.","p":1,"src":[["Wikipedia (ang.): Euler's disc","https://en.wikipedia.org/wiki/Euler%27s_disc"]]}],"bias":"Duża część finału to preorder własnej zabawki Metmo; wnioski fizyczne są mimo to poprawne."},{"id":"cK0FhoO3w7U","title_pl":"Jak zrobić muzykę gier z lat 90. (tutorial)","title":"90s Video Game Music Tutorial","channel":"Alex Ball","url":"https://www.youtube.com/watch?v=cK0FhoO3w7U","date":"2026-07-30","duration":644,"views":51299,"section":"Technologie","transcript":"youtube","added":"2026-11-06","tags":["Technika"],"about":"Alex Ball pokazuje workflow emulacji soundtracków lat 90./2000 na JD-990 i XV-5080: sample rate, warstwy, automatyka.","intro":"Alex Ball uczy, jak odtworzyć estetykę muzyki gier komputerowych z lat 90. i wczesnych 2000. Powód praktyczny: coraz częściej dostaje zlecenia na spoof/hołd dla tych franczyz - stały się landmarkami kultury.\n\nTutorial opiera się na Rolandzie JD-990 (1993) i XV-5080: perkusja, basy, sekwencje, sample gitar, potem świadome \"zepsucie\" przez resampling niskim bitrate jak na kartridżach.","points":[{"t":"Ograniczenia pamięci kartridża","d":"**Godzinny soundtrack w wysokiej jakości zająłby setki MB - kartridże tego nie miały.** Stąd niskie sample rate i powtórne użycie banków z JD-990 / odpowiedników.\n\nBall najpierw buduje pełne patche, potem emuluje resampling, żeby dostać \"tani\" charakter epoki."},{"t":"Warstwy jak w Tekkenie i co.","d":"**Na XV-5080 (do 32 części multitimbral) składa bas z pitch-fallem, sync z tremolem głośności, mid i high sekwencje, organy i gitary power/funk.** Część brzmień według niego brzmi znajomo z konkretnych gier.\n\nAutomatyka głośności i rytmiczne wycinanie dają puls bez osobnego efektu sidechain."},{"t":"Po co to dziś","d":"**Muzyka z lat 90./2000 przestała być \"lekko nieaktualna\" - stała się cytatem kulturowym w TV i reklamach.** Ball wskazuje też Roland Cloud (JV-1080, XV-5080, JD) i scenę reverse-engineerującą JD-990.\n\nWniosek dla producentów: zestaw narzędzi + świadome ograniczenie jakości = wiarygodny pastisz."}],"conclusion":"Tutorial nie romantyzuje biedy bitów - pokazuje przepis: bogate warstwy analog-modelingu, potem celowe \"zabrudzenie\" jak na kartridżu. Stary dźwięk gier to dziś język cytatów, nie tylko nostalgia.","factchecks":[{"claim":"Roland JD-990 (1993) to rackowy syntezator/ROM-pler używany w produkcji lat 90.","verdict":"prawda","note":"JD-990 był flagowym rackiem serii JD, popularnym w studiach i gamedev-adjacent production.","p":0,"src":[["Wikipedia (ang.): Roland JD-990","https://en.wikipedia.org/wiki/Roland_JD-990"]]},{"claim":"XV-5080 oferuje rozbudowaną multitimbralność typową dla ROMplerów Rolanda.","verdict":"prawda","note":"XV-5080 to 128-głosowy / wielopartyjny sound module z końca lat 90./2000.","p":1,"src":[["Wikipedia (ang.): Roland XV-5080","https://en.wikipedia.org/wiki/Roland_XV-5080"]]}],"bias":"Workflow pod konkretny hardware Rolanda; inne ścieżki (trackery, VST chiptune) pominięte. Lekka promocja Roland Cloud."},{"id":"B3lGOPPBRFg","title_pl":"14 ćwiczeń na zdrowe i silne barki - przegląd fizjoterapeuty","title":"The Only 14 Shoulder Exercises You Ever Need!","channel":"Squat University","url":"https://www.youtube.com/watch?v=B3lGOPPBRFg","date":"2026-07-28","duration":884,"views":168165,"section":"Sport","transcript":"youtube","added":"2026-11-03","tags":["Barki","Prehab","Stożek rotatorów"],"about":"Dr Aaron Horschig ze Squat University omawia ćwiczenia na stożek rotatorów i łopatki, mówiąc, kiedy i po co je zaleca.","intro":"Fizjoterapeuta Aaron Horschig ze Squat University pokazuje ćwiczenia, które stosuje u sportowców z bólem barku, żeby wrócili do ciężkiego treningu. Zaczyna od krótkiej anatomii, potem omawia rotację zewnętrzną, mięsień nadgrzebieniowy i mięśnie łopatki. Przy każdym ćwiczeniu zwraca uwagę na typowe błędy.","points":[{"t":"Bark to zespół mięśni","d":"Przy unoszeniu ręki mięsień naramienny ciągnie kość ramienną w górę, a stożek rotatorów w dół i do środka. Gdy któryś nie działa albo łopatka porusza się nieskoordynowanie, rośnie ryzyko bólu. Samo wzmocnienie słabego mięśnia nie zawsze wystarczy."},{"t":"Rotacja zewnętrzna w leżeniu bokiem","d":"Łokieć zgięty pod kątem 90 stopni, przyciśnięty do żeber, najlepiej z ręcznikiem pod ramieniem. Tempo: 3 s w górę, pauza, 3 s w dół, zatrzymanie na poziomie równoległym. Główny błąd to odsuwanie łokcia od tułowia."},{"t":"Wersje z gumą","d":"Na stojąco potrzebny jest wyciąg lub guma, bo hantel przy tułowiu nie obciąża dobrze podgrzebieniowego. Nie ściągaj łopatek. Wersja W z małą gumą angażuje obie ręce naraz, z przytrzymaniem 5-10 s."},{"t":"Rotacja z ręką uniesioną","d":"Ćwiczenia przy tułowiu słabo przenoszą się na pozycję z ręką odwiedzioną. Dlatego potem rotacja z gumą z łokciem opartym na kolanie i przytrzymaniem 3-5 s, a dalej wersje w pozycji nad głową."},{"t":"Popularna rotacja z social mediów","d":"Dwa błędy: za duży ciężar i odrywanie łopatki przy opuszczaniu. Trzymaj łopatkę stabilnie i zatrzymaj ruch, gdy przód barku zaczyna się wysuwać. Brak rotacji wewnętrznej przeszkadza też w wyciskaniu na ławce."},{"t":"Full can zamiast empty can","d":"Na mięsień nadgrzebieniowy: unoszenie hantli kciukami w górę, około 30 stopni przed linią boczną. Autor odradza wersję kciukami w dół. Progresje to większy zakres, guma na nadgarstkach i \"lustrzane\" unoszenia: 8-10 ruchów jedną ręką, gdy druga trzyma pozycję."},{"t":"Mięśnie łopatki","d":"Pompka plus kończy się maksymalnym rozsunięciem łopatek, co mocno angażuje zębaty przedni. Wypychanie wyciągu lub sztangi z obrotem tułowia przenosi pracę z piersiowego na zębaty. Na dolny czworoboczny: unoszenie Y pod kątem 45 stopni, też w leżeniu."}],"conclusion":"Dobierz ćwiczenia do etapu: najpierw rotacja przy tułowiu, potem stabilność z ręką uniesioną, nadgrzebieniowy i mięśnie łopatki.","factchecks":[{"claim":"Rotacja zewnętrzna w leżeniu bokiem najmocniej aktywuje podgrzebieniowy i obły mniejszy.","verdict":"prawda","note":"W badaniu EMG Reinolda dała największą aktywność podgrzebieniowego (62% MVIC) i obłego mniejszego (67%).","p":1,"src":[["PubMed: Reinold i wsp. 2004 - \"Electromyographic analysis of the rotator cuff and deltoid musculature...\"","https://pubmed.ncbi.nlm.nih.gov/15296366/"]]},{"claim":"Pompka plus to jedno z ćwiczeń najmocniej aktywujących zębaty przedni.","verdict":"prawda","note":"Standardowa pompka plus dała najwyższą aktywację zębatego i najmniej czworobocznego górnego.","p":6,"src":[["PubMed: Ludewig i wsp. 2004 - \"Relative balance of serratus anterior and upper trapezius muscle activity...\"","https://pubmed.ncbi.nlm.nih.gov/14977678/"]]},{"claim":"Lepiej robić full can niż empty can.","verdict":"prawda","note":"Wg pracy z 2016 roku empty can wywołuje więcej bólu i ma gorszą biomechanikę niż full can.","p":5,"src":[["PubMed: Timmons i wsp. 2016 - \"Empty can exercise provokes more pain and has undesirable biomechanics...\"","https://pubmed.ncbi.nlm.nih.gov/26577128/"]]}],"bias":"Rzetelny przegląd oparty na badaniach EMG, bez sponsora. Autor zachęca do swoich innych filmów i programów rozgrzewki."},{"id":"yTvakY_xVJk","title_pl":"Dlaczego Rzymianie nigdy nie przekroczyli równika","title":"Why the Romans Could Never Cross the Equator","channel":"KhAnubis","url":"https://www.youtube.com/watch?v=yTvakY_xVJk","date":"2026-07-26","duration":711,"views":1143919,"transcript":"youtube","added":"2026-11-03","tags":["Historia","Geografia"],"about":"Jak starożytni wyobrażali sobie nieznany świat: strefa gorąca, ludy z Pliniusza, Rzym i Chiny oraz bariery dawnych odkrywców.","intro":"Autor tłumaczy, dlaczego granica znanego świata dla Rzymian była bardziej psychologiczna niż techniczna. Omawia teorię stref klimatycznych, wymyślone kontynenty i ludy-potwory z Pliniusza, wzajemne wyobrażenia Rzymu i Chin oraz wyprawy Hannona, Himilkona, Pyteasza i Gila Eanesa. Na koniec porównuje to z dzisiejszym patrzeniem na kosmos.","points":[{"t":"Strefa gorąca","d":"W V w. p.n.e. Parmenides podzielił Ziemię na 5 stref: 2 mroźne, 2 umiarkowane i gorącą przy równiku, gdzie nic nie przeżyje. Grecy i Rzymianie nie wiedzieli, że Sahara bywa gorętsza niż równik, a najdalej na południe znali okolice Somalii."},{"t":"Kontynenty z rozumowania","d":"Skoro na północy jest dużo lądu, na południu też musi być, dla równowagi: Rzymianie nazwali go Terra Australis Incognita. W II w. p.n.e. Krates z Mallos dodał 2 lądy na półkuli zachodniej, według autora jakby przewidując Ameryki."},{"t":"Ludy-potwory Pliniusza","d":"W Historii naturalnej (lata 70. n.e.) Pliniusz opisał Blemmiów bez głów z twarzą na piersi, psiogłowych Kynokefalów w Indiach, jednonogich Skiapodów i Astomów bez ust żywiących się zapachem, jako fakty. Herodot wcześniej umieszczał bezgłowych w Libii."},{"t":"Zniekształcone relacje","d":"Według autora część opisów to prawdziwe obserwacje zniekształcone przez głuchy telefon. Jedna z interpretacji mówi, że bezgłowi Blemmiowie to wojownicy kulący głowy za tarczami, widziani z daleka."},{"t":"Daqin, czyli Rzym oczami Chin","d":"Chińczycy nazywali Rzym Daqin (Wielkie Qin) i wyobrażali go sobie jako cnotliwe państwo z królem ustępującym w razie klęski. Autorowi przypomina to republikę z konsulami na rok."},{"t":"Gan Ying i morze szaleństwa","d":"W 97 r. n.e. poseł Gan Ying przez Azję Środkową i Partię dotarł do Tiaozhi nad wielkim morzem. Usłyszał, że przeprawa trwa 2-3 lata. Według autora Partowie to zmyślili, bo jako pośrednicy na Jedwabnym Szlaku nie chcieli bezpośredniego kontaktu Rzymu z Chinami."},{"t":"Rzymianie w Chinach w 166 r.","d":"Rzymska delegacja przypłynęła morzem przez Wietnam. Rzymskich dokumentów brak, ale chińskie kroniki wspominają posłów od Anduna: imię brzmi jak Antoninus Pius, a data wskazuje raczej na Marka Aureliusza."},{"t":"Hannon i Himilkon","d":"W V w. p.n.e. Kartagińczyk Hannon płynął wzdłuż Afryki, według badaczy do Senegalu lub Gabonu; jego \"owłosione kobiety\" dały nazwę gorylom. Himilkon popłynął na północ do Bretanii lub Brytanii za cyną, aż zatrzymały go mgły i wodorosty."},{"t":"Pyteasz i Thule","d":"Ok. 100 lat później Pyteasz z Massalii (Marsylii) dotarł za Brytanię do Thule, gdzie latem słońce prawie nie zachodzi, a morze zmienia się w \"płuco morskie\", według autora prawdopodobnie lód krupowy. Mogło to wzmacniać mit Hyperborei."},{"t":"Bariery na krańcu świata","d":"Ok. 1000 lat po Gan Yingu mnich Rabban Bar Sauma dotarł do Konstantynopola. Przylądek Bojador z rafami i wiatrami uchodził za kres żeglugi do 1434 r., gdy Gil Eanes po prostu go opłynął. Według autora wyprawy blokowały też koszty i ostrożni inwestorzy."}],"conclusion":"Eksploracja zależy od tego, kto odważy się płynąć i kto za to zapłaci; dziś tak samo patrzymy na kosmos.","factchecks":[{"claim":"Parmenides wymyślił podział Ziemi na strefy klimatyczne.","verdict":"prawda","note":"Według Strabona pierwszy był Parmenides, a teorię rozwinął Arystoteles.","p":0,"src":[["Wikipedia (ang.): strefy geograficzne - hasło \"Geographical zone\"","https://en.wikipedia.org/wiki/Geographical_zone"]]},{"claim":"Pustynie jak Sahara bywają gorętsze niż okolice równika.","verdict":"prawda","note":"Rekordy temperatur notuje się na pustyniach zwrotnikowych (Lut, Sahara, Dolina Śmierci), nie na równiku.","p":0,"src":[["Wikipedia (ang.): najwyższe temperatury na Ziemi - hasło \"Highest temperature recorded on Earth\"","https://en.wikipedia.org/wiki/Highest_temperature_recorded_on_Earth"]]},{"claim":"Krates z Mallos przewidywał dodatkowe lądy na drugiej półkuli.","verdict":"prawda","note":"Krates zbudował najstarszy znany globus z 4 masami lądu oddzielonymi oceanami.","p":1,"src":[["Wikipedia (ang.): Krates z Mallos - hasło \"Crates of Mallus\"","https://en.wikipedia.org/wiki/Crates_of_Mallus"],["Wikipedia (ang.): Terra Australis - hasło \"Terra Australis\"","https://en.wikipedia.org/wiki/Terra_Australis"]]},{"claim":"Pliniusz opisał bezgłowych Blemmiów, Kynokefalów, Skiapodów i Astomów.","verdict":"prawda","note":"Wszystkie te ludy są w Historii naturalnej (77-79 n.e.); Blemmiowie byli też realnym ludem na południe od Egiptu.","p":2,"src":[["Wikipedia (ang.): Blemmiowie - hasło \"Blemmyes\"","https://en.wikipedia.org/wiki/Blemmyes"],["Wikipedia (ang.): Astomowie - hasło \"Astomi\"","https://en.wikipedia.org/wiki/Astomi"],["Wikipedia (ang.): Historia naturalna Pliniusza - hasło \"Natural History (Pliny)\"","https://en.wikipedia.org/wiki/Natural_History_(Pliny)"]]},{"claim":"Gan Ying dotarł do Zatoki Perskiej, a Partowie go zniechęcili.","verdict":"półprawda","note":"Nie wiadomo, czy \"zachodnie morze\" to Zatoka Perska, Morze Śródziemne czy Czarne; wersja o Partach to hipoteza.","p":5,"src":[["Wikipedia (ang.): Gan Ying - hasło \"Gan Ying\"","https://en.wikipedia.org/wiki/Gan_Ying"]]},{"claim":"W 166 r. do Chin dotarli posłowie od Anduna z Daqin.","verdict":"prawda","note":"Notuje to Księga Późniejszych Hanów; Andun to Antoninus Pius lub Marek Aureliusz, rzymskich źródeł brak.","p":6,"src":[["Wikipedia (ang.): stosunki rzymsko-chińskie - hasło \"Sino-Roman relations\"","https://en.wikipedia.org/wiki/Sino-Roman_relations"]]},{"claim":"Hannon dotarł do Senegalu lub Gabonu i dał nazwę gorylom.","verdict":"półprawda","note":"Nazwa goryla pochodzi z jego relacji, ale zasięg wyprawy jest sporny: od Gabonu po samo południe Maroka.","p":7,"src":[["Wikipedia (ang.): Hannon Żeglarz - hasło \"Hanno the Navigator\"","https://en.wikipedia.org/wiki/Hanno_the_Navigator"],["Wikipedia (ang.): goryl - hasło \"Gorilla\"","https://en.wikipedia.org/wiki/Gorilla"]]},{"claim":"\"Płuco morskie\" Pyteasza to prawdopodobnie lód krupowy.","verdict":"nie da się sprawdzić","note":"Opis zna się tylko ze Strabona; badacze łączą go też z meduzami zwanymi płucami morskimi lub dryfującym lodem.","p":8,"src":[["Wikipedia (ang.): Pyteasz - hasło \"Pytheas\"","https://en.wikipedia.org/wiki/Pytheas"]]},{"claim":"Rabban Bar Sauma dotarł do Konstantynopola, a Gil Eanes opłynął Bojador w 1434 r.","verdict":"prawda","note":"Bar Sauma był w Konstantynopolu w 1287 r.; Eanes minął Bojador w 1434 r. po nieudanej próbie w 1433 r.","p":9,"src":[["Wikipedia (ang.): Rabban Bar Sauma - hasło \"Rabban Bar Sawma\"","https://en.wikipedia.org/wiki/Rabban_Bar_Sawma"],["Wikipedia (ang.): Gil Eanes - hasło \"Gil Eanes\"","https://en.wikipedia.org/wiki/Gil_Eanes"],["Wikipedia (ang.): przylądek Bojador - hasło \"Cape Bojador\"","https://en.wikipedia.org/wiki/Cape_Bojador"]]}],"bias":"Rzetelny i ostrożny film; uproszczenia przy hipotezach (Partowie, tarcze Blemmiów) i dość skrajny kontrast \"lękliwy Rzym kontra ufne Chiny\".","section":"Historia"},{"id":"T1-5Ic9iiPs","title_pl":"30 lat studiuję żywienie. Oto co naprawdę ma znaczenie","title":"I Studied Nutrition for 30 Years. Here’s What Actually Matters.","channel":"Nutrition Made Simple!","url":"https://www.youtube.com/watch?v=T1-5Ic9iiPs","date":"2026-07-25","duration":1249,"views":768847,"section":"Sport","transcript":"whisper","added":"2026-11-03","tags":["Ciało i zdrowie","Odżywianie","Mity"],"about":"Lekarz z kanału Nutrition Made Simple podaje 5 zasad, które pozwalają odsiać straszenie jedzeniem i zbudować zdrową dietę.","intro":"Dr Gil Carvalho z Nutrition Made Simple mówi, że sprzeczne porady w sieci uczą zadawać złe pytania. Sprowadza żywienie do 5 prostych zasad i pokazuje je na fasoli, owsie, tłuszczach, olejach i białku. Opowiada też, co sam je z rodziną.","points":[{"t":"1. Patrz na całego słonia","d":"Żywność to pakiet wielu składników, a jej efekt to suma ich działań. Lektyny w fasoli niszczy gotowanie, a badania na ludziach pokazują przy fasoli i owsie niższy cholesterol, lepszy cukier i mniej chorób serca."},{"t":"Makroskładnik sam nie jest dobry ani zły","d":"Węglowodany z owoców i strączków działają dobrze, a z napojów słodzonych i muffinów źle. Łosoś, kefir i oliwa mają tłuszcze nasycone, a dają dobre efekty; masło i olej kokosowy w dużych ilościach już nie."},{"t":"Oleje roślinne i białko","d":"Według autora badania na ludziach pokazują przy oleju rzepakowym lepsze wyniki krwi i mniejszą śmiertelność. Większość ludzi na Zachodzie je dość białka bez liczenia gramów, a spór roślinne kontra zwierzęce mija się z celem."},{"t":"2. Personalizacja dla chorych","d":"Celiakia, kamienie szczawianowe czy IBS wymagają osobnych zasad, ale nie dotyczą 99% ludzi. Jajka podnoszą u większości cholesterol o ok. 7 mg/dl, choć u niektórych dużo bardziej."},{"t":"Jedz pod swoje wyniki","d":"Ludzie różnie reagują na sól czy cholesterol z diety, więc warto dopasować dietę do badań krwi i ciśnienia. Skoki glukozy są ważne przy cukrzycy, nie u zdrowych."},{"t":"3. Zmiany chwilowe to nie choroba","d":"Po posiłku rośnie cukier i trójglicerydy, przy wysiłku ciśnienie. Problemem jest wartość stale wysoka, np. na czczo, a nie chwilowy wzrost."},{"t":"4. W porównaniu z czym?","d":"Każdy produkt wygląda dobrze lub źle zależnie od porównania. Masło kontra białe pieczywo nie zmienia ryzyka chorób serca, ale masło kontra oliwa czy owies już tak."},{"t":"5. Liczy się to, co jesz stale","d":"Zdrowie zależy od codziennego wzorca, nie od chipsów na pikniku. Najlepiej zbadana jest tradycyjna dieta śródziemnomorska: warzywa, owoce, strączki, pełne ziarna, oliwa, ryby, trochę nabiału."},{"t":"Uzupełnij braki","d":"Na diecie wegańskiej potrzebna jest witamina B12, a bez ryb, nabiału i soli jodowanej warto zadbać o jod."}],"conclusion":"Nie bój się pojedynczych składników; licz się z całym produktem, porównaniem i stałym wzorcem diety, dopasowanym do własnych wyników.","factchecks":[{"claim":"Cholesterol z diety (np. jajka) podnosi cholesterol we krwi u większości o ok. 7 mg/dl.","verdict":"prawda","note":"Metaanaliza Bergera i wsp. (2015) wykazała wzrost cholesterolu całkowitego o ok. 0,19 mmol/l, czyli ok. 7 mg/dl.","p":3,"src":[["PubMed: Berger i wsp. 2015 - \"Dietary cholesterol and cardiovascular disease\"","https://pubmed.ncbi.nlm.nih.gov/26109578/"]]},{"claim":"Olej rzepakowy poprawia wyniki krwi, np. cholesterol.","verdict":"prawda","note":"Metaanaliza z 2020 roku wykazała spadek cholesterolu całkowitego i LDL przy oleju rzepakowym.","p":2,"src":[["PubMed: metaanaliza 2020, olej rzepakowy - \"The effects of Canola oil on cardiovascular risk factors\"","https://pubmed.ncbi.nlm.nih.gov/33127255/"]]},{"claim":"Gotowanie niszczy szkodliwe lektyny w fasoli.","verdict":"prawda","note":"Fitohemaglutyninę w fasoli dezaktywuje gotowanie we wrzątku, ale nie wolne podgrzewanie w niskiej temperaturze.","p":0,"src":[["Wikipedia (ang.): lektyna fasoli - hasło \"Phytohaemagglutinin\"","https://en.wikipedia.org/wiki/Phytohaemagglutinin"]]},{"claim":"Dieta śródziemnomorska ma najwięcej dowodów, np. mniej chorób serca.","verdict":"prawda","note":"Badanie PREDIMED (NEJM 2018) wykazało ok. 30% mniej incydentów sercowo-naczyniowych.","p":7,"src":[["PubMed: PREDIMED, NEJM 2018 - \"Primary Prevention of Cardiovascular Disease with a Mediterranean Diet\"","https://pubmed.ncbi.nlm.nih.gov/29897866/"],["Wikipedia (ang.): dieta śródziemnomorska - hasło \"Mediterranean diet\"","https://en.wikipedia.org/wiki/Mediterranean_diet"]]},{"claim":"Weganie potrzebują źródła witaminy B12.","verdict":"prawda","note":"B12 występuje praktycznie tylko w produktach zwierzęcych, więc weganom zaleca się suplementację lub żywność wzbogacaną.","p":8,"src":[["Wikipedia (ang.): witamina B12 - hasło \"Vitamin B12\"","https://en.wikipedia.org/wiki/Vitamin_B12"]]}],"bias":"Spokojny, oparty na badaniach materiał. Autor mocno broni oleju rzepakowego, gdzie dowody są w dużej części obserwacyjne. Na końcu zachęta do zapisu na newsletter."},{"id":"4S1T6M7OhqU","title_pl":"Największe problemy inżynieryjne, jakie kiedykolwiek rozwiązano","title":"The Biggest Engineering Problems Ever Solved","channel":"Some Guy Who Knows Stuff","url":"https://www.youtube.com/watch?v=4S1T6M7OhqU","date":"2026-07-19","duration":1063,"views":789618,"section":"Technologie","transcript":"youtube","added":"2026-11-03","tags":["Technika","Historia"],"about":"Ranking 10 wielkich budów: od Kanału Panamskiego i Mostu Brooklińskiego po Wielki Zderzacz Hadronów i Międzynarodową Stację Kosmiczną.","intro":"Kanał Some Guy Who Knows Stuff układa ranking dziesięciu budów, które w swoich czasach uchodziły za niewykonalne. Każda zaczyna się od konkretnego problemu: statki płynęły prawie 13 000 km dookoła Ameryki Południowej, rzeka zalewała miasta, nikt nie wyleciał poza orbitę Ziemi.\n\nPrzy każdym miejscu autor opowiada ten sam schemat: dlaczego to było trudne, jaki pomysł inżynierów przełamał problem i co budowla daje dziś. Odliczanie idzie od Kanału Panamskiego do Międzynarodowej Stacji Kosmicznej i zmierza do tezy, że każdy taki projekt wymagał rozwiązań, których wcześniej nie było.","points":[{"t":"10. Kanał Panamski","d":"**Skrót między Atlantykiem a Pacyfikiem okazał się jedną z najtrudniejszych budów w historii.** Bez niego statki płynęły prawie 13 000 km wokół południowego krańca Ameryki Południowej. W latach 80. XIX w. Francuzi pod wodzą Ferdinanda de Lessepsa, twórcy Kanału Sueskiego, próbowali przekopać kanał jak w Egipcie, ale tropikalne deszcze zalewały wykopy, zbocza się osuwały, a malaria i żółta febra zabiły ponad 20 000 robotników. Firma zbankrutowała.\n\nUSA przejęły budowę w 1904 r. i zmieniły plan: zamiast kopać przez góry, zbudowały śluzy podnoszące statki ponad 25 m do sztucznego jeziora. Lekarze pod kierunkiem Williama Gorgasa osuszali stojącą wodę, by wybić komary. Od otwarcia w 1914 r. przeprawa trwa niecały dzień zamiast tygodni."},{"t":"9. Most Brookliński","d":"**Most nad East River w Nowym Jorku zbudowano, choć wielu ekspertów uważało to za niemożliwe.** Tysiące ludzi codziennie przeprawiały się promami między Manhattanem a Brooklynem, a pogodę, prądy i lód trudno było pokonać. Niemiecki inżynier John Augustus Roebling zaproponował most wiszący z najdłuższym przęsłem na świecie, na tyle wysoki, by przepływały pod nim żaglowce.\n\nWedług autora Roebling zginął w wypadku zaraz po starcie budowy w 1870 r. Jego syn Washington zapadł na chorobę dekompresyjną w kesonach (podwodnych komorach do budowy fundamentów) i kierował pracami z mieszkania przez teleskop. Żona Emily nauczyła się inżynierii i przekazywała jego polecenia na budowie. Most otwarto w 1883 r."},{"t":"8. Tunel pod kanałem La Manche","d":"**Wielką Brytanię i Francję połączył tunel pod jednym z najruchliwszych szlaków żeglugowych świata.** O tym pomyśle mówiono ponad 200 lat, ale brakowało technologii. Budowa ruszyła w 1988 r. z obu brzegów naraz, a maszyny drążące przecinały stabilną warstwę kredy pod dnem i od razu montowały betonową obudowę.\n\nW 1990 r. obie ekipy przebiły się do siebie po ponad 50 km wykopów, z błędem zaledwie kilku centymetrów. Od otwarcia w 1994 r. pociągi pasażerskie, towarowe i wahadłowe z samochodami przejeżdżają pod kanałem w około 35 minut."},{"t":"7. Zapora Hoovera","d":"**Tama na rzece Kolorado miała naraz okiełznać powodzie, dać wodę i prąd.** Rzeka zasilała w wodę miliony ludzi na amerykańskim południowym zachodzie, ale też niszczyła farmy i miasta. Budowa ruszyła w 1931 r., w czasie Wielkiego Kryzysu, a zanim powstała tama, całą rzekę trzeba było przekierować czterema tunelami w ścianach kanionu, w pustynnym upale.\n\nBetonu nie można było wylać naraz, bo stygłby ponad sto lat i popękał od własnego ciepła. Lano go więc w osobnych blokach z rurami chłodzącymi. Tama ma ponad 220 m, utworzyła Jezioro Mead i do dziś daje prąd kilku stanom."},{"t":"6. Lądowanie na Księżycu","d":"**W 1961 r. prezydent Kennedy obiecał lądowanie na Księżycu w ciągu dekady, choć nikt jeszcze nie wyleciał poza orbitę Ziemi.** Trzeba było zbudować statek, który przewiezie ludzi prawie 400 000 km i sprowadzi ich z powrotem. Odpowiedzią była rakieta Saturn V, wysoka na ponad 110 m.\n\nKomputer Apollo musiał zmieścić się w kapsule i być niezawodny, choć miał dużo mniejszą moc niż dzisiejszy smartfon. Nowych rozwiązań wymagały też skafandry, łączność na ogromne odległości i lądownik, który musiał wylądować na nieznanym gruncie i znów wystartować. Apollo 11 wylądował 20 lipca 1969 r."},{"t":"5. Burdż Chalifa","d":"**Najwyższy budynek świata w Dubaju wymagał walki z wiatrem, ciężarem i słabym gruntem.** Im wyższy wieżowiec, tym trudniej opanować wiatr, wahania temperatury i jego własną masę. Budowa ruszyła w 2004 r. Przekrój w kształcie litery Y rozkłada ciężar i osłabia siłę wiatru, co sprawdzano w tunelu aerodynamicznym, żeby wieża się niebezpiecznie nie kołysała.\n\nGrunt pod pustynnym Dubajem nie utrzymałby budynku, więc wbito prawie 200 betonowych pali pod ponad pół miliona ton. Opracowano też specjalny beton odporny na upały i sprzęt do pompowania go na rekordową wysokość. Ukończony w 2010 r. budynek ma 828 m."},{"t":"4. Kolej transkontynentalna w USA","d":"**Kolej przez cały kontynent skróciła podróż ze wschodu na zachód USA z miesięcy do około tygodnia.** W połowie XIX w. ludzie jechali na zachód wozami, konno albo statkiem, z brakami jedzenia i wody. Od 1863 r. dwie firmy budowały naprzeciw siebie: Central Pacific z Kalifornii na wschód przez góry Sierra Nevada, a Union Pacific na zachód przez Wielkie Równiny.\n\nW Sierra Nevada tunele wysadzano czarnym prochem, a potem silniejszą, ale bardzo niebezpieczną nitrogliceryną, a zimą przekopywano się przez śnieg. Kluczową rolę odegrały tysiące chińskich robotników. Linie spotkały się w 1869 r. w Promontory Summit w Utah, co uczczono wbiciem Złotego Kolca."},{"t":"3. Most Golden Gate","d":"**Most nad cieśniną w San Francisco miał wytrzymać silne prądy, mgłę, wiatr i trzęsienia ziemi.** Przez lata przez cieśninę pływały tylko promy, a wielu inżynierów uważało most za zbyt niebezpieczny. Joseph Strauss zaproponował most wiszący na prawie 2 km, wtedy najdłuższy na świecie.\n\nBudowa ruszyła w 1933 r. Siatka rozpięta pod mostem uratowała 19 robotników, którzy nazwali się \"Klubem Pół drogi do Piekła\". Most zaprojektowano tak, by uginał się pod wiatrem i przy wstrząsach, zamiast sztywno się opierać, i dzięki temu przetrwał dekady. Otwarto go w 1937 r."},{"t":"2. Wielki Zderzacz Hadronów","d":"**Fizycy potrzebowali maszyny, która odtworzy warunki tuż po Wielkim Wybuchu.** Powstał Wielki Zderzacz Hadronów (LHC), pierścień o długości 27 km pod granicą Francji i Szwajcarii, w którym tysiące magnesów nadprzewodzących kierują cząstkami pędzącymi niemal z prędkością światła.\n\nMagnesy działają tylko w temperaturze około -271°C, czyli zimniej niż w kosmosie, więc zbudowano jeden z największych systemów chłodzenia w historii. Cząstki lecą w rurach z próżnią rzadszą niż kosmiczna i po tysiącach okrążeń na sekundę muszą się precyzyjnie zderzyć. LHC działa od 2008 r., a w 2012 r. pomógł potwierdzić bozon Higgsa."},{"t":"1. Międzynarodowa Stacja Kosmiczna","d":"**Laboratorium zbudowano na orbicie, gdzie każdą śrubę i każdego człowieka trzeba wynieść rakietą.** Od 1998 r. stację składano z dziesiątek modułów z wielu krajów, przy prędkości prawie 28 000 km/h, przez spacery kosmiczne i roboty. Moduły wystrzelone w odstępie lat musiały do siebie pasować i działać jak jedna stacja, a statki różnych krajów musiały umieć się do niej przycumować.\n\nStacja stale odzyskuje powietrze i wodę, pilnuje temperatury, a prąd daje z paneli słonecznych. Jej orbitę trzeba regularnie podnosić, bo resztki atmosfery powoli ściągają ją w dół."}],"conclusion":"Według autora każde z tych osiągnięć zaczynało się od problemu uznawanego za nierozwiązywalny i wymagało wymyślenia czegoś nowego, od śluz po elastyczne mosty. Budowle wciąż działają, a doświadczenia z ISS pomagają dziś planować misje na Księżyc i docelowo na Marsa.","factchecks":[{"claim":"Podczas francuskiej próby budowy Kanału Panamskiego zmarło ponad 20 000 robotników.","verdict":"prawda","note":"Szacunki mówią o około 22 000 zgonów w latach 1881-1889, głównie z powodu chorób.","p":0,"src":[["Wikipedia (ang.): Kanał Panamski - hasło \"Panama Canal\"","https://en.wikipedia.org/wiki/Panama_Canal"]]},{"claim":"Budowa Mostu Brooklińskiego ruszyła w 1870 r., a Roebling zginął w wypadku budowlanym.","verdict":"półprawda","note":"Roebling zmarł na tężec w lipcu 1869 r., po wypadku przy pomiarach, czyli jeszcze przed startem budowy.","p":1,"src":[["Wikipedia (ang.): John A. Roebling - hasło \"John A. Roebling\"","https://en.wikipedia.org/wiki/John_A._Roebling"],["Wikipedia (ang.): Most Brookliński - hasło \"Brooklyn Bridge\"","https://en.wikipedia.org/wiki/Brooklyn_Bridge"]]},{"claim":"Tunel pod La Manche był w 1994 r. najdłuższym podmorskim tunelem świata.","verdict":"prawda","note":"Całością ustępuje tunelom Seikan i Gotthard, ale ma najdłuższy odcinek pod dnem morza.","p":2,"src":[["Wikipedia (ang.): tunel pod La Manche - hasło \"Channel Tunnel\"","https://en.wikipedia.org/wiki/Channel_Tunnel"]]},{"claim":"Beton Zapory Hoovera wylany naraz stygłby ponad sto lat.","verdict":"prawda","note":"Inżynierowie wyliczyli około 125 lat i pękanie, dlatego lano bloki chłodzone rurami z wodą.","p":3,"src":[["Wikipedia (ang.): Zapora Hoovera - hasło \"Hoover Dam\"","https://en.wikipedia.org/wiki/Hoover_Dam"]]},{"claim":"Komputer Apollo miał znacznie mniejszą moc obliczeniową niż współczesny smartfon.","verdict":"prawda","note":"AGC miał około 2 KB pamięci RAM i zegar około 1 MHz, czyli o rzędy wielkości mniej niż telefon.","p":4,"src":[["Wikipedia (ang.): komputer pokładowy Apollo - hasło \"Apollo Guidance Computer\"","https://en.wikipedia.org/wiki/Apollo_Guidance_Computer"]]},{"claim":"Burdż Chalifa ma 828 m i stoi na prawie 200 betonowych palach.","verdict":"prawda","note":"Fundament ma 192 pale o średnicy 1,5 m i długości 43 m.","p":5,"src":[["Wikipedia (ang.): Burdż Chalifa - hasło \"Burj Khalifa\"","https://en.wikipedia.org/wiki/Burj_Khalifa"]]},{"claim":"Siatka pod Golden Gate uratowała 19 robotników.","verdict":"prawda","note":"Uratowani utworzyli \"Half Way to Hell Club\".","p":7,"src":[["Wikipedia (ang.): most Golden Gate - hasło \"Golden Gate Bridge\"","https://en.wikipedia.org/wiki/Golden_Gate_Bridge"]]},{"claim":"Magnesy LHC chłodzi się do około -271°C, a w 2012 r. potwierdzono bozon Higgsa.","verdict":"prawda","note":"CERN podaje 1,9 K (-271,3°C); odkrycie ogłoszono 4 lipca 2012 r.","p":8,"src":[["CERN: Wielki Zderzacz Hadronów","https://home.cern/science/accelerators/large-hadron-collider"],["Wikipedia (ang.): Wielki Zderzacz Hadronów - hasło \"Large Hadron Collider\"","https://en.wikipedia.org/wiki/Large_Hadron_Collider"]]},{"claim":"ISS krąży z prędkością prawie 28 000 km/h, a budowę zaczęto w 1998 r.","verdict":"prawda","note":"Pierwszy moduł Zaria wystartował w listopadzie 1998 r.; prędkość orbitalna to około 28 000 km/h.","p":9,"src":[["Wikipedia (ang.): Międzynarodowa Stacja Kosmiczna - hasło \"International Space Station\"","https://en.wikipedia.org/wiki/International_Space_Station"]]}],"bias":"Rzetelny, ale powierzchowny przegląd: kolejność rankingu nie jest uzasadniona, a koszty ludzkie i spory (np. warunki pracy na kolei) ledwie wspomniane."},{"id":"mpmUHfohUYI","title_pl":"Roland JP-8000: maszyna trance i supersaw","title":"Roland JP-8000: The Trance Machine","channel":"Alex Ball","url":"https://www.youtube.com/watch?v=mpmUHfohUYI","date":"2026-07-16","duration":1205,"views":215133,"section":"Technologie","transcript":"youtube","added":"2026-11-06","tags":["Technika"],"about":"Alex Ball o Rolandzie JP-8000 (1996): supersaw, sekwencer fraz, porównanie z JD-800 i odpowiedź na Lead/Prophecy.","intro":"Alex Ball, kanał o historii syntezatorów, bierze na warsztat Rolanda JP-8000 z 1996 - instrument, który stał się synonimem trance dzięki falom supersaw.\n\nPokazuje kontekst lat 90. (powrót pokręteł po JD-800, konkurencja z Lead/Prophecy z 1995), rozkład oscillatorów i filtrów oraz rzadki prototyp z innego napisu na panelu.","points":[{"t":"Kontekst 1996 i nazwa JP","d":"**JP-8000 to 8-głosowy polysynth Rolanda; nazwa nawiązuje do klasycznego JP-8.** Wcześniej JD-800 przywrócił pokrętła na panel; rynek analog-modelingu nabierał tempa (Lead, Prophecy 1995).\n\nPóźniejszy rack JP-8080 dostał m.in. vocoder. Ball gra na pożyczonym egzemplarzu Andy'ego Bousa - w tym na prototypie."},{"t":"Supersaw i inne fale","d":"**Supersaw: wiele detunowanych pił, słodki punkt daje \"club heaven\" trance.** Ale synth ma też trójkąt z LFO, szum z filtrem, feedback (skok do mono), square z PWM, sync, ring i cross-mod - rzeczy mniej znane niż supersaw.\n\nFiltr: low-pass i high-pass. Instrument oferował też real-time phrase sequencing typowy dla epoki."},{"t":"Dziedzictwo trance","d":"**Dźwięk JP-8000 zdefiniował brzmienie europejskiego trance przełomu wieków.** Ball podkreśla, że warto eksplorować \"gnarne\" opcje poza jednym presetem supersaw.\n\nDla muzyków: to nie tylko nostalgia - to lekcja, jak jeden przebojowy waveform może zasłonić resztę architektury synthu."}],"conclusion":"JP-8000 wygrał historię supersawem, ale pod maską ma agresywny sync, ring i feedback. Ball zachęca: kręć dalej niż jednym pokrętłem detune.","factchecks":[{"claim":"Roland JP-8000 (1996) spopularyzował falę supersaw w muzyce trance.","verdict":"prawda","note":"Supersaw z JP-8000/8080 jest powszechnie cytowany jako kluczowy dźwięk trance lat 90./2000.","p":1,"src":[["Wikipedia (ang.): Roland JP-8000","https://en.wikipedia.org/wiki/Roland_JP-8000"],["Wikipedia (ang.): supersaw","https://en.wikipedia.org/wiki/Supersaw"]]},{"claim":"JP-8000 jest 8-głosowym syntezatorem wirtualno-analogowym Rolanda.","verdict":"prawda","note":"Oficjalna specyfikacja: 8-voice VA synth z 1996/97.","p":0,"src":[["Wikipedia (ang.): Roland JP-8000","https://en.wikipedia.org/wiki/Roland_JP-8000"]]}],"bias":"Entuzjastyczny ton kolekcjonera; demo na pożyczonym/prototypowym egzemplarzu może nie reprezentować każdego egzemplarza seryjnego."},{"id":"LUzZdtHhSqQ","title_pl":"Strony, których używają mądrzy ludzie, a przeciętni nigdy o nich nie słyszeli","title":"Websites Smart People Use That Average People Never Heard Of","channel":"Chill Dude Explains","url":"https://www.youtube.com/watch?v=LUzZdtHhSqQ","date":"2026-07-13","duration":669,"views":541911,"transcript":"whisper","added":"2026-11-03","tags":["Technika"],"about":"Top 10 mało znanych darmowych stron: od archiwum FBI i Shodana po mapy Wi-Fi, rejestry firm i wyszukiwarkę kodu źródłowego.","intro":"Ranking 10 stron, które według autora zna mało kto. Są wśród nich archiwum akt FBI, wyszukiwarka urządzeń w sieci Shodan, rejestry przesyłek i firm, mapa sieci Wi-Fi WiGLE, katalog narzędzi AI, mapa powiązań prac naukowych, pogoda Windy, wirtualne karty płatnicze i wyszukiwarka kodu stron. Autor mocno upraszcza i dramatyzuje.","points":[{"t":"10. FBI Vault","d":"Darmowe archiwum akt FBI (vault.fbi.gov) udostępnianych na mocy ustawy o dostępie do informacji (FOIA). Są tam akta Elvisa Presleya i Alberta Einsteina, a także memo z 1950 r. o 3 latających spodkach odzyskanych w Nowym Meksyku, w każdym 3 ciała o wzroście ok. 0,9 m."},{"t":"9. Shodan","d":"Wyszukiwarka urządzeń podłączonych do internetu: kamer, nianiek elektronicznych, sygnalizacji świetlnej, sterowników przemysłowych. Wiele działa bez hasła lub na fabrycznych ustawieniach. Według autora hakerzy weszli do sieci kasyna przez termometr akwarium i wynieśli 10 GB danych."},{"t":"8. ImportYeti","d":"Wyszukiwarka publicznych dokumentów celnych USA (konosamentów). Po nazwie firmy widać, która fabryka w Chinach czy Wietnamie robi jej produkty, z adresem, liczbą i wagą przesyłek. Można tak znaleźć dostawcę konkurencji albo odkryć, że droga marka i tania podróbka płyną z tej samej fabryki."},{"t":"7. OpenCorporates","d":"Według autora największa otwarta baza firm na świecie, z ponad 200 mln zarejestrowanych spółek. Pokazuje dane rejestrowe, dyrektorów, adresy i sieć powiązań między spółkami o tych samych dyrektorach lub adresach, np. łańcuch spółek holdingowych za lokalną restauracją."},{"t":"6. WiGLE","d":"Tworzona społecznie od 2001 r. mapa sieci Wi-Fi: wolontariusze zbierają nazwy sieci i współrzędne GPS podczas jazdy czy spacerów. Według autora baza ma ponad 1 mld unikalnych sieci, a na wigle.net często znajdziesz własny router i sieci sąsiadów."},{"t":"5. Futurepedia","d":"Stale aktualizowany katalog tysięcy narzędzi AI podzielonych na kategorie: logo, lektor z tekstu, pisanie i poprawianie kodu, stylista ze zdjęć. Pokazuje, które są darmowe, mają okres próbny i które zyskują popularność."},{"t":"4. Connected Papers","d":"Z jednej pracy naukowej buduje wizualną mapę powiązanych prac. Według autora wielkość kółka to liczba cytowań, a odległość to pokrewieństwo tematyczne. Widać prace założycielskie, najnowsze badania i głównych badaczy."},{"t":"3. Windy.com","d":"Darmowa mapa atmosfery w czasie rzeczywistym zamiast ikonki słońca i ok. 22°C w aplikacji. Pokazuje wiatr, prądy strumieniowe, huragany, fale, jakość powietrza, dym z pożarów, wyładowania i CO2; korzystają z niej piloci i żeglarze."},{"t":"2. Privacy.com","d":"Wirtualne numery kart do zakupów w sieci, osobny dla każdego sklepu i powiązany z kontem bankowym. Można ustawić limit, więc zapomniany okres próbny za 99 dolarów zostanie odrzucony, albo zrobić kartę jednorazową."},{"t":"1. PublicWWW","d":"Przeszukuje kod źródłowy milionów stron. Wklejając unikalny fragment, np. identyfikator Google Analytics, znajdziesz inne strony tej samej osoby lub grupy, nawet pod fałszywymi nazwami. Marketerzy sprawdzają tak narzędzia konkurencji, inni śledzą sieci oszukańczych stron."}],"conclusion":"Autor zapowiada podobne filmy i zachęca do subskrypcji.","factchecks":[{"claim":"Według filmu FBI uważało Elvisa za zagrożenie dla bezpieczeństwa USA.","verdict":"fałsz","note":"Te słowa pochodzą z listu obywatela do FBI z 1956 r.; Biuro nie prowadziło śledztwa w sprawie Elvisa.","p":0,"src":[["Archiwa Narodowe USA: Elvis w FBI i jego akta","https://text-message.blogs.archives.gov/2021/08/12/dont-be-cruel-elvis-presleys-visit-to-fbi-headquarters/"],["Wikipedia (ang.): akta FBI o Elvisie - hasło \"FBI files on Elvis Presley\"","https://en.wikipedia.org/wiki/FBI_files_on_Elvis_Presley"]]},{"claim":"Memo z 1950 r. o 3 spodkach z 3 ciałami jest prawdziwe.","verdict":"półprawda","note":"Dokument istnieje, ale FBI nazywa go relacją z drugiej lub trzeciej ręki, której nigdy nie sprawdzało.","p":0,"src":[["FBI Vault: memo Guya Hottela","https://vault.fbi.gov/hottel_guy"],["Wikipedia (ang.): memo Hottela i mistyfikacja z Aztec - hasło \"Hottel memo\"","https://en.wikipedia.org/wiki/Hottel_memo"]]},{"claim":"Kasyno straciło 10 GB danych przez termometr w akwarium.","verdict":"prawda","note":"Opisała to firma Darktrace w 2017 r.; dane trafiły na serwer w Finlandii. Film łączy to z Shodanem bez podstaw.","p":1,"src":[["SecurityWeek: akwarium wysłało 10 GB danych","https://www.securityweek.com/hacked-smart-fish-tank-exfiltrated-data-rare-external-destination/"]]},{"claim":"Shodan znajduje urządzenia w sieci, w tym kamery i sygnalizację.","verdict":"prawda","note":"Działa od 2009 r. i indeksuje kamery, routery i serwery; znajdowano nim m.in. sterowniki sygnalizacji.","p":1,"src":[["Wikipedia (ang.): wyszukiwarka Shodan - hasło \"Shodan (website)\"","https://en.wikipedia.org/wiki/Shodan_(website)"]]},{"claim":"ImportYeti pokazuje dokumenty celne każdej przesyłki do USA.","verdict":"półprawda","note":"Baza obejmuje setki milionów rekordów celnych, ale tylko import morski do USA, nie każdy transport.","p":2,"src":[["ImportYeti: wyszukiwarka rekordów celnych","https://www.importyeti.com/"],["Wikipedia (ang.): konosament - hasło \"Bill of lading\"","https://en.wikipedia.org/wiki/Bill_of_lading"]]},{"claim":"OpenCorporates ma dane ponad 200 mln firm.","verdict":"prawda","note":"W 2026 r. firma podaje ok. 220 mln spółek z ponad 147 jurysdykcji.","p":3,"src":[["OpenCorporates: komunikat z września 2026","https://blog.opencorporates.com/2026/09/03/opencorporates-achieves-iso-iec-277012025-certification/"],["Wikipedia (ang.): OpenCorporates - hasło \"OpenCorporates\"","https://en.wikipedia.org/wiki/OpenCorporates"]]},{"claim":"WiGLE działa od 2001 r. i ma ponad 1 mld sieci.","verdict":"prawda","note":"Pierwszą sieć dodano we wrześniu 2001 r.; statystyki WiGLE pokazują ponad 2 mld sieci Wi-Fi.","p":4,"src":[["WiGLE: statystyki bazy","https://wigle.net/stats"],["Wikipedia (ang.): WiGLE - hasło \"WiGLE\"","https://en.wikipedia.org/wiki/WiGLE"]]},{"claim":"W Connected Papers wielkość kółka to cytowania, a bliskość to podobieństwo.","verdict":"półprawda","note":"Układ opiera się na podobieństwie (współcytowania), nie na bezpośrednich cytowaniach; twórcy piszą, że to nie drzewo cytowań.","p":6,"src":[["Connected Papers: jak to działa","https://www.connectedpapers.com/about"]]},{"claim":"Privacy.com daje wirtualne karty z limitami i karty jednorazowe.","verdict":"prawda","note":"Tak działa usługa, ale tylko dla mieszkańców USA z amerykańskim kontem bankowym.","p":8,"src":[["Privacy.com: wirtualne karty","https://www.privacy.com/"]]},{"claim":"PublicWWW przeszukuje kod źródłowy stron.","verdict":"prawda","note":"Serwis szuka fragmentów w HTML, JavaScript i CSS stron.","p":9,"src":[["PublicWWW: wyszukiwarka kodu źródłowego","https://publicwww.com/"]]}],"bias":"Clickbaitowy tytuł; sensacyjne podanie akt FBI (Elvis, UFO) bez kontekstu, a narzędzia jak ImportYeti i Privacy.com działają głównie w USA.","section":"Chill Dude Explains"},{"id":"C7UoNZlUE2g","title_pl":"Najważniejsze wynalazki, o których mało myślisz","title":"The Most Important Inventions You Never Think About","channel":"Some Guy Who Knows Stuff","url":"https://www.youtube.com/watch?v=C7UoNZlUE2g","date":"2026-07-13","duration":984,"views":6932,"section":"Technologie","transcript":"youtube","added":"2026-11-04","tags":["Technika","Historia","Infrastruktura"],"about":"Some Guy Who Knows Stuff przypomina codziennym wynalazkom od spłukiwanej toalety po podmorskie kable internetu.","intro":"Film idzie od dziewiątego do pierwszego miejsca: spłukiwana toaleta i kanalizacja, lodówka, żarówka, winda, drut kolczasty, kontenerowiec, klimatyzacja, GPS i światłowody na dnie oceanów. Teza: rzeczy \"oczywiste\" cicho zmieniły zdrowie, miasta i handel.","points":[{"t":"Toaleta i kanalizacja","d":"Od rzymskich latryn po uszczelnienia wodne XVI-XIX w. i sieci kanalizacyjne. Odprowadzenie ścieków ograniczyło cholerę i dur w gęstych miastach."},{"t":"Lodówka","d":"Zamiast solenia i piwnic: XIX-wieczne systemy przemysłowe, potem domowe z bezpieczniejszymi czynnikami chłodniczymi. Zmieniła dietę, handel żywnością i przechowywanie szczepionek."},{"t":"Żarówka i winda","d":"Elektryczne światło wydłużyło dzień pracy i życie miast. Bezpieczna winda (hamulce przy zerwaniu liny) pozwoliła rosnąć budynkom w górę zamiast tylko wszerz."},{"t":"Drut kolczasty","d":"Tanie ogrodzenie wielkich areałów: kontrola bydła i granic własności na otwartych terenach; później też zastosowania wojskowe i graniczne."},{"t":"Kontener","d":"Standardowa skrzynia przenoszona statek-pociąg-ciężarówka bez rozładowywania towaru. Skróciła czas w portach i umożliwiła globalne łańcuchy dostaw."},{"t":"Klimatyzacja i GPS","d":"AC z fabryk i kin trafiło do domów i pozwoliło gęsto zasiedlać gorące regiony. GPS z satelitów daje pozycję i precyzyjny czas dla logistyki, lotnictwa i sieci."},{"t":"Podmorskie kable","d":"Światłowody na dnie oceanów przenoszą większość międzykontynentalnego internetu jako impulsy światła; kładzione specjalistycznymi statkami, w płytkich wodach często zakopywane."}],"conclusion":"Codzienna infrastruktura - od rur po kable na dnie morza - zwykle działa dopiero wtedy, gdy przestajemy o niej myśleć.","factchecks":[{"claim":"Kanalizacja i toalety ograniczyły epidemię cholery w miastach.","verdict":"prawda","note":"Reformy sanitarne XIX w. (np. Londyn po epidemiiach) wyraźnie obniżyły śmiertelność z chorób wodopochodnych.","p":0,"src":[["Wikipedia (ang.): cholera","https://en.wikipedia.org/wiki/Cholera"],["Wikipedia (ang.): historia kanalizacji - hasło \"History of water supply and sanitation\"","https://en.wikipedia.org/wiki/History_of_water_supply_and_sanitation"]]},{"claim":"Bezpieczeństwo wind Otisa otworzyło drogę wieżowcom.","verdict":"prawda","note":"Pokaz hamulca bezpieczeństwa Otisa (1853) zwiększył zaufanie do wind pasażerskich w wysokich budynkach.","p":2,"src":[["Wikipedia (ang.): winda - hasło \"Elevator\"","https://en.wikipedia.org/wiki/Elevator"],["Wikipedia (ang.): Elisha Otis","https://en.wikipedia.org/wiki/Elisha_Otis"]]},{"claim":"Konteneryzacja dramatycznie obniżyła koszty i czas przeładunku.","verdict":"prawda","note":"Od lat 50.-60. standardowe kontenery zredukowały pracę ręczną w portach i koszty frachtu.","p":4,"src":[["Wikipedia (ang.): kontenerowiec / konteneryzacja - hasło \"Containerization\"","https://en.wikipedia.org/wiki/Containerization"]]},{"claim":"Większość międzykontynentalnego internetu idzie podmorskimi światłowodami, nie satelitami.","verdict":"prawda","note":"Szacuje się, że ponad 95% ruchu międzykontynentalnego przechodzi kablami podmorskimi.","p":6,"src":[["Wikipedia (ang.): podmorskie kable komunikacyjne - hasło \"Submarine communications cable\"","https://en.wikipedia.org/wiki/Submar
