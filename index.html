owietrznym, zwykle zmorze inżynierów, odwiedza ogród Jonathana Deana z działającą pompą i buduje poprawioną wersję.","points":[{"t":"Poprawka błędu","d":"W filmie o wodzie rozwiązującej labirynty Mould tłumaczył zatrzymanie przepływu napięciem powierzchniowym. Widzowie, m.in. Corey Albers, wykazali na rysunkach, że winne są korki powietrzne."},{"t":"Korki się sumują","d":"W rurce z 3 odcinkami w kształcie U z wodą i 3 w kształcie odwróconego U z powietrzem każdy słup wody musi pchać kolejny. Żeby woda spłynęła, słup na wejściu musi być wyższy niż suma wszystkich przeszkód."},{"t":"Pompa Wirtza","d":"Ta sama zasada działa na korzyść w pompie spiralnej. Każdy łuk wody w spirali to korek oddzielający komory powietrza, a ich ciśnienia się dodają, więc wylot może być dużo wyżej niż sama pompa."},{"t":"Pierwsza wersja zawiodła","d":"Pompa Moulda podnosiła wodę słabo: powietrze przebijało się między komorami, a woda przelewała. Jedna praca naukowa podawała, że rura powinna mieć ok. 1,5 cm średnicy, ale nie tłumaczyła dlaczego."},{"t":"Pompa w ogrodzie","d":"Jonathan Dean ma pompę napędzaną kołem z łopatkami w rzece. Szeroki czerpak na końcu węża zapewnia pobór przy każdym poziomie wody, a obrotowe złącze wytrzymało ok. miliona obrotów w sezonie."},{"t":"Ani za wąsko, ani za szeroko","d":"W zbyt wąskiej rurze przeszkadza napięcie powierzchniowe, a w zbyt szerokiej powietrze przebija się przez korki zamiast tworzyć osobne porcje."},{"t":"Powietrze pomaga","d":"Między korkami wody wypychane jest też powietrze, a mieszanka wody i powietrza w rurze wylotowej jest lżejsza. Według Deana prawie podwaja to wysokość podnoszenia. Jego wylot jest 8 m nad rzeką i zasila ogród bagienny."},{"t":"Wpompowana rybka","d":"Dean znalazł kiedyś w zbiorniku rybkę, która trafiła tam jako narybek, przezimowała i urosła. Wypuścił ją z powrotem do rzeki."},{"t":"Druga wersja","d":"Nowa spirala ma szerszą rurę i nie sięga środka, więc wszystkie zwoje mają podobny obwód. W krótkich zwojach wewnętrznych porcja wody wypełnia cały obwód, co powoduje przelewanie."},{"t":"Działa","d":"Kręcona ręcznie pompa podnosi wodę i przelewa ją przez wspornik nad odpływem. Przy zbyt szybkim obracaniu słup wody się załamuje."},{"t":"Sponsor","d":"Ostatnie minuty to reklama Incogni, usługi wysyłającej brokerom danych żądania usunięcia danych osobowych."}],"conclusion":"Korki powietrzne, które blokują przepływ w labiryncie, sumują się w pompie Wirtza i pozwalają podnieść wodę wysoko bez prądu.","factchecks":[{"claim":"Pompa spiralna, zwana pompą Wirtza, podnosi wodę wyżej niż wynosi jej rozmiar.","verdict":"prawda","note":"Ze szczelnym złączem obrotowym podnosi wodę zwykle na 5-10 m; jej wadą jest mała wydajność.","p":[2,6],"src":[["Wikipedia (ang.): pompowanie wody - hasło \"Water pumping\"","https://en.wikipedia.org/wiki/Water_pumping"]]},{"claim":"Korek powietrzny może całkowicie zatrzymać przepływ cieczy w rurze.","verdict":"prawda","note":"Gaz uwięziony w wysokim punkcie rury ogranicza lub zatrzymuje przepływ.","p":[0,1],"src":[["Wikipedia (ang.): korek powietrzny - hasło \"Air lock\"","https://en.wikipedia.org/wiki/Air_lock"]]},{"claim":"Mieszanka powietrza i wody prawie podwaja wysokość podnoszenia.","verdict":"przesada","note":"Lżejszy słup mieszanki pozwala podnieść wodę wyżej, ale ile, zależy od proporcji; podwojenie to szacunek Deana.","p":6,"src":[["Wikipedia (ang.): pompowanie wody - hasło \"Water pumping\"","https://en.wikipedia.org/wiki/Water_pumping"]]}],"bias":"Rzetelny; Mould otwarcie poprawia własny błąd. Pod koniec długa reklama Incogni."},{"id":"jduDyF2Zwd8","title_pl":"Czy prąd naprawdę płynie do ziemi?","title":"Where Does Grounded Electricity Actually Go?","channel":"Practical Engineering","url":"https://www.youtube.com/watch?v=jduDyF2Zwd8","date":"2023-08-01","duration":1175,"views":7948111,"section":"Ciekawostki","transcript":"youtube","added":"2026-11-03","tags":["Nauka","Technika"],"about":"Practical Engineering tłumaczy uziemienie: prąd nie płynie do ziemi, tylko przez nią, z powrotem do źródła.","intro":"Generator na izolowanym stojaku i przewód fazowy wbity w ziemię: czy popłynie prąd? Grady Hillhouse z Practical Engineering wyjaśnia, po co uziemia się sieci, czemu ziemia to kiepski, ale ogromny przewód, czym są napięcie krokowe i dotykowe, jak działają linie z powrotem przez ziemię i czym różni się od tego piorun.","points":[{"t":"Masa to punkt odniesienia","d":"Napięcie to zawsze różnica potencjałów między dwoma punktami. W małych układach, np. zabawkach na baterie, \"masa\" to tylko umowne zero, bez związku z ziemią pod stopami."},{"t":"Sieć bez uziemienia","d":"Trójfazowa sieć bez połączenia z ziemią przy zwarciu jednej fazy z ziemią często działa dalej, bo silniki i transformatory są podłączone między fazami. Ale napięcie pozostałych faz względem ziemi rośnie prawie dwukrotnie, a to oznacza droższą izolację."},{"t":"Zabezpieczenia potrzebują prądu","d":"W sieci nieuziemionej przy zwarciu do ziemi płynie bardzo mały prąd, a niemal wszystkie zabezpieczenia, od bezpieczników po przekaźniki w sieci, wykrywają awarię po dużym prądzie zwarciowym."},{"t":"Przykład tostera","d":"Gdy faza dotknie metalowej obudowy tostera, przewód ochronny daje drogę o małej oporności. Płynie duży prąd i wyłącznik odcina obwód, zanim ktoś zostanie porażony."},{"t":"Przez ziemię, nie do ziemi","d":"W sieci uziemionej przy zwarciu fazy nie zmieniają potencjału, a prąd wraca przez ziemię do źródła. Odpowiedź na pytanie z tytułu: prąd prawie nigdy nie płynie do ziemi, tylko przez nią; ziemia to po prostu kolejny, choć słaby przewód."},{"t":"Pokaz z piaskiem","d":"Suchy piasek prawie nie przewodzi; zalany wodą z kranu przepuszcza ok. 0,1 A. Dopiero dodatek słonej wody zapala żarówkę, bo oporność gruntu zależy od wilgoci, temperatury i elektrolitów."},{"t":"Napięcie krokowe","d":"Wokół elektrody potencjał spada warstwami, najszybciej tuż przy niej. Stojąc tam, każda noga ma inny potencjał i prąd płynie przez ciało, dlatego monterom zaleca się odskakiwać od awarii na jednej nodze."},{"t":"Ochrona w stacjach","d":"Projektanci liczą dopuszczalne napięcia krokowe i dotykowe. Stacje mają siatki zakopanych przewodów zamiast jednej elektrody i nawierzchnię z tłucznia, który słabo przewodzi i nie zatrzymuje wody."},{"t":"Ziemia jako przewód powrotny","d":"Sieci SWER na terenach wiejskich używają jednego przewodu i ziemi jako powrotu. Linia prądu stałego Pacific DC Intertie ma w Oregonie ponad 1000 elektrod w pierścieniu o obwodzie 3,2 km, a w Kalifornii elektrody w Pacyfiku."},{"t":"Skutki uboczne","d":"Prąd stały w ziemi zakłóca kompasy i ryby wrażliwe na pole magnetyczne, jak łososie i węgorze, a w morzu elektroliza tworzy m.in. chloroform. Prądy błądzące, także z szyn kolejowych, przyspieszają korozję rurociągów."},{"t":"Piorun i prądy telluryczne","d":"Piorun to wyładowanie elektryczności statycznej, które naprawdę płynie do ziemi albo z niej; uziemienie daje mu bezpieczną drogę. Pod ziemią płyną też naturalne prądy telluryczne wywołane m.in. przez wiatr słoneczny."}],"conclusion":"Prąd nie znika w ziemi: zawsze wraca do źródła, a ziemia jest tylko jedną z dróg.","factchecks":[{"claim":"W sieci nieuziemionej zwarcie fazy z ziemią podnosi napięcie pozostałych faz prawie dwukrotnie.","verdict":"prawda","note":"Rośnie do pierwiastka z 3 (ok. 1,73) wartości normalnej, czyli do napięcia międzyfazowego.","p":1,"src":[["Wikipedia (ang.): uziemienie punktu neutralnego - hasło \"Earthing system\"","https://en.wikipedia.org/wiki/Earthing_system"]]},{"claim":"Przy awarii do ziemi powstają groźne napięcia krokowe i dotykowe.","verdict":"prawda","note":"Analiza zwarć pozwala ocenić te napięcia i dobrać środki ochrony, np. siatki uziemiające.","p":[6,7],"src":[["Wikipedia (ang.): potencjał ziemi - hasło \"Earth potential rise\"","https://en.wikipedia.org/wiki/Earth_potential_rise"]]},{"claim":"SWER to systemy z jednym przewodem i powrotem przez ziemię dla terenów wiejskich.","verdict":"prawda","note":"Są szeroko używane m.in. w Australii, Nowej Zelandii i krajach afrykańskich.","p":8,"src":[["Wikipedia (ang.): SWER - hasło \"Single-wire earth return\"","https://en.wikipedia.org/wiki/Single-wire_earth_return"]]},{"claim":"Pacific DC Intertie ma w Oregonie ponad 1000 elektrod w pierścieniu o obwodzie 3,2 km.","verdict":"prawda","note":"W Rice Flats leży 1067 anod żeliwnych w pierścieniu o obwodzie 3255 m; w Kalifornii elektrody są w oceanie.","p":8,"src":[["Wikipedia (ang.): Pacific DC Intertie - hasło \"Pacific DC Intertie\"","https://en.wikipedia.org/wiki/Pacific_DC_Intertie"]]}],"bias":"Rzetelny, z bezpiecznie pokazanymi doświadczeniami i ostrzeżeniem, by ich nie powtarzać; na końcu reklama sponsora."},{"id":"li1hF9l-hr4","title_pl":"Artur Chmielewski z NASA JPL: asteroidy, małe satelity i szansa Polski w kosmosie","title":"Polak w NASA - szef misji kosmicznych Artur Chmielewski - didaskalia #odc13","channel":"didaskalia","url":"https://www.youtube.com/watch?v=li1hF9l-hr4","date":"2023-06-04","duration":6494,"views":539738,"section":"Didaskalia","transcript":"youtube","added":"2026-11-03","tags":["Kosmos","Technologie","Nauka"],"about":"Polski inżynier z JPL opowiada o obronie przed asteroidami, Teleskopie Webba, poszukiwaniu życia i o tym, czemu małe statki to szansa dla Polski.","intro":"Rozmowa Patrycjusza Wyżgi z Arturem Chmielewskim, kierownikiem projektów w Jet Propulsion Laboratory NASA (czerwiec 2023). Od drogi z Polski do NASA i elektrycznego samochodu sprzed 40 lat, przez osłonę Teleskopu Webba, panikę wokół asteroidy Apophis i misje na Europę i Tytana, po pomysł polskiej misji na Marsa i rolę małych satelitów w gospodarce.","points":[{"t":"Era małych statków","d":"Kiedyś misje kosmiczne kosztowały miliardy, jak łazik Perseverance za ok. 2,5 mld dolarów. Dziś mały satelita może kosztować dziesiątki tysięcy dolarów, więc w kosmos wchodzą uniwersytety i małe firmy."},{"t":"Apophis i panika 2004","d":"Zespół Paula Chodasa w JPL wyliczył w 2004 r. kilkuprocentowe ryzyko zderzenia z 340-metrową asteroidą Apophis. W 2029 r. przeleci ok. 31 tys. km nad Ziemią, bliżej niż satelity geostacjonarne."},{"t":"Jak bronić się przed asteroidą","d":"Trzy etapy: znaleźć obiekt i jego trajektorię, zbadać, czy to kupa gruzu, metal czy lód, i dopiero wtedy odchylić. Gość projektuje z francuską agencją CNES misję, która radarowo prześwietli wnętrze asteroidy."},{"t":"DART po filmach","d":"Budżet biura obrony planetarnej długo starczał tylko na konferencje. Według gościa popularność filmów o zagładzie pomogła w finansowaniu, a DART była pierwszą misją, która sprawdziła odchylenie asteroidy."},{"t":"Osłona Teleskopu Webba","d":"Teleskop musiał mieć osłonę termiczną wielkości kortu tenisowego, za ciężką z aluminium. Chmielewski, specjalista od ultralekkich struktur, zbudował pierwszy model z folii, składany jak origami."},{"t":"Samochód elektryczny 40 lat temu","d":"Po przyjeździe do USA i pracy w przemyśle motoryzacyjnym trafił do JPL, gdzie budowano elektryczny samochód na bazie technologii kosmicznych. Projekt zamknięto listem z podziękowaniem, za wcześnie na swoje czasy."},{"t":"Europa i Tytan","d":"Pod lodem księżyca Jowisza Europy jest prawdopodobnie ocean, a na Tytanie są jeziora metanu i etanu oraz woda pod powierzchnią. Tam poleci dron Dragonfly. W europejskiej misji do Jowisza biorą udział Polacy."},{"t":"Satelity dla Kataru","d":"Katar ma za mało wody teraz i może jej mieć za dużo w przyszłości, bo spora część kraju leży nisko. JPL prowadzi dla Qatar Foundation misję obserwacji wody z orbity."},{"t":"Polska misja na Marsa","d":"Pomysł małego polskiego orbitera, pierwszego takiego na Marsie, bo dwa cubesaty MarCO tylko przeleciały obok. Tu NASA wypełniałaby luki w polskiej misji. Gość zachęca Polaków do budowy kolejnych helikopterów marsjańskich."},{"t":"Kosmos napędza gospodarkę","d":"Polska wydaje ok. 50 mln dolarów rocznie na składkę w ESA, ale te pieniądze wracają w kontraktach dla polskich firm. Technologie kosmiczne, jak GPS, napędzają produkty warte miliardy."},{"t":"Życie w kosmosie","d":"Planet podobnych do Ziemi jest dużo, więc statystycznie życie powinno być częste. Badając inne planety, np. to, jak Mars stracił wodę, uczymy się o Ziemi. Znana materia to tylko ok. 5% wszechświata."}],"conclusion":"Barwna, optymistyczna opowieść praktyka z NASA. Sporo anegdot, liczby podawane z pamięci, a wątki o Polsce to apel gościa.","factchecks":[{"claim":"W 2004 r. szansa zderzenia Apophisa z Ziemią wynosiła 4%.","verdict":"przesada","note":"Najwyższe oszacowanie z 27 grudnia 2004 r. to 2,7%. Później zderzenie w 2029 r. wykluczono.","p":1,"src":[["Wikipedia (ang.): Apophis - hasło \"99942 Apophis\"","https://en.wikipedia.org/wiki/99942_Apophis"]]},{"claim":"Apophis ma 340 m i w 2029 r. przeleci ok. 31 tys. km nad Ziemią.","verdict":"prawda","note":"Średnica ok. 340 m, przelot 13 kwietnia 2029 r. ok. 31 600 km nad powierzchnią.","p":1,"src":[["Wikipedia (ang.): Apophis - hasło \"99942 Apophis\"","https://en.wikipedia.org/wiki/99942_Apophis"]]},{"claim":"Przy Marsie były dwa małe statki MarCO, które tylko przeleciały obok.","verdict":"prawda","note":"Dwa cubesaty MarCO wystartowały w 2018 r. razem z lądownikiem InSight i wykonały przelot obok Marsa.","p":8,"src":[["Wikipedia (ang.): MarCO - hasło \"Mars Cube One\"","https://en.wikipedia.org/wiki/Mars_Cube_One"]]}],"bias":"Gość mówi też o wojnie i szpiegostwie, te wątki pominąłem. Wyraźnie promuje polski sektor kosmiczny i swoją książkę. Liczby podaje z pamięci."},{"id":"nFRjHgk2XS0","title_pl":"Najlepsze ćwiczenia core? Nauka stabilności tułowia","title":"Best 3 Core Exercises? (Core Stability Science Explained)","channel":"E3 Rehab","url":"https://www.youtube.com/watch?v=nFRjHgk2XS0","date":"2023-05-21","duration":1373,"views":325532,"section":"Sport","transcript":"youtube","added":"2026-11-04","tags":["Ciało i zdrowie","Siłownia","Trening"],"about":"E3 Rehab: czym jest core i stabilność, związek z bólem pleców oraz jak trenować - compoundy, izolacje i zadania.","intro":"Na podstawie dużej ankiety klinicystów i trenujących E3 Rehab pokazuje, że \"core\" i \"core stability\" nie mają jednej definicji. Omawia rolę tułowia, mit wyizolowanego poprzecznego brzucha, McGill Big 3, związek z bólem krzyża (O'Sullivan, Lederman) oraz praktykę: przysiady i martwe ciągi plus izolacje anti-extension/rotation według celu.","points":[{"t":"Czym jest core","d":"Brak konsensusu nawet wśród 15 ekspertów (2014). Trendy: dolny brzuch i lędźwie; obszar miednica-żebra; albo też biodra i barki. Autor: albo precyzuj definicję, albo traktuj termin jako nieostry, albo go rzuć."},{"t":"Rola i \"stabilność\"","d":"Zgoda co do funkcji: stabilność, postawa, transfer sił, oddychanie, ochrona narządów. Core stability bywa synonimem sztywności i \"neutral spine\", choć lędźwie i tak uginają się w przysiadzie/martwym nawet przy lekkim obciążeniu."},{"t":"Od Bergmarka do Big 3","d":"Wczesne prace wypchnęły poprzeczny brzuch jako klucz; później bracing całości okazał się skuteczniejszy niż same hollowing. Stąd popularność McGill Big 3 (bird dog, side plank, curl-up), ale nie ma \"jednej najlepszej\" metody."},{"t":"Core a ból pleców","d":"Literatura często nie pokazuje prostego związku przyczynowego. O'Sullivan dziś często zaleca rozluźnienie zamiast ciągłego napinania. Lederman: \"myth of core stability\". Ćwiczenia mogą pomagać przez analgezję ruchu, pewność siebie i ekspozycję, nie magiczne \"wzmocnienie w 1 serii\"."},{"t":"Czego nie robić","d":"Nie brace'uj przez cały dzień. Nie musisz robić Big 3 codziennie. Żadne ćwiczenie nie jest dowodnie nadrzędne w leczeniu bólu. Świadome napinanie zostaw na ciężkie przysiady/martwe, nie na spacer."},{"t":"Jak trenować","d":"Jak inne mięśnie: progressive overload, regeneracja, siła/moc/wytrzymałość/kontrola. Fundament: wolne ciężary (przysiad, martwy, olimpijskie, rotacje) - Behm 2010. Niestabilne podłoże pogarsza siłę/moc, gdy to cel główny."},{"t":"Izolacje z sensem","d":"Ramy: zginanie/prostowanie/rotacja/skłon, izometria vs dynamika (np. plank = anti-extension). Przykłady: crunches na hipertrofię, reverse hyper pod martwy, hollow + deadlift jako kontrast, medball throws przy samej sagitalnej pracy maszyn."},{"t":"Specyfika zadania","d":"Willardson 2004: najlepszy transfer równowagi i \"core\" do sportu to samo zadanie na tej samej nawierzchni. Same \"core drills\" nie mają mocnych dowodów na poprawę wyników sportowych ponad zwykły RT."}],"conclusion":"Core to nie mistyczna siła: trenuj tułów jak resztę ciała, nie bój się ruchu i nie brace'uj 24/7.","factchecks":[{"claim":"Eksperci nie zgadzają się, które mięśnie tworzą \"core\".","verdict":"prawda","note":"Termin jest nieostry w literaturze klinicznej i treningowej; definicje różnią się zakresem anatomicznym.","p":0,"src":[["Wikipedia (ang.): core (anatomia/trening) - hasło \"Core (anatomy)\"","https://en.wikipedia.org/wiki/Core_(anatomy)"]]},{"claim":"Bracing wielu mięśni tułowia jest skuteczniejszy niż izolowane hollowing TVA.","verdict":"prawda","note":"Współczesne podejścia preferują globalne napinanie pod obciążeniem zamiast samej aktywacji poprzecznego.","p":2,"src":[["Wikipedia (ang.): mięsień poprzeczny brzucha - hasło \"Transverse abdominal muscle\"","https://en.wikipedia.org/wiki/Transverse_abdominal_muscle"],["Wikipedia (ang.): Stuart McGill - hasło \"Stuart McGill\"","https://en.wikipedia.org/wiki/Stuart_McGill"]]},{"claim":"Brak prostego związku przyczynowego core stability z bólem krzyża.","verdict":"półprawda","note":"Ból krzyża jest wieloczynnikowy; ćwiczenia pomagają wielu osobom, ale nie przez jedną \"niestabilność\" do naprawienia.","p":3,"src":[["Wikipedia (ang.): ból krzyża - hasło \"Low back pain\"","https://en.wikipedia.org/wiki/Low_back_pain"]]},{"claim":"Niestabilne podłoże nie jest optymalne, gdy celem jest hipertrofia/siła/moc.","verdict":"prawda","note":"Prace Behna wskazują spadek generowanej siły i mocy na niestabilnym podłożu.","p":5,"src":[["Wikipedia (ang.): ćwiczenia brzucha (kontekst treningu tułowia) - hasło \"Abdominal exercise\"","https://en.wikipedia.org/wiki/Abdominal_exercise"],["Wikipedia (ang.): ćwiczenie izometryczne - hasło \"Isometric exercise\"","https://en.wikipedia.org/wiki/Isometric_exercise"]]}],"bias":"Edukacyjny ton E3 Rehab; mało \"jednej listy top 3\". Reklamy produktów brak. Długi survey-format może rozmywać konkretne zalecenia treningowe."},{"id":"HDre_o2qz1o","title_pl":"Prof. Andrzej Dragan o sztucznej inteligencji, granicach fizyki i wierze","title":"Hodujemy gatunek, który będzie dominował nad nami intelektem: prof. Andrzej Dragan - didaskalia #7","channel":"didaskalia","url":"https://www.youtube.com/watch?v=HDre_o2qz1o","date":"2023-04-23","duration":6704,"views":2272247,"section":"Didaskalia","transcript":"youtube","added":"2026-11-03","tags":["Nauka","Fizyka","Sztuczna inteligencja"],"about":"Fizyk prof. Andrzej Dragan w rozmowie z Patrycjuszem Wyżgą o AI jako konkurencyjnym gatunku, paradoksie Fermiego i pomyłkach wielkich fizyków.","intro":"Prawie 2-godzinna rozmowa w programie didaskalia z kwietnia 2023 r. Prof. Andrzej Dragan z Wydziału Fizyki UW i Narodowego Uniwersytetu Singapuru tłumaczy, dlaczego nie umie wyobrazić sobie dobrego zakończenia rozwoju sztucznej inteligencji, czemu odrzuca wiarę w pracy naukowej, i opowiada o zasadzie najmniejszego działania, kwantowej grawitacji oraz o tym, jak mylili się najwybitniejsi.","points":[{"t":"AI jak konkurencyjny gatunek","d":"Gatunki rzadko giną od drapieżników, częściej przez konkurenta sprawniejszego w zdobywaniu tych samych zasobów. Dragan uważa, że hodujemy konkurenta w jedynej dziedzinie, która dała nam przewagę: w intelekcie."},{"t":"Nie wiemy, jak to działa","d":"Ludzie nie wymyślili algorytmów, tylko metodę ich wyszukiwania: uczenie maszynowe drobnymi poprawkami szuka modelu, a tego, co znajdzie, nikt nie rozumie. Wstrzymanie rozwoju uważa za niestabilne, bo pierwszy, kto się wyłamie, zyska przewagę."},{"t":"Zawody i nauka","d":"Jako przykład podaje bazy zdjęć stockowych, prostą publicystykę i proste programowanie. Wspomina, że twórcy AlphaFold z DeepMind dostali Breakthrough Prize w naukach o życiu, i nie wyklucza końca zawodu fizyka."},{"t":"Równowaga jak wilki i zające","d":"Algorytmy potrzebują energii i serwerów, za które ktoś musi płacić, więc masowe bezrobocie nie byłoby stanem równowagi. Według Dragana raczej przestaniemy być stroną dominującą, a mamuty czy rude wiewiórki pokazują, jak to się kończy."},{"t":"Ostrzeżenia zignorowane","d":"Dawniej mówiono, by nie podłączać takiego systemu do internetu i nie uczyć go ludzkiej psychologii. Według niego zrobiono dokładnie to: chatbot uczy się na tekstach ludzi i rozmawia z milionami."},{"t":"Życie i definicje","d":"Granica między życiem a nieżyciem jest płynna, jak w przypadku wirusów. Definicje niewiele wnoszą, liczy się zrozumienie zjawiska. Jego główną motywacją jest ciekawość."},{"t":"Wiara i nauka","d":"Wszechświat jest ogromny, więc teza o naszej wyjątkowości wydaje mu się naiwna. Argument z dostrojenia porównuje do dawnego argumentu z budowy oka, który obalił Darwin. Wiarę eliminuje z pracy, bo upór w intuicjach gubił wielkich fizyków."},{"t":"Paradoks Fermiego","d":"Życie zbudowane jest z pospolitych pierwiastków i pojawiło się na Ziemi szybko po jej ostygnięciu, ale do inteligencji zdolnej nadawać sygnały minęły miliardy lat. Dragan nie zna odpowiedzi, dlaczego nikogo nie widzimy."},{"t":"Horyzont kosmologiczny","d":"Ekspansja Wszechświata przyspiesza, więc coraz większa część jest nieosiągalna nawet dla światła. Podkreśla, że w nauce mamy przesłanki (ang. evidence), a nie dowody, a prawa fizyki są zapewne tymczasowe."},{"t":"Pomyłki wielkich","d":"Planckowi odradzano fizykę, bo była prawie skończona, a Michelson, urodzony w Strzelnie, nie wierzył w nowe odkrycia. Einstein mylił się co do fal grawitacyjnych. Kwantowa grawitacja od 100 lat czeka na teorię, którą da się sprawdzić."},{"t":"Zasada najmniejszego działania","d":"Cząstka nie wie, którą drogę wybrać, tylko w ujęciu kwantowym idzie wszystkimi naraz, a interferencja wzmacnia drogę o najmniejszym działaniu. Dragan opowiada też o Hamiltonie, który zbliżył się do falowej natury materii."}],"conclusion":"Dragan jest pesymistą co do AI i sceptykiem co do pewności w nauce, ale widzi w ciekawości i metodzie naukowej najlepsze, co mamy.","factchecks":[{"claim":"Twórcy AlphaFold z DeepMind dostali Breakthrough Prize w naukach o życiu.","verdict":"prawda","note":"Demis Hassabis i John Jumper otrzymali ją za 2023 r.; w 2024 r. dostali też Nobla z chemii.","p":2,"src":[["Wikipedia (ang.): Demis Hassabis - hasło \"Demis Hassabis\"","https://en.wikipedia.org/wiki/Demis_Hassabis"]]},{"claim":"Planckowi odradzano studiowanie fizyki, bo była prawie skończona.","verdict":"prawda","note":"W 1878 r. Philipp von Jolly mówił Planckowi, że fizyka jest bliska ostatecznej formy.","p":9,"src":[["Wikipedia (ang.): Max Planck - hasło \"Max Planck\"","https://en.wikipedia.org/wiki/Max_Planck"]]},{"claim":"Albert Michelson był fizykiem polskiego pochodzenia.","verdict":"prawda","note":"Urodził się w 1852 r. w Strzelnie (wówczas Prusy) w rodzinie polskich Żydów.","p":9,"src":[["Wikipedia (ang.): Albert Michelson - hasło \"Albert A. Michelson\"","https://en.wikipedia.org/wiki/Albert_A._Michelson"]]},{"claim":"We Wszechświecie jest ok. 10^18 planet.","verdict":"fałsz","note":"Sam Dragan mówi bodajże. Szacuje się do 10^24 gwiazd w obserwowalnym Wszechświecie, więc planet jest raczej o rzędy więcej.","p":6,"src":[["Wikipedia (ang.): obserwowalny Wszechświat - hasło \"Observable universe\"","https://en.wikipedia.org/wiki/Observable_universe"]]},{"claim":"Ropucha agi wprowadzona do Australii do walki ze szkodnikami sama stała się plagą.","verdict":"prawda","note":"Sprowadzono ją z Hawajów w 1935 r. do zwalczania chrząszczy na plantacjach trzciny cukrowej.","p":3,"src":[["Wikipedia (ang.): ropucha agi w Australii - hasło \"Cane toads in Australia\"","https://en.wikipedia.org/wiki/Cane_toads_in_Australia"]]}],"bias":"Rozmowa z wyraźnymi, osobistymi opiniami Dragana o AI i religii, które sam nazywa ograniczeniem wyobraźni. Prognozy o AI to spekulacje, nie wyniki badań."},{"id":"8mbNnky8UPQ","title_pl":"Jak dobrać i nosić męską koszulę","title":"Jak dobrać i nosić koszulę męską? Jak powinna leżeć koszula (do jeansów / marynarki) | Dandycore","channel":"Dandycore","url":"https://www.youtube.com/watch?v=8mbNnky8UPQ","date":"2023-04-09","duration":595,"views":20607,"section":"Moda","transcript":"youtube","added":"2026-11-03","tags":["Styl","Koszula","Dopasowanie"],"about":"Dawid z kanału Dandycore wyjaśnia, jak wybrać krój, rozmiar, długość i tkaninę koszuli, żeby od razu wyglądać lepiej.","intro":"Według Dawida z Dandycore koszula to królowa męskiej garderoby, bo dobrze dobrana od razu poprawia wygląd. Z humorem omawia kroje, rozmiar, kołnierzyk, długość, rękawy i tkaniny. Daje też proste testy do zrobienia w przymierzalni.","points":[{"t":"Trzy kroje","d":"Classic lub regular fit jest luźny i wychodzi z mody. Slim fit (też modern lub contemporary fit) idzie za linią ciała, a zaszewki z tyłu usuwają efekt żagla; autor poleca go na start. Skinny fit ogranicza ruch i łatwo się gniecie."},{"t":"Rozmiar","d":"Za duża koszula wisi, dodaje kilogramów, a szew ramienia wypada poniżej barku. Za mała rozciąga się na plisie i odsłania skórę. Dobra podkreśla sylwetkę i pozwala się schylić, by zawiązać but."},{"t":"Test kołnierzyka","d":"Zapnij górny guzik i włóż palec wskazujący między szyję a kołnierzyk. Jeden palec z lekkim luzem to dobrze, więcej to za luźno."},{"t":"Długość w spodniach i na wierzch","d":"Koszula w spodniach poprawia proporcje i wydłuża nogi; przy marynarce to konieczność. Do spodni: z przodu do krocza, z tyłu za pośladki. Na wierzch: krótsza, do końca rozporka, z zaokrąglonym dołem."},{"t":"Rękawy i mankiety","d":"Mankiet sięga przegubu i dość ściśle przylega. Dwa guziki obok siebie na mankiecie pozwalają zmienić obwód, np. by schować pod nim zegarek."},{"t":"Materiał i tkanina","d":"Materiał to surowiec, tkanina to sposób jego obróbki. Bawełna nadaje się na większość roku, len i wiskoza na upały, choć bardzo się gniotą; zimą wełna, flanela lub sztruks."},{"t":"Rodzaje bawełny","d":"Popelina jest zbita, sztywna i odporna na gniecenie. Oxford jest tkany koszykowo, grubszy, ale bardziej przewiewny. Zefir przypomina len, a twill ma wyraźny skośny splot."}],"conclusion":"Najpierw dopasuj krój i rozmiar, potem kołnierzyk, długość i rękawy, a na końcu wybierz tkaninę pod porę roku.","factchecks":[{"claim":"Oxford ma splot koszykowy, przez co jest grubszy.","verdict":"prawda","note":"Oxford ma splot koszykowy 2x1: pojedyncza nić wątku przechodzi nad i pod parami nici osnowy.","p":6,"src":[["Wikipedia (ang.): tkanina oxford - hasło \"Oxford (cloth)\"","https://en.wikipedia.org/wiki/Oxford_(cloth)"]]},{"claim":"Len bardzo łatwo się gniecie.","verdict":"prawda","note":"Skłonność do gniecenia to znana cecha lnu, opisana też w Wikipedii.","p":5,"src":[["Wikipedia (ang.): len - hasło \"Linen\"","https://en.wikipedia.org/wiki/Linen"]]},{"claim":"Twill ma wyraźną skośną strukturę.","verdict":"prawda","note":"Twill to jeden z trzech podstawowych splotów, z charakterystycznymi ukośnymi prążkami.","p":6,"src":[["Wikipedia (ang.): splot skośny - hasło \"Twill\"","https://en.wikipedia.org/wiki/Twill"]]}],"bias":"Praktyczny i zabawny poradnik. W środku reklama własnego sklepu z odzieżą używaną kanału."},{"id":"SHDnfz8EKSs","title_pl":"Trzy zapomniane rzymskie megaprojekty","title":"Three Forgotten Roman Megaprojects","channel":"toldinstone","url":"https://www.youtube.com/watch?v=SHDnfz8EKSs","date":"2023-03-31","duration":690,"views":1098897,"section":"Historia","transcript":"youtube","added":"2026-11-03","tags":["Historia","Technika"],"about":"Tunel Klaudiusza pod jeziorem Fucino, droga Trajana przez Żelazną Bramę na Dunaju i ukryty port Agryppy nad jeziorem Averno.","intro":"Garrett Ryan z toldinstone pokazuje 3 mniej znane dzieła rzymskiej inżynierii. Tunel, którym Klaudiusz chciał osuszyć jezioro Fucino, drogę i most Trajana przy Żelaznej Bramie na Dunaju oraz port wojenny, który Agryppa ukrył w kraterze wulkanu pod Neapolem. Każdy z nich ma swoją dramatyczną historię i smutny koniec.","points":[{"t":"Skala Rzymu","d":"Imperium obejmowało według autora czwartą część ludzkości, a Rzym był największym miastem świata aż do XIX w. Rzymianie przewozili 100-tonowe obeliski, a pył z ich kopalni srebra osiadł nawet w lodzie Grenlandii."},{"t":"Jezioro bez odpływu","d":"Jezioro Fucino ok. 80 km na wschód od Rzymu otaczały żyzne pola, ale bez naturalnego odpływu jego poziom to zalewał, to odsłaniał wsie. Dopiero Klaudiusz kazał przebić 300-metrową górę wapienną dzielącą je od rzeki Liri oddalonej o 8 km."},{"t":"Tunel Klaudiusza","d":"30 tys. ludzi przez 11 lat drążyło tunel o wysokości 3 m, szerokości 1,5 m i długości 5,6 km, z 40 pionowymi szybami do wentylacji i wyciągania urobku. Według autora był najdłuższym tunelem świata aż do końca XIX w."},{"t":"Dwa nieudane otwarcia","d":"Na otwarcie Klaudiusz urządził bitwę morską 19 tys. niewolników i skazańców. Dno tunelu okazało się za wysoko i woda nie odpływała; po pogłębieniu woda runęła tak gwałtownie, że rzeka zalała ucztę i cesarz ledwo uszedł z życiem."},{"t":"Osuszone dopiero w XIX w.","d":"Tunel działał kilka stuleci, ale w późnej starożytności się zatkał i jezioro wróciło. Mimo prób w średniowieczu i renesansie osuszono je dopiero w połowie XIX w., z pomocą koparek parowych i materiałów wybuchowych."},{"t":"Żelazna Brama Dunaju","d":"Na granicy dzisiejszej Serbii i Rumunii Dunaj przeciska się między klifami dwóch pasm górskich i do budowy zapór w XX w. tworzył groźne bystrza. Przed wyprawą na Dację Trajan kazał poprowadzić tam drogę wojskową."},{"t":"Droga w skale i nad wodą","d":"Połowę drogi wykuto w ścianie klifu, a resztę oparto na belkach wystających nad nurt. Inżynierowie upamiętnili to inskrypcją Tabula Traiana, a wzdłuż drogi wykopano kanały, by łodzie omijały bystrza."},{"t":"Most Trajana","d":"Poniżej wąwozu stanął największy most starożytności: 20 filarów wznoszących się 18 m nad wodą i drewniane kratownice z jezdnią dłuższą niż 1 km. Filary przetrwały do średniowiecza, fundamenty wysadzono na początku XX w., a resztę zalał zbiornik."},{"t":"Ukryty port Agryppy","d":"Wojując z Sekstusem Pompejuszem, Oktawian potrzebował osłoniętego portu. Agryppa połączył kanałami jezioro Lucrino z morzem i z jeziorem Averno w kraterze wulkanu, tworząc port niewidoczny dla wrogich patroli."},{"t":"Tunele i flota","d":"Inżynier Lucjusz Kokcejusz Auktus przebił tunele przez okoliczne wzgórza, z których Grotta di Cocceio miała prawie 1 km i mieściła 2 wozy obok siebie. Agryppa wyszkolił tam 20 tys. ludzi i w 36 r. p.n.e. pokonał Sekstusa pod Naulochos."},{"t":"Koniec pod nowym wzgórzem","d":"Flota szybko przeniosła się do Misenum. W 1538 r. erupcja w ciągu 2 dni usypała wzgórze Monte Nuovo, zasypując większość jeziora Lucrino; ruiny portu wciąż widać nad Averno."}],"conclusion":"Rzymianie budowali z rozmachem, ale nawet ich megaprojekty pokonały muł, rzeki, wojny i wulkany.","factchecks":[{"claim":"Rzymski ołów i srebro zostawiły ślady w lodzie Grenlandii.","verdict":"prawda","note":"Badanie rdzeni lodowych z 2018 r. pokazało wzrost zanieczyszczeń ołowiem z wydobycia srebra w czasach Rzymu.","p":0,"src":[["PNAS: zanieczyszczenie ołowiem w lodzie Grenlandii (McConnell i in., 2018)","https://doi.org/10.1073/pnas.1721818115"]]},{"claim":"Tunel Klaudiusza miał 5,6 km i był najdłuższy aż do końca XIX w.","verdict":"prawda","note":"Ma ok. 5,65 km; dłuższe tunele pojawiły się dopiero w XIX w., np. kolejowy Fréjus (1871).","p":2,"src":[["Wikipedia (ang.): jezioro Fucino - hasło \"Fucine Lake\"","https://en.wikipedia.org/wiki/Fucine_Lake"]]},{"claim":"Na otwarcie Klaudiusz urządził bitwę morską 19 tys. walczących, a powódź zalała ucztę.","verdict":"prawda","note":"Tak opisuje to Tacyt (Roczniki XII); liczba 19 tys. pochodzi z jego relacji.","p":3,"src":[["Wikipedia (ang.): naumachia - hasło \"Naumachia\"","https://en.wikipedia.org/wiki/Naumachia"]]},{"claim":"Most Trajana miał 20 filarów i ponad 1 km długości.","verdict":"prawda","note":"Miał ok. 1135 m i 20 filarów; przez ponad 1000 lat był najdłuższym mostem łukowym świata.","p":7,"src":[["Wikipedia (ang.): most Trajana - hasło \"Trajan's Bridge\"","https://en.wikipedia.org/wiki/Trajan%27s_Bridge"],["Wikipedia (ang.): Tabula Traiana - hasło \"Tabula Traiana\"","https://en.wikipedia.org/wiki/Tabula_Traiana"]]},{"claim":"Port Agryppy łączył jeziora Averno i Lucrino, a w 36 r. p.n.e. flota wygrała pod Naulochos.","verdict":"prawda","note":"Portus Iulius zbudowano w 37 r. p.n.e.; bitwa pod Naulochos odbyła się we wrześniu 36 r. p.n.e.","p":[8,9],"src":[["Wikipedia (ang.): Portus Julius - hasło \"Portus Julius\"","https://en.wikipedia.org/wiki/Portus_Julius"],["Wikipedia (ang.): bitwa pod Naulochos - hasło \"Battle of Naulochus\"","https://en.wikipedia.org/wiki/Battle_of_Naulochus"]]},{"claim":"Erupcja w 1538 r. usypała wzgórze Monte Nuovo wysokie na ok. 180 m.","verdict":"przesada","note":"Monte Nuovo ma ok. 132 m n.p.m.; powstało w ciągu kilku dni we wrześniu 1538 r.","p":10,"src":[["Wikipedia (ang.): Monte Nuovo - hasło \"Monte Nuovo\"","https://en.wikipedia.org/wiki/Monte_Nuovo"]]}],"bias":"Rzetelny i barwny; drobne zawyżenia (wysokość Monte Nuovo) i lekko kpiący ton wobec Klaudiusza."},{"id":"SnIS9Ozo7NM","title_pl":"Starożytne teorie spiskowe","title":"Ancient Conspiracy Theories","channel":"toldinstone","url":"https://www.youtube.com/watch?v=SnIS9Ozo7NM","date":"2022-10-21","duration":1005,"views":1540369,"section":"Historia","transcript":"youtube","added":"2026-11-03","tags":["Historia","Psychologia"],"about":"Trzy starożytne teorie spiskowe: okaleczenie hermów w Atenach, rzekome otrucie Aleksandra Wielkiego i rzymska nagonka na manichejczyków.","intro":"Garrett Ryan z toldinstone opowiada o trzech teoriach spiskowych ze starożytności. Najpierw afera hermów w Atenach w 415 r. p.n.e. i oskarżenia wobec Alkibiadesa, potem plotka, że Aleksandra Wielkiego otruto trucizną od Arystotelesa, na koniec edykt Dioklecjana, który uznał manicheizm za perski spisek.","points":[{"t":"Spiski i teorie spiskowe","d":"Starożytność zna wiele prawdziwych spisków, np. Katyliny, Pizona przeciw Neronowi czy \"spisek barbarzyński\" na Brytanię. Teorie o tajnej organizacji pociągającej za sznurki pojawiały się według autora głównie w czasach ostrych kryzysów."},{"t":"Alkibiades","d":"Najgłośniejszy polityk Aten: błyskotliwy, czarujący i bez skrupułów, z rodu Peryklesa. Zasłynął agresywną polityką wobec Sparty i wystawieniem aż 7 kosztownych rydwanów na igrzyskach w Olimpii, ale jego rozwiązłe życie budziło nieufność."},{"t":"Okaleczenie hermów","d":"Wiosną 415 r. p.n.e., tuż przed wyprawą na Sycylię, prawie wszystkim hermom w Atenach (kamiennym słupom z głową boga i fallusem) odbito nosy i fallusy. Uznano to za świętokradztwo i zły znak, a w mieście zrodziła się teoria o tajnej kliki chcącej obalić ustrój."},{"t":"Oskarżenie bez dowodów","d":"Śledztwo ujawniło też parodiowanie misteriów eleuzyjskich, w którym miał brać udział Alkibiades. Pod jego nieobecność plotka urosła do spisku arystokratów; gdy w pobliżu pojawił się mały oddział Spartan, uznano, że to wezwali spiskowcy, a Alkibiadesa wezwano na proces."},{"t":"Ofiara teorii spiskowej","d":"Według autora parodia misteriów jest możliwa, ale Alkibiades nie miał powodu obalać ustroju, który właśnie dał mu dowództwo. Zamachy oligarchów były realnym zagrożeniem, w kolejnych latach doszło do 2."},{"t":"Śmierć Aleksandra","d":"Aleksander zmarł w Babilonie 10 czerwca 323 r. p.n.e. w wieku 32 lat po 10 dniach gorączki, która zaczęła się po zakrapianej uczcie. Późniejsza wersja dodawała dramatyczny krzyk bólu przy piciu z pucharu."},{"t":"Trucizna od Arystotelesa","d":"Plotka głosiła, że Antypater wysłał syna Jollasa, by wlał królowi truciznę z wód Styksu, przygotowaną przez Arystotelesa i przewiezioną w kopycie muła. Arystoteles miał motyw: Aleksander stracił jego siostrzeńca Kallistenesa."},{"t":"Krwawe rozliczenia","d":"Olimpias straciła kilku rzekomych spiskowców i kazała rozrzucić kości Jollasa. Kassander zabił ją i zostawił ciało bez pochówku, a mówcy Hyperejdesowi, który chciał uhonorować Jollasa, wycięto język. Według autora śmierć Aleksandra to raczej malaria, alkohol i stare rany."},{"t":"Mani i manicheizm","d":"Ponad 500 lat później prorok Mani w Mezopotamii głosił walkę światła z ciemnością: wybrani wyrzekali się majątku, a słuchacze ich wspierali. Wspierany przez szacha, słał misjonarzy do Indii, Azji Środkowej i Cesarstwa Rzymskiego."},{"t":"Edykt Dioklecjana","d":"W 302 r. Dioklecjan uznał manicheizm za perski spisek przeciw Rzymowi: nawróconych czekała śmierć, urzędników kopalnie, a kaznodziejów stos z ich księgami. Kolejni cesarze, już chrześcijańscy, przez ponad 2 stulecia ścigali sektę jako herezję."},{"t":"Spisku nie było","d":"Mani tylko przez pewien czas cieszył się łaską dworu, zmarł w więzieniu, a jego religię w Persji prześladowali kapłani zaratusztriańscy. Według autora rzymska krucjata wyrosła z zabójczej prostoty teorii spiskowej."}],"conclusion":"Teorie spiskowe żyją niezależnie od faktów, a w kryzysie potrafią kosztować życie i trwać stulecia.","factchecks":[{"claim":"Alkibiades wystawił 7 rydwanów na igrzyskach olimpijskich.","verdict":"prawda","note":"W 416 r. p.n.e. wystawił 7 zaprzęgów i zajął 1., 2. i 4. miejsce, jak podaje Tukidydes.","p":1,"src":[["Wikipedia (ang.): Alkibiades - hasło \"Alcibiades\"","https://en.wikipedia.org/wiki/Alcibiades"]]},{"claim":"W 415 r. p.n.e. przed wyprawą sycylijską okaleczono hermy w Atenach.","verdict":"prawda","note":"Afera hermokopidów wybuchła tuż przed wypłynięciem floty; o udział oskarżono m.in. Alkibiadesa.","p":[2,3],"src":[["Wikipedia (ang.): herma - hasło \"Herma\"","https://en.wikipedia.org/wiki/Herma"],["Wikipedia (ang.): wyprawa sycylijska - hasło \"Sicilian Expedition\"","https://en.wikipedia.org/wiki/Sicilian_Expedition"]]},{"claim":"W ciągu dekady od wyprawy doszło do 2 zamachów oligarchów.","verdict":"prawda","note":"Rządy Czterystu w 411 r. p.n.e. i Trzydziestu Tyranów w 404 r. p.n.e., czyli 11 lat po wyprawie.","p":4,"src":[["Wikipedia (ang.): przewrót ateński - hasło \"Athenian coup of 411 BC\"","https://en.wikipedia.org/wiki/Athenian_coup_of_411_BC"],["Wikipedia (ang.): Trzydziestu Tyranów - hasło \"Thirty Tyrants\"","https://en.wikipedia.org/wiki/Thirty_Tyrants"]]},{"claim":"Aleksander zmarł w Babilonie 10 czerwca 323 r. p.n.e., mając 32 lata.","verdict":"prawda","note":"Źródła podają 10 lub 11 czerwca; miał niespełna 33 lata.","p":5,"src":[["Wikipedia (ang.): śmierć Aleksandra - hasło \"Death of Alexander the Great\"","https://en.wikipedia.org/wiki/Death_of_Alexander_the_Great"]]},{"claim":"Aleksander kazał stracić Kallistenesa, siostrzeńca Arystotelesa.","verdict":"prawda","note":"Kallistenes zginął w 327 r. p.n.e. po spisku paziów; relacje o sposobie śmierci się różnią.","p":6,"src":[["Wikipedia (ang.): Kallistenes - hasło \"Callisthenes\"","https://en.wikipedia.org/wiki/Callisthenes"]]},{"claim":"Hyperejdesa schwytał łowca nagród Kassandra.","verdict":"półprawda","note":"Hyperejdesa ścigał Archiasz na zlecenie Antypatra, ojca Kassandra, i stracono go w 322 r. p.n.e.","p":7,"src":[["Wikipedia (ang.): Hyperejdes - hasło \"Hypereides\"","https://en.wikipedia.org/wiki/Hypereides"]]},{"claim":"Najbardziej prawdopodobna przyczyna śmierci Aleksandra to malaria, a nie trucizna.","verdict":"nie da się sprawdzić","note":"Historycy wymieniają malarię, tyfus, zapalenie trzustki i inne; teza o otruciu nie ma mocnych dowodów.","p":7,"src":[["Wikipedia (ang.): śmierć Aleksandra - hasło \"Death of Alexander the Great\"","https://en.wikipedia.org/wiki/Death_of_Alexander_the_Great"]]},{"claim":"W 302 r. Dioklecjan wydał edykt przeciw manichejczykom, karząc kaznodziejów stosem.","verdict":"prawda","note":"Edykt zachował się w Collatio; datuje się go na 302 r. (część badaczy na 297 r.).","p":9,"src":[["Wikipedia (ang.): manicheizm - hasło \"Manichaeism\"","https://en.wikipedia.org/wiki/Manichaeism"]]},{"claim":"Mani zmarł w więzieniu, prześladowany przez kapłanów zaratusztriańskich.","verdict":"prawda","note":"Zmarł ok. 274-277 r. w więzieniu za Bahrama I, przy wpływie arcykapłana Kartira.","p":10,"src":[["Wikipedia (ang.): Mani - hasło \"Mani (prophet)\"","https://en.wikipedia.org/wiki/Mani_(prophet)"],["Wikipedia (ang.): Kartir - hasło \"Kartir\"","https://en.wikipedia.org/wiki/Kartir"]]}],"bias":"Rzetelny, spokojny wykład historyka ze źródłami; drobne uproszczenia (Hyperejdes) i reklama sponsora na początku."},{"id":"fT2KhJ8W-Kg","title_pl":"Jak pistolet na stacji paliw wie, że bak jest pełny","title":"How petrol pumps know when to turn themselves off","channel":"Steve Mould","url":"https://www.youtube.com/watch?v=fT2KhJ8W-Kg","date":"2022-09-16","duration":836,"views":15567702,"section":"Ciekawostki","transcript":"youtube","added":"2026-11-03","tags":["Fizyka","Inżynieria"],"about":"Steve Mould przecina pistolet dystrybutora na pół i na modelach pokazuje mechanizm bez elektroniki, który sam odcina paliwo.","intro":"Pistolet dystrybutora odcina paliwo z charakterystycznym kliknięciem, gdy bak jest pełny, choć nie ma w nim czujnika elektronicznego. Steve Mould przecina go na pół i buduje przezroczyste modele dwóch mechanizmów: czujnika opartego na efekcie Venturiego i układu dźwigni z kulkami łożyskowymi, który zamyka zawór.","points":[{"t":"Efekt Venturiego","d":"Rura, która zwęża się pośrodku, przyspiesza przepływ, a w przewężeniu spada ciśnienie. Gdy Mould dmucha przez taki model, woda w podłączonej rurce w kształcie U podnosi się zamiast opadać."},{"t":"Rurka do końca dyszy","d":"Otworki przy przewężeniu łączą się z cienką rurką biegnącą do końca dyszy. Podciśnienie zasysa przez nią powietrze, które miesza się z paliwem."},{"t":"Druga gałąź z membraną","d":"Z tego samego miejsca odchodzi kanał do komory zamkniętej membraną. Dopóki rurka w dyszy zasysa powietrze, łagodzi podciśnienie i membrana stoi w miejscu."},{"t":"Bak pełny","d":"Gdy paliwo zakryje otwór na końcu dyszy, rurka zasysa ciężkie paliwo zamiast powietrza i słabiej łagodzi podciśnienie. W modelu odpowiada to zatkaniu rurki palcem: podciśnienie w komorze rośnie i wciąga membranę."},{"t":"Dźwignia i kulki","d":"Zawór paliwa jest dociskany sprężyną i otwierany przez rękojeść. Punkt podparcia dźwigni tworzą 3 kulki łożyskowe zaklinowane w przewężeniu obudowy, a do membrany przymocowany jest trzpień z klinem."},{"t":"Kliknięcie","d":"Gdy membrana się podnosi, klin się cofa, kulki wpadają do środka, punkt podparcia znika i cały mechanizm się składa. Sprężyna zamyka zawór."},{"t":"Przepływ w środku","d":"Paliwo pod ciśnieniem opływa mechanizm i pcha sprężynowy element, tworząc cienką szczelinę. To w niej, dzięki efektowi Venturiego, powstaje podciśnienie dla czujnika."},{"t":"Po co to wszystko","d":"Samoczynne odcięcie chroni przed rozlaniem paliwa na stacji, co groziłoby pożarem. Mould przyznaje, że jego modele są uproszczone i nie wszystko udało mu się dostroić."},{"t":"Sponsor","d":"Końcówka to reklama 80,000 Hours, organizacji non-profit doradzającej w wyborze kariery."}],"conclusion":"Pistolet dystrybutora odcina paliwo czysto mechanicznie: efekt Venturiego, membrana i kulki łożyskowe zastępują elektronikę.","factchecks":[{"claim":"W przewężeniu rury płyn przyspiesza, a jego ciśnienie spada.","verdict":"prawda","note":"To efekt Venturiego, wynikający z zasady zachowania masy i równania Bernoulliego.","p":0,"src":[["Wikipedia (ang.): efekt Venturiego - hasło \"Venturi effect\"","https://en.wikipedia.org/wiki/Venturi_effect"]]},{"claim":"Automatyczne odcięcie w pistolecie działa dzięki rurce czujnika i pompie Venturiego w rękojeści.","verdict":"prawda","note":"Zawór mechaniczny w rękojeści wykrywa zmianę ciśnienia i zamyka się.","p":[1,2,3,5],"src":[["Wikipedia (ang.): dystrybutor paliwa - hasło \"Gasoline pump\"","https://en.wikipedia.org/wiki/Gasoline_pump"]]}],"bias":"Rzetelny i dobrze zilustrowany; transkrypcja miejscami nieczytelna, ale mechanizm jest jasny. Na końcu reklama sponsora."},{"id":"mkrhwBl3jms","title_pl":"Czy Rzymianie wiedzieli, ile lat mają piramidy?","title":"Did the Romans Know How Old the Pyramids Were?","channel":"toldinstone","url":"https://www.youtube.com/watch?v=mkrhwBl3jms","date":"2022-08-12","duration":530,"views":1279356,"section":"Historia","transcript":"youtube","added":"2026-11-03","tags":["Historia"],"about":"Jak Grecy i Rzymianie wyobrażali sobie przeszłość Egiptu i dlaczego mylili się co do wieku piramid w Gizie.","intro":"Garrett Ryan z toldinstone zaczyna od obelisku postawionego w Circus Maximus w 357 r., którego hieroglifów nikt w Rzymie nie umiał przeczytać. Pokazuje, jak Grecy i Rzymianie mierzyli przeszłość mitami, jak fascynował ich Egipt i dlaczego datowali piramidy o tysiące lat za późno, choć poprawna kronika istniała.","points":[{"t":"Obelisk w Circus Maximus","d":"W 357 r. Konstancjusz II sprowadził obelisk z największej świątyni Egiptu: przypłynął specjalną barką, przetoczono go na drewnianej kołysce i podniosły go tysiące ludzi przy kabestanach. Miał ok. 32 m i ok. 400 t, a jego hieroglifów nikt w Rzymie nie umiał odczytać."},{"t":"Czas mierzony mitem","d":"Rzymianie sądzili, że Rzym założono ok. 11 wieków wcześniej, a wojna trojańska była ponad 400 lat przed nim. O tym, co wcześniej, wiedzieli tylko z mitów: ruiny mykeńskie przypisywano bohaterom Iliady lub cyklopom."},{"t":"Znaleziska tłumaczone legendą","d":"Ateńczycy uznali kości wysokiego mężczyzny z brązową bronią za szczątki Tezeusza, a kamienną trumnę odsłoniętą przez powódź pod Rzymem za grób króla Numy. Spartański król Agesilaos, nie umiejąc odczytać tabliczki z grobu Alkmeny, wysłał ją do Egiptu."},{"t":"Egipt w świecie klasycznym","d":"Grecy docierali nad Nil od VII w. p.n.e., po Aleksandrze przez 3 wieki rządzili nim Ptolemeusze, a od Augusta Egipt był prowincją rzymską przez prawie 700 lat. Mimo to elity widziały go jako egzotyczną krainę cudów."},{"t":"Moda na Egipt","d":"W Rzymie stawiano obeliski, malowano sceny nilowe w willach, a elita budowała grobowce-piramidy, choć Pliniusz Starszy krytykował piramidy jako próżny pokaz bogactwa. Rzymscy turyści płacili wieśniakom za wspinanie się na Wielką Piramidę i ryli na niej graffiti."},{"t":"Faraonowie sprzed tysięcy lat","d":"Herodot uważał, że pierwsi faraonowie panowali ok. 15000 lat p.n.e., a Diodor przesunął to do ok. 23000 lat p.n.e. W rzeczywistości państwo egipskie powstało tuż przed 3000 r. p.n.e."},{"t":"Piramidy datowane za późno","d":"Piramidy w Gizie zbudowano w XXVI w. p.n.e., a Herodot umieścił budowniczego Wielkiej Piramidy ok. 1200 r. p.n.e., Diodor w X w. p.n.e. Piramidę Mykerinosa tradycja przypisywała nawet greckiej kurtyzanie Rodopis z VI w. p.n.e."},{"t":"Zanikająca wiedza kapłanów","d":"Hieroglify umiała czytać tylko kurcząca się grupa kapłanów, więc długo przed ostatnią inskrypcją pod koniec IV w. zapisy na pomnikach były niezrozumiałe nawet dla ich strażników."},{"t":"Zapomniany Manetho","d":"W III w. p.n.e. Egipcjanin Manetho napisał po grecku historię Egiptu, która poprawnie datowała piramidy na wczesny okres. Grecy i Rzymianie woleli jednak klasycznego, chronologicznie chaotycznego Herodota."}],"conclusion":"Grecy i Rzymianie widzieli Egipt przez pryzmat własnej kultury i klasyków, a czego te nie pokazywały, nie chcieli widzieć.","factchecks":[{"claim":"W 357 r. Konstancjusz II postawił w Circus Maximus obelisk z Egiptu.","verdict":"prawda","note":"To dzisiejszy Obelisk Laterański z Karnaku, ok. 32 m wysokości, przeniesiony na Lateran w 1588 r.","p":0,"src":[["Wikipedia (ang.): Obelisk Laterański - hasło \"Lateran Obelisk\"","https://en.wikipedia.org/wiki/Lateran_Obelisk"]]},{"claim":"Kimon przywiózł ze Skiros kości uznane za szczątki Tezeusza.","verdict":"prawda","note":"Plutarch opisuje znalezisko z ok. 475 r. p.n.e.: duży szkielet z włócznią i mieczem z brązu.","p":2,"src":[["Wikipedia (ang.): Tezeusz - hasło \"Theseus\"","https://en.wikipedia.org/wiki/Theseus"]]},{"claim":"Pliniusz Starszy nazwał piramidy próżnym pokazem bogactwa królów.","verdict":"prawda","note":"W Historii naturalnej (ks. 36) pisze o piramidach jako bezużytecznym i głupim popisie bogactwa.","p":4,"src":[["Wikipedia (ang.): Wielka Piramida - hasło \"Great Pyramid of Giza\"","https://en.wikipedia.org/wiki/Great_Pyramid_of_Giza"]]},{"claim":"Państwo egipskie powstało tuż przed 3000 r. p.n.e., a piramidy w Gizie w XXVI w. p.n.e.","verdict":"prawda","note":"Zjednoczenie ok. 3100 r. p.n.e.; Wielką Piramidę datuje się na ok. 2600-2560 r. p.n.e.","p":[5,6],"src":[["Wikipedia (ang.): wczesny okres dynastyczny - hasło \"Early Dynastic Period (Egypt)\"","https://en.wikipedia.org/wiki/Early_Dynastic_Period_(Egypt)"],["Wikipedia (ang.): Wielka Piramida - hasło \"Great Pyramid of Giza\"","https://en.wikipedia.org/wiki/Great_Pyramid_of_Giza"]]},{"claim":"Tradycja przypisywała piramidę Mykerinosa kurtyzanie Rodopis.","verdict":"prawda","note":"Herodot przytacza tę wersję i ją odrzuca; powtarzali ją później Strabon i Diodor.","p":6,"src":[["Wikipedia (ang.): Rodopis - hasło \"Rhodopis\"","https://en.wikipedia.org/wiki/Rhodopis"]]},{"claim":"Ostatnią inskrypcję hieroglificzną wyryto pod koniec IV w.","verdict":"prawda","note":"Graffito Esmet-Achoma na wyspie File pochodzi z 394 r.","p":7,"src":[["Wikipedia (ang.): graffito Esmet-Achoma - hasło \"Graffito of Esmet-Akhom\"","https://en.wikipedia.org/wiki/Graffito_of_Esmet-Akhom"]]},{"claim":"Manetho w III w. p.n.e. napisał po grecku historię Egiptu.","verdict":"prawda","note":"Jego Aegyptiaca zna się z odpisów; podział na dynastie stosuje się do dziś.","p":8,"src":[["Wikipedia (ang.): Manetho - hasło \"Manetho\"","https://en.wikipedia.org/wiki/Manetho"]]}],"bias":"Rzetelny i wyważony; masa obeliska podana z zaokrągleniem, poza tym brak przekłamań. Reklama sponsora w środku."},{"id":"bY1E2IkvQ3k","title_pl":"Jak wody gruntowe wpływają na tamy i budowy","title":"The Bizarre Paths of Groundwater Around Structures","channel":"Practical Engineering","url":"https://www.youtube.com/watch?v=bY1E2IkvQ3k","date":"2022-06-07","duration":841,"views":14269809,"section":"Ciekawostki","transcript":"youtube","added":"2026-11-03","tags":["Nauka","Technika"],"about":"Grady z Practical Engineering pokazuje na modelu z piasku, jak woda pod ziemią może podnieść tamę albo wciągnąć robotnika.","intro":"W 2015 r. w Kanadzie robotnika wciągnęło zapadlisko w dnie stalowego kesonu na budowie przepompowni. Grady Hillhouse z Practical Engineering na akrylowym modelu z piaskiem i barwnikiem pokazuje, jak płyną wody gruntowe, czym jest ciśnienie wyporu pod tamą i jak inżynierowie bronią się przed nim przesłonami, drenażem i pompami.","points":[{"t":"Wypadek w kesonie","d":"Na budowie w Kolumbii Brytyjskiej dno kesonu, czyli wodoszczelnej komory w gruncie, zostało przebite i pracownik wpadł do zapadliska. Przyczyną była woda gruntowa pod placem budowy; kolegom udało się go uratować."},{"t":"Tama jako granica ciśnień","d":"Woda gruntowa płynie z obszaru wysokiego do niskiego ciśnienia, a tama właśnie je rozdziela. Przesiąkająca pod nią woda może wymywać cząstki gruntu (sufozja), co nakręca się samo i grozi szybką awarią."},{"t":"Ciśnienie wyporu","d":"Zapory grawitacyjne trzymają się dzięki własnej masie, ale woda pod podstawą naciska od dołu i odejmuje część tego ciężaru. Do lat 20. XX w. inżynierowie to pomijali; zapora St. Francis w Kalifornii zawaliła się w 1928 r., zabijając ponad 400 osób."},{"t":"Sieć przepływu","d":"Inżynierowie rysowali krzywoliniową siatkę z liniami równego ciśnienia i liniami przepływu. To w praktyce graficzne rozwiązanie równania Laplace'a, tego samego co dla przepływu ciepła; dziś liczy się to programami."},{"t":"Przesłona przeciwfiltracyjna","d":"Pionowa ściana pod czołem tamy wydłuża drogę wody. Wg prawa Darcy'ego prędkość przepływu zależy od przepuszczalności i gradientu hydraulicznego, więc dłuższa droga to mniejszy przesiąk i niższe ciśnienie wyporu, nawet gdy woda przechodzi pod ścianą."},{"t":"Jak buduje się przesłony","d":"Można wykopać szeroki fundament (przy okazji sprawdzając uskoki), wypełnić głęboki rów betonem lub zawiesiną gliny, wbić ścianki szczelne albo wtłoczyć pod ciśnieniem zaczyn tworzący nieprzepuszczalną kurtynę."},{"t":"Drenaż pod tamą","d":"Dreny z filtrem z piasku i żwiru zatrzymują cząstki gruntu i odprowadzają wodę, obniżając wypór. Skracają drogę przepływu, więc przesiąk rośnie, ale dzięki filtrom to zwykle opłacalna wymiana."},{"t":"Studnie odciążające","d":"Niektóre zapory pompują wodę, by obniżyć jej poziom pod konstrukcją. Przesiąk rośnie, ale ciśnienie pod podstawą wyraźnie spada, a stabilność rośnie."},{"t":"Kurzawka w kesonie","d":"Odwadniany keson działa jak tama na bardzo krótkim odcinku, więc gradient i prędkość przesiąku są duże. Grunt traci spójność, upłynnia się i wpływa do środka; model pokazuje, jak piasek zaczyna wzbierać."},{"t":"Jak temu zapobiec","d":"Wokół kesonu stawia się igłofiltry, czyli rząd małych studni z pompami, albo wbija keson głębiej, najlepiej do warstwy nieprzepuszczalnej. Dzięki temu woda nie napiera od spodu."}],"conclusion":"Pod niemal każdą tamą, ścianą oporową czy wykopem kryją się przesłony i drenaże, które trzymają wody gruntowe w ryzach.","factchecks":[{"claim":"Zawalenie zapory St. Francis w 1928 r. zabiło ponad 400 osób.","verdict":"prawda","note":"Szacunki to co najmniej 431 ofiar; to jedna z najgorszych katastrof budowlanych w USA w XX w.","p":2,"src":[["Wikipedia (ang.): zapora St. Francis - hasło \"St. Francis Dam\"","https://en.wikipedia.org/wiki/St._Francis_Dam"]]},{"claim":"Sieć przepływu to graficzne rozwiązanie równania Laplace'a.","verdict":"prawda","note":"Ustalony przepływ w jednorodnym gruncie opisuje równanie Laplace'a; sieć to jego przybliżenie.","p":3,"src":[["Wikipedia (ang.): sieć przepływu - hasło \"Flow net\"","https://en.wikipedia.org/wiki/Flow_net"]]},{"claim":"Prawo Darcy'ego wiąże przepływ z przepuszczalnością i gradientem hydraulicznym.","verdict":"prawda","note":"Darcy sformułował je w 1856 r. na podstawie doświadczeń z filtrami piaskowymi.","p":4,"src":[["Wikipedia (ang.): prawo Darcy'ego - hasło \"Darcy's law\"","https://en.wikipedia.org/wiki/Darcy%27s_law"]]},{"claim":"Do lat 20. XX w. projektanci zapór pomijali ciśnienie wyporu.","verdict":"półprawda","note":"Zjawisko znano od końca XIX w., ale w latach 20. wciąż było słabo rozumiane i rzadko uwzględniane.","p":2,"src":[["Wikipedia (ang.): zapora St. Francis - hasło \"St. Francis Dam\"","https://en.wikipedia.org/wiki/St._Francis_Dam"]]}],"bias":"Rzetelny, z pokazem na modelu; na końcu długa, rodzinna reklama sponsora."},{"id":"dvWtaHFG7QI","title_pl":"Twoje ulubione zespoły zapłaciły za sławę: historia payoli","title":"Your Favorite Bands Paid To Be Famous","channel":"Bandsplaining","url":"https://www.youtube.com/watch?v=dvWtaHFG7QI","date":"2022-03-19","duration":2045,"views":377934,"transcript":"whisper","added":"2026-11-03","tags":["Historia","Muzyka"],"about":"Historia płacenia za granie muzyki: od Tin Pan Alley i Alana Freeda po śledztwo Spitzera i płatne playlisty na Spotify.","intro":"Bandsplaining opowiada historię payoli, czyli płacenia za granie piosenek. Od wydawców nut z XIX w., przez skandal DJ-ów z 1959 r. i niezależnych promotorów, po ugody wytwórni z 2005 r. i płatne playlisty. Pyta też, czy dziś, przy zalewie muzyki, payola jest zła.","points":[{"t":"Zalew muzyki","d":"Na Spotify trafia 60 000 utworów dziennie, a 20% nikt nigdy nie odtworzy. Dlatego płacenie za uwagę wciąż kusi."},{"t":"Tin Pan Alley","d":"Piosenka After the Ball sprzedała się w 1892 r. w 2 mln egzemplarzy nut. Wydawcy płacili śpiewakom, np. Charles Harris dał 10 dolarów tenorowi Evanowi Williamsowi, i kupowali klakierów, a przed I wojną obiecali z tym skończyć."},{"t":"Alan Freed i Maybellene","d":"Maybellene Chucka Berry'ego z 1955 r. wyrosło z piosenki Ida Red, a współautorstwo dostali DJ Alan Freed i Russ Fratto. Freed spopularyzował nazwę rock and roll."},{"t":"Skandal z 1959 r.","d":"Po aferze z teleturniejami Oren Harris wszczął śledztwo, a FCC mogła odbierać licencje; zamieszanych było 200 do 250 DJ-ów. Freed wziął co najmniej 30 000 dolarów, ostatni raz nadawał w WABC 23 listopada 1959 r. i zmarł 5 lat później."},{"t":"Prawo z 1960 r.","d":"Poprawki do ustawy o komunikacji uczyniły payolę przestępstwem zagrożonym do roku więzienia i 10 000 dolarów grzywny."},{"t":"Niezależni promotorzy","d":"W 1974 r. CBS News ujawniło payolę w CBS Records, a w 1977 r. promotor zeznał, że DJ-e żądali 14 000 dolarów za granie Earth, Wind & Fire. Promotor Joe Isgro wysyłał dyrektorom stacji koperty z 3000 do 5000 dolarów tygodniowo."},{"t":"Spitzer i ugody","d":"W 1997 r. Interscope płaciło za Limp Bizkit w radiu w Portland, ujawniając to na antenie. Śledztwo Spitzera wykazało, że Epic zapłacił 4000 dolarów za Franz Ferdinand, a wytwórnie zawarły ugody."},{"t":"Era playlist","d":"Według źródła z branży wytwórnie płaciły 2 do 10 tys. dolarów za miejsce na popularnej playliście Spotify. Dziś są SubmitHub, MusoSoup i Spotify Discovery Mode, gdzie artysta oddaje część tantiem za promocję."}],"conclusion":"Payola nigdy nie zniknęła, tylko zmieniła formę; autor przedstawia 3 poglądy na to, czy to zło, czy cena widoczności.","factchecks":[{"claim":"After the Ball sprzedało się w 1892 r. w 2 mln egzemplarzy nut.","verdict":"prawda","note":"W 1892 r. ponad 2 mln, łącznie ponad 5 mln; to rekord Tin Pan Alley.","p":1,"src":[["Wikipedia (ang.): After the Ball - hasło \"After the Ball (song)\"","https://en.wikipedia.org/wiki/After_the_Ball_(song)"]]},{"claim":"Maybellene powstało z Ida Red, a Freed dostał współautorstwo.","verdict":"prawda","note":"Wikipedia potwierdza oba fakty; udział Freeda w autorstwie uważa się za formę payoli.","p":2,"src":[["Wikipedia (ang.): Maybellene - hasło \"Maybellene\"","https://en.wikipedia.org/wiki/Maybellene"]]},{"claim":"Freed zmarł 5 lat po skandalu.","verdict":"prawda","note":"Zmarł 20 stycznia 1965 r. w wieku 43 lat.","p":3,"src":[["Wikipedia (ang.): Alan Freed - hasło \"Alan Freed\"","https://en.wikipedia.org/wiki/Alan_Freed"]]},{"claim":"Po śledztwie payola stała się przestępstwem.","verdict":"prawda","note":"Wikipedia opisuje ją jako wykroczenie (misdemeanor); programowanie przejęli dyrektorzy stacji.","p":4,"src":[["Wikipedia (ang.): payola - hasło \"Payola\"","https://en.wikipedia.org/wiki/Payola"]]},{"claim":"Śledztwo Spitzera zakończyło się ugodami wytwórni.","verdict":"prawda","note":"Sony BMG (2005) zapłaciło 10 mln, Warner 5 mln, a Universal (2006) 12 mln dolarów.","p":6,"src":[["Wikipedia (ang.): payola - hasło \"Payola\"","https://en.wikipedia.org/wiki/Payola"]]},{"claim":"Spotify Discovery Mode to promocja za niższe tantiemy.","verdict":"prawda","note":"Spotify ogłosiło w 2020 r., że artyści mogą wskazać utwory do rekomendacji w zamian za niższą stawkę.","p":7,"src":[["Spotify: ogłoszenie z 2020 r.","https://newsroom.spotify.com/2020-11-02/amplifying-artist-input-in-your-personalized-recommendations/"]]}],"bias":"Dobrze udokumentowana historia, wyważona w ocenie; film jest z 2022 r., więc liczby o streamingu mogą być nieaktualne.","section":"Ciekawostki"},{"id":"5uqPlOAH85o","title_pl":"Czy Rzymianie byli blisko rewolucji przemysłowej? (cz. 1)","title":"Were the Romans close to an Industrial Revolution? (Part 1)","channel":"toldinstone","url":"https://www.youtube.com/watch?v=5uqPlOAH85o","date":"2022-02-25","duration":635,"views":1225525,"section":"Historia","transcript":"youtube","added":"2026-11-04","tags":["Historia","Technika"],"about":"Mity o stagnacji Rzymu, maszyny parowe Herona, masowa produkcja, kopalnie i młyny wodne - oraz teza, że to nie wystarczyło.","intro":"Od \"maszyny trzęsienia ziemi\" Antemiusza z Tralles i eolipili Herona autor pyta, czemu Rzymianie nie zbudowali praktycznego silnika parowego. Obala mity o niechęci do innowacji i o niewolnictwie blokującym maszyny, potem pokazuje masową produkcję garum i terra sigillata, kopalnie Las Médulas oraz młyn w Barbegal. Część 2 ma wyjaśnić, czemu rewolucji nie było.","points":[{"t":"Maszyna trzęsienia ziemi","d":"Antemiusz z Tralles, skłócony z sąsiadem Zenonem o światło, podłączył kotły z wodą do rur ze skórzanymi końcówkami. Para rozpychała stropy podczas przyjęcia Zenona; goście uciekli, krzycząc o trzęsieniu. Według autora to ciąg klasycznych gadżetów parowych."},{"t":"Heron i para","d":"Pięć wieków wcześniej Heron z Aleksandrii opisywał otwieranie wrót świątyni, organy i turbinę parową. W tym czasie imperium miało ekspansję gospodarczą, masową produkcję, wzrost górnictwa i coraz więcej energii wodnej."},{"t":"Mit: Rzymianie nie lubili innowacji","d":"Elita patrzyła na majsterkowanie jak na zajęcie pospólstwa, ale chętnie brała wynalazki dające zysk. Senat kazał tłumaczyć kartagiński podręcznik rolnictwa; Cyceron chwalił Rzymian jako bardziej wynalazczych od Greków."},{"t":"Nowe technologie","d":"Epoka rzymska przyniosła dmuchane szkło, prasę śrubową do oliwek i winogron, beton hydrauliczny (Panteon) oraz vallus: dwukołowy żniwiarka z nożami, pchaną przez muła w Galii, zbierającą kłosy do skrzyni."},{"t":"Mit o niewolnictwie","d":"Według autora niewolnicy byli drogą inwestycją, więc właściciele maksymalizowali zysk. Przykład: cegielnie i dachówkarstwo na majątkach koło Rzymu, zasilające budownictwo cesarskie."},{"t":"Masowa produkcja","d":"W późnej starożytności cesarze prowadzili fabryki broni, mennice i warsztaty tkackie. Prywatnie: fabryki rybne w Hiszpanii, Portugalii i Maroku z wannami do solenia i garum; terra sigillata z Italii i Galii w piecach na nawet 40 tys. naczyń naraz."},{"t":"Górnictwo przemysłowe","d":"Szyby do 200 m, koła deptane do pompowania wody, tory w podłodze tuneli. Las Médulas (ok. 2 km szerokości, do 200 m głębokości) miało 7 akweduktów zasilających zbiorniki; woda zrzucana z krawędzi odsłaniała złoża złota (ruina montium)."},{"t":"Młyny Barbegal","d":"Koło Arles akwedukt ok. 9 km zasilał dwa równoległe rzędy młynów z kołami nasiębiernymi: 16 młynów mogło dawać mąkę dla ponad 10 tys. osób dziennie."},{"t":"Eolipila","d":"Pusta kula na pivocie nad kotłem: para wchodziła rurkami i wypływała ukośnymi dyszami, obracając kulę - pierwsza znana turbina parowa. Autor: Rzymianie rozumieli zasadę pary, ale w części 2 pokaże, czemu nie było brytyjskiej rewolucji przemysłowej."}],"conclusion":"Rzym miał innowacje, masową produkcję, górnictwo i parę w teorii - według autora to wciąż za mało na rewolucję przemysłową.","factchecks":[{"claim":"Heron zbudował eolipilę, pierwszą turbinę parową.","verdict":"prawda","note":"Eolipila Herona to najstarszy opisany silnik reakcyjny na parę; była demonstracją, nie napędem przemysłowym.","p":8,"src":[["Wikipedia (ang.): eolipila - hasło \"Aeolipile\"","https://en.wikipedia.org/wiki/Aeolipile"],["Wikipedia (ang.): Heron z Aleksandrii - hasło \"Hero of Alexandria\"","https://en.wikipedia.org/wiki/Hero_of_Alexandria"]]},{"claim":"Vallus to rzymska mechaniczna żniwiarka z Galii.","verdict":"prawda","note":"Pliniusz i Palladiusz opisują vallus; znane są też reliefy z północnej Galii.","p":3,"src":[["Wikipedia (ang.): vallus - hasło \"Vallus\"","https://en.wikipedia.org/wiki/Vallus"]]},{"claim":"Las Médulas: odkrywkowa kopalnia złota z akweduktami i hydrailiką.","verdict":"prawda","note":"UNESCO; Rzymianie używali ruina montium - gwałtownego spuszczania wody ze zbiorników.","p":6,"src":[["Wikipedia (ang.): Las Médulas - hasło \"Las Médulas\"","https://en.wikipedia.org/wiki/Las_M%C3%A9dulas"]]},{"claim":"Młyn Barbegal miał 16 kół i mógł karmić ponad 10 tys. osób dziennie.","verdict":"prawda","note":"Kompleks z XVI kołami jest jednym z największych znanych młynów starożytności; szacunki wydajności są w tym rzędzie.","p":7,"src":[["Wikipedia (ang.): młyny Barbegal - hasło \"Barbegal aqueduct and mill\"","https://en.wikipedia.org/wiki/Barbegal_aqueduct_and_mill"]]},{"claim":"Piece terra sigillata brały do 40 tys. naczyń naraz.","verdict":"półprawda","note":"Piece w La Graufesenque osiągały rzędu dziesiątek tysięcy; dokładna liczba 40 tys. zależy od pieca i źródła.","p":5,"src":[["Wikipedia (ang.): La Graufesenque - hasło \"La Graufesenque\"","https://en.wikipedia.org/wiki/La_Graufesenque"],["Wikipedia (ang.): terra sigillata - hasło \"Terra sigillata\"","https://en.wikipedia.org/wiki/Terra_sigillata"]]}],"bias":"Solidna synteza; część 1 kończy cliffhangerem. Sponsor VPN w środku. Antemiusz/Zenon to anegdota z późnych źródeł."},{"id":"XKe5Ok-9j2w","title_pl":"7 rzymskich budowli ukrytych w dzisiejszym Rzymie","title":"7 Roman Buildings Hidden in Plain Sight","channel":"toldinstone","url":"https://www.youtube.com/watch?v=XKe5Ok-9j2w","date":"2021-04-30","duration":864,"views":1044660,"section":"Historia","transcript":"youtube","added":"2026-11-04","tags":["Historia","Geografia"],"about":"Siedem starożytnych budowli Rzymu wmurowanych w kościoły, ulice i kamienice, od Via in Selci po Teatr Pompejusza.","intro":"Autor prowadzi po \"niewidzialnym mieście\": większość antycznego Rzymu leży pod ziemią, ale siedem budowli wychodzi na światło. Od bazyliki przy Via in Selci i tajemniczego portyku przy Tybrze, przez łuk Malborghetto i domy pod Santi Giovanni e Paolo, po Santa Pudenziana, Santa Croce i zakrzywione kamienice nad Teatrem Pompejusza.","points":[{"t":"Niewidzialne miasto","d":"Według autora tylko ułamek antycznego Rzymu jest odsłonięty; reszta podpiera piwnice i utrudnia metro. Piazza Navona stoi na stadionie Domicjana, ale inne ślady są subtelnniejsze."},{"t":"Bazylika przy Via in Selci","d":"Wąska Via in Selci północnie od Koloseum to według autora jeden z niewielu ciągów używanych nieprzerwanie od ok. 2000 lat (dawny clivus Suburanus). W murze widać kamienne filary i łuki sklepów; budynek zachowany do ok. 9 m, później bazylika cywilna lub aula willi, dziś część klasztoru."},{"t":"Tajemniczy portyk","d":"W zakolu Tybru (Campus Martius) z niepozornej kamienicy wystaje rzymski łuk; struktura ciągnie się pod całym blokiem. Tożsamość nieustalona; część badaczy widzi magazyn zboża dla rozdawnictwa. Dziś przy salonie fryzjerskim."},{"t":"Łuk Malborghetto","d":"Za murami, przy drodze, stoi dom o rzymskiej cegle. Pierwotnie monumentalny łuk z IV w., niemal na pewno Konstantyna, według panującej teorii na miejscu obozu przed bitwą przy Moście Mulwijskim. Potem kościół, wioska, stacja poczty papieskiej; dziś małe muzeum."},{"t":"Dom pod Clivo di Scauro","d":"Pod bazyliką Santi Giovanni e Paolo (V w.) wmurowano cały blok domów. Od strony Clivo di Scauro widać fasadę kamienicy z II w. przekształconej w prywatną rezydencję; pod kościołem zachowały się mozaiki i freski."},{"t":"Santa Pudenziana","d":"Kościół w cieniu Santa Maria Maggiore ma najstarsze mozaiki absydy w Rzymie. Nawa powstała w hali dzielnicowych łaźni z czasów Marka Aureliusza; nad łukami widać cegłę i zarysy wielkich okien, a z tyłu rząd antycznych łuków."},{"t":"Santa Croce in Gerusalemme","d":"Po prawej od fasady widać cegły dawnej auli pałacu Sessorium i resztki Amphitheatrum Castrense (trzy kondygnacje, miejsca dla tysięcy). Kompleks z II-III w. miał też cyrk; tradycja wiąże przekształcenie auli w kościół ze św. Heleną."},{"t":"Teatr Pompejusza","d":"Zakrzywione kamienice przy Campo de' Fiori obrysowują pierwszy stały teatr Rzymu: trzy kondygnacje, ok. 20 tys. miejsc, budowa Pompejusza. Po powodziach Tybru domy weszły w łuki i na siedziska; pod ziemią stoją ceglane arkady, a część sklepień to dziś restauracje."}],"conclusion":"Antyczny Rzym nadal kształtuje plan miasta: wystarczy wiedzieć, gdzie patrzeć między gelato a Vespas.","factchecks":[{"claim":"Piazza Navona stoi na stadionie Domicjana.","verdict":"prawda","note":"Owal Piazza Navona powtarza plan stadionu Domicjana z I w. n.e.","p":0,"src":[["Wikipedia (ang.): stadion Domicjana - hasło \"Stadium of Domitian\"","https://en.wikipedia.org/wiki/Stadium_of_Domitian"]]},{"claim":"Santa Pudenziana powstała w hali rzymskich łaźni.","verdict":"prawda","note":"Kościół wykorzystuje strukturę term z II w.; mozaika absydy należy do najstarszych w Rzymie.","p":5,"src":[["Wikipedia (ang.): Santa Pudenziana - hasło \"Santa Pudenziana\"","https://en.wikipedia.org/wiki/Santa_Pudenziana"]]},{"claim":"Santa Croce to dawna aula pałacu Sessorium przy Amphitheatrum Castrense.","verdict":"prawda","note":"Bazylika stoi w pałacu Sessorianum; obok zachowane resztki amfiteatru kastrense.","p":6,"src":[["Wikipedia (ang.): Santa Croce in Gerusalemme - hasło \"Santa Croce in Gerusalemme\"","https://en.wikipedia.org/wiki/Santa_Croce_in_Gerusalemme"],["Wikipedia (ang.): Amphitheatrum Castrense - hasło \"Amphitheatrum Castrense\"","https://en.wikipedia.org/wiki/Amphitheatrum_Castrense"]]},{"claim":"Teatr Pompejusza miał ok. 20 tys. miejsc i widać go w planie Campo de' Fiori.","verdict":"prawda","note":"Był pierwszym stałym teatrem Rzymu; zakrzywienie ulic i kamienic nadal oddaje plan widowni.","p":7,"src":[["Wikipedia (ang.): Teatr Pompejusza - hasło \"Theatre of Pompey\"","https://en.wikipedia.org/wiki/Theatre_of_Pompey"]]},{"claim":"Łuk Malborghetto stoi dokładnie na namiocie Konstantyna sprzed bitwy.","verdict":"nie da się sprawdzić","note":"Łuk z IV w. wiąże się z Konstantynem, ale dokładna lokalizacja obozu to hipoteza.","p":3,"src":[["Wikipedia (ang.): łuk Malborghetto - hasło \"Arch of Malborghetto\"","https://en.wikipedia.org/wiki/Arch_of_Malborghetto"]]}],"bias":"Staranny przewodnik terenowy; lokalizacje i identyfikacje budynków bywają hipotezami (portyk, Malborghetto). Bez źródeł w filmie."},{"id":"0NeWkRfJGnc","title_pl":"9 rodzin zapachów - jak perfumiarze klasyfikują perfumy","title":"How are Fragrances Classified? The 9 Fragrance Families | Men's Cologne Categories | Review 2021","channel":"School of Scent","url":"https://www.youtube.com/watch?v=0NeWkRfJGnc","date":"2021-02-21","duration":676,"views":178331,"section":"Moda","transcript":"youtube","added":"2026-11-03","tags":["Styl","Perfumy","Podstawy"],"about":"School of Scent tłumaczy klasyczne rodziny zapachowe z męskiej perspektywy i podaje przykłady perfum z każdej.","intro":"Prowadzący School of Scent przechodzi przez siedem tradycyjnych rodzin zapachów, opartych na klasyfikacji francuskiego stowarzyszenia perfumiarzy, i dorzuca dwie podrodziny. Przy każdej opisuje nastrój zapachu i podaje przykłady. Ma to pomóc dobierać perfumy do kolekcji według lubianych nut.","points":[{"t":"Cytrusy","d":"Cytryna, pomarańcza, bergamotka, yuzu. Świeże i orzeźwiające zapachy na ciepłe dni, ale krótko się utrzymują; drewno i inne nuty je wydłużają. Nuty i rodzinę zapachu łatwo sprawdzić w serwisie Fragrantica."},{"t":"Kwiatowe","d":"W męskich perfumach to bardziej odważny wybór. Neroli daje jasność i czystość, a róża sprawia, że zapach zapada w pamięć, jeśli zrównoważą ją męskie nuty."},{"t":"Fougère, czyli zapachy barberskie","d":"Lawenda i mech dębowy, czyli dawny standard męskich perfum. Nowsze wersje dodają np. miętę dla chłodnej świeżości."},{"t":"Szyprowe","d":"Tradycyjnie mech dębowy, labdanum i paczula. Autor radzi skupić się na paczuli: ciemnej, liściastej, lekko słodkiej nucie, która daje tajemniczą aurę."},{"t":"Drzewne","d":"Uważane za najbardziej męskie i bezpieczne, a nuty drzewne w wielu perfumach dają trwałość i strukturę. Należy tu też oud, rzadkie i drogie drewno."},{"t":"Skórzane","d":"Zapachy dla koneserów, lekko zwierzęce i dymne. Skóra może grać pierwsze skrzypce albo z przyprawami i słodyczą tworzyć elegancki wieczorowy klimat na chłodne dni."},{"t":"Orientalne","d":"Wanilia, ambra, tonka, mirra i benzoes z przyprawami, np. cynamonem. Słodkie, trwałe i mocne; tańsze potrafią przytłaczać otoczenie."},{"t":"Podrodziny: gourmand i owocowe","d":"Gourmand naśladuje coś jadalnego, np. czekoladę z wanilią, i zwykle jest unisex. Jasne owoce dają jasny zapach, a ciemne, jak czarna porzeczka, ciemniejszy."}],"conclusion":"Klasyfikacja jest ogólna i zapachy się przenikają; skup się na klimacie, który lubisz, a nie na terminologii.","factchecks":[{"claim":"Cytrusowe zapachy szybko znikają.","verdict":"prawda","note":"Nuty głowy, m.in. cytrusy, to małe, lekkie cząsteczki, które szybko parują.","p":0,"src":[["Wikipedia (ang.): perfumy - hasło \"Perfume\"","https://en.wikipedia.org/wiki/Perfume"]]},{"claim":"Fougère znaczy po francusku paproć, a chypre to Cypr.","verdict":"prawda","note":"Obie nazwy są francuskie; chypre pochodzi od pierwszej kompozycji z bergamotką i labdanum.","p":[2,3],"src":[["Wikipedia (ang.): rodzina fougère - hasło \"Fougère\"","https://en.wikipedia.org/wiki/Foug%C3%A8re"],["Wikipedia (ang.): rodzina szyprowa - hasło \"Chypre\"","https://en.wikipedia.org/wiki/Chypre"]]},{"claim":"Oud to rodzaj gnijącego drewna.","verdict":"półprawda","note":"Oud powstaje, gdy drzewo Aquilaria broni się przed grzybem i wydziela pachnącą żywicę; to nie zwykłe gnicie.","p":4,"src":[["Wikipedia (ang.): drewno agarowe - hasło \"Agarwood\"","https://en.wikipedia.org/wiki/Agarwood"]]}],"bias":"Przyjemne wprowadzenie, ale opisy są subiektywne, a przykłady to głównie znane marki. Na początku reklama płatnej grupy WhatsApp kanału."},{"id":"f4LQU73Ilxo","title_pl":"Teisco SX-400 i osobliwy świat syntezatorów Teisco","title":"The Peculiar World of Teisco Synthesizers","channel":"Alex Ball","url":"https://www.youtube.com/watch?v=f4LQU73Ilxo","date":"2020-12-29","duration":605,"views":131692,"section":"Technologie","transcript":"youtube","added":"2026-11-04","tags":["Syntezatory","Vintage","Teisco"],"about":"Alex Ball przybliża Teisco SX-400 z 1981 i spekuluje o naklejkach licencji ARP na syntezatorach badge'owanych przez Kawai.","intro":"Alex Ball gra na kilku Teisco z wczesnych lat 80. i skupia się na SX-400 (1981), o którym mało materiałów online. Marka zaczynała od gitar w latach 40., w latach 60. kupił ją Kawai, a pod koniec lat 70. i w połowie 80. Kawai oznaczał nią kilka syntezatorów, m.in. znany 110F.","points":[{"t":"Skąd Teisco","d":"Korzenie w latach 40.: gitary, basy, perkusja, mikrofony, organy. W latach 60. przejęcie przez Kawai; pod koniec 70. i do połowy 80. Kawai używa marki do badge'owania syntezatorów - według autora mniej niż 10 modeli."},{"t":"SX-400 jak Jupiter w garniturze","d":"Z 1981: gruba obudowa, dużo pokręteł. Wygląd przypomina Roland Jupiter-4. Filtry w stylu drabinki Mooga; na tyle naklejka o licencji ARP. Tryby poly + detune suboscylatora i ensemble: od chudego do bardzo grubego brzmienia."},{"t":"Możliwości brzmieniowe","d":"Dwie obwiednie, trzy LFO, PWM, szum, aftertouch i bender. Portamento i glissando; przy glissandzie słychać lekkie cyfrowe schodkowanie."},{"t":"Zagadka patentów ARP","d":"110F i SX-400 mają naklejkę US patent 3,965,789 (klawiatura pressure-sensitive z ARP Pro Soloist / Alan R. Pearlman). SX-400 ma taką klawiaturę, 110F nie - ma PPC i duofonię (inne numery patentów). Autor spekuluje o błędzie numeru lub planowanym aftertouch."},{"t":"110F na finał","d":"Na koniec gra utwór z SX-400 i 110F; 110F uważa za najbardziej znany Teisco synth."}],"conclusion":"Teisco to krótka, niedoceniana linia Kawai z brzmieniem inspirowanym Rolandem/Moogiem/ARP - wart spotlight mimo luk w dokumentacji.","factchecks":[{"claim":"Teisco zostało przejęte przez Kawai w latach 60.","verdict":"prawda","note":"Kawai kupił Teisco w 1967; później markę używano też do instrumentów elektronicznych.","p":0,"src":[["Wikipedia (ang.): Teisco","https://en.wikipedia.org/wiki/Teisco"]]},{"claim":"US patent 3,965,789 dotyczy touch-sensitive keyboard ARP.","verdict":"prawda","note":"Patent Pearlmana dotyczy pressure-sensitive keyboard używanej m.in. w ARP Pro Soloist.","p":3,"src":[["Google Patents: US3965789A","https://patents.google.com/patent/US3965789A/en"],["Wikipedia (ang.): ARP Pro Soloist","https://en.wikipedia.org/wiki/ARP_Pro_Soloist"]]},{"claim":"Teisco SX-400 wyszedł w 1981 jako syntezator Kawai pod marką Teisco.","verdict":"prawda","note":"Źródła o vintage synthach datują SX-400 na początek lat 80. w linii Teisco/Kawai.","p":1,"src":[["Wikipedia (ang.): Teisco","https://en.wikipedia.org/wiki/Teisco"]]}],"bias":"Krótki, spekulatywny odcinek wokół jednego rzadkiego instrumentu; dużo czasu na jam, mało twardych źródeł o patentach."},{"id":"5nW3nJhBHL0","title_pl":"Dlaczego nie ma wzoru na obwód elipsy?","title":"Why is there no equation for the perimeter of an ellipse‽","channel":"Stand-up Maths","url":"https://www.youtube.com/watch?v=5nW3nJhBHL0","date":"2020-09-05","duration":1264,"views":2701258,"section":"Ciekawostki","transcript":"whisper","added":"2026-11-03","tags":["Matematyka"],"about":"Matt Parker porównuje przybliżenia obwodu elipsy, od prostej średniej po wzory Ramanujana, i pokazuje dwa własne.","intro":"Pole elipsy to po prostu pi razy a razy b, ale na jej obwód nie ma prostego, dokładnego wzoru. Matt Parker (Stand-up Maths) zestawia na wykresie błędy kolejnych przybliżeń, chwali geniusz Ramanujana, przedstawia dwa wzory znalezione z pomocą komputera i na koniec przekonuje, że okrąg wcale nie jest pod tym względem wyjątkiem.","points":[{"t":"Pojęcia","d":"a to dłuższa, a b krótsza półoś. Mimośród mówi, jak bardzo elipsa odbiega od okręgu: 0 to okrąg, blisko 1 skrajnie spłaszczona elipsa. Elipsę można narysować sznurkiem zaczepionym o dwa ogniska."},{"t":"Skala porównania","d":"Parker sprawdza stosunek a do b od 1 (okrąg) do 5 i liczy błąd procentowy każdego przybliżenia względem dokładnej wartości."},{"t":"Proste średnie","d":"Średnia arytmetyczna a i b jako promień myli się o 10% dopiero przy stosunku 4,83. Średnia geometryczna wypada znacznie gorzej: ponad 15% błędu już przy 2,63."},{"t":"Średnia kwadratowa","d":"Pierwiastek ze średniej kwadratów a i b bywa w sieci błędnie podawany jako wzór dokładny. To jednak dobre zgrubne przybliżenie: przy stosunku 5 błąd wynosi 7,8%."},{"t":"Pierwszy wzór Ramanujana","d":"pi razy [3(a + b) - pierwiastek z (3a + b)(a + 3b)] daje błędy rzędu tysięcznych części procenta w całym zakresie do 5."},{"t":"Wzór Parkera","d":"Program komputerowy pomógł mu znaleźć wzór z ułamkami 53/3 i 17/35. Do stosunku 2,4 Ramanujan jest lepszy, dalej Parker, a średnio w zakresie 1-5 jego wzór jest ok. 2 razy dokładniejszy. Działa tylko, gdy a jest większe."},{"t":"Drugi wzór Ramanujana","d":"Drugie przybliżenie Ramanujana, oparte na wielkości h, bije oba poprzednie. Parker przyznaje mu wygraną."},{"t":"Leniwe przybliżenie","d":"pi razy (1,2a + 0,75b), bez pierwiastków. Błąd skacze wokół 2,5%, do 5% dochodzi dopiero przy elipsie 75 razy dłuższej niż wysokiej, a nigdy nie przekracza 6,1%."},{"t":"Wartość dokładna","d":"Dokładny obwód daje dopiero nieskończony szereg. Parkerowi wystarczały wyrazy do h do szóstej, a przy dokładnych obliczeniach do h do dziesiątej potęgi."},{"t":"Okrąg też jest nieporządny","d":"Wzór 2 pi r wygląda czysto tylko dlatego, że nieskończony szereg chowamy w symbolu pi. Każdy stosunek osi miałby swoją własną stałą, a pi pozostaje wyjątkowe głównie dla pola."},{"t":"Zakończenie","d":"Sponsor Jane Street, wyzwanie dla widzów na lepszy wzór w Matt Parker's Maths Puzzles i aukcja narysowanej sznurkiem elipsy na cele charytatywne (WaterAid)."}],"conclusion":"Obwód elipsy można tylko przybliżać albo liczyć szeregiem, a w gruncie rzeczy tak samo jest z okręgiem.","factchecks":[{"claim":"Obwodu elipsy nie da się wyrazić prostym wzorem zamkniętym.","verdict":"prawda","note":"Dokładna wartość wymaga całki eliptycznej lub nieskończonego szeregu.","p":[0,8],"src":[["Wikipedia (ang.): obwód elipsy - hasło \"Perimeter of an ellipse\"","https://en.wikipedia.org/wiki/Perimeter_of_an_ellipse"]]},{"claim":"Ramanujan podał dwa bardzo dokładne przybliżenia obwodu elipsy.","verdict":"prawda","note":"Opisał je w pracy o równaniach modularnych i przybliżeniach pi; błąd jest rzędu h^3 i h^5.","p":[4,6],"src":[["Wikipedia (ang.): elipsa - hasło \"Ellipse\"","https://en.wikipedia.org/wiki/Ellipse"]]},{"claim":"Leniwy wzór pi
