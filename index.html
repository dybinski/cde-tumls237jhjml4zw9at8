 niej wodór.","verdict":"prawda","note":"Strumień wodoru zapala się na gąbce platynowej.","p":[0,1,2],"src":[["Wikipedia (ang.): lampa Döbereinera - hasło \"Döbereiner's lamp\"","https://en.wikipedia.org/wiki/Döbereiner's_lamp"]]},{"claim":"Po 3 latach lampa stała się przestarzała z powodu zapałek.","verdict":"przesada","note":"Zapałkę cierną Walker wynalazł w 1826 lub 1827 r., ale lampę produkowano do ok. 1880 r.","p":6,"src":[["Wikipedia (ang.): lampa Döbereinera - hasło \"Döbereiner's lamp\"","https://en.wikipedia.org/wiki/Döbereiner's_lamp"],["Wikipedia (ang.): John Walker - hasło \"John Walker (inventor)\"","https://en.wikipedia.org/wiki/John_Walker_(inventor)"]]},{"claim":"Lampa Döbereinera to pierwsze komercyjne zastosowanie katalizy.","verdict":"prawda","note":"Uznaje się ją za pierwsze komercyjne zastosowanie katalizy heterogenicznej.","p":[2,7],"src":[["Wikipedia (ang.): lampa Döbereinera - hasło \"Döbereiner's lamp\"","https://en.wikipedia.org/wiki/Döbereiner's_lamp"]]},{"claim":"Ogniwo paliwowe z membraną łączy wodór i tlen w wodę, wytwarzając prąd.","verdict":"prawda","note":"W ogniwach PEM membrana przewodzi protony, a elektrony płyną obwodem zewnętrznym.","p":8,"src":[["Wikipedia (ang.): ogniwo PEM - hasło \"Proton-exchange membrane fuel cell\"","https://en.wikipedia.org/wiki/Proton-exchange_membrane_fuel_cell"]]}],"bias":"Rzetelne wyjaśnienie chemii; przesadza z szybkim końcem lampy i myli wiek (XVII zamiast XIX). Na końcu reklama sponsora."},{"id":"kDfP5vAbOS0","title_pl":"Całkowicie błędne fakty, w które wszyscy wciąż wierzą","title":"Totally Wrong Facts Everyone Still Believes","url":"https://www.youtube.com/watch?v=kDfP5vAbOS0","date":"2025-04-30","duration":533,"views":2837925,"transcript":"youtube","added":"2026-11-03","tags":["Mity","Ciało i zdrowie","Nauka"],"about":"Ranking 10 popularnych \"faktów\", które według autora są mitami, od cukru i hiperaktywności po połkniętą gumę.","intro":"Ranking 10 popularnych \"faktów\", które według autora są mitami. Obala m.in. nadpobudliwość dzieci po cukrze, 10% mózgu, zabójczą monetę z Empire State Building, \"piorun nie uderza dwa razy\", hełmy wikingów z rogami, gęstsze włosy po goleniu, zakaz pływania po jedzeniu, utratę połowy ciepła przez głowę, 3-sekundową pamięć złotej rybki i gumę zalegającą 7 lat w żołądku.","points":[{"t":"10. Cukier nie robi z dzieci \"tornada\"","d":"W badaniu część dzieci dostała cukier, a część słodzik, i ani dzieci, ani rodzice nie wiedzieli, kto co dostał; różnicy nie było. Za to rodzice, którzy myśleli, że dziecko zjadło cukier, widzieli nadpobudliwość. Mit według autora zaczął się w latach 70. od lekarza obwiniającego dodatki do żywności."},{"t":"9. Nie używamy tylko 10% mózgu","d":"Skanery pokazują aktywność w całym mózgu, także we śnie, gdy steruje oddechem i sercem. Mózg to 2% masy ciała, a zużywa 20% energii; ewolucja nie trzymałaby 90% bezużytecznego organu, a nawet mały uraz daje poważne skutki. Mit ma pochodzić od badacza z Harvardu z XIX w. mówiącego o niewykorzystanym potencjale."},{"t":"8. Moneta z Empire State Building nie zabije","d":"Opór powietrza sprawia, że moneta koziołkuje i po ok. 15 m osiąga prędkość graniczną ok. 40 km/h, wolniej niż przeciętny rowerzysta, więc uderzenie przypomina pstryczka. W próżni osiągnęłaby ponad 320 km/h. Autor dodaje, że groźniejszy byłby spadający długopis."},{"t":"7. Piorun uderza w to samo miejsce","d":"Empire State Building dostaje ok. 25 uderzeń rocznie, a strażnik parku Roy Sullivan przeżył 7 uderzeń. Pioruny trafiają w te same wysokie obiekty, np. samotne drzewo. Mogą też uderzyć kilometry od burzy, przy czystym niebie."},{"t":"6. Wikingowie nie nosili hełmów z rogami","d":"Rogi wymyślili XIX-wieczni kostiumolodzy operowi, bo wyglądały dramatycznie, a w walce byłyby uchwytem dla wroga. Znalezione hełmy wikingów są proste, czasem z osłoną nosa. Rogate hełmy z Danii są o 3000 lat starsze i były ceremonialne."},{"t":"5. Golenie nie zagęszcza włosów","d":"Golenie ścina włos na płasko, jak pień ścięty piłą, więc odrost wydaje się grubszy niż naturalnie zwężona końcówka. Badania od dekad nie wykazały wpływu golenia, a grubość, kolor i tempo wzrostu zależą od genów. Gdyby to działało, golenie leczyłoby łysienie, a Jeff Bezos wciąż jest łysy."},{"t":"4. Można pływać zaraz po jedzeniu","d":"Według autora nie ma ani jednego udokumentowanego utonięcia z powodu pływania po jedzeniu, choć zasady 30 minut pilnowali nawet ratownicy. Po dużym posiłku można najwyżej złapać lekki skurcz jak przy bieganiu. Pływacy jedzą podczas treningów, a Czerwony Krzyż to potwierdza."},{"t":"3. Głowa nie traci połowy ciepła","d":"Mit o 40-45% ciepła pochodzi z wojskowego podręcznika, w którego badaniu ludzie byli w pełnym stroju zimowym z odkrytą tylko głową. Głowa to ok. 10% powierzchni ciała, więc traci ok. 10% ciepła; strata zależy od odkrytej skóry. Wyjątkiem są niemowlęta i małe dzieci, bo mają proporcjonalnie większe głowy."},{"t":"2. Złota rybka ma dobrą pamięć","d":"Złote rybki rozwiązują labirynty i pamiętają rozwiązanie przez miesiące, rozpoznają twarze, uczą się sztuczek, np. przepływania przez obręcze czy \"gry w piłkę\", i rozróżniają utwory muzyczne, mając mózg mniejszy od ziarnka grochu. Badanie ich mózgu może pomóc zrozumieć ludzką pamięć."},{"t":"1. Połknięta guma nie zostaje na 7 lat","d":"Guma przechodzi przez przewód pokarmowy jak inne jedzenie, tylko się nie rozkłada, podobnie jak ziarna kukurydzy, i wychodzi w 1-2 dni. Żołądek ciągle się porusza, więc nic się nie przykleja. Problem może być tylko przy połykaniu dużych ilości."}],"conclusion":"Większość \"oczywistych\" faktów z dzieciństwa to mity, które przetrwały, bo brzmią przekonująco albo powtarzali je rodzice.","factchecks":[{"claim":"Cukier nie powoduje nadpobudliwości u dzieci; rodzice widzą ją z powodu oczekiwań.","verdict":"prawda","note":"Metaanaliza 16 ślepych badań (JAMA 1995) nie wykazała wpływu cukru na zachowanie.","src":[["JAMA 1995, Wolraich i in. (PubMed)","https://pubmed.ncbi.nlm.nih.gov/7474248/"],["Hoover i Milich 1994, J Abnorm Child Psychol","https://link.springer.com/article/10.1007/BF02168088"]],"p":0},{"claim":"Mit 10% mózgu; mózg to 2% masy i 20% energii.","verdict":"prawda","note":"Obrazowanie pokazuje aktywność całego mózgu; dane o 2% masy i 20% energii są standardowe.","src":[["Wikipedia (ang.): mit 10% mózgu - hasło \"Ten percent of the brain myth\"","https://en.wikipedia.org/wiki/Ten_percent_of_the_brain_myth"],["Scientific American: mit 10%","https://www.scientificamerican.com/article/do-people-only-use-10-percent-of-their-brains/"]],"p":1},{"claim":"Moneta osiąga prędkość graniczną ok. 40 km/h i nie zabije.","verdict":"prawda","note":"Zmierzono ok. 40-80 km/h; moneta nie przebije czaszki.","src":[["Wikipedia (ang.): lista powszechnych mitów (moneta z wieżowca) - hasło \"List of common misconceptions\"","https://en.wikipedia.org/wiki/List_of_common_misconceptions_about_science,_technology,_and_mathematics"],["Wikipedia (ang.): prędkość graniczna - hasło \"Terminal velocity\"","https://en.wikipedia.org/wiki/Terminal_velocity"]],"p":2},{"claim":"Empire State Building: ok. 25 uderzeń pioruna rocznie; Roy Sullivan przeżył 7 uderzeń.","verdict":"prawda","note":"NOAA podaje ok. 20-25 uderzeń rocznie w Empire State Building. Sullivan jest w Księdze Guinnessa jako osoba trafiona 7 razy (1942-1977).","src":[["NOAA/NWS: mity o piorunach","https://www.weather.gov/safety/lightning-myths"],["Wikipedia (ang.): Roy Sullivan","https://en.wikipedia.org/wiki/Roy_Sullivan"]],"p":3},{"claim":"Rogate hełmy z Danii są o 3000 lat starsze od wikingów.","verdict":"fałsz","note":"Hełmy z Viksø są z ok. 900 p.n.e., czyli ok. 1700 lat przed wikingami, nie 3000.","src":[["Aarhus University: datowanie hełmów z Viksø","https://cas.au.dk/en/currently/news/show/artikel/new-study-about-the-viksoe-helmets"],["Smithsonian: hełmy mają prawie 3000 lat","https://www.smithsonianmag.com/smart-news/iconic-viking-horned-helmets-actually-3000-years-old-180979339/"]],"p":4},{"claim":"Golenie nie zmienia grubości ani tempa wzrostu włosów.","verdict":"prawda","note":"Badania od lat 20. XX w. nie wykazały wpływu golenia na włosy; Mayo Clinic potwierdza.","src":[["Mayo Clinic: golenie a odrost włosów","https://www.mayoclinic.org/healthy-lifestyle/adult-health/expert-answers/hair-removal/faq-20058427"]],"p":5},{"claim":"Pływanie zaraz po jedzeniu nie jest groźne; Czerwony Krzyż to potwierdza.","verdict":"prawda","note":"Czerwony Krzyż nie znalazł dowodów na utonięcia związane z jedzeniem przed pływaniem.","src":[["Wikipedia (ang.): lista powszechnych mitów (pływanie po jedzeniu) - hasło \"List of common misconceptions\"","https://en.wikipedia.org/wiki/List_of_common_misconceptions_about_science,_technology,_and_mathematics"]],"p":6},{"claim":"Mit 40-45% ciepła tracone przez głowę pochodzi z wojskowego podręcznika; głowa to ok. 10% powierzchni.","verdict":"prawda","note":"BMJ (2008): mit pochodzi z badań armii USA; głowa to ok. 7-10% powierzchni ciała.","src":[["BMJ 2008: świąteczne mity medyczne (DOI)","https://doi.org/10.1136/bmj.a2769"]],"p":7},{"claim":"Złote rybki pamiętają przez miesiące, uczą się sztuczek i rozróżniają muzykę.","verdict":"prawda","note":"Badania pokazują pamięć trwającą miesiące i rozróżnianie muzyki u złotych rybek.","src":[["Wikipedia (ang.): złota rybka (pamięć) - hasło \"Goldfish\"","https://en.wikipedia.org/wiki/Goldfish"],["Shinozuka i in. 2013, muzyka a złote rybki (PubMed)","https://pubmed.ncbi.nlm.nih.gov/23796771/"]],"p":8},{"claim":"Połknięta guma wychodzi w 1-2 dni, nie zostaje 7 lat.","verdict":"prawda","note":"Gastroenterolodzy potwierdzają; problemy (bezoar) zdarzają się tylko przy bardzo częstym połykaniu dużych ilości, zwłaszcza u dzieci.","src":[["Scientific American: połknięta guma","https://www.scientificamerican.com/article/fact-or-fiction-chewing-gum-takes-seven-years-to-digest/"],["Mayo Clinic: połknięta guma","https://www.mayoclinic.org/healthy-lifestyle/nutrition-and-healthy-eating/expert-answers/digestion/faq-20058446"]],"p":9}],"bias":"Rzetelny, w większości zgodny z nauką. Jedyny wyraźny błąd: wiek hełmów z Viksø. Ton prześmiewczy wobec rodziców, ale bez tendencyjności.","channel":"Chill Dude Explains","section":"Chill Dude Explains"},{"id":"TsWsDwn7mlA","title_pl":"Jak Egipcjanie zapomnieli hieroglifów","title":"How did the Egyptians forget Hieroglyphs?","channel":"toldinstone","url":"https://www.youtube.com/watch?v=TsWsDwn7mlA","date":"2025-04-25","duration":653,"views":759630,"section":"Historia","transcript":"youtube","added":"2026-11-03","tags":["Historia"],"about":"Dlaczego po ponad 3500 latach użycia hieroglify przestały być czytelne: upadek świątyń, kapłanów i rzymska kontrola.","intro":"Garrett Ryan z toldinstone zaczyna od ostatniej inskrypcji hieroglificznej na wyspie File z 394 r. Opisuje, jak w czasach rzymskich pismo wciąż się rozwijało, jak Rzym odebrał świątyniom majątek i autonomię i dlaczego, gdy zniknęli kapłani, nikt nie umiał już czytać hieroglifów, choć Rzymian bardzo one ciekawiły.","points":[{"t":"Ostatnia inskrypcja","d":"W świątyni Izydy na File wyryto napis ku czci boga Mandulisa, datowany na urodziny Ozyrysa, czyli 24 sierpnia 394 r. Hieroglify powstały ok. XXXIII w. p.n.e., a dłuższą historię mają dziś według autora tylko znaki chińskie."},{"t":"Pismo wciąż się rozwijało","d":"W czasach rzymskich język zapisywany hieroglifami miał prawie 2000 lat, ale liczba znaków wzrosła z ok. 750 do kilku tysięcy. W świątyni w Esnie jeden hymn zapisano wyłącznie znakami krokodyli, a inny baranów."},{"t":"Hieroglify w rzymskim Egipcie","d":"Pierwszy prefekt Korneliusz Gallus upamiętnił stłumienie buntu napisem po łacinie, grecku i hieroglifami, a obeliski zamawiali Domicjan i Hadrian. Za Trajana w Oksyrynchos pracowało co najmniej 5 zawodowych rytowników hieroglifów."},{"t":"Świątynie pełne tekstów","d":"Większość tekstów była w świątyniach: hymny, rytuały świąt, mity. Publikacja rzymskich inskrypcji z Dendery ma prawie 2000 stron, a z Esny ponad 1000; cesarze występowali na reliefach jako faraonowie."},{"t":"Miliony mumii zwierząt","d":"Pobożność ludowa była silna: świątynie Memfis sprzedawały zwierzęta na ofiary, a w katakumbach Sakkary jest podobno ponad 4 mln zmumifikowanych ibisów i pół miliona sokołów."},{"t":"Rzym przejmuje świątynie","d":"Za Ramzesa III świątynia Amona w Karnaku miała ok. 2800 km² ziemi, 421 tys. bydła i 65 miast. Ptolemeusze dawali świątyniom autonomię, a Rzymianie zabrali większość majątków, uzależnili je od państwowych pensji i ograniczyli przywileje kapłanów."},{"t":"Koniec wsparcia","d":"Po nawróceniu Konstantyna cesarskie wsparcie ustało; ostatnim cesarzem na ścianie świątyni był Maksymin Daja (310-313). Świątynię w Luksorze za Dioklecjana zamieniono w fort legionu, a w świątyni grobowej Ramzesa III wyrosła wieś z kościołem."},{"t":"Pismo garstki kapłanów","d":"Nawet w czasach faraonów hieroglify znało mniej niż 1% ludności, głównie w świątyniach. Gdy greka stała się językiem administracji, uczyć się ich mieli powód już tylko kapłani, a ci znikali."},{"t":"Rzymska ciekawość","d":"Obelisk z II w. we Florencji ma przypadkowe znaki, a Tablica Bembo z Rzymu tylko udaje hieroglify. Hadrian wypytywał kapłanów o znaki, Chajremon, nauczyciel Nerona, pisał o nich traktat, ale żaden znany autor nie twierdził, że umie je czytać."},{"t":"Hieroglifika Horapollona","d":"Uważano, że znaki to alegorie świętej mądrości. Jedyne egipskie dzieło o hieroglifach przetłumaczone na grekę, Hieroglifika Horapollona z ok. V w., znało część znaczeń, ale nie wiedziało, jak znaki tworzą zdania."}],"conclusion":"Hieroglify zniknęły razem ze świątyniami i kapłanami, którzy jako jedyni ich uczyli.","factchecks":[{"claim":"Ostatnia inskrypcja hieroglificzna na File pochodzi z 24 sierpnia 394 r.","verdict":"prawda","note":"Graffito Esmet-Achoma datuje się na 24 sierpnia 394 r., to ostatni znany tekst hieroglificzny.","p":0,"src":[["Wikipedia (ang.): graffito Esmet-Achoma - hasło \"Graffito of Esmet-Akhom\"","https://en.wikipedia.org/wiki/Graffito_of_Esmet-Akhom"]]},{"claim":"Liczba hieroglifów wzrosła z ok. 750 do kilku tysięcy w epoce grecko-rzymskiej.","verdict":"prawda","note":"Klasyczny egipski używał ok. 750-900 znaków, w epoce ptolemejskiej i rzymskiej ok. 5000-7000.","p":1,"src":[["Wikipedia (ang.): hieroglify egipskie - hasło \"Egyptian hieroglyphs\"","https://en.wikipedia.org/wiki/Egyptian_hieroglyphs"]]},{"claim":"Świątynia Amona w Tebach miała za Ramzesa III ogromne ziemie i ok. 421 tys. bydła.","verdict":"prawda","note":"Papirus Harris I podaje, że Teby zarządzały 80% świątynnej ziemi i 86% bydła.","p":5,"src":[["Wikipedia (ang.): Papirus Harris I - hasło \"Papyrus Harris I\"","https://en.wikipedia.org/wiki/Papyrus_Harris_I"]]},{"claim":"Tablica Bembo zrobiona w Rzymie tylko naśladuje hieroglify.","verdict":"prawda","note":"Powstała w Rzymie w 2. połowie I w.; jej twórca w ogóle nie rozumiał hieroglifów.","p":8,"src":[["Wikipedia (ang.): Tablica Bembo - hasło \"Bembine Tablet\"","https://en.wikipedia.org/wiki/Bembine_Tablet"]]},{"claim":"Chajremon z Aleksandrii uczył Nerona i pisał o hieroglifach.","verdict":"prawda","note":"Był nauczycielem Nerona przed 49 r.; jego dzieło o hieroglifach zachowało się tylko we fragmentach.","p":8,"src":[["Wikipedia (ang.): Chajremon z Aleksandrii - hasło \"Chaeremon of Alexandria\"","https://en.wikipedia.org/wiki/Chaeremon_of_Alexandria"]]},{"claim":"Hieroglifika Horapollona powstała ok. V w. i błędnie tłumaczyła wiele znaków.","verdict":"prawda","note":"Datowana na V w.; część znaczeń jest trafna, ale interpretacje są głównie alegoryczne.","p":9,"src":[["Wikipedia (ang.): Horapollo - hasło \"Horapollo\"","https://en.wikipedia.org/wiki/Horapollo"]]},{"claim":"W Sakkarze jest ponad 4 mln mumii ibisów.","verdict":"nie da się sprawdzić","note":"Szacunki dla katakumb ibisów w Sakkarze sięgają milionów, ale dokładnych liczb brak.","p":4,"src":[["Wikipedia (ang.): mumie zwierząt - hasło \"Animal mummy\"","https://en.wikipedia.org/wiki/Animal_mummy"]]}],"bias":"Rzetelny, spokojny wykład; kilka liczb podanych jako pewne to szacunki. Reklama biurka w środku."},{"id":"wztjGaAiqME","title_pl":"Niewinne nawyki, które po cichu niszczą twoje ciało","title":"Innocent Habits That Are Secretly Wrecking Your Body","url":"https://www.youtube.com/watch?v=wztjGaAiqME","date":"2025-04-21","duration":733,"views":1492461,"transcript":"youtube","added":"2026-11-03","tags":["Ciało i zdrowie"],"about":"9 codziennych nawyków, które według autora po cichu szkodzą zdrowiu, od obgryzania paznokci po wstrzymywanie moczu.","intro":"Ranking 9 codziennych nawyków, które według autora po cichu szkodzą zdrowiu. Są to obgryzanie paznokci, tłumienie kichnięć, czyszczenie uszu patyczkami, picie za dużo wody, głośne słuchawki, światło w nocy, siedzenie, spanie na brzuchu i wstrzymywanie moczu. Przy każdym autor opisuje mechanizm szkody i czasem daje prostą radę, co robić zamiast tego.","points":[{"t":"9. Obgryzanie paznokci","d":"Paznokcie zbierają zarazki z klamek, telefonów i klawiatur, a obgryzanie przenosi je do ust i wyszczerbia przednie zęby. Zerwane skórki otwierają drogę do zanokcicy. Według autora obgryzacze mają więcej infekcji żołądka i jelit, a nawyk wiąże się z lękiem."},{"t":"8. Tłumienie kichnięć","d":"Kichnięcie ma osiągać do ok. 160 km/h, a zatkanie nosa i ust kieruje ciśnienie z powrotem do głowy. Przez trąbki Eustachiusza może pęknąć błona bębenkowa, mogą pękać naczynka w oczach i nosie, rzadko dochodzi do uszkodzenia gardła. Ktoś złamał małą kość twarzy i miał powietrze pod skórą."},{"t":"7. Patyczki do uszu","d":"Patyczek nie czyści, tylko wpycha woskowinę głębiej, a uszy oczyszczają się same; zbita woskowina zmniejsza słyszenie i bywa usuwana na SOR. Błona bębenkowa jest cienka jak folia spożywcza, a ranki i wilgoć sprzyjają infekcjom. Rada: myć tylko małżowinę myjką."},{"t":"6. Przewodnienie","d":"Hiponatremia: przy szybkim piciu dużej ilości wody nerki nie nadążają, sodu jest za mało i komórki, także mózgu, puchną. Skutki to ból głowy, dezorientacja, drgawki, a nawet śmierć; 9-letnia dziewczynka zmuszona do picia za karę ledwo przeżyła. Rada: pij, gdy chce ci się pić."},{"t":"5. Słuchawki","d":"Komórki rzęsate w ślimaku ucha nie odrastają. Rozmowa to ok. 60 dB, słuchawki dają 105 dB i więcej, a powyżej 85 dB słuch się uszkadza, przy 100 dB w ok. 15 minut, bez bólu. Według autora wielu nastolatków ma słuch 50-latków, a aparat słuchowy go nie przywraca."},{"t":"4. Lampki nocne","d":"Po zmroku organizm wytwarza melatoninę, a nawet słabe światło (ładowarka, latarnia, budzik) może obciąć ją o połowę. Długotrwale rozregulowuje to metabolizm: tycie bez zmiany diety i gorsze działanie insuliny. Myszy przy słabym świetle nocą tyły i miały objawy depresji; zaburzony sen wiąże się z lękiem."},{"t":"3. Krzesło","d":"Przy wielogodzinnym siedzeniu krew zalega w nogach, co zwiększa ryzyko zakrzepów, spada spalanie kalorii i aktywność enzymów rozkładających tłuszcz. Mięśnie brzucha i pleców słabną, a sylwetka się garbi. Według autora pracownik biurowy siedzi ok. 15 godzin dziennie, a część naukowców mówi \"siedzenie to nowe palenie\"."},{"t":"2. Spanie na brzuchu","d":"Żeby oddychać, trzeba skręcić szyję na bok na wiele godzin, a ciężar ciała spłaszcza naturalne krzywizny kręgosłupa. Uciskane nerwy dają mrowienie i drętwienie rąk, a z czasem przewlekły ból szyi i pleców. Rada: bardzo płaska poduszka, mała poduszka pod miednicę, a najlepiej nauka spania na plecach lub boku."},{"t":"1. Wstrzymywanie moczu","d":"Pęcherz wysyła sygnał, gdy jest w połowie pełny, a ignorowanie go rozciąga go jak gumkę, która traci sprężystość. Osłabiony nie opróżnia się do końca, a zalegający mocz sprzyja zakażeniom dróg moczowych. Pęknięcie jest rzadkie, ale z latami może osłabnąć dno miednicy i pojawić się nietrzymanie."}],"conclusion":"Drobne nawyki powtarzane codziennie sumują się w realne szkody, więc warto je korygować, zanim pojawią się objawy.","factchecks":[{"claim":"Kichnięcie osiąga ok. 160 km/h.","verdict":"fałsz","note":"Pomiar szybką kamerą (2013) dał ok. 16 km/h; 160 km/h to dawne szacunki.","src":[["Tang i in. 2013, PLOS One","https://journals.plos.org/plosone/article?id=10.1371%2Fjournal.pone.0059970"]],"p":1},{"claim":"Tłumione kichnięcie może uszkodzić gardło i uszy.","verdict":"prawda","note":"Opisano m.in. pęknięcie gardła u mężczyzny, który zatkał nos i usta (BMJ Case Reports, 2018). To jednak bardzo rzadkie przypadki.","src":[["BMJ Case Reports 2018 (PubMed)","https://pubmed.ncbi.nlm.nih.gov/29335355/"]],"p":1},{"claim":"Patyczki wpychają woskowinę i mogą uszkodzić błonę bębenkową.","verdict":"prawda","note":"Zgodne z wytycznymi otolaryngologów (AAO-HNS) i analizami urazów u dzieci.","src":[["Wikipedia (ang.): patyczki higieniczne (ryzyka) - hasło \"Cotton swab\"","https://en.wikipedia.org/wiki/Cotton_swab"],["AAO-HNS: wytyczne o woskowinie","https://www.enthealth.org/conditions/earwax-cerumen/"]],"p":2},{"claim":"Zbyt dużo wody może zabić (hiponatremia).","verdict":"prawda","note":"Zatrucie wodą jest dobrze udokumentowane; przypadku 9-latki nie udało się zweryfikować.","src":[["Wikipedia (ang.): zatrucie wodne - hasło \"Water intoxication\"","https://en.wikipedia.org/wiki/Water_intoxication"]],"p":3},{"claim":"Powyżej 85 dB grozi uszkodzenie słuchu, przy 100 dB po ok. 15 minutach; nastolatki mają słuch 50-latków.","verdict":"półprawda","note":"Progi zgadzają się z normą NIOSH, ale \"słuch 50-latków\" nie ma źródła.","src":[["CDC/NIOSH: hałas w pracy a utrata słuchu","https://www.cdc.gov/niosh/noise/about/index.html"],["WHO: głuchota i utrata słuchu","https://www.who.int/news-room/fact-sheets/detail/deafness-and-hearing-loss"]],"p":4},{"claim":"Przyćmione światło nocą tuczy myszy.","verdict":"prawda","note":"Myszy przy słabym świetle nocą tyły (PNAS 2010); u ludzi są tylko korelacje.","src":[["Fonken i in. 2010, PNAS (DOI)","https://doi.org/10.1073/pnas.1008734107"]],"p":5},{"claim":"Przeciętny pracownik biurowy siedzi do 15 godzin dziennie; \"siedzenie to nowe palenie\".","verdict":"fałsz","note":"Dorośli siedzą ok. 9-10 h dziennie, a ryzyko palenia jest wielokrotnie wyższe.","src":[["Wikipedia (ang.): siedzący tryb życia - hasło \"Sedentary lifestyle\"","https://en.wikipedia.org/wiki/Sedentary_lifestyle"],["Ekelund i in. 2016, Lancet (DOI)","https://doi.org/10.1016/S0140-6736(16)30370-1"]],"p":6},{"claim":"Obgryzacze paznokci mają istotnie więcej infekcji przewodu pokarmowego.","verdict":"nie da się sprawdzić","note":"Obgryzanie przenosi bakterie, ale brak solidnych badań o częstszych infekcjach jelitowych.","src":[["Wikipedia (ang.): obgryzanie paznokci - hasło \"Nail biting\"","https://en.wikipedia.org/wiki/Nail_biting"]],"p":0},{"claim":"Częste wstrzymywanie moczu osłabia dno miednicy i prowadzi do nietrzymania.","verdict":"półprawda","note":"Okazjonalne wstrzymywanie jest bezpieczne; szkodzi tylko wieloletnie, skrajne.","src":[["Cleveland Clinic: skutki długiego wstrzymywania moczu","https://my.clevelandclinic.org/health/diseases/22208-shy-bladder-syndrome-paruresis"],["Kettering Health: jak długo można wstrzymywać mocz","https://ketteringhealth.org/how-long-should-i-hold-my-pee/"]],"p":8}],"bias":"Straszy (\"cichy zabójca\") i podaje kilka przesadzonych liczb (kichnięcie, 15 h siedzenia). Rady są w większości sensowne, ale ryzyka są wyolbrzymione.","channel":"Chill Dude Explains","section":"Chill Dude Explains"},{"id":"wJyJUUv_7DA","title_pl":"Prawda o koślawieniu kolan","title":"The Truth About Knee Valgus","channel":"E3 Rehab","url":"https://www.youtube.com/watch?v=wJyJUUv_7DA","date":"2025-04-20","duration":1185,"views":54625,"section":"Sport","transcript":"whisper","added":"2026-11-03","tags":["Ciało i zdrowie","Trening","Mity"],"about":"Fizjoterapeuta E3 Rehab wyjaśnia, czym jest koślawienie kolan w przysiadzie, sporcie i bieganiu i kiedy naprawdę warto je korygować.","intro":"E3 Rehab tłumaczy anatomię koślawienia kolan (knee valgus) i przegląda badania na jego temat. Pokazuje, dlaczego w przysiadzie na dwóch nogach zwykle nie jest groźne, czemu nie da się nim przewidzieć zerwania więzadła krzyżowego i co robić u biegaczy.","points":[{"t":"Czym jest koślawienie","d":"To odwiedzenie piszczeli względem kości udowej. W staniu większość ludzi ma 5-10 stopni; więcej to kolana koślawe. Kolano nie ma mięśni, które by je odwodziły, więc dynamiczne koślawienie jest skutkiem ruchu bioder i stóp."},{"t":"Przyczyny w przysiadzie","d":"Wiąże się z ograniczonym zgięciem grzbietowym stopy, ale słabe pośladki to według autora mit: badania dały sprzeczne wyniki, a w jednym osoby z koślawieniem miały silniejsze biodra."},{"t":"Strategia u zaawansowanych","d":"U doświadczonych sztangistów koślawienie pojawia się dopiero przy ciężarach bliskich maksymalnym. Pośladek wielki i przywodziciel wielki wspólnie szukają najsilniejszej pozycji; u początkujących to raczej brak wprawy."},{"t":"Czy to szkodzi w przysiadzie","d":"Przy dużym zgięciu kolana obciążenie więzadła krzyżowego przedniego jest minimalne, a ruch jest wolny i na dwóch nogach. Według autora koślawienie nie jest groźniejsze od innego wzorca ruchu."},{"t":"Jak korygować u początkujących","d":"Pokazać technikę, dać zewnętrzne wskazówki, ewentualnie szersze ustawienie stóp ze stopami na zewnątrz, a potem pozwolić ćwiczyć. Przy słabym zgięciu stopy pomagają podkładki pod pięty lub buty do podnoszenia ciężarów."},{"t":"Guma na kolanach","d":"Przegląd z 2023 roku wykazał, że lekkie gumy nie zmieniają koślawienia, a ciężkie je zwiększają."},{"t":"Sport i więzadło krzyżowe","d":"Zerwanie ACL to zwykle koślawienie lekko zgiętego kolana z dużą, szybką siłą. Mimo badania z 2005 roku na 205 zawodniczkach nowsze badania na tysiącach sportowców nie znalazły związku, a trenerzy przewidują urazy na poziomie rzutu monetą."},{"t":"Profilaktyka dla wszystkich","d":"Dlatego program zapobiegania urazom z ćwiczeniami siłowymi i plyometrią powinien dostać każdy sportowiec, a nie tylko ci z koślawieniem."},{"t":"Biegacze","d":"Większe przywiedzenie biodra może wiązać się z bólem rzepkowo-udowym i pasma biodrowo-piszczelowego. Najpierw sprawdza się zmiany w kilometrażu, potem pomagają korekta biegu i ćwiczenia siłowe."}],"conclusion":"Koślawienie w przysiadzie nie jest samo w sobie groźne; w sporcie nie przewiduje urazów, więc profilaktykę powinien mieć każdy.","factchecks":[{"claim":"Badanie z 2005 roku na 205 zawodniczkach wiązało koślawienie z ryzykiem zerwania ACL.","verdict":"prawda","note":"To prospektywne badanie Hewetta i wsp. w Am J Sports Med z 2005 roku.","p":6,"src":[["PubMed: Hewett i wsp. 2005, koślawienie a ryzyko ACL - \"Biomechanical measures of neuromuscular control and valgus loading\"","https://pubmed.ncbi.nlm.nih.gov/15722287/"]]},{"claim":"Nowsze badania nie znalazły związku koślawienia z przyszłym urazem ACL.","verdict":"prawda","note":"Krosshaug i wsp. (2016) oraz praca \"Kiss goodbye to the kissing knees\" nie wykazały związku u elitarnych zawodniczek.","p":6,"src":[["PubMed: Krosshaug i wsp. 2016, test zeskoku jako badanie przesiewowe - \"The Vertical Drop Jump Is a Poor Screening Test\"","https://pubmed.ncbi.nlm.nih.gov/26867936/"],["PubMed: Sports Biomech, brak związku - \"Kiss goodbye to the kissing knees\"","https://pubmed.ncbi.nlm.nih.gov/33906580/"]]},{"claim":"Trenerzy i lekarze nie potrafią przewidzieć zerwania ACL lepiej niż rzut monetą.","verdict":"prawda","note":"Badanie w Br J Sports Med (2020) pokazało trafność przewidywań na poziomie przypadku.","p":6,"src":[["PubMed: Br J Sports Med 2020 - \"I spy with my little eye ... a knee about to go 'pop'?\"","https://pubmed.ncbi.nlm.nih.gov/31611189/"]]},{"claim":"Lekkie gumy nie zmieniają koślawienia, a ciężkie je zwiększają.","verdict":"prawda","note":"Tak podsumowuje przegląd narracyjny z 2023 roku o gumach w przysiadach.","p":5,"src":[["PubMed: Int J Sports Phys Ther 2023 - \"The Use of Elastic Resistance Bands to Reduce Dynamic Knee Valgus\"","https://pubmed.ncbi.nlm.nih.gov/37795322/"]]},{"claim":"Korekta biegu i ćwiczenia siłowe pomagają biegaczom z bólem rzepkowo-udowym.","verdict":"prawda","note":"Przegląd Neala i wsp. (2016) wskazał, że te interwencje zmieniają biomechanikę i zmniejszają ból.","p":8,"src":[["PubMed: Neal i wsp. 2016, biegacze z bólem rzepki - \"Runners with patellofemoral pain have altered biomechanics\"","https://pubmed.ncbi.nlm.nih.gov/26979886/"]]}],"bias":"Wyważony i oparty na badaniach. Autor sam zaznacza ograniczenia (np. guma może pomagać części osób). Na końcu krótka reklama programów E3 Rehab."},{"id":"19UC0V9Ul2M","title_pl":"Bardzo niepokojące rzeczy, które robi twoje ciało","title":"Very CREEPY Things Your Body Does","url":"https://www.youtube.com/watch?v=19UC0V9Ul2M","date":"2025-04-07","duration":597,"views":1909931,"transcript":"youtube","added":"2026-11-03","tags":["Ciało i zdrowie","Nauka"],"about":"Ranking 10 \"przerażających\" rzeczy, które robi ludzkie ciało i mózg, od drgnięć przy zasypianiu po roztocza w rzęsach.","intro":"Ranking 10 rzeczy, które ludzkie ciało i mózg robią \"za twoimi plecami\". Autor zaczyna od drgnięć przy zasypianiu i fantomowych wibracji telefonu, przechodzi przez pasożyta Toxoplasma, paraliż senny i \"drugi mózg\" w jelitach, a kończy na roztoczach żyjących w rzęsach. Ton jest celowo straszny, a każdy punkt to krótka ciekawostka bez podanych źródeł.","points":[{"t":"10. Drgnięcia przy zasypianiu","d":"Ma to ok. 70% ludzi: gdy mięśnie się rozluźniają, mózg bierze to za spadanie i budzi nas szarpnięciem, czasem z obrazem upadku lub hukiem. Autor podaje hipotezę, że to pozostałość po spaniu na drzewach. Zmęczenie i stres to nasilają."},{"t":"9. Syndrom fantomowych wibracji","d":"Według autora zgłasza je do 90% posiadaczy telefonów. Mózg przyzwyczajony do powiadomień bierze ruch ubrania czy drgnięcie mięśnia za wibrację. Im większy lęk przed przegapieniem wiadomości, tym częściej, a zmiana kieszeni nie pomaga, bo \"wibracje\" przenoszą się w nowe miejsce."},{"t":"8. Pasożyty sterujące","d":"Toxoplasm nią się w dziwne kształty. Zdarza się to muzykom w trakcie grania utworu, który znają od lat."},{"t":"1. Roztocza w rzęsach","d":"Prawie każdy dorosły ma w mieszkach rzęs roztocza, które jedzą martwy naskórek i łój. W nocy wychodzą na twarz i się rozmnażają, a odchody gromadzą do śmierci i uwalniają naraz. Około 60. roku życia mają je prawie wszystkie mieszki."}],"conclusion":"Ciało i mózg robią mnóstwo dziwnych rzeczy bez naszej wiedzy, a wiele z nich to ślady dawnej ewolucji.","factchecks":[{"claim":"Drgnięcia przy zasypianiu ma ok. 70% ludzi; to pozostałość po spaniu na drzewach.","verdict":"półprawda","note":"Częstość 60-70% jest podawana w literaturze, ale wyjaśnienie z drzewami to tylko hipoteza.","src":[["Wikipedia (ang.): drgawki hipnagogiczne - hasło \"Hypnic jerk\"","https://en.wikipedia.org/wiki/Hypnic_jerk"]],"p":0},{"claim":"Fantomowe wibracje zgłasza do 90% użytkowników.","verdict":"prawda","note":"W badaniu Drouin i in. (2012) 89% studentów zgłosiło fantomowe wibracje. Inne badania dają niższe wartości, więc \"do 90%\" to górna granica.","src":[["Drouin i in. 2012 (DOI)","https://doi.org/10.1016/j.chb.2012.03.013"],["Wikipedia (ang.): syndrom fantomowych wibracji - hasło \"Phantom vibration syndrome\"","https://en.wikipedia.org/wiki/Phantom_vibration_syndrome"]],"p":1},{"claim":"Toxoplasma jest u ok. 30% ludzi i zmienia osobowość oraz zwiększa ryzyko wypadków.","verdict":"przesada","note":"Zarażenie ok. 30% ludzi i efekt u myszy są potwierdzone; u ludzi są tylko korelacje, film podaje je jak pewnik.","src":[["Wikipedia (ang.): toksoplazmoza - hasło \"Toxoplasmosis\"","https://en.wikipedia.org/wiki/Toxoplasmosis"],["CDC: toksoplazmoza","https://www.cdc.gov/toxoplasmosis/about/index.html"]],"p":2},{"claim":"Paraliż senny: świadomość przy zablokowanych mięśniach REM, halucynacje postaci, ucisk w klatce.","verdict":"prawda","note":"Opis kliniczny się zgadza; doświadcza go ok. 8% ludzi przynajmniej raz, nie \"co noc\".","src":[["Wikipedia (ang.): paraliż senny - hasło \"Sleep paralysis\"","https://en.wikipedia.org/wiki/Sleep_paralysis"],["Sharpless i Barber 2011 (PubMed)","https://pubmed.ncbi.nlm.nih.gov/21571556/"]],"p":3},{"claim":"Kichanie od światła jest dziedziczne.","verdict":"prawda","note":"Dotyczy ok. 18-35% ludzi i jest dziedziczny; mechanizm nerwowy to wiodąca hipoteza.","src":[["Wikipedia (ang.): odruch kichania na światło - hasło \"Photic sneeze reflex\"","https://en.wikipedia.org/wiki/Photic_sneeze_reflex"]],"p":4},{"claim":"W jelitach jest ok. 500 mln neuronów, więcej niż w mózgu kota.","verdict":"półprawda","note":"Szacunki to 100-600 mln neuronów; cały mózg kota ma ich więcej, więc porównanie jest mylące.","src":[["Stanford: drugi mózg w jelitach","https://neuroscience.stanford.edu/news/your-gut-second-brain"],["Liczba neuronów w jelitowym układzie nerwowym (PubMed)","https://pubmed.ncbi.nlm.nih.gov/35929768/"]],"p":5},{"claim":"Jelita produkują 90% serotoniny, co steruje nastrojem.","verdict":"przesada","note":"Ok. 90% serotoniny powstaje w jelitach, ale nie trafia do mózgu; \"sterowanie nastrojem\" to uproszczenie.","src":[["Wikipedia (ang.): serotonina - hasło \"Serotonin\"","https://en.wikipedia.org/wiki/Serotonin"],["Caltech: bakterie a serotonina jelit","https://www.caltech.edu/about/news/microbes-help-produce-serotonin-gut-46495"]],"p":5},{"claim":"Autofagia w neuronach głodu wzmacnia uczucie głodu.","verdict":"prawda","note":"Autofagia w neuronach reguluje głód (badanie na myszach, 2011); \"mózg zjada sam siebie\" to dramatyzacja.","src":[["Kaushik i in. 2011 (PubMed)","https://pubmed.ncbi.nlm.nih.gov/21803288/"],["Wikipedia (ang.): autofagia - hasło \"Autophagy\"","https://en.wikipedia.org/wiki/Autophagy"]],"p":6},{"claim":"Zespół Capgrasa i jamais vu (wywoływane wielokrotnym pisaniem słowa).","verdict":"prawda","note":"Capgras to opisane urojenie, a jamais vu wywoływano przepisywaniem słowa (Moulin, Ig Nobel 2023).","src":[["Wikipedia (ang.): zespół Capgrasa - hasło \"Capgras delusion\"","https://en.wikipedia.org/wiki/Capgras_delusion"],["Wikipedia (ang.): jamais vu","https://en.wikipedia.org/wiki/Jamais_vu"]],"p":[7,8]},{"claim":"Nużeńce nie mają odbytu i uwalniają odchody po śmierci.","verdict":"fałsz","note":"Badanie genomu z 2022 r. wykazało, że nużeńce mają odbyt; reszta opisu się zgadza.","src":[["University of Reading: sekretne życie roztoczy","https://www.reading.ac.uk/news/2022/Research-News/Secret-lives-of-skin-mites-in-our-faces"],["Smith i in. 2022, Molecular Biology and Evolution","https://doi.org/10.1093/molbev/msac125"]],"p":9}],"bias":"Sensacyjny język (\"mózg zjada sam siebie\"); korelacje podane jak pewniki, a mit o nużeńcach jest już obalony.","channel":"Chill Dude Explains","section":"Chill Dude Explains"},{"id":"R05pjBE7eFo","title_pl":"Czy musisz poprawiać postawę? Raczej nie","title":"Do You NEED To Fix Your Posture? (Probably Not)","channel":"E3 Rehab","url":"https://www.youtube.com/watch?v=R05pjBE7eFo","date":"2025-03-23","duration":648,"views":27576,"section":"Sport","transcript":"whisper","added":"2026-11-03","tags":["Ciało i zdrowie","Mity","Nauka"],"about":"Fizjoterapeuta E3 Rehab wyjaśnia, dlaczego statyczna postawa słabo przewiduje ból i co ma większe znaczenie niż wyprostowane plecy.","intro":"E3 Rehab polemizuje z popularnym przekonaniem, że zła postawa powoduje ból. Omawia badania, zdjęcia przed i po, przemysł żerujący na kompleksach i to, czy ćwiczenia posturalne mają sens. Odpowiedź autora: poprawianie postawy raczej nie jest potrzebne.","points":[{"t":"Postawa a ból","d":"Według autora większość dobrych badań pokazuje, że postawa nie jest związana z bólem, sprawnością ani rokowaniem. Ludzie przy tym inaczej rozumieją \"dobrą\" postawę, np. przodopochylenie miednicy."},{"t":"Zdjęcie to nie ruch","d":"Postawa nie jest statyczna, a jedno zdjęcie nie mówi, jak ktoś się rusza i czuje. Zdjęcia \"po\" to często wyuczone wyprostowanie się, wciągnięcie brzucha i ściśnięcie pośladków."},{"t":"Przemysł na kompleksach","d":"Branże zdrowia i fitnessu tworzą problemy, których nie ma, by sprzedać rozwiązanie. Badanie z 2017 roku pokazało, że klinicyści znający diagnozę częściej widzą dyskinezę łopatki u osób z bólem barku."},{"t":"Zmienność zamiast jednej pozycji","d":"Ból po 12 godzinach siedzenia czy po weekendzie malowania sufitu to nie problem postawy, tylko brak przyzwyczajenia do długiej, powtarzalnej pozycji. Lepiej myśleć o zmienności i adaptacji."},{"t":"Badania długoterminowe","d":"Obserwacje przez 20 lat nie potwierdzają, że zła postawa \"dogoni\" człowieka. Fińskie dane pokazały, że dziewczęta siedzące zgarbione miały mniejsze ryzyko przewlekłego bólu szyi niż te siedzące prosto."},{"t":"Przygotowanie ważniejsze","d":"Autor ma płaskostopie i wyraźne przodopochylenie miednicy, a robi 20 tys. kroków i chodzi po górach z plecakiem. Liczą się ruch, sen, stres, odżywianie i kontakty z ludźmi."},{"t":"Ćwiczenia posturalne","d":"Robi wall slides, rotacje piersiowe czy mostki biodrowe, ale dla urozmaicenia, nie by poprawić postawę. Poprawa po nich może wynikać po prostu z większej ilości ruchu."},{"t":"Ukryte koszty","d":"Ciągłe pilnowanie postawy może prowadzić do nadmiernej czujności, katastrofizowania i lęku przed ruchem, co bywa gorsze niż sama postawa."}],"conclusion":"Poprawianie postawy raczej nie jest potrzebne; ważniejsze są ruch, zmienność pozycji i ogólne zdrowie.","factchecks":[{"claim":"Postawa nie jest związana z bólem.","verdict":"półprawda","note":"Metaanaliza z 2019 roku wykazała związek wysunięcia głowy z bólem szyi u dorosłych, choć nie u nastolatków.","p":0,"src":[["PubMed: metaanaliza 2019, wysunięta głowa a ból szyi - \"The Relationship Between Forward Head Posture and Neck Pain\"","https://pubmed.ncbi.nlm.nih.gov/31773477/"]]},{"claim":"Klinicyści bez zaślepienia częściej widzą dyskinezę łopatki u osób z bólem barku.","verdict":"prawda","note":"Badanie Plummera i wsp. (2017) w JOSPT tak pokazało.","p":2,"src":[["PubMed: Plummer i wsp. 2017 - \"Observational Scapular Dyskinesis: Known-Groups Validity\"","https://pubmed.ncbi.nlm.nih.gov/28683230/"]]},{"claim":"Badania przez ok. 20 lat nie wiążą postawy w młodości z późniejszym bólem.","verdict":"prawda","note":"Badanie Diecka i wsp. (1985) nie znalazło związku asymetrii postawy u nastolatków z późniejszym bólem pleców i szyi.","p":4,"src":[["PubMed: Dieck i wsp. 1985 - \"An epidemiologic study of the relationship between postural asymmetry in the teen years\"","https://pubmed.ncbi.nlm.nih.gov/2938272/"]]}],"bias":"Autor uczciwie mówi, że idzie pod prąd, ale przedstawia głównie badania potwierdzające jego tezę; część prac wiąże jednak niektóre cechy postawy z bólem."},{"id":"GUKoD2meZHk","title_pl":"14 rodzin zapachów według koła Michaela Edwardsa","title":"All 14 Fragrance Families Explained | Men's Cologne/Perfume Review 2025","channel":"School of Scent","url":"https://www.youtube.com/watch?v=GUKoD2meZHk","date":"2025-03-18","duration":1502,"views":25850,"section":"Moda","transcript":"youtube","added":"2026-11-04","tags":["Styl","Perfumy","Podstawy"],"about":"School of Scent przechodzi 14 rodzin z nowoczesnego koła zapachów Michaela Edwardsa i podaje przykłady do każdej.","intro":"Prowadzący School of Scent tłumaczy, że dziś branża często dzieli zapachy na cztery grupy (świeże, kwiatowe, amber, drzewne), a Michael Edwards rozwinął to w koło z 14 rodzinami. Idzie zgodnie z ruchem wskazówek zegara i do każdej rodziny podaje własny przykład z półki, od florals po fruity.","points":[{"t":"Koło Edwardsa vs klasyka","d":"Dawniej perfumiarze używali ok. 7 rodzin (floral, aromatic, fougère, chypre, woody, oriental...). Dziś cztery główne kategorie, a Edwards rozbija je na 14 rodzin na fragrance wheel."},{"t":"Floral i Soft Floral","d":"Floral: bukiety i pojedyncze kwiaty - np. Moschino Toy Boy (różana, musky). Soft Floral: aldehydy, puder, musk - autor stawia Prada L'Homme jako czysty, mydlany iris."},{"t":"Floral Amber i Soft Amber","d":"Floral Amber: kwiaty z przyprawami, żywicami i wanilią - Tom Ford Noir Extreme. Soft Amber: kadzidło, przyprawy, żywice - np. Cartier Declaration d'un Soir (wg newslettera autora)."},{"t":"Amber i Woody Amber","d":"Amber: żywice, kwiaty, wanilia - MFK Grand Soir. Woody Amber: amber z pudrem, oudem, sandałowcem - np. Merchant of Venice Venezia 21 Spices."},{"t":"Woods: Woods, Mossy, Dry","d":"Woods: cedr, paczula, sosna, sandał, wetywer - Le Labo Santal 33. Mossy Woods: mech dębowy z amber i cytrusami - Nishane Hacivat. Dry Woods: skóra i tytoń - Gucci Guilty Absolute."},{"t":"Aromatic Fougère","d":"Lawenda i geranium z cytrusami, ziołami i drewnem; klasyczna rodzina od Fougère Royale (po kumarynie z tonki). Autor chwali Tom Ford Fougère d'Argent i barberskie klasyki."},{"t":"Fresh: Citrus, Water, Green, Fruity","d":"Citrus: Terre d'Hermès Eau Givrée. Water/aquatic: Chanel Allure Homme Sport. Green: Creed Green Irish Tweed. Fruity: trudniej u mężczyzn - autor wciska Casamorati (praline/owoce)."}],"conclusion":"Koło pomaga zbierać zrównoważoną kolekcję, ale 14 rodzin nie obejmuje wszystkich stylów - stąd jeszcze bardziej szczegółowe diagramy.","factchecks":[{"claim":"Michael Edwards stworzył nowoczesne koło 14 rodzin zapachów.","verdict":"prawda","note":"Edwards jest autorem Fragrances of the World i popularnego fragrance wheel używanego w branży.","p":0,"src":[["Wikipedia (ang.): Michael Edwards (perfumy) - hasło \"Michael Edwards (fragrance expert)\"","https://en.wikipedia.org/wiki/Michael_Edwards_(fragrance_expert)"],["Fragrances of the World: oficjalna strona","https://www.fragrancesoftheworld.com/"]]},{"claim":"Termin \"oriental\" jest dziś często zastępowany przez \"amber\".","verdict":"prawda","note":"Branża odchodzi od \"oriental\" na rzecz \"amber\" ze względu na skojarzenia kolonialne.","p":0,"src":[["Wikipedia (ang.): koło zapachów - hasło \"Fragrance wheel\"","https://en.wikipedia.org/wiki/Fragrance_wheel"],["Wikipedia (ang.): perfumy - hasło \"Perfume\"","https://en.wikipedia.org/wiki/Perfume"]]},{"claim":"Pierwszy fougère to Fougère Royale po syntezie kumaryny.","verdict":"prawda","note":"Fougère Royale (Houbigant, 1882) uznaje się za początek rodziny po wprowadzeniu syntetycznej kumaryny.","p":5,"src":[["Wikipedia (ang.): rodzina fougère - hasło \"Fougère\"","https://en.wikipedia.org/wiki/Foug%C3%A8re"]]},{"claim":"Mech dębowy jest dziś silnie regulowany jako alergen.","verdict":"prawda","note":"IFRA ogranicza mech dębowy w perfumach ze względu na reakcje alergiczne; stosuje się zamienniki.","p":4,"src":[["Wikipedia (ang.): mech dębowy - hasło \"Oakmoss\"","https://en.wikipedia.org/wiki/Oakmoss"]]}],"bias":"Subiektywne przykłady i gusta autora; reklama własnej linii Atrium Curiosity Collection i newslettera."},{"id":"3ryh7PNhz3E","title_pl":"Najlepsze i najgorsze ćwiczenia na pośladki według nauki - ranking Jeffa Nipparda","title":"The Best & Worst Glute Exercises (According To Science)","channel":"Jeff Nippard","url":"https://www.youtube.com/watch?v=3ryh7PNhz3E","date":"2025-03-17","duration":839,"views":6701750,"section":"Sport","transcript":"youtube","added":"2026-11-03","tags":["Pośladki","Hipertrofia","Siłownia"],"about":"Jeff Nippard układa ranking ćwiczeń na pośladki od S do F i wskazuje najlepsze na górną, środkową i dolną część.","intro":"Jeff Nippard ocenia ćwiczenia na pośladki pod kątem wzrostu mięśni, od poziomu S do F. Ćwiczenie musi dawać duże napięcie, zwłaszcza w rozciągnięciu, nie powodować bólu i dawać się progresować. Wskazuje też najlepsze ćwiczenie na każdą część pośladków.","points":[{"t":"Trzy mięśnie, trzy strefy","d":"Pośladkowy wielki prostuje biodro i rotuje udo na zewnątrz. Średni ma około 1/3 jego wielkości, odwodzi nogę i stabilizuje przy ćwiczeniach na jednej nodze. Mały jest o połowę mniejszy od średniego. Wszystkie razem tworzą górną, środkową i dolną część pośladków."},{"t":"Hip thrust: wysokie B","d":"Dobrze przebadany i łatwy do progresji, ale sztanga uciska biodra, ustawienie zajmuje czas, a rozciągnięcie to około 90 stopni zgięcia biodra. Maszyna typu glute drive dostaje wysokie A i jest najlepsza na środek pośladków."},{"t":"Przysiady i bułgarskie","d":"Przysiad ze sztangą (A) mocno rozciąga pośladki, ale angażuje też czworogłowe. Pomaga niższe ułożenie sztangi, pochylenie i zejście poniżej równoległej. Bułgarski przysiad daje głębsze rozciągnięcie (wysokie A), ale mocno męczy, więc autor robi 2 serie na nogę."},{"t":"Najlepsze na górę pośladków","d":"Maszyna do odwodzenia bioder trafia do S. Pochylenie tułowia o około 30 stopni poprawia kierunek pracy włókien, autor robi 15-20 powtórzeń. Wyciąg jest trudniejszy do progresji (B), a chodzenie z gumą to tylko rozgrzewka (C)."},{"t":"Wykroki w marszu: S plus","d":"Duży krok daje mocne rozciągnięcie, a stabilizacja angażuje górne włókna. Autor wybiera je jako najlepsze ćwiczenie na pośladki. Wykroki na suwnicy Smitha dostają wysokie A, a z przednią stopą na podwyższeniu awansują do S."},{"t":"Dolna część: martwe ciągi","d":"Klasyczny martwy ciąg jest świetny dla siły, ale bardzo męczy, zwłaszcza prostowniki grzbietu (niskie B). Sumo raczej mocniej angażuje pośladkowy średni (wysokie B). Rumuński martwy ciąg (wysokie A) to najlepsze ćwiczenie na dolną część pośladków."},{"t":"Hity i kity","d":"Wyprost na ławce rzymskiej pod kątem 45 stopni z zaokrąglonym górnym odcinkiem pleców dostaje S. Donkey kicks i fire hydranty dają za małe napięcie (niskie D), tak jak swingi z kettlem dla przyrostu mięśni."}],"conclusion":"Łącz ćwiczenia w pozycji rozciągniętej i skróconej. Autor najwyżej ocenia wykroki w marszu, a na koniec przypomina o kaloriach i białku.","factchecks":[{"claim":"Badanie wykazało, że hip thrust rozbudowuje pośladki tak samo jak przysiad.","verdict":"prawda","note":"9-tygodniowe badanie z udziałem nietrenujących: podobny przyrost pośladków. Autor sam zaznacza, że to jedno badanie.","p":1,"src":[["PubMed: Plotkin i wsp. 2023 - \"Hip thrust and back squat training elicit similar gluteus muscle hypertrophy...\"","https://pubmed.ncbi.nlm.nih.gov/37877099/"]]},{"claim":"Głębokie przysiady lepiej rozbudowują pośladki.","verdict":"prawda","note":"Kubo i wsp. pokazali większy przyrost objętości pośladkowego wielkiego po przysiadach pełnych niż płytkich.","p":2,"src":[["PubMed: Kubo i wsp. 2019 - \"Effects of squat training with different depths on lower limb muscle volumes\"","https://pubmed.ncbi.nlm.nih.gov/31230110/"]]},{"claim":"EMG pośladkowego wielkiego nie różni się między martwym ciągiem sumo a klasycznym.","verdict":"prawda","note":"Escamilla i wsp. wykazali różnice głównie w mięśniach uda i łydki, ale nie w pośladkowym wielkim.","p":5,"src":[["PubMed: Escamilla i wsp. 2002 - \"An electromyographic analysis of sumo and conventional style deadlifts\"","https://pubmed.ncbi.nlm.nih.gov/11932579/"]]}],"bias":"Ranking częściowo subiektywny, autor przyznaje to sam. Na końcu reklama jego aplikacji MacroFactor z kodem rabatowym."},{"id":"1ztGpGjO60o","title_pl":"Co jest w studzience kanalizacyjnej (manhole)","title":"What’s Inside a Manhole?","channel":"Practical Engineering","url":"https://www.youtube.com/watch?v=1ztGpGjO60o","date":"2025-02-04","duration":789,"views":2313873,"section":"Ciekawostki","transcript":"youtube","added":"2026-11-04","tags":["Technika"],"about":"Przezroczysta makieta kanalizacji: po co manhole, fatbergi, wentylacja, drop manhole i czemu pokrywy są okrągłe.","intro":"Grady buduje przezroczystą makietę ścieków, by pokazać, że studzienki to nie tylko włazy z filmów. Tłumaczy laterale, branches, mains i interceptors, czemu zamiast kolanek są manhole, problemy z chusteczkami i FOG, hydrojetting, wentylację gazów, retencję przy ulewach, drop manhole na stromiznach oraz prefabrykowane kręgi.","points":[{"t":"Sieć jak rzeka","d":"Większość kanalizacji to proste rury pod spadem, nie ogromne tunele. Laterale od budynków, branches przy ulicach, mains/trunk i interceptors dalej w dół. Między odcinkami są studzienki; trasa to zwykle proste linie między włazami."},{"t":"Zamiast kolanek","d":"Zmiana średnicy, kierunku, spadku lub wysokości to miejsce na osady i turbulencję. Zamiast kształtek w rurze stawia się manhole: kontrolowane środowisko przepływu i dostęp dla ekipy do kamer, czyszczenia i napraw."},{"t":"Zatory: chusteczki i FOG","d":"Włókniny (nawet \"flushable\" wipes) i tłuszcze (FOG) tworzą zatory, czasem fatbergi. Część opłat za kanalizację idzie na ekipy udrażniające; im więcej zatorów, tym wyższe stawki."},{"t":"Kamery i hydrojetting","d":"Miasta proaktywnie filmują rury (asset management). Czyszczenie często to hydrojetting: obrotowe dysze pod ciśnieniem. Awaryjnie można przepompować między studzienkami (bypass) i wyłączyć odcinek."},{"t":"Wentylacja i gazy","d":"Obok cieczy płyną gazy; pęcherze ograniczają przepływ, a toksyczne, korodujące lub wybuchowe mieszanki wymagają świeżego powietrza z włazów. Zimą widać czasem parę z pokrywy, gdy ciepłe ścieki spotykają zimne powietrze."},{"t":"Deszcz i retencja","d":"W szczycie burzowym do sanitarnej wchodzi woda z nielegalnych podłączeń i przez pokrywy; bywają wymagane uszczelnione włazy i kominki odpowietrzające. Studzienka buforuje falę; przy przeciążeniu bywa wylew lub zrzut z systemów ogólnospławnych (autor wspomina Sekwanę przy igrzyskach 2024)."},{"t":"Drop manhole","d":"Wlot dużo wyżej niż wylot: na stromym terenie lepiej \"upuszczać\" wysokość w studzience niż pędzić ścieki z żwirem w rurze. Zwykle stosuje się rury lub konstrukcje łagodzące pluskanie (zapach, erozja)."},{"t":"Budowa i okrągłe pokrywy","d":"Prefabrykowane kręgi betonowe na tymczasowych podporach, dno z wyobleniami. Okrągła pokrywa nie wpadnie w otwór, da się toczyć i pasuje do okrągłej studni - według autora też najlepszy kształt na parcie gruntu i hydraulikę."}],"conclusion":"Studzienka standaryzuje łączenia, dostęp i wentylację - dzięki temu kanalizacja da się utrzymać bez odkopywania całej ulicy.","factchecks":[{"claim":"Fatbergi to zatory z tłuszczu i włóknin w kanalizacji.","verdict":"prawda","note":"Fatberg to udokumentowane zjawisko w sieciach miejskich (m.in. Londyn); FOG i chusteczki są głównymi składnikami.","p":2,"src":[["Wikipedia (ang.): fatberg - hasło \"Fatberg\"","https://en.wikipedia.org/wiki/Fatberg"]]},{"claim":"Systemy ogólnospławne zrzucają ścieki do rzek przy ulewach.","verdict":"prawda","note":"Combined sewer overflows to znany problem starszych miast; Paryż miał o tym głośno przy igrzyskach 2024.","p":5,"src":[["Wikipedia (ang.): kanalizacja ogólnospławna - hasło \"Combined sewer\"","https://en.wikipedia.org/wiki/Combined_sewer"]]},{"claim":"Okrągła pokrywa nie wpadnie w okrągły otwór.","verdict":"prawda","note":"To najpopularniejsze inżynierskie wyjaśnienie; dochodzą produkcja, toczenie i wytrzymałość.","p":7,"src":[["Wikipedia (ang.): właz / manhole - hasło \"Manhole\"","https://en.wikipedia.org/wiki/Manhole"]]}],"bias":"Przejrzysta makieta i dobra dydaktyka; wzmianka o igrzyskach i Nebula/WTC tylko w promo na końcu. Bez lokalnych norm liczbowych."},{"id":"ekpqLDu8kb8","title_pl":"Jakie prawa rządzą wszechświatem? Tomasz Miller","title":"Jakie prawa rządzą wszechświatem? - dr Tomasz Miller - didaskalia#110","channel":"didaskalia","url":"https://www.youtube.com/watch?v=ekpqLDu8kb8","date":"2024-12-29","duration":7239,"views":540952,"section":"Didaskalia","transcript":"youtube","added":"2026-11-06","tags":["Nauka"],"about":"Didaskalia: fizyk matematyczny dr Tomasz Miller o prawach przyrody, czarnych dziurach, entropii i śmierci cieplnej wszechświata.","intro":"Patrycjusz Wyżga rozmawia z dr. Tomaszem Millerem (fizyk matematyczny, Centrum Kopernika UJ) o tym, jakimi regułami gra wszechświat. To długa rozmowa bez ściany wzorów: raczej obrazy i intuicje.\n\nWątki: skąd biorą się \"prawa\", co zostaje po śmierci gwiazd (neutronówki, czarne dziury), strzałka czasu i daleki scenariusz śmierci cieplnej. Pojawia się też reklama platformy stron WWW (odu) na wstępie.","points":[{"t":"Prawa jako język przyrody","d":"**Miller traktuje matematykę jako język, którym fizyka opisuje regularności świata - nie zawsze tożsamość z \"rzeczywistością samą w sobie\".** Rozmowa krąży wokół tego, co znaczy, że coś jest prawem: powtarzalność, przewidywanie, granice modeli.\n\nGość pilnuje granicy między tym, co wynika z równań, a spekulacją (np. wieloświaty trudno dostępne empirycznie)."},{"t":"Gwiazdy, neutronówki, czarne dziury","d":"**Gdy gwiazda nie ma już paliwa, zapada się; po supernowej zostaje gwiazda neutronowa albo - przy dużej masie - czarna dziura.** Miller opisuje czarną dziurę jako obiekt \"z czasu i przestrzeni\": materia w pewnym sensie wypada z dostępnego wszechświata, zostaje zakrzywienie.\n\nTo obrazowa ścieżka od codziennej grawitacji do ekstremum relativistycznego."},{"t":"Śmierć cieplna i puenta","d":"**Daleki scenariusz: gwiazdy gasną, zostają czarne dziury, niebo czarne i zimne - śmierć cieplna.** Cytat w duchu Feynmana: jeśli ci się nie podoba, znajdź sobie inny wszechświat.\n\nWyżga trzyma rozmowę przy fascynacji naturą zamiast checklisty haseł popularnonaukowych."}],"conclusion":"Miller nie sprzedaje easy-answers o sensie kosmosu - pokazuje, że \"prawa\" to skuteczne opisy, a ekstremalne obiekty i entropia rysują horyzont, na którym intuicja codzienna się kończy.","factchecks":[{"claim":"Po supernowej może powstać gwiazda neutronowa lub czarna dziura zależnie od masy.","verdict":"prawda","note":"Standardowy przebieg ewolucji masywnych gwiazd w astrofizyce.","p":1,"src":[["Wikipedia (ang.): neutron star","https://en.wikipedia.org/wiki/Neutron_star"],["Wikipedia (ang.): stellar evolution","https://en.wikipedia.org/wiki/Stellar_evolution"]]},{"claim":"Śmierć cieplna wszechświata to scenariusz maksymalnej entropii / wygaszenia procesów.","verdict":"prawda","note":"Klasyczna hipoteza kosmologiczna związana z II zasadą termodynamiki.","p":2,"src":[["Wikipedia (ang.): heat death of the universe","https://en.wikipedia.org/wiki/Heat_death_of_the_universe"]]}],"bias":"Wstęp z reklamą odu; długi format rozmowy upraszcza spory interpretacyjne kwantów i kosmologii."},{"id":"2sWFexuc7MI","title_pl":"Miejsca na Ziemi, gdzie nie stanął żaden człowiek","title":"Places on Earth No Human Has Ever Visited","url":"https://www.youtube.com/watch?v=2sWFexuc7MI","date":"2024-12-26","duration":600,"views":1223643,"transcript":"whisper","added":"2026-11-03","tags":["Natura","Geografia"],"about":"Ranking 10 miejsc na Ziemi, których według autora nigdy nie odwiedził żaden człowiek lub które są prawie niezbadane.","intro":"Ranking 10 miejsc na Ziemi, do których według autora człowiek nigdy nie dotarł albo dotarł tylko na brzegi. Są wśród nich góry (Gangkhar Puensum, Góry Gwiezdne), jaskinie (Kryształów, cenoty Jukatanu), głębia oceanu, pustynie Namib i Takla Makan, lód północnej Grenlandii oraz wyspa, która okazała się nie istnieć. Przy każdym miejscu autor tłumaczy, co utrudnia dotarcie.","points":[{"t":"10. Gangkhar Puensum (Bhutan)","d":"Najwyższa niezdobyta góra świata, ok. 7560 m. Od 1994 r. Bhutan zakazuje wspinaczki, bo góry uważa się za siedziby duchów. Według autora wyprawy z lat 80. nie mogły nawet znaleźć góry przez złe mapy."},{"t":"9. Jaskinia Kryształów (Meksyk)","d":"Jaskinia pod Meksykiem z kryształami wielkości autobusów szkolnych, w środku ok. 58°C, prawie 100% wilgotności i siarkowodór. Naukowcy wchodzą na ok. 10 minut w kombinezonach chłodzących. Kryształy rosły setki tysięcy lat, a znaleziono w nich uśpione mikroby."},{"t":"8. Podwodne jaskinie Jukatanu","d":"Tysiące połączonych podwodnych jaskiń (cenotów) pod Meksykiem, w większości niezbadanych: są ciemne, ciasne, ciągną się kilometrami i leżą w odległej dżungli. Majowie uważali je za bramy do zaświatów; znaleziono w nich ceramikę, biżuterię i ludzkie kości. Żyją tam ryby bez oczu."},{"t":"7. Góry Gwiezdne (Papua-Nowa Gwinea)","d":"Według autora żaden człowiek nie postawił tam stopy. To ściany wapiennych klifów w gęstym lesie deszczowym, daleko od dróg, z ciągłym deszczem i pijawkami. Jest tam ogromny klif Hindenburg Wall, na który nikt się nie wspiął; nawet okoliczne plemiona nie zbadały części terenu."},{"t":"6. Rów Nowych Hebrydów","d":"Rów na południowym Pacyfiku między Vanuatu a Nową Kaledonią, ok. 7200 m głębokości, \"Everest by się w nim zmieścił\". Ciśnienie zgniotłoby człowieka jak puszkę, więc schodziły tam tylko roboty z kamerami i sfilmowały dziwne ryby. Warunki mają przypominać te na księżycach Jowisza."},{"t":"5. Tsingy de Bemaraha (Madagaskar)","d":"Park Tsingy de Bemaraha to las ostrych wapiennych iglic; nazwa ma znaczyć \"gdzie nie można chodzić boso\". Iglice przecinają buty, bywają wysokie jak 5-piętrowy budynek i stoją tak ciasno, że nie da się między nimi przejść. Zbadano tylko brzegi, na linach; żyją tam gatunki niespotykane gdzie indziej."},{"t":"4. Serce pustyni Namib","d":"Morze wydm Namib zajmuje obszar wielkości stanu Maryland, a część wydm jest wyższa od Empire State Building. Wydmy ciągle się przesuwają, więc mapy szybko się dezaktualizują. W dzień piasek może stopić buty, w nocy jest mróz, nie ma wody ani dróg, a wnętrze chroni UNESCO."},{"t":"3. Sandy Island","d":"Wyspa między Australią a Nową Kaledonią była na mapach przez setki lat, także w Google Maps; James Cook miał ją opisać w XVIII w. W 2012 r. australijscy naukowcy popłynęli w to miejsce i znaleźli otwarte morze. Możliwe wyjaśnienia: zatonęła, błąd kopiowany na mapach albo dryfujący pumeks."},{"t":"2. Północna Grenlandia","d":"Ludzie od tysięcy lat żyją na wybrzeżach, ale środek północnej Grenlandii jest nietknięty. Lądolód pokrywa ok. 80% wyspy i miejscami ma ponad 1,6 km grubości; do tego silny wiatr i miesiące ciemności. Pod lodem mogą być góry, doliny i jeziora z mikroorganizmami, a topnienie odsłania nowe wyspy."},{"t":"1. Pustynia Takla Makan (Chiny)","d":"\"Pustynia śmierci\", większa od Wielkiej Brytanii, bez wody i otoczona wysokimi górami; według autora w jej środku nie był żaden człowiek. Nazwa ma znaczyć \"miejsce, z którego się nie wraca\". Jedwabny Szlak szedł tylko brzegami, a pod piaskiem mogą być zaginione miasta."}],"conclusion":"Mimo satelitów i GPS wciąż są miejsca, do których człowiek nie dotarł, głównie przez zakazy, ekstremalne warunki albo zwykłe trudności w dojściu.","factchecks":[{"claim":"Gangkhar Puensum to najwyższa niezdobyta góra; wspinaczka zakazana, a wyprawy nie mogły jej znaleźć.","verdict":"prawda","note":"Szczyt ma 7570 m, a wspinaczka jest zakazana od 2003 r.; wyprawy z lat 80. się nie powiodły.","src":[["Wikipedia (ang.): Gangkhar Puensum","https://en.wikipedia.org/wiki/Gangkhar_Puensum"]],"p":0},{"claim":"Jaskinia Kryształów: 58°C, prawie 100% wilgotności, toksyczne powietrze, wizyty ok. 10 minut.","verdict":"półprawda","note":"Upał, wilgotność i mikroby się zgadzają; głównym zagrożeniem jest upał, nie toksyczne gazy.","src":[["Wikipedia (ang.): Jaskinia Kryształów (Naica) - hasło \"Cave of the Crystals\"","https://en.wikipedia.org/wiki/Cave_of_the_Crystals"],["National Geographic: mikroby z Naica","https://www.nationalgeographic.com/science/article/crystal-caves-mine-microbes-mexico-boston-aaas-aliens-science"]],"p":1},{"claim":"Cenoty Jukatanu: tysiące połączonych jaskiń, ślepe ryby, ofiary Majów.","verdict":"prawda","note":"Sac Actun ma ponad 370 km korytarzy, ale to popularne miejsce nurkowe, a nie \"nieodwiedzone\".","src":[["Wikipedia (ang.): system jaskiń Sac Actun - hasło \"Sistema Sac Actun\"","https://en.wikipedia.org/wiki/Sistema_Sac_Actun"],["Wikipedia (ang.): cenoty - hasło \"Cenote\"","https://en.wikipedia.org/wiki/Cenote"]],"p":2},{"claim":"W Góry Gwiezdne nigdy nie wszedł żaden człowiek.","verdict":"fałsz","note":"Mieszkają tam ludy Min, działa kopalnia Ok Tedi i miasto Tabubil.","src":[["Wikipedia (ang.): Góry Gwiezdne - hasło \"Star Mountains\"","https://en.wikipedia.org/wiki/Star_Mountains"],["Wikipedia (ang.): kopalnia Ok Tedi - hasło \"Ok Tedi Mine\"","https://en.wikipedia.org/wiki/Ok_Tedi_Mine"]],"p":3},{"claim":"Rów Nowych Hebrydów: Everest by się w nim zmieścił; nikt tam nie był, były tylko roboty.","verdict":"fałsz","note":"Rów ma ok. 7,8 km, a Everest 8,85 km, więc szczyt by wystawał; na dno zszedł Victor Vescovo w 2021 r.","src":[["Wikipedia (ang.): Rów Nowych Hebrydów - hasło \"New Hebrides Trench\"","https://en.wikipedia.org/wiki/New_Hebrides_Trench"],["Guinness: najwięcej odwiedzonych rowów","https://www.guinnessworldrecords.com/world-records/752796-most-deep-sea-trenches-visited-by-an-individual"]],"p":4},{"claim":"Tsingy: nazwa znaczy \"gdzie nie można chodzić boso\"; wnętrze nietknięte.","verdict":"półprawda","note":"Tłumaczenie nazwy się zgadza, ale park ma szlaki dla turystów i jest badany.","src":[["Wikipedia (ang.): Tsingy de Bemaraha","https://en.wikipedia.org/wiki/Tsingy_de_Bemaraha_Strict_Nature_Reserve"],["UNESCO: suche lasy Andrefana (dawniej Tsingy de Bemaraha)","https://whc.unesco.org/en/list/494/"]],"p":5},{"claim":"Namib: wydmy wyższe od Empire State Building, obszar wielkości Maryland, wnętrza nigdy nie odwiedzono.","verdict":"przesada","note":"Wielkość i wydmy (do ok. 380 m) się zgadzają, ale okolice Sossusvlei to masowa turystyka.","src":[["UNESCO: Morze Piasku Namib","https://whc.unesco.org/en/list/1430/"],["Wikipedia (ang.): pustynia Namib - hasło \"Namib\"","https://en.wikipedia.org/wiki/Namib"]],"p":6},{"claim":"Sandy Island: \"odkrytą\" przez Jamesa Cooka wyspę obalili Australijczycy w 2012.","verdict":"półprawda","note":"W 2012 r. potwierdzono, że wyspy nie ma, ale pierwszy zapis jest z 1876 r., nie od Cooka.","src":[["Wikipedia (ang.): Sandy Island (Nowa Kaledonia) - hasło \"Sandy Island (New Caledonia)\"","https://en.wikipedia.org/wiki/Sandy_Island,_New_Caledonia"]],"p":7},{"claim":"Lądolód pokrywa ok. 80% Grenlandii, a wnętrze północnej Grenlandii jest nietknięte przez człowieka.","verdict":"półprawda","note":"Lądolód pokrywa ok. 80% wyspy, ale w głębi działały stacje wiertnicze i wiele razy go przekraczano.","src":[["Wikipedia (ang.): lądolód grenlandzki - hasło \"Greenland ice sheet\"","https://en.wikipedia.org/wiki/Greenland_ice_sheet"],["Wikipedia (ang.): odwiert lodowy NorthGRIP - hasło \"NorthGRIP\"","https://en.wikipedia.org/wiki/North_Greenland_Ice_Core_Project"]],"p":8},{"claim":"Takla Makan: większa od Wielkiej Brytanii, w środku nie było człowieka, nazwa znaczy \"miejsce bez powrotu\".","verdict":"fałsz","note":"Jest większa od Wielkiej Brytanii, ale biegnie przez nią autostrada, a pogrzebane miasta odkopano 100 lat temu.","src":[["Wikipedia (ang.): pustynia Takla Makan - hasło \"Taklamakan Desert\"","https://en.wikipedia.org/wiki/Taklamakan_Desert"],["Wikipedia (ang.): autostrada przez pustynię Tarym - hasło \"Tarim Desert Highway\"","https://en.wikipedia.org/wiki/Tarim_Desert_Highway"]],"p":9}],"bias":"Tytuł wprowadza w błąd: większość miejsc była odwiedzana; uczciwiej byłoby \"miejsca słabo zbadane\". Transkrypt z Whisper.","channel":"Chill Dude Explains","section":"Chill Dude Explains"},{"id":"PZLKB8k2BQQ","title_pl":"Perfumy męskie od zera - kompletny poradnik dla początkujących","title":"The Complete Idiot's Guide To Men's Fragrances","channel":"Gents Scents","url":"https://www.youtube.com/watch?v=PZLKB8k2BQQ","date":"2024-12-02","duration":1131,"views":77543,"section":"Moda","transcript":"youtube","added":"2026-11-03","tags":["Styl","Perfumy","Podstawy"],"about":"Ash z Gents Scents w jednym filmie zbiera podstawy perfum: stężenia, gdzie kupować, jak aplikować, rodzaje zapachów i jak budować kolekcję.","intro":"Ash prowadzi kanał Gents Scents i chce w jednym miejscu podać wszystko, co początkujący powinien wiedzieć o perfumach. Omawia stężenia, sklepy, aplikację, popularne określenia zapachów, nuty i komplementy. Na końcu radzi, jak mądrze budować kolekcję.","points":[{"t":"Stężenia to nie wszystko","d":"EDT, EDP, parfum i extrait różnią się ilością olejku w alkoholu, ale granice nie są ustalone prawem. Wyższe stężenie zwykle trwa dłużej i pachnie pełniej, ale nie zawsze lepiej się roznosi."},{"t":"Gdzie kupować","d":"Sklepy z rabatami są dużo tańsze niż pełna cena, a ich towar pochodzi zwykle z tych samych hurtowni. Wybieraj sprawdzone i znane od lat; w Europie autor wymienia Notino jako największy."},{"t":"Gdzie psikać","d":"Zgięcie łokcia, obojczyk, kark, za uchem. Punkty pulsu pomagają tylko trochę; ruch ciała rozprowadza zapach. Na ubraniu i włosach trzyma się dłużej, ale niektóre perfumy plamią."},{"t":"Nie pocieraj nadgarstków","d":"Pocieranie nie niszczy cząsteczek, ale według autora to zła praktyka i większość fanów perfum tego nie robi."},{"t":"Określenia zapachów","d":"\"Blue\" to uniwersalne, świeże zapachy na cały rok, na randkę pasują ciepłe i słodkie, do biura czystsze i spokojniejsze. Standardowe rodziny to świeże, kwiatowe, ambrowe i drzewne."},{"t":"Trwałość, smuga, projekcja","d":"Trwałość to czas na skórze, smuga (sillage) to ślad, który zostawiasz, a projekcja to zasięg zapachu, gdy stoisz. Nuty głowy znikają pierwsze, nuty bazy zostają najdłużej."},{"t":"Komplementy","d":"Najczęściej mówią je znajomi, nie obcy. Żeby je słyszeć, trzeba wychodzić do ludzi, być przystępnym i zadbanym."},{"t":"Budowa kolekcji","d":"Wąchaj testery i kupuj próbki, zanim kupisz w ciemno. Zacznij od uniwersalnych zapachów, które naprawdę będziesz nosić, potem dobieraj sezonowe, a niszowe zostaw na później."}],"conclusion":"Nie goń za arcydziełami, których nie założysz; zacznij od uniwersalnych zapachów i rozwijaj gust stopniowo.","factchecks":[{"claim":"Nazwy stężeń perfum nie są sztywno określone.","verdict":"prawda","note":"Wikipedia: zakresy dla EdT, EdP i extrait się nakładają, a EdT jednej marki może być mocniejsze niż EdP innej.","p":0,"src":[["Wikipedia (ang.): perfumy - hasło \"Perfume\"","https://en.wikipedia.org/wiki/Perfume"]]},{"claim":"Dziś przyjęte są cztery rodziny: świeże, kwiatowe, ambrowe i drzewne, a fougère wyszło z użycia.","verdict":"półprawda","note":"Koło Michaela Edwardsa opiera się na tych grupach, ale Wikipedia wciąż wymienia też fougère jako piątą rodzinę.","p":4,"src":[["Wikipedia (ang.): perfumy - hasło \"Perfume\"","https://en.wikipedia.org/wiki/Perfume"],["Wikipedia (ang.): koło zapachowe - hasło \"Fragrance wheel\"","https://en.wikipedia.org/wiki/Fragrance_wheel"]]},{"claim":"Nuty głowy ulatują pierwsze, a nuty bazy trzymają się najdłużej.","verdict":"prawda","note":"Nuty głowy to małe, lotne cząsteczki; nuty bazy to cięższe składniki, które wyczuwa się najdłużej.","p":5,"src":[["Wikipedia (ang.): perfumy - hasło \"Perfume\"","https://en.wikipedia.org/wiki/Perfume"]]}],"bias":"Rzetelny przegląd podstaw, ale z perspektywy rynku USA. Autor promuje kody rabatowe do sklepów, więc część porad o zakupach ma też cel reklamowy."},{"id":"k50Y_rvA0pw","title_pl":"Jak wybierano urzędników w republice rzymskiej","title":"Getting Elected in Ancient Rome","channel":"toldinstone","url":"https://www.youtube.com/watch?v=k50Y_rvA0pw","date":"2024-11-08","duration":662,"views":58916,"section":"Historia","transcript":"youtube","added":"2026-11-04","tags":["Historia"],"about":"Kolorowe wybory w republice rzymskiej: centurie, plemiona, kampania, korupcja i koniec głosowania ludowego.","intro":"Autor opisuje republikę rzymską jako oligarchię z elementami demokracji: dwaj konsulowie, Senat i zgromadzenia ludowe. Pokazuje cursus honorum, głosowanie w centuriach i plemionach, kampanię w Forum, łapówki, graffiti z Pompei oraz jak Cezar i Tyberiusz praktycznie zakończyli wybory ludowe.","points":[{"t":"Oligarchia z głosowaniem","d":"Według autora republika była władzą bogatych rodów, ale magnaci co roku ubiegali się o głosy ludu. Polibiusz widział w ustroju mieszankę monarchii (konsulowie), arystokracji (Senat) i demokracji (zgromadzenia)."},{"t":"Cursus honorum","d":"Urzędy sprawowano z kolegami i na rok: konsulowie, pretorzy, kwestorzy i edylowie. To schody kariery aż do konsulatu. Równolegle trybuni plebejscy mieli szeroką władzę, często przeciw pozostałym magistraturom."},{"t":"Comitia centuriata","d":"Konsulów i pretorów wybierało 193 centurie ułożone według majątku, od najbogatszych. Każda centuria miała jeden głos. Bogaci mieli dziesiątki centurii, bezrolni biedacy tylko jedną, więc wybory ważyły na korzyść zamożnych."},{"t":"Comitia tributa","d":"Kwestorów i edylów wybierało zgromadzenie plemienne (35 plemion: 4 miejskie, reszta wiejskie). Teoretycznie prowincja miała duży wpływ, ale na głosowanie do Rzymu częściej przyjeżdżali bogaci z dystryktów wiejskich."},{"t":"Bez partii, z etykietami","d":"Wybierano ludzi, nie programy. Optymaci i popularyści to według autora luźne etykiety (tradycja vs reforma), nie partie ani jasne stanowiska."},{"t":"Kampania i toga candida","d":"Datę ogłaszano zwykle trzy \"tygodnie rynkowe\" (ok. 24 dni) wcześniej. Kandydat w białej todze candida krążył po Forum z klientami, ściskał dłonie i unikał spornych tematów. List przypisywany Kwintusowi Cyceronowi radzi uśmiechać się i mówić to, co ludzie chcą usłyszeć."},{"t":"Utrata wyborów przez żarty i skąpstwo","d":"Publiusz Scypion Nazica, ściskając zrogowaciałą dłoń farmera, zażartował, że ten \"chodzi na rękach\"; uznano to za obrazę i przegrał. Inny senator stracił preturę po bankiecie na kozich skórach i w glinianych naczyniach."},{"t":"Łapówki i graffiti","d":"Kupowanie głosów było powszechne; według autora senator oskarżony o przekupstwo w wyborach konsularnych wykupił oskarżycieli, a potem jako konsul zaostrzył prawo antykorupcyjne. W Pompejach malowano czarno-czerwone hasła typu \"uczciwy młodzieniec\" czy \"obudź się i głosuj\"."},{"t":"Tajne głosowanie i mosty","d":"Do II w. p.n.e. głosowano ustnie. Potem wprowadzono tajną tabliczkę woskową wrzucaną do kosza z wąskiego mostu wyborczego. Kandydaci najmowali bandy, by straszyć wyborców, blokować ogrodzenie albo niszczyć mosty i urny."},{"t":"Koniec wyborów ludowych","d":"Katon Młodszy zauważył tabliczki tym samym charakterem pisma. Jako dyktator Cezar mianował zwolenników. August formalnie kampaniował za przyjaciółmi, ale kariery zależały od jego woli. Tyberiusz przeniósł wybory do Senatu, kończąc ok. pół tysiąclecia głosowania ludowego."}],"conclusion":"Republikańska \"demokracja\" była widowiskiem ważeń na rzecz bogatych, a pod koniec zamieniła się w fasadę władzy jednostek.","factchecks":[{"claim":"Comitia centuriata miała 193 centurie i ważyła głosy bogatych.","verdict":"prawda","note":"193 centurie i głosowanie od najzamożniejszych klas to standardowy opis ustroju republiki.","p":2,"src":[["Wikipedia (ang.): comitia centuriata - hasło \"Centuriate Assembly\"","https://en.wikipedia.org/wiki/Centuriate_Assembly"],["Wikipedia (ang.): zgromadzenia rzymskie - hasło \"Roman assemblies\"","https://en.wikipedia.org/wiki/Roman_assemblies"]]},{"claim":"Cursus honorum: kwestor, edyl, pretor, konsul, z kolegami i na rok.","verdict":"prawda","note":"Klasyczna ścieżka magistratur i zasada kolegialności oraz kadencji rocznej są dobrze poświadczone.","p":1,"src":[["Wikipedia (ang.): cursus honorum - hasło \"Cursus honorum\"","https://en.wikipedia.org/wiki/Cursus_honorum"]]},{"claim":"Słowo \"kandydat\" pochodzi od białej togi candida.","verdict":"prawda","note":"Łacińskie candidatus wiąże się z candida, błyszcząco białą togą ubiegających się o urząd.","p":5,"src":[["Wikipedia (ang.): etymologia kandydata - hasło \"Candidate\"","https://en.wikipedia.org/wiki/Candidate"]]},{"claim":"Tyberiusz przeniósł wybory urzędników z ludu do Senatu.","verdict":"prawda","note":"Za Tyberiusza wybory konsulów i innych magistratur przeszły praktycznie do Senatu.","p":9,"src":[["Wikipedia (ang.): Tyberiusz (rządy) - hasło \"Tiberius\"","https://en.wikipedia.org/wiki/Tiberius"]]},{"claim":"List Kwintusa Cycerona to autentyczny poradnik kampanii.","verdict":"półprawda","note":"Commentariolum petitionis istnieje, ale autorstwo Kwintusa jest sporne wśród badaczy.","p":5,"src":[["Wikipedia (ang.): Commentariolum petitionis - hasło \"Commentariolum petitionis\"","https://en.wikipedia.org/wiki/Commentariolum_petitionis"]]}],"bias":"Rzetelny przegląd mechaniki wyborów; anegdoty o Scypionie i bankiecie podane bez źródeł. Sponsorowany komiks Romanus w środku filmu."},{"id":"tmbZVmXyOXM","title_pl":"Jak działają chłodnie kominowe","title":"Why Are Cooling Towers Shaped Like That?","channel":"Practical Engineering","url":"https://www.youtube.com/watch?v=tmbZVmXyOXM","date":"2024-11-05","duration":1188,"views":9489698,"section":"Ciekawostki","transcript":"youtube","added":"2026-11-03","tags":["Nauka","Technika"],"about":"Practical Engineering buduje model chłodni kominowej i tłumaczy, czemu z komina leci para, a nie dym, i skąd ten kształt.","intro":"Z wielkich, wygiętych kominów elektrowni nie leci dym, tylko para wodna. Grady Hillhouse z Practical Engineering buduje model chłodni z akrylu i tłumaczy chłodzenie przez parowanie, wykres psychrometryczny, ciąg naturalny, zalety hiperboloidy i to, czemu takie wieże słabo sprawdzają się w gorącym klimacie.","points":[{"t":"Para, nie dym","d":"Komin wyprowadza spaliny wysoko, a chłodnia kominowa robi coś zupełnie innego. Kojarzy się z elektrowniami jądrowymi, które niczego nie spalają; pióropusz to głównie skroplona para wodna."},{"t":"Po co chłodzić","d":"Elektrownie cieplne napędzają generatory turbinami parowymi. Para skrapla się w skraplaczu chłodzonym wodą, a ta krąży między skraplaczem a wieżą, gdzie oddaje ciepło powietrzu."},{"t":"Przeciwprąd i parowanie","d":"Gorąca woda jest rozpylana nad wypełnieniem o dużej powierzchni i spływa w dół, a powietrze płynie w górę. Parowanie zabiera ciepło utajone, więc wodę można schłodzić poniżej temperatury powietrza, o ile nie jest ono nasycone."},{"t":"Wilgotne powietrze jest lżejsze","d":"Ciepłe powietrze mieści więcej pary i ma mniejszą gęstość. Co mniej oczywiste, przy tej samej temperaturze wilgotniejsze powietrze też jest lżejsze, bo cząsteczka wody waży mniej niż azotu czy tlenu."},{"t":"Ciąg naturalny","d":"Ogrzane i nawilżone powietrze unosi się w wieży i zasysa świeże przez wloty u dołu. Autora zaskoczyło, jak silny ciąg dało samo rozpylanie gorącej wody w modelu."},{"t":"Hiperboloida","d":"Wygięty kształt to hiperboloida, którą da się zbudować z prostych prętów, co ułatwia budowę. Podwójna krzywizna usztywnia cienką powłokę na ciężar i wiatr, jak chips Pringles, i według autora może o połowę zmniejszyć naprężenia względem walca."},{"t":"Wentylatory zamiast wysokości","d":"Wielkie wieże z ciągiem naturalnym są rzadkie. Szpitale, biurowce, rafinerie i wiele elektrowni używają mniejszych, tańszych chłodni z wentylatorami; wielkie wybiera się dla niezawodności, np. w elektrowniach jądrowych."},{"t":"Wilgotność pomaga ciągowi","d":"Na wykresie psychrometrycznym przy wilgotności 20% powietrze na początku drogi nie zyskuje wyporu i ciąg może zgasnąć. Przy 50% gęstość spada na całej drodze, więc dla danej temperatury termometru mokrego ciąg rośnie z wilgotnością."},{"t":"Teksas chłodzi jeziorami","d":"W gorącym klimacie ciąg naturalny działa słabo. Obie elektrownie jądrowe w Teksasie chłodzą się zbiornikami wodnymi, bo tama i jezioro wyszły taniej niż odpowiednia wieża."},{"t":"Czasem jednak dym","d":"Niektóre nowsze chłodnie wpuszczają do wieży oczyszczone spaliny, więc w pióropuszu może być trochę spalin, ale głównie to woda."}],"conclusion":"Chłodnia kominowa to sprytne połączenie parowania, wyporu i wytrzymałej geometrii, bez ani jednego wentylatora.","factchecks":[{"claim":"Hiperboloidę da się zbudować z prostych elementów.","verdict":"prawda","note":"Hiperboloida jednopowłokowa jest powierzchnią prostokreślną; wykorzystał to m.in. Szuchow.","p":5,"src":[["Wikipedia (ang.): hiperboloida - hasło \"Hyperboloid\"","https://en.wikipedia.org/wiki/Hyperboloid"],["Wikipedia (ang.): konstrukcja hiperboloidalna - hasło \"Hyperboloid structure\"","https://en.wikipedia.org/wiki/Hyperboloid_structure"]]},{"claim":"Wilgotne powietrze jest lżejsze od suchego w tej samej temperaturze.","verdict":"prawda","note":"Masa molowa wody (ok. 18 g/mol) jest mniejsza niż suchego powietrza (ok. 29 g/mol).","p":3,"src":[["Wikipedia (ang.): gęstość powietrza - hasło \"Density of air\"","https://en.wikipedia.org/wiki/Density_of_air"]]},{"claim":"Obie elektrownie jądrowe w Teksasie chłodzą się zbiornikami wodnymi.","verdict":"prawda","note":"Comanche Peak korzysta ze Squaw Creek Reservoir, a South Texas Project ze sztucznego zbiornika chłodzącego.","p":8,"src":[["Wikipedia (ang.): elektrownia Comanche Peak - hasło \"Comanche Peak Nuclear Power Plant\"","https://en.wikipedia.org/wiki/Comanche_Peak_Nuclear_Power_Plant"],["Wikipedia (ang.): South Texas Project - hasło \"South Texas Nuclear Generating Station\"","https://en.wikipedia.org/wiki/South_Texas_Nuclear_Generating_Station"]]},{"claim":"Niektóre chłodnie wyprowadzają także oczyszczone spaliny.","verdict":"prawda","note":"Takie rozwiązanie stosuje się m.in. w niemieckich elektrowniach węglowych z odsiarczaniem.","p":9,"src":[["Wikipedia (ang.): chłodnia kominowa - hasło \"Cooling tower\"","https://en.wikipedia.org/wiki/Cooling_tower"]]}],"bias":"Rzetelny, z modelem i wykresem; transkrypt miejscami nieczytelny. Na końcu reklama serwisu Nebula."},{"id":"GNO4OtYoCYk","title_pl":"Najlepsze i najgorsze ćwiczenia na biceps","title":"The Best And Worst Biceps Exercises","channel":"Jeff Nippard","url":"https://www.youtube.com/watch?v=GNO4OtYoCYk","date":"2024-10-19","duration":982,"views":10073392,"section":"Sport","transcript":"youtube","added":"2026-11-05","tags":["Siłownia","Hipertrofia","Trening","Mity"],"about":"Jeff Nippard rankinguje ćwiczenia na biceps od S do F według napięcia w rozciągnięciu, komfortu i progresji.","intro":"Jeff Nippard rankinguje ćwiczenia na biceps od S (super) do F (fail) na podstawie najnowszych badań i własnej praktyki. Kryteria: wysokie napięcie zwłaszcza w rozciągnięciu, brak bólu łokcia, płynny profil oporu i prosta progresja obciążenia. Przypomina anatomię: głowa krótka i długa bicepsa plus brachialis pod spodem, który może \"wypychać\" szczyt.\n\nFilm to tier lista od sztangi i hantli przez preacher, kabel Bayesian i cheat curls po hammer i waiter curl. Na końcu koronuje najlepsze i najgorsze ćwiczenie oraz reklamuje książkę Muscle Ladder z ebookiem.","points":[{"t":"Kryteria i anatomia","d":"**Do S tier trzeba połączyć wysokie napięcie w rozciągnięciu, komfort stawu i łatwy overload.** Biceps zgina łokieć i robi supinację (cue: pchać przez małe palce); obie głowy przechodzą przez bark, więc ręka za tułowiem mocniej rozciąga mięsień.\n\nBrachialis jest według autora mniej więcej wielkości obu głów razem i wpływa na wygląd peaku, zwłaszcza przy chwycie młotkowym."},{"t":"Wolne ciężary stojąc","d":"**Barbell curl ląduje w B (dostępność), mimo słabego napięcia w pełnym rozciągnięciu i obciążenia nadgarstków.** EZ-bar bumpuje do A przez wygodę i overload w 6-8 powtórzeniach. Hantle stojąc: low A, najlepiej obie ręce naraz (Goto: długie pauzy między naprzemiennymi gorsze).\n\nWaiter curl spada do F: dziwaczny, obciąża nadgarstki, słaby overload. Drag i spider curl w C przez małą zmianę długości mięśnia albo brak rozciągnięcia."},{"t":"Preacher i warianty ławki","d":"**Preacher curl idzie do S: wysokie napięcie w solidnym rozciągnięciu i prawie zero ściągania.** Badanie vs incline: preacher dał istotnie większy wzrost dystalnego bicepsa. Incline i leżące uginanie zostają w A.\n\nScott curl (pionowe ramię) w C, bo zeruje napięcie w rozciągnięciu. Flat bench curl w low B: świetne rozciągnięcie, ale limit progresji na lekkich ciężarach. Machine preacher też S."},{"t":"Kable i Bayesian","d":"**Face-away Bayesian cable curl to według niego najlepsze z najlepszych (S tier).** Ręce za tułowiem dają maksymalne rozciągnięcie i równe napięcie; szczególnie poleca przy budowie peaku głowy długiej.\n\nZwykły cable curl przy bokach: low A. Eksperymentalny wariant z 90° kątem kabel-przedramię w max stretch: na razie A (za krótko w rotacji). Zmodyfikowane 21s (krótki-pełny-długi): low A."},{"t":"Hammer, cheat, chin-upy","d":"**Hammer curl uważa za numer jeden na peak przez brachialis; stojąc A, na preacherze S.** Inverse Zottm
