wyjaśnienia fontanny łańcuszkowej.","intro":"Ok. 10 lat temu Steve Mould odkrył fontannę łańcuszkową, zwaną też efektem Moulda. Jeden element jego wyjaśnienia da się sprawdzić tylko w nieważkości: czy łańcuszek poruszający się ze stałą prędkością płynie przez własny kształt. W 25-minutowej rozmowie wideo astronauta Don Pettit testuje to na Międzynarodowej Stacji Kosmicznej.","points":[{"t":"Fontanna łańcuszkowa","d":"Łańcuszek z koralików wyciągany z naczynia wznosi się łukiem nad jego krawędź. Po serii 6 filmów z ElectroBoomem wyjaśnienie Moulda uznaje się za poprawne: z naczynia działa dodatkowa siła skierowana w górę."},{"t":"Brakujący element","d":"Ta siła musi tylko równoważyć ciężar łuku. Z matematyki wynika, że szarpanie łańcuszka na drugim końcu nie zmienia kształtu łuku: bez grawitacji łańcuszek o stałej prędkości płynie przez własny kształt."},{"t":"Nieudane pomysły","d":"Łańcuszka nie da się zatrzymać nieruchomo w powietrzu, a z kłębka nie da się go wyciągać ze stałą prędkością, bo koraliki się plączą i rozpływają. Pettit porównał chaotyczny ruch łańcuszka do ruchu cząsteczek."},{"t":"Zamknięta pętla","d":"Trzeci pomysł: pętla w niekołowym kształcie, wprawiona w ruch wokół obwodu. Intuicja podpowiada, że zrobi się z niej okrąg, a teoria, że zachowa kształt."},{"t":"Wynik","d":"Pętla w dużej mierze zachowała kształt, także wygięcie w stronę Pettita, ale powoli się zaokrąglała. Symulacja Martina Beyera pokazała, że to skutek tarcia w przegubach, którego model matematyczny nie uwzględnia."},{"t":"Łańcuszek a sznurek","d":"Nitka i lina mają własną sztywność i prostują się, a łańcuszek z przegubami o małym tarciu zachowuje się zupełnie inaczej. Reaguje na prądy powietrza, a bez nich ustawia się wzdłuż gradientu grawitacji."},{"t":"Inne eksperymenty","d":"Pettit robi sztuczki jak z jojo, przytrzymuje koniec łańcuszka ładunkiem elektrostatycznym i pokazuje, że łańcuch ze spinaczy o ogniwach 50 mm zachowuje się jak ten z koralików o średnicy 3 mm."},{"t":"Droga na ISS","d":"Mould zapytał w filmie, jak dotrzeć do kogoś na ISS. Odezwał się Stefan z ESA, Samantha Cristoforetti zabrała w kosmos 4 m łańcuszka, a potem skontaktowała go z Pettitem."},{"t":"Rozmowa","d":"Rozmowę przez Microsoft Teams zorganizował John Stevens z NASA. Okno łączności trwało 25 minut. Pettit uznał wyjaśnienie, w tym zaokrąglanie pętli przez tarcie, za trafne."}],"conclusion":"Łańcuszek w nieważkości zachował kształt, a powolne zaokrąglanie tłumaczy tarcie w przegubach, więc teoria Moulda się broni.","factchecks":[{"claim":"Steve Mould spopularyzował fontannę łańcuszkową filmem na YouTube w 2013 r.","verdict":"prawda","note":"Zjawisko pokazywano wcześniej, np. Steve Spangler w 2009 r.; nazwa efekt Moulda pochodzi od jego filmu.","p":0,"src":[["Wikipedia (ang.): fontanna łańcuszkowa - hasło \"Chain fountain\"","https://en.wikipedia.org/wiki/Chain_fountain"]]},{"claim":"Wyjaśnienie zakłada dodatkową siłę z naczynia działającą w górę.","verdict":"prawda","note":"Biggins i Warner z Cambridge opisali ją w Proceedings of the Royal Society A w 2014 r.","p":[0,1],"src":[["Wikipedia (ang.): fontanna łańcuszkowa - hasło \"Chain fountain\"","https://en.wikipedia.org/wiki/Chain_fountain"],["Biggins, Warner: Understanding the chain fountain (Proc. R. Soc. A, 2014)","https://doi.org/10.1098/rspa.2013.0689"]]},{"claim":"Samantha Cristoforetti dowodziła misją na ISS.","verdict":"prawda","note":"Objęła dowództwo Ekspedycji 68 28 września 2022 r.","p":7,"src":[["Wikipedia (ang.): Samantha Cristoforetti - hasło \"Samantha Cristoforetti\"","https://en.wikipedia.org/wiki/Samantha_Cristoforetti"]]},{"claim":"Don Pettit przebywał wtedy na ISS.","verdict":"prawda","note":"Był w składzie Ekspedycji 71 i 72; wylądował 20 kwietnia 2025 r., w dniu 70. urodzin.","p":8,"src":[["Wikipedia (ang.): Don Pettit - hasło \"Donald Pettit\"","https://en.wikipedia.org/wiki/Donald_Pettit"]]}],"bias":"Rzetelny; Mould sam przyznaje, że pętla się zaokrąglała, i opiera wniosek o tarciu na symulacji. Krótka wzmianka o Patreonie."},{"id":"U7NHNT3M-tw","title_pl":"Paradoks hydrostatyczny: dlaczego woda \"waży\" inaczej","title":"The Hydrostatic Paradox","channel":"Steve Mould","url":"https://www.youtube.com/watch?v=U7NHNT3M-tw","date":"2025-09-30","duration":812,"views":1086797,"section":"Ciekawostki","transcript":"youtube","added":"2026-11-04","tags":["Nauka","Technika"],"about":"Steve Mould pokazuje, że siła na tłoku zależy od wysokości słupa wody, a nie od całej objętości w naczyniu.","intro":"Na wadze dwa naczynia z tłokami: 150 ml w prostym zbiorniku \"waży\" mniej niż 60 ml w lejku, a równowaga przychodzi przy tej samej wysokości wody (ok. 550 ml vs 60 ml). Autor tłumaczy prawo Stevina, ciśnienie jako siłę na pole i to, że ścianki przejmują ciężar wody poza słupem nad tłokiem - także gdy naczynie ma \"sufit\".","points":[{"t":"Dziwna waga","d":"150 ml w prostym naczyniu obniża szalę jak oczekiwano. Do lejka wchodzi tylko 60 ml, a mimo to wydaje się cięższe. Przy równowadze jest ok. 550 ml vs 60 ml - różne objętości, podobna siła na tłokach."},{"t":"Prawo Stevina","d":"Siła na tłoku to tylko ciężar słupa wody bezpośrednio nad tłokiem; wodę wokół można zignorować. W naczyniu o prostych ściankach każdy fragment dna bierze swój słup i cały ciężar się zgadza. Przy skośnych ściankach wynik zaskakuje, ale doświadczenie to potwierdza."},{"t":"Ciśnienie vs siła","d":"Autor rozróżnia potoczne mylenie \"nacisku\" z siłą: ciśnienie to siła dzielona przez pole, zdefiniowane w punkcie powierzchni. Paradoks hydrostatyczny mówi, że ciśnienie w punkcie zależy tylko od wysokości wody nad tym punktem."},{"t":"Ścianki trzymają resztę","d":"Słup nad tłokiem ma to samo ciśnienie co woda obok na tej głębokości, więc okolica nie wciska się do środka. Trójkątny pakiet przy skośnej szybie: składowa pionowa reakcji ścianki równoważy ciężar wody nad skosem. Stąd statyw z lejkiem robi się cięższy po nalaniu; przy prostym naczyniu - nie."},{"t":"Naczynie z \"sufitem\"","d":"W pojemniku zwężającym się ku górze (z otworem) siła na tłoku nie jest ciężarem samej wody w środku. 35 g wody ważyło na wadze więcej niż 35 g: ciśnienie pod szklanym \"sufitem\" odpowiada pełnej wysokości do swobodnej powierzchni, także krętą drogą."},{"t":"Uściślenie prawa","d":"Ciśnienie w punkcie zależy tylko od różnicy wysokości do swobodnej powierzchni cieczy, nie od kształtu drogi. Przy naczyniu z sufitem statyw oddaje część ciężaru na wagę (robi się lżejszy), odwrotnie niż przy lejku."},{"t":"Strumień w górę","d":"W modelach 2D z otworami woda pryska w dół z \"kieliszka\", a po odwróceniu - w górę spod sufitu, bo ciśnienie pod stropem równa się ciśnieniu u dołu wysokiego słupa. Równowaga, gdy poziomy wody po obu stronach się wyrównają."}],"conclusion":"Kształt naczynia przenosi ciężar na ścianki lub ze statywu na tłok; liczy się wysokość do powierzchni swobodnej, nie objętość.","factchecks":[{"claim":"Ciśnienie hydrostatyczne zależy tylko od głębokości (wysokości słupa), nie od kształtu naczynia.","verdict":"prawda","note":"Klasyczny paradoks hydrostatyczny / prawo Stevina: p = ρgh względem powierzchni swobodnej.","p":1,"src":[["Wikipedia (ang.): hydrostatyka - hasło \"Hydrostatics\"","https://en.wikipedia.org/wiki/Hydrostatics"],["Wikipedia (ang.): Simon Stevin - hasło \"Simon Stevin\"","https://en.wikipedia.org/wiki/Simon_Stevin"]]},{"claim":"Ciśnienie w cieczy spoczynkowej jest izotropowe (prawo Pascala).","verdict":"prawda","note":"Prawo Pascala: ciśnienie w płynie nierozciągliwym przenosi się jednakowo we wszystkich kierunkach.","p":3,"src":[["Wikipedia (ang.): prawo Pascala - hasło \"Pascal's law\"","https://en.wikipedia.org/wiki/Pascal%27s_law"]]},{"claim":"W naczyniu z sufitem 35 ml wody może \"ważyć\" więcej niż 35 g na tłoku.","verdict":"prawda","note":"Siła na dnie bywa większa lub mniejsza od ciężaru cieczy; różnicę bierze naczynie (paradoks hydrostatyczny).","p":4,"src":[["Wikipedia (ang.): paradoks hydrostatyczny - hasło \"Hydrostatic paradox\"","https://en.wikipedia.org/wiki/Hydrostatic_paradox"]]}],"bias":"Dobry eksperyment i intuicja; sponsorowana wkładka o goleniu. Autor upraszcza tarcie tłoków, ale wynik jakościowo się zgadza."},{"id":"qpRGnTTcLpo","title_pl":"7 świetnych ćwiczeń, których prawie nikt nie robi","title":"7 Amazing Exercises No One Does (ALL S TIER)","channel":"Jeff Nippard","url":"https://www.youtube.com/watch?v=qpRGnTTcLpo","date":"2025-09-27","duration":966,"views":6378697,"section":"Sport","transcript":"youtube","added":"2026-11-04","tags":["Ciało i zdrowie","Siłownia","Trening"],"about":"Jeff Nippard: dead hang, Zapman hammer curl, incline Y raise, sideways rear delt, dragon flag, Kelso shrug i seated cable deadlift.","intro":"Siedem niedocenianych ćwiczeń, które Nippard robi co tydzień: dead hang, zmodyfikowany Zapman hammer curl, incline dumbbell Y raise, one-arm rear delt na pec deck bokiem, dragon flag, Kelso shrug oraz seated cable deadlift. Autor podkreśla, że ciężka i regularna praca liczy się bardziej niż sam wybór ruchu.","points":[{"t":"Dead hang","d":"Otwiera bark, może odciążyć kręgosłup po przysiadach/martwych. Autor: max 2 min 45 s; przyjaciel z 6 s do 60 s w 30 dni (wyzwanie MrBeast). Kreda, luźniejszy chwyt na start, stopy razem. Asysta: guma lub maszyna."},{"t":"Zapman hammer curl","d":"Ekscentryka jest o ok. 40-50% silniejsza. Curl młotkiem w górę, opuszczanie w supinacji: brachialis pomaga w koncentryce, biceps bierze ekscentrykę. 8-10 powtórzeń; klasyczny curl też działa przy wolnym opuszczaniu."},{"t":"Incline dumbbell Y raise","d":"Ławka 20-30°, Y w płaszczyźnie łopatki (~30° do przodu). Hantle laterale dają peak na górze i zero na dole; Y lepiej czuje side i włókna między front a side. Nie opuszczaj do zwisu pionowego."},{"t":"Rear delt bokiem na pec deck","d":"Klasyczny reverse pec deck to półruchy w skróceniu. Siądź bokiem i przeciągnij przez środek ciała (cue Dr. Mike: \"zamiataj pieniądze\"). Alternatywy: kabel cross-body lub hantel leżąc."},{"t":"Dragon flag","d":"Klasyka Bruce'a Lee: całe ciało z ławki, biodra proste, 60-80°, 4-8 powtórzeń. Progresja: leg raises → bent-knee dragon → pełne. Stabilniejszy tors niż hanging leg raise; dieta i tak decyduje o widoczności (mężczyźni ok. 10-12% BF)."},{"t":"Kelso shrug","d":"Na T-bar z podparciem klatki: łokcie zablokowane, tylko ściągnięcie łopatek (4-5 cm ruchu), pauza 1 s. Izoluje mid traps/romboidy, gdy biceps limitował wiosłowanie. Bez maszyny: hantle na skośnej ławce."},{"t":"Seated cable deadlift","d":"Pośladki na ławce, lockout bioder, sztanga blisko ciała do kostek bez zaokrąglania lędźwi. Mniej zmęczenia niż ciężki RDL, lepszy kontakt z pośladkami/dwugłowymi. Warianty: prostsze kolana, single-leg."}],"conclusion":"Nietypowe warianty mają sens, gdy dają pełniejszy zakres, lepszą izolację lub mniejszy koszt regeneracji przy tym samym bodźcu.","factchecks":[{"claim":"Jesteś o ok. 40-50% silniejszy w ekscentryce niż w koncentryce.","verdict":"prawda","note":"Siła ekscentryczna jest systematycznie wyższa; trening ekscentryczny jest osobną kategorią adaptacji.","p":1,"src":[["Wikipedia (ang.): trening ekscentryczny - hasło \"Eccentric training\"","https://en.wikipedia.org/wiki/Eccentric_training"]]},{"claim":"Dead hang pomaga barkom i odciąża kręgosłup.","verdict":"półprawda","note":"Wiszenie poprawia tolerancję chwytu i mobilność; dowody na \"dekompresję\" i ból są głównie anegdotyczne.","p":0,"src":[["Wikipedia (ang.): podciąganie (kontekst wiszenia) - hasło \"Pull-up (exercise)\"","https://en.wikipedia.org/wiki/Pull-up_(exercise)"],["Wikipedia (ang.): stożek rotatorów - hasło \"Rotator cuff\"","https://en.wikipedia.org/wiki/Rotator_cuff"]]},{"claim":"Wiosłowanie buduje biceps słabiej niż uginania; biceps może limitować midback.","verdict":"półprawda","note":"Izolacja zwykle lepiej hipertrofiuje biceps niż compound; \"dwa razy lepiej\" to uproszczenie z filmu.","p":5,"src":[["Wikipedia (ang.): hipertrofia - hasło \"Hypertrophy\"","https://en.wikipedia.org/wiki/Hypertrophy"]]}],"bias":"Długie bloki reklamują MacroFactor (kod Jeff, free trial, AI photo macros, 350 tys. użytkowników). Ranking \"S tier\" to preferencje autora."},{"id":"bLcGL6rKBBg","title_pl":"Krawiec pokazuje najczęstsze błędy w dopasowaniu garnituru","title":"Master Tailor Reveals The Most Common Suit Mistakes - And How To Fix Them","channel":"GQ","url":"https://www.youtube.com/watch?v=bLcGL6rKBBg","date":"2025-09-23","duration":872,"views":369337,"section":"Moda","transcript":"youtube","added":"2026-11-03","tags":["Styl","Krawiectwo","Garnitur"],"about":"Ian Myers, właściciel dużej brytyjskiej pracowni szycia na miarę, omawia dla GQ typowe problemy z garniturem i ich przyczyny.","intro":"Ian Myers prowadzi największą pracownię szycia na miarę w Wielkiej Brytanii. Na modelach pokazuje, po jakich zagnieceniach poznać źle dopasowany garnitur i koszulę. Tłumaczy, skąd biorą się problemy i które da się naprawić.","points":[{"t":"Opadające ramię","d":"Ukośne fałdy na plecach oznaczają, że marynarka nie pasuje do kształtu ramion. Według niego ponad połowa ludzi ma niższe prawe ramię; krawiec obniża wtedy linię ramienia i pachę, a czasem przesuwa materiał przy szyi."},{"t":"Kwadratowe ramiona i klatka","d":"Wysokie ramiona dają fałdę pod kołnierzem. Klapy odstające od piersi to za ciasna klatka, której nie da się poszerzyć, bo nie ma zapasu; kupuj marynarkę pod klatkę, a talię zwęź."},{"t":"Odstający kołnierz i balans","d":"Głowa wysunięta do przodu lub zaokrąglone plecy rozchylają poły jak nożyczki, a wyprostowana postawa je zamyka. Naprawia się to od góry, zmieniając długość pleców i przodów."},{"t":"Rękawy i pacha","d":"Rękaw powinien sięgać nadgarstka i odsłaniać 0,6-1,3 cm mankietu koszuli; mankiet ok. 6 cm luźniejszy od nadgarstka. Nisko wycięta pacha w konfekcji ogranicza ruch i zabiera talię; wystarcza nieco ponad 2,5 cm luzu."},{"t":"Ułożenie ręki i talia","d":"Gdy ręka wisi bardziej z tyłu, rękaw marszczy się z tyłu i trzeba go obrócić. Poziome fałdy na przodzie to za ciasna talia, za luźna daje pudełkowaty kształt."},{"t":"Długość marynarki","d":"Za krótka odsłania pośladki i krocze, za długa skraca nogi. Proste reguły długości są przybliżone, lepiej po prostu ocenić sylwetkę."},{"t":"Spodnie: stan, kieszenie, długość","d":"Niski stan skraca nogi; pas na wysokości kości biodrowej pasuje większości, a stanu nie da się podnieść. Odstające kieszenie to za ciasne spodnie. Klasyka to jedno lekkie załamanie, np. z tyłu nieco dłuższą nogawką."},{"t":"Koszula","d":"Rozmiar kołnierzyka nie gwarantuje dobrego korpusu. Z krawatem kupuj pod kołnierzyk i rękaw, a korpus zwęź; za szerokich ramion koszuli nie opłaca się poprawiać."}],"conclusion":"Garnitur to rzecz osobista; gdy wiesz, na co patrzeć, dobre dopasowanie jest w zasięgu.","factchecks":[{"claim":"Ponad 50% ludzi ma niższe prawe ramię, bo większość jest praworęczna.","verdict":"nie da się sprawdzić","note":"Ok. 90% ludzi to praworęczni, ale nie znalazłem badań potwierdzających liczbę 50% i taką przyczynę.","p":0,"src":[["Wikipedia (ang.): ręczność - hasło \"Handedness\"","https://en.wikipedia.org/wiki/Handedness"]]},{"claim":"Gradacja to wyliczanie większych i mniejszych rozmiarów z jednego bazowego wzoru.","verdict":"prawda","note":"Tak opisuje się gradację wykrojów w konfekcji; razem z kołnierzykiem rosną korpus, pacha i rękaw.","p":7,"src":[["Wikipedia (ang.): gradacja wykrojów - hasło \"Pattern grading\"","https://en.wikipedia.org/wiki/Pattern_grading"]]},{"claim":"Długość nogawki decyduje o załamaniu materiału nad butem.","verdict":"prawda","note":"Wikipedia opisuje \"break\" jako fałdę nad butem przy nieco dłuższej nogawce.","p":6,"src":[["Wikipedia (ang.): garnitur - hasło \"Suit\"","https://en.wikipedia.org/wiki/Suit"]]}],"bias":"Praktyczny materiał od krawca z własną pracownią, więc kilka razy sugeruje, że szycie na miarę jest lepsze od konfekcji. Liczba 50% bez źródła."},{"id":"Aed-Jy_BjmE","title_pl":"Dr Joanna Orzeł: mit sarmacki, Lech, Długosz i szlachta Rzeczypospolitej","title":"Jaka jest prawda o Polsce i Polakach przed Mieszkiem? -  didaskalia#143","channel":"didaskalia","url":"https://www.youtube.com/watch?v=Aed-Jy_BjmE","date":"2025-07-27","duration":4782,"views":229579,"section":"Didaskalia","transcript":"youtube","added":"2026-11-04","tags":["Historia","Polska","Społeczeństwo"],"about":"Historyczka z UŁ o mitach założycielskich Polski, sarmacji według Długosza i Kromera oraz o tym, jak szlachta budowała tożsamość.","intro":"Rozmowa Patrycjusza Wyżgi z dr Joanną Orzeł (Uniwersytet Łódzki), autorką książki \"My sarmaci\". Gościni tłumaczy, jak kronikarze połączyli legendy o Lechu i Piaście z mitem sarmackim, po co szlachcie było wspólne pochodzenie i jak serial 1670 trafia w realia epoki.","points":[{"t":"Piast i Lech to legendy","d":"Według Orzeł Piast jako założyciel dynastii to postać mityczna. Później pojawia się Lech jako założyciel państwa, a osobno mit, że na tych ziemiach była Sarmacja, więc jesteśmy Sarmatami."},{"t":"Długosz łączy dwa mity","d":"Jan Długosz połączył legendy o Lechu i Piaście z mitem sarmackim. Z jednej strony wymyśleni władcy, z drugiej bezimienni Sarmaci w wyobrażonej przestrzeni. To podwaliny pod nowożytne kronikarstwo."},{"t":"Sarmacja to najpierw mapa","d":"Mit zaczyna się od przestrzeni: za Dunajem i Renem, do Bałtyku (Morze Sarmackie) i Karpat. Ptolemeusz kończył Sarmację europejską na Wiśle; Długosz według gościni przesunął granicę na Łabę, by Wielkopolska była \"w Sarmacji\"."},{"t":"Powrót w 550 r. i Troja","d":"W przekazie kronikarskim Sarmaci mieli wrócić na ziemie polskie ok. 550 r., w czasie gdy według legendy przybywa Lech. Szukano też powiązań z wojną trojańską, jak inne narody europejskie."},{"t":"Szlachta, nie całe społeczeństwo","d":"Mit szybko stał się tożsamością szlachty. Chłopów i mieszczan z niego wykluczano. Kronikarze sięgali po genealogię od synów Noego: od Chama \"Hamowie\" (chłopi), szlachta od Jafeta lub Sema."},{"t":"Klej Unii Lubelskiej","d":"Przy unii Korony i Litwy potrzebna była idea łącząca różne narody i wyznania. Mit wspólnego sarmackiego pochodzenia, popularyzowany najpierw przez kronikarzy-sekretarzy, szlachta chętnie przyjęła."},{"t":"Kromer: Sarmacja = Rzeczpospolita","d":"Marcin Kromer utożsamił Sarmację z ziemiami pod władzą Jagiellonów: Korona, Litwa, Ruś, Prusy, Inflanty. Według Orzeł to najważniejszy autorytet historyczny aż do Naruszewicza."},{"t":"Zachód atrakcyjny, Wschód obcy","d":"Na Zachód jeżdżono chętnie, ale podkreślano, że u nas najlepiej. Wschód (Moskwa, \"Scytia\") malowano jako barbarzyński i obcy cywilizacji łacińskiej; do tego dokładano motyw przedmurza."},{"t":"Zgoda, liberum veto, magnateria","d":"Szlachta ceniła zgodę; liberum veto uzasadniano tym, że sprzeciw jednego oznacza zły pomysł. Magnateria przez sejmiki i klientelę tworzyła fakcje; gołota bez ziemi zbliżała się bytem do chłopów."},{"t":"1670 i książka My sarmaci","d":"Okładka książki kojarzy się z serialem 1670. Orzeł chwali serial za upowszechnianie nauki i za pokazanie, że stany żyły przenikając się, a nie w osobnych bańkach. Na jesień czeka kolejny sezon."}],"conclusion":"Mit sarmacki to według Orzeł narzędzie tożsamości i władzy szlachty, a nie opis realnego pochodzenia Polaków sprzed Mieszka.","factchecks":[{"claim":"Jan Długosz połączył legendy o Piaście i Lechu z mitem sarmackim.","verdict":"prawda","note":"W Annales Długosz lokalizuje Polaków w Sarmacji i spina tradycję piastowską z antyczną geografią.","p":1,"src":[["Wikipedia (ang.): Jan Długosz","https://en.wikipedia.org/wiki/Jan_D%C5%82ugosz"],["Wikipedia (ang.): Sarmatism","https://en.wikipedia.org/wiki/Sarmatism"]]},{"claim":"Według Ptolemeusza zachodnią granicą Sarmacji europejskiej była Wisła.","verdict":"prawda","note":"W Geographii Ptolemeusza Wisła (Vistula) oddziela Germanię od Sarmacji europejskiej.","p":2,"src":[["Wikipedia (ang.): Geography (Ptolemy)","https://en.wikipedia.org/wiki/Geography_(Ptolemy)"]]},{"claim":"Piast Kołodziej nie istniał jako historyczny założyciel dynastii.","verdict":"prawda","note":"Piast jest postacią legendarną z kronik; historycznie dynastia zaczyna się od Mieszka I.","p":0,"src":[["Wikipedia (ang.): Piast the Wheelwright","https://en.wikipedia.org/wiki/Piast_the_Wheelwright"]]},{"claim":"Marcin Kromer utożsamił Sarmację z ziemiami Rzeczypospolitej Jagiellonów.","verdict":"prawda","note":"Kromer w dziełach XVI w. opisuje Sarmację jako obszar monarchii jagiellońskiej.","p":6,"src":[["Wikipedia (ang.): Marcin Kromer","https://en.wikipedia.org/wiki/Marcin_Kromer"]]}],"bias":"Perspektywa nowożytniczki z naciskiem na kulturę szlachecką i serial 1670. Fragmenty o synach Noego to analiza mitu klasowego, nie katecheza. Książka gościni jest promowana wprost."},{"id":"qqFCHxacUww","title_pl":"Dlaczego w średniowieczu porzucano rzymskie miasta","title":"Why Roman Cities were Abandoned in the Middle Ages","channel":"toldinstone","url":"https://www.youtube.com/watch?v=qqFCHxacUww","date":"2025-07-25","duration":569,"views":867499,"section":"Historia","transcript":"youtube","added":"2026-11-03","tags":["Historia"],"about":"Toldinstone tłumaczy, czemu jedne rzymskie miasta przetrwały do dziś, a setki innych opustoszały.","intro":"Stojąc w ruinach antycznego miasta w południowej Turcji, Garrett Ryan z kanału toldinstone pyta, dlaczego Londyn czy Paryż przetrwały, a setki rzymskich miast zniknęły. Odpowiedź to splot czynników: słabnące elity, najazdy, klimat, malaria, zamulone porty i przede wszystkim rozpad sieci handlu, z której miasta żyły.","points":[{"t":"Imperium miast","d":"Rzym był konfederacją miast; sieć ok. 2000 z nich ciągnęła się od Brytanii po Syrię. Lokalne elity zbierały podatki dla Rzymu i w zamian inwestowały w fora, akwedukty, łaźnie i amfiteatry, czyli wszystko, co dziś kojarzymy z rzymskim miastem."},{"t":"Kryzys III wieku","d":"Najazdy i kryzysy gospodarcze III w. zniszczyły setki miast przy granicach. Nawet te oszczędzone często chowały się za murami zbudowanymi z rozebranych pomników."},{"t":"Elity odchodzą","d":"W późnym cesarstwie najbogatsi wyjeżdżali na posady w administracji, a ci, którzy zostali, biednieli i nie chcieli rządzić miastem. Kwitły ośrodki władzy, jak Arles i Trewir, ale Londinium wyludniało się od końca II w. i opustoszało po odejściu Rzymian z Brytanii."},{"t":"Bliżej Morza Śródziemnego","d":"Miasta nad Morzem Śródziemnym miały większe szanse: były bliżej szlaków handlowych i łatwiej je było przejąć bez walki. Później grozili im piraci; w IX w. łupieżcy splądrowali nawet Bazylikę św. Piotra, a mieszkańcy wybrzeży przenosili się na wzgórza."},{"t":"Wschód do VII wieku","d":"Miasta wschodniego cesarstwa trzymały się dobrze do VII w. Część Syrii i Palestyny rozkwitała pod Umajjadami, ale Anatolię pustoszyły najazdy, a w XI w. plemię Banu Hilal zrujnowało miasta Maghrebu."},{"t":"Klimat i krajobraz","d":"Wczesne cesarstwo przypadło na wyjątkowo ciepły okres; gdy się ochłodziło, podupadły miasta wysoko w górach Taurus, jak Sagalassos. Pola Fajumu w Egipcie zasoliły się, porty Efezu i Miletu zamuliły, a część Aleksandrii i Bajów zapadła się w morze."},{"t":"Malaria","d":"Najgroźniejsza malaria tropikalna rozprzestrzeniała się na zachód, a wylesianie tworzyło bagniste delty. To ona zamieniła żyzną Kampanię Rzymską w pustkowie, którym była aż do XIX w."},{"t":"Zerwane sieci handlu","d":"Miasta przy granicach żyły z wydatków wojska. Wiejskie osady na wapiennym płaskowyżu północnej Syrii dostarczały oliwę do Antiochii; gdy po podboju arabskim zmieniły się szlaki, opustoszały na zawsze i zwą się dziś martwymi miastami."},{"t":"Kruchość miast","d":"Miasta zależą od handlu, infrastruktury i masy krytycznej ludzi. Według autora większość rzymskich miast zgubiły nie katastrofy, ale powolne zmiany, które odebrały im sens istnienia."}],"conclusion":"Rzymskie miasta umierały zwykle powoli: gdy znikały powody ich istnienia, ludzie po prostu odchodzili.","factchecks":[{"claim":"Arabscy łupieżcy splądrowali Bazylikę św. Piotra w IX w.","verdict":"prawda","note":"Najazd na Rzym w 846 r. ograbił bazyliki św. Piotra i św. Pawła za murami.","p":3,"src":[["Wikipedia (ang.): najazd na Rzym w 846 r. - hasło \"Arab raid against Rome\"","https://en.wikipedia.org/wiki/Arab_raid_against_Rome"]]},{"claim":"Martwe miasta północnej Syrii opustoszały po zmianie szlaków handlowych.","verdict":"prawda","note":"To ok. 700 osad z I-VII w.; porzucono je w VIII-X w. po przesunięciu się szlaków. Wpisane na listę UNESCO.","p":7,"src":[["Wikipedia (ang.): martwe miasta - hasło \"Dead Cities\"","https://en.wikipedia.org/wiki/Dead_Cities"]]},{"claim":"Port Efezu zamulił się, odcinając miasto od morza.","verdict":"prawda","note":"Rzeka Kaystros nanosiła osady; dziś ruiny leżą kilka kilometrów od brzegu.","p":5,"src":[["Wikipedia (ang.): Efez - hasło \"Ephesus\"","https://en.wikipedia.org/wiki/Ephesus"]]},{"claim":"Część Bajów zapadła się w morze przez ruchy ziemi.","verdict":"prawda","note":"Bradyzejsmy Pól Flegrejskich zatopiły część Bajów; ruiny tworzą dziś podwodny park.","p":5,"src":[["Wikipedia (ang.): Baje - hasło \"Baiae\"","https://en.wikipedia.org/wiki/Baiae"]]},{"claim":"Malaria zamieniła Kampanię Rzymską w pustkowie aż do XIX w.","verdict":"półprawda","note":"Porzucono ją w średniowieczu przez malarię i brak wody; osuszanie i rekultywacja trwały do XX w.","p":6,"src":[["Wikipedia (ang.): Kampania Rzymska - hasło \"Roman Campagna\"","https://en.wikipedia.org/wiki/Roman_Campagna"]]}],"bias":"Rzetelny, zwięzły przegląd z ostrożnymi wnioskami. Reklama sponsora zawiera polityczne cytaty niezwiązane z tematem."},{"id":"XSl4ZTtjS7Q","title_pl":"Instynkty, z którymi walczysz codziennie, a których ewolucja zapomniała usunąć","title":"Instincts You Fight Daily That Evolution Forgot To Delete","url":"https://www.youtube.com/watch?v=XSl4ZTtjS7Q","date":"2025-05-25","duration":711,"views":1880940,"transcript":"youtube","added":"2026-11-03","tags":["Psychologia","Ewolucja"],"about":"8 odruchów i skłonności psychicznych, które według autora są pozostałością po życiu w plemionach łowców-zbieraczy i nie pasują do współczesności.","intro":"Ranking 8 odruchów, które według autora zostały nam po przodkach żyjących w plemionach i dziś często szkodzą. Są to: potrzeba drzemki, instynkt stadny, przymus odwzajemniania przysług, strach przed nieznanym, potrzeba kontroli, awersja do straty, obsesja statusu i reakcja na niesprawiedliwość. Każdy punkt ma ten sam schemat: jak pomagał przetrwać i jak przeszkadza w pracy, zakupach i internecie.","points":[{"t":"8. Potrzeba drzemki","d":"Senność o 14:00 po 8 godzinach snu albo pobudka o 3:00 to według autora dawny rytm. Przodkowie spali dwufazowo: kilka godzin, przerwa w nocy na sprawdzenie zagrożeń, jedzenie albo seks, potem znowu sen, a w upale (ok. 38°C) drzemali w dzień. Praca od 9:00, latarnie i telefony do tego nie pasują."},{"t":"7. Instynkt stadny","d":"Gdy plemię zaczynało uciekać, kto pytał dlaczego, zostawał zjedzony, a grupa dawała jedzenie i ochronę. Dlatego mózg nagradza dopasowanie się dopaminą. Dziś przez to kupujemy akcje GameStop za radą Reddita, nosimy modne brzydkie buty i wierzymy w fałszywe newsy."},{"t":"6. Przymus odwzajemnienia","d":"Przytrzymane drzwi albo kawa od kolegi wywołują poczucie długu. U przodków dzielenie się mięsem i jagodami było warunkiem przeżycia zimy, a mózg robi nam dyskomfort, dopóki nie oddamy. Marketing to wykorzystuje: darmowa próbka w Costco kończy się słoikiem ogórków 4,5 kg, kawa u dilera skłania do zakupu auta."},{"t":"5. Strach przed nieznanym","d":"Szelest w krzakach mógł być drapieżnikiem, a nowa jagoda trucizną, więc przeżyli ostrożni. Dlatego mózg zalewa nas hormonami stresu przy nowościach. Dziś zamawiamy to samo danie od 10 lat i zostajemy w pracy, której nie znosimy."},{"t":"4. Potrzeba kontroli","d":"Wciskanie wyimaginowanego hamulca, gdy prowadzi ktoś inny, i złość, gdy plan dnia się sypie. Przeżywali ci, którzy budowali lepsze schronienia, przechowywali jedzenie i planowali polowania; mózg nagradza kontrolę dopaminą. Dziś korki, przeciągnięte spotkania czy źle załadowana zmywarka wywołują reakcję jak na zagrożenie."},{"t":"3. Awersja do straty","d":"Znalezione 100 dolarów cieszy, ale zgubione 100 dolarów boli tygodniami. Dla przodka utrata jedynej włóczni czy zapasów oznaczała śmierć, a brak dodatkowego jedzenia tylko rozczarowanie. Według autora strata boli 2 razy mocniej niż równy zysk, więc trzymamy tracące akcje, niechciane ubrania i złą pracę."},{"t":"2. Obsesja statusu","d":"W plemieniu wysoki status oznaczał lepsze jedzenie, partnerów i posłuch, a niski resztki i brak potomstwa. Dlatego mózg nagradza awans i karze spadek stresem, gdy ktoś ma lepsze auto czy ładniejszy Instagram. Dziś kupujemy rzeczy ponad stan i publikujemy podkoloryzowane życie."},{"t":"1. Potrzeba sprawiedliwości","d":"Ktoś wpycha się w kolejkę albo kradnie pomysł i budzi się wściekłość. W plemieniu ok. 30 osób chomikowanie jedzenia czy jedzenie bez polowania zagrażało wszystkim, a wykrywanie i karanie oszustów pozwalało przetrwać. Dziś ta sama reakcja dotyczy drobiazgów: dwóch darmowych próbek, faworyzowania przez szefa, wpisów w sieci."}],"conclusion":"Nasz mózg jest wciąż ustawiony na życie w małym plemieniu, a zrozumienie tego pomaga nie dawać się tym odruchom sterować.","factchecks":[{"claim":"Przodkowie spali dwufazowo (\"pierwszy i drugi sen\") przez tysiące lat.","verdict":"półprawda","note":"Ekirch opisał sen dwufazowy w dawnej Europie, ale u współczesnych łowców-zbieraczy go nie wykazano.","src":[["Wikipedia (ang.): sen dwufazowy - hasło \"Segmented sleep\"","https://en.wikipedia.org/wiki/Segmented_sleep"],["Yetish i in. 2015, Current Biology (DOI)","https://doi.org/10.1016/j.cub.2015.09.046"]],"p":0},{"claim":"Mózg nagradza konformizm (układ nagrody).","verdict":"półprawda","note":"Jedno badanie fMRI (2009) pokazało sygnał błędu przy niezgodności z grupą; \"dopamina za konformizm\" to uproszczenie.","src":[["Klucharev i in. 2009 (PubMed)","https://pubmed.ncbi.nlm.nih.gov/19146819/"],["Wikipedia (ang.): instynkt stadny - hasło \"Herd mentality\"","https://en.wikipedia.org/wiki/Herd_mentality"]],"p":1},{"claim":"Reguła wzajemności działa, a sprzedawcy używają jej przez darmowe próbki.","verdict":"prawda","note":"Klasyczny eksperyment Regana (1971) i prace Cialdiniego dobrze to dokumentują.","src":[["Wikipedia (ang.): reguła wzajemności - hasło \"Reciprocity (social psychology)\"","https://en.wikipedia.org/wiki/Reciprocity_(social_psychology)"]],"p":2},{"claim":"Strata boli ok. dwa razy mocniej niż równy zysk.","verdict":"półprawda","note":"Kahneman i Tversky podali ok. 2, ale nowsze prace pokazują, że efekt bywa dużo mniejszy.","src":[["Wikipedia (ang.): awersja do straty - hasło \"Loss aversion\"","https://en.wikipedia.org/wiki/Loss_aversion"],["Gal i Rucker 2018, krytyka (DOI)","https://doi.org/10.1002/jcpy.1047"]],"p":5},{"claim":"Poczucie sprawiedliwości jest wrodzone i ewolucyjnie stare.","verdict":"półprawda","note":"Kapucynki i ludzie odrzucają niesprawiedliwe nagrody, ale ewolucyjne wyjaśnienia to hipotezy.","src":[["Brosnan i de Waal 2003, Nature","https://www.nature.com/articles/nature01963"],["Wikipedia (ang.): gra w ultimatum - hasło \"Ultimatum game\"","https://en.wikipedia.org/wiki/Ultimatum_game"]],"p":7},{"claim":"Strach przed nieznanym, potrzeba kontroli i status jako ewolucyjne pozostałości.","verdict":"nie da się sprawdzić","note":"Zjawiska są realne, ale ewolucyjne historie \"jak było w plemieniu\" są nietestowalne.","src":[["Wikipedia (ang.): iluzja kontroli - hasło \"Illusion of control\"","https://en.wikipedia.org/wiki/Illusion_of_control"],["Wikipedia (ang.): krytyka wyjaśnień typu \"just-so story\" - hasło \"Just-so story\"","https://en.wikipedia.org/wiki/Just-so_story"]],"p":null}],"bias":"Jednostronny: każde zachowanie wyjaśnia psychologią ewolucyjną w formie \"opowieści\", bez alternatyw (kultura, uczenie się). Brak źródeł; traktuj jako ciekawostkę, nie wiedzę.","channel":"Chill Dude Explains","section":"Chill Dude Explains"},{"id":"Mcg9GcilBfU","title_pl":"Zapalniczka sprzed 200 lat, która zapala się bez iskry","title":"This 200-Year-Old Lighter Ignites Without a Spark","channel":"Steve Mould","url":"https://www.youtube.com/watch?v=Mcg9GcilBfU","date":"2025-05-17","duration":830,"views":1363330,"section":"Ciekawostki","transcript":"youtube","added":"2026-11-03","tags":["Chemia","Historia nauki"],"about":"Steve Mould pokazuje działającą replikę lampy Döbereinera z 1823 r. i tłumaczy katalizę na platynie, od zapalniczki po ogniwo paliwowe.","intro":"Słoik z kwasem siarkowym, który sam wytwarza wybuchowy gaz i sam go zapala, brzmi jak zły pomysł, a jednak w 1823 r. kupowano go do domów. Steve Mould dostaje od Marcusa z kanału Marv's Lab działającą replikę lampy Döbereinera, pierwszej zapalniczki, i wyjaśnia, dlaczego wodór zapala się na platynie bez iskry.","points":[{"t":"Wodór z cynku","d":"Jony wodoru z kwasu odbierają cynkowi 2 słabo trzymane elektrony. Powstają atomy wodoru, które łączą się w cząsteczki H2 i wydobywają się jako pęcherzyki."},{"t":"Samoregulujący zbiornik","d":"Odwrócony szklany stożek napełnia się wodorem i wypycha kwas. Gdy kwas przestaje dotykać cynku, reakcja staje. Po otwarciu zaworu wodór ucieka, kwas wraca do cynku i produkcja rusza od nowa."},{"t":"Gąbka platynowa","d":"W oryginale strumień wodoru trafiał na gąbkę platynową. Dziś łatwiej kupić wełnę ceramiczną pokrytą platyną. Wodór zaczyna na niej płonąć bez ognia i iskry, a ciepło reakcji rozgrzewa platynę do żaru."},{"t":"Dlaczego wodór sam nie płonie","d":"Cząsteczki H2 i O2 trzeba najpierw rozerwać, zwykle ciepłem. Mieszanina w balonie wybucha dopiero po silnym podgrzaniu jednego miejsca."},{"t":"Orbital antywiążący","d":"Cząsteczki przyciągają się do platyny słabymi siłami van der Waalsa. Elektrony z metalu przechodzą na orbital antywiążący wodoru, w którym elektrony przebywają na zewnątrz atomów, więc cząsteczka się rozpada. Podobnie dzieje się z tlenem."},{"t":"Powstaje woda","d":"Wolne atomy wodoru i tlenu na powierzchni łączą się w wodę. Woda słabo wiąże się z platyną, a energia zderzenia wprawia ją w drgania, czyli ciepło, które pomaga jej się oderwać i rozgrzewa metal."},{"t":"Dlaczego to był hit","d":"W 1823 r. ogień rozpalano krzesiwem, tłokiem ogniowym albo pocieraniem patyków. Według Moulda lampę szybko wyparła zapałka Johna Walkera z 1827 r. (w filmie omyłkowo mowa o XVII w.)."},{"t":"Platyna dziś","d":"Katalityczny ogrzewacz do rąk Zippo grzeje do 6 godzin dzięki parującej benzynie i wełnie z platyną. Katalityczny dyfuzor zapachów spala alkohol bez płomienia. Liczy się duża powierzchnia, bo reakcja zachodzi na powierzchni metalu."},{"t":"Ogniwo paliwowe","d":"Wodór i tlen przepływają nad 2 powierzchniami platyny rozdzielonymi membraną, która przepuszcza tylko jony. Elektrony płyną obwodem i zasilają wentylator. Odwrócone ogniwo rozkłada wodę na wodór i tlen."},{"t":"Sponsor","d":"Końcówka to reklama programu WISE firmy Jane Street dla osób zaczynających studia."}],"conclusion":"Lampa Döbereinera była niebezpieczna i skomplikowana, ale zapoczątkowała katalizę na platynie, z której korzystają dziś m.in. ogniwa paliwowe.","factchecks":[{"claim":"Lampę wynalazł w 1823 r. niemiecki chemik J. W. Döbereiner; cynk z kwasem siarkowym daje w niej wodór.","verdict":"prawda","note":"Strumień wodoru zapala się na gąbce platynowej.","p":[0,1,2],"src":[["Wikipedia (ang.): lampa Döbereinera - hasło \"Döbereiner's lamp\"","https://en.wikipedia.org/wiki/Döbereiner's_lamp"]]},{"claim":"Po 3 latach lampa stała się przestarzała z powodu zapałek.","verdict":"przesada","note":"Zapałkę cierną Walker wynalazł w 1826 lub 1827 r., ale lampę produkowano do ok. 1880 r.","p":6,"src":[["Wikipedia (ang.): lampa Döbereinera - hasło \"Döbereiner's lamp\"","https://en.wikipedia.org/wiki/Döbereiner's_lamp"],["Wikipedia (ang.): John Walker - hasło \"John Walker (inventor)\"","https://en.wikipedia.org/wiki/John_Walker_(inventor)"]]},{"claim":"Lampa Döbereinera to pierwsze komercyjne zastosowanie katalizy.","verdict":"prawda","note":"Uznaje się ją za pierwsze komercyjne zastosowanie katalizy heterogenicznej.","p":[2,7],"src":[["Wikipedia (ang.): lampa Döbereinera - hasło \"Döbereiner's lamp\"","https://en.wikipedia.org/wiki/Döbereiner's_lamp"]]},{"claim":"Ogniwo paliwowe z membraną łączy wodór i tlen w wodę, wytwarzając prąd.","verdict":"prawda","note":"W ogniwach PEM membrana przewodzi protony, a elektrony płyną obwodem zewnętrznym.","p":8,"src":[["Wikipedia (ang.): ogniwo PEM - hasło \"Proton-exchange membrane fuel cell\"","https://en.wikipedia.org/wiki/Proton-exchange_membrane_fuel_cell"]]}],"bias":"Rzetelne wyjaśnienie chemii; przesadza z szybkim końcem lampy i myli wiek (XVII zamiast XIX). Na końcu reklama sponsora."},{"id":"kDfP5vAbOS0","title_pl":"Całkowicie błędne fakty, w które wszyscy wciąż wierzą","title":"Totally Wrong Facts Everyone Still Believes","url":"https://www.youtube.com/watch?v=kDfP5vAbOS0","date":"2025-04-30","duration":533,"views":2837925,"transcript":"youtube","added":"2026-11-03","tags":["Mity","Ciało i zdrowie","Nauka"],"about":"Ranking 10 popularnych \"faktów\", które według autora są mitami, od cukru i hiperaktywności po połkniętą gumę.","intro":"Ranking 10 popularnych \"faktów\", które według autora są mitami. Obala m.in. nadpobudliwość dzieci po cukrze, 10% mózgu, zabójczą monetę z Empire State Building, \"piorun nie uderza dwa razy\", hełmy wikingów z rogami, gęstsze włosy po goleniu, zakaz pływania po jedzeniu, utratę połowy ciepła przez głowę, 3-sekundową pamięć złotej rybki i gumę zalegającą 7 lat w żołądku.","points":[{"t":"10. Cukier nie robi z dzieci \"tornada\"","d":"W badaniu część dzieci dostała cukier, a część słodzik, i ani dzieci, ani rodzice nie wiedzieli, kto co dostał; różnicy nie było. Za to rodzice, którzy myśleli, że dziecko zjadło cukier, widzieli nadpobudliwość. Mit według autora zaczął się w latach 70. od lekarza obwiniającego dodatki do żywności."},{"t":"9. Nie używamy tylko 10% mózgu","d":"Skanery pokazują aktywność w całym mózgu, także we śnie, gdy steruje oddechem i sercem. Mózg to 2% masy ciała, a zużywa 20% energii; ewolucja nie trzymałaby 90% bezużytecznego organu, a nawet mały uraz daje poważne skutki. Mit ma pochodzić od badacza z Harvardu z XIX w. mówiącego o niewykorzystanym potencjale."},{"t":"8. Moneta z Empire State Building nie zabije","d":"Opór powietrza sprawia, że moneta koziołkuje i po ok. 15 m osiąga prędkość graniczną ok. 40 km/h, wolniej niż przeciętny rowerzysta, więc uderzenie przypomina pstryczka. W próżni osiągnęłaby ponad 320 km/h. Autor dodaje, że groźniejszy byłby spadający długopis."},{"t":"7. Piorun uderza w to samo miejsce","d":"Empire State Building dostaje ok. 25 uderzeń rocznie, a strażnik parku Roy Sullivan przeżył 7 uderzeń. Pioruny trafiają w te same wysokie obiekty, np. samotne drzewo. Mogą też uderzyć kilometry od burzy, przy czystym niebie."},{"t":"6. Wikingowie nie nosili hełmów z rogami","d":"Rogi wymyślili XIX-wieczni kostiumolodzy operowi, bo wyglądały dramatycznie, a w walce byłyby uchwytem dla wroga. Znalezione hełmy wikingów są proste, czasem z osłoną nosa. Rogate hełmy z Danii są o 3000 lat starsze i były ceremonialne."},{"t":"5. Golenie nie zagęszcza włosów","d":"Golenie ścina włos na płasko, jak pień ścięty piłą, więc odrost wydaje się grubszy niż naturalnie zwężona końcówka. Badania od dekad nie wykazały wpływu golenia, a grubość, kolor i tempo wzrostu zależą od genów. Gdyby to działało, golenie leczyłoby łysienie, a Jeff Bezos wciąż jest łysy."},{"t":"4. Można pływać zaraz po jedzeniu","d":"Według autora nie ma ani jednego udokumentowanego utonięcia z powodu pływania po jedzeniu, choć zasady 30 minut pilnowali nawet ratownicy. Po dużym posiłku można najwyżej złapać lekki skurcz jak przy bieganiu. Pływacy jedzą podczas treningów, a Czerwony Krzyż to potwierdza."},{"t":"3. Głowa nie traci połowy ciepła","d":"Mit o 40-45% ciepła pochodzi z wojskowego podręcznika, w którego badaniu ludzie byli w pełnym stroju zimowym z odkrytą tylko głową. Głowa to ok. 10% powierzchni ciała, więc traci ok. 10% ciepła; strata zależy od odkrytej skóry. Wyjątkiem są niemowlęta i małe dzieci, bo mają proporcjonalnie większe głowy."},{"t":"2. Złota rybka ma dobrą pamięć","d":"Złote rybki rozwiązują labirynty i pamiętają rozwiązanie przez miesiące, rozpoznają twarze, uczą się sztuczek, np. przepływania przez obręcze czy \"gry w piłkę\", i rozróżniają utwory muzyczne, mając mózg mniejszy od ziarnka grochu. Badanie ich mózgu może pomóc zrozumieć ludzką pamięć."},{"t":"1. Połknięta guma nie zostaje na 7 lat","d":"Guma przechodzi przez przewód pokarmowy jak inne jedzenie, tylko się nie rozkłada, podobnie jak ziarna kukurydzy, i wychodzi w 1-2 dni. Żołądek ciągle się porusza, więc nic się nie przykleja. Problem może być tylko przy połykaniu dużych ilości."}],"conclusion":"Większość \"oczywistych\" faktów z dzieciństwa to mity, które przetrwały, bo brzmią przekonująco albo powtarzali je rodzice.","factchecks":[{"claim":"Cukier nie powoduje nadpobudliwości u dzieci; rodzice widzą ją z powodu oczekiwań.","verdict":"prawda","note":"Metaanaliza 16 ślepych badań (JAMA 1995) nie wykazała wpływu cukru na zachowanie.","src":[["JAMA 1995, Wolraich i in. (PubMed)","https://pubmed.ncbi.nlm.nih.gov/7474248/"],["Hoover i Milich 1994, J Abnorm Child Psychol","https://link.springer.com/article/10.1007/BF02168088"]],"p":0},{"claim":"Mit 10% mózgu; mózg to 2% masy i 20% energii.","verdict":"prawda","note":"Obrazowanie pokazuje aktywność całego mózgu; dane o 2% masy i 20% energii są standardowe.","src":[["Wikipedia (ang.): mit 10% mózgu - hasło \"Ten percent of the brain myth\"","https://en.wikipedia.org/wiki/Ten_percent_of_the_brain_myth"],["Scientific American: mit 10%","https://www.scientificamerican.com/article/do-people-only-use-10-percent-of-their-brains/"]],"p":1},{"claim":"Moneta osiąga prędkość graniczną ok. 40 km/h i nie zabije.","verdict":"prawda","note":"Zmierzono ok. 40-80 km/h; moneta nie przebije czaszki.","src":[["Wikipedia (ang.): lista powszechnych mitów (moneta z wieżowca) - hasło \"List of common misconceptions\"","https://en.wikipedia.org/wiki/List_of_common_misconceptions_about_science,_technology,_and_mathematics"],["Wikipedia (ang.): prędkość graniczna - hasło \"Terminal velocity\"","https://en.wikipedia.org/wiki/Terminal_velocity"]],"p":2},{"claim":"Empire State Building: ok. 25 uderzeń pioruna rocznie; Roy Sullivan przeżył 7 uderzeń.","verdict":"prawda","note":"NOAA podaje ok. 20-25 uderzeń rocznie w Empire State Building. Sullivan jest w Księdze Guinnessa jako osoba trafiona 7 razy (1942-1977).","src":[["NOAA/NWS: mity o piorunach","https://www.weather.gov/safety/lightning-myths"],["Wikipedia (ang.): Roy Sullivan","https://en.wikipedia.org/wiki/Roy_Sullivan"]],"p":3},{"claim":"Rogate hełmy z Danii są o 3000 lat starsze od wikingów.","verdict":"fałsz","note":"Hełmy z Viksø są z ok. 900 p.n.e., czyli ok. 1700 lat przed wikingami, nie 3000.","src":[["Aarhus University: datowanie hełmów z Viksø","https://cas.au.dk/en/currently/news/show/artikel/new-study-about-the-viksoe-helmets"],["Smithsonian: hełmy mają prawie 3000 lat","https://www.smithsonianmag.com/smart-news/iconic-viking-horned-helmets-actually-3000-years-old-180979339/"]],"p":4},{"claim":"Golenie nie zmienia grubości ani tempa wzrostu włosów.","verdict":"prawda","note":"Badania od lat 20. XX w. nie wykazały wpływu golenia na włosy; Mayo Clinic potwierdza.","src":[["Mayo Clinic: golenie a odrost włosów","https://www.mayoclinic.org/healthy-lifestyle/adult-health/expert-answers/hair-removal/faq-20058427"]],"p":5},{"claim":"Pływanie zaraz po jedzeniu nie jest groźne; Czerwony Krzyż to potwierdza.","verdict":"prawda","note":"Czerwony Krzyż nie znalazł dowodów na utonięcia związane z jedzeniem przed pływaniem.","src":[["Wikipedia (ang.): lista powszechnych mitów (pływanie po jedzeniu) - hasło \"List of common misconceptions\"","https://en.wikipedia.org/wiki/List_of_common_misconceptions_about_science,_technology,_and_mathematics"]],"p":6},{"claim":"Mit 40-45% ciepła tracone przez głowę pochodzi z wojskowego podręcznika; głowa to ok. 10% powierzchni.","verdict":"prawda","note":"BMJ (2008): mit pochodzi z badań armii USA; głowa to ok. 7-10% powierzchni ciała.","src":[["BMJ 2008: świąteczne mity medyczne (DOI)","https://doi.org/10.1136/bmj.a2769"]],"p":7},{"claim":"Złote rybki pamiętają przez miesiące, uczą się sztuczek i rozróżniają muzykę.","verdict":"prawda","note":"Badania pokazują pamięć trwającą miesiące i rozróżnianie muzyki u złotych rybek.","src":[["Wikipedia (ang.): złota rybka (pamięć) - hasło \"Goldfish\"","https://en.wikipedia.org/wiki/Goldfish"],["Shinozuka i in. 2013, muzyka a złote rybki (PubMed)","https://pubmed.ncbi.nlm.nih.gov/23796771/"]],"p":8},{"claim":"Połknięta guma wychodzi w 1-2 dni, nie zostaje 7 lat.","verdict":"prawda","note":"Gastroenterolodzy potwierdzają; problemy (bezoar) zdarzają się tylko przy bardzo częstym połykaniu dużych ilości, zwłaszcza u dzieci.","src":[["Scientific American: połknięta guma","https://www.scientificamerican.com/article/fact-or-fiction-chewing-gum-takes-seven-years-to-digest/"],["Mayo Clinic: połknięta guma","https://www.mayoclinic.org/healthy-lifestyle/nutrition-and-healthy-eating/expert-answers/digestion/faq-20058446"]],"p":9}],"bias":"Rzetelny, w większości zgodny z nauką. Jedyny wyraźny błąd: wiek hełmów z Viksø. Ton prześmiewczy wobec rodziców, ale bez tendencyjności.","channel":"Chill Dude Explains","section":"Chill Dude Explains"},{"id":"TsWsDwn7mlA","title_pl":"Jak Egipcjanie zapomnieli hieroglifów","title":"How did the Egyptians forget Hieroglyphs?","channel":"toldinstone","url":"https://www.youtube.com/watch?v=TsWsDwn7mlA","date":"2025-04-25","duration":653,"views":759630,"section":"Historia","transcript":"youtube","added":"2026-11-03","tags":["Historia"],"about":"Dlaczego po ponad 3500 latach użycia hieroglify przestały być czytelne: upadek świątyń, kapłanów i rzymska kontrola.","intro":"Garrett Ryan z toldinstone zaczyna od ostatniej inskrypcji hieroglificznej na wyspie File z 394 r. Opisuje, jak w czasach rzymskich pismo wciąż się rozwijało, jak Rzym odebrał świątyniom majątek i autonomię i dlaczego, gdy zniknęli kapłani, nikt nie umiał już czytać hieroglifów, choć Rzymian bardzo one ciekawiły.","points":[{"t":"Ostatnia inskrypcja","d":"W świątyni Izydy na File wyryto napis ku czci boga Mandulisa, datowany na urodziny Ozyrysa, czyli 24 sierpnia 394 r. Hieroglify powstały ok. XXXIII w. p.n.e., a dłuższą historię mają dziś według autora tylko znaki chińskie."},{"t":"Pismo wciąż się rozwijało","d":"W czasach rzymskich język zapisywany hieroglifami miał prawie 2000 lat, ale liczba znaków wzrosła z ok. 750 do kilku tysięcy. W świątyni w Esnie jeden hymn zapisano wyłącznie znakami krokodyli, a inny baranów."},{"t":"Hieroglify w rzymskim Egipcie","d":"Pierwszy prefekt Korneliusz Gallus upamiętnił stłumienie buntu napisem po łacinie, grecku i hieroglifami, a obeliski zamawiali Domicjan i Hadrian. Za Trajana w Oksyrynchos pracowało co najmniej 5 zawodowych rytowników hieroglifów."},{"t":"Świątynie pełne tekstów","d":"Większość tekstów była w świątyniach: hymny, rytuały świąt, mity. Publikacja rzymskich inskrypcji z Dendery ma prawie 2000 stron, a z Esny ponad 1000; cesarze występowali na reliefach jako faraonowie."},{"t":"Miliony mumii zwierząt","d":"Pobożność ludowa była silna: świątynie Memfis sprzedawały zwierzęta na ofiary, a w katakumbach Sakkary jest podobno ponad 4 mln zmumifikowanych ibisów i pół miliona sokołów."},{"t":"Rzym przejmuje świątynie","d":"Za Ramzesa III świątynia Amona w Karnaku miała ok. 2800 km² ziemi, 421 tys. bydła i 65 miast. Ptolemeusze dawali świątyniom autonomię, a Rzymianie zabrali większość majątków, uzależnili je od państwowych pensji i ograniczyli przywileje kapłanów."},{"t":"Koniec wsparcia","d":"Po nawróceniu Konstantyna cesarskie wsparcie ustało; ostatnim cesarzem na ścianie świątyni był Maksymin Daja (310-313). Świątynię w Luksorze za Dioklecjana zamieniono w fort legionu, a w świątyni grobowej Ramzesa III wyrosła wieś z kościołem."},{"t":"Pismo garstki kapłanów","d":"Nawet w czasach faraonów hieroglify znało mniej niż 1% ludności, głównie w świątyniach. Gdy greka stała się językiem administracji, uczyć się ich mieli powód już tylko kapłani, a ci znikali."},{"t":"Rzymska ciekawość","d":"Obelisk z II w. we Florencji ma przypadkowe znaki, a Tablica Bembo z Rzymu tylko udaje hieroglify. Hadrian wypytywał kapłanów o znaki, Chajremon, nauczyciel Nerona, pisał o nich traktat, ale żaden znany autor nie twierdził, że umie je czytać."},{"t":"Hieroglifika Horapollona","d":"Uważano, że znaki to alegorie świętej mądrości. Jedyne egipskie dzieło o hieroglifach przetłumaczone na grekę, Hieroglifika Horapollona z ok. V w., znało część znaczeń, ale nie wiedziało, jak znaki tworzą zdania."}],"conclusion":"Hieroglify zniknęły razem ze świątyniami i kapłanami, którzy jako jedyni ich uczyli.","factchecks":[{"claim":"Ostatnia inskrypcja hieroglificzna na File pochodzi z 24 sierpnia 394 r.","verdict":"prawda","note":"Graffito Esmet-Achoma datuje się na 24 sierpnia 394 r., to ostatni znany tekst hieroglificzny.","p":0,"src":[["Wikipedia (ang.): graffito Esmet-Achoma - hasło \"Graffito of Esmet-Akhom\"","https://en.wikipedia.org/wiki/Graffito_of_Esmet-Akhom"]]},{"claim":"Liczba hieroglifów wzrosła z ok. 750 do kilku tysięcy w epoce grecko-rzymskiej.","verdict":"prawda","note":"Klasyczny egipski używał ok. 750-900 znaków, w epoce ptolemejskiej i rzymskiej ok. 5000-7000.","p":1,"src":[["Wikipedia (ang.): hieroglify egipskie - hasło \"Egyptian hieroglyphs\"","https://en.wikipedia.org/wiki/Egyptian_hieroglyphs"]]},{"claim":"Świątynia Amona w Tebach miała za Ramzesa III ogromne ziemie i ok. 421 tys. bydła.","verdict":"prawda","note":"Papirus Harris I podaje, że Teby zarządzały 80% świątynnej ziemi i 86% bydła.","p":5,"src":[["Wikipedia (ang.): Papirus Harris I - hasło \"Papyrus Harris I\"","https://en.wikipedia.org/wiki/Papyrus_Harris_I"]]},{"claim":"Tablica Bembo zrobiona w Rzymie tylko naśladuje hieroglify.","verdict":"prawda","note":"Powstała w Rzymie w 2. połowie I w.; jej twórca w ogóle nie rozumiał hieroglifów.","p":8,"src":[["Wikipedia (ang.): Tablica Bembo - hasło \"Bembine Tablet\"","https://en.wikipedia.org/wiki/Bembine_Tablet"]]},{"claim":"Chajremon z Aleksandrii uczył Nerona i pisał o hieroglifach.","verdict":"prawda","note":"Był nauczycielem Nerona przed 49 r.; jego dzieło o hieroglifach zachowało się tylko we fragmentach.","p":8,"src":[["Wikipedia (ang.): Chajremon z Aleksandrii - hasło \"Chaeremon of Alexandria\"","https://en.wikipedia.org/wiki/Chaeremon_of_Alexandria"]]},{"claim":"Hieroglifika Horapollona powstała ok. V w. i błędnie tłumaczyła wiele znaków.","verdict":"prawda","note":"Datowana na V w.; część znaczeń jest trafna, ale interpretacje są głównie alegoryczne.","p":9,"src":[["Wikipedia (ang.): Horapollo - hasło \"Horapollo\"","https://en.wikipedia.org/wiki/Horapollo"]]},{"claim":"W Sakkarze jest ponad 4 mln mumii ibisów.","verdict":"nie da się sprawdzić","note":"Szacunki dla katakumb ibisów w Sakkarze sięgają milionów, ale dokładnych liczb brak.","p":4,"src":[["Wikipedia (ang.): mumie zwierząt - hasło \"Animal mummy\"","https://en.wikipedia.org/wiki/Animal_mummy"]]}],"bias":"Rzetelny, spokojny wykład; kilka liczb podanych jako pewne to szacunki. Reklama biurka w środku."},{"id":"wztjGaAiqME","title_pl":"Niewinne nawyki, które po cichu niszczą twoje ciało","title":"Innocent Habits That Are Secretly Wrecking Your Body","url":"https://www.youtube.com/watch?v=wztjGaAiqME","date":"2025-04-21","duration":733,"views":1492461,"transcript":"youtube","added":"2026-11-03","tags":["Ciało i zdrowie"],"about":"9 codziennych nawyków, które według autora po cichu szkodzą zdrowiu, od obgryzania paznokci po wstrzymywanie moczu.","intro":"Ranking 9 codziennych nawyków, które według autora po cichu szkodzą zdrowiu. Są to obgryzanie paznokci, tłumienie kichnięć, czyszczenie uszu patyczkami, picie za dużo wody, głośne słuchawki, światło w nocy, siedzenie, spanie na brzuchu i wstrzymywanie moczu. Przy każdym autor opisuje mechanizm szkody i czasem daje prostą radę, co robić zamiast tego.","points":[{"t":"9. Obgryzanie paznokci","d":"Paznokcie zbierają zarazki z klamek, telefonów i klawiatur, a obgryzanie przenosi je do ust i wyszczerbia przednie zęby. Zerwane skórki otwierają drogę do zanokcicy. Według autora obgryzacze mają więcej infekcji żołądka i jelit, a nawyk wiąże się z lękiem."},{"t":"8. Tłumienie kichnięć","d":"Kichnięcie ma osiągać do ok. 160 km/h, a zatkanie nosa i ust kieruje ciśnienie z powrotem do głowy. Przez trąbki Eustachiusza może pęknąć błona bębenkowa, mogą pękać naczynka w oczach i nosie, rzadko dochodzi do uszkodzenia gardła. Ktoś złamał małą kość twarzy i miał powietrze pod skórą."},{"t":"7. Patyczki do uszu","d":"Patyczek nie czyści, tylko wpycha woskowinę głębiej, a uszy oczyszczają się same; zbita woskowina zmniejsza słyszenie i bywa usuwana na SOR. Błona bębenkowa jest cienka jak folia spożywcza, a ranki i wilgoć sprzyjają infekcjom. Rada: myć tylko małżowinę myjką."},{"t":"6. Przewodnienie","d":"Hiponatremia: przy szybkim piciu dużej ilości wody nerki nie nadążają, sodu jest za mało i komórki, także mózgu, puchną. Skutki to ból głowy, dezorientacja, drgawki, a nawet śmierć; 9-letnia dziewczynka zmuszona do picia za karę ledwo przeżyła. Rada: pij, gdy chce ci się pić."},{"t":"5. Słuchawki","d":"Komórki rzęsate w ślimaku ucha nie odrastają. Rozmowa to ok. 60 dB, słuchawki dają 105 dB i więcej, a powyżej 85 dB słuch się uszkadza, przy 100 dB w ok. 15 minut, bez bólu. Według autora wielu nastolatków ma słuch 50-latków, a aparat słuchowy go nie przywraca."},{"t":"4. Lampki nocne","d":"Po zmroku organizm wytwarza melatoninę, a nawet słabe światło (ładowarka, latarnia, budzik) może obciąć ją o połowę. Długotrwale rozregulowuje to metabolizm: tycie bez zmiany diety i gorsze działanie insuliny. Myszy przy słabym świetle nocą tyły i miały objawy depresji; zaburzony sen wiąże się z lękiem."},{"t":"3. Krzesło","d":"Przy wielogodzinnym siedzeniu krew zalega w nogach, co zwiększa ryzyko zakrzepów, spada spalanie kalorii i aktywność enzymów rozkładających tłuszcz. Mięśnie brzucha i pleców słabną, a sylwetka się garbi. Według autora pracownik biurowy siedzi ok. 15 godzin dziennie, a część naukowców mówi \"siedzenie to nowe palenie\"."},{"t":"2. Spanie na brzuchu","d":"Żeby oddychać, trzeba skręcić szyję na bok na wiele godzin, a ciężar ciała spłaszcza naturalne krzywizny kręgosłupa. Uciskane nerwy dają mrowienie i drętwienie rąk, a z czasem przewlekły ból szyi i pleców. Rada: bardzo płaska poduszka, mała poduszka pod miednicę, a najlepiej nauka spania na plecach lub boku."},{"t":"1. Wstrzymywanie moczu","d":"Pęcherz wysyła sygnał, gdy jest w połowie pełny, a ignorowanie go rozciąga go jak gumkę, która traci sprężystość. Osłabiony nie opróżnia się do końca, a zalegający mocz sprzyja zakażeniom dróg moczowych. Pęknięcie jest rzadkie, ale z latami może osłabnąć dno miednicy i pojawić się nietrzymanie."}],"conclusion":"Drobne nawyki powtarzane codziennie sumują się w realne szkody, więc warto je korygować, zanim pojawią się objawy.","factchecks":[{"claim":"Kichnięcie osiąga ok. 160 km/h.","verdict":"fałsz","note":"Pomiar szybką kamerą (2013) dał ok. 16 km/h; 160 km/h to dawne szacunki.","src":[["Tang i in. 2013, PLOS One","https://journals.plos.org/plosone/article?id=10.1371%2Fjournal.pone.0059970"]],"p":1},{"claim":"Tłumione kichnięcie może uszkodzić gardło i uszy.","verdict":"prawda","note":"Opisano m.in. pęknięcie gardła u mężczyzny, który zatkał nos i usta (BMJ Case Reports, 2018). To jednak bardzo rzadkie przypadki.","src":[["BMJ Case Reports 2018 (PubMed)","https://pubmed.ncbi.nlm.nih.gov/29335355/"]],"p":1},{"claim":"Patyczki wpychają woskowinę i mogą uszkodzić błonę bębenkową.","verdict":"prawda","note":"Zgodne z wytycznymi otolaryngologów (AAO-HNS) i analizami urazów u dzieci.","src":[["Wikipedia (ang.): patyczki higieniczne (ryzyka) - hasło \"Cotton swab\"","https://en.wikipedia.org/wiki/Cotton_swab"],["AAO-HNS: wytyczne o woskowinie","https://www.enthealth.org/conditions/earwax-cerumen/"]],"p":2},{"claim":"Zbyt dużo wody może zabić (hiponatremia).","verdict":"prawda","note":"Zatrucie wodą jest dobrze udokumentowane; przypadku 9-latki nie udało się zweryfikować.","src":[["Wikipedia (ang.): zatrucie wodne - hasło \"Water intoxication\"","https://en.wikipedia.org/wiki/Water_intoxication"]],"p":3},{"claim":"Powyżej 85 dB grozi uszkodzenie słuchu, przy 100 dB po ok. 15 minutach; nastolatki mają słuch 50-latków.","verdict":"półprawda","note":"Progi zgadzają się z normą NIOSH, ale \"słuch 50-latków\" nie ma źródła.","src":[["CDC/NIOSH: hałas w pracy a utrata słuchu","https://www.cdc.gov/niosh/noise/about/index.html"],["WHO: głuchota i utrata słuchu","https://www.who.int/news-room/fact-sheets/detail/deafness-and-hearing-loss"]],"p":4},{"claim":"Przyćmione światło nocą tuczy myszy.","verdict":"prawda","note":"Myszy przy słabym świetle nocą tyły (PNAS 2010); u ludzi są tylko korelacje.","src":[["Fonken i in. 2010, PNAS (DOI)","https://doi.org/10.1073/pnas.1008734107"]],"p":5},{"claim":"Przeciętny pracownik biurowy siedzi do 15 godzin dziennie; \"siedzenie to nowe palenie\".","verdict":"fałsz","note":"Dorośli siedzą ok. 9-10 h dziennie, a ryzyko palenia jest wielokrotnie wyższe.","src":[["Wikipedia (ang.): siedzący tryb życia - hasło \"Sedentary lifestyle\"","https://en.wikipedia.org/wiki/Sedentary_lifestyle"],["Ekelund i in. 2016, Lancet (DOI)","https://doi.org/10.1016/S0140-6736(16)30370-1"]],"p":6},{"claim":"Obgryzacze paznokci mają istotnie więcej infekcji przewodu pokarmowego.","verdict":"nie da się sprawdzić","note":"Obgryzanie przenosi bakterie, ale brak solidnych badań o częstszych infekcjach jelitowych.","src":[["Wikipedia (ang.): obgryzanie paznokci - hasło \"Nail biting\"","https://en.wikipedia.org/wiki/Nail_biting"]],"p":0},{"claim":"Częste wstrzymywanie moczu osłabia dno miednicy i prowadzi do nietrzymania.","verdict":"półprawda","note":"Okazjonalne wstrzymywanie jest bezpieczne; szkodzi tylko wieloletnie, skrajne.","src":[["Cleveland Clinic: skutki długiego wstrzymywania moczu","https://my.clevelandclinic.org/health/diseases/22208-shy-bladder-syndrome-paruresis"],["Kettering Health: jak długo można wstrzymywać mocz","https://ketteringhealth.org/how-long-should-i-hold-my-pee/"]],"p":8}],"bias":"Straszy (\"cichy zabójca\") i podaje kilka przesadzonych liczb (kichnięcie, 15 h siedzenia). Rady są w większości sensowne, ale ryzyka są wyolbrzymione.","channel":"Chill Dude Explains","section":"Chill Dude Explains"},{"id":"wJyJUUv_7DA","title_pl":"Prawda o koślawieniu kolan","title":"The Truth About Knee Valgus","channel":"E3 Rehab","url":"https://www.youtube.com/watch?v=wJyJUUv_7DA","date":"2025-04-20","duration":1185,"views":54625,"section":"Sport","transcript":"whisper","added":"2026-11-03","tags":["Ciało i zdrowie","Trening","Mity"],"about":"Fizjoterapeuta E3 Rehab wyjaśnia, czym jest koślawienie kolan w przysiadzie, sporcie i bieganiu i kiedy naprawdę warto je korygować.","intro":"E3 Rehab tłumaczy anatomię koślawienia kolan (knee valgus) i przegląda badania na jego temat. Pokazuje, dlaczego w przysiadzie na dwóch nogach zwykle nie jest groźne, czemu nie da się nim przewidzieć zerwania więzadła krzyżowego i co robić u biegaczy.","points":[{"t":"Czym jest koślawienie","d":"To odwiedzenie piszczeli względem kości udowej. W staniu większość ludzi ma 5-10 stopni; więcej to kolana koślawe. Kolano nie ma mięśni, które by je odwodziły, więc dynamiczne koślawienie jest skutkiem ruchu bioder i stóp."},{"t":"Przyczyny w przysiadzie","d":"Wiąże się z ograniczonym zgięciem grzbietowym stopy, ale słabe pośladki to według autora mit: badania dały sprzeczne wyniki, a w jednym osoby z koślawieniem miały silniejsze biodra."},{"t":"Strategia u zaawansowanych","d":"U doświadczonych sztangistów koślawienie pojawia się dopiero przy ciężarach bliskich maksymalnym. Pośladek wielki i przywodziciel wielki wspólnie szukają najsilniejszej pozycji; u początkujących to raczej brak wprawy."},{"t":"Czy to szkodzi w przysiadzie","d":"Przy dużym zgięciu kolana obciążenie więzadła krzyżowego przedniego jest minimalne, a ruch jest wolny i na dwóch nogach. Według autora koślawienie nie jest groźniejsze od innego wzorca ruchu."},{"t":"Jak korygować u początkujących","d":"Pokazać technikę, dać zewnętrzne wskazówki, ewentualnie szersze ustawienie stóp ze stopami na zewnątrz, a potem pozwolić ćwiczyć. Przy słabym zgięciu stopy pomagają podkładki pod pięty lub buty do podnoszenia ciężarów."},{"t":"Guma na kolanach","d":"Przegląd z 2023 roku wykazał, że lekkie gumy nie zmieniają koślawienia, a ciężkie je zwiększają."},{"t":"Sport i więzadło krzyżowe","d":"Zerwanie ACL to zwykle koślawienie lekko zgiętego kolana z dużą, szybką siłą. Mimo badania z 2005 roku na 205 zawodniczkach nowsze badania na tysiącach sportowców nie znalazły związku, a trenerzy przewidują urazy na poziomie rzutu monetą."},{"t":"Profilaktyka dla wszystkich","d":"Dlatego program zapobiegania urazom z ćwiczeniami siłowymi i plyometrią powinien dostać każdy sportowiec, a nie tylko ci z koślawieniem."},{"t":"Biegacze","d":"Większe przywiedzenie biodra może wiązać się z bólem rzepkowo-udowym i pasma biodrowo-piszczelowego. Najpierw sprawdza się zmiany w kilometrażu, potem pomagają korekta biegu i ćwiczenia siłowe."}],"conclusion":"Koślawienie w przysiadzie nie jest samo w sobie groźne; w sporcie nie przewiduje urazów, więc profilaktykę powinien mieć każdy.","factchecks":[{"claim":"Badanie z 2005 roku na 205 zawodniczkach wiązało koślawienie z ryzykiem zerwania ACL.","verdict":"prawda","note":"To prospektywne badanie Hewetta i wsp. w Am J Sports Med z 2005 roku.","p":6,"src":[["PubMed: Hewett i wsp. 2005, koślawienie a ryzyko ACL - \"Biomechanical measures of neuromuscular control and valgus loading\"","https://pubmed.ncbi.nlm.nih.gov/15722287/"]]},{"claim":"Nowsze badania nie znalazły związku koślawienia z przyszłym urazem ACL.","verdict":"prawda","note":"Krosshaug i wsp. (2016) oraz praca \"Kiss goodbye to the kissing knees\" nie wykazały związku u elitarnych zawodniczek.","p":6,"src":[["PubMed: Krosshaug i wsp. 2016, test zeskoku jako badanie przesiewowe - \"The Vertical Drop Jump Is a Poor Screening Test\"","https://pubmed.ncbi.nlm.nih.gov/26867936/"],["PubMed: Sports Biomech, brak związku - \"Kiss goodbye to the kissing knees\"","https://pubmed.ncbi.nlm.nih.gov/33906580/"]]},{"claim":"Trenerzy i lekarze nie potrafią przewidzieć zerwania ACL lepiej niż rzut monetą.","verdict":"prawda","note":"Badanie w Br J Sports Med (2020) pokazało trafność przewidywań na poziomie przypadku.","p":6,"src":[["PubMed: Br J Sports Med 2020 - \"I spy with my little eye ... a knee about to go 'pop'?\"","https://pubmed.ncbi.nlm.nih.gov/31611189/"]]},{"claim":"Lekkie gumy nie zmieniają koślawienia, a ciężkie je zwiększają.","verdict":"prawda","note":"Tak podsumowuje przegląd narracyjny z 2023 roku o gumach w przysiadach.","p":5,"src":[["PubMed: Int J Sports Phys Ther 2023 - \"The Use of Elastic Resistance Bands to Reduce Dynamic Knee Valgus\"","https://pubmed.ncbi.nlm.nih.gov/37795322/"]]},{"claim":"Korekta biegu i ćwiczenia siłowe pomagają biegaczom z bólem rzepkowo-udowym.","verdict":"prawda","note":"Przegląd Neala i wsp. (2016) wskazał, że te interwencje zmieniają biomechanikę i zmniejszają ból.","p":8,"src":[["PubMed: Neal i wsp. 2016, biegacze z bólem rzepki - \"Runners with patellofemoral pain have altered biomechanics\"","https://pubmed.ncbi.nlm.nih.gov/26979886/"]]}],"bias":"Wyważony i oparty na badaniach. Autor sam zaznacza ograniczenia (np. guma może pomagać części osób). Na końcu krótka reklama programów E3 Rehab."},{"id":"19UC0V9Ul2M","title_pl":"Bardzo niepokojące rzeczy, które robi twoje ciało","title":"Very CREEPY Things Your Body Does","url":"https://www.youtube.com/watch?v=19UC0V9Ul2M","date":"2025-04-07","duration":597,"views":1909931,"transcript":"youtube","added":"2026-11-03","tags":["Ciało i zdrowie","Nauka"],"about":"Ranking 10 \"przerażających\" rzeczy, które robi ludzkie ciało i mózg, od drgnięć przy zasypianiu po roztocza w rzęsach.","intro":"Ranking 10 rzeczy, które ludzkie ciało i mózg robią \"za twoimi plecami\". Autor zaczyna od drgnięć przy zasypianiu i fantomowych wibracji telefonu, przechodzi przez pasożyta Toxoplasma, paraliż senny i \"drugi mózg\" w jelitach, a kończy na roztoczach żyjących w rzęsach. Ton jest celowo straszny, a każdy punkt to krótka ciekawostka bez podanych źródeł.","points":[{"t":"10. Drgnięcia przy zasypianiu","d":"Ma to ok. 70% ludzi: gdy mięśnie się rozluźniają, mózg bierze to za spadanie i budzi nas szarpnięciem, czasem z obrazem upadku lub hukiem. Autor podaje hipotezę, że to pozostałość po spaniu na drzewach. Zmęczenie i stres to nasilają."},{"t":"9. Syndrom fantomowych wibracji","d":"Według autora zgłasza je do 90% posiadaczy telefonów. Mózg przyzwyczajony do powiadomień bierze ruch ubrania czy drgnięcie mięśnia za wibrację. Im większy lęk przed przegapieniem wiadomości, tym częściej, a zmiana kieszeni nie pomaga, bo \"wibracje\" przenoszą się w nowe miejsce."},{"t":"8. Pasożyty sterujące","d":"Toxoplasma gondii ma być u ok. 30% ludzi, a źródłem są koty. U myszy sprawia, że lubią zapach kociego moczu i idą prosto do kota. U ludzi według autora tworzy cysty w mózgu, zwiększa skłonność do ryzyka, a w rejonach z większym zarażeniem jest więcej wypadków."},{"t":"7. Paraliż senny","d":"We śnie mózg wyłącza mięśnie, żeby nie odgrywać snów; czasem umysł budzi się wcześniej niż ciało. Człowiek jest przytomny, ale nie może się ruszyć ani krzyczeć. Częste są ciemne postacie w pokoju, ucisk na klatce piersiowej i uczucie dłoni na gardle; strach według autora przedłuża paraliż."},{"t":"6. Kichanie od światła","d":"U części ludzi jasne światło wywołuje kichanie, bo sygnał z oczu \"przeskakuje\" na nerwy nosa. Kichnięcia przychodzą seriami po 2-3, wywołuje je słońce, flesz, ekran albo odblask śniegu. Autor podaje przykład pilota i kierowcy oraz to, że cecha jest dziedziczna: 50% szans, jeśli ma ją jeden z rodziców."},{"t":"5. Drugi mózg w jelitach","d":"Wokół jelit jest sieć neuronów, według autora większa niż cały mózg kota, która steruje trawieniem bez udziału głowy. \"Motyle w brzuchu\" to rozmowa dwóch mózgów. Biliony bakterii jelitowych mają produkować substancje wpływające na nastrój, a w jelitach powstaje 90% serotoniny."},{"t":"4. Mózg zjada sam siebie","d":"Autofagia to rozkładanie i trawienie własnych, starych lub uszkodzonych części komórki. Gdy pomijasz posiłki, neurony głodu według autora \"zjadają się\" mocniej i wzmacniają sygnał głodu. Autor dodaje, że zatrzymanie autofagii szkodzi."},{"t":"3. Zespół Capgrasa","d":"Mózg rozpoznaje wygląd osoby i osobno uczucia wobec niej. Gdy te części przestają się komunikować, twarz mamy jest rozpoznana, ale ciepło znika i pojawia się pewność, że to oszust, a drobna zmiana, np. fryzura, staje się \"dowodem\". Wywołać to może uraz mózgu, udar lub niektóre leki."},{"t":"2. Jamais vu","d":"Znane rzeczy nagle wydają się obce: własna twarz w lustrze, sypialnia, przyjaciel. Autor radzi napisać jedno słowo ok. 30 razy, aż litery zamienią się w dziwne kształty. Zdarza się to muzykom w trakcie grania utworu, który znają od lat."},{"t":"1. Roztocza w rzęsach","d":"Prawie każdy dorosły ma w mieszkach rzęs roztocza, które jedzą martwy naskórek i łój. W nocy wychodzą na twarz i się rozmnażają, a odchody gromadzą do śmierci i uwalniają naraz. Około 60. roku życia mają je prawie wszystkie mieszki."}],"conclusion":"Ciało i mózg robią mnóstwo dziwnych rzeczy bez naszej wiedzy, a wiele z nich to ślady dawnej ewolucji.","factchecks":[{"claim":"Drgnięcia przy zasypianiu ma ok. 70% ludzi; to pozostałość po spaniu na drzewach.","verdict":"półprawda","note":"Częstość 60-70% jest podawana w literaturze, ale wyjaśnienie z drzewami to tylko hipoteza.","src":[["Wikipedia (ang.): drgawki hipnagogiczne - hasło \"Hypnic jerk\"","https://en.wikipedia.org/wiki/Hypnic_jerk"]],"p":0},{"claim":"Fantomowe wibracje zgłasza do 90% użytkowników.","verdict":"prawda","note":"W badaniu Drouin i in. (2012) 89% studentów zgłosiło fantomowe wibracje. Inne badania dają niższe wartości, więc \"do 90%\" to górna granica.","src":[["Drouin i in. 2012 (DOI)","https://doi.org/10.1016/j.chb.2012.03.013"],["Wikipedia (ang.): syndrom fantomowych wibracji - hasło \"Phantom vibration syndrome\"","https://en.wikipedia.org/wiki/Phantom_vibration_syndrome"]],"p":1},{"claim":"Toxoplasma jest u ok. 30% ludzi i zmienia osobowość oraz zwiększa ryzyko wypadków.","verdict":"przesada","note":"Zarażenie ok. 30% ludzi i efekt u myszy są potwierdzone; u ludzi są tylko korelacje, film podaje je jak pewnik.","src":[["Wikipedia (ang.): toksoplazmoza - hasło \"Toxoplasmosis\"","https://en.wikipedia.org/wiki/Toxoplasmosis"],["CDC: toksoplazmoza","https://www.cdc.gov/toxoplasmosis/about/index.html"]],"p":2},{"claim":"Paraliż senny: świadomość przy zablokowanych mięśniach REM, halucynacje postaci, ucisk w klatce.","verdict":"prawda","note":"Opis kliniczny się zgadza; doświadcza go ok. 8% ludzi przynajmniej raz, nie \"co noc\".","src":[["Wikipedia (ang.): paraliż senny - hasło \"Sleep paralysis\"","https://en.wikipedia.org/wiki/Sleep_paralysis"],["Sharpless i Barber 2011 (PubMed)","https://pubmed.ncbi.nlm.nih.gov/21571556/"]],"p":3},{"claim":"Kichanie od światła jest dziedziczne.","verdict":"prawda","note":"Dotyczy ok. 18-35% ludzi i jest dziedziczny; mechanizm nerwowy to wiodąca hipoteza.","src":[["Wikipedia (ang.): odruch kichania na światło - hasło \"Photic sneeze reflex\"","https://en.wikipedia.org/wiki/Photic_sneeze_reflex"]],"p":4},{"claim":"W jelitach jest ok. 500 mln neuronów, więcej niż w mózgu kota.","verdict":"półprawda","note":"Szacunki to 100-600 mln neuronów; cały mózg kota ma ich więcej, więc porównanie jest mylące.","src":[["Stanford: drugi mózg w jelitach","https://neuroscience.stanford.edu/news/your-gut-second-brain"],["Liczba neuronów w jelitowym układzie nerwowym (PubMed)","https://pubmed.ncbi.nlm.nih.gov/35929768/"]],"p":5},{"claim":"Jelita produkują 90% serotoniny, co steruje nastrojem.","verdict":"przesada","note":"Ok. 90% serotoniny powstaje w jelitach, ale nie trafia do mózgu; \"sterowanie nastrojem\" to uproszczenie.","src":[["Wikipedia (ang.): serotonina - hasło \"Serotonin\"","https://en.wikipedia.org/wiki/Serotonin"],["Caltech: bakterie a serotonina jelit","https://www.caltech.edu/about/news/microbes-help-produce-serotonin-gut-46495"]],"p":5},{"claim":"Autofagia w neuronach głodu wzmacnia uczucie głodu.","verdict":"prawda","note":"Autofagia w neuronach reguluje głód (badanie na myszach, 2011); \"mózg zjada sam siebie\" to dramatyzacja.","src":[["Kaushik i in. 2011 (PubMed)","https://pubmed.ncbi.nlm.nih.gov/21803288/"],["Wikipedia (ang.): autofagia - hasło \"Autophagy\"","https://en.wikipedia.org/wiki/Autophagy"]],"p":6},{"claim":"Zespół Capgrasa i jamais vu (wywoływane wielokrotnym pisaniem słowa).","verdict":"prawda","note":"Capgras to opisane urojenie, a jamais vu wywoływano przepisywaniem słowa (Moulin, Ig Nobel 2023).","src":[["Wikipedia (ang.): zespół Capgrasa - hasło \"Capgras delusion\"","https://en.wikipedia.org/wiki/Capgras_delusion"],["Wikipedia (ang.): jamais vu","https://en.wikipedia.org/wiki/Jamais_vu"]],"p":[7,8]},{"claim":"Nużeńce nie mają odbytu i uwalniają odchody po śmierci.","verdict":"fałsz","note":"Badanie genomu z 2022 r. wykazało, że nużeńce mają odbyt; reszta opisu się zgadza.","src":[["University of Reading: sekretne życie roztoczy","https://www.reading.ac.uk/news/2022/Research-News/Secret-lives-of-skin-mites-in-our-faces"],["Smith i in. 2022, Molecular Biology and Evolution","https://doi.org/10.1093/molbev/msac125"]],"p":9}],"bias":"Sensacyjny język (\"mózg zjada sam siebie\"); korelacje podane jak pewniki, a mit o nużeńcach jest już obalony.","channel":"Chill Dude Explains","section":"Chill Dude Explains"},{"id":"R05pjBE7eFo","title_pl":"Czy musisz poprawiać postawę? Raczej nie","title":"Do You NEED To Fix Your Posture? (Probably Not)","channel":"E3 Rehab","url":"https://www.youtube.com/watch?v=R05pjBE7eFo","date":"2025-03-23","duration":648,"views":27576,"section":"Sport","transcript":"whisper","added":"2026-11-03","tags":["Ciało i zdrowie","Mity","Nauka"],"about":"Fizjoterapeuta E3 Rehab wyjaśnia, dlaczego statyczna postawa słabo przewiduje ból i co ma większe znaczenie niż wyprostowane plecy.","intro":"E3 Rehab polemizuje z popularnym przekonaniem, że zła postawa powoduje ból. Omawia badania, zdjęcia przed i po, przemysł żerujący na kompleksach i to, czy ćwiczenia posturalne mają sens. Odpowiedź autora: poprawianie postawy raczej nie jest potrzebne.","points":[{"t":"Postawa a ból","d":"Według autora większość dobrych badań pokazuje, że postawa nie jest związana z bólem, sprawnością ani rokowaniem. Ludzie przy tym inaczej rozumieją \"dobrą\" postawę, np. przodopochylenie miednicy."},{"t":"Zdjęcie to nie ruch","d":"Postawa nie jest statyczna, a jedno zdjęcie nie mówi, jak ktoś się rusza i czuje. Zdjęcia \"po\" to często wyuczone wyprostowanie się, wciągnięcie brzucha i ściśnięcie pośladków."},{"t":"Przemysł na kompleksach","d":"Branże zdrowia i fitnessu tworzą problemy, których nie ma, by sprzedać rozwiązanie. Badanie z 2017 roku pokazało, że klinicyści znający diagnozę częściej widzą dyskinezę łopatki u osób z bólem barku."},{"t":"Zmienność zamiast jednej pozycji","d":"Ból po 12 godzinach siedzenia czy po weekendzie malowania sufitu to nie problem postawy, tylko brak przyzwyczajenia do długiej, powtarzalnej pozycji. Lepiej myśleć o zmienności i adaptacji."},{"t":"Badania długoterminowe","d":"Obserwacje przez 20 lat nie potwierdzają, że zła postawa \"dogoni\" człowieka. Fińskie dane pokazały, że dziewczęta siedzące zgarbione miały mniejsze ryzyko przewlekłego bólu szyi niż te siedzące prosto."},{"t":"Przygotowanie ważniejsze","d":"Autor ma płaskostopie i wyraźne przodopochylenie miednicy, a robi 20 tys. kroków i chodzi po górach z plecakiem. Liczą się ruch, sen, stres, odżywianie i kontakty z ludźmi."},{"t":"Ćwiczenia posturalne","d":"Robi wall slides, rotacje piersiowe czy mostki biodrowe, ale dla urozmaicenia, nie by poprawić postawę. Poprawa po nich może wynikać po prostu z większej ilości ruchu."},{"t":"Ukryte koszty","d":"Ciągłe pilnowanie postawy może prowadzić do nadmiernej czujności, katastrofizowania i lęku przed ruchem, co bywa gorsze niż sama postawa."}],"conclusion":"Poprawianie postawy raczej nie jest potrzebne; ważniejsze są ruch, zmienność pozycji i ogólne zdrowie.","factchecks":[{"claim":"Postawa nie jest związana z bólem.","verdict":"półprawda","note":"Metaanaliza z 2019 roku wykazała związek wysunięcia głowy z bólem szyi u dorosłych, choć nie u nastolatków.","p":0,"src":[["PubMed: metaanaliza 2019, wysunięta głowa a ból szyi - \"The Relationship Between Forward Head Posture and Neck Pain\"","https://pubmed.ncbi.nlm.nih.gov/31773477/"]]},{"claim":"Klinicyści bez zaślepienia częściej widzą dyskinezę łopatki u osób z bólem barku.","verdict":"prawda","note":"Badanie Plummera i wsp. (2017) w JOSPT tak pokazało.","p":2,"src":[["PubMed: Plummer i wsp. 2017 - \"Observational Scapular Dyskinesis: Known-Groups Validity\"","https://pubmed.ncbi.nlm.nih.gov/28683230/"]]},{"claim":"Badania przez ok. 20 lat nie wiążą postawy w młodości z późniejszym bólem.","verdict":"prawda","note":"Badanie Diecka i wsp. (1985) nie znalazło związku asymetrii postawy u nastolatków z późniejszym bólem pleców i szyi.","p":4,"src":[["PubMed: Dieck i wsp. 1985 - \"An epidemiologic study of the relationship between postural asymmetry in the teen years\"","https://pubmed.ncbi.nlm.nih.gov/2938272/"]]}],"bias":"Autor uczciwie mówi, że idzie pod prąd, ale przedstawia głównie badania potwierdzające jego tezę; część prac wiąże jednak niektóre cechy postawy z bólem."},{"id":"GUKoD2meZHk","title_pl":"14 rodzin zapachów według koła Michaela Edwardsa","title":"All 14 Fragrance Families Explained | Men's Cologne/Perfume Review 2025","channel":"School of Scent","url":"https://www.youtube.com/watch?v=GUKoD2meZHk","date":"2025-03-18","duration":1502,"views":25850,"section":"Moda","transcript":"youtube","added":"2026-11-04","tags":["Styl","Perfumy","Podstawy"],"about":"School of Scent przechodzi 14 rodzin z nowoczesnego koła zapachów Michaela Edwardsa i podaje przykłady do każdej.","intro":"Prowadzący School of Scent tłumaczy, że dziś branża często dzieli zapachy na cztery grupy (świeże, kwiatowe, amber, drzewne), a Michael Edwards rozwinął to w koło z 14 rodzinami. Idzie zgodnie z ruchem wskazówek zegara i do każdej rodziny podaje własny przykład z półki, od florals po fruity.","points":[{"t":"Koło Edwardsa vs klasyka","d":"Dawniej perfumiarze używali ok. 7 rodzin (floral, aromatic, fougère, chypre, woody, oriental...). Dziś cztery główne kategorie, a Edwards rozbija je na 14 rodzin na fragrance wheel."},{"t":"Floral i Soft Floral","d":"Floral: bukiety i pojedyncze kwiaty - np. Moschino Toy Boy (różana, musky). Soft Floral: aldehydy, puder, musk - autor stawia Prada L'Homme jako czysty, mydlany iris."},{"t":"Floral Amber i Soft Amber","d":"Floral Amber: kwiaty z przyprawami, żywicami i wanilią - Tom Ford Noir Extreme. Soft Amber: kadzidło, przyprawy, żywice - np. Cartier Declaration d'un Soir (wg newslettera autora)."},{"t":"Amber i Woody Amber","d":"Amber: żywice, kwiaty, wanilia - MFK Grand Soir. Woody Amber: amber z pudrem, oudem, sandałowcem - np. Merchant of Venice Venezia 21 Spices."},{"t":"Woods: Woods, Mossy, Dry","d":"Woods: cedr, paczula, sosna, sandał, wetywer - Le Labo Santal 33. Mossy Woods: mech dębowy z amber i cytrusami - Nishane Hacivat. Dry Woods: skóra i tytoń - Gucci Guilty Absolute."},{"t":"Aromatic Fougère","d":"Lawenda i geranium z cytrusami, ziołami i drewnem; klasyczna rodzina od Fougère Royale (po kumarynie z tonki). Autor chwali Tom Ford Fougère d'Argent i barberskie klasyki."},{"t":"Fresh: Citrus, Water, Green, Fruity","d":"Citrus: Terre d'Hermès Eau Givrée. Water/aquatic: Chanel Allure Homme Sport. Green: Creed Green Irish Tweed. Fruity: trudniej u mężczyzn - autor wciska Casamorati (praline/owoce)."}],"conclusion":"Koło pomaga zbierać zrównoważoną kolekcję, ale 14 rodzin nie obejmuje wszystkich stylów - stąd jeszcze bardziej szczegółowe diagramy.","factchecks":[{"claim":"Michael Edwards stworzył nowoczesne koło 14 rodzin zapachów.","verdict":"prawda","note":"Edwards jest autorem Fragrances of the World i popularnego fragrance wheel używanego w branży.","p":0,"src":[["Wikipedia (ang.): Michael Edwards (perfumy) - hasło \"Michael Edwards (fragrance expert)\"","https://en.wikipedia.org/wiki/Michael_Edwards_(fragrance_expert)"],["Fragrances of the World: oficjalna strona","https://www.fragrancesoftheworld.com/"]]},{"claim":"Termin \"oriental\" jest dziś często zastępowany przez \"amber\".","verdict":"prawda","note":"Branża odchodzi od \"oriental\" na rzecz \"amber\" ze względu na skojarzenia kolonialne.","p":0,"src":[["Wikipedia (ang.): koło zapachów - hasło \"Fragrance wheel\"","https://en.wikipedia.org/wiki/Fragrance_wheel"],["Wikipedia (ang.): perfumy - hasło \"Perfume\"","https://en.wikipedia.org/wiki/Perfume"]]},{"claim":"Pierwszy fougère to Fougère Royale po syntezie kumaryny.","verdict":"prawda","note":"Fougère Royale (Houbigant, 1882) uznaje się za początek rodziny po wprowadzeniu syntetycznej kumaryny.","p":5,"src":[["Wikipedia (ang.): rodzina fougère - hasło \"Fougère\"","https://en.wikipedia.org/wiki/Foug%C3%A8re"]]},{"claim":"Mech dębowy jest dziś silnie regulowany jako alergen.","verdict":"prawda","note":"IFRA ogranicza mech dębowy w perfumach ze względu na reakcje alergiczne; stosuje się zamienniki.","p":4,"src":[["Wikipedia (ang.): mech dębowy - hasło \"Oakmoss\"","https://en.wikipedia.org/wiki/Oakmoss"]]}],"bias":"Subiektywne przykłady i gusta autora; reklama własnej linii Atrium Curiosity Collection i newslettera."},{"
