id":"3ryh7PNhz3E","title_pl":"Najlepsze i najgorsze ćwiczenia na pośladki według nauki - ranking Jeffa Nipparda","title":"The Best & Worst Glute Exercises (According To Science)","channel":"Jeff Nippard","url":"https://www.youtube.com/watch?v=3ryh7PNhz3E","date":"2025-03-17","duration":839,"views":6701750,"section":"Sport","transcript":"youtube","added":"2026-11-03","tags":["Pośladki","Hipertrofia","Siłownia"],"about":"Jeff Nippard układa ranking ćwiczeń na pośladki od S do F i wskazuje najlepsze na górną, środkową i dolną część.","intro":"Jeff Nippard ocenia ćwiczenia na pośladki pod kątem wzrostu mięśni, od poziomu S do F. Ćwiczenie musi dawać duże napięcie, zwłaszcza w rozciągnięciu, nie powodować bólu i dawać się progresować. Wskazuje też najlepsze ćwiczenie na każdą część pośladków.","points":[{"t":"Trzy mięśnie, trzy strefy","d":"Pośladkowy wielki prostuje biodro i rotuje udo na zewnątrz. Średni ma około 1/3 jego wielkości, odwodzi nogę i stabilizuje przy ćwiczeniach na jednej nodze. Mały jest o połowę mniejszy od średniego. Wszystkie razem tworzą górną, środkową i dolną część pośladków."},{"t":"Hip thrust: wysokie B","d":"Dobrze przebadany i łatwy do progresji, ale sztanga uciska biodra, ustawienie zajmuje czas, a rozciągnięcie to około 90 stopni zgięcia biodra. Maszyna typu glute drive dostaje wysokie A i jest najlepsza na środek pośladków."},{"t":"Przysiady i bułgarskie","d":"Przysiad ze sztangą (A) mocno rozciąga pośladki, ale angażuje też czworogłowe. Pomaga niższe ułożenie sztangi, pochylenie i zejście poniżej równoległej. Bułgarski przysiad daje głębsze rozciągnięcie (wysokie A), ale mocno męczy, więc autor robi 2 serie na nogę."},{"t":"Najlepsze na górę pośladków","d":"Maszyna do odwodzenia bioder trafia do S. Pochylenie tułowia o około 30 stopni poprawia kierunek pracy włókien, autor robi 15-20 powtórzeń. Wyciąg jest trudniejszy do progresji (B), a chodzenie z gumą to tylko rozgrzewka (C)."},{"t":"Wykroki w marszu: S plus","d":"Duży krok daje mocne rozciągnięcie, a stabilizacja angażuje górne włókna. Autor wybiera je jako najlepsze ćwiczenie na pośladki. Wykroki na suwnicy Smitha dostają wysokie A, a z przednią stopą na podwyższeniu awansują do S."},{"t":"Dolna część: martwe ciągi","d":"Klasyczny martwy ciąg jest świetny dla siły, ale bardzo męczy, zwłaszcza prostowniki grzbietu (niskie B). Sumo raczej mocniej angażuje pośladkowy średni (wysokie B). Rumuński martwy ciąg (wysokie A) to najlepsze ćwiczenie na dolną część pośladków."},{"t":"Hity i kity","d":"Wyprost na ławce rzymskiej pod kątem 45 stopni z zaokrąglonym górnym odcinkiem pleców dostaje S. Donkey kicks i fire hydranty dają za małe napięcie (niskie D), tak jak swingi z kettlem dla przyrostu mięśni."}],"conclusion":"Łącz ćwiczenia w pozycji rozciągniętej i skróconej. Autor najwyżej ocenia wykroki w marszu, a na koniec przypomina o kaloriach i białku.","factchecks":[{"claim":"Badanie wykazało, że hip thrust rozbudowuje pośladki tak samo jak przysiad.","verdict":"prawda","note":"9-tygodniowe badanie z udziałem nietrenujących: podobny przyrost pośladków. Autor sam zaznacza, że to jedno badanie.","p":1,"src":[["PubMed: Plotkin i wsp. 2023 - \"Hip thrust and back squat training elicit similar gluteus muscle hypertrophy...\"","https://pubmed.ncbi.nlm.nih.gov/37877099/"]]},{"claim":"Głębokie przysiady lepiej rozbudowują pośladki.","verdict":"prawda","note":"Kubo i wsp. pokazali większy przyrost objętości pośladkowego wielkiego po przysiadach pełnych niż płytkich.","p":2,"src":[["PubMed: Kubo i wsp. 2019 - \"Effects of squat training with different depths on lower limb muscle volumes\"","https://pubmed.ncbi.nlm.nih.gov/31230110/"]]},{"claim":"EMG pośladkowego wielkiego nie różni się między martwym ciągiem sumo a klasycznym.","verdict":"prawda","note":"Escamilla i wsp. wykazali różnice głównie w mięśniach uda i łydki, ale nie w pośladkowym wielkim.","p":5,"src":[["PubMed: Escamilla i wsp. 2002 - \"An electromyographic analysis of sumo and conventional style deadlifts\"","https://pubmed.ncbi.nlm.nih.gov/11932579/"]]}],"bias":"Ranking częściowo subiektywny, autor przyznaje to sam. Na końcu reklama jego aplikacji MacroFactor z kodem rabatowym."},{"id":"1ztGpGjO60o","title_pl":"Co jest w studzience kanalizacyjnej (manhole)","title":"What’s Inside a Manhole?","channel":"Practical Engineering","url":"https://www.youtube.com/watch?v=1ztGpGjO60o","date":"2025-02-04","duration":789,"views":2313873,"section":"Ciekawostki","transcript":"youtube","added":"2026-11-04","tags":["Technika"],"about":"Przezroczysta makieta kanalizacji: po co manhole, fatbergi, wentylacja, drop manhole i czemu pokrywy są okrągłe.","intro":"Grady buduje przezroczystą makietę ścieków, by pokazać, że studzienki to nie tylko włazy z filmów. Tłumaczy laterale, branches, mains i interceptors, czemu zamiast kolanek są manhole, problemy z chusteczkami i FOG, hydrojetting, wentylację gazów, retencję przy ulewach, drop manhole na stromiznach oraz prefabrykowane kręgi.","points":[{"t":"Sieć jak rzeka","d":"Większość kanalizacji to proste rury pod spadem, nie ogromne tunele. Laterale od budynków, branches przy ulicach, mains/trunk i interceptors dalej w dół. Między odcinkami są studzienki; trasa to zwykle proste linie między włazami."},{"t":"Zamiast kolanek","d":"Zmiana średnicy, kierunku, spadku lub wysokości to miejsce na osady i turbulencję. Zamiast kształtek w rurze stawia się manhole: kontrolowane środowisko przepływu i dostęp dla ekipy do kamer, czyszczenia i napraw."},{"t":"Zatory: chusteczki i FOG","d":"Włókniny (nawet \"flushable\" wipes) i tłuszcze (FOG) tworzą zatory, czasem fatbergi. Część opłat za kanalizację idzie na ekipy udrażniające; im więcej zatorów, tym wyższe stawki."},{"t":"Kamery i hydrojetting","d":"Miasta proaktywnie filmują rury (asset management). Czyszczenie często to hydrojetting: obrotowe dysze pod ciśnieniem. Awaryjnie można przepompować między studzienkami (bypass) i wyłączyć odcinek."},{"t":"Wentylacja i gazy","d":"Obok cieczy płyną gazy; pęcherze ograniczają przepływ, a toksyczne, korodujące lub wybuchowe mieszanki wymagają świeżego powietrza z włazów. Zimą widać czasem parę z pokrywy, gdy ciepłe ścieki spotykają zimne powietrze."},{"t":"Deszcz i retencja","d":"W szczycie burzowym do sanitarnej wchodzi woda z nielegalnych podłączeń i przez pokrywy; bywają wymagane uszczelnione włazy i kominki odpowietrzające. Studzienka buforuje falę; przy przeciążeniu bywa wylew lub zrzut z systemów ogólnospławnych (autor wspomina Sekwanę przy igrzyskach 2024)."},{"t":"Drop manhole","d":"Wlot dużo wyżej niż wylot: na stromym terenie lepiej \"upuszczać\" wysokość w studzience niż pędzić ścieki z żwirem w rurze. Zwykle stosuje się rury lub konstrukcje łagodzące pluskanie (zapach, erozja)."},{"t":"Budowa i okrągłe pokrywy","d":"Prefabrykowane kręgi betonowe na tymczasowych podporach, dno z wyobleniami. Okrągła pokrywa nie wpadnie w otwór, da się toczyć i pasuje do okrągłej studni - według autora też najlepszy kształt na parcie gruntu i hydraulikę."}],"conclusion":"Studzienka standaryzuje łączenia, dostęp i wentylację - dzięki temu kanalizacja da się utrzymać bez odkopywania całej ulicy.","factchecks":[{"claim":"Fatbergi to zatory z tłuszczu i włóknin w kanalizacji.","verdict":"prawda","note":"Fatberg to udokumentowane zjawisko w sieciach miejskich (m.in. Londyn); FOG i chusteczki są głównymi składnikami.","p":2,"src":[["Wikipedia (ang.): fatberg - hasło \"Fatberg\"","https://en.wikipedia.org/wiki/Fatberg"]]},{"claim":"Systemy ogólnospławne zrzucają ścieki do rzek przy ulewach.","verdict":"prawda","note":"Combined sewer overflows to znany problem starszych miast; Paryż miał o tym głośno przy igrzyskach 2024.","p":5,"src":[["Wikipedia (ang.): kanalizacja ogólnospławna - hasło \"Combined sewer\"","https://en.wikipedia.org/wiki/Combined_sewer"]]},{"claim":"Okrągła pokrywa nie wpadnie w okrągły otwór.","verdict":"prawda","note":"To najpopularniejsze inżynierskie wyjaśnienie; dochodzą produkcja, toczenie i wytrzymałość.","p":7,"src":[["Wikipedia (ang.): właz / manhole - hasło \"Manhole\"","https://en.wikipedia.org/wiki/Manhole"]]}],"bias":"Przejrzysta makieta i dobra dydaktyka; wzmianka o igrzyskach i Nebula/WTC tylko w promo na końcu. Bez lokalnych norm liczbowych."},{"id":"2sWFexuc7MI","title_pl":"Miejsca na Ziemi, gdzie nie stanął żaden człowiek","title":"Places on Earth No Human Has Ever Visited","url":"https://www.youtube.com/watch?v=2sWFexuc7MI","date":"2024-12-26","duration":600,"views":1223643,"transcript":"whisper","added":"2026-11-03","tags":["Natura","Geografia"],"about":"Ranking 10 miejsc na Ziemi, których według autora nigdy nie odwiedził żaden człowiek lub które są prawie niezbadane.","intro":"Ranking 10 miejsc na Ziemi, do których według autora człowiek nigdy nie dotarł albo dotarł tylko na brzegi. Są wśród nich góry (Gangkhar Puensum, Góry Gwiezdne), jaskinie (Kryształów, cenoty Jukatanu), głębia oceanu, pustynie Namib i Takla Makan, lód północnej Grenlandii oraz wyspa, która okazała się nie istnieć. Przy każdym miejscu autor tłumaczy, co utrudnia dotarcie.","points":[{"t":"10. Gangkhar Puensum (Bhutan)","d":"Najwyższa niezdobyta góra świata, ok. 7560 m. Od 1994 r. Bhutan zakazuje wspinaczki, bo góry uważa się za siedziby duchów. Według autora wyprawy z lat 80. nie mogły nawet znaleźć góry przez złe mapy."},{"t":"9. Jaskinia Kryształów (Meksyk)","d":"Jaskinia pod Meksykiem z kryształami wielkości autobusów szkolnych, w środku ok. 58°C, prawie 100% wilgotności i siarkowodór. Naukowcy wchodzą na ok. 10 minut w kombinezonach chłodzących. Kryształy rosły setki tysięcy lat, a znaleziono w nich uśpione mikroby."},{"t":"8. Podwodne jaskinie Jukatanu","d":"Tysiące połączonych podwodnych jaskiń (cenotów) pod Meksykiem, w większości niezbadanych: są ciemne, ciasne, ciągną się kilometrami i leżą w odległej dżungli. Majowie uważali je za bramy do zaświatów; znaleziono w nich ceramikę, biżuterię i ludzkie kości. Żyją tam ryby bez oczu."},{"t":"7. Góry Gwiezdne (Papua-Nowa Gwinea)","d":"Według autora żaden człowiek nie postawił tam stopy. To ściany wapiennych klifów w gęstym lesie deszczowym, daleko od dróg, z ciągłym deszczem i pijawkami. Jest tam ogromny klif Hindenburg Wall, na który nikt się nie wspiął; nawet okoliczne plemiona nie zbadały części terenu."},{"t":"6. Rów Nowych Hebrydów","d":"Rów na południowym Pacyfiku między Vanuatu a Nową Kaledonią, ok. 7200 m głębokości, \"Everest by się w nim zmieścił\". Ciśnienie zgniotłoby człowieka jak puszkę, więc schodziły tam tylko roboty z kamerami i sfilmowały dziwne ryby. Warunki mają przypominać te na księżycach Jowisza."},{"t":"5. Tsingy de Bemaraha (Madagaskar)","d":"Park Tsingy de Bemaraha to las ostrych wapiennych iglic; nazwa ma znaczyć \"gdzie nie można chodzić boso\". Iglice przecinają buty, bywają wysokie jak 5-piętrowy budynek i stoją tak ciasno, że nie da się między nimi przejść. Zbadano tylko brzegi, na linach; żyją tam gatunki niespotykane gdzie indziej."},{"t":"4. Serce pustyni Namib","d":"Morze wydm Namib zajmuje obszar wielkości stanu Maryland, a część wydm jest wyższa od Empire State Building. Wydmy ciągle się przesuwają, więc mapy szybko się dezaktualizują. W dzień piasek może stopić buty, w nocy jest mróz, nie ma wody ani dróg, a wnętrze chroni UNESCO."},{"t":"3. Sandy Island","d":"Wyspa między Australią a Nową Kaledonią była na mapach przez setki lat, także w Google Maps; James Cook miał ją opisać w XVIII w. W 2012 r. australijscy naukowcy popłynęli w to miejsce i znaleźli otwarte morze. Możliwe wyjaśnienia: zatonęła, błąd kopiowany na mapach albo dryfujący pumeks."},{"t":"2. Północna Grenlandia","d":"Ludzie od tysięcy lat żyją na wybrzeżach, ale środek północnej Grenlandii jest nietknięty. Lądolód pokrywa ok. 80% wyspy i miejscami ma ponad 1,6 km grubości; do tego silny wiatr i miesiące ciemności. Pod lodem mogą być góry, doliny i jeziora z mikroorganizmami, a topnienie odsłania nowe wyspy."},{"t":"1. Pustynia Takla Makan (Chiny)","d":"\"Pustynia śmierci\", większa od Wielkiej Brytanii, bez wody i otoczona wysokimi górami; według autora w jej środku nie był żaden człowiek. Nazwa ma znaczyć \"miejsce, z którego się nie wraca\". Jedwabny Szlak szedł tylko brzegami, a pod piaskiem mogą być zaginione miasta."}],"conclusion":"Mimo satelitów i GPS wciąż są miejsca, do których człowiek nie dotarł, głównie przez zakazy, ekstremalne warunki albo zwykłe trudności w dojściu.","factchecks":[{"claim":"Gangkhar Puensum to najwyższa niezdobyta góra; wspinaczka zakazana, a wyprawy nie mogły jej znaleźć.","verdict":"prawda","note":"Szczyt ma 7570 m, a wspinaczka jest zakazana od 2003 r.; wyprawy z lat 80. się nie powiodły.","src":[["Wikipedia (ang.): Gangkhar Puensum","https://en.wikipedia.org/wiki/Gangkhar_Puensum"]],"p":0},{"claim":"Jaskinia Kryształów: 58°C, prawie 100% wilgotności, toksyczne powietrze, wizyty ok. 10 minut.","verdict":"półprawda","note":"Upał, wilgotność i mikroby się zgadzają; głównym zagrożeniem jest upał, nie toksyczne gazy.","src":[["Wikipedia (ang.): Jaskinia Kryształów (Naica) - hasło \"Cave of the Crystals\"","https://en.wikipedia.org/wiki/Cave_of_the_Crystals"],["National Geographic: mikroby z Naica","https://www.nationalgeographic.com/science/article/crystal-caves-mine-microbes-mexico-boston-aaas-aliens-science"]],"p":1},{"claim":"Cenoty Jukatanu: tysiące połączonych jaskiń, ślepe ryby, ofiary Majów.","verdict":"prawda","note":"Sac Actun ma ponad 370 km korytarzy, ale to popularne miejsce nurkowe, a nie \"nieodwiedzone\".","src":[["Wikipedia (ang.): system jaskiń Sac Actun - hasło \"Sistema Sac Actun\"","https://en.wikipedia.org/wiki/Sistema_Sac_Actun"],["Wikipedia (ang.): cenoty - hasło \"Cenote\"","https://en.wikipedia.org/wiki/Cenote"]],"p":2},{"claim":"W Góry Gwiezdne nigdy nie wszedł żaden człowiek.","verdict":"fałsz","note":"Mieszkają tam ludy Min, działa kopalnia Ok Tedi i miasto Tabubil.","src":[["Wikipedia (ang.): Góry Gwiezdne - hasło \"Star Mountains\"","https://en.wikipedia.org/wiki/Star_Mountains"],["Wikipedia (ang.): kopalnia Ok Tedi - hasło \"Ok Tedi Mine\"","https://en.wikipedia.org/wiki/Ok_Tedi_Mine"]],"p":3},{"claim":"Rów Nowych Hebrydów: Everest by się w nim zmieścił; nikt tam nie był, były tylko roboty.","verdict":"fałsz","note":"Rów ma ok. 7,8 km, a Everest 8,85 km, więc szczyt by wystawał; na dno zszedł Victor Vescovo w 2021 r.","src":[["Wikipedia (ang.): Rów Nowych Hebrydów - hasło \"New Hebrides Trench\"","https://en.wikipedia.org/wiki/New_Hebrides_Trench"],["Guinness: najwięcej odwiedzonych rowów","https://www.guinnessworldrecords.com/world-records/752796-most-deep-sea-trenches-visited-by-an-individual"]],"p":4},{"claim":"Tsingy: nazwa znaczy \"gdzie nie można chodzić boso\"; wnętrze nietknięte.","verdict":"półprawda","note":"Tłumaczenie nazwy się zgadza, ale park ma szlaki dla turystów i jest badany.","src":[["Wikipedia (ang.): Tsingy de Bemaraha","https://en.wikipedia.org/wiki/Tsingy_de_Bemaraha_Strict_Nature_Reserve"],["UNESCO: suche lasy Andrefana (dawniej Tsingy de Bemaraha)","https://whc.unesco.org/en/list/494/"]],"p":5},{"claim":"Namib: wydmy wyższe od Empire State Building, obszar wielkości Maryland, wnętrza nigdy nie odwiedzono.","verdict":"przesada","note":"Wielkość i wydmy (do ok. 380 m) się zgadzają, ale okolice Sossusvlei to masowa turystyka.","src":[["UNESCO: Morze Piasku Namib","https://whc.unesco.org/en/list/1430/"],["Wikipedia (ang.): pustynia Namib - hasło \"Namib\"","https://en.wikipedia.org/wiki/Namib"]],"p":6},{"claim":"Sandy Island: \"odkrytą\" przez Jamesa Cooka wyspę obalili Australijczycy w 2012.","verdict":"półprawda","note":"W 2012 r. potwierdzono, że wyspy nie ma, ale pierwszy zapis jest z 1876 r., nie od Cooka.","src":[["Wikipedia (ang.): Sandy Island (Nowa Kaledonia) - hasło \"Sandy Island (New Caledonia)\"","https://en.wikipedia.org/wiki/Sandy_Island,_New_Caledonia"]],"p":7},{"claim":"Lądolód pokrywa ok. 80% Grenlandii, a wnętrze północnej Grenlandii jest nietknięte przez człowieka.","verdict":"półprawda","note":"Lądolód pokrywa ok. 80% wyspy, ale w głębi działały stacje wiertnicze i wiele razy go przekraczano.","src":[["Wikipedia (ang.): lądolód grenlandzki - hasło \"Greenland ice sheet\"","https://en.wikipedia.org/wiki/Greenland_ice_sheet"],["Wikipedia (ang.): odwiert lodowy NorthGRIP - hasło \"NorthGRIP\"","https://en.wikipedia.org/wiki/North_Greenland_Ice_Core_Project"]],"p":8},{"claim":"Takla Makan: większa od Wielkiej Brytanii, w środku nie było człowieka, nazwa znaczy \"miejsce bez powrotu\".","verdict":"fałsz","note":"Jest większa od Wielkiej Brytanii, ale biegnie przez nią autostrada, a pogrzebane miasta odkopano 100 lat temu.","src":[["Wikipedia (ang.): pustynia Takla Makan - hasło \"Taklamakan Desert\"","https://en.wikipedia.org/wiki/Taklamakan_Desert"],["Wikipedia (ang.): autostrada przez pustynię Tarym - hasło \"Tarim Desert Highway\"","https://en.wikipedia.org/wiki/Tarim_Desert_Highway"]],"p":9}],"bias":"Tytuł wprowadza w błąd: większość miejsc była odwiedzana; uczciwiej byłoby \"miejsca słabo zbadane\". Transkrypt z Whisper.","channel":"Chill Dude Explains","section":"Chill Dude Explains"},{"id":"PZLKB8k2BQQ","title_pl":"Perfumy męskie od zera - kompletny poradnik dla początkujących","title":"The Complete Idiot's Guide To Men's Fragrances","channel":"Gents Scents","url":"https://www.youtube.com/watch?v=PZLKB8k2BQQ","date":"2024-12-02","duration":1131,"views":77543,"section":"Moda","transcript":"youtube","added":"2026-11-03","tags":["Styl","Perfumy","Podstawy"],"about":"Ash z Gents Scents w jednym filmie zbiera podstawy perfum: stężenia, gdzie kupować, jak aplikować, rodzaje zapachów i jak budować kolekcję.","intro":"Ash prowadzi kanał Gents Scents i chce w jednym miejscu podać wszystko, co początkujący powinien wiedzieć o perfumach. Omawia stężenia, sklepy, aplikację, popularne określenia zapachów, nuty i komplementy. Na końcu radzi, jak mądrze budować kolekcję.","points":[{"t":"Stężenia to nie wszystko","d":"EDT, EDP, parfum i extrait różnią się ilością olejku w alkoholu, ale granice nie są ustalone prawem. Wyższe stężenie zwykle trwa dłużej i pachnie pełniej, ale nie zawsze lepiej się roznosi."},{"t":"Gdzie kupować","d":"Sklepy z rabatami są dużo tańsze niż pełna cena, a ich towar pochodzi zwykle z tych samych hurtowni. Wybieraj sprawdzone i znane od lat; w Europie autor wymienia Notino jako największy."},{"t":"Gdzie psikać","d":"Zgięcie łokcia, obojczyk, kark, za uchem. Punkty pulsu pomagają tylko trochę; ruch ciała rozprowadza zapach. Na ubraniu i włosach trzyma się dłużej, ale niektóre perfumy plamią."},{"t":"Nie pocieraj nadgarstków","d":"Pocieranie nie niszczy cząsteczek, ale według autora to zła praktyka i większość fanów perfum tego nie robi."},{"t":"Określenia zapachów","d":"\"Blue\" to uniwersalne, świeże zapachy na cały rok, na randkę pasują ciepłe i słodkie, do biura czystsze i spokojniejsze. Standardowe rodziny to świeże, kwiatowe, ambrowe i drzewne."},{"t":"Trwałość, smuga, projekcja","d":"Trwałość to czas na skórze, smuga (sillage) to ślad, który zostawiasz, a projekcja to zasięg zapachu, gdy stoisz. Nuty głowy znikają pierwsze, nuty bazy zostają najdłużej."},{"t":"Komplementy","d":"Najczęściej mówią je znajomi, nie obcy. Żeby je słyszeć, trzeba wychodzić do ludzi, być przystępnym i zadbanym."},{"t":"Budowa kolekcji","d":"Wąchaj testery i kupuj próbki, zanim kupisz w ciemno. Zacznij od uniwersalnych zapachów, które naprawdę będziesz nosić, potem dobieraj sezonowe, a niszowe zostaw na później."}],"conclusion":"Nie goń za arcydziełami, których nie założysz; zacznij od uniwersalnych zapachów i rozwijaj gust stopniowo.","factchecks":[{"claim":"Nazwy stężeń perfum nie są sztywno określone.","verdict":"prawda","note":"Wikipedia: zakresy dla EdT, EdP i extrait się nakładają, a EdT jednej marki może być mocniejsze niż EdP innej.","p":0,"src":[["Wikipedia (ang.): perfumy - hasło \"Perfume\"","https://en.wikipedia.org/wiki/Perfume"]]},{"claim":"Dziś przyjęte są cztery rodziny: świeże, kwiatowe, ambrowe i drzewne, a fougère wyszło z użycia.","verdict":"półprawda","note":"Koło Michaela Edwardsa opiera się na tych grupach, ale Wikipedia wciąż wymienia też fougère jako piątą rodzinę.","p":4,"src":[["Wikipedia (ang.): perfumy - hasło \"Perfume\"","https://en.wikipedia.org/wiki/Perfume"],["Wikipedia (ang.): koło zapachowe - hasło \"Fragrance wheel\"","https://en.wikipedia.org/wiki/Fragrance_wheel"]]},{"claim":"Nuty głowy ulatują pierwsze, a nuty bazy trzymają się najdłużej.","verdict":"prawda","note":"Nuty głowy to małe, lotne cząsteczki; nuty bazy to cięższe składniki, które wyczuwa się najdłużej.","p":5,"src":[["Wikipedia (ang.): perfumy - hasło \"Perfume\"","https://en.wikipedia.org/wiki/Perfume"]]}],"bias":"Rzetelny przegląd podstaw, ale z perspektywy rynku USA. Autor promuje kody rabatowe do sklepów, więc część porad o zakupach ma też cel reklamowy."},{"id":"k50Y_rvA0pw","title_pl":"Jak wybierano urzędników w republice rzymskiej","title":"Getting Elected in Ancient Rome","channel":"toldinstone","url":"https://www.youtube.com/watch?v=k50Y_rvA0pw","date":"2024-11-08","duration":662,"views":58916,"section":"Historia","transcript":"youtube","added":"2026-11-04","tags":["Historia"],"about":"Kolorowe wybory w republice rzymskiej: centurie, plemiona, kampania, korupcja i koniec głosowania ludowego.","intro":"Autor opisuje republikę rzymską jako oligarchię z elementami demokracji: dwaj konsulowie, Senat i zgromadzenia ludowe. Pokazuje cursus honorum, głosowanie w centuriach i plemionach, kampanię w Forum, łapówki, graffiti z Pompei oraz jak Cezar i Tyberiusz praktycznie zakończyli wybory ludowe.","points":[{"t":"Oligarchia z głosowaniem","d":"Według autora republika była władzą bogatych rodów, ale magnaci co roku ubiegali się o głosy ludu. Polibiusz widział w ustroju mieszankę monarchii (konsulowie), arystokracji (Senat) i demokracji (zgromadzenia)."},{"t":"Cursus honorum","d":"Urzędy sprawowano z kolegami i na rok: konsulowie, pretorzy, kwestorzy i edylowie. To schody kariery aż do konsulatu. Równolegle trybuni plebejscy mieli szeroką władzę, często przeciw pozostałym magistraturom."},{"t":"Comitia centuriata","d":"Konsulów i pretorów wybierało 193 centurie ułożone według majątku, od najbogatszych. Każda centuria miała jeden głos. Bogaci mieli dziesiątki centurii, bezrolni biedacy tylko jedną, więc wybory ważyły na korzyść zamożnych."},{"t":"Comitia tributa","d":"Kwestorów i edylów wybierało zgromadzenie plemienne (35 plemion: 4 miejskie, reszta wiejskie). Teoretycznie prowincja miała duży wpływ, ale na głosowanie do Rzymu częściej przyjeżdżali bogaci z dystryktów wiejskich."},{"t":"Bez partii, z etykietami","d":"Wybierano ludzi, nie programy. Optymaci i popularyści to według autora luźne etykiety (tradycja vs reforma), nie partie ani jasne stanowiska."},{"t":"Kampania i toga candida","d":"Datę ogłaszano zwykle trzy \"tygodnie rynkowe\" (ok. 24 dni) wcześniej. Kandydat w białej todze candida krążył po Forum z klientami, ściskał dłonie i unikał spornych tematów. List przypisywany Kwintusowi Cyceronowi radzi uśmiechać się i mówić to, co ludzie chcą usłyszeć."},{"t":"Utrata wyborów przez żarty i skąpstwo","d":"Publiusz Scypion Nazica, ściskając zrogowaciałą dłoń farmera, zażartował, że ten \"chodzi na rękach\"; uznano to za obrazę i przegrał. Inny senator stracił preturę po bankiecie na kozich skórach i w glinianych naczyniach."},{"t":"Łapówki i graffiti","d":"Kupowanie głosów było powszechne; według autora senator oskarżony o przekupstwo w wyborach konsularnych wykupił oskarżycieli, a potem jako konsul zaostrzył prawo antykorupcyjne. W Pompejach malowano czarno-czerwone hasła typu \"uczciwy młodzieniec\" czy \"obudź się i głosuj\"."},{"t":"Tajne głosowanie i mosty","d":"Do II w. p.n.e. głosowano ustnie. Potem wprowadzono tajną tabliczkę woskową wrzucaną do kosza z wąskiego mostu wyborczego. Kandydaci najmowali bandy, by straszyć wyborców, blokować ogrodzenie albo niszczyć mosty i urny."},{"t":"Koniec wyborów ludowych","d":"Katon Młodszy zauważył tabliczki tym samym charakterem pisma. Jako dyktator Cezar mianował zwolenników. August formalnie kampaniował za przyjaciółmi, ale kariery zależały od jego woli. Tyberiusz przeniósł wybory do Senatu, kończąc ok. pół tysiąclecia głosowania ludowego."}],"conclusion":"Republikańska \"demokracja\" była widowiskiem ważeń na rzecz bogatych, a pod koniec zamieniła się w fasadę władzy jednostek.","factchecks":[{"claim":"Comitia centuriata miała 193 centurie i ważyła głosy bogatych.","verdict":"prawda","note":"193 centurie i głosowanie od najzamożniejszych klas to standardowy opis ustroju republiki.","p":2,"src":[["Wikipedia (ang.): comitia centuriata - hasło \"Centuriate Assembly\"","https://en.wikipedia.org/wiki/Centuriate_Assembly"],["Wikipedia (ang.): zgromadzenia rzymskie - hasło \"Roman assemblies\"","https://en.wikipedia.org/wiki/Roman_assemblies"]]},{"claim":"Cursus honorum: kwestor, edyl, pretor, konsul, z kolegami i na rok.","verdict":"prawda","note":"Klasyczna ścieżka magistratur i zasada kolegialności oraz kadencji rocznej są dobrze poświadczone.","p":1,"src":[["Wikipedia (ang.): cursus honorum - hasło \"Cursus honorum\"","https://en.wikipedia.org/wiki/Cursus_honorum"]]},{"claim":"Słowo \"kandydat\" pochodzi od białej togi candida.","verdict":"prawda","note":"Łacińskie candidatus wiąże się z candida, błyszcząco białą togą ubiegających się o urząd.","p":5,"src":[["Wikipedia (ang.): etymologia kandydata - hasło \"Candidate\"","https://en.wikipedia.org/wiki/Candidate"]]},{"claim":"Tyberiusz przeniósł wybory urzędników z ludu do Senatu.","verdict":"prawda","note":"Za Tyberiusza wybory konsulów i innych magistratur przeszły praktycznie do Senatu.","p":9,"src":[["Wikipedia (ang.): Tyberiusz (rządy) - hasło \"Tiberius\"","https://en.wikipedia.org/wiki/Tiberius"]]},{"claim":"List Kwintusa Cycerona to autentyczny poradnik kampanii.","verdict":"półprawda","note":"Commentariolum petitionis istnieje, ale autorstwo Kwintusa jest sporne wśród badaczy.","p":5,"src":[["Wikipedia (ang.): Commentariolum petitionis - hasło \"Commentariolum petitionis\"","https://en.wikipedia.org/wiki/Commentariolum_petitionis"]]}],"bias":"Rzetelny przegląd mechaniki wyborów; anegdoty o Scypionie i bankiecie podane bez źródeł. Sponsorowany komiks Romanus w środku filmu."},{"id":"tmbZVmXyOXM","title_pl":"Jak działają chłodnie kominowe","title":"Why Are Cooling Towers Shaped Like That?","channel":"Practical Engineering","url":"https://www.youtube.com/watch?v=tmbZVmXyOXM","date":"2024-11-05","duration":1188,"views":9489698,"section":"Ciekawostki","transcript":"youtube","added":"2026-11-03","tags":["Nauka","Technika"],"about":"Practical Engineering buduje model chłodni kominowej i tłumaczy, czemu z komina leci para, a nie dym, i skąd ten kształt.","intro":"Z wielkich, wygiętych kominów elektrowni nie leci dym, tylko para wodna. Grady Hillhouse z Practical Engineering buduje model chłodni z akrylu i tłumaczy chłodzenie przez parowanie, wykres psychrometryczny, ciąg naturalny, zalety hiperboloidy i to, czemu takie wieże słabo sprawdzają się w gorącym klimacie.","points":[{"t":"Para, nie dym","d":"Komin wyprowadza spaliny wysoko, a chłodnia kominowa robi coś zupełnie innego. Kojarzy się z elektrowniami jądrowymi, które niczego nie spalają; pióropusz to głównie skroplona para wodna."},{"t":"Po co chłodzić","d":"Elektrownie cieplne napędzają generatory turbinami parowymi. Para skrapla się w skraplaczu chłodzonym wodą, a ta krąży między skraplaczem a wieżą, gdzie oddaje ciepło powietrzu."},{"t":"Przeciwprąd i parowanie","d":"Gorąca woda jest rozpylana nad wypełnieniem o dużej powierzchni i spływa w dół, a powietrze płynie w górę. Parowanie zabiera ciepło utajone, więc wodę można schłodzić poniżej temperatury powietrza, o ile nie jest ono nasycone."},{"t":"Wilgotne powietrze jest lżejsze","d":"Ciepłe powietrze mieści więcej pary i ma mniejszą gęstość. Co mniej oczywiste, przy tej samej temperaturze wilgotniejsze powietrze też jest lżejsze, bo cząsteczka wody waży mniej niż azotu czy tlenu."},{"t":"Ciąg naturalny","d":"Ogrzane i nawilżone powietrze unosi się w wieży i zasysa świeże przez wloty u dołu. Autora zaskoczyło, jak silny ciąg dało samo rozpylanie gorącej wody w modelu."},{"t":"Hiperboloida","d":"Wygięty kształt to hiperboloida, którą da się zbudować z prostych prętów, co ułatwia budowę. Podwójna krzywizna usztywnia cienką powłokę na ciężar i wiatr, jak chips Pringles, i według autora może o połowę zmniejszyć naprężenia względem walca."},{"t":"Wentylatory zamiast wysokości","d":"Wielkie wieże z ciągiem naturalnym są rzadkie. Szpitale, biurowce, rafinerie i wiele elektrowni używają mniejszych, tańszych chłodni z wentylatorami; wielkie wybiera się dla niezawodności, np. w elektrowniach jądrowych."},{"t":"Wilgotność pomaga ciągowi","d":"Na wykresie psychrometrycznym przy wilgotności 20% powietrze na początku drogi nie zyskuje wyporu i ciąg może zgasnąć. Przy 50% gęstość spada na całej drodze, więc dla danej temperatury termometru mokrego ciąg rośnie z wilgotnością."},{"t":"Teksas chłodzi jeziorami","d":"W gorącym klimacie ciąg naturalny działa słabo. Obie elektrownie jądrowe w Teksasie chłodzą się zbiornikami wodnymi, bo tama i jezioro wyszły taniej niż odpowiednia wieża."},{"t":"Czasem jednak dym","d":"Niektóre nowsze chłodnie wpuszczają do wieży oczyszczone spaliny, więc w pióropuszu może być trochę spalin, ale głównie to woda."}],"conclusion":"Chłodnia kominowa to sprytne połączenie parowania, wyporu i wytrzymałej geometrii, bez ani jednego wentylatora.","factchecks":[{"claim":"Hiperboloidę da się zbudować z prostych elementów.","verdict":"prawda","note":"Hiperboloida jednopowłokowa jest powierzchnią prostokreślną; wykorzystał to m.in. Szuchow.","p":5,"src":[["Wikipedia (ang.): hiperboloida - hasło \"Hyperboloid\"","https://en.wikipedia.org/wiki/Hyperboloid"],["Wikipedia (ang.): konstrukcja hiperboloidalna - hasło \"Hyperboloid structure\"","https://en.wikipedia.org/wiki/Hyperboloid_structure"]]},{"claim":"Wilgotne powietrze jest lżejsze od suchego w tej samej temperaturze.","verdict":"prawda","note":"Masa molowa wody (ok. 18 g/mol) jest mniejsza niż suchego powietrza (ok. 29 g/mol).","p":3,"src":[["Wikipedia (ang.): gęstość powietrza - hasło \"Density of air\"","https://en.wikipedia.org/wiki/Density_of_air"]]},{"claim":"Obie elektrownie jądrowe w Teksasie chłodzą się zbiornikami wodnymi.","verdict":"prawda","note":"Comanche Peak korzysta ze Squaw Creek Reservoir, a South Texas Project ze sztucznego zbiornika chłodzącego.","p":8,"src":[["Wikipedia (ang.): elektrownia Comanche Peak - hasło \"Comanche Peak Nuclear Power Plant\"","https://en.wikipedia.org/wiki/Comanche_Peak_Nuclear_Power_Plant"],["Wikipedia (ang.): South Texas Project - hasło \"South Texas Nuclear Generating Station\"","https://en.wikipedia.org/wiki/South_Texas_Nuclear_Generating_Station"]]},{"claim":"Niektóre chłodnie wyprowadzają także oczyszczone spaliny.","verdict":"prawda","note":"Takie rozwiązanie stosuje się m.in. w niemieckich elektrowniach węglowych z odsiarczaniem.","p":9,"src":[["Wikipedia (ang.): chłodnia kominowa - hasło \"Cooling tower\"","https://en.wikipedia.org/wiki/Cooling_tower"]]}],"bias":"Rzetelny, z modelem i wykresem; transkrypt miejscami nieczytelny. Na końcu reklama serwisu Nebula."},{"id":"aP8KsI2Ugc8","title_pl":"Prof. Piotr Rutkowski o profilaktyce raka, czerniaku i opalaniu","title":"Uwarunkowania genetyczne odpowiadają za 5 proc. zachorowań na nowotwory- prof. Piotr Rutkowski","channel":"didaskalia","url":"https://www.youtube.com/watch?v=aP8KsI2Ugc8","date":"2024-06-09","duration":4187,"views":119360,"section":"Didaskalia","transcript":"youtube","added":"2026-11-03","tags":["Zdrowie","Medycyna","Nauka"],"about":"Chirurg onkolog o tym, że większość nowotworów można wyleczyć, jak ich unikać, jak rozpoznać czerniaka i jak bezpiecznie korzystać ze słońca.","intro":"Patrycjusz Wyżga rozmawia z prof. Piotrem Rutkowskim, chirurgiem onkologiem z Narodowego Instytutu Onkologii i prezesem Polskiego Towarzystwa Onkologicznego (2024). Mowa o czynnikach ryzyka, badaniach przesiewowych, szczepieniu przeciw HPV, czerniaku, kremach z filtrem, solariach oraz nowych lekach i szczepionkach.","points":[{"t":"Rak to nie wyrok","d":"Większość nowotworów da się dziś wyleczyć. W Polsce szansa na wyleczenie przekracza 50%, w Norwegii zbliża się do 70%. Wcześnie wykryty nowotwór skóry to według gościa najprostsza choroba do wyleczenia."},{"t":"Geny to mały udział","d":"Nowotwory uwarunkowane dziedzicznie to ok. 5% przypadków. Większość wynika z czynników zewnętrznych, na które mamy wpływ."},{"t":"Tytoń i e-papierosy","d":"Gość wiąże z tytoniem 30 do 40% nowotworów, m.in. płuc, krtani, jamy ustnej, nerki i żołądka. Niepokoi go, że ok. 70% młodzieży ma kontakt z e-papierosami. Pomaga też ruch i rozsądna dieta."},{"t":"Szczepienie przeciw HPV","d":"Szczepionka przeciw wirusowi brodawczaka może zapobiec tysiącom nowotworów, m.in. raka szyjki macicy. Jest dobrze przebadana. W Finlandii zaszczepionych jest ok. 90% dzieci, w Polsce znacznie mniej."},{"t":"Badania, z których nie korzystamy","d":"Mamografia, cytologia (zastępowana testem HPV DNA) i kolonoskopia są dostępne, ale zgłasza się mało osób. Przegląd samochodu robimy obowiązkowo, a o własne zdrowie nie dbamy."},{"t":"Abecadło czerniaka","d":"A: asymetria, B: nierówne brzegi, C: różne kolory, D: średnica ponad ok. 5 mm, E: ewolucja, czyli zmiana. Najważniejsze jest E. Wystarczy co kilka miesięcy przez 5 minut obejrzeć swoją skórę."},{"t":"Dermatoskop","d":"Kontrola u dermatologa jest szybka i bezbolesna. Lekarz ogląda znamiona przez dermatoskop, czyli lupę ze spolaryzowanym światłem."},{"t":"Jak się przygotować do słońca","d":"Na słońcu można przebywać długo, jeśli się przygotujemy: kapelusz lub czapka z daszkiem ok. 7,5 cm, ubranie, cień i krem z filtrem co najmniej 30, nałożony ok. 15 minut przed wyjściem."},{"t":"Solarium jako fabryka czerniaka","d":"W Polsce osoby poniżej 18 lat nie mogą korzystać z solariów. Australia zakazała ich zupełnie, bo szacowano, że odpowiadały za połowę czerniaków u osób poniżej 40 lat."},{"t":"Opalenizna a witamina D","d":"Intensywne opalanie nie gwarantuje witaminy D: w badaniu surferów z Hawajów część miała jej niedobór. Opalenizna to obrona skóry przed uszkodzeniem."},{"t":"Rewolucja w leczeniu","d":"Immunoterapia i leczenie celowane (np. przy mutacji BRAF) sprawiły, że wśród chorych z przerzutami czerniaka 5 lat przeżywa ponad 50%, a kiedyś ok. 2%. Polscy pacjenci uczestniczą w badaniach szczepionek mRNA."}],"conclusion":"Rzeczowa, praktyczna rozmowa o profilaktyce. Najwięcej konkretów o skórze i słońcu.","factchecks":[{"claim":"Nowotwory uwarunkowane dziedzicznie to ok. 5% przypadków.","verdict":"prawda","note":"Szacunki mówią o ok. 5 do 10% nowotworów wynikających z dziedzicznych wad genetycznych.","p":1,"src":[["Wikipedia (ang.): Nowotwór - hasło \"Cancer\"","https://en.wikipedia.org/wiki/Cancer"]]},{"claim":"Z tytoniem związanych jest 30 do 40% wszystkich nowotworów.","verdict":"przesada","note":"Częściej podawane jest ok. 25 do 30% zgonów z powodu nowotworów. Górna granica gościa jest zawyżona.","p":2,"src":[["Wikipedia (ang.): Nowotwór - hasło \"Cancer\"","https://en.wikipedia.org/wiki/Cancer"]]},{"claim":"Australia całkowicie zakazała komercyjnych solariów.","verdict":"prawda","note":"Zakaz komercyjnych solariów obowiązuje w Australii od 2015 r.","p":8,"src":[["Wikipedia (ang.): Solarium - hasło \"Indoor tanning\"","https://en.wikipedia.org/wiki/Indoor_tanning"]]}],"bias":"Gość mówi z perspektywy lekarza i prezesa towarzystwa onkologicznego, więc mocno akcentuje sukcesy polskiej onkologii. Rady są zgodne z typowymi zaleceniami."},{"id":"GBX3rgsmQbw","title_pl":"Odtwarzam ostatni posiłek Ötziego, człowieka lodu","title":"Recreating the Last Meal of Ötzi the Iceman","channel":"Tasting History with Max Miller","url":"https://www.youtube.com/watch?v=GBX3rgsmQbw","date":"2024-06-04","duration":1321,"views":4185855,"section":"Historia","transcript":"youtube","added":"2026-11-03","tags":["Historia","Nauka"],"about":"Max Miller gotuje ostatni posiłek Ötziego (dziczyzna, koza, samopsza) i opowiada, co nauka wie o jego życiu i śmierci.","intro":"Max Miller z Tasting History odtwarza ostatni posiłek Ötziego, mężczyzny zabitego strzałą w Alpach ponad 5000 lat temu. Wędzi kozinę, piecze jelenia i placek z samopszy, a przy okazji opowiada o odkryciu mumii, jej ubraniu, narzędziach, chorobach i o tym, jak z treści jelit odtworzono ostatnie godziny jego życia.","points":[{"t":"Między rolnikami a łowcami","d":"Ötzi żył przed piramidami i Stonehenge, gdy rolnictwo dotarło już przez Turcję i Bałkany do całej Europy, ale gdzieniegdzie przetrwali łowcy-zbieracze. Jego ostatni posiłek łączył oba światy: dziczyznę i uprawne zboże."},{"t":"Co było w żołądku","d":"Kilka godzin przed śmiercią zjadł jelenia szlachetnego, koziorożca i samopszę, czyli według autora pierwsze uprawiane zboże. Były tam też pyłki, grzyby, mech i odrobina orlicy, paproci leczniczej, ale i trującej; autor użył jadalnych pędów paproci."},{"t":"Gotowanie po neolitycznemu","d":"Kozinę (zamiast koziorożca) wędził na plasterkach przy żarze w ok. 70-77°C przez 6-10 godzin, jelenia piekł na rożnie 5-6 minut. Grubo zmieloną samopszę zmieszał z tłuszczem, wodą i paprocią i upiekł placek na glinianej płycie po ok. 3 minuty z każdej strony."},{"t":"Tłuszcz jako paliwo","d":"Z ok. 300 g zawartości żołądka Ötziego połowę stanowił tłuszcz koziorożca. Ziarna nie były zmielone na mąkę, bo w żołądku znaleziono spore kawałki."},{"t":"Odkrycie w 1991 r.","d":"19 września 1991 r. dwoje niemieckich turystów znalazło ciało na granicy Austrii i Włoch; najpierw myślano o zaginionym turyście lub żołnierzu z I wojny światowej. Okazało się, że mężczyzna żył ok. 3359-3105 r. p.n.e., a lód naturalnie zmumifikował jego i jego rzeczy."},{"t":"Strój i ekwipunek","d":"Miał buty z podeszwą ze skóry niedźwiedzia i jelenia ocieplone trawą, nogawice z łatami futra w naprzemienne kolory, płaszcz z owczej i koziej skóry, pelerynę z trawy i czapkę z niedźwiedziej skóry. Nosił też nóż, zestaw do rozpalania ognia, kołczan 14 strzał i łuk z cisu."},{"t":"Miedziany topór","d":"Wszystkie narzędzia były kamienne, poza toporem z miedzi o czystości 99,7%. Ostrze miało mniej niż 10 cm, ale według autora było bardzo cenne."},{"t":"Zdrowie 45-latka","d":"W wieku 45-46 lat miał chorobę serca, starte zęby, chore dziąsła, zrośnięte żebra, kamień żółciowy, odmrożenia, włosogłówkę i bóle stawów. Jego 61 tatuaży mogło służyć leczeniu bólu, a w sakiewce nosił grzyby i mchy, pewnie jako lekarstwa."},{"t":"Morderstwo odkryte po 10 latach","d":"Miał ranę głowy i głęboko rozciętą dłoń, która zaczęła się goić. Dopiero w 2001 r. odkryto grot strzały w barku, wystrzelonej kilka minut przed śmiercią; motywy zabójstwa pozostają nieznane."},{"t":"Ostatnie godziny z pyłków","d":"Pyłki w jelitach pokazują, że 33 godziny przed śmiercią był w lesie na ok. 2500 m, 24 godziny przed nią niżej, na ok. 1200 m, gdzie zranił dłoń i być może opatrzył ją torfowcem. Potem szybko wspiął się na prawie 3000 m i zjadł ostatni posiłek."},{"t":"Śmierć na przełęczy","d":"1-3 godziny po jedzeniu strzała z grotem ludzi z południa przecięła mu tętnicę podobojczykową. Ktoś wyjął drzewce, grot został, a śnieg i lodowiec zakonserwowały go na 5000 lat."},{"t":"Jak to smakuje","d":"Jeleń był mocno dziki w smaku, wędzona kozina zaskakująco dobra, a placek przypominał autorowi niesłodzony batonik musli. Wniosek: dobrze żyć w czasach z wyborem jedzenia."}],"conclusion":"Z treści żołądka sprzed 5000 lat da się odtworzyć nie tylko posiłek, ale i ostatnie godziny życia człowieka.","factchecks":[{"claim":"Ciało Ötziego znaleźli niemieccy turyści 19 września 1991 r.","verdict":"prawda","note":"Znaleźli je Helmut i Erika Simon na lodowcu Similaun w Alpach Ötztalskich.","p":4,"src":[["Wikipedia (ang.): Ötzi - hasło \"Ötzi\"","https://en.wikipedia.org/wiki/%C3%96tzi"]]},{"claim":"Ötzi żył ok. 3359-3105 r. p.n.e.","verdict":"prawda","note":"Datowanie radiowęglowe daje 3350-3105 r. p.n.e.; różnica w pierwszej dacie to drobny błąd.","p":4,"src":[["Wikipedia (ang.): Ötzi - hasło \"Ötzi\"","https://en.wikipedia.org/wiki/%C3%96tzi"]]},{"claim":"Połowę zawartości żołądka stanowił tłuszcz koziorożca.","verdict":"prawda","note":"Analiza z 2018 r. wykazała 46% tłuszczu oraz mięso koziorożca, jelenia i samopszę.","p":[1,3],"src":[["Current Biology: ostatni posiłek Ötziego (Maixner i in., 2018)","https://doi.org/10.1016/j.cub.2018.05.067"]]},{"claim":"Samopsza to pierwsze uprawiane zboże, niezmienione od 12 tys. lat.","verdict":"półprawda","note":"To jedno z najwcześniej udomowionych zbóż (ok. 10-11 tys. lat temu), obok płaskurki i jęczmienia.","p":1,"src":[["Wikipedia (ang.): pszenica samopsza - hasło \"Einkorn wheat\"","https://en.wikipedia.org/wiki/Einkorn_wheat"]]},{"claim":"Topór Ötziego był z miedzi o czystości 99,7%, a ciało miało 61 tatuaży.","verdict":"prawda","note":"Oba fakty potwierdzają badania; tatuaże to linie i krzyżyki głównie przy stawach.","p":[6,7],"src":[["Wikipedia (ang.): Ötzi - hasło \"Ötzi\"","https://en.wikipedia.org/wiki/%C3%96tzi"],["Muzeum Archeologiczne Południowego Tyrolu: Ötzi","https://www.iceman.it/en/the-iceman/"]]},{"claim":"Grot strzały w barku odkryto dopiero w 2001 r.","verdict":"prawda","note":"Zdjęcia rentgenowskie z 2001 r. ujawniły grot, który uszkodził tętnicę podobojczykową.","p":[8,10],"src":[["Wikipedia (ang.): Ötzi - hasło \"Ötzi\"","https://en.wikipedia.org/wiki/%C3%96tzi"]]}],"bias":"Rzetelny i lekki w tonie; ostrożnie zaznacza, co jest hipotezą. Część czasu zajmuje reklama sponsora."},{"id":"7bOQ7fLCqgI","title_pl":"9 części ciała, które kiedyś znikną","title":"9 Body Parts That Will Disappear One Day","url":"https://www.youtube.com/watch?v=7bOQ7fLCqgI","date":"2024-04-27","duration":528,"views":1188491,"transcript":"youtube","added":"2026-11-03","tags":["Ciało i zdrowie","Ewolucja"],"about":"9 szczątkowych części ciała, które według autora mogą kiedyś zniknąć w wyniku ewolucji.","intro":"Ranking 9 części ciała, które według autora ewolucja powoli \"wygasza\", bo przestały być potrzebne. Są tu wyrostek robaczkowy, palce u stóp, narząd Jacobsona, mięśnie od gęsiej skórki, kość ogonowa, mięsień dłoniowy długi, zęby mądrości, mięśnie uszu i zatoki. Autor przy każdej tłumaczy, do czego służyła przodkom i dlaczego dziś ma znikać.","points":[{"t":"9. Wyrostek robaczkowy","d":"Mógł pomagać przodkom trawić twarde rośliny, a przy dzisiejszej diecie według autora nic nie robi. Gdy się zapali, lekarze go usuwają i da się normalnie żyć. Autor twierdzi, że w niektórych populacjach nawet 1 na 5 osób rodzi się bez wyrostka."},{"t":"8. Palce u stóp","d":"Przodkowie potrzebowali chwytnych palców do wspinaczki. Dziś większość pracy przy chodzeniu i bieganiu robi duży palec, a buty sprawiają, że małe palce \"leniwieją\". Naukowcy mają przewidywać, że w bardzo dalekiej przyszłości palce się skrócą, ale nie za naszego życia."},{"t":"7. Narząd Jacobsona","d":"Narząd w nosie do wykrywania feromonów, u ludzi według autora praktycznie nieczynny, jak gadżet z wyczerpaną baterią. Przodkom mógł sygnalizować płodność albo złość, ale zaczęliśmy polegać na wzroku i słuchu. Część ludzi rodzi się bez niego i nie ma z tym problemu."},{"t":"6. Mięśnie przywłosowe","d":"To one robią gęsią skórkę. U owłosionych przodków stroszyły futro, żeby wyglądać groźniej, np. przed tygrysem szablozębnym. Według autora słabną i stają się rzadsze, więc kiedyś gęsia skórka może być ciekawostką z podręcznika."},{"t":"5. Kość ogonowa","d":"Pozostałość ogona przodków, którzy używali go do równowagi i komunikacji. Nie jest całkiem bezużyteczna, bo przyczepiają się do niej mięśnie i więzadła. Bardzo rzadko dzieci rodzą się z małym ogonkiem bez kości (tylko tkanka i naczynia), który zwykle usuwa się po porodzie."},{"t":"4. Mięsień dłoniowy długi","d":"Pomaga zginać nadgarstek, ale tę pracę i tak wykonują inne mięśnie, a według autora nie ma go ok. 14% ludzi. Przodkom mógł się przydawać przy przeskakiwaniu z drzewa na drzewo. Chirurdzy pobierają jego ścięgno do przeszczepów bez szkody dla ręki."},{"t":"3. Zęby mądrości","d":"Wyrastają w wieku ok. 17-25 lat, gdy w szczęce nie ma już miejsca, więc przesuwają inne zęby. Przodkowie potrzebowali zapasowych zębów do surowego jedzenia i szybko tracili zęby. Gotujemy i kroimy jedzenie, szczęki się zmniejszyły, a coraz więcej ludzi rodzi się bez ósemek."},{"t":"2. Mięśnie uszu","d":"Dzięki nim niektórzy ruszają uszami, ale większość nie umie ich używać. Przodkom mogły pomagać namierzać dźwięki, potem zaczęliśmy polegać na wzroku. Autor wspomina rekord: mężczyzna z Indii poruszył uszami 99 razy w 30 sekund."},{"t":"1. Zatoki","d":"Nie wiadomo do końca, po co są: hipotezy to nawilżanie powietrza, odciążenie czaszki i śluz łapiący zarazki. Według autora część badaczy uważa, że powoli zanikają, a jedno badanie wiązało mniejsze zatoki z rzadszymi infekcjami. Ewentualne zniknięcie trwałoby tysiące lat."}],"conclusion":"Ciało nosi ślady ewolucji, a niektóre z tych części mogą zniknąć, ale zajmie to tysiące lat.","factchecks":[{"claim":"Wyrostek robaczkowy jest bezużyteczny.","verdict":"półprawda","note":"Nowsze badania wskazują na rolę odpornościową wyrostka, co przeczy prostej tezie o szczątkowości.","src":[["Wikipedia (ang.): wyrostek robaczkowy - hasło \"Appendix (anatomy)\"","https://en.wikipedia.org/wiki/Appendix_(anatomy)"],["Smith i in. 2023, Anat Rec: przegląd funkcji i ewolucji wyrostka (PubMed)","https://pubmed.ncbi.nlm.nih.gov/35363436/"],["Smith i in. 2009, J Evol Biol (PubMed)","https://pubmed.ncbi.nlm.nih.gov/19678866/"]],"p":0},{"claim":"Coraz więcej ludzi rodzi się bez wyrostka (nawet 1 na 5).","verdict":"fałsz","note":"Wrodzony brak wyrostka to skrajna rzadkość, szacowana na ok. 1 na 100 000 operacji brzucha.","src":[["Opis przypadku agenezji wyrostka (PMC)","https://pmc.ncbi.nlm.nih.gov/articles/PMC8043782/"]],"p":0},{"claim":"Część ludzi nie ma mięśnia dłoniowego długiego.","verdict":"prawda","note":"Brak występuje u ok. 10-15% ludzi, z dużymi różnicami między populacjami.","src":[["Wikipedia (ang.): mięsień dłoniowy długi - hasło \"Palmaris longus\"","https://en.wikipedia.org/wiki/Palmaris_longus_muscle"]],"p":5},{"claim":"U części ludzi zęby mądrości się nie rozwijają.","verdict":"prawda","note":"Metaanaliza Cartera i Worthingtona (2015) daje ok. 22% osób z brakiem co najmniej jednego zęba mądrości.","src":[["Carter i Worthington 2015, J Dent Res (DOI)","https://doi.org/10.1177/0022034515581644"],["Wikipedia (ang.): zęby mądrości - hasło \"Wisdom tooth\"","https://en.wikipedia.org/wiki/Wisdom_tooth"]],"p":6},{"claim":"Narząd Jacobsona, kość ogonowa, mięśnie przywłosowe i uszne to struktury szczątkowe.","verdict":"prawda","note":"Standardowe przykłady w biologii. Narząd lemieszowo-nosowy u dorosłych ludzi nie ma działających połączeń nerwowych.","src":[["Wikipedia (ang.): narządy szczątkowe u człowieka - hasło \"Human vestigiality\"","https://en.wikipedia.org/wiki/Human_vestigiality"],["Wikipedia (ang.): narząd lemieszowo-nosowy (Jacobsona) - hasło \"Vomeronasal organ\"","https://en.wikipedia.org/wiki/Vomeronasal_organ"]],"p":null},{"claim":"Te części ciała \"znikną kiedyś\".","verdict":"nie da się sprawdzić","note":"Ewolucja nie usuwa zbędnych części sama; potrzebna jest presja selekcyjna, więc to spekulacja.","src":[["Wikipedia (ang.): szczątkowość narządów - hasło \"Vestigiality\"","https://en.wikipedia.org/wiki/Vestigiality"]],"p":null}],"bias":"Uproszczona wizja ewolucji jako \"usuwania zbędnych części\". Jedna liczba (brak wyrostka) jest wyssana z palca, a wyrostek opisany według przestarzałej wiedzy.","channel":"Chill Dude Explains","section":"Chill Dude Explains"},{"id":"_u76SgdXeCk","title_pl":"Jak powinien leżeć garnitur - najważniejsze zasady dopasowania","title":"Jak powinien leżeć garnitur? Najważniejsze aspekty dopasowania garnituru","channel":"Kamil Brycki","url":"https://www.youtube.com/watch?v=_u76SgdXeCk","date":"2024-04-14","duration":722,"views":9663,"section":"Moda","transcript":"youtube","added":"2026-11-03","tags":["Garnitur","Dopasowanie","Krawiectwo"],"about":"Kamil Brycki, krawiec z 10-letnim stażem, pokazuje, na co patrzeć przy marynarce, spodniach i kamizelce i co da się poprawić u krawca.","intro":"Kamil Brycki szyje garnitury od 10 lat i od razu uprzedza: gotowy garnitur prawie nigdy nie leży idealnie, więc trzeba liczyć się z kosztem poprawek. Omawia, które wymiary muszą pasować od razu, a które poprawi krawiec. Podaje klasyczne proporcje i przypomina, że to wskazówki, a nie dogmaty.","points":[{"t":"Najpierw ramiona i klatka","d":"W marynarce kluczowe są ramiona i klatka, bo u krawca trudno je zmienić bez zniszczenia kroju. Talię, biodra, rękawy i długość da się skorygować. Łatwiej zwęzić niż poszerzyć, a marynarki o wiele rozmiarów za dużej nie warto ratować."},{"t":"Klasyczne proporcje","d":"Rękaw do nadgarstka, z widocznym 0,5-1 cm mankietu koszuli. Marynarka zakrywa pośladki, a z przodu sięga mniej więcej do połowy kciuka. Niższym może pasować nieco krótsza, a wyższym niż 190 cm dłuższa."},{"t":"Wysoka pacha daje swobodę","d":"Jeśli marynarka krępuje ruchy, pacha może być za nisko wszyta i robi się efekt nietoperza. Krawcy wszywają ją jak najwyżej, byle nie obcierała. We frakach dyrygentów pacha jest prawie tak wysoko jak w koszuli."},{"t":"Guzik i klapy","d":"Tych dwóch rzeczy nie zmienisz w gotowej marynarce. Guzik zapina się w najwęższym miejscu talii, a klapy sięgają mniej więcej połowy szerokości ramienia. Szersze klapy optycznie poszerzają ramiona."},{"t":"Spodnie: biodra, uda, krok","d":"Spodnie da się zwęzić i skrócić, ale poszerzyć najwyżej o 1-1,5 cm, a źle leżącego kroku raczej nie poprawisz. Złoty standard: możesz usiąść, a po wstaniu nogawka sama opada na miejsce. Nogawka ma jedno załamanie lub żadnego."},{"t":"Nie do połowy obcasa","d":"Stara zasada była sensowna przy szerokich nogawkach. Wąska nogawka tak długa zatrzymuje się na bucie i tworzy harmonijkę."},{"t":"Kamizelka","d":"Kamizelka ma modelować sylwetkę, więc leży blisko ciała. Musi zakrywać pasek spodni, żeby koszula nie wychodziła. Dawniej była wysoko zapinana, bo koszula była bielizną, a kołnierzyki i mankiety odpinano i prano osobno."}],"conclusion":"Trzymaj się podstaw dopasowania, a bawić się stylem zacznij dopiero potem. Za ciasne ubranie nie odmładza i nie wyszczupla.","factchecks":[{"claim":"Kołnierzyki odpinano, żeby prać je osobno od koszuli.","verdict":"prawda","note":"Wikipedia opisuje odpinane, mocno krochmalone kołnierzyki prane osobno lub zastępowane papierowymi i celuloidowymi.","p":6,"src":[["Wikipedia (ang.): kołnierzyk - hasło \"Detachable collar\"","https://en.wikipedia.org/wiki/Detachable_collar"]]},{"claim":"Koszula była kiedyś traktowana jak bielizna.","verdict":"prawda","note":"Wg Wikipedii odsłonięta koszula budziła kiedyś podobne skojarzenia jak dziś widoczna bielizna.","p":6,"src":[["Wikipedia (ang.): koszula - hasło \"Shirt\"","https://en.wikipedia.org/wiki/Shirt"]]}],"bias":"Autor jest krawcem w pracowni w Poznaniu, więc zachęca do poprawek krawieckich. Poza tym rzeczowo i bez reklam produktów."},{"id":"UTz2Xg4oMxs","title_pl":"9 najbardziej bolesnych rzeczy, jakich można doświadczyć","title":"9 MOST PAINFUL Things You Can EVER Experience!","url":"https://www.youtube.com/watch?v=UTz2Xg4oMxs","date":"2024-04-07","duration":548,"views":1114282,"transcript":"youtube","added":"2026-11-03","tags":["Ciało i zdrowie","Natura"],"about":"Ranking 9 najbardziej bolesnych doświadczeń, od kamieni nerkowych po użądlenie mrówki-pocisku.","intro":"Ranking 9 najboleśniejszych doświadczeń, jakie może przeżyć człowiek. Autor zaczyna od kamienia nerkowego i chorób (tężec, klasterowe bóle głowy, fibromialgia), a potem przechodzi do zwierząt i roślin: meduzy Irukandji, ryby kamień, rośliny gympie-gympie, osy \"kat\" i mrówki-pocisku. Opisy są obrazowe i żartobliwe, bez podanych źródeł.","points":[{"t":"9. Kamień nerkowy","d":"Zaczyna się od ostrego bólu w plecach, który przesuwa się, gdy kamień wędruje z nerki do pęcherza. Ból narasta jak dźganie nożem od środka, a jedyne wyjście to czekać, aż kamień przejdzie. Niektórzy porównują to do porodu."},{"t":"8. Meduza Irukandji","d":"Meduza mieści się na paznokciu. 20-30 minut po ukłuciu pojawia się ból pleców i brzucha, skurcze mięśni i poczucie nadchodzącej śmierci, przez które poparzeni według autora błagają lekarzy, żeby ich zabili. Autor twierdzi, że spotyka się je od Hawajów po Florydę."},{"t":"7. Tężec","d":"Bakteryjne zakażenie układu nerwowego zaczyna się od skaleczenia, np. zardzewiałym narzędziem albo gwoździem. Po kilku dniach mięśnie sztywnieją, najpierw szczęka (stąd \"szczękościsk\"), potem szyja, ręce i nogi, a skurcze są bardzo bolesne. Autor zaleca aktualne szczepienie."},{"t":"6. Klasterowe bóle głowy","d":"Ból opisywany jak rozgrzany pręt wbijany w oko albo piła w czaszce, według autora ok. 100 razy gorszy od zwykłego bólu głowy. Ataki przychodzą codziennie przez tygodnie lub miesiące, potem znikają i wracają. W trakcie ludzie chodzą w kółko, uderzają głową o ścianę albo krzyczą."},{"t":"5. Ryba kamień (skorpena)","d":"Ryba kamień ukrywa się wśród skał i koralowców tak dobrze, że można na nią patrzeć i jej nie zauważyć. Nadepnięcie wstrzykuje jad, a ból opisywany jest jak jednoczesne miażdżenie, palenie i porażenie prądem. Niektórzy według autora prosili lekarzy o amputację nogi."},{"t":"4. Fibromialgia","d":"Przewlekła choroba z bólem w całym ciele, zmęczeniem mimo snu, nadwrażliwością na dotyk i mgłą mózgową; chorzy opisują ją jak oparzenie słoneczne całego ciała. Jest niewidoczna, więc chorych bierze się za przewrażliwionych. Według autora nie ma lekarstwa."},{"t":"3. Gympie-gympie","d":"Australijska roślina pokryta pustymi włoskami z silną neurotoksyną; przy otarciu włoski się łamią i wstrzykują ją w skórę. Ból jak użądlenie przez rój os trwa dni, tygodnie albo miesiące, a niektórzy czuli go nawet do 2 lat."},{"t":"2. Osa \"Kat\" (executioner wasp)","d":"Osa z Ameryki Środkowej i Południowej, według autora wielkości małego ptaka, do ok. 5 cm. Jej jad z neurotoksyną daje natychmiastowy ból na godziny, porównywany do uderzenia pociągu, potem gorączkę, poty, nudności i wymioty. To parazytoid: paraliżuje owady i składa w nich jaja."},{"t":"1. Mrówka-pocisk","d":"Nazwa od tego, że użądlenie ma przypominać postrzał; jad bywa nazywany najboleśniejszym na świecie, jak wyrywanie kości przez skórę, a ból trwa do 24 h. W plemieniu w Brazylii młodzi mężczyźni noszą rękawice pełne mrówek przez 10 minut, 20 razy w ciągu kilku miesięcy."}],"conclusion":"Natura i własne ciało potrafią zadać ból wykraczający poza wyobrażenie, a najgorsze w rankingu są użądlenia owadów.","factchecks":[{"claim":"Osa Polistes carnifex ma jad z poneratoksyną, jest wielkości małego ptaka i składa jaja w innych owadach.","verdict":"fałsz","note":"Poneratoksyna to toksyna mrówki-pocisku; ta osa ma do ok. 3,3 cm i nie pasożytuje.","src":[["Wikipedia (ang.): osa Polistes carnifex - hasło \"Polistes carnifex\"","https://en.wikipedia.org/wiki/Polistes_carnifex"],["Wikipedia (ang.): poneratoksyna - hasło \"Poneratoxin\"","https://en.wikipedia.org/wiki/Poneratoxin"]],"p":7},{"claim":"Mrówka-pocisk: ból do 24 h; rytuał rękawic 10 minut, 20 razy.","verdict":"prawda","note":"Najwyższa ocena (4+) w skali bólu Schmidta, ból do 24 h. Rytuał ludu Sateré-Mawé jest dobrze opisany.","src":[["Wikipedia (ang.): mrówka-pocisk - hasło \"Paraponera clavata\"","https://en.wikipedia.org/wiki/Paraponera_clavata"],["Wikipedia (ang.): skala bólu użądleń Schmidta - hasło \"Schmidt sting pain index\"","https://en.wikipedia.org/wiki/Schmidt_sting_pain_index"]],"p":8},{"claim":"Meduza Irukandji występuje od Hawajów po Florydę.","verdict":"półprawda","note":"Carukia barnesi żyje w Australii; na Hawajach i Florydzie podobny syndrom dają inne gatunki.","src":[["Wikipedia (ang.): zespół Irukandji - hasło \"Irukandji syndrome\"","https://en.wikipedia.org/wiki/Irukandji_syndrome"],["Wikipedia (ang.): meduza Carukia barnesi - hasło \"Carukia barnesi\"","https://en.wikipedia.org/wiki/Carukia_barnesi"]],"p":1},{"claim":"Gympie-gympie: ból może trwać miesiące.","verdict":"prawda","note":"Opisy przypadków i badanie toksyn (gympietydy, Science Advances 2020) potwierdzają długotrwały ból, ale relacje o latach są anegdotyczne.","src":[["Wikipedia (ang.): gympie-gympie (Dendrocnide moroides) - hasło \"Dendrocnide moroides\"","https://en.wikipedia.org/wiki/Dendrocnide_moroides"],["Gilding i in. 2020, Science Advances (DOI)","https://doi.org/10.1126/sciadv.abb8828"]],"p":6},{"claim":"Ryba kamień to najbardziej jadowita ryba świata.","verdict":"prawda","note":"Tak się ją powszechnie określa; istnieje antytoksyna, a zgony są rzadkie.","src":[["Wikipedia (ang.): ryby kamienne (Synanceia) - hasło \"Stonefish\"","https://en.wikipedia.org/wiki/Stonefish"]],"p":4},{"claim":"Kamienie nerkowe, klasterowe bóle głowy, tężec, fibromialgia bez lekarstwa.","verdict":"prawda","note":"Opisy zgodne z wiedzą medyczną. Fibromialgii nie da się wyleczyć, ale objawy łagodzi leczenie i ruch.","src":[["Wikipedia (ang.): klasterowy ból głowy - hasło \"Cluster headache\"","https://en.wikipedia.org/wiki/Cluster_headache"],["Wikipedia (ang.): fibromialgia - hasło \"Fibromyalgia\"","https://en.wikipedia.org/wiki/Fibromyalgia"],["WHO: tężec","https://www.who.int/news-room/fact-sheets/detail/tetanus"]],"p":null}],"bias":"Ranking subiektywny (bólu nie da się obiektywnie porównać). Punkt o osie-katu jest w dużej mierze zmyślony; reszta zgodna z faktami.","channel":"Chill Dude Explains","section":"Chill Dude Explains"},{"id":"ziYuxvxAw3U","title_pl":"9 najstarszych technologii, których naukowcy wciąż nie potrafią wyjaśnić","title":"9 Oldest Technologies Scientists Still Can’t Explain","url":"https://www.youtube.com/watch?v=ziYuxvxAw3U","date":"2024-03-10","duration":561,"views":1051283,"transcript":"youtube","added":"2026-11-03","tags":["Historia","Technika"],"about":"9 starożytnych technologii, których według autora naukowcy wciąż nie potrafią wyjaśnić ani odtworzyć.","intro":"Ranking 9 dawnych wynalazków i budowli, których według autora wciąż nie umiemy wyjaśnić ani odtworzyć. Są wśród nich rzymski puchar zmieniający kolor, elastyczne szkło i ogień grecki, skrzypce Stradivariego, mechanizm z Antykithiry, stal damasceńska, kamienne kule z Kostaryki, mury Sacsayhuamán w Peru i piramidy w Gizie. Autor często przedstawia legendy i domysły jako pewną historię.","points":[{"t":"9. Puchar Likurga","d":"Rzymski puchar z IV w.: pod światło świeci na czerwono, oglądany z przodu jest zielony. Rzymianie dodali do szkła niewidoczne cząstki złota i srebra, które zmieniają kolor zależnie od kierunku światła. Naukowcy według autora sądzą, że wyszło to przypadkiem, a odtworzyć to umiemy dopiero od niedawna."},{"t":"8. Rzymskie elastyczne szkło","d":"Legenda: wynalazca pokazał cesarzowi Tyberiuszowi miskę ze szkła, która po upuszczeniu tylko się wgniotła, a wgniecenie wyklepał młotkiem. Cesarz bał się spadku wartości złota i srebra, więc kazał go zabić. Autor przyznaje, że nie wiadomo, czy to prawda, a sekret zaginął z wynalazcą."},{"t":"7. Ogień grecki","d":"Mieszanina, która paliła się nawet na wodzie, a polewanie wodą miało ją wzmagać. Według autora używali jej Rzymianie: rzucali granaty z ogniem i pryskali nim z rur na wrogie statki. Przepis był tajemnicą państwową; historycy zgadują żywicę sosnową, wapno palone i inne składniki."},{"t":"6. Skrzypce Stradivariego","d":"Rodzina Stradivarich we Włoszech robiła skrzypce w latach 1650-1750. Mimo badań nikt nie umie dokładnie wyjaśnić ich brzmienia ani go odtworzyć; rodzina używała specjalnego drewna i tajnego przepisu. Kosztują miliony dolarów, kupuje się je jako inwestycję, a część skradziono i zaginęła."},{"t":"5. Mechanizm z Antykithiry","d":"Ok. 100 lat temu nurkowie znaleźli przy greckiej wyspie Antykithira wrak z bryłą brązu i drewna, według autora pierwszym analogowym komputerem. Przewidywał zaćmienia, prowadził kalendarz i wskazywał termin igrzysk. Coś równie złożonego pojawia się dopiero ok. 1200 lat później."},{"t":"4. Stal damasceńska","d":"Krzyżowcy spotkali u wojowników islamskich miecze, które przecinały pływającą chustkę, wyginały się pod dużym kątem i wracały bez szkody, z wzorem jak płynąca woda. Według autora sekret zaginął; naukowcy podejrzewają dodatek roślin do żelaza. Stal sprzedawano w Damaszku, ale pochodziła z Indii i Iranu."},{"t":"3. Kamienne kule z Kostaryki","d":"Ponad 300 kamiennych kul, niektóre do 15 ton i ponad 2 m średnicy, zrobiła nieistniejąca już kultura Diquís, obijając je kamieniami i polerując piaskiem. Cel nieznany: drogowskazy do domu wodza albo astronomia. W latach 30. XX w. przy karczowaniu pod banany część rozbito, szukając złota."},{"t":"2. Sacsayhuamán (Peru)","d":"Inkaska twierdza chroniąca Cusco, z polerowanych bloków po 100-120 ton dopasowanych tak, że nie wejdzie między nie kartka papieru. Autor odrzuca teorie o ogromnej soczewce i topieniu kamienia ogniskiem. Twierdza przetrwała trzęsienia ziemi, ale Hiszpanie rozbierali ją na materiał do budowy Cusco."},{"t":"1. Piramidy w Gizie","d":"Wielka Piramida to ok. 2,3 mln bloków, od kilku ton do wagi małego domu, a Egipcjanie nie mieli dźwigów ani taczek. Teorie: proste albo zygzakowate rampy, spławianie kamieni Nilem, a nawet zaginione maszyny. Najczęściej wraca wersja z miedzianymi narzędziami, wodą i armią robotników pracujących latami."}],"conclusion":"Dawne cywilizacje miały zaskakującą wiedzę, a część ich technik pozostaje dla nas zagadką.","factchecks":[{"claim":"Puchar Likurga zmienia kolor dzięki nanocząstkom.","verdict":"prawda","note":"Złoto i srebro w nanocząstkach potwierdziło British Museum; efekt jest wyjaśniony.","src":[["British Museum: Puchar Likurga","https://www.britishmuseum.org/collection/object/H_1958-1202-1"],["Wikipedia (ang.): Puchar Likurga - hasło \"Lycurgus Cup\"","https://en.wikipedia.org/wiki/Lycurgus_Cup"]],"p":0},{"claim":"Elastyczne szkło rzymskie.","verdict":"nie da się sprawdzić","note":"Historia pochodzi tylko z anegdot Pliniusza Starszego i Petroniusza; nie ma żadnego artefaktu. Film zaznacza, że to legenda.","src":[["Wikipedia (ang.): szkło elastyczne (vitrum flexile) - hasło \"Flexible glass\"","https://en.wikipedia.org/wiki/Flexible_glass"]],"p":1},{"claim":"Ogień grecki wynaleźli Rzymianie, a jego przepis zaginął.","verdict":"półprawda","note":"Używało go Bizancjum od ok. 672 r.; skład faktycznie nie jest znany.","src":[["Wikipedia (ang.): ogień grecki - hasło \"Greek fire\"","https://en.wikipedia.org/wiki/Greek_fire"]],"p":2},{"claim":"Skrzypiec Stradivariego nie da się odtworzyć i brzmią wyjątkowo.","verdict":"przesada","note":"W ślepych testach (PNAS 2012, 2014) soliści nie odróżniali Stradivariusów od nowych skrzypiec.","src":[["Fritz i in. 2014, PNAS (DOI)","https://doi.org/10.1073/pnas.1323367111"],["Wikipedia (ang.): instrumenty Stradivariego - hasło \"Stradivarius\"","https://en.wikipedia.org/wiki/Stradivarius"]],"p":3},{"claim":"Mechanizm z Antykithiry: znaleziony ok. 100 lat temu, przewidywał zaćmienia, niezrównany przez wieki.","verdict":"prawda","note":"Działanie mechanizmu jest dziś dobrze zrekonstruowane.","src":[["Wikipedia (ang.): mechanizm z Antykithiry - hasło \"Antikythera mechanism\"","https://en.wikipedia.org/wiki/Antikythera_mechanism"],["Freeth i in. 2021, Scientific Reports","https://www.nature.com/articles/s41598-021-84310-w"]],"p":4},{"claim":"Stal damasceńska to zaginiony sekret.","verdict":"przesada","note":"Wzory stali wootz odtworzono w latach 90., a nanorurki znaleziono w jednym ostrzu.","src":[["Wikipedia (ang.): stal damasceńska - hasło \"Damascus steel\"","https://en.wikipedia.org/wiki/Damascus_steel"],["Reibold i in. 2006, Nature","https://www.nature.com/articles/444286a"]],"p":5},{"claim":"Kule z Kostaryki: ponad 300, do kilkunastu ton, cel nieznany.","verdict":"prawda","note":"Kule kultury Diquís obrabiano kamieniem i ścieraniem; cel jest niepewny, ale nie \"niewytłumaczalny\".","src":[["Wikipedia (ang.): kamienne kule z Kostaryki - hasło \"Stone spheres of Costa Rica\"","https://en.wikipedia.org/wiki/Stone_spheres_of_Costa_Rica"],["UNESCO: osady wodzów Diquís z kamiennymi kulami","https://whc.unesco.org/en/list/1453/"]],"p":6},{"claim":"Bloki Sacsayhuamán ważą po 100-120 ton.","verdict":"przesada","note":"Największy blok szacuje się na ok. 120-130 t, ale większość jest znacznie mniejsza. Precyzyjne dopasowanie jest prawdą.","src":[["Wikipedia (ang.): Sacsayhuamán","https://en.wikipedia.org/wiki/Sacsayhuam%C3%A1n"]],"p":7},{"claim":"Nie wiadomo, jak zbudowano piramidy.","verdict":"przesada","note":"Papirusy z Wadi al-Dżarf, ślady ramp i osady robotników wyjaśniają budowę; \"megamaszyny\" to spekulacja.","src":[["Wikipedia (ang.): Dziennik Merera - hasło \"Diary of Merer\"","https://en.wikipedia.org/wiki/Diary_of_Merer"],["Fall i in. 2014, PRL (DOI)","https://doi.org/10.1103/PhysRevLett.112.175502"]],"p":8}],"bias":"Tendencyjny tytuł: większość pozycji naukowcy dobrze rozumieją, a film sugeruje nawet zaginione maszyny.","channel":"Chill Dude Explains","section":"Chill Dude Explains"},{"id":"FAdmpAZTH_M","title_pl":"Matematyczny błąd, który wyjdzie na jaw za 1200 lat","title":"The 1,200 Year Maths Mistake","channel":"Stand-up Maths","url":"https://www.youtube.com/watch?v=FAdmpAZTH_M","date":"2024-02-22","duration":1150,"views":3404042,"section":"Ciekawostki","transcript":"youtube","added":"2026-11-03","tags":["Matematyka","Kultura"],"about":"Matt Parker jedzie do Wemding, gdzie od 1993 r. powstaje Piramida Czasu, i znajduje w planie klasyczny błąd o jeden.","intro":"W bawarskim Wemding co 10 lat dokłada się jeden betonowy blok do piramidy, która ma powstawać 1200 lat. Matt Parker (Stand-up Maths) z Ayliean MacDonald ogląda wstawianie czwartego bloku w 2023 r., tłumaczy błąd \"płotu i słupków\", który sprawi, że ostatni blok trafi na miejsce 10 lat za wcześnie, i wymyśla żartobliwe poprawki.","points":[{"t":"Piramida Czasu","d":"Zeitpyramide artysty Manfreda Labera uczciła 1200-lecie Wemding, pierwszy raz wzmiankowanego w 793 r. Skoro ludzkie życie jest za krótkie, by poczuć 1200 lat, dzieło ma powstawać właśnie tyle."},{"t":"120 bloków","d":"Piramida ma warstwy 8 x 8, 6 x 6, 4 x 4 i 2 x 2, czyli 64 + 36 + 16 + 4 = 120 bloków, ustawionych dokładnie jeden na drugim. Pierwszy wstawiono w 1993 r., kolejne w 2003, 2013 i 2023 r."},{"t":"Czas na ludzką skalę","d":"Parker miał 12 lat przy pierwszym bloku i 42 przy czwartym. Pojedyncze bloki mierzy się życiem człowieka, a całość pokazuje skalę, której nie da się ogarnąć."},{"t":"Błąd płotu i słupków","d":"Płot z 4 przęseł ma 5 słupków. W programowaniu to klasyczny błąd o jeden: od 8:00 do 12:00 są 4 godziny, ale od 8. do 12. piętra jest 5 pięter."},{"t":"10 lat za wcześnie","d":"Wstawiając 120 bloków co 10 lat od 1993 r., ostatni trafi na miejsce w 3183 r., a nie w 3193 r., na 2400-lecie miasta. Do tej daty trzeba by 121 bloków."},{"t":"Wstawianie bloku","d":"Dźwig opuścił 6,5 t betonu na zaprawę w drewnianym szablonie, przy klarnecie grającym utwory o czasie i przemowach lokalnych władz. Córka artysty i twórca aplikacji AR nie przejmowali się błędem: ostatnią dekadę można świętować."},{"t":"Poprawki na 121","d":"Parker proponuje drugą, mniejszą piramidę z kwadratów liczb nieparzystych lub odwróconą na szczycie. Ayliean wymyśla spiralę z liczb trójkątnych: 2 x 55 + 11 = 121, a 21 liczb to też liczba trójkątna."},{"t":"Błąd jako część dzieła","d":"Ostatecznie Parker uważa, że błędu nie należy poprawiać, bo to plan jednego człowieka wykonywany przez dziesiątki pokoleń. Gdy minie pierwszy rząd, za ok. 40 lat, nikt nie zechce przerwać tradycji."},{"t":"Długie projekty się udają","d":"Świątynię Zeusa w Atenach zaczęli Grecy, porzucili ją na wieki, a dokończył cesarz Hadrian. Rzymski beton przetrwał ponad 1200 lat, więc materiał wytrzyma; zmienić się może co najwyżej technika."}],"conclusion":"Piramida Czasu skończy się 10 lat przed planowaną rocznicą, ale to błąd, który zostanie świętowany przez dekadę.","factchecks":[{"claim":"Zeitpyramide w Wemding to dzieło Manfreda Labera, w którym co 10 lat dokłada się blok od 1993 r.","verdict":"prawda","note":"Piramida ma 120 bloków i ma być ukończona w 3183 r.","p":[0,1],"src":[["Wikipedia (ang.): Piramida Czasu - hasło \"Zeitpyramide\"","https://en.wikipedia.org/wiki/Zeitpyramide"]]},{"claim":"Wemding wzmiankowano po raz pierwszy w 793 r.","verdict":"prawda","note":"Miasto wzmiankowano za Karola Wielkiego i świętowało 1200-lecie w 1993 r.","p":0,"src":[["Wikipedia (ang.): Piramida Czasu - hasło \"Zeitpyramide\"","https://en.wikipedia.org/wiki/Zeitpyramide"]]},{"claim":"120 bloków co 10 lat od 1993 r. daje ostatni blok w 3183 r., a nie 3193 r.","verdict":"prawda","note":"1993 + 119 x 10 = 3183; to klasyczny błąd płotu i słupków.","p":[3,4],"src":[["Wikipedia (ang.): błąd o jeden - hasło \"Off-by-one error\"","https://en.wikipedia.org/wiki/Off-by-one_error"]]},{"claim":"Świątynię Zeusa Olimpijskiego w Atenach ukończył cesarz Hadrian.","verdict":"prawda","note":"Budowę zaczęto w VI w. p.n.e., a ukończono w II w. n.e., ok. 638 lat później.","p":8,"src":[["Wikipedia (ang.): Olimpiejon - hasło \"Temple of Olympian Zeus, Athens\"","https://en.wikipedia.org/wiki/Temple_of_Olympian_Zeus,_Athens"]]}],"bias":"Lekki i rzetelny; rachunek łatwo sprawdzić. Druga połowa to żartobliwe pomysły i rozmowy."},{"id":"rW-I3p6SRAc","title_pl":"10 kategorii zapachów do małej, zrównoważonej kolekcji","title":"The 10 'Categories' Every Fragrance Collector Needs To Own | Men's Cologne/Perfume Review 2024","channel":"School of Scent","url":"https://www.youtube.com/watch?v=rW-I3p6SRAc","date":"2024-02-07","duration":674,"views":42524,"section":"Moda","transcript":"youtube","added":"2026-11-04","tags":["Styl","Perfumy","Kolekcja"],"about":"School of Scent układa 10 flakonów w pięciu scenariuszach: uniwersalne, biuro, lato, romantyczny wieczór i głośne wyjścia.","intro":"Autor School of Scent przekonuje, by zbierać jakość zamiast ilości, i pokazuje przykładową dziesiątkę: po dwa zapachy uniwersalne, biurowe, wiosenno-letnie, na spokojny wieczór i na głośniejsze wyjścia. To nie \"10 na całe życie\", tylko szablon kategorii do własnego doboru.","points":[{"t":"Uniwersalne (2)","d":"1) bezpieczny daily: Dior Sauvage Parfum - spokojniejszy, bardziej naturalny niż EDT/Elixir, ok. 10 h, średnia projekcja. 2) seksowny daily: Bond No. 9 Lafayette Street (jabłko, przyprawy, amber) lub alternatywy jak Bleu de Chanel EDP."},{"t":"Spokojny wieczór (2)","d":"Bezpieczny: Maison Margiela Jazz Club (tytoń, amber, korzenny). Na specjalną okazję: Tom Ford Tobacco Vanille (ciepły kakao-tytoń-wanilia) lub Angel's Share / Naos."},{"t":"Biuro (2)","d":"Casual: Chanel Allure Homme Sport Eau Extreme (miętowo-kremowy). Poważniejszy dzień/rozmowa o pracę: Dior Homme Parfum, Terre d'Hermès Grey Vétiver lub Chanel Platinum Égoïste - klasyczny, \"barberski\" ton."},{"t":"Głośne wyjścia (2)","d":"Casual party: Azzaro The Most Wanted (toffee-amber-woody) zamiast nudnego Eros. Luksusowo głośny: Amouage Interlude Black Iris (fougère-amber, dym, iris; 14-16 h) lub Black Afgano / Red Tobacco."},{"t":"Wiosna/lato (2)","d":"Casual: klasyczny cytrusowo-musky aquatic na co dzień (ok. 6 h; w filmie jako summer daily) lub Light Blue Intense / Allure Homme Sport 2021. \"Wystrojony\": Xerjoff Naxos (cytrus, kawa, amber, rum) albo Burlington 1819 / Xerjoff 40 Knots."},{"t":"Opcjonalne rozszerzenie","d":"Do 12 flakonów można dodać oud i skórę albo gourmand, jeśli zabrakło ich w dziesiątce - żeby pokryć jeszcze inne style."}],"conclusion":"Traktuj to jako mapę okazji, nie checklistę flakonów; wybierz własne zapachy pasujące do tych pięciu scenariuszy.","factchecks":[{"claim":"Sauvage Parfum jest spokojniejszą, lepiej zblendowaną wersją linii Sauvage.","verdict":"nie da się sprawdzić","note":"To opinia recenzenta; oficjalne nuty i stężenia różnią się, ale \"lepsze\" to kwestia gustu.","p":0,"src":[["Fragrantica: Dior Sauvage Parfum","https://www.fragrantica.com/perfume/Dior/Sauvage-Parfum-51755.html"]]},{"claim":"Maison Margiela Jazz Club to tytoniowo-amberowy zapach z linii Replica.","verdict":"prawda","note":"Oficjalnie opisywany jako warm, spicy, with tobacco and rum accords w serii Replica.","p":1,"src":[["Fragrantica: Jazz Club Maison Martin Margiela","https://www.fragrantica.com/perfume/Maison-Martin-Margiela/Jazz-Club-28681.html"]]},{"claim":"Tom Ford Tobacco Vanille to warm spicy z wanilią i tytoniem.","verdict":"prawda","note":"Zgodne z powszechnymi piramidami nut: tytoń, wanilia, kakao, przyprawy.","p":1,"src":[["Fragrantica: Tom Ford Tobacco Vanille","https://www.fragrantica.com/perfume/Tom-Ford/Tobacco-Vanille-1825.html"]]}],"bias":"Subiektywna lista zakupowa z naciskiem na popularne designery i niszę; prośba o subskrypcję w środku filmu."},{"id":"hmHhsg7h4g0","title_pl":"10 powodów, dla których w średniowieczu uznano by cię za czarownicę","title":"10 Reasons You'd Be Called a Witch in The Middle Ages","url":"https://www.youtube.com/watch?v=hmHhsg7h4g0","date":"2024-01-02","duration":544,"views":2194394,"transcript":"youtube","added":"2026-11-03","tags":["Historia","Mity"],"about":"Humorystyczna lista 10 zachowań i cech, za które w \"średniowieczu\" można było zostać oskarżonym o czary.","intro":"Żartobliwa lista 10 zachowań i cech, za które według autora w \"średniowieczu\" można było zostać oskarżonym o czary. Są wśród nich znamiona, lunatykowanie, gwizdanie, leworęczność i ziewanie, a także koty, kichnięcie kota, warzenie piwa, zbyt dobry ser i jajka z dwoma żółtkami. Autor opisuje to scenkami z wymyślonymi sąsiadami, a przy piwie tłumaczy, skąd wziął się obraz czarownicy z kotłem i miotłą.","points":[{"t":"Znamiona","d":"W XV w. znamiona nazywano znakiem diabła i wierzono, że są znieczulone magią. Łowcy czarownic kłuli je igłami, a brak bólu oznaczał winę; niektórzy używali chowanych igieł. Reakcję na ból też uznawano za udawanie."},{"t":"Lunatykowanie","d":"Ktoś, kto chodzi nocą z zamkniętymi oczami i mamrocze, według autora wyglądał jak rozmawiający z diabłem. Szept przez sen mógł uchodzić za zaklęcie, a gdy następnego dnia coś się stało, np. koń kowala się przeziębił, winny był lunatyk."},{"t":"Gwizdanie","d":"Niektóre melodie miały przywoływać wiatr zdolny zerwać dach albo zważyć mleko. Liczyło się też miejsce: gwizdanie przy pewnych drzewach oznaczało spotkanie z czarownicami, przy cmentarzu budzenie zmarłych, a w kościele było zakazane. Wierzono też, że melodie pozwalają porozumiewać się ze zwierzętami."},{"t":"Leworęczność","d":"Ponieważ większość ludzi jest praworęczna, a diabła uważano za mańkuta, leworęcznych podejrzewano o czary. Według autora ich słowo nie miało wagi w sądzie, bo uznawano, że mówi przez nich diabeł."},{"t":"Ziewanie","d":"Wierzono, że przy ziewnięciu dusza może uciec, a w jej miejsce wejdą demony. Autor wiąże to z dżumą, której objawem miało być częste ziewanie. Przy ziewaniu robiono znak krzyża nad ustami, a za niemowlęta robili to dorośli; ziewanie bez znaku krzyża było podejrzane."},{"t":"Posiadanie kotów","d":"Zwłaszcza czarne koty, nocne i tajemnicze, uchodziły za pomocników diabła, więc ich właścicielkę mogła oskarżyć sąsiadka. Autor zwraca uwagę na ironię: koty ograniczały populację szczurów, a więc ryzyko szerzenia się dżumy."},{"t":"Kichnięcie kota obok ciebie","d":"Skoro kot był przyjacielem diabła, to kichnięcie kota obok ciebie oznaczało, że kot z tobą rozmawia. Według autora z tego wynikało, że i ty kumplujesz się z diabłem, czyli jesteś czarownicą."},{"t":"Warzenie piwa","d":"W średniowieczu piwo warzyły głównie kobiety. Za dobre piwo budziło zazdrość i plotki o zaklęciach nad kotłem. Wyposażenie piwowarki to duży kocioł, kij do mieszania i koty pilnujące ziarna przed myszami, czyli według autora gotowy zestaw stereotypowej czarownicy."},{"t":"Za dobry ser","d":"Gdy w wiosce jeden ser zawsze wychodził idealny, a u sąsiadów jak guma czy cegła, ludzie, nie znając roli bakterii i temperatury, podejrzewali czary. Wierzono, że czarownica umie \"ukraść\" jakość cudzego sera i dodać ją do swojego."},{"t":"Jajka z dwoma żółtkami","d":"Autor umieszcza to w XVI-wiecznej Francji: jajka z dwoma żółtkami uchodziły za nienaturalne. Właścicielkę kur podejrzewano, że rzuciła na nie urok albo używa takich jajek w rytuałach."}],"conclusion":"Przesądy i brak wiedzy sprawiały, że niemal każde odstępstwo od normy mogło skończyć się procesem o czary.","factchecks":[{"claim":"Polowania na czarownice to średniowiecze (XV wiek).","verdict":"półprawda","note":"Masowe procesy to głównie lata 1450-1750, czyli wczesna nowożytność, nie średniowiecze.","src":[["Wikipedia (ang.): procesy czarownic w epoce nowożytnej - hasło \"Witch trials in the early modern period\"","https://en.wikipedia.org/wiki/Witch_trials_in_the_early_modern_period"]],"p":null},{"claim":"\"Znak diabła\" i kłucie igłami, także chowanymi.","verdict":"prawda","note":"Kłucie (witch-pricking) jest dobrze udokumentowane, w tym oszustwa z chowanymi igłami.","src":[["Wikipedia (ang.): kłucie czarownic - hasło \"Witch pricking\"","https://en.wikipedia.org/wiki/Witch_pricking"],["Wikipedia (ang.): znak diabła - hasło \"Devil's mark\"","https://en.wikipedia.org/wiki/Devil%27s_mark"]],"p":0},{"claim":"Leworęczni byli oskarżani o czary, a ich zeznania nie miały wagi w sądzie.","verdict":"nie da się sprawdzić","note":"Lewa strona kojarzyła się ze złem, ale brak źródeł, że leworęczność była typowym zarzutem.","src":[["Wikipedia (ang.): uprzedzenia wobec leworęcznych - hasło \"Bias against left-handed people\"","https://en.wikipedia.org/wiki/Bias_against_left-handed_people"]],"p":3},{"claim":"Ziewanie było objawem dżumy, stąd znak krzyża przy ziewaniu.","verdict":"nie da się sprawdzić","note":"Zwyczaj żegnania ust istniał, ale związek z dżumą to anegdota bez źródeł.","src":[["Wikipedia (ang.): ziewanie (kultura) - hasło \"Yawn\"","https://en.wikipedia.org/wiki/Yawn"]],"p":4},{"claim":"Koty kojarzono z diabłem; ich tępienie nasiliło dżumę.","verdict":"półprawda","note":"Bulla z 1233 r. łączyła koty z diabłem, ale wpływ tępienia kotów na dżumę to mit.","src":[["Wikipedia (ang.): bulla Vox in Rama - hasło \"Vox in Rama\"","https://en.wikipedia.org/wiki/Vox_in_Rama"],["Wikipedia (ang.): czarny kot - hasło \"Black cat\"","https://en.wikipedia.org/wiki/Black_cat"]],"p":5},{"claim":"Kobiety piwowarki (alewives) dały początek stereotypowi czarownicy z kotłem, miotłą i kotem.","verdict":"półprawda","note":"Kobiety dominowały w piwowarstwie, ale historycy kwestionują związek ze stereotypem czarownicy.","src":[["Wikipedia (ang.): piwowarki (alewives) - hasło \"Alewife (trade)\"","https://en.wikipedia.org/wiki/Alewife_(trade)"]],"p":7},{"claim":"Lunatykowanie, gwizdanie, kichnięcie kota, ser, jajka z dwoma żółtkami jako powody oskarżeń.","verdict":"nie da się sprawdzić","note":"Przesądy o \"kradzieży\" mleka istniały, ale konkretne przykłady z filmu nie są udokumentowane.","src":[["Wikipedia (ang.): czary (przesądy ludowe) - hasło \"Witchcraft\"","https://en.wikipedia.org/wiki/Witchcraft"]],"p":null}],"bias":"Rozrywkowy, bez źródeł. Większość punktów to anegdoty z internetu podane jako fakty, a epoka jest pomylona (to głównie XVI-XVII wiek, nie średniowiecze).","channel":"Chill Dude Explains","section":"Chill Dude Explains"},{"id":"wCxRHueX6jQ","title_pl":"Pompa, która działa dzięki korkom powietrznym","title":"Wirtz pumps are really clever","channel":"Steve Mould","url":"https://www.youtube.com/watch?v=wCxRHueX6jQ","date":"2023-10-10","duration":725,"views":19166829,"section":"Ciekawostki","transcript":"youtube","added":"2026-11-03","tags":["Fizyka","Inżynieria"],"about":"Steve Mould buduje pompę spiralną Wirtza, wyjaśnia, jak sumują się korki powietrzne, i poprawia błąd z filmu o labiryntach.","intro":"Spirala wysokości 20 cm, obracana tak, by co obrót zaczerpnąć trochę wody, potrafi podnieść wodę znacznie wyżej niż sama ma. Steve Mould pokazuje, że działa to dzięki korkom p
