ze skrzypce albo z przyprawami i słodyczą tworzyć elegancki wieczorowy klimat na chłodne dni."},{"t":"Orientalne","d":"Wanilia, ambra, tonka, mirra i benzoes z przyprawami, np. cynamonem. Słodkie, trwałe i mocne; tańsze potrafią przytłaczać otoczenie."},{"t":"Podrodziny: gourmand i owocowe","d":"Gourmand naśladuje coś jadalnego, np. czekoladę z wanilią, i zwykle jest unisex. Jasne owoce dają jasny zapach, a ciemne, jak czarna porzeczka, ciemniejszy."}],"conclusion":"Klasyfikacja jest ogólna i zapachy się przenikają; skup się na klimacie, który lubisz, a nie na terminologii.","factchecks":[{"claim":"Cytrusowe zapachy szybko znikają.","verdict":"prawda","note":"Nuty głowy, m.in. cytrusy, to małe, lekkie cząsteczki, które szybko parują.","p":0,"src":[["Wikipedia (ang.): perfumy - hasło \"Perfume\"","https://en.wikipedia.org/wiki/Perfume"]]},{"claim":"Fougère znaczy po francusku paproć, a chypre to Cypr.","verdict":"prawda","note":"Obie nazwy są francuskie; chypre pochodzi od pierwszej kompozycji z bergamotką i labdanum.","p":[2,3],"src":[["Wikipedia (ang.): rodzina fougère - hasło \"Fougère\"","https://en.wikipedia.org/wiki/Foug%C3%A8re"],["Wikipedia (ang.): rodzina szyprowa - hasło \"Chypre\"","https://en.wikipedia.org/wiki/Chypre"]]},{"claim":"Oud to rodzaj gnijącego drewna.","verdict":"półprawda","note":"Oud powstaje, gdy drzewo Aquilaria broni się przed grzybem i wydziela pachnącą żywicę; to nie zwykłe gnicie.","p":4,"src":[["Wikipedia (ang.): drewno agarowe - hasło \"Agarwood\"","https://en.wikipedia.org/wiki/Agarwood"]]}],"bias":"Przyjemne wprowadzenie, ale opisy są subiektywne, a przykłady to głównie znane marki. Na początku reklama płatnej grupy WhatsApp kanału."},{"id":"f4LQU73Ilxo","title_pl":"Teisco SX-400 i osobliwy świat syntezatorów Teisco","title":"The Peculiar World of Teisco Synthesizers","channel":"Alex Ball","url":"https://www.youtube.com/watch?v=f4LQU73Ilxo","date":"2020-12-29","duration":605,"views":131692,"section":"Technologie","transcript":"youtube","added":"2026-11-04","tags":["Syntezatory","Vintage","Teisco"],"about":"Alex Ball przybliża Teisco SX-400 z 1981 i spekuluje o naklejkach licencji ARP na syntezatorach badge'owanych przez Kawai.","intro":"Alex Ball gra na kilku Teisco z wczesnych lat 80. i skupia się na SX-400 (1981), o którym mało materiałów online. Marka zaczynała od gitar w latach 40., w latach 60. kupił ją Kawai, a pod koniec lat 70. i w połowie 80. Kawai oznaczał nią kilka syntezatorów, m.in. znany 110F.","points":[{"t":"Skąd Teisco","d":"Korzenie w latach 40.: gitary, basy, perkusja, mikrofony, organy. W latach 60. przejęcie przez Kawai; pod koniec 70. i do połowy 80. Kawai używa marki do badge'owania syntezatorów - według autora mniej niż 10 modeli."},{"t":"SX-400 jak Jupiter w garniturze","d":"Z 1981: gruba obudowa, dużo pokręteł. Wygląd przypomina Roland Jupiter-4. Filtry w stylu drabinki Mooga; na tyle naklejka o licencji ARP. Tryby poly + detune suboscylatora i ensemble: od chudego do bardzo grubego brzmienia."},{"t":"Możliwości brzmieniowe","d":"Dwie obwiednie, trzy LFO, PWM, szum, aftertouch i bender. Portamento i glissando; przy glissandzie słychać lekkie cyfrowe schodkowanie."},{"t":"Zagadka patentów ARP","d":"110F i SX-400 mają naklejkę US patent 3,965,789 (klawiatura pressure-sensitive z ARP Pro Soloist / Alan R. Pearlman). SX-400 ma taką klawiaturę, 110F nie - ma PPC i duofonię (inne numery patentów). Autor spekuluje o błędzie numeru lub planowanym aftertouch."},{"t":"110F na finał","d":"Na koniec gra utwór z SX-400 i 110F; 110F uważa za najbardziej znany Teisco synth."}],"conclusion":"Teisco to krótka, niedoceniana linia Kawai z brzmieniem inspirowanym Rolandem/Moogiem/ARP - wart spotlight mimo luk w dokumentacji.","factchecks":[{"claim":"Teisco zostało przejęte przez Kawai w latach 60.","verdict":"prawda","note":"Kawai kupił Teisco w 1967; później markę używano też do instrumentów elektronicznych.","p":0,"src":[["Wikipedia (ang.): Teisco","https://en.wikipedia.org/wiki/Teisco"]]},{"claim":"US patent 3,965,789 dotyczy touch-sensitive keyboard ARP.","verdict":"prawda","note":"Patent Pearlmana dotyczy pressure-sensitive keyboard używanej m.in. w ARP Pro Soloist.","p":3,"src":[["Google Patents: US3965789A","https://patents.google.com/patent/US3965789A/en"],["Wikipedia (ang.): ARP Pro Soloist","https://en.wikipedia.org/wiki/ARP_Pro_Soloist"]]},{"claim":"Teisco SX-400 wyszedł w 1981 jako syntezator Kawai pod marką Teisco.","verdict":"prawda","note":"Źródła o vintage synthach datują SX-400 na początek lat 80. w linii Teisco/Kawai.","p":1,"src":[["Wikipedia (ang.): Teisco","https://en.wikipedia.org/wiki/Teisco"]]}],"bias":"Krótki, spekulatywny odcinek wokół jednego rzadkiego instrumentu; dużo czasu na jam, mało twardych źródeł o patentach."},{"id":"5nW3nJhBHL0","title_pl":"Dlaczego nie ma wzoru na obwód elipsy?","title":"Why is there no equation for the perimeter of an ellipse‽","channel":"Stand-up Maths","url":"https://www.youtube.com/watch?v=5nW3nJhBHL0","date":"2020-09-05","duration":1264,"views":2701258,"section":"Ciekawostki","transcript":"whisper","added":"2026-11-03","tags":["Matematyka"],"about":"Matt Parker porównuje przybliżenia obwodu elipsy, od prostej średniej po wzory Ramanujana, i pokazuje dwa własne.","intro":"Pole elipsy to po prostu pi razy a razy b, ale na jej obwód nie ma prostego, dokładnego wzoru. Matt Parker (Stand-up Maths) zestawia na wykresie błędy kolejnych przybliżeń, chwali geniusz Ramanujana, przedstawia dwa wzory znalezione z pomocą komputera i na koniec przekonuje, że okrąg wcale nie jest pod tym względem wyjątkiem.","points":[{"t":"Pojęcia","d":"a to dłuższa, a b krótsza półoś. Mimośród mówi, jak bardzo elipsa odbiega od okręgu: 0 to okrąg, blisko 1 skrajnie spłaszczona elipsa. Elipsę można narysować sznurkiem zaczepionym o dwa ogniska."},{"t":"Skala porównania","d":"Parker sprawdza stosunek a do b od 1 (okrąg) do 5 i liczy błąd procentowy każdego przybliżenia względem dokładnej wartości."},{"t":"Proste średnie","d":"Średnia arytmetyczna a i b jako promień myli się o 10% dopiero przy stosunku 4,83. Średnia geometryczna wypada znacznie gorzej: ponad 15% błędu już przy 2,63."},{"t":"Średnia kwadratowa","d":"Pierwiastek ze średniej kwadratów a i b bywa w sieci błędnie podawany jako wzór dokładny. To jednak dobre zgrubne przybliżenie: przy stosunku 5 błąd wynosi 7,8%."},{"t":"Pierwszy wzór Ramanujana","d":"pi razy [3(a + b) - pierwiastek z (3a + b)(a + 3b)] daje błędy rzędu tysięcznych części procenta w całym zakresie do 5."},{"t":"Wzór Parkera","d":"Program komputerowy pomógł mu znaleźć wzór z ułamkami 53/3 i 17/35. Do stosunku 2,4 Ramanujan jest lepszy, dalej Parker, a średnio w zakresie 1-5 jego wzór jest ok. 2 razy dokładniejszy. Działa tylko, gdy a jest większe."},{"t":"Drugi wzór Ramanujana","d":"Drugie przybliżenie Ramanujana, oparte na wielkości h, bije oba poprzednie. Parker przyznaje mu wygraną."},{"t":"Leniwe przybliżenie","d":"pi razy (1,2a + 0,75b), bez pierwiastków. Błąd skacze wokół 2,5%, do 5% dochodzi dopiero przy elipsie 75 razy dłuższej niż wysokiej, a nigdy nie przekracza 6,1%."},{"t":"Wartość dokładna","d":"Dokładny obwód daje dopiero nieskończony szereg. Parkerowi wystarczały wyrazy do h do szóstej, a przy dokładnych obliczeniach do h do dziesiątej potęgi."},{"t":"Okrąg też jest nieporządny","d":"Wzór 2 pi r wygląda czysto tylko dlatego, że nieskończony szereg chowamy w symbolu pi. Każdy stosunek osi miałby swoją własną stałą, a pi pozostaje wyjątkowe głównie dla pola."},{"t":"Zakończenie","d":"Sponsor Jane Street, wyzwanie dla widzów na lepszy wzór w Matt Parker's Maths Puzzles i aukcja narysowanej sznurkiem elipsy na cele charytatywne (WaterAid)."}],"conclusion":"Obwód elipsy można tylko przybliżać albo liczyć szeregiem, a w gruncie rzeczy tak samo jest z okręgiem.","factchecks":[{"claim":"Obwodu elipsy nie da się wyrazić prostym wzorem zamkniętym.","verdict":"prawda","note":"Dokładna wartość wymaga całki eliptycznej lub nieskończonego szeregu.","p":[0,8],"src":[["Wikipedia (ang.): obwód elipsy - hasło \"Perimeter of an ellipse\"","https://en.wikipedia.org/wiki/Perimeter_of_an_ellipse"]]},{"claim":"Ramanujan podał dwa bardzo dokładne przybliżenia obwodu elipsy.","verdict":"prawda","note":"Opisał je w pracy o równaniach modularnych i przybliżeniach pi; błąd jest rzędu h^3 i h^5.","p":[4,6],"src":[["Wikipedia (ang.): elipsa - hasło \"Ellipse\"","https://en.wikipedia.org/wiki/Ellipse"]]},{"claim":"Leniwy wzór pi(1,2a + 0,75b) do stosunku 75 myli się najwyżej o ok. 5%.","verdict":"prawda","note":"Własne obliczenie numeryczne: -2,5% dla okręgu, +2,1% przy 2, -3,3% przy 20, -5,0% przy 75.","p":7,"src":[["Wikipedia (ang.): elipsa - hasło \"Ellipse\"","https://en.wikipedia.org/wiki/Ellipse"]]},{"claim":"Liczby pi nie da się zapisać skończonym wyrażeniem, stąd szeregi.","verdict":"prawda","note":"Pi jest niewymierne i przestępne; liczy się je m.in. szeregami nieskończonymi.","p":9,"src":[["Wikipedia (ang.): pi - hasło \"Pi\"","https://en.wikipedia.org/wiki/Pi"]]}],"bias":"Rzetelny i zabawny; wzory Parkera to jego własne propozycje, a nie uznane wyniki. Na końcu reklama sponsora."},{"id":"mRKAxyqwesY","title_pl":"Co krawiec może, a czego nie może poprawić w garniturze","title":"Suit Alterations: What a Tailor Can (& Can't) Do","channel":"Gentleman's Gazette","url":"https://www.youtube.com/watch?v=mRKAxyqwesY","date":"2020-06-19","duration":1239,"views":454508,"section":"Moda","transcript":"whisper","added":"2026-11-03","tags":["Styl","Krawiectwo","Garnitur"],"about":"Gentleman's Gazette przechodzi przez garnitur od ramion po nogawki i mówi, które przeróbki mają sens, a które nie.","intro":"Znajdujesz w lumpeksie piękny garnitur, ale ramiona są za szerokie. Kupić czy odłożyć? Gentleman's Gazette dzieli przeróbki na tak, może i nie, część po części, żeby łatwiej ocenić, czy ubranie da się dopasować.","points":[{"t":"Zmniejszać łatwiej niż powiększać","d":"Drogie i szyte na miarę ubrania mają zapas materiału w szwach, tanie konfekcyjne prawie wcale. Bezpiecznie jest kupić rzecz o rozmiar inną, maksymalnie o dwa."},{"t":"Ramiona: prawie zawsze nie","d":"Zmiana szerokości ramion to wielka operacja. Można najwyżej zdjąć lub dodać watolinę, ale efekt nie będzie taki jak w marynarce od początku tak skrojonej."},{"t":"Rękawy: tak, z zastrzeżeniami","d":"Zwężanie i zmiana długości o ok. 1,3 cm to rutyna. Przy działających dziurkach na mankiecie problem, bo dziurki to nacięcia, których nie da się zaszyć; wtedy zostaje skracanie od ramienia, drożej."},{"t":"Przyszycie guzików na rękawie","d":"Wydaje się proste, ale wielu krawców nie ma sprzętu. Jeden z autorów płaci lokalnie ok. 150 dolarów, a w Nowym Jorku 10 dolarów za guzik."},{"t":"Kołnierz i wgłębienia przy ramieniu: może","d":"Odstający kołnierz można przeciąć na nowo, ale lepiej kupić marynarkę bez tego problemu. Wgłębienia przy wszyciu rękawa krawiec poprawi za ok. 90 dolarów na rękaw, bez gwarancji."},{"t":"Guziki, klapy i poły: nie","d":"Z trzech guzików nie zrobisz dwóch, bo dziurki nie da się czysto zamknąć. Klapę w szpic czasem da się przerobić na wykładaną, odwrotnie nigdy, a zaokrąglanie pół psuje układ guzików."},{"t":"Długość i rozcięcia","d":"Marynarkę można skrócić tylko trochę, wydłużyć nie. Rozcięć z tyłu nie da się dodać, ale istniejące można zaszyć."},{"t":"Spodnie: zwykle tak","d":"Nogawki skrócisz zawsze, wydłużysz o tyle, ile jest zapasu, a z zapasu zrobisz mankiety. Zwężanie to jedna z najłatwiejszych przeróbek; w pasie zwykle jest 5-7,5 cm zapasu. Stanu nie podniesiesz."}],"conclusion":"Poznaj budowę ubrania, sprawdź zapasy w szwach i zważ, jak bardzo kochasz daną rzecz, zanim zapłacisz za przeróbkę.","factchecks":[{"claim":"Przy działających guzikach na rękawie długość rękawa trzeba ustalić z góry.","verdict":"prawda","note":"Wikipedia przy \"surgeon's cuffs\" też zaznacza, że długość rękawa musi być pewna przed wycięciem dziurek.","p":2,"src":[["Wikipedia (ang.): garnitur - hasło \"Suit\"","https://en.wikipedia.org/wiki/Suit"]]},{"claim":"Marynarki mają jedno, dwa albo zero rozcięć z tyłu.","verdict":"prawda","note":"Wikipedia opisuje trzy style: jedno rozcięcie, dwa (brytyjskie) i brak rozcięcia (włoskie).","p":6,"src":[["Wikipedia (ang.): garnitur - hasło \"Suit\"","https://en.wikipedia.org/wiki/Suit"]]},{"claim":"Klapa w szpic jest szersza i bardziej formalna niż wykładana.","verdict":"prawda","note":"Wikipedia opisuje klapę w szpic jako bardziej formalną, typową dla marynarek dwurzędowych.","p":5,"src":[["Wikipedia (ang.): klapa marynarki - hasło \"Lapel\"","https://en.wikipedia.org/wiki/Lapel"]]}],"bias":"Rzeczowy poradnik. Ceny przeróbek są z USA i podane anegdotycznie. Na końcu prowadzący reklamuje dodatki z własnego sklepu Fort Belvedere."},{"id":"TrZyuCh9df0","title_pl":"Jak szybka woda i powietrze \"przeczą\" grawitacji","title":"How fast moving water “defies” gravity","channel":"Steve Mould","url":"https://www.youtube.com/watch?v=TrZyuCh9df0","date":"2019-07-25","duration":592,"views":944304,"section":"Ciekawostki","transcript":"youtube","added":"2026-11-04","tags":["Nauka","Technika"],"about":"Tacka przyklejona do strumienia węża i styropian pod suszarką: spadek ciśnienia w rozchodzącym się płynie unosi przedmiot.","intro":"Steve Mould pokazuje tackę z pudełka hummusu, która przykleja się do silnego strumienia węża skierowanego w dół, oraz styropian zasysany pod suszarką. Tłumaczy to spadkiem gęstości i ciśnienia przy rozchodzeniu się strugi, różnicą względem atmosfery pod spodem i ostrożnie odnosi się do \"Bernoulli\" oraz do efektu blendera ręcznego.","points":[{"t":"Tacka na strumieniu","d":"Przy trybie power jet woda wychodzi małym otworem w płaskiej głowicy. Tacka z dna pudełka hummusu odbija się w górę od strumienia, ale gdy wąż skierować w dół, przykleja się do dyszy zamiast spaść szybciej."},{"t":"Suszarka i styropian","d":"Z suszarką (grzanie wyłączone) i dwiema warstwami styropianu: strumień najpierw odpycha dłoń, a przy odpowiedniej szczelinie górna płyta jest unoszona. Według autora to ten sam mechanizm co przy wodzie."},{"t":"Stałe ciśnienie vs prędkość","d":"Animacja cząstek: jeśli założyć stałe ciśnienie (stałą gęstość) przy rozchodzeniu się powietrza na zewnątrz, trzeba je spowalniać. Bez siły hamującej prędkość zostaje, a gęstość spada ku brzegom - mniej cząstek na jednostkę objętości."},{"t":"Bilans sił","d":"Pod styropianem pełne ciśnienie atmosferyczne pcha w górę; w szczelinie ciśnienie jest niższe; ciężar ciągnie w dół. Gdy różnica ciśnienia zrównoważy ciężar, płyta nie spada. Do efektu potrzeba małego jetu w płaskiej płycie, nie samego końca węża."},{"t":"Bernoulli z dystansem","d":"Autor przyznaje, że ludzie krzyczą \"Bernoulli\", ale woli wyjść od cząstek i gęstości. Zasada Bernoulliego to według niego wynik wyprowadzony z dynamiki płynów: przydatny rachunkowo, mniej intuicyjny jako pierwsze wyjaśnienie."},{"t":"Blender w wiaderderku","d":"Ręczny blender w pojemniku nieco większym niż głowica daje silne ssanie - na wadze podróżnej rząd prawie 1 kg. Łopatki działają jak śmigło i ciągną ciecz w górę; według autora to może być inny efekt, z udziałem napięcia powierzchniowego."}],"conclusion":"Struga rozchodząca się pod płytą obniża ciśnienie na tyle, by zrównoważyć ciężar - bez łamania grawitacji.","factchecks":[{"claim":"Szybki przepływ wiąże się z niższym ciśnieniem (Bernoulli).","verdict":"prawda","note":"Wzdłuż linii prądu wzrost prędkości idzie z spadkiem ciśnienia przy założeniach zasady Bernoulliego.","p":4,"src":[["Wikipedia (ang.): zasada Bernoulliego - hasło \"Bernoulli's principle\"","https://en.wikipedia.org/wiki/Bernoulli%27s_principle"]]},{"claim":"Efekt \"przyklejenia\" do dyszy to wyłącznie Bernoulli.","verdict":"półprawda","note":"Często miesza się Bernoulli, efekt Coandy i lepkość; sam slogan \"Bernoulli\" bywa nadużywany w demonstracjach.","p":3,"src":[["Wikipedia (ang.): efekt Coandy - hasło \"Coandă effect\"","https://en.wikipedia.org/wiki/Coand%C4%83_effect"],["Wikipedia (ang.): zasada Bernoulliego - hasło \"Bernoulli's principle\"","https://en.wikipedia.org/wiki/Bernoulli%27s_principle"]]},{"claim":"Do demonstracji z wężem potrzeba jetu w płaskiej tarczy.","verdict":"prawda","note":"Klasyczne zabawki i dysze \"ball levitators\" używają dyszy w szerszej powierzchni, by powstała strefa niskiego ciśnienia.","p":3,"src":[["Wikipedia (ang.): lewitacja aerodynamiczna - hasło \"Aerodynamic levitation\"","https://en.wikipedia.org/wiki/Aerodynamic_levitation"]]}],"bias":"Autor sam zaznacza niepewność wyjaśnienia. Dobra intuicja cząstkowa; sponsor Skillshare. Blender to osobna hipoteza."},{"id":"yZwfcMSDBHs","title_pl":"Jak działają wieże ciśnień w wodociągach","title":"How Water Towers Work","channel":"Practical Engineering","url":"https://www.youtube.com/watch?v=yZwfcMSDBHs","date":"2018-12-10","duration":659,"views":7417420,"section":"Ciekawostki","transcript":"youtube","added":"2026-11-04","tags":["Technika","Nauka"],"about":"Grady z Practical Engineering: wieża wodna jako magazyn wody i energii, wygładzanie szczytów zużycia i strefy ciśnienia.","intro":"Po źródle i uzdatnieniu woda musi dotrzeć do miasta równo w dzień i w nocy. Autor porównuje noszenie, kanały otwarte i rury z pompami, potem pokazuje, czemu sama pompa dopasowana do średniego zużycia nie wystarcza przy porannym szczycie nawet 5x średniej - i jak podwyższony zbiornik wygładza popyt, trzyma ciśnienie i pomaga przy pożarach oraz blackoucie.","points":[{"t":"Od źródła do kranu","d":"System wodociągowy musi działać non-stop: picie, higiena, gaszenie pożarów. Po znalezieniu i oczyszczeniu wody zostaje rozprowadzenie. Noszenie jest nieefektywne; kanały otwarte idą grawitacją, ale zanieczyszczają się, dzielą teren i nie płyną pod górę."},{"t":"Rury i pompy","d":"Zamknięte rury pozwalają pchać wodę ciśnieniem: płyn idzie od wyższego do niższego ciśnienia, jak prąd od napięcia. Pompą podnosi się ciśnienie (energię) płynu. Duże pompy miejskie są drogie."},{"t":"Szczyt vs średnia","d":"O północy popyt jest niski; rano zraszacze, prysznice i śniadanie windują zużycie. Szczyt godzinowy w dużym mieście bywa nawet 5x średniej dobowej. Same pompy musiałyby być ogromne i ciągle załączane, co je zużywa."},{"t":"Wieża jako bufor","d":"W nocy pompa pracuje pełną parą i napełnia zbiornik. Rano, gdy popyt przewyższa pompę, zabrana woda z wieży pokrywa różnicę. Po południu nadmiar znów ładuje tank; wieczorny szczyt go opróżnia. Magazyn wygładza też ujęcie i stację uzdatniania."},{"t":"Pożary i awarie","d":"Duże, nieprzewidywalne zapotrzebowanie to pożary; normy wymagają rezerwy dla straży. Podwyższony zbiornik trzyma ciśnienie także przy braku prądu, bo \"grawitacja nie spada z burzą\"."},{"t":"Magazyn energii","d":"Wieża to nie tylko litry, lecz też energia potencjalna nadana przez pompy. Przy tańszym prądzie nocnym można pompować w nocy i w dzień zasilać miasto głównie z wieży. Za niskie ciśnienie grozi zanieczyszczeniem przez nieszczelności; za wysokie psuje instalacje."},{"t":"Strefy ciśnienia","d":"Wirtualny \"ocean\" w rurach: nisko w terenie ciśnienie za duże, wysoko - za małe. Miasta dzielą sieć na strefy z własnymi wieżami. Wieżowce często mają własne pompy i zbiorniki (w Nowym Jorku bywa to wymagane). Nie każde miasto używa wież: bywa wystarczające ujęcie powyżej miasta albo same pompy."}],"conclusion":"Podwyższony zbiornik tanią grawitacją wygładza popyt, trzyma ciśnienie i zwiększa niezawodność wodociągów.","factchecks":[{"claim":"Wieże ciśnień magazynują wodę i utrzymują ciśnienie w sieci.","verdict":"prawda","note":"Podwyższony zbiornik zapewnia ciśnienie hydrostatyczne i rezerwę na szczyty oraz awarie pomp.","p":3,"src":[["Wikipedia (ang.): wieża ciśnień - hasło \"Water tower\"","https://en.wikipedia.org/wiki/Water_tower"]]},{"claim":"Szczyt godzinowy bywa nawet 5x średniego dobowego zużycia.","verdict":"prawda","note":"W inżynierii wodociągowej współczynniki szczytu godzinowego często mieszczą się w zakresie kilku krotności średniej.","p":2,"src":[["Wikipedia (ang.): zapotrzebowanie na wodę - hasło \"Water supply network\"","https://en.wikipedia.org/wiki/Water_supply_network"]]},{"claim":"Ciśnienie w sieci rośnie z \"głębokością\" pod powierzchnią hydrauliczna.","verdict":"prawda","note":"W przybliżeniu 10 m słupa wody to ok. 1 bar; wysokość zwierciadła w zbiorniku zadaje ciśnienie w strefie.","p":6,"src":[["Wikipedia (ang.): ciśnienie hydrostatyczne - hasło \"Hydrostatics\"","https://en.wikipedia.org/wiki/Hydrostatics"],["Wikipedia (ang.): wieża ciśnień - hasło \"Water tower\"","https://en.wikipedia.org/wiki/Water_tower"]]}],"bias":"Jasny, dydaktyczny Practical Engineering; bez głębokich liczb projektowych. Sponsor Bombas na końcu."},{"id":"Ruh0B5QKBMs","title_pl":"Historia syntezatorów Prophet - od Sequential Circuits do dziś","title":"The History of the Prophet Synthesizer","channel":"Alex Ball","url":"https://www.youtube.com/watch?v=Ruh0B5QKBMs","date":"2018-10-14","duration":1403,"views":961151,"section":"Technologie","transcript":"youtube","added":"2026-11-04","tags":["Syntezatory","Vintage","Sequential"],"about":"Alex Ball przechodzi linię Prophet: od Prophet-5 i MIDI przez bankructwo Sequential po powrót marki Dave'a Smitha.","intro":"Alex Ball opowiada historię syntezatorów Prophet. Dave Smith z Sequential Circuits połączył analogowe głosy z mikroprocesorem Z80 i pamięcią patchy, tworząc Prophet-5. Film prowadzi przez Prophet-10, 600 (pierwszy z fabrycznym MIDI), T8, VS, bankructwo, erę DSI i powrót nazwy Sequential.","points":[{"t":"Początki Dave'a Smitha","d":"We wczesnych latach 70. Smith kupił Minimooga Model D, zbudował sekwencer Model 600, potem cyfrowy Model 800 (1975) i programator brzmień Model 700 (1976) - wczesną pamięć patchy dla analogów."},{"t":"Prophet-5: przełom 1978","d":"Model 1000, nazwany Prophet-5 za radą Ricka Wakemana, łączył chipy SSM, Z80 i skanowanie klawiatury (licencja E-mu). Patchy zostawały po wyłączeniu - wcześniej niespotykane. Prototyp na NAMM 1978 zebrał setki zamówień."},{"t":"Rewizje i Prophet-10","d":"Rev 1 (~180 szt.), Rev 2 (>1000), Rev 3-3.3 (~5000, chipy Curtis zamiast SSM). Prophet-10 (1980) to dwa Prophet-5 Rev 3: 10 głosów i tryby normal/single/double/alternate/unison. Brad Fiedel użył go m.in. do rytmów w Terminatorze."},{"t":"MIDI i Prophet-600","d":"W 1981-83 Sequential z Rolandem buduje MIDI (Grammy techniczne dla Smitha i Kakehashiego). Prophet-600 (koniec 1982) to pierwszy syntezator z fabrycznym MIDI; hybryda Z80 + analog, dziś często z modem Gligli."},{"t":"T8, 2000, VS","d":"T8 (1983): 8 głosów, ważona klawiatura z aftertouch (<1000 szt.), pechowo obok DX7. Prophet 2000: 12-bitowy sampler. VS (1986): synteza wektorowa, joystick, 4 oscylatory cyfrowe + filtr analogowy."},{"t":"Upadek i powrót","d":"Prophet 3000 prawie nie wyszedł przed bankructwem (Yamaha kupuje Sequential). Smith wraca w 2002 jako DSI (Evolver, Prophet '08, 12, Rev2). Yamaha oddaje nazwę Sequential; Prophet-6, X; w 2018 DSI oficjalnie znów Sequential."}],"conclusion":"Prophet połączył analog i cyfrowe sterowanie, pomógł stworzyć MIDI i wrócił pod starą marką - linia wciąż kształtuje polifoniczne syntezatory.","factchecks":[{"claim":"Prophet-5 był pierwszym polifonicznym analogiem z pamięcią patchy zachowaną po wyłączeniu.","verdict":"prawda","note":"Prophet-5 (1978) wprowadził non-volatile patch memory w polifonicznym analogu i stał się wzorcem.","p":1,"src":[["Wikipedia (ang.): Prophet-5","https://en.wikipedia.org/wiki/Prophet-5"],["Wikipedia (ang.): Sequential (firma)","https://en.wikipedia.org/wiki/Sequential_(company)"]]},{"claim":"Dave Smith i Ikutaro Kakehashi dostali Technical Grammy za MIDI.","verdict":"prawda","note":"Obaj otrzymali Technical Grammy Award w 2013 za rozwój MIDI.","p":3,"src":[["Wikipedia (ang.): MIDI","https://en.wikipedia.org/wiki/MIDI"],["Wikipedia (ang.): Dave Smith (inżynier)","https://en.wikipedia.org/wiki/Dave_Smith_(engineer)"]]},{"claim":"Prophet-600 był pierwszym syntezatorom z fabrycznie zainstalowanym MIDI.","verdict":"prawda","note":"Prophet-600 (1982) jest powszechnie uznawany za pierwszy komercyjny synth z MIDI z fabryki.","p":3,"src":[["Wikipedia (ang.): Sequential (firma) - Prophet-600","https://en.wikipedia.org/wiki/Sequential_(company)"],["Wikipedia (ang.): MIDI","https://en.wikipedia.org/wiki/MIDI"]]},{"claim":"Brad Fiedel użył Prophet-10 przy ścieżce do Terminatora.","verdict":"prawda","note":"Fiedel nagrywał rytmy Terminatora m.in. na Prophet-10; wspomina problemy z mikrokasettą sekwencera.","p":2,"src":[["Wikipedia (ang.): The Terminator (soundtrack)","https://en.wikipedia.org/wiki/The_Terminator_(soundtrack)"]]}],"bias":"Pasjonacka chronologia z naciskiem na Sequential; na końcu promocja książki \"The Prophet from Silicon Valley\"."},{"id":"88X5kL7Gn5A","title_pl":"Jak rozpoznać jakościowy garnitur - 15 cech drogiego kroju","title":"How To Spot A Quality Suit - Hallmarks of Expensive Bespoke Suits For Men - Gentleman's Gazette","channel":"Gentleman's Gazette","url":"https://www.youtube.com/watch?v=88X5kL7Gn5A","date":"2017-11-17","duration":910,"views":467884,"section":"Moda","transcript":"youtube","added":"2026-11-04","tags":["Garnitur","Jakość","Krawiectwo"],"about":"Gentleman's Gazette wymienia 15 cech, po których odróżnisz drogi lub bespoke garnitur od taniego gotowca.","intro":"Sven Raphael Schneider z Gentleman's Gazette pokazuje 15 szczegółów jakości garnituru: od etykiety i zaokrąglonych rogów, przez pick stitching i ręczną pracę, po dopasowanie wzoru, dziurki, zapas tkaniny, guziki i konstrukcję barku. Osobno ma film o tanich garniturach; tu skupia się na hallmarks drogiego kroju.","points":[{"t":"Etykieta i adres","d":"Linie marki (np. Ralph Lauren Purple vs Chaps) zdradzają poziom. \"Custom/bespoke\", Savile Row czy Via Monte Napoleone sugerują droższy poziom. Brak etykiet składu w kieszeniach często oznacza prawdziwy bespoke."},{"t":"Zaokrąglone rogi i pick stitching","d":"Ręczne zaokrąglenie rogów u dołu i rękawów ogranicza strzępienie. Pick stitching kiedyś był tylko ręczny; maszyny AMF go imitują - z tyłu widać różnicę. Włoskie garnitury mają go często bardziej widocznego."},{"t":"Ręczna praca i kanwa","d":"Podszewka i wszycie rękawa ręcznie, nieregularny ścieg, elastyczniejszy ruch. Pod klapą szukaj ściegu od kanwy - daje \"roll\" klapy zamiast płaskiego prasowania. Idealnie pełna kanwa lub brak, bez kleju."},{"t":"Kołnierz i dopasowanie wzoru","d":"Jakościowy kołnierz jest wszyty ręcznie. Przy kratce, paskach czy windowpane wzór powinien się zgadzać na kieszeniach, bokach spodni i plecach; na gładkim suknie tego nie widać."},{"t":"Dziurki i zapas tkaniny","d":"Ręczne dziurki (w tym milanese z podniesioną nicią) vs fraying machine. W spodniach szukaj zapasu 2-3 cm lub więcej na szwach - tanie kroje oszczędzają materiał."},{"t":"Gürze, bark i materiały","d":"Włoskie \"grinze\" (lekkie falowanie) to efekt ręcznego dodania tkaniny. Rogowe, corozo lub masa perłowa z nierównymi otworami biją plastik. Spalla a camicia i hollywood waistband to kolejne znaki wysokiej półki."},{"t":"Monogramy i przykłady","d":"Monogramy i ukryte kieszenie sugerują custom. Autor ma na sobie vintage bespoke z lat 30.: szerokie klapy, trzy kieszenie naszywane, bez rozcięcia, herringbone."}],"conclusion":"Jeden detal nie wystarczy - szukaj zestawu: ręczna praca, kanwa, dopasowany wzór, dobre guziki i zapas tkaniny.","factchecks":[{"claim":"Pełna kanwa bez kleju to cecha lepszego garnituru.","verdict":"prawda","note":"Kanwa zszywana (full canvas) daje lepszy drape niż klejona fuzja; half-canvas to kompromis.","p":2,"src":[["Wikipedia (ang.): kanwa w krawiectwie - hasło \"Interfacing\"","https://en.wikipedia.org/wiki/Interfacing"],["Wikipedia (ang.): garnitur - hasło \"Suit (clothing)\"","https://en.wikipedia.org/wiki/Suit_(clothing)"]]},{"claim":"Savile Row i Via Monte Napoleone to adresy drogiego krawiectwa.","verdict":"prawda","note":"Savile Row w Londynie i Via Monte Napoleone w Mediolanie są znane z luksusowej odzieży męskiej.","p":0,"src":[["Wikipedia (ang.): Savile Row","https://en.wikipedia.org/wiki/Savile_Row"],["Wikipedia (ang.): Via Monte Napoleone","https://en.wikipedia.org/wiki/Via_Monte_Napoleone"]]},{"claim":"Spalla a camicia to bark zszyty jak w koszuli, typowy dla włoskiego bespoke.","verdict":"prawda","note":"Spalla camicia to technika włoska z charakterystycznym, miękkim szwem barku.","p":5,"src":[["Wikipedia (ang.): marynarka - hasło \"Jacket\"","https://en.wikipedia.org/wiki/Jacket"]]}],"bias":"Perspektywa miłośnika bespoke i vintage; promocja Fort Belvedere. Tanie garnitury oceniane głównie przez pryzmat detali ręcznych."},{"id":"ZQzvKaqu8gY","title_pl":"Jak powinien leżeć garnitur - przewodnik po dopasowaniu","title":"How A Suit Should Fit - Men's Suits Fit Guide - Gentleman's Gazette","channel":"Gentleman's Gazette","url":"https://www.youtube.com/watch?v=ZQzvKaqu8gY","date":"2017-09-15","duration":871,"views":576796,"section":"Moda","transcript":"youtube","added":"2026-11-04","tags":["Garnitur","Dopasowanie","Krawiectwo"],"about":"Gentleman's Gazette tłumaczy podstawy dopasowania marynarki i spodni, żeby garnitur wyglądał i leżał komfortowo.","intro":"Sven Raphael Schneider z Gentleman's Gazette w pierwszej części serii o dopasowaniu garnituru przechodzi przez kołnierz, ramiona, dziurki na rękawy, klatkę, rozcięcia, długość i rękawy. Tłumaczy, czemu dobry krój ukrywa asymetrię ciała i daje sylwetkę w kształcie V, oraz kiedy lepiej odłożyć gotowy egzemplarz zamiast go przerabiać.","points":[{"t":"Czym jest garnitur","d":"To marynarka i spodnie z tej samej tkaniny; z kamizelką to trzyczęściowy. Blazer, sport coat czy tweed to już zestawienie, nie garnitur. Dobry krój ma być prawie tak wygodny jak dres."},{"t":"Kołnierz marynarki","d":"Ma ściśle przylegać do koszuli bez odstawania. Przy okrągłych barkach częściej się odchyla. Test: ruchy rąk, siadanie i picie - kołnierz ma zostać przy koszuli. Odstający da się poprawić u krawca."},{"t":"Ramiona i dziurki","d":"Szew barkowy lekko wystaje poza kość (ok. 1 cm), nie jak w koszuli. Fałdy na barku oznaczają za duży rozmiar i prawie nie da się tego zmienić. Za duże dziurki przesuwają całą marynarkę przy ruchu; ciasne tuż pod pachą dają swobodę."},{"t":"Klatka i drapowanie","d":"Pełniejsza klatka z drapowaniem podkreśla V; zbyt ciasna łamie klapy i daje pionowe fałdy. W Europie rozmiar 50 to ok. 100 cm w klatce, ale marki różnią się krojem - liczy się przymiarka."},{"t":"Rozcięcia i długość","d":"Boczne, wysokie rozcięcia kończące się przy kieszeni są najkorzystniejsze. Długości nie warto skracać: kieszenie i guzik przesuną proporcje. Idealnie odcinek od karku do dołu marynarki równa się odcinkowi od dołu do spodu spodni."},{"t":"Rękawy i wygoda","d":"Rękaw ma spadać gładko; zagniecenia często oznaczają złą \"pitch\". U góry rękawa potrzeba trochę luzu, by sięgnąć do przodu - wąskie slim fit często tego nie dają. Mała dziurka plus szerszy górny rękaw = komfort."},{"t":"Przykład autora","d":"Pokazuje trzyczęściowy garnitur z Harrisons of Edinburgh: piesza zęba, kieszenie naszywane, action back ze strzałkami, spodnie na szelki z fishtail i mankietami, dziurka milanese."}],"conclusion":"Najpierw oceniaj kołnierz, barki, dziurki i długość; tego nie da się łatwo \"dociągnąć\" u krawca, a komfort i proporcje robią wrażenie.","factchecks":[{"claim":"Europejski rozmiar 50 odpowiada ok. 100 cm w klatce.","verdict":"prawda","note":"W systemie EU rozmiar marynarki to obwód klatki w cm dzielony przez 2 (50 = 100 cm).","p":3,"src":[["Wikipedia (ang.): rozmiary odzieży - hasło \"Clothing sizes\"","https://en.wikipedia.org/wiki/Clothing_sizes"]]},{"claim":"Rozcięcia z tyłu marynarki powstały pod jazdę konną.","verdict":"prawda","note":"Historycznie tylne rozcięcia ułatwiały jazdę; dziś dominują boczne ze względów estetycznych i ruchu.","p":4,"src":[["Wikipedia (ang.): marynarka - hasło \"Suit (clothing)\"","https://en.wikipedia.org/wiki/Suit_(clothing)"]]},{"claim":"Tradycyjnie marynarka ma zakrywać pośladki.","verdict":"prawda","note":"Klasyczna długość zakrywa pośladki; krótsze kroje to nowsza moda, krytykowana przez tradycjonalistów.","p":4,"src":[["Wikipedia (ang.): marynarka - hasło \"Suit (clothing)\"","https://en.wikipedia.org/wiki/Suit_(clothing)"]]}],"bias":"Autor promuje własną markę Fort Belvedere i estetkę klasyczną/bespoke; gotowe slim fit ocenia surowo."}], FEAT={"date": "2026-11-04", "ids": ["qpRGnTTcLpo", "wCxRHueX6jQ", "9J30xtK5RL0", "1qEPZT1FQs0", "GBX3rgsmQbw", "LpeDuC2sQ-w"]};

function slug(n){for(var i=0;i<SECS.length;i++)if(SECS[i][1]===n)return SECS[i][0];return 'pozostale'}
function featured(){var ids=(FEAT&&FEAT.ids)||[],out=ids.filter(function(id){return BY[id]}).map(function(id){return BY[id]});if(out.length)return out;var seen={};return V.filter(function(v){var k=slug(v.section);if(seen[k]||isRead(v.id)||rating(v.id)<0)return false;seen[k]=1;return true}).slice(0,6)}
function secList(k){return k==='polecane'?featured():V.filter(function(v){return slug(v.section)===k})}
function chips(){$('secs').innerHTML=SECS.map(function(x){var n=secList(x[0]).filter(function(v){return !isRead(v.id)}).length;return '<a class="chip" href="#s='+x[0]+'" data-s="'+x[0]+'"'+(x[0]===sec?' aria-current="true"':'')+'>'+esc(x[1])+(n?' <span class="n" aria-label="nieprzeczytane: '+n+'">'+n+'</span>':'')+'</a>'}).join('');var c=$('secs').querySelector('[aria-current]');if(c&&c.scrollIntoView&&chips.done!==sec){chips.done=sec;var r=c.getBoundingClientRect(),w=$('secs').getBoundingClientRect();if(r.left<w.left||r.right>w.right)$('secs').scrollLeft+=r.left-w.left-16}}
var BY={};V.forEach(function(v){BY[v.id]=v});
var ui=lsGet(LSU,{});if(ui.sec&&SN[ui.sec])sec=ui.sec;['fr','so'].forEach(function(k){if(ui[k]!=null&&$(k).querySelector('option[value="'+ui[k]+'"]'))$(k).value=ui[k]});
var VK={'prawda':'v-prawda','półprawda':'v-polprawda','przesada':'v-przesada','fałsz':'v-falsz','nie da się sprawdzić':'v-nds'};
var LEG=['prawda','półprawda','przesada','fałsz','nie da się sprawdzić'];
var WORST=['fałsz','przesada','półprawda','nie da się sprawdzić','prawda'];

function thumb(v){return 'thumbs/'+encodeURIComponent(v.id)+'.jpg'}
var FB="this.onerror=null;this.src='https://i.ytimg.com/vi/'+this.getAttribute('data-id')+'/hqdefault.jpg'";
function srcHtml(s){var n=String(s[0]),i=n.indexOf(' - hasło "'),main=i>0?n.slice(0,i):n;
 main=main.replace(/^Wikipedia \(ang\.\): /,'Wikipedia: ');
 return '<a href="'+esc(s[1])+'" target="_blank" rel="noopener">'+esc(main)+'</a>'}
function pIdx(f){return f.p==null?[]:(Array.isArray(f.p)?f.p:[f.p])}
function worst(fs){for(var i=0;i<WORST.length;i++)for(var j=0;j<fs.length;j++)if(fs[j].verdict===WORST[i])return WORST[i];return null}
function counts(v){var cnt={};(v.factchecks||[]).forEach(function(f){cnt[f.verdict]=(cnt[f.verdict]||0)+1});var used=LEG.filter(function(k){return cnt[k]});return {cnt:cnt,used:used,lab:used.map(function(k){return k+': '+cnt[k]}).join(', ')}}
function vbar(v){var c=counts(v);if(!c.used.length)return '';return '<div class="vbar" role="img" aria-label="Prawdomówność, werdykty: '+esc(c.lab)+'" title="'+esc(c.lab)+'">'+c.used.map(function(k){return '<b class="'+VK[k]+'" style="flex:'+c.cnt[k]+'"></b>'}).join('')+'</div>'}
var FXN=0;
function badges(fs){if(!fs.length)return '';
 return '<div class="fcs">'+fs.map(function(f){var k=VK[f.verdict]||'v-nds',id='fx'+(++FXN);
  return '<button class="bdg" type="button" aria-expanded="false" aria-controls="'+id+'" data-fx="'+id+'"><i class="dot '+k+'" aria-hidden="true"></i>'+esc(f.verdict)+' <span class="chev" aria-hidden="true">▾</span></button>'}).join('')+'</div>'+
 fs.map(function(f,i){var k=VK[f.verdict]||'v-nds',id='fx'+(FXN-fs.length+1+i);
  return '<div class="fx '+k+'" id="'+id+'" hidden><p class="cl">'+esc(f.claim)+'</p><p class="nt">'+esc(f.note)+'</p>'+((f.src||[]).length?'<p class="sr">Źródła: '+f.src.map(srcHtml).join(' ')+'</p>':'')+'</div>'}).join('')}
function tile(v){var r=isRead(v.id),g=rating(v.id);
 return '<a class="tile'+(r?' read':'')+(g>0?' up':g<0?' down':'')+'" href="#v='+esc(v.id)+'" data-id="'+esc(v.id)+'">'+
 '<div class="th"><img src="'+thumb(v)+'" data-id="'+esc(v.id)+'" onerror="'+FB+'" loading="lazy" decoding="async" width="640" height="360" alt="">'+
 '<span class="dur">'+fdur(v.duration)+'</span><span class="rd">✓ Przeczytane</span><span class="prog"></span>'+(g?'<span class="rt" title="'+(g>0?'Łapka w górę':'Łapka w dół')+'">'+ico(UPF,'',g<0)+'</span>':'')+'</div>'+
 vbar(v)+'<h2>'+esc(v.title_pl||v.title)+'</h2>'+
 '<p class="meta">'+fdate(v.date)+' · '+fviews(v.views)+'</p></a>'}
function rateHtml(id){var g=rating(id);
 return '<div class="rate" role="group" aria-label="Ocena filmu">'+
 '<button class="rb" id="rup" type="button" data-id="'+esc(id)+'" data-v="1" aria-pressed="'+(g>0)+'" aria-label="Łapka w górę" title="Łapka w górę">'+ico(UP,'off')+ico(UPF,'on')+'</button>'+
 '<button class="rb" id="rdn" type="button" data-id="'+esc(id)+'" data-v="-1" aria-pressed="'+(g<0)+'" aria-label="Łapka w dół" title="Łapka w dół">'+ico(UP,'off',1)+ico(UPF,'on',1)+'</button></div>'}
function rich(s){return String(s||'').split(/\n\s*\n/).map(function(x){return '<p>'+esc(x.trim()).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')+'</p>'}).join('')}
function body(v){
 var c=counts(v), pts=v.points||[], fc=v.factchecks||[], r=isRead(v.id);
 var by=pts.map(function(){return []}), rest=[];FXN=0;
 fc.forEach(function(f){var ix=pIdx(f).filter(function(i){return i>=0&&i<pts.length});if(!ix.length)rest.push(f);else ix.forEach(function(i){by[i].push(f)})});
 return '<div class="mh">'+rateHtml(v.id)+'<button class="x" id="x" type="button">Zamknij ✕</button></div>'+
 '<img class="mimg" src="'+thumb(v)+'" data-id="'+esc(v.id)+'" onerror="'+FB+'" width="640" height="360" alt="">'+
 '<div class="mb"><h2 id="mt">'+esc(v.title_pl||v.title)+'</h2>'+
 '<p class="mmeta">'+(v.channel?esc(v.channel)+' · ':'')+fdate(v.date)+' · '+fdur(v.duration)+' min</p>'+
 '<div class="lead">'+rich(v.intro||v.about)+'</div>'+
 '<ol class="pts">'+pts.map(function(p,i){return '<li><h3>'+esc(p.t)+'</h3><div class="pd">'+rich(p.d)+'</div>'+badges(by[i])+'</li>'}).join('')+'</ol>'+
 '<section class="blk concl"><h3>Wniosek autora</h3>'+rich(v.conclusion)+badges(rest)+'</section>'+
 (v.bias?'<section class="blk bias"><h3>Przekłamania i stronniczość</h3><p>'+esc(v.bias)+'</p></section>':'')+
 '<div class="mfoot">'+
 '<p class="orig">Oryginał: <a href="'+esc(v.url)+'" target="_blank" rel="noopener">'+esc(v.title)+'</a> · '+fviews(v.views)+'</p>'+
 '<div class="tags">'+(v.tags||[]).map(function(t){return '<button class="tag" type="button" data-tag="'+esc(t)+'">#'+esc(t.toLowerCase())+'</button>'}).join('')+'</div>'+
 (c.used.length?vbar(v)+'<div class="legend" aria-label="Legenda werdyktów">'+c.used.map(function(k){return '<span><i class="'+VK[k]+'"></i>'+esc(k)+': '+c.cnt[k]+'</span>'}).join('')+'</div><p class="small">Kliknij werdykt przy punkcie, by zobaczyć sprawdzenie i źródła.</p>':'')+
 (v.transcript==='whisper'?'<p class="small">Transkrypt z rozpoznawania mowy, możliwe błędy w nazwach.</p>':'')+
 '<button class="ur" id="ur" type="button" data-id="'+esc(v.id)+'">'+(r?'Oznacz jako nieprzeczytane':'Oznacz jako przeczytane')+'</button>'+
 '</div></div>'}
function render(){
 var q=norm($('q').value).trim().split(/\s+/).filter(Boolean), fr=$('fr').value, so=$('so').value;
 lsSet(LSU,{sec:sec,fr:fr,so:so});
 chips();
 var base=q.length?V:secList(sec);
 $('sinfo').textContent=q.length?'Wyniki ze wszystkich sekcji':(sec==='polecane'&&FEAT&&FEAT.date?'Wybór na '+fdate(FEAT.date):'');
 var list=base.filter(function(v){
  if(fr==='read'&&!isRead(v.id))return false; if(fr==='unread'&&isRead(v.id))return false; if(fr==='liked'&&rating(v.id)<=0)return false; if(fr==='nodown'&&rating(v.id)<0)return false;
  for(var i=0;i<q.length;i++)if(v._s.indexOf(q[i])<0)return false; return true});
 if(!(sec==='polecane'&&!q.length&&so==='new'))list.sort(function(a,b){return so==='pop'?(b.views||0)-(a.views||0):so==='old'?(a.date<b.date?-1:a.date>b.date?1:0):(a.date<b.date?1:a.date>b.date?-1:0)});
 $('list').innerHTML=list.length?list.map(tile).join(''):'<p class="empty">Brak filmów dla tych filtrów.</p>';
 var u=$('ur');if(u){var r=isRead(u.getAttribute('data-id'));u.textContent=r?'Oznacz jako nieprzeczytane':'Oznacz jako przeczytane'}
 ['rup','rdn'].forEach(function(k){var b=$(k);if(b){var g=rating(b.getAttribute('data-id'));b.setAttribute('aria-pressed',String(k==='rup'?g>0:g<0))}});
}
function setRead(id,r){state[id]={r:r,t:Date.now()};lsSet(LS,state);lsSet(LSD,true);render();schedulePush()}
function setRate(id,val){var nv=rating(id)===val?0:val;rates[id]={v:nv,t:Date.now()};lsSet(RLS,rates);lsSet(RLSD,true);render();schedulePush(2000)}
// modal + historia: #v=ID
var cur=null, pushed=false, lastFocus=null;
function hashId(){var m=/^#v=([\w-]+)$/.exec(location.hash);return m&&BY[m[1]]?m[1]:null}
function openM(id){
 var v=BY[id];if(!v)return;
 if(cur!==id){$('dlg').innerHTML=body(v);$('ov').scrollTop=0}
 cur=id;$('ov').classList.add('on');$('ov').setAttribute('aria-hidden','false');document.body.classList.add('lock');
 document.title=(v.title_pl||v.title)+' - Streszczenia YouTube';
 if(!isRead(id))setRead(id,true);
 var x=$('x');if(x)x.focus({preventScroll:true});
}
function closeM(){
 if(!cur)return;var id=cur;cur=null;
 $('ov').classList.remove('on');$('ov').setAttribute('aria-hidden','true');document.body.classList.remove('lock');
 document.title='Streszczenia YouTube';
 var t=document.querySelector('.tile[data-id="'+id+'"]');if(t)t.focus({preventScroll:true});
}
function requestClose(){
 if(pushed){pushed=false;history.back()}
 else{history.replaceState(null,'',location.pathname+location.search+'#s='+sec);closeM()}
}
function hashSec(){var m=/^#s=([\w-]+)$/.exec(location.hash);return m&&SN[m[1]]?m[1]:null}
function route(){var id=hashId();if(id){openM(id);return}var k=hashSec();if(k&&k!==sec){sec=k;$('q').value='';render();window.scrollTo(0,0)}closeM()}
window.addEventListener('hashchange',route);
window.addEventListener('popstate',function(){if(!hashId())pushed=false;route()});
$('list').addEventListener('click',function(e){
 var t=e.target.closest('.tile');if(!t)return;
 if(e.metaKey||e.ctrlKey||e.shiftKey||e.button)return;
 e.preventDefault();var id=t.getAttribute('data-id');
 if(hashId()!==id){history.pushState(null,'','#v='+id);pushed=true}
 openM(id);
});
$('ov').addEventListener('click',function(e){
 if(e.target===$('ov')){requestClose();return}
 var g=e.target.closest('.bdg');if(g){var fx=$(g.getAttribute('data-fx'));var o=g.getAttribute('aria-expanded')!=='true';g.setAttribute('aria-expanded',o?'true':'false');if(fx)fx.hidden=!o;return}
 var rb=e.target.closest('.rb');if(rb){setRate(rb.getAttribute('data-id'),+rb.getAttribute('data-v'));return}
 var b=e.target.closest('.x,.ur,.tag');if(!b)return;
 if(b.classList.contains('x'))requestClose();
 else if(b.classList.contains('ur')){var id=b.getAttribute('data-id');setRead(id,!isRead(id))}
 else if(b.classList.contains('tag')){$('q').value=b.getAttribute('data-tag');requestClose();render();window.scrollTo(0,0)}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&cur){e.preventDefault();requestClose()}});
var tm;$('q').addEventListener('input',function(){clearTimeout(tm);tm=setTimeout(render,150)});
['fr','so'].forEach(function(k){$(k).addEventListener('change',render)});
$('secs').addEventListener('click',function(e){var c=e.target.closest('.chip');if(!c)return;e.preventDefault();var k=c.getAttribute('data-s');
 if(location.hash!=='#s='+k)history.pushState(null,'','#s='+k);pushed=false;sec=k;$('q').value='';render();window.scrollTo(0,0)});
function setSync(ok,msg){var s=$('sync');s.className='sync '+(ok?'ok':'off');s.textContent=msg}
function hhmm(){var d=new Date();return (d.getHours()<10?'0':'')+d.getHours()+':'+(d.getMinutes()<10?'0':'')+d.getMinutes()}
function req(url,opt,ms){
 var ctl=window.AbortController?new AbortController():null; opt=opt||{}; if(ctl)opt.signal=ctl.signal;
 var to=setTimeout(function(){if(ctl)ctl.abort()},ms||8000);
 return fetch(url,opt).then(function(r){clearTimeout(to);if(!r.ok)throw new Error('HTTP '+r.status);return r.text()})}
function pull(K){return req(API+encodeURIComponent(K||KEY)+'?_='+Date.now(),{cache:'no-store'}).then(function(t){t=(t||'').trim();if(!t)return {};var o=JSON.parse(t);if(typeof o!=='object'||!o)throw new Error('zły format');return o})}
function write(obj,K){return req(API+'update',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'key='+encodeURIComponent(K||KEY)+'&value='+encodeURIComponent(JSON.stringify(obj))}).then(function(t){var o=JSON.parse(t);if(o.status!==1)throw new Error('zapis odrzucony')})}
var busy=false, again=false, pt;
function schedulePush(ms){clearTimeout(pt);pt=setTimeout(sync,ms||600)}
function sync(){
 if(busy){again=true;return}
 busy=true;clearTimeout(pt);
 function one(K,obj,ls,lsd){return pull(K).then(function(remote){
  if(merge(obj,remote)){lsSet(ls,obj);render()}
  if(!same(obj,remote)||lsGet(lsd,false))return write(obj,K).then(function(){lsSet(lsd,false)});
 })}
 Promise.all([one(KEY,state,LS,LSD),one(RKEY,rates,RLS,RLSD)]).then(function(){setSync(true,'zsynchronizowano '+hhmm())},function(){setSync(false,'offline - zapis lokalny')})
 .then(function(){busy=false;if(again){again=false;sync()}});
}
if(hashSec())sec=hashSec();render();route();
function seed(f,obj,ls){return req(f+'?_='+Date.now(),{cache:'no-store'},5000).then(function(t){var o=JSON.parse(t||'{}');if(merge(obj,o)){lsSet(ls,obj);render()}}).catch(function(){})}
Promise.all([seed('read.json',state,LS),seed('ratings.json',rates,RLS)]).then(sync);
document.addEventListener('visibilitychange',function(){if(!document.hidden||lsGet(RLSD,false)||lsGet(LSD,false))sync()});
window.addEventListener('online',sync);
setInterval(function(){if(!document.hidden)sync()},120000);
})();
</script>
</body>
</html>
