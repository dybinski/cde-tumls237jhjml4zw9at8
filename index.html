sposobów Inuitów, upadek rynku kości morsa i wyjazd młodych na Islandię."},{"t":"1. Sumeryjska lista królów","d":"Gliniane tabliczki sprzed ok. 4000 lat wymieniają królów Sumeru sprzed potopu z panowaniami po 43 200, 36 000 i 28 800 lat, łącznie ponad 240 tys. lat. Po potopie liczby spadają do 1200, 900, 300 i w końcu do normalnych. To był oficjalny dokument państwowy, a potop przypomina ten z Biblii i Eposu o Gilgameszu."}],"conclusion":"Nawet dobrze opisane cywilizacje mają luki, a niektóre zagadki mogą pozostać nierozwiązane na zawsze.","factchecks":[{"claim":"Rok 536: mgła zasłoniła słońce, zimno i głód.","verdict":"prawda","note":"Potwierdzają to rdzenie lodowe, słoje drzew i relacja Prokopiusza.","src":[["Wikipedia (ang.): zima wulkaniczna 536 r. - hasło \"Volcanic winter of 536\"","https://en.wikipedia.org/wiki/Volcanic_winter_of_536"],["Science: najgorszy rok w historii","https://www.science.org/content/article/why-536-was-worst-year-be-alive"]],"p":0},{"claim":"Roopkund: dwie grupy zginęły ok. 1000 lat od siebie, wszyscy od gradu.","verdict":"półprawda","note":"DNA (2019) pokazało grupy z VII-X w. i XVII-XX w., co podważa tezę o jednym gradobiciu.","src":[["Harney i in. 2019, Nature Communications","https://www.nature.com/articles/s41467-019-11357-9"],["Wikipedia (ang.): jezioro Roopkund - hasło \"Roopkund\"","https://en.wikipedia.org/wiki/Roopkund"]],"p":1},{"claim":"Upadek epoki brązu: upadły niemal wszystkie państwa naraz.","verdict":"półprawda","note":"Upadli Hetyci, Mykeny i Ugarit, ale Egipt i Asyria przetrwały osłabione.","src":[["Wikipedia (ang.): upadek epoki brązu - hasło \"Late Bronze Age collapse\"","https://en.wikipedia.org/wiki/Late_Bronze_Age_collapse"]],"p":2},{"claim":"Rzymskie dwunastościany: żaden tekst o nich nie wspomina.","verdict":"prawda","note":"Znaleziono ponad 100 egzemplarzy, głównie w północno-zachodniej części imperium; brak wzmianek w tekstach, a funkcja jest nieznana.","src":[["Wikipedia (ang.): rzymski dwunastościan - hasło \"Roman dodecahedron\"","https://en.wikipedia.org/wiki/Roman_dodecahedron"]],"p":3},{"claim":"Miedziany Zwój: 1952, 64 skrytki, niczego nie znaleziono.","verdict":"prawda","note":"Zgodne ze źródłami. Badacze spierają się, czy to realna lista skarbów Świątyni, czy folklor.","src":[["Wikipedia (ang.): Miedziany Zwój - hasło \"Copper Scroll\"","https://en.wikipedia.org/wiki/Copper_Scroll"]],"p":4},{"claim":"Kofun: ponad 160 tys. kurhanów, Daisen większy od Wielkiej Piramidy, zakaz badań.","verdict":"prawda","note":"Daisen jest większy od Wielkiej Piramidy, ale od 2018 r. dopuszczono ograniczone wykopaliska.","src":[["Wikipedia (ang.): kurhan Daisen - hasło \"Daisen Kofun\"","https://en.wikipedia.org/wiki/Daisen_Kofun"],["Wikipedia (ang.): kurhany kofun - hasło \"Kofun\"","https://en.wikipedia.org/wiki/Kofun"]],"p":5},{"claim":"Sylfion był wart srebra, a tożsamość rośliny zaginęła na zawsze.","verdict":"półprawda","note":"Anegdoty są od Pliniusza, ale w 2021 r. zaproponowano identyfikację rośliny (sporną), więc nie \"na zawsze\".","src":[["Wikipedia (ang.): sylfion - hasło \"Silphium\"","https://en.wikipedia.org/wiki/Silphium"],["Miski 2021, Plants (PMC)","https://pmc.ncbi.nlm.nih.gov/articles/PMC7825337/"]],"p":6},{"claim":"Lokalizacja Akadu jest nieznana.","verdict":"prawda","note":"Mimo wielu propozycji miasta nie zlokalizowano.","src":[["Wikipedia (ang.): miasto Akad - hasło \"Akkad (city)\"","https://en.wikipedia.org/wiki/Akkad_(city)"]],"p":7},{"claim":"Grenlandia: ostatni zapis 1408 r., 5000 osadników, odrzucili sposoby Inuitów.","verdict":"półprawda","note":"Ślub z 1408 r. się zgadza, ale osadników było ok. 2000-2500 i jedli dużo foki.","src":[["Wikipedia (ang.): osadnictwo nordyckie w Ameryce i na Grenlandii - hasło \"Norse colonization of the Americas / Greenland\"","https://en.wikipedia.org/wiki/Norse_colonization_of_North_America"],["Smithsonian: dlaczego zniknęli","https://www.smithsonianmag.com/history/why-greenland-vikings-vanished-180962119/"]],"p":8},{"claim":"Liczb panowań z Sumeryjskiej listy królów nikt nie wyjaśnił.","verdict":"półprawda","note":"Liczby to wielokrotności sar (3600) w systemie sześćdziesiątkowym; lista łączy mit z historią.","src":[["Wikipedia (ang.): Sumeryjska lista królów - hasło \"Sumerian King List\"","https://en.wikipedia.org/wiki/Sumerian_King_List"]],"p":9}],"bias":"Dobrze dobrane tematy, ale przesadza z \"nierozwiązanymi zagadkami\": dla kilku (Roopkund, sylfion, lista królów) jest postęp, który film pomija lub umniejsza.","channel":"Chill Dude Explains","section":"Chill Dude Explains"},{"id":"MgswDy8PMAA","title_pl":"Czym jest rachatłukum? Prawdziwy osmański przepis","title":"What is Turkish Delight? How to make real Ottoman Turkish Delight.","channel":"Tasting History with Max Miller","url":"https://www.youtube.com/watch?v=MgswDy8PMAA","date":"2025-12-09","duration":1379,"views":4036962,"section":"Historia","transcript":"youtube","added":"2026-11-03","tags":["Historia"],"about":"Max Miller robi rachatłukum według osmańskiego przepisu z 1844 r. i opowiada historię słodyczy od pałacu sułtana po Narnię.","intro":"Max Miller z Tasting History zaczyna od Edmunda z Opowieści z Narnii, który zdradza rodzeństwo za rachatłukum. Gotuje słodycz według przepisu Mehmeda Kâmila z 1844 r., z wodą różaną i piżmem, a w trakcie opowiada o teoriach pochodzenia, cukierniku Hacı Bekirze, sporze z Grekami, relacjach podróżników i podróbkach z Anglii.","points":[{"t":"Edmund i Narnia","d":"Akcja Lwa, czarownicy i starej szafy toczy się w czasie wojny, gdy cukier w Wielkiej Brytanii był racjonowany. Nic dziwnego, że Edmund chciał kawałka cukru obsypanego cukrem pudrem."},{"t":"Przepis z 1844 r.","d":"Po osmańsku słodycz nazywała się rahat ul-hulkum, \"ukojenie gardła\". Długo tajne pałacowe przepisy ujawnił w 1844 r. Mehmed Kâmil: syrop z 1 kg cukru i 3 kg wody, skrobia, woda różana z ziarnkiem piżma, tacka natłuszczona olejem migdałowym i obtoczenie w skrobi z cukrem pudrem."},{"t":"Wersja domowa","d":"Autor zmniejsza przepis do 700 g cukru, 350 ml wody, 3,5 g kwasku cytrynowego (zapobiega krystalizacji), 140 g skrobi w 1 l wody, łyżki wody różanej i 1/8 łyżeczki płynnego piżma spożywczego, które pachnie mu jak czyste pranie."},{"t":"Godziny mieszania","d":"Syrop podgrzewa się powoli do ok. 121°C (stadium twardej kuli), dodaje rozmieszaną skrobię i gotuje na małym ogniu 1,5-2 godziny, aż masa zrobi się bursztynowa. Dawniej 2 osoby mieszały na zmianę 2-3 godziny; potem masę studzi się w formie 28 x 18 cm co najmniej 5 godzin."},{"t":"Lekarstwo czy pudding","d":"W XV w. na Bliskim Wschodzie lokum oznaczało leki mieszane z cukrem i wodą różaną, a z czasem lek usunięto. Inna teoria wywodzi słodycz od budyniu helva, a legenda przypisuje ją XVII-wiecznemu poecie Nevizâde Atâyî; autor zaznacza, że dokumentów na to brak."},{"t":"Hacı Bekir","d":"Firma cukiernika Hacı Bekira, działająca do dziś, twierdzi, że współczesną wersję wymyślił w 1777 r. w Stambule. Sułtan Mahmud II tak lubił jego różaną, pomarańczową i pistacjową wersję, że mianował go nadwornym cukiernikiem."},{"t":"Spór z Grekami","d":"Grecy twierdzą, że słodycz wymyślono na Cykladach. Według autora raczej przywieźli ją uchodźcy z Chios na Syros w latach 20. XIX w.; w 1832 r. było tam już kilku producentów loukoumi z mastyksem."},{"t":"Relacje podróżników","d":"Lekarz marynarki USA James De Kay w latach 30. XIX w. zachwycał się masą, która rozpływa się w ustach, a markiza Londonderry nie odważyła się spróbować \"lumps of delight\". Ta angielska nazwa przyjęła się, a u Dickensa w Tajemnicy Edwina Drooda Rosa kupuje je w sklepie."},{"t":"Podróbki z żelatyną","d":"Import był drogi, więc w Anglii robiono podróbki, np. przepis z 1897 r. z żelatyną, przez co słodycz była gumowata. W 1888 r. w procesie o podrabiane rachatłukum sędzia był \"boleśnie zaskoczony\", że nie pochodzi ono z Turcji."},{"t":"Ocena","d":"Prawdziwe rachatłukum trzeba ugryźć raz czy dwa i zaczyna się rozpuszczać. Piżmo według autora równoważy mydlany posmak wody różanej; poleca też wersje z pistacjami, wanilią czy wodą z kwiatu pomarańczy."}],"conclusion":"Prawdziwe rachatłukum nie ma żelatyny i rozpływa się w ustach; najlepiej kupić je w Turcji lub Grecji albo zrobić samemu.","factchecks":[{"claim":"W czasie II wojny światowej cukier w Wielkiej Brytanii był racjonowany.","verdict":"prawda","note":"Cukier objęto kartkami od stycznia 1940 r. do 1953 r.","p":0,"src":[["Wikipedia (ang.): racjonowanie w Wielkiej Brytanii - hasło \"Rationing in the United Kingdom\"","https://en.wikipedia.org/wiki/Rationing_in_the_United_Kingdom"]]},{"claim":"Mehmed Kâmil wydał w 1844 r. jedną z pierwszych osmańskich książek kucharskich.","verdict":"prawda","note":"Melceü't-Tabbâhîn z 1844 r. uchodzi za pierwszą drukowaną turecką książkę kucharską.","p":1,"src":[["Wikipedia (ang.): kuchnia osmańska - hasło \"Ottoman cuisine\"","https://en.wikipedia.org/wiki/Ottoman_cuisine"]]},{"claim":"Firma Hacı Bekira istnieje od 1777 r. i twierdzi, że stworzyła współczesne rachatłukum.","verdict":"prawda","note":"Firma działa do dziś; jej rola jako wynalazcy to tradycja rodzinna, bez pewnych dokumentów.","p":5,"src":[["Wikipedia (ang.): rachatłukum - hasło \"Turkish delight\"","https://en.wikipedia.org/wiki/Turkish_delight"]]},{"claim":"\"Lumps of delight\" pojawiają się w Tajemnicy Edwina Drooda Dickensa.","verdict":"prawda","note":"Scena z Rosą Bud jest w 3. rozdziale ostatniej, niedokończonej powieści Dickensa (1870).","p":7,"src":[["Projekt Gutenberg: Tajemnica Edwina Drooda (tekst ang.)","https://www.gutenberg.org/ebooks/564"]]},{"claim":"Rupert Holmes napisał musical Edwin Drood i piosenkę Escape.","verdict":"prawda","note":"Musical z 1985 r. ma kilka zakończeń wybieranych przez widzów; Escape to przebój z 1979 r.","p":null,"src":[["Wikipedia (ang.): Rupert Holmes - hasło \"Rupert Holmes\"","https://en.wikipedia.org/wiki/Rupert_Holmes"]]}],"bias":"Rzetelny i ostrożny przy legendach o pochodzeniu; dygresje (musical) i dłuższa reklama garnka."},{"id":"NtZaP8VMv0c","title_pl":"Astronauta NASA sprawdził na ISS moją teorię o łańcuszku","title":"NASA tested my chain theory in space","channel":"Steve Mould","url":"https://www.youtube.com/watch?v=NtZaP8VMv0c","date":"2025-10-10","duration":903,"views":15440952,"section":"Ciekawostki","transcript":"whisper","added":"2026-11-03","tags":["Fizyka","Kosmos"],"about":"Steve Mould łączy się z Donem Pettitem na ISS, by w nieważkości sprawdzić brakujący element wyjaśnienia fontanny łańcuszkowej.","intro":"Ok. 10 lat temu Steve Mould odkrył fontannę łańcuszkową, zwaną też efektem Moulda. Jeden element jego wyjaśnienia da się sprawdzić tylko w nieważkości: czy łańcuszek poruszający się ze stałą prędkością płynie przez własny kształt. W 25-minutowej rozmowie wideo astronauta Don Pettit testuje to na Międzynarodowej Stacji Kosmicznej.","points":[{"t":"Fontanna łańcuszkowa","d":"Łańcuszek z koralików wyciągany z naczynia wznosi się łukiem nad jego krawędź. Po serii 6 filmów z ElectroBoomem wyjaśnienie Moulda uznaje się za poprawne: z naczynia działa dodatkowa siła skierowana w górę."},{"t":"Brakujący element","d":"Ta siła musi tylko równoważyć ciężar łuku. Z matematyki wynika, że szarpanie łańcuszka na drugim końcu nie zmienia kształtu łuku: bez grawitacji łańcuszek o stałej prędkości płynie przez własny kształt."},{"t":"Nieudane pomysły","d":"Łańcuszka nie da się zatrzymać nieruchomo w powietrzu, a z kłębka nie da się go wyciągać ze stałą prędkością, bo koraliki się plączą i rozpływają. Pettit porównał chaotyczny ruch łańcuszka do ruchu cząsteczek."},{"t":"Zamknięta pętla","d":"Trzeci pomysł: pętla w niekołowym kształcie, wprawiona w ruch wokół obwodu. Intuicja podpowiada, że zrobi się z niej okrąg, a teoria, że zachowa kształt."},{"t":"Wynik","d":"Pętla w dużej mierze zachowała kształt, także wygięcie w stronę Pettita, ale powoli się zaokrąglała. Symulacja Martina Beyera pokazała, że to skutek tarcia w przegubach, którego model matematyczny nie uwzględnia."},{"t":"Łańcuszek a sznurek","d":"Nitka i lina mają własną sztywność i prostują się, a łańcuszek z przegubami o małym tarciu zachowuje się zupełnie inaczej. Reaguje na prądy powietrza, a bez nich ustawia się wzdłuż gradientu grawitacji."},{"t":"Inne eksperymenty","d":"Pettit robi sztuczki jak z jojo, przytrzymuje koniec łańcuszka ładunkiem elektrostatycznym i pokazuje, że łańcuch ze spinaczy o ogniwach 50 mm zachowuje się jak ten z koralików o średnicy 3 mm."},{"t":"Droga na ISS","d":"Mould zapytał w filmie, jak dotrzeć do kogoś na ISS. Odezwał się Stefan z ESA, Samantha Cristoforetti zabrała w kosmos 4 m łańcuszka, a potem skontaktowała go z Pettitem."},{"t":"Rozmowa","d":"Rozmowę przez Microsoft Teams zorganizował John Stevens z NASA. Okno łączności trwało 25 minut. Pettit uznał wyjaśnienie, w tym zaokrąglanie pętli przez tarcie, za trafne."}],"conclusion":"Łańcuszek w nieważkości zachował kształt, a powolne zaokrąglanie tłumaczy tarcie w przegubach, więc teoria Moulda się broni.","factchecks":[{"claim":"Steve Mould spopularyzował fontannę łańcuszkową filmem na YouTube w 2013 r.","verdict":"prawda","note":"Zjawisko pokazywano wcześniej, np. Steve Spangler w 2009 r.; nazwa efekt Moulda pochodzi od jego filmu.","p":0,"src":[["Wikipedia (ang.): fontanna łańcuszkowa - hasło \"Chain fountain\"","https://en.wikipedia.org/wiki/Chain_fountain"]]},{"claim":"Wyjaśnienie zakłada dodatkową siłę z naczynia działającą w górę.","verdict":"prawda","note":"Biggins i Warner z Cambridge opisali ją w Proceedings of the Royal Society A w 2014 r.","p":[0,1],"src":[["Wikipedia (ang.): fontanna łańcuszkowa - hasło \"Chain fountain\"","https://en.wikipedia.org/wiki/Chain_fountain"],["Biggins, Warner: Understanding the chain fountain (Proc. R. Soc. A, 2014)","https://doi.org/10.1098/rspa.2013.0689"]]},{"claim":"Samantha Cristoforetti dowodziła misją na ISS.","verdict":"prawda","note":"Objęła dowództwo Ekspedycji 68 28 września 2022 r.","p":7,"src":[["Wikipedia (ang.): Samantha Cristoforetti - hasło \"Samantha Cristoforetti\"","https://en.wikipedia.org/wiki/Samantha_Cristoforetti"]]},{"claim":"Don Pettit przebywał wtedy na ISS.","verdict":"prawda","note":"Był w składzie Ekspedycji 71 i 72; wylądował 20 kwietnia 2025 r., w dniu 70. urodzin.","p":8,"src":[["Wikipedia (ang.): Don Pettit - hasło \"Donald Pettit\"","https://en.wikipedia.org/wiki/Donald_Pettit"]]}],"bias":"Rzetelny; Mould sam przyznaje, że pętla się zaokrąglała, i opiera wniosek o tarciu na symulacji. Krótka wzmianka o Patreonie."},{"id":"qqFCHxacUww","title_pl":"Dlaczego w średniowieczu porzucano rzymskie miasta","title":"Why Roman Cities were Abandoned in the Middle Ages","channel":"toldinstone","url":"https://www.youtube.com/watch?v=qqFCHxacUww","date":"2025-07-25","duration":569,"views":867499,"section":"Historia","transcript":"youtube","added":"2026-11-03","tags":["Historia"],"about":"Toldinstone tłumaczy, czemu jedne rzymskie miasta przetrwały do dziś, a setki innych opustoszały.","intro":"Stojąc w ruinach antycznego miasta w południowej Turcji, Garrett Ryan z kanału toldinstone pyta, dlaczego Londyn czy Paryż przetrwały, a setki rzymskich miast zniknęły. Odpowiedź to splot czynników: słabnące elity, najazdy, klimat, malaria, zamulone porty i przede wszystkim rozpad sieci handlu, z której miasta żyły.","points":[{"t":"Imperium miast","d":"Rzym był konfederacją miast; sieć ok. 2000 z nich ciągnęła się od Brytanii po Syrię. Lokalne elity zbierały podatki dla Rzymu i w zamian inwestowały w fora, akwedukty, łaźnie i amfiteatry, czyli wszystko, co dziś kojarzymy z rzymskim miastem."},{"t":"Kryzys III wieku","d":"Najazdy i kryzysy gospodarcze III w. zniszczyły setki miast przy granicach. Nawet te oszczędzone często chowały się za murami zbudowanymi z rozebranych pomników."},{"t":"Elity odchodzą","d":"W późnym cesarstwie najbogatsi wyjeżdżali na posady w administracji, a ci, którzy zostali, biednieli i nie chcieli rządzić miastem. Kwitły ośrodki władzy, jak Arles i Trewir, ale Londinium wyludniało się od końca II w. i opustoszało po odejściu Rzymian z Brytanii."},{"t":"Bliżej Morza Śródziemnego","d":"Miasta nad Morzem Śródziemnym miały większe szanse: były bliżej szlaków handlowych i łatwiej je było przejąć bez walki. Później grozili im piraci; w IX w. łupieżcy splądrowali nawet Bazylikę św. Piotra, a mieszkańcy wybrzeży przenosili się na wzgórza."},{"t":"Wschód do VII wieku","d":"Miasta wschodniego cesarstwa trzymały się dobrze do VII w. Część Syrii i Palestyny rozkwitała pod Umajjadami, ale Anatolię pustoszyły najazdy, a w XI w. plemię Banu Hilal zrujnowało miasta Maghrebu."},{"t":"Klimat i krajobraz","d":"Wczesne cesarstwo przypadło na wyjątkowo ciepły okres; gdy się ochłodziło, podupadły miasta wysoko w górach Taurus, jak Sagalassos. Pola Fajumu w Egipcie zasoliły się, porty Efezu i Miletu zamuliły, a część Aleksandrii i Bajów zapadła się w morze."},{"t":"Malaria","d":"Najgroźniejsza malaria tropikalna rozprzestrzeniała się na zachód, a wylesianie tworzyło bagniste delty. To ona zamieniła żyzną Kampanię Rzymską w pustkowie, którym była aż do XIX w."},{"t":"Zerwane sieci handlu","d":"Miasta przy granicach żyły z wydatków wojska. Wiejskie osady na wapiennym płaskowyżu północnej Syrii dostarczały oliwę do Antiochii; gdy po podboju arabskim zmieniły się szlaki, opustoszały na zawsze i zwą się dziś martwymi miastami."},{"t":"Kruchość miast","d":"Miasta zależą od handlu, infrastruktury i masy krytycznej ludzi. Według autora większość rzymskich miast zgubiły nie katastrofy, ale powolne zmiany, które odebrały im sens istnienia."}],"conclusion":"Rzymskie miasta umierały zwykle powoli: gdy znikały powody ich istnienia, ludzie po prostu odchodzili.","factchecks":[{"claim":"Arabscy łupieżcy splądrowali Bazylikę św. Piotra w IX w.","verdict":"prawda","note":"Najazd na Rzym w 846 r. ograbił bazyliki św. Piotra i św. Pawła za murami.","p":3,"src":[["Wikipedia (ang.): najazd na Rzym w 846 r. - hasło \"Arab raid against Rome\"","https://en.wikipedia.org/wiki/Arab_raid_against_Rome"]]},{"claim":"Martwe miasta północnej Syrii opustoszały po zmianie szlaków handlowych.","verdict":"prawda","note":"To ok. 700 osad z I-VII w.; porzucono je w VIII-X w. po przesunięciu się szlaków. Wpisane na listę UNESCO.","p":7,"src":[["Wikipedia (ang.): martwe miasta - hasło \"Dead Cities\"","https://en.wikipedia.org/wiki/Dead_Cities"]]},{"claim":"Port Efezu zamulił się, odcinając miasto od morza.","verdict":"prawda","note":"Rzeka Kaystros nanosiła osady; dziś ruiny leżą kilka kilometrów od brzegu.","p":5,"src":[["Wikipedia (ang.): Efez - hasło \"Ephesus\"","https://en.wikipedia.org/wiki/Ephesus"]]},{"claim":"Część Bajów zapadła się w morze przez ruchy ziemi.","verdict":"prawda","note":"Bradyzejsmy Pól Flegrejskich zatopiły część Bajów; ruiny tworzą dziś podwodny park.","p":5,"src":[["Wikipedia (ang.): Baje - hasło \"Baiae\"","https://en.wikipedia.org/wiki/Baiae"]]},{"claim":"Malaria zamieniła Kampanię Rzymską w pustkowie aż do XIX w.","verdict":"półprawda","note":"Porzucono ją w średniowieczu przez malarię i brak wody; osuszanie i rekultywacja trwały do XX w.","p":6,"src":[["Wikipedia (ang.): Kampania Rzymska - hasło \"Roman Campagna\"","https://en.wikipedia.org/wiki/Roman_Campagna"]]}],"bias":"Rzetelny, zwięzły przegląd z ostrożnymi wnioskami. Reklama sponsora zawiera polityczne cytaty niezwiązane z tematem."},{"id":"XSl4ZTtjS7Q","title_pl":"Instynkty, z którymi walczysz codziennie, a których ewolucja zapomniała usunąć","title":"Instincts You Fight Daily That Evolution Forgot To Delete","url":"https://www.youtube.com/watch?v=XSl4ZTtjS7Q","date":"2025-05-25","duration":711,"views":1880940,"transcript":"youtube","added":"2026-11-03","tags":["Psychologia","Ewolucja"],"about":"8 odruchów i skłonności psychicznych, które według autora są pozostałością po życiu w plemionach łowców-zbieraczy i nie pasują do współczesności.","intro":"Ranking 8 odruchów, które według autora zostały nam po przodkach żyjących w plemionach i dziś często szkodzą. Są to: potrzeba drzemki, instynkt stadny, przymus odwzajemniania przysług, strach przed nieznanym, potrzeba kontroli, awersja do straty, obsesja statusu i reakcja na niesprawiedliwość. Każdy punkt ma ten sam schemat: jak pomagał przetrwać i jak przeszkadza w pracy, zakupach i internecie.","points":[{"t":"8. Potrzeba drzemki","d":"Senność o 14:00 po 8 godzinach snu albo pobudka o 3:00 to według autora dawny rytm. Przodkowie spali dwufazowo: kilka godzin, przerwa w nocy na sprawdzenie zagrożeń, jedzenie albo seks, potem znowu sen, a w upale (ok. 38°C) drzemali w dzień. Praca od 9:00, latarnie i telefony do tego nie pasują."},{"t":"7. Instynkt stadny","d":"Gdy plemię zaczynało uciekać, kto pytał dlaczego, zostawał zjedzony, a grupa dawała jedzenie i ochronę. Dlatego mózg nagradza dopasowanie się dopaminą. Dziś przez to kupujemy akcje GameStop za radą Reddita, nosimy modne brzydkie buty i wierzymy w fałszywe newsy."},{"t":"6. Przymus odwzajemnienia","d":"Przytrzymane drzwi albo kawa od kolegi wywołują poczucie długu. U przodków dzielenie się mięsem i jagodami było warunkiem przeżycia zimy, a mózg robi nam dyskomfort, dopóki nie oddamy. Marketing to wykorzystuje: darmowa próbka w Costco kończy się słoikiem ogórków 4,5 kg, kawa u dilera skłania do zakupu auta."},{"t":"5. Strach przed nieznanym","d":"Szelest w krzakach mógł być drapieżnikiem, a nowa jagoda trucizną, więc przeżyli ostrożni. Dlatego mózg zalewa nas hormonami stresu przy nowościach. Dziś zamawiamy to samo danie od 10 lat i zostajemy w pracy, której nie znosimy."},{"t":"4. Potrzeba kontroli","d":"Wciskanie wyimaginowanego hamulca, gdy prowadzi ktoś inny, i złość, gdy plan dnia się sypie. Przeżywali ci, którzy budowali lepsze schronienia, przechowywali jedzenie i planowali polowania; mózg nagradza kontrolę dopaminą. Dziś korki, przeciągnięte spotkania czy źle załadowana zmywarka wywołują reakcję jak na zagrożenie."},{"t":"3. Awersja do straty","d":"Znalezione 100 dolarów cieszy, ale zgubione 100 dolarów boli tygodniami. Dla przodka utrata jedynej włóczni czy zapasów oznaczała śmierć, a brak dodatkowego jedzenia tylko rozczarowanie. Według autora strata boli 2 razy mocniej niż równy zysk, więc trzymamy tracące akcje, niechciane ubrania i złą pracę."},{"t":"2. Obsesja statusu","d":"W plemieniu wysoki status oznaczał lepsze jedzenie, partnerów i posłuch, a niski resztki i brak potomstwa. Dlatego mózg nagradza awans i karze spadek stresem, gdy ktoś ma lepsze auto czy ładniejszy Instagram. Dziś kupujemy rzeczy ponad stan i publikujemy podkoloryzowane życie."},{"t":"1. Potrzeba sprawiedliwości","d":"Ktoś wpycha się w kolejkę albo kradnie pomysł i budzi się wściekłość. W plemieniu ok. 30 osób chomikowanie jedzenia czy jedzenie bez polowania zagrażało wszystkim, a wykrywanie i karanie oszustów pozwalało przetrwać. Dziś ta sama reakcja dotyczy drobiazgów: dwóch darmowych próbek, faworyzowania przez szefa, wpisów w sieci."}],"conclusion":"Nasz mózg jest wciąż ustawiony na życie w małym plemieniu, a zrozumienie tego pomaga nie dawać się tym odruchom sterować.","factchecks":[{"claim":"Przodkowie spali dwufazowo (\"pierwszy i drugi sen\") przez tysiące lat.","verdict":"półprawda","note":"Ekirch opisał sen dwufazowy w dawnej Europie, ale u współczesnych łowców-zbieraczy go nie wykazano.","src":[["Wikipedia (ang.): sen dwufazowy - hasło \"Segmented sleep\"","https://en.wikipedia.org/wiki/Segmented_sleep"],["Yetish i in. 2015, Current Biology (DOI)","https://doi.org/10.1016/j.cub.2015.09.046"]],"p":0},{"claim":"Mózg nagradza konformizm (układ nagrody).","verdict":"półprawda","note":"Jedno badanie fMRI (2009) pokazało sygnał błędu przy niezgodności z grupą; \"dopamina za konformizm\" to uproszczenie.","src":[["Klucharev i in. 2009 (PubMed)","https://pubmed.ncbi.nlm.nih.gov/19146819/"],["Wikipedia (ang.): instynkt stadny - hasło \"Herd mentality\"","https://en.wikipedia.org/wiki/Herd_mentality"]],"p":1},{"claim":"Reguła wzajemności działa, a sprzedawcy używają jej przez darmowe próbki.","verdict":"prawda","note":"Klasyczny eksperyment Regana (1971) i prace Cialdiniego dobrze to dokumentują.","src":[["Wikipedia (ang.): reguła wzajemności - hasło \"Reciprocity (social psychology)\"","https://en.wikipedia.org/wiki/Reciprocity_(social_psychology)"]],"p":2},{"claim":"Strata boli ok. dwa razy mocniej niż równy zysk.","verdict":"półprawda","note":"Kahneman i Tversky podali ok. 2, ale nowsze prace pokazują, że efekt bywa dużo mniejszy.","src":[["Wikipedia (ang.): awersja do straty - hasło \"Loss aversion\"","https://en.wikipedia.org/wiki/Loss_aversion"],["Gal i Rucker 2018, krytyka (DOI)","https://doi.org/10.1002/jcpy.1047"]],"p":5},{"claim":"Poczucie sprawiedliwości jest wrodzone i ewolucyjnie stare.","verdict":"półprawda","note":"Kapucynki i ludzie odrzucają niesprawiedliwe nagrody, ale ewolucyjne wyjaśnienia to hipotezy.","src":[["Brosnan i de Waal 2003, Nature","https://www.nature.com/articles/nature01963"],["Wikipedia (ang.): gra w ultimatum - hasło \"Ultimatum game\"","https://en.wikipedia.org/wiki/Ultimatum_game"]],"p":7},{"claim":"Strach przed nieznanym, potrzeba kontroli i status jako ewolucyjne pozostałości.","verdict":"nie da się sprawdzić","note":"Zjawiska są realne, ale ewolucyjne historie \"jak było w plemieniu\" są nietestowalne.","src":[["Wikipedia (ang.): iluzja kontroli - hasło \"Illusion of control\"","https://en.wikipedia.org/wiki/Illusion_of_control"],["Wikipedia (ang.): krytyka wyjaśnień typu \"just-so story\" - hasło \"Just-so story\"","https://en.wikipedia.org/wiki/Just-so_story"]],"p":null}],"bias":"Jednostronny: każde zachowanie wyjaśnia psychologią ewolucyjną w formie \"opowieści\", bez alternatyw (kultura, uczenie się). Brak źródeł; traktuj jako ciekawostkę, nie wiedzę.","channel":"Chill Dude Explains","section":"Chill Dude Explains"},{"id":"Mcg9GcilBfU","title_pl":"Zapalniczka sprzed 200 lat, która zapala się bez iskry","title":"This 200-Year-Old Lighter Ignites Without a Spark","channel":"Steve Mould","url":"https://www.youtube.com/watch?v=Mcg9GcilBfU","date":"2025-05-17","duration":830,"views":1363330,"section":"Ciekawostki","transcript":"youtube","added":"2026-11-03","tags":["Chemia","Historia nauki"],"about":"Steve Mould pokazuje działającą replikę lampy Döbereinera z 1823 r. i tłumaczy katalizę na platynie, od zapalniczki po ogniwo paliwowe.","intro":"Słoik z kwasem siarkowym, który sam wytwarza wybuchowy gaz i sam go zapala, brzmi jak zły pomysł, a jednak w 1823 r. kupowano go do domów. Steve Mould dostaje od Marcusa z kanału Marv's Lab działającą replikę lampy Döbereinera, pierwszej zapalniczki, i wyjaśnia, dlaczego wodór zapala się na platynie bez iskry.","points":[{"t":"Wodór z cynku","d":"Jony wodoru z kwasu odbierają cynkowi 2 słabo trzymane elektrony. Powstają atomy wodoru, które łączą się w cząsteczki H2 i wydobywają się jako pęcherzyki."},{"t":"Samoregulujący zbiornik","d":"Odwrócony szklany stożek napełnia się wodorem i wypycha kwas. Gdy kwas przestaje dotykać cynku, reakcja staje. Po otwarciu zaworu wodór ucieka, kwas wraca do cynku i produkcja rusza od nowa."},{"t":"Gąbka platynowa","d":"W oryginale strumień wodoru trafiał na gąbkę platynową. Dziś łatwiej kupić wełnę ceramiczną pokrytą platyną. Wodór zaczyna na niej płonąć bez ognia i iskry, a ciepło reakcji rozgrzewa platynę do żaru."},{"t":"Dlaczego wodór sam nie płonie","d":"Cząsteczki H2 i O2 trzeba najpierw rozerwać, zwykle ciepłem. Mieszanina w balonie wybucha dopiero po silnym podgrzaniu jednego miejsca."},{"t":"Orbital antywiążący","d":"Cząsteczki przyciągają się do platyny słabymi siłami van der Waalsa. Elektrony z metalu przechodzą na orbital antywiążący wodoru, w którym elektrony przebywają na zewnątrz atomów, więc cząsteczka się rozpada. Podobnie dzieje się z tlenem."},{"t":"Powstaje woda","d":"Wolne atomy wodoru i tlenu na powierzchni łączą się w wodę. Woda słabo wiąże się z platyną, a energia zderzenia wprawia ją w drgania, czyli ciepło, które pomaga jej się oderwać i rozgrzewa metal."},{"t":"Dlaczego to był hit","d":"W 1823 r. ogień rozpalano krzesiwem, tłokiem ogniowym albo pocieraniem patyków. Według Moulda lampę szybko wyparła zapałka Johna Walkera z 1827 r. (w filmie omyłkowo mowa o XVII w.)."},{"t":"Platyna dziś","d":"Katalityczny ogrzewacz do rąk Zippo grzeje do 6 godzin dzięki parującej benzynie i wełnie z platyną. Katalityczny dyfuzor zapachów spala alkohol bez płomienia. Liczy się duża powierzchnia, bo reakcja zachodzi na powierzchni metalu."},{"t":"Ogniwo paliwowe","d":"Wodór i tlen przepływają nad 2 powierzchniami platyny rozdzielonymi membraną, która przepuszcza tylko jony. Elektrony płyną obwodem i zasilają wentylator. Odwrócone ogniwo rozkłada wodę na wodór i tlen."},{"t":"Sponsor","d":"Końcówka to reklama programu WISE firmy Jane Street dla osób zaczynających studia."}],"conclusion":"Lampa Döbereinera była niebezpieczna i skomplikowana, ale zapoczątkowała katalizę na platynie, z której korzystają dziś m.in. ogniwa paliwowe.","factchecks":[{"claim":"Lampę wynalazł w 1823 r. niemiecki chemik J. W. Döbereiner; cynk z kwasem siarkowym daje w niej wodór.","verdict":"prawda","note":"Strumień wodoru zapala się na gąbce platynowej.","p":[0,1,2],"src":[["Wikipedia (ang.): lampa Döbereinera - hasło \"Döbereiner's lamp\"","https://en.wikipedia.org/wiki/Döbereiner's_lamp"]]},{"claim":"Po 3 latach lampa stała się przestarzała z powodu zapałek.","verdict":"przesada","note":"Zapałkę cierną Walker wynalazł w 1826 lub 1827 r., ale lampę produkowano do ok. 1880 r.","p":6,"src":[["Wikipedia (ang.): lampa Döbereinera - hasło \"Döbereiner's lamp\"","https://en.wikipedia.org/wiki/Döbereiner's_lamp"],["Wikipedia (ang.): John Walker - hasło \"John Walker (inventor)\"","https://en.wikipedia.org/wiki/John_Walker_(inventor)"]]},{"claim":"Lampa Döbereinera to pierwsze komercyjne zastosowanie katalizy.","verdict":"prawda","note":"Uznaje się ją za pierwsze komercyjne zastosowanie katalizy heterogenicznej.","p":[2,7],"src":[["Wikipedia (ang.): lampa Döbereinera - hasło \"Döbereiner's lamp\"","https://en.wikipedia.org/wiki/Döbereiner's_lamp"]]},{"claim":"Ogniwo paliwowe z membraną łączy wodór i tlen w wodę, wytwarzając prąd.","verdict":"prawda","note":"W ogniwach PEM membrana przewodzi protony, a elektrony płyną obwodem zewnętrznym.","p":8,"src":[["Wikipedia (ang.): ogniwo PEM - hasło \"Proton-exchange membrane fuel cell\"","https://en.wikipedia.org/wiki/Proton-exchange_membrane_fuel_cell"]]}],"bias":"Rzetelne wyjaśnienie chemii; przesadza z szybkim końcem lampy i myli wiek (XVII zamiast XIX). Na końcu reklama sponsora."},{"id":"kDfP5vAbOS0","title_pl":"Całkowicie błędne fakty, w które wszyscy wciąż wierzą","title":"Totally Wrong Facts Everyone Still Believes","url":"https://www.youtube.com/watch?v=kDfP5vAbOS0","date":"2025-04-30","duration":533,"views":2837925,"transcript":"youtube","added":"2026-11-03","tags":["Mity","Ciało i zdrowie","Nauka"],"about":"Ranking 10 popularnych \"faktów\", które według autora są mitami, od cukru i hiperaktywności po połkniętą gumę.","intro":"Ranking 10 popularnych \"faktów\", które według autora są mitami. Obala m.in. nadpobudliwość dzieci po cukrze, 10% mózgu, zabójczą monetę z Empire State Building, \"piorun nie uderza dwa razy\", hełmy wikingów z rogami, gęstsze włosy po goleniu, zakaz pływania po jedzeniu, utratę połowy ciepła przez głowę, 3-sekundową pamięć złotej rybki i gumę zalegającą 7 lat w żołądku.","points":[{"t":"10. Cukier nie robi z dzieci \"tornada\"","d":"W badaniu część dzieci dostała cukier, a część słodzik, i ani dzieci, ani rodzice nie wiedzieli, kto co dostał; różnicy nie było. Za to rodzice, którzy myśleli, że dziecko zjadło cukier, widzieli nadpobudliwość. Mit według autora zaczął się w latach 70. od lekarza obwiniającego dodatki do żywności."},{"t":"9. Nie używamy tylko 10% mózgu","d":"Skanery pokazują aktywność w całym mózgu, także we śnie, gdy steruje oddechem i sercem. Mózg to 2% masy ciała, a zużywa 20% energii; ewolucja nie trzymałaby 90% bezużytecznego organu, a nawet mały uraz daje poważne skutki. Mit ma pochodzić od badacza z Harvardu z XIX w. mówiącego o niewykorzystanym potencjale."},{"t":"8. Moneta z Empire State Building nie zabije","d":"Opór powietrza sprawia, że moneta koziołkuje i po ok. 15 m osiąga prędkość graniczną ok. 40 km/h, wolniej niż przeciętny rowerzysta, więc uderzenie przypomina pstryczka. W próżni osiągnęłaby ponad 320 km/h. Autor dodaje, że groźniejszy byłby spadający długopis."},{"t":"7. Piorun uderza w to samo miejsce","d":"Empire State Building dostaje ok. 25 uderzeń rocznie, a strażnik parku Roy Sullivan przeżył 7 uderzeń. Pioruny trafiają w te same wysokie obiekty, np. samotne drzewo. Mogą też uderzyć kilometry od burzy, przy czystym niebie."},{"t":"6. Wikingowie nie nosili hełmów z rogami","d":"Rogi wymyślili XIX-wieczni kostiumolodzy operowi, bo wyglądały dramatycznie, a w walce byłyby uchwytem dla wroga. Znalezione hełmy wikingów są proste, czasem z osłoną nosa. Rogate hełmy z Danii są o 3000 lat starsze i były ceremonialne."},{"t":"5. Golenie nie zagęszcza włosów","d":"Golenie ścina włos na płasko, jak pień ścięty piłą, więc odrost wydaje się grubszy niż naturalnie zwężona końcówka. Badania od dekad nie wykazały wpływu golenia, a grubość, kolor i tempo wzrostu zależą od genów. Gdyby to działało, golenie leczyłoby łysienie, a Jeff Bezos wciąż jest łysy."},{"t":"4. Można pływać zaraz po jedzeniu","d":"Według autora nie ma ani jednego udokumentowanego utonięcia z powodu pływania po jedzeniu, choć zasady 30 minut pilnowali nawet ratownicy. Po dużym posiłku można najwyżej złapać lekki skurcz jak przy bieganiu. Pływacy jedzą podczas treningów, a Czerwony Krzyż to potwierdza."},{"t":"3. Głowa nie traci połowy ciepła","d":"Mit o 40-45% ciepła pochodzi z wojskowego podręcznika, w którego badaniu ludzie byli w pełnym stroju zimowym z odkrytą tylko głową. Głowa to ok. 10% powierzchni ciała, więc traci ok. 10% ciepła; strata zależy od odkrytej skóry. Wyjątkiem są niemowlęta i małe dzieci, bo mają proporcjonalnie większe głowy."},{"t":"2. Złota rybka ma dobrą pamięć","d":"Złote rybki rozwiązują labirynty i pamiętają rozwiązanie przez miesiące, rozpoznają twarze, uczą się sztuczek, np. przepływania przez obręcze czy \"gry w piłkę\", i rozróżniają utwory muzyczne, mając mózg mniejszy od ziarnka grochu. Badanie ich mózgu może pomóc zrozumieć ludzką pamięć."},{"t":"1. Połknięta guma nie zostaje na 7 lat","d":"Guma przechodzi przez przewód pokarmowy jak inne jedzenie, tylko się nie rozkłada, podobnie jak ziarna kukurydzy, i wychodzi w 1-2 dni. Żołądek ciągle się porusza, więc nic się nie przykleja. Problem może być tylko przy połykaniu dużych ilości."}],"conclusion":"Większość \"oczywistych\" faktów z dzieciństwa to mity, które przetrwały, bo brzmią przekonująco albo powtarzali je rodzice.","factchecks":[{"claim":"Cukier nie powoduje nadpobudliwości u dzieci; rodzice widzą ją z powodu oczekiwań.","verdict":"prawda","note":"Metaanaliza 16 ślepych badań (JAMA 1995) nie wykazała wpływu cukru na zachowanie.","src":[["JAMA 1995, Wolraich i in. (PubMed)","https://pubmed.ncbi.nlm.nih.gov/7474248/"],["Hoover i Milich 1994, J Abnorm Child Psychol","https://link.springer.com/article/10.1007/BF02168088"]],"p":0},{"claim":"Mit 10% mózgu; mózg to 2% masy i 20% energii.","verdict":"prawda","note":"Obrazowanie pokazuje aktywność całego mózgu; dane o 2% masy i 20% energii są standardowe.","src":[["Wikipedia (ang.): mit 10% mózgu - hasło \"Ten percent of the brain myth\"","https://en.wikipedia.org/wiki/Ten_percent_of_the_brain_myth"],["Scientific American: mit 10%","https://www.scientificamerican.com/article/do-people-only-use-10-percent-of-their-brains/"]],"p":1},{"claim":"Moneta osiąga prędkość graniczną ok. 40 km/h i nie zabije.","verdict":"prawda","note":"Zmierzono ok. 40-80 km/h; moneta nie przebije czaszki.","src":[["Wikipedia (ang.): lista powszechnych mitów (moneta z wieżowca) - hasło \"List of common misconceptions\"","https://en.wikipedia.org/wiki/List_of_common_misconceptions_about_science,_technology,_and_mathematics"],["Wikipedia (ang.): prędkość graniczna - hasło \"Terminal velocity\"","https://en.wikipedia.org/wiki/Terminal_velocity"]],"p":2},{"claim":"Empire State Building: ok. 25 uderzeń pioruna rocznie; Roy Sullivan przeżył 7 uderzeń.","verdict":"prawda","note":"NOAA podaje ok. 20-25 uderzeń rocznie w Empire State Building. Sullivan jest w Księdze Guinnessa jako osoba trafiona 7 razy (1942-1977).","src":[["NOAA/NWS: mity o piorunach","https://www.weather.gov/safety/lightning-myths"],["Wikipedia (ang.): Roy Sullivan","https://en.wikipedia.org/wiki/Roy_Sullivan"]],"p":3},{"claim":"Rogate hełmy z Danii są o 3000 lat starsze od wikingów.","verdict":"fałsz","note":"Hełmy z Viksø są z ok. 900 p.n.e., czyli ok. 1700 lat przed wikingami, nie 3000.","src":[["Aarhus University: datowanie hełmów z Viksø","https://cas.au.dk/en/currently/news/show/artikel/new-study-about-the-viksoe-helmets"],["Smithsonian: hełmy mają prawie 3000 lat","https://www.smithsonianmag.com/smart-news/iconic-viking-horned-helmets-actually-3000-years-old-180979339/"]],"p":4},{"claim":"Golenie nie zmienia grubości ani tempa wzrostu włosów.","verdict":"prawda","note":"Badania od lat 20. XX w. nie wykazały wpływu golenia na włosy; Mayo Clinic potwierdza.","src":[["Mayo Clinic: golenie a odrost włosów","https://www.mayoclinic.org/healthy-lifestyle/adult-health/expert-answers/hair-removal/faq-20058427"]],"p":5},{"claim":"Pływanie zaraz po jedzeniu nie jest groźne; Czerwony Krzyż to potwierdza.","verdict":"prawda","note":"Czerwony Krzyż nie znalazł dowodów na utonięcia związane z jedzeniem przed pływaniem.","src":[["Wikipedia (ang.): lista powszechnych mitów (pływanie po jedzeniu) - hasło \"List of common misconceptions\"","https://en.wikipedia.org/wiki/List_of_common_misconceptions_about_science,_technology,_and_mathematics"]],"p":6},{"claim":"Mit 40-45% ciepła tracone przez głowę pochodzi z wojskowego podręcznika; głowa to ok. 10% powierzchni.","verdict":"prawda","note":"BMJ (2008): mit pochodzi z badań armii USA; głowa to ok. 7-10% powierzchni ciała.","src":[["BMJ 2008: świąteczne mity medyczne (DOI)","https://doi.org/10.1136/bmj.a2769"]],"p":7},{"claim":"Złote rybki pamiętają przez miesiące, uczą się sztuczek i rozróżniają muzykę.","verdict":"prawda","note":"Badania pokazują pamięć trwającą miesiące i rozróżnianie muzyki u złotych rybek.","src":[["Wikipedia (ang.): złota rybka (pamięć) - hasło \"Goldfish\"","https://en.wikipedia.org/wiki/Goldfish"],["Shinozuka i in. 2013, muzyka a złote rybki (PubMed)","https://pubmed.ncbi.nlm.nih.gov/23796771/"]],"p":8},{"claim":"Połknięta guma wychodzi w 1-2 dni, nie zostaje 7 lat.","verdict":"prawda","note":"Gastroenterolodzy potwierdzają; problemy (bezoar) zdarzają się tylko przy bardzo częstym połykaniu dużych ilości, zwłaszcza u dzieci.","src":[["Scientific American: połknięta guma","https://www.scientificamerican.com/article/fact-or-fiction-chewing-gum-takes-seven-years-to-digest/"],["Mayo Clinic: połknięta guma","https://www.mayoclinic.org/healthy-lifestyle/nutrition-and-healthy-eating/expert-answers/digestion/faq-20058446"]],"p":9}],"bias":"Rzetelny, w większości zgodny z nauką. Jedyny wyraźny błąd: wiek hełmów z Viksø. Ton prześmiewczy wobec rodziców, ale bez tendencyjności.","channel":"Chill Dude Explains","section":"Chill Dude Explains"},{"id":"TsWsDwn7mlA","title_pl":"Jak Egipcjanie zapomnieli hieroglifów","title":"How did the Egyptians forget Hieroglyphs?","channel":"toldinstone","url":"https://www.youtube.com/watch?v=TsWsDwn7mlA","date":"2025-04-25","duration":653,"views":759630,"section":"Historia","transcript":"youtube","added":"2026-11-03","tags":["Historia"],"about":"Dlaczego po ponad 3500 latach użycia hieroglify przestały być czytelne: upadek świątyń, kapłanów i rzymska kontrola.","intro":"Garrett Ryan z toldinstone zaczyna od ostatniej inskrypcji hieroglificznej na wyspie File z 394 r. Opisuje, jak w czasach rzymskich pismo wciąż się rozwijało, jak Rzym odebrał świątyniom majątek i autonomię i dlaczego, gdy zniknęli kapłani, nikt nie umiał już czytać hieroglifów, choć Rzymian bardzo one ciekawiły.","points":[{"t":"Ostatnia inskrypcja","d":"W świątyni Izydy na File wyryto napis ku czci boga Mandulisa, datowany na urodziny Ozyrysa, czyli 24 sierpnia 394 r. Hieroglify powstały ok. XXXIII w. p.n.e., a dłuższą historię mają dziś według autora tylko znaki chińskie."},{"t":"Pismo wciąż się rozwijało","d":"W czasach rzymskich język zapisywany hieroglifami miał prawie 2000 lat, ale liczba znaków wzrosła z ok. 750 do kilku tysięcy. W świątyni w Esnie jeden hymn zapisano wyłącznie znakami krokodyli, a inny baranów."},{"t":"Hieroglify w rzymskim Egipcie","d":"Pierwszy prefekt Korneliusz Gallus upamiętnił stłumienie buntu napisem po łacinie, grecku i hieroglifami, a obeliski zamawiali Domicjan i Hadrian. Za Trajana w Oksyrynchos pracowało co najmniej 5 zawodowych rytowników hieroglifów."},{"t":"Świątynie pełne tekstów","d":"Większość tekstów była w świątyniach: hymny, rytuały świąt, mity. Publikacja rzymskich inskrypcji z Dendery ma prawie 2000 stron, a z Esny ponad 1000; cesarze występowali na reliefach jako faraonowie."},{"t":"Miliony mumii zwierząt","d":"Pobożność ludowa była silna: świątynie Memfis sprzedawały zwierzęta na ofiary, a w katakumbach Sakkary jest podobno ponad 4 mln zmumifikowanych ibisów i pół miliona sokołów."},{"t":"Rzym przejmuje świątynie","d":"Za Ramzesa III świątynia Amona w Karnaku miała ok. 2800 km² ziemi, 421 tys. bydła i 65 miast. Ptolemeusze dawali świątyniom autonomię, a Rzymianie zabrali większość majątków, uzależnili je od państwowych pensji i ograniczyli przywileje kapłanów."},{"t":"Koniec wsparcia","d":"Po nawróceniu Konstantyna cesarskie wsparcie ustało; ostatnim cesarzem na ścianie świątyni był Maksymin Daja (310-313). Świątynię w Luksorze za Dioklecjana zamieniono w fort legionu, a w świątyni grobowej Ramzesa III wyrosła wieś z kościołem."},{"t":"Pismo garstki kapłanów","d":"Nawet w czasach faraonów hieroglify znało mniej niż 1% ludności, głównie w świątyniach. Gdy greka stała się językiem administracji, uczyć się ich mieli powód już tylko kapłani, a ci znikali."},{"t":"Rzymska ciekawość","d":"Obelisk z II w. we Florencji ma przypadkowe znaki, a Tablica Bembo z Rzymu tylko udaje hieroglify. Hadrian wypytywał kapłanów o znaki, Chajremon, nauczyciel Nerona, pisał o nich traktat, ale żaden znany autor nie twierdził, że umie je czytać."},{"t":"Hieroglifika Horapollona","d":"Uważano, że znaki to alegorie świętej mądrości. Jedyne egipskie dzieło o hieroglifach przetłumaczone na grekę, Hieroglifika Horapollona z ok. V w., znało część znaczeń, ale nie wiedziało, jak znaki tworzą zdania."}],"conclusion":"Hieroglify zniknęły razem ze świątyniami i kapłanami, którzy jako jedyni ich uczyli.","factchecks":[{"claim":"Ostatnia inskrypcja hieroglificzna na File pochodzi z 24 sierpnia 394 r.","verdict":"prawda","note":"Graffito Esmet-Achoma datuje się na 24 sierpnia 394 r., to ostatni znany tekst hieroglificzny.","p":0,"src":[["Wikipedia (ang.): graffito Esmet-Achoma - hasło \"Graffito of Esmet-Akhom\"","https://en.wikipedia.org/wiki/Graffito_of_Esmet-Akhom"]]},{"claim":"Liczba hieroglifów wzrosła z ok. 750 do kilku tysięcy w epoce grecko-rzymskiej.","verdict":"prawda","note":"Klasyczny egipski używał ok. 750-900 znaków, w epoce ptolemejskiej i rzymskiej ok. 5000-7000.","p":1,"src":[["Wikipedia (ang.): hieroglify egipskie - hasło \"Egyptian hieroglyphs\"","https://en.wikipedia.org/wiki/Egyptian_hieroglyphs"]]},{"claim":"Świątynia Amona w Tebach miała za Ramzesa III ogromne ziemie i ok. 421 tys. bydła.","verdict":"prawda","note":"Papirus Harris I podaje, że Teby zarządzały 80% świątynnej ziemi i 86% bydła.","p":5,"src":[["Wikipedia (ang.): Papirus Harris I - hasło \"Papyrus Harris I\"","https://en.wikipedia.org/wiki/Papyrus_Harris_I"]]},{"claim":"Tablica Bembo zrobiona w Rzymie tylko naśladuje hieroglify.","verdict":"prawda","note":"Powstała w Rzymie w 2. połowie I w.; jej twórca w ogóle nie rozumiał hieroglifów.","p":8,"src":[["Wikipedia (ang.): Tablica Bembo - hasło \"Bembine Tablet\"","https://en.wikipedia.org/wiki/Bembine_Tablet"]]},{"claim":"Chajremon z Aleksandrii uczył Nerona i pisał o hieroglifach.","verdict":"prawda","note":"Był nauczycielem Nerona przed 49 r.; jego dzieło o hieroglifach zachowało się tylko we fragmentach.","p":8,"src":[["Wikipedia (ang.): Chajremon z Aleksandrii - hasło \"Chaeremon of Alexandria\"","https://en.wikipedia.org/wiki/Chaeremon_of_Alexandria"]]},{"claim":"Hieroglifika Horapollona powstała ok. V w. i błędnie tłumaczyła wiele znaków.","verdict":"prawda","note":"Datowana na V w.; część znaczeń jest trafna, ale interpretacje są głównie alegoryczne.","p":9,"src":[["Wikipedia (ang.): Horapollo - hasło \"Horapollo\"","https://en.wikipedia.org/wiki/Horapollo"]]},{"claim":"W Sakkarze jest ponad 4 mln mumii ibisów.","verdict":"nie da się sprawdzić","note":"Szacunki dla katakumb ibisów w Sakkarze sięgają milionów, ale dokładnych liczb brak.","p":4,"src":[["Wikipedia (ang.): mumie zwierząt - hasło \"Animal mummy\"","https://en.wikipedia.org/wiki/Animal_mummy"]]}],"bias":"Rzetelny, spokojny wykład; kilka liczb podanych jako pewne to szacunki. Reklama biurka w środku."},{"id":"wztjGaAiqME","title_pl":"Niewinne nawyki, które po cichu niszczą twoje ciało","title":"Innocent Habits That Are Secretly Wrecking Your Body","url":"https://www.youtube.com/watch?v=wztjGaAiqME","date":"2025-04-21","duration":733,"views":1492461,"transcript":"youtube","added":"2026-11-03","tags":["Ciało i zdrowie"],"about":"9 codziennych nawyków, które według autora po cichu szkodzą zdrowiu, od obgryzania paznokci po wstrzymywanie moczu.","intro":"Ranking 9 codziennych nawyków, które według autora po cichu szkodzą zdrowiu. Są to obgryzanie paznokci, tłumienie kichnięć, czyszczenie uszu patyczkami, picie za dużo wody, głośne słuchawki, światło w nocy, siedzenie, spanie na brzuchu i wstrzymywanie moczu. Przy każdym autor opisuje mechanizm szkody i czasem daje prostą radę, co robić zamiast tego.","points":[{"t":"9. Obgryzanie paznokci","d":"Paznokcie zbierają zarazki z klamek, telefonów i klawiatur, a obgryzanie przenosi je do ust i wyszczerbia przednie zęby. Zerwane skórki otwierają drogę do zanokcicy. Według autora obgryzacze mają więcej infekcji żołądka i jelit, a nawyk wiąże się z lękiem."},{"t":"8. Tłumienie kichnięć","d":"Kichnięcie ma osiągać do ok. 160 km/h, a zatkanie nosa i ust kieruje ciśnienie z powrotem do głowy. Przez trąbki Eustachiusza może pęknąć błona bębenkowa, mogą pękać naczynka w oczach i nosie, rzadko dochodzi do uszkodzenia gardła. Ktoś złamał małą kość twarzy i miał powietrze pod skórą."},{"t":"7. Patyczki do uszu","d":"Patyczek nie czyści, tylko wpycha woskowinę głębiej, a uszy oczyszczają się same; zbita woskowina zmniejsza słyszenie i bywa usuwana na SOR. Błona bębenkowa jest cienka jak folia spożywcza, a ranki i wilgoć sprzyjają infekcjom. Rada: myć tylko małżowinę myjką."},{"t":"6. Przewodnienie","d":"Hiponatremia: przy szybkim piciu dużej ilości wody nerki nie nadążają, sodu jest za mało i komórki, także mózgu, puchną. Skutki to ból głowy, dezorientacja, drgawki, a nawet śmierć; 9-letnia dziewczynka zmuszona do picia za karę ledwo przeżyła. Rada: pij, gdy chce ci się pić."},{"t":"5. Słuchawki","d":"Komórki rzęsate w ślimaku ucha nie odrastają. Rozmowa to ok. 60 dB, słuchawki dają 105 dB i więcej, a powyżej 85 dB słuch się uszkadza, przy 100 dB w ok. 15 minut, bez bólu. Według autora wielu nastolatków ma słuch 50-latków, a aparat słuchowy go nie przywraca."},{"t":"4. Lampki nocne","d":"Po zmroku organizm wytwarza melatoninę, a nawet słabe światło (ładowarka, latarnia, budzik) może obciąć ją o połowę. Długotrwale rozregulowuje to metabolizm: tycie bez zmiany diety i gorsze działanie insuliny. Myszy przy słabym świetle nocą tyły i miały objawy depresji; zaburzony sen wiąże się z lękiem."},{"t":"3. Krzesło","d":"Przy wielogodzinnym siedzeniu krew zalega w nogach, co zwiększa ryzyko zakrzepów, spada spalanie kalorii i aktywność enzymów rozkładających tłuszcz. Mięśnie brzucha i pleców słabną, a sylwetka się garbi. Według autora pracownik biurowy siedzi ok. 15 godzin dziennie, a część naukowców mówi \"siedzenie to nowe palenie\"."},{"t":"2. Spanie na brzuchu","d":"Żeby oddychać, trzeba skręcić szyję na bok na wiele godzin, a ciężar ciała spłaszcza naturalne krzywizny kręgosłupa. Uciskane nerwy dają mrowienie i drętwienie rąk, a z czasem przewlekły ból szyi i pleców. Rada: bardzo płaska poduszka, mała poduszka pod miednicę, a najlepiej nauka spania na plecach lub boku."},{"t":"1. Wstrzymywanie moczu","d":"Pęcherz wysyła sygnał, gdy jest w połowie pełny, a ignorowanie go rozciąga go jak gumkę, która traci sprężystość. Osłabiony nie opróżnia się do końca, a zalegający mocz sprzyja zakażeniom dróg moczowych. Pęknięcie jest rzadkie, ale z latami może osłabnąć dno miednicy i pojawić się nietrzymanie."}],"conclusion":"Drobne nawyki powtarzane codziennie sumują się w realne szkody, więc warto je korygować, zanim pojawią się objawy.","factchecks":[{"claim":"Kichnięcie osiąga ok. 160 km/h.","verdict":"fałsz","note":"Pomiar szybką kamerą (2013) dał ok. 16 km/h; 160 km/h to dawne szacunki.","src":[["Tang i in. 2013, PLOS One","https://journals.plos.org/plosone/article?id=10.1371%2Fjournal.pone.0059970"]],"p":1},{"claim":"Tłumione kichnięcie może uszkodzić gardło i uszy.","verdict":"prawda","note":"Opisano m.in. pęknięcie gardła u mężczyzny, który zatkał nos i usta (BMJ Case Reports, 2018). To jednak bardzo rzadkie przypadki.","src":[["BMJ Case Reports 2018 (PubMed)","https://pubmed.ncbi.nlm.nih.gov/29335355/"]],"p":1},{"claim":"Patyczki wpychają woskowinę i mogą uszkodzić błonę bębenkową.","verdict":"prawda","note":"Zgodne z wytycznymi otolaryngologów (AAO-HNS) i analizami urazów u dzieci.","src":[["Wikipedia (ang.): patyczki higieniczne (ryzyka) - hasło \"Cotton swab\"","https://en.wikipedia.org/wiki/Cotton_swab"],["AAO-HNS: wytyczne o woskowinie","https://www.enthealth.org/conditions/earwax-cerumen/"]],"p":2},{"claim":"Zbyt dużo wody może zabić (hiponatremia).","verdict":"prawda","note":"Zatrucie wodą jest dobrze udokumentowane; przypadku 9-latki nie udało się zweryfikować.","src":[["Wikipedia (ang.): zatrucie wodne - hasło \"Water intoxication\"","https://en.wikipedia.org/wiki/Water_intoxication"]],"p":3},{"claim":"Powyżej 85 dB grozi uszkodzenie słuchu, przy 100 dB po ok. 15 minutach; nastolatki mają słuch 50-latków.","verdict":"półprawda","note":"Progi zgadzają się z normą NIOSH, ale \"słuch 50-latków\" nie ma źródła.","src":[["CDC/NIOSH: hałas w pracy a utrata słuchu","https://www.cdc.gov/niosh/noise/about/index.html"],["WHO: głuchota i utrata słuchu","https://www.who.int/news-room/fact-sheets/detail/deafness-and-hearing-loss"]],"p":4},{"claim":"Przyćmione światło nocą tuczy myszy.","verdict":"prawda","note":"Myszy przy słabym świetle nocą tyły (PNAS 2010); u ludzi są tylko korelacje.","src":[["Fonken i in. 2010, PNAS (DOI)","https://doi.org/10.1073/pnas.1008734107"]],"p":5},{"claim":"Przeciętny pracownik biurowy siedzi do 15 godzin dziennie; \"siedzenie to nowe palenie\".","verdict":"fałsz","note":"Dorośli siedzą ok. 9-10 h dziennie, a ryzyko palenia jest wielokrotnie wyższe.","src":[["Wikipedia (ang.): siedzący tryb życia - hasło \"Sedentary lifestyle\"","https://en.wikipedia.org/wiki/Sedentary_lifestyle"],["Ekelund i in. 2016, Lancet (DOI)","https://doi.org/10.1016/S0140-6736(16)30370-1"]],"p":6},{"claim":"Obgryzacze paznokci mają istotnie więcej infekcji przewodu pokarmowego.","verdict":"nie da się sprawdzić","note":"Obgryzanie przenosi bakterie, ale brak solidnych badań o częstszych infekcjach jelitowych.","src":[["Wikipedia (ang.): obgryzanie paznokci - hasło \"Nail biting\"","https://en.wikipedia.org/wiki/Nail_biting"]],"p":0},{"claim":"Częste wstrzymywanie moczu osłabia dno miednicy i prowadzi do nietrzymania.","verdict":"półprawda","note":"Okazjonalne wstrzymywanie jest bezpieczne; szkodzi tylko wieloletnie, skrajne.","src":[["Cleveland Clinic: skutki długiego wstrzymywania moczu","https://my.clevelandclinic.org/health/diseases/22208-shy-bladder-syndrome-paruresis"],["Kettering Health: jak długo można wstrzymywać mocz","https://ketteringhealth.org/how-long-should-i-hold-my-pee/"]],"p":8}],"bias":"Straszy (\"cichy zabójca\") i podaje kilka przesadzonych liczb (kichnięcie, 15 h siedzenia). Rady są w większości sensowne, ale ryzyka są wyolbrzymione.","channel":"Chill Dude Explains","section":"Chill Dude Explains"},{"id":"19UC0V9Ul2M","title_pl":"Bardzo niepokojące rzeczy, które robi twoje ciało","title":"Very CREEPY Things Your Body Does","url":"https://www.youtube.com/watch?v=19UC0V9Ul2M","date":"2025-04-07","duration":597,"views":1909931,"transcript":"youtube","added":"2026-11-03","tags":["Ciało i zdrowie","Nauka"],"about":"Ranking 10 \"przerażających\" rzeczy, które robi ludzkie ciało i mózg, od drgnięć przy zasypianiu po roztocza w rzęsach.","intro":"Ranking 10 rzeczy, które ludzkie ciało i mózg robią \"za twoimi plecami\". Autor zaczyna od drgnięć przy zasypianiu i fantomowych wibracji telefonu, przechodzi przez pasożyta Toxoplasma, paraliż senny i \"drugi mózg\" w jelitach, a kończy na roztoczach żyjących w rzęsach. Ton jest celowo straszny, a każdy punkt to krótka ciekawostka bez podanych źródeł.","points":[{"t":"10. Drgnięcia przy zasypianiu","d":"Ma to ok. 70% ludzi: gdy mięśnie się rozluźniają, mózg bierze to za spadanie i budzi nas szarpnięciem, czasem z obrazem upadku lub hukiem. Autor podaje hipotezę, że to pozostałość po spaniu na drzewach. Zmęczenie i stres to nasilają."},{"t":"9. Syndrom fantomowych wibracji","d":"Według autora zgłasza je do 90% posiadaczy telefonów. Mózg przyzwyczajony do powiadomień bierze ruch ubrania czy drgnięcie mięśnia za wibrację. Im większy lęk przed przegapieniem wiadomości, tym częściej, a zmiana kieszeni nie pomaga, bo \"wibracje\" przenoszą się w nowe miejsce."},{"t":"8. Pasożyty sterujące","d":"Toxoplasma gondii ma być u ok. 30% ludzi, a źródłem są koty. U myszy sprawia, że lubią zapach kociego moczu i idą prosto do kota. U ludzi według autora tworzy cysty w mózgu, zwiększa skłonność do ryzyka, a w rejonach z większym zarażeniem jest więcej wypadków."},{"t":"7. Paraliż senny","d":"We śnie mózg wyłącza mięśnie, żeby nie odgrywać snów; czasem umysł budzi się wcześniej niż ciało. Człowiek jest przytomny, ale nie może się ruszyć ani krzyczeć. Częste są ciemne postacie w pokoju, ucisk na klatce piersiowej i uczucie dłoni na gardle; strach według autora przedłuża paraliż."},{"t":"6. Kichanie od światła","d":"U części ludzi jasne światło wywołuje kichanie, bo sygnał z oczu \"przeskakuje\" na nerwy nosa. Kichnięcia przychodzą seriami po 2-3, wywołuje je słońce, flesz, ekran albo odblask śniegu. Autor podaje przykład pilota i kierowcy oraz to, że cecha jest dziedziczna: 50% szans, jeśli ma ją jeden z rodziców."},{"t":"5. Drugi mózg w jelitach","d":"Wokół jelit jest sieć neuronów, według autora większa niż cały mózg kota, która steruje trawieniem bez udziału głowy. \"Motyle w brzuchu\" to rozmowa dwóch mózgów. Biliony bakterii jelitowych mają produkować substancje wpływające na nastrój, a w jelitach powstaje 90% serotoniny."},{"t":"4. Mózg zjada sam siebie","d":"Autofagia to rozkładanie i trawienie własnych, starych lub uszkodzonych części komórki. Gdy pomijasz posiłki, neurony głodu według autora \"zjadają się\" mocniej i wzmacniają sygnał głodu. Autor dodaje, że zatrzymanie autofagii szkodzi."},{"t":"3. Zespół Capgrasa","d":"Mózg rozpoznaje wygląd osoby i osobno uczucia wobec niej. Gdy te części przestają się komunikować, twarz mamy jest rozpoznana, ale ciepło znika i pojawia się pewność, że to oszust, a drobna zmiana, np. fryzura, staje się \"dowodem\". Wywołać to może uraz mózgu, udar lub niektóre leki."},{"t":"2. Jamais vu","d":"Znane rzeczy nagle wydają się obce: własna twarz w lustrze, sypialnia, przyjaciel. Autor radzi napisać jedno słowo ok. 30 razy, aż litery zamienią się w dziwne kształty. Zdarza się to muzykom w trakcie grania utworu, który znają od lat."},{"t":"1. Roztocza w rzęsach","d":"Prawie każdy dorosły ma w mieszkach rzęs roztocza, które jedzą martwy naskórek i łój. W nocy wychodzą na twarz i się rozmnażają, a odchody gromadzą do śmierci i uwalniają naraz. Około 60. roku życia mają je prawie wszystkie mieszki."}],"conclusion":"Ciało i mózg robią mnóstwo dziwnych rzeczy bez naszej wiedzy, a wiele z nich to ślady dawnej ewolucji.","factchecks":[{"claim":"Drgnięcia przy zasypianiu ma ok. 70% ludzi; to pozostałość po spaniu na drzewach.","verdict":"półprawda","note":"Częstość 60-70% jest podawana w literaturze, ale wyjaśnienie z drzewami to tylko hipoteza.","src":[["Wikipedia (ang.): drgawki hipnagogiczne - hasło \"Hypnic jerk\"","https://en.wikipedia.org/wiki/Hypnic_jerk"]],"p":0},{"claim":"Fantomowe wibracje zgłasza do 90% użytkowników.","verdict":"prawda","note":"W badaniu Drouin i in. (2012) 89% studentów zgłosiło fantomowe wibracje. Inne badania dają niższe wartości, więc \"do 90%\" to górna granica.","src":[["Drouin i in. 2012 (DOI)","https://doi.org/10.1016/j.chb.2012.03.013"],["Wikipedia (ang.): syndrom fantomowych wibracji - hasło \"Phantom vibration syndrome\"","https://en.wikipedia.org/wiki/Phantom_vibration_syndrome"]],"p":1},{"claim":"Toxoplasma jest u ok. 30% ludzi i zmienia osobowość oraz zwiększa ryzyko wypadków.","verdict":"przesada","note":"Zarażenie ok. 30% ludzi i efekt u myszy są potwierdzone; u ludzi są tylko korelacje, film podaje je jak pewnik.","src":[["Wikipedia (ang.): toksoplazmoza - hasło \"Toxoplasmosis\"","https://en.wikipedia.org/wiki/Toxoplasmosis"],["CDC: toksoplazmoza","https://www.cdc.gov/toxoplasmosis/about/index.html"]],"p":2},{"claim":"Paraliż senny: świadomość przy zablokowanych mięśniach REM, halucynacje postaci, ucisk w klatce.","verdict":"prawda","note":"Opis kliniczny się zgadza; doświadcza go ok. 8% ludzi przynajmniej raz, nie \"co noc\".","src":[["Wikipedia (ang.): paraliż senny - hasło \"Sleep paralysis\"","https://en.wikipedia.org/wiki/Sleep_paralysis"],["Sharpless i Barber 2011 (PubMed)","https://pubmed.ncbi.nlm.nih.gov/21571556/"]],"p":3},{"claim":"Kichanie od światła jest dziedziczne.","verdict":"prawda","note":"Dotyczy ok. 18-35% ludzi i jest dziedziczny; mechanizm nerwowy to wiodąca hipoteza.","src":[["Wikipedia (ang.): odruch kichania na światło - hasło \"Photic sneeze reflex\"","https://en.wikipedia.org/wiki/Photic_sneeze_reflex"]],"p":4},{"claim":"W jelitach jest ok. 500 mln neuronów, więcej niż w mózgu kota.","verdict":"półprawda","note":"Szacunki to 100-600 mln neuronów; cały mózg kota ma ich więcej, więc porównanie jest mylące.","src":[["Stanford: drugi mózg w jelitach","https://neuroscience.stanford.edu/news/your-gut-second-brain"],["Liczba neuronów w jelitowym układzie nerwowym (PubMed)","https://pubmed.ncbi.nlm.nih.gov/35929768/"]],"p":5},{"claim":"Jelita produkują 90% serotoniny, co steruje nastrojem.","verdict":"przesada","note":"Ok. 90% serotoniny powstaje w jelitach, ale nie trafia do mózgu; \"sterowanie nastrojem\" to uproszczenie.","src":[["Wikipedia (ang.): serotonina - hasło \"Serotonin\"","https://en.wikipedia.org/wiki/Serotonin"],["Caltech: bakterie a serotonina jelit","https://www.caltech.edu/about/news/microbes-help-produce-serotonin-gut-46495"]],"p":5},{"claim":"Autofagia w neuronach głodu wzmacnia uczucie głodu.","verdict":"prawda","note":"Autofagia w neuronach reguluje głód (badanie na myszach, 2011); \"mózg zjada sam siebie\" to dramatyzacja.","src":[["Kaushik i in. 2011 (PubMed)","https://pubmed.ncbi.nlm.nih.gov/21803288/"],["Wikipedia (ang.): autofagia - hasło \"Autophagy\"","https://en.wikipedia.org/wiki/Autophagy"]],"p":6},{"claim":"Zespół Capgrasa i jamais vu (wywoływane wielokrotnym pisaniem słowa).","verdict":"prawda","note":"Capgras to opisane urojenie, a jamais vu wywoływano przepisywaniem słowa (Moulin, Ig Nobel 2023).","src":[["Wikipedia (ang.): zespół Capgrasa - hasło \"Capgras delusion\"","https://en.wikipedia.org/wiki/Capgras_delusion"],["Wikipedia (ang.): jamais vu","https://en.wikipedia.org/wiki/Jamais_vu"]],"p":[7,8]},{"claim":"Nużeńce nie mają odbytu i uwalniają odchody po śmierci.","verdict":"fałsz","note":"Badanie genomu z 2022 r. wykazało, że nużeńce mają odbyt; reszta opisu się zgadza.","src":[["University of Reading: sekretne życie roztoczy","https://www.reading.ac.uk/news/2022/Research-News/Secret-lives-of-skin-mites-in-our-faces"],["Smith i in. 2022, Molecular Biology and Evolution","https://doi.org/10.1093/molbev/msac125"]],"p":9}],"bias":"Sensacyjny język (\"mózg zjada sam siebie\"); korelacje podane jak pewniki, a mit o nużeńcach jest już obalony.","channel":"Chill Dude Explains","section":"Chill Dude Explains"},{"id":"2sWFexuc7MI","title_pl":"Miejsca na Ziemi, gdzie nie stanął żaden człowiek","title":"Places on Earth No Human Has Ever Visited","url":"https://www.youtube.com/watch?v=2sWFexuc7MI","date":"2024-12-26","duration":600,"views":1223643,"transcript":"whisper","added":"2026-11-03","tags":["Natura","Geografia"],"about":"Ranking 10 miejsc na Ziemi, których według autora nigdy nie odwiedził żaden człowiek lub które są prawie niezbadane.","intro":"Ranking 10 miejsc na Ziemi, do których według autora człowiek nigdy nie dotarł albo dotarł tylko na brzegi. Są wśród nich góry (Gangkhar Puensum, Góry Gwiezdne), jaskinie (Kryształów, cenoty Jukatanu), głębia oceanu, pustynie Namib i Takla Makan, lód północnej Grenlandii oraz wyspa, która okazała się nie istnieć. Przy każdym miejscu autor tłumaczy, co utrudnia dotarcie.","points":[{"t":"10. Gangkhar Puensum (Bhutan)","d":"Najwyższa niezdobyta góra świata, ok. 7560 m. Od 1994 r. Bhutan zakazuje wspinaczki, bo góry uważa się za siedziby duchów. Według autora wyprawy z lat 80. nie mogły nawet znaleźć góry przez złe mapy."},{"t":"9. Jaskinia Kryształów (Meksyk)","d":"Jaskinia pod Meksykiem z kryształami wielkości autobusów szkolnych, w środku ok. 58°C, prawie 100% wilgotności i siarkowodór. Naukowcy wchodzą na ok. 10 minut w kombinezonach chłodzących. Kryształy rosły setki tysięcy lat, a znaleziono w nich uśpione mikroby."},{"t":"8. Podwodne jaskinie Jukatanu","d":"Tysiące połączonych podwodnych jaskiń (cenotów) pod Meksykiem, w większości niezbadanych: są ciemne, ciasne, ciągną się kilometrami i leżą w odległej dżungli. Majowie uważali je za bramy do zaświatów; znaleziono w nich ceramikę, biżuterię i ludzkie kości. Żyją tam ryby bez oczu."},{"t":"7. Góry Gwiezdne (Papua-Nowa Gwinea)","d":"Według autora żaden człowiek nie postawił tam stopy. To ściany wapiennych klifów w gęstym lesie deszczowym, daleko od dróg, z ciągłym deszczem i pijawkami. Jest tam ogromny klif Hindenburg Wall, na który nikt się nie wspiął; nawet okoliczne plemiona nie zbadały części terenu."},{"t":"6. Rów Nowych Hebrydów","d":"Rów na południowym Pacyfiku między Vanuatu a Nową Kaledonią, ok. 7200 m głębokości, \"Everest by się w nim zmieścił\". Ciśnienie zgniotłoby człowieka jak puszkę, więc schodziły tam tylko roboty z kamerami i sfilmowały dziwne ryby. Warunki mają przypominać te na księżycach Jowisza."},{"t":"5. Tsingy de Bemaraha (Madagaskar)","d":"Park Tsingy de Bemaraha to las ostrych wapiennych iglic; nazwa ma znaczyć \"gdzie nie można chodzić boso\". Iglice przecinają buty, bywają wysokie jak 5-piętrowy budynek i stoją tak ciasno, że nie da się między nimi przejść. Zbadano tylko brzegi, na linach; żyją tam gatunki niespotykane gdzie indziej."},{"t":"4. Serce pustyni Namib","d":"Morze wydm Namib zajmuje obszar wielkości stanu Maryland, a część wydm jest wyższa od Empire State Building. Wydmy ciągle się przesuwają, więc mapy szybko się dezaktualizują. W dzień piasek może stopić buty, w nocy jest mróz, nie ma wody ani dróg, a wnętrze chroni UNESCO."},{"t":"3. Sandy Island","d":"Wyspa między Australią a Nową Kaledonią była na mapach przez setki lat, także w Google Maps; James Cook miał ją opisać w XVIII w. W 2012 r. australijscy naukowcy popłynęli w to miejsce i znaleźli otwarte morze. Możliwe wyjaśnienia: zatonęła, błąd kopiowany na mapach albo dryfujący pumeks."},{"t":"2. Północna Grenlandia","d":"Ludzie od tysięcy lat żyją na wybrzeżach, ale środek północnej Grenlandii jest nietknięty. Lądolód pokrywa ok. 80% wyspy i miejscami ma ponad 1,6 km grubości; do tego silny wiatr i miesiące ciemności. Pod lodem mogą być góry, doliny i jeziora z mikroorganizmami, a topnienie odsłania nowe wyspy."},{"t":"1. Pustynia Takla Makan (Chiny)","d":"\"Pustynia śmierci\", większa od Wielkiej Brytanii, bez wody i otoczona wysokimi górami; według autora w jej środku nie był żaden człowiek. Nazwa ma znaczyć \"miejsce, z którego się nie wraca\". Jedwabny Szlak szedł tylko brzegami, a pod piaskiem mogą być zaginione miasta."}],"conclusion":"Mimo satelitów i GPS wciąż są miejsca, do których człowiek nie dotarł, głównie przez zakazy, ekstremalne warunki albo zwykłe trudności w dojściu.","factchecks":[{"claim":"Gangkhar Puensum to najwyższa niezdobyta góra; wspinaczka zakazana, a wyprawy nie mogły jej znaleźć.","verdict":"prawda","note":"Szczyt ma 7570 m, a wspinaczka jest zakazana od 2003 r.; wyprawy z lat 80. się nie powiodły.","src":[["Wikipedia (ang.): Gangkhar Puensum","https://en.wikipedia.org/wiki/Gangkhar_Puensum"]],"p":0},{"claim":"Jaskinia Kryształów: 58°C, prawie 100% wilgotności, toksyczne powietrze, wizyty ok. 10 minut.","verdict":"półprawda","note":"Upał, wilgotność i mikroby się zgadzają; głównym zagrożeniem jest upał, nie toksyczne gazy.","src":[["Wikipedia (ang.): Jaskinia Kryształów (Naica) - hasło \"Cave of the Crystals\"","https://en.wikipedia.org/wiki/Cave_of_the_Crystals"],["National Geographic: mikroby z Naica","https://www.nationalgeographic.com/science/article/crystal-caves-mine-microbes-mexico-boston-aaas-aliens-science"]],"p":1},{"claim":"Cenoty Jukatanu: tysiące połączonych jaskiń, ślepe ryby, ofiary Majów.","verdict":"prawda","note":"Sac Actun ma ponad 370 km korytarzy, ale to popularne miejsce nurkowe, a nie \"nieodwiedzone\".","src":[["Wikipedia (ang.): system jaskiń Sac Actun - hasło \"Sistema Sac Actun\"","https://en.wikipedia.org/wiki/Sistema_Sac_Actun"],["Wikipedia (ang.): cenoty - hasło \"Cenote\"","https://en.wikipedia.org/wiki/Cenote"]],"p":2},{"claim":"W Góry Gwiezdne nigdy nie wszedł żaden człowiek.","verdict":"fałsz","note":"Mieszkają tam ludy Min, działa kopalnia Ok Tedi i miasto Tabubil.","src":[["Wikipedia (ang.): Góry Gwiezdne - hasło \"Star Mountains\"","https://en.wikipedia.org/wiki/Star_Mountains"],["Wikipedia (ang.): kopalnia Ok Tedi - hasło \"Ok Tedi Mine\"","https://en.wikipedia.org/wiki/Ok_Tedi_Mine"]],"p":3},{"claim":"Rów Nowych Hebrydów: Everest by się w nim zmieścił; nikt tam nie był, były tylko roboty.","verdict":"fałsz","note":"Rów ma ok. 7,8 km, a Everest 8,85 km, więc szczyt by wystawał; na dno zszedł Victor Vescovo w 2021 r.","src":[["Wikipedia (ang.): Rów Nowych Hebrydów - hasło \"New Hebrides Trench\"","https://en.wikipedia.org/wiki/New_Hebrides_Trench"],["Guinness: najwięcej odwiedzonych rowów","https://www.guinnessworldrecords.com/world-records/752796-most-deep-sea-trenches-visited-by-an-individual"]],"p":4},{"claim":"Tsingy: nazwa znaczy \"gdzie nie można chodzić boso\"; wnętrze nietknięte.","verdict":"półprawda","note":"Tłumaczenie nazwy się zgadza, ale park ma szlaki dla turystów i jest badany.","src":[["Wikipedia (ang.): Tsingy de Bemaraha","https://en.wikipedia.org/wiki/Tsingy_de_Bemaraha_Strict_Nature_Reserve"],["UNESCO: suche lasy Andrefana (dawniej Tsingy de Bemaraha)","https://whc.unesco.org/en/list/494/"]],"p":5},{"claim":"Namib: wydmy wyższe od Empire State Building, obszar wielkości Maryland, wnętrza nigdy nie odwiedzono.","verdict":"przesada","note":"Wielkość i wydmy (do ok. 380 m) się zgadzają, ale okolice Sossusvlei to masowa turystyka.","src":[["UNESCO: Morze Piasku Namib","https://whc.unesco.org/en/list/1430/"],["Wikipedia (ang.): pustynia Namib - hasło \"Namib\"","https://en.wikipedia.org/wiki/Namib"]],"p":6},{"claim":"Sandy Island: \"odkrytą\" przez Jamesa Cooka wyspę obalili Australijczycy w 2012.","verdict":"półprawda","note":"W 2012 r. potwierdzono, że wyspy nie ma, ale pierwszy zapis jest z 1876 r., nie od Cooka.","src":[["Wikipedia (ang.): Sandy Island (Nowa Kaledonia) - hasło \"Sandy Island (New Caledonia)\"","https://en.wikipedia.org/wiki/Sandy_Island,_New_Caledonia"]],"p":7},{"claim":"Lądolód pokrywa ok. 80% Grenlandii, a wnętrze północnej Grenlandii jest nietknięte przez człowieka.","verdict":"półprawda","note":"Lądolód pokrywa ok. 80% wyspy, ale w głębi działały stacje wiertnicze i wiele razy go przekraczano.","src":[["Wikipedia (ang.): lądolód grenlandzki - hasło \"Greenland ice sheet\"","https://en.wikipedia.org/wiki/Greenland_ice_sheet"],["Wikipedia (ang.): odwiert lodowy NorthGRIP - hasło \"NorthGRIP\"","https://en.wikipedia.org/wiki/North_Greenland_Ice_Core_Project"]],"p":8},{"claim":"Takla Makan: większa od Wielkiej Brytanii, w środku nie było człowieka, nazwa znaczy \"miejsce bez powrotu\".","verdict":"fałsz","note":"Jest większa od Wielkiej Brytanii, ale biegnie przez nią autostrada, a pogrzebane miasta odkopano 100 lat temu.","src":[["Wikipedia (ang.): pustynia Takla Makan - hasło \"Taklamakan Desert\"","https://en.wikipedia.org/wiki/Taklamakan_Desert"],["Wikipedia (ang.): autostrada przez pustynię Tarym - hasło \"Tarim Desert Highway\"","https://en.wikipedia.org/wiki/Tarim_Desert_Highway"]],"p":9}],"bias":"Tytuł wprowadza w błąd: większość miejsc była odwiedzana; uczciwiej byłoby \"miejsca słabo zbadane\". Transkrypt z Whisper.","channel":"Chill Dude Explains","section":"Chill Dude Explains"},{"id":"tmbZVmXyOXM","title_pl":"Jak działają chłodnie kominowe","title":"Why Are Cooling Towers Shaped Like That?","channel":"Practical Engineering","url":"https://www.youtube.com/watch?v=tmbZVmXyOXM","date":"2024-11-05","duration":1188,"views":9489698,"section":"Ciekawostki","transcript":"youtube","added":"2026-11-03","tags":["Nauka","Technika"],"about":"Practical Engineering buduje model chłodni kominowej i tłumaczy, czemu z komina leci para, a nie dym, i skąd ten kształt.","intro":"Z wielkich, wygiętych kominów elektrowni nie leci dym, tylko para wodna. Grady Hillhouse z Practical Engineering buduje model chłodni z akrylu i tłumaczy chłodzenie przez parowanie, wykres psychrometryczny, ciąg naturalny, zalety hiperboloidy i to, czemu takie wieże słabo sprawdzają się w gorącym klimacie.","points":[{"t":"Para, nie dym","d":"Komin wyprowadza spaliny wysoko, a chłodnia kominowa robi coś zupełnie innego. Kojarzy się z elektrowniami jądrowymi, które niczego nie spalają; pióropusz to głównie skroplona para wodna."},{"t":"Po co chłodzić","d":"Elektrownie cieplne napędzają generatory turbinami parowymi. Para skrapla się w skraplaczu chłodzonym wodą, a ta krąży między skraplaczem a wieżą, gdzie oddaje ciepło powietrzu."},{"t":"Przeciwprąd i parowanie","d":"Gorąca woda jest rozpylana nad wypełnieniem o dużej powierzchni i spływa w dół, a powietrze płynie w górę. Parowanie zabiera ciepło utajone, więc wodę można schłodzić poniżej temperatury powietrza, o ile nie jest ono nasycone."},{"t":"Wilgotne powietrze jest lżejsze","d":"Ciepłe powietrze mieści więcej pary i ma mniejszą gęstość. Co mniej oczywiste, przy tej samej temperaturze wilgotniejsze powietrze też jest lżejsze, bo cząsteczka wody waży mniej niż azotu czy tlenu."},{"t":"Ciąg naturalny","d":"Ogrzane i nawilżone powietrze unosi się w wieży i zasysa świeże przez wloty u dołu. Autora zaskoczyło, jak silny ciąg dało samo rozpylanie gorącej wody w modelu."},{"t":"Hiperboloida","d":"Wygięty kształt to hiperboloida, którą da się zbudować z prostych prętów, co ułatwia budowę. Podwójna krzywizna usztywnia cienką powłokę na ciężar i wiatr, jak chips Pringles, i według autora może o połowę zmniejszyć naprężenia względem walca."},{"t":"Wentylatory zamiast wysokości","d":"Wielkie wieże z ciągiem naturalnym są rzadkie. Szpitale, biurowce, rafinerie i wiele elektrowni używają mniejszych, tańszych chłodni z wentylatorami; wielkie wybiera się dla niezawodności, np. w elektrowniach jądrowych."},{"t":"Wilgotność pomaga ciągowi","d":"Na wykresie psychrometrycznym przy wilgotności 20% powietrze na początku drogi nie zyskuje wyporu i ciąg może zgasnąć. Przy 50% gęstość spada na całej drodze, więc dla danej temperatury termometru mokrego ciąg rośnie z wilgotnością."},{"t":"Teksas chłodzi jeziorami","d":"W gorącym klimacie ciąg naturalny działa słabo. Obie elektrownie jądrowe w Teksasie chłodzą się zbiornikami wodnymi, bo tama i jezioro wyszły taniej niż odpowiednia wieża."},{"t":"Czasem jednak dym","d":"Niektóre nowsze chłodnie wpuszczają do wieży oczyszczone spaliny, więc w pióropuszu może być trochę spalin, ale głównie to woda."}],"conclusion":"Chłodnia kominowa to sprytne połączenie parowania, wyporu i wytrzymałej geometrii, bez ani jednego wentylatora.","factchecks":[{"claim":"Hiperboloidę da się zbudować z prostych elementów.","verdict":"prawda","note":"Hiperboloida jednopowłokowa jest powierzchnią prostokreślną; wykorzystał to m.in. Szuchow.","p":5,"src":[["Wikipedia (ang.): hiperboloida - hasło \"Hyperboloid\"","https://en.wikipedia.org/wiki/Hyperboloid"],["Wikipedia (ang.): konstrukcja hiperboloidalna - hasło \"Hyperboloid structure\"","https://en.wikipedia.org/wiki/Hyperboloid_structure"]]},{"claim":"Wilgotne powietrze jest lżejsze od suchego w tej samej temperaturze.","verdict":"prawda","note":"Masa molowa wody (ok. 18 g/mol) jest mniejsza niż suchego powietrza (ok. 29 g/mol).","p":3,"src":[["Wikipedia (ang.): gęstość powietrza - hasło \"Density of air\"","https://en.wikipedia.org/wiki/Density_of_air"]]},{"claim":"Obie elektrownie jądrowe w Teksasie chłodzą się zbiornikami wodnymi.","verdict":"prawda","note":"Comanche Peak korzysta ze Squaw Creek Reservoir, a South Texas Project ze sztucznego zbiornika chłodzącego.","p":8,"src":[["Wikipedia (ang.): elektrownia Comanche Peak - hasło \"Comanche Peak Nuclear Power Plant\"","https://en.wikipedia.org/wiki/Comanche_Peak_Nuclear_Power_Plant"],["Wikipedia (ang.): South Texas Project - hasło \"South Texas Nuclear Generating Station\"","https://en.wikipedia.org/wiki/South_Texas_Nuclear_Generating_Station"]]},{"claim":"Niektóre chłodnie wyprowadzają także oczyszczone spaliny.","verdict":"prawda","note":"Takie rozwiązanie stosuje się m.in. w niemieckich elektrowniach węglowych z odsiarczaniem.","p":9,"src":[["Wikipedia (ang.): chłodnia kominowa - hasło \"Cooling tower\"","https://en.wikipedia.org/wiki/Cooling_tower"]]}],"bias":"Rzetelny, z modelem i wykresem; transkrypt miejscami nieczytelny. Na końcu reklama serwisu Nebula."},{"id":"GBX3rgsmQbw","title_pl":"Odtwarzam ostatni posiłek Ötziego, człowieka lodu","title":"Recreating the Last Meal of Ötzi the Iceman","channel":"Tasting History with Max Miller","url":"https://www.youtube.com/watch?v=GBX3rgsmQbw","date":"2024-06-04","duration":1321,"views":4185855,"section":"Historia","transcript":"youtube","added":"2026-11-03","tags":["Historia","Nauka"],"about":"Max Miller gotuje ostatni posiłek Ötziego (dziczyzna, koza, samopsza) i opowiada, co nauka wie o jego życiu i śmierci.","intro":"Max Miller z Tasting History odtwarza ostatni posiłek Ötziego, mężczyzny zabitego strzałą w Alpach ponad 5000 lat temu. Wędzi kozinę, piecze jelenia i placek z samopszy, a przy okazji opowiada o odkryciu mumii, jej ubraniu, narzędziach, chorobach i o tym, jak z treści jelit odtworzono ostatnie godziny jego życia.","points":[{"t":"Między rolnikami a łowcami","d":"Ötzi żył przed piramidami i Stonehenge, gdy rolnictwo dotarło już przez Turcję i Bałkany do całej Europy, ale gdzieniegdzie przetrwali łowcy-zbieracze. Jego ostatni posiłek łączył oba światy: dziczyznę i uprawne zboże."},{"t":"Co było w żołądku","d":"Kilka godzin przed śmiercią zjadł jelenia szlachetnego, koziorożca i samopszę, czyli według autora pierwsze uprawiane zboże. Były tam też pyłki, grzyby, mech i odrobina orlicy, paproci leczniczej, ale i trującej; autor użył jadalnych pędów paproci."},{"t":"Gotowanie po neolitycznemu","d":"Kozinę (zamiast koziorożca) wędził na plasterkach przy żarze w ok. 70-77°C przez 6-10 godzin, jelenia piekł na rożnie 5-6 minut. Grubo zmieloną samopszę zmieszał z tłuszczem, wodą i paprocią i upiekł placek na glinianej płycie po ok. 3 minuty z każdej strony."},{"t":"Tłuszcz jako paliwo","d":"Z ok. 300 g zawartości żołądka Ötziego połowę stanowił tłuszcz koziorożca. Ziarna nie były zmielone na mąkę, bo w żołądku znaleziono spore kawałki."},{"t":"Odkrycie w 1991 r.","d":"19 września 1991 r. dwoje niemieckich turystów znalazło ciało na granicy Austrii i Włoch; najpierw myślano o zaginionym turyście lub żołnierzu z I wojny światowej. Okazało się, że mężczyzna żył ok. 3359-3105 r. p.n.e., a lód naturalnie zmumifikował jego i jego rzeczy."},{"t":"Strój i ekwipunek","d":"Miał buty z podeszwą ze skóry niedźwiedzia i jelenia ocieplone trawą, nogawice z łatami futra w naprzemienne kolory, płaszcz z owczej i koziej skóry, pelerynę z trawy i czapkę z niedźwiedziej skóry. Nosił też nóż, zestaw do rozpalania ognia, kołczan 14 strzał i łuk z cisu."},{"t":"Miedziany topór","d":"Wszystkie narzędzia były kamienne, poza toporem z miedzi o czystości 99,7%. Ostrze miało mniej niż 10 cm, ale według autora było bardzo cenne."},{"t":"Zdrowie 45-latka","d":"W wieku 45-46 lat miał chorobę serca, starte zęby, chore dziąsła, zrośnięte żebra, kamień żółciowy, odmrożenia, włosogłówkę i bóle stawów. Jego 61 tatuaży mogło służyć leczeniu bólu, a w sakiewce nosił grzyby i mchy, pewnie jako lekarstwa."},{"t":"Morderstwo odkryte po 10 latach","d":"Miał ranę głowy i głęboko rozciętą dłoń, która zaczęła się goić. Dopiero w 2001 r. odkryto grot strzały w barku, wystrzelonej kilka minut przed śmiercią; motywy zabójstwa pozostają nieznane."},{"t":"Ostatnie godziny z pyłków","d":"Pyłki w jelitach pokazują, że 33 godziny przed śmiercią był w lesie na ok. 2500 m, 24 godziny przed nią niżej, na ok. 1200 m, gdzie zranił dłoń i być może opatrzył ją torfowcem. Potem szybko wspiął się na prawie 3000 m i zjadł ostatni posiłek."},{"t":"Śmierć na przełęczy","d":"1-3 godziny po jedzeniu strzała z grotem ludzi z południa przecięła mu tętnicę podobojczykową. Ktoś wyjął drzewce, grot został, a śnieg i lodowiec zakonserwowały go na 5000 lat."},{"t":"Jak to smakuje","d":"Jeleń był mocno dziki w smaku, wędzona kozina zaskakująco dobra, a placek przypominał autorowi niesłodzony batonik musli. Wniosek: dobrze żyć w czasach z wyborem jedzenia."}],"conclusion":"Z treści żołądka sprzed 5000 lat da się odtworzyć nie tylko posiłek, ale i ostatnie godziny życia człowieka.","factchecks":[{"claim":"Ciało Ötziego znaleźli niemieccy turyści 19 września 1991 r.","verdict":"prawda","note":"Znaleźli je Helmut i Erika Simon na lodowcu Similaun w Alpach Ötztalskich.","p":4,"src":[["Wikipedia (ang.): Ötzi - hasło \"Ötzi\"","https://en.wikipedia.org/wiki/%C3%96tzi"]]},{"claim":"Ötzi żył ok. 3359-3105 r. p.n.e.","verdict":"prawda","note":"Datowanie radiowęglowe daje 3350-3105 r. p.n.e.; różnica w pierwszej dacie to drobny błąd.","p":4,"src":[["Wikipedia (ang.): Ötzi - hasło \"Ötzi\"","https://en.wikipedia.org/wiki/%C3%96tzi"]]},{"claim":"Połowę zawartości żołądka stanowił tłuszcz koziorożca.","verdict":"prawda","note":"Analiza z 2018 r. wykazała 46% tłuszczu oraz mięso koziorożca, jelenia i samopszę.","p":[1,3],"src":[["Current Biology: ostatni posiłek Ötziego (Maixner i in., 2018)","https://doi.org/10.1016/j.cub.2018.05.067"]]},{"claim":"Samopsza to pierwsze uprawiane zboże, niezmienione od 12 tys. lat.","verdict":"półprawda","note":"To jedno z najwcześniej udomowionych zbóż (ok. 10-11 tys. lat temu), obok płaskurki i jęczmienia.","p":1,"src":[["Wikipedia (ang.): pszenica samopsza - hasło \"Einkorn wheat\"","https://en.wikipedia.org/wiki/Einkorn_wheat"]]},{"claim":"Topór Ötziego był z miedzi o czystości 99,7%, a ciało miało 61 tatuaży.","verdict":"prawda","note":"Oba fakty potwierdzają badania; tatuaże to linie i krzyżyki głównie przy stawach.","p":[6,7],"src":[["Wikipedia (ang.): Ötzi - hasło \"Ötzi\"","https://en.wikipedia.org/wiki/%C3%96tzi"],["Muzeum Archeolog
